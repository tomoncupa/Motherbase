<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes the notch and the home indicator
     measurable. mobile.js adds it if you forget, but put it here anyway. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ①  Name it. This shows in the browser tab. -->
<title>NEW APP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ②  The shared foundation. Never edit these — every app uses the same ones.
        mobile.js goes before ui.js: it owns the sheet, the button and the
        press states, and ui.js checks whether it is there.

        The ?v= is cache busting. Bump it when a shared file changes, or the
        browser will happily serve you last week's copy and there is no way to
        tell by looking.

        shared/THEMING.md is the contract this app is obeying: what every
        token is for, what an app may never do, and how to prove it obeyed. -->
<script src="../shared/skins.js?v=15"></script>
<script src="../shared/day.js?v=15"></script>
<script src="../shared/records.js?v=15"></script>
<script src="../shared/mobile.js?v=15"></script>
<script src="../shared/sound.js?v=15"></script>
<script src="../shared/ui.js?v=15"></script>
<script src="../shared/io.js?v=15"></script>
<script src="../shared/health.js?v=15"></script>
<script src="../shared/icons.js?v=15"></script>

<style>
/* ③  Your app's own layout.

      Two rules, and they are the whole style guide:

      • Colours come from the tokens, never from a hex code. That is what lets
        one app be Ice while another is Doodle.
      • Sizes come from the tokens too — var(--s-4), var(--f-3). The scale was
        picked so no two steps are within about 25% of each other, which is
        what stops you agonising over 13px versus 14px. If you find yourself
        typing a number, check whether a step already says it.          */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}

/* The bar sits under the status bar, not behind it. --safe-t is the notch. */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);
  /* Two background colours already separate the bar from the page, so it
     does not also need a border. Fewer borders, says Refactoring UI, and it
     is right — a line here would be one separator too many. */
  box-shadow:var(--e-1),var(--rim);
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}

/* The only scrolling surface. .mb-scroll gives it momentum and stops its
   scroll escaping into the page behind it. The bottom padding is the FAB
   plus the home indicator, so the last row is never underneath either. */
main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-9) + var(--safe-b))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-3)}

.card{border-radius:var(--radius-lg);background:var(--surface-1);
  padding:var(--s-4);box-shadow:var(--e-1),var(--rim)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-3)}

/* The gap lives on the list, never as a margin on the row: a row gets
   wrapped for the swipe gesture, and a margin inside that wrapper measures
   wrong. */
.list{display:flex;flex-direction:column;gap:var(--s-2)}
/* A row is a card on a card: one background colour lighter, no border. */
.item{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3);
  min-height:var(--tap);border-radius:var(--radius-md);background:var(--surface-2)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Done is said by colour and a line, not by shrinking the text. */
.item.on .nm{text-decoration:line-through;color:var(--text-muted)}

.chk{width:28px;height:28px;flex:0 0 auto;padding:0;cursor:pointer;
  border:2px solid var(--border-strong);border-radius:50%;
  background:none;color:transparent;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background-color var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.chk.on{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}

.empty{color:var(--text-muted);line-height:var(--lh-body)}

/* The one big obvious action, above the home indicator and inside the
   thumb's reach. --e-3 puts it clearly above the page rather than on it. */
#fab{position:fixed;right:var(--s-4);bottom:calc(var(--s-4) + var(--safe-b));z-index:40;
  width:58px;height:58px;border:0;border-radius:50%;cursor:pointer;
  background:var(--accent);color:var(--accent-fg);font-size:28px;line-height:1;
  box-shadow:var(--e-3);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header>
  <!-- ④  Your app's name again, for the header -->
  <div class="logo">NEW<b>APP</b></div>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" onclick="UI.settings(APP.id)">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>
<main class="mb-scroll"><div class="wrap" id="main"></div></main>
<button id="fab" class="mb-press mb-tap" aria-label="Add">+</button>

<script>
/* ══════════════════ ⑤ THE ONLY BLOCK YOU CHANGE ══════════════════
   Everything above is the same in every app. This is your app.        */

const APP = {
  id: 'newapp',                 // one lowercase word, no spaces. Must be unique.
  name: 'New App',              // how it appears in menus and backups
  icon: '✦',
  blurb: 'what this app is for, in a few words',
  types: ['thing'],             // the kinds of row THIS app owns and nobody else writes
};

/* Tell the suite who we are. This is what makes settings, backups, exports,
   sounds and themes all work without another line of code. */
/* Anything in the markup carrying data-icon gets its drawing here, and again
   after a theme lands, because the stroke recipe belongs to the theme: a pixel
   theme wants a squared cap and a hand-drawn one wants a wobble, and those are
   different paths rather than a different colour. */
Skins.load('../shared/skins.json?v=13').then(() => { Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
IO.register({ app: APP.id, name: APP.name, types: APP.types });

/* ---- your data ----
   Rec.set(type, date, key, payload)   write one fact
   Rec.get(type, date, key)            read it back
   Rec.map(type)                       everything of a type, as key → payload
   Rec.del(type, date, key)            remove it
   Day.today()                         today, as a plain calendar date        */

const things = () => Rec.map('thing');
/* The clock alone is not a unique key. Two things added in the same
   millisecond get the same id, which means the same row, which means the
   second one silently replaces the first. Ask how it went the first time.

   The counter makes that impossible within a session. The random tail is for
   two devices writing in the same millisecond — they both carry user_id
   'local', so without it a merge could fuse two different rows into one. */
let seq = 0;
const newId = () => Rec.USER + '-' + Date.now().toString(36) + '-' +
  (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
const addThing = name => Rec.set('thing', null, newId(), { name: name });

/* ---- ticking something off ----
   A tick is shared. Tick it here and BLOCK, the home screen and every other
   app see it immediately, because they all read the same row.               */
const tickId = name => name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-');
function toggle(name) {
  const id = tickId(name), on = Rec.has('tick', Day.today(), id);
  Rec.set('activity', null, id, { name: name });            // so other apps know its proper name
  if (on) { Rec.del('tick', Day.today(), id); Mobile.feedback('untick'); }
  else { Rec.set('tick', Day.today(), id, { src: APP.id }); Mobile.feedback('success'); }
}

/* ---- deleting ----
   Never without a way back. The snackbar holds the row for six seconds and
   puts it straight back if he presses UNDO.                                 */
function remove(key, thing) {
  Rec.del('thing', null, key);
  Mobile.haptic('warn');
  UI.undo('deleted <b>' + UI.esc(thing.name) + '</b>', () => Rec.set('thing', null, key, thing));
}

/* ---- drawing the screen ---- */
function draw() {
  const m = document.getElementById('main');
  m.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h2>TODAY · ' + Day.label(Day.today()).toUpperCase() + '</h2>';

  const listBox = document.createElement('div');
  listBox.className = 'list';
  const list = Object.entries(things());
  if (!list.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    /* An empty state is the first thing a new user sees, so it says what to
       do rather than that there is nothing here. */
    p.innerHTML = 'Nothing here yet. Press <b>+</b> and it appears — and anything you tick shows up in every other app too.';
    card.appendChild(p);
  }
  list.forEach(([key, t]) => {
    const on = Rec.has('tick', Day.today(), tickId(t.name));
    const row = document.createElement('div');
    row.className = 'item' + (on ? ' on' : '');
    row.innerHTML = '<span class="nm">' + UI.esc(t.name) + '</span>';

    const b = document.createElement('button');
    b.className = 'chk mb-press mb-tap' + (on ? ' on' : '');
    b.textContent = '✓';
    b.setAttribute('aria-label', (on ? 'Untick ' : 'Tick ') + t.name);
    /* The state flips here, before the store is even asked. The row must
       answer the finger in the same frame it was touched; Rec.on redraws a
       moment later and agrees with what is already on screen. */
    b.onclick = () => { b.classList.toggle('on'); row.classList.toggle('on'); toggle(t.name); };
    row.appendChild(b);

    /* Swipe it left to delete it, the way a phone list works. The gesture
       needs its own wrapper: it moves the row inside one and slides it. */
    const slot = document.createElement('div');
    slot.appendChild(row);
    listBox.appendChild(slot);
    Mobile.swipe(slot, { right: { label: 'DELETE', fn: () => remove(key, t) } });
  });

  card.appendChild(listBox);
  m.appendChild(card);
}

/* ---- adding ----
   A bottom sheet, not a dialog in the middle of the screen: it comes up from
   where the thumb already is, and it can be thrown away downwards. focus:true
   asks for the keyboard, which is right for a sheet whose only job is one
   field — and wrong for almost anything else.                               */
document.getElementById('fab').onclick = () => {
  Mobile.feedback('open');
  UI.dialog({
    title: 'ADD', width: 420, focus: true,
    body: (b, h) => {
      const i = UI.field('name', { placeholder: 'Morning run' });
      b.appendChild(i);
      /* Enter on the last field means Done, and closes the keyboard. */
      Mobile.form(b, () => { save(h, i); });
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'ADD', kind: 'go', fn: h => { save(h, h.body.querySelector('input')); return false; } },
    ],
  });
};
function save(h, i) {
  const v = (i.value || '').trim();
  if (!v) { i.focus(); return; }
  addThing(v);
  Mobile.feedback('success');
  h.close();
  UI.toast('added <b>' + UI.esc(v) + '</b>');
}

/* Redraw whenever anything changes — including changes made in another app or
   another tab. You never have to refresh. */
Rec.on(draw);
Day.on(draw);
draw();
</script>
</body>
</html>
