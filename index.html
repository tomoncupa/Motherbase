  links: {
    /* ══════════════ LINKS ══════════════
       Tom, 2026-09-17: "Create a TOM ONLY Widget of all the app links, both
       for me and for clients."

       Every app's address on the web, in two groups: the full suite, which is
       his, and the client suite, which is the seven apps a client gets.
       Tapping one copies it, because the job this does is handing a link to
       somebody — a client in Skool, or himself on another machine. The button
       beside it opens it in a new tab, for when the job is looking rather
       than sending.

       It is not called TOM ONLY and nothing on it says so. That follows the
       dock, where his own apps sit behind a thin line with no label and no
       tooltip — Tom, 2026-09-14: "I don't want a Tom Only... I know who I
       am." What makes it his is that `DROP_WIDGETS` in tools/build-client.py
       takes it out of the client copy altogether, so a client never gets a
       screen listing apps they do not have and addresses that are not theirs.

       This comment sits INSIDE the object on purpose. DROP_WIDGETS matches
       from `  links: {` to the first `  },`, so anything written above the
       widget would survive into the client build with the widget itself gone
       — which for this one would mean shipping the reasoning for hiding it.

       The two lists are read off the APPS roster rather than typed out, so an
       app added later appears in both without anybody remembering this file,
       and an app flagged `mine` is in his list and not in the client one by
       the same flag the dock already uses. The folder name comes off
       `a.file`, so nothing here writes a path the client build has to patch.

       The addresses are the one thing written down. They are two published
       sites and both were checked live on 2026-09-17. Deriving them from
       `location` would be wrong: the point of this widget is the address you
       give somebody else, which has nothing to do with where this page
       happens to be open from. */
    nm: 'LINKS', w: 5, h: 6, fit: 1,
    sub: () => 'tap a link to copy it',
    parts: [['MINE', 'Mine'], ['CLIENTS', 'Clients'], ['addr', 'Addresses']],
    sites: [
      { nm: 'MINE', base: 'https://tomoncupa.github.io/Motherbase/', all: () => APPS.filter(a => a.file) },
      { nm: 'CLIENTS', base: 'https://tomoncupa.github.io/Mainmenu-client/', all: () => APPS.filter(a => a.file && !a.mine) },
    ],
    /* Copied, or shown so it can be copied by hand. A page opened straight
       from a folder has no clipboard in some browsers, and an address nobody
       can get at is the one failure this widget is not allowed to have. */
    copy(url, label) {
      const done = () => toast('<b>' + esc(label) + '</b> copied');
      const byHand = () => {
        try {
          const t = document.createElement('textarea');
          t.value = url;
          t.setAttribute('readonly', '');
          t.style.position = 'fixed';
          t.style.top = '-1000px';
          document.body.appendChild(t);
          t.select();
          const ok = document.execCommand('copy');
          t.remove();
          if (ok) { done(); return; }
        } catch (e) {}
        toast(esc(url), { ms: 8000 });
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, byHand);
      else byHand();
    },
    /* Tom, 2026-09-23: "Update the link widget to always force new copies."
       Every address handed out carries ?fresh=1, which tells sw.js to fetch
       that open from the network instead of the phone's kept copy. The page
       takes it off its own address bar once open (shared/mobile.js), so a
       home-screen shortcut saved from it is the plain address. */
    fresh: url => url + (url.indexOf('?') < 0 ? '?' : '&') + 'fresh=1',
    row(list, label, url, tint, icon, tail) {
      url = WIDGETS.links.fresh(url);
      const r = el('div', 'row');
      if (tint) r.style.setProperty('--c', tint);
      r.style.cursor = 'pointer';
      r.setAttribute('role', 'button');
      r.tabIndex = 0;
      r.title = url;
      r.innerHTML = (icon ? '<span class="lic">' + icon + '</span>' : '') +
        '<span class="n">' + esc(label) + '</span>' +
        (tail ? '<span class="d">' + esc(tail) + '</span>' : '');
      const copy = () => WIDGETS.links.copy(url, label);
      r.onclick = copy;
      r.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); copy(); } };
      const open = el('button', 'lopen mb-press mb-tap',
        (typeof Icons !== 'undefined' && Icons.svg('link', { size: 14 })) || '&rarr;');
      open.title = 'Open ' + label + ' in a new tab';
      open.setAttribute('aria-label', 'Open ' + label + ' in a new tab');
      open.onclick = ev => { ev.stopPropagation(); window.open(url, '_blank', 'noopener'); };
      r.appendChild(open);
      list.appendChild(r);
      return r;
    },
    draw(body, cfg) {
      const L = WIDGETS.links, list = el('div', 'rowlist'), addr = partOn(cfg, 'addr');
      L.sites.filter(site => partOn(cfg, site.nm)).forEach(site => {
        /* The address goes on the heading, not on the row under it. It was on
           the row first, and at phone width it squeezed "The whole suite"
           down to an ellipsis: the tail is fixed width and the name is what

  /* ── STATUS ── */
  /* any measure STATUS keeps, picked from the widget's own menu, so mood,
     energy, steps or water each get a chart the way WEIGHT and SLEEP do */
  measure: {
    nm: 'MEASURE', w: 5, h: 3, app: 'status', to: ['status', 'trends'],
    days: [[7, '7 days'], [14, '14 days'], [30, '30 days'], [90, '90 days'], [180, '180 days'], [365, 'a year']], day0: 30,
    field(cfg) {
      const F = Rec.map('field') || {};
      /* a done-or-not field ("Trained") has no line to draw, so it is not offered */
      const ids = Object.keys(F).filter(k => F[k] && F[k].on !== 0 && F[k].measure !== 'check');
      const id = cfg && cfg.f && F[cfg.f] && F[cfg.f].measure !== 'check' ? cfg.f : (F.mood && F.mood.measure !== 'check' ? 'mood' : ids[0]);
      return id ? Object.assign({ id: id }, F[id]) : null;
    },
    series(cfg) {
      const f = WIDGETS.measure.field(cfg), days = (cfg && cfg.days) || 30, out = [];
      if (!f) return out;
      for (let i = days - 1; i >= 0; i--) {
        const d = LifeOS.shift(LifeOS.day(), -i), v = evValue(d, f.id);
        if (v != null && isFinite(v)) out.push({ d: d, v: Number(v) });
      }
      return out;
    },
    nmFor: cfg => {
      const f = WIDGETS.measure.field(cfg);
      const span = (WIDGETS.measure.days.filter(d => d[0] === ((cfg && cfg.days) || 30))[0] || [0, ''])[1];
      return (f ? String(f.label || f.id).toUpperCase() : 'MEASURE') + ' \u00b7 ' + span;
    },
    sub: cfg => {
      const f = WIDGETS.measure.field(cfg), pts = WIDGETS.measure.series(cfg);
      if (!f) return 'STATUS has no measures yet';
      if (!pts.length) return 'nothing logged in this stretch';
      const last = pts[pts.length - 1], mean = pts.reduce((a, p) => a + p.v, 0) / pts.length;
      const dp = f.dec != null ? f.dec : 1, u = f.unit ? ' ' + f.unit : '';
      return +last.v.toFixed(dp) + u + (last.d === LifeOS.day() ? ' today' : ', ' + Day.label(last.d)) +
        ' \u00b7 average ' + +mean.toFixed(dp) + ' over ' + pts.length + ' day' + (pts.length === 1 ? '' : 's');
    },
    menu(cfg, redraw) {
      const F = Rec.map('field') || {}, cur = WIDGETS.measure.field(cfg);
      const ids = Object.keys(F).filter(k => F[k] && F[k].on !== 0 && F[k].measure !== 'check')
        .sort((a, b) => (F[a].order || 99) - (F[b].order || 99));
      return ids.length ? ['-', { label: 'Measure', sub: ids.map(k => ({
        label: F[k].label || k, check: cur && cur.id === k, fn: () => { cfg.f = k; redraw(); } })) }] : [];
    },
    draw(body, cfg) {
      const f = WIDGETS.measure.field(cfg), pts = WIDGETS.measure.series(cfg);
      if (!f) { body.appendChild(el('div', 'empty', 'No measures in STATUS')); return; }
      if (!pts.length) { body.appendChild(el('div', 'empty', 'No ' + esc(String(f.label || f.id).toLowerCase()) + ' in this stretch. ' + (FINE ? 'Right click' : 'Hold') + ' for another measure or range.')); return; }
      const dp = f.dec != null ? f.dec : 1;
      const subOf = () => { const w = body.closest('.w'); return w && w.querySelector('.w-head .sub'); };
      let kept = null;
      const box = el('div', 'fits');
      body.appendChild(box);
      const line = pts.map(p => [p.d, p.v]), days = (cfg && cfg.days) || 30;
      Chart.mount(box, { label: (f.label || f.id) + ', ' + pts.length + ' readings' }, c => {
        c.xTime(LifeOS.shift(LifeOS.day(), -(days - 1)), LifeOS.day());
        /* a 1-to-5 scale on its own scale, and a count from zero: mood on a
           3-to-5 floor and steps on a 4,000 floor looked like crashes */
        c.yFit(pts.map(p => p.v), f.measure === 'scale' ? { min: 1, max: 5 } : (f.measure === 'amount' || f.agg === 'sum' || (f.target && f.dir === 'gte')) ? { min: 0 } : undefined);
        c.grid();
        c.timeAxis();
        if (line.length > 1) { c.area(line); c.line(line); } else c.dots(line);
        c.end(line[line.length - 1], String(+pts[pts.length - 1].v.toFixed(dp)));
        c.scrub(line, {
          onMove: p => { const s = subOf(); if (!s) return; if (kept == null) kept = s.textContent; s.textContent = +Number(p[1]).toFixed(dp) + (f.unit ? ' ' + f.unit : '') + ', ' + Day.label(p[0]); },
          onLeave: () => { const s = subOf(); if (s && kept != null) s.textContent = kept; kept = null; },
        });
      });
    },
  },

  /* ══════════════ HALF-LIFE ══════════════
     How much of a dose is still in the body, from the bullets he writes:
     every dose times 0.5 to the power of hours since over the half-life,
     summed. What is tracked is his, never this file's: each one is its own
     setting row, `lifeos.halflife.<id>` = {name, match, per, unit, half,
     bare, ord}. `match` is the words a dose starts with, comma separated; a
     name of one or two letters must start the line and is case-sensitive
     ("A2"), a longer one may sit anywhere as a whole word. The number
     after it times `per` is the amount; no number counts as `bare` units,
     or not at all when `bare` is blank. Entries, events and done todos
     count; open todos, ideas and cancelled lines do not. A tracker may also
     name `field`, a STATUS measure: every reading of it counts as a dose
     at its own time, and so does the food behind it when the measure reads
     one (`from`, caffeine off a meal), the way STATUS's `entries` adds
     `fromFood`. Copy of that rule: change both.
     STORES (Tom, 2026-10-27, for creatine: "build a muscle-stores view
     instead of a half-life"). A tracker with `kind: 'store'` is not a sum of
     halvings: it is the extra held over the body's own level, which fills
     until it is full and drains slowly. Each dose adds dose x STORE_TAKE,
     and what would pass `cap` is not kept; between doses the extra halves
     every `half` hours. It reads as % full, 0 being the body's own level and
     100 `cap` over it, and SATURATED from STORE_SAT up, the question a
     store is read for. A taper (keep less the fuller it is) was tried first and read 75% on a
     steady 5 g a day, which the studies call full.
     `cap` (default 30 g over a baseline of about 120 g), STORE_TAKE and the
     three-week drain are guesses from the loading studies, labelled so on the
     card's dialog; Tom can change cap and drain there. */
  halflife: {
    nm: 'HALF-LIFE', w: 5, h: 6, app: 'status', fit: 1, to: ['status'],
    days: [[3, '3 days'], [7, '7 days'], [14, '14 days'], [30, '30 days']], day0: 7,
    list: () => Rec.all('setting').filter(r => r.key.indexOf('lifeos.halflife.') === 0 && r.payload && r.payload.v && r.payload.v.name)
      .map(r => Object.assign({}, r.payload.v, { key: r.key.slice(7) })).sort((a, b) => (a.ord || 0) - (b.ord || 0)),
    shown: cfg => WIDGETS.halflife.list().filter(x => !(cfg && cfg.hid && cfg.hid.indexOf(x.key) > -1)),
    /* every dose of one tracker, as [ms, amount], oldest first */
    doses(x) {
      /* "word=amount": that word always counts as that amount in the unit,
         whatever number sits after it, and once a day however many lines say it.
         "!words": a line holding those words is not a dose of this one */
      const parts = String(x.match || '').split(',').map(s => s.trim()).filter(Boolean);
      const skip = parts.filter(s => s[0] === '!').map(s => s.slice(1).trim().toLowerCase()).filter(Boolean);
      const names = parts.filter(s => s[0] !== '!')
        .map(s => { const i = s.indexOf('='), a = i > 0 ? Number(s.slice(i + 1)) : NaN; return i > 0 && a > 0 ? [s.slice(0, i).trim(), a] : [s, null]; })
        .filter(n => n[0]);
      const fixed = names.map(n => n[1]);
      const num = '\\s*(\\d+(?:\\.\\d+)?)?';
      const res = names.map(([n]) => {
        const q = n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return n.length <= 2 ? new RegExp('^' + q + '(?![\\p{L}])' + num, 'u') : new RegExp('(?:^|[^\\p{L}\\d])' + q + '(?![\\p{L}])' + num, 'iu');
      });
      const per = Number(x.per) || 1, bare = x.bare === '' || x.bare == null ? null : Number(x.bare), out = [], once = {};
      /* a time written on another day than the row's is a backfill: it counts at that day's noon */
      const onDay = (t, date) => {
        if (!date) return t;
        const w = new Date(t), wd = w.getFullYear() + '-' + zpad(w.getMonth() + 1) + '-' + zpad(w.getDate());
        return wd === date ? t : new Date(date + 'T12:00:00').getTime();
      };
      if (x.field) {
        const F = (Rec.map('field') || {})[x.field] || {}, fp = F.per == null ? 1 : (Number(F.per) || 0);
        Rec.all('ev').forEach(r => {
          if (r.key !== x.field) return;
          ((r.payload && r.payload.e) || []).forEach(e => { const v = Number(e.v); if (e.t && v > 0) out.push([onDay(e.t, r.date), v * per]); });
        });
        if (F.from) Rec.all('meal').forEach(r => { const m = r.payload || {}, v = (parseFloat(m[F.from]) || 0) * fp; if (m.t && v > 0) out.push([m.t, v * per]); });
      }
      if (res.length) noteRows().forEach(r => {
        const p = r.payload || {};
        if (typeof p.text !== 'string' || p.cancelled || p.kind === 'idea' || (p.kind === 'todo' && !p.done)) return;
        const text = p.text.trim();
        if (skip.length && skip.some(w => text.toLowerCase().indexOf(w) > -1)) return;
        let m = null, i = 0;
        for (; i < res.length && !m; i++) m = text.match(res[i]);
        if (!m) return;
        const amt = fixed[i - 1] != null ? fixed[i - 1] : (m[1] != null ? Number(m[1]) : bare) * per;
        if (amt == null || !isFinite(amt) || amt <= 0) return;
        if (fixed[i - 1] != null) { if (once[i + '|' + r.date]) return; once[i + '|' + r.date] = 1; }
        /* the time typed on the line, else when it was written, else noon */
        let ms = null;
        const at = /^(\d{1,2}):(\d\d)/.exec(p.at || '');
        if (r.date && at) ms = new Date(r.date + 'T' + zpad(+at[1]) + ':' + at[2] + ':00').getTime();
        else if (p.t) ms = onDay(p.t, r.date);
        else if (r.date) ms = new Date(r.date + 'T12:00:00').getTime();
        if (ms != null && isFinite(ms)) out.push([ms, amt]);
      });
      return out.sort((a, b) => a[0] - b[0]);
    },
    left: (doses, half, at) => doses.reduce((s, d) => d[0] <= at ? s + d[1] * Math.pow(0.5, (at - d[0]) / 3600000 / half) : s, 0),
    /* the extra held in a store at `at`, doses oldest first */
    store(doses, half, cap, at) {
      let e = 0, was = null;
      for (let i = 0; i < doses.length && doses[i][0] <= at; i++) {
        if (was != null) e *= Math.pow(0.5, (doses[i][0] - was) / 3600000 / half);
        e = Math.min(cap, e + doses[i][1] * STORE_TAKE);
        was = doses[i][0];
      }
      return was == null ? 0 : e * Math.pow(0.5, (at - was) / 3600000 / half);
    },
    sub: cfg => {
      const L = WIDGETS.halflife.list();
      return L.length ? '' : 'nothing tracked';
    },

          f.kind.onchange = () => { showCap(); if (f.kind.value === 'store' && !f.half.value.trim()) f.half.value = '21 days'; };
          /* a STATUS measure that holds amounts; a done-or-not or a 1-to-5 has no dose in it */

            .sort((a, c) => (F[a].order || 99) - (F[c].order || 99))

          b.appendChild(UI.row('Written as', 'The words a dose starts with, comma separated. One or two letters must start the line. A word with =amount after it, such as pill=50, always counts that much; !words skips any line holding them.', f.match));
          b.appendChild(UI.row('Each 1 is', 'What the number after it is worth.', f.per));
          b.appendChild(UI.row('Unit', 'Shown after the amount.', f.unit));
          b.appendChild(UI.row('Counts as', 'A store fills up with each dose and drains slowly, like creatine in muscle.', f.kind));
          b.appendChild(capRow); showCap();
          b.appendChild(UI.row('Half-life', 'Hours or days, such as 9 hours or 4.5 days. For a store, how fast the extra drains: a guess of 21 days for creatine.', f.half));
          b.appendChild(UI.row('No number', 'How many a line without a number counts as. Blank skips it.', f.bare));

        },

          const v = k => String(f[k].value || '').trim();
          const hm = /^(\d+(?:\.\d+)?)\s*(d|days?|h|hrs?|hours?)?$/i.exec(v('half'));
          const half = hm ? Number(hm[1]) * (/^d/i.test(hm[2] || '') ? 24 : 1) : 0;

          Rec.setting('lifeos', id, Object.assign({}, was, { name: v('name'), field: v('field'), match: v('match'), per: per, unit: v('unit'), half: half, bare: bare === '' ? '' : Number(bare), kind: f.kind.value, cap: Number(v('cap')) || 30 }));

    menu(cfg, redraw) {
      const L = WIDGETS.halflife.list(), hid = (cfg && cfg.hid) || [];
      const out = ['-', { label: 'Track a dose', fn: () => WIDGETS.halflife.edit() }];
      if (L.length) {
        out.push({ label: 'Show', sub: L.map(x => ({ label: x.name, check: hid.indexOf(x.key) < 0, fn: () => {
          const h = (cfg.hid || []).slice(), i = h.indexOf(x.key);
          if (i > -1) h.splice(i, 1); else if (L.length - h.length > 1) h.push(x.key);
          cfg.hid = h; redraw();
        } })) });
        out.push({ label: 'Edit', sub: L.map(x => ({ label: x.name, fn: () => WIDGETS.halflife.edit(x) })) });
      }
      return out;
    },
    draw(body, cfg) {
      cfg = cfg || {};
      const H = WIDGETS.halflife, L = H.shown(cfg);
      if (!H.list().length) {
        body.appendChild(el('div', 'empty', 'Nothing tracked yet.'));
        const bar = el('div', 'tbar');
        bar.appendChild(tbtn('+ TRACK A DOSE', () => H.edit(), 'go'));
        body.appendChild(bar);
        return;
      }
      body.style.gap = '0';
      const days = cfg.days || 7, now = Date.now(), DAY = 86400000;
      const t0 = new Date(LifeOS.shift(LifeOS.day(), -(days - 1)) + 'T00:00:00').getTime();
      const step = (days <= 7 ? 1 : days <= 14 ? 2 : 4) * 3600000;
      const amt = v => v >= 10 ? Math.round(v).toLocaleString() : v >= 1 ? +v.toFixed(1) + '' : v >= 0.05 ? +v.toFixed(2) + '' : '0';
      const when = ms => {
        const d = new Date(ms), ds = d.getFullYear() + '-' + zpad(d.getMonth() + 1) + '-' + zpad(d.getDate());
        const h = d.getHours(), hm = (h % 12 || 12) + (d.getMinutes() ? ':' + zpad(d.getMinutes()) : '') + (h < 12 ? 'am' : 'pm');
        return (ds === LifeOS.day() ? 'today' : Day.short(ds)) + ' ' + hm;
      };
      L.forEach((x, i) => {
        const doses = H.doses(x), half = Number(x.half) || 1, st = x.kind === 'store', cap = Number(x.cap) || 30;
        const u = st ? '%' : x.unit || '';
        const val = ms => st ? Math.min(100, 100 * H.store(doses, half, cap, ms) / cap) : H.left(doses, half, ms);
        const pts = [];
        const at = ms => { const v = val(ms); pts.push([(ms - t0) / DAY, v, (st ? Math.round(v) + '% full' : amt(v) + ' ' + u) + ' · ' + when(ms)]); };
        /* a point every few hours, and one either side of each dose so the
           rise is a step, not a slope */
        const inside = doses.filter(d => d[0] > t0 && d[0] <= now).map(d => d[0]);
        let k = 0;
        for (let ms = t0; ms < now; ms += step) {
          while (k < inside.length && inside[k] <= ms) { at(inside[k] - 1); at(inside[k]); k++; }
          at(ms);
        }
        while (k < inside.length) { at(inside[k] - 1); at(inside[k]); k++; }
        at(now);
        const cur = pts[pts.length - 1][1], last = doses.filter(d => d[0] <= now).pop();
        const strip = el('div', 'strip');
        strip.style.cssText = 'flex:1 1 0;min-height:112px;display:flex;flex-direction:column;min-width:0';
        const sat = v => st && v >= STORE_SAT * 100;
        /* a reading names the last dose before its own moment, not today's */
        const sayAt = (v, ms) => {
          const was = ms == null ? last : doses.filter(d => d[0] <= ms).pop();
          return (sat(v) ? 'Saturated, ' : st && was ? 'about ' + amt(v * cap / 100) + ' ' + (x.unit || '') + ' over your own level, ' : '') +
            (was ? 'last dose ' + when(was[0]) : 'no doses written yet');
        };
        /* now, a saturated store also says how long it stays so with no dose */
        const dayOf = ms => { const d = new Date(ms); return d.getFullYear() + '-' + zpad(d.getMonth() + 1) + '-' + zpad(d.getDate()); };
        const satTill = sat(cur) ? now + half * 3600000 * Math.log2(cur / (STORE_SAT * 100)) : 0;
        const said = satTill ? 'Saturated until ' + Day.short(dayOf(satTill)) + ' with no dose, last dose ' + when(last[0]) : sayAt(cur);
        const shown = v => st ? String(Math.round(v)) : amt(v);
        const head = Chart.header({ size: 'sm', label: x.name, value: shown(cur), unit: st ? '% full' : u, when: 'now', sub: said });
        strip.appendChild(head.el);
        const box = el('div', 'fits');
        box.style.cssText = 'flex:1 1 auto;min-height:72px';
        strip.appendChild(box);
        body.appendChild(strip);
        if (!doses.length) return;
        const lastStrip = i === L.length - 1, span = (now - t0) / DAY;
        Chart.mount(box, { pad: { l: 46, r: 12, t: 8, b: lastStrip ? 22 : 6 }, label: x.name + ', ' + days + ' days' }, c => {
          c.xLinear(0, span);
          if (st) c.ySet(0, 100, 50); else c.yFit(pts.map(p => p[1]), { min: 0, lines: 2 });
          c.grid();
          /* the days along the bottom: a linear axis has no dates of its own */
          if (lastStrip) {
            const every = [1, 2, 3, 7].filter(n => days / n <= Math.max(2, Math.floor((c.W - c.P.l - c.P.r) / 64)))[0] || 7;
            for (let n = 0; n < days; n += every) {
              const t = c.add('text', { x: c.X(n), y: c.H - 6, 'text-anchor': n ? 'middle' : 'start' }, 'mb-lab');
              t.textContent = n === days - 1 ? 'today' : Day.short(LifeOS.shift(LifeOS.day(), -(days - 1 - n)));
            }
          }
          c.area(pts); c.line(pts);
          c.dots(pts.filter((p, j) => j && pts[j - 1][0] === p[0] - 1 / DAY));
          c.end(pts[pts.length - 1], shown(cur));
          c.scrub(pts, { onMove: p => head.set(shown(p[1]), sayAt(p[1], t0 + p[0] * DAY), when(t0 + p[0] * DAY)), onLeave: head.reset });
        });
      });
    },
  },

  intervals: {
    nm: 'INTERVALS', w: 3, h: 3, fit: 1, grp: 'DESK',
    /* not `presets`: that name is the picker's, for ready-made copies of a widget */
    kinds: [['Tabata, 20 on 10 off \u00d7 8', 20, 10, 8], ['40 on 20 off \u00d7 8', 40, 20, 8],
      ['30 on 30 off \u00d7 10', 30, 30, 10], ['EMOM, a minute each \u00d7 10', 60, 0, 10]],
    sub: cfg => { const c = ivCfg(cfg); return c.work + 's on' + (c.rest ? ', ' + c.rest + 's off' : '') + ' \u00d7 ' + c.rounds; },
    parts: [['phase', 'Work or rest'], ['info', 'Rounds and time to go']],
    menu(cfg, redraw) {
      return ['-', { label: 'Presets', sub: WIDGETS.intervals.kinds.map(p => ({
        label: p[0], check: ivCfg(cfg).work === p[1] && ivCfg(cfg).rest === p[2] && ivCfg(cfg).rounds === p[3],
        fn: () => { cfg.work = p[1]; cfg.rest = p[2]; cfg.rounds = p[3]; redraw(); } })) }];
    },
    draw(body, cfg) {
      const s = toolOf(cfg, ivTool);
      s.cfg = cfg;
      const phase = el('div', 'tphase'), face = el('div', 'tface'), info = el('div', 'tsub'), bar = el('div', 'tbar');
      const show = now => {
        const w = s.where(now || Date.now()), fresh = !s.t0 && !s.acc;
        const c = ivCfg(cfg);
        if (fresh || w.done) {
          phase.textContent = 'READY'; phase.className = 'tphase';
          dg(face, mmss(c.work)); face.classList.add('idle');
          info.textContent = c.rounds + ' rounds \u00b7 ' + mmss(c.rounds * c.work + (c.rounds - 1) * c.rest) + ' in all';
          return;
        }
        phase.textContent = w.work ? 'WORK' : 'REST';
        phase.className = 'tphase' + (w.work ? ' on' : '');
        dg(face, mmss(Math.ceil(w.left))); face.classList.toggle('idle', !s.t0);
        info.textContent = 'Round ' + w.round + ' of ' + c.rounds + ' \u00b7 ' + mmss(Math.ceil(w.total - w.gone)) + ' to go' + (s.t0 ? '' : ' \u00b7 paused');
      };
      const render = () => {
        bar.innerHTML = '';
        bar.appendChild(tbtn(s.t0 ? 'PAUSE' : (s.acc ? 'GO ON' : 'START'), () => {
          const now = Date.now();
          if (s.t0) { s.acc += now - s.t0; s.t0 = 0; }
          else { if (!s.acc) { s.mark = ''; sfx('complete', { level: 1 }); } s.t0 = now; }
          render();
        }, s.t0 ? '' : 'go'));
        if (s.t0 || s.acc) bar.appendChild(tbtn('RESET', () => { s.t0 = 0; s.acc = 0; s.mark = ''; render(); }));
        bar.appendChild(tbtn('SET', () => {
          const c = ivCfg(cfg);
          let fw, fr, fn;
          UI.dialog({
            title: 'INTERVALS', width: 340,
            body: b => {
              fw = UI.field('number', { value: c.work }); fr = UI.field('number', { value: c.rest }); fn = UI.field('number', { value: c.rounds });
              b.appendChild(UI.row('Work', 'Seconds on', fw));
              b.appendChild(UI.row('Rest', 'Seconds off, 0 for none', fr));
              b.appendChild(UI.row('Rounds', '', fn));
            },
            actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: () => {
              const val = f => { const i = f.querySelector ? (f.querySelector('input') || f) : f; return i.value; };
              const w = parseInt(val(fw), 10), r = parseInt(val(fr), 10), n = parseInt(val(fn), 10);
              if (!(w > 0) || !(r >= 0) || !(n > 0)) { toast('Work and rounds need a number above 0', { bad: true }); return false; }
              cfg.work = w; cfg.rest = r; cfg.rounds = n; s.t0 = 0; s.acc = 0; s.mark = '';
              saveLayout(); drawHome();
            } }],
          });
        }));
        show();
      };
      s.paint = now => {
        if (!face.isConnected) return;
        show(now);
        /* step() ends the run before paint is called, so comparing t0 before
           and after show() never saw it end and PAUSE stayed up */
        const want = s.t0 ? 'PAUSE' : (s.acc ? 'GO ON' : 'START');
        if (!bar.firstChild || bar.firstChild.textContent !== want) render();
      };
      [partOn(cfg, 'phase') ? phase : null, face, partOn(cfg, 'info') ? info : null, bar].filter(Boolean).forEach(n => body.appendChild(n));
      render();
    },
  },

/* ══════════════ the board does the apps' jobs ══════════════
   Tom, 2026-10-06, picked off a list: apps as widgets ("All that are
   sensible", and ELEMENT, WEALTH, SPEAK and NOTICE by name), a box for
   weight and one for steps, his foods as one-tap buttons, a box for each
   kind of bullet, and one-tap ticks. 2026-10-13, what it is for: "on pc
   there is minimal need to open the other apps".

   Each one writes exactly the rows its app writes, the way that app writes
   them, so the board never becomes a second author with its own idea of a
   row. The app cards are the app itself, so they write nothing here. */

/* ── a measure, typed in ──
   STATUS's evAdd without its own screen's bookkeeping. A field kept once a
   day (a weight, a step count) is replaced; any other (water, mood) gets
   one more reading. The number is stored in the field's own unit, as
   typed, which is how STATUS stores it. Weight and steps fall back to
   STATUS's own first settings on a device STATUS has never opened. */
const FIELD0 = {
  weight: { id: 'weight', label: 'Weight', unit: 'lb', measure: 'number', once: 1, agg: 'last', step: .1, dec: 1, order: 1, on: 1 },
  steps: { id: 'steps', label: 'Steps', unit: '', measure: 'number', once: 1, agg: 'last', step: 500, dec: 0, target: 10000, dir: 'gte', order: 3, on: 1 },
};
function fieldRow(id) {
  const f = Rec.get('field', null, id);
  return f ? Object.assign({ id: id }, f) : (FIELD0[id] || null);
}
/* the measures a box can take: switched on, typed by hand (not fed from
   food), in STATUS's order */
function fieldsTyped() {
  const m = Rec.map('field') || {}, out = [];
  Object.keys(m).forEach(id => {
    const f = m[id];
    if (f && f.on && !f.from && /^(number|amount|scale|check)$/.test(f.measure || '')) out.push(Object.assign({ id: id }, f));
  });
  Object.keys(FIELD0).forEach(id => { if (!m[id]) out.push(FIELD0[id]); });
  return out.sort((a, b) => (a.order || 99) - (b.order || 99));
}
function evPut(date, f, v) {
  const was = Rec.get('ev', date, f.id);
  const before = was && Array.isArray(was.e) ? was.e.slice() : [];
  const e = f.once ? [] : before.slice();
  e.push({ t: Date.now(), v: v });
  Rec.patch('ev', date, f.id, { e: e });
  return () => { if (before.length) Rec.patch('ev', date, f.id, { e: before }); else Rec.del('ev', date, f.id); };
}
const fieldNum = (f, v) => {
  const d = f.dec != null ? f.dec : (f.measure === 'scale' ? 1 : 0);
  return Number(v).toLocaleString(undefined, { maximumFractionDigits: d });
};
const fieldUnit = f => f.unit ? ' ' + f.unit : '';

/* ── a food, logged ──
   STATUS's logMeal, copied: every figure frozen in for the serving, the
   row keyed with a counter so two taps in one millisecond are two meals,
   and the food's use count up by one. A patch, not a rebuilt row, so a
   figure FOODDÉX added and STATUS never showed survives it. */
const MEAL_NUTS = ['p', 'c', 'f', 'kcal', 'na', 'k', 'ca', 'caff'];
let mealSeq = 0;
function foodServe(fd) {
  const b = fd.base || {}, out = [];
  const amt = parseFloat(b.amt);
  out.push({ label: '1 serving (' + (isFinite(amt) ? Math.round(amt * 10) / 10 : 1) + ' ' + (b.unit || '') + ')', mult: 1 });
  const u = String(b.unit || '').toLowerCase();
  if ((u === 'g' || u === 'ml') && amt > 0) out.push({ label: '100 ' + u, mult: 100 / amt });
  (fd.serves || []).forEach(s => out.push(s));
  const i = Math.min(fd.lastServe != null ? fd.lastServe : (fd.dflt || 0), out.length - 1);
  return out[Math.max(0, i)];
}
function logFood(fd) {
  const today = LifeOS.day(), s = foodServe(fd), mult = parseFloat(s.mult) || 1, b = fd.base || {};
  const n = k => (parseFloat(b[k]) || 0) * mult;
  const row = { fid: fd.id, name: fd.name, serve: String(s.label || ''), unit: b.unit, t: Date.now() };
  MEAL_NUTS.forEach(k => { row[k] = n(k); });
  row.price = n('price'); row.amt = n('amt'); row.mult = mult;
  row.err = 0; row.acct = '';
  const key = Rec.USER + '-' + Date.now().toString(36) + '-' + (mealSeq++).toString(36) + Math.random().toString(36).slice(2, 5);
  Rec.set('meal', today, key, row);
  const uses = fd.uses || 0, last = fd.last;
  Rec.patch('food', null, fd.id, { uses: uses + 1, last: today });
  return () => { Rec.del('meal', today, key); Rec.patch('food', null, fd.id, { uses: uses, last: last }); };
}

/* ── an app, in a card ──
   The app's own page in a frame, so it is the app and not a copy of it.
   The frames live OUTSIDE the grid, in #cardframes, and sit over their
   cards: the board throws its cards away and draws them again on every
   write anywhere, and a frame taken out of the page loses everything in
   it. placeCards puts each one over its card after every draw. One per
   app; a second card of the same app says so. A phone stacks the board,
   and an app inside a stacked card is a scroll inside a scroll, so there
   the card is a row that opens the app. */
const cardFrames = {};
function cardFrame(id) {
  const a = app(id);
  if (!a || !a.file || missing[id]) return null;
  const f = el('iframe', 'cardframe off');
  f.setAttribute('allow', 'camera; microphone; fullscreen; clipboard-read; clipboard-write');
  f.title = a.nm;
  f.addEventListener('load', () => stayIn(f, a));
  f.src = a.file;
  $('#cardframes').appendChild(f);
  cardFrames[id] = f;
  probe(a);
  return f;
}
/* An app's own home button sends its page to the home screen, which inside
   a frame is a second home screen in a box, with app cards of its own.
   A frame that leaves its app's folder goes back to it, and the place it
   was sent to opens the usual way: home stays home, another app opens
   full size. Unreadable (a page opened from a folder) is left alone. */
function frameLeft(f, a) {
  let p = '';
  try { p = f.contentWindow.location.pathname; } catch (e) { return null; }
  const dir = f => '/' + String(f).replace(/index\.html$/, '');
  if (!p || p.indexOf(dir(a.file)) > -1) return null;
  return APPS.find(x => x.file && x.id !== a.id && p.indexOf(dir(x.file)) > -1) || app('home');
}
/* Sent to another app with an address of its own (COACH's EDIT IN FORGE
   adds the program to FORGE's address), the frame is left where it went: that app reads
   the address, and opening it the usual way would drop it. */
function stayIn(f, a, over) {
  const to = frameLeft(f, a);
  if (!to) return;
  let q = '';
  try { q = f.contentWindow.location.search + f.contentWindow.location.hash; } catch (e) {}
  if (to.id !== 'home' && q) return;
  f.src = a.file;
  if (over) closeOver();
  if (to.id !== 'home' || !over) go(to.id);
}
function placeCards() {
  const layer = $('#cardframes'), home = $('#home');
  if (!layer || !home) return;
  const on = {};
  layout.forEach(c => { const W = WIDGETS[c.t]; if (W && W.appCard) on[W.appCard] = 1; });
  Object.keys(cardFrames).forEach(id => {
    if (on[id] && !missing[id]) return;
    cardFrames[id].remove(); delete cardFrames[id];
  });
  /* away from the board #home is hidden, and the frames wait inside it */
  if (view !== 'home') return;
  const hr = home.getBoundingClientRect(), seen = {};
  $('#grid').querySelectorAll(':scope > .w > .w-body.appslot').forEach(b => {
    const id = b.dataset.app;
    if (seen[id]) {
      if (!b.firstChild) b.appendChild(el('div', 'empty', esc(app(id).nm) + ' is open in another card'));
      return;
    }
    seen[id] = 1;
    const f = cardFrames[id] || cardFrame(id);
    if (!f) return;
    const r = b.getBoundingClientRect(), cs = getComputedStyle(b);
    const pl = parseFloat(cs.paddingLeft) || 0, pr = parseFloat(cs.paddingRight) || 0, pb = parseFloat(cs.paddingBottom) || 0;
    f.style.left = (r.left - hr.left - home.clientLeft + home.scrollLeft + pl) + 'px';
    f.style.top = (r.top - hr.top - home.clientTop + home.scrollTop) + 'px';
    f.style.width = Math.max(0, r.width - pl - pr) + 'px';
    f.style.height = Math.max(0, r.height - pb) + 'px';
    f.classList.remove('off');
  });
  Object.keys(cardFrames).forEach(id => { if (!seen[id]) cardFrames[id].classList.add('off'); });
}

Object.assign(WIDGETS, {
  /* LOG WEIGHT and LOG STEPS are this with a field picked. Tom's a and b,
     2026-10-06; any other measure STATUS keeps can go in one too. */
  logfield: {
    nm: 'LOG A MEASURE', w: 3, h: 2, fit: 1, app: 'status', to: ['status', 'now'],
    about: 'A box for one of your STATUS measures. Type the number and press Enter.',
    presets: [
      { nm: 'LOG WEIGHT', note: 'Type today\'s weight and press Enter.', cfg: { f: 'weight' } },
      { nm: 'LOG STEPS', note: 'Type today\'s steps and press Enter.', cfg: { f: 'steps' } },
    ],
    field: cfg => fieldRow((cfg && cfg.f) || 'weight'),
    nmFor: cfg => { const f = WIDGETS.logfield.field(cfg); return 'LOG ' + String(f ? f.label : 'a measure').toUpperCase(); },
    menu(cfg, redraw) {
      const cur = (cfg && cfg.f) || 'weight';
      return ['-', { label: 'Measure', sub: fieldsTyped().map(f => ({ label: f.label, check: f.id === cur, fn: () => { cfg.f = f.id; redraw(); } })) },
        partToggle(cfg, 'said', 'Show the last reading', redraw)];
    },
    draw(body, cfg) {
      const f = WIDGETS.logfield.field(cfg);
      if (!f) { body.appendChild(el('div', 'empty', 'That measure is gone from STATUS')); return; }
      const today = LifeOS.day();
      const said = el('div', 'qline');
      const paint = () => {
        const v = evValue(today, f.id);
        if (f.measure === 'check') { said.textContent = v ? 'Done today' : 'Not done today'; return; }
        if (v != null) {
          const n = (Rec.get('ev', today, f.id) || {}).e;
          said.textContent = 'Today ' + fieldNum(f, v) + fieldUnit(f) +
            (f.target ? ' of ' + fieldNum(f, f.target) : '') +
            (f.measure === 'scale' && n && n.length > 1 ? ', ' + n.length + ' readings' : '');
          return;
        }

   window packed the eight into one band 24 columns wide; a phone keeps them
   too, since they stack there in the same order and the board syncs to the

  return DEFAULT_LAYOUT.map(c => { const o = Object.assign({}, c); if (!wide) { delete o.x; delete o.y; } return o; });

/* ── the layout is a row, not a private key ──
   Tom, 2026-09-17: "my main menu layout doesnt seem to save." It did save. It
   saved straight into localStorage, which is the one thing hard constraint 6
   forbids, and the consequence is exactly what he saw: a raw key is per copy
   and never syncs, so an arrangement made in one place is invisible in the
   next. He now has three copies, the folder, the website and the Main Menu

   see in an afternoon.

const chosenEmpty = () => { try { return !!Rec.setting('lifeos', 'layoutEmpty'); } catch (e) { return false; } };

try { const saved = Rec.setting('lifeos', 'layout'); if (Array.isArray(saved) && saved.length) layout = saved; } catch (e) {}

if (!Array.isArray(layout)) layout = [];
/* ── two boards: one for the 1920 screen, one for the 3840 ──
   Tom, 2026-10-16, a few hours after 1.0.69 scaled one board to every
   window: "Just save 2 positions between the 2 main screen sizes, I don't
   like the resizing." Every card still exists once, with its settings, so
   a widget added or removed on one screen is added or removed on both.
   What each screen keeps is where the card sits and how big it is: the
   card's own x, y, w and h are the 1920 board, and `W` holds the same four

   the wide board; anything narrower, and a phone, the other. Each is drawn
   at full size, never scaled up.

   past the 12 columns 1920 has. It becomes the wide board as it is, and
   the 1920 board starts as the same cards packed into 12 columns in the
   order they read (top to bottom, then left to right), each in the first
   place it fits whole. Worked out on open and kept in memory; saved the
   first time he changes either board. */

  if (reach <= 12) return list;

      c.x = x || 1; c.y = y - 1;
      for (let r = c.y; r < c.y + c.h; r++) for (let k = c.x; k < c.x + c.w; k++) taken[r + ',' + k] = 1;

   Each card may carry x (its first column, 1 to 12) and y (its first row).
   A card without one is placed by the grid into the first hole it fits and
   then keeps where it landed, which is how every layout saved before

  return layout.map((c, i) => i).sort((a, b) => {

  ord.forEach(i => {

    c.y = Math.max(1, c.y);

        if (box === body && r.top < bottom && e.children.length > 1) { walk(e); return; }

/* A fit card measured in the fallback font came out a row short and was
   never measured again: MACROS opened with CALORIES cut in half, then grew

/* ── Ctrl+scroll zooms one widget ──
   Tom, 2026-10-18: "let me ctrl+scroll while a widget is highlighted to
   change the zoom or font size within the widget like in chrome". Over a
   card, Ctrl and the wheel step through Chrome's own zoom levels; the
   card's body zooms (its title bar stays put, so it still drags), and the
   level is `zoom` on the card's layout entry, so it syncs and survives a
   redraw. Desk only. An app card's frame is its own page and takes no
   zoom from here. */
const ZOOMS = [0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
let zoomT = 0, zoomAcc = 0;
document.addEventListener('wheel', ev => {
  if (!ev.ctrlKey || view !== 'home' || NARROW()) return;
  const n = ev.target && ev.target.closest && ev.target.closest('#grid > .w');
  if (!n) return;
  ev.preventDefault();
  const c = layout[+n.dataset.i], body = n.querySelector(':scope > .w-body');
  if (!c || !body || body.classList.contains('appslot')) return;
  /* a mouse notch is about 100, a trackpad sends many small ones */
  zoomAcc += ev.deltaY;
  if (Math.abs(zoomAcc) < 40) return;
  const up = zoomAcc < 0; zoomAcc = 0;
  const z = c.zoom || 1;
  let k = up ? ZOOMS.findIndex(v => v > z + 0.001) : ZOOMS.length - 1 - ZOOMS.slice().reverse().findIndex(v => v < z - 0.001);
  if (k < 0 || k >= ZOOMS.length) return;
  if (ZOOMS[k] === 1) delete c.zoom; else c.zoom = ZOOMS[k];
  body.style.zoom = c.zoom || '';
  let tag = n.querySelector(':scope > .ztag');
  if (!tag) { tag = el('div', 'ztag'); n.appendChild(tag); }
  tag.textContent = Math.round((c.zoom || 1) * 100) + '%';
  clearTimeout(zoomT);
  zoomT = setTimeout(() => { saveLayout(); drawHome(); }, 700);
}, { passive: false });
let fitT = 0;
addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => { if (view === 'home') redrawHome(); }, 150); });

/* --- drag to a spot: the card lands on the cells under it, and anything
   in the way moves down. Before 2026-09-22 it swapped with the card under
   the pointer, which could not leave a gap. --- */
let moving = null;
function startMove(ev, i) {
  if (ev.target.closest('.x')) return;
  ev.preventDefault();
  const node = ev.currentTarget.parentElement, r = node.getBoundingClientRect();
  moving = { i: i, node: node, dx: ev.clientX - r.left, dy: ev.clientY - r.top };
  node.classList.add('drag');
  document.body.classList.add('dragging');
  const gh = $('#ghost');
  gh.style.cssText = 'display:block;width:' + r.width + 'px;height:' + Math.min(r.height, 160) + 'px;left:' + r.left + 'px;top:' + r.top + 'px';
  /* the card's own header, by the name it goes by on the board, so a second
     WEIGHT is its range and not plain WEIGHT */
  const W = WIDGETS[layout[i].t];
  gh.innerHTML = '<div class="w-head">' + esc(W.nmFor ? W.nmFor(layout[i]) : W.nm) + '</div>';
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', endMove, { once: true });
}
function onMove(ev) {
  if (!moving) return;
  const gh = $('#ghost');
  gh.style.left = (ev.clientX - moving.dx) + 'px';
  gh.style.top = (ev.clientY - moving.dy) + 'px';
  const m = gridMetrics(), c = layout[moving.i];
  const at = cellAt(m, ev.clientX - moving.dx + m.colw / 2, ev.clientY - moving.dy + m.R / 2);
  moving.to = { x: Math.max(1, Math.min(at.c, m.cols - c.w + 1)), y: at.r };
  hint(m, moving.to.x, moving.to.y, c.w, hOf(moving.i), true);
}
function endMove(ev) {

  document.body.classList.remove('dragging');
  $('#ghost').style.display = 'none';
  moving.node.classList.remove('drag');
  hint();
  if (moving.to) {
    const c = layout[moving.i];
    c.x = moving.to.x; c.y = moving.to.y;
    pinned = moving.i;

/* --- drag the corner to resize, snapped to grid columns and 84px rows --- */
let sizing = null;
function startResize(ev, i, node) {
  ev.preventDefault(); ev.stopPropagation();
  const m = gridMetrics();
  /* a card that sizes to its contents starts from the height it shows, and
     keeps measuring until the drag actually moves it up or down (`hs`) */
  const fit = !!(WIDGETS[layout[i].t] || {}).fit;
  document.body.classList.add('dragging');
  sizing = { i: i, node: node, fit: fit, cols: m.cols, colw: m.colw, gap: m.gap, x: ev.clientX, y: ev.clientY, w: layout[i].w,
    h: fit ? (effH[i] || layout[i].h) : layout[i].h, h0: layout[i].h, hs: layout[i].hs };

  window.addEventListener('pointerup', endResize, { once: true });
}
function onResize(ev) {
  if (!sizing) return;
  const dw = Math.round((ev.clientX - sizing.x) / (sizing.colw + sizing.gap));
  const dh = Math.round((ev.clientY - sizing.y) / (parseFloat($('#grid').style.getPropertyValue('--row')) || 84));
  const w = Math.max(2, Math.min(sizing.cols, sizing.w + dw));
  layout[sizing.i].w = w;
  sizing.node.style.setProperty('--cw', w);
  const c = layout[sizing.i];
  /* a fit card dragged back to where it started measures itself again */
  if (sizing.fit && !dh) {
    c.h = sizing.h0; if (sizing.hs) c.hs = 1; else delete c.hs;
    if (!sizing.hs) { sizing.node.style.setProperty('--ch', sizing.h); return placeCards(); }
  }
  /* no ceiling: a card can be dragged as tall as he likes and the board
     scrolls (Tom, 2026-10-18: "today should be infinitely vertically
     expandable"). It was 12 rows. */
  const h = Math.max(sizing.fit ? 1 : 2, sizing.h + dh);
  c.h = h;
  if (sizing.fit) { c.hs = 1; effH[sizing.i] = h; }
  sizing.node.style.setProperty('--ch', h);
  placeCards();
}
function endResize() {
  if (!sizing) return;
  window.removeEventListener('pointermove', onResize);
  document.body.classList.remove('dragging');
  pinned = sizing.i;
  saveLayout(); sizing = null; drawHome();
}

/* ══════════════ backup and export ══════════════
   Everything is local, so a backup is the only safety net there is. Two kinds:
   a restorable snapshot (JSON, everything) and readable exports (CSV/text, for
   spreadsheets and clients).                                                  */
const BKEY = 'lifeos_lastbackup';
function download(name, text, mime) {
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain;charset=utf-8' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const csvCell = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const csv = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');

/* Every row in the store, from the store (1.0.37). It used to copy
   localStorage key by key, which held only the fast half: a photo, any row
   the full fast half had moved to IndexedDB, and since TRAIN's sets were
   kept out of the open (records.js, KEPT OUT), every set, were missing from
   it. Now it is the same file the nightly backup writes, which any app's
   Restore merges, plus the look of every app. */
function backupAll() {
  Rec.need().then(() => {
    const bag = { kind: 'motherbase-backup', v: 1, app: '*', at: new Date().toISOString(), rows: Rec.export(),
      local: IO.localBits ? IO.localBits('home') : {} };
    download('motherbase-all-' + LifeOS.day() + '.json', JSON.stringify(bag), 'application/json');
    try { localStorage.setItem(BKEY, LifeOS.day()); } catch (e) {}
    toast('<b>' + bag.rows.length.toLocaleString() + '</b> rows backed up, every app');
    refreshDataBtn();
  });
}
function restore(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let bag; try { bag = JSON.parse(fr.result); } catch (e) { return toast('that file is not JSON'); }
    /* the store's own file merges, newer rows winning, like every app's Restore */
    if (bag.kind === 'motherbase-backup') {
      Rec.need().then(() => {
        const c = IO.restore(bag, 'merge');
        toast(c ? '<b>' + c.toLocaleString() + '</b> rows restored' : 'Nothing to restore. This device already has all of it');
      }).catch(e => toast(esc(e && e.message || 'could not restore'), { bad: true }));
      return;
    }
    if (bag.kind !== 'lifeos-backup') return toast('not a backup from this suite');
    if (!confirm('Replace ALL data on this device with the backup from ' + (bag.at || '?') + '?\n\nThis cannot be undone.')) return;
    Object.keys(bag.local || {}).forEach(k => { try { localStorage.setItem(k, bag.local[k]); } catch (e) {} });
    LifeOS._adopt(bag.shared || {});
    toast('restored — reloading…');
    setTimeout(() => location.reload(), 900);
  };
  fr.readAsText(file);
}

function todayText() {

/* ── delete everything, with a way back (2026-10-06) ──
   It was two of the browser's own confirm boxes and then nothing: one wrong
   tap from gone. The warning stays, in the suite's own dialog, and before
   anything goes a copy of all of it (localStorage and the store's IndexedDB
   half, where the big rows live) is put in a database of its own on this
   device. The open after the reload offers UNDO, and DATA offers "Bring back
   what was deleted" for WIPE_DAYS, after which the copy is dropped. If no
   copy can be kept it says so and asks again before deleting.
   The store's IndexedDB ('motherbase') is deleted too now: until this, its
   big rows outlived "delete everything" and came back on the next open. */
const WIPE_DB = 'mb-wiped', WIPE_AT = 'mb.wiped.at', WIPE_DAYS = 7;
function wipeIdb(name, mode, fn) {
  return new Promise((res, rej) => {
    let q;
    try { q = indexedDB.open(name, 1); } catch (e) { rej(e); return; }
    q.onupgradeneeded = () => { const d = q.result; if (!d.objectStoreNames.contains('rows')) d.createObjectStore('rows'); };
    q.onerror = () => rej(q.error);
    q.onsuccess = () => {
      const d = q.result;
      let out;
      try {
        const tx = d.transaction('rows', mode);
        out = fn(tx.objectStore('rows'));
        tx.oncomplete = () => { d.close(); res(out && typeof out === 'object' && 'v' in out ? out.v : out); };
        tx.onerror = tx.onabort = () => { d.close(); rej(tx.error); };
      } catch (e) { d.close(); rej(e); }
    };
  });
}
/* every key and value in the store's IndexedDB half */
const idbAll = () => wipeIdb('motherbase', 'readonly', st => {
  const o = { v: [] }, ks = st.getAllKeys(), vs = st.getAll();
  vs.onsuccess = () => { o.v = (ks.result || []).map((k, i) => [k, vs.result[i]]); };
  return o;
});
function wipeSnapshot() {
  const ls = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k != null && k !== WIPE_AT) ls[k] = localStorage.getItem(k); }
  return idbAll().catch(() => []).then(idb =>
    wipeIdb(WIPE_DB, 'readwrite', st => { st.put({ at: new Date().toISOString(), ls: ls, idb: idb }, 'snap'); }));
}
const wipeRead = () => wipeIdb(WIPE_DB, 'readonly', st => { const o = { v: null }, r = st.get('snap'); r.onsuccess = () => { o.v = r.result || null; }; return o; });
function wipeForget() {
  try { localStorage.removeItem(WIPE_AT); } catch (e) {}
  try { indexedDB.deleteDatabase(WIPE_DB); } catch (e) {}
}
async function wipeAll() {
  const yes = await UI.confirm('Delete ALL data on this device?',
    'Ticks, habits and every app’s own storage. Back up first. A copy stays on this device for ' + WIPE_DAYS +
    ' days so it can be brought back from DATA, then it is gone for good.',
    { title: 'DELETE EVERYTHING', yes: 'DELETE EVERYTHING', danger: true });
  if (!yes) return;
  let kept = false;
  try { await wipeSnapshot(); kept = !!(await wipeRead()); } catch (e) { kept = false; }
  if (!kept && !(await UI.confirm('No copy could be kept, so this cannot be undone.', 'Delete everything anyway?',
    { title: 'NO WAY BACK', yes: 'DELETE', danger: true }))) return;
  try { localStorage.clear(); } catch (e) {}
  if (kept) {
    try { localStorage.setItem(WIPE_AT, new Date().toISOString()); } catch (e) {}
    try { sessionStorage.setItem('mb.wiped.now', '1'); } catch (e) {}
  }
  try { indexedDB.deleteDatabase('lifeos'); } catch (e) {}
  try { indexedDB.deleteDatabase('motherbase'); } catch (e) {}
  setTimeout(() => location.reload(), 400);
}
/* Everything in the copy back as it was, then a fresh open to read it. */
async function unwipe() {
  let snap = null;
  try { snap = await wipeRead(); } catch (e) {}
  if (!snap) { toast('The deleted copy is not on this device any more', { bad: true }); wipeForget(); return; }
  /* A row comes back by the store's own rule, the newer write wins: a row
     written again since the delete (today's weigh-in, a tick, a setting)
     keeps its new copy. Put back blindly, the old copy replaced it in both
     halves. Anything that is not a row goes back as it was. */
  const stamp = r => String((r && r.updated_at) || '');
  const keepNow = (was, now) => !!now && stamp(now) >= stamp(was);
  Object.keys(snap.ls || {}).forEach(k => { try {
    if (k.indexOf('mb.r.') === 0) {
      const cur = localStorage.getItem(k);
      if (cur != null) { let a = null, b = null; try { a = JSON.parse(snap.ls[k]); b = JSON.parse(cur); } catch (e) {} if (a && keepNow(a, b)) return; }
    }
    localStorage.setItem(k, snap.ls[k]);
  } catch (e) {} });
  if (snap.idb && snap.idb.length) {
    try { await wipeIdb('motherbase', 'readwrite', st => { snap.idb.forEach(p => {
      const q = st.get(p[0]);
      q.onsuccess = () => { if (!keepNow(p[1], q.result)) st.put(p[1], p[0]); };
    }); }); } catch (e) {}
  }
  wipeForget();
  toast('Bringing it all back');
  setTimeout(() => location.reload(), 400);
}
/* On open: the UNDO straight after a delete, and the copy dropped once it is
   older than WIPE_DAYS. */
function wipeOnOpen() {
  let at = null;
  try { at = localStorage.getItem(WIPE_AT); } catch (e) {}
  if (!at) return;
  if (Date.now() - Date.parse(at) > WIPE_DAYS * 864e5) { wipeForget(); return; }
  let now = false;
  try { now = sessionStorage.getItem('mb.wiped.now') === '1'; sessionStorage.removeItem('mb.wiped.now'); } catch (e) {}
  if (now) UI.undo('Everything on this device was deleted.', unwipe, { ms: 12000 });
}

/* ══════════════ the sheet mirror ══════════════
   One Google Sheet for the whole suite, one link, pasted once. shared/io.js
   carries the protocol and STATUS already has a panel for it. The home screen
   is here because it is the only place that can reasonably offer "all of them".

   It does not do the syncing itself. Which tabs an app has, and how one of its
   rows flattens into a line somebody can type into, live in that app's own
   registration — the shell has never run it and cannot guess. So the shell
   loads the app, asks it to sync itself, and counts the answers.

   Editing in the sheet is the point of the thing. Forty foods on a laptop
   keyboard beats forty on a phone, and the pull runs before the push, so what
   was typed there is read before anything is written back over it. */
function syncEveryApp() {
  const M = IO.mirror;
  if (!M.ready()) return toast(esc(M.why()), { bad: true, ms: 8000 });

  /* ARC and FORM keep their own storage by design and are not asked at all.
     Of the rest, only the ones actually on the shared drawer can answer, so
     ask first and sync whoever puts a hand up. Nothing here needs editing on
     the day BLOCK moves over — it will simply start answering. */
  const candidates = APPS.filter(a => a.file && !a.solo && !missing[a.id]);
  if (!candidates.length) return toast('Nothing to sync', { bad: true });
  toast('Syncing…');
  /* How long to wait for hands to go up. An app already open answers in
     milliseconds; one being loaded to be asked has to fetch and run its whole
     file first, and on his phone that is not instant. Being too quick here
     does not fail loudly — it quietly leaves an app out of the sheet — so the
     window is generous whenever anything had to be loaded. */
  const cold = candidates.some(a => !frames[a.id] || !frames[a.id].dataset.loaded);
  reach(candidates, { mb: 2, ping: 1 }, m => m.pong, cold ? 9000 : 3000, on => {
    if (!on.length) {
      return toast('None of the apps are on the shared drawer yet, so there is nothing to put in the sheet.',
        { bad: true, ms: 9000 });
    }
    pushToSheet(on, candidates.length);
  });
}

/* Ask a set of apps something, and call back with the ones that answered.
   Making the frame is part of asking: an app he has not opened today is not
   loaded, and an app that is not loaded cannot say anything. */
function reach(list, msg, keep, ms, then) {
  const said = {};
  let done = false;
  const heard = e => {
    const m = e.data;
    if (!m || m.mb !== 2 || !keep(m)) return;
    const a = list.find(x => frames[x.id] && frames[x.id].contentWindow === e.source);
    if (a) said[a.id] = m;
    if (Object.keys(said).length === list.length) finish();
  };
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    window.removeEventListener('message', heard);
    then(list.filter(a => said[a.id]).map(a => Object.assign({}, a, { said: said[a.id] })));
  };
  const timer = setTimeout(finish, ms);
  window.addEventListener('message', heard);
  list.forEach(a => {
    const f = frameFor(a.id);
    const ask = () => { try { f.contentWindow.postMessage(msg, '*'); } catch (e) {} };
    /* a frame made a moment ago has not run its scripts yet, and an app that
       has not registered cannot answer for itself */
    if (f.dataset.loaded) ask();
    else f.addEventListener('load', () => setTimeout(ask, 400), { once: true });
  });
}

/* the round trip itself, once we know who can do it */
function pushToSheet(on, asked) {
  toast('Syncing <b>' + on.length + '</b> apps…');
  reach(on, { mb: 2, sync: 1, full: 1 }, m => m.synced, 40000, res => {
    const ok = res.filter(a => a.said.ok);
    if (ok.length === on.length) {
      const extra = asked - on.length;
      toast('Synced <b>' + ok.length + '</b> apps into the sheet.' +
        (extra ? ' <b>' + extra + '</b> are not on the shared drawer yet and have nothing to send.' : ''));
      if (typeof Sfx !== 'undefined' && Sfx.play) Sfx.play('complete', { level: 2 });
      return;
    }
    /* Say the likely fix rather than the symptom. io.js works out which one
       the link itself points at, and they all share the one link, so the
       first app with an opinion is enough. */
    const why = (res.map(a => a.said).find(m => m && m.why) || {}).why;
    toast('Synced <b>' + ok.length + ' of ' + on.length + '</b>. ' +
      esc(why || 'The rest did not answer.'), { bad: true, ms: 9000 });
  });
}

/* ══════════════ bringing in an old spreadsheet ══════════════
   shared/import.js reads it; this asks which parts to bring in. Nothing is
   written until BRING IN, and the undo takes back exactly what came in. */
/* import.js, fetched on first use from beside io.js (so a client copy's
   stamp comes along) rather than on every open: 16 KB nobody uses daily. */
function needImport() {
  if (typeof Import !== 'undefined') return Promise.resolve(true);
  return new Promise(res => {
    const io = document.querySelector('script[src*="shared/io.js"]');
    const t = document.createElement('script');
    t.src = io ? io.src.replace(/io\.js/, 'import.js') : 'shared/import.js';
    t.onload = () => res(typeof Import !== 'undefined');
    t.onerror = () => { t.remove(); res(false); };
    document.head.appendChild(t);
  });
}
function importSheet(file) {
  needImport().then(ok => ok ? importRead(file) : toast('<b>import.js</b> is missing', { bad: true }));
}
function importRead(file) {
  toast('Reading <b>' + esc(file.name) + '</b>');
  Import.read(file).then(sheets => {
    const p = Import.plan(sheets);
    const unit = ((Rec.map('field').weight || {}).unit) || '';
    const kinds = [
      ['weights', 'Weigh-ins', unit ? 'Read as ' + unit : ''],
      ['ticks', 'Daily ticks', ''],
      ['foods', 'Foods', ''],
      ['spends', 'Spending', 'Money out only'],
    ];
    const pick = {};
    UI.dialog({
      title: 'BRING IN A SPREADSHEET', width: 520,
      body: b => {
        b.appendChild(el('p', null, esc(file.name)));
        kinds.forEach(([k, label, extra]) => {
          const n = p[k].length, kept = p.kept[k];
          pick[k] = n > 0;
          const note = (n ? n.toLocaleString() + ' new' + (p.span[k] ? ', ' + p.span[k] : '') : (kept ? 'All already here' : 'None found')) +
            (n && kept ? '. ' + kept.toLocaleString() + ' already here, left alone' : '') + (extra && n ? '. ' + extra : '');
          const t = UI.toggle(pick[k], on => { pick[k] = on; });
          if (!n) t.disabled = true;
          b.appendChild(UI.row(label, esc(note), t));
        });
        if (p.odd) b.appendChild(el('p', null, esc(p.odd.toLocaleString() + ' dated years away from the rest of their sheet, left out.')));
        if (p.skipped.length) b.appendChild(el('p', null, 'Not read: ' + esc(p.skipped.join(', '))));
      },
      actions: [
        { label: 'CANCEL' },
        { label: 'BRING IN', kind: 'go', fn: () => {
          const done = Import.apply(p, pick);
          if (!done.total) { toast('Nothing brought in'); return; }
          drawHome();
          UI.undo('<b>' + done.total.toLocaleString() + '</b> rows brought in', () => { done.undo(); drawHome(); });
        } },
      ],

  }, e => toast(esc((e && e.message) || 'Could not read that file'), { bad: true }));
}

  src.querySelectorAll('.opt.danger').forEach(o => o.classList.add('bad'));
  src.querySelectorAll('.mgroup').forEach(o => o.classList.add('mb-group'));
  src.querySelectorAll('.lede').forEach(o => { o.className = 'lede'; o.style.cssText = 'color:var(--dim2);line-height:1.6;margin-bottom:var(--s-4,16px)'; });
  modalH = UI.dialog({
    title: title, width: 520,
    body: b => { while (src.firstChild) b.appendChild(src.firstChild); },
    onClose: () => { modalH = null; },
  });
}
function closeModal() { if (modalH) modalH.close(); }

/* ══════════════ boot ══════════════ */
function clock() {
  const d = new Date();
  $('#cDate').textContent = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
  dg($('#cSub'), clock12(d.getTime()));
}
$('#btnData').onclick = dataPanel;
$('#btnWidget').onclick = () => widgetPicker();
$('#fileIn').onchange = e => { if (e.target.files[0]) restore(e.target.files[0]); e.target.value = ''; };
$('#xlsxIn').onchange = e => { if (e.target.files[0]) importSheet(e.target.files[0]); e.target.value = ''; };
window.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,[contenteditable]')) return;
  /* ui.js closes its own sheet on Escape, so by the time this runs there is
     nothing open and Escape means "back to home". */
  if (e.key === 'Escape') { if (modalH) return; return go('home'); }
  const n = parseInt(e.key, 10);
  /* the number on the button, which is its position — so the key and the badge
     never disagree after the dock has been rearranged */
  const dock = dockApps();
  if (n >= 1 && n <= dock.length && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); go(dock[n - 1].id); }
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1) || 'home'; if (id !== view && app(id)) go(id); });

/* The home screen is an app like any other as far as the foundation is
   concerned: its own theme, its own sound, the shared day. */
/* Anything in the markup carrying data-icon gets its drawing here, and again
   after a theme lands, because the stroke recipe belongs to the theme: a pixel
   theme wants a squared cap and a hand-drawn one wants a wobble, and those are
   different paths rather than a different colour. */
Skins.load('shared/skins.json').then(() => { Skins.restore('home');
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init('home');

/* A redraw rebuilds every card, so a box being typed in on the board lost
   its caret and whatever was not saved yet: STICKY NOTE saves itself half a
   second after a pause, the save is a store write, the write redrew the
   board, and the next keys went to the dock's number shortcuts. A phone's
   keyboard opening is a resize and did the same. While a box on the board
   has the caret the redraw waits, and runs when the caret leaves. */
function typingInGrid() {
  const a = document.activeElement;
  return !!(a && a.closest && a.closest('#grid') &&
    a.matches('textarea,[contenteditable],input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=range])'));
}
let homeHeld = false;
function redrawHome() {
  if (typingInGrid()) { homeHeld = true; return; }
  homeHeld = false;
  reloadLayout(); drawHome();
}
$('#grid').addEventListener('focusout', () => {
  if (!homeHeld) return;
  setTimeout(() => { if (homeHeld && view === 'home' && !moving && !sizing) redrawHome(); }, 0);
});
/* any change from any app repaints home — the frames repaint themselves */
LifeOS.on(() => { if (view === 'home' && !moving && !sizing) redrawHome(); });
LifeOS.ready(() => {
  wipeOnOpen();
  LifeOS.prune(800);
  go(location.hash.slice(1) || 'home');
  refreshDataBtn();
});
clock(); setInterval(clock, 20000);
/* midnight: today rolls over, so the home screen must too */
setInterval(() => {
  if (view === 'home' && $('#home').dataset.d !== LifeOS.day()) { $('#home').dataset.d = LifeOS.day(); drawHome(); refreshDataBtn(); }
}, 60000);
</script>
</body>
</html>
