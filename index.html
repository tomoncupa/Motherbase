<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mb-version" content="1.0.91, 2026-10-29">
<script>
/* An app's home button, pressed in one of this page's own frames, opens
   this page inside the frame: a second home screen in a box, loading app
   cards of its own before its frame could say it had arrived. It steps
   aside at once, and the home screen around it (stayIn) puts the app back
   and goes home. Only under the home screen: _review.html frames this page
   too, and it has no stayIn. */
try { if (window.frameElement && typeof parent.stayIn === 'function') location.replace('about:blank'); } catch (e) {}
</script>
<title>MAIN MENU</title>
<link rel="icon" href="icon-192.png">
<!-- the icon on an iPhone's home screen. Every app gets one from mobile.js;
     the root names its own, because from a folder this file's folder is not
     an app id -->
<link rel="apple-touch-icon" href="shared/icons/home.png" data-mb-app="home" data-mb-dir="shared/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="shared/fonts/fonts.css" rel="stylesheet">

<!-- The shared foundation. The home screen used to carry its own colours, its
     own dialog and its own toast; now it wears the same ones as every app, so
     a theme picked here is the theme everywhere. mobile.js before ui.js. -->
<script src="shared/skins.js"></script>
<script src="shared/boot.js"></script>
<script src="shared/day.js"></script>
<script src="shared/records.js"></script>
<script src="shared/journal.js"></script>
<script src="shared/measure.js"></script>
<script src="shared/chart.js"></script>
<script src="shared/mobile.js"></script>
<script src="shared/sound.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/io.js"></script>
<script src="shared/icons.js"></script>
<!-- shared/import.js is fetched when "Bring in an old spreadsheet" is used
     (needImport), not on every open. -->
<style>
:root{
  /* ── the bridge ──
     These were fixed hex codes, which meant the home screen was one theme and
     the apps were another. They are now aliases onto the shared skin tokens,
     so every rule below this line follows whatever theme is picked and every
     colour edit in Settings reaches the home screen too.

     Nothing else in this file had to change for that to work, which is the
     point of naming colours by their job rather than by their value.        */
  --panel:var(--surface-1); --panel2:var(--surface-2);
  --line:var(--border);     --line2:var(--border-strong);
  --txt:var(--text-1);      --dim:var(--text-2);   --dim2:var(--text-muted);
  --acc:var(--accent);      --acc-d:var(--border-strong);
  --bad:var(--danger);      --good:var(--success);
  /* --bg and --warn are already skin tokens under exactly these names. */
  --f1:var(--font-display); --f2:var(--font-body);
  --gap:var(--s-3,12px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  /* The wash follows the accent instead of being two fixed blues, so it is
     still there on a light theme rather than turning into a bruise. */
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb,var(--accent) 12%,var(--bg)) 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 100%, color-mix(in srgb,var(--data-3) 9%,var(--bg)) 0%, transparent 55%),
    var(--bg);
  color:var(--txt); font-family:var(--f2); font-size:var(--f-2,14px); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
@media (hover:hover) and (pointer:fine){
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}
}

/* dvh, not vh: on a phone vh is the tallest the viewport ever gets, so the
   bottom of a 100vh column sits behind the browser's own bar. */
#wrap{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- dock ---------- */
header{
  display:flex;align-items:center;gap:var(--s-3,12px);flex:0 0 auto;
  padding:calc(var(--s-2,8px) + var(--safe-t,0px)) var(--s-4,14px) var(--s-2,8px);
  background:color-mix(in srgb,var(--surface-1) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:var(--e-1),var(--rim);
}
.logo{font-family:var(--f1);font-weight:700;font-size:17px;letter-spacing:.2em;display:flex;align-items:center;gap:9px;cursor:pointer}
.logo b{color:var(--acc)}
/* The glow is the accent, half strength. It was a fixed ice blue, which glowed
   blue on gold Block and on every light theme. */
.logo .mark{color:var(--acc);font-size:15px;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 50%,transparent))}
/* The dock sits on the recessed surface. It was a fixed near-black, so on a
   light theme it was a black bar under dark labels nobody could read. */
nav{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
  min-width:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:5px 9px;border-radius:6px;font-family:var(--f1);font-size:12px;letter-spacing:.06em;color:var(--dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;
}
/* A narrower desktop window keeps the icons and drops the names, which are in
   the tooltip. Tom, 2026-09-14: "the header now takes up too much space".

   This was a fixed 821-to-1400 band, and the band was the bug. Outside it the
   names came back, the row grew past the window, and `overflow-x:auto` with a
   hidden scrollbar quietly slid the LAST apps off the right edge with nothing
   on screen saying so. NOTICE is thirteenth of fourteen, so NOTICE is the one
   that vanished. Tom, 2026-09-17: "NOTICE goes missing from my motherbase main
   menu under certain desktop window sizes."

   It is measured now, by `fitNav`, so the names are dropped exactly when they
   do not fit and at no other width. `.scrolly` is the last resort: if the row
   still does not fit with the names off, the right edge fades, which is the
   only honest thing a hidden scrollbar can be replaced with. */
/* Fourteen names measure 1237px of dock and the rest of the header takes
   about 400, so the names fit from about 1640px up and not below it. A ceiling
   with no floor under it, which is the difference from the 821-to-1400 band
   this replaced: that one handed the names BACK above 1400, where they did not
   fit, and the overflow went out of sight behind a hidden scrollbar. */
@media (max-width:1700px){
  nav button .nm{display:none}
  nav button{padding:5px 8px}
}
/* Everything in the header that is not an app gives way before an app does:
   the wordmark goes down to its mark, the clock goes, and WIDGET and DATA go
   down to the icons they already carry for a phone. The apps are what the
   header is FOR.

   A plain width rule, unlike the names above. Fourteen icons need about 550px
   and the wordmark, clock and two worded buttons take about 400, so under
   1150 there is no arrangement where all three fit and no measuring to do. */
@media (max-width:1150px){
  header .logo .wm{display:none}
  header .clock{display:none}
  header .hbtn .lg{display:none}
  header .hbtn .sm{display:inline}
  header .hbtn{padding:0 var(--s-2,8px)}
}
nav.scrolly{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
@media (hover:hover) and (pointer:fine){ nav button:hover{color:var(--txt)} }
/* Each app has a colour, --c, its slot in the theme's chart ramp: the icon
   wears it always, and the whole button wears it when the app is open. Tom,
   2026-09-15: the icons "are currently just plain letters". Drawn a step
   heavier and a size up as well, in appIco. */
nav button > span:first-child{display:flex;color:var(--c,var(--dim))}
/* The open app's NAME is in the reading colour; its colour is on the icon,
   the tint and the ring. A chart colour is picked to read as a line, not as
   words, and on a light dock Lego's yellow TRAIN measured 1.04 to 1. */
nav button.on{background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface-2));color:var(--txt);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c,var(--accent)) 34%,var(--bg))}
nav button .k{font-size:9px;opacity:.5}
nav button.dead{color:var(--dim2)}
nav button.dead > span:first-child{color:var(--dim2)}
/* dragging the dock into the order you want */
nav button[draggable]{cursor:grab}
nav button.dragging{opacity:.4;cursor:grabbing}
nav button.dropinto{box-shadow:inset 2px 0 0 var(--acc)}
/* the line in front of Tom's own apps: a line, no words, because the words
   took more room than the apps they labelled */
.navsep{flex:0 0 1px;align-self:stretch;margin:var(--s-1);background:var(--line2)}
.spacer{flex:1}
.clock{font-family:var(--f1);font-size:12px;letter-spacing:.1em;color:var(--dim);text-align:right;line-height:1.35;white-space:nowrap;flex:0 0 auto}
.clock b{display:block;color:var(--txt);font-size:14px;letter-spacing:.14em}
.hbtn{
  min-height:var(--tap,44px);padding:0 var(--s-3,12px);border:1px solid var(--line);
  border-radius:var(--radius-md,10px);background:var(--panel);
  font-family:var(--f1);font-size:var(--f-1,12px);font-weight:var(--w-bold,700);
  letter-spacing:.08em;color:var(--dim);white-space:nowrap;
}
@media (hover:hover) and (pointer:fine){ .hbtn:hover{border-color:var(--acc);color:var(--acc)} }
.hbtn.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.hbtn .sm{display:none}

/* ── the bottom tab bar ──
   The top dock is six small targets in a row, which is fine with a mouse and
   hopeless with a thumb. On a phone the same six become a bar at the bottom,
   inside reach and above the home indicator. It is a flex child of the column
   rather than a fixed overlay, so nothing has to guess its height. */
#tabs{display:none}
@media (max-width:820px){
  header nav{display:none}
  .clock{display:none}
  .hbtn .lg{display:none}
  .hbtn .sm{display:inline}
  #tabs{
    display:flex;flex:0 0 auto;background:var(--panel);
    box-shadow:var(--e-3),var(--rim);
    padding-bottom:var(--safe-b,0px);
  }
  /* Equal shares, never less than a label: with SHEET the bar holds eight,
     and `flex:1` alone kept each button as wide as its word, so the row ran
     to 460px on a 390px phone and SPEAK was off the edge (2026-09-25). A
     two-word name wraps rather than widening its button. */
  #tabs button{
    flex:1 1 0;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;color:var(--dim2);
    font-family:var(--f1);font-size:9.5px;font-weight:var(--w-bold,700);letter-spacing:.06em;
  }
  #tabs button{white-space:normal;text-align:center;line-height:1.15}
  #tabs button .g{font-size:18px;line-height:1}
  /* a label may use the whole button; the 44px target is the button's height */
  #tabs button{padding-left:1px;padding-right:1px}
  #tabs button .lb{display:block;width:100%;text-align:center}
  #tabs.plainfont button .lb{font-family:system-ui,-apple-system,sans-serif}
  /* the reading colour, as on the desk dock: the accent over the app's tint
     measured 3.96 to 1 on Slab */
  #tabs button.on{color:var(--txt)}
  #tabs button.dead{opacity:.4}
  #home{padding:var(--s-3,12px) var(--s-3,12px) var(--s-6,32px)}
}

/* ---------- stage ---------- */
#stage{flex:1;position:relative;min-height:0}
#home{position:absolute;inset:0;overflow:auto;padding:14px 14px 60px}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frame.hide{display:none}

/* ---------- widget grid ---------- */
#grid{
  /* dense: a widget fills the first hole it fits, so a short card beside a
     tall one does not leave an empty band under it. Tom, 2026-09-14: "why is
     there an awkward space between day log and weight?" */
  display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:row dense;gap:var(--gap);
  /* Tom, 2026-09-17, pointing at the space under CLOCK: "Why am I unable to
     put widgets in this space?" Because a widget spanned COLUMNS and never
     rows, so it sat in exactly one grid row and that row was as tall as the
     tallest thing in it. The space under a short card was not an empty cell,
     it was the inside of an occupied one, and dense only ever backfilled
     holes ACROSS a row. The comment above claimed otherwise and was wrong.

     Rows are the unit --ch already counts in. One gap comes off each step so
     a card ends up the height it always was rather than growing by a gap per
     row. */
  grid-auto-rows:calc(var(--row, 84px) - var(--gap));
  /* Items fill the rows they span. `align-items:start` was right while every
     card carried its own pixel height; with spans it left a card sized to its
     text, so an empty TODO collapsed to one line inside five rows. */
  /* Tom, 2026-09-22: the grid fits any screen, so no cap on its width.
     The row height is set by fitGrid to fill the window's height. */
  margin:0;
}
/* auto rows on a phone: the desk's fixed row made every stacked card 72px
   tall with the rest of it cut off, from 1.0.23 until 1.0.34 */
@media(max-width:820px){ #grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:auto} }
/* ── a card stays where it was put ──
   Tom, 2026-09-22: "allow empty space". A card with a saved spot sits at it,
   and a gap it leaves stays a gap. Desk width only: on a phone the cards
   stack in the order of their spots. */
@media(min-width:821px){
  #grid{position:relative}
  .w.at{grid-column:var(--gx) / span var(--cw,4);grid-row:var(--gy) / span var(--ch,3)}
  #grid.gapon{cursor:pointer}
}
/* the empty patch under the pointer, and where a dragged card will land */
#gaphint{position:absolute;display:none;pointer-events:none;z-index:1;
  border:1px dashed var(--line2);border-radius:var(--radius-lg,14px);
  align-items:center;justify-content:center;color:var(--dim2)}
#gaphint.on{display:flex}
#gaphint.land{border-color:var(--acc);color:var(--acc)}
.w{
  grid-column:span var(--cw,4);
  /* The material layer (shared/THEMING.md, Material): a card carries
     `mb-card`, the dark glass BLOCK's lanes are; its rows carry `mb-plate`
     and --c, the colour of the block or of the app the widget draws for,
     set in drawHome. No background, border or shadow written here. */
  border-radius:var(--radius-lg,14px);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  /* auto / span N, not "span N": a single value sets the row START, which
     is not a span at all, and the declaration was quietly dropped. */
  grid-row:auto / span var(--ch,3);min-height:0;
}
/* On a phone a card is as tall as what is in it. A fixed height means either
   a scrollbar inside a scrolling page — two scrolls fighting over one finger —
   or a card that is mostly empty. */
@media(max-width:820px){ .w{grid-column:span 4;grid-row:auto;height:auto;min-height:0} .w.first{order:-1} }
.w:before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--acc-d),transparent);pointer-events:none}
.w.drag{opacity:.35;outline:1px dashed var(--acc)}
.w.over{outline:1px solid var(--acc)}
.w-head{
  display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-3) var(--s-2);flex:0 0 auto;
  font-family:var(--f1);font-size:var(--f-1,12px);font-weight:var(--w-bold,700);
  letter-spacing:.2em;color:var(--dim);
}
/* Only a mouse can drag by the title. On a touch screen that gesture and the
   page scroll are the same gesture, so the card is rearranged from the
   REARRANGE mode instead, with buttons that cannot be mistaken for a scroll. */
@media (hover:hover) and (pointer:fine){
  .w-head{cursor:grab}
  .w-head:active{cursor:grabbing}
}
/* Telling cards apart on a wide board (Tom, 2026-10-18, picked D): the
   title is bright and a step bigger, the card's colour is on its icon and a
   strip down the title's left edge (a chart colour is never a word colour:
   root Known traps), and the card sits a step lighter than the page's own
   panels, the material's own gradient on --surface-2. */
#grid > .w.mb-card{background:linear-gradient(180deg,color-mix(in srgb,var(--surface-2) var(--card-solid,100%),transparent),
  color-mix(in srgb,var(--surface-2) var(--card-solid-2,100%),transparent))}
#grid > .w > .w-head{color:var(--text-1,var(--ink));font-size:var(--f-2,14px);box-shadow:inset 3px 0 0 var(--c,var(--acc))}
.w-head .wic{display:inline-flex;flex:0 0 auto;color:var(--c,var(--acc))}
.w-head .wic svg{display:block}
.w-head .c{color:var(--acc);letter-spacing:.06em}
.w-head .sub{margin-left:auto;font-family:var(--f2);font-size:var(--f-1);letter-spacing:0;color:var(--dim2);white-space:nowrap}
/* The negative margin lets a 32px button sit in a head whose words are 16px
   tall without making it taller: the remove button that shows on hover used
   to push every card's contents down 16px as the pointer crossed it. */
.w-head .x,.w-head .mv{display:none;color:var(--dim2);font-size:15px;line-height:1;
  width:32px;height:32px;flex:0 0 auto;border-radius:var(--radius-sm,6px);background:var(--panel2);
  margin:calc(var(--s-2) * -1) 0}
/* Controls appear when you say you are rearranging, and not before. A control
   that only exists on hover does not exist at all on a phone. */
body.editing .w-head .x,body.editing .w-head .mv{display:block}
/* Every card's menu has a button you can see (pick 1, Tom 2026-10-13):
   right click and hold reach the same list, but a gesture is a shortcut,
   never the only way. Drawn small in the head, caught at 44 by mb-tap. */
.w-head .wdots{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:var(--s-6,32px);height:var(--s-6,32px);margin:calc(var(--s-2) * -1) calc(var(--s-1) * -1) calc(var(--s-2) * -1) 0;
  padding:0;border:0;background:transparent;color:var(--dim2);cursor:pointer;border-radius:var(--radius-sm,6px)}
.w-head .sub + .wdots{margin-left:0}
/* the line beside the title gives way to the menu button on a phone, onto
   two lines rather than past the card's edge */
@media(max-width:820px){ .w-head{white-space:nowrap} .w-head .sub{min-width:0;white-space:normal;text-align:right} }
body.editing .w-head .wdots{display:none}
@media (hover:hover) and (pointer:fine){ .w-head .wdots:hover{color:var(--txt);background:var(--panel2)} }
/* three buttons and the header line left a phone's title no room, so WEIGHT
   went onto three lines; while rearranging the line steps aside */
body.editing .w-head .sub{display:none}
body.editing .w-head button:first-of-type{margin-left:auto}
body.editing .w-head .x{color:var(--bad)}
body.editing .w{box-shadow:var(--e-3),0 0 0 1px var(--acc)}
@media (hover:hover) and (pointer:fine){
  .w:hover .w-head .x{display:block;opacity:.6}
  .w-head .x:hover{opacity:1;color:var(--bad)}
}
/* A scrolling box inside a scrolling page means two scrolls arguing over one
   finger, and the inner one always wins by accident. On a phone the card is
   as tall as its contents instead, so there is only ever one thing to scroll.
   With a mouse and a fixed-height card the inner scroll is fine. */
/* ── why a widget was scrolling ──
   Tom, 2026-09-06: "why does it have scrolling?" and "why is the 199.9 almost
   out of border?" One cause. A chart keeps its shape, so its height follows
   its WIDTH - and a widget's height does not. Wide enough, and the chart grew
   until it pushed the numbers under it out of the box, which is what he saw:
   a scrollbar and a figure half off the bottom edge.

   A column that shares its height out. Anything that must be a fixed size says
   so, and the chart takes what is left rather than taking what it likes. */
.w-body{flex:1;padding:0 var(--s-3) var(--s-3);min-height:0;overflow:visible;
  display:flex;flex-direction:column;gap:var(--s-2)}
/* a card that sizes to its contents stops at the window and scrolls inside */
.w.capped .w-body{overflow:auto}
/* the zoom level, shown while Ctrl+scroll changes it, gone on the redraw */
.ztag{position:absolute;top:var(--s-2);right:var(--s-2);z-index:2;pointer-events:none;
  padding:var(--s-1) var(--s-2);border-radius:var(--radius-sm,6px);background:var(--surface-3);
  color:var(--text-1);font-family:var(--f1);font-size:var(--f-1);letter-spacing:.06em}
/* ── a widget shows less the smaller it is ──
   Tom, 2026-10-16: the board scales to the window (fitGrid), and "the
   widgets show up differently based on size". fitGrid marks each card
   s, m or l by its size in pixels. Small: the header tightens and loses its
   side note, a chart takes only the room left, and whatever still does not fit is left off
   whole (`sz-cut`, from cutCards) rather than cut in half or scrolled.
   Medium: a chart may be a shorter strip. Large is the widget as built. */
@media(min-width:821px){
  #grid > .w[data-sz=s] .w-head{padding:var(--s-2) var(--s-3) var(--s-1)}
  #grid > .w[data-sz=s] .w-head .sub{display:none}
  #grid > .w[data-sz=s] .w-body{overflow:hidden;gap:var(--s-1);padding-bottom:var(--s-2);container-type:size}
  #grid > .w[data-sz=s] .w-body > .fits{min-height:0}
  /* a card too short for its title shows only its answer; REARRANGE
     brings the title back, with its buttons and its drag */
  body:not(.editing) #grid > .w.sz-xs .w-head{display:none}
  body:not(.editing) #grid > .w.sz-xs .w-body{padding-top:var(--s-2)}
  #grid > .w[data-sz=s] .ckbig{font-size:min(var(--f-8),70cqh);line-height:1}
  #grid > .w[data-sz=m] .w-body > .fits{min-height:var(--s-7,48px)}
  #grid > .w .sz-cut{display:none !important}
}
/* A chart takes the room that is left, but never less than a readable strip:
   with the answer on top of it, a small widget left it no room at all. */
.w-body > .fits{flex:1 1 auto;min-height:var(--s-9,96px)}
.w-body > .fits > svg{width:100%;height:100%;display:block}
@media (hover:hover) and (pointer:fine){ .w-body{overflow:auto} }
/* BODY HEATMAP's two figures: one above the other, or side by side,
   whichever draws them bigger in the box. Standing and Double biceps are
   tall and narrow, so they go side by side much sooner than Vitruvian. A
   phone card is as tall as its contents, so there nothing is measured:
   the tall poses sit side by side and Vitruvian stacks. */
.bh-fig{display:flex;align-items:center;justify-content:center}
/* the figure beside its list at a desk; on a phone the list goes under it,
   or the figures shrank to a sliver and every row wrapped */
.bh-wrap{display:flex;gap:var(--gap);height:100%;min-height:0;align-items:stretch}
.bh-wrap>.bh-fig{flex:1 1 55%;min-width:0}
.bh-side{flex:1 1 45%;min-width:0;overflow:auto}
@media (max-width:820px){ .bh-wrap{flex-direction:column} .bh-wrap>.bh-fig,.bh-side{flex:0 0 auto;overflow:visible} }
.bh-pair{display:flex;flex-direction:column;gap:var(--s-1);width:100%}
.bh-pair svg{display:block;width:100%;height:auto}
.bh-pair.bh-p-stand,.bh-pair.bh-p-flex{flex-direction:row;align-items:flex-start}
/* in a row each figure takes its drawing's width (`--bw`), so front, side
   and back come out at one scale; the side view is the narrow one */
.bh-pair.bh-p-stand svg,.bh-pair.bh-p-flex svg{flex:var(--bw,1) 1 0;min-width:0}
.bh-pair.bh-p-vitruvian .bh-sv{width:22%;align-self:center}
.row .bh-dot{flex:0 0 auto;width:var(--s-2);height:var(--s-2);border-radius:var(--radius-full,999px)}
.row.bh-row{flex-wrap:wrap;row-gap:0}
.row .bh-rec{margin-left:auto;display:inline-flex;align-items:center;justify-content:flex-end;min-width:5ch;gap:var(--s-1);
  font-family:var(--f1);font-size:var(--f-1);letter-spacing:.06em;color:var(--dim2)}
@media (min-width:821px){
  .bh-fig{container-type:size}
  .bh-pair{height:100%}
  .bh-pair svg{flex:1 1 0;min-width:0;min-height:0;height:100%}
  .bh-pair.bh-p-stand,.bh-pair.bh-p-flex{flex-direction:column;align-items:stretch}
  .bh-pair.bh-p-stand svg,.bh-pair.bh-p-flex svg,.bh-pair.bh-p-vitruvian .bh-sv{flex-grow:1;width:100%}
  /* three figures across, the side view among them: where a row beats a
     column moved with it (stand 0.38, double biceps 0.49) */
  @container (orientation: landscape){ .bh-pair{flex-direction:row}
    .bh-pair.bh-p-vitruvian svg,.bh-pair.bh-p-vitruvian .bh-sv,.bh-pair.bh-p-stand svg,.bh-pair.bh-p-flex svg{flex-grow:var(--bw)} }
  @container (min-aspect-ratio: 2/5){ .bh-pair.bh-p-stand{flex-direction:row} .bh-pair.bh-p-stand svg{flex-grow:var(--bw)} }
  @container (min-aspect-ratio: 1/2){ .bh-pair.bh-p-flex{flex-direction:row} .bh-pair.bh-p-flex svg{flex-grow:var(--bw)} }
}
/* Resize is a mouse affordance and nothing else — a phone card is as wide as
   the screen and as tall as its contents, so there is nothing to resize. */
.w-size{display:none}
@media (hover:hover) and (pointer:fine){
  .w-size{
    display:block;position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;opacity:0;
    background:linear-gradient(135deg,transparent 46%,var(--line2) 46%,var(--line2) 54%,transparent 54%,transparent 70%,var(--line2) 70%,var(--line2) 78%,transparent 78%);
  }
  .w:hover .w-size{opacity:1}
}
.w-size:hover{background:linear-gradient(135deg,transparent 46%,var(--acc) 46%,var(--acc) 54%,transparent 54%,transparent 70%,var(--acc) 70%,var(--acc) 78%,transparent 78%)}
/* an app in a card: its frame sits over the card's body, in a layer of its
   own outside the grid (placeCards), with the card's edge left showing round
   it and the resize corner clear of it */
#cardframes{position:absolute;left:0;top:0;width:0;height:0;z-index:2}
.cardframe{position:absolute;border:0;background:var(--bg);border-radius:var(--radius-md,8px)}
.cardframe.off{display:none}
body.dragging .cardframe{pointer-events:none}
/* the landing outline (#gaphint, z-index 1) shows over a frame while a card moves */
body.dragging #cardframes{z-index:0}
.w-body.appslot{padding:0 var(--s-2) var(--s-3)}
/* a whole row that is one button: a food to log, an activity to tick */
.row.qpick{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border:0}
.row.qpick .chk{display:flex;align-items:center;justify-content:center;pointer-events:none}
.qline{font-size:var(--f-1);color:var(--dim)}
.qunit{font-size:var(--f-1);color:var(--dim2)}
#ghost{position:fixed;pointer-events:none;z-index:80;opacity:.9;border:1px solid var(--acc);border-radius:var(--radius-lg,12px);background:var(--panel2);box-shadow:var(--e-5);display:none}
#ghost .w-head{color:var(--acc)}
.empty{color:var(--dim2);font-size:var(--f-1);line-height:1.7}
.empty b{color:var(--dim)}
.link{color:var(--acc);cursor:pointer;border-bottom:1px dotted var(--acc-d)}
/* a word in a sentence, with a finger's worth of target round it */
.empty .link{position:relative;display:inline-block}
.empty .link::after{content:'';position:absolute;left:50%;top:50%;width:max(100%,var(--tap,44px));
  height:var(--tap,44px);transform:translate(-50%,-50%)}

/* ---------- shared widget bits ---------- */
.rowlist{display:flex;flex-direction:column;gap:5px}
/* a row is a plate in its own colour, the way a block is in BLOCK: drawHome
   puts mb-plate on it, and --c is the block's colour or the widget's app's */
.row{display:flex;align-items:center;gap:10px;padding:8px 9px;min-height:var(--tap,44px);
  border-radius:var(--radius-md,10px);position:relative}
@media (hover:hover) and (pointer:fine){ .row:hover{background:var(--surface-3)} }
.row .bar{position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--acc)}
/* at least 60px so times line up, wider when the theme's font is wide (A4,
   2026-10-05: Press Start 2P ran "10:45pm" into the name beside it) */
.row .t{font-family:var(--f1);font-size:var(--f-1);letter-spacing:.06em;color:var(--dim);min-width:60px;white-space:nowrap;flex:0 0 auto;padding-left:8px}
/* the column is there so times line up; a list with no time in it has none */
.rowlist:not(:has(.t:not(:empty))) > .row > .t{display:none}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a name and the figure that goes with it, the figure in its own column.
   From its own width, not from nothing: a row that wraps (BODY HEATMAP's)
   puts what does not fit on the next line rather than cutting the name. */
.row .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{flex:0 0 auto;font-family:var(--f1);font-size:var(--f-2);color:var(--dim);font-variant-numeric:tabular-nums}
.row .rt.rec{color:var(--txt)}
/* LINKS: an app's icon in front of its name */
.row .lic{flex:0 0 auto;display:flex;color:var(--c,var(--dim))}
/* A bullet on the home screen is the same bullet as everywhere else: the mark
   in a .k, the words in a .tx, both dressed by shared/journal.js. The widget
   only says how much room each gets inside a card this narrow. */
/* One line of words, so the row is the mark's 44px and everything sits on
   its middle: top-aligned with the row's own padding round it, a bullet row
   was 64px with its box 13px below the words. */
.row.mb-bullet{align-items:center;padding-top:0;padding-bottom:0}
.row.mb-bullet .k{flex:0 0 auto;background:none;border:0;padding:0;
  min-width:var(--tap,44px);min-height:var(--tap,44px);display:flex;align-items:center;
  justify-content:center;color:var(--dim);cursor:pointer}
.row.mb-bullet button.k:hover{color:var(--acc)}
/* a mark that ticks nothing is a span: no pointer, no hover, no hit area */
.row.mb-bullet span.k{cursor:default}
.row.mb-bullet span.k::after{content:none}
.row.mb-bullet .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* IDEAS and EVENTS: the words wrap, a little air above and below a second line */
.row.mb-bullet.wraps .tx{white-space:normal;padding-block:var(--s-1)}
.row .d{font-size:var(--f-1);color:var(--dim2);font-family:var(--f1);letter-spacing:.06em;flex:0 0 auto}
/* MEALS: what a meal was is the point of the row, so not the faintest text */
.row .d.kc{color:var(--dim);font-variant-numeric:tabular-nums}
.row.done{opacity:.5}
/* LINKS: the open-in-a-new-tab button on a link row. A full 44px target that
   does not make the row 60px tall — the negative margins eat the row's own
   padding, so the button fills the row rather than stretching it. */
.row .lopen{flex:0 0 auto;width:var(--tap,44px);height:var(--tap,44px);margin:-8px -9px -8px 0;
  display:flex;align-items:center;justify-content:center;
  background:none;border:0;color:var(--dim2);cursor:pointer;border-radius:var(--radius-md,10px)}
@media (hover:hover) and (pointer:fine){ .row .lopen:hover{color:var(--acc);background:var(--surface-3)} }
.mb-group .lwhere{color:var(--dim2);letter-spacing:0;text-transform:none;font-family:var(--f1)}
/* a group heading inside a card is capitals, whichever card it is in */
.w-body .mb-group{text-transform:uppercase}

/* ── the now band ──
   The one line that answers "what am I doing", above the list rather than in
   it. Everything here is a token: this is the home screen's own CSS and a hex
   code would be a theme that works in exactly one skin. */
.nowband{display:flex;align-items:center;gap:10px;position:relative;
  padding:10px 12px;margin-bottom:10px;border-radius:var(--radius-md);
  background:var(--panel2);border:1px solid var(--line)}
.nowband.live{border-color:var(--acc)}
.nowband .nlab{font-size:var(--f-1);letter-spacing:.16em;color:var(--dim);
  text-transform:uppercase;white-space:nowrap}
.nowband .nlab i{display:block;font-style:normal;letter-spacing:0;
  font-size:var(--f-1);color:var(--acc);margin-top:2px}
.nowband .nname{flex:1;min-width:0;font-size:15px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis}
.nowband .nname b{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:400}
.nowband .nchk{flex:none;width:var(--tap,44px);height:var(--tap,44px);
  border-radius:var(--radius-md);border:1px solid var(--line);
  background:transparent;color:var(--acc);font-size:16px;cursor:pointer}

/* Where you are in the list, and what you have slipped past. `late` is a mark,
   not a colour change - being behind should be visible, not loud. */
.row.here{border-color:var(--acc)}
/* A link on a row is underlined rather than coloured: colour on these rows
   already means which lane a block belongs to. */
.rlink{color:inherit;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--acc)}
.tidy{display:block;width:100%;margin-top:8px;padding:8px;background:transparent;
  border:0;border-top:1px solid var(--line);color:var(--dim);font:inherit;
  font-size:var(--f-1);letter-spacing:.06em;text-align:center;cursor:pointer;
  min-height:var(--tap,44px)}
.row.late:not(.done) .t{color:var(--warn,var(--acc));opacity:.9}
/* EVERY & ANYTIME: an owed block says so in the same colour */
.row.owed:not(.done) .d{color:var(--warn,var(--acc))}
.row.done .n{text-decoration:line-through;text-decoration-color:var(--dim2);color:var(--dim)}
.chk{width:26px;height:26px;flex:0 0 auto;border:2px solid var(--dim2);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;
  transition:background-color var(--dur-fast,140ms) var(--ease-out,ease),
    border-color var(--dur-fast,140ms) var(--ease-out,ease),color var(--dur-fast,140ms)}
/* The circle stays small; the thing a finger or pointer hits is 44px. */
.chk{position:relative;cursor:pointer;padding:0;background:transparent}
/* the inset counts from inside the 2px border, so the border comes off too */
.chk::after{content:'';position:absolute;inset:calc((var(--tap,44px) - 26px) / -2 - 2px)}
@media (hover:hover) and (pointer:fine){ .chk:hover{border-color:var(--acc)} }
.chk.on{background:var(--acc);border-color:var(--acc);color:var(--accent-fg)}
/* TODAY's todo wears the journal's box, the one UPCOMING, STATUS and QUESTS
   draw, in the round box's place; the round one is BLOCK's block */
.chk.jk,.chk.jk.on{border-color:transparent;background:transparent;color:var(--dim)}
.chk.jk.on{color:var(--dim2)}
.chk.jk.on .nm-box{background:currentColor}
@media (hover:hover) and (pointer:fine){ .chk.jk:hover{border-color:transparent;color:var(--acc)} }
/* TODAY: an entry, event or idea's mark, in the box's column (the box's own
   width, so the times line up) */
.row .kmark{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.tag{font-size:var(--f-1);font-family:var(--f1);letter-spacing:.1em;color:var(--dim2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 var(--s-1)}
.ringwrap{display:flex;align-items:center;gap:16px;margin-bottom:11px}
.ring{position:relative;width:70px;height:70px;flex:0 0 auto}
/* the ring itself comes from shared/chart.js, already turned to start at twelve o'clock */
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--f1);font-size:var(--f-3);letter-spacing:.04em;color:var(--acc)}
.ring .num i{font-style:normal;font-size:var(--f-1);color:var(--dim2);letter-spacing:.14em}
/* boxes, so a step apart rather than 16px: padded, TRAINING's four ran onto
   a second line at a phone's width */
.stats{display:flex;gap:var(--s-2);flex-wrap:wrap}
/* ── the desk tools and the newer widgets (2026-09-25): tokens only ── */
.tface{font-family:var(--f1);font-size:var(--f-7);letter-spacing:.04em;color:var(--txt);line-height:var(--lh-tight);font-variant-numeric:tabular-nums}
.tface.idle{color:var(--dim2)}
.tface.live{color:var(--acc)}
.tface small{font-size:var(--f-2);color:var(--dim);letter-spacing:.06em}
.tbig{font-family:var(--f1);font-size:var(--f-4);color:var(--txt);letter-spacing:.04em;line-height:var(--lh-tight)}
.tsub{font-size:var(--f-1);color:var(--dim);line-height:var(--lh-body)}
.tphase{font-family:var(--f1);font-size:var(--f-1);letter-spacing:.2em;color:var(--dim2)}
.tphase.on{color:var(--acc)}
.tbar{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}
.tbtn{font-family:var(--f1);font-size:var(--f-1);letter-spacing:.1em;color:var(--dim);background:transparent;
  border:1px solid var(--line2);border-radius:var(--radius-md,6px);padding:var(--s-1) var(--s-3);cursor:pointer;
  min-height:var(--tap,44px);   /* drawn 44 tall, not only caught at 44 (pick 3, Tom 2026-10-13) */
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-1);flex:0 0 auto}
.tbtn:hover{color:var(--txt);border-color:var(--dim2)}
.tbtn.go{color:var(--acc);border-color:var(--acc)}
.laps{display:flex;flex-direction:column;gap:var(--s-1);font-size:var(--f-1);flex:1 1 auto;min-height:0;overflow:auto}
.lap{display:flex;gap:var(--s-3);align-items:baseline;font-variant-numeric:tabular-nums;color:var(--dim)}
.lap span{font-family:var(--f1);letter-spacing:.1em;color:var(--dim2);flex:1}
.lap b{color:var(--txt);font-weight:400}
.lap i{font-style:normal;color:var(--dim2)}
.row .abig{font-family:var(--f1);font-size:var(--f-3);color:var(--txt);letter-spacing:.04em;flex:0 0 auto;min-width:6ch;font-variant-numeric:tabular-nums}
.row .abig small{font-size:var(--f-1);color:var(--dim2);margin-left:var(--s-1)}
.srv{font-style:normal;font-size:var(--f-1);color:var(--dim2);margin-left:var(--s-1)}
.srv.blk{display:block;margin-left:0}
.dayrow{display:flex;gap:var(--s-1);flex-wrap:wrap}
.meterw{display:flex;flex-direction:column;gap:var(--s-1)}
.mline{display:flex;justify-content:space-between;gap:var(--s-2);font-size:var(--f-1)}
.yeargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--s-3),1fr));gap:calc(var(--s-1) / 2)}
@media(max-width:820px){.yeargrid{grid-template-columns:repeat(auto-fill,minmax(var(--s-2),1fr))}}
.yeargrid i{display:block;aspect-ratio:1;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 var(--border-width,1px) var(--line2)}
.yeargrid i.on{background:var(--acc);box-shadow:none}
.yeargrid i.now{background:var(--txt);box-shadow:none}
.mline span{font-family:var(--f1);letter-spacing:.14em;color:var(--dim2);text-transform:uppercase}
.mline b{font-family:var(--f1);font-weight:400;color:var(--txt);font-variant-numeric:tabular-nums}
.meter{height:var(--s-2);border-radius:var(--radius-sm,3px);background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--acc))}
.bline{display:flex;gap:var(--s-2);align-items:baseline;font-size:var(--f-2);line-height:var(--lh-body);color:var(--txt)}
.bline i{flex:0 0 auto;width:var(--s-1);height:var(--s-1);border-radius:50%;background:var(--acc);transform:translateY(-2px)}
.bline.plain{color:var(--dim)}
.rpart{display:flex;flex-direction:column;gap:var(--s-1)}
.rpart>.mb-group{margin:0}
.rtext{font-size:var(--f-2);line-height:var(--lh-body);color:var(--txt)}
.ringline{font-size:var(--f-4);color:var(--txt);line-height:var(--lh-body)}
.calhead{display:flex;align-items:center;gap:var(--s-2)}
.calhead b{flex:1;text-align:center;font-family:var(--f1);font-size:var(--f-1);letter-spacing:.16em;color:var(--txt);font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s-1)}
.cal .dw{font-family:var(--f1);font-size:var(--f-1);color:var(--dim2);text-align:center}
.cal .cd{position:relative;background:transparent;border:1px solid transparent;border-radius:var(--radius-md,6px);
  color:var(--txt);font-family:var(--f1);font-size:var(--f-1);min-height:var(--tap,44px);cursor:pointer;font-variant-numeric:tabular-nums}
.cal .cd.out{color:var(--dim2)}
.cal .cd.now{color:var(--acc);border-color:var(--line2)}
.cal .cd.pick{border-color:var(--acc)}
.cal .cd i{position:absolute;left:50%;bottom:var(--s-1);width:var(--s-1);height:var(--s-1);margin-left:calc(var(--s-1) / -2);border-radius:50%;background:var(--acc)}
/* a theme may draw a stat as a bordered box and may not pad it, so the
   padding is here: without it the words sat 1px from the border */
.stat{padding:var(--s-1) var(--s-2);border-radius:var(--radius-md,6px)}
.stat b{display:block;font-family:var(--f1);font-size:var(--f-5);color:var(--txt);letter-spacing:.04em;line-height:1.15}
/* its own tight line, so the padding above does not make a box taller than
   it was: TRAINING BLOCK, a card that sizes to its contents, went from two
   rows to three for 1px */
.stat span{display:block;line-height:var(--lh-tight);font-size:var(--f-1);letter-spacing:.14em;color:var(--dim2);font-family:var(--f1)}
.stat.acc b{color:var(--acc)}
/* WEIGHT's 7-day average line, drawn over the weigh-ins in the reading colour */
.mb-line.w-avg{stroke:var(--txt);stroke-width:2.5}
/* CONSISTENCY as four big numbers, two by two (Tom, 2026-10-18, picked
   mockup 1: "I don't need to see fraction anymore, just data as clear as
   possible"): the label quiet, the number as big as the tile allows with
   its unit beside it, and one line under it, the change against the
   stretch before. Tiles meet on a hairline, the grid's own gap. */
.lc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:var(--border-width,1px);
  background:var(--line);height:100%;border-radius:var(--radius-sm,6px);overflow:hidden}
.lc-t{background:var(--surface-2,var(--panel));padding:var(--s-3);display:flex;flex-direction:column;justify-content:center;gap:var(--s-1);min-width:0;
  container-type:size}
.lc-t:only-child,.lc-t:nth-child(3):last-child{grid-column:1 / -1}
.lc-l{font-family:var(--f1);font-size:var(--f-1);letter-spacing:.14em;color:var(--dim)}
/* the number grows with its tile, from the scale's 20 to its 48 */
.lc-v{font-family:var(--f1);font-size:clamp(var(--f-5),min(16cqi,34cqb),var(--f-9));color:var(--txt);line-height:var(--lh-tight);font-variant-numeric:tabular-nums;
  overflow-wrap:normal}
.lc-v.nil{color:var(--dim2)}
/* the unit stays beside the number while it fits and drops under it when
   it does not, rather than the number being cut */
.lc-u{font-family:var(--f2);font-size:var(--f-2);color:var(--dim);letter-spacing:0;white-space:nowrap;display:inline-block}
.lc-d{display:flex;align-items:center;gap:var(--s-1);font-family:var(--f1);font-size:var(--f-2);color:var(--dim2);font-variant-numeric:tabular-nums;white-space:nowrap}
.lc-d.up{color:var(--success)}
.lc-d.dn{color:var(--danger)}
.lc-d.flat{color:var(--txt)}
.lc-d svg{flex:0 0 auto}
#grid > .w[data-sz=s] .lc-v{font-size:var(--f-4)}
@media (max-width:820px){ .lc{height:auto} .lc-t{container-type:normal} .lc-v{font-size:var(--f-7)} }
.hrow{display:flex;align-items:center;gap:10px;padding:6px 2px}
.hrow+.hrow{border-top:1px solid var(--line)}
/* DRINKS: a drink is a row you tap to open ELEMENT over the home screen */
.row.drink{cursor:pointer;align-items:flex-start}
.row.weigh{align-items:flex-start}
.row.drink .n,.row.weigh .n{white-space:normal}
.row.drink .n small,.row.weigh .n small{display:block;color:var(--dim2);font-size:var(--f-1);font-family:var(--f1);letter-spacing:.06em;margin-top:var(--s-1)}
.row.drink .dl,.row.weigh .dl{display:block;margin-top:var(--s-1);font-size:var(--f-1);color:var(--dim)}
.row.drink .dl i,.row.weigh .dl i{font-style:normal;color:var(--txt);font-variant-numeric:tabular-nums}
/* WORK DONE */

<body>
<div id="wrap">
  <header>
    <!-- What this screen is, said plainly. It is the thing you land on and
         pick an app from; "LifeOS" was a project name, not a label. -->
    <div class="logo" onclick="go('home')"><span class="mark">◈</span><span class="wm">MAIN <b>MENU</b></span></div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <div class="clock"><b id="cDate">—</b><span id="cSub">—</span></div>
    <button class="hbtn mb-press mb-tap" id="btnWidget" title="Add a widget to the home screen"><span class="lg">+ WIDGET</span><span class="sm" id="wIco"></span></button>
    <button class="hbtn mb-press mb-tap" id="btnData" title="Backup, restore and export your data"><span class="lg">DATA</span><span class="sm" data-icon="backup" data-icon-size="16"></span></button>
  </header>
  <main id="stage">
    <section id="home" class="mb-scroll"><div id="grid"></div><div id="cardframes"></div></section>
    <div id="over" role="dialog" aria-modal="true"></div>
  </main>
  <!-- the same six apps as the top dock, where a thumb can reach them -->
  <nav id="tabs" aria-label="Apps"></nav>
</div>
<div id="ghost"></div>
<div id="modal"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<input type="file" id="xlsxIn" accept=".xlsx,.xls,.xlsm" style="display:none">

<script>
/* ══════════════════════════ LIFEOS KERNEL v2 ══════════════════════════
   Copied into block/index.html. There is no sync script: the two copies are
   kept the same by hand, so change both and compare them with a diff.

   v1 kept the shared state as ONE JSON blob and broadcast it whole, with the
   shell as the single writer and a postMessage broker underneath. That is the
   shape the brief forbids and the shape SystemOS died of, so v2 is a thin view
   over `shared/records.js` instead:

     activities → one `activity` row each
     habits     → one `habit` row each
     ticks      → one `tick` row per activity per day
     today      → one dated `plan` row, published by whoever owns the schedule

   Every app now writes directly. There is no broker and no hosted/solo split,
   because every app on this origin reads and writes the same rows. What remains
   is a nudge: frames opened from a folder do not reliably get storage events, so
   a writer tells its neighbours to look again. It sends no data.

   The API is unchanged from v1 on purpose — the apps did not have to move.

   Load order in the page, before this block:
     shared/day.js  then  shared/records.js
   (written without tags on purpose: a literal closing script tag inside an
    inline script ends the script element, even inside a comment)
                                                                            */
window.LifeOS = (function () {
  if (!window.Rec || !window.Day) {
    console.error('[lifeos] records.js and day.js must load first');
    return { broken: 1, ready: function () {}, on: function () { return function () {}; },
             doc: function () { return { activities: {}, habits: {}, log: {}, today: null }; },
             isDone: function () { return false; }, dayLog: function () { return {}; },
             done: function () { return Promise.resolve(); }, acts: function () { return Promise.resolve(); } };
  }

  const HOSTED = (function () { try { return !!(window.parent && window.parent !== window); } catch (e) { return false; } })();
  let doc = null, subs = [], booted = false, bootQ = [];

  /* ─── the view: rows assembled into the shape the apps already expect ─── */
  function build() {
    const d = { v: 2, ts: Date.now(), activities: {}, habits: {}, log: {}, today: null };
    Rec.all('activity').forEach(r => { d.activities[r.key] = Object.assign({ id: r.key }, r.payload); });
    Rec.all('habit').forEach(r => { d.habits[r.key] = Object.assign({ id: r.key }, r.payload); });
    /* the row carries the time now, but callers still expect payload.ts */
    Rec.all('tick').forEach(r => {
      (d.log[r.date] || (d.log[r.date] = {}))[r.key] =
        Object.assign({ ts: Date.parse(r.updated_at) || 0 }, r.payload);
    });
    d.today = Rec.get('plan', Day.today(), 'routine');
    return d;
  }
  function refresh() {
    doc = build();
    if (!booted) { booted = true; bootQ.splice(0).forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } }); }
    subs.forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } });
  }

  /* ─── neighbours ───
     Same storage, but a frame loaded from a folder may never see the storage
     event. A write pokes everyone else; they re-read for themselves. */
  function poke() {
    const msg = { lifeos: 2, poke: 1 };
    try { if (HOSTED) window.parent.postMessage(msg, '*'); } catch (e) {}
    document.querySelectorAll('iframe').forEach(f => { try { f.contentWindow.postMessage(msg, '*'); } catch (e) {} });
  }
  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || m.lifeos !== 2 || !m.poke) return;
    Rec.reload();
    /* pass it on once, so a frame's sibling hears about it too */
    if (!m.relay) {
      const on = { lifeos: 2, poke: 1, relay: 1 };
      try { if (HOSTED && e.source !== window.parent) window.parent.postMessage(on, '*'); } catch (err) {}
      document.querySelectorAll('iframe').forEach(f => { try { if (f.contentWindow !== e.source) f.contentWindow.postMessage(on, '*'); } catch (err) {} });
    }
  });
  /* On a served address records.js's channel already carried the rows to
     every neighbour, and a poke made each one re-read the whole store. */
  const wrote = v => { if (!Rec.channel) poke(); return Promise.resolve(v); };

  /* ─── one-time move off the v1 blob ───
     Copies, never moves: `lifeos_v1` is left exactly where it is, so the old
     data is its own backup if anything here is wrong. */
  function migrate() {
    if (Rec.setting('lifeos', 'migrated')) return 0;
    let old = null;
    try { old = JSON.parse(localStorage.getItem('lifeos_v1')); } catch (e) {}
    let n = 0;
    if (old && old.v) {
      Object.keys(old.activities || {}).forEach(id => {
        const a = old.activities[id];
        Rec.set('activity', null, id, { name: a.name, cat: a.cat || '', dur: a.dur || 0, color: a.color || '', energy: a.energy || 2 }); n++;
      });
      Object.keys(old.habits || {}).forEach(id => { Rec.set('habit', null, id, old.habits[id]); n++; });
      Object.keys(old.log || {}).forEach(date => {
        const day = old.log[date] || {};
        Object.keys(day).forEach(k => { Rec.set('tick', date, k, day[k]); n++; });
      });
      console.info('[lifeos] moved ' + n + ' things off the old blob; lifeos_v1 left in place as a backup');
    }
    Rec.setting('lifeos', 'migrated', new Date().toISOString());
    return n;
  }

  const API = {
    v: 2,
    hosted: HOSTED,
    day: d => Day.of(d), slug: s => Day && String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x',
    shift: (date, n) => Day.shift(date, n),
    ready(fn) { booted ? fn(doc) : bootQ.push(fn); },
    doc: () => doc || (doc = build()),
    on(f) { subs.push(f); if (booted) f(doc); return () => { const i = subs.indexOf(f); if (i > -1) subs.splice(i, 1); }; },

    /** upsert activities — the shared vocabulary */
    acts(list) {
      (list || []).forEach(a => {
        if (!a || !a.name) return;
        const id = a.id || API.slug(a.name);
        const prev = doc.activities[id] || {};
        Rec.set('activity', null, id, Object.assign({ name: a.name, cat: '', dur: 0, color: '', energy: 2 }, prev, a, { id: undefined }));
      });
      return wrote(doc);
    },
    act: id => (doc.activities[id] || null),

    /** the one tick, everywhere. One row: one activity, one day. */
    done(actId, date, on, meta) {
      if (!actId) return Promise.resolve(doc);
      const d = date || Day.today();
      if (on === false) Rec.del('tick', d, actId);
      else Rec.set('tick', d, actId, Object.assign({ src: '?' }, meta || {}));
      return wrote(doc);
    },
    /* True or false, never nothing. Rec.has answers `undefined` for a row that
       was never written, and three places in BLOCK compared that against a
       box's `false` with !==, so BLOCK wrote `undefined` onto every block with
       no row and switched its shared log off. BLOCK's copy fixed it first. */
    isDone: (actId, date) => !!Rec.has('tick', date || Day.today(), actId),
    dayLog: date => (doc.log[date || Day.today()] || {}),

    habit(h) { if (!h || !h.id) return Promise.resolve(doc); Rec.set('habit', null, h.id, Object.assign({ created: Day.today(), archived: false, cadence: { type: 'daily', days: [1, 1, 1, 1, 1, 1, 1], target: 7 } }, doc.habits[h.id], h)); return wrote(doc); },
    habitDel(id) { Rec.del('habit', null, id); return wrote(doc); },

    /** whoever owns the schedule publishes today's plan for everyone else */
    publishToday(t) { if (t && t.date) Rec.set('plan', t.date, 'routine', t); return wrote(doc); },

    /** local-only housekeeping: really drop ancient ticks, no tombstones */
    prune(days) { return Rec.purge('tick', Day.shift(Day.today(), -(days || 800))); },

    /** consecutive due-days ending today (today still counts as open, not broken) */
    streak(actId, cadence) {
      const due = d => (!cadence || cadence.type !== 'days') ? true : !!cadence.days[Day.dow(d)];
      let n = 0, d = Day.today(), guard = 0;
      if (!API.isDone(actId, d)) d = Day.shift(d, -1);
      while (guard++ < 900) {
        if (!due(d)) { d = Day.shift(d, -1); continue; }
        if (!API.isDone(actId, d)) break;
        n++; d = Day.shift(d, -1);
      }
      return n;
    },
    count(actId, n) {
      let c = 0, d = Day.today();
      for (let i = 0; i < (n || 30); i++) { if (API.isDone(actId, d)) c++; d = Day.shift(d, -1); }
      return c;
    },

    /** rows persist themselves; kept so v1 callers do not break */
    get persist() { return null; }, set persist(f) {},
    /** restore path: a v1-shaped doc becomes rows */
    _adopt(d) {
      d = d || {};
      Object.keys(d.activities || {}).forEach(id => Rec.set('activity', null, id, d.activities[id]));
      Object.keys(d.habits || {}).forEach(id => Rec.set('habit', null, id, d.habits[id]));
      Object.keys(d.log || {}).forEach(date => Object.keys(d.log[date]).forEach(k => Rec.set('tick', date, k, d.log[date][k])));
      if (d.today && d.today.date) Rec.set('plan', d.today.date, 'routine', d.today);
      poke(); refresh();
    },
    rows: () => Rec,
  };

  Rec.on(refresh);
  migrate();
  refresh();
  return API;
})();
/* ════════════════════════ END LIFEOS KERNEL ════════════════════════ */






/* ══════════════ the app roster ══════════════
   Adding an app to LifeOS is one entry here plus (if it wants to share data)
   the kernel block pasted into it. Nothing else in the shell knows their names. */
/* The order here is the default dock, set by Tom on 2026-09-14. Tom's own
   apps, flagged `mine`, come last and sit behind a line. */
const APPS = [
  /* An app's colour, which of the theme's six chart colours it wears in the
     dock, on its tile, on its widgets and on its iPhone icon, is APP_SLOT in
     shared/icons.js: one table, so the dock and the pictures cannot disagree. */
  /* `phone` is hard constraint 10 written down: which apps are for a thumb.
     The bottom bar is built from these and the top dock from all of them, so
     a phone shows STATUS, QUESTS, TRAIN, CHECK IN, NOTICE and SPEAK and not
     the desk work. Tom, 2026-09-17: "Main Menu on phone should only show
     Phone apps." HOME left the bar on 2026-10-21 (pick 5, Tom 2026-10-13):
     the logo in the header goes home, so the bar is eight apps, not nine. */
  { id: 'home',   nm: 'HOME',   ic: '◈', file: null,                ds: 'today, streaks, everything at a glance' },
  { id: 'block',  nm: 'BLOCK',  ic: '▦', file: 'block/index.html',  ds: 'build the day out of blocks',               shares: 'routine + ticks' },
  { id: 'status', nm: 'STATUS', ic: '◐', file: 'status/index.html', ds: 'sleep, weight, mood, food and money',        shares: 'the daily measurements', phone: 1 },
  { id: 'log',    nm: 'LOG',    ic: '▤', file: 'log/index.html',    ds: 'the journal, the last few weeks at a glance', shares: 'the journal' },
  { id: 'quest',  nm: 'QUESTS', ic: '◆', file: 'quest/index.html',  ds: 'todos, when they are due, and projects', shares: 'the journal todos', phone: 1 },
  { id: 'train',  nm: 'TRAIN',  ic: '⛭', file: 'train/index.html',  ds: 'the training log — sets, reps, records',     shares: 'the training log + ticks', phone: 1 },
  { id: 'checkin', nm: 'CHECK IN', ic: '◎', file: 'checkin/index.html', ds: 'photos, weight and how the week went', shares: 'weight, with STATUS', phone: 1 },
  { id: 'kitchen', nm: 'KITCHEN', ic: '▥', file: 'kitchen/index.html', ds: 'what is on the shelf, the week of meals, and what is short', shares: 'foods, meals and purchases', phone: 1 },
  { id: 'style',  nm: 'STYLE',  ic: '◧', file: 'style/index.html',  ds: 'pick, compare, edit and add themes',         shares: 'the themes every app wears' },
  { id: 'arc',    nm: 'ARC',    ic: '◇', file: 'arc/index.html',    ds: 'mind canvas — think, map, plan',            solo: 1, mine: 1 },
  { id: 'wealth', nm: 'WEALTH', ic: '▩', file: 'wealth/index.html', ds: 'clients, bills, pots and what is actually left', shares: 'spending and accounts', mine: 1 },
  { id: 'coach',  nm: 'COACH',  ic: '◉', file: 'coach/index.html',  ds: 'your clients in a box, their training, their first sets', shares: 'client training', mine: 1 },
  { id: 'forge',  nm: 'FORGE',  ic: '▦', file: 'forge/index.html',  ds: 'build a program of weeks and days, send it to a client', shares: 'programs, with COACH', mine: 1 },
  { id: 'form',   nm: 'FORM',   ic: '▶', file: 'form/index.html',   ds: 'side-by-side lift review',                  solo: 1, mine: 1 },
  { id: 'portion', nm: 'FOODDÉX', ic: '◪', file: 'portion/index.html', ds: 'a label in, the amounts you eat out', shares: 'the food library', mine: 1 },
  { id: 'sheet',  nm: 'SHEET',  ic: '◆', file: 'sheet/index.html',  ds: 'your feats from TRAIN and STATUS, as status windows', shares: 'reads training and the daily log', phone: 1 },
  { id: 'system', nm: 'NOTICE', ic: '▣', file: 'system/index.html', ds: 'text in, a status window out', mine: 1, phone: 1 },
  { id: 'speak',  nm: 'SPEAK',  ic: '◍', file: 'speak/index.html',  ds: 'talk to the camera, measured',               shares: 'ticks', mine: 1, phone: 1 },
  { id: 'mix',    nm: 'ELEMENT',    ic: '◉', file: 'mix/index.html',    ds: 'what to weigh out today, in grams',          shares: 'the food and the doses', mine: 1, nodock: 1 },
  { id: 'receipts', nm: 'RECEIPTS', ic: '▤', file: 'receipts/index.html', ds: 'a photo of a receipt, turned into rows', shares: 'spending and what was bought', mine: 1 },
];
const app = id => APPS.find(a => a.id === id);

/* ══════════════ the order of the dock ══════════════
   APPS above is the roster — which apps exist. This is the order you put them
   in, which is a different fact and yours rather than the file's.

   Stored as a list of ids, and always reconciled against the roster on the way
   out: an id for an app that no longer exists is dropped, and an app added to
   the roster later appears at the end rather than not at all. That is what
   stops a saved order from quietly hiding a new app.

   Saved under `dockOrder` since 2026-09-14, when Tom set a new default. An
   order saved before that was the old default rearranged, and left in charge
   it would have hidden the new one.

   The number on each button is its position, not its identity, so the keyboard
   shortcut always matches what you can see: 3 opens the third one along. */
function dockOrder() {
  const saved = Rec.setting('lifeos', 'dockOrder') || [];
  const known = {};
  APPS.forEach(a => known[a.id] = a);
  let out = [];
