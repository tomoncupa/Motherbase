/* ══════════════ the sheet mirror ══════════════
   One Google Sheet for the whole suite, one link, pasted once. shared/io.js
   carries the protocol and STATUS already has a panel for it. The home screen
   is here because it is the only place that can reasonably offer "all of them".

   It does not do the syncing itself. Which tabs an app has, and how one of its
   rows flattens into a line somebody can type into, live in that app's own
   registration — the shell has never run it and cannot guess. So the shell
   loads the app, asks it to sync itself, and counts the answers.

   Editing in the sheet is the point of the thing. Forty foods on a laptop
   keyboard beats forty on a phone, and the pull runs before the push, so what
   was typed there is read before anything is written back over it. */
function syncEveryApp() {
  const M = IO.mirror;
  if (!M.ready()) return toast(esc(M.why()), { bad: true, ms: 8000 });

  /* ARC and FORM keep their own storage by design and are not asked at all.
     Of the rest, only the ones actually on the shared drawer can answer, so
     ask first and sync whoever puts a hand up. Nothing here needs editing on
     the day BLOCK moves over — it will simply start answering. */
  const candidates = APPS.filter(a => a.file && !a.solo && !missing[a.id]);
  if (!candidates.length) return toast('Nothing to sync', { bad: true });
  toast('Syncing…');
  /* How long to wait for hands to go up. An app already open answers in
     milliseconds; one being loaded to be asked has to fetch and run its whole
     file first, and on his phone that is not instant. Being too quick here
     does not fail loudly — it quietly leaves an app out of the sheet — so the
     window is generous whenever anything had to be loaded. */
  const cold = candidates.some(a => !frames[a.id] || !frames[a.id].dataset.loaded);
  reach(candidates, { mb: 2, ping: 1 }, m => m.pong, cold ? 9000 : 3000, on => {
    if (!on.length) {
      return toast('None of the apps are on the shared drawer yet, so there is nothing to put in the sheet.',
        { bad: true, ms: 9000 });
    }
    pushToSheet(on, candidates.length);
  });
}

/* Ask a set of apps something, and call back with the ones that answered.
   Making the frame is part of asking: an app he has not opened today is not
   loaded, and an app that is not loaded cannot say anything. */
function reach(list, msg, keep, ms, then) {
  const said = {};
  let done = false;
  const heard = e => {
    const m = e.data;
    if (!m || m.mb !== 2 || !keep(m)) return;
    const a = list.find(x => frames[x.id] && frames[x.id].contentWindow === e.source);
    if (a) said[a.id] = m;
    if (Object.keys(said).length === list.length) finish();
  };
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    window.removeEventListener('message', heard);
    then(list.filter(a => said[a.id]).map(a => Object.assign({}, a, { said: said[a.id] })));
  };
  const timer = setTimeout(finish, ms);
  window.addEventListener('message', heard);
  list.forEach(a => {
    const f = frameFor(a.id);
    const ask = () => { try { f.contentWindow.postMessage(msg, '*'); } catch (e) {} };
    /* a frame made a moment ago has not run its scripts yet, and an app that
       has not registered cannot answer for itself */
    if (f.dataset.loaded) ask();
    else f.addEventListener('load', () => setTimeout(ask, 400), { once: true });
  });
}

/* the round trip itself, once we know who can do it */
function pushToSheet(on, asked) {
  toast('Syncing <b>' + on.length + '</b> apps…');
  reach(on, { mb: 2, sync: 1, full: 1 }, m => m.synced, 40000, res => {
    const ok = res.filter(a => a.said.ok);
    if (ok.length === on.length) {
      const extra = asked - on.length;
      toast('Synced <b>' + ok.length + '</b> apps into the sheet.' +
        (extra ? ' <b>' + extra + '</b> are not on the shared drawer yet and have nothing to send.' : ''));
      if (typeof Sfx !== 'undefined' && Sfx.play) Sfx.play('complete', { level: 2 });
      return;
    }
    /* Say the likely fix rather than the symptom. io.js works out which one
       the link itself points at, and they all share the one link, so the
       first app with an opinion is enough. */
    const why = (res.map(a => a.said).find(m => m && m.why) || {}).why;
    toast('Synced <b>' + ok.length + ' of ' + on.length + '</b>. ' +
      esc(why || 'The rest did not answer.'), { bad: true, ms: 9000 });
  });
}


/* The script that has to go in the sheet once. Generated by io.js so it cannot
   drift from the protocol it talks to, and copied in one tap: selecting twelve
   lines by hand on a phone is how two characters go missing and the error
   names a line rather than the cause. */
function copyMirrorScript() {
  const code = IO.mirror.script();
  const show = copied => UI.dialog({
    title: 'APPS SYNC SCRIPT', width: 560,
    body: b => {
      /* "Apps Script" inside the steps is Google's own menu, spelled their way
         so it can be found on screen. Ours is the Apps Sync Script, and the
         link it hands back is the personal sync code. Tom named both,
         2026-09-17.

         The steps were one run-on sentence of eight instructions. Somebody
         following it on a second screen loses their place at "then", so it is
         a numbered list they can count down. A setup that happens once is a
         setup, not the tour DOCTRINE law 10 forbids. */
      b.appendChild(el('div', 'lede', copied
        ? 'Copied. Now, in your sheet:' : 'Copy this, then in your sheet:'));
      const steps = el('ol', 'lede');
      steps.style.paddingLeft = 'var(--s-4)';
      ['<b>Extensions</b>, then <b>Apps Script</b>',
       'Select everything in the editor, delete it, paste, save',
       '<b>Deploy</b>, then <b>New deployment</b>',
       'The gear beside Select type, then <b>Web app</b>',
       'Execute as <b>me</b>, access <b>anyone</b>, then <b>Deploy</b>',
       'Allow it when Google asks',
       'Copy the link it gives you. That is your <b>personal sync code</b>',
       'Paste it into the box on the DATA panel',
      ].forEach(s => { const li = el('li'); li.innerHTML = s; steps.appendChild(li); });
      b.appendChild(steps);
      const t = el('textarea', 'mb-input');
      t.rows = 12; t.value = code; t.setAttribute('readonly', '');
      t.style.fontFamily = 'var(--font-mono, monospace)';
      b.appendChild(t);
      if (!copied) setTimeout(() => t.select(), 50);
    },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(code).then(() => show(true)).catch(() => show(false));
  else show(false);
}

/* the sheet's half of the DATA panel */
function mirrorSection(mo) {
  const cfg = IO.mirror.adopt('lifeos');
  mo.appendChild(el('div', 'mgroup', 'SYNC'));
  mo.appendChild(el('div', 'lede',
    'One sheet you own, holding a copy of every app, and what you type in it comes back. ' +
    'This is where mass edits belong: a real keyboard and forty rows at a time. ' +
    (cfg.at ? 'Last synced <b>' + esc(cfg.at) + '</b>.'
            : '<b style="color:var(--warn)">Never synced.</b> Paste your personal sync code below, then press sync.')));

  const u = el('input', 'mb-input');
  u.type = 'text';
  u.placeholder = 'https://script.google.com/macros/s/…/exec';
  u.value = cfg.url || '';
  /* on input, not change. change only fires when the box loses focus, and
     pasting a link then tapping sync closes the panel before that happens —
     so the link was silently never saved. */
  /* What gets pasted here is usually not a bare link: it comes out of Telegram
     with the rest of a message around it, or off Google with a newline on the
     end. IO.mirror.code takes the code out of whatever arrived, and the box
     shows what was actually saved rather than what was dropped on it. */
  u.oninput = () => {
    const found = IO.mirror.code(u.value);
    if (found && found !== u.value.trim()) u.value = found;
    IO.mirror.set({ url: found || u.value.trim() });
  };
  mo.appendChild(u);

  /* The switch that makes it stop being a button. With this on, every app on
     the shared drawer syncs itself: when it opens, half a minute after the
     last thing you log, and the moment you put the phone down. */
  mo.appendChild(UI.row('Keep the sheet up to date by itself',
    cfg.on ? 'On. Syncs on open, after you log something, and when you leave.'
           : 'Off. The sheet only changes when you press the button below.',
    UI.toggle(!!cfg.on, on => { IO.mirror.set({ on: on ? 1 : 0 }); toast(on ? 'The sheet will keep itself up to date.' : 'Automatic syncing off.'); })));

  [['⟳', 'Sync every app now', 'Reads the sheet first, then writes back everything, including the calendar views. The automatic ones only send what changed.', () => { IO.mirror.set({ url: u.value.trim() }); syncEveryApp(); }],
   ['⧉', 'Copy the Apps Sync Script', 'The bit that goes in the sheet once, before any of this works.', copyMirrorScript],
  ].forEach(([ic, t, d, fn]) => {
    const b = el('button', 'opt');
    b.innerHTML = '<span class="ic">' + ic + '</span><span class="t"><b>' + t + '</b><span>' + d + '</span></span>';
    b.onclick = fn; mo.appendChild(b);
  });
  /* LIVE SYNC, the Firebase paste box and sign-in. Every other app gets it
     through IO.syncRow; this panel draws its own sheet setup, so it never
     did until 2026-09-23. */
  if (IO.cloudRow) IO.cloudRow(mo, true);
}

/* ══════════════ bringing in an old spreadsheet ══════════════
   shared/import.js reads it; this asks which parts to bring in. Nothing is
   written until BRING IN, and the undo takes back exactly what came in. */
/* import.js, fetched on first use from beside io.js (so a client copy's
   stamp comes along) rather than on every open: 16 KB nobody uses daily. */
function needImport() {
  if (typeof Import !== 'undefined') return Promise.resolve(true);
  return new Promise(res => {
    const io = document.querySelector('script[src*="shared/io.js"]');
    const t = document.createElement('script');
    t.src = io ? io.src.replace(/io\.js/, 'import.js') : 'shared/import.js';
    t.onload = () => res(typeof Import !== 'undefined');
    t.onerror = () => { t.remove(); res(false); };
    document.head.appendChild(t);
  });
}
function importSheet(file) {
  needImport().then(ok => ok ? importRead(file) : toast('<b>import.js</b> is missing', { bad: true }));
}
function importRead(file) {
  toast('Reading <b>' + esc(file.name) + '</b>');
  Import.read(file).then(sheets => {
    const p = Import.plan(sheets);
    const unit = ((Rec.map('field').weight || {}).unit) || '';
    const kinds = [
      ['weights', 'Weigh-ins', unit ? 'Read as ' + unit : ''],
      ['ticks', 'Daily ticks', ''],
      ['foods', 'Foods', ''],
      ['spends', 'Spending', 'Money out only'],
    ];
    const pick = {};
    UI.dialog({
      title: 'BRING IN A SPREADSHEET', width: 520,
      body: b => {
        b.appendChild(el('p', null, esc(file.name)));
        kinds.forEach(([k, label, extra]) => {
          const n = p[k].length, kept = p.kept[k];
          pick[k] = n > 0;
          const note = (n ? n.toLocaleString() + ' new' + (p.span[k] ? ', ' + p.span[k] : '') : (kept ? 'All already here' : 'None found')) +
            (n && kept ? '. ' + kept.toLocaleString() + ' already here, left alone' : '') + (extra && n ? '. ' + extra : '');
          const t = UI.toggle(pick[k], on => { pick[k] = on; });
          if (!n) t.disabled = true;
          b.appendChild(UI.row(label, esc(note), t));
        });
        if (p.odd) b.appendChild(el('p', null, esc(p.odd.toLocaleString() + ' dated years away from the rest of their sheet, left out.')));
        if (p.skipped.length) b.appendChild(el('p', null, 'Not read: ' + esc(p.skipped.join(', '))));
      },
      actions: [
        { label: 'CANCEL' },
        { label: 'BRING IN', kind: 'go', fn: () => {
          const done = Import.apply(p, pick);
          if (!done.total) { toast('Nothing brought in'); return; }
          drawHome();
          UI.undo('<b>' + done.total.toLocaleString() + '</b> rows brought in', () => { done.undo(); drawHome(); });
        } },
      ],
    });
  }, e => toast(esc((e && e.message) || 'Could not read that file'), { bad: true }));
}

function dataPanel() {
  const mo = $('#modal'); mo.innerHTML = '';
  const n = daysSinceBackup();
  mo.appendChild(el('h3', null, 'DATA'));
  mo.appendChild(el('div', 'lede',
    'Data is stored locally. ' +
    (n === null ? '' :
     n === 0 ? 'Last backup: <b>today</b>.' : 'Last backup: <b>' + n + ' day' + (n === 1 ? '' : 's') + ' ago</b>.')));

  /* Export, import, sync, in that order, like every app's DATA tab. Tom,
     2026-09-15: "simply the data screen. Export, import, Sync". */
  mo.appendChild(el('div', 'mgroup', 'EXPORT'));
  const opts = [
    ['⭳', 'Back up everything', 'One JSON file: every row of every app, and each app’s look. Restore it here or in any app.', backupAll],
  ];
  opts.forEach(([ic, t, d, fn]) => {
    const b = el('button', 'opt');
    b.innerHTML = '<span class="ic">' + ic + '</span><span class="t"><b>' + t + '</b><span>' + d + '</span></span>';
    b.onclick = fn; mo.appendChild(b);
  });

  [
    ['▤', 'Tick log as CSV', 'Every tick ever: date, activity, when and which app. Opens in a spreadsheet.', exportLogCSV],
    ['◎', 'Habits as CSV', 'Each habit with its cadence, current streak and 30-day count.', exportHabitsCSV],
    ['◇', 'Activities as CSV', 'The shared vocabulary — everything the apps know how to do.', exportActivitiesCSV],
    ['⧉', 'Copy today as text', 'Today’s routine with its ticks, for pasting into a message or a note.', copyToday],
  ].forEach(([ic, t, d, fn]) => {
    const b = el('button', 'opt');
    b.innerHTML = '<span class="ic">' + ic + '</span><span class="t"><b>' + t + '</b><span>' + d + '</span></span>';
    b.onclick = fn; mo.appendChild(b);
  });

  mo.appendChild(el('div', 'mgroup', 'IMPORT'));
  const rs = el('button', 'opt');
  rs.innerHTML = '<span class="ic">⭱</span><span class="t"><b>Restore from a backup</b><span>Fills in what is missing from a backup file, never overwrites newer. An old whole-device backup still replaces everything.</span></span>';
  rs.onclick = () => $('#fileIn').click();
  mo.appendChild(rs);
  const im = el('button', 'opt');
  im.innerHTML = '<span class="ic">▦</span><span class="t"><b>Bring in an old spreadsheet</b><span>Weigh-ins, daily ticks, foods and spending from a workbook.</span></span>';
  im.onclick = () => $('#xlsxIn').click();
  mo.appendChild(im);

  mirrorSection(mo);

  mo.appendChild(el('div', 'mgroup', 'DANGER'));
  const w = el('button', 'opt danger');
  w.innerHTML = '<span class="ic">⌫</span><span class="t"><b>Delete everything on this device</b><span>Every app’s data, gone. Back up first.</span></span>';
  w.onclick = wipeAll; mo.appendChild(w);
  /* which version of the home screen this is; every app says the same in its settings */
  const ver = UI.version();
  if (ver) mo.appendChild(el('div', 'lede', 'MAIN MENU ' + ver.v + (ver.dateText ? ', updated ' + ver.dateText : '')));
  openModal();
}

/* The two panels in this file build their contents into #modal and then call
   openModal(). That still works — openModal hands the contents to UI.dialog,
   which is a bottom sheet on a phone and a centred card on a laptop. The
   panels themselves did not have to change. */
let modalH = null;
function openModal() {
  const src = $('#modal');
  const h3 = src.querySelector('h3');
  const title = h3 ? h3.textContent : '';
  if (h3) h3.remove();
  /* the panels' own class names, mapped onto the shared ones */
  src.querySelectorAll('.opt').forEach(o => o.classList.add('mb-opt', 'mb-press', 'flat'));
  src.querySelectorAll('.opt.danger').forEach(o => o.classList.add('bad'));
  src.querySelectorAll('.mgroup').forEach(o => o.classList.add('mb-group'));
  src.querySelectorAll('.lede').forEach(o => { o.className = 'lede'; o.style.cssText = 'color:var(--dim2);line-height:1.6;margin-bottom:var(--s-4,16px)'; });
  modalH = UI.dialog({
    title: title, width: 520,
    body: b => { while (src.firstChild) b.appendChild(src.firstChild); },
    onClose: () => { modalH = null; },
  });
}
function closeModal() { if (modalH) modalH.close(); }

/* ══════════════ boot ══════════════ */
function clock() {
  const d = new Date();
  $('#cDate').textContent = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
  $('#cSub').textContent = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
$('#btnData').onclick = dataPanel;
$('#btnWidget').onclick = widgetPicker;
$('#fileIn').onchange = e => { if (e.target.files[0]) restore(e.target.files[0]); e.target.value = ''; };
$('#xlsxIn').onchange = e => { if (e.target.files[0]) importSheet(e.target.files[0]); e.target.value = ''; };
window.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,[contenteditable]')) return;
  /* ui.js closes its own sheet on Escape, so by the time this runs there is
     nothing open and Escape means "back to home". */
  if (e.key === 'Escape') { if (modalH) return; return go('home'); }
  const n = parseInt(e.key, 10);
  /* the number on the button, which is its position — so the key and the badge
     never disagree after the dock has been rearranged */
  const dock = dockApps();
  if (n >= 1 && n <= dock.length && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); go(dock[n - 1].id); }
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1) || 'home'; if (id !== view && app(id)) go(id); });

/* The home screen is an app like any other as far as the foundation is
   concerned: its own theme, its own sound, the shared day. */
/* Anything in the markup carrying data-icon gets its drawing here, and again
   after a theme lands, because the stroke recipe belongs to the theme: a pixel
   theme wants a squared cap and a hand-drawn one wants a wobble, and those are
   different paths rather than a different colour. */
Skins.load('shared/skins.json').then(() => { Skins.restore('home');
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init('home');

/* any change from any app repaints home — the frames repaint themselves */
LifeOS.on(() => { if (view === 'home' && !moving && !sizing) { reloadLayout(); drawHome(); } });
LifeOS.ready(() => {
  LifeOS.prune(800);
  go(location.hash.slice(1) || 'home');
  refreshDataBtn();
});
clock(); setInterval(clock, 20000);
/* midnight: today rolls over, so the home screen must too */
setInterval(() => {
  if (view === 'home' && $('#home').dataset.d !== LifeOS.day()) { $('#home').dataset.d = LifeOS.day(); drawHome(); refreshDataBtn(); }
}, 60000);
</script>
