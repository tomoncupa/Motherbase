            '<div class="nname">' + (nn.it.at != null ? '<b>' + MIN2(nn.it.at) + '</b> ' : '') +
            (bhref ? UI.linkHTML(bhref, esc(nn.it.name), 'rlink') : esc(nn.it.name)) + '</div>';
          /* The band is the tick target too, so following the day never means
             hunting for the right row in the list under it. */
          if (nn.it.tick) {
            const go = el('button', 'nchk', (typeof Icons !== 'undefined' && Icons.svg('done', { size: 18 })) || '✓');
            go.title = 'tick it off';
            go.setAttribute('aria-label', 'Tick it off');
            go.onclick = nn.it.tick;
            band.appendChild(go);
          }
        }
        body.appendChild(band);
      }

      /* the card's title already says TODAY, so the ring carries only its share */
      const rw = el('div', 'ringwrap');
      if (partOn(cfg, 'ring')) rw.appendChild(ring(tasks.length ? done / tasks.length : 0,
        tasks.length ? Math.round(done / tasks.length * 100) + '%' : '—', ''));
      /* PLANNED and LEFT add up BLOCK's blocks, so with no blocks they are
         left off: 0m there meant no plan, not nothing planned */
      if (blocks.length && partOn(cfg, 'stats')) {
        const st = el('div', 'stats');
        const mins = blocks.reduce((a, b) => a + (b.dur || 0), 0);
        const left = blocks.filter(b => !b.done).reduce((a, b) => a + (b.dur || 0), 0);
        st.appendChild(el('div', 'stat', '<b>' + DUR(mins || 0) + '</b><span>PLANNED</span>'));
        st.appendChild(el('div', 'stat acc', '<b>' + DUR(left || 0) + '</b><span>LEFT</span>'));
        rw.appendChild(st);
      }
      if (rw.childNodes.length) body.appendChild(rw);

      /* A fact, and the title opens BLOCK. "The last plan was for <date>"
         only ever showed when the kernel still held yesterday's plan after
         midnight, which todayPlan() ended. */
      if (!items.length) { body.appendChild(el('div', 'empty', 'Nothing on today')); return; }

      /* ── what you missed, and where it sits ──
         Tom, 2026-09-05: "Sometimes it can be overwhelming to see how much
         wasn't done."

         The honest answer is not to hide it. It is to stop it sitting between
         you and the next thing you could actually do. Tidied, the missed ones
         gather just above the done ones, so the top of the list is only what
         is still ahead of you.

         OFF by default, and it is a per-widget setting, because moving
         something you have not done is a decision he asked to be asked
         about. */
      const clock = new Date().getHours() * 60 + new Date().getMinutes();
      /* only a row with a tick can be missed: an entry's time is when it
         happened, not a slot it ran past */
      const isMissed = x => !!x.tick && !x.done && x.at != null && x.at + (x.dur || 0) < clock;
      const missed = items.filter(isMissed);
      const shown = (cfg.tidy && missed.length)
        ? items.filter(x => !x.done && !isMissed(x))
            .concat(missed)
            .concat(items.filter(x => x.done))
        : items;

      const list = el('div', 'rowlist');
      const mark = nn && nn.it ? nn.it : null;
      let here = null;
      /* no row with a time, no time column: an empty 60px gutter otherwise */
      const anyAt = shown.some(x => x.at != null);
      shown.forEach(x => {
        /* `late` is quiet on purpose. It is the difference between a list and
           a telling-off, and a day you are behind on is the day you most need
           to still want to open this. */
        const late = isMissed(x);
        const r = el('div', 'row' + (x.done ? ' done' : '') +
          (x === mark ? ' here' : '') + (late ? ' late' : ''));
        if (x === mark) here = r;
        /* the block's own colour is the row's plate, the way it is in BLOCK;
           a bullet has none and takes the widget's */
        if (x.colour) r.style.setProperty('--c', x.colour);
        if (anyAt) r.appendChild(el('div', 't', x.at == null ? '' : MIN2(x.at)));
        /* Two targets, two meanings, the same split as everywhere else: the
           box ticks it, the words take you to the thing. */
        const href = linkIn(x);
        r.appendChild(el('div', 'n', href ? UI.linkHTML(href, esc(x.name), 'rlink') : esc(x.name)));
        if (x.tag) r.appendChild(el('div', 'tag', esc(x.tag)));
        if (x.dur) r.appendChild(el('div', 'd', DUR(x.dur)));
        if (x.tick) {
          /* Tom, 2026-09-17: "Today widget has the check at the right, why not
             the left". It is the first thing you do to a row, it is where TODO
             already puts it, and a box at the ragged right edge of a list moves
             with every row's length. */
          /* A todo is a bullet, so it wears the journal's box, the mark
             UPCOMING, STATUS and QUESTS give the same line (Tom, 2026-09-17:
             "All bullet entries should look the same regardless of where");
             the round box is a BLOCK block's. */
          const jk = x.todo && typeof Journal !== 'undefined';
          const ck = el('button', 'chk' + (jk ? ' jk' : '') + (x.done ? ' on' : ''), jk ? Journal.markHTML('todo', false)
            : (typeof Icons !== 'undefined' && Icons.svg('done', { size: 14 })) || '✓');
          ck.title = x.done ? 'done — click to undo' : 'check it off';
          ck.setAttribute('aria-label', x.done ? 'Mark not done' : 'Tick it off');
          ck.onclick = x.tick;
          r.insertBefore(ck, r.firstChild);
        } else if (typeof Journal !== 'undefined') {
          /* an entry, an event or an idea wears its journal mark in the box's
             column, so its time lines up with the rows above and below */
          const km = el('span', 'kmark', Journal.markHTML(x.kind));
          km.setAttribute('aria-hidden', 'true');
          r.insertBefore(km, r.firstChild);
        }
        list.appendChild(r);
      });
      if (partOn(cfg, 'list')) body.appendChild(list);

      /* One tap, in the place it matters, and only on a day where it means
         anything. A setting for this would be a thing to go and find on the
         day you least feel like looking. */
      if (missed.length && partOn(cfg, 'list') && partOn(cfg, 'tidy')) {
        const t2 = el('button', 'tidy', missed.length + ' missed · ' +
          (cfg.tidy ? 'show in place' : 'move down'));
        t2.onclick = () => {
          cfg.tidy = cfg.tidy ? 0 : 1;
          saveLayout(); drawHome();
        };
        body.appendChild(t2);
      }

      /* Open it and the thing you are on is already on screen. Only the list
         scrolls - scrollIntoView would take the whole page with it. */
      if (here && list.isConnected && list.scrollHeight > list.clientHeight) {
        list.scrollTop = Math.max(0, here.offsetTop - 6);
      }
    },
  },

  /* ══════════════ BESIDE ══════════════
     Two or three measures on one date axis. Tom, 2026-09-15: "the
     synthesizing of data and the interaction between modules is where the
     suite will shine", and, on the review's joining widget: "what about
     joining 3 things". So up to three strips, one under the other, sharing
     the same days across the bottom and each on its own scale, because two
     scales on one plot invent a relationship and chart.js refuses to draw
     one. Nothing here says what one line did to another (root brief, "Never
     tell him what a behaviour did to a number"). It puts them beside each
     other and he joins them.

     The measures are STATUS's fields, the day's training volume from
     TRAIN's sets, the day's spending, and how much got logged at all. Picked
     from the widget's own menu; a fourth pick drops the oldest. */
  beside: {
    nm: 'BESIDE', w: 6, h: 4,
    /* Tom, 2026-09-22: off the ADD A WIDGET list. One already on the board
       keeps drawing; delete `hidden` to offer it again. */
    hidden: 1,
    nmFor: cfg => cfg.nm || 'BESIDE',
    day0: 30,
    /* Offered in ADD A WIDGET as a ready-made BESIDE. Tom, 2026-09-15: "Put
       sleep, mood and energy on one screen." His protocol watches sleep
       falling while mood rises, and these three strips are that picture. */
    presets: [{ nm: 'SLEEP · MOOD · ENERGY', note: 'three strips on one date axis', cfg: { nm: 'SLEEP · MOOD · ENERGY', m: ['sleep', 'mood', 'energy'], days: 30, w: 12, h: 5 } }],
    days: [[30, '30 days'], [90, '90 days'], [180, '180 days'], [365, 'a year']],
    measures() {
      const fields = Rec.map('field'), seen = {}, out = [];
      const put = (id, label, unit, kind, read) => { if (!seen[id]) { seen[id] = 1; out.push({ id: id, label: label, unit: unit, kind: kind, read: read }); } };
      /* every field with a row, and every field that has ever been logged,
         so a fresh install with no field rows still finds its weight */
      const ids = Object.keys(fields).filter(k => fields[k].on !== 0);
      Rec.all('ev').forEach(r => { if (ids.indexOf(r.key) < 0) ids.push(r.key); });
      ids.forEach(id => {
        const f = fields[id] || {};
        put(id, f.label || id.charAt(0).toUpperCase() + id.slice(1), f.unit || '', 'line', d => evValue(d, id));
      });
      put('trainvol', 'Training volume', 'kg', 'bar', d => {
        const rows = Rec.all('set', { date: d }).filter(r => setCounts(r.payload || {}, d, LifeOS.day()));
        return rows.length ? Math.round(rows.reduce((a, r) => a + (r.payload.kg || 0) * (r.payload.r || 0), 0)) : null;
      });
      put('spend', 'Spending', '', 'bar', d => {
        const rows = Rec.all('spend', { date: d });
        return rows.length ? Math.round(rows.reduce((a, r) => a + (Number(r.payload.amt) || 0), 0)) : null;
      });
      put('logged', 'Logged', '', 'bar', d => Rec.all('tick', { date: d }).length || null);
      return out;
    },
    chosen(cfg) {
      const all = WIDGETS.beside.measures(), have = all.map(m => m.id);
      const want = (cfg.m && cfg.m.length ? cfg.m : ['sleep', 'trainvol']).filter(id => have.indexOf(id) >= 0).slice(0, 3);
      return want.map(id => all.filter(m => m.id === id)[0]);
    },
    sub: cfg => {
      const names = WIDGETS.beside.chosen(cfg || {}).map(m => m.label.toLowerCase());
      if (!names.length) return 'pick measures from the menu';
      return names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names.slice(-1) : names[0];
    },
    menu(cfg, redraw) {
      const on = cfg.m && cfg.m.length ? cfg.m : ['sleep', 'trainvol'];
      return [{ label: 'Measures', sub: WIDGETS.beside.measures().map(m => ({
        label: m.label, check: on.indexOf(m.id) >= 0,
        fn: () => {
          let next = on.slice();
          if (next.indexOf(m.id) >= 0) next = next.filter(x => x !== m.id);
          else { next.push(m.id); if (next.length > 3) next.shift(); }
          cfg.m = next; redraw();
        } })) }];
    },
    draw(body, cfg) {
      cfg = cfg || {};
      const days = cfg.days || 30, today = LifeOS.day(), from = LifeOS.shift(today, -(days - 1));
      const picked = WIDGETS.beside.chosen(cfg);
      if (!picked.length) {
        body.appendChild(el('div', 'empty', 'Nothing to show yet. Log in <span class="link" onclick="go(\'status\')">STATUS</span> or ' +
          '<span class="link" onclick="go(\'train\')">TRAIN</span>, then pick measures from this widget\'s menu.'));
        return;
      }
      body.style.gap = '0';
      const fmt = v => Number(v).toLocaleString(undefined, { maximumFractionDigits: 1 });
      const when = d => d === today ? 'today' : Day.short(d);
      picked.forEach((m, i) => {
        const pts = [];
        for (let k = 0; k < days; k++) { const d = LifeOS.shift(from, k); const v = m.read(d); if (v != null) pts.push([d, v]); }
        const strip = el('div', 'strip');
        /* a real floor, because on a phone the card is as tall as its
           contents and three strips sharing nothing would be three lines */
        strip.style.cssText = 'flex:1 1 0;min-height:112px;display:flex;flex-direction:column;min-width:0';
        const last = pts.length ? pts[pts.length - 1] : null;
        const head = Chart.header({ size: 'sm', label: m.label, value: last ? fmt(last[1]) : '—', unit: last ? m.unit : '',
          when: last ? when(last[0]) : 'nothing in ' + days + ' days' });
        strip.appendChild(head.el);
        const box = el('div', 'fits');
        box.style.cssText = 'flex:1 1 auto;min-height:72px';
        strip.appendChild(box);
        body.appendChild(strip);
        if (pts.length < 2) return;
        const lastStrip = i === picked.length - 1;
        /* the same left margin on every strip, so the days line up */
        Chart.mount(box, { pad: { l: 46, r: 12, t: 8, b: lastStrip ? 22 : 6 }, label: m.label + ', ' + days + ' days' }, c => {
          c.xTime(from, today);
          c.yFit(pts.map(p => p[1]), m.kind === 'bar' ? { min: 0, lines: 2 } : { lines: 2 });
          c.grid();
          if (lastStrip) c.timeAxis();
          if (m.kind === 'bar') {
            /* a bar a day wide, whatever days are missing */
            const bw = Math.max(2, Math.min(24, ((c.W - c.P.l - c.P.r) / days) * .62));
            c.bars(pts, null, bw, { highlight: 'last' });
          } else { c.area(pts); c.line(pts); c.end(pts[pts.length - 1]); }
          c.scrub(pts, { onMove: p => head.set(fmt(p[1]), '', when(p[0])), onLeave: head.reset });
        });
      });
    },
  },

  log: {
    nm: 'DAY LOG', w: 4, h: 3, to: ['log'],
    /* STATUS publishes a per-kind counter as well — note-todo, note-event —
       so a journal widget can say "3 todos" without knowing what they are.
       Those are counts, not events, and listing them beside the individual
       lines they are counting says the same thing twice. The counters stay
       in the store for whoever wants them; this list, and the count in the
       header, are for things that happened. */
    keys: () => Object.keys(LifeOS.dayLog()).filter(k => k.indexOf('note-') !== 0 || k.indexOf('note-at-') === 0),
    sub: () => { const n = WIDGETS.log.keys().length; return n ? n + ' logged' : 'nothing yet'; },
    parts: [['time', 'Time'], ['dur', 'How long'], ['src', 'Which app']],
    draw(body, cfg) {
      /* ── the time it happened, not the time it was typed ──
         A tick's own timestamp is when you pressed the button, which for
         anything ticked after the fact is the wrong number. Where the writer
         stated a time — "Train 2:45" in STATUS — that is the one shown, and
         the day sorts by it. Everything else falls back to when it was
         ticked, which is all it knows. */
      const at = k => {
        const r = log[k];
        if (!r.at) return null;
        const [h, m] = String(r.at).split(':').map(Number);
        return isFinite(h) && isFinite(m) ? h * 60 + m : null;
      };
      const mins = k => { const a = at(k); return a != null ? a : new Date(log[k].ts).getHours() * 60 + new Date(log[k].ts).getMinutes(); };
      const log = LifeOS.dayLog();
      const keys = WIDGETS.log.keys().sort((a, b) => mins(a) - mins(b));
      if (!keys.length) { body.appendChild(el('div', 'empty', 'Nothing ticked yet today.')); return; }
      keys.forEach(k => {
        const rec = log[k];
        const line = el('div', 'logline');
        const stated = at(k) != null;
        /* one clock for the column, the one a typed time is written in */
        const tm = el('span', 'tm' + (stated ? ' said' : ''), MIN2(mins(k)));
        if (stated) tm.title = 'The time you wrote, not the time it was logged';
        if (partOn(cfg, 'time')) line.appendChild(tm);
        line.appendChild(el('span', null, esc(actLabel(k).name) + (rec.dur && partOn(cfg, 'dur') ? ' <i class="dur">' + DUR(rec.dur) + '</i>' : '')));
        if (partOn(cfg, 'src')) line.appendChild(el('span', 'src', esc((rec.src || '').toUpperCase())));
        body.appendChild(line);
      });
    },
  },


  /* ── TRAIN ──
     Both widgets read the shared rows directly. TRAIN owns `set`, `exercise`
     and `session`; nothing here writes any of them, which is what lets the
     home screen show the training log without becoming a second author of it. */
  training: {
    nm: 'TRAINING', w: 5, h: 5, app: 'train', to: ['train'],
    sub: () => {
      const d = trainLastDay();
      if (!d) return 'nothing logged yet';
      return d === LifeOS.day() ? 'today' : LifeOS.shift(LifeOS.day(), -1) === d ? 'yesterday' : Day.short(d);
    },
    parts: [['ex', 'Exercises'], ['sets', 'Sets'], ['reps', 'Reps'], ['vol', 'Volume'], ['list', 'Exercise list']],
    draw(body, cfg) {
      const day = trainLastDay();
      if (!day) { body.appendChild(el('div', 'empty', 'No training logged')); return; }
      const t = LifeOS.day(), exs = Rec.map('exercise');
      const sets = Rec.all('set', { date: day }).filter(r => setCounts(r.payload || {}, day, t));
      /* in the day's order as TRAIN lays it out (session.order), then by
         the first set's time for anything not placed there */
      const byEx = {}, first = {};
      sets.forEach(r => {
        const p = r.payload;
        (byEx[p.ex] = byEx[p.ex] || []).push(p);
        if (first[p.ex] == null || r.key < first[p.ex]) first[p.ex] = r.key;
      });
      const placed = ((Rec.get('session', day, '') || {}).order) || [];
      const order = Object.keys(byEx).sort((a, b) => {
        const ia = placed.indexOf(a), ib = placed.indexOf(b);
        return ia > -1 && ib > -1 ? ia - ib : ia > -1 ? -1 : ib > -1 ? 1 : String(first[a]).localeCompare(String(first[b]));
      });
      let reps = 0, vol = 0;
      sets.forEach(r => { reps += r.payload.r || 0; vol += (r.payload.kg || 0) * (r.payload.r || 0); });

      const st = el('div', 'stats');
      if (partOn(cfg, 'ex')) st.appendChild(el('div', 'stat acc', '<b>' + order.length + '</b><span>EXERCISES</span>'));
      if (partOn(cfg, 'sets')) st.appendChild(el('div', 'stat', '<b>' + sets.length + '</b><span>SETS</span>'));
      if (partOn(cfg, 'reps')) st.appendChild(el('div', 'stat', '<b>' + reps.toLocaleString() + '</b><span>REPS</span>'));
      if (partOn(cfg, 'vol')) st.appendChild(el('div', 'stat', '<b>' + Math.round(vol).toLocaleString() + '</b><span>VOLUME KG</span>'));
      if (st.childNodes.length) body.appendChild(st);
      if (!partOn(cfg, 'list')) return;

      const list = el('div', 'rowlist');
      order.slice(0, 6).forEach(id => {
        const nm = exs[id] ? exs[id].name : id;
        const n = byEx[id].length;
        const row = el('div', 'row');
        row.innerHTML = '<span class="nm">' + esc(nm) + '</span><span class="rt">' + n +
          ' set' + (n === 1 ? '' : 's') + '</span>';
        list.appendChild(row);
      });
      if (order.length > 6) list.appendChild(el('div', 'empty', (order.length - 6) + ' more'));
      body.appendChild(list);
    },
  },

  /* A bar a week for 8 weeks, the volume TRAIN counts (warmups in, a
     planned set only once done), drawn on shared/chart.js like SLEEP: the
     answer in the header, the latest week lit, a drag to read any week. */
  trainvol: {
    nm: 'TRAINING VOLUME', w: 4, h: 2, app: 'train', to: ['train'],
    /* how many weeks, from the card's menu, as days so the menu's one
       Time frame list serves it; untouched it is the 8 it always was */
    days: [[28, '4 weeks'], [56, '8 weeks'], [91, '13 weeks'], [182, '26 weeks'], [364, '52 weeks']], day0: 56,
    nWk: cfg => Math.round(((cfg && cfg.days) || 56) / 7),
    weeks(cfg) {
      const t = LifeOS.day(), out = [];
      for (let w = WIDGETS.trainvol.nWk(cfg) - 1; w >= 0; w--) {
        const end = LifeOS.shift(t, -w * 7), days = {};
        let vol = 0;
        for (let i = 0; i < 7; i++) {
          const d = LifeOS.shift(end, -i);
          Rec.all('set', { date: d }).forEach(r => {
            const p = r.payload || {};
            if (!setCounts(p, d, t)) return;
            days[d] = 1; vol += (p.kg || 0) * (p.r || 0);
          });
        }
        out.push({ end: end, vol: Math.round(vol), days: Object.keys(days).length });
      }
      return out;
    },
    sub: cfg => { const N = WIDGETS.trainvol.nWk(cfg), n = WIDGETS.trainvol.weeks({ days: 7 })[0]; return n.days ? n.vol.toLocaleString() + ' kg in the last 7 days' : 'last ' + N + ' weeks'; },
    draw(body, cfg) {
      const N = WIDGETS.trainvol.nWk(cfg), W8 = WIDGETS.trainvol.weeks(cfg), step = Math.ceil(N / 4);
      if (!W8.some(x => x.days)) { body.appendChild(el('div', 'empty', 'No training in the last ' + N + ' weeks')); return; }
      const box = el('div', 'fits');
      body.appendChild(box);
      const bars = W8.map((x, i) => [i, x.vol, 'Week to ' + Day.short(x.end) + ', ' + x.vol.toLocaleString() + ' kg']);
      Chart.mount(box, { label: 'Training volume, the last ' + N + ' weeks' }, c => {
        c.xLinear(-0.5, N - 0.5);
        c.yFit(W8.map(x => x.vol), { min: 0 });
        c.grid();
        /* a date under every other week at 8, as before; fewer as the weeks grow */
        c.labels(W8.map((x, i) => [i, Day.short(x.end), i === N - 1]).filter((l, i) => (N - 1 - i) % step === 0));
        c.bars(bars, null, null, { highlight: 'last' });
        c.scrub(bars);
      });
    },
  },

  /* ── which muscles got trained, on a body ──
     Tom, 2026-09-24: "Widget - Body Training Heatmap". Working sets from
     TRAIN over the last 7, 14 or 30 days, laid on a front and a back figure:
     the brighter a muscle, the more sets it got. Counted the way TRAIN's
     WEEKLY counts them: warmups out, a set from today only once it is done,
     and a muscle an exercise ALSO works gets its share (half a set for
     biceps on a pull-up). TRAIN's muscle groups are names he can change, so
     each is read onto the body by what it says: "Legs" lights every leg
     muscle, "Hamstrings" lights only those. A group the body cannot show,
     other than cardio, is named under the list rather than dropped. No
     target and no verdict, as in TRAIN: "I'd rather be told how many times I
     hit a muscle, I'll know if I need to hit more."
     Recovery, Tom, 2026-10-01: "Heatmap should also show recovery. Big
     muscles - 72 hours, Small Muscles - 24-48", and 2026-10-05: "Red - just
     hit, Green - ready to go, Brightness - amount of work this week". A
     trained muscle's colour is how far it has come back (bodyColour), its
     brightness its sets in the range (bodyBright), the dot on its row the
     same, and a row still recovering says the hours left. Worked out from
     the time of its last working set
     (bodyRecovery), so it moves on its own: redrawn every ten minutes.
     Pose, Tom, 2026-10-05: "Make the default pose standing. Hide the other
     poses behind the right click options". Standing unless the card's menu
     says otherwise; the choice is the card's, so two copies can differ. */
  bodyheat: {
    nm: 'BODY HEATMAP', w: 4, h: 4, app: 'train', to: ['train'],
    days: [[7, '7 days'], [14, '14 days'], [30, '30 days'], [90, '90 days']], day0: 7,
    parts: [['fig', 'Body'], ['list', 'Muscle list'], ['rec', 'Hours to recover'], ['off', 'Not on the body']],
    sub: cfg => 'working sets · last ' + ((cfg && cfg.days) || 7) + ' days',
    menu(cfg, redraw) {
      return [{ label: 'Pose', sub: Object.keys(BODY_POSES).map(k => ({
        label: BODY_POSES[k].nm, check: (BODY_POSES[cfg.pose] ? cfg.pose : 'stand') === k,
        fn: () => { if (k === 'stand') delete cfg.pose; else cfg.pose = k; redraw(); } })) }];
    },
    draw(body, cfg) {
      const days = (cfg && cfg.days) || 7, today = LifeOS.day(), from = LifeOS.shift(today, -(days - 1));
      const heat = bodyHeat(from, today);
      const regs = Object.keys(BODY_NAMES).filter(k => heat.v[k] > 0).sort((a, b) => heat.v[b] - heat.v[a]);
      if (!regs.length && !heat.off.length) {
        /* A8, 2026-10-05: the body, every muscle in its zero colour, and the
           sentence under it, so a new client sees the map they are about to
           fill rather than a line of words */
        const col = el('div');
        col.style.cssText = 'display:flex;flex-direction:column;gap:var(--gap);height:100%;min-height:0';
        const fig = el('div', 'bh-fig');
        fig.style.cssText = 'flex:1 1 auto;min-height:0';
        fig.innerHTML = bodySvg(heat.v, {}, cfg && cfg.pose);
        col.appendChild(fig);
        col.appendChild(el('div', 'empty', 'No working sets in the last ' + days + ' days'));
        body.appendChild(col);
        return;
      }
      const wrap = el('div', 'bh-wrap');
      const fig = el('div', 'bh-fig');
      const rec = bodyRecovery(Date.now());
      fig.innerHTML = bodySvg(heat.v, rec, cfg && cfg.pose);
      if (partOn(cfg, 'fig')) wrap.appendChild(fig);
      const side = el('div', 'bh-side');
      const list = el('div', 'rowlist');
      const fmt = n => (Math.round(n * 2) / 2).toString();
      const most = Math.max(0, ...regs.map(k => heat.v[k]));
      regs.forEach(k => {
        const row = el('div', 'row bh-row');
        row.innerHTML = '<span class="bh-dot" style="background:' + bodyColour(rec[k]) + ';opacity:' + bodyBright(heat.v[k], most) + '"></span>' +
          '<span class="nm">' + BODY_NAMES[k] + '</span><span class="rt">' + fmt(heat.v[k]) + '</span>' +
          (rec[k] && partOn(cfg, 'rec') ? '<span class="bh-rec" title="' + Math.ceil(rec[k].left) + ' of its ' + rec[k].win + ' hours to recover">' +
            ((typeof Icons !== 'undefined' && Icons.svg('rest', { size: 12 })) || '') + bodyHours(rec[k].left) + '</span>' : '<span class="bh-rec"></span>');
        list.appendChild(row);
      });
      if (partOn(cfg, 'list')) side.appendChild(list);
      if (heat.off.length && partOn(cfg, 'off')) {
        const off = el('div', 'empty');
        off.style.cssText = 'text-align:left;padding:var(--s-2) var(--s-1) 0';
        off.innerHTML = 'Not on the body: ' + heat.off.map(o => esc(o.name) + ' ' + fmt(o.n)).join(', ');
        side.appendChild(off);
      }
      if (side.childNodes.length) wrap.appendChild(side);
      body.appendChild(wrap);
      /* recovery runs on the clock, not on the store: redraw while it shows */
      clearInterval(body.bhTimer);
      body.bhTimer = setInterval(() => {
        if (!body.isConnected) return clearInterval(body.bhTimer);
        body.innerHTML = '';
        WIDGETS.bodyheat.draw(body, cfg);
        body.querySelectorAll('.row').forEach(r => r.classList.add('mb-plate'));
      }, 600000);
    },
  },

  /* ══════════════ STATUS ══════════════
     These read STATUS's rows straight out of the store. Nothing here writes
     one: STATUS owns every measurement and this screen only looks at them. */

  weight: {
    nm: 'WEIGHT', w: 5, h: 3, app: 'status', to: ['status', 'trends'],
    /* ── the range is a property of THIS widget ──
       Tom, 2026-09-05: "I'd rather have different charts if we're in Main
       Menu and different tabs if we're in STATUS." Right, and it follows from
       what each screen is. The main menu is a board you arrange, so the
       choice is which chart you put on it - two weight widgets at 30 and 365
       days is a comparison you can see at once. STATUS is one screen you
       scroll, so the choice has to be tabs.
       Set it from the widget's own menu: right-click, or hold on a phone. */
    days: [[30, '30 days'], [90, '90 days'], [180, '180 days'], [365, 'a year'], [3650, 'all of it']],
    /* the plan's dashed line and its line of words, each its own pick */
    parts: [['plan', 'Plan line'], ['note', 'Plan note']],
    nmFor: cfg => 'WEIGHT · ' + String((WIDGETS.weight.days.filter(d => d[0] === (cfg.days || 90))[0] || [0, ''])[1]).toUpperCase(),
    sub: cfg => {
      const r = weightSeries((cfg && cfg.days) || 90);
      /* the plan has its own line under the chart: in the header it pushed
         the line off the card on a phone */
      if (!r.length) return 'no weigh-ins';
      const last = r[r.length - 1];
      const avg = cfg && cfg.avg ? ' · 7-day avg ' + weightAvg7(r).pop()[1].toFixed(1) : '';
      return weightSaid(r, last.v, last.d) + avg;
    },
    /* ── the cut ──
       Tom, 2026-09-15: "Yes chart the cut". A plan is a start, a goal and
       two dates, drawn as a dashed line from one to the other under the
       weigh-ins. It is a setting rather than part of the layout, so it is in
       the backup and on every device, and every WEIGHT widget shows the same
       one. The line says what the plan says on a day; nothing here says
       whether a weigh-in is good. */
    menu(cfg, redraw) {
      const has = !!Rec.setting('lifeos', 'weightPlan');
      return ['-', { label: '7-day average line', check: !!cfg.avg, fn: () => { if (cfg.avg) delete cfg.avg; else cfg.avg = 1; redraw(); } },
        { label: has ? 'Change the plan' : 'Plan a cut', fn: weightPlanSheet },
        has ? { label: 'Clear the plan', fn: () => {
          const was = Rec.setting('lifeos', 'weightPlan');
          Rec.setting('lifeos', 'weightPlan', null); redraw();
          UI.undo('Plan cleared', () => { Rec.setting('lifeos', 'weightPlan', was); redraw(); });
        } } : null];
    },
    draw(body, cfg) {
      cfg = cfg || {};
      const today = LifeOS.day(), plan = partOn(cfg, 'plan') ? weightPlan() : null;
      const back = plan ? Math.max(cfg.days || 90, Day.diff(today, plan.from)) : (cfg.days || 90);
      const pts = weightSeries(back);
      if (!pts.length && !plan) { body.appendChild(el('div', 'empty', 'No weigh-ins in the last ' + (cfg.days || 90) + ' days')); return; }
      /* Every day you stood on the scale is a dot, and the line through them
         is a seven day average. The dots are the point: a daily weight jumps
         around for reasons that have nothing to do with fat, and hiding that
         behind a smooth line is its own kind of lie. */
      /* ── on shared/chart.js ──
         This used to work out its own scale, draw its own gridlines, and put
         the first and last date at the two ends and call that an x-axis. Tom,
         2026-09-06: "It doesnt even have a proper X axis, don't just fix this
         widget, review the foundation."

         The foundation is chart.js now, and this is what a chart in this suite
         should look like: say what the axes are, hand over the points, and
         stop. The dots are every time you stood on the scale and the line
         through them is the seven-day average - the dots are kept because a
         daily weight jumps around for reasons that are not fat, and hiding
         that behind a smooth line is its own kind of lie. */
      /* \u2500\u2500 the weigh-ins, joined \u2500\u2500
         Tom, 2026-09-14: "I'd rather have a graph that indicates my actual
         data than trends." The line goes through every reading as it was
         taken, and there is no average on the chart. Supersedes the seven-day
         average line described above. */
      /* ── answer first ──
         Tom, 2026-09-14: "Graphs must be useful and feel cool, they must convey
         data quick." The answer is the widget's own line at the top: the latest
         weigh-in and how far it has moved. Drag across the chart and that line
         follows the day under the finger. A second header inside the widget
         left a small one no room for the chart. The line goes through every
         reading as it was taken, with no average. */
      const last = pts.length ? pts[pts.length - 1].v : null, lastD = pts.length ? pts[pts.length - 1].d : today;
      const subOf = () => { const w = body.closest('.w'); return w && w.querySelector('.w-head .sub'); };
      let kept = null;
      const box = el('div', 'fits');
      body.appendChild(box);
      const line = pts.map(p => [p.d, p.v]);
      const from = plan ? (pts.length && pts[0].d < plan.from ? pts[0].d : plan.from) : pts[0].d;
      const to = plan && plan.to > lastD ? plan.to : lastD;
      Chart.mount(box, { label: 'Weight, ' + pts.length + ' weigh-ins' + (plan ? ', and a plan to ' + plan.goal + ' by ' + plan.to : '') }, c => {
        c.xTime(from, to);
        /* half a kilo under the goal, so the goal's label is never on the floor line */
        c.yFit(pts.map(p => p.v).concat(plan ? [plan.start, plan.goal] : []), plan ? { include: plan.goal - 0.5 } : undefined);
        c.grid();
        c.timeAxis();
        if (plan) {
          c.line([[plan.from, plan.start], [plan.to, plan.goal]], 'mb-rule');
          const gl = c.add('text', { x: c.X(plan.to) - 4, y: c.Y(plan.goal) + 16, 'text-anchor': 'end' }, 'mb-lab');
          gl.textContent = plan.goal.toFixed(1);
        }
        if (line.length > 1) { c.area(line); c.line(line); } else if (line.length) c.dots(line);
        if (cfg.avg && line.length > 1) c.line(weightAvg7(pts), 'mb-line w-avg');
        if (line.length) c.end(line[line.length - 1], last.toFixed(1));
        c.scrub(line, {
          onMove: p => { const s = subOf(); if (!s) return; if (kept == null) kept = s.textContent;
            s.textContent = weightSaid(pts, p[1], p[0]) + (plan && p[0] >= plan.from && p[0] <= plan.to ? ' · plan ' + planAt(plan, p[0]).toFixed(1) : ''); },
          onLeave: () => { const s = subOf(); if (s && kept != null) s.textContent = kept; kept = null; },
        });
      });
      const pl = weightPlan(), ps = pl ? planSaid(pl).replace(/^ · /, '') : (Rec.setting('lifeos', 'weightPlan') ? 'plan needs a starting weight' : '');
      if (ps && partOn(cfg, 'note')) body.appendChild(el('div', 'tsub', esc(ps.charAt(0).toUpperCase() + ps.slice(1))));
    },
  },


  /* ══════════════ AVG WEIGHT ══════════════
     Tom, 2026-10-06: "an average weight widget". The mean of every weigh-in
     in the days picked, the same stretch before it, the change between them,
     and, from 14 days up, each week's average, newest first. A week is seven days counted back
     from today, so the newest one is never half a calendar week. */
  avgweight: {
    nm: 'AVG WEIGHT', w: 4, h: 2, app: 'status', to: ['status', 'trends'],
    days: [[7, '7 days'], [14, '14 days'], [30, '30 days'], [90, '90 days'], [180, '180 days']], day0: 7,
    parts: [['now', 'This stretch'], ['before', 'The stretch before'], ['change', 'Change'], ['weeks', 'Each week']],
    nmFor: cfg => 'AVG WEIGHT · ' + String((WIDGETS.avgweight.days.filter(d => d[0] === ((cfg && cfg.days) || 7))[0] || [0, ''])[1]).toUpperCase(),
    mean(n, to) {
      const v = [];
      for (let i = 0; i < n; i++) { const x = evValue(LifeOS.shift(to, -i), 'weight'); if (x != null && isFinite(x)) v.push(Number(x)); }
      return v.length ? { v: v.reduce((a, b) => a + b, 0) / v.length, n: v.length } : null;
    },
    sub: cfg => {
      const n = (cfg && cfg.days) || 7, a = WIDGETS.avgweight.mean(n, LifeOS.day());
      return a ? a.n + ' weigh-in' + (a.n === 1 ? '' : 's') : 'no weigh-ins';
    },
    draw(body, cfg) {
      const n = (cfg && cfg.days) || 7, t = LifeOS.day(), W = WIDGETS.avgweight;
      const a = W.mean(n, t), b = W.mean(n, LifeOS.shift(t, -n));
      if (!a && !b) { body.appendChild(el('div', 'empty', 'No weigh-ins')); return; }
      /* the change between the two numbers as shown, so 80.0 and 80.0 is
         never "+0.1" */
      const r1 = v => Math.round(v * 10) / 10;
      const d = a && b ? r1(a.v) - r1(b.v) : null;
      const st = el('div', 'stats');
      if (partOn(cfg, 'now')) st.appendChild(el('div', 'stat acc', '<b>' + (a ? a.v.toFixed(1) : '—') + '</b><span>LAST ' + n + ' DAYS</span>'));
      if (partOn(cfg, 'before')) st.appendChild(el('div', 'stat', '<b>' + (b ? b.v.toFixed(1) : '—') + '</b><span>' + n + ' DAYS BEFORE</span>'));
      if (partOn(cfg, 'change')) st.appendChild(el('div', 'stat', '<b>' + (d == null ? '—' : (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toFixed(1)) + '</b><span>CHANGE</span>'));
      if (st.childNodes.length) body.appendChild(st);
      /* at 7 days the two weeks ARE the two numbers above */
      if (n < 14 || !partOn(cfg, 'weeks')) return;
      const list = el('div', 'rowlist');
      for (let k = 0; k < Math.ceil(n / 7) && k < 13; k++) {
        const end = LifeOS.shift(t, -7 * k), m = W.mean(7, end);
        const row = el('div', 'row');
        row.innerHTML = '<span class="n">' + (k ? Day.label(LifeOS.shift(end, -6)) + ' to ' + Day.label(end) : 'Last 7 days') + '</span>' +
          '<span class="abig">' + (m ? m.v.toFixed(1) + '<small>' + m.n + 'x</small>' : '—') + '</span>';
        list.appendChild(row);
      }
      body.appendChild(list);
    },
  },

  /* ══════════════ DESK TIME ══════════════
     Tom, 2026-10-05: a daily log of time per program, "But also I use to see
     what time I generally go to bed", and "have it be a main menu widget".
     STATUS.exe writes it (`screen`, `deskon`; status/CLAUDE.md 1.0.62), so it
     is his alone and leaves the client build. Bedtime is when he left the PC:
     the end of the first stretch at the desk, from 9pm on, that is followed by
     three hours or more with nobody at it. Phone time in bed is not seen. */
  desktime: {
    nm: 'DESK TIME', w: 4, h: 4, app: 'status', mine: 1, to: ['status'],
    sub: () => { const u = deskUsual(); return u ? 'usually off the PC at ' + deskClk(u.m) : 'when you leave the PC at night'; },
    /* the time per program over today or a longer stretch, added up */
    days: [[1, 'Today'], [7, '7 days'], [30, '30 days'], [90, '90 days']], day0: 1,
    parts: [['total', 'Time at the PC'], ['last', 'Off last night'], ['usual', 'Usual time off'], ['list', 'Programs']],
    draw(body, cfg) {
      const t = LifeOS.day(), n = (cfg && cfg.days) || 1, from = LifeOS.shift(t, -(n - 1)), by = {};
      Rec.all('screen').forEach(r => {
        if (!r.date || r.date < from || r.date > t || !r.payload || !(r.payload.s > 0)) return;
        const k = r.key; by[k] = by[k] || { key: k, payload: { app: r.payload.app, s: 0 } }; by[k].payload.s += r.payload.s;
      });
      const S = Object.keys(by).map(k => by[k]).sort((a, b) => b.payload.s - a.payload.s);
      const any = Rec.all('deskon').length || Rec.all('screen').length;
      if (!any) { body.appendChild(el('div', 'empty', 'Nothing yet. STATUS on the PC keeps this while it is open.')); return; }
      const tot = S.reduce((n, r) => n + r.payload.s, 0);
      const last = deskBed(deskShift(t, -1)), u = deskUsual();
      const st = el('div', 'stats');
      if (partOn(cfg, 'total')) st.appendChild(el('div', 'stat acc', '<b>' + deskHM(tot) + '</b><span>' + (n > 1 ? 'LAST ' + n + ' DAYS' : 'TODAY') + '</span>'));
      if (partOn(cfg, 'last')) st.appendChild(el('div', 'stat', '<b>' + (last == null ? '—' : deskClk(last)) + '</b><span>OFF LAST NIGHT</span>'));
      if (partOn(cfg, 'usual')) st.appendChild(el('div', 'stat', '<b>' + (u ? deskClk(u.m) : '—') + '</b><span>' + (u ? 'USUAL, ' + u.n + ' NIGHT' + (u.n > 1 ? 'S' : '') : 'USUAL') + '</span>'));
      if (st.childNodes.length) body.appendChild(st);
      if (!partOn(cfg, 'list')) return;
      if (!S.length) { body.appendChild(el('div', 'empty', n > 1 ? 'No time at the PC in the last ' + n + ' days.' : 'No time at the PC yet today.')); return; }
      /* ruled lines, as STREAKS draws them: nothing here is pressed, and as
         44px plates the last two of six programs fell off the card */
      const list = el('div');
      S.slice(0, 6).forEach(r => {
        const row = el('div', 'hrow');
        row.innerHTML = '<span class="n">' + esc(r.payload.app || r.key) + '</span><span class="d">' + deskHM(r.payload.s) + '</span>';
        list.appendChild(row);
      });
      body.appendChild(list);
    },
  },

  sleep: {
    nm: 'SLEEP', w: 4, h: 2, app: 'status', to: ['status', 'trends'],
    /* the answer, in the widget's own line: the average night and nights on target */
    /* how many nights, from the card's menu; sleepSaid() with the nights
       as a number, so the header covers what the chart does */
    days: [[7, '7 nights'], [14, '14 nights'], [30, '30 nights'], [90, '90 nights']], day0: 7,
    menu: (cfg, redraw) => [partToggle(cfg, 'target', 'Show the target line', redraw)],
    said(n) {
      const f = Rec.map('field').sleep, target = f && f.target ? Number(f.target) : 0, got = [];
      for (let i = n - 1; i >= 0; i--) { const v = evValue(LifeOS.shift(LifeOS.day(), -i), 'sleep'); if (v != null) got.push(v); }
      if (!got.length) return 'last ' + n + ' nights';
      const mean = got.reduce((a, v) => a + v, 0) / got.length;
      return mean.toFixed(1) + ' hrs a night' + (target ? ', ' + got.filter(v => v >= target).length + ' of ' + got.length + ' on target' : '');
    },
    sub: cfg => WIDGETS.sleep.said((cfg && cfg.days) || 7),
    draw(body, cfg) {
      const f = Rec.map('field').sleep, n = (cfg && cfg.days) || 7;
      const target = f && f.target ? Number(f.target) : 0;
      const days = [];
      for (let i = n - 1; i >= 0; i--) {
        const d = LifeOS.shift(LifeOS.day(), -i);
        days.push({ d: d, v: evValue(d, 'sleep') });
      }
      if (!days.some(x => x.v != null)) {
        body.appendChild(el('div', 'empty',
          'No sleep logged'));
        return;
      }
      /* On shared/chart.js: the week's average on top, a bar a night with the
         nights that met the target lit, the target as a line, and a drag to
         read any night. */
      const got = days.filter(x => x.v != null);
      const subOf = () => { const w = body.closest('.w'); return w && w.querySelector('.w-head .sub'); };
      let kept = null;
      const box = el('div', 'fits');
      body.appendChild(box);
      const bars = days.map((x, i) => [i, x.v, Day.label(x.d) + (x.v == null ? ', nothing logged' : ', ' + x.v + ' hrs')]);
      /* a weekday letter a night at 7; past that a date every few nights */
      const step = Math.ceil(n / 7);
      Chart.mount(box, { label: 'Sleep, the last ' + n + ' nights' }, c => {
        c.xLinear(-0.5, n - 0.5);
        c.yFit(got.map(x => x.v).concat(target ? [target] : []), { min: 0 });
        c.grid();
        c.labels(n <= 7 ? days.map((x, i) => [i, DLET[new Date(x.d + 'T12:00:00').getDay()], i === n - 1])
          : days.map((x, i) => [i, Day.short(x.d), i === n - 1]).filter((l, i) => (n - 1 - i) % step === 0));
        c.bars(bars, null, null, { highlight: target ? (p => p[1] != null && p[1] >= target) : 'last' });
        if (target && partOn(cfg, 'target')) c.rule(target);
        c.scrub(bars.filter(b => b[1] != null), {
          onMove: p => { const s = subOf(); if (!s) return; if (kept == null) kept = s.textContent; s.textContent = Number(p[1]).toFixed(1) + ' hrs, ' + Day.label(days[p[0]].d); },
          onLeave: () => { const s = subOf(); if (s && kept != null) s.textContent = kept; kept = null; },
        });
      });
    },
  },

  spend: {
    nm: 'SPEND', w: 4, h: 3, app: 'status', to: ['status', 'money'],
    days: [[7, '7 days'], [14, '14 days'], [30, '30 days'], [90, '90 days']], day0: 7,
    parts: [['total', 'Total'], ['vs', 'Against the stretch before'], ['acct', 'By account']],
    sub: cfg => { const n = (cfg && cfg.days) || 7; return 'the last ' + n + ' days against the ' + n + ' before'; },
    draw(body, cfg) {
      const n = (cfg && cfg.days) || 7;
      /* Money moved, not spent: WEALTH files a spend whose category is in
         the move group (a loan payment, savings) apart from spending. A copy
         of WEALTH's own catOf and isMove: the mark,
         else the longest text rule that matches the note. */
      const nrm = v => String(v || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
      const RU = Rec.all('rule').map(r => r.payload).filter(x => x && x.match).sort((a, b) => b.match.length - a.match.length);
      const moved = r => {
        const m = Rec.get('mark', null, r.date + '|' + r.key) || {};
        let c = m.cat;
        if (!c) { const t = nrm(r.payload.note); const hit = t && RU.find(x => t.indexOf(nrm(x.match)) > -1); c = hit ? hit.cat : ''; }
        return !!c && (Rec.get('cat', null, c) || {}).grp === 'move';
      };
      /* an account by its key, or by its name: a spend can carry either, and
         one account was two bars */
      const A = Rec.map('acct') || {};
      const acctOf = v => { if (!v) return ''; if (A[v]) return v; const lv = String(v).toLowerCase(); return Object.keys(A).find(k => String(A[k].name || '').toLowerCase() === lv) || v; };
      const week = start => {
        let total = 0; const by = {};
        for (let i = 0; i < n; i++) {
          Rec.all('spend', { date: LifeOS.shift(start, -i) }).forEach(r => {
            if (moved(r)) return;
            const a = Number(r.payload.amt) || 0;
            total += a;
            const k = acctOf(r.payload.acct);
            by[k] = (by[k] || 0) + a;
          });
        }
        return { total: total, by: by };
      };
      const now = week(LifeOS.day()), prev = week(LifeOS.shift(LifeOS.day(), -n));
      if (!now.total && !prev.total) {
        body.appendChild(el('div', 'empty', n === 7 ? 'Nothing spent in the last two weeks.' : 'Nothing spent in the last ' + (n * 2) + ' days.'));
        return;
      }
      /* On shared/chart.js: this week's total and how it compares on top, in
         words, and where it went ranked underneath, each bar against the
         biggest. */
      const diff = now.total - prev.total;
      /* the last 7 days, said as that: "this week" read as since Monday */
      if (partOn(cfg, 'total') || partOn(cfg, 'vs')) body.appendChild(Chart.header({ size: 'sm',
        value: partOn(cfg, 'total') ? peso(now.total) : '', unit: partOn(cfg, 'total') ? 'in ' + n + ' days' : '',
        sub: !partOn(cfg, 'vs') ? '' : Math.abs(diff) < 1 ? 'the same as the ' + n + ' days before'
          : peso(Math.abs(diff)) + (diff > 0 ? ' more' : ' less') + ' than the ' + n + ' days before' }).el);
      const rows = Object.keys(now.by).map(k => ({ name: A[k] ? A[k].name : (k || 'No account'), amt: now.by[k] }));
      if (rows.length && partOn(cfg, 'acct')) body.appendChild(Chart.shares(rows, { max: 5, total: now.total, fmt: peso }));
    },
  },

  /* ══════════════ DRINKS ══════════════
     Tom, 2026-09-22: the next two drinks ELEMENT says to take, and a tap
     opens ELEMENT over the home screen rather than as a place you go.
     The sums live in ELEMENT, so this reads the plan it publishes each time
     it draws, and reads the `dose` rows for what has gone down, so a tick
     made anywhere shows here at once. */
  drinks: {
    nm: 'DRINKS', w: 4, h: 3, app: 'mix', fit: 1, to: ['over', 'mix'],
    plan() {
      const p = Rec.setting('mix', 'plan');
      if (!p || p.date !== LifeOS.day() || !Array.isArray(p.drinks)) return null;
      const took = {};
      Rec.all('dose', { date: p.date }).forEach(r => { took[r.key] = 1; });
      return p.drinks.map(d => Object.assign({}, d, { done: d.doses.every(x => took[x.id]) }));
    },
    sub: () => {
      const p = WIDGETS.drinks.plan();
      if (!p) return 'no plan today';
      const left = p.filter(d => !d.done).length;
      return left ? left + ' of ' + p.length + ' to take' : 'all taken';
    },
    parts: [['sub', 'Details'], ['doses', 'Amounts']],
    draw(body, cfg) {
      const p = WIDGETS.drinks.plan();
      const list = el('div', 'rowlist');
      const openIt = () => openOver('mix');
      if (!p) {
        body.appendChild(el('div', 'empty', 'No drinks planned today. <span class="link">Open ELEMENT</span>'));
        body.querySelector('.link').onclick = openIt;
        return;
      }
      const next = p.filter(d => !d.done).slice(0, 2);
      if (!next.length) { body.appendChild(el('div', 'empty', 'All drinks taken today')); return; }
      next.forEach(d => {
        const r = el('div', 'row drink');
        r.setAttribute('role', 'button');
        r.tabIndex = 0;
        r.innerHTML = '<div class="n"><b>' + esc(d.nm) + '</b>' + (partOn(cfg, 'sub') ? '<small>' + esc(d.sub) + '</small>' : '') +
          (partOn(cfg, 'doses') ? '<span class="dl">' + d.doses.map(x => esc(x.name) + ' <i>' + x.g.toFixed(3) + 'g</i>').join(' · ') + '</span>' : '') + '</div>';
        r.onclick = openIt;
        r.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openIt(); } };
        list.appendChild(r);
      });
      body.appendChild(list);
    },
  },

  /* ══════════════ TO WEIGH ══════════════
     Tom, 2026-10-25: ELEMENT's powders still to weigh today, in grams, each
     drink or meal with a tick. The grams are ELEMENT's, read from the plan it
     publishes (`mix.plan`, each dose with its mineral and mg since ELEMENT
     1.0.11); this card does no sums of its own. A tick writes the `dose` rows
     the way ELEMENT's `tickCard` does and then `mixToStatus`, a copy of
     ELEMENT's `toStatus`, so STATUS's sodium, potassium, zinc and magnesium
     move at once. Change ELEMENT's and these together. */
  toweigh: {
    nm: 'TO WEIGH', w: 4, h: 4, app: 'mix', fit: 1, to: ['over', 'mix'],
    plan: () => WIDGETS.drinks.plan(),
    sub: () => {
      const p = WIDGETS.toweigh.plan();
      if (!p) return 'no plan today';
      const left = p.filter(d => !d.done).length;
      return left ? left + ' of ' + p.length + ' left' : 'all taken';
    },
    parts: [['done', 'Taken today'], ['sub', 'Details']],
    tick(s, on) {
      const d = LifeOS.day();
      if (on && s.doses.some(x => !x.nut)) { toast('Open ELEMENT once today to tick from here'); openOver('mix'); return; }
      s.doses.forEach(x => {
        if (on) Rec.set('dose', d, x.id, { nut: x.nut, mg: x.mg, g: x.g, slot: s.id, t: Date.now() });
        else Rec.del('dose', d, x.id);
      });
      mixToStatus(d);
      if (typeof Mobile !== 'undefined') Mobile.feedback(on ? 'success' : 'untick');
      drawHome();
    },
    draw(body, cfg) {
      const p = WIDGETS.toweigh.plan();
      if (!p) {
        body.appendChild(el('div', 'empty', 'No plan today.'));
        const bar = el('div', 'tbar');
        bar.appendChild(tbtn('OPEN ELEMENT', () => openOver('mix'), 'go'));
        body.appendChild(bar);
        return;
      }
      const show = p.filter(s => !s.done || partOn(cfg, 'done'));
      if (!show.length) { body.appendChild(el('div', 'empty', 'All taken today.')); return; }
      const list = el('div', 'rowlist');
      show.forEach(s => {
        const r = el('div', 'row weigh' + (s.done ? ' done' : ''));
        const ck = el('button', 'chk' + (s.done ? ' on' : ''), (typeof Icons !== 'undefined' && Icons.svg('done', { size: 14 })) || '✓');
        ck.setAttribute('aria-label', (s.done ? 'Untick ' : 'Taken: ') + s.nm);
        ck.onclick = ev => { ev.stopPropagation(); WIDGETS.toweigh.tick(s, !s.done); };
        r.appendChild(ck);
        r.appendChild(el('div', 'n', '<b>' + esc(s.nm) + '</b>' + (partOn(cfg, 'sub') && s.sub ? '<small>' + esc(s.sub) + '</small>' : '') +
          '<span class="dl">' + s.doses.map(x => esc(x.name) + ' <i>' + x.g.toFixed(3) + 'g</i>').join(' · ') + '</span>'));
        list.appendChild(r);
      });
      body.appendChild(list);
    },
  },

  /* ══════════════ WORK DONE ══════════════
     Tom, 2026-09-22: what got done and what the numbers averaged, over 7
     and 30 days, and 90 and 180 once the records reach back that far. A
     column for a stretch the data does not cover would be an average of
     less than it says. Averages are over the days that HAVE a reading, and
     the row says how many that was, so a week with two weigh-ins is not
     passed off as seven. No verdicts: the numbers and nothing else. */
  /* Columns and rows picked from the menu since 1.0.74 (Tom, 2026-10-18):
     Time frames ticks any of PERIODS, Show turns rows off. Untouched, it
     shows what it always did. A stretch he ticked is shown even when the
     records do not reach back that far; its cells say how many days had a
     reading, as before. */
  workdone: {
    nm: 'WORK DONE', w: 6, h: 5, fit: 1,
    periods: PERIODS.map(p => p[0]),
    periodsDef() {
      const first = firstDay(), today = LifeOS.day();
      const back = first ? Math.round((new Date(today + 'T12:00:00') - new Date(first + 'T12:00:00')) / 864e5) + 1 : 0;
      return [7, 30, 90, 180].filter(n => n <= 30 || back >= n).map(n => 'd' + n);
    },
    parts: [['trained', 'Times trained'], ['meals', 'Meals tracked'], ['logged', 'Days logged'], ['bullets', 'Bullets written'],
      ['sleep', 'Sleep'], ['weight', 'Weight'], ['mood', 'Mood'], ['energy', 'Energy'], ['kcal', 'Calories'], ['p', 'Protein'], ['steps', 'Steps']],
    cols: cfg => ((cfg && cfg.cols) || WIDGETS.workdone.periodsDef()).map(id => periodOf(id)).filter(Boolean),
    sub: cfg => WIDGETS.workdone.cols(cfg).map(p => p.label.toLowerCase()).join(', '),
    draw(body, cfg) {
      const today = LifeOS.day(), cols = WIDGETS.workdone.cols(cfg);
      const from = cols.reduce((a, p) => p.from < a ? p.from : a, today);
      const inSpan = (d, P) => d && d >= P.from && d <= P.to;
      const days = [];
      for (let d = today; d >= from; d = LifeOS.shift(d, -1)) days.push(d);

      /* ── counts ── */
      /* times trained and meals counted the way LOCKED IN counts them: a
         day TRAIN counts, and a sitting rather than each food in it. A line
         an app wrote for him (a bill, a review, the brief) is not one he wrote. */
      const logged = {}, mealsBy = {}, bullets = [], S = {};
      cols.forEach(P => { S[P.id] = WIDGETS.lockedin.sums(P.n, P.to); });
      Rec.all('set').forEach(r => { if (r.date >= from) logged[r.date] = 1; });
      Rec.all('meal').forEach(r => { if (r.date >= from) { (mealsBy[r.date] = mealsBy[r.date] || []).push(r.payload); logged[r.date] = 1; } });
      Rec.all('note').forEach(r => { const s = r.payload && r.payload.src; if (r.date >= from && s !== 'wealth' && s !== 'arc' && s !== 'brief') { bullets.push(r.date); logged[r.date] = 1; } });
      Rec.all('ev').forEach(r => { if (r.date >= from) logged[r.date] = 1; });
      const count = (map, P) => Object.keys(map).filter(d => inSpan(d, P)).length;
      const work = [
        ['trained', 'Times trained', P => S[P.id].sessions],
        ['meals', 'Meals tracked', P => S[P.id].meals],
        ['logged', 'Days logged', P => count(logged, P)],
        ['bullets', 'Bullets written', P => bullets.filter(d => inSpan(d, P)).length],
      ].filter(w => partOn(cfg, w[0]));

      /* ── averages ── one number per day, then the mean of the days that have one */
      const perDay = {};
      const fields = Rec.map('field') || {};
      const measure = (id, label, dp) => {
        if (!fields[id] || !partOn(cfg, id)) return;
        const v = {};
        days.forEach(d => { const x = evValue(d, id); if (x != null && isFinite(x)) v[d] = Number(x); });
        perDay[label] = { v: v, dp: dp };
      };
      measure('sleep', 'Sleep, hrs', 1);
      measure('weight', 'Weight, ' + ((fields.weight && fields.weight.unit) || 'kg'), 1);
      measure('mood', 'Mood', 1);
      measure('energy', 'Energy', 1);
      ['kcal', 'p'].forEach(k => {
        if (!partOn(cfg, k)) return;
        const v = {};
        /* today is half eaten, so it is left out of the averages */
        Object.keys(mealsBy).forEach(d => { if (d >= today) return; v[d] = mealsBy[d].reduce((a, m) => a + (Number(m[k]) || 0), 0); });
        perDay[k === 'kcal' ? 'Calories' : 'Protein, g'] = { v: v, dp: 0 };
      });
      measure('steps', 'Steps', 0);

      const t = el('table', 'wd');
      const head = '<tr><th></th>' + cols.map(P => '<th title="' + P.from + ' to ' + P.to + '">' + P.head + '</th>').join('') + '</tr>';
      let rows = work.length ? '<tr class="grp"><td colspan="' + (cols.length + 1) + '">COUNTS</td></tr>' : '';
      work.forEach(w => { rows += '<tr><td>' + w[1] + '</td>' + cols.map(P => '<td>' + w[2](P).toLocaleString() + '</td>').join('') + '</tr>'; });
      let avg = '';
      Object.keys(perDay).forEach(label => {
        const f = perDay[label];
        const cells = cols.map(P => {
          const got = Object.keys(f.v).filter(d => inSpan(d, P));
          if (!got.length) return '<td class="nil">—</td>';
          const m = got.reduce((a, d) => a + f.v[d], 0) / got.length;
          return '<td title="' + got.length + ' of ' + P.n + ' days had a reading">' +
            (got.length < P.n ? '<small>' + got.length + 'd</small>' : '') +
            m.toLocaleString(undefined, { maximumFractionDigits: f.dp, minimumFractionDigits: f.dp }) + '</td>';
        });
        if (cells.every(c => c.indexOf('nil') > -1)) return;
        avg += '<tr><td>' + label + '</td>' + cells.join('') + '</tr>';
      });
      if (avg) rows += '<tr class="grp"><td colspan="' + (cols.length + 1) + '">AVERAGES</td></tr>' + avg;
      t.innerHTML = '<thead>' + head + '</thead><tbody>' + rows + '</tbody>';
      body.appendChild(t);
    },
  },

  /* ══════════════ LOCKED IN ══════════════
     Tom, 2026-10-06: "a widget that shows me how locked in I am. Average
     training sessions, average number of tracked meals, average calorie
     deficit/surplus, average steps. No letter grades just math."
     Every number covers the last N FINISHED days, ending yesterday, so a day
     still in progress never drags an average down (half a day of food reads
     as a deficit, half a day of steps as a slump). Under each number, the N
     days before it, for the trend. Sessions follow TRAIN's rule: a day with
     one working set or more, warmups out. Calories are each logged day's
     total against STATUS's maintenance estimate (`tdeeState`), or the
     calorie target when there is none yet, and only days with food logged
     count, since an unlogged day is not a day of zero calories. A meal is
     foods logged close together (see `sums`). */
  /* CONSISTENCY since 2026-10-09 (Tom: "Name it the consistency widget");
     the id stays lockedin so boards keep their card. The header names the
     stretch, changed from the card's menu (Tom: "Just say 1 week and make
     that changeable"); it still ends yesterday, for the reason above. */
  lockedin: {
    nm: 'CONSISTENCY', w: 4, h: 4,
    days: [[7, '1 week'], [14, '2 weeks'], [30, '1 month'], [90, '3 months'], [182, '6 months'], [365, '1 year']], day0: 7,
    parts: [['train', 'Training'], ['meals', 'Meals tracked'], ['kcal', 'Calories'], ['steps', 'Steps'],
      ['change', 'Change against before']],
    sub: cfg => (WIDGETS.lockedin.days.filter(d => d[0] === ((cfg && cfg.days) || 7))[0] || [0, ((cfg && cfg.days) || 7) + ' days'])[1],
    /* the four averages over the n days ending on `to` */
    sums(n, to) {
      const from = LifeOS.shift(to, -(n - 1)), inP = d => d && d >= from && d <= to;
      const trained = {};
      Rec.all('set').forEach(r => { if (inP(r.date) && !setIsWarm(r.payload || {}) && setCounts(r.payload || {}, r.date, LifeOS.day())) trained[r.date] = 1; });
      /* a meal is a sitting, not a food: STATUS logs each food as its own row, so
         foods logged within 45 minutes of the one before are one meal. A food
         with no time is a meal of its own. */
      const kcal = {}, at = {}; let meals = 0;
      Rec.all('meal').forEach(r => { if (!inP(r.date)) return; kcal[r.date] = (kcal[r.date] || 0) + (Number(r.payload.kcal) || 0);
        if (r.payload.t) (at[r.date] = at[r.date] || []).push(+r.payload.t); else meals++; });
      Object.keys(at).forEach(d => at[d].sort((x, z) => x - z).forEach((t, i, A) => { if (!i || t - A[i - 1] > 45 * 60000) meals++; }));
      const st = Rec.setting('status', 'tdeeState'), tdee = st && Number(st.v) > 0 ? Number(st.v) : 0;
      const tgt = Number(statusTargets().kcal) || 0, base = tdee || tgt;
      const fd = Object.keys(kcal);
      const steps = [];
      const sday = {};
      for (let i = 0; i < n; i++) { const dd = LifeOS.shift(to, -i), v = evValue(dd, 'steps'); if (v != null && isFinite(v)) { steps.push(Number(v)); sday[dd] = Number(v); } }
      return {
        n: n, sessions: Object.keys(trained).length, meals: meals, foodDays: fd.length,
        base: base, vs: tdee ? 'maintenance' : 'target',
        diff: base && fd.length ? fd.reduce((a, d) => a + kcal[d] - base, 0) / fd.length : null,
        eat: fd.length ? fd.reduce((a, d) => a + kcal[d], 0) / fd.length : null, tgt: tgt, tdee: tdee,
        stepGoal: Number((((Rec.map('field') || {}).steps) || {}).target) || 0,
        from: from, tday: trained, kday: kcal, sday: sday,
        stepDays: steps.length, steps: steps.length ? steps.reduce((a, v) => a + v, 0) / steps.length : null,
      };
    },
    draw(body, cfg) {
      const n = (cfg && cfg.days) || 7, y = LifeOS.shift(LifeOS.day(), -1);
      const W = WIDGETS.lockedin, a = W.sums(n, y), b = W.sums(n, LifeOS.shift(y, -n));
      const num = (v, dp) => v.toLocaleString(undefined, { minimumFractionDigits: dp, maximumFractionDigits: dp });
      const signed = v => (v > 0 ? '+' : v < 0 ? '−' : '') + num(Math.abs(Math.round(v)), 0);
      const perWk = s => s.sessions / s.n * 7, perDay = s => s.meals / s.n;
      const ico = r => (typeof Icons !== 'undefined' && Icons.svg(r, { size: 14, weight: 2.2 })) || '';
      const grid = el('div', 'lc');
      /* one tile: its part id, label, big number, unit, and the change
         against the n days before. `tone` 1 colours the change by which way
         it went (more training, meals, steps); 0 keeps it neutral, since a
         smaller deficit is not better or worse on its own */
      const tile = (id, label, val, unit, now, was, dp, tone, wasSaid) => {
        if (!partOn(cfg, id)) return;
        const t = el('div', 'lc-t');
        let ch = '';
        if (partOn(cfg, 'change') && now != null && was != null) {
          const dd = Math.round((now - was) * Math.pow(10, dp)) / Math.pow(10, dp);
          ch = !dd ? '<span class="lc-d">same as before</span>'
            : '<span class="lc-d ' + (tone ? (dd > 0 ? 'up' : 'dn') : 'flat') + '">' + ico(dd > 0 ? 'collapse' : 'expand') + num(Math.abs(dd), dp) + '</span>';
        }
        t.innerHTML = '<span class="lc-l">' + label + '</span>' +
          '<span class="lc-v' + (val === '—' ? ' nil' : '') + '">' + val + (unit ? ' <span class="lc-u">' + unit + '</span>' : '') + '</span>' + ch;
        if (wasSaid) t.title = 'The ' + n + ' days before: ' + wasSaid;
        grid.appendChild(t);
      };
      /* a week shows the sessions themselves; longer, the average a week */
      if (!Rec.all('set').length) tile('train', 'TRAINED', '—', 'nothing in TRAIN', null, null, 0, 1);
      else if (n === 7) tile('train', 'TRAINED', num(a.sessions, 0), a.sessions === 1 ? 'session' : 'sessions', a.sessions, b.sessions, 0, 1, b.sessions + ' sessions');
      else tile('train', 'TRAINED', num(perWk(a), 1), 'a week', perWk(a), perWk(b), 1, 1, num(perWk(b), 1) + ' a week');
      if (!a.foodDays) tile('meals', 'MEALS TRACKED', '—', 'no food logged', null, null, 1, 1);
      else tile('meals', 'MEALS TRACKED', num(perDay(a), 1), 'a day', perDay(a), b.foodDays ? perDay(b) : null, 1, 1, b.foodDays ? num(perDay(b), 1) + ' a day' : '');
      /* calories as the gap a day to maintenance, else to the target */
      if (a.eat == null) tile('kcal', 'CALORIES', '—', 'no food logged', null, null, 0, 0);
      else if (a.diff == null) tile('kcal', 'CALORIES', num(Math.round(a.eat), 0), 'a day', a.eat, b.eat, 0, 0, b.eat == null ? '' : num(Math.round(b.eat), 0) + ' a day');
      else tile('kcal', 'CALORIES', signed(a.diff), 'a day vs ' + a.vs, a.diff, b.diff, 0, 0, b.diff == null ? '' : signed(b.diff) + ' a day');
      if (a.steps == null) tile('steps', 'STEPS', '—', 'no steps logged', null, null, 0, 1);
      else tile('steps', 'STEPS', num(Math.round(a.steps), 0), 'a day', Math.round(a.steps), b.steps == null ? null : Math.round(b.steps), 0, 1, b.steps == null ? '' : num(Math.round(b.steps), 0) + ' a day');
      body.appendChild(grid);
    },
  },

  /* ══════════════ the journal ══════════════
     STATUS writes bullets: a todo, an entry, an event, an idea. These are
     three views of the same rows, split by kind, because what you want from
     a todo and what you want from an idea are different questions. */

  todo: {
    nm: 'TODO', w: 4, h: 4, app: 'quest', to: ['quest', 'today'],
    sub: () => {
      const n = openTodos().length;
      return n ? n + ' open' : 'nothing open';
    },
    parts: [['src', 'Where it came from'], ['age', 'Days old']],
    draw(body, cfg) {
      const list = openTodos();
      if (!list.length) { body.appendChild(el('div', 'empty', 'Nothing open')); return; }
      const wrap = el('div', 'rowlist');
      list.slice(0, 12).forEach(x => {
        const age = todoFrom(x) ? daysBetween(todoFrom(x), LifeOS.day()) : 0;
        const from = todoSource(x);
        /* drawn on its own day, so an open todo carried to today wears the
           box, as STATUS draws it on today; the arrow is for a day gone */
        const r = tickRow(x, x.date);
        if (from && partOn(cfg, 'src')) r.appendChild(el('span', 'tag', esc(from)));
        if (age > 0 && partOn(cfg, 'age')) r.appendChild(el('span', 'd', age + 'd'));
        wrap.appendChild(r);
      });
      /* the header counts every open todo, so the cut says so */
      if (list.length > 12) wrap.appendChild(el('div', 'empty', (list.length - 12) + ' more in QUESTS'));
      body.appendChild(wrap);
    },
  },

  /* IDEAS and EVENTS: how far back, and the date on each line, from the
     card's menu. bulletList with those two choices; untouched it is the
     same list. */
  ideas: {
    nm: 'IDEAS', w: 4, h: 3, app: 'status', to: ['status', 'now'],
    days: [[7, '7 days'], [30, '30 days'], [90, '90 days'], [365, 'a year'], [36500, 'All of them']], day0: 36500,
    menu: (cfg, redraw) => [partToggle(cfg, 'date', 'Show dates', redraw)],
    rows(kind, cfg) {
      const n = (cfg && cfg.days) || 36500, from = LifeOS.shift(LifeOS.day(), -(n - 1));
      return notesOfKind(kind).filter(r => n >= 36500 || !r.date || r.date >= from);
    },
    list(body, kind, empty, cfg) {
      const rows = WIDGETS.ideas.rows(kind, cfg);
      if (!rows.length) { body.appendChild(el('div', 'empty', empty)); return; }
      const wrap = el('div', 'rowlist');
      rows.slice(0, 10).forEach(r => {
        const row = bulletRow(r, r.date);
        row.classList.add('wraps');
        if (r.date && partOn(cfg, 'date')) row.appendChild(el('span', 'd', esc(Day.short(r.date))));
        wrap.appendChild(row);
      });
      body.appendChild(wrap);
    },
    sub: cfg => WIDGETS.ideas.rows('idea', cfg).length + ' kept',
    draw(body, cfg) { WIDGETS.ideas.list(body, 'idea', 'No ideas', cfg); },
  },

  events: {
    nm: 'EVENTS', w: 4, h: 3, app: 'status', to: ['status', 'now'],
    days: [[7, '7 days'], [30, '30 days'], [90, '90 days'], [365, 'a year'], [36500, 'All of them']], day0: 36500,
    menu: (cfg, redraw) => [partToggle(cfg, 'date', 'Show dates', redraw)],
    sub: cfg => { const n = WIDGETS.ideas.rows('event', cfg).length; return n ? n + ' logged' : 'none logged'; },
    draw(body, cfg) { WIDGETS.ideas.list(body, 'event', 'No events', cfg); },
  },

  /* ══════════════ streaks, off ticks ══════════════
     The old one counted `habit` rows, which only HABITS ever wrote. A streak
     is not a thing to store, it is a sum of ticks, and every app writes those.
     So this counts back from today over the shared log and nothing has to be
     kept in step. */

  streaks: {
    nm: 'STREAKS', w: 3, h: 3,
    sub: () => 'running now',
    /* which streaks show, picked by name from the card's menu; a new one
       shows until it is turned off */
    parts: () => {
      const R = WIDGETS.streaks.runs(), twice = {};
      R.forEach(x => { twice[x.name] = (twice[x.name] || 0) + 1; });
      return R.map(x => [x.id, x.name + (twice[x.name] > 1 && x.part ? ', ' + x.part : '')]);
    },
    runs() {
      /* Read the ticks, not the vocabulary. An activity ticked from an app
         that never registered a name still has a streak, and a streak the
         screen cannot see is the same as no streak. */
      const seen = {};
      for (let i = 0; i < 60; i++) {
        const day = LifeOS.doc().log[LifeOS.shift(LifeOS.day(), -i)] || {};
        Object.keys(day).forEach(id => { seen[id] = 1; });
      }
      /* Two of STATUS's journal ticks are not things he did: note-todo is
         ticked on every day with a todo still open, and a note-at- tick is
         one timed line. Entries, events and ideas stay: a day something was
         written. */
      return Object.keys(seen)
        .filter(id => id !== 'note-todo' && id.indexOf('note-at-') !== 0)
        .map(id => Object.assign({ n: tickStreak(id) }, actLabel(id), { id: id }))
        .filter(x => x.n > 0).sort((a, b) => b.n - a.n);
    },
    draw(body, cfg) {
      const runs = WIDGETS.streaks.runs().filter(x => partOn(cfg, x.id));
      if (!runs.length) {
        body.appendChild(el('div', 'empty', 'No streak data'));
        return;
      }

  sticky: {
    nm: 'STICKY NOTE', w: 4, h: 3, grp: 'DESK',
    sub: () => 'saved with your data',
    draw(body) {
      const ta = document.createElement('textarea');
      ta.value = Rec.setting('lifeos', 'sticky') || '';
      ta.placeholder = 'Anything.';
      ta.spellcheck = false;
      ta.setAttribute('aria-label', 'Sticky note');
      /* The card's own type, except on a touch screen, where mobile.js sets
         every box to 16px or more so Safari does not zoom the page on a tap;
         an inline `font:inherit` beat that rule and the box was 14px. */
      ta.style.cssText =
        'width:100%;height:100%;min-height:70px;resize:none;border:0;outline:0;padding:0;' +
        'background:transparent;color:var(--txt);font-family:inherit;line-height:1.5;' +
        (matchMedia('(pointer:coarse)').matches ? '' : 'font-size:inherit;');
      /* On a phone a card is as tall as what is in it and the page is what
         scrolls, so the box grows with the note rather than scrolling inside
         the card. */
      const fit = () => { if (NARROW()) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; } };
      let t;
      /* It goes in as a setting rather than into this browser, so it is in the
         backup and it follows you to the other machine. Half a second after
         the last key, and at once when the box is left (the page leaving
         blurs it first, UI.commitFocused), so a note typed and closed inside
         the half second is kept. */
      const save = () => { clearTimeout(t); if (ta.value !== (Rec.setting('lifeos', 'sticky') || '')) Rec.setting('lifeos', 'sticky', ta.value); };
      ta.oninput = () => { fit(); clearTimeout(t); t = setTimeout(save, 500); };
      ta.onblur = save;
      body.appendChild(ta);
      requestAnimationFrame(fit);
    },
  },

  timer: {
    nm: 'TIMER', w: 3, h: 2, fit: 1, grp: 'DESK',
    sub: () => '',
    parts: [['presets', '1m, 3m and 5m'], ['set', 'Set button'], ['stop', 'Stop button']],
    draw(body, cfg) {
      /* The count lives in TOOLS, not in here: see "desk tools" above. */
      const s = toolOf(cfg, timerTool);
      const face = el('div', 'tface');
      let stopB;
      const show = now => { const l = s.left(now || Date.now()); dg(face, mmss(l)); face.classList.toggle('idle', !l); if (stopB) stopB.style.display = l ? '' : 'none'; };
      s.paint = now => { if (face.isConnected) show(now); };
      show();
      const start = secs => { s.set = secs; s.end = Date.now() + secs * 1000; show(); };
      const bar = el('div', 'tbar');
      /* Tom, 2026-09-17: "Click Xm = X minutes, but make it need a double tap
         if we want it to override a currently running timer."

         These used to ADD, so 3m pressed on a timer showing 4:12 gave 7:12 and
         there was no way at all to ask for the one thing the button has
         written on it. 3m is three minutes now.

         The double tap is a guard, not a second meaning. Nothing is running,
         so nothing can be lost: one press. Something IS running, so one press
         would throw away a count you are in the middle of: it says what it is
         about to do and waits to be told twice. The second press has to land
         within about three quarters of a second, which is a double click, and
         a lone press is a message rather than a change. */
      const AGAIN_MS = 750;
      [[60, '1m'], [180, '3m'], [300, '5m']].forEach(([n, lbl]) => {
        let asked = 0;
        const b = tbtn(lbl, () => {
          const now = Date.now();
          if (s.left(now) && now - asked > AGAIN_MS) { asked = now; return toast('Again to make it ' + lbl); }
          asked = 0;
          start(n);
        });
        b.title = lbl + ' · twice to replace a running timer';
        bar.appendChild(b);
      });
      /* Tom, 2026-09-17: "Timer widget - let me manually set". Three presets
         are three guesses, and the fourth thing he wants is always the one
         that is not there. The face is the control: press it and type. */
      const setIt = () => {
        const l = s.left(Date.now());
        UI.dialog({
          title: 'SET THE TIMER', width: 320, focus: true,
          body: b2 => {
            b2.appendChild(el('label', 'fl', 'Minutes, or minutes and seconds'));
            const i = UI.field('text', { value: l ? Math.floor(l / 60) + ':' + zpad(l % 60) : '' });
            i.placeholder = '10   2.5   or   1:30';
            b2.appendChild(i);
          },
          actions: [{ label: 'CANCEL' }, { label: 'START', kind: 'go', fn: h => {
            const box = h.body.querySelector('input.mb-input, input');
            const t = String((box && box.value) || '').trim();
            if (!t) return;
            /* "10" is ten minutes, "1:30" is a minute and a half, "0:45" is
               forty five seconds, and "2.5" is two and a half — Tom, 2026-09-17,
               "Should be able to set 2.5 Minutes". */
            const m = t.match(/^(\d+):([0-5]?\d)$/);
            let secs = 0;
            if (m) secs = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
            else if (/^\d+(?:\.\d+)?$/.test(t)) secs = Math.round(parseFloat(t) * 60);
            else return toast('Try 10, 2.5, or 1:30', { bad: true });
            if (!secs) return;
            start(secs);
          } }],
        });
      };
      face.style.cursor = 'pointer';
      face.title = 'Set the timer';
      face.onclick = setIt;
      if (!partOn(cfg, 'presets')) bar.innerHTML = '';
      if (partOn(cfg, 'set')) bar.appendChild(tbtn('SET', setIt));
      stopB = tbtn('STOP', () => { s.end = 0; show(); });
      if (partOn(cfg, 'stop')) bar.appendChild(stopB);
      show();
      body.appendChild(face); if (bar.childNodes.length) body.appendChild(bar);
    },
  },

    menu() {
      const L = WIDGETS.life, born = Rec.setting('lifeos', 'born');
      const span = Number(Rec.setting('lifeos', 'span') || 80);
      const youth = Number(Rec.setting('lifeos', 'youth') || 0), old = Number(Rec.setting('lifeos', 'old') || 0);

        { label: 'Name the bands', sub: [['youth', 'First band'], ['mid', 'Middle band'], ['old', 'Last band']].map(b => ({
          label: b[1] + ': ' + L.bandName(b[0]), fn: () => askName(b[0]) })) },
      ];
    },
    draw(body, cfg) {
      const L = WIDGETS.life;
      const born = Rec.setting('lifeos', 'born');
      const span = Number(Rec.setting('lifeos', 'span') || 80);
      if (!born) {
        body.appendChild(el('div', 'empty', 'No birth year'));
        const inp = UI.field('number', { placeholder: 'Birth year, e.g. 1994' });
        inp.style.cssText = 'flex:1;min-width:0';
        const go = tbtn('SET', () => {
          const v = parseInt(inp.value, 10);
          if (v > 1900 && v < 2100) { Rec.setting('lifeos', 'born', v); drawHome(); }
        }, 'go');
        inp.onkeydown = e => { if (e.key === 'Enter') go.click(); };
        const row = el('div', 'tbar');
        row.appendChild(inp); row.appendChild(go);
        body.appendChild(row);

      const age = ageNow(born);
      /* Tom, 2026-09-17: "Life widget - right click menu to denote Youth and
         Old Age", then, the same day: "Set Age, Set Colors and a legend I want
         to denote when I was young and when im gonna be too old for a lot of
         things."

         is a hue and the living is the weight: two facts on one square

      const youth = Number(Rec.setting('lifeos', 'youth') || 0);

      const tint = n => 'var(--data-' + n + ')';

      const top = el('div');

      const head = el('div');
      head.style.cssText = 'font-family:var(--f1);font-size:var(--f-7);color:var(--txt);letter-spacing:.04em;line-height:var(--lh-tight)';
      head.innerHTML = age + '<span style="color:var(--dim2);font-size:var(--f-3)"> / ' + span + '</span>';

      body.appendChild(top);

      const grid = el('div');
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(20,1fr);gap:var(--s-1)';
      for (let i = 0; i < span; i++) {
        const b = el('i');
        const band = bandOf(i);
        b.title = 'age ' + i + ((youth || old) ? ' · ' + L.bandName(band) : '');

           1 against the gold of the years lived, the same square */
        b.style.cssText = 'display:block;aspect-ratio:1;border-radius:var(--radius-sm);cursor:context-menu;' +
          'background:' + (i === age ? 'var(--txt)' : ((youth || old) ? tint(cols[band]) : 'var(--acc)')) +
          ';opacity:' + (i <= age ? '1' : '.22');
        b.oncontextmenu = ev => {
          ev.preventDefault();
          /* The card has a right-click menu of its own and it is the parent,
             so without this the year's menu opened and was replaced by the
             widget's a moment later. */
          ev.stopPropagation();
          UI.menu(ev.clientX, ev.clientY, [
            { label: 'First band ends at ' + i, fn: () => { Rec.setting('lifeos', 'youth', i); drawHome(); } },
            { label: 'Last band starts at ' + i, fn: () => { Rec.setting('lifeos', 'old', i); drawHome(); } },
            ...((youth || old) ? [{ label: 'Clear both', fn: () => {
              Rec.setting('lifeos', 'youth', 0); Rec.setting('lifeos', 'old', 0); drawHome();
            } }] : []),
          ], { title: 'AGE ' + i });

        grid.appendChild(b);
      }
      if (partOn(cfg, 'grid')) body.appendChild(grid);

      /* ── the legend ──
         What he asked the bands FOR: "when I was young and when im gonna be
         too old for a lot of things". Without it the square is three hues and
         no statement. Drawn only once a boundary is set, because three chips
         naming nothing is worse than no chips. */
      if ((youth || old) && partOn(cfg, 'legend')) {
        const key = el('div');
        key.style.cssText = 'display:flex;flex-wrap:wrap;gap:var(--s-2)';
        const chip = (which, label, range) => {
          const c = el('div');
          c.style.cssText = 'display:flex;align-items:center;gap:var(--s-1);font-family:var(--f1);' +
            'font-size:var(--f-1);letter-spacing:.1em;color:var(--dim);white-space:nowrap';
          c.innerHTML = '<i style="width:var(--s-2);height:var(--s-2);border-radius:var(--radius-sm);flex:0 0 auto;background:' +
            tint(cols[which]) + '"></i>' + esc(label) +
            (range ? '<span style="color:var(--dim2)">' + esc(range) + '</span>' : '');
          key.appendChild(c);
        };
        if (youth) chip('youth', L.bandName('youth'), 'to ' + youth);
        chip('mid', L.bandName('mid'), (youth || 0) + (old ? '–' + old : '+'));
        if (old) chip('old', L.bandName('old'), 'from ' + old);
        top.appendChild(key);
      }
      if (!top.childNodes.length) top.remove();
    },
