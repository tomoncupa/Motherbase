  spend: {
    nm: 'SPEND', w: 4, h: 3, app: 'status', to: ['status', 'money'],
    sub: () => 'this week against last',
    draw(body) {
      const week = start => {
        let total = 0; const by = {};
        for (let i = 0; i < 7; i++) {
          Rec.all('spend', { date: LifeOS.shift(start, -i) }).forEach(r => {
            const a = Number(r.payload.amt) || 0;
            total += a;
            const k = r.payload.acct || 'unassigned';
            by[k] = (by[k] || 0) + a;
          });
        }
        return { total: total, by: by };
      };
      const now = week(LifeOS.day()), prev = week(LifeOS.shift(LifeOS.day(), -7));
      if (!now.total && !prev.total) {
        body.appendChild(el('div', 'empty', 'Nothing spent in the last two weeks.'));
        return;
      }
      /* On shared/chart.js: this week's total and how it compares on top, in
         words, and where it went ranked underneath, each bar against the
         biggest. */
      const diff = now.total - prev.total;
      body.appendChild(Chart.header({ size: 'sm', value: Math.round(now.total).toLocaleString(), unit: 'this week',
        sub: Math.abs(diff) < 1 ? 'the same as last week'
          : Math.round(Math.abs(diff)).toLocaleString() + (diff > 0 ? ' more' : ' less') + ' than last week' }).el);
      const accts = Rec.map('acct');
      const rows = Object.keys(now.by).map(k => ({ name: accts[k] ? accts[k].name : k, amt: now.by[k] }));
      if (rows.length) body.appendChild(Chart.shares(rows, { max: 5, total: now.total }));
    },
  },

  /* ══════════════ DRINKS ══════════════
     Tom, 2026-09-22: the next two drinks ELEMENT says to take, and a tap
     opens ELEMENT over the home screen rather than as a place you go.
     The sums live in ELEMENT, so this reads the plan it publishes each time
     it draws, and reads the `dose` rows for what has gone down, so a tick
     made anywhere shows here at once. */
  drinks: {
    nm: 'DRINKS', w: 4, h: 3, app: 'mix', fit: 1, to: ['over', 'mix'],
    plan() {
      const p = Rec.setting('mix', 'plan');
      if (!p || p.date !== LifeOS.day() || !Array.isArray(p.drinks)) return null;
      const took = {};
      Rec.all('dose', { date: p.date }).forEach(r => { took[r.key] = 1; });
      return p.drinks.map(d => Object.assign({}, d, { done: d.doses.every(x => took[x.id]) }));
    },
    sub: () => {
      const p = WIDGETS.drinks.plan();
      if (!p) return 'open ELEMENT to plan today';
      const left = p.filter(d => !d.done).length;
      return left ? left + ' of ' + p.length + ' to take' : 'all taken';
    },
    draw(body) {
      const p = WIDGETS.drinks.plan();
      const list = el('div', 'rowlist');
      const openIt = () => openOver('mix');
      if (!p) {
        body.appendChild(el('div', 'empty', 'Nothing planned for today yet. ' +
          '<span class="link">Open ELEMENT</span> and it works the day out.'));
        body.querySelector('.link').onclick = openIt;
        return;
      }
      const next = p.filter(d => !d.done).slice(0, 2);
      if (!next.length) { body.appendChild(el('div', 'empty', 'Every drink today has gone down.')); return; }
      next.forEach(d => {
        const r = el('div', 'row drink');
        r.setAttribute('role', 'button');
        r.tabIndex = 0;
        r.innerHTML = '<div class="n"><b>' + esc(d.nm) + '</b><small>' + esc(d.sub) + '</small>' +
          '<span class="dl">' + d.doses.map(x => esc(x.name) + ' <i>' + x.g.toFixed(3) + 'g</i>').join(' · ') + '</span></div>';
        r.onclick = openIt;
        r.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openIt(); } };
        list.appendChild(r);
      });
      body.appendChild(list);
    },
  },

  /* ══════════════ WORK DONE ══════════════
     Tom, 2026-09-22: what got done and what the numbers averaged, over 7
     and 30 days, and 90 and 180 once the records reach back that far. A
     column for a stretch the data does not cover would be an average of
     less than it says. Averages are over the days that HAVE a reading, and
     the row says how many that was, so a week with two weigh-ins is not
     passed off as seven. No verdicts: the numbers and nothing else. */
  workdone: {
    nm: 'WORK DONE', w: 6, h: 5, fit: 1,
    spans() {
      /* the first day anything was recorded, read off the rows themselves */
      let first = null;
      ['ev', 'meal', 'note', 'set'].forEach(t => Rec.all(t).forEach(r => {
        if (r.date && (!first || r.date < first)) first = r.date;
      }));
      const today = LifeOS.day();
      const back = first ? Math.round((new Date(today + 'T12:00:00') - new Date(first + 'T12:00:00')) / 864e5) + 1 : 0;
      return [7, 30, 90, 180].filter(n => n <= 30 || back >= n);
    },
    sub: () => 'the last ' + WIDGETS.workdone.spans().join(', ') + ' days',
    draw(body) {
      const today = LifeOS.day(), spans = WIDGETS.workdone.spans(), far = spans[spans.length - 1];
      const from = LifeOS.shift(today, -(far - 1));
      const inSpan = (d, n) => d && d <= today && d >= LifeOS.shift(today, -(n - 1));
      const days = [];
      for (let i = 0; i < far; i++) days.push(LifeOS.shift(today, -i));

      /* ── counts ── */
      const trained = {}, logged = {}, mealsBy = {}, bullets = [];
      Rec.all('set').forEach(r => { if (r.date >= from) { trained[r.date] = 1; logged[r.date] = 1; } });
      Rec.all('meal').forEach(r => { if (r.date >= from) { (mealsBy[r.date] = mealsBy[r.date] || []).push(r.payload); logged[r.date] = 1; } });
      Rec.all('note').forEach(r => { if (r.date >= from) { bullets.push(r.date); logged[r.date] = 1; } });
      Rec.all('ev').forEach(r => { if (r.date >= from) logged[r.date] = 1; });
      const count = (map, n) => Object.keys(map).filter(d => inSpan(d, n)).length;
      const work = [
        ['Times trained', n => count(trained, n)],
        ['Meals tracked', n => Object.keys(mealsBy).filter(d => inSpan(d, n)).reduce((a, d) => a + mealsBy[d].length, 0)],
        ['Days logged', n => count(logged, n)],
        ['Bullets written', n => bullets.filter(d => inSpan(d, n)).length],
      ];

      /* ── averages ── one number per day, then the mean of the days that have one */
      const perDay = {};
      const fields = Rec.map('field') || {};
      const measure = (id, label, dp) => {
        if (!fields[id]) return;
        const v = {};
        days.forEach(d => { const x = evValue(d, id); if (x != null && isFinite(x)) v[d] = Number(x); });
        perDay[label] = { v: v, dp: dp };
      };
      measure('sleep', 'Sleep, hrs', 1);
      measure('weight', 'Weight', 1);
      measure('mood', 'Mood', 1);
      measure('energy', 'Energy', 1);
      ['kcal', 'p'].forEach(k => {
        const v = {};
        Object.keys(mealsBy).forEach(d => { v[d] = mealsBy[d].reduce((a, m) => a + (Number(m[k]) || 0), 0); });
        perDay[k === 'kcal' ? 'Calories' : 'Protein, g'] = { v: v, dp: 0 };
      });
      measure('steps', 'Steps', 0);

      const t = el('table', 'wd');
      const head = '<tr><th></th>' + spans.map(n => '<th>' + n + 'D</th>').join('') + '</tr>';
      let rows = '<tr class="grp"><td colspan="' + (spans.length + 1) + '">WORK DONE</td></tr>';
      work.forEach(w => { rows += '<tr><td>' + w[0] + '</td>' + spans.map(n => '<td>' + w[1](n).toLocaleString() + '</td>').join('') + '</tr>'; });
      let avg = '';
      Object.keys(perDay).forEach(label => {
        const f = perDay[label];
        const cells = spans.map(n => {
          const got = Object.keys(f.v).filter(d => inSpan(d, n));
          if (!got.length) return '<td class="nil">—</td>';
          const m = got.reduce((a, d) => a + f.v[d], 0) / got.length;
          return '<td title="' + got.length + ' of ' + n + ' days had a reading">' +
            m.toLocaleString(undefined, { maximumFractionDigits: f.dp, minimumFractionDigits: f.dp }) +
            (got.length < n ? '<small>' + got.length + 'd</small>' : '') + '</td>';
        });
        if (cells.every(c => c.indexOf('nil') > -1)) return;
        avg += '<tr><td>' + label + '</td>' + cells.join('') + '</tr>';
      });
      if (avg) rows += '<tr class="grp"><td colspan="' + (spans.length + 1) + '">AVERAGES</td></tr>' + avg;
      t.innerHTML = '<thead>' + head + '</thead><tbody>' + rows + '</tbody>';
      body.appendChild(t);
    },
  },

  /* ══════════════ LOCKED IN ══════════════
     Tom, 2026-10-06: "a widget that shows me how locked in I am. Average
     training sessions, average number of tracked meals, average calorie
     deficit/surplus, average steps. No letter grades just math."
     Every number covers the last N FINISHED days, ending yesterday, so a day
     still in progress never drags an average down (half a day of food reads
     as a deficit, half a day of steps as a slump). Under each number, the N
     days before it, for the trend. Sessions follow TRAIN's rule: a day with
     one working set or more, warmups out. Calories are each logged day's
     total against STATUS's maintenance estimate (`tdeeState`), or the
     calorie target when there is none yet, and only days with food logged
     count, since an unlogged day is not a day of zero calories. A meal is
     foods logged close together (see `sums`). */
  lockedin: {
    nm: 'LOCKED IN', w: 4, h: 4,
    days: [[7, '7 days'], [14, '14 days'], [30, '30 days'], [90, '90 days']], day0: 7,
    sub: cfg => 'last ' + ((cfg && cfg.days) || 7) + ' days, to yesterday',
    /* the four averages over the n days ending on `to` */
    sums(n, to) {
      const from = LifeOS.shift(to, -(n - 1)), inP = d => d && d >= from && d <= to;
      const trained = {};
      Rec.all('set').forEach(r => { if (inP(r.date) && !setIsWarm(r.payload || {}) && setCounts(r.payload || {}, r.date, LifeOS.day())) trained[r.date] = 1; });
      /* a meal is a sitting, not a food: STATUS logs each food as its own row, so
         foods logged within 45 minutes of the one before are one meal. A food
         with no time is a meal of its own. */
      const kcal = {}, at = {}; let meals = 0;
      Rec.all('meal').forEach(r => { if (!inP(r.date)) return; kcal[r.date] = (kcal[r.date] || 0) + (Number(r.payload.kcal) || 0);
        if (r.payload.t) (at[r.date] = at[r.date] || []).push(+r.payload.t); else meals++; });
      Object.keys(at).forEach(d => at[d].sort((x, z) => x - z).forEach((t, i, A) => { if (!i || t - A[i - 1] > 45 * 60000) meals++; }));
      const st = Rec.setting('status', 'tdeeState'), tdee = st && Number(st.v) > 0 ? Number(st.v) : 0;
      const tgt = Number(statusTargets().kcal) || 0, base = tdee || tgt;
      const fd = Object.keys(kcal);
      const steps = [];
      for (let i = 0; i < n; i++) { const v = evValue(LifeOS.shift(to, -i), 'steps'); if (v != null && isFinite(v)) steps.push(Number(v)); }
      return {
        n: n, sessions: Object.keys(trained).length, meals: meals, foodDays: fd.length,
        base: base, vs: tdee ? 'maintenance' : 'target',
        diff: base && fd.length ? fd.reduce((a, d) => a + kcal[d] - base, 0) / fd.length : null,
        stepDays: steps.length, steps: steps.length ? steps.reduce((a, v) => a + v, 0) / steps.length : null,
      };
    },
    draw(body, cfg) {
      const n = (cfg && cfg.days) || 7, y = LifeOS.shift(LifeOS.day(), -1);
      const W = WIDGETS.lockedin, a = W.sums(n, y), b = W.sums(n, LifeOS.shift(y, -n));
      const num = (v, dp) => v.toLocaleString(undefined, { minimumFractionDigits: dp, maximumFractionDigits: dp });
      const sign = v => (v > 0 ? '+' : v < 0 ? '\u2212' : '') + num(Math.abs(Math.round(v)), 0);
      const perWk = s => s.sessions / s.n * 7, perDay = s => s.meals / s.n;
      const cell = (label, val, unit, line, prev) => {
        const c = el('div', 'li-c');
        c.innerHTML = '<span class="li-l">' + label + '</span><b>' + val + (unit ? ' <i>' + unit + '</i>' : '') + '</b>' +
          '<span class="li-n">' + line + '</span><span class="li-n">' + prev + '</span>';
        return c;
      };
      const g = el('div', 'li-g');
      g.appendChild(cell('TRAINING', num(perWk(a), 1), 'a week',
        a.sessions + ' session' + (a.sessions === 1 ? '' : 's') + ' in ' + n + ' days',
        'before: ' + num(perWk(b), 1) + ' a week'));
      g.appendChild(cell('MEALS TRACKED', num(perDay(a), 1), 'a day',
        a.meals + ' meals, ' + a.foodDays + ' of ' + n + ' days logged',
        'before: ' + num(perDay(b), 1) + ' a day'));
      g.appendChild(a.diff == null
        ? cell('CALORIES', '\u2014', '', a.base ? 'no food logged' : 'no maintenance or target in STATUS', b.diff == null ? '' : 'before: ' + sign(b.diff) + ' a day')
        : cell(a.diff > 0 ? 'SURPLUS' : 'DEFICIT', sign(a.diff), 'kcal a day',
            'against ' + num(Math.round(a.base), 0) + ' ' + a.vs + ', ' + a.foodDays + ' days',
            b.diff == null ? 'before: no food logged' : 'before: ' + sign(b.diff) + ' a day'));
      g.appendChild(a.steps == null
        ? cell('STEPS', '\u2014', '', 'no steps logged', b.steps == null ? '' : 'before: ' + num(Math.round(b.steps), 0) + ' a day')
        : cell('STEPS', num(Math.round(a.steps), 0), 'a day', a.stepDays + ' of ' + n + ' days had steps',
            b.steps == null ? 'before: no steps logged' : 'before: ' + num(Math.round(b.steps), 0) + ' a day'));
      body.appendChild(g);
    },
  },

     is not a thing to store, it is a sum of ticks, and every app writes those.

     No data behind them. A desk has a clock and a pad on it. */

  sticky: {

    draw(body) {

  clock: {
    nm: 'CLOCK', w: 3, h: 2, fit: 1, grp: 'DESK',
    sub: () => '',
    draw(body) {
      const big = el('div');
      big.style.cssText = 'font-family:var(--f1);font-size:34px;letter-spacing:.04em;color:var(--txt);line-height:normal';
      const sub = el('div');
      sub.style.cssText = 'font-family:var(--f1);font-size:11px;letter-spacing:.14em;color:var(--dim2);margin-top:4px';
      const tick = () => {

        big.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        sub.textContent = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
      };
      tick();
      const id = setInterval(() => { if (!body.isConnected) return clearInterval(id); tick(); }, 10000);

    },

  timer: {
    nm: 'TIMER', w: 3, h: 2, fit: 1, grp: 'DESK',
    sub: () => '',
    draw(body, cfg) {
      /* The count lives in TOOLS, not in here: see "desk tools" above. */
      const s = toolOf(cfg, timerTool);
      const face = el('div', 'tface');
      const show = now => { const l = s.left(now || Date.now()); face.textContent = mmss(l); face.classList.toggle('idle', !l); };
      s.paint = now => { if (face.isConnected) show(now); };
      show();
      const start = secs => { s.set = secs; s.end = Date.now() + secs * 1000; show(); };
      const bar = el('div', 'tbar');
      /* Tom, 2026-09-17: "Click Xm = X minutes, but make it need a double tap
         if we want it to override a currently running timer."

         These used to ADD, so 3m pressed on a timer showing 4:12 gave 7:12 and
         there was no way at all to ask for the one thing the button has
         written on it. 3m is three minutes now.

         The double tap is a guard, not a second meaning. Nothing is running,
         so nothing can be lost: one press. Something IS running, so one press
         would throw away a count you are in the middle of: it says what it is
         about to do and waits to be told twice. The second press has to land
         within about three quarters of a second, which is a double click, and
         a lone press is a message rather than a change. */
      const AGAIN_MS = 750;
      [[60, '1m'], [180, '3m'], [300, '5m']].forEach(([n, lbl]) => {
        let asked = 0;
        const b = tbtn(lbl, () => {
          const now = Date.now();
          if (s.left(now) && now - asked > AGAIN_MS) { asked = now; return toast('Again to make it ' + lbl); }
          asked = 0;
          start(n);
        });
        b.title = lbl + ' · twice to replace a running timer';
        bar.appendChild(b);
      });
      /* Tom, 2026-09-17: "Timer widget - let me manually set". Three presets
         are three guesses, and the fourth thing he wants is always the one
         that is not there. The face is the control: press it and type. */
      const setIt = () => {
        const l = s.left(Date.now());
        UI.dialog({
          title: 'Set the timer', width: 320, focus: true,
          body: b2 => {
            b2.appendChild(el('label', 'fl', 'Minutes, or minutes and seconds'));
            const i = UI.field('text', { value: l ? Math.floor(l / 60) + ':' + zpad(l % 60) : '' });
            i.placeholder = '10   2.5   or   1:30';
            b2.appendChild(i);
          },
          actions: [{ label: 'CANCEL' }, { label: 'START', kind: 'go', fn: h => {
            const box = h.body.querySelector('input.mb-input, input');
            const t = String((box && box.value) || '').trim();
            if (!t) return;
            /* "10" is ten minutes, "1:30" is a minute and a half, "0:45" is
               forty five seconds, and "2.5" is two and a half — Tom, 2026-09-17,
               "Should be able to set 2.5 Minutes". */
            const m = t.match(/^(\d+):([0-5]?\d)$/);
            let secs = 0;
            if (m) secs = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
            else if (/^\d+(?:\.\d+)?$/.test(t)) secs = Math.round(parseFloat(t) * 60);
            else return toast('Try 10, 2.5, or 1:30', { bad: true });
            if (!secs) return;
            start(secs);
          } }],
        });
      };
      face.style.cursor = 'pointer';
      face.title = 'Set the timer';
      face.onclick = setIt;

  year: {

      const all = ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
      const gone = Math.floor((d - new Date(y, 0, 1)) / 86400000) + 1;
      const grid = el('div');

  /* One dot a year, and the one you are in lit. Nothing is counted down and
     nothing is predicted: the span is a number you set, not a forecast. */
  life: {
    nm: 'LIFE', w: 4, h: 3, grp: 'DESK',
    sub: () => {
      const b = Rec.setting('lifeos', 'born');
      if (!b) return 'set your birth year';
      const y = Rec.setting('lifeos', 'youth'), o = Rec.setting('lifeos', 'old');
      const bits = [ageNow(b) + ' of ' + (Rec.setting('lifeos', 'span') || 80)];
      if (y) bits.push('youth to ' + y);
      if (o) bits.push('old age from ' + o);
      return bits.join(' \u00b7 ');
    },
    draw(body) {
      const born = Rec.setting('lifeos', 'born');
      const span = Number(Rec.setting('lifeos', 'span') || 80);
      if (!born) {
        const p = el('div', 'empty', 'Set a birth year and this fills in.');
        const inp = document.createElement('input');
        inp.type = 'number'; inp.placeholder = 'e.g. 1994';
        inp.style.cssText = 'width:110px;margin-top:8px;padding:6px 8px;border:1px solid var(--line2);' +
          'border-radius:6px;background:var(--panel2);color:var(--txt);font:inherit';
        inp.onchange = () => {
          const v = parseInt(inp.value, 10);
          if (v > 1900 && v < 2100) { Rec.setting('lifeos', 'born', v); drawHome(); }
        };
        body.appendChild(p); body.appendChild(inp);
        return;
      }
      const age = ageNow(born);
      /* Tom, 2026-09-17: "Life widget - right click menu to denote Youth and
         Old Age", then, the same day: "Set Age, Set Colors and a legend I want
         to denote when I was young and when im gonna be too old for a lot of
         things."

         So the two ages were already here, and the three things missing were
         the ways to change them. The years lived stay solid and the ones ahead
         stay faint, so the band is a hue and the living is the weight: two
         facts on one square without either hiding the other.

         The colours are theme slots, 1 to 6, never hex. Hard constraint 8, and
         it is the reason this can be recoloured at all: a hex here would be a
         life that looks right in exactly one skin. */
      const youth = Number(Rec.setting('lifeos', 'youth') || 0);
      const old = Number(Rec.setting('lifeos', 'old') || 0);
      const slotOf = (k, dflt) => Number(Rec.setting('lifeos', 'life' + k) || dflt);
      const cols = { youth: slotOf('Youth', 2), mid: slotOf('Mid', 4), old: slotOf('Old', 5) };
      const tint = n => 'var(--data-' + n + ')';
      const bandOf = i => (youth && i < youth) ? 'youth' : (old && i >= old) ? 'old' : 'mid';

      const head = el('div');
      head.style.cssText = 'font-family:var(--f1);font-size:28px;color:var(--txt);letter-spacing:.04em;margin-bottom:8px';
      head.innerHTML = age + '<span style="color:var(--dim2);font-size:16px"> / ' + span + '</span>';
      body.appendChild(head);

      /* ── setting it ──
         On the card, not on a year. Changing your birth year by right clicking
         the square for age 31 is not a thing anyone would find. The year's own
         menu stays for the two boundaries, where the year IS the answer. */
      const askNum = (title, now, lo, hi, save) => UI.dialog({
        title: title, width: 280,
        body: b2 => {
          const f = UI.field('number', { value: now || '' });
          b2.appendChild(f);
          const i = f.querySelector ? (f.querySelector('input') || f) : f;
          setTimeout(() => { if (i.focus) i.focus(); if (i.select) i.select(); }, 40);
        },
        actions: [{ label: 'CANCEL' }, { label: 'SET', kind: 'go', fn: h => {
          const i = h.body.querySelector('input');
          const v = parseInt(i && i.value, 10);
          if (v >= lo && v <= hi) { save(v); drawHome(); }
        } }],
      });
      const capital = w => w.charAt(0).toUpperCase() + w.slice(1);
      /* D4, 2026-10-05: the three bands are named on the card's own menu, a
         setting each, with neutral names until then. "TOO OLD FOR A LOT" was
         the old band's name, and a client was about to see it. */
      const BAND = { youth: 'EARLY', mid: 'MIDDLE', old: 'LATE' };
      const bandName = which => String(Rec.setting('lifeos', 'lifeName' + capital(which)) || BAND[which]).toUpperCase();
      const askName = which => UI.dialog({
        title: 'Name this band', width: 280,
        body: b2 => {
          const f = UI.field('text', { value: bandName(which) });
          b2.appendChild(f);
          const i = f.querySelector ? (f.querySelector('input') || f) : f;
          setTimeout(() => { if (i.focus) i.focus(); if (i.select) i.select(); }, 40);
        },
        actions: [{ label: 'CANCEL' }, { label: 'SET', kind: 'go', fn: h => {
          const i = h.body.querySelector('input');
          const v = String((i && i.value) || '').trim().slice(0, 24);
          Rec.setting('lifeos', 'lifeName' + capital(which), v && v.toUpperCase() !== BAND[which] ? v : null);
          drawHome();
        } }],
      });
      const colourItems = which => [1, 2, 3, 4, 5, 6].map(n => ({
        label: 'Colour ' + n, check: cols[which] === n,
        fn: () => { Rec.setting('lifeos', 'life' + capital(which), n); drawHome(); },
      }));
      const lifeMenu = (x, y) => UI.menu(x, y, [
        { label: 'Set age', fn: () => askNum('How old are you', age, 0, 120,
            v => Rec.setting('lifeos', 'born', new Date().getFullYear() - v)) },
        { label: 'Set birth year', fn: () => askNum('Born', born, 1900, 2100,
            v => Rec.setting('lifeos', 'born', v)) },
        { label: 'Set how many years', fn: () => askNum('Years on the square', span, 10, 120,
            v => Rec.setting('lifeos', 'span', v)) },
        '-',
        { label: 'Youth ends at', fn: () => askNum('Youth ends at', youth, 0, span,
            v => Rec.setting('lifeos', 'youth', v)) },
        { label: 'Old age starts at', fn: () => askNum('Old age starts at', old, 0, span,
            v => Rec.setting('lifeos', 'old', v)) },
        '-',
        { label: 'Youth colour', sub: colourItems('youth') },
        { label: 'Middle colour', sub: colourItems('mid') },
        { label: 'Old age colour', sub: colourItems('old') },
        '-',
        { label: 'Name the bands', sub: [['youth', 'First band'], ['mid', 'Middle band'], ['old', 'Last band']].map(b => ({
          label: b[1] + ': ' + bandName(b[0]), fn: () => askName(b[0]) })) },
      ], { title: 'LIFE' });
      body.oncontextmenu = ev => { ev.preventDefault(); ev.stopPropagation(); lifeMenu(ev.clientX, ev.clientY); };
      if (typeof Mobile !== 'undefined' && Mobile.hold) Mobile.hold(body, () => lifeMenu(0, 0));

      const grid = el('div');
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(20,1fr);gap:3px';
      for (let i = 0; i < span; i++) {
        const b = el('i');
        const band = bandOf(i);
        const name = band === 'youth' ? 'youth' : band === 'old' ? 'old age' : '';
        b.title = 'age ' + i + (name ? ' \u00b7 ' + name : '');
        b.style.cssText = 'display:block;aspect-ratio:1;border-radius:2px;cursor:context-menu;' +
          'background:' + (i === age ? 'var(--warn)' : ((youth || old) ? tint(cols[band]) : 'var(--acc)')) +
          ';opacity:' + (i <= age ? '1' : '.22');
        b.oncontextmenu = ev => {
          ev.preventDefault();
          /* The card has a right-click menu of its own and it is the parent,
             so without this the year's menu opened and was replaced by the
             widget's a moment later. */
          ev.stopPropagation();
          UI.menu(ev.clientX, ev.clientY, [
            { label: 'Youth ends at ' + i, fn: () => { Rec.setting('lifeos', 'youth', i); drawHome(); } },
            { label: 'Old age starts at ' + i, fn: () => { Rec.setting('lifeos', 'old', i); drawHome(); } },
            ...((youth || old) ? [{ label: 'Clear both', fn: () => {
              Rec.setting('lifeos', 'youth', 0); Rec.setting('lifeos', 'old', 0); drawHome();
            } }] : []),
          ], { title: 'AGE ' + i });
        };
        grid.appendChild(b);
      }
      body.appendChild(grid);

      /* ── the legend ──
         What he asked the bands FOR: "when I was young and when im gonna be
         too old for a lot of things". Without it the square is three hues and
         no statement. Drawn only once a boundary is set, because three chips
         naming nothing is worse than no chips. */
      if (youth || old) {
        const key = el('div');
        key.style.cssText = 'display:flex;flex-wrap:wrap;gap:var(--s-2,8px);margin-top:var(--s-2,8px)';
        const chip = (which, label, range) => {
          const c = el('div');
          c.style.cssText = 'display:flex;align-items:center;gap:5px;font-family:var(--f1);' +
            'font-size:9px;letter-spacing:.1em;color:var(--dim);white-space:nowrap';
          c.innerHTML = '<i style="width:9px;height:9px;border-radius:2px;flex:0 0 auto;background:' +
            tint(cols[which]) + '"></i>' + esc(label) +
            (range ? '<span style="color:var(--dim2)">' + esc(range) + '</span>' : '');
          key.appendChild(c);
        };
        if (youth) chip('youth', bandName('youth'), 'to ' + youth);
        chip('mid', bandName('mid'), (youth || 0) + (old ? '\u2013' + old : '+'));
        if (old) chip('old', bandName('old'), 'from ' + old);
        body.appendChild(key);
      }
    },
  },

  links: {
    /* ══════════════ LINKS ══════════════
       Tom, 2026-09-17: "Create a TOM ONLY Widget of all the app links, both
       for me and for clients."

       Every app's address on the web, in two groups: the full suite, which is
       his, and the client suite, which is the seven apps a client gets.
       Tapping one copies it, because the job this does is handing a link to
       somebody — a client in Skool, or himself on another machine. The button
       beside it opens it in a new tab, for when the job is looking rather
       than sending.

       It is not called TOM ONLY and nothing on it says so. That follows the
       dock, where his own apps sit behind a thin line with no label and no
       tooltip — Tom, 2026-09-14: "I don't want a Tom Only... I know who I
       am." What makes it his is that `DROP_WIDGETS` in tools/build-client.py
       takes it out of the client copy altogether, so a client never gets a
       screen listing apps they do not have and addresses that are not theirs.

       This comment sits INSIDE the object on purpose. DROP_WIDGETS matches
       from `  links: {` to the first `  },`, so anything written above the
       widget would survive into the client build with the widget itself gone
       — which for this one would mean shipping the reasoning for hiding it.

       The two lists are read off the APPS roster rather than typed out, so an
       app added later appears in both without anybody remembering this file,
       and an app flagged `mine` is in his list and not in the client one by
       the same flag the dock already uses. The folder name comes off
       `a.file`, so nothing here writes a path the client build has to patch.

       The addresses are the one thing written down. They are two published
       sites and both were checked live on 2026-09-17. Deriving them from
       `location` would be wrong: the point of this widget is the address you
       give somebody else, which has nothing to do with where this page
       happens to be open from. */
    nm: 'LINKS', w: 5, h: 6, fit: 1,
    sub: () => 'tap a link to copy it',
    sites: [
      { nm: 'MINE', base: 'https://tomoncupa.github.io/Motherbase/', all: () => APPS.filter(a => a.file) },
      { nm: 'CLIENTS', base: 'https://tomoncupa.github.io/Mainmenu-client/', all: () => APPS.filter(a => a.file && !a.mine) },
    ],
    /* Copied, or shown so it can be copied by hand. A page opened straight
       from a folder has no clipboard in some browsers, and an address nobody
       can get at is the one failure this widget is not allowed to have. */
    copy(url, label) {
      const done = () => toast('<b>' + esc(label) + '</b> copied');
      const byHand = () => {
        try {
          const t = document.createElement('textarea');
          t.value = url;
          t.setAttribute('readonly', '');
          t.style.position = 'fixed';
          t.style.top = '-1000px';
          document.body.appendChild(t);
          t.select();
          const ok = document.execCommand('copy');
          t.remove();
          if (ok) { done(); return; }
        } catch (e) {}
        toast(esc(url), { ms: 8000 });
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, byHand);
      else byHand();
    },
    /* Tom, 2026-09-23: "Update the link widget to always force new copies."
       Every address handed out carries ?fresh=1, which tells sw.js to fetch
       that open from the network instead of the phone's kept copy. The page
       takes it off its own address bar once open (shared/mobile.js), so a
       home-screen shortcut saved from it is the plain address. */
    fresh: url => url + (url.indexOf('?') < 0 ? '?' : '&') + 'fresh=1',
    row(list, label, url, tint, icon, tail) {
      url = WIDGETS.links.fresh(url);
      const r = el('div', 'row');
      if (tint) r.style.setProperty('--c', tint);
      r.style.cursor = 'pointer';
      r.setAttribute('role', 'button');
      r.tabIndex = 0;
      r.title = url;
      r.innerHTML = (icon ? '<span class="t" style="width:auto;padding-left:0">' + icon + '</span>' : '') +
        '<span class="n">' + esc(label) + '</span>' +
        (tail ? '<span class="d">' + esc(tail) + '</span>' : '');
      const copy = () => WIDGETS.links.copy(url, label);
      r.onclick = copy;
      r.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); copy(); } };
      const open = el('button', 'lopen mb-press mb-tap',
        (typeof Icons !== 'undefined' && Icons.svg('link', { size: 14 })) || '&rarr;');
      open.title = 'Open ' + label + ' in a new tab';
      open.setAttribute('aria-label', 'Open ' + label + ' in a new tab');
      open.onclick = ev => { ev.stopPropagation(); window.open(url, '_blank', 'noopener'); };
      r.appendChild(open);
      list.appendChild(r);
      return r;
    },
    draw(body) {
      const L = WIDGETS.links, list = el('div', 'rowlist');
      L.sites.forEach(site => {
        /* The address goes on the heading, not on the row under it. It was on
           the row first, and at phone width it squeezed "The whole suite"
           down to an ellipsis: the tail is fixed width and the name is what
           gives way. A heading has the whole card to itself and can wrap. */
        const where = site.base.replace(/^https?:\/\//, '').replace(/\/$/, '');
        list.appendChild(el('div', 'mb-group', esc(site.nm) + ' <span class="lwhere">' + esc(where) + '</span>'));
        L.row(list, 'The whole suite', site.base, '', '', '');
        site.all().forEach(a => {
          const folder = String(a.file).split('/')[0];
          L.row(list, a.nm, site.base + folder + '/', appTint(a), appIco(a, 16), folder);
        });
      });
      body.appendChild(list);
    },
  },

     Tom, 2026-09-25: "Add all the widgets we could have given our suite and
     functionality." Each reads its app's rows where they are and writes
     nothing but what that app's own buttons would: a todo ticked here is
     Journal.tick, an Every block ticked here is a shared tick. A widget for

  /* ── BLOCK ── */
  rhythms: {
    nm: 'EVERY & ANYTIME', w: 4, h: 4, app: 'block', to: ['block'],
    state() {
      const today = LifeOS.day(), log = {};
      Rec.all('tick').forEach(t => { if (t.date && t.date <= today) (log[t.key] || (log[t.key] = [])).push(t.date); });
      Object.keys(log).forEach(k => log[k].sort());
      const ws = Rec.setting('block', 'weekStart'), rh = Rec.map('rhythm');
      return Object.keys(rh).map(id => Object.assign({ id: id }, rh[id]))
        .filter(r => r.name && (r.kind === 'every' || r.kind === 'anytime'))
        .map(r => {
          const tid = LifeOS.slug(r.name), dates = log[tid] || [];
          return { r: r, tid: tid, s: r.kind === 'every' ? rhEveryState(r, dates, today) : rhAnyState(r, dates, today, ws == null ? 1 : ws) };
        });
    },
    sub: () => {
      const all = WIDGETS.rhythms.state();
      const owed = all.filter(x => x.s.st === 'owed' || x.s.st === 'due').length;
      return all.length ? (owed ? owed + ' due or owed' : 'nothing owed') : 'none set up';

  /* ── STATUS ── */
  /* any measure STATUS keeps, picked from the widget's own menu, so mood,
     energy, steps or water each get a chart the way WEIGHT and SLEEP do */
  measure: {
    nm: 'MEASURE', w: 5, h: 3, app: 'status', to: ['status', 'trends'],
    days: [[7, '7 days'], [30, '30 days'], [90, '90 days'], [365, 'a year']], day0: 30,
    field(cfg) {
      const F = Rec.map('field') || {};
      const ids = Object.keys(F).filter(k => F[k] && F[k].on !== 0);
      const id = cfg && cfg.f && F[cfg.f] ? cfg.f : (F.mood ? 'mood' : ids[0]);
      return id ? Object.assign({ id: id }, F[id]) : null;
    },
    series(cfg) {
      const f = WIDGETS.measure.field(cfg), days = (cfg && cfg.days) || 30, out = [];
      if (!f) return out;
      for (let i = days - 1; i >= 0; i--) {
        const d = LifeOS.shift(LifeOS.day(), -i), v = evValue(d, f.id);
        if (v != null && isFinite(v)) out.push({ d: d, v: Number(v) });
      }
      return out;
    },
    nmFor: cfg => {
      const f = WIDGETS.measure.field(cfg);
      const span = (WIDGETS.measure.days.filter(d => d[0] === ((cfg && cfg.days) || 30))[0] || [0, ''])[1];
      return (f ? String(f.label || f.id).toUpperCase() : 'MEASURE') + ' \u00b7 ' + span;
    },
    sub: cfg => {
      const f = WIDGETS.measure.field(cfg), pts = WIDGETS.measure.series(cfg);
      if (!f) return 'STATUS has no measures yet';
      if (!pts.length) return 'nothing logged in this stretch';
      const last = pts[pts.length - 1], mean = pts.reduce((a, p) => a + p.v, 0) / pts.length;
      const dp = f.dec != null ? f.dec : 1, u = f.unit ? ' ' + f.unit : '';
      return +last.v.toFixed(dp) + u + (last.d === LifeOS.day() ? ' today' : ', ' + Day.label(last.d)) +
        ' \u00b7 average ' + +mean.toFixed(dp) + ' over ' + pts.length + ' day' + (pts.length === 1 ? '' : 's');
    },
    menu(cfg, redraw) {
      const F = Rec.map('field') || {}, cur = WIDGETS.measure.field(cfg);
      const ids = Object.keys(F).filter(k => F[k] && F[k].on !== 0)
        .sort((a, b) => (F[a].order || 99) - (F[b].order || 99));
      return ids.length ? ['-', { label: 'Measure', sub: ids.map(k => ({
        label: F[k].label || k, check: cur && cur.id === k, fn: () => { cfg.f = k; redraw(); } })) }] : [];
    },
    draw(body, cfg) {
      const f = WIDGETS.measure.field(cfg), pts = WIDGETS.measure.series(cfg);
      if (!f) { body.appendChild(el('div', 'empty', 'Track something in <span class="link" onclick="go(\'status\')">STATUS</span> and it can be charted here.')); return; }
      if (!pts.length) { body.appendChild(el('div', 'empty', 'No ' + esc(String(f.label || f.id).toLowerCase()) + ' logged in this stretch. Right click to pick another measure or range.')); return; }
      const dp = f.dec != null ? f.dec : 1;
      const subOf = () => { const w = body.closest('.w'); return w && w.querySelector('.w-head .sub'); };
      let kept = null;
      const box = el('div', 'fits');
      body.appendChild(box);
      const line = pts.map(p => [p.d, p.v]), days = (cfg && cfg.days) || 30;
      Chart.mount(box, { label: (f.label || f.id) + ', ' + pts.length + ' readings' }, c => {
        c.xTime(LifeOS.shift(LifeOS.day(), -(days - 1)), LifeOS.day());
        c.yFit(pts.map(p => p.v));
        c.grid();
        c.timeAxis();
        if (line.length > 1) { c.area(line); c.line(line); } else c.dots(line);
        c.end(line[line.length - 1], String(+pts[pts.length - 1].v.toFixed(dp)));
        c.scrub(line, {
          onMove: p => { const s = subOf(); if (!s) return; if (kept == null) kept = s.textContent; s.textContent = +Number(p[1]).toFixed(dp) + (f.unit ? ' ' + f.unit : '') + ', ' + Day.label(p[0]); },
          onLeave: () => { const s = subOf(); if (s && kept != null) s.textContent = kept; kept = null; },
        });
      });
    },
  },

/* ══════════════ the grid ══════════════
   Layout is device preference, not shared data — it lives in localStorage and
   never touches the LifeOS doc, so rearranging widgets here changes nothing
   about what any other app sees. */
const LKEY = 'lifeos_layout_v1';
/* The board the hype reel filmed (Tom, 2026-10-01: "set the default main
   menu widget layout to be like in the video"), less MOMENTUM, which went on
   2026-09-30; UPCOMING takes its corner (Tom, 2026-10-05). Three columns of
   four on the 12-column desk. */
const DEFAULT_LAYOUT = [
  { t: 'today', w: 4, h: 7 }, { t: 'bodyheat', w: 4, h: 7 }, { t: 'clock', w: 4, h: 2 }, { t: 'macros', w: 4, h: 3 },
  { t: 'weight', w: 4, h: 3 }, { t: 'rhythms', w: 4, h: 5 }, { t: 'records', w: 4, h: 5 }, { t: 'upcoming', w: 4, h: 5 },
];
/* ── the layout is a row, not a private key ──
   Tom, 2026-09-17: "my main menu layout doesnt seem to save." It did save. It
   saved straight into localStorage, which is the one thing hard constraint 6
   forbids, and the consequence is exactly what he saw: a raw key is per copy
   and never syncs, so an arrangement made in one place is invisible in the
   next. He now has three copies, the folder, the website and the Main Menu
   program, which turned a long-standing rule break into something he could
   see in an afternoon.

   An ordinary setting row travels with everything else. The old key is read
   once if there is no row yet, and then left alone as its own backup. */
let layout;
try { const saved = Rec.setting('lifeos', 'layout'); if (Array.isArray(saved) && saved.length) layout = saved; } catch (e) {}
if (!Array.isArray(layout) || !layout.length) { try { layout = JSON.parse(localStorage.getItem(LKEY)); } catch (e) {} }
if (!Array.isArray(layout) || !layout.length) layout = DEFAULT_LAYOUT.slice();
/* A widget for an app this build does not carry is not offered and not
   drawn: the client build drops ELEMENT, and DRINKS goes with it. */
/* `mine` is for a widget with no app of its own to take it out: the client
   build drops every app flagged mine, so a build without one is a client's */
const MINE_BUILD = APPS.some(a => a.mine);
const widgetHere = W => (!W.app || !!app(W.app)) && (!W.mine || MINE_BUILD);
/* Taken off on 2026-10-01 because another widget shows everything they did
   (Tom: "remove all the redundant widgets, make sure we don't lose any actual
   function"). A board that still carries one gets the widget that covers it,
   in the same spot, unless that one is on the board already. In memory only:
   the board is saved when he next changes it, never on open. */
const RETIRED = { protein: 'macros', calories: 'macros', arcw: 'todo' };
function retire(list) {
  const has = {};
  list.forEach(c => { if (c && !RETIRED[c.t]) has[c.t] = 1; });
  return list.map(c => {
    const to = c && RETIRED[c.t];
    if (!to) return c;
    if (has[to]) return null;
    has[to] = 1;
    return Object.assign({}, c, { t: to });
  }).filter(Boolean);
}
layout = retire(layout).filter(c => WIDGETS[c.t] && widgetHere(WIDGETS[c.t]));
/* Written only when he changes something, never on open. A device opened
   before its synced rows arrive has only the factory layout, and saving that
   stamped it newer than his real one, so it replaced his arrangement on every
   device. Watched 2026-09-25: the Main Menu program saved the factory board
   at 12:44pm. Spots worked out on open live in memory until he acts. */
let layoutSeen = '';
const saveLayout = () => { try { Rec.setting('lifeos', 'layout', layout); layoutSeen = JSON.stringify(Rec.setting('lifeos', 'layout')); } catch (e) {} };
/* the layout is a row, so another device's arrangement can land while this
   one is open; it is picked up then, not at the next reload */
function reloadLayout() {
  let s = null; try { s = Rec.setting('lifeos', 'layout'); } catch (e) {}
  const j = JSON.stringify(s || null);
  if (j === layoutSeen) return;
  layoutSeen = j;
  if (Array.isArray(s) && s.length) layout = retire(s).filter(c => WIDGETS[c.t] && widgetHere(WIDGETS[c.t]));
}
try { layoutSeen = JSON.stringify(Rec.setting('lifeos', 'layout') || null); } catch (e) {}

/* Is there a real pointer? Everything that can only be done by dragging with
   a mouse is gated on this. */
const FINE = matchMedia('(hover:hover) and (pointer:fine)').matches;
let editing = false;
function move(i, d) {
  /* With spots, up and down mean the card before or after it in reading
     order, and the two trade places. Without, the old list order. */
  const ord = byPlace();
  const k = ord.indexOf(i), j = ord[k + d];
  if (j == null) return;
  const a = layout[i], b = layout[j];
  if (a.x && b.x) {
    const ax = a.x, ay = a.y;
    a.x = b.x; a.y = b.y; b.x = ax; b.y = ay;
    pinned = i;
  } else {

/* a trained muscle's colour, Tom, 2026-10-05: "Red - just hit, Green - ready
   to go, Brightness - amount of work this week". Red to the theme's warning
   colour over the first half of its window, warning to green over the
   second, so the middle of a recovery reads as amber rather than as mud. */
function bodyColour(r) {
  const g = r ? Math.max(0, Math.min(1, 1 - r.left / r.win)) : 1;
  return g < 0.5
    ? 'color-mix(in oklab, var(--warn) ' + Math.round(g * 200) + '%, var(--danger))'
    : 'color-mix(in oklab, var(--success) ' + Math.round((g - 0.5) * 200) + '%, var(--warn))';
}
const bodyBright = (n, max) => (0.25 + 0.75 * (max ? n / max : 0)).toFixed(2);
function bodySvg(v, rec, pose) {
  const key = BODY_POSES[pose] ? pose : 'stand', P = BODY_POSES[key];
  const max = Math.max(0, ...Object.keys(v).map(k => v[k]));
  const ink = 'stroke:var(--text-muted);stroke-opacity:.4;stroke-width:.4;stroke-linejoin:round';
  const edge = 'fill:none;stroke:var(--text-muted);stroke-opacity:.7;stroke-width:.55;stroke-linejoin:round';
  const fibre = 'fill:none;stroke:var(--surface-1);stroke-opacity:.45;stroke-width:.35;stroke-linecap:round';
  const mir = s => s + '<g transform="matrix(-1,0,0,1,200,0)">' + s + '</g>';
  const muscles = l => l.map(m => {
    const n = v[m[0]] || 0, r = rec && rec[m[0]];
    const st = n > 0
      ? 'fill:' + bodyColour(r) + ';fill-opacity:' + bodyBright(n, max) + ';stroke:var(--surface-1);stroke-opacity:.85;stroke-width:.5'
      : 'fill:var(--surface-3);' + ink;
    const tip = BODY_NAMES[m[0]] + ' · ' + (Math.round(n * 2) / 2) + ' sets' + (r ? ' · ' + Math.ceil(r.left) + 'h to recover' : n ? ' · ready' : '');
    return '<path d="' + m[1] + '" style="' + st + '"><title>' + tip + '</title></path>';
  }).join('');
  const panel = (list, lines, arm, armLines) =>
    '<svg viewBox="' + P.box + '" preserveAspectRatio="xMidYMid meet">' +
      mir('<path d="' + BODY_SKIN + ' L100.6,122.7 L100.6,40 Z" style="fill:var(--surface-3);stroke:none"/>') +
      mir(muscles(list)) + mir('<path d="' + lines + '" style="' + fibre + '"/>') + mir('<path d="' + BODY_SKIN + '" style="' + edge + '"/>') +
      /* the arms over the body, so a shoulder sits in front of the chest and back in every pose */
      mir('<path d="' + P.skin + '" style="fill:var(--surface-3);stroke:none"/>') +
      mir(muscles(arm)) + mir('<path d="' + armLines + '" style="' + fibre + '"/>') + mir('<path d="' + P.line + '" style="' + edge + '"/>') +
    '</svg>';
  return '<div class="bh-pair bh-p-' + key + '">' + panel(BODY_FRONT, BODY_LINES_FRONT, P.front, P.lines[0]) +
    panel(BODY_BACK, BODY_LINES_BACK, P.back, P.lines[1]) + '</div>';
}

/* ══════════════ spots ══════════════
   Each card may carry x (its first column, 1 to 12) and y (its first row).
   A card without one is placed by the grid into the first hole it fits and
   then keeps where it landed, which is how every layout saved before
   2026-09-22 got its spots without anyone arranging it. */
let pinned = null;          /* the card just moved, resized or added: it wins a collision */
const effH = [];            /* rows each card actually takes; a `fit` card's differ from cfg.h */
const hOf = i => effH[i] || layout[i].h;
/** layout indexes in reading order: top to bottom, then left to right */
function byPlace() {
  return layout.map((c, i) => i).sort((a, b) => {
    const A = layout[a], B = layout[b];
    if (!A.x || !B.x) return (A.x ? 0 : 1) - (B.x ? 0 : 1) || a - b;
    return A.y - B.y || A.x - B.x || a - b;
  });
}
/** nothing overlaps: a card that would is pushed down until it does not.
    Nothing is ever pulled UP, which is what lets a gap stay a gap. */
function settle(first) {
  const cols = COLS;
  const ord = byPlace().filter(i => layout[i].x);
  if (first != null && ord.indexOf(first) > -1) { ord.splice(ord.indexOf(first), 1); ord.unshift(first); }
  const done = [];
  ord.forEach(i => {
    const c = layout[i];
    c.w = Math.min(c.w, cols);
    c.x = Math.max(1, Math.min(c.x, cols - c.w + 1));
    c.y = Math.max(1, c.y);
    const hit = o => c.x < o.x + o.w && o.x < c.x + c.w && c.y < o.y + o.h && o.y < c.y + hOf(i);
    let guard = 0;
    while (guard++ < 500) {
      const o = done.find(hit);
      if (!o) break;
      c.y = o.y + o.h;
    }
    done.push({ x: c.x, y: c.y, w: c.w, h: hOf(i) });
  });
}
/** where the grid's cells are, in pixels, right now */
function gridMetrics() {
  const g = $('#grid'), r = g.getBoundingClientRect();
  const cs = getComputedStyle(g);
  const cols = cs.gridTemplateColumns.split(' ').length;
  const gap = parseFloat(cs.columnGap) || 12;
  const R = parseFloat(g.style.getPropertyValue('--row')) || 84;
  return { r: r, cols: cols, gap: gap, colw: (r.width - (cols - 1) * gap) / cols, R: R };
}
function cellAt(m, px, py) {
  return {
    c: Math.max(1, Math.min(m.cols, Math.floor((px - m.r.left + m.gap / 2) / (m.colw + m.gap)) + 1)),
    r: Math.max(1, Math.floor((py - m.r.top + m.gap / 2) / m.R) + 1),
  };
}
/** the empty patch around a cell, or null if a card is on it. A patch with
    cards below it is bounded and has a size; one running off the bottom of
    the board is not, and a widget added there keeps its own size. */
function gapAt(c, r) {
  const rects = layout.map((cfg, i) => cfg.x ? { x: cfg.x, y: cfg.y, w: cfg.w, h: hOf(i) } : null).filter(Boolean);
  const N = rects.reduce((a, o) => Math.max(a, o.y + o.h - 1), 0);
  const free = (x, y) => !rects.some(o => x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.h);
  if (!free(c, r)) return null;
  if (r > N) return { x: c, y: r, w: 0, h: 0 };
  let c0 = c, c1 = c;
  while (c0 > 1 && free(c0 - 1, r)) c0--;
  while (c1 < COLS && free(c1 + 1, r)) c1++;
  const rowFree = y => { for (let x = c0; x <= c1; x++) if (!free(x, y)) return false; return true; };
  let r0 = r, r1 = r;
  while (r0 > 1 && rowFree(r0 - 1)) r0--;
  while (r1 < N && rowFree(r1 + 1)) r1++;
  if (r1 >= N) return { x: c, y: r0, w: 0, h: 0 };
  return { x: c0, y: r0, w: c1 - c0 + 1, h: r1 - r0 + 1 };
}
function hint(m, x, y, w, h, land) {
  const g = $('#grid');
  let n = $('#gaphint');
  if (!n) { n = el('div'); n.id = 'gaphint'; }
  if (n.parentNode !== g) g.appendChild(n);
  if (x == null) { n.className = ''; g.classList.remove('gapon'); return; }
  n.className = 'on' + (land ? ' land' : '');
  n.innerHTML = land ? '' : ((typeof Icons !== 'undefined' && Icons.svg('add', { size: 22 })) || '+');
  n.style.left = ((x - 1) * (m.colw + m.gap)) + 'px';
  n.style.top = ((y - 1) * m.R) + 'px';
  n.style.width = (w * m.colw + (w - 1) * m.gap) + 'px';
  n.style.height = (h * m.R - m.gap) + 'px';

}
/* B: an empty patch offers a widget, the size of the patch */
(function watchGaps() {
  const g = $('#grid');
  const target = ev => {
    if (ev.target !== g || moving || sizing || editing || NARROW()) return null;
    const m = gridMetrics(), at = cellAt(m, ev.clientX, ev.clientY);
    return { m: m, gap: gapAt(at.c, at.r) };
  };
  g.addEventListener('mousemove', ev => {
    if (moving || sizing) return;
    const t = target(ev);
    if (!t || !t.gap) { hint(); return; }
    const x = t.gap.w ? t.gap.x : Math.min(t.gap.x, COLS - 3);
    hint(t.m, x, t.gap.y, t.gap.w || 4, t.gap.h || 3);
  });
  g.addEventListener('mouseleave', () => { if (!moving && !sizing) hint(); });
  g.addEventListener('click', ev => {
    const t = target(ev);
    if (t && t.gap) { hint(); widgetPicker(t.gap); }
  });
})();


/* ══════════════ a menu on every card ══════════════
   Tom, 2026-08-28: "right click and long press functionality everywhere
   where possible should go without saying."

   Same pair as the dock: oncontextmenu for a mouse, Mobile.hold for a thumb,
   both landing on the same list. The buttons in REARRANGE mode stay - law 6
   says a gesture may be a shortcut to something visible, never the only way
   to reach it. */
function widgetMenu(i, x, y) {
  const cfg = layout[i]; if (!cfg) return;
  const W = WIDGETS[cfg.t]; if (!W) return;
  const set = (k, v) => {
    cfg[k] = Math.max(2, Math.min(k === 'w' ? COLS : 8, (cfg[k] || 3) + v));
    saveLayout(); drawHome();
  };
  UI.menu(x, y, [
    i > 0 ? { label: 'Move up', icon: '\u2191', fn: () => move(i, -1) } : null,
    i < layout.length - 1 ? { label: 'Move down', icon: '\u2193', fn: () => move(i, 1) } : null,
    '-',
    cfg.w < COLS ? { label: 'Wider', icon: '\u2192', fn: () => set('w', 1) } : null,
    cfg.w > 2 ? { label: 'Narrower', icon: '\u2190', fn: () => set('w', -1) } : null,
    cfg.h < 8 ? { label: 'Taller', fn: () => set('h', 1) } : null,
    cfg.h > 2 ? { label: 'Shorter', fn: () => set('h', -1) } : null,
    /* A widget that says what ranges it understands gets them offered here,
       so a second copy of it can show a different stretch of time. */
    W.days ? '-' : null,
    W.days ? { label: 'Show', sub: W.days.map(d => ({
        label: d[1], check: (cfg.days || W.day0 || 90) === d[0],
        fn: () => { cfg.days = d[0]; saveLayout(); drawHome(); } })) } : null,
    /* a widget with choices of its own puts them here, the same menu */
    ...(W.menu ? W.menu(cfg, () => { saveLayout(); drawHome(); }) : []),
    '-',
    { label: 'Add another widget', icon: '+', fn: widgetPicker },
    { label: 'Remove', icon: '\u2715', kind: 'bad', fn: () => {
        const gone = layout.splice(i, 1)[0];
        saveLayout(); drawHome(); Mobile.haptic('warn');
        UI.undo('<b>' + esc(W.nm) + '</b> removed',
          () => { layout.splice(i, 0, gone); saveLayout(); drawHome(); });
      } },
  ].filter(Boolean), { title: W.nm });
}

const NARROW = () => matchMedia('(max-width:820px)').matches;
function drawHome() {
  const g = $('#grid'); g.innerHTML = '';
  let firstDone = 0;
  const later = [];
  const rank = [];
  byPlace().forEach((i, k) => { rank[i] = k; });
  document.body.classList.toggle('editing', editing);
  layout.forEach((cfg, i) => {
    const W = WIDGETS[cfg.t]; if (!W) return;
    const n = el('div', 'w mb-card');
    n.style.setProperty('--cw', cfg.w); n.style.setProperty('--ch', cfg.h);
    if (cfg.x) { n.classList.add('at'); n.style.setProperty('--gx', cfg.x); n.style.setProperty('--gy', cfg.y); }
    if (NARROW()) n.style.order = rank[i];
    n.dataset.i = i;
    /* the widget by name, for tests and screen captures (A7, 2026-10-05) */
    n.dataset.w = cfg.t;
    /* the widget wears the colour of the app it draws for, which is what
       ties a card to an app without a label; a widget with no app wears the
       accent, which is what the material layer does with no --c */
    const tint = W.app ? appTint(app(W.app)) : '';
    if (tint) n.style.setProperty('--c', tint);

    const head = el('div', 'w-head');
    const title = W.title ? W.title() : '';
    /* Two copies of the same widget showing different things have to be
       tellable apart, so a widget that varies by config names itself. */
    const name = W.nmFor ? W.nmFor(cfg) : W.nm;
    const to = W.to && (!W.to[0] || W.to[0] === 'over' || app(W.to[0])) ? W.to : null;
    /* TRAIN's sets arrive a moment after the open (records.js, KEPT OUT).
       A widget that asked for them before they came says nothing yet rather
       than "0 sets"; their arrival redraws the board. */
    const miss0 = Rec.missed ? Rec.missed() : 0;
    let sub = W.sub ? W.sub(cfg) : '';
    if (Rec.missed && Rec.missed() !== miss0) sub = '';
    head.innerHTML = (to ? '<span class="wgo" role="link" tabindex="0">' + esc(name) + '</span>' : esc(name)) +
      (title ? ' <span class="c">' + esc(title) + '</span>' : '') +
      '<span class="sub">' + esc(sub) + '</span>';
    if (to) {
      const lk = head.querySelector('.wgo');
      lk.title = 'Open ' + (to[0] === 'over' ? app(to[1]).nm : app(to[0]).nm);
      /* the name is a link, so pressing on it must not start a drag */
      lk.addEventListener('pointerdown', ev => ev.stopPropagation());
      lk.onclick = ev => { ev.stopPropagation(); goTo(to); };
      lk.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); goTo(to); } };

       competes with the page scroll for the same finger. */

      const up = el('button', 'mv mb-press mb-tap', '↑');
      up.setAttribute('aria-label', 'Move ' + W.nm + ' up');
      up.disabled = i === 0;
      up.style.opacity = i === 0 ? '.3' : '';
      up.onclick = ev => { ev.stopPropagation(); move(i, -1); };
      head.appendChild(up);
      const dn = el('button', 'mv mb-press mb-tap', '↓');
      dn.setAttribute('aria-label', 'Move ' + W.nm + ' down');
      dn.disabled = i === layout.length - 1;
      dn.style.opacity = i === layout.length - 1 ? '.3' : '';
      dn.onclick = ev => { ev.stopPropagation(); move(i, 1); };
      head.appendChild(dn);
    }
    const x = el('button', 'x mb-press mb-tap',
      (typeof Icons !== 'undefined' && Icons.svg('close', { size: 15 })) || '✕');
    x.title = 'remove this widget';
    x.setAttribute('aria-label', 'Remove ' + W.nm);

      ev.stopPropagation();

    head.appendChild(x);

       hover. On a touch screen this gesture IS the scroll gesture. */

    n.appendChild(head);

    const body = el('div', 'w-body');
    const fill = () => {
      const m0 = Rec.missed ? Rec.missed() : 0;
      try { W.draw(body, cfg); } catch (e) { body.appendChild(el('div', 'empty', 'widget error: ' + esc(e.message))); }
      if (Rec.missed && Rec.missed() !== m0) { body.innerHTML = ''; body.appendChild(el('div', 'empty', 'Loading')); }
      /* the rows inside are the plates, in their own colour or the widget's.
         Only the card-shaped rows: a ruled list line (.hrow, .logline) is a

      body.querySelectorAll('.row').forEach(r => r.classList.add('mb-plate'));
    };
    /* On a phone the first TODAY goes to the top and is drawn before
       anything else, so its NOW line is the first thing painted. Tom,
       2026-09-22. The rest are drawn straight after, in the next task. */
    if (NARROW() && cfg.t === 'today' && !firstDone) { n.classList.add('first'); n.style.order = ''; firstDone = 1; fill(); }
    else if (NARROW()) later.push(fill);

    /* Right click with a mouse, hold with a thumb, same menu either way. */
    n.oncontextmenu = ev => { ev.preventDefault(); widgetMenu(+n.dataset.i, ev.clientX, ev.clientY); };
    if (typeof Mobile !== 'undefined' && Mobile.hold) {

    }

    if (FINE) {
      const size = el('div', 'w-size');

    }

  });

    g.appendChild(el('div', 'empty', 'No widgets. Hit <b>+ WIDGET</b> to put something back.')).style.gridColumn = 'span 12';
  }
  if (later.length) setTimeout(() => later.forEach(f => f()), 0);
  fitGrid();
}

/* ── the board is a fixed grid, and a bigger window is more of it ──
   Tom, 2026-09-24: "Rather than resize my widgets when I resize my window, I
   just want more space to work with." Until then the board was 12 columns
   stretched across the window, with rows stretched to fill its height, so
   every card grew and shrank with the window.

   Now one cell is a fixed size, 146 by 84: what the 12-column board gave on
   his 1920px PC, and the 84px row every board too tall for the window had.
   The window only decides how many columns there are: wider adds empty
   columns to the right, taller adds empty rows below, and both are places a
   widget can be added. A window narrower than the cards scrolls sideways
   rather than moving or squashing them, because a saved spot is his
   arrangement and a window is not a reason to rewrite it. Desktop only; a
   phone still stacks.

   1.0.31 took the cell from the window the first time it opened and saved it
   as `lifeos.cell`. That went wrong twice: it counted the tallest card as the
   whole board, so rows locked at 140px and TODAY stood 688px tall, and the
   first device to open decided the size for every device through sync. The
   setting is no longer read.

   A card flagged `fit` (the small number cards, APPS, LINKS) still takes as
   many rows as its contents need and no more. */
let COLS = 12;
const CELL = { w: 146, h: 84 };
function fitGrid() {
  const g = $('#grid'), home = $('#home');
  if (NARROW()) {
    g.style.removeProperty('--row'); g.style.minHeight = ''; g.style.gridTemplateColumns = ''; g.style.width = '';
    COLS = 4; return;
  }
  const gap = parseFloat(getComputedStyle(g).rowGap) || 12;
  const H = home.clientHeight - 28, Wd = home.clientWidth - 28;
  const R = CELL.h;
  const used = layout.reduce((a, c) => Math.max(a, c.x ? c.x + c.w - 1 : c.w), 1);
  COLS = Math.max(used, Math.floor((Wd + gap) / (CELL.w + gap)), 4);
  g.style.gridTemplateColumns = 'repeat(' + COLS + ',' + CELL.w + 'px)';
  g.style.width = (COLS * CELL.w + (COLS - 1) * gap) + 'px';
  g.style.setProperty('--row', R + 'px');
  /* the cards only, never a `.w` drawn inside one: Chart.header's date
     line is also `.w`, and treating it as a card threw here and stopped the
     boot before the dock and the clock were drawn */
  const fits = [].slice.call(g.querySelectorAll(':scope > .w.fit'));
  const nodes = [].slice.call(g.querySelectorAll(':scope > .w'));
  effH.length = 0;
  fits.forEach(n => {
    /* measured squeezed to one row, so a child that stretches to fill
       the card cannot report the card's own height back as its need */
    const head = n.querySelector('.w-head'), body = n.querySelector('.w-body');
    n.style.setProperty('--ch', 1);
    const was = body.style.overflow;
    body.style.overflow = 'auto';
    const need = head.offsetHeight + body.scrollHeight + 2;
    body.style.overflow = was;
    const ch = Math.max(1, Math.ceil((need + gap) / R));
    n.style.setProperty('--ch', ch);
    effH[+n.dataset.i] = ch;
  });
  /* a card with no spot yet keeps the one the grid gave it */
  const m = gridMetrics();
  nodes.forEach(n => {
    const c = layout[+n.dataset.i];
    if (!c || c.x) return;
    const r = n.getBoundingClientRect();
    c.x = Math.round((r.left - m.r.left) / (m.colw + m.gap)) + 1;
    c.y = Math.round((r.top - m.r.top) / m.R) + 1;
  });
  settle(pinned);
  nodes.forEach(n => {
    const c = layout[+n.dataset.i];
    n.classList.add('at');
    n.style.setProperty('--gx', c.x); n.style.setProperty('--gy', c.y); n.style.setProperty('--cw', c.w);
  });
  pinned = null;
  /* the grid reaches the bottom of the window, so the space under the
     last card is somewhere a widget can be added too */
  g.style.minHeight = H + 'px';
}
let fitT = 0;
addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => { if (view === 'home') drawHome(); }, 150); });

/* --- drag to a spot: the card lands on the cells under it, and anything
   in the way moves down. Before 2026-09-22 it swapped with the card under
   the pointer, which could not leave a gap. --- */
let moving = null;
function startMove(ev, i) {
  if (ev.target.closest('.x')) return;
  ev.preventDefault();
  const node = ev.currentTarget.parentElement, r = node.getBoundingClientRect();
  moving = { i: i, node: node, dx: ev.clientX - r.left, dy: ev.clientY - r.top };
  node.classList.add('drag');
  const gh = $('#ghost');
  gh.style.cssText = 'display:block;width:' + r.width + 'px;height:' + Math.min(r.height, 160) + 'px;left:' + r.left + 'px;top:' + r.top + 'px';
  gh.innerHTML = '<div style="padding:11px 13px;font-family:var(--f1);font-size:11px;letter-spacing:.2em;color:var(--acc)">' + esc(WIDGETS[layout[i].t].nm) + '</div>';
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', endMove, { once: true });
}
function onMove(ev) {
  if (!moving) return;
  const gh = $('#ghost');
  gh.style.left = (ev.clientX - moving.dx) + 'px';
  gh.style.top = (ev.clientY - moving.dy) + 'px';
  const m = gridMetrics(), c = layout[moving.i];
  const at = cellAt(m, ev.clientX - moving.dx + m.colw / 2, ev.clientY - moving.dy + m.R / 2);
  moving.to = { x: Math.max(1, Math.min(at.c, m.cols - c.w + 1)), y: at.r };
  hint(m, moving.to.x, moving.to.y, c.w, hOf(moving.i), true);
}
function endMove(ev) {
  if (!moving) return;
  window.removeEventListener('pointermove', onMove);
  $('#ghost').style.display = 'none';
  moving.node.classList.remove('drag');
  hint();
  if (moving.to) {
    const c = layout[moving.i];
    c.x = moving.to.x; c.y = moving.to.y;
    pinned = moving.i;
    saveLayout();
  }
  moving = null;
  drawHome();
}

/* --- drag the corner to resize, snapped to grid columns and 84px rows --- */
let sizing = null;
function startResize(ev, i, node) {
  ev.preventDefault(); ev.stopPropagation();
  const m = gridMetrics();
  sizing = { i: i, node: node, cols: m.cols, colw: m.colw, gap: m.gap, x: ev.clientX, y: ev.clientY, w: layout[i].w, h: layout[i].h };
  window.addEventListener('pointermove', onResize);
  window.addEventListener('pointerup', endResize, { once: true });
}
function onResize(ev) {
  if (!sizing) return;
  const dw = Math.round((ev.clientX - sizing.x) / (sizing.colw + sizing.gap));
  const dh = Math.round((ev.clientY - sizing.y) / (parseFloat($('#grid').style.getPropertyValue('--row')) || 84));
  const w = Math.max(2, Math.min(sizing.cols, sizing.w + dw));
  const h = Math.max(2, Math.min(12, sizing.h + dh));
  layout[sizing.i].w = w; layout[sizing.i].h = h;
  sizing.node.style.setProperty('--cw', w); sizing.node.style.setProperty('--ch', h);
}
function endResize() {
  if (!sizing) return;
  window.removeEventListener('pointermove', onResize);
  pinned = sizing.i;
  saveLayout(); sizing = null; drawHome();
}

/* A widget's own choices, the ones its card menu carries: the range it shows
   (`days`) and any pick list its `menu` offers. Only pick lists: a menu item
   that opens a sheet of its own (WEIGHT's cut plan) stays on the card, since
   a sheet opened from this one walks history off the page (root brief). */
function widgetChoices(W, cfg, redraw) {
  const out = [];
  if (W.days) out.push({ label: 'SHOW', sub: W.days.map(d => ({
    label: d[1], check: (cfg.days || W.day0 || 90) === d[0], fn: () => { cfg.days = d[0]; redraw(); } })) });
  let m = [];
  try { m = W.menu ? W.menu(cfg, redraw) : []; } catch (e) { m = []; }
  m.forEach(x => { if (x && x.sub && x.sub.length) out.push({ label: String(x.label).toUpperCase(), sub: x.sub }); });
  return out;
}
function widgetPicker(spot) {
  spot = spot && spot.x ? spot : null;
  /* a widget added from an empty patch lands on it, at the patch's size if
     the patch has one; from the button it takes the first hole it fits */
  const put = cfg => {
    if (spot) {
      cfg.x = spot.x; cfg.y = spot.y;
      if (spot.w) { cfg.w = Math.max(2, spot.w); cfg.h = Math.max(1, spot.h); }
      else cfg.x = Math.min(spot.x, COLS + 1 - cfg.w);

    layout.push(cfg);
    pinned = layout.length - 1;
  };
  const add = (cfg, nm) => { put(cfg); saveLayout(); closeModal(); drawHome(); toast('<b>' + esc(nm) + '</b> added'); };

/* ══════════════ backup and export ══════════════
   Everything is local, so a backup is the only safety net there is. Two kinds:
   a restorable snapshot (JSON, everything) and readable exports (CSV/text, for
   spreadsheets and clients).                                                  */
const BKEY = 'lifeos_lastbackup';
function download(name, text, mime) {
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain;charset=utf-8' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const csvCell = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const csv = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');

/* Every row in the store, from the store (1.0.37). It used to copy
   localStorage key by key, which held only the fast half: a photo, any row
   the full fast half had moved to IndexedDB, and since TRAIN's sets were
   kept out of the open (records.js, KEPT OUT), every set, were missing from
   it. Now it is the same file the nightly backup writes, which any app's
   Restore merges, plus the look of every app. */
function backupAll() {
  Rec.need().then(() => {
    const bag = { kind: 'motherbase-backup', v: 1, app: '*', at: new Date().toISOString(), rows: Rec.export(),
      local: IO.localBits ? IO.localBits('home') : {} };
    download('motherbase-all-' + LifeOS.day() + '.json', JSON.stringify(bag), 'application/json');
    try { localStorage.setItem(BKEY, LifeOS.day()); } catch (e) {}
    toast('<b>' + bag.rows.length.toLocaleString() + '</b> rows backed up, every app');
    refreshDataBtn();
  });
}
function restore(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let bag; try { bag = JSON.parse(fr.result); } catch (e) { return toast('that file is not JSON'); }
    /* the store's own file merges, newer rows winning, like every app's Restore */
    if (bag.kind === 'motherbase-backup') {
      Rec.need().then(() => {
        const c = IO.restore(bag, 'merge');
        toast(c ? '<b>' + c.toLocaleString() + '</b> rows restored' : 'Nothing to restore. This device already has all of it');
      }).catch(e => toast(esc(e && e.message || 'could not restore'), { bad: true }));
      return;
    }
    if (bag.kind !== 'lifeos-backup') return toast('not a backup from this suite');
    if (!confirm('Replace ALL data on this device with the backup from ' + (bag.at || '?') + '?\n\nThis cannot be undone.')) return;
    Object.keys(bag.local || {}).forEach(k => { try { localStorage.setItem(k, bag.local[k]); } catch (e) {} });
    LifeOS._adopt(bag.shared || {});
    toast('restored — reloading…');
    setTimeout(() => location.reload(), 900);
  };
  fr.readAsText(file);
}
function exportLogCSV() {
  const doc = LifeOS.doc(), rows = [['date', 'activity', 'activity_id', 'category', 'logged_at', 'source']];
  Object.keys(doc.log).sort().forEach(date => {
    const day = doc.log[date];
    Object.keys(day).forEach(id => {
      const a = doc.activities[id] || {};
      rows.push([date, a.name || id, id, a.cat || '', new Date(day[id].ts).toISOString(), day[id].src || '']);
    });
  });
  if (rows.length === 1) return toast('nothing logged yet');
  download('lifeos-log-' + LifeOS.day() + '.csv', csv(rows), 'text/csv;charset=utf-8');
  toast('<b>' + (rows.length - 1) + '</b> ticks exported');
}
function exportHabitsCSV() {
  const hs = Object.values(LifeOS.doc().habits);
  if (!hs.length) return toast('no habits yet');
  const rows = [['habit', 'cadence', 'current_streak', 'last_30_days', 'created', 'archived']];
  hs.forEach(h => rows.push([h.name, cadenceText(h.cadence), LifeOS.streak(h.actId, h.cadence), LifeOS.count(h.actId, 30), h.created || '', h.archived ? 'yes' : 'no']));
  download('lifeos-habits-' + LifeOS.day() + '.csv', csv(rows), 'text/csv;charset=utf-8');
  toast('habits exported');
}
function exportActivitiesCSV() {
  const as = Object.values(LifeOS.doc().activities);
  if (!as.length) return toast('no activities yet');
  const rows = [['name', 'id', 'category', 'minutes', 'energy']];
  as.forEach(a => rows.push([a.name, a.id, a.cat || '', a.dur || '', a.energy || '']));
  download('lifeos-activities-' + LifeOS.day() + '.csv', csv(rows), 'text/csv;charset=utf-8');
  toast('activities exported');
}
function todayText() {
  const doc = LifeOS.doc(), t = doc.today, today = LifeOS.day();
  const lines = [today + (t && t.date === today && t.name ? '  ·  ' + t.name : ''), ''];
  if (t && t.date === today && t.blocks.length) {
    t.blocks.forEach(b => lines.push((LifeOS.isDone(b.actId, today) ? '[x] ' : '[ ] ') + (b.s == null ? '' : MIN2(b.s) + '  ') + b.name + '  (' + DUR(b.dur || 0) + ')'));
  } else lines.push('(no routine published for today)');
  const extra = Object.keys(LifeOS.dayLog()).filter(id => !(t && t.date === today && t.blocks.some(b => b.actId === id)));
  if (extra.length) {
    lines.push('', 'Also logged:');
    extra.forEach(id => lines.push('[x] ' + ((doc.activities[id] || {}).name || id)));
  }
  return lines.join('\n');
}
function copyToday() {
  const text = todayText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('today copied to the clipboard'), () => download('today-' + LifeOS.day() + '.txt', text));
  } else download('today-' + LifeOS.day() + '.txt', text);
}
function wipeAll() {
  if (!confirm('Delete ALL data on this device — ticks, habits, every app’s own storage?\n\nBack up first. This cannot be undone.')) return;
  if (!confirm('Really delete everything? Last chance.')) return;
  try { localStorage.clear(); } catch (e) {}
  try { indexedDB.deleteDatabase('lifeos'); } catch (e) {}
  setTimeout(() => location.reload(), 400);
}

const daysSinceBackup = () => {
  const d = localStorage.getItem(BKEY); if (!d) return null;
  return Math.round((new Date(LifeOS.day() + 'T12:00:00') - new Date(d + 'T12:00:00')) / 86400000);
};
