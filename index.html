<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mb-version" content="1.0.56, 2026-10-06">
<title>MAIN MENU</title>
<link rel="icon" href="icon-192.png">
<!-- the icon on an iPhone's home screen. Every app gets one from mobile.js;
     the root names its own, because from a folder this file's folder is not
     an app id -->
<link rel="apple-touch-icon" href="shared/icons/home.png" data-mb-app="home" data-mb-dir="shared/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="shared/fonts/fonts.css" rel="stylesheet">

<!-- The shared foundation. The home screen used to carry its own colours, its
     own dialog and its own toast; now it wears the same ones as every app, so
     a theme picked here is the theme everywhere. mobile.js before ui.js. -->
<script src="shared/skins.js"></script>
<script src="shared/boot.js"></script>
<script src="shared/day.js"></script>
<script src="shared/records.js"></script>
<script src="shared/journal.js"></script>
<script src="shared/measure.js"></script>
<script src="shared/chart.js"></script>
<script src="shared/mobile.js"></script>
<script src="shared/sound.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/io.js"></script>
<script src="shared/icons.js"></script>
<!-- shared/import.js is fetched when "Bring in an old spreadsheet" is used
     (needImport), not on every open. -->
<style>
:root{
  /* ── the bridge ──
     These were fixed hex codes, which meant the home screen was one theme and
     the apps were another. They are now aliases onto the shared skin tokens,
     so every rule below this line follows whatever theme is picked and every
     colour edit in Settings reaches the home screen too.

     Nothing else in this file had to change for that to work, which is the
     point of naming colours by their job rather than by their value.        */
  --panel:var(--surface-1); --panel2:var(--surface-2);
  --line:var(--border);     --line2:var(--border-strong);
  --txt:var(--text-1);      --dim:var(--text-2);   --dim2:var(--text-muted);
  --acc:var(--accent);      --acc-d:var(--border-strong);
  --bad:var(--danger);      --good:var(--success);
  /* --bg and --warn are already skin tokens under exactly these names. */
  --f1:var(--font-display); --f2:var(--font-body);
  --gap:var(--s-3,12px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  /* The wash follows the accent instead of being two fixed blues, so it is
     still there on a light theme rather than turning into a bruise. */
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb,var(--accent) 12%,var(--bg)) 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 100%, color-mix(in srgb,var(--data-3) 9%,var(--bg)) 0%, transparent 55%),
    var(--bg);
  color:var(--txt); font-family:var(--f2); font-size:var(--f-2,14px); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
@media (hover:hover) and (pointer:fine){
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}
}

/* dvh, not vh: on a phone vh is the tallest the viewport ever gets, so the
   bottom of a 100vh column sits behind the browser's own bar. */
#wrap{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- dock ---------- */
header{
  display:flex;align-items:center;gap:var(--s-3,12px);flex:0 0 auto;
  padding:calc(var(--s-2,8px) + var(--safe-t,0px)) var(--s-4,14px) var(--s-2,8px);
  background:color-mix(in srgb,var(--surface-1) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:var(--e-1),var(--rim);
}
.logo{font-family:var(--f1);font-weight:700;font-size:17px;letter-spacing:.2em;display:flex;align-items:center;gap:9px;cursor:pointer}
.logo b{color:var(--acc)}
/* The glow is the accent, half strength. It was a fixed ice blue, which glowed
   blue on gold Block and on every light theme. */
.logo .mark{color:var(--acc);font-size:15px;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 50%,transparent))}
/* The dock sits on the recessed surface. It was a fixed near-black, so on a
   light theme it was a black bar under dark labels nobody could read. */
nav{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
  min-width:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:5px 9px;border-radius:6px;font-family:var(--f1);font-size:12px;letter-spacing:.06em;color:var(--dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;
}
/* A narrower desktop window keeps the icons and drops the names, which are in
   the tooltip. Tom, 2026-09-14: "the header now takes up too much space".

   This was a fixed 821-to-1400 band, and the band was the bug. Outside it the
   names came back, the row grew past the window, and `overflow-x:auto` with a
   hidden scrollbar quietly slid the LAST apps off the right edge with nothing
   on screen saying so. NOTICE is thirteenth of fourteen, so NOTICE is the one
   that vanished. Tom, 2026-09-17: "NOTICE goes missing from my motherbase main
   menu under certain desktop window sizes."

   It is measured now, by `fitNav`, so the names are dropped exactly when they
   do not fit and at no other width. `.scrolly` is the last resort: if the row
   still does not fit with the names off, the right edge fades, which is the
   only honest thing a hidden scrollbar can be replaced with. */
/* Fourteen names measure 1237px of dock and the rest of the header takes
   about 400, so the names fit from about 1640px up and not below it. A ceiling
   with no floor under it, which is the difference from the 821-to-1400 band
   this replaced: that one handed the names BACK above 1400, where they did not
   fit, and the overflow went out of sight behind a hidden scrollbar. */
@media (max-width:1700px){
  nav button .nm{display:none}
  nav button{padding:5px 8px}
}
/* Everything in the header that is not an app gives way before an app does:
   the wordmark goes down to its mark, the clock goes, and WIDGET and DATA go
   down to the icons they already carry for a phone. The apps are what the
   header is FOR.

   A plain width rule, unlike the names above. Fourteen icons need about 550px
   and the wordmark, clock and two worded buttons take about 400, so under
   1150 there is no arrangement where all three fit and no measuring to do. */
@media (max-width:1150px){
  header .logo .wm{display:none}
  header .clock{display:none}
  header .hbtn .lg{display:none}
  header .hbtn .sm{display:inline}
  header .hbtn{padding:0 var(--s-2,8px)}
}
nav.scrolly{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
@media (hover:hover) and (pointer:fine){ nav button:hover{color:var(--txt)} }
/* Each app has a colour, --c, its slot in the theme's chart ramp: the icon
   wears it always, and the whole button wears it when the app is open. Tom,
   2026-09-15: the icons "are currently just plain letters". Drawn a step
   heavier and a size up as well, in appIco. */
nav button > span:first-child{display:flex;color:var(--c,var(--dim))}
/* The open app's NAME is in the reading colour; its colour is on the icon,
   the tint and the ring. A chart colour is picked to read as a line, not as
   words, and on a light dock Lego's yellow TRAIN measured 1.04 to 1. */
nav button.on{background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface-2));color:var(--txt);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c,var(--accent)) 34%,var(--bg))}
nav button .k{font-size:9px;opacity:.5}
nav button.dead{color:var(--dim2)}
nav button.dead > span:first-child{color:var(--dim2)}
/* dragging the dock into the order you want */
nav button[draggable]{cursor:grab}
nav button.dragging{opacity:.4;cursor:grabbing}
nav button.dropinto{box-shadow:inset 2px 0 0 var(--acc)}
/* the line in front of Tom's own apps: a line, no words, because the words
   took more room than the apps they labelled */
.navsep{flex:0 0 1px;align-self:stretch;margin:var(--s-1);background:var(--line2)}
.spacer{flex:1}
.clock{font-family:var(--f1);font-size:12px;letter-spacing:.1em;color:var(--dim);text-align:right;line-height:1.35;white-space:nowrap;flex:0 0 auto}
.clock b{display:block;color:var(--txt);font-size:14px;letter-spacing:.14em}
.hbtn{
  min-height:var(--tap,44px);padding:0 var(--s-3,12px);border:1px solid var(--line);
  border-radius:var(--radius-md,10px);background:var(--panel);
  font-family:var(--f1);font-size:var(--f-1,12px);font-weight:var(--w-bold,700);
  letter-spacing:.08em;color:var(--dim);white-space:nowrap;
}
@media (hover:hover) and (pointer:fine){ .hbtn:hover{border-color:var(--acc);color:var(--acc)} }
.hbtn.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.hbtn .sm{display:none}

/* ── the bottom tab bar ──
   The top dock is six small targets in a row, which is fine with a mouse and
   hopeless with a thumb. On a phone the same six become a bar at the bottom,
   inside reach and above the home indicator. It is a flex child of the column
   rather than a fixed overlay, so nothing has to guess its height. */
#tabs{display:none}
@media (max-width:820px){
  header nav{display:none}
  .clock{display:none}
  .hbtn .lg{display:none}
  .hbtn .sm{display:inline}
  #tabs{
    display:flex;flex:0 0 auto;background:var(--panel);
    box-shadow:var(--e-3),var(--rim);
    padding-bottom:var(--safe-b,0px);
  }
  /* Equal shares, never less than a label: with SHEET the bar holds eight,
     and `flex:1` alone kept each button as wide as its word, so the row ran
     to 460px on a 390px phone and SPEAK was off the edge (2026-09-25). A
     two-word name wraps rather than widening its button. */
  #tabs button{
    flex:1 1 0;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;color:var(--dim2);
    font-family:var(--f1);font-size:9.5px;font-weight:var(--w-bold,700);letter-spacing:.06em;
  }
  #tabs button{white-space:normal;text-align:center;line-height:1.15}
  #tabs button .g{font-size:18px;line-height:1}
  /* a label may use the whole button; the 44px target is the button's height */
  #tabs button{padding-left:1px;padding-right:1px}
  #tabs button .lb{display:block;width:100%;text-align:center}
  #tabs.plainfont button .lb{font-family:system-ui,-apple-system,sans-serif}
  /* the reading colour, as on the desk dock: the accent over the app's tint
     measured 3.96 to 1 on Slab */
  #tabs button.on{color:var(--txt)}
  #tabs button.dead{opacity:.4}
  #home{padding:var(--s-3,12px) var(--s-3,12px) var(--s-6,32px)}
}

/* ---------- stage ---------- */
#stage{flex:1;position:relative;min-height:0}
#home{position:absolute;inset:0;overflow:auto;padding:14px 14px 60px}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frame.hide{display:none}

/* ---------- widget grid ---------- */
#grid{
  /* dense: a widget fills the first hole it fits, so a short card beside a
     tall one does not leave an empty band under it. Tom, 2026-09-14: "why is
     there an awkward space between day log and weight?" */
  display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:row dense;gap:var(--gap);
  /* Tom, 2026-09-17, pointing at the space under CLOCK: "Why am I unable to
     put widgets in this space?" Because a widget spanned COLUMNS and never
     rows, so it sat in exactly one grid row and that row was as tall as the
     tallest thing in it. The space under a short card was not an empty cell,
     it was the inside of an occupied one, and dense only ever backfilled
     holes ACROSS a row. The comment above claimed otherwise and was wrong.

     Rows are the unit --ch already counts in. One gap comes off each step so
     a card ends up the height it always was rather than growing by a gap per
     row. */
  grid-auto-rows:calc(var(--row, 84px) - var(--gap));
  /* Items fill the rows they span. `align-items:start` was right while every
     card carried its own pixel height; with spans it left a card sized to its
     text, so an empty TODO collapsed to one line inside five rows. */
  /* Tom, 2026-09-22: the grid fits any screen, so no cap on its width.
     The row height is set by fitGrid to fill the window's height. */
  margin:0;
}
/* auto rows on a phone: the desk's fixed row made every stacked card 72px
   tall with the rest of it cut off, from 1.0.23 until 1.0.34 */
@media(max-width:820px){ #grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:auto} }
/* ── a card stays where it was put ──
   Tom, 2026-09-22: "allow empty space". A card with a saved spot sits at it,
   and a gap it leaves stays a gap. Desk width only: on a phone the cards
   stack in the order of their spots. */
@media(min-width:821px){
  #grid{position:relative}
  .w.at{grid-column:var(--gx) / span var(--cw,4);grid-row:var(--gy) / span var(--ch,3)}
  #grid.gapon{cursor:pointer}
}
/* the empty patch under the pointer, and where a dragged card will land */
#gaphint{position:absolute;display:none;pointer-events:none;z-index:1;
  border:1px dashed var(--line2);border-radius:var(--radius-lg,14px);
  align-items:center;justify-content:center;color:var(--dim2)}
#gaphint.on{display:flex}
#gaphint.land{border-color:var(--acc);color:var(--acc)}
.w{
  grid-column:span var(--cw,4);
  /* The material layer (shared/THEMING.md, Material): a card carries
     `mb-card`, the dark glass BLOCK's lanes are; its rows carry `mb-plate`
     and --c, the colour of the block or of the app the widget draws for,
     set in drawHome. No background, border or shadow written here. */
  border-radius:var(--radius-lg,14px);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  /* auto / span N, not "span N": a single value sets the row START, which
     is not a span at all, and the declaration was quietly dropped. */
  grid-row:auto / span var(--ch,3);min-height:0;
}
/* On a phone a card is as tall as what is in it. A fixed height means either
   a scrollbar inside a scrolling page — two scrolls fighting over one finger —
   or a card that is mostly empty. */
@media(max-width:820px){ .w{grid-column:span 4;grid-row:auto;height:auto;min-height:0} .w.first{order:-1} }
.w:before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--acc-d),transparent);pointer-events:none}
.w.drag{opacity:.35;outline:1px dashed var(--acc)}
.w.over{outline:1px solid var(--acc)}
.w-head{
  display:flex;align-items:center;gap:9px;padding:12px 13px 9px;flex:0 0 auto;
  font-family:var(--f1);font-size:var(--f-1,12px);font-weight:var(--w-bold,700);
  letter-spacing:.2em;color:var(--dim);
}
/* Only a mouse can drag by the title. On a touch screen that gesture and the
   page scroll are the same gesture, so the card is rearranged from the
   REARRANGE mode instead, with buttons that cannot be mistaken for a scroll. */
@media (hover:hover) and (pointer:fine){
  .w-head{cursor:grab}
  .w-head:active{cursor:grabbing}
}
.w-head .c{color:var(--acc);letter-spacing:.06em}
.w-head .sub{margin-left:auto;font-family:var(--f2);font-size:11px;letter-spacing:0;color:var(--dim2);white-space:nowrap}
.w-head .x,.w-head .mv{display:none;color:var(--dim2);font-size:15px;line-height:1;
  width:32px;height:32px;flex:0 0 auto;border-radius:var(--radius-sm,6px);background:var(--panel2)}
/* Controls appear when you say you are rearranging, and not before. A control
   that only exists on hover does not exist at all on a phone. */
body.editing .w-head .x,body.editing .w-head .mv{display:block}
body.editing .w-head .x{color:var(--bad)}
body.editing .w{box-shadow:var(--e-3),0 0 0 1px var(--acc)}
@media (hover:hover) and (pointer:fine){
  .w:hover .w-head .x{display:block;opacity:.6}
  .w-head .x:hover{opacity:1;color:var(--bad)}
}
/* A scrolling box inside a scrolling page means two scrolls arguing over one
   finger, and the inner one always wins by accident. On a phone the card is
   as tall as its contents instead, so there is only ever one thing to scroll.
   With a mouse and a fixed-height card the inner scroll is fine. */
/* ── why a widget was scrolling ──
   Tom, 2026-09-06: "why does it have scrolling?" and "why is the 199.9 almost
   out of border?" One cause. A chart keeps its shape, so its height follows
   its WIDTH - and a widget's height does not. Wide enough, and the chart grew
   until it pushed the numbers under it out of the box, which is what he saw:
   a scrollbar and a figure half off the bottom edge.

   A column that shares its height out. Anything that must be a fixed size says
   so, and the chart takes what is left rather than taking what it likes. */
.w-body{flex:1;padding:0 13px 13px;min-height:0;overflow:visible;
  display:flex;flex-direction:column;gap:8px}
/* A chart takes the room that is left, but never less than a readable strip:
   with the answer on top of it, a small widget left it no room at all. */
.w-body > .fits{flex:1 1 auto;min-height:var(--s-9,96px)}
.w-body > .fits > svg{width:100%;height:100%;display:block}
@media (hover:hover) and (pointer:fine){ .w-body{overflow:auto} }
/* BODY HEATMAP's two figures: one above the other, or side by side,
   whichever draws them bigger in the box. Standing and Double biceps are
   tall and narrow, so they go side by side much sooner than Vitruvian. A
   phone card is as tall as its contents, so there nothing is measured:
   the tall poses sit side by side and Vitruvian stacks. */
.bh-fig{display:flex;align-items:center;justify-content:center}
.bh-pair{display:flex;flex-direction:column;gap:var(--s-1);width:100%}
.bh-pair svg{display:block;width:100%;height:auto}
.bh-pair.bh-p-stand,.bh-pair.bh-p-flex{flex-direction:row;align-items:flex-start}
.bh-pair.bh-p-stand svg,.bh-pair.bh-p-flex svg{flex:1 1 0;min-width:0}
.row .bh-dot{flex:0 0 auto;width:var(--s-2);height:var(--s-2);border-radius:var(--radius-full,999px)}
.row.bh-row{flex-wrap:wrap;row-gap:0}
.row .bh-rec{margin-left:auto;display:inline-flex;align-items:center;gap:var(--s-1);
  font-family:var(--f1);font-size:var(--f-1);letter-spacing:.06em;color:var(--dim2)}
@media (min-width:821px){
  .bh-fig{container-type:size}
  .bh-pair{height:100%}
  .bh-pair svg{flex:1 1 0;min-width:0;min-height:0;height:100%}
  .bh-pair.bh-p-stand,.bh-pair.bh-p-flex{flex-direction:column;align-items:stretch}
  @container (orientation: landscape){ .bh-pair{flex-direction:row} }
  @container (min-aspect-ratio: 2/5){ .bh-pair.bh-p-stand{flex-direction:row} }
  @container (min-aspect-ratio: 3/5){ .bh-pair.bh-p-flex{flex-direction:row} }
}
/* Resize is a mouse affordance and nothing else — a phone card is as wide as
   the screen and as tall as its contents, so there is nothing to resize. */
.w-size{display:none}
@media (hover:hover) and (pointer:fine){
  .w-size{
    display:block;position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;opacity:0;
    background:linear-gradient(135deg,transparent 46%,var(--line2) 46%,var(--line2) 54%,transparent 54%,transparent 70%,var(--line2) 70%,var(--line2) 78%,transparent 78%);
  }
  .w:hover .w-size{opacity:1}
}
.w-size:hover{background:linear-gradient(135deg,transparent 46%,var(--acc) 46%,var(--acc) 54%,transparent 54%,transparent 70%,var(--acc) 70%,var(--acc) 78%,transparent 78%)}
#ghost{position:fixed;pointer-events:none;z-index:80;opacity:.9;border:1px solid var(--acc);border-radius:var(--radius-lg,12px);background:var(--panel2);box-shadow:var(--e-5);display:none}
.empty{color:var(--dim2);font-size:12px;line-height:1.7}
.empty b{color:var(--dim)}
.link{color:var(--acc);cursor:pointer;border-bottom:1px dotted var(--acc-d)}

/* ---------- shared widget bits ---------- */
.rowlist{display:flex;flex-direction:column;gap:5px}
/* a row is a plate in its own colour, the way a block is in BLOCK: drawHome
   puts mb-plate on it, and --c is the block's colour or the widget's app's */
.row{display:flex;align-items:center;gap:10px;padding:8px 9px;min-height:var(--tap,44px);
  border-radius:var(--radius-md,10px);position:relative}
@media (hover:hover) and (pointer:fine){ .row:hover{background:var(--surface-3)} }
.row .bar{position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--acc)}
/* at least 60px so times line up, wider when the theme's font is wide (A4,
   2026-10-05: Press Start 2P ran "10:45pm" into the name beside it) */
.row .t{font-family:var(--f1);font-size:11px;letter-spacing:.06em;color:var(--dim);min-width:60px;white-space:nowrap;flex:0 0 auto;padding-left:8px}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* A bullet on the home screen is the same bullet as everywhere else: the mark
   in a .k, the words in a .tx, both dressed by shared/journal.js. The widget
   only says how much room each gets inside a card this narrow. */
.row.mb-bullet{align-items:flex-start}
.row.mb-bullet .k{flex:0 0 auto;background:none;border:0;padding:0;margin-top:2px;
  min-width:var(--tap,44px);min-height:var(--tap,44px);display:flex;align-items:center;
  justify-content:center;color:var(--dim);cursor:pointer}
.row.mb-bullet .k:hover{color:var(--acc)}
.row.mb-bullet .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:10px;color:var(--dim2);font-family:var(--f1);letter-spacing:.06em;flex:0 0 auto}
.row.done{opacity:.5}
/* LINKS: the open-in-a-new-tab button on a link row. A full 44px target that
   does not make the row 60px tall — the negative margins eat the row's own
   padding, so the button fills the row rather than stretching it. */
.row .lopen{flex:0 0 auto;width:var(--tap,44px);height:var(--tap,44px);margin:-8px -9px -8px 0;
  display:flex;align-items:center;justify-content:center;
  background:none;border:0;color:var(--dim2);cursor:pointer;border-radius:var(--radius-md,10px)}
@media (hover:hover) and (pointer:fine){ .row .lopen:hover{color:var(--acc);background:var(--surface-3)} }
.mb-group .lwhere{color:var(--dim2);letter-spacing:0;text-transform:none;font-family:var(--f1)}

/* ── the now band ──

.nowband .nchk{flex:none;width:var(--tap,44px);height:var(--tap,44px);

/* Where you are in the list, and what you have slipped past. `late` is a mark,

/* A link on a row is underlined rather than coloured: colour on these rows

.row.late:not(.done) .t{color:var(--warn,var(--acc));opacity:.9}
.row.done .n{text-decoration:line-through;text-decoration-color:var(--dim2);color:var(--dim)}
.chk{width:26px;height:26px;flex:0 0 auto;border:2px solid var(--line2);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;
  transition:background-color var(--dur-fast,140ms) var(--ease-out,ease),

/* The circle stays small; the thing a finger or pointer hits is 44px. */

.chk::after{content:'';position:absolute;inset:calc((var(--tap,44px) - 26px) / -2 - 2px)}

.laps{display:flex;flex-direction:column;gap:var(--s-1);font-size:var(--f-1)}

.lap span{font-family:var(--f1);letter-spacing:.1em;color:var(--dim2);flex:1}

/* The modal and the toast used to be built here, in this file's own shapes.

<body>
<div id="wrap">
  <header>
    <!-- What this screen is, said plainly. It is the thing you land on and
         pick an app from; "LifeOS" was a project name, not a label. -->
    <div class="logo" onclick="go('home')"><span class="mark">◈</span><span class="wm">MAIN <b>MENU</b></span></div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <div class="clock"><b id="cDate">—</b><span id="cSub">—</span></div>
    <button class="hbtn mb-press mb-tap" id="btnWidget" title="Add a widget to the home screen"><span class="lg">+ WIDGET</span><span class="sm" id="wIco"></span></button>
    <button class="hbtn mb-press mb-tap" id="btnData" title="Backup, restore and export your data"><span class="lg">DATA</span><span class="sm" data-icon="backup" data-icon-size="16"></span></button>
  </header>
  <main id="stage">
    <section id="home" class="mb-scroll"><div id="grid"></div></section>
    <div id="over" role="dialog" aria-modal="true"></div>
  </main>
  <!-- the same six apps as the top dock, where a thumb can reach them -->
  <nav id="tabs" aria-label="Apps"></nav>
</div>
<div id="ghost"></div>
<div id="modal"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<input type="file" id="xlsxIn" accept=".xlsx,.xls,.xlsm" style="display:none">

<script>
/* ══════════════════════════ LIFEOS KERNEL v2 ══════════════════════════
   Identical in every app that shares data — edit the copy in index.html and
   re-run the sync script.

   v1 kept the shared state as ONE JSON blob and broadcast it whole, with the
   shell as the single writer and a postMessage broker underneath. That is the
   shape the brief forbids and the shape SystemOS died of, so v2 is a thin view
   over `shared/records.js` instead:

     activities → one `activity` row each
     habits     → one `habit` row each
     ticks      → one `tick` row per activity per day
     today      → one dated `plan` row, published by whoever owns the schedule

   Every app now writes directly. There is no broker and no hosted/solo split,
   because every app on this origin reads and writes the same rows. What remains
   is a nudge: frames opened from a folder do not reliably get storage events, so
   a writer tells its neighbours to look again. It sends no data.

   The API is unchanged from v1 on purpose — the apps did not have to move.

   Load order in the page, before this block:
     shared/day.js  then  shared/records.js
   (written without tags on purpose: a literal closing script tag inside an
    inline script ends the script element, even inside a comment)
                                                                            */
window.LifeOS = (function () {
  if (!window.Rec || !window.Day) {
    console.error('[lifeos] records.js and day.js must load first');
    return { broken: 1, ready: function () {}, on: function () { return function () {}; },
             doc: function () { return { activities: {}, habits: {}, log: {}, today: null }; },
             isDone: function () { return false; }, dayLog: function () { return {}; },
             done: function () { return Promise.resolve(); }, acts: function () { return Promise.resolve(); } };
  }

  const HOSTED = (function () { try { return !!(window.parent && window.parent !== window); } catch (e) { return false; } })();
  let doc = null, subs = [], booted = false, bootQ = [];

  /* ─── the view: rows assembled into the shape the apps already expect ─── */
  function build() {
    const d = { v: 2, ts: Date.now(), activities: {}, habits: {}, log: {}, today: null };
    Rec.all('activity').forEach(r => { d.activities[r.key] = Object.assign({ id: r.key }, r.payload); });
    Rec.all('habit').forEach(r => { d.habits[r.key] = Object.assign({ id: r.key }, r.payload); });
    /* the row carries the time now, but callers still expect payload.ts */
    Rec.all('tick').forEach(r => {
      (d.log[r.date] || (d.log[r.date] = {}))[r.key] =
        Object.assign({ ts: Date.parse(r.updated_at) || 0 }, r.payload);
    });
    d.today = Rec.get('plan', Day.today(), 'routine');
    return d;
  }
  function refresh() {
    doc = build();
    if (!booted) { booted = true; bootQ.splice(0).forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } }); }
    subs.forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } });
  }

  /* ─── neighbours ───
     Same storage, but a frame loaded from a folder may never see the storage
     event. A write pokes everyone else; they re-read for themselves. */
  function poke() {
    const msg = { lifeos: 2, poke: 1 };
    try { if (HOSTED) window.parent.postMessage(msg, '*'); } catch (e) {}
    document.querySelectorAll('iframe').forEach(f => { try { f.contentWindow.postMessage(msg, '*'); } catch (e) {} });
  }
  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || m.lifeos !== 2 || !m.poke) return;
    Rec.reload();
    /* pass it on once, so a frame's sibling hears about it too */
    if (!m.relay) {
      const on = { lifeos: 2, poke: 1, relay: 1 };
      try { if (HOSTED && e.source !== window.parent) window.parent.postMessage(on, '*'); } catch (err) {}
      document.querySelectorAll('iframe').forEach(f => { try { if (f.contentWindow !== e.source) f.contentWindow.postMessage(on, '*'); } catch (err) {} });
    }
  });
  /* On a served address records.js's channel already carried the rows to
     every neighbour, and a poke made each one re-read the whole store. */
  const wrote = v => { if (!Rec.channel) poke(); return Promise.resolve(v); };

  /* ─── one-time move off the v1 blob ───
     Copies, never moves: `lifeos_v1` is left exactly where it is, so the old
     data is its own backup if anything here is wrong. */
  function migrate() {
    if (Rec.setting('lifeos', 'migrated')) return 0;
    let old = null;
    try { old = JSON.parse(localStorage.getItem('lifeos_v1')); } catch (e) {}
    let n = 0;
    if (old && old.v) {
      Object.keys(old.activities || {}).forEach(id => {
        const a = old.activities[id];
        Rec.set('activity', null, id, { name: a.name, cat: a.cat || '', dur: a.dur || 0, color: a.color || '', energy: a.energy || 2 }); n++;
      });
      Object.keys(old.habits || {}).forEach(id => { Rec.set('habit', null, id, old.habits[id]); n++; });
      Object.keys(old.log || {}).forEach(date => {
        const day = old.log[date] || {};
        Object.keys(day).forEach(k => { Rec.set('tick', date, k, day[k]); n++; });
      });
      console.info('[lifeos] moved ' + n + ' things off the old blob; lifeos_v1 left in place as a backup');
    }
    Rec.setting('lifeos', 'migrated', new Date().toISOString());
    return n;
  }

  const API = {
    v: 2,
    hosted: HOSTED,
    day: d => Day.of(d), slug: s => Day && String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x',
    shift: (date, n) => Day.shift(date, n),

/* ══════════════ shell: durability ══════════════
   localStorage is the fast synchronous copy the kernel already keeps. IndexedDB
   is the one that survives a big log — same doctrine as ARC: load the sync copy
   first, then swap in IDB if its stamp is newer. */
const IDB = (function () {
  let dbp = null;
  function db() {
    return dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('lifeos', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
  }
  return {
    get(k) { return db().then(d => new Promise((res, rej) => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
    set(k, v) { return db().then(d => new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); })); },

   the roster later appears at the end rather than not at all. That is what
   stops a saved order from quietly hiding a new app.

   order saved before that was the old default rearranged, and left in charge

function dockOrder() {

   changed, so the box is what to watch. Only a WIDTH change refits, so the
   class changes this makes cannot feed back into it. */

/** Everything on today, from both apps, in the order it happens.

    A block carries `s`, the minute of the day it starts. A bullet carries
    `at` as "HH:MM" if one was typed into it. Anything with neither sorts to
    the end rather than being given a fake midnight, and open todos lead that
    tail because a task with no time is still a task. */
function todayItems() {
  const today = LifeOS.day();
  const out = [];

  const plan = LifeOS.doc().today;
  if (plan && plan.date === today) {
    (plan.blocks || []).forEach(b => {
      const on = LifeOS.isDone(b.actId, today);
      out.push({
        kind: 'block', name: b.name, link: b.link || '', note: b.note || '', at: b.s == null ? null : b.s,
        dur: b.dur || 0, tag: b.lane || '', colour: b.color || '', done: on,
        tick: () => LifeOS.done(b.actId, today, !on, { src: 'home' }),
      });
    });
  }

  /* The same three rules STATUS uses, because a day that reads one way there
     and another way here is two different days.
       - written today
       - a task from before today, still open, which follows you forward
       - a task finished today, wherever it was written down
     Nothing is copied and nothing moves: this is a view over the rows. */
  Rec.all('note').forEach(r => {
    const n = r.payload;
    if (!n || n.cancelled) return;
    const isTodo = n.kind === 'todo';
    if (!noteOnDay(r, today)) return;
    /* A line's clock is its start; a ticked todo with no start, when it was
       ticked. The time order STATUS and LOG use (Tom, 2026-09-14). */
    const clock = n.at || (isTodo && n.done ? n.doneAt : null) || null;
    const mins = clock ? (+String(clock).split(':')[0] * 60 + +String(clock).split(':')[1]) : null;
    out.push({
      kind: n.kind, name: n.text || '', at: mins,
      dur: n.dur || 0, tag: '', colour: '', done: !!n.done, todo: isTodo,
      /* Only a todo has something to tick. An entry is a record of a thing
         that already happened and there is nothing to say about it. */
      tick: !isTodo ? null : () => { tickTodo(r); drawHome(); },
    });
  });

  return out.sort((a, b) => {
    /* Done sinks to the bottom. This is a reversal: it used to stay where it
       happened, because sinking is what breaks a strictly chronological read.
       Tom, 2026-09-05, chose the other trade — what is LEFT is what he needs
       to see, and a finished thing sitting in the middle of the list is just
       something to read past. The history is not lost, it is underneath.

       Nothing UNDONE is ever moved by this. That was the condition. */
    const d = x => x.done ? 1 : 0;
    if (d(a) !== d(b)) return d(a) - d(b);
    const at = x => x.at == null ? 1e9 : x.at;
    if (at(a) !== at(b)) return at(a) - at(b);
    /* Both untimed: an open task outranks a note about the past. */
    const rank = x => (x.todo && !x.done) ? 0 : 1;
    return rank(a) - rank(b);
  });
}

/** how many days back from today this activity has been ticked without a gap */
function tickStreak(actId) {
  let n = 0;
  for (let i = 0; i < 400; i++) {
    const d = LifeOS.shift(LifeOS.day(), -i);
    if (LifeOS.isDone(actId, d)) { n++; continue; }
    /* today not being ticked yet is not a broken streak, it is an unfinished
       day. Any other gap ends it. */
    if (i === 0) continue;
    break;
  }
  return n;

/* ══════════════ widgets ══════════════
   Each widget is a pure function of the shared doc: given a body element, fill
   it. The grid owns size and position; the widget owns nothing but its content,
   which is what lets you drag and resize them without touching this table. */
/* A block's note is where a link lives, written in BLOCK either as a plain
   address or as [label](address). Only http and https: a note is text a person
   typed, and text a person typed is not a reason to follow any scheme a
   browser happens to understand. */
const LINK_OK = /^https?:\/\//i;
const LINK_RE = /\[[^\]]{1,120}\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>"']+)/i;
function linkIn(x) {
  /* The block's own link first. Falling back to one written into a note keeps
     anything set up before the link field existed working. */
  if (x && x.link && LINK_OK.test(x.link)) return x.link;
  const m = LINK_RE.exec(String((x && x.note) || ''));
  return m ? (m[1] || m[2]) : null;
}

/* ── what you are meant to be doing, right now ──
   Tom, 2026-09-05: "make the Today widget good enough to follow without
   thinking. If BLOCK and STATUS are properly set up then it should be able to
   dictate my plan for the day."

   A list of the day is not that. A list makes you find your place in it every
   time you look, and finding your place is the thinking. So one line answers
   the question before the list does: what is running, or what is next, and how
   long you have.

   Four states, in the order they are checked:
     RUNNING   something started, has not finished, and is not ticked
     BEHIND    its slot has been and gone and it is still not ticked
     NEXT      nothing running or owed, so the soonest thing still ahead
     LOOSE     nothing timed left, so the first thing still undone
   and when there is nothing in any of them, the day is done and it says so.

   BEHIND used to sit at the bottom as a fallback, reached only once there was
   nothing ahead at all. So with four morning blocks unticked at 2pm it stepped
   over all four and announced Dishes, three hours away. One future block was
   enough to hide everything owed. The widget is meant to be followable without
   thinking, and a widget that skips your unfinished work is worse than a list,
   because a list at least shows you the gap.

   It is checked second now, under RUNNING, so something actually happening
   still wins. That also bounds how long it can nag: the moment the next block's
   slot opens, RUNNING takes the band back. */
function nowNext(items) {
  const d = new Date(), now = d.getHours() * 60 + d.getMinutes();
  const open = items.filter(x => !x.done);
  if (!open.length) return items.length ? { state: 'done' } : null;

  const timed = open.filter(x => x.at != null);
  const running = timed.filter(x => x.at <= now && now < x.at + (x.dur || 0))[0];
  if (running) return { state: 'running', it: running, mins: running.at + running.dur - now };

  /* Its whole slot has passed and it is still open. Earliest first: the one
     you dropped soonest is the one to pick back up. */
  const behind = timed.filter(x => x.at + (x.dur || 0) <= now).sort((a, b) => a.at - b.at);
  if (behind.length) return { state: 'loose', it: behind[0], missed: behind.length };

  const next = timed.filter(x => x.at > now)[0];
  if (next) return { state: 'next', it: next, mins: next.at - now };

  /* Nothing timed is running, owed or ahead, so what is left has no clock. */
  const loose = open.filter(x => x.at == null)[0] || open[0];
  return { state: 'loose', it: loose, missed: 0 };
}

/* "in 25m", "in 1h 10m", "for 40m" — short enough to read at a glance. */
function inWords(m) {
  m = Math.max(0, Math.round(m));
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');

/* ══════════════ desk tools: what TIMER, STOPWATCH, INTERVALS and ALARMS run on ══════════════
   Tom, 2026-09-25: "Add some general widgets as well like timers and stop
   watches and alarms." The board is redrawn whenever anything in the store
   changes, so a count kept inside a widget's drawing died with it: until
   1.0.35 TIMER went back to 00:00 whenever a tick landed from another app
   or from sync. The state lives here, one entry per widget, and one ticker
   keeps every face current and rings whatever is due, drawn or not.
   Counts in progress are kept in memory: a reload stops them, and nothing
   about one is written to the store or carried to another device. */

/* the first TIMER on the board is TIMER#0 and the second TIMER#1: the same
   through a redraw, a layout arriving by sync, and a move */
function toolOf(cfg, make) {
  const k = cfg.t + '#' + Math.max(0, layout.filter(c => c.t === cfg.t).indexOf(cfg));
  return TOOLS[k] || (TOOLS[k] = make());
}
const zpad = n => String(n).padStart(2, '0');
/* ── DESK TIME's sums ──

   1:40am is 1540. */
const deskShift = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + zpad(x.getMonth() + 1) + '-' + zpad(x.getDate()); };
const deskHM = s => { const m = Math.round(s / 60); return Math.floor(m / 60) + ':' + zpad(m % 60); };
const deskClk = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; const h = Math.floor(m / 60); return ((h % 12) || 12) + ':' + zpad(m % 60) + (h < 12 ? 'am' : 'pm'); };
function deskBed(d) {
  const on = (day, off) => { const r = Rec.get('deskon', day, ''); return r && Array.isArray(r.on) ? r.on.map(x => [x[0] + off, x[1] + off]) : []; };
  const all = on(d, 0).concat(on(deskShift(d, 1), 1440)).sort((a, b) => a[0] - b[0]);
  const now = new Date(), nowM = LifeOS.day() === d ? now.getHours() * 60 + now.getMinutes()
    : LifeOS.day() === deskShift(d, 1) ? 1440 + now.getHours() * 60 + now.getMinutes() : 99999;
  for (let i = 0; i < all.length; i++) {
    const end = all[i][1];
    if (end < 21 * 60 || end > 1440 + 12 * 60) continue;
    const next = i + 1 < all.length ? all[i + 1][0] : Math.min(nowM, 1440 + 12 * 60);
    if (next - end >= 180) return end;
  }
  return null;
}
/* the middle of the last 14 nights that have one */
function deskUsual() {
  const t = LifeOS.day(), B = [];
  for (let k = 1; k <= 14; k++) { const b = deskBed(deskShift(t, -k)); if (b != null) B.push(b); }
  if (!B.length) return null;
  B.sort((a, b) => a - b);
  const mid = B.length % 2 ? B[(B.length - 1) / 2] : (B[B.length / 2 - 1] + B[B.length / 2]) / 2;
  return { m: mid, n: B.length };
}

const mmss = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ':' + zpad(m) : zpad(m)) + ':' + zpad(s % 60);
};
const sfx = (cue, o) => { if (window.Sfx) try { Sfx.play(cue, o); } catch (e) {} };
/* a button inside a widget: drawn small, 44px to a thumb (mb-tap) */

/* ── ringing ──
   An alarm rings until it is answered: a chime every couple of seconds and a
   sheet with STOP and SNOOZE (Tom, 2026-09-17, on a prompt: "it should never
   go away until answered"). A timer or a set of intervals finishing is
   smaller, three chimes and a toast, because you are usually watching it. */
let ringing = null;
function ringFor(title, line, snooze) {
  if (ringing) ringing.stop();
  const r = { off: false, id: setInterval(() => sfx('complete', { level: 3 }), 2400) };
  r.stop = () => { if (r.off) return; r.off = true; clearInterval(r.id); if (ringing === r) ringing = null; };
  ringing = r;
  sfx('complete', { level: 3 });
  try { if (window.Notification && Notification.permission === 'granted') new Notification(title, { body: line || '' }); } catch (e) {}
  UI.dialog({
    title: title, width: 360,
    body: b => b.appendChild(el('div', 'ringline', esc(line || 'Time.'))),
    actions: [
      snooze ? { label: 'SNOOZE 5 MIN', fn: () => { r.stop(); snooze(); } } : null,
      { label: 'STOP', kind: 'go', fn: () => { r.stop(); } },
    ].filter(Boolean),
    onClose: () => r.stop(),
  });
  return r;
}
function chime(title, line) {
  sfx('complete', { level: 2 });
  setTimeout(() => sfx('complete', { level: 2 }), 1100);
  setTimeout(() => sfx('complete', { level: 3 }), 2200);
  toast('<b>' + esc(title) + '</b> ' + esc(line || ''), { ms: 8000 });
}

/* ── alarms ──
   A setting, so an alarm set on the PC is on the phone too and is in the
   backup. It rings on any device with the home screen open when the clock
   reaches it; a web page cannot wake a phone, and the widget says so. What
   has rung is remembered in memory only, because a remembered list in a
   setting is the live sync trap (root brief, Known traps). */
const alarmList = () => (Rec.setting('lifeos', 'alarms') || []).filter(a => a && /^\d\d:\d\d$/.test(a.at || ''));
const alarmSave = list => Rec.setting('lifeos', 'alarms', list);
/* no days, or all seven, is every day. An empty list does not survive live
   sync, so "every day" is written as no list at all */
const alarmDays = a => Array.isArray(a.days) && a.days.length && a.days.length < 7 ? a.days : null;
const alarmMin = a => { const p = a.at.split(':').map(Number); return p[0] * 60 + p[1]; };
const rang = {}, snoozes = [];
function alarmNext(a, from) {
  const m = alarmMin(a), days = alarmDays(a);
  for (let i = 0; i < 9; i++) {
    const d = new Date(from.getFullYear(), from.getMonth(), from.getDate() + i, Math.floor(m / 60), m % 60, 0, 0);
    if (d > from && (!days || days.indexOf(d.getDay()) > -1)) return d;
  }
  return null;
}
function alarmCheck(now) {
  const hm = zpad(now.getHours()) + ':' + zpad(now.getMinutes()), day = LifeOS.day();
  alarmList().forEach(a => {
    if (!a.on || a.at !== hm) return;
    const days = alarmDays(a);
    if (days && days.indexOf(now.getDay()) < 0) return;
    const k = (a.id || a.at) + '|' + day + '|' + hm;
    if (rang[k]) return;
    rang[k] = 1;
    const again = () => snoozes.push({ end: Date.now() + 5 * 60000, label: a.label || '' });
    ringFor('ALARM · ' + MIN2(alarmMin(a)), a.label || '', again);
  });
  for (let i = snoozes.length - 1; i >= 0; i--) {
    if (now.getTime() < snoozes[i].end) continue;
    const s = snoozes.splice(i, 1)[0];
    ringFor('ALARM · SNOOZED', s.label, () => snoozes.push({ end: Date.now() + 5 * 60000, label: s.label }));
  }
}

/* the three counters, each a fresh object per widget */
const timerTool = () => ({
  end: 0, set: 0,
  left(now) { return this.end ? Math.max(0, Math.ceil((this.end - now) / 1000)) : 0; },
  step(now) { if (this.end && now >= this.end) { this.end = 0; chime('TIMER', mmss(this.set) + ' is up'); } },
});
const watchTool = () => ({
  t0: 0, acc: 0, laps: [],
  ms(now) { return this.acc + (this.t0 ? now - this.t0 : 0); },
});
/* work and rest in seconds; rest 0 is an EMOM, one work slot straight after another */
const ivCfg = cfg => ({
  work: Math.max(1, Math.round(+(cfg && cfg.work) || 40)),
  rest: cfg && cfg.rest != null && cfg.rest !== '' ? Math.max(0, Math.round(+cfg.rest || 0)) : 20,
  rounds: Math.max(1, Math.round(+(cfg && cfg.rounds) || 8)),
});
const ivTool = () => ({
  t0: 0, acc: 0, mark: '', beep: 0, cfg: null,
  ms(now) { return this.acc + (this.t0 ? now - this.t0 : 0); },
  where(now) {
    const c = ivCfg(this.cfg), s = this.ms(now) / 1000;
    const total = c.rounds * c.work + (c.rounds - 1) * c.rest;
    if (s >= total) return { done: 1, total: total, c: c };
    const cyc = c.work + c.rest, round = Math.floor(s / cyc) + 1, within = s - (round - 1) * cyc;
    const work = within < c.work;
    return { round: round, work: work, left: work ? c.work - within : cyc - within, total: total, gone: s, c: c };
  },
  step(now) {
    if (!this.t0) return;
    const w = this.where(now);
    if (w.done) {
      this.t0 = 0; this.acc = 0; this.mark = '';
      chime('INTERVALS', 'all ' + w.c.rounds + ' rounds done');
      return;
    }
    const mk = w.round + (w.work ? 'w' : 'r');
    if (mk !== this.mark) { if (this.mark) sfx(w.work ? 'complete' : 'tick', { level: 1 }); this.mark = mk; this.beep = 0; }
    const s = Math.ceil(w.left);
    if (s >= 1 && s <= 3 && this.beep !== s) { this.beep = s; sfx('tick'); }
  },

/* One ticker for all of them. A tenth of a second so a stopwatch reads
   smoothly; the alarms are looked at once a second. */
let toolSec = -1;
setInterval(() => {
  const now = Date.now();
  Object.keys(TOOLS).forEach(k => {
    const s = TOOLS[k];
    try { if (s.step) s.step(now); if (s.paint) s.paint(now); } catch (e) { console.warn('[tools]', e); }
  });
  const sec = Math.floor(now / 1000);
  if (sec !== toolSec) { toolSec = sec; try { alarmCheck(new Date(now)); } catch (e) { console.warn('[alarms]', e); } }
}, 100);

/* ── BLOCK's Every and Anytime, read here ──
   Copies of rhAdd, everyState, rhWeekStart and anytimeState in
   block/index.html: change both. What got done is an ordinary shared tick
   under the slug of the name, so ticking one here is ticking it in BLOCK. */
function rhAddH(date, n, unit) {
  if (unit === 'day') return Day.shift(date, n);
  if (unit === 'week') return Day.shift(date, 7 * n);
  const [y, m, d] = date.split('-').map(Number);
  const first = new Date(y, m - 1 + n, 1, 12);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12).getDate();
  return first.getFullYear() + '-' + zpad(first.getMonth() + 1) + '-' + zpad(Math.min(d, last));
}
function rhEveryState(r, dates, today) {
  const last = dates.length ? dates[dates.length - 1] : null;
  if (last === today) return { st: 'done', last: last, next: rhAddH(today, r.n || 1, r.unit || 'day') };
  const due = last ? rhAddH(last, r.n || 1, r.unit || 'day') : (r.from || today);
  const late = Day.diff(today, due);
  return { st: late > 0 ? 'owed' : late === 0 ? 'due' : 'later', last: last, due: due, late: late };
}
function rhWeekStartH(today, start) {
  if (start === 'today') return Day.shift(today, -6);
  const dow = new Date(today + 'T12:00:00').getDay();
  return Day.shift(today, -((dow - (start == null ? 1 : start) + 7) % 7));
}
function rhAnyState(r, dates, today, start) {
  const from = rhWeekStartH(today, start);
  const n = dates.filter(d => d >= from && d <= today).length;
  return { n: n, of: r.times || 1, met: n >= (r.times || 1), today: dates.indexOf(today) >= 0 };
}

/* ── small things several widgets share ── */
const monday = d => LifeOS.shift(d, -((Day.dow(d) + 6) % 7));
const peso = n => (n < 0 ? '-' : '') + '\u20b1' + Math.round(Math.abs(n)).toLocaleString();

function tickRow(x, day, tail) {

}
const dueWords = d => {

/* a bar that fills to a share, with the words kept above it (root brief:

const textBlock = s => esc(String(s || '').trim()).replace(/\n/g, '<br>');

const WIDGETS = {
  /* ══════════════ TODAY ══════════════
     The day as one list. BLOCK owns the blocks and STATUS owns the bullets,
     and until now this widget only knew about the first of them - so the
     half of the day written as a todo was invisible from the screen called
     Today. Tom, 2026-09-03: "is there a way to have this all sync in today
     view in main menu."

     Nothing is copied. Both are already rows in the shared store and this
     reads them where they are, so ticking here is the same tick as ticking
     there and nothing can disagree.

     Chronological, on his call. A block knows its start as minutes into the
     day; a bullet knows its own if you typed one. Anything with no time sits
     after everything that has one, and among those the open todos come first,
     because an unscheduled task is still a task and an entry is a note about
     something that already happened. */
  today: {
    nm: 'TODAY', w: 5, h: 5, to: ['block'],          /* spans every app, so it wears the accent: the board's one hero card */
    sub: () => {
      const it = todayItems();
      if (!it.length) return 'nothing scheduled';
      const done = it.filter(x => x.done).length;
      return done + ' / ' + it.length + ' done';
    },
    title: () => { const t = LifeOS.doc().today; return t && t.date === LifeOS.day() ? (t.name || '') : ''; },
    draw(body, cfg) {
      cfg = cfg || {};
      const today = LifeOS.day();
      const t = LifeOS.doc().today;
      const items = todayItems();
      const blocks = items.filter(x => x.kind === 'block');
      const done = items.filter(x => x.done).length;

      /* ── the answer, before the working ──
         The ring says how much of the day is done, which is a summary. A
         summary is what you want at the END of a day. During one you want to
         be told what to do, so that goes first and the ring goes under it. */
      const nn = nowNext(items);
      if (nn) {
        const band = el('div', 'nowband' + (nn.state === 'running' ? ' live' : ''));
        if (nn.state === 'done') {
          band.innerHTML = '<div class="nlab">DONE</div><div class="nname">Everything on today is ticked</div>';
        } else {
          const lab = nn.state === 'running' ? 'NOW'
            : nn.state === 'next' ? 'NEXT' : 'STILL TO DO';
          const when = nn.state === 'running' ? inWords(nn.mins) + ' left'
            : nn.state === 'next' ? 'in ' + inWords(nn.mins)
            : (nn.missed ? nn.missed + ' behind' : '');
          const bhref = linkIn(nn.it);
          band.innerHTML =
            '<div class="nlab">' + lab + (when ? '<i>' + esc(when) + '</i>' : '') + '</div>' +
            '<div class="nname">' + (nn.it.at != null ? '<b>' + MIN2(nn.it.at) + '</b> ' : '') +
            (bhref ? '<a class="rlink" href="' + esc(bhref) + '" target="_blank" rel="noopener noreferrer">' +
              esc(nn.it.name) + '</a>' : esc(nn.it.name)) + '</div>';
          /* The band is the tick target too, so following the day never means
             hunting for the right row in the list under it. */
          if (nn.it.tick) {
            const go = el('button', 'nchk', (typeof Icons !== 'undefined' && Icons.svg('done', { size: 18 })) || '✓');
            go.title = 'tick it off';
            go.setAttribute('aria-label', 'Tick it off');
            go.onclick = nn.it.tick;
            band.appendChild(go);
          }
        }
        body.appendChild(band);
      }

      const rw = el('div', 'ringwrap');
      rw.appendChild(ring(items.length ? done / items.length : 0,
        items.length ? Math.round(done / items.length * 100) + '%' : '—', 'TODAY'));
      const st = el('div', 'stats');
      const mins = blocks.reduce((a, b) => a + (b.dur || 0), 0);
      const left = blocks.filter(b => !b.done).reduce((a, b) => a + (b.dur || 0), 0);
      st.appendChild(el('div', 'stat', '<b>' + DUR(mins || 0) + '</b><span>PLANNED</span>'));
      st.appendChild(el('div', 'stat acc', '<b>' + DUR(left || 0) + '</b><span>LEFT</span>'));
      rw.appendChild(st); body.appendChild(rw);

      if (!items.length) {
        body.appendChild(el('div', 'empty',
          (t && t.date !== today ? 'The last plan BLOCK published was for <b>' + esc(t.date) + '</b>. ' : '') +
          'Open <span class="link" onclick="go(\'block\')">BLOCK</span> for a routine, or write a line in ' +
          '<span class="link" onclick="go(\'status\')">STATUS</span>.'));

      /* ── what you missed, and where it sits ──
         Tom, 2026-09-05: "Sometimes it can be overwhelming to see how much
         wasn't done."

         The honest answer is not to hide it. It is to stop it sitting between
         you and the next thing you could actually do. Tidied, the missed ones

      const list = el('div', 'rowlist');

        r.appendChild(el('div', 't', x.at == null ? '' : MIN2(x.at)));
        /* Two targets, two meanings, the same split as everywhere else: the

        const href = linkIn(x);
        r.appendChild(href
          ? el('div', 'n', '<a class="rlink" href="' + esc(href) +
              '" target="_blank" rel="noopener noreferrer">' + esc(x.name) + '</a>')
          : el('div', 'n', esc(x.name)));
        if (x.tag) r.appendChild(el('div', 'tag', esc(x.tag)));
        if (x.dur) r.appendChild(el('div', 'd', DUR(x.dur)));
        if (x.tick) {
          /* Tom, 2026-09-17: "Today widget has the check at the right, why not
             the left". It is the first thing you do to a row, it is where TODO
             already puts it, and a box at the ragged right edge of a list moves
             with every row's length. */
          const ck = el('button', 'chk' + (x.done ? ' on' : ''), (typeof Icons !== 'undefined' && Icons.svg('done', { size: 14 })) || '✓');

      });
      body.appendChild(list);

      /* One tap, in the place it matters, and only on a day where it means

  beside: {
    nm: 'BESIDE', w: 6, h: 4,
    /* Tom, 2026-09-22: off the ADD A WIDGET list. One already on the board
       keeps drawing; delete `hidden` to offer it again. */
    hidden: 1,
    nmFor: cfg => cfg.nm || 'BESIDE',
    /* Offered in ADD A WIDGET as a ready-made BESIDE. Tom, 2026-09-15: "Put

    presets: [{ nm: 'SLEEP · MOOD · ENERGY', note: 'three strips on one date axis', cfg: { nm: 'SLEEP · MOOD · ENERGY', m: ['sleep', 'mood', 'energy'], days: 30, w: 12, h: 5 } }],
    days: [[30, '30 days'], [90, '90 days'], [365, 'a year']],

      return names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names.slice(-1) : names[0];

        label: m.label, check: on.indexOf(m.id) >= 0,
        fn: () => {
          let next = on.slice();
          if (next.indexOf(m.id) >= 0) next = next.filter(x => x !== m.id);

      picked.forEach((m, i) => {

        strip.style.cssText = 'flex:1 1 0;min-height:112px;display:flex;flex-direction:column;min-width:0';
        const last = pts.length ? pts[pts.length - 1] : null;

        strip.appendChild(head.el);
        const box = el('div', 'fits');
        box.style.cssText = 'flex:1 1 auto;min-height:72px';
        strip.appendChild(box);
        body.appendChild(strip);
        if (pts.length < 2) return;
        const lastStrip = i === picked.length - 1;
        /* the same left margin on every strip, so the days line up */
        Chart.mount(box, { pad: { l: 46, r: 12, t: 8, b: lastStrip ? 22 : 6 }, label: m.label + ', ' + days + ' days' }, c => {
          c.xTime(from, today);

          } else { c.area(pts); c.line(pts); c.end(pts[pts.length - 1]); }
          c.scrub(pts, { onMove: p => head.set(fmt(p[1]), '', when(p[0])), onLeave: head.reset });
        });
      });

  },

  log: {
    nm: 'DAY LOG', w: 4, h: 3, to: ['log'],
    sub: () => Object.keys(LifeOS.dayLog()).length + ' logged',
    draw(body) {
      /* ── the time it happened, not the time it was typed ──
         A tick's own timestamp is when you pressed the button, which for
         anything ticked after the fact is the wrong number. Where the writer
         stated a time — "Train 2:45" in STATUS — that is the one shown, and
         the day sorts by it. Everything else falls back to when it was
         ticked, which is all it knows. */
      const at = k => {
        const r = log[k];
        if (!r.at) return null;
        const [h, m] = String(r.at).split(':').map(Number);
        return isFinite(h) && isFinite(m) ? h * 60 + m : null;
      };
      const mins = k => { const a = at(k); return a != null ? a : new Date(log[k].ts).getHours() * 60 + new Date(log[k].ts).getMinutes(); };
      /* STATUS publishes a per-kind counter as well — note-todo, note-event —
         so a journal widget can say "3 todos" without knowing what they are.
         Those are counts, not events, and listing them beside the individual
         lines they are counting says the same thing twice. The counters stay
         in the store for whoever wants them; this list is for things that
         happened. */
      const log = LifeOS.dayLog();
      const keys = Object.keys(log)
        .filter(k => k.indexOf('note-') !== 0 || k.indexOf('note-at-') === 0)
        .sort((a, b) => mins(a) - mins(b));
      if (!keys.length) { body.appendChild(el('div', 'empty', 'Nothing ticked yet today.')); return; }
      keys.forEach(k => {
        const rec = log[k], a = LifeOS.act(k);
        const line = el('div', 'logline');
        const stated = at(k) != null;
        const tm = el('span', 'tm' + (stated ? ' said' : ''), stated ? MIN2(at(k)) : clock12(rec.ts));
        if (stated) tm.title = 'The time you wrote, not the time it was logged';
        line.appendChild(tm);
        line.appendChild(el('span', null, esc(a ? a.name : k) + (rec.dur ? ' <i class="dur">' + DUR(rec.dur) + '</i>' : '')));
        line.appendChild(el('span', 'src', esc((rec.src || '').toUpperCase())));
        body.appendChild(line);
      });
    },
  },

  trainvol: {
    nm: 'TRAINING VOLUME', w: 4, h: 2, app: 'train', to: ['train'],
    sub: () => 'last 8 weeks',
    draw(body) {

  /* ── which muscles got trained, on a body ──

     Recovery, Tom, 2026-10-01: "Heatmap should also show recovery. Big

      if (!regs.length && !heat.off.length) {

  weight: {
    nm: 'WEIGHT', w: 5, h: 3, app: 'status', to: ['status', 'trends'],
    /* ── the range is a property of THIS widget ──
       Tom, 2026-09-05: "I'd rather have different charts if we're in Main
       Menu and different tabs if we're in STATUS." Right, and it follows from
       what each screen is. The main menu is a board you arrange, so the
       choice is which chart you put on it - two weight widgets at 30 and 365
       days is a comparison you can see at once. STATUS is one screen you
       scroll, so the choice has to be tabs.
       Set it from the widget's own menu: right-click, or hold on a phone. */
    days: [[30, '30 days'], [90, '90 days'], [365, 'a year'], [3650, 'all of it']],
    nmFor: cfg => 'WEIGHT · ' + (WIDGETS.weight.days.filter(d => d[0] === (cfg.days || 90))[0] || [0, ''])[1],
    sub: cfg => {
      const r = weightSeries((cfg && cfg.days) || 90);
      const plan = weightPlan();
      const said = plan ? planSaid(plan) : (Rec.setting('lifeos', 'weightPlan') ? ' · plan needs a starting weight' : '');
      if (!r.length) return said ? said.replace(/^ · /, '') : 'nothing logged yet';
      const last = r[r.length - 1];
      return weightSaid(r, last.v, last.d) + said;
    },
    /* ── the cut ──
       Tom, 2026-09-15: "Yes chart the cut". A plan is a start, a goal and
       two dates, drawn as a dashed line from one to the other under the
       weigh-ins. It is a setting rather than part of the layout, so it is in
       the backup and on every device, and every WEIGHT widget shows the same
       one. The line says what the plan says on a day; nothing here says
       whether a weigh-in is good. */
    menu(cfg, redraw) {
      const has = !!Rec.setting('lifeos', 'weightPlan');
      return ['-', { label: has ? 'Change the plan' : 'Plan a cut', fn: weightPlanSheet },
        has ? { label: 'Clear the plan', fn: () => {
          const was = Rec.setting('lifeos', 'weightPlan');
          Rec.setting('lifeos', 'weightPlan', null); redraw();
          UI.undo('Plan cleared', () => { Rec.setting('lifeos', 'weightPlan', was); redraw(); });
        } } : null];
    },
    draw(body, cfg) {
      cfg = cfg || {};
      const today = LifeOS.day(), plan = weightPlan();
      const back = plan ? Math.max(cfg.days || 90, Day.diff(today, plan.from)) : (cfg.days || 90);
      const pts = weightSeries(back);
      if (pts.length < 2 && !plan) {
        body.appendChild(el('div', 'empty',
          'Log a weight in <span class="link" onclick="go(\'status\')">STATUS</span> twice and the line starts.'));
        return;
      }
      /* Every day you stood on the scale is a dot, and the line through them
         is a seven day average. The dots are the point: a daily weight jumps
         around for reasons that have nothing to do with fat, and hiding that
         behind a smooth line is its own kind of lie. */
      /* ── on shared/chart.js ──
         This used to work out its own scale, draw its own gridlines, and put
         the first and last date at the two ends and call that an x-axis. Tom,
         2026-09-06: "It doesnt even have a proper X axis, don't just fix this
         widget, review the foundation."

         The foundation is chart.js now, and this is what a chart in this suite
         should look like: say what the axes are, hand over the points, and
         stop. The dots are every time you stood on the scale and the line
         through them is the seven-day average - the dots are kept because a
         daily weight jumps around for reasons that are not fat, and hiding
         that behind a smooth line is its own kind of lie. */
      /* \u2500\u2500 the weigh-ins, joined \u2500\u2500
         Tom, 2026-09-14: "I'd rather have a graph that indicates my actual
         data than trends." The line goes through every reading as it was
         taken, and there is no average on the chart. Supersedes the seven-day
         average line described above. */
      /* ── answer first ──
         Tom, 2026-09-14: "Graphs must be useful and feel cool, they must convey
         data quick." The answer is the widget's own line at the top: the latest
         weigh-in and how far it has moved. Drag across the chart and that line
         follows the day under the finger. A second header inside the widget
         left a small one no room for the chart. The line goes through every
         reading as it was taken, with no average. */
      const last = pts.length ? pts[pts.length - 1].v : null, lastD = pts.length ? pts[pts.length - 1].d : today;
      const subOf = () => { const w = body.closest('.w'); return w && w.querySelector('.w-head .sub'); };
      let kept = null;
      const box = el('div', 'fits');
      body.appendChild(box);
      const line = pts.map(p => [p.d, p.v]);
      const from = plan ? (pts.length && pts[0].d < plan.from ? pts[0].d : plan.from) : pts[0].d;
      const to = plan && plan.to > lastD ? plan.to : lastD;
      Chart.mount(box, { label: 'Weight, ' + pts.length + ' weigh-ins' + (plan ? ', and a plan to ' + plan.goal + ' by ' + plan.to : '') }, c => {
        c.xTime(from, to);
        c.yFit(pts.map(p => p.v).concat(plan ? [plan.start, plan.goal] : []));
        c.grid();
        c.timeAxis();
        if (plan) {
          c.line([[plan.from, plan.start], [plan.to, plan.goal]], 'mb-rule');
          const gl = c.add('text', { x: c.X(plan.to) - 4, y: c.Y(plan.goal) + 16, 'text-anchor': 'end' }, 'mb-lab');
          gl.textContent = plan.goal.toFixed(1);
        }
        if (line.length > 1) { c.area(line); c.line(line); } else if (line.length) c.dots(line);
        if (line.length) c.end(line[line.length - 1], last.toFixed(1));
        c.scrub(line, {
          onMove: p => { const s = subOf(); if (!s) return; if (kept == null) kept = s.textContent;
            s.textContent = weightSaid(pts, p[1], p[0]) + (plan && p[0] >= plan.from && p[0] <= plan.to ? ' · plan ' + planAt(plan, p[0]).toFixed(1) : ''); },
          onLeave: () => { const s = subOf(); if (s && kept != null) s.textContent = kept; kept = null; },
        });
      });
    },
  },

      const bars = days.map((x, i) => [i, x.v, Day.label(x.d) + (x.v == null ? ', nothing logged' : ', ' + x.v + ' hrs')]);
      Chart.mount(box, { label: 'Sleep, the last 7 nights' }, c => {
        c.xLinear(-0.5, 6.5);
        c.yFit(got.map(x => x.v).concat(target ? [target] : []), { min: 0 });
        c.grid();
        c.labels(days.map((x, i) => [i, DLET[new Date(x.d + 'T12:00:00').getDay()], i === 6]));
        c.bars(bars, null, null, { highlight: target ? (p => p[1] != null && p[1] >= target) : 'last' });
        if (target) c.rule(target);
        c.scrub(bars.filter(b => b[1] != null), {
          onMove: p => { const s = subOf(); if (!s) return; if (kept == null) kept = s.textContent; s.textContent = Number(p[1]).toFixed(1) + ' hrs, ' + Day.label(days[p[0]].d); },
          onLeave: () => { const s = subOf(); if (s && kept != null) s.textContent = kept; kept = null; },
        });
