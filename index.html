  /* ══════════════ WORK DONE ══════════════
     Tom, 2026-09-22: what got done and what the numbers averaged, over 7
     and 30 days, and 90 and 180 once the records reach back that far. A
     column for a stretch the data does not cover would be an average of
     less than it says. Averages are over the days that HAVE a reading, and
     the row says how many that was, so a week with two weigh-ins is not
     passed off as seven. No verdicts: the numbers and nothing else. */
  workdone: {
    nm: 'WORK DONE', w: 6, h: 5, fit: 1,
    spans() {
      /* the first day anything was recorded, read off the rows themselves */
      let first = null;
      ['ev', 'meal', 'note', 'set'].forEach(t => Rec.all(t).forEach(r => {
        if (r.date && (!first || r.date < first)) first = r.date;
      }));
      const today = LifeOS.day();
      const back = first ? Math.round((new Date(today + 'T12:00:00') - new Date(first + 'T12:00:00')) / 864e5) + 1 : 0;
      return [7, 30, 90, 180].filter(n => n <= 30 || back >= n);
    },
    sub: () => 'the last ' + WIDGETS.workdone.spans().join(', ') + ' days',
    draw(body) {
      const today = LifeOS.day(), spans = WIDGETS.workdone.spans(), far = spans[spans.length - 1];
      const from = LifeOS.shift(today, -(far - 1));
      const inSpan = (d, n) => d && d <= today && d >= LifeOS.shift(today, -(n - 1));
      const days = [];
      for (let i = 0; i < far; i++) days.push(LifeOS.shift(today, -i));

      /* ── counts ── */
      const trained = {}, logged = {}, mealsBy = {}, bullets = [];
      Rec.all('set').forEach(r => { if (r.date >= from) { trained[r.date] = 1; logged[r.date] = 1; } });
      Rec.all('meal').forEach(r => { if (r.date >= from) { (mealsBy[r.date] = mealsBy[r.date] || []).push(r.payload); logged[r.date] = 1; } });
      Rec.all('note').forEach(r => { if (r.date >= from) { bullets.push(r.date); logged[r.date] = 1; } });
      Rec.all('ev').forEach(r => { if (r.date >= from) logged[r.date] = 1; });
      const count = (map, n) => Object.keys(map).filter(d => inSpan(d, n)).length;
      const work = [
        ['Times trained', n => count(trained, n)],
        ['Meals tracked', n => Object.keys(mealsBy).filter(d => inSpan(d, n)).reduce((a, d) => a + mealsBy[d].length, 0)],
        ['Days logged', n => count(logged, n)],
        ['Bullets written', n => bullets.filter(d => inSpan(d, n)).length],
      ];

      /* ── averages ── one number per day, then the mean of the days that have one */
      const perDay = {};
      const fields = Rec.map('field') || {};
      const measure = (id, label, dp) => {
        if (!fields[id]) return;
        const v = {};
        days.forEach(d => { const x = evValue(d, id); if (x != null && isFinite(x)) v[d] = Number(x); });
        perDay[label] = { v: v, dp: dp };
      };
      measure('sleep', 'Sleep, hrs', 1);
      measure('weight', 'Weight', 1);
      measure('mood', 'Mood', 1);
      measure('energy', 'Energy', 1);
      ['kcal', 'p'].forEach(k => {
        const v = {};
        Object.keys(mealsBy).forEach(d => { v[d] = mealsBy[d].reduce((a, m) => a + (Number(m[k]) || 0), 0); });
        perDay[k === 'kcal' ? 'Calories' : 'Protein, g'] = { v: v, dp: 0 };
      });
      measure('steps', 'Steps', 0);

      const t = el('table', 'wd');
      const head = '<tr><th></th>' + spans.map(n => '<th>' + n + 'D</th>').join('') + '</tr>';
      let rows = '<tr class="grp"><td colspan="' + (spans.length + 1) + '">WORK DONE</td></tr>';
      work.forEach(w => { rows += '<tr><td>' + w[0] + '</td>' + spans.map(n => '<td>' + w[1](n).toLocaleString() + '</td>').join('') + '</tr>'; });
      let avg = '';
      Object.keys(perDay).forEach(label => {
        const f = perDay[label];
        const cells = spans.map(n => {
          const got = Object.keys(f.v).filter(d => inSpan(d, n));
          if (!got.length) return '<td class="nil">—</td>';
          const m = got.reduce((a, d) => a + f.v[d], 0) / got.length;
          return '<td title="' + got.length + ' of ' + n + ' days had a reading">' +
            m.toLocaleString(undefined, { maximumFractionDigits: f.dp, minimumFractionDigits: f.dp }) +
            (got.length < n ? '<small>' + got.length + 'd</small>' : '') + '</td>';
        });
        if (cells.every(c => c.indexOf('nil') > -1)) return;
        avg += '<tr><td>' + label + '</td>' + cells.join('') + '</tr>';
      });
      if (avg) rows += '<tr class="grp"><td colspan="' + (spans.length + 1) + '">AVERAGES</td></tr>' + avg;
      t.innerHTML = '<thead>' + head + '</thead><tbody>' + rows + '</tbody>';
      body.appendChild(t);
    },
  },

  /* ══════════════ streaks, off ticks ══════════════
     The old one counted `habit` rows, which only HABITS ever wrote. A streak
     is not a thing to store, it is a sum of ticks, and every app writes those.
     So this counts back from today over the shared log and nothing has to be
     kept in step. */

  streaks: {
    nm: 'STREAKS', w: 3, h: 3,
    sub: () => 'running now',
    draw(body) {
      /* Read the ticks, not the vocabulary. An activity ticked from an app
         that never registered a name still has a streak, and a streak the
         screen cannot see is the same as no streak. */
      const acts = LifeOS.doc().activities, seen = {};
      for (let i = 0; i < 60; i++) {
        const day = LifeOS.doc().log[LifeOS.shift(LifeOS.day(), -i)] || {};
        Object.keys(day).forEach(id => { seen[id] = 1; });
      }
      const runs = Object.keys(seen)
        .map(id => ({ name: (acts[id] && acts[id].name) || id, n: tickStreak(id) }))
        .filter(x => x.n > 0).sort((a, b) => b.n - a.n);
      if (!runs.length) {
        body.appendChild(el('div', 'empty', 'No streak data'));
        return;
      }
      runs.slice(0, 8).forEach(x => {
        const r = el('div', 'hrow');
        r.appendChild(el('div', 'n', esc(x.name)));
        r.appendChild(el('div', 'streak', '▲ ' + x.n));
        body.appendChild(r);
      });
    },
  },

  /* ══════════════ plain ones ══════════════
     No data behind them. A desk has a clock and a pad on it. */

  sticky: {
    nm: 'STICKY NOTE', w: 4, h: 3,

    draw(body) {

  clock: {
    nm: 'CLOCK', w: 3, h: 2, fit: 1,
    sub: () => '',
    draw(body) {
      const big = el('div');
      big.style.cssText = 'font-family:var(--f1);font-size:34px;letter-spacing:.04em;color:var(--txt);line-height:1.1';
      const sub = el('div');

      const tick = () => {

        big.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        sub.textContent = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
      };
      tick();
      const id = setInterval(() => { if (!body.isConnected) return clearInterval(id); tick(); }, 10000);
      body.appendChild(big); body.appendChild(sub);
    },

  timer: {
    nm: 'TIMER', w: 3, h: 2, fit: 1,
    sub: () => '',
    draw(body) {
      let left = 0, id = null;
      const face = el('div');
      face.style.cssText = 'font-family:var(--f1);font-size:30px;letter-spacing:.04em;color:var(--txt);line-height:1.1';
      const show = () => {
        face.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
        face.style.color = left ? 'var(--txt)' : 'var(--dim2)';
      };
      const stop = () => { clearInterval(id); id = null; };
      const run = () => {
        if (id) return;
        id = setInterval(() => {
          if (!body.isConnected) return stop();
          left--;
          if (left <= 0) { left = 0; stop(); if (window.Sfx) try { Sfx.play('complete', { level: 2 }); } catch (e) {} }
          show();
        }, 1000);
      };
      show();
      const bar = el('div');
      bar.style.cssText = 'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap';
      /* Tom, 2026-09-17: "Click Xm = X minutes, but make it need a double tap
         if we want it to override a currently running timer."

         These used to ADD, so 3m pressed on a timer showing 4:12 gave 7:12 and
         there was no way at all to ask for the one thing the button has
         written on it. 3m is three minutes now.

         The double tap is a guard, not a second meaning. Nothing is running,
         so nothing can be lost: one press. Something IS running, so one press
         would throw away a count you are in the middle of: it says what it is
         about to do and waits to be told twice. The second press has to land
         within about three quarters of a second, which is a double click, and
         a lone press is a message rather than a change. */
      const AGAIN_MS = 750;
      [[60, '1m'], [180, '3m'], [300, '5m']].forEach(([n, lbl]) => {
        const b = el('button', 'tag', lbl);
        b.style.cursor = 'pointer';
        b.title = lbl + ' \u00b7 twice to replace a running timer';
        let asked = 0;
        b.onclick = () => {
          const now = Date.now();
          if (id && now - asked > AGAIN_MS) { asked = now; return toast('Again to make it ' + lbl); }
          asked = 0;
          left = n; show(); run();
        };
        bar.appendChild(b);
      });
      /* Tom, 2026-09-17: "Timer widget - let me manually set". Three presets
         are three guesses, and the fourth thing he wants is always the one
         that is not there. The face is the control: press it and type. */
      const setIt = () => {
        UI.dialog({
          title: 'Set the timer', width: 320, focus: true,
          body: b2 => {
            b2.appendChild(el('label', 'fl', 'Minutes, or minutes and seconds'));
            const i = UI.field('text', { value: left ? Math.floor(left / 60) + ':' +
              String(left % 60).padStart(2, '0') : '' });
            i.placeholder = '10   2.5   or   1:30';
            b2.appendChild(i);
          },
          actions: [{ label: 'CANCEL' }, { label: 'START', kind: 'go', fn: h => {
            const box = h.body.querySelector('input.mb-input, input');
            const t = String((box && box.value) || '').trim();
            if (!t) return;
            /* "10" is ten minutes, "1:30" is a minute and a half, "0:45" is
               forty five seconds, and "2.5" is two and a half \u2014 Tom, 2026-09-17,
               "Should be able to set 2.5 Minutes". Half a minute is a thing you
               say out loud and it was the one shape this box refused: it read
               minutes as whole numbers only and turned 2.5 away. Anything else
               is left alone. */
            const m = t.match(/^(\d+):([0-5]?\d)$/);
            let secs = 0;
            if (m) secs = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
            else if (/^\d+(?:\.\d+)?$/.test(t)) secs = Math.round(parseFloat(t) * 60);
            else return toast('Try 10, 2.5, or 1:30', { bad: true });
            if (!secs) return;
            left = secs; show(); run();
          } }],
        });
      };
      face.style.cursor = 'pointer';
      face.title = 'Set the timer';
      face.onclick = setIt;
      const s = el('button', 'tag', 'SET');
      s.style.cursor = 'pointer';
      s.onclick = setIt;
      bar.appendChild(s);

      const z = el('button', 'tag', 'STOP');
      z.style.cursor = 'pointer';
      z.onclick = () => { stop(); left = 0; show(); };
      bar.appendChild(z);
      body.appendChild(face); body.appendChild(bar);
    },
  },

  year: {

      const d = new Date(), s = new Date(d.getFullYear(), 0, 1);
      const day = Math.floor((d - s) / 86400000) + 1;

      const grid = el('div');

      for (let i = 1; i <= all; i++) {
        const b = el('i');
        b.style.cssText = 'display:block;aspect-ratio:1;border-radius:1px;background:' +
          (i < gone ? 'var(--acc)' : i === gone ? 'var(--warn)' : 'var(--panel2)');

  /* One dot a year, and the one you are in lit. Nothing is counted down and
     nothing is predicted: the span is a number you set, not a forecast. */
  life: {
    nm: 'LIFE', w: 4, h: 3,
    sub: () => {
      const b = Rec.setting('lifeos', 'born');
      if (!b) return 'set your birth year';
      const y = Rec.setting('lifeos', 'youth'), o = Rec.setting('lifeos', 'old');
      const bits = [ageNow(b) + ' of ' + (Rec.setting('lifeos', 'span') || 80)];
      if (y) bits.push('youth to ' + y);
      if (o) bits.push('old age from ' + o);
      return bits.join(' \u00b7 ');
    },
    draw(body) {
      const born = Rec.setting('lifeos', 'born');
      const span = Number(Rec.setting('lifeos', 'span') || 80);
      if (!born) {
        const p = el('div', 'empty', 'Set a birth year and this fills in.');
        const inp = document.createElement('input');
        inp.type = 'number'; inp.placeholder = 'e.g. 1994';
        inp.style.cssText = 'width:110px;margin-top:8px;padding:6px 8px;border:1px solid var(--line2);' +
          'border-radius:6px;background:var(--panel2);color:var(--txt);font:inherit';
        inp.onchange = () => {
          const v = parseInt(inp.value, 10);
          if (v > 1900 && v < 2100) { Rec.setting('lifeos', 'born', v); drawHome(); }
        };
        body.appendChild(p); body.appendChild(inp);
        return;
      }
      const age = ageNow(born);
      /* Tom, 2026-09-17: "Life widget - right click menu to denote Youth and
         Old Age", then, the same day: "Set Age, Set Colors and a legend I want
         to denote when I was young and when im gonna be too old for a lot of
         things."

         So the two ages were already here, and the three things missing were
         the ways to change them. The years lived stay solid and the ones ahead
         stay faint, so the band is a hue and the living is the weight: two
         facts on one square without either hiding the other.

         The colours are theme slots, 1 to 6, never hex. Hard constraint 8, and
         it is the reason this can be recoloured at all: a hex here would be a
         life that looks right in exactly one skin. */
      const youth = Number(Rec.setting('lifeos', 'youth') || 0);
      const old = Number(Rec.setting('lifeos', 'old') || 0);
      const slotOf = (k, dflt) => Number(Rec.setting('lifeos', 'life' + k) || dflt);
      const cols = { youth: slotOf('Youth', 2), mid: slotOf('Mid', 4), old: slotOf('Old', 5) };
      const tint = n => 'var(--data-' + n + ')';
      const bandOf = i => (youth && i < youth) ? 'youth' : (old && i >= old) ? 'old' : 'mid';

      const head = el('div');
      head.style.cssText = 'font-family:var(--f1);font-size:28px;color:var(--txt);letter-spacing:.04em;margin-bottom:8px';
      head.innerHTML = age + '<span style="color:var(--dim2);font-size:16px"> / ' + span + '</span>';
      body.appendChild(head);

      /* ── setting it ──
         On the card, not on a year. Changing your birth year by right clicking
         the square for age 31 is not a thing anyone would find. The year's own
         menu stays for the two boundaries, where the year IS the answer. */
      const askNum = (title, now, lo, hi, save) => UI.dialog({
        title: title, width: 280,
        body: b2 => {
          const f = UI.field('number', { value: now || '' });
          b2.appendChild(f);
          const i = f.querySelector ? (f.querySelector('input') || f) : f;
          setTimeout(() => { if (i.focus) i.focus(); if (i.select) i.select(); }, 40);
        },
        actions: [{ label: 'CANCEL' }, { label: 'SET', kind: 'go', fn: h => {
          const i = h.body.querySelector('input');
          const v = parseInt(i && i.value, 10);
          if (v >= lo && v <= hi) { save(v); drawHome(); }
        } }],
      });
      const capital = w => w.charAt(0).toUpperCase() + w.slice(1);
      const colourItems = which => [1, 2, 3, 4, 5, 6].map(n => ({
        label: 'Colour ' + n, check: cols[which] === n,
        fn: () => { Rec.setting('lifeos', 'life' + capital(which), n); drawHome(); },
      }));
      const lifeMenu = (x, y) => UI.menu(x, y, [
        { label: 'Set age', fn: () => askNum('How old are you', age, 0, 120,
            v => Rec.setting('lifeos', 'born', new Date().getFullYear() - v)) },
        { label: 'Set birth year', fn: () => askNum('Born', born, 1900, 2100,
            v => Rec.setting('lifeos', 'born', v)) },
        { label: 'Set how many years', fn: () => askNum('Years on the square', span, 10, 120,
            v => Rec.setting('lifeos', 'span', v)) },
        '-',
        { label: 'Youth ends at', fn: () => askNum('Youth ends at', youth, 0, span,
            v => Rec.setting('lifeos', 'youth', v)) },
        { label: 'Old age starts at', fn: () => askNum('Old age starts at', old, 0, span,
            v => Rec.setting('lifeos', 'old', v)) },
        '-',
        { label: 'Youth colour', sub: colourItems('youth') },
        { label: 'Middle colour', sub: colourItems('mid') },
        { label: 'Old age colour', sub: colourItems('old') },
      ], { title: 'LIFE' });
      body.oncontextmenu = ev => { ev.preventDefault(); ev.stopPropagation(); lifeMenu(ev.clientX, ev.clientY); };
      if (typeof Mobile !== 'undefined' && Mobile.hold) Mobile.hold(body, () => lifeMenu(0, 0));

      const grid = el('div');
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(20,1fr);gap:3px';
      for (let i = 0; i < span; i++) {
        const b = el('i');
        const band = bandOf(i);
        const name = band === 'youth' ? 'youth' : band === 'old' ? 'old age' : '';
        b.title = 'age ' + i + (name ? ' \u00b7 ' + name : '');
        b.style.cssText = 'display:block;aspect-ratio:1;border-radius:2px;cursor:context-menu;' +
          'background:' + (i === age ? 'var(--warn)' : ((youth || old) ? tint(cols[band]) : 'var(--acc)')) +
          ';opacity:' + (i <= age ? '1' : '.22');
        b.oncontextmenu = ev => {
          ev.preventDefault();
          /* The card has a right-click menu of its own and it is the parent,
             so without this the year's menu opened and was replaced by the
             widget's a moment later. */
          ev.stopPropagation();
          UI.menu(ev.clientX, ev.clientY, [
            { label: 'Youth ends at ' + i, fn: () => { Rec.setting('lifeos', 'youth', i); drawHome(); } },
            { label: 'Old age starts at ' + i, fn: () => { Rec.setting('lifeos', 'old', i); drawHome(); } },
            ...((youth || old) ? [{ label: 'Clear both', fn: () => {
              Rec.setting('lifeos', 'youth', 0); Rec.setting('lifeos', 'old', 0); drawHome();
            } }] : []),
          ], { title: 'AGE ' + i });
        };
        grid.appendChild(b);
      }
      body.appendChild(grid);

      /* ── the legend ──
         What he asked the bands FOR: "when I was young and when im gonna be
         too old for a lot of things". Without it the square is three hues and
         no statement. Drawn only once a boundary is set, because three chips
         naming nothing is worse than no chips. */
      if (youth || old) {
        const key = el('div');
        key.style.cssText = 'display:flex;flex-wrap:wrap;gap:var(--s-2,8px);margin-top:var(--s-2,8px)';
        const chip = (which, label, range) => {
          const c = el('div');
          c.style.cssText = 'display:flex;align-items:center;gap:5px;font-family:var(--f1);' +
            'font-size:9px;letter-spacing:.1em;color:var(--dim);white-space:nowrap';
          c.innerHTML = '<i style="width:9px;height:9px;border-radius:2px;flex:0 0 auto;background:' +
            tint(cols[which]) + '"></i>' + esc(label) +
            (range ? '<span style="color:var(--dim2)">' + esc(range) + '</span>' : '');
          key.appendChild(c);
        };
        if (youth) chip('youth', 'YOUNG', 'to ' + youth);
        chip('mid', 'MIDDLE', (youth || 0) + (old ? '\u2013' + old : '+'));
        if (old) chip('old', 'TOO OLD FOR A LOT', 'from ' + old);
        body.appendChild(key);
      }
    },
  },

  links: {
    /* ══════════════ LINKS ══════════════
       Tom, 2026-09-17: "Create a TOM ONLY Widget of all the app links, both

      const done = () => toast('<b>' + esc(label) + '</b> copied');
      const byHand = () => {
        try {
          const t = document.createElement('textarea');
          t.value = url;
          t.setAttribute('readonly', '');

          t.style.top = '-1000px';

           gives way. A heading has the whole card to itself and can wrap. */
        const where = site.base.replace(/^https?:\/\//, '').replace(/\/$/, '');

  },

  apps: {

/** columns = weeks, rows = weekday. Intensity = how many things were logged. */
function heatmap(weeks) {
  const wrap = el('div', 'heat');
  const today = LifeOS.day(), dow = new Date(today + 'T12:00:00').getDay();
  const cursor = LifeOS.shift(today, -(dow + 7 * (weeks - 1)));
  for (let w = 0; w < weeks; w++) {
    const col = el('div', 'wk');
    for (let d = 0; d < 7; d++) {
      const date = LifeOS.shift(cursor, w * 7 + d);
      const n = Object.keys(LifeOS.doc().log[date] || {}).length;
      const cls = date > today ? 'fut' : n >= 8 ? 'l4' : n >= 5 ? 'l3' : n >= 3 ? 'l2' : n >= 1 ? 'l1' : '';
      const b = el('b', cls); b.title = date + ' — ' + n + ' logged';

}

const FINE = matchMedia('(hover:hover) and (pointer:fine)').matches;
let editing = false;
function move(i, d) {

  const ord = byPlace();

/* ══════════════ the body heatmap's figure ══════════════
   Front and back, drawn from flat panels so it sits with Block's cut
   corners rather than an anatomy chart. Each panel is a muscle; the head,
   hands, knees and feet are the figure and never light. Shapes are the
   LEFT half; the right is mirrored, so the figure stays symmetrical. */
const BODY_NAMES = { chest: 'CHEST', delts: 'SHOULDERS', traps: 'TRAPS', lats: 'LATS', lowback: 'LOWER BACK',
  biceps: 'BICEPS', triceps: 'TRICEPS', forearms: 'FOREARMS', core: 'CORE',
  glutes: 'GLUTES', quads: 'QUADS', hams: 'HAMSTRINGS', calves: 'CALVES' };

  [/lower ?back|erector|spinal/, ['lowback']], [/trap/, ['traps']], [/\blats?\b/, ['lats']],
  [/back/, ['lats', 'traps', 'lowback']], [/chest|pec/, ['chest']], [/shoulder|delt/, ['delts']],
  [/bicep/, ['biceps']], [/tricep/, ['triceps']], [/forearm|grip/, ['forearms']],
  [/\barms?\b/, ['biceps', 'triceps', 'forearms']], [/\babs?\b|core|oblique|stomach/, ['core']],
  [/glute|\bhips?\b|butt/, ['glutes']], [/quad/, ['quads']], [/ham/, ['hams']], [/cal(f|ves)/, ['calves']],
  [/leg|lower body/, ['quads', 'hams', 'glutes', 'calves']],

  return null;
};
/* the same test as TRAIN.noteWarm in train/index.html: change both */
const setIsWarm = p => p.warm === 1 || p.warm === true ||
  (p.warm !== 0 && p.warm !== false && !!p.note && /\bwarm[ -]?ups?\b|\bwu\b/i.test(p.note));
function bodyHeat(from, to) {
  const exs = Rec.map('exercise'), cats = Rec.map('excat'), today = LifeOS.day();
  const v = {}, offN = {};
  const put = (cat, share) => {
    const c = cats[cat], name = c ? c.name : '';
    const parts = bodyParts(name);
    if (parts) parts.forEach(k => { v[k] = (v[k] || 0) + share; });
    else if (name && !/cardio/i.test(name)) offN[name] = (offN[name] || 0) + share;

  Rec.all('set').forEach(r => {
    if (!r.date || r.date < from || r.date > to) return;
    const p = r.payload || {};

    const ex = exs[p.ex];
    if (!ex || !ex.cat) return;
    put(ex.cat, 1);
    if (ex.also) Object.keys(ex.also).forEach(c => { if (c !== ex.cat && cats[c]) put(c, +ex.also[c] || 0); });
  });

const BODY_FIG = { head: '43,3 57,3 60,11 57,21 43,21 40,11', neck: '46,21 54,21 55,27 45,27',
  hand: '23,88 30,88 29,96 22,96', knee: '39,131 48,131 47,134 40,134', foot: '41,171 46,171 47,178 39,178' };
const BODY_FRONT = [
  ['traps', '45,26 37,31 45,31'], ['delts', '36,31 28,35 26,47 33,45 37,35'],
  ['chest', '38,32 49,32 49,47 37,48 34,39'], ['biceps', '26,49 33,47 32,64 25,64'],
  ['forearms', '25,66 32,66 30,86 23,86'], ['core', '41,50 49,50 49,82 43,82'],
  ['core', '36,50 40,50 42,82 37,75'], ['quads', '38,92 49,92 48,129 39,129 36,110'],
  ['calves', '39,135 47,135 46,169 41,169'],
];
const BODY_BACK = [
  ['traps', '44,23 50,23 50,46 38,32'], ['delts', '36,31 28,35 26,47 33,45 37,35'],
  ['lats', '38,35 49,48 48,69 39,62 35,45'], ['lowback', '42,70 49,70 49,82 42,82'],
  ['triceps', '26,49 33,47 32,64 25,64'], ['forearms', '25,66 32,66 30,86 23,86'],

/* ══════════════ spots ══════════════
   Each card may carry x (its first column, 1 to 12) and y (its first row).
   A card without one is placed by the grid into the first hole it fits and
   then keeps where it landed, which is how every layout saved before
   2026-09-22 got its spots without anyone arranging it. */
let pinned = null;          /* the card just moved, resized or added: it wins a collision */
const effH = [];            /* rows each card actually takes; a `fit` card's differ from cfg.h */
const hOf = i => effH[i] || layout[i].h;
/** layout indexes in reading order: top to bottom, then left to right */
function byPlace() {
  return layout.map((c, i) => i).sort((a, b) => {
    const A = layout[a], B = layout[b];
    if (!A.x || !B.x) return (A.x ? 0 : 1) - (B.x ? 0 : 1) || a - b;
    return A.y - B.y || A.x - B.x || a - b;
  });
}
/** nothing overlaps: a card that would is pushed down until it does not.
    Nothing is ever pulled UP, which is what lets a gap stay a gap. */
function settle(first) {
  const cols = COLS;
  const ord = byPlace().filter(i => layout[i].x);
  if (first != null && ord.indexOf(first) > -1) { ord.splice(ord.indexOf(first), 1); ord.unshift(first); }
  const done = [];
  ord.forEach(i => {
    const c = layout[i];
    c.w = Math.min(c.w, cols);
    c.x = Math.max(1, Math.min(c.x, cols - c.w + 1));
    c.y = Math.max(1, c.y);
    const hit = o => c.x < o.x + o.w && o.x < c.x + c.w && c.y < o.y + o.h && o.y < c.y + hOf(i);
    let guard = 0;
    while (guard++ < 500) {
      const o = done.find(hit);
      if (!o) break;
      c.y = o.y + o.h;
    }
    done.push({ x: c.x, y: c.y, w: c.w, h: hOf(i) });
  });
}
/** where the grid's cells are, in pixels, right now */
function gridMetrics() {
  const g = $('#grid'), r = g.getBoundingClientRect();
  const cs = getComputedStyle(g);
  const cols = cs.gridTemplateColumns.split(' ').length;
  const gap = parseFloat(cs.columnGap) || 12;
  const R = parseFloat(g.style.getPropertyValue('--row')) || 84;
  return { r: r, cols: cols, gap: gap, colw: (r.width - (cols - 1) * gap) / cols, R: R };
}
function cellAt(m, px, py) {
  return {
    c: Math.max(1, Math.min(m.cols, Math.floor((px - m.r.left + m.gap / 2) / (m.colw + m.gap)) + 1)),
    r: Math.max(1, Math.floor((py - m.r.top + m.gap / 2) / m.R) + 1),
  };
}
/** the empty patch around a cell, or null if a card is on it. A patch with
    cards below it is bounded and has a size; one running off the bottom of
    the board is not, and a widget added there keeps its own size. */
function gapAt(c, r) {
  const rects = layout.map((cfg, i) => cfg.x ? { x: cfg.x, y: cfg.y, w: cfg.w, h: hOf(i) } : null).filter(Boolean);
  const N = rects.reduce((a, o) => Math.max(a, o.y + o.h - 1), 0);
  const free = (x, y) => !rects.some(o => x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.h);
  if (!free(c, r)) return null;
  if (r > N) return { x: c, y: r, w: 0, h: 0 };
  let c0 = c, c1 = c;
  while (c0 > 1 && free(c0 - 1, r)) c0--;
  while (c1 < COLS && free(c1 + 1, r)) c1++;
  const rowFree = y => { for (let x = c0; x <= c1; x++) if (!free(x, y)) return false; return true; };
  let r0 = r, r1 = r;
  while (r0 > 1 && rowFree(r0 - 1)) r0--;
  while (r1 < N && rowFree(r1 + 1)) r1++;
  if (r1 >= N) return { x: c, y: r0, w: 0, h: 0 };
  return { x: c0, y: r0, w: c1 - c0 + 1, h: r1 - r0 + 1 };
}

  if (n.parentNode !== g) g.appendChild(n);
  if (x == null) { n.className = ''; g.classList.remove('gapon'); return; }
  n.className = 'on' + (land ? ' land' : '');
  n.innerHTML = land ? '' : ((typeof Icons !== 'undefined' && Icons.svg('add', { size: 22 })) || '+');
  n.style.left = ((x - 1) * (m.colw + m.gap)) + 'px';
  n.style.top = ((y - 1) * m.R) + 'px';
  n.style.width = (w * m.colw + (w - 1) * m.gap) + 'px';

    if (moving || sizing) return;
    const t = target(ev);

  g.addEventListener('click', ev => {

/* ══════════════ a menu on every card ══════════════

        fn: () => { cfg.days = d[0]; saveLayout(); drawHome(); } })) } : null,
    /* a widget with choices of its own puts them here, the same menu */
    ...(W.menu ? W.menu(cfg, () => { saveLayout(); drawHome(); }) : []),
    '-',
    { label: 'Add another widget', icon: '+', fn: widgetPicker },
    { label: 'Remove', icon: '\u2715', kind: 'bad', fn: () => {
        const gone = layout.splice(i, 1)[0];
        saveLayout(); drawHome(); Mobile.haptic('warn');
        UI.undo('<b>' + esc(W.nm) + '</b> removed',
          () => { layout.splice(i, 0, gone); saveLayout(); drawHome(); });
      } },
  ].filter(Boolean), { title: W.nm });
}

const NARROW = () => matchMedia('(max-width:820px)').matches;
function drawHome() {
  const g = $('#grid'); g.innerHTML = '';
  let firstDone = 0;
  const later = [];
  const rank = [];
  byPlace().forEach((i, k) => { rank[i] = k; });
  document.body.classList.toggle('editing', editing);
  layout.forEach((cfg, i) => {
    const W = WIDGETS[cfg.t]; if (!W) return;
    const n = el('div', 'w mb-card');
    n.style.setProperty('--cw', cfg.w); n.style.setProperty('--ch', cfg.h);
    if (cfg.x) { n.classList.add('at'); n.style.setProperty('--gx', cfg.x); n.style.setProperty('--gy', cfg.y); }
    if (NARROW()) n.style.order = rank[i];
    n.dataset.i = i;
    /* the widget wears the colour of the app it draws for, which is what
       ties a card to an app without a label; a widget with no app wears the
       accent, which is what the material layer does with no --c */
    const tint = W.app ? appTint(app(W.app)) : '';
    if (tint) n.style.setProperty('--c', tint);

    const head = el('div', 'w-head');
    const title = W.title ? W.title() : '';
    /* Two copies of the same widget showing different things have to be
       tellable apart, so a widget that varies by config names itself. */
    const name = W.nmFor ? W.nmFor(cfg) : W.nm;
    const to = W.to && (!W.to[0] || W.to[0] === 'over' || app(W.to[0])) ? W.to : null;
    head.innerHTML = (to ? '<span class="wgo" role="link" tabindex="0">' + esc(name) + '</span>' : esc(name)) +
      (title ? ' <span class="c">' + esc(title) + '</span>' : '') +
      '<span class="sub">' + esc(W.sub ? W.sub(cfg) : '') + '</span>';
    if (to) {
      const lk = head.querySelector('.wgo');
      lk.title = 'Open ' + (to[0] === 'over' ? app(to[1]).nm : app(to[0]).nm);
      /* the name is a link, so pressing on it must not start a drag */
      lk.addEventListener('pointerdown', ev => ev.stopPropagation());
      lk.onclick = ev => { ev.stopPropagation(); goTo(to); };
      lk.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); goTo(to); } };
    }
    /* In REARRANGE mode every card carries its own up, down and remove. That
       is three unmistakable targets instead of one long-press gesture that
       competes with the page scroll for the same finger. */
    if (editing) {
      const up = el('button', 'mv mb-press mb-tap', '↑');
      up.setAttribute('aria-label', 'Move ' + W.nm + ' up');
      up.disabled = i === 0;
      up.style.opacity = i === 0 ? '.3' : '';
      up.onclick = ev => { ev.stopPropagation(); move(i, -1); };
      head.appendChild(up);
      const dn = el('button', 'mv mb-press mb-tap', '↓');
      dn.setAttribute('aria-label', 'Move ' + W.nm + ' down');
      dn.disabled = i === layout.length - 1;
      dn.style.opacity = i === layout.length - 1 ? '.3' : '';
      dn.onclick = ev => { ev.stopPropagation(); move(i, 1); };
      head.appendChild(dn);
    }
    const x = el('button', 'x mb-press mb-tap',
      (typeof Icons !== 'undefined' && Icons.svg('close', { size: 15 })) || '✕');
    x.title = 'remove this widget';
    x.setAttribute('aria-label', 'Remove ' + W.nm);
    x.onclick = ev => {
      ev.stopPropagation();
      const gone = layout.splice(i, 1)[0];
      saveLayout(); drawHome();
      Mobile.haptic('warn');
      UI.undo('<b>' + esc(W.nm) + '</b> removed', () => { layout.splice(i, 0, gone); saveLayout(); drawHome(); });
    };
    head.appendChild(x);
    /* Dragging by the title only exists where there is a pointer that can
       hover. On a touch screen this gesture IS the scroll gesture. */
    if (FINE) head.addEventListener('pointerdown', ev => startMove(ev, i));
    n.appendChild(head);

    const body = el('div', 'w-body');
    const fill = () => {
      try { W.draw(body, cfg); } catch (e) { body.appendChild(el('div', 'empty', 'widget error: ' + esc(e.message))); }
      /* the rows inside are the plates, in their own colour or the widget's.
         Only the card-shaped rows: a ruled list line (.hrow, .logline) is a
         line, and a plate on it would be a border on a border. */
      body.querySelectorAll('.row').forEach(r => r.classList.add('mb-plate'));
    };
    /* On a phone the first TODAY goes to the top and is drawn before
       anything else, so its NOW line is the first thing painted. Tom,
       2026-09-22. The rest are drawn straight after, in the next task. */
    if (NARROW() && cfg.t === 'today' && !firstDone) { n.classList.add('first'); n.style.order = ''; firstDone = 1; fill(); }
    else if (NARROW()) later.push(fill);
    else fill();
    if (W.fit) n.classList.add('fit');
    n.appendChild(body);

    /* Right click with a mouse, hold with a thumb, same menu either way. */
    n.oncontextmenu = ev => { ev.preventDefault(); widgetMenu(+n.dataset.i, ev.clientX, ev.clientY); };
    if (typeof Mobile !== 'undefined' && Mobile.hold) {
      Mobile.hold(head, () => widgetMenu(+n.dataset.i, 0, 0));
    }

    if (FINE) {
      const size = el('div', 'w-size');
      size.title = 'drag to resize';
      size.addEventListener('pointerdown', ev => startResize(ev, i, n));
      n.appendChild(size);
    }

    g.appendChild(n);
  });
  if (!layout.length) {
    g.appendChild(el('div', 'empty', 'No widgets. Hit <b>+ WIDGET</b> to put something back.')).style.gridColumn = 'span 12';
  }
  if (later.length) setTimeout(() => later.forEach(f => f()), 0);
  fitGrid();
}

/* ── the board is a fixed grid, and a bigger window is more of it ──
   Tom, 2026-09-24: "Rather than resize my widgets when I resize my window, I
   just want more space to work with." Until then the board was 12 columns
   stretched across the window, with rows stretched to fill its height, so
   every card grew and shrank with the window.

   Now one cell is a fixed size, `lifeos.cell`, taken ONCE from what the
   board looked like the first time this build opened, so nothing he had
   changes size on the day. After that the window only decides how many
   columns there are: wider adds empty columns to the right, taller adds
   empty rows below, and both are places a widget can be added. A window
   narrower than the cards scrolls sideways rather than moving or squashing
   them, because a saved spot is his arrangement and a window is not a reason
   to rewrite it. Desktop only; a phone still stacks.

   A card flagged `fit` (the small number cards, APPS, LINKS) still takes as
   many rows as its contents need and no more. */
let COLS = 12;
let CELL = null;
try { const c = Rec.setting('lifeos', 'cell'); if (c && c.w > 0 && c.h > 0) CELL = c; } catch (e) {}
function fitGrid() {
  const g = $('#grid'), home = $('#home');
  if (NARROW()) {
    g.style.removeProperty('--row'); g.style.minHeight = ''; g.style.gridTemplateColumns = ''; g.style.width = '';
    COLS = 4; return;
  }
  const gap = parseFloat(getComputedStyle(g).rowGap) || 12;
  const H = home.clientHeight - 28, Wd = home.clientWidth - 28;
  if (!CELL) {
    /* what the stretched board used to give at this window, one time */
    const colw = (Wd - 11 * gap) / 12;
    const N = Math.max(1, layout.reduce((a, c) => Math.max(a, (c.y || 1) + (c.h || 3) - 1), 0));
    let R = Math.min(140, Math.floor((H + gap) / N));
    if (R < 60) R = 84;
    CELL = { w: Math.round(Math.max(100, Math.min(200, colw))), h: Math.round(Math.max(72, Math.min(140, R))) };
    try { Rec.setting('lifeos', 'cell', CELL); } catch (e) {}
  }
  const R = CELL.h;
  const used = layout.reduce((a, c) => Math.max(a, c.x ? c.x + c.w - 1 : c.w), 1);
  COLS = Math.max(used, Math.floor((Wd + gap) / (CELL.w + gap)), 4);
  g.style.gridTemplateColumns = 'repeat(' + COLS + ',' + CELL.w + 'px)';
  g.style.width = (COLS * CELL.w + (COLS - 1) * gap) + 'px';
  g.style.setProperty('--row', R + 'px');
  /* the cards only, never a `.w` drawn inside one: Chart.header's date
     line is also `.w`, and treating it as a card threw here and stopped the
     boot before the dock and the clock were drawn */
  const fits = [].slice.call(g.querySelectorAll(':scope > .w.fit'));
  const nodes = [].slice.call(g.querySelectorAll(':scope > .w'));
  effH.length = 0;
  const before = JSON.stringify(layout.map(c => [c.x, c.y]));
  fits.forEach(n => {
    /* measured squeezed to one row, so a child that stretches to fill
       the card cannot report the card's own height back as its need */
    const head = n.querySelector('.w-head'), body = n.querySelector('.w-body');
    n.style.setProperty('--ch', 1);
    const was = body.style.overflow;
    body.style.overflow = 'auto';
    const need = head.offsetHeight + body.scrollHeight + 2;
    body.style.overflow = was;
    const ch = Math.max(1, Math.ceil((need + gap) / R));
    n.style.setProperty('--ch', ch);
    effH[+n.dataset.i] = ch;
  });
  /* a card with no spot yet keeps the one the grid gave it */
  const m = gridMetrics();
  nodes.forEach(n => {
    const c = layout[+n.dataset.i];
    if (!c || c.x) return;
    const r = n.getBoundingClientRect();
    c.x = Math.round((r.left - m.r.left) / (m.colw + m.gap)) + 1;
    c.y = Math.round((r.top - m.r.top) / m.R) + 1;
  });
  settle(pinned);
  nodes.forEach(n => {
    const c = layout[+n.dataset.i];
    n.classList.add('at');
    n.style.setProperty('--gx', c.x); n.style.setProperty('--gy', c.y); n.style.setProperty('--cw', c.w);
  });
  pinned = null;
  /* the grid reaches the bottom of the window, so the space under the
     last card is somewhere a widget can be added too */
  g.style.minHeight = H + 'px';
  if (JSON.stringify(layout.map(c => [c.x, c.y])) !== before) saveLayout();
}
let fitT = 0;
addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => { if (view === 'home') drawHome(); }, 150); });

/* --- drag to a spot: the card lands on the cells under it, and anything
   in the way moves down. Before 2026-09-22 it swapped with the card under
   the pointer, which could not leave a gap. --- */
let moving = null;
function startMove(ev, i) {
  if (ev.target.closest('.x')) return;
  ev.preventDefault();
  const node = ev.currentTarget.parentElement, r = node.getBoundingClientRect();
  moving = { i: i, node: node, dx: ev.clientX - r.left, dy: ev.clientY - r.top };
  node.classList.add('drag');
  const gh = $('#ghost');
  gh.style.cssText = 'display:block;width:' + r.width + 'px;height:' + Math.min(r.height, 160) + 'px;left:' + r.left + 'px;top:' + r.top + 'px';
  gh.innerHTML = '<div style="padding:11px 13px;font-family:var(--f1);font-size:11px;letter-spacing:.2em;color:var(--acc)">' + esc(WIDGETS[layout[i].t].nm) + '</div>';
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', endMove, { once: true });
}
function onMove(ev) {
  if (!moving) return;
  const gh = $('#ghost');
  gh.style.left = (ev.clientX - moving.dx) + 'px';
  gh.style.top = (ev.clientY - moving.dy) + 'px';
  const m = gridMetrics(), c = layout[moving.i];
  const at = cellAt(m, ev.clientX - moving.dx + m.colw / 2, ev.clientY - moving.dy + m.R / 2);
  moving.to = { x: Math.max(1, Math.min(at.c, m.cols - c.w + 1)), y: at.r };
  hint(m, moving.to.x, moving.to.y, c.w, hOf(moving.i), true);
}
function endMove(ev) {
  if (!moving) return;
  window.removeEventListener('pointermove', onMove);
  $('#ghost').style.display = 'none';
  moving.node.classList.remove('drag');
  hint();
  if (moving.to) {
    const c = layout[moving.i];
    c.x = moving.to.x; c.y = moving.to.y;
    pinned = moving.i;
    saveLayout();
  }
  moving = null;
  drawHome();
}

/* --- drag the corner to resize, snapped to grid columns and 84px rows --- */
let sizing = null;
function startResize(ev, i, node) {
  ev.preventDefault(); ev.stopPropagation();
  const m = gridMetrics();
  sizing = { i: i, node: node, cols: m.cols, colw: m.colw, gap: m.gap, x: ev.clientX, y: ev.clientY, w: layout[i].w, h: layout[i].h };
  window.addEventListener('pointermove', onResize);
  window.addEventListener('pointerup', endResize, { once: true });
}
function onResize(ev) {
  if (!sizing) return;
  const dw = Math.round((ev.clientX - sizing.x) / (sizing.colw + sizing.gap));
  const dh = Math.round((ev.clientY - sizing.y) / (parseFloat($('#grid').style.getPropertyValue('--row')) || 84));
  const w = Math.max(2, Math.min(sizing.cols, sizing.w + dw));
  const h = Math.max(2, Math.min(12, sizing.h + dh));
  layout[sizing.i].w = w; layout[sizing.i].h = h;
  sizing.node.style.setProperty('--cw', w); sizing.node.style.setProperty('--ch', h);
}
function endResize() {
  if (!sizing) return;
  window.removeEventListener('pointermove', onResize);
  pinned = sizing.i;
  saveLayout(); sizing = null; drawHome();
}

/* --- add a widget --- */
function widgetPicker(spot) {
  spot = spot && spot.x ? spot : null;
  /* a widget added from an empty patch lands on it, at the patch's size if
     the patch has one; from the button it takes the first hole it fits */
  const put = cfg => {
    if (spot) {
      cfg.x = spot.x; cfg.y = spot.y;
      if (spot.w) { cfg.w = Math.max(2, spot.w); cfg.h = Math.max(1, spot.h); }
      else cfg.x = Math.min(spot.x, COLS + 1 - cfg.w);
    }
    layout.push(cfg);
    pinned = layout.length - 1;
  };
  const mo = $('#modal'); mo.innerHTML = '';
  mo.appendChild(el('h3', null, 'ADD A WIDGET'));
  mo.appendChild(el('div', 'lede', FINE
    ? 'Drag a widget by its title to move it, and a gap stays a gap. Drag the bottom-right corner to resize. Click an empty space to add a widget there.'
    : 'The layout is saved on this device only — it is not part of your data.'));
  Object.keys(WIDGETS).forEach(k => {
    const W = WIDGETS[k], n = layout.filter(c => c.t === k).length;
    if (W.hidden || !widgetHere(W)) return;
    const b = el('button', 'opt');
    b.innerHTML = '<span class="ic">▤</span><span class="t"><b>' + esc(W.nm) + '</b><span>' +
      (n ? 'already on the home screen — add another' : 'not on the home screen') + '</span></span>';
    b.onclick = () => { put({ t: k, w: W.w, h: W.h }); saveLayout(); closeModal(); drawHome(); toast('<b>' + esc(W.nm) + '</b> added'); };
    mo.appendChild(b);
    /* a widget may offer ready-made versions of itself */
    (W.presets || []).forEach(ps => {
      const pb = el('button', 'opt');
      pb.innerHTML = '<span class="ic">▤</span><span class="t"><b>' + esc(ps.nm) + '</b><span>' + esc(ps.note || '') + '</span></span>';
      pb.onclick = () => { put(Object.assign({ t: k, w: W.w, h: W.h }, ps.cfg)); saveLayout(); closeModal(); drawHome(); toast('<b>' + esc(ps.nm) + '</b> added'); };
      mo.appendChild(pb);
    });
  });
  mo.appendChild(el('div', 'mgroup', 'LAYOUT'));
  if (!FINE) {
    const eb = el('button', 'opt');
    eb.innerHTML = '<span class="ic">' + (editing ? '✓' : '⇅') + '</span><span class="t"><b>' +
      (editing ? 'Done rearranging' : 'Rearrange the widgets') +
      '</b><span>' + (editing ? 'Puts the arrows away' : 'Puts an up, a down and a remove on every card') + '</span></span>';
    eb.onclick = () => { editing = !editing; closeModal(); drawHome(); };
    mo.appendChild(eb);
  }
  const rb = el('button', 'opt');
  rb.innerHTML = '<span class="ic">↺</span><span class="t"><b>Reset to the default layout</b><span>Puts every widget back where it started</span></span>';
  rb.onclick = () => {
    const was = layout.slice();
    layout = DEFAULT_LAYOUT.slice(); saveLayout(); closeModal(); drawHome();
    UI.undo('layout reset', () => { layout = was; saveLayout(); drawHome(); });
  };
  mo.appendChild(rb);
  openModal();
}

/* ══════════════ backup and export ══════════════
   Everything is local, so a backup is the only safety net there is. Two kinds:
   a restorable snapshot (JSON, everything) and readable exports (CSV/text, for
   spreadsheets and clients).                                                  */
const BKEY = 'lifeos_lastbackup';
function download(name, text, mime) {
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain;charset=utf-8' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const csvCell = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const csv = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');

function backupAll() {
  const bag = { kind: 'lifeos-backup', v: 1, at: new Date().toISOString(), shared: LifeOS.doc(), local: {} };
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); bag.local[k] = localStorage.getItem(k); }
  download('lifeos-backup-' + LifeOS.day() + '.json', JSON.stringify(bag), 'application/json');
  try { localStorage.setItem(BKEY, LifeOS.day()); } catch (e) {}
  toast('backup saved — <b>shared data + every app</b>');
  refreshDataBtn();
}
function restore(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let bag; try { bag = JSON.parse(fr.result); } catch (e) { return toast('that file is not JSON'); }
    if (bag.kind !== 'lifeos-backup') return toast('not a backup from this suite');
    if (!confirm('Replace ALL data on this device with the backup from ' + (bag.at || '?') + '?\n\nThis cannot be undone.')) return;
    Object.keys(bag.local || {}).forEach(k => { try { localStorage.setItem(k, bag.local[k]); } catch (e) {} });
    LifeOS._adopt(bag.shared || {});
    toast('restored — reloading…');
    setTimeout(() => location.reload(), 900);
  };
  fr.readAsText(file);
}
function exportLogCSV() {
  const doc = LifeOS.doc(), rows = [['date', 'activity', 'activity_id', 'category', 'logged_at', 'source']];
  Object.keys(doc.log).sort().forEach(date => {
    const day = doc.log[date];
    Object.keys(day).forEach(id => {
      const a = doc.activities[id] || {};
      rows.push([date, a.name || id, id, a.cat || '', new Date(day[id].ts).toISOString(), day[id].src || '']);
    });
  });
  if (rows.length === 1) return toast('nothing logged yet');
  download('lifeos-log-' + LifeOS.day() + '.csv', csv(rows), 'text/csv;charset=utf-8');
  toast('<b>' + (rows.length - 1) + '</b> ticks exported');
}
function exportHabitsCSV() {
  const hs = Object.values(LifeOS.doc().habits);
  if (!hs.length) return toast('no habits yet');
  const rows = [['habit', 'cadence', 'current_streak', 'last_30_days', 'created', 'archived']];
  hs.forEach(h => rows.push([h.name, cadenceText(h.cadence), LifeOS.streak(h.actId, h.cadence), LifeOS.count(h.actId, 30), h.created || '', h.archived ? 'yes' : 'no']));
  download('lifeos-habits-' + LifeOS.day() + '.csv', csv(rows), 'text/csv;charset=utf-8');
  toast('habits exported');
}
function exportActivitiesCSV() {
  const as = Object.values(LifeOS.doc().activities);
  if (!as.length) return toast('no activities yet');
  const rows = [['name', 'id', 'category', 'minutes', 'energy']];
  as.forEach(a => rows.push([a.name, a.id, a.cat || '', a.dur || '', a.energy || '']));
  download('lifeos-activities-' + LifeOS.day() + '.csv', csv(rows), 'text/csv;charset=utf-8');
  toast('activities exported');
}
function todayText() {
  const doc = LifeOS.doc(), t = doc.today, today = LifeOS.day();
  const lines = [today + (t && t.date === today && t.name ? '  ·  ' + t.name : ''), ''];
  if (t && t.date === today && t.blocks.length) {
    t.blocks.forEach(b => lines.push((LifeOS.isDone(b.actId, today) ? '[x] ' : '[ ] ') + (b.s == null ? '' : MIN2(b.s) + '  ') + b.name + '  (' + DUR(b.dur || 0) + ')'));
  } else lines.push('(no routine published for today)');
  const extra = Object.keys(LifeOS.dayLog()).filter(id => !(t && t.date === today && t.blocks.some(b => b.actId === id)));
  if (extra.length) {
    lines.push('', 'Also logged:');
    extra.forEach(id => lines.push('[x] ' + ((doc.activities[id] || {}).name || id)));
  }
  return lines.join('\n');
}
function copyToday() {
  const text = todayText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('today copied to the clipboard'), () => download('today-' + LifeOS.day() + '.txt', text));
  } else download('today-' + LifeOS.day() + '.txt', text);
}
function wipeAll() {
  if (!confirm('Delete ALL data on this device — ticks, habits, every app’s own storage?\n\nBack up first. This cannot be undone.')) return;
  if (!confirm('Really delete everything? Last chance.')) return;
  try { localStorage.clear(); } catch (e) {}
  try { indexedDB.deleteDatabase('lifeos'); } catch (e) {}
  setTimeout(() => location.reload(), 400);
}

const daysSinceBackup = () => {
  const d = localStorage.getItem(BKEY); if (!d) return null;
  return Math.round((new Date(LifeOS.day() + 'T12:00:00') - new Date(d + 'T12:00:00')) / 86400000);
};
function refreshDataBtn() {
  const n = daysSinceBackup(), b = $('#btnData');
  const stale = n === null || n >= 14;
  b.classList.toggle('warn', stale);
  /* Write into the two labels rather than over them: the long one is for a
     laptop, the short one is what fits in a phone's header. */
  b.querySelector('.lg').textContent = stale ? 'DATA ⚠' : 'DATA';
  b.querySelector('.sm').textContent = stale ? '⚠' : '⛁';
  /* The sentence is gone on Tom's call. The amber warning on the button is
     the same fact without saying it twice, so law 3 is still covered. */
  b.title = n === null ? 'No backup yet'
    : 'Last backup ' + (n === 0 ? 'today' : n + ' day' + (n === 1 ? '' : 's') + ' ago');
}

/* ══════════════ the sheet mirror ══════════════
   One Google Sheet for the whole suite, one link, pasted once. shared/io.js
   carries the protocol and STATUS already has a panel for it. The home screen
   is here because it is the only place that can reasonably offer "all of them".

   It does not do the syncing itself. Which tabs an app has, and how one of its
   rows flattens into a line somebody can type into, live in that app's own
   registration — the shell has never run it and cannot guess. So the shell
   loads the app, asks it to sync itself, and counts the answers.

   Editing in the sheet is the point of the thing. Forty foods on a laptop
   keyboard beats forty on a phone, and the pull runs before the push, so what
   was typed there is read before anything is written back over it. */
function syncEveryApp() {
  const M = IO.mirror;
  if (!M.ready()) return toast(esc(M.why()), { bad: true, ms: 8000 });

  /* ARC and FORM keep their own storage by design and are not asked at all.
     Of the rest, only the ones actually on the shared drawer can answer, so
     ask first and sync whoever puts a hand up. Nothing here needs editing on
     the day BLOCK moves over — it will simply start answering. */
  const candidates = APPS.filter(a => a.file && !a.solo && !missing[a.id]);
  if (!candidates.length) return toast('Nothing to sync', { bad: true });
  toast('Syncing…');
  /* How long to wait for hands to go up. An app already open answers in
     milliseconds; one being loaded to be asked has to fetch and run its whole
     file first, and on his phone that is not instant. Being too quick here
     does not fail loudly — it quietly leaves an app out of the sheet — so the
     window is generous whenever anything had to be loaded. */
  const cold = candidates.some(a => !frames[a.id] || !frames[a.id].dataset.loaded);
  reach(candidates, { mb: 2, ping: 1 }, m => m.pong, cold ? 9000 : 3000, on => {
    if (!on.length) {
      return toast('None of the apps are on the shared drawer yet, so there is nothing to put in the sheet.',
        { bad: true, ms: 9000 });
    }
    pushToSheet(on, candidates.length);
  });
}

/* Ask a set of apps something, and call back with the ones that answered.
   Making the frame is part of asking: an app he has not opened today is not
   loaded, and an app that is not loaded cannot say anything. */
function reach(list, msg, keep, ms, then) {
  const said = {};
  let done = false;
  const heard = e => {
    const m = e.data;
    if (!m || m.mb !== 2 || !keep(m)) return;
    const a = list.find(x => frames[x.id] && frames[x.id].contentWindow === e.source);
    if (a) said[a.id] = m;
    if (Object.keys(said).length === list.length) finish();
  };
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    window.removeEventListener('message', heard);
    then(list.filter(a => said[a.id]).map(a => Object.assign({}, a, { said: said[a.id] })));
  };
  const timer = setTimeout(finish, ms);
  window.addEventListener('message', heard);
  list.forEach(a => {
    const f = frameFor(a.id);
    const ask = () => { try { f.contentWindow.postMessage(msg, '*'); } catch (e) {} };
    /* a frame made a moment ago has not run its scripts yet, and an app that
       has not registered cannot answer for itself */
    if (f.dataset.loaded) ask();
    else f.addEventListener('load', () => setTimeout(ask, 400), { once: true });
  });
}

/* the round trip itself, once we know who can do it */
function pushToSheet(on, asked) {
  toast('Syncing <b>' + on.length + '</b> apps…');
  reach(on, { mb: 2, sync: 1, full: 1 }, m => m.synced, 40000, res => {
    const ok = res.filter(a => a.said.ok);
    if (ok.length === on.length) {
      const extra = asked - on.length;
      toast('Synced <b>' + ok.length + '</b> apps into the sheet.' +
        (extra ? ' <b>' + extra + '</b> are not on the shared drawer yet and have nothing to send.' : ''));
      if (typeof Sfx !== 'undefined' && Sfx.play) Sfx.play('complete', { level: 2 });
      return;
    }
    /* Say the likely fix rather than the symptom. io.js works out which one
       the link itself points at, and they all share the one link, so the
       first app with an opinion is enough. */
    const why = (res.map(a => a.said).find(m => m && m.why) || {}).why;
    toast('Synced <b>' + ok.length + ' of ' + on.length + '</b>. ' +
      esc(why || 'The rest did not answer.'), { bad: true, ms: 9000 });
  });
}


/* The script that has to go in the sheet once. Generated by io.js so it cannot
   drift from the protocol it talks to, and copied in one tap: selecting twelve
   lines by hand on a phone is how two characters go missing and the error
   names a line rather than the cause. */
function copyMirrorScript() {
  const code = IO.mirror.script();
  const show = copied => UI.dialog({
    title: 'APPS SYNC SCRIPT', width: 560,
    body: b => {
      /* "Apps Script" inside the steps is Google's own menu, spelled their way
         so it can be found on screen. Ours is the Apps Sync Script, and the
         link it hands back is the personal sync code. Tom named both,
         2026-09-17.

         The steps were one run-on sentence of eight instructions. Somebody
         following it on a second screen loses their place at "then", so it is
         a numbered list they can count down. A setup that happens once is a
         setup, not the tour DOCTRINE law 10 forbids. */
      b.appendChild(el('div', 'lede', copied
        ? 'Copied. Now, in your sheet:' : 'Copy this, then in your sheet:'));
      const steps = el('ol', 'lede');
      steps.style.paddingLeft = 'var(--s-4)';
      ['<b>Extensions</b>, then <b>Apps Script</b>',
       'Select everything in the editor, delete it, paste, save',
       '<b>Deploy</b>, then <b>New deployment</b>',
       'The gear beside Select type, then <b>Web app</b>',
       'Execute as <b>me</b>, access <b>anyone</b>, then <b>Deploy</b>',
       'Allow it when Google asks',
       'Copy the link it gives you. That is your <b>personal sync code</b>',
       'Paste it into the box on the DATA panel',
      ].forEach(s => { const li = el('li'); li.innerHTML = s; steps.appendChild(li); });
      b.appendChild(steps);
      const t = el('textarea', 'mb-input');
      t.rows = 12; t.value = code; t.setAttribute('readonly', '');
      t.style.fontFamily = 'var(--font-mono, monospace)';
      b.appendChild(t);
      if (!copied) setTimeout(() => t.select(), 50);
    },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(code).then(() => show(true)).catch(() => show(false));
  else show(false);
}

/* the sheet's half of the DATA panel */
function mirrorSection(mo) {
  const cfg = IO.mirror.adopt('lifeos');
  mo.appendChild(el('div', 'mgroup', 'SYNC'));
  mo.appendChild(el('div', 'lede',
    'One sheet you own, holding a copy of every app, and what you type in it comes back. ' +
    'This is where mass edits belong: a real keyboard and forty rows at a time. ' +
    (cfg.at ? 'Last synced <b>' + esc(cfg.at) + '</b>.'
            : '<b style="color:var(--warn)">Never synced.</b> Paste your personal sync code below, then press sync.')));

  const u = el('input', 'mb-input');
  u.type = 'text';
  u.placeholder = 'https://script.google.com/macros/s/…/exec';
  u.value = cfg.url || '';
  /* on input, not change. change only fires when the box loses focus, and
     pasting a link then tapping sync closes the panel before that happens —
     so the link was silently never saved. */
  /* What gets pasted here is usually not a bare link: it comes out of Telegram
     with the rest of a message around it, or off Google with a newline on the
     end. IO.mirror.code takes the code out of whatever arrived, and the box
     shows what was actually saved rather than what was dropped on it. */
  u.oninput = () => {
    const found = IO.mirror.code(u.value);
    if (found && found !== u.value.trim()) u.value = found;
    IO.mirror.set({ url: found || u.value.trim() });
  };
  mo.appendChild(u);

  /* The switch that makes it stop being a button. With this on, every app on
     the shared drawer syncs itself: when it opens, half a minute after the
     last thing you log, and the moment you put the phone down. */
  mo.appendChild(UI.row('Keep the sheet up to date by itself',
    cfg.on ? 'On. Syncs on open, after you log something, and when you leave.'
           : 'Off. The sheet only changes when you press the button below.',
    UI.toggle(!!cfg.on, on => { IO.mirror.set({ on: on ? 1 : 0 }); toast(on ? 'The sheet will keep itself up to date.' : 'Automatic syncing off.'); })));

  [['⟳', 'Sync every app now', 'Reads the sheet first, then writes back everything, including the calendar views. The automatic ones only send what changed.', () => { IO.mirror.set({ url: u.value.trim() }); syncEveryApp(); }],
   ['⧉', 'Copy the Apps Sync Script', 'The bit that goes in the sheet once, before any of this works.', copyMirrorScript],
  ].forEach(([ic, t, d, fn]) => {
    const b = el('button', 'opt');
    b.innerHTML = '<span class="ic">' + ic + '</span><span class="t"><b>' + t + '</b><span>' + d + '</span></span>';
    b.onclick = fn; mo.appendChild(b);
  });
  /* LIVE SYNC, the Firebase paste box and sign-in. Every other app gets it
     through IO.syncRow; this panel draws its own sheet setup, so it never
     did until 2026-09-23. */
  if (IO.cloudRow) IO.cloudRow(mo, true);
}

/* ══════════════ bringing in an old spreadsheet ══════════════
   shared/import.js reads it; this asks which parts to bring in. Nothing is
   written until BRING IN, and the undo takes back exactly what came in. */
function importSheet(file) {
  if (typeof Import === 'undefined') return toast('<b>import.js</b> is missing', { bad: true });
  toast('Reading <b>' + esc(file.name) + '</b>');
  Import.read(file).then(sheets => {
    const p = Import.plan(sheets);
    const unit = ((Rec.map('field').weight || {}).unit) || '';
    const kinds = [
      ['weights', 'Weigh-ins', unit ? 'Read as ' + unit : ''],
      ['ticks', 'Daily ticks', ''],
      ['foods', 'Foods', ''],
      ['spends', 'Spending', 'Money out only'],
    ];
    const pick = {};
    UI.dialog({
      title: 'BRING IN A SPREADSHEET', width: 520,
      body: b => {
        b.appendChild(el('p', null, esc(file.name)));
        kinds.forEach(([k, label, extra]) => {
          const n = p[k].length, kept = p.kept[k];
          pick[k] = n > 0;
          const note = (n ? n.toLocaleString() + ' new' + (p.span[k] ? ', ' + p.span[k] : '') : (kept ? 'All already here' : 'None found')) +
            (n && kept ? '. ' + kept.toLocaleString() + ' already here, left alone' : '') + (extra && n ? '. ' + extra : '');
          const t = UI.toggle(pick[k], on => { pick[k] = on; });
          if (!n) t.disabled = true;
          b.appendChild(UI.row(label, esc(note), t));
        });
        if (p.odd) b.appendChild(el('p', null, esc(p.odd.toLocaleString() + ' dated years away from the rest of their sheet, left out.')));
        if (p.skipped.length) b.appendChild(el('p', null, 'Not read: ' + esc(p.skipped.join(', '))));
      },
      actions: [
        { label: 'CANCEL' },
        { label: 'BRING IN', kind: 'go', fn: () => {
          const done = Import.apply(p, pick);
          if (!done.total) { toast('Nothing brought in'); return; }
          drawHome();
          UI.undo('<b>' + done.total.toLocaleString() + '</b> rows brought in', () => { done.undo(); drawHome(); });
        } },
      ],
    });
  }, e => toast(esc((e && e.message) || 'Could not read that file'), { bad: true }));
}

function dataPanel() {
  const mo = $('#modal'); mo.innerHTML = '';
  const n = daysSinceBackup();
  mo.appendChild(el('h3', null, 'DATA'));
  mo.appendChild(el('div', 'lede',
    'Data is stored locally. ' +
    (n === null ? '' :
     n === 0 ? 'Last backup: <b>today</b>.' : 'Last backup: <b>' + n + ' day' + (n === 1 ? '' : 's') + ' ago</b>.')));

  /* Export, import, sync, in that order, like every app's DATA tab. Tom,
     2026-09-15: "simply the data screen. Export, import, Sync". */
  mo.appendChild(el('div', 'mgroup', 'EXPORT'));
  const opts = [
    ['⭳', 'Back up everything', 'One JSON file: your ticks, habits, routines and every app’s own storage. This is the one that can be restored.', backupAll],
  ];
  opts.forEach(([ic, t, d, fn]) => {
    const b = el('button', 'opt');
    b.innerHTML = '<span class="ic">' + ic + '</span><span class="t"><b>' + t + '</b><span>' + d + '</span></span>';
    b.onclick = fn; mo.appendChild(b);
  });

  [
    ['▤', 'Tick log as CSV', 'Every tick ever: date, activity, when and which app. Opens in a spreadsheet.', exportLogCSV],
    ['◎', 'Habits as CSV', 'Each habit with its cadence, current streak and 30-day count.', exportHabitsCSV],
    ['◇', 'Activities as CSV', 'The shared vocabulary — everything the apps know how to do.', exportActivitiesCSV],
    ['⧉', 'Copy today as text', 'Today’s routine with its ticks, for pasting into a message or a note.', copyToday],
  ].forEach(([ic, t, d, fn]) => {
    const b = el('button', 'opt');
    b.innerHTML = '<span class="ic">' + ic + '</span><span class="t"><b>' + t + '</b><span>' + d + '</span></span>';
    b.onclick = fn; mo.appendChild(b);
  });

  mo.appendChild(el('div', 'mgroup', 'IMPORT'));
  const rs = el('button', 'opt');
  rs.innerHTML = '<span class="ic">⭱</span><span class="t"><b>Restore from a backup</b><span>Replaces everything on this device with the contents of a backup file.</span></span>';
  rs.onclick = () => $('#fileIn').click();
  mo.appendChild(rs);
  const im = el('button', 'opt');
  im.innerHTML = '<span class="ic">▦</span><span class="t"><b>Bring in an old spreadsheet</b><span>Weigh-ins, daily ticks, foods and spending from a workbook.</span></span>';
  im.onclick = () => $('#xlsxIn').click();
  mo.appendChild(im);

  mirrorSection(mo);

  mo.appendChild(el('div', 'mgroup', 'DANGER'));
  const w = el('button', 'opt danger');
  w.innerHTML = '<span class="ic">⌫</span><span class="t"><b>Delete everything on this device</b><span>Every app’s data, gone. Back up first.</span></span>';
  w.onclick = wipeAll; mo.appendChild(w);
  /* which version of the home screen this is; every app says the same in its settings */
  const ver = UI.version();
  if (ver) mo.appendChild(el('div', 'lede', 'MAIN MENU ' + ver.v + (ver.dateText ? ', updated ' + ver.dateText : '')));
  openModal();
}

/* The two panels in this file build their contents into #modal and then call
   openModal(). That still works — openModal hands the contents to UI.dialog,
   which is a bottom sheet on a phone and a centred card on a laptop. The
   panels themselves did not have to change. */
let modalH = null;
function openModal() {
  const src = $('#modal');
  const h3 = src.querySelector('h3');
  const title = h3 ? h3.textContent : '';
  if (h3) h3.remove();
  /* the panels' own class names, mapped onto the shared ones */
  src.querySelectorAll('.opt').forEach(o => o.classList.add('mb-opt', 'mb-press', 'flat'));
  src.querySelectorAll('.opt.danger').forEach(o => o.classList.add('bad'));
  src.querySelectorAll('.mgroup').forEach(o => o.classList.add('mb-group'));
  src.querySelectorAll('.lede').forEach(o => { o.className = 'lede'; o.style.cssText = 'color:var(--dim2);line-height:1.6;margin-bottom:var(--s-4,16px)'; });
  modalH = UI.dialog({
    title: title, width: 520,
    body: b => { while (src.firstChild) b.appendChild(src.firstChild); },
    onClose: () => { modalH = null; },
  });
}
function closeModal() { if (modalH) modalH.close(); }

/* ══════════════ boot ══════════════ */
function clock() {
  const d = new Date();
  $('#cDate').textContent = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
  $('#cSub').textContent = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
$('#btnData').onclick = dataPanel;
$('#btnWidget').onclick = widgetPicker;
$('#fileIn').onchange = e => { if (e.target.files[0]) restore(e.target.files[0]); e.target.value = ''; };
$('#xlsxIn').onchange = e => { if (e.target.files[0]) importSheet(e.target.files[0]); e.target.value = ''; };
window.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,[contenteditable]')) return;
  /* ui.js closes its own sheet on Escape, so by the time this runs there is
     nothing open and Escape means "back to home". */
  if (e.key === 'Escape') { if (modalH) return; return go('home'); }
  const n = parseInt(e.key, 10);
  /* the number on the button, which is its position — so the key and the badge
     never disagree after the dock has been rearranged */
  const dock = dockApps();
  if (n >= 1 && n <= dock.length && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); go(dock[n - 1].id); }
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1) || 'home'; if (id !== view && app(id)) go(id); });

/* The home screen is an app like any other as far as the foundation is
   concerned: its own theme, its own sound, the shared day. */
/* Anything in the markup carrying data-icon gets its drawing here, and again
   after a theme lands, because the stroke recipe belongs to the theme: a pixel
   theme wants a squared cap and a hand-drawn one wants a wobble, and those are
   different paths rather than a different colour. */
Skins.load('shared/skins.json').then(() => { Skins.restore('home');
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init('home');

/* any change from any app repaints home — the frames repaint themselves */
LifeOS.on(() => { if (view === 'home' && !moving && !sizing) drawHome(); });
LifeOS.ready(() => {
  LifeOS.prune(800);
  go(location.hash.slice(1) || 'home');
  probe(); refreshDataBtn();
});
clock(); setInterval(clock, 20000);
/* midnight: today rolls over, so the home screen must too */
setInterval(() => {
  if (view === 'home' && $('#home').dataset.d !== LifeOS.day()) { $('#home').dataset.d = LifeOS.day(); drawHome(); refreshDataBtn(); }
}, 60000);
</script>
</body>
