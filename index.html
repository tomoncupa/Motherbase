/* The sleep widget's line: the average night this week, and how many met the target. */
function sleepSaid() {
  const f = Rec.map('field').sleep, target = f && f.target ? Number(f.target) : 0, got = [];
  for (let i = 6; i >= 0; i--) { const v = evValue(LifeOS.shift(LifeOS.day(), -i), 'sleep'); if (v != null) got.push(v); }
  if (!got.length) return 'last 7 nights';
  const mean = got.reduce((a, v) => a + v, 0) / got.length;
  return mean.toFixed(1) + ' hrs a night' + (target ? ', ' + got.filter(v => v >= target).length + ' of ' + got.length + ' on target' : '');
}
function cadenceText(c) {
  if (!c) return 'daily';
  if (c.type === 'week') return (c.target || 1) + '× a week';
  if (c.type === 'days') {
    const on = c.days.map((d, i) => d ? i : -1).filter(i => i >= 0);
    if (on.length === 7) return 'daily';
    if (on.join() === '1,2,3,4,5') return 'weekdays';
    if (on.join() === '0,6') return 'weekends';
    return on.map(i => DLET[i]).join('');
  }
  return 'daily';
}
/* The most recent day TRAIN has any sets on. Read-only: the home screen is a
   window onto TRAIN's rows, never a second writer of them. */
/* the last day TRAIN counts as trained: a routine's planned sets waiting
   today are not training yet (setCounts) */
function trainLastDay() {
  const rows = Rec.all('set'), t = LifeOS.day();
  let best = null;
  for (let i = 0; i < rows.length; i++) {
    const d = rows[i].date;
    if (d && d <= t && (!best || d > best) && setCounts(rows[i].payload || {}, d, t)) best = d;
  }
  return best;
}

/* ══════════════ reading the other apps ══════════════
   STATUS owns every measurement and TRAIN owns the training log. Nothing
   below writes either: these are readers, so the home screen can show a
   number without becoming a second author of it. */

/** the value of one tracked field on one day, or null */
/* shared/measure.js, since 2026-09-16. This used to be its own copy of the
   rule and had fallen behind STATUS's: no `sum`, so a summed field showed its
   last reading rather than the total, and no food, so caffeine drunk as coffee
   was invisible here while STATUS had it. Same function, same answer, in every
   app that reads a measure. */
function evValue(date, id) { return Measure.value(date, id); }

/** every weight reading in the window, oldest first */
function weightSeries(days) {
  const out = [];
  for (let i = days; i >= 0; i--) {
    const d = LifeOS.shift(LifeOS.day(), -i);
    const v = evValue(d, 'weight');
    if (v != null) out.push({ d: d, v: v });
  }
  return out;
}

/* STATUS's targets, read by STATUS's own rule (status/index.html, TARGETS
   and calTarget): its defaults when nothing is set, and calories from the
   macros switched on when its calorie mode says so. Calories from the
   measured TDEE need STATUS's estimate, which lives only in STATUS, so in
   that mode the calories line has no target rather than a wrong one. */
const statusTargets = () => {
  const t = Object.assign({}, Rec.setting('status', 'targets') || { p: 175, c: 200, f: 80, kcal: 2220 });
  const mode = Rec.setting('status', 'calMode') || 'fixed';
  if (mode === 'macros') {
    const on = Rec.setting('status', 'macroOn') || { p: 1, c: 1, f: 1 };
    let k = 0;
    [['p', 4], ['c', 4], ['f', 9]].forEach(x => { if (on[x[0]]) k += (Number(t[x[0]]) || 0) * x[1]; });
    if (k > 0) t.kcal = Math.round(k);
  } else if (mode === 'tdee') t.kcal = 0;
  return t;
};

/** what one macro adds up to today, out of the meals STATUS logged. A meal
    with no figure for it adds nothing and is counted apart in `o`, so a
    blank is never read as zero. */
function macroToday(key, o) {
  let n = 0, known = 0, all = 0;
  Rec.all('meal', { date: LifeOS.day() }).forEach(r => {
    all++;
    const v = r.payload[key];
    if (v == null || v === '' || !isFinite(Number(v))) return;
    known++; n += Number(v);
  });
  if (o) { o.known = known; o.all = all; }
  return n;
}

/* One drawing for protein and calories: same shape, same question, different
   column. Two near-identical widgets would have drifted within a month. */

/* ── the journal ── */
const noteRows = () => Rec.all('note');

/** open todos, oldest first, so the thing you keep putting off is at the top.
    A todo QUESTS has dated for later is not open yet; one with No date sorts
    last. */
const todoFrom = r => r.payload.due === undefined ? r.date : (r.payload.due || '');
/* ── who wrote this task ──
   Tom, 2026-09-17: "I want the todo widget to show task source", asked in the
   same breath as "why does pay skool show up twice". They are one question:
   two rows reading the same are two different apps' idea of the same job, and
   with nothing on the row saying so they look like a bug in one list.

   `src` is what the writer stamped on itself. A row without one was typed by
   hand, and a hand-written bullet lives in STATUS's journal however it was
   opened, so that is what it says. A project, when there is one, beats the app
   name: #bills is more use than QUESTS. */
/* `brief` is the morning brief's todos, which QUESTS writes (quest 876) */
const TODO_SRC = { wealth: 'WEALTH', arc: 'ARC', block: 'BLOCK', quest: 'QUESTS', log: 'LOG', brief: 'BRIEF' };
function todoSource(r) {
  const p = (r && r.payload) || {};
  if (p.proj) {
    /* Rec.get hands back the PAYLOAD, not the row. */
    const pr = Rec.get('project', null, p.proj);
    return String((pr && pr.name) || p.proj).toUpperCase();
  }
  return TODO_SRC[p.src] || 'STATUS';
}

function openTodos() {
  const today = LifeOS.day();
  return noteRows()
    .filter(r => r.payload.kind === 'todo' && !r.payload.done && !r.payload.cancelled &&
      !(r.payload.due && r.payload.due > today))
    .sort((a, b) => String(todoFrom(a) || '9999').localeCompare(String(todoFrom(b) || '9999')));
}

/* Which day a journal line shows on, and ticking a todo, are shared/journal.js:
   the same rules STATUS, LOG and QUESTS read. A todo with a `due` shows from
   its due day; a repeating todo does a round instead of finishing. The home
   screen leaves the journal counters to STATUS and QUESTS, as it always has. */
function noteOnDay(r, day) { return Journal.onDay(r, day); }
function tickTodo(r) { Journal.tick(r.date, r.key, { day: LifeOS.day(), publish: false }); }
/* newest first, the day and then the time written inside the day: by day
   alone, a day's lines came oldest first and the newest could be cut */
const notesOfKind = k => noteRows()
  .filter(r => r.payload.kind === k)
  .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.payload.t || 0) - (a.payload.t || 0));

/* ── one bullet, drawn one way ──
   Tom, 2026-09-17: "All bullet entries should look the same regardless of
   where." STATUS, LOG and QUESTS already drew one through shared/journal.js;
   the home screen was the odd one out, building its own row out of a plain
   span, so the same line wore a different face depending on which screen you
   were looking at.

   `mb-bullet` with a `.k` for the mark and a `.tx` for the words is the shared
   contract, and asking journal.js for either half brings its stylesheet with
   it. The mark says WHEN you are looking, not where the line came from: a box
   is something to do today, an arrow is something that has moved on. */
/* The mark is a button only when it ticks something (`tick`, from tickRow).
   Otherwise it is the mark and nothing more, the way LOG draws one: a button
   that lit up on hover and did nothing sat on every idea, event and past
   line. */
function bulletRow(r, day, tick) {
  const p = r.payload || {};
  const row = el('div', 'row mb-bullet' +
    (p.done && !p.movedAway ? ' done' : '') + (p.cancelled ? ' cancelled' : ''));
  const k = el(tick ? 'button' : 'span', 'k');
  if (tick) {
    k.type = 'button';
    k.setAttribute('aria-label', p.done ? 'Untick' : 'Tick');
    k.onclick = e => { e.stopPropagation(); tick(); };
  } else k.setAttribute('aria-hidden', 'true');
  k.innerHTML = Journal.markHTML(p.kind, day !== r.date || !!p.movedAway);
  row.appendChild(k);
  row.appendChild(el('span', 'tx', Journal.textHTML(p, day)));
  return row;
}

/* IDEAS and EVENTS: newest first, the words wrapping so a phone shows all
   of them, and the day at the end of the row the way TODO puts its age */
function bulletList(body, kind, empty) {
  const rows = notesOfKind(kind);
  if (!rows.length) { body.appendChild(el('div', 'empty', empty)); return; }
  const wrap = el('div', 'rowlist');
  rows.slice(0, 10).forEach(r => {
    const row = bulletRow(r, r.date);
    row.classList.add('wraps');
    if (r.date) row.appendChild(el('span', 'd', esc(Day.short(r.date))));
    wrap.appendChild(row);
  });
  body.appendChild(wrap);
}

const daysBetween = (a, b) => {
  if (!a || !b) return 0;
  return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
};

/** Everything on today, from both apps, in the order it happens.

    A block carries `s`, the minute of the day it starts. A bullet carries
    `at` as "HH:MM" if one was typed into it. Anything with neither sorts to
    the end rather than being given a fake midnight, and open todos lead that
    tail because a task with no time is still a task. */
/* Today's plan, read for today's date every time. The kernel's doc holds
   the plan for the day it was last built on, so after midnight, with
   nothing written since, TODAY drew yesterday's plan as missing. */
const todayPlan = () => Rec.get('plan', LifeOS.day(), 'routine');
function todayItems() {
  const today = LifeOS.day();
  const out = [];

  const plan = todayPlan();
  if (plan && plan.date === today) {
    (plan.blocks || []).forEach(b => {
      const on = LifeOS.isDone(b.actId, today);
      out.push({
        kind: 'block', name: b.name, link: b.link || '', note: b.note || '', at: b.s == null ? null : b.s,
        dur: b.dur || 0, tag: b.lane || '', colour: b.color || '', done: on,
        tick: () => LifeOS.done(b.actId, today, !on, { src: 'home' }),
      });
    });
  }

  /* The same three rules STATUS uses, because a day that reads one way there
     and another way here is two different days.
       - written today
       - a task from before today, still open, which follows you forward
       - a task finished today, wherever it was written down
     Nothing is copied and nothing moves: this is a view over the rows. */
  Rec.all('note').forEach(r => {
    const n = r.payload;
    if (!n || n.cancelled) return;
    const isTodo = n.kind === 'todo';
    if (!noteOnDay(r, today)) return;
    /* A line's clock is its start; a ticked todo with no start, when it was
       ticked. The time order STATUS and LOG use (Tom, 2026-09-14). */
    const clock = n.at || (isTodo && n.done ? n.doneAt : null) || null;
    const toMin = s => +String(s).split(':')[0] * 60 + +String(s).split(':')[1];
    const mins = clock ? toMin(clock) : null;
    /* A todo typed as a range ("Train 8-11") keeps its end in `by` and no
       length (journal.js, 2026-09-18), so its length is start to end; read
       as no length, it was late from its first minute. A tick writes its own
       `by` and keeps the typed one in `byWas`. */
    const end = isTodo && n.at ? (n.done ? n.byWas : (n.byAuto ? null : n.by)) : null;
    const span = end ? ((toMin(end) - toMin(n.at)) % 1440 + 1440) % 1440 : 0;
    out.push({
      kind: n.kind, name: n.text || '', link: n.link || '', at: mins,
      dur: n.dur || span || 0, tag: '', colour: '', done: !!n.done, todo: isTodo,
      /* Only a todo has something to tick. An entry is a record of a thing
         that already happened and there is nothing to say about it. */
      tick: !isTodo ? null : () => { tickTodo(r); drawHome(); },
    });
  });

  return out.sort((a, b) => {
    /* Done sinks to the bottom. This is a reversal: it used to stay where it
       happened, because sinking is what breaks a strictly chronological read.
       Tom, 2026-09-05, chose the other trade — what is LEFT is what he needs
       to see, and a finished thing sitting in the middle of the list is just
       something to read past. The history is not lost, it is underneath.

       Nothing UNDONE is ever moved by this. That was the condition. */
    const d = x => x.done ? 1 : 0;
    if (d(a) !== d(b)) return d(a) - d(b);
    const at = x => x.at == null ? 1e9 : x.at;
    if (at(a) !== at(b)) return at(a) - at(b);
    /* Both untimed: an open task outranks a note about the past. */
    const rank = x => (x.todo && !x.done) ? 0 : 1;
    return rank(a) - rank(b);
  });
}

/* What a tick is called. BLOCK names its ticks `block.routine` and writes the
   names only when BLOCK itself is opened, so a new or renamed block had no
   name yet and showed as "read.evening". Read off the id then: "Read", with
   "Evening" as the part it belongs to. */
function actLabel(id) {
  const a = LifeOS.act(id), p = String(id).split('.');
  const words = s => { s = String(s || '').replace(/-/g, ' ').trim(); return s.charAt(0).toUpperCase() + s.slice(1); };
  return { name: (a && a.name) || words(p[0]), part: a && a.cat && a.cat !== 'journal' ? a.cat : words(p[1]) };
}

/** how many days back from today this activity has been ticked without a gap */
function tickStreak(actId) {
  let n = 0;
  for (let i = 0; i < 400; i++) {
    const d = LifeOS.shift(LifeOS.day(), -i);
    if (LifeOS.isDone(actId, d)) { n++; continue; }
    /* today not being ticked yet is not a broken streak, it is an unfinished
       day. Any other gap ends it. */
    if (i === 0) continue;
    break;
  }
  return n;
}

const ageNow = born => {
  const d = new Date();
  return Math.max(0, d.getFullYear() - Number(born));
};


/* ══════════════ widgets ══════════════
   Each widget is a pure function of the shared doc: given a body element, fill
   it. The grid owns size and position; the widget owns nothing but its content,
   which is what lets you drag and resize them without touching this table. */
/* A block's note is where a link lives, written in BLOCK either as a plain
   address or as [label](address). Only http and https: a note is text a person
   typed, and text a person typed is not a reason to follow any scheme a
   browser happens to understand. */
const LINK_OK = /^https?:\/\//i;
const LINK_RE = /\[[^\]]{1,120}\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>"']+)/i;
function linkIn(x) {
  /* The block's own link first. Falling back to one written into a note keeps
     anything set up before the link field existed working. */
  if (x && x.link && (LINK_OK.test(x.link) || (typeof UI !== 'undefined' && UI.spot && UI.spot(x.link)))) return x.link;
  const m = LINK_RE.exec(String((x && x.note) || ''));
  return m ? (m[1] || m[2]) : null;
}

/* ── what you are meant to be doing, right now ──
   Tom, 2026-09-05: "make the Today widget good enough to follow without
   thinking. If BLOCK and STATUS are properly set up then it should be able to
   dictate my plan for the day."

   A list of the day is not that. A list makes you find your place in it every
   time you look, and finding your place is the thinking. So one line answers
   the question before the list does: what is running, or what is next, and how
   long you have.

   Four states, in the order they are checked:
     RUNNING   something started, has not finished, and is not ticked
     BEHIND    its slot has been and gone and it is still not ticked
     NEXT      nothing running or owed, so the soonest thing still ahead
     LOOSE     nothing timed left, so the first thing still undone
   and when there is nothing in any of them, the day is done and it says so.

   BEHIND used to sit at the bottom as a fallback, reached only once there was
   nothing ahead at all. So with four morning blocks unticked at 2pm it stepped
   over all four and announced Dishes, three hours away. One future block was
   enough to hide everything owed. The widget is meant to be followable without
   thinking, and a widget that skips your unfinished work is worse than a list,
   because a list at least shows you the gap.

   It is checked second now, under RUNNING, so something actually happening
   still wins. That also bounds how long it can nag: the moment the next block's
   slot opens, RUNNING takes the band back. */
function nowNext(items) {
  const d = new Date(), now = d.getHours() * 60 + d.getMinutes();
  const open = items.filter(x => !x.done);
  if (!open.length) return items.length ? { state: 'done' } : null;

  const timed = open.filter(x => x.at != null);
  const running = timed.filter(x => x.at <= now && now < x.at + (x.dur || 0))[0];
  if (running) return { state: 'running', it: running, mins: running.at + running.dur - now };

  /* Its whole slot has passed and it is still open. Earliest first: the one
     you dropped soonest is the one to pick back up. */
  const behind = timed.filter(x => x.at + (x.dur || 0) <= now).sort((a, b) => a.at - b.at);
  if (behind.length) return { state: 'loose', it: behind[0], missed: behind.length };

  const next = timed.filter(x => x.at > now)[0];
  if (next) return { state: 'next', it: next, mins: next.at - now };

  /* Nothing timed is running, owed or ahead, so what is left has no clock. */
  const loose = open.filter(x => x.at == null)[0] || open[0];
  return { state: 'loose', it: loose, missed: 0 };
}

/* "in 25m", "in 1h 10m", "for 40m" — short enough to read at a glance. */
function inWords(m) {
  m = Math.max(0, Math.round(m));
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
}

/* ══════════════ desk tools: what TIMER, STOPWATCH, INTERVALS and ALARMS run on ══════════════
   Tom, 2026-09-25: "Add some general widgets as well like timers and stop
   watches and alarms." The board is redrawn whenever anything in the store
   changes, so a count kept inside a widget's drawing died with it: until
   1.0.35 TIMER went back to 00:00 whenever a tick landed from another app
   or from sync. The state lives here, one entry per widget, and one ticker
   keeps every face current and rings whatever is due, drawn or not.
   Counts in progress are kept in memory: a reload stops them, and nothing
   about one is written to the store or carried to another device. */
const TOOLS = {};
/* the first TIMER on the board is TIMER#0 and the second TIMER#1: the same
   through a redraw, a layout arriving by sync, and a move */
function toolOf(cfg, make) {
  const k = cfg.t + '#' + Math.max(0, layout.filter(c => c.t === cfg.t).indexOf(cfg));
  return TOOLS[k] || (TOOLS[k] = make());
}
const zpad = n => String(n).padStart(2, '0');
/* ── DESK TIME's sums ──
   A night is named by the evening it starts on. Its stretches at the PC are
   that day's and the next morning's, in minutes from that day's midnight, so
   1:40am is 1540. */
const deskShift = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + zpad(x.getMonth() + 1) + '-' + zpad(x.getDate()); };
const deskHM = s => { const m = Math.round(s / 60); return Math.floor(m / 60) + ':' + zpad(m % 60); };
const deskClk = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; const h = Math.floor(m / 60); return ((h % 12) || 12) + ':' + zpad(m % 60) + (h < 12 ? 'am' : 'pm'); };
function deskBed(d) {
  const on = (day, off) => { const r = Rec.get('deskon', day, ''); return r && Array.isArray(r.on) ? r.on.map(x => [x[0] + off, x[1] + off]) : []; };
  const all = on(d, 0).concat(on(deskShift(d, 1), 1440)).sort((a, b) => a[0] - b[0]);
  const now = new Date(), nowM = LifeOS.day() === d ? now.getHours() * 60 + now.getMinutes()
    : LifeOS.day() === deskShift(d, 1) ? 1440 + now.getHours() * 60 + now.getMinutes() : 99999;
  for (let i = 0; i < all.length; i++) {
    const end = all[i][1];
    if (end < 21 * 60 || end > 1440 + 12 * 60) continue;
    const next = i + 1 < all.length ? all[i + 1][0] : Math.min(nowM, 1440 + 12 * 60);
    if (next - end >= 180) return end;
  }
  return null;
}
/* the middle of the last 14 nights that have one */
function deskUsual() {
  const t = LifeOS.day(), B = [];
  for (let k = 1; k <= 14; k++) { const b = deskBed(deskShift(t, -k)); if (b != null) B.push(b); }
  if (!B.length) return null;
  B.sort((a, b) => a - b);
  const mid = B.length % 2 ? B[(B.length - 1) / 2] : (B[B.length / 2 - 1] + B[B.length / 2]) / 2;
  return { m: mid, n: B.length };
}

const mmss = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ':' + zpad(m) : zpad(m)) + ':' + zpad(s % 60);
};
const sfx = (cue, o) => { if (window.Sfx) try { Sfx.play(cue, o); } catch (e) {} };
/* a button inside a widget: drawn small, 44px to a thumb (mb-tap) */
const tbtn = (label, fn, cls) => {
  const b = el('button', 'tbtn mb-press mb-tap' + (cls ? ' ' + cls : ''), label);
  b.type = 'button';
  b.onclick = ev => { ev.stopPropagation(); fn(ev); };
  return b;
};

/* ── ringing ──
   An alarm rings until it is answered: a chime every couple of seconds and a
   sheet with STOP and SNOOZE (Tom, 2026-09-17, on a prompt: "it should never
   go away until answered"). A timer or a set of intervals finishing is
   smaller, three chimes and a toast, because you are usually watching it. */
let ringing = null;
function ringFor(title, line, snooze) {
  if (ringing) ringing.stop();
  const r = { off: false, id: setInterval(() => sfx('complete', { level: 3 }), 2400) };
  r.stop = () => { if (r.off) return; r.off = true; clearInterval(r.id); if (ringing === r) ringing = null; };
  ringing = r;
  sfx('complete', { level: 3 });
  try { if (window.Notification && Notification.permission === 'granted') new Notification(title, { body: line || '' }); } catch (e) {}
  UI.dialog({
    title: title, width: 360,
    body: b => b.appendChild(el('div', 'ringline', esc(line || 'Time.'))),
    actions: [
      snooze ? { label: 'SNOOZE 5 MIN', fn: () => { r.stop(); snooze(); } } : null,
      { label: 'STOP', kind: 'go', fn: () => { r.stop(); } },
    ].filter(Boolean),
    onClose: () => r.stop(),
  });
  return r;
}
function chime(title, line) {
  sfx('complete', { level: 2 });
  setTimeout(() => sfx('complete', { level: 2 }), 1100);
  setTimeout(() => sfx('complete', { level: 3 }), 2200);
  toast('<b>' + esc(title) + '</b> ' + esc(line || ''), { ms: 8000 });
}

/* ── alarms ──
   A setting, so an alarm set on the PC is on the phone too and is in the
   backup. It rings on any device with the home screen open when the clock
   reaches it; a web page cannot wake a phone, and the widget says so. What
   has rung is remembered in memory only, because a remembered list in a
   setting is the live sync trap (root brief, Known traps). */
const alarmList = () => (Rec.setting('lifeos', 'alarms') || []).filter(a => a && /^\d\d:\d\d$/.test(a.at || ''));
const alarmSave = list => Rec.setting('lifeos', 'alarms', list);
/* no days, or all seven, is every day. An empty list does not survive live
   sync, so "every day" is written as no list at all */
const alarmDays = a => Array.isArray(a.days) && a.days.length && a.days.length < 7 ? a.days : null;
const alarmMin = a => { const p = a.at.split(':').map(Number); return p[0] * 60 + p[1]; };
const rang = {}, snoozes = [];
function alarmNext(a, from) {
  const m = alarmMin(a), days = alarmDays(a);
  for (let i = 0; i < 9; i++) {
    const d = new Date(from.getFullYear(), from.getMonth(), from.getDate() + i, Math.floor(m / 60), m % 60, 0, 0);
    if (d > from && (!days || days.indexOf(d.getDay()) > -1)) return d;
  }
  return null;
}
function alarmCheck(now) {
  const hm = zpad(now.getHours()) + ':' + zpad(now.getMinutes()), day = LifeOS.day();
  alarmList().forEach(a => {
    if (!a.on || a.at !== hm) return;
    const days = alarmDays(a);
    if (days && days.indexOf(now.getDay()) < 0) return;
    const k = (a.id || a.at) + '|' + day + '|' + hm;
    if (rang[k]) return;
    rang[k] = 1;
    const again = () => snoozes.push({ end: Date.now() + 5 * 60000, label: a.label || '' });
    ringFor('ALARM · ' + MIN2(alarmMin(a)), a.label || '', again);
  });
  for (let i = snoozes.length - 1; i >= 0; i--) {
    if (now.getTime() < snoozes[i].end) continue;
    const s = snoozes.splice(i, 1)[0];
    ringFor('ALARM · SNOOZED', s.label, () => snoozes.push({ end: Date.now() + 5 * 60000, label: s.label }));
  }
}

/* the three counters, each a fresh object per widget */
const timerTool = () => ({
  end: 0, set: 0,
  left(now) { return this.end ? Math.max(0, Math.ceil((this.end - now) / 1000)) : 0; },
  step(now) { if (this.end && now >= this.end) { this.end = 0; chime('TIMER', mmss(this.set) + ' is up'); } },
});
const watchTool = () => ({
  t0: 0, acc: 0, laps: [],
  ms(now) { return this.acc + (this.t0 ? now - this.t0 : 0); },
});
/* work and rest in seconds; rest 0 is an EMOM, one work slot straight after another */
const ivCfg = cfg => ({
  work: Math.max(1, Math.round(+(cfg && cfg.work) || 40)),
  rest: cfg && cfg.rest != null && cfg.rest !== '' ? Math.max(0, Math.round(+cfg.rest || 0)) : 20,
  rounds: Math.max(1, Math.round(+(cfg && cfg.rounds) || 8)),
});
const ivTool = () => ({
  t0: 0, acc: 0, mark: '', beep: 0, cfg: null,
  ms(now) { return this.acc + (this.t0 ? now - this.t0 : 0); },
  where(now) {
    const c = ivCfg(this.cfg), s = this.ms(now) / 1000;
    const total = c.rounds * c.work + (c.rounds - 1) * c.rest;
    if (s >= total) return { done: 1, total: total, c: c };
    const cyc = c.work + c.rest, round = Math.floor(s / cyc) + 1, within = s - (round - 1) * cyc;
    const work = within < c.work;
    return { round: round, work: work, left: work ? c.work - within : cyc - within, total: total, gone: s, c: c };
  },
  step(now) {
    if (!this.t0) return;
    const w = this.where(now);
    if (w.done) {
      this.t0 = 0; this.acc = 0; this.mark = '';
      chime('INTERVALS', 'all ' + w.c.rounds + ' rounds done');
      return;
    }
    const mk = w.round + (w.work ? 'w' : 'r');
    if (mk !== this.mark) { if (this.mark) sfx(w.work ? 'complete' : 'tick', { level: 1 }); this.mark = mk; this.beep = 0; }
    const s = Math.ceil(w.left);
    if (s >= 1 && s <= 3 && this.beep !== s) { this.beep = s; sfx('tick'); }
  },
});
/* One ticker for all of them. A tenth of a second so a stopwatch reads
   smoothly; the alarms are looked at once a second. */
let toolSec = -1;
setInterval(() => {
  const now = Date.now();
  Object.keys(TOOLS).forEach(k => {
    const s = TOOLS[k];
    try { if (s.step) s.step(now); if (s.paint) s.paint(now); } catch (e) { console.warn('[tools]', e); }
  });
  const sec = Math.floor(now / 1000);
  if (sec !== toolSec) { toolSec = sec; try { alarmCheck(new Date(now)); } catch (e) { console.warn('[alarms]', e); } }
}, 100);

/* ── BLOCK's Every and Habits, read here ──
   Copies of rhAdd, everyState, rhWeekStart, RH_PER, rhPer, rhMade, rhPeriod
   and anytimeState in block/index.html: change both. What got done is an
   ordinary shared tick under the slug of the name, or under `act`, the
   block's own id, for a habit tracked from a block (BLOCK 1.0.23), so
   ticking one here is ticking it in BLOCK. */
const rhTickH = r => r.act || LifeOS.slug(r.name);
function rhAddH(date, n, unit) {
  if (unit === 'day') return Day.shift(date, n);
  if (unit === 'week') return Day.shift(date, 7 * n);
  const [y, m, d] = date.split('-').map(Number);
  const first = new Date(y, m - 1 + n, 1, 12);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12).getDate();
  return first.getFullYear() + '-' + zpad(first.getMonth() + 1) + '-' + zpad(Math.min(d, last));
}
function rhEveryState(r, dates, today) {
  const last = dates.length ? dates[dates.length - 1] : null;
  if (last === today) return { st: 'done', last: last, next: rhAddH(today, r.n || 1, r.unit || 'day') };
  const due = last ? rhAddH(last, r.n || 1, r.unit || 'day') : (r.from || today);
  const late = Day.diff(today, due);
  return { st: late > 0 ? 'owed' : late === 0 ? 'due' : 'later', last: last, due: due, late: late };
}
function rhWeekStartH(today, start) {
  if (start === 'today') return Day.shift(today, -6);
  const dow = new Date(today + 'T12:00:00').getDay();
  return Day.shift(today, -((dow - (start == null ? 1 : start) + 7) % 7));
}
/* a habit is `times` per `per`: a week (none is a week), two weeks counted
   from the week it began, or the calendar month */
const RH_PER_H = { week: { one: 'week', len: 7 }, fortnight: { one: 'fortnight', len: 14 }, month: { one: 'month', len: 0 } };
const rhPerH = r => (RH_PER_H[r.per] ? r.per : 'week');
function rhPeriodH(r, date, today, start, made) {
  const p = rhPerH(r);
  if (p === 'month') { const f = date.slice(0, 8) + '01'; return [f, Day.shift(rhAddH(f, 1, 'month'), -1)]; }
  const len = RH_PER_H[p].len;
  const anchor = p === 'week' ? rhWeekStartH(today, start) : rhWeekStartH(made, start === 'today' ? 1 : start);
  const f = Day.shift(anchor, len * Math.floor(Day.diff(date, anchor) / len));
  return [f, Day.shift(f, len - 1)];
}
function rhAnyState(r, dates, today, start) {
  const made = [r.made, dates[0]].filter(Boolean).sort()[0] || today;
  const from = rhPeriodH(r, today, today, start, made)[0];
  const n = dates.filter(d => d >= from && d <= today).length;
  return { n: n, of: r.times || 1, met: n >= (r.times || 1), today: dates.indexOf(today) >= 0, per: RH_PER_H[rhPerH(r)].one };
}

/* ── small things several widgets share ── */

const peso = n => (n < 0 ? '-' : '') + '\u20b1' + Math.round(Math.abs(n)).toLocaleString();

/* ══════════════ what a card shows, picked from its menu ══════════════
   Tom, 2026-10-18: "a widget like work done, I want to be able to right
   click and pick which dates and time frames get displayed", and "Apply
   this level of granularity and modularity to everything". Two levers, both
   on the card's menu and both saved on the card, so two copies can differ:
   - `periods`: a widget that shows stretches of time side by side names
     which of PERIODS it offers; `cfg.cols` is the ones he ticked.
   - `parts`: a widget made of pieces lists them as [id, label]; `cfg.off`
     is the ones he turned off. Missing means all on, which is also what an
     empty list reads as after live sync drops it.
   A widget showing one stretch keeps `days`, a single pick. */
const PERIODS = [
  ['d7', 'Last 7 days', '7D'], ['d14', 'Last 14 days', '14D'], ['d30', 'Last 30 days', '30D'],
  ['d90', 'Last 90 days', '90D'], ['d180', 'Last 180 days', '180D'], ['d365', 'Last 365 days', '365D'],
  ['wk', 'This week', 'WEEK'], ['lwk', 'Last week', 'LAST WK'], ['mo', 'This month', 'MONTH'],
  ['lmo', 'Last month', 'LAST MO'], ['yr', 'This year', 'YEAR'], ['all', 'All time', 'ALL'],
];
/* the first day anything was recorded, read off the rows themselves */
function firstDay() {
  let first = null;
  ['ev', 'meal', 'note', 'set'].forEach(t => Rec.all(t).forEach(r => { if (r.date && (!first || r.date < first)) first = r.date; }));
  return first;
}
/* a period as {id, label, head, from, to, n}; weeks start on Monday. A
   stretch still running ends today. */
function periodOf(id, today) {
  today = today || LifeOS.day();
  const P = PERIODS.filter(p => p[0] === id)[0]; if (!P) return null;
  const dt = new Date(today + 'T12:00:00'), dow = (dt.getDay() + 6) % 7;
  const ym = today.slice(0, 7), y = today.slice(0, 4);
  let from = today, to = today;
  if (id[0] === 'd' && id !== 'd') from = LifeOS.shift(today, -(+id.slice(1) - 1));
  else if (id === 'wk') from = LifeOS.shift(today, -dow);
  else if (id === 'lwk') { to = LifeOS.shift(today, -dow - 1); from = LifeOS.shift(to, -6); }
  else if (id === 'mo') from = ym + '-01';
  else if (id === 'lmo') { to = LifeOS.shift(ym + '-01', -1); from = to.slice(0, 7) + '-01'; }
  else if (id === 'yr') from = y + '-01-01';
  else if (id === 'all') from = firstDay() || today;
  const n = Math.round((new Date(to + 'T12:00:00') - new Date(from + 'T12:00:00')) / 864e5) + 1;
  return { id: id, label: P[1], head: P[2], from: from, to: to, n: n };
}
const partOn = (cfg, id) => !(cfg && cfg.off && cfg.off.indexOf(id) > -1);
const partsOf = (W, cfg) => (typeof W.parts === 'function' ? W.parts(cfg) : W.parts) || [];
/* one piece on its own is a tick in the widget's own menu, since a Show
   list of one could never be turned off (one has to stay on); it writes
   the same `cfg.off` */
const partToggle = (cfg, id, label, redraw) => ({ label: label, check: partOn(cfg, id), fn: () => {
  const off = (cfg.off || []).filter(o => o !== id); if (partOn(cfg, id)) off.push(id);
  if (off.length) cfg.off = off; else delete cfg.off; redraw(); } });

/* ── WEALTH's sums, for MONEY IN, MONEY OUT, NET and NEXT BILL ──
   Copies of WEALTH's own page (never name its path here: the client build
   refuses any link to an app it drops), so the board says what WEALTH says: `num`,
   `norm`, `acctKey`, `catOf` (his mark, else the longest rule that
   matches), `isMove` (money between his own accounts is not spending),
   `rangeSpend`'s total (big purchases counted), `rangeIn` (borrowed money
   left out), `billDates` and `billsOwed`. Change WEALTH's and these
   together. Reads only. */
const WM = (() => {
  const num = (v, d) => { const n = parseFloat(typeof v === 'string' ? v.replace(/,/g, '') : v); return isFinite(n) ? n : (d == null ? 0 : d); };
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  const acctKey = v => {
    if (v == null || v === '') return '';
    const raw = String(v);
    if (Rec.has('acct', null, raw)) return raw;
    const low = raw.toLowerCase();
    if (Rec.has('acct', null, low)) return low;
    const hit = Rec.all('acct').find(r => r.payload && String(r.payload.name || '').toLowerCase() === low);
    return hit ? hit.key : raw;
  };
  const catGrp = id => (Rec.get('cat', null, id) || {}).grp || '';
  const markOf = s => Rec.get('mark', null, s.date + '|' + s.key) || {};
  const rules = () => Rec.all('rule').map(r => r.payload || {}).filter(r => r.match)
    .sort((a, b) => b.match.length - a.match.length);
  const catOf = (s, R) => {
    const m = markOf(s);
    if (m.cat) return m.cat;
    const t = norm(s.note || '');
    const hit = t ? (R || rules()).find(r => t.indexOf(norm(r.match)) > -1) : null;
    return hit ? hit.cat : '';
  };
  const isMove = (s, R) => catGrp(catOf(s, R)) === 'move';
  const spendRows = (from, to) => Rec.all('spend', { from: from, to: to }).map(r => Object.assign({ key: r.key, date: r.date }, r.payload,
    { acct: acctKey(r.payload && r.payload.acct) }));
  const pad = n => String(n).padStart(2, '0');
  const month = () => LifeOS.day().slice(0, 7);
  const start = m => m + '-01';
  const end = m => { const p = m.split('-'); return m + '-' + new Date(+p[0], +p[1], 0).getDate(); };
  const back = (m, n) => { const p = m.split('-'), d = new Date(+p[0], +p[1] - 1 - n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
  const monthLabel = m => { const p = m.split('-'); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); };
  const monthOut = m => { const R = rules(); return spendRows(start(m), end(m)).filter(s => !isMove(s, R)).reduce((a, s) => a + num(s.amt, 0), 0); };
  const monthIn = m => Rec.all('paid', { from: start(m), to: end(m) }).map(r => r.payload || {}).filter(p => !p.loan)
    .reduce((a, p) => a + num(p.amt, 0), 0);
  function billDates(b, from, to) {
    const out = [];
    const inRange = iso => iso >= from && (!b.from || iso >= b.from) && (!b.until || iso <= b.until);
    if (b.cycle === 'days') {
      const n = Math.max(1, num(b.every, 7)), s = b.start || from;
      let i = Math.max(1, Math.floor(Day.diff(from, s) / n) - 1);
      for (let guard = 0; guard < 500; guard++, i++) {
        const iso = Day.shift(s, Math.round(i * n));
        if (iso > to) break;
        if (inRange(iso)) out.push(iso);
      }
      return out;
    }
    const day = num(b.day, 1), step = Math.max(1, Math.round(num(b.months, 1)));
    const s0 = b.start ? +b.start.slice(0, 4) * 12 + +b.start.slice(5, 7) - 1 : null;
    const d = new Date(from.slice(0, 4), +from.slice(5, 7) - 1, 1);
    for (let i = 0; i < 24 * step; i++) {
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      const iso = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(Math.min(day, last));
      if (iso > to) break;
      const onStep = step === 1 || s0 == null || ((d.getFullYear() * 12 + d.getMonth() - s0) % step + step) % step === 0;
      if (onStep && inRange(iso)) out.push(iso);
      d.setMonth(d.getMonth() + 1);
    }
    return out;
  }
  /* a due date counts as paid when a purchase names the bill, or sits in its
     category at roughly its amount, from a few days before it up to today */
  function billsOwed(from, to) {
    const t = Day.today(), used = {}, paid = {}, R = rules(), all = [];
    Rec.all('bill').forEach(r => { const b = Object.assign({ id: r.key }, r.payload); billDates(b, from, to).forEach(d => all.push({ bill: b, date: d })); });
    all.sort((a, b) => a.date.localeCompare(b.date));
    Rec.all('spend').forEach(r => { if (r.key.indexOf('bill-') === 0) paid[r.key] = 1; });
    return all.filter(x => {
      if (paid['bill-' + x.bill.id + '-' + x.date]) return false;
      if (x.date > Day.shift(t, 3)) return true;
      const b = x.bill;
      const gap = b.cycle === 'days' ? Math.max(1, num(b.every, 7)) : 28 * Math.max(1, Math.round(num(b.months, 1)));
      const reach = Math.max(0, Math.min(3, Math.floor(gap / 2)));
      const amt = num(b.amt, 0), name = norm(b.name);
      const hit = spendRows(Day.shift(x.date, -reach), t).find(s => {
        if (used[s.date + s.key] || isMove(s, R) && catOf(s, R) !== b.cat) return false;
        if (b.acct && s.acct && s.acct !== b.acct) return false;
        if (name.length > 2 && norm(s.note).indexOf(name) > -1) return true;
        const a = num(s.amt, 0);
        return !!b.cat && catOf(s, R) === b.cat && a >= amt * .5 && a <= amt * 1.5;
      });
      if (hit) { used[hit.date + hit.key] = 1; return false; }
      return true;
    });
  }
  return { num, month, back, monthLabel, monthIn, monthOut, billsOwed };
})();

/* A copy of ELEMENT's own `toStatus`, for TO WEIGH's tick:
   what went down today, summed from the `dose` rows, written to STATUS as
   zinc and magnesium readings and as salt and citrate meals. Change both. */
function mixToStatus(d) {
  const wb = Rec.setting('mix', 'writeBack');
  if (wb != null && !wb) return;
  const n = v => { const x = parseFloat(String(v).replace(/,/g, '')); return isFinite(x) ? x : 0; };
  const sum = { na: 0, k: 0, zn: 0, mg: 0 };
  Rec.all('dose', { date: d }).forEach(r => { const p = r.payload; if (p && sum[p.nut] != null) sum[p.nut] += n(p.mg); });
  [['zinc', sum.zn], ['magnesium', sum.mg]].forEach(([fid, mg]) => {
    const r = Rec.get('ev', d, fid);
    const e = (r && r.e ? r.e : []).filter(x => x.src !== 'mix');
    if (mg > 0) e.push({ t: Date.now(), v: Math.round(mg), src: 'mix' });
    if (e.length) Rec.set('ev', d, fid, { e: e });
    else if (r) Rec.del('ev', d, fid);
  });
  const meal = (key, name, na, k) => {
    if (!(na > 0 || k > 0)) { if (Rec.get('meal', d, key)) Rec.del('meal', d, key); return; }
    Rec.set('meal', d, key, {
      fid: null, name: name, serve: 'mixed by ELEMENT', unit: 'g', amt: 0, mult: 1,
      kcal: 0, p: 0, c: 0, f: 0, na: Math.round(na), k: Math.round(k), ca: 0, caff: 0,
      price: 0, t: Date.now(), src: 'mix',
    });
  };
  meal('mix-salt', 'Salt (ELEMENT)', sum.na, 0);
  meal('mix-cit', 'Potassium citrate (ELEMENT)', 0, sum.k);
}

/* HALF-LIFE's stores: the share of a dose a store keeps until it is full.
