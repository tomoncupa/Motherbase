<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HABITS — cadence &amp; streaks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10; --panel:#0e141d; --panel2:#131b26; --line:#1e2a38; --line2:#2b3a4d;
  --txt:#dbe7f0; --dim:#7f93a8; --dim2:#5b6d80;
  --acc:#7ee8fa; --acc-d:#1a3a44; --warn:#ffb347; --bad:#ff6b81; --good:#6ee7a8;
  --f1:'Chakra Petch',system-ui,sans-serif; --f2:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, #10202b 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 100%, #131024 0%, transparent 55%),
    var(--bg);
  color:var(--txt);font-family:var(--f2);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#22303f;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:12px;padding:9px 14px;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:rgba(10,15,22,.85);backdrop-filter:blur(8px);
}
.logo{font-family:var(--f1);font-weight:700;font-size:17px;letter-spacing:.16em;display:flex;align-items:center;gap:8px}
.logo b{color:var(--acc)}
.views{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#0a1018}
.views button{padding:4px 13px;border-radius:6px;font-family:var(--f1);font-size:12px;letter-spacing:.08em;color:var(--dim)}
.views button.on{background:linear-gradient(180deg,#16303a,#102028);color:var(--acc);box-shadow:0 0 0 1px var(--acc-d)}
.spacer{flex:1}
.hbtn{padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-family:var(--f1);font-size:11px;letter-spacing:.08em;color:var(--dim)}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}
.hbtn.acc{border-color:var(--acc-d);color:var(--acc)}
main{flex:1;overflow:auto;padding:16px 16px 60px}
.wrapper{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--panel),#0b1119);padding:14px 15px 16px;position:relative;overflow:hidden}
.card:before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--acc-d),transparent)}
h2{font-family:var(--f1);font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--dim);display:flex;align-items:center;gap:9px;margin-bottom:12px}
h2 .sub{margin-left:auto;font-family:var(--f2);font-size:11px;letter-spacing:0;color:var(--dim2)}
.empty{color:var(--dim2);font-size:12px;line-height:1.7}
.empty b{color:var(--dim)}

/* today rows */
.trow{display:flex;align-items:center;gap:11px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:6px}
.trow:hover{border-color:var(--line2)}
.trow.on{opacity:.55}
.trow.on .nm{text-decoration:line-through;text-decoration-color:var(--dim2)}
.trow .swatch{width:3px;align-self:stretch;border-radius:3px;background:var(--acc);flex:0 0 auto}
.trow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.trow .nm small{display:block;font-size:10px;color:var(--dim2);font-family:var(--f1);letter-spacing:.1em}
.chk{width:26px;height:26px;flex:0 0 auto;border:1px solid var(--line2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:.12s}
.chk:hover{border-color:var(--acc);color:var(--acc-d)}
.chk.on{background:linear-gradient(180deg,#16303a,#0f2028);border-color:var(--acc);color:var(--acc)}
.streak{font-family:var(--f1);font-size:13px;color:var(--warn);letter-spacing:.04em;min-width:44px;text-align:right}
.streak.zero{color:var(--dim2)}
.wkbar{width:74px;height:5px;border-radius:4px;background:#182330;overflow:hidden;flex:0 0 auto}
.wkbar i{display:block;height:100%;background:var(--acc)}

/* grid */
.gridwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:0;text-align:center}
th.h{text-align:left;padding-right:10px;width:190px}
thead th{font-family:var(--f1);font-size:9px;letter-spacing:.08em;color:var(--dim2);font-weight:500;padding-bottom:6px}
thead th.tod{color:var(--acc)}
tbody tr{border-top:1px solid #16202c}
td.h{text-align:left;padding:5px 10px 5px 0;font-size:12.5px;cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.h:hover{color:var(--acc)}
td.h small{display:block;font-size:9px;color:var(--dim2);font-family:var(--f1);letter-spacing:.1em}
.cell{width:17px;height:17px;border-radius:5px;background:#131c26;border:1px solid #1b2632;display:inline-block;cursor:pointer}
.cell:hover{border-color:var(--acc)}
.cell.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 6px rgba(126,232,250,.35)}
.cell.na{background:#0d131a;border-color:#141d27;cursor:default}
.cell.na:hover{border-color:#141d27}
.cell.miss{background:#170f16;border-color:#2a1a24}
.cell.fut{opacity:.2;cursor:default}
td.st{font-family:var(--f1);font-size:12px;color:var(--warn);width:46px;text-align:right}
td.st.zero{color:var(--dim2)}

/* library */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:20px;background:var(--panel2);padding:4px 11px;font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip b{font-family:var(--f1);font-size:10px;color:var(--acc);opacity:.7}
.chip small{color:var(--dim2);font-size:9px;font-family:var(--f1);letter-spacing:.08em}

/* modal */
#veil{position:fixed;inset:0;background:rgba(4,7,11,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50}
#veil.on{display:flex}
.modal{width:min(460px,92vw);border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,#101822,#0b1119);padding:18px;box-shadow:0 30px 80px -30px #000}
.modal h3{font-family:var(--f1);font-size:13px;letter-spacing:.18em;color:var(--acc);margin-bottom:14px}
.f{margin-bottom:13px}
.f label{display:block;font-family:var(--f1);font-size:10px;letter-spacing:.14em;color:var(--dim2);margin-bottom:5px}
.f input[type=text],.f select{width:100%;background:#0a1018;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--txt)}
.f input[type=text]:focus,.f select:focus{outline:0;border-color:var(--acc)}
.days{display:flex;gap:5px}
.days button{width:32px;height:30px;border:1px solid var(--line);border-radius:7px;font-family:var(--f1);font-size:11px;color:var(--dim)}
.days button.on{border-color:var(--acc);color:var(--acc);background:#0f2028}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:24px;height:24px;border-radius:7px;border:2px solid transparent}
.swatches button.on{border-color:#fff}
.mfoot{display:flex;gap:8px;margin-top:16px}
.mfoot .spacer{flex:1}
.btn{padding:7px 15px;border:1px solid var(--line2);border-radius:8px;font-family:var(--f1);font-size:11px;letter-spacing:.1em;color:var(--dim)}
.btn:hover{color:var(--txt);border-color:var(--dim2)}
.btn.go{border-color:var(--acc);color:var(--acc);background:#0f2028}
.btn.del{border-color:#3a1f28;color:var(--bad)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#0d1620;border:1px solid var(--line2);border-radius:9px;padding:9px 15px;font-size:12px;transition:.22s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{color:var(--acc)}
.note{font-size:11px;color:var(--dim2);line-height:1.6;margin-top:10px}
.note b{color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">◎ HABIT<b>S</b></div>
    <div class="views" id="views"></div>
    <div class="spacer"></div>
    <button class="hbtn acc" id="btnNew">+ HABIT</button>
    <button class="hbtn" id="btnHome" title="back to LifeOS">◈</button>
  </header>
  <main><div class="wrapper" id="main"></div></main>
</div>
<div id="veil"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="../shared/day.js"></script>
<script src="../shared/records.js"></script>
<script>
/* ══════════════════════════ LIFEOS KERNEL v2 ══════════════════════════
   Identical in every app that shares data — edit the copy in index.html and
   re-run the sync script.

   v1 kept the shared state as ONE JSON blob and broadcast it whole, with the
   shell as the single writer and a postMessage broker underneath. That is the
   shape the brief forbids and the shape SystemOS died of, so v2 is a thin view
   over `shared/records.js` instead:

     activities → one `activity` row each
     habits     → one `habit` row each
     ticks      → one `tick` row per activity per day
     today      → one dated `plan` row, published by whoever owns the schedule

   Every app now writes directly. There is no broker and no hosted/solo split,
   because every app on this origin reads and writes the same rows. What remains
   is a nudge: frames opened from a folder do not reliably get storage events, so
   a writer tells its neighbours to look again. It sends no data.

   The API is unchanged from v1 on purpose — the apps did not have to move.

   Load order in the page, before this block:
     shared/day.js  then  shared/records.js
   (written without tags on purpose: a literal closing script tag inside an
    inline script ends the script element, even inside a comment)
                                                                            */
window.LifeOS = (function () {
  if (!window.Rec || !window.Day) {
    console.error('[lifeos] records.js and day.js must load first');
    return { broken: 1, ready: function () {}, on: function () { return function () {}; },
             doc: function () { return { activities: {}, habits: {}, log: {}, today: null }; },
             isDone: function () { return false; }, dayLog: function () { return {}; },
             done: function () { return Promise.resolve(); }, acts: function () { return Promise.resolve(); } };
  }

  const HOSTED = (function () { try { return !!(window.parent && window.parent !== window); } catch (e) { return false; } })();
  let doc = null, subs = [], booted = false, bootQ = [];

  /* ─── the view: rows assembled into the shape the apps already expect ─── */
  function build() {
    const d = { v: 2, ts: Date.now(), activities: {}, habits: {}, log: {}, today: null };
    Rec.all('activity').forEach(r => { d.activities[r.key] = Object.assign({ id: r.key }, r.payload); });
    Rec.all('habit').forEach(r => { d.habits[r.key] = Object.assign({ id: r.key }, r.payload); });
    /* the row carries the time now, but callers still expect payload.ts */
    Rec.all('tick').forEach(r => {
      (d.log[r.date] || (d.log[r.date] = {}))[r.key] =
        Object.assign({ ts: Date.parse(r.updated_at) || 0 }, r.payload);
    });
    d.today = Rec.get('plan', Day.today(), 'routine');
    return d;
  }
  function refresh() {
    doc = build();
    if (!booted) { booted = true; bootQ.splice(0).forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } }); }
    subs.forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } });
  }

  /* ─── neighbours ───
     Same storage, but a frame loaded from a folder may never see the storage
     event. A write pokes everyone else; they re-read for themselves. */
  function poke() {
    const msg = { lifeos: 2, poke: 1 };
    try { if (HOSTED) window.parent.postMessage(msg, '*'); } catch (e) {}
    document.querySelectorAll('iframe').forEach(f => { try { f.contentWindow.postMessage(msg, '*'); } catch (e) {} });
  }
  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || m.lifeos !== 2 || !m.poke) return;
    Rec.reload();
    /* pass it on once, so a frame's sibling hears about it too */
    if (!m.relay) {
      const on = { lifeos: 2, poke: 1, relay: 1 };
      try { if (HOSTED && e.source !== window.parent) window.parent.postMessage(on, '*'); } catch (err) {}
      document.querySelectorAll('iframe').forEach(f => { try { if (f.contentWindow !== e.source) f.contentWindow.postMessage(on, '*'); } catch (err) {} });
    }
  });
  const wrote = v => { poke(); return Promise.resolve(v); };

  /* ─── one-time move off the v1 blob ───
     Copies, never moves: `lifeos_v1` is left exactly where it is, so the old
     data is its own backup if anything here is wrong. */
  function migrate() {
    if (Rec.setting('lifeos', 'migrated')) return 0;
    let old = null;
    try { old = JSON.parse(localStorage.getItem('lifeos_v1')); } catch (e) {}
    let n = 0;
    if (old && old.v) {
      Object.keys(old.activities || {}).forEach(id => {
        const a = old.activities[id];
        Rec.set('activity', null, id, { name: a.name, cat: a.cat || '', dur: a.dur || 0, color: a.color || '', energy: a.energy || 2 }); n++;
      });
      Object.keys(old.habits || {}).forEach(id => { Rec.set('habit', null, id, old.habits[id]); n++; });
      Object.keys(old.log || {}).forEach(date => {
        const day = old.log[date] || {};
        Object.keys(day).forEach(k => { Rec.set('tick', date, k, day[k]); n++; });
      });
      console.info('[lifeos] moved ' + n + ' things off the old blob; lifeos_v1 left in place as a backup');
    }
    Rec.setting('lifeos', 'migrated', new Date().toISOString());
    return n;
  }

  const API = {
    v: 2,
    hosted: HOSTED,
    day: d => Day.of(d), slug: s => Day && String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x',
    shift: (date, n) => Day.shift(date, n),
    ready(fn) { booted ? fn(doc) : bootQ.push(fn); },
    doc: () => doc || (doc = build()),
    on(f) { subs.push(f); if (booted) f(doc); return () => { const i = subs.indexOf(f); if (i > -1) subs.splice(i, 1); }; },

    /** upsert activities — the shared vocabulary */
    acts(list) {
      (list || []).forEach(a => {
        if (!a || !a.name) return;
        const id = a.id || API.slug(a.name);
        const prev = doc.activities[id] || {};
        Rec.set('activity', null, id, Object.assign({ name: a.name, cat: '', dur: 0, color: '', energy: 2 }, prev, a, { id: undefined }));
      });
      return wrote(doc);
    },
    act: id => (doc.activities[id] || null),

    /** the one tick, everywhere. One row: one activity, one day. */
    done(actId, date, on, meta) {
      if (!actId) return Promise.resolve(doc);
      const d = date || Day.today();
      if (on === false) Rec.del('tick', d, actId);
      else Rec.set('tick', d, actId, Object.assign({ src: '?' }, meta || {}));
      return wrote(doc);
    },
    isDone: (actId, date) => Rec.has('tick', date || Day.today(), actId),
    dayLog: date => (doc.log[date || Day.today()] || {}),

    habit(h) { if (!h || !h.id) return Promise.resolve(doc); Rec.set('habit', null, h.id, Object.assign({ created: Day.today(), archived: false, cadence: { type: 'daily', days: [1, 1, 1, 1, 1, 1, 1], target: 7 } }, doc.habits[h.id], h)); return wrote(doc); },
    habitDel(id) { Rec.del('habit', null, id); return wrote(doc); },

    /** whoever owns the schedule publishes today's plan for everyone else */
    publishToday(t) { if (t && t.date) Rec.set('plan', t.date, 'routine', t); return wrote(doc); },

    /** local-only housekeeping: really drop ancient ticks, no tombstones */
    prune(days) { return Rec.purge('tick', Day.shift(Day.today(), -(days || 800))); },

    /** consecutive due-days ending today (today still counts as open, not broken) */
    streak(actId, cadence) {
      const due = d => (!cadence || cadence.type !== 'days') ? true : !!cadence.days[Day.dow(d)];
      let n = 0, d = Day.today(), guard = 0;
      if (!API.isDone(actId, d)) d = Day.shift(d, -1);
      while (guard++ < 900) {
        if (!due(d)) { d = Day.shift(d, -1); continue; }
        if (!API.isDone(actId, d)) break;
        n++; d = Day.shift(d, -1);
      }
      return n;
    },
    count(actId, n) {
      let c = 0, d = Day.today();
      for (let i = 0; i < (n || 30); i++) { if (API.isDone(actId, d)) c++; d = Day.shift(d, -1); }
      return c;
    },

    /** rows persist themselves; kept so v1 callers do not break */
    get persist() { return null; }, set persist(f) {},
    /** restore path: a v1-shaped doc becomes rows */
    _adopt(d) {
      d = d || {};
      Object.keys(d.activities || {}).forEach(id => Rec.set('activity', null, id, d.activities[id]));
      Object.keys(d.habits || {}).forEach(id => Rec.set('habit', null, id, d.habits[id]));
      Object.keys(d.log || {}).forEach(date => Object.keys(d.log[date]).forEach(k => Rec.set('tick', date, k, d.log[date][k])));
      if (d.today && d.today.date) Rec.set('plan', d.today.date, 'routine', d.today);
      poke(); refresh();
    },
    rows: () => Rec,
  };

  Rec.on(refresh);
  migrate();
  refresh();
  return API;
})();
/* ════════════════════════ END LIFEOS KERNEL ════════════════════════ */





/* ══════════════ HABITS ══════════════
   This app owns nothing. Habits, ticks and the activity vocabulary all live in
   the shared LifeOS doc, which is why a block checked off in BLOCK shows up
   here as a completed day, and vice versa. */
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const DLET = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const PAL = ['#7ee8fa', '#a78bfa', '#6ee7a8', '#ffb347', '#ff6b81', '#f472b6', '#60a5fa', '#facc15'];
let view = localStorage.getItem('habits_view') || 'today';
let toastT;
function toast(h) { const t = $('#toast'); t.innerHTML = h; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

const habits = () => Object.values(LifeOS.doc().habits).filter(h => !h.archived).sort((a, b) => (a.ord || 0) - (b.ord || 0) || (a.name || '').localeCompare(b.name || ''));
const isDue = (h, date) => h.cadence.type !== 'days' || !!h.cadence.days[new Date(date + 'T12:00:00').getDay()];
function cadenceText(c) {
  if (!c) return 'daily';
  if (c.type === 'week') return (c.target || 1) + '× a week';
  if (c.type === 'days') {
    const on = c.days.map((d, i) => d ? i : -1).filter(i => i >= 0);
    if (!on.length) return 'never';
    if (on.length === 7) return 'daily';
    if (on.join() === '1,2,3,4,5') return 'weekdays';
    if (on.join() === '0,6') return 'weekends';
    return on.map(i => DLET[i]).join('');
  }
  return 'daily';
}
/** done in the last 7 days — the honest denominator for "N× a week" habits */
const weekCount = h => LifeOS.count(h.actId, 7);
function best(h) {
  const log = LifeOS.doc().log, dates = Object.keys(log).filter(d => log[d][h.actId]).sort();
  let run = 0, top = 0, prev = null;
  dates.forEach(d => {
    if (prev && LifeOS.shift(prev, 1) === d) run++; else run = 1;
    prev = d; if (run > top) top = run;
  });
  return top;
}

/* ══════════════ views ══════════════ */
function draw() {
  const m = $('#main'); m.innerHTML = '';
  $('#views').innerHTML = '';
  [['today', 'TODAY'], ['grid', 'GRID'], ['stats', 'STATS']].forEach(([id, nm]) => {
    const b = el('button', view === id ? 'on' : '', nm);
    b.onclick = () => { view = id; localStorage.setItem('habits_view', id); draw(); };
    $('#views').appendChild(b);
  });
  (view === 'today' ? drawToday : view === 'grid' ? drawGrid : drawStats)(m);
  drawLibrary(m);
}

function drawToday(m) {
  const today = LifeOS.day(), all = habits(), due = all.filter(h => isDue(h, today));
  const done = due.filter(h => LifeOS.isDone(h.actId, today)).length;
  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'TODAY<span class="sub">' + (due.length ? done + ' of ' + due.length + ' done' : 'nothing due') + '</span>'));
  if (!all.length) {
    c.appendChild(el('div', 'empty', 'No habits yet. Hit <b>+ HABIT</b>, or pick something you already do out of the routine library below — it keeps the ticks you have already made in BLOCK.'));
  } else if (!due.length) {
    c.appendChild(el('div', 'empty', 'Nothing is due today. Rest is part of the cadence.'));
  }
  due.forEach(h => {
    const on = LifeOS.isDone(h.actId, today), sk = LifeOS.streak(h.actId, h.cadence);
    const r = el('div', 'trow' + (on ? ' on' : ''));
    const sw = el('div', 'swatch'); sw.style.background = h.color || PAL[0]; r.appendChild(sw);
    const nm = el('div', 'nm', esc(h.name) + '<small>' + esc(cadenceText(h.cadence)) + (h.cadence.type === 'week' ? ' · ' + weekCount(h) + '/' + (h.cadence.target || 1) + ' this week' : '') + '</small>');
    nm.onclick = () => edit(h.id); r.appendChild(nm);
    if (h.cadence.type === 'week') {
      const b = el('div', 'wkbar'); b.appendChild(el('i')).style.width = Math.min(100, weekCount(h) / (h.cadence.target || 1) * 100) + '%'; r.appendChild(b);
    }
    r.appendChild(el('div', 'streak' + (sk ? '' : ' zero'), sk ? '▲ ' + sk : '—'));
    const ck = el('button', 'chk' + (on ? ' on' : ''), '✓');
    ck.title = on ? 'undo' : 'done today';
    ck.onclick = () => LifeOS.done(h.actId, today, !on, { src: 'habits', habitId: h.id });
    r.appendChild(ck);
    c.appendChild(r);
  });
  m.appendChild(c);
}

function drawGrid(m) {
  const DAYS = 28, today = LifeOS.day(), all = habits();
  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'GRID<span class="sub">last ' + DAYS + ' days — click any square to fix the record</span>'));
  if (!all.length) { c.appendChild(el('div', 'empty', 'Nothing to show yet.')); m.appendChild(c); return; }
  const wrap = el('div', 'gridwrap'), t = el('table');
  const dates = []; for (let i = DAYS - 1; i >= 0; i--) dates.push(LifeOS.shift(today, -i));
  const thead = el('thead'), htr = el('tr');
  htr.appendChild(el('th', 'h'));
  dates.forEach(d => {
    const wd = new Date(d + 'T12:00:00');
    htr.appendChild(el('th', d === today ? 'tod' : '', DLET[wd.getDay()] + '<br>' + wd.getDate()));
  });
  htr.appendChild(el('th', null, '▲'));
  thead.appendChild(htr); t.appendChild(thead);
  const tb = el('tbody');
  all.forEach(h => {
    const tr = el('tr');
    const hd = el('td', 'h', esc(h.name) + '<small>' + esc(cadenceText(h.cadence)) + '</small>');
    hd.style.borderLeft = '3px solid ' + (h.color || PAL[0]); hd.style.paddingLeft = '8px';
    hd.onclick = () => edit(h.id); tr.appendChild(hd);
    dates.forEach(d => {
      const td = el('td'), on = LifeOS.isDone(h.actId, d), due = isDue(h, d), fut = d > today;
      const cell = el('span', 'cell' + (on ? ' on' : due ? (d < today ? ' miss' : '') : ' na') + (fut ? ' fut' : ''));
      if (on) cell.style.background = h.color || PAL[0], cell.style.borderColor = h.color || PAL[0];
      cell.title = d + (on ? ' — done' : due ? ' — open' : ' — not due');
      if (!fut) cell.onclick = () => LifeOS.done(h.actId, d, !on, { src: 'habits', habitId: h.id });
      td.appendChild(cell); tr.appendChild(td);
    });
    const sk = LifeOS.streak(h.actId, h.cadence);
    tr.appendChild(el('td', 'st' + (sk ? '' : ' zero'), sk || '—'));
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); c.appendChild(wrap); m.appendChild(c);
}

function drawStats(m) {
  const all = habits(), c = el('div', 'card');
  c.appendChild(el('h2', null, 'STATS<span class="sub">30-day window</span>'));
  if (!all.length) { c.appendChild(el('div', 'empty', 'Nothing to measure yet.')); m.appendChild(c); return; }
  const wrap = el('div', 'gridwrap'), t = el('table');
  t.innerHTML = '<thead><tr><th class="h">HABIT</th><th>CADENCE</th><th>30 DAYS</th><th>RATE</th><th>STREAK</th><th>BEST</th></tr></thead>';
  const tb = el('tbody');
  all.forEach(h => {
    const n30 = LifeOS.count(h.actId, 30);
    let expect = 30;
    if (h.cadence.type === 'days') expect = Math.round(30 / 7 * h.cadence.days.filter(Boolean).length);
    if (h.cadence.type === 'week') expect = Math.round(30 / 7 * (h.cadence.target || 1));
    const rate = expect ? Math.round(n30 / expect * 100) : 0;
    const tr = el('tr');
    const hd = el('td', 'h', esc(h.name)); hd.onclick = () => edit(h.id);
    hd.style.borderLeft = '3px solid ' + (h.color || PAL[0]); hd.style.paddingLeft = '8px';
    tr.appendChild(hd);
    tr.appendChild(el('td', null, '<span style="color:var(--dim2);font-size:11px">' + esc(cadenceText(h.cadence)) + '</span>'));
    tr.appendChild(el('td', null, n30 + ' <span style="color:var(--dim2);font-size:10px">/ ' + expect + '</span>'));
    tr.appendChild(el('td', null, '<span style="color:' + (rate >= 80 ? 'var(--good)' : rate >= 50 ? 'var(--warn)' : 'var(--bad)') + '">' + rate + '%</span>'));
    tr.appendChild(el('td', 'st', LifeOS.streak(h.actId, h.cadence) || '—'));
    tr.appendChild(el('td', 'st', best(h) || '—'));
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); c.appendChild(wrap); m.appendChild(c);
}

/** everything BLOCK knows how to do, minus what is already a habit */
function drawLibrary(m) {
  const taken = {}; habits().forEach(h => taken[h.actId] = 1);
  const acts = Object.values(LifeOS.doc().activities).filter(a => !taken[a.id]).sort((a, b) => (a.cat || '').localeCompare(b.cat || '') || a.name.localeCompare(b.name));
  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'FROM YOUR ROUTINE<span class="sub">' + acts.length + ' things BLOCK knows about</span>'));
  if (!acts.length) {
    c.appendChild(el('div', 'empty', 'Nothing left to promote. Open <b>BLOCK</b> and its library shows up here automatically.'));
  } else {
    const ch = el('div', 'chips');
    acts.slice(0, 80).forEach(a => {
      const b = el('button', 'chip', '<b>+</b>' + esc(a.name) + (a.cat ? '<small>' + esc(a.cat.toUpperCase()) + '</small>' : ''));
      b.title = 'track ' + a.name + ' as a habit — past ticks count immediately';
      b.onclick = () => {
        LifeOS.habit({ id: uid(), actId: a.id, name: a.name, color: a.color || PAL[0], cadence: { type: 'daily', days: [1, 1, 1, 1, 1, 1, 1], target: 7 }, ord: habits().length });
        toast('<b>' + esc(a.name) + '</b> is now a habit');
      };
      ch.appendChild(b);
    });
    c.appendChild(ch);
  }
  c.appendChild(el('div', 'note', 'Habits and routine blocks are the <b>same tick</b>: check a block in BLOCK and the day fills in here; fill a day in here and BLOCK shows it checked.'));
  m.appendChild(c);
}

/* ══════════════ editor ══════════════ */
function edit(id) {
  const h = id ? LifeOS.doc().habits[id] : null;
  const draft = h ? JSON.parse(JSON.stringify(h))
    : { id: uid(), name: '', actId: '', color: PAL[0], cadence: { type: 'daily', days: [1, 1, 1, 1, 1, 1, 1], target: 7 }, ord: habits().length };
  const mo = $('#modal');
  function paint() {
    mo.innerHTML = '';
    mo.appendChild(el('h3', null, h ? 'EDIT HABIT' : 'NEW HABIT'));

    const f1 = el('div', 'f', '<label>NAME</label>');
    const inp = el('input'); inp.type = 'text'; inp.value = draft.name; inp.placeholder = 'Cold shower';
    inp.oninput = () => draft.name = inp.value;
    inp.onkeydown = e => { if (e.key === 'Enter') commit(); };
    f1.appendChild(inp); mo.appendChild(f1);

    const f2 = el('div', 'f', '<label>CADENCE</label>');
    const sel = el('select');
    [['daily', 'every day'], ['days', 'certain days'], ['week', 'N times a week']].forEach(([v, t]) => {
      const o = el('option', null, t); o.value = v; if (draft.cadence.type === v) o.selected = true; sel.appendChild(o);
    });
    sel.onchange = () => { draft.cadence.type = sel.value; paint(); };
    f2.appendChild(sel);
    if (draft.cadence.type === 'days') {
      const d = el('div', 'days'); d.style.marginTop = '9px';
      DLET.forEach((L, i) => {
        const b = el('button', draft.cadence.days[i] ? 'on' : '', L);
        b.onclick = () => { draft.cadence.days[i] = draft.cadence.days[i] ? 0 : 1; paint(); };
        d.appendChild(b);
      });
      f2.appendChild(d);
    }
    if (draft.cadence.type === 'week') {
      const d = el('div', 'days'); d.style.marginTop = '9px';
      [1, 2, 3, 4, 5, 6, 7].forEach(n => {
        const b = el('button', draft.cadence.target === n ? 'on' : '', String(n));
        b.onclick = () => { draft.cadence.target = n; paint(); };
        d.appendChild(b);
      });
      f2.appendChild(d);
    }
    mo.appendChild(f2);

    const f3 = el('div', 'f', '<label>COLOUR</label>');
    const sw = el('div', 'swatches');
    PAL.forEach(c => { const b = el('button', draft.color === c ? 'on' : ''); b.style.background = c; b.onclick = () => { draft.color = c; paint(); }; sw.appendChild(b); });
    f3.appendChild(sw); mo.appendChild(f3);

    if (draft.actId) mo.appendChild(el('div', 'note', 'Linked to <b>' + esc(draft.actId) + '</b> — the same tick as the routine block with that name.'));

    const ft = el('div', 'mfoot');
    if (h) { const d = el('button', 'btn del', 'DELETE'); d.onclick = () => { if (confirm('Delete "' + h.name + '"? The tick history stays in the log.')) { LifeOS.habitDel(h.id); close(); } }; ft.appendChild(d); }
    ft.appendChild(el('div', 'spacer'));
    const cn = el('button', 'btn', 'CANCEL'); cn.onclick = close; ft.appendChild(cn);
    const ok = el('button', 'btn go', h ? 'SAVE' : 'CREATE'); ok.onclick = commit; ft.appendChild(ok);
    mo.appendChild(ft);
    setTimeout(() => inp.focus(), 30);
  }
  function commit() {
    draft.name = (draft.name || '').trim();
    if (!draft.name) return toast('needs a name');
    /* the link to the rest of LifeOS: a habit IS an activity, keyed by its name */
    if (!draft.actId) draft.actId = LifeOS.slug(draft.name);
    LifeOS.acts([{ id: draft.actId, name: draft.name, color: draft.color, cat: 'habit' }]);
    LifeOS.habit(draft);
    close(); toast(h ? 'saved' : '<b>' + esc(draft.name) + '</b> added');
  }
  function close() { $('#veil').classList.remove('on'); }
  paint(); $('#veil').classList.add('on');
}
$('#veil').onclick = e => { if (e.target.id === 'veil') $('#veil').classList.remove('on'); };
$('#btnNew').onclick = () => edit(null);
$('#btnHome').onclick = () => { if (LifeOS.hosted) parent.postMessage({ lifeos: 1, nav: 'home' }, '*'); else location.href = '../index.html'; };
window.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); edit(null); }
  if (e.key === 'Escape') $('#veil').classList.remove('on');
});

LifeOS.on(draw);
LifeOS.ready(draw);
</script>
