    h.reset();
    return s.querySelector('.n').textContent === 'big' && parseFloat(s.querySelector('.t i').style.width) === 100 &&
      moved && h.el.querySelector('.v').textContent === '82.1' && h.el.querySelector('.d').textContent === 'down 1';
  })());

  ok('chart: it names no colours of its own', (() => {
    const c = Chart.make({ w: 100, h: 60 });
    c.yFit([0, 1]); c.grid(); c.line([[0, 0], [1, 1]]);
    /* Every mark carries a class and no fill or stroke attribute, so the theme
       is the only thing that can colour it. */
    const marks = c.el.querySelectorAll('path, line, circle, rect');
    for (let i = 0; i < marks.length; i++) {
      if (marks[i].getAttribute('fill') || marks[i].getAttribute('stroke')) return false;
      if (!marks[i].getAttribute('class')) return false;
    }
    return marks.length > 0;
  })());

  /* ---- the personal sync code, out of whatever was pasted ----

     Nobody pastes a bare link. It comes out of Telegram with the message
     around it, off Google with a newline, or in quotes, and the box used to
     answer "that is not your sync code" to somebody holding the right thing.
     One level under every one of those: is the code found inside the paste. */
  ok('sync code: a bare link is itself',
    IO.mirror.code('https://script.google.com/macros/s/AKfy123/exec') === 'https://script.google.com/macros/s/AKfy123/exec');
  ok('sync code: found inside a pasted message',
    IO.mirror.code('here you go mate https://script.google.com/macros/s/AKfy123/exec that is it')
      === 'https://script.google.com/macros/s/AKfy123/exec');
  ok('sync code: newlines and spaces around it come off',
    IO.mirror.code('\n  https://script.google.com/macros/s/AKfy123/exec  \n')
      === 'https://script.google.com/macros/s/AKfy123/exec');
  ok('sync code: quotes are not part of it',
    IO.mirror.code('"https://script.google.com/macros/s/AKfy123/exec"')
      === 'https://script.google.com/macros/s/AKfy123/exec');
  ok('sync code: a /dev link is not taken for one',
    IO.mirror.code('https://script.google.com/macros/s/AKfy123/dev') === '',
    'it only works while the person is signed in, and fault() already says so');
  ok('sync code: nothing in, nothing out',
    IO.mirror.code('') === '' && IO.mirror.code(null) === '' && IO.mirror.code('just talking') === '');

  /* ---- one reader for a tracked measure ----

     Three apps carried their own copy of "what is this field's number for
     this day", and the home screen's copy had lost SUM and had never counted
     a measure that comes off a food label. The checks that matter are the
     mechanism, not any one app's screen: the rule, the half-life sum, and
     whether food is counted at all. If those hold, the three apps agree
     because they now ask the same function. */
  const mf = id => ({ id: id, label: id, agg: null });
  ok('measure: with no rule, the day is the latest reading',
    Measure.dayValue(mf('m'), [{ t: 1, v: 70 }, { t: 2, v: 71.4 }]) === 71.4);
  ok('measure: a summed field adds its readings up',
    Measure.dayValue({ id: 'w', agg: 'sum' }, [{ t: 1, v: 2 }, { t: 2, v: 3 }, { t: 3, v: 5 }]) === 10);
  ok('measure: an averaged field averages them',
    Measure.dayValue({ id: 'mood', agg: 'avg' }, [{ t: 1, v: 3 }, { t: 2, v: 5 }]) === 4);
  ok('measure: nothing logged is nothing, not zero',
    Measure.dayValue(mf('m'), []) === null,
    'a zero would be a reading nobody took');
  ok('measure: one half-life leaves half the dose',
    Math.abs(Measure.decay([{ t: 0, v: 200 }], 5, 5 * 3600000) - 100) < 0.001);
  ok('measure: a dose not taken yet is not in you',
    Measure.decay([{ t: 10 * 3600000, v: 200 }], 5, 0) === 0);
  ok('measure: a five hour half-life reaches back two days',
    Measure.span(5) === 2);

  /* The bug itself, one level under the screen it showed on: a field fed by
     a food label, summed. Typed 50, ate 80, and the answer is 130 rather than
     the last one of them. Rows go in and come straight back out. */
  (() => {
    const fid = '__smoke_caf', today = Day.today();
    Rec.set('field', null, fid, { id: fid, label: 'Smoke caffeine', agg: 'sum', from: 'caff', per: 1, half: 5 });
    Rec.set('ev', today, fid, { e: [{ t: Date.parse(today + 'T08:00:00'), v: 50 }] });
    Rec.set('meal', today, '__smoke_meal', { t: Date.parse(today + 'T13:00:00'), name: 'Smoke coffee', caff: 80 });
    ok('measure: a field fed by food counts the meal',
      Measure.entries(today, fid).length === 2);
    ok('measure: a summed field fed by food totals both',
      Measure.value(today, fid) === 130,
      'the home screen answered 50 here, because its own copy had no sum and no food');
    ok('measure: what is left decays from both',
      Measure.remaining(today, fid, Date.parse(today + 'T18:00:00')) < 130);
    Rec.del('field', null, fid); Rec.del('ev', today, fid); Rec.del('meal', today, '__smoke_meal');
    ok('measure: its own rows are gone again',
      !Rec.row('field', null, fid) || Rec.row('field', null, fid).deleted);
  })();

  /* ---- clean up after ourselves ---- */
  Rec.clear([stamp]);
  Rec.del('tick', d, 'smoke-run'); Rec.del('activity', null, 'smoke-run');
  /* The settings these checks wrote. They are real `setting` rows under a
     made-up namespace, so clearing the made-up TYPE never touched them and
     they sat in storage forever. */
  Rec.all('setting').forEach(r => {
    if (/^(smoke|__smoke|__sk|__tbl)\./.test(r.key)) Rec.del('setting', r.date, r.key);
  });
  Rec.vacuum(0);
  ok('cleanup: smoke rows removed', Rec.all(stamp).length === 0);

  /* ── the second sweep, and why it is here ──
     Something in this file writes a few stamp rows AFTER the line above. An
     async check landing late, most likely. They were building up about a dozen
     a run in the browser of anyone who opened this page, which is not
     dangerous - a made-up type no app reads, a few kilobytes - but it is mess
     in his storage and mess is how real problems get missed.

     Rec.clear is not at fault and that was measured rather than assumed: called
     by hand it removes a row from memory, from localStorage and from
     IndexedDB, all three. So this sweeps again once everything has settled.

     `_review.html` fails if test rows are still piling up, so this cannot go
     quiet on its own while the late writer is still unfound. */
  setTimeout(() => {
    const late = Rec.all(stamp).length;
    if (late) Rec.clear([stamp]);
  }, 1500);
  document.querySelectorAll('.mb-sheet,.mb-veil').forEach(n => n.remove());
  ok('cleanup: no overlay left on the page', !document.querySelector('.mb-sheet,.mb-veil'));

  /* ---- cloud: the second sync ----

     Nobody here has Tom's Firebase project, so none of this talks to a
     database. What it checks is the part that does not need one and is the
     part that goes wrong quietly: the key encoding, reading the config he
     pastes, and where the push boundary lands. */
  const CROW = (id, at, pay) => ({ id: id, type: 'x', date: null, key: 'k', updated_at: at, payload: pay });

  ok('cloud: it loaded and io.js exposes its settings row',
    !!window.Cloud && typeof IO.cloudRow === 'function');

  /* A setting's key is `appid.name`, so a dot in a row id is the normal case,
     not the odd one, and a dot is illegal in a database key. */
  ok('cloud: a row id with a dot round-trips through the key encoding', () => {
    const id = 'local|setting||status.countCals';
    return Cloud._dec(Cloud._enc(id)) === id;
  });
  ok('cloud: an encoded key carries nothing the database forbids', () => {
    const k = Cloud._enc('local|setting||a.b$c#d[e]f/g');
    return !/[.$#\[\]\/]/.test(k) && Cloud._dec(k) === 'local|setting||a.b$c#d[e]f/g';
  });

  /* Firebase hands him JavaScript, not JSON. Both have to read. */
  ok('cloud: the config block Firebase gives you is read as pasted', () => {
    const c = Cloud._parse([
      'const firebaseConfig = {',
      '  apiKey: "AIzaSyTEST",',
      '  authDomain: "mb.firebaseapp.com",',
      '  databaseURL: "https://mb-default-rtdb.firebaseio.com",',
      '  projectId: "mb"',
      '};'].join('\n'));
    return c && c.apiKey === 'AIzaSyTEST' && c.projectId === 'mb' && Cloud._missing(c) === '';
  });
  ok('cloud: plain JSON is read too', () => {
    const c = Cloud._parse('{"apiKey":"k","authDomain":"a","databaseURL":"d"}');
    return c && c.apiKey === 'k' && Cloud._missing(c) === '';
  });
  /* The one that actually catches people: databaseURL is absent from the
     config block until the Realtime Database exists. */
  ok('cloud: a config with no databaseURL is refused, and says which', () => {
    const c = Cloud._parse('{"apiKey":"k","authDomain":"a"}');
    return /databaseURL/.test(Cloud._missing(c));
  });
  ok('cloud: something that is not a config at all is refused',
    () => !!Cloud._missing(Cloud._parse('hello')));
  /* 2026-09-24: two test rows dated 2999 synced, every device's boundary
     followed them, and nothing synced anywhere after. A row stamped in the
     future is not sent and never moves the boundary. */
  ok('live sync: a row stamped in the future is not sent and does not move the boundary', () => {
    const now = new Date().toISOString();
    const p = Cloud._plan([
      { id: 'a', updated_at: now },
      { id: 'b', updated_at: '2999-01-01T00:00:00.000Z' },
    ], '', 'u/x/rows/');
    return p.sent === 1 && p.edge === now && p.skipped === 1;
  });

  /* ── the boundary, which is the whole ball game ──

     A row too big to send must still be PASSED by the boundary. If it is not,
     the first check-in photo jams the sync and every bullet written after it
     silently never leaves the device. This is the check one level under that
     bug: it asks where the edge landed, not whether a photo arrived. */
  ok('cloud: an oversized row is skipped and the boundary still passes it', () => {
    const small = CROW('local|note||a', '2026-01-01T00:00:01.000Z', { t: 'hi' });
    const huge  = CROW('local|cphoto|2026-01-01|front', '2026-01-01T00:00:02.000Z',
      { img: new Array(Cloud._big + 500).join('x') });
    const p = Cloud._plan([small, huge], '', 'u/u1/rows/');
    return p.sent === 1 && p.skipped === 1 && p.edge === '2026-01-01T00:00:02.000Z';
  });
  ok('cloud: a row that fits goes up under its encoded key', () => {
    const r = CROW('local|setting||status.x', '2026-01-02T00:00:00.000Z', { v: 1 });
    const p = Cloud._plan([r], '', 'u/u1/rows/');
    return p.patch['u/u1/rows/' + Cloud._enc(r.id)] === r && p.sent === 1 && p.skipped === 0;
  });
  ok('cloud: the boundary never goes backwards', () => {
    const r = CROW('local|note||b', '2026-01-01T00:00:00.000Z', { t: 'old' });
    return Cloud._plan([r], '2026-06-01T00:00:00.000Z', 'u/u1/rows/').edge === '2026-06-01T00:00:00.000Z';
  });

  /* Until a config is pasted this file must be inert: no state, no network. */
  ok('cloud: nothing is set up until a config is pasted', () => {
    const st = Cloud.state();
    return typeof st.has === 'boolean' && (st.has || (!st.live && !st.on));
  });

  /* 2026-09-24: both desktop programs were signed out by Google for hours and
     the row still said Live. The check one level under that: the row says
     Live ONLY when the state says connected, and says Not syncing whenever
     there is a reason. Driven with a stand-in Cloud, so it needs no account. */
  const rowSays = st => {
    const real = window.Cloud, pane = document.createElement('div');
    window.Cloud = { state: () => Object.assign({ has: true, on: true, file: false }, st), on: () => () => {} };
    try { IO.cloudRow(pane); } finally { window.Cloud = real; }
    const p = pane.querySelector('.mb-live-sync p');
    return p ? p.textContent : '';
  };
  ok('live sync row: says Live only when the database says connected', () =>
    /^Live as/.test(rowSays({ live: true, conn: true, email: 'a@b' })) &&
    !/^Live/.test(rowSays({ live: true, conn: false, email: 'a@b' })) &&
    !/^Live/.test(rowSays({ live: false, conn: false, why: 'x' })));
  ok('live sync row: a signed-out device says Not syncing and why', () =>
    /^Not syncing\. Google has signed this device out/.test(
      rowSays({ live: false, conn: false, out: true, why: 'Google has signed this device out' })));
  ok('live sync row: last synced is the last send, never the time it opened', () => {
    const t = rowSays({ live: true, conn: true, email: 'a@b', at: 'OPENED', sentAt: 'SENT' });
    return /Last sent SENT/.test(t) && !/OPENED/.test(t);
  });
  ok('live sync: the state says connected only when it is listening', () => {
    const st = Cloud.state();
    return typeof st.conn === 'boolean' && (!st.conn || st.live);
  });

  /* ── the coach shelf ──

     `send`, `waiting` and `took`, driven for real against a database held in
     this page. `Cloud._probe` swaps only the account the shelf asks for; the
     row sync never reads it. Run one after another, because they share the
     one stand-in, and it is put back in `finally` whatever happens. */
  {
    const DB = {};
    let refuse = '';
    const fakeDb = {
      ref: path => ({
        set: v => refuse ? Promise.reject(new Error(refuse))
                         : (DB[path] = JSON.parse(JSON.stringify(v)), Promise.resolve()),
        remove: () => (delete DB[path], Promise.resolve()),
        once: () => Promise.resolve({
          forEach: f => Object.keys(DB).filter(k => k.indexOf(path + '/') === 0)
            .forEach(k => f({ key: k.slice(path.length + 1), val: () => DB[k] })),
        }),
      }),
    };
    const as = (uid, email) => Cloud._probe(() => ({ uid: uid, email: email, db: fakeDb }));
    const R = {};
    try {
      as('uidA', 'a@x');
      await Cloud.send('train', { rows: [{ id: 1 }, { id: 2 }], note: 'hi' });
      R.path = Object.keys(DB).join() === 'drop/coach/uidA';
      const p = DB['drop/coach/uidA'] || {};
      R.stamp = p.kind === 'train' && p.by === 'a@x' && p.n === 2 && typeof p.data === 'string' && !!p.at;

      /* the same client sending again replaces their parcel, it does not pile up */
      await Cloud.send('train', { rows: [{ id: 3 }] });
      R.one = Object.keys(DB).length === 1 && DB['drop/coach/uidA'].n === 1;

      /* too big: refused in words, and nothing written */
      const before = JSON.stringify(DB);
      R.big = await Cloud.send('train', { rows: [], pad: new Array(2000100).join('x') })
        .then(() => false, e => /too big/.test(e.message) && JSON.stringify(DB) === before);

      /* a database refusal reads as one, not as a Firebase code */
      refuse = 'PERMISSION_DENIED: Permission denied';
      R.denied = await Cloud.send('train', { rows: [] })
        .then(() => false, e => /drop rules/.test(e.message));
      refuse = '';

      /* two more clients, one of whose parcels will not parse */
      as('uidB', 'b@x');
      await Cloud.send('train', { rows: [{ id: 9 }] });
      DB['drop/coach/uidB'].at = '2099-01-01T00:00:00.000Z';
      DB['drop/coach/uidC'] = { kind: 'train', at: '2000-01-01T00:00:00.000Z', by: 'c@x', n: 0, data: '{broken' };

      as('uidT', 't@x');
      const w = await Cloud.waiting();
      /* reading is never taking: twice over, all three are still there */
      await Cloud.waiting();
      R.read = Object.keys(DB).length === 3;
      R.order = w.map(x => x.from).join() === 'uidB,uidA,uidC';
      R.body = w[1] && w[1].body && w[1].body.rows[0].id === 3 && w[1].by === 'a@x';
      R.keep = w[2] && w[2].body === null && !!DB['drop/coach/uidC'];

      await Cloud.took('uidA');
      R.took = !DB['drop/coach/uidA'] && !!DB['drop/coach/uidB'] && !!DB['drop/coach/uidC'];

      /* the cap at its exact edge. '{"p":""}' is 8 characters, so this is
         a parcel of exactly the ceiling, and then one character over it */
      as('uidE', 'e@x');
      const edge = 2000000 - 8;
      R.capAt = await Cloud.send('x', { p: 'x'.repeat(edge) }).then(n => n === 2000000, () => false);
      R.capOver = await Cloud.send('x', { p: 'x'.repeat(edge + 1) })
        .then(() => false, e => /too big/.test(e.message) && DB['drop/coach/uidE'].data.length === 2000000);
      delete DB['drop/coach/uidE'];

      as('uidT', 't@x');
      const me = await Cloud.who();
      R.who = me.uid === 'uidT' && me.email === 't@x' && !('db' in me);

      /* All four from inside a frame, which is where TRAIN usually is. The
         row sync refuses to run in one; the shelf must not. A frame of its
         own with nothing in it but cloud.js, so nothing else can do the
         work for it. */
      const fr = document.createElement('iframe');
      fr.style.cssText = 'position:absolute;width:1px;height:1px;border:0;left:-9px';
      document.body.appendChild(fr);
      fr.contentDocument.open();
      fr.contentDocument.write('<scr' + 'ipt src="cloud.js"></scr' + 'ipt>');
      fr.contentDocument.close();
      for (let i = 0; i < 50 && !fr.contentWindow.Cloud; i++) await new Promise(r => setTimeout(r, 50));
      const FC = fr.contentWindow.Cloud;
      if (FC) {
        Object.keys(DB).forEach(k => delete DB[k]);
        FC._probe(() => ({ uid: 'uidF', email: 'f@x', db: fakeDb }));
        const sent = await FC.send('train', { rows: [{ id: 7 }] }).then(() => !!DB['drop/coach/uidF'], () => false);
        const got = await FC.waiting().then(l => l.length === 1 && l[0].body.rows[0].id === 7, () => false);
        const who = await FC.who().then(m => m.uid === 'uidF', () => false);
        const took = await FC.took('uidF').then(() => !DB['drop/coach/uidF'], () => false);
        R.frame = fr.contentWindow.top !== fr.contentWindow && sent && got && who && took;
        R.frameState = sent + ',' + got + ',' + who + ',' + took;
        FC._probe(null);
      }
      fr.remove();

      Cloud._probe(() => { throw new Error('not signed in'); });
      R.out = await Cloud.send('train', { rows: [] }).then(() => false, e => /not signed in/.test(e.message));
    } catch (e) {
      R.threw = e.message;
    } finally {
      Cloud._probe(null);
    }
    const say = R.threw ? ' — threw: ' + R.threw : '';
    ok('shelf: a client\'s send lands under their own uid and nowhere else', !!R.path, say);
    ok('shelf: the parcel carries its kind, who sent it, when, and how many rows', !!R.stamp, say);
    ok('shelf: sending again replaces the parcel instead of adding a second', !!R.one, say);
    ok('shelf: a parcel over the ceiling is refused in words and writes nothing', !!R.big, say);
    ok('shelf: a refused write says to check the drop rules', !!R.denied, say);
    ok('shelf: the coach sees every parcel, newest first', !!R.order, say);
    ok('shelf: a parcel comes back exactly as it was sent', !!R.body, say);
    ok('shelf: a parcel that will not parse is listed and left on the shelf', !!R.keep, say);
    ok('shelf: reading the shelf never clears anything from it', !!R.read, say);
    ok('shelf: a parcel of exactly the ceiling goes', !!R.capAt, say);
    ok('shelf: one character over the ceiling is refused and the old parcel stands', !!R.capOver, say);
    ok('shelf: who names the signed-in account and hands out nothing else', !!R.who, say);
    ok('shelf: send, waiting, who and took all work inside a frame', !!R.frame,
      say + (R.frameState ? ' — send,waiting,who,took: ' + R.frameState : ' — cloud.js never loaded in the frame'));
    ok('shelf: taking one parcel clears that one only', !!R.took, say);
    ok('shelf: signed out, a send refuses and says why', !!R.out, say);
  }

  /* ── installing: every app is its own app on Android and the PC ──

     Tom, 2026-09-23: every app installable from Chrome, with its own icon.
     One level under "the Install button shows the right picture": does the
     page name an install file, does that file read, and is every picture it
     names really there at the size it claims. Chrome drops an icon whose
     size is wrong without a word and falls back to a screenshot of the page.
     The app list is the one make-icons.html draws from, so an app added
     later is checked without anybody editing this. From a folder there is
     nothing to fetch, and install needs a web address anyway. */
  if (location.protocol !== 'file:') {
    const ids = Object.keys(Icons.ROLES).filter(r => r.indexOf('app.') === 0).map(r => r.slice(4));
    const bad = { link: [], parse: [], shape: [], icons: [] };
    const size = src => new Promise(res => {
      const i = new Image();
      i.onload = () => res(i.naturalWidth + 'x' + i.naturalHeight);
      i.onerror = () => res('missing');
      i.src = src + '?cb=' + Date.now();
    });
    const ids_ = {};
    for (const id of ids) {
      const dir = id === 'home' ? '../' : '../' + id + '/';
      const html = await fetch(dir + 'index.html', { cache: 'no-store' }).then(r => r.ok ? r.text() : '', () => '');
      if (!/<link rel="manifest" href="manifest\.json">/.test(html)) { bad.link.push(id); continue; }
      let m = null;
      try { m = await fetch(dir + 'manifest.json', { cache: 'no-store' }).then(r => r.json()); } catch (e) {}
      if (!m) { bad.parse.push(id); continue; }
      const kinds = (m.icons || []).map(i => i.purpose).join();
      if (!m.name || m.display !== 'standalone' || m.start_url !== './' || m.scope !== './' || !m.id ||
          !/any/.test(kinds) || !/maskable/.test(kinds)) bad.shape.push(id);
      ids_[new URL(m.id, new URL(dir, location.href)).href] = (ids_[new URL(m.id, new URL(dir, location.href)).href] || 0) + 1;
      for (const ic of m.icons || []) {
        const got = await size(dir + ic.src);
        if (got !== ic.sizes) bad.icons.push(id + ' ' + ic.src + ' is ' + got + ', says ' + ic.sizes);
      }
    }
    ok('install: every app page links its install file (' + ids.length + ' apps)', !bad.link.length, ' — none in: ' + bad.link.join(', '));
    ok('install: every install file reads', !bad.parse.length, ' — unreadable: ' + bad.parse.join(', '));
    ok('install: every install file opens its own folder standalone, with a plain and a round icon', !bad.shape.length, ' — ' + bad.shape.join(', '));
    ok('install: every icon a manifest names is there at the size it claims', !bad.icons.length, ' — ' + bad.icons.slice(0, 3).join('; '));
    ok('install: no two apps share an id, so installing one never replaces another',
      Object.keys(ids_).length === ids.length - bad.link.length - bad.parse.length);
  }

  /* every promised check settles before anything is counted */
  await Promise.all(PENDING);

  const pass = T.filter(t => t.pass).length;
  document.getElementById('out').innerHTML =
    T.map(t => (t.pass ? '<span class="p">  ok  </span>' : '<span class="f">  FAIL</span>') + '  ' + t.name + (t.pass ? '' : t.note)).join('\n') +
    '\n\n' + (pass === T.length ? '<span class="p">' : '<span class="f">') + pass + ' / ' + T.length + ' passed</span>';
  return { pass, total: T.length, failed: T.filter(t => !t.pass).map(t => t.name) };
}

/* Waits for BOTH, and the second one is not decoration.

   These checks read and write rows, and the store finishes loading a moment
   after the page does - the big half comes out of IndexedDB. Starting on the
   themes alone meant a COLD run began before the store was ready and three
   icon checks failed, while a warm run passed because the earlier load had
   already finished the job. A check that only passes the second time is a
   check that lies, and `_review.html` opens this in a fresh frame every time,
   which is how it was caught. */
Skins.load('skins.json').then(() => {
  Skins.restore('smoke');
  Sfx.init('smoke');
  Rec.ready(run);
});
</script>
</body>
</html>
