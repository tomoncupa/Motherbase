<body>
<h1>SHARED FOUNDATION CHECK</h1>
<div class="sub">Exercises day, records, mobile, sound, ui, io and health without touching any app's data.
Open it on a phone too: the buttons below should feel like an app, not like this page.</div>
<div class="bar">
  <button onclick="Sfx.unlock();Sfx.preview()">HEAR THE PACK</button>
  <button onclick="UI.settings('smoke')">OPEN SETTINGS</button>
  <button onclick="UI.confirm('Does this dialog look right?','A sheet from the bottom on a phone, a card in the middle on a desktop.').then(v=>UI.toast('you said '+v))">CONFIRM</button>
  <button onclick="UI.menu(80,80,[{label:'First thing',note:'with a note under it',icon:'✦',fn:()=>UI.toast('first')},'-',{label:'Delete it',kind:'bad',icon:'⌫',fn:()=>UI.undo('deleted <b>the thing</b>',()=>UI.toast('brought back'))}],{title:'A MENU'})">MENU</button>
  <button onclick="UI.undo('deleted <b>3 rows</b>',()=>UI.toast('brought back'))">UNDO SNACKBAR</button>
  <button onclick="IO.export('smoke')">EXPORT SPREADSHEET</button>
  <button onclick="run()">RE-RUN CHECKS</button>
</div>
<div id="out">running…</div>

<script>
const T = [];
const PENDING = [];
/* ── a check that cannot fail is not a check ──

   `ok` took a VALUE, and nineteen checks in here were written as `() => ...`.
   A function is truthy, so every one of them passed without ever being run -
   including three that guard the sync fixes. That is worse than the permanent
   red this file already warns about: red at least gets read eventually, while
   a green that never ran is a claim nobody will ever question.

   So a condition may now be a value, a function, or a promise, and all three
   are actually resolved. A thrown or rejected check FAILS and says so, rather
   than taking the page down with it. */
function ok(name, cond, note) {
  const rec = { name: name, pass: false, note: note || '' };
  T.push(rec);
  let v;
  try { v = (typeof cond === 'function') ? cond() : cond; }
  catch (e) { rec.note += ' — threw: ' + e.message; return rec; }
  if (v && typeof v.then === 'function') {
    PENDING.push(v.then(r => { rec.pass = !!r; },
                        e => { rec.note += ' — rejected: ' + (e && e.message); }));
  } else rec.pass = !!v;
  return rec;
}

async function run() {
  T.length = 0; PENDING.length = 0;
  const stamp = 'smoke-' + Date.now();

  /* ---- day ---- */
  const at2am = new Date(); at2am.setHours(2, 0, 0, 0);
  const at9am = new Date(); at9am.setHours(9, 0, 0, 0);
  /* The 4am day start was removed on 2026-08-20. A date is now the date. */
  ok('day: the day is the calendar day, at 2am and at 9am',
    Day.startsAt === 0 && Day.of(at2am) === Day.calendar(at2am) && Day.of(at9am) === Day.calendar(at9am));
  ok('day: nothing is ever "closed but still open to edits"', !Day.isClosed(Day.today()));
  ok('day: shift round-trips', Day.shift(Day.shift('2026-03-01', 40), -40) === '2026-03-01');
  ok('day: diff counts days', Day.diff('2026-03-11', '2026-03-01') === 10);
  ok('day: last(7) is 7 dates ending today', Day.last(7).length === 7 && Day.last(7)[6] === Day.today());
  ok('day: past is editable, future is not', Day.editable(Day.shift(Day.today(), -30)) && !Day.editable(Day.shift(Day.today(), 1)));
  ok('day: dst-safe across a spring forward', Day.diff('2026-03-30', '2026-03-28') === 2);

  /* ---- records ---- */
  Rec.declare('smoke', [stamp]);
  const d = Day.today();
  Rec.set(stamp, d, 'a', { v: 1 });
  ok('rec: write then read', Rec.get(stamp, d, 'a').v === 1);
  const r1 = Rec.set(stamp, d, 'a', { v: 1 });
  ok('rec: identical write is not a write', r1.updated_at === Rec.row(stamp, d, 'a').updated_at);
  const before = Rec.row(stamp, d, 'a').updated_at;
  Rec.set(stamp, d, 'a', { v: 2 });
  ok('rec: real change bumps updated_at', Rec.row(stamp, d, 'a').updated_at >= before && Rec.get(stamp, d, 'a').v === 2);
  Rec.set(stamp, d, 'b', { v: 9 });
  ok('rec: all() lists live rows', Rec.all(stamp, { date: d }).length === 2);
  ok('rec: map() is key to payload', Rec.map(stamp, d).b.v === 9);
  Rec.del(stamp, d, 'b');
  ok('rec: delete hides the row', Rec.get(stamp, d, 'b') === null && Rec.all(stamp, { date: d }).length === 1);
  ok('rec: delete leaves a tombstone', Rec.export([stamp]).some(r => r.key === 'b' && r.deleted));
  /* A row past the fast half's ceiling lives only in IndexedDB, and its write
     waits 60ms for company. A neighbour's poke inside that window used to
     drop the picture and re-read IndexedDB before the put had landed, and the
     row was gone until the next page load. */
  /* all(type) walks an index of that type now, not the whole store. The
     index is only worth having if it never disagrees with the rows, so this
     compares it against a walk of every row after a write, a delete, a merge
     and a reload. */
  ok('rec: the type index agrees with a walk of every row, live and dead', (() => {
    const walk = {};
    Object.keys(Rec._rows).forEach(id => { const r = Rec._rows[id]; (walk[r.type] = walk[r.type] || []).push(id); });
    const byDay = {};
    Object.keys(Rec._rows).forEach(id => { const r = Rec._rows[id]; if (!r.deleted && r.date) (byDay[r.type + '|' + r.date] = byDay[r.type + '|' + r.date] || []).push(id); });
    return Object.keys(walk).every(t => {
      const got = Rec.all(t).map(r => r.id).concat(Rec.tombstones(t).map(r => r.id)).sort().join();
      return got === walk[t].slice().sort().join();
    }) && Object.keys(byDay).every(k => {
      const [t, dd] = k.split('|');
      return Rec.all(t, { date: dd }).map(r => r.id).sort().join() === byDay[k].slice().sort().join();
    }) && Rec.export().length === Object.keys(Rec._rows).length;
  })());
  /* Waited for here, not left pending: a reload re-reads IndexedDB, and the
     rest of this run should start after that answer has landed rather than
     have it arrive in the middle of some later check. */
  ok('rec: a big row still queued for IndexedDB survives a reload', await (async () => {
    if (!Rec.stats().idb) return true;               /* nothing to prove without the big half */
    Rec.set(stamp, null, 'big', { blob: 'x'.repeat(70000) });
    Rec.reload();
    const t0 = Date.now();
    while (Date.now() - t0 < 3000) {
      const back = Rec.get(stamp, null, 'big');
      if (back && back.blob.length === 70000) { Rec.del(stamp, null, 'big'); return true; }
      await new Promise(r => setTimeout(r, 25));
    }
    return false;
  })());
  /* 2026-09-24: Main Menu.exe's localStorage was full to the byte and Google
     sign-in refused to open. A full fast half now moves its oldest-dated rows
     to IndexedDB only. Never an undated row, never a copy newer than
     IndexedDB's, and a moved row is still there after a reload. */
  ok('rec: a full fast half moves its oldest rows out, and they come back', await (async () => {
    if (!Rec.stats().idb) return true;
    const P = 'mb.r.', D0 = '1899-12-30', D1 = '1899-12-31', D2 = '1900-01-01';
    Rec.set(stamp, D0, 'trim0', { v: 0 });
    Rec.set(stamp, D1, 'trim1', { v: 1 });
    Rec.set(stamp, D2, 'trim2', { v: 2 });
    Rec.set(stamp, null, 'trimu', { v: 3 });
    Rec.flush();
    await new Promise(r => setTimeout(r, 400));
    const id = (dd, k) => Rec.row(stamp, dd, k).id;
    /* A row in the fast half ALONE, the way rows from before IndexedDB are:
       it has to be copied in before it may leave. */
    const DL = '1899-12-29', lid = 'local|' + stamp + '|' + DL + '|trimL';
    const lrow = { id: lid, user_id: 'local', type: stamp, date: DL, key: 'trimL', payload: { v: 7 }, updated_at: new Date().toISOString(), deleted: false };
    localStorage.setItem(P + lid, JSON.stringify(lrow));
    Rec.reload();
    await new Promise(r => setTimeout(r, 400));
    const len = k => k.length + (localStorage.getItem(k) || '').length;
    await Rec._trim(Infinity);
    const n = await Rec._trim(0, Rec._fastSize - len(P + lid) - len(P + id(D0, 'trim0')));
    const has = (dd, k) => localStorage.getItem(P + id(dd, k)) != null;
    const moved = n === 2 && localStorage.getItem(P + lid) == null && !has(D0, 'trim0') && has(D1, 'trim1')
      && has(D2, 'trim2') && has(null, 'trimu') && Rec.get(stamp, D0, 'trim0').v === 0;
    Rec.reload();
    const t0 = Date.now();
    let back = false;
    while (Date.now() - t0 < 3000) {
      const g0 = Rec.get(stamp, D0, 'trim0'), gl = Rec.get(stamp, DL, 'trimL');
      if (g0 && g0.v === 0 && gl && gl.v === 7 && Rec.hydrated) { back = true; break; }
      await new Promise(r => setTimeout(r, 25));
    }
    [[DL, 'trimL'], [D0, 'trim0'], [D1, 'trim1'], [D2, 'trim2'], [null, 'trimu']].forEach(x => Rec.del(stamp, x[0], x[1]));
    return moved && back;
  })());

  /* the whole reason for rows: a stale copy must not win */
  const mine = Rec.row(stamp, d, 'a');
  const stale = Object.assign({}, mine, { payload: { v: 99 }, updated_at: '2000-01-01T00:00:00.000Z' });
  Rec.merge([stale]);
  ok('rec: older row loses the merge', Rec.get(stamp, d, 'a').v === 2);
  const newer = Object.assign({}, mine, { payload: { v: 42 }, updated_at: new Date(Date.now() + 60000).toISOString() });
  const n1 = Rec.merge([newer]);
  const n2 = Rec.merge([newer]);
  ok('rec: newer row wins the merge', Rec.get(stamp, d, 'a').v === 42);
  ok('rec: merge is idempotent', n1 === 1 && n2 === 0);

  /* ---- two devices, one row, different fields ----
     Tom, 2026-09-15: a phone and a laptop each change a different part of the
     same thing before they sync, and both changes have to survive. The check is
     Rec.merge itself, the one door a sync, a restore and another tab all come
     through, so it covers every way two versions can meet. Devices are built as
     the rows each one would hold. */
  const idOf = k => Rec.USER + '|' + stamp + '|' + d + '|' + k;
  const iso = ms => new Date(ms).toISOString();
  Rec.set(stamp, d, 'f1', { name: 'Chicken', p: 30, kcal: 165 });
  ok('rec: a row never edited carries no field times', !Rec.row(stamp, d, 'f1').ft);
  Rec.set(stamp, d, 'f1', { name: 'Chicken', p: 31, kcal: 165 });
  const laptop = Rec.row(stamp, d, 'f1');
  ok('rec: an edit remembers only the field it changed',
    !!laptop.ft && Object.keys(laptop.ft).join() === 'p' && laptop.fb > 0);
  /* the phone started from the same row, before the laptop's edit, and renamed it */
  const tPhone = Date.parse(laptop.updated_at) + 1000;
  const phone = Object.assign({}, laptop, {
    payload: { name: 'Chicken breast', p: 30, kcal: 165 },
    ft: { name: tPhone }, fb: laptop.fb, updated_at: iso(tPhone),
  });
  Rec.merge([phone]);
  const got = Rec.get(stamp, d, 'f1');
  ok('rec: two devices editing different fields keep both edits — ' + JSON.stringify(got),
    got.name === 'Chicken breast' && got.p === 31 && got.kcal === 165);
  ok('rec: a field merge is idempotent', Rec.merge([phone]) === 0 && Rec.merge([laptop]) === 0);

  /* the same two versions arriving the other way round land on the same row */
  const f2a = Object.assign({}, laptop, { id: idOf('f2'), key: 'f2' });
  const f2b = Object.assign({}, phone, { id: idOf('f2'), key: 'f2' });
  Rec.merge([f2b]); Rec.merge([f2a]);
  const got2 = Rec.get(stamp, d, 'f2');
  ok('rec: the order two devices meet in does not change the result',
    got2 && got2.name === 'Chicken breast' && got2.p === 31);

  /* a stale copy from a device on the old whole-row rule still loses */
  const old = Object.assign({}, laptop, { payload: { name: 'Old', p: 20, kcal: 100 }, updated_at: iso(laptop.fb - 5000) });
  delete old.ft; delete old.fb;
  Rec.merge([old]);
  const got3 = Rec.get(stamp, d, 'f1');
  ok('rec: an older copy with no field times still loses every field', got3.name === 'Chicken breast' && got3.p === 31);

  /* a delete wins only when it is newer than the row it deletes */
  const live = Rec.row(stamp, d, 'f1');
  Rec.merge([Object.assign({}, live, { payload: null, deleted: true, updated_at: iso(Date.parse(live.updated_at) - 1000) })]);
  const keptAlive = !!Rec.get(stamp, d, 'f1');
  Rec.merge([Object.assign({}, live, { payload: null, deleted: true, updated_at: iso(Date.parse(live.updated_at) + 1000) })]);
  ok('rec: a delete wins only when it is newer than the edit', keptAlive && !Rec.get(stamp, d, 'f1'));

  /* ---- a deleted row must not come back ----
     2026-09-16, watched: ARC wrote a row and deleted it inside one millisecond,
     so both versions carried the same updated_at. Another page on the origin
     heard the live one first, wrote it into the shared storage, then heard the
     delete, saw an equal time, and kept the live row. It came back in both
     halves, for every page.

     These do not test "a deleted map stays deleted" — that is one symptom. They
     test the two things underneath every version of it: one writer's versions
     of a row are always in time order, and two versions at the same time settle
     the same way whichever one arrives first. */
  ok('rec: every new version of a row is later than the one before, however fast', (() => {
    const times = [];
    for (let i = 0; i < 40; i++) {
      times.push(Rec.set(stamp, d, 'burst', { v: i }).updated_at);
      times.push(Rec.del(stamp, d, 'burst').updated_at);
    }
    for (let i = 1; i < times.length; i++) if (!(times[i] > times[i - 1])) return false;
    return true;
  })());
  ok('rec: a live row and its delete at the same moment end deleted, in either order', (() => {
    const at = iso(Date.now() - 3600000);
    const mk = (k, dead) => ({ id: idOf(k), user_id: Rec.USER, type: stamp, date: d, key: k,
      payload: dead ? null : { v: 1 }, updated_at: at, deleted: !!dead, by: 'smoke' });
    Rec.merge([mk('tie-a', false)]); Rec.merge([mk('tie-a', true)]);
    Rec.merge([mk('tie-b', true)]); Rec.merge([mk('tie-b', false)]);
    return Rec.get(stamp, d, 'tie-a') === null && Rec.get(stamp, d, 'tie-b') === null
      && !!Rec.tombstone(stamp, d, 'tie-a') && !!Rec.tombstone(stamp, d, 'tie-b');
  })());
  ok('rec: two live versions at the same moment pick the same winner, in either order', (() => {
    const at = iso(Date.now() - 3600000);
    const mk = (k, v) => ({ id: idOf(k), user_id: Rec.USER, type: stamp, date: d, key: k,
      payload: { v: v }, updated_at: at, deleted: false, by: 'smoke' });
    Rec.merge([mk('tie-c', 'one')]); Rec.merge([mk('tie-c', 'two')]);
    Rec.merge([mk('tie-d', 'two')]); Rec.merge([mk('tie-d', 'one')]);
    const c = Rec.get(stamp, d, 'tie-c'), e = Rec.get(stamp, d, 'tie-d');
    return !!c && !!e && c.v === e.v;
  })());

  /* a day's readings: both devices add one, and one removed stays removed */
  const evKey = 'smoke-' + stamp;
  Rec.set('ev', d, evKey, { e: [{ t: 1, v: 80 }] });
  Rec.set('ev', d, evKey, { e: [{ t: 1, v: 80 }, { t: 2, v: 81 }] });
  const evA = Rec.row('ev', d, evKey);
  const tB = Date.parse(evA.updated_at) + 1000;
  const evB = Object.assign({}, evA, {
    payload: { e: [{ t: 3, v: 82 }] }, ft: { e: tB }, fb: evA.fb, gone: { 1: tB }, updated_at: iso(tB),
  });
  Rec.merge([evB]);
  const evGot = (Rec.get('ev', d, evKey) || {}).e || [];
  ok('rec: two devices adding readings keep both, and a removed one stays removed — ' + JSON.stringify(evGot),
    evGot.map(x => x.t).join() === '2,3');
  Rec.del('ev', d, evKey);

  /* the types kept whole stay whole, and carry nothing extra */
  const setKey = 'smoke-' + stamp;
  Rec.set('set', d, setKey, { kg: 1 });
  Rec.set('set', d, setKey, { kg: 2 });
  ok('rec: a TRAIN set stays a whole row with no field times', !Rec.row('set', d, setKey).ft);
  Rec.del('set', d, setKey);

  Rec.set(stamp, null, 'undated', { v: 'x' });
  ok('rec: undated rows work', Rec.get(stamp, null, 'undated').v === 'x');
  Rec.setting('smoke', 'colour', 'blue');
  ok('rec: settings are namespaced', Rec.setting('smoke', 'colour') === 'blue');
  ok('rec: window query narrows by date', Rec.all(stamp, { from: d, to: d }).length === Rec.all(stamp, { date: d }).length);
  ok('rec: export round-trips through merge', (() => {
    const rows = Rec.export([stamp]);
    return Rec.merge(rows) === 0 && rows.length > 0;
  })());
  ok('rec: rows are individually addressable in storage',
    Object.keys(localStorage).filter(k => k.indexOf('mb.r.') === 0 && k.indexOf(stamp) > -1).length >= 2);

  /* ---- ticks, the shared cell ---- */
  Rec.set('activity', null, 'smoke-run', { name: 'Smoke Run', cat: 'test' });
  Rec.set('tick', d, 'smoke-run', { src: 'smoke' });
  ok('tick: written and readable', Rec.has('tick', d, 'smoke-run'));
  ok('tick: activity resolves for display', Rec.map('activity')['smoke-run'].name === 'Smoke Run');

  /* ---- io ---- */
  IO.register({ app: 'smoke', name: 'Smoke', types: [stamp] });
  const sheets = IO.sheets('smoke', 14);
  ok('io: builds a calendar and a log sheet', sheets.length >= 2 && sheets[0].name === 'Calendar');
  ok('io: calendar has a date header row', sheets[0].rows[0][0] === 'Activity' && sheets[0].rows[0].length === 15);
  ok('io: calendar marks today as TRUE', sheets[0].rows.some(r => r[0] === 'Smoke Run' && r[r.length - 1] === true));
  ok('io: log rows carry date and source', sheets[1].rows.some(r => r[0] === d && r[2] === 'smoke'));

  /* ---- health ---- */
  const h = Health.check();
  ok('health: reports a verdict', typeof h.ok === 'boolean' && h.stats.live > 0);
  ok('health: no malformed rows', !h.issues.some(i => /malformed|duplicate/.test(i.msg)));

  /* ---- sound + ui exist and are wired ---- */
  ok('sfx: packs and voices are listed', Sfx.PACKS.length >= 5 && Sfx.VOICES.length >= 5);
  ok('sfx: settings persist per app', (Sfx.init('smoke'), Sfx.volume(0.4), Sfx.settings.vol === 0.4));
  ok('ui: dialog, confirm, menu, settings all present', ['dialog', 'confirm', 'menu', 'settings', 'toast'].every(k => typeof UI[k] === 'function'));
  ok('skins: per-app key is scoped', (Skins.for('smoke'), Skins.restore('smoke'), localStorage.getItem('suite_skin.smoke') != null));

  /* ---- mobile: the native-feel layer ---- */
  const R = getComputedStyle(document.documentElement);
  const tok = k => R.getPropertyValue(k).trim();
  ok('mobile: loaded and reports the platform',
    typeof Mobile === 'object' && typeof Mobile.touch === 'boolean' && typeof Mobile.ios === 'boolean');
  ok('mobile: base stylesheet injected once',
    document.querySelectorAll('#mb-mobile-css').length === 1);
  ok('mobile: viewport covers the safe area',
    /viewport-fit=cover/.test(document.querySelector('meta[name=viewport]').content));
  ok('mobile: pinch zoom was not disabled',
    !/user-scalable=no/.test(document.querySelector('meta[name=viewport]').content));
  ok('mobile: every field kind names a keyboard',
    Object.keys(Mobile.KINDS).length >= 12 &&
    Mobile.KINDS.decimal.inputmode === 'decimal' && Mobile.KINDS.search.enterkeyhint === 'search');
  ok('mobile: number fields are text, so half-typed values survive',
    Mobile.KINDS.number.type === 'text' && Mobile.KINDS.money.type === 'text');
  ok('mobile: haptics can be turned off and stay off',
    (Mobile.setHaptics(false), Mobile.haptics === false && Mobile.haptic('tick') === false &&
     JSON.parse(localStorage.getItem('mb.mobile')).haptics === false));
  Mobile.setHaptics(true);
  ok('mobile: field() sets the keyboard and the return key', (() => {
    const i = document.createElement('input'); Mobile.field(i, 'decimal');
    return i.getAttribute('inputmode') === 'decimal' && i.getAttribute('enterkeyhint') === 'done';
  })());
  ok('mobile: form() is Next down the fields and Done on the last', (() => {
    const box = document.createElement('div');
    box.innerHTML = '<input><input><input>';
    const f = Mobile.form(box);
    return f.length === 3 && f[0].getAttribute('enterkeyhint') === 'next' &&
           f[2].getAttribute('enterkeyhint') === 'done';
  })());
  ok('mobile: the back stack balances', (() => {
    const before = history.length;
    const rel = Mobile.trap(() => {});
    const pushed = history.length > before || history.state && history.state.mb;
    rel();
    return !!pushed;
  })());
  /* This one exists because it broke: TRAIN's menu closed and its next screen
     opened in the same tap, the menu's late back took the screen's entry, and
     LOG ALL then stepped off the page to the home screen (2026-09-25). Three
     floor entries of its own keep a failure on this page instead of leaving
     it: the old code was watched overshooting by two. */
  ok('mobile: a trap opened as another closes still unwinds to where it began', await (async () => {
    const pause = ms => new Promise(r => setTimeout(r, ms));
    await pause(300);   /* the check above leaves its own back on its way */

       tail is still sitting to its right */
    const small = JSON.stringify({ id: 'x', type: stamp, key: 'small', payload: { n: 1 } });
    BIG.staleTail = IO.bagRows([[small, 'x', 'leftover-from-the-long-version']]).length === 1;
    Rec.del(stamp, null, 'big-row');
  }
  ok('mirror: no cell sent to the sheet is over its character limit', () => BIG.longest <= 32767);
  ok('mirror: a row too big for one cell goes up in pieces and comes back whole', () =>
    BIG.pieces > 2 && BIG.whole);
  ok('mirror: cells left over from a longer version of a row are ignored', () => BIG.staleTail);
  ok('mirror: the sheet hands over a tab that was asked for by name', () =>
    /only && only.indexOf\(name\) > -1/.test(IO.mirror.script()));
  /* A sync that says "no changes" while the weight on screen moves is a sync
     you stop believing. Rows merged out of _Data count like any other. */
  ok('mirror: rows merged from _Data are counted as changes', () =>
    IO.came({ changed: 1, added: 2, merged: 4 }) === 7 && IO.came({ merged: 3 }) === 3);
  /* Opening the app on a second device must not be able to empty the sheet.
     The tab is matched line by line rather than rewritten, and the script is
     told so on every push. */
  ok('mirror: the save-file tab is never rewritten whole', (() => {
    const bag = IO.bagTabs('__smoke')[0];
    return bag.upsert === 1 && bag.head === 1 && bag.key === 1 &&
      /t\.upsert && sh\.getLastRow\(\) > 0/.test(IO.mirror.script());
  })());
  ok('mirror: a failed read stops the push that would follow it', () =>
    /got && got\.failed/.test(String(IO.mirror.sync)));
  /* A device only gets to rewrite the sheet if it holds what the sheet holds.
     Everything still goes up either way; the difference is whether the tab is
     cleared first. */
  ok('mirror: only a device holding the whole picture may clear a tab', () =>
    /wholePicture/.test(String(IO.mirror.push)) &&
    /clearing \? 'full' : 'delta'/.test(String(IO.mirror.push)));
  ok('backup: those tabs read back into a restorable bag', (() => {
    const t = IO.bagTabs('__smoke');
    const bag = IO.bagFromTabs({ _Data: t[0].rows, _Settings: t[1].rows });
    return bag.rows.length > 0 && bag.local['suite_skin.__smoke'] === 'ember';
  })());
  localStorage.removeItem('suite_skin.__smoke');
  localStorage.removeItem('mb.sfx.__smoke');

  /* ---- the mirror ----

     == a mirror check puts the mirror back ==
     Added 2026-09-23, after two checks failed on a browser that had never
     held a sheet link, with nothing wrong in io.js.

     Both ask what the app says about a link that has NEVER worked, and the
     answer is read off two marks that neither of them sets: `sheetV`, and
     the per-app push stamps. A check further up this same file pushes as
     `status` and leaves a real stamp behind, so the answer depended on what
     had run first and how far it got. A check that reads a mark it did not
     set is not testing io.js, it is testing the run order.

     And every teardown here wrote `url: ''`. On a real device that is the
     sync link Tom pasted, and `_review.html` runs this file, so a review
     quietly unlinked his sheet on that device every time. One restore at the
     end of the section gives back whatever was there when it started. */
  const mirrorSnap = () => JSON.parse(JSON.stringify(IO.mirror.settings));
  /* Emptying a key is the only way to clear one: `msave` merges these maps
     with what is on disk, so a deleted key comes straight back and an empty
     string is the real delete. */
  const mirrorBlank = m => { const o = {}; Object.keys(m || {}).forEach(k => { o[k] = ''; }); return o; };
  const mirrorPut = was => {
    const now = IO.mirror.settings;
    const back = {};
    /* anything a check added is emptied, then what was really there goes on
       top, so a restore cannot leave a stamp of its own behind */
    ['pushed', 'seen', 'full', 'sig'].forEach(k => {
      back[k] = Object.assign(mirrorBlank(now[k]), was[k] || {});
    });
    IO.mirror.set(Object.assign({ url: was.url || '', on: was.on,
      sheetV: was.sheetV || 0, cal: was.cal || 0 }, back));
  };
  const MIRROR_WAS = mirrorSnap();

  ok('mirror: it is shared, not per app', typeof IO.mirror === 'object' &&
    ['pull', 'push', 'sync', 'onOpen', 'script', 'tabs'].every(k => typeof IO.mirror[k] === 'function'));
  ok('mirror: the link lives outside any one app',
    (IO.mirror.set({ url: 'https://example.test/exec' }),
     JSON.parse(localStorage.getItem('mb.mirror')).url === 'https://example.test/exec'));
  IO.mirror.set({ url: '' });
  /* Two tabs cannot share a name: a sheet has one tab per name, so the second
     would overwrite the first and half the data would seem to vanish. */
  ok('mirror: no two tabs share a name', (() => {
    IO.register({ app: '__dup', name: 'Dup', types: [stamp],
      sheets: () => [{ name: 'Things', rows: [['a']] }, { name: 'Other', rows: [['b']] }],
      tables: [{ name: 'Things', type: stamp, cols: [['name', 'Name']] }] });
    const names = IO.mirror.tabs('__dup').map(t => t.name);
    return new Set(names).size === names.length;
  })());
  ok('mirror: an editable table supersedes the read-out of the same thing', (() => {
    const tabs = IO.mirror.tabs('__dup');
    const things = tabs.filter(t => /Things$/.test(t.name));
    return things.length === 1 && things[0].editable === true;
  })());
  ok('mirror: the script has both directions and stamps sheet edits', (() => {
    const sc = IO.mirror.script();
    return /function doPost/.test(sc) && /function doGet/.test(sc) &&
      /function onEdit/.test(sc) && /callback/.test(sc);
  })());

  /* ---- is this device still holding work the sheet has not got? ----

     The phone pulled for weeks and never once pushed. Every automatic sync was
     gated on a flag in memory saying "something changed since this page
     loaded", and a phone browser freezes a backgrounded tab mid-request and
     then discards it: the flag went, the rows stayed, and open / becoming
     visible / the 45s tick only ever pulled.

     The check that earns its keep is not "does a push happen" - it is the one
     mechanism under every symptom: CAN THIS DEVICE STILL TELL, WITH NOTHING IN
     MEMORY, THAT IT HAS ROWS THE SHEET HAS NOT CONFIRMED. Both halves of that
     answer live outside the page: the boundary in localStorage and the rows in
     the store. */
  ok('records: newerThan finds a row written after a stamp', (() => {
    const before = new Date(Date.now() - 60000).toISOString();
    Rec.set(stamp, null, 'nt-a', { v: 1 });
    return Rec.newerThan([stamp], before) === true;
  })());
  ok('records: newerThan says no once the stamp is ahead of the rows', () =>
    Rec.newerThan([stamp], new Date(Date.now() + 60000).toISOString()) === false);
  ok('records: newerThan only looks at the types it was asked for', () =>
    Rec.newerThan(['type-nobody-owns'], new Date(Date.now() - 60000).toISOString()) === false);
  ok('records: newerThan with no stamp means everything is outstanding', () =>
    Rec.newerThan([stamp], '') === true && Rec.newerThan([stamp], null) === true);

  ok('mirror: a device with unsent rows knows it from the store, not from memory', (() => {
    IO.register({ app: '__out', name: 'Out', types: [stamp] });
    /* pretend the last confirmed push was a minute ago, which is what a fresh
       page load reads back out of localStorage */
    IO.mirror.set({ pushed: { __out: new Date(Date.now() - 60000).toISOString() } });
    const holding = IO.mirror.outstanding('__out');
    /* and once the sheet confirms, it goes quiet */
    IO.mirror.set({ pushed: { __out: new Date(Date.now() + 60000).toISOString() } });
    const quiet = IO.mirror.outstanding('__out');
    IO.mirror.set({ pushed: { __out: '' } });
    return holding === true && quiet === false;
  })());
  /* A fresh app id, because the boundaries are deliberately MERGED with what is
     on disk - every app frame writes that object and none of them owns it, so
     one frame cannot erase another's line by writing an empty one. */
  ok('mirror: a device that has never pushed counts as holding everything', () =>
    IO.mirror.outstanding('__never-pushed-' + Date.now()) === true);
  /* The bug was not that pushing was broken. It was that the only moment a
     phone reliably reaches - open, and the tick, and coming back to the app -
     could not push at all. */
  ok('mirror: the moment that runs on open sends as well as reads', () =>
    /Mirror\.push\(/.test(String(IO.mirror.onOpen)) &&
    /Mirror\.outstanding\(/.test(String(IO.mirror.onOpen)));
  ok('mirror: nothing automatic is gated on a flag held in memory', () =>
    !/dirty/.test(String(IO.mirror.watch)) &&
    /Mirror\.onOpen\(/.test(String(IO.mirror.watch)));
  /* A lock taken on the way in and cleared on the way out is exactly what a
     frozen tab loses, so the lock is held as a time and expires by itself
     rather than blocking every later sync forever. */
  ok('mirror: one sync at a time, and a frozen one lets go on its own', () => {
    const src = String(IO.mirror.onOpen);
    return /busy\(appId\)/.test(src) && /hold\(appId\)/.test(src) && /release\(appId\)/.test(src);
  });

  /* ---- what the user is told, and what is written down ----

     Two audiences. A red banner is for something the person can fix in ten
     seconds; everything else self-heals, because the boundary only moves when
     the sheet confirms. The detail that actually diagnoses a sync lives in the
     log, where being complete costs nobody any worry. */
  ok('mirror: a bad link is the user\'s problem and says so', () => {
    IO.mirror.set({ url: 'https://example.test/notascript' });
    const a = IO.mirror.fault();
    IO.mirror.set({ url: 'https://script.google.com/macros/s/X/dev' });
    const b = IO.mirror.fault();
    IO.mirror.set({ url: '' });
    const c = IO.mirror.fault();
    return a.code === 'bad-link-host' && a.act === true &&
           b.code === 'bad-link-dev' && b.act === true &&
           c.code === 'no-link' && c.act === true;
  });
  ok('mirror: a sync that will retry itself is not raised as an alarm', () => {
    const hadV = IO.mirror.settings.sheetV || 0;
    /* the sheet HAS answered this device before, which is what makes this
       failure a moment rather than a setup */
    IO.mirror.set({ url: 'https://script.google.com/macros/s/X/exec', sheetV: 4 });
    const f = IO.mirror.fault();
    IO.mirror.set({ url: '', sheetV: hadV });
    /* transient: no signal, a frozen tab, Google being slow. The rows go again
       on their own, so nothing is asked of the person and nothing is reddened */
    return f.code === 'unreachable' && f.act === false && !!f.say;
  });
  /* 2026-09-17, off a sync log from Tom's phone: the link was pasted, it ended
     in /exec, and four manual syncs in two minutes each failed at about 3.3
     seconds while the app said "nothing was lost, and it will go again on its
     own". The sheet had answered v0 and no push had ever been confirmed, so
     pressing the button again could not have worked. A never-worked link is a
     setup to fix, not a blip to wait out. */
  ok('mirror: a link that has NEVER answered is the user\'s problem', () => {
    const was = mirrorSnap();
    /* the whole question is "no mark anywhere", so every mark is cleared here
       rather than assumed, the push stamps included */
    IO.mirror.set({ url: 'https://script.google.com/macros/s/X/exec', sheetV: 0,
      pushed: mirrorBlank(was.pushed) });
    const f = IO.mirror.fault();
    mirrorPut(was);
    return f.code === 'never-answered' && f.act === true && /access/.test(f.say);
  });
  ok('mirror: an emptied push stamp is not proof the sheet ever answered', () => {
    const was = mirrorSnap();
    IO.mirror.set({ sheetV: 0,
      pushed: Object.assign(mirrorBlank(was.pushed), { __never: '' }) });
    const blank = IO.mirror.neverAnswered();
    IO.mirror.set({ pushed: { __never: new Date().toISOString() } });
    const stamped = IO.mirror.neverAnswered();
    mirrorPut(was);
    return blank === true && stamped === false;
  });
  ok('mirror: the sync pane stops saying "not synced yet" about a link that cannot work', () => {
    const src = String(IO.syncRow);
    /* the line the person reads without pressing anything, which is the only
       place a never-worked link shows up on its own */
    return /neverAnswered\(\)/.test(src) && /fault\(\)\.say/.test(src);
  });
  ok('mirror: an unconfirmed push stops calling itself normal when nothing ever landed', () => {
    const src = String(IO.mirror.push) + String(IO.mirror.sync);
    /* both the push's own words and the manual button's have to ask, or one of
       them goes on saying "some browsers always do" over a broken deployment */
    return (src.match(/never-answered/g) || []).length >= 2;
  });
  ok('mirror: why() still answers, so nothing that called it broke', () =>
    typeof IO.mirror.why() === 'string' && IO.mirror.why().length > 0);
  /* The sync that mattered was the automatic one, and it was silent. A
     declined sync is as worth a line as a failed one: "nothing happened and I
     do not know why" is what cost weeks.

     Driven once, in order, and asserted afterwards. These all write to the one
     log, so running them as separate promises let them interleave and stamp on
     each other's entries - which is a fine way to write a check that fails for
     a reason that has nothing to do with the thing it is checking. */
  const LG = {};
  IO.mirror.clearLog();
  IO.mirror.set({ url: '', on: 1 });
  await IO.mirror.onOpen('__log', 'tick');
  LG.noLink = IO.mirror.log().slice(-1)[0] || {};

  IO.mirror.set({ url: 'https://script.google.com/macros/s/X/exec', on: 0 });
  await IO.mirror.onOpen('__log', 'open');
  LG.off = IO.mirror.log().slice(-1)[0] || {};

  IO.mirror.clearLog();
  IO.mirror.set({ url: '', on: 1 });
  await IO.mirror.onOpen('__log', 'tick');
  LG.one = IO.mirror.log().length;
  LG.asRows = Rec.export().filter(r => /log/i.test(r.type)).length;
  LG.inStorage = !!localStorage.getItem('mb.mirror.log');
  LG.text = IO.mirror.logText();

  IO.mirror.clearLog();
  for (let i = 0; i < 70; i++) await IO.mirror.onOpen('__log', 'tick');
  LG.ring = IO.mirror.log().length;
  IO.mirror.clearLog();
  IO.mirror.set({ url: '', on: 1 });

  ok('mirror: an attempt that declines to run still says why', () =>
    LG.noLink.r === 'skip' && LG.noLink.y === 'no-link' &&
    LG.noLink.w === 'tick' && LG.noLink.a === '__log');
  ok('mirror: the switch being off is recorded, not mistaken for a failure', () =>
    LG.off.r === 'skip' && LG.off.y === 'switched-off');
  ok('mirror: the log is a ring, so it cannot grow without end', () => LG.ring === 60);
  ok('mirror: the log copies out with the device and the link on it', () =>
    /MOTHERBASE SYNC LOG/.test(LG.text) && /device/.test(LG.text) &&
    /auto/.test(LG.text) && /app script v/.test(LG.text));
  /* A diagnostic is not data: it must not sync, must not land in a backup and
     must not be mistaken for a row. */
  ok('mirror: the log is not a row and never travels', () =>
    LG.one === 1 && LG.asRows === 0 && LG.inStorage);
  /* Sixty lines of "nothing to do" would push the one failure worth reading
     off the end long before he got round to copying it. */
  /* ---- a read that failed must not mute the device ----

     Four days of logging sat on Tom's iPhone because "do not write after a
     read you could not complete" was applied to both kinds of push. Only one
     kind can erase. A delta is matched on row ids: it adds, it updates, and
     there is no clearing step in it anywhere. */
  ok('mirror: a delta push has no clearing step to be unsafe with', () => {
    const src = String(IO.mirror.push);
    return /clearing = full && wholePicture/.test(src) &&
      /opts\.delta \? \(!canDelta\)/.test(src);
  });
  ok('mirror: a failed read still sends, in the kind that cannot erase', () => {
    const src = String(IO.mirror.onOpen);
    return /delta: readFailed/.test(src) && /readFailed/.test(src);
  });
  ok('mirror: the button sends what is waiting even when the read fails', () =>
    /delta: true/.test(String(IO.mirror.sync)) &&
    /sent-anyway/.test(String(IO.mirror.sync)));
  /* A device with no boundary has nothing to delta FROM, so it must still
     refuse — that is the case the rule was written for. */
  ok('mirror: a device that never pushed cannot delta its way past a bad read', () =>
    /opts\.delta \? \(!canDelta\)/.test(String(IO.mirror.push)));
  /* mode:"delta" stops the sheet clearing a tab EXCEPT one the app marks
     `whole`, and _Settings is marked whole. Rewriting that blind would take the
     other device's theme and sound with it, so a recovery push drops it. */
  ok('mirror: a recovery push sends nothing that gets rewritten whole', () =>
    /opts\.delta\) tabs = tabs\.filter\(t => !t\.whole\)/.test(String(IO.mirror.push)));

  /* ---- our push must not hide the other device's ----

     The sheet keeps one push stamp and the last pusher overwrites it. The
     laptop pushed, the phone's read timed out, the phone sent anyway — and
     from then on the phone read "last push was mine" and never pulled _Data,
     so the laptop's edits stalled. Driven through push itself with the
     network faked, because a regex on the source would pass on the next way
     of getting this wrong. The fake sheet echoes whatever stamp it was sent. */
  const BG = {};
  {
    IO.register({ app: '__bag', name: 'Bag', types: [stamp] });
    Rec.set(stamp, null, 'bag-row', { n: 1 });
    const keepV = IO.mirror.settings.sheetV;
    const realFetch = window.fetch;
    let sentAt = '';
    window.fetch = (u, o) => { try { sentAt = JSON.parse(o.body).at; } catch (e) {} return Promise.resolve({}); };
    document.head.appendChild = function (el) {
      const m = el && el.src && /callback=([^&]+)/.exec(el.src);
      if (m && /want=index/.test(el.src)) {
        setTimeout(() => window[m[1]] && window[m[1]]({ ok: true, v: 4, index: {}, pushedAt: { __bag: sentAt } }), 0);
        return el;
      }
      return Node.prototype.appendChild.call(this, el);
    };
    const drive = async seen => {
      IO.mirror.set({ url: 'https://script.google.com/macros/s/X/exec', on: 0, sheetV: 4,
        pushed: { __bag: '2000-01-01T00:00:00.000Z' }, seen: { '__bag|_Data': seen } });
      const res = await IO.mirror.push('__bag', true,
        { index: { v: 4, index: {}, pushedAt: { __bag: 'OTHER-DEVICE' } }, delta: true });
      return { state: res && res.state, next: IO.mirror.bagIsNew('__bag', { pushedAt: { __bag: sentAt } }) };
    };
    try {
      BG.behind = await drive('OLDER');
      BG.caught = await drive('OTHER-DEVICE');
      IO.mirror.set({ seen: { '__bag|_Data': '' } });
      BG.never = IO.mirror.bagIsNew('__bag', { pushedAt: { __bag: 'ANY' } });
    } catch (e) { BG.err = String(e); }
    finally {
      window.fetch = realFetch;
      delete document.head.appendChild;
      IO.mirror.set({ url: '', on: 1, sheetV: keepV, pushed: { __bag: '' }, seen: { '__bag|_Data': '' } });
    }
  }
  ok('mirror: pushing after the other device, unread, still reads it next time', () =>
    BG.behind && BG.behind.state === 'confirmed' && BG.behind.next === true);
  ok('mirror: pushing while caught up does not re-download what it just sent', () =>
    BG.caught && BG.caught.state === 'confirmed' && BG.caught.next === false);
  ok('mirror: a device that has never read the save file always reads it', () => BG.never === true);

  /* ---- a read that crashes says what crashed ----
     The PC logged "read-failed:?" fifteen times running: the sheet answered,
     the rows came down, something threw while taking them in, and the catch
     dropped the error. Forced here with a table reader that throws. */
  const TH = {};
  {
    IO.register({ app: '__thr', name: 'Thr', types: [stamp],
      tables: [{ name: 'Boom', type: stamp, cols: [['name', 'Name']] }] });
    const keepV = IO.mirror.settings.sheetV;
    const realRead = IO.readTable;
    IO.readTable = () => { throw new Error('smoke-boom'); };
    document.head.appendChild = function (el) {
      const m = el && el.src && /callback=([^&]+)/.exec(el.src);
      if (m) {
        const reply = /want=index/.test(el.src)
          ? { ok: true, v: 4, index: { Boom: { rows: 2, edited: '2999-01-01T00:00:00.000Z' } }, pushedAt: {} }
          : { ok: true, v: 4, tabs: { Boom: [['id', 'date', 'Name', 'edited', 'by'], ['x', '', 'y', '', '']] } };
        setTimeout(() => window[m[1]] && window[m[1]](reply), 0);
        return el;
      }
      return Node.prototype.appendChild.call(this, el);
    };
    try {
      IO.mirror.clearLog();
      /* a boundary in the future, so there is nothing to send and no request
         can leave this page */
      IO.mirror.set({ url: 'https://script.google.com/macros/s/X/exec', on: 1,
        pushed: { __thr: '2999-01-01T00:00:00.000Z' } });
      await IO.mirror.onOpen('__thr', 'tick');
      TH.line = IO.mirror.log().slice(-1)[0] || {};
    } catch (e) { TH.err = String(e); }
    finally {
      IO.readTable = realRead;
      delete document.head.appendChild;
      IO.mirror.clearLog();
      IO.mirror.set({ url: '', on: 1, sheetV: keepV, pushed: { __thr: '' }, seen: { '__thr|Boom': '' } });
    }
  }
  ok('mirror: a read that crashes logs what crashed, not a question mark', () =>
    /read-failed:threw:.*smoke-boom/.test(TH.line.y || ''));

  /* ---- a clash must not stop the rows coming in ----
     The PC, 2026-09-13: "IO.logConflict is not a function" on every sync. A
     sheet line older than this device's copy is a clash, the clash was logged
     through a function that did not exist, and the throw came before _Data was
     merged — so the phone's rows came down and were never stored. Driven
     through onOpen with a faked sheet holding both: one clashing table line
     and one new row from the other device. */
  const CL = {};
  {
    IO.register({ app: '__clash', name: 'Clash', types: [stamp],
      tables: [{ name: 'Clash', type: stamp, cols: [['name', 'Name']] }] });
    const keepV = IO.mirror.settings.sheetV;
    Rec.set(stamp, null, 'c1', { name: 'newer-here' });
    Rec.set(stamp, null, 'from-phone', { name: 'placeholder' });
    const incoming = Object.assign({}, Rec.row(stamp, null, 'from-phone'),
      { payload: { name: 'arrived' }, updated_at: new Date(Date.now() + 60000).toISOString() });
    Rec.del(stamp, null, 'from-phone');
    const bag = IO.bagName('__clash');
    document.head.appendChild = function (el) {
      const m = el && el.src && /callback=([^&]+)/.exec(el.src);
      if (m) {
        const idx = {}; idx.Clash = { rows: 2, edited: '2999-01-01T00:00:00.000Z' }; idx[bag] = { rows: 2, edited: '' };
        const tabs = { Clash: [['id', 'date', 'Name', 'edited', 'by'], ['c1', '', 'older-in-sheet', '2000-01-01T00:00:00.000Z', 'sheet']] };
        tabs[bag] = [['Motherbase rows.'], [JSON.stringify(incoming), incoming.id]];
        const reply = /want=index/.test(el.src)
          ? { ok: true, v: 4, index: idx, pushedAt: { __clash: 'OTHER-DEVICE' } }
          : { ok: true, v: 4, tabs: tabs };
        setTimeout(() => window[m[1]] && window[m[1]](reply), 0);
        return el;
      }
      return Node.prototype.appendChild.call(this, el);
    };
    try {
      IO.mirror.clearLog();
      IO.mirror.set({ url: 'https://script.google.com/macros/s/X/exec', on: 1,
        pushed: { __clash: '2999-12-31T00:00:00.000Z' }, seen: { '__clash|Clash': '', '__clash|_Data': '' } });
      await IO.mirror.onOpen('__clash', 'tick');
      CL.line = IO.mirror.log().slice(-1)[0] || {};
      CL.arrived = (Rec.get(stamp, null, 'from-phone') || {}).name;
      CL.kept = (Rec.get(stamp, null, 'c1') || {}).name;
      CL.noted = Rec.all('conflict').filter(r => r.payload && r.payload.app === '__clash').length;
    } catch (e) { CL.err = String(e); }
    finally {
      delete document.head.appendChild;
      IO.mirror.clearLog();
      IO.mirror.set({ url: '', on: 1, sheetV: keepV, pushed: { __clash: '' }, seen: { '__clash|Clash': '', '__clash|_Data': '' } });
      Rec.all('conflict').filter(r => r.payload && r.payload.app === '__clash').forEach(r => Rec.del('conflict', r.date, r.key));
      Rec.del(stamp, null, 'c1');

  /* ---- reading another app's save tab ----
     One level under "LOG on GitHub never shows the phone's bullets": a pull
     read only its own _Data tab, and STATUS's rows live in STATUS's. An app
     naming another in `reads` downloads that tab when that app has pushed
     since it last looked, and keeps only the types it named. */
  const RD = {};
  {
    const bag = IO.bagName('__writer'), asked = [];
    IO.register({ app: '__reader', name: 'Reader', types: [stamp + 'r'], reads: { __writer: [stamp] } });
    const incoming = { id: Rec.USER + '|' + stamp + '||from-writer', user_id: Rec.USER, type: stamp, date: null,
      key: 'from-writer', payload: { name: 'arrived' }, updated_at: new Date(Date.now() + 60000).toISOString(), deleted: false };
    const photo = Object.assign({}, incoming, { id: Rec.USER + '|shot||not-mine', type: 'shot', key: 'not-mine' });
    const keep = IO.mirror.settings, keepSeen = JSON.parse(JSON.stringify(keep.seen || {}));
    /* Forget this check's own mark first, by blanking it. Saving merges `seen`
       with what is on disk, so a deleted key comes straight back: the first
       run left `__reader|...` marked, the cleanup below could not remove it,
       and every later run on that device skipped the read and failed. */
    keepSeen['__reader|' + bag] = '';
    IO.mirror.set({ seen: JSON.parse(JSON.stringify(keepSeen)) });
    document.head.appendChild = function (el) {
      const m = el && el.src && /callback=([^&]+)/.exec(el.src);
      if (m) {
        asked.push(decodeURIComponent((/only=([^&]*)/.exec(el.src) || [])[1] || ''));
        const tabs = {}; tabs[bag] = [['Motherbase rows.'], [JSON.stringify(incoming)], [JSON.stringify(photo)]];

      const pre = { v: 4, index: idx, pushedAt: { __writer: 'W1' } };
      await IO.mirror.pull('__reader', pre);
      RD.arrived = (Rec.get(stamp, null, 'from-writer') || {}).name;
      RD.photo = Rec.get('shot', null, 'not-mine');
      RD.again = await IO.mirror.pull('__reader', pre);
      RD.asked = asked.slice();
    } catch (e) { RD.err = String(e); }
    finally {
      delete document.head.appendChild;

    const leaked = blob.some(x => x && Rec.get('skin', null, x.id));

    Skins.fontLinks({}) === '' && Skins.fontLinks(null) === '');
  /* ---- the status window look ----
     One table of palettes and one cut-corner shape, read by NOTICE to draw a

     keep is not "is BLOCK gold": it is that both readers get the SAME shape out
     of it, because a shape that drifts is the only way these two can disagree
     about what a status window looks like. */
  ok('notice: four windows, each with its own palette', (() => {
    const l = Notice.list();

    return new Set(accs).size === accs.length;

    Notice.list().every(x => {

  ok('notice: the canvas path and the CSS clip describe the same octagon', (() => {

    const c = document.createElement('canvas').getContext('2d');

    const spy = { beginPath(){ pts = 0; }, rect(){ pts = 4; }, moveTo(){ pts++; }, lineTo(){ pts++; }, closePath(){} };
    Notice.frame(spy, 0, 0, 100, 100, 10);
    const cut = pts;
    Notice.frame(spy, 0, 0, 100, 100, 0);
    const square = pts;
    const css = Notice.clipPath(10);

    Notice.wear(n, 'hunter');
    const acc = n.style.getPropertyValue('--nw-acc').trim();
    const clip = n.style.getPropertyValue('--nw-clip').trim();
    /* --nw-*, never a theme token: an app's own chrome must stay themable. */
    const names = [].slice.call(n.style);
    return acc === Notice.get('hunter').acc && /^polygon/.test(clip) &&
      names.length > 0 && names.every(k => k.indexOf('--nw-') === 0);
  })());

  /* ---- a number is replaced, words are edited ----
     One level under "the spending amount was not selected": the bug was never
     about spending. It is which KIND of box comes up selected, and that is one
     rule read off the box, so every amount in every app is covered by it and
     no note anywhere is wiped by it. */
  ok('ui: an amount box is a number box and a words box is not', (() => {
    const mk = (t, im) => { const n = document.createElement('input'); n.type = t; if (im) n.setAttribute('inputmode', im); return n; };
    return UI.isNumberBox(mk('number')) && UI.isNumberBox(mk('text', 'decimal')) &&
      UI.isNumberBox(mk('text', 'numeric')) && !UI.isNumberBox(mk('text')) &&
      !UI.isNumberBox(mk('text', 'search'));
  })());
  ok('ui: every money and number field Mobile builds is one', (() => {
    const M = window.Mobile;
    if (!M || !M.field) return false;
    return ['number', 'decimal', 'money'].every(k => UI.isNumberBox(M.field(document.createElement('input'), k))) &&
      !UI.isNumberBox(M.field(document.createElement('input'), 'text'));
  })());
  /* ---- nothing half-typed is lost ----
     One level under "my change to the base time did not survive a refresh".
     The bug was never about BLOCK or about times: it is that a field which
     commits on BLUR has told the app nothing while the cursor is still in it,
     and a page going away does not reliably blur it first. So the thing to
     check is that asking for a commit runs the field's own blur handler, even
     when the document is not focused and the real event never fires — which
     is exactly the state a test runs in, so this cannot pass by luck. */
  ok('ui: committing the focused field runs its blur handler', (() => {
    const n = document.createElement('input');
    n.type = 'text';
    let ran = 0, saw = '';
    n.onblur = () => { ran++; saw = n.value; };
    document.body.appendChild(n);
    n.focus();
    n.value = '8:15';
    UI.commitFocused();
    const out = { ran: ran, saw: saw };
    n.remove();
    return out.ran === 1 && out.saw === '8:15';
  })());
  ok('ui: committing with nothing focused does nothing at all', (() => {
    const n = document.createElement('input');
    let ran = 0;
    n.onblur = () => { ran++; };
    document.body.appendChild(n);
    n.blur();
    if (document.activeElement === n) { n.remove(); return true; }   /* could not unfocus; not the case being asked about */
    UI.commitFocused();
    n.remove();
    return ran === 0;
  })());

  ok('ui: a box that asks to keep its caret is left alone', (() => {
    const n = document.createElement('input');
    n.type = 'number'; n.setAttribute('data-keep-caret', '1');
    return !UI.isNumberBox(n);
  })());
  ok('ui: focusing an amount selects it, focusing words does not', (() => {
    const a = document.createElement('input');
    a.type = 'text'; a.setAttribute('inputmode', 'decimal'); a.value = '1040';
    const b = document.createElement('input');
    b.type = 'text'; b.value = 'a note half written';
    document.body.appendChild(a); document.body.appendChild(b);
    a.setSelectionRange(4, 4); b.setSelectionRange(19, 19);
    a.dispatchEvent(new FocusEvent('focusin', { bubbles: true }));
    b.dispatchEvent(new FocusEvent('focusin', { bubbles: true }));
    const got = [a.selectionStart, a.selectionEnd, b.selectionStart, b.selectionEnd].join();
    a.remove(); b.remove();
    return got === '0,4,19,19';
  })());

  /* ---- the icon master set ----
     The whole design is that one drawing serves many buttons. These checks are
     what keep that true: a suite with one drawing per button is a suite where
     nobody looked for an existing one first. */
  ok('icons: loaded, with drawings and buttons', (() => {
    const r = Icons.reuse();
    return r.drawings >= 30 && r.roles >= 80;
  })());
  ok('icons: every button has a drawing behind it',
    Object.keys(Icons.ROLES).every(role => !!Icons.PATHS[Icons.ROLES[role]]));
  ok('icons: no drawing is carried for nothing',
    Icons.list().every(id => Icons.usersOf(id).length > 0));
  ok('icons: buttons outnumber drawings, which is the point',
    Icons.reuse().perDrawing >= 2);
  ok('icons: every app in the dock has one',
    ['home', 'block', 'status', 'log', 'quest', 'train', 'checkin', 'system', 'style',
     'arc', 'wealth', 'form', 'portion', 'speak']
      .every(a => !!Icons.iconFor('app.' + a)));
  ok('icons: the minus, trophy and three lines TRAIN drew for itself are in the set',
    ['minus', 'record', 'nav'].every(r => !!Icons.svg(r)));
  ok('icons: it renders currentColor svg, so it takes the colour beside it', (() => {
    const svg = Icons.svg('add');
    return /^<svg/.test(svg) && /stroke="currentColor"/.test(svg) && /viewBox="0 0 24 24"/.test(svg);
  })());
  ok('icons: an unknown button draws nothing rather than a broken square',
    Icons.svg('no-such-button-anywhere') === '');
  /* A theme is allowed the stroke and nothing else. If a theme could change the
     shape, every theme would owe forty drawings. */
  ok('icons: a theme changes the stroke, and two themes differ', (() => {
    const w = id => (Icons.svg('add', { skin: Skins.get(id) }).match(/stroke-width="([^"]+)"/) || [])[1];
    return w('doodle') !== w('monarch') && !!w('ice');
  })());
  ok('icons: the shape is the same in every theme', (() => {
    const d = id => (Icons.svg('add', { skin: Skins.get(id) }).match(/ d="([^"]+)"/) || [])[1];
    return d('doodle') === d('monarch') && d('ice') === d('ragnarok');
  })());
  /* ---- a theme may not move anything ----
     Five themes were quietly setting padding on the card, so a card was a
     different size depending on which theme you were wearing. That is the rule
     this whole layer was built around and it was being broken in the data
     rather than in the code, where no check was looking. */
  ok('skins: no theme sets padding or margin on a container', (() => {
    /* Read it as BLOCKS, not as lines. A selector and its declarations are
       routinely on different lines, so the line-by-line version passed a
       margin that belonged to a ::before whose selector sat one line above. */
    const BAD = /(^|[;{\s])(padding|margin)(-top|-bottom|-left|-right)?\s*:/;
    const offenders = [];
    Skins.data.skins.forEach(k => {
      const css = (k.css || '').replace(/\/\*[\s\S]*?\*\//g, '');
      css.split('}').forEach(chunk => {
        const at = chunk.lastIndexOf('{');
        if (at < 0) return;
        const sel = chunk.slice(0, at), body = chunk.slice(at + 1);
        /* a pseudo-element positions a mark, not a box */
        if (/::(before|after)/.test(sel)) return;
        body.split(';').forEach(decl => {
          if (!BAD.test(decl)) return;
          /* the gap under a heading's rule is part of drawing the rule */
          if (/padding-bottom\s*:\s*var\(--s-2\)/.test(decl)) return;
          offenders.push(k.id + ' {' + sel.trim().slice(0, 22) + '} ' + decl.trim());
        });
      });
    });
    if (offenders.length) console.warn('theme spacing offenders:', offenders);
    return offenders.length === 0;
  })());
  /* A theme naming a token that does not exist paints NOTHING and says nothing
     about it. Lego's header went transparent because I wrote var(--panel):
     the four base colours are called bg, panel, accent and text, but the
     tokens they become are --bg, --surface-1, --accent and --text-1. */
  /* A theme writing its own colour as a literal, when a token already holds
     that exact colour, quietly breaks the colour editor: you change "Card
     fill" and nothing moves, because the CSS said #FFFFFF rather than
     var(--surface-1). Ragnarok was doing it seventeen times and its card was
     unreachable. */
  ok('skins: no theme writes a colour a token already holds', (() => {
    const OF = { bg: '--bg', panel: '--surface-1', accent: '--accent', text: '--text-1' };
    const bad = [];
    Skins.data.skins.forEach(k => {
      const css = (k.css || '').replace(/\/\*[\s\S]*?\*\//g, '');
      const holds = {};
      Object.keys(OF).forEach(n => { if (k.base[n]) holds[k.base[n].toLowerCase()] = OF[n]; });
      Object.keys(k.overrides || {}).forEach(tok => {
        const v = k.overrides[tok];
        if (typeof v === 'string' && v[0] === '#') holds[v.toLowerCase()] = holds[v.toLowerCase()] || tok;
      });
      (css.match(/#[0-9a-f]{6}\b/gi) || []).forEach(h => {
        if (holds[h.toLowerCase()]) bad.push(k.id + ' ' + h + ' is ' + holds[h.toLowerCase()]);
      });
    });
    if (bad.length) console.warn('literal where a token exists:', bad);
    return bad.length === 0;
  })());

  ok('skins: no theme names a token that does not exist', (() => {
    const real = Object.keys(Skins.tokensFor(Skins.data.skins[0]));
    const bad = [];
    Skins.data.skins.forEach(k => {
      const css = (k.css || '').replace(/\/\*[\s\S]*?\*\//g, '');
      let m; const re = /var\((--[a-z0-9-]+)/g;
      while ((m = re.exec(css))) if (real.indexOf(m[1]) === -1) bad.push(k.id + ' ' + m[1]);
    });
    if (bad.length) console.warn('unknown tokens:', bad);
    return bad.length === 0;
  })());

  ok('skins: every theme draws a card the same size', (() => {
    /* the measurement tokens are what decide it, and no theme may touch them */
    return Skins.data.skins.every(k => {
      const t = Skins.tokensFor(k);
      return t['--s-4'] === '16px' && t['--s-5'] === '24px' && t['--tap'] === '44px';
    });
  })());

  /* ---- a pack is a file you can hand someone ---- */
  ok('icons: a pack round-trips through its file format', (() => {
    const file = Icons.packFile('pixel');
    const back = Icons.readPack(file);
    return !back.error && back.pack.id === 'pixel'
      && Object.keys(back.pack.paths || {}).length === Icons.packRedraws('pixel').length;
  })());
  ok('icons: a dropped pack installs, is used, and can be removed', (() => {
    const res = Icons.readPack(JSON.stringify({ kind: Icons.PACK_KIND, id: '__drop',
      name: 'Dropped', style: { weight: 3, cap: 'butt', join: 'miter' },
      paths: { plus: 'M2 2h20' } }));
    if (res.error) return false;
    /* readPack slugifies the id, so use the one it hands back rather than the
       one that went in. Leading underscores do not survive, which is exactly
       the sort of thing worth finding here rather than in the app. */
    const id = res.pack.id;
    Icons.savePack(res.pack);
    const there = Icons.packs().indexOf(id) > -1;
    const used = / d="M2 2h20"/.test(Icons.svg('add', { skin: { iconPack: id } }));
    const weight = Icons.styleFor({ iconPack: id }).weight === 3;
    Icons.forgetPack(id);
    return there && used && weight && Icons.packs().indexOf(id) === -1;
  })());
  ok('icons: a stroke-only pack is valid, a nonsense file is not',
    !Icons.readPack('{"name":"x","style":{"weight":2}}').error &&
    !!Icons.readPack('{"name":"x"}').error &&
    !!Icons.readPack('not json').error &&
    !!Icons.readPack('{"base":{"bg":"#000"}}').error);
  ok('icons: a pack file says what it is',
    JSON.parse(Icons.packFile('bold')).kind === Icons.PACK_KIND);

  /* ---- icon packs ----
     A pack swaps the whole set. Most of a pack is a stroke recipe rather than
     new drawings, which is what makes a pack cost nothing. It may also redraw
     individual icons, and a theme naming a single drawing still beats it. */
  ok('icons: every pack builds a full style', Icons.packs().every(id => {
    const st = Icons.styleFor({ iconPack: id });
    return st.weight > 0 && st.cap && st.join;
  }));
  ok('icons: the packs are actually different from each other', (() => {
    const seen = Icons.packs().map(id => {
      const st = Icons.styleFor({ iconPack: id });
      return [st.weight, st.cap, st.join, !!st.wobble].join('/');
    });
    return new Set(seen).size === seen.length;
  })());
  ok('icons: a pack may redraw an icon, and does', (() => {
    const d = p => Icons.svg('add', { skin: { iconPack: p } }).match(/ d="([^"]+)"/)[1];
    return Icons.packRedraws('pixel').length > 0 && d('pixel') !== d('line');
  })());
  /* svg() takes a ROLE, not a drawing name. 'gear' is a drawing; the button
     that uses it is called 'settings'. Getting this wrong returns an empty
     string rather than throwing, which is how it slipped past me once. */
  ok('icons: what a pack does not redraw it inherits', (() => {
    const d = p => (Icons.svg('settings', { skin: { iconPack: p } })
      .match(/ d="([^"]+)"/) || [])[1];
    return Icons.packRedraws('pixel').indexOf('gear') === -1
      && !!d('line') && d('pixel') === d('line');
  })());
  ok('icons: a theme still overrides its pack', (() => {
    const st = Icons.styleFor({ iconPack: 'bold', icon: { weight: 1.1 } });
    return st.weight === 1.1;
  })());
  ok('icons: a theme naming one drawing beats the pack', (() => {
    const d = Icons.svg('add', { skin: { iconPack: 'pixel', icons: { plus: 'M1 1' } } });
    return / d="M1 1"/.test(d);
  })());
  ok('icons: an unknown pack falls back rather than breaking',
    Icons.packOf({ iconPack: 'no-such-pack' }) === 'line');

  ok('icons: a button can be pointed elsewhere and put back', (() => {
    const was = Icons.iconFor('add');
    Rec.setting('style', 'icons', { add: 'star' });
    const moved = Icons.iconFor('add') === 'star';
    Rec.setting('style', 'icons', {});
    return moved && Icons.iconFor('add') === was;
  })());

  /* ---- the themes have to be there with no network ----
     skins.js fetches skins.json, and a page opened off the disk cannot fetch.
     The built-in list used to hold one placeholder theme, so every app opened
     from a folder showed a library of exactly one. The factory set is embedded
     now, and these two checks are what stop the copy going stale. */
  ok('skins: the embedded themes carry the whole factory set, not a placeholder',
    Skins.builtin && Skins.builtin.skins && Skins.builtin.skins.length >= 10);
  ok('skins: the embedded copy has not drifted from skins.json', (() => {
    /* Skins.data is whatever load() fetched. Over http that is skins.json, so
       the two must agree exactly. Run tools/embed-skins.py if this fails. */
    const a = Skins.builtin.skins, b = Skins.data.skins;
    if (a.length !== b.length) return false;
    const key = k => JSON.stringify(k, Object.keys(k).sort());
    const A = a.map(key).sort(), B = b.map(key).sort();
    return A.every((v, i) => v === B[i]);
  })());
  ok('skins: every theme still names a face nothing else uses', (() => {
    const faces = Skins.data.skins.map(k => (k.texture || {}).display || '').filter(Boolean);
    return new Set(faces).size === faces.length;
  })());
  ok('skins: a theme that brings css keeps it in the embedded copy',
    Skins.builtin.skins.filter(k => k.id === 'ragnarok').every(k => (k.css || '').length > 100));

  ok('skins: a saved theme is in the backup, so a reinstall keeps it', (() => {
    IO.register({ app: '__sk', name: 'Sk', types: ['skin'] });
    Skins.saveCustom({ id: '__t2', name: 'T2', mode: 'dark', custom: true, depth: 'glow',
      base: { bg: '#000000', panel: '#111111', accent: '#FF0090', text: '#FFFFFF' } });
    const bag = IO.bagFor('__sk');
    const carried = bag.rows.some(r => r.type === 'skin' && r.key === '__t2' &&
      r.payload.depth === 'glow');
    Skins.forget('__t2');
    return carried;
  })());

  /* ---- the backup stamp ---- */
  /* Also because it broke: the stamp was written when the button was pressed
     rather than when the file landed, so an iPhone — where the download
     silently does nothing — reported backups that did not exist. */
  /* Backing up and being told you have not backed up in a fortnight is the app
     calling you a liar. The line is built by one function so it cannot say one
     thing on open and another after a backup. */
  ok('io: the backed-up line is built in one place, so it can be repainted', () =>
    typeof IO.freshLine === 'function' && /rows/.test(IO.freshLine('__smoke')));
  ok('io: backing up repaints the line rather than leaving it stale', () =>
    /repaint\(\)/.test(String(IO.panel)) && /IO\.backup\(appId\)\.then\(repaint\)/.test(String(IO.panel)));
  /* The careful version of this was in backup() and not in the button beside
     it, which stamped every app as safe before the share sheet was answered. */
  ok('io: backing up every app also waits for the file', () =>
    /if \(!done\)/.test(String(IO.backupAll)) && /return save\(/.test(String(IO.backupAll)));
  ok('io: a backup that saved nothing does not claim to have run', (() => {
    const key = 'mb.backup.__smoke', had = localStorage.getItem(key);
    localStorage.removeItem(key);
    const stamped = localStorage.getItem(key) != null;
    if (had != null) localStorage.setItem(key, had);
    return !stamped && IO.staleDays('__smoke') === null && IO.isStale('__smoke');
  })());
  ok('io: save() reports whether the file actually went anywhere',
    typeof IO.backup === 'function' && /Promise|then/.test(String(IO.backup)));

  /* ---- the picture ----
     IO.shot photographs a live element into a see-through PNG. The first two
     versions of it in STATUS looked right in code and came out wrong, twice,
     for the same reason: an SVG has no page, so everything the page was
     HANDING DOWN to the element - its colour, its typeface, its theme tokens -
     went missing, and each missing thing looked like its own little bug.

     So the check below is not "did a picture come out". It is "did the picture
     keep what the page was handing it", which is the one question that would
     have caught black calories and serif labels the first time, before he saw
     either of them.

     It photographs two solid squares rather than any text. One is painted from
     a theme token and one from the inherited text colour, so if inheritance is
     lost they come out transparent or black, and a square is something you can
     read a single pixel out of without caring about fonts. */
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:40px;height:40px;display:flex';
  const pa = document.createElement('div'); pa.style.cssText = 'flex:1;background:var(--accent)';
  const pb = document.createElement('div'); pb.style.cssText = 'flex:1;background:currentColor';
  probe.appendChild(pa); probe.appendChild(pb);
  document.body.appendChild(probe);
  const wantAcc = getComputedStyle(pa).backgroundColor;
  const wantInk = getComputedStyle(pb).backgroundColor;

  let shotSize = false, shotKept = false, shotWhy = '';
  try {
    const png = await IO.shot(probe, { w: 40, h: 40, fill: 1, anchor: 0.5 });
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = png;
    });
    shotSize = img.width === 40 && img.height === 40;
    const cv = document.createElement('canvas');
    cv.width = 40; cv.height = 40;
    const cx = cv.getContext('2d');
    cx.drawImage(img, 0, 0);
    const at = (x, y) => { const p = cx.getImageData(x, y, 1, 1).data; return 'rgb(' + p[0] + ', ' + p[1] + ', ' + p[2] + ')'; };
    const near = (a, b) => {
      const na = (a.match(/\d+/g) || []).map(Number), nb = (b.match(/\d+/g) || []).map(Number);
      return na.length >= 3 && nb.length >= 3 &&
        Math.abs(na[0] - nb[0]) < 12 && Math.abs(na[1] - nb[1]) < 12 && Math.abs(na[2] - nb[2]) < 12;
    };
    shotKept = near(at(9, 20), wantAcc) && near(at(30, 20), wantInk);
    shotWhy = at(9, 20) + ' vs ' + wantAcc + ', ' + at(30, 20) + ' vs ' + wantInk;
  } catch (e) { shotWhy = e.message; }
  probe.remove();
  ok('io: a picture comes back the size that was asked for', shotSize);
  ok('io: a picture keeps what the page was handing down — ' + shotWhy, shotKept);

  /* ---- the story frame and the share panel ----
     Tom, 2026-09-14: one shape, a story, with the card kept where the story's
     own buttons do not cover it. The check is where the paint lands, not how
     the picture looks: inside the box painted, outside it untouched. */
  let boxIn = false, boxOut = false, boxWhy = '';
  const sq = document.createElement('div');
  sq.style.cssText = 'position:fixed;left:-9999px;top:0;width:40px;height:40px;background:var(--accent)';
  document.body.appendChild(sq);
  try {
    const png = await IO.shot(sq, { w: 100, h: 100, box: { x: 60, y: 10, w: 30, h: 80 }, fill: 1 });
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = png; });
    const cv = document.createElement('canvas'); cv.width = 100; cv.height = 100;
    const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
    const a = (x, y) => cx.getImageData(x, y, 1, 1).data[3];
    /* 40px square, 30px box: 30 by 30, from x 60 to 90, centred on y 50 */
    boxIn = a(75, 50) > 200;
    boxOut = a(20, 50) === 0 && a(75, 20) === 0 && a(75, 80) === 0;
    boxWhy = [a(75, 50), a(20, 50), a(75, 20), a(75, 80)].join(' ');
  } catch (e) { boxWhy = e.message; }
  sq.remove();
  ok('io: a picture given a box stays inside it — alpha ' + boxWhy, boxIn && boxOut);

  let panelDrawn = false, panelKept = false, panelWhy = '';
  try {
    Rec.setting('smoke', 'shareStyle', null);
    const h = IO.share({ app: 'smoke', name: 'smoke', build: o => {
      const n = document.createElement('div');
      n.style.cssText = 'width:120px;height:80px;background:var(--accent)';
      n.dataset.glass = o.glass ? 1 : 0;
      return n;
    } });
    const t0 = performance.now();
    let pv = null;
    while (performance.now() - t0 < 3000) {
      pv = h.panel.querySelector('.mb-sharepv img');
      if (pv && !pv.classList.contains('wait') && /^data:image\/png/.test(pv.src)) break;
      await new Promise(r => setTimeout(r, 50));
    }
    panelDrawn = !!pv && /^data:image\/png/.test(pv.src);
    const opaque = [].find.call(h.panel.querySelectorAll('.mb-seg button'), b => b.textContent === 'Opaque');
    if (opaque) opaque.click();
    panelKept = Rec.setting('smoke', 'shareStyle') === 'solid';
    panelWhy = (pv ? pv.src.slice(0, 22) : 'no preview') + ', style ' + Rec.setting('smoke', 'shareStyle');
    h.close();
    Rec.setting('smoke', 'shareStyle', null);
  } catch (e) { panelWhy = e.message; }
  ok('io: the share panel draws the picture before SHARE is pressed — ' + panelWhy, panelDrawn);
  ok('io: the share panel remembers the style chosen', panelKept);

  ok('skins: Block is the theme an app opens in when none is chosen', (() => {
    const first = Skins.data.skins[0];
    return (first.id === 'block' && /^#f0b323$/i.test(first.base.accent)) || first.id + ' ' + first.base.accent;
  })());

  /* ---- the chart layer ----
     Added with chart.js on 2026-09-06. The three checks are the three bugs it
     exists to stop, each of which had been fixed separately in a different
     app: a scale nobody can read, a drawing that grows with its box, and a
     time axis that is really just the first date. */
  ok('chart: a scale lands on numbers a person reads', (() => {
    const c = Chart.make({ w: 320, h: 150 });
    c.yFit([197.2, 203.8]);
    /* 195 to 205 in fives, not 197.2 to 203.8 in whatever that is */
    return c.lo % c.step === 0 && c.hi % c.step === 0 && c.lo <= 197.2 && c.hi >= 203.8;
  })());

  ok('chart: a chart does not grow taller when its box grows wider', (() => {
    const c = Chart.make({ w: 320, h: 150 });
    /* No height attribute and no inline height: the box decides, via
       .mb-chart{height:100%}. An svg with height:auto is the bug. */
    return !c.el.getAttribute('height') && !(c.el.style && c.el.style.height);
  })());

  ok('chart: a long span gets more than two dates on its axis', (() => {
    const c = Chart.make({ w: 320, h: 150 });
    const from = Day.shift(Day.today(), -89);
    c.xTime(from, Day.today());
    c.yFit([1, 2]);
    c.timeAxis();
    const labs = c.el.querySelectorAll('text.mb-lab');

  /* The chart engine, rewritten 2026-09-14 so a chart says its answer first
     and can be read closer by dragging. One check per promise it makes. */
  const offstage = (w, h) => {

    box.appendChild(c.el);
    c.xLinear(-0.5, 1.5).yFit([0, 10]).bars([[0, 5], [1, 8]], null, null, { highlight: 'last' });
    const bars = c.el.querySelectorAll('.mb-bar');

  ok('chart: dragging across a chart finds the nearest point, and letting go puts it back', () => {
    const box = offstage(400, 150);

    const r = c.el.getBoundingClientRect();

  ok('chart: the latest value is marked, and a line draws in only for those who want motion', (() => {
    const c = Chart.make({ w: 320, h: 150, anim: true });
    c.xLinear(0, 2).yFit([1, 3]).area([[0, 1], [2, 3]]).line([[0, 1], [2, 3]]).end([2, 3], '3');

      !!c.el.querySelector('.mb-area') && line.getAttribute('pathLength') === '1' && c.el.classList.contains('mb-anim');
  })());
  ok('chart: a pie keys every slice, folds past six into Other, and says the slice pointed at', (() => {
    const rows = [1, 2, 3, 4, 5, 6, 7, 8].map(i => ({ name: 'r' + i, amt: i * 10 }));
    const p = Chart.pie(rows, { label: 'spent' });

    const other = keys[keys.length - 1].querySelector('.n').textContent;

  ok('chart: shares put the biggest first, the header shows a point and returns to its own value', (() => {
    const s = Chart.shares([{ name: 'small', amt: 10 }, { name: 'big', amt: 40 }]);
    const h = Chart.header({ value: '82.1', sub: 'down 1' });
    h.set('80.0', 'a day');
