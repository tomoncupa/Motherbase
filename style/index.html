/* ---- background patterns ----
   Written once here rather than typed into every theme. Each is a plain CSS
   background, so it costs nothing, works offline and themes with the accent. */
const BGP = {
  glow:  () => ({ image: 'radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07),transparent 62%)',
                  size: '100% 100%' }),
  grid:  () => ({ image: 'linear-gradient(rgba(128,128,128,.10) 1px,transparent 1px),'
                       + 'linear-gradient(90deg,rgba(128,128,128,.10) 1px,transparent 1px)',
                  size: '32px 32px,32px 32px' }),
  dots:  () => ({ image: 'radial-gradient(rgba(128,128,128,.16) 1px,transparent 1.6px)',
                  size: '14px 14px' }),
  lines: () => ({ image: 'repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)',
                  size: 'auto' }),
  hatch: () => ({ image: 'repeating-linear-gradient(45deg,rgba(128,128,128,.08) 0 2px,transparent 2px 6px)',
                  size: 'auto' }),
  paper: () => ({ image: 'radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.5px),'
                       + 'radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.5px)',
                  size: '7px 7px,11px 11px' }),
};

/* A picture becomes part of the theme, so it has to be small enough to live in
   a row and travel in a backup. Shrunk to fit and re-encoded before it is
   stored; a 4MB photo off a phone would otherwise sit in localStorage forever. */
function loadBackground(file) {
  const MAXPX = 1600, MAXKB = 500;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, MAXPX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let url = c.toDataURL('image/jpeg', 0.82);
      if (url.length > MAXKB * 1400) url = c.toDataURL('image/jpeg', 0.62);
      const kb = Math.round(url.length / 1400);
      draft.texture = draft.texture || {};
      draft.texture.image = 'url("' + url + '")';
      draft.texture.size = 'cover';
      touch(); drawEditor();
      UI.toast('picture added, <b>' + kb + 'kb</b>'
        + (kb > MAXKB ? ' &mdash; that is large for a theme' : ''));
    };
    img.onerror = () => UI.toast('that file is not a picture this browser can read', { bad: true });
    img.src = r.result;
  };
  r.onerror = () => UI.toast('could not read that file', { bad: true });
  r.readAsDataURL(file);
}

/* The full token set for a theme, palette included, without painting the page.
   This is `apply()` minus the side effects, which is exactly what a preview
   needs and exactly what a live edit needs. */
function tokensFull(skin, pal) {
  const use = pal || (Skins.isCustomised(skin.id) ? Skins.paletteFor(skin.id) : null);
  const t = Skins.tokensFor(skin);
  return use ? Object.assign(t, Skins.palTokens(use)) : t;
}

function frameHTML(skin) {
  const t = tokensFull(skin);
  const vars = Object.keys(t).map(k => k + ':' + t[k]).join(';');
  return '<!doctype html><html data-mode="' + esc(skin.mode || 'dark') + '"><head><meta charset="utf-8">'
    + Skins.fontLinks(skin)
    + '<style>:root{' + vars + '}</style>'
    + '<style>' + SAMPLE_CSS + '</style>'
    + '<style>' + (skin.css || '') + '</style>'
    + '</head><body>' + SAMPLE_HTML + '</body></html>';
}

/* ---- am I running the current code ----
   Cheap, and it has already been worth it: three rounds were spent on a theme
   that had been rewritten twice, because the browser was serving the first
   version and nothing said so. */
function staleCheck() {
  const got = Skins.data && Skins.data.rev;
  if (got === NEEDS_REV) return;
  const bar = document.createElement('div');
  bar.className = 'stalebar';
  bar.innerHTML =
    Icons.svg('warning', { size: 18 })
    + '<span>Your browser is showing a <b>cached copy</b>. The themes on screen '
    + 'are older than the ones on disk'
    + (got ? ' (loaded revision ' + got + ', expected ' + NEEDS_REV + ')' : '')
    + '.</span>';
  const b = document.createElement('button');
  b.className = 'mb-btn mb-press mb-tap';
  b.textContent = 'LOAD IT FRESH';
  b.onclick = () => {
    /* A changing query string is the one reload the cache cannot answer. */
    location.href = location.pathname + '?fresh=' + Date.now();
  };
  bar.appendChild(b);
  document.body.insertBefore(bar, document.body.firstChild);
}

/* ---- the left rail ---- */
function drawRail() {
  const list = Skins.list();
  /* Anything past the limit, so it is visible which ones to remove rather than
     just a warning that you have too many. */
  const yours = list.filter(s => !Skins.factory(s.id));
  const over = yours.slice(MAX_MINE).map(s => s.id);
  const n = yours.length;
  $('#count').innerHTML = list.length + ' themes'
    + (n ? ' &middot; ' + n + ' of yours' : '')
    + (n > MAX_MINE
        ? ' <b style="color:var(--warn)">&middot; ' + (n - MAX_MINE)
          + ' over, delete ' + (n - MAX_MINE === 1 ? 'one' : 'some') + '</b>'
        : '');
  const box = $('#rail');
  box.innerHTML = '<div class="railhead">THEMES</div>';
  list.forEach(s => {
    const t = tokensFull(s);
    const isNew = !Skins.factory(s.id);
    const edited = Skins.isEdited(s.id) && !isNew;
    /* A row, not a button, because it holds a button. */
    const b = document.createElement('div');
    b.className = 'tline mb-press' + (s.id === sel ? ' on' : '')
      + (isNew && over.indexOf(s.id) > -1 ? ' over' : '');
    b.tabIndex = 0;
    b.setAttribute('role', 'button');
    b.innerHTML =
      '<span class="dots">'
      + '<i style="background:' + t['--bg'] + '"></i>'
      + '<i style="background:' + t['--surface-1'] + '"></i>'
      + '<i style="background:' + t['--accent'] + '"></i></span>'
      + '<span class="nm" style="font-family:' + t['--font-display'] + '">' + esc(s.name) + '</span>'
      + (isNew ? '<span class="tag">MINE</span>'
               : edited ? '<span class="tag">EDITED</span>' : '');
    b.onclick = () => select(s.id);
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(s.id); } };
    b.oncontextmenu = e => { e.preventDefault(); themeMenu(s, e.clientX, e.clientY); };
    const rm = removal(s);
    if (rm) {
      const x = document.createElement('button');
      x.className = 'del';
      x.title = rm.title;
      x.setAttribute('aria-label', rm.title);
      x.innerHTML = Icons.svg('delete', { size: 15 });
      x.onclick = e => { e.stopPropagation(); select(s.id); remove(); };
      b.appendChild(x);
    }
    box.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'tline mb-press';
  add.innerHTML = '<span class="dots"><i style="background:var(--surface-2)"></i>'
    + '<i style="background:var(--surface-3)"></i><i style="background:var(--accent)"></i></span>'
    + '<span class="nm">+ New theme</span>';
  add.onclick = newTheme;
  box.appendChild(add);
}

/* ---- the compare canvas ---- */
/* ---- which screen the middle pane is showing ----
   The rail keeps working in both: picking a theme in ICONS redraws every icon
   in that theme, which is the only honest way to judge whether a stroke weight
   survives contact with a hand-drawn face. */
let view = 'themes';
function drawTabs() {
  const box = document.getElementById('tabs');
  box.innerHTML = '';
  /* The shared segmented control, not a pair of buttons pretending to be one.
     Every other app uses it; STYLE was the only one hand-rolling its chrome. */
  box.appendChild(UI.segmented(
    [{ id: 'themes', name: 'THEMES' }, { id: 'icons', name: 'ICONS' },
     { id: 'sound', name: 'SOUND' }],
    view, id => setView(id)));
}
function setView(v) {
  view = v;
  drawTabs();
  drawGrid();
}

/* ---- the icon master database ----
   One drawing serves many buttons. This screen exists to keep that ratio
   honest: it shows every drawing with the buttons hanging off it, so adding a
   forty-first is visibly a bigger decision than pointing a new button at one
   that already exists. */
function drawIcons() {
  const box = $('#grid');
  box.className = 'icons';
  box.innerHTML = '';
  const skin = draft || Skins.current;
  const r = Icons.reuse();
  const over = Icons.overrides();

  const sum = document.createElement('div');
  sum.className = 'isum';
  sum.innerHTML = '<b>' + r.drawings + '</b> drawings carrying <b>' + r.roles
    + '</b> buttons, <b>' + r.perDrawing + '</b> buttons each. Drawn in <b>'
    + esc(skin ? skin.name : '-') + '</b>.'
    + '<br>Click a button name to point it at a different drawing. '
    + 'Reach for an existing drawing before adding one: every new drawing is '
    + 'another thing to keep in step across every theme.';
  box.appendChild(sum);

  /* anything a build asks for that nothing draws */
  const gaps = Object.keys(Icons.ROLES).filter(k => !Icons.pathFor(k, skin));
  if (gaps.length) {
    const g = document.createElement('div');
    g.className = 'warn';
    g.textContent = gaps.length + ' buttons have no drawing: ' + gaps.join(', ');
    box.appendChild(g);
  }

  const drop = document.createElement('div');
  drop.className = 'dropzone';
  drop.innerHTML = Icons.svg('upload', { size: 20 })
    + '<span>Drag an icon pack here, or <b>browse</b>. One .json file.</span>';
  const chooseP = document.createElement('input');
  chooseP.type = 'file'; chooseP.accept = '.json,application/json';
  chooseP.style.display = 'none';
  chooseP.onchange = () => { if (chooseP.files[0]) readPackFile(chooseP.files[0]); };
  drop.appendChild(chooseP);
  drop.onclick = () => chooseP.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => {
    e.preventDefault(); drop.classList.remove('over');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readPackFile(f);
    else {
      const t = e.dataTransfer.getData('text');
      if (t) installPack(t);
    }
  };
  box.appendChild(drop);

  const packBar = document.createElement('div');
  packBar.className = 'isum';
  packBar.innerHTML = '<b>Pack.</b> ';
  Icons.packs().forEach(id => {
    const b = document.createElement('button');
    b.className = 'mb-btn mb-press mb-tap' + (Icons.packOf(skin) === id ? ' on' : '');
    b.style.marginRight = 'var(--s-2)';
    b.innerHTML = Icons.svg('add', { size: 14, skin: Object.assign({}, skin, { iconPack: id, icon: null }) })
      + '<span>' + esc(Icons.pack(id).name) + '</span>';
    b.onclick = () => {
      if (!draft) return;
      draft.iconPack = id; delete draft.icon; touch(); drawGrid(); drawEditor();
    };
    b.oncontextmenu = e => {
      e.preventDefault();
      const items = [{ label: 'SAVE AS A FILE', fn: () => downloadPack(id) },
                     { label: 'COPY AS JSON', fn: () => toClipboard(Icons.packFile(id),
                        esc(Icons.pack(id).name) + ' copied') }];
      if (!Icons.isBuiltIn(id)) items.push({ label: 'DELETE PACK', kind: 'bad',
        fn: () => { Icons.forgetPack(id);
          if (draft && draft.iconPack === id) { delete draft.iconPack; touch(); }
          drawGrid(); drawEditor(); UI.toast('pack removed'); } });
      UI.menu(e.clientX, e.clientY, items);
    };
    packBar.appendChild(b);
  });
  const hint = document.createElement('span');
  hint.className = 'note';
  hint.innerHTML = ' Right-click a pack to save it as a file or remove it.';
  packBar.appendChild(hint);
  box.appendChild(packBar);

  const audit = document.createElement('div');
  audit.className = 'isum';
  audit.innerHTML = '<b>Coverage.</b> Checking which apps still use a plain '
    + 'character where an icon belongs\u2026';
  box.appendChild(audit);
  runAudit(audit);

  const grid = document.createElement('div');
  grid.className = 'igrid';
  Icons.list().forEach(id => {
    const users = Object.keys(Icons.ROLES).concat(Object.keys(over))
      .filter((v, i, a) => a.indexOf(v) === i)
      .filter(role => Icons.iconFor(role) === id).sort();
    const c = document.createElement('div');
    c.className = 'icard';
    c.innerHTML =
      '<div class="draw">' + Icons.svg(users[0] || id, { size: 26, skin: skin }) + '</div>'
      + '<div class="meta"><div class="iname">' + esc(id) + '</div>'
      + '<div class="inote">' + esc(Icons.NOTES[id] || (users.length + ' buttons'))
      + (Icons.packRedraws(Icons.packOf(skin)).indexOf(id) > -1
          ? ' <b style="color:var(--accent)">pack</b>' : '') + '</div>'
      + '<div class="chips"></div></div>';
    const chips = c.querySelector('.chips');
    users.forEach(role => {
      const b = document.createElement('button');
      b.className = 'chip' + (over[role] ? ' moved' : '');
      b.textContent = role;
      b.onclick = e => moveRole(role, e.clientX, e.clientY);
      chips.appendChild(b);
    });
    grid.appendChild(c);
  });
  box.appendChild(grid);
}

/* ---- the coverage audit ----
   The reason a master set exists is so no app goes on drawing its own buttons
   out of Unicode. A character is not an icon: it renders differently on every
   device, cannot take a colour, and disappears when a font does. This reads
   each app as it actually ships and says which ones are still doing it, so
   the answer is checked rather than assumed.

   It needs the folder served, because a page opened off the disk cannot fetch.
   It says so rather than reporting a clean bill it has not earned. */
const GLYPHS = /[\u2190-\u21FF\u2500-\u257F\u25A0-\u25FF\u2600-\u27BF\u2B00-\u2BFF\uFF0B]|[\uD83C-\uDBFF][\uDC00-\uDFFF]/g;
const AUDIT_FILES = [
  ['home', '../index.html'], ['block', '../block/index.html'],
  ['habits', '../habits/index.html'], ['form', '../form/index.html'],
  ['status', '../status/index.html'], ['train', '../train/index.html'],
  ['arc', '../arc/index.html'], ['style', 'index.html'],
  ['template', '../_template/index.html'],
];

async function runAudit(into) {
  const rows = [];
  let reachable = 0;
  for (const [name, url] of AUDIT_FILES) {
    let txt = null;
    try { const r = await fetch(url, { cache: 'no-cache' }); if (r.ok) txt = await r.text(); }
    catch (e) {}
    if (txt == null) { rows.push([name, null]); continue; }
    reachable++;
    /* Comments and the icon set's own table are not buttons, so they are cut
       before counting. This is a smell test, not a parser: it is meant to say
       which app to look at next, not to be exact. */
    const body = txt.replace(/<!--[\s\S]*?-->/g, '').replace(/\/\*[\s\S]*?\*\//g, '');
    const hits = body.match(GLYPHS) || [];
    const uses = Icons.svg ? (body.match(/Icons\.svg|Icons\.el/g) || []).length : 0;
    rows.push([name, { glyphs: hits.length, distinct: [...new Set(hits)].join(' '), uses: uses }]);
  }
  if (!reachable) {
    into.innerHTML = '<b>Coverage.</b> Cannot read the other apps from here. '
      + 'This page has to be served for the audit to run \u2014 opened straight '
      + 'off the disk a page cannot fetch its neighbours. Nothing is wrong; '
      + 'it simply cannot tell you either way.';
    return;
  }
  const clean = rows.filter(r => r[1] && r[1].glyphs === 0).length;
  into.innerHTML = '<b>Coverage.</b> ' + clean + ' of ' + reachable
    + ' apps are drawing every button. The rest are still using a plain '
    + 'character somewhere, which renders differently on every phone and cannot '
    + 'take a theme colour.<br>'
    + rows.map(([name, d]) => {
        if (!d) return '<span style="color:var(--text-muted)">' + esc(name) + ' not found</span>';
        if (!d.glyphs) return '<b style="color:var(--success)">' + esc(name) + ' clean</b>'
          + ' <span style="color:var(--text-muted)">(' + d.uses + ' drawn)</span>';
        return '<span style="color:var(--warn)">' + esc(name) + ' ' + d.glyphs
          + '</span> <span style="color:var(--text-muted)">' + esc(d.distinct.slice(0, 40))
          + (d.uses ? ' \u00b7 ' + d.uses + ' drawn' : '') + '</span>';
      }).join(' &nbsp;\u00b7&nbsp; ');
}

/* A pack leaves as the same file it arrives as. */
function downloadPack(id) {
  const blob = new Blob([Icons.packFile(id)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = id + '.iconpack.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  UI.toast('saved <b>' + esc(id) + '.iconpack.json</b>');
}

/* ---- installing an icon pack ----
   One json file, dragged on or chosen. The same text pasted in works too, so a
   pack can arrive from a chat without ever being a file. */
function readPackFile(file) {
  const r = new FileReader();
  r.onload = () => installPack(r.result);
  r.onerror = () => UI.toast('could not read that file', { bad: true });
  r.readAsText(file);
}
function installPack(text) {
  const res = Icons.readPack(text);
  if (res.error) { UI.toast(esc(res.error), { bad: true }); return; }
  Icons.savePack(res.pack);
  if (draft) { draft.iconPack = res.pack.id; delete draft.icon; touch(); }
  drawGrid(); drawEditor();
  const n = Object.keys(res.pack.paths || {}).length;
  UI.toast('added <b>' + esc(res.pack.name) + '</b>'
    + (n ? ', ' + n + ' drawings of its own' : ', a stroke recipe')
    + (res.unknown.length ? ' &mdash; ' + res.unknown.length + ' names it uses are not drawings here' : ''));
}

/* ---- sound ----
   Look, sound and feel are one idea: how the suite comes across. STYLE owns
   the first two, so it owns the third rather than leaving it buried in a
   settings panel nobody opens.

   A theme may carry `sound`, and then choosing the theme chooses its pack too:
   Minecraft should not sound like Ornate. */
function drawSound() {
  const box = $('#grid');
  box.className = 'icons';
  box.innerHTML = '';
  const skin = draft || Skins.current;

  const sum = document.createElement('div');
  sum.className = 'isum';
  sum.innerHTML = '<b>' + Sfx.PACKS.length + '</b> sound packs and <b>'
    + Sfx.VOICES.length + '</b> instruments, all worked out on the fly rather '
    + 'than played from files, so they work offline and weigh nothing.'
    + '<br>Press one to hear it. A small action stays small; only the finish '
    + 'is allowed to celebrate.';
  box.appendChild(sum);

  const grid = document.createElement('div');
  grid.className = 'igrid';
  Sfx.PACKS.forEach(p => {
    const cur = Sfx.settings.pack === p.id;
    const c = document.createElement('div');
    c.className = 'icard' + (cur ? ' on' : '');
    c.innerHTML =
      '<div class="draw">' + Icons.svg('sound', { size: 24, skin: skin }) + '</div>'
      + '<div class="meta"><div class="iname">' + esc(p.name) + '</div>'
      + '<div class="inote">' + esc(p.voice) + ', '
      + p.scale.length + ' notes</div>'
      + '<div class="chips"></div></div>';
    const chips = c.querySelector('.chips');
    const hear = document.createElement('button');
    hear.className = 'chip';
    hear.textContent = 'HEAR IT';
    hear.onclick = () => {
      const was = Sfx.settings.pack;
      Sfx.pack(p.id);
      Sfx.play('tick');
      setTimeout(() => Sfx.play('done'), 190);
      setTimeout(() => Sfx.play('complete', { level: 3 }), 420);
      if (!cur) setTimeout(() => Sfx.pack(was), 1100);
    };
    const use = document.createElement('button');
    use.className = 'chip' + (cur ? ' moved' : '');
    use.textContent = cur ? 'IN USE' : 'USE IT';
    use.onclick = () => { Sfx.pack(p.id); Sfx.play('done'); drawSound(); };
    chips.appendChild(hear); chips.appendChild(use);
    grid.appendChild(c);
  });
  box.appendChild(grid);

  /* the instrument, and how loud */
  const pad = document.createElement('div');
  pad.className = 'pad';
  box.appendChild(pad);
  pad.appendChild(el2('div', 'mb-group', 'INSTRUMENT'));
  const vsel = document.createElement('select');
  vsel.className = 'mb-sel';
  vsel.innerHTML = Sfx.VOICES.map(v =>
    '<option value="' + esc(v) + '"' + (Sfx.voice() === v ? ' selected' : '') + '>'
    + esc(v) + '</option>').join('');
  vsel.onchange = () => { Sfx.voice(vsel.value); Sfx.play('tick'); };
  pad.appendChild(UI.row('Instrument', 'what the notes are played on', vsel));

  const vol = document.createElement('input');
  vol.type = 'range'; vol.min = 0; vol.max = 1; vol.step = 0.05;
  vol.value = Sfx.volume(); vol.className = 'mb-range';
  vol.oninput = () => { Sfx.volume(+vol.value); };
  vol.onchange = () => Sfx.play('done');
  pad.appendChild(UI.row('Volume', 'zero is silent', vol));

  /* tie a pack to the theme being edited */
  if (skin) {
    pad.appendChild(el2('div', 'mb-group', 'THIS THEME&rsquo;S SOUND'));
    const tsel = document.createElement('select');
    tsel.className = 'mb-sel';
    tsel.innerHTML = '<option value="">(whatever is set above)</option>'
      + Sfx.PACKS.map(p => '<option value="' + esc(p.id) + '"'
        + ((skin.sound || '') === p.id ? ' selected' : '') + '>' + esc(p.name)
        + '</option>').join('');
    tsel.onchange = () => {
      if (!draft) return;
      if (tsel.value) draft.sound = tsel.value; else delete draft.sound;
      touch();
    };
    pad.appendChild(UI.row('Pack for ' + esc(skin.name),
      'choosing this theme also chooses this sound', tsel));
    pad.appendChild(el2('p', 'note', 'Minecraft should not sound like Ornate. '
      + 'Leave it unset and the theme does not touch your sound at all.'));
  }
}

/* a tiny element helper, since drawEditor keeps its own inside its scope */
function el2(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

/* Point one button at a different drawing. Saved as a setting, so it is in the
   backup and it does not need this file edited. */
function moveRole(role, x, y) {
  const cur = Icons.iconFor(role);
  const items = Icons.list().map(id => ({
    label: (id === cur ? '\u2713 ' : '   ') + id,
    fn: () => {
      const o = Object.assign({}, Icons.overrides());
      if (id === Icons.ROLES[role]) delete o[role]; else o[role] = id;
      Rec.setting('style', 'icons', o);
      drawGrid();
      UI.toast('<b>' + esc(role) + '</b> is now <b>' + esc(id) + '</b>');
    },
  }));
  UI.menu(x, y, items);
}

/* ---- the comparison slots ----
   The canvas is not one tile per theme. Sixteen previews is a wall, and it
   makes the answer to "how do these two compare" worse rather than better.

   It is a small number of SLOTS instead. Each one picks its own theme and can
   be closed, so what is on screen is the handful you are actually deciding
   between. Closing a slot hides a mock-up; it does nothing whatsoever to the
   theme, which stays in the list on the left.

   The arrangement is saved, so the three you were comparing are still there
   tomorrow. */
const MAX_SLOTS = 6, DEFAULT_SLOTS = 3;

function slots() {
  let saved = null;
  try { saved = Rec.setting('style', 'slots'); } catch (e) {}
  const all = Skins.list().map(k => k.id);
  let ids = Array.isArray(saved) ? saved.filter(id => all.indexOf(id) > -1) : null;
  if (!ids || !ids.length) ids = all.slice(0, DEFAULT_SLOTS);
  return ids.slice(0, MAX_SLOTS);
}
function setSlots(ids) {
  try { Rec.setting('style', 'slots', ids.slice(0, MAX_SLOTS)); } catch (e) {}
  drawGrid();
}

function drawGrid() {
  if (view === 'icons') return drawIcons();
  if (view === 'sound') return drawSound();
  const box = $('#grid');
  box.className = 'grid';
  box.innerHTML = '';
  const ids = slots();
  ids.forEach((id, i) => box.appendChild(tile(Skins.get(id), i)));
  if (ids.length < MAX_SLOTS) box.appendChild(addTile(ids));
}

/* ══════════════ does this theme read? ══════════════
   The engine will not ship an unreadable colour: every text token is lifted
   away from what it sits on until it clears 4.5, which is the ratio a person
   with ordinary eyesight needs to read a paragraph. That is silent and
   automatic and it fixes fifteen of the eighteen.

   It cannot fix everything, and the gap is worth naming rather than hiding.
   Two things it cannot see:

   LIFTED  A theme whose own colours failed and were corrected. Nothing is
           broken and the screen reads, but what you see is not quite what you
           wrote, and you would rather know.

   PAINTED A theme that writes a colour into its own stylesheet instead of
           reaching for a token. That colour is on an element, not in a token,
           so no amount of arithmetic reaches it — Ragnarok's header is a blue
           gradient with a pale blue word on it at 1.04, which is a word you
           cannot see, and the floor never gets a look.

   Both are the theme's to fix, in here, which is why the warning lives on the
   tile rather than in a console nobody opens. */
function contrastNote(skin) {
  const c = Skins.check(skin.base, skin);
  const lifted = (c.nudged || []).map(n => n.token.replace('--', '') + ' was ' + n.had);
  /* A hex in the theme's own stylesheet is a colour the floor cannot reach.
     Comments are stripped first: BLOCK's stylesheet quotes the two colours it
     replaced, in a note explaining that it replaced them, and counting those
     as faults would be the tool marking its own homework wrong. */
  const bare = (skin.css || '').replace(/\/\*[\s\S]*?\*\//g, '');
  const painted = bare.match(/#[0-9a-fA-F]{3,8}\b/g) || [];
  const solid = painted.filter(h => !/^#[0-9a-fA-F]{8}$/.test(h));
  return { lifted: lifted, painted: solid.length, distinct: [...new Set(solid)].slice(0, 6) };
}

function tile(skin, index) {
  const d = document.createElement('div');
  d.className = 'pv' + (skin.id === sel ? ' on' : '');
  d.dataset.id = skin.id;
  d.dataset.slot = index;

  const head = document.createElement('div');
  head.className = 'pvhead';

  /* the picker: this slot can show any theme, and swapping is the point */
  const pick = document.createElement('select');
  pick.className = 'mb-sel pvpick';
  pick.innerHTML = Skins.list().map(k =>
    '<option value="' + esc(k.id) + '"' + (k.id === skin.id ? ' selected' : '') + '>'
    + esc(k.name) + '</option>').join('');
  pick.onchange = () => {
    const ids = slots(); ids[index] = pick.value; setSlots(ids);
  };
  head.appendChild(pick);

  if (Skins.current && Skins.current.id === skin.id) {
    const t = document.createElement('span');
    t.className = 'tag'; t.textContent = 'STYLE';
    head.appendChild(t);
  }

  const note = contrastNote(skin);
  if (note.lifted.length || note.painted) {
    const w = document.createElement('span');
    w.className = 'tag warn';
    w.textContent = [note.lifted.length ? 'LIFTED ' + note.lifted.length : '',
                     note.painted ? 'PAINTS ' + note.painted : ''].filter(Boolean).join(' \u00b7 ');
    w.title = (note.lifted.length
        ? 'Corrected so it reads: ' + note.lifted.join(', ') + '.\n'
        : '')
      + (note.painted
        ? note.painted + '' + (note.painted === 1 ? ' colour is' : ' colours are') + ' written into this theme\u2019s own CSS rather than '
          + 'taken from a token, so the contrast floor cannot reach ' + (note.painted === 1 ? 'it' : 'them') + ': '
          + note.distinct.join(' ') + '.'
        : '');
    head.appendChild(w);
  }

  const mk = (act, label, title, html) => {
    const b = document.createElement('button');
    b.className = 'mini'; b.title = title;
    if (html) b.innerHTML = html; else b.textContent = label;
    b.onclick = e => { e.stopPropagation(); act(b); };
    head.appendChild(b);
    return b;
  };
  mk(() => { Skins.apply(skin.id); Sfx.play('drop'); drawAll();
             UI.toast('STYLE is <b>' + esc(skin.name) + '</b>'); },
     'USE', 'Make STYLE itself wear this theme');
  mk(b => { const r = b.getBoundingClientRect(); themeMenu(skin, r.left, r.bottom + 4); },
     '⋯', 'More');
  mk(() => { const ids = slots(); ids.splice(index, 1); setSlots(ids); },
     null, 'Close this mock-up. The theme itself is not touched.',
     Icons.svg('close', { size: 14 }));

  d.appendChild(head);
  const wrap = document.createElement('div');
  wrap.className = 'pvwrap';
  wrap.innerHTML = '<iframe title="' + esc(skin.name) + ' preview"></iframe>'
    + '<div class="pvsheet"></div>';
  wrap.querySelector('iframe').srcdoc = frameHTML(skin);
  wrap.querySelector('.pvsheet').onclick = () => select(skin.id);
  d.appendChild(wrap);
  d.oncontextmenu = e => { e.preventDefault(); themeMenu(skin, e.clientX, e.clientY); };
  return d;
}

/* An empty slot, so adding one back is as easy as closing one. */
function addTile(ids) {
  const d = document.createElement('div');
  d.className = 'pv addpv';
  const unused = Skins.list().filter(k => ids.indexOf(k.id) === -1)[0] || Skins.list()[0];
  d.innerHTML = '<button class="addbtn mb-press">'
    + Icons.svg('add', { size: 22 })
    + '<span>Compare another</span></button>';
  d.querySelector('.addbtn').onclick = () => setSlots(ids.concat([unused.id]));
  return d;
}

/* ---- hovering a control shows you what it touches ----
   The first version listed selectors by hand, and Tom caught it lying: hover
   "Text" on Ragnarok and it lit up the headings and the numbers, which that
   theme paints with its accent, not with the text colour. A hand-written list
   cannot know what a theme's own CSS has taken over.

   So it measures instead. Change the token in the frame, read every element
   before and after, highlight the ones that actually moved, put the token
   back. What lights up is then true by construction, including the useful
   negative case: nothing lights up when a theme has overridden the token, and
   the editor says so rather than leaving you wondering whether the control
   works. That is exactly the "not sure if depth works" question. */

/* What each control really changes, as tokens rather than as a guess at
   selectors. A control listed here with no tokens is structural. */
const TOKENS = {
  bg: ['--bg'], panel: ['--surface-1'], accent: ['--accent'], text: ['--text-1'],
  ramp: ['--data-1', '--data-2', '--data-3', '--data-4', '--data-5', '--data-6'],
  cut: ['--radius-sm', '--radius-md', '--radius-lg', '--radius-sheet'],
  weight: ['--border-width'],
  depth: ['--e-1', '--e-2', '--e-3', '--e-4', '--e-5', '--rim', '--bevel-in'],
  motion: ['--dur-tap', '--dur-fast', '--dur-med', '--dur-slow'],
  fdisplay: ['--font-display'], fbody: ['--font-body'],
  texture: ['--tex-image'],
  trackCap: ['--track-cap'], trackBody: ['--track-body'], trackTight: ['--track-tight'],
};
/* A value different enough that anything reading the token has to move. */
function probeValue(name) {
  if (/^--(e-|rim|bevel)/.test(name)) return '0 0 0 5px #FF00FF';
  if (/^--(radius|border-width)/.test(name)) return '13px';
  if (/^--font/.test(name)) return '"Times New Roman",serif';
  if (/^--dur/.test(name)) return '7s';
  if (/^--track/.test(name)) return '.44em';
  if (name === '--tex-image') return 'linear-gradient(#FF00FF,#00FFAA)';
  return '#FF00FF';
}
const WATCH = ['color', 'backgroundColor', 'backgroundImage', 'borderTopColor',
  'borderTopWidth', 'borderRadius', 'boxShadow', 'fontFamily', 'letterSpacing',
  'transitionDuration', 'textShadow', 'outlineColor'];

function movedBy(doc, tokens) {
  const els = [...doc.body.querySelectorAll('*')].filter(e => e.offsetParent !== null || e === doc.body);
  const read = () => els.map(e => {
    const c = doc.defaultView.getComputedStyle(e);
    let out = ''; for (const p of WATCH) out += c[p] + '|';
    return out;
  });
  const root = doc.documentElement;
  const before = read();
  const saved = tokens.map(n => root.style.getPropertyValue(n));
  tokens.forEach(n => root.style.setProperty(n, probeValue(n)));
  const after = read();
  tokens.forEach((n, i) => {
    if (saved[i]) root.style.setProperty(n, saved[i]); else root.style.removeProperty(n);
  });
  const moved = els.filter((e, i) => before[i] !== after[i]);
  /* Colour, font and letter spacing INHERIT, so changing --text-1 moves the
     computed value of main, the card and the list as well as the words inside
     them. Outlining a container because its child changed is noise, so any
     element with a changed descendant is dropped and only the leaves stay. */
  const set = new Set(moved);
  return moved.filter(e => !moved.some(o => o !== e && e.contains(o)));
}

let hlTimer = null;
function highlight(key, on) {
  clearTimeout(hlTimer);
  const clear = () => document.querySelectorAll('.pv iframe').forEach(f => {
    let d; try { d = f.contentDocument; } catch (e) { return; }
    if (d && d.body) d.querySelectorAll('.mb-hl').forEach(e => e.classList.remove('mb-hl'));
  });
  if (!on || !key || !TOKENS[key]) { clear(); note(''); return; }
  hlTimer = setTimeout(() => {
    clear();
    let total = 0, frames = 0;
    document.querySelectorAll('.pv iframe').forEach(f => {
      let d; try { d = f.contentDocument; } catch (e) { return; }
      if (!d || !d.body) return;
      frames++;
      const hit = movedBy(d, TOKENS[key]);
      hit.forEach(e => e.classList.add('mb-hl'));
      total += hit.length;
    });
    note(frames && !total
      ? 'Nothing on screen uses this. This theme&rsquo;s own CSS has taken it over, '
        + 'so the control will not appear to do anything.'
      : total
        ? total + ' thing' + (total === 1 ? '' : 's') + ' on screen '
          + (total === 1 ? 'uses' : 'use') + ' this.'
        : '');
  }, 45);
}
/* A line under the editor that says what the highlight found, including when
   it found nothing, which is the answer to "does this control work". */
function note(html) {
  let n = document.getElementById('hlnote');
  if (!n) {
    n = document.createElement('div');
    n.id = 'hlnote';
    n.className = 'hlnote';
    document.body.appendChild(n);
  }
  n.innerHTML = html;
  n.classList.toggle('on', !!html);
}
function points(node, key) {
  if (!node || !key) return node;
  node.addEventListener('mouseenter', () => highlight(key, true));
  node.addEventListener('mouseleave', () => highlight(key, false));
  node.addEventListener('focusin', () => highlight(key, true));
  node.addEventListener('focusout', () => highlight(key, false));
  return node;
}

/* Repaint one tile only. Repainting all eleven on every slider drag is what
   would make the editor feel like treacle. */
function repaint(skin) {
  const tiles = document.querySelectorAll('.pv[data-id="' + skin.id + '"]');
  if (!tiles.length) return;          /* not on the canvas: nothing to repaint */
  tiles.forEach(d => {
    d.querySelector('iframe').srcdoc = frameHTML(skin);
    const opt = d.querySelector('.pvpick option[value="' + skin.id + '"]');
    if (opt) opt.textContent = skin.name;
  });
}

function drawAll() { drawRail(); drawGrid(); drawEditor(); }

/* ---- can this be removed, and what do we call it ----
   The old rule was "only a theme with no factory version can be deleted".
   True, and useless: rename Ice to Base and it is yours in every way that
   matters to the person who renamed it, but the menu offered RESET TO FACTORY
   and no delete at all. Nobody hunting for a delete finds it under that name.

   Both cases remove the theme from the list. They differ only in what is left
   behind: nothing, or the factory theme it was made from. So both are called
   delete, and the wording says which one you are getting. */
function removal(skin) {
  if (!Skins.factory(skin.id))
    return { label: 'DELETE', title: 'Delete ' + skin.name,
             ask: 'Delete ' + skin.name + '?',
             detail: 'It is gone from the list. Any app set to it falls back to '
                   + 'the first theme. You can undo this straight after.' };
  if (Skins.isEdited(skin.id))
    return { label: 'DELETE MY VERSION', title: 'Delete your version of ' + skin.name,
             ask: 'Delete your version of ' + skin.name + '?',
             detail: 'Your changes go, and ' + Skins.factory(skin.id).name
                   + ' comes back exactly as it ships. Every other theme is left '
                   + 'alone, and you can undo this straight after.' };
  return null;   /* an untouched factory theme: there is nothing of yours to remove */
}

/* ---- right-click a theme ----
   Everything you can do to a theme, in one place, on both the list and the
   tile. The destructive ones live here rather than on the tile, because a
   button sitting next to USE HERE is one slip away from a theme you did not
   mean to make. */
function themeMenu(skin, x, y) {
  const items = [
    { label: 'USE IN STYLE', fn: () => {
        Skins.apply(skin.id); Sfx.play('drop'); drawAll();
        UI.toast('STYLE is <b>' + esc(skin.name) + '</b>');
      } },
    { label: 'EDIT', fn: () => select(skin.id) },
    { label: 'COPY AS JSON', fn: () => copyJSON(skin) },
    '-',
    { label: 'DUPLICATE', fn: () => duplicate(skin) },
  ];
  const rm = removal(skin);
  if (rm) items.push({ label: rm.label, kind: 'bad',
    fn: () => { select(skin.id); remove(); } });
  else items.push({ label: 'DELETE', fn: () => UI.toast(
    '<b>' + esc(skin.name) + '</b> ships with the app, so there is nothing of '
    + 'yours to delete. Change it first, or duplicate it.') });
  UI.menu(x, y, items, { title: skin.name });
}

/* ---- how many themes are yours ----
   Factory themes do not count: they are always there and cannot be lost. */
const MAX_MINE = 3;
const mine = () => Skins.list().filter(s => !Skins.factory(s.id));
function roomForOne() {
  const n = mine().length;
  if (n < MAX_MINE) return true;
  UI.toast('You keep <b>' + MAX_MINE + '</b> of your own themes and you have <b>' + n +
    '</b>. Right-click one and delete it first.', { bad: true });
  return false;
}

/* ---- selecting ---- */
function select(id) {
  if (dirty && draft && draft.id !== id &&
      !confirm('Discard the unsaved changes to ' + draft.name + '?')) return;
  sel = id;
  draft = clone(Skins.get(id));
  dirty = false;
  /* Editing a theme you cannot see is pointless, so picking one in the list
     puts it on the canvas: into a free slot if there is one, otherwise into
     the last slot, which is the least likely to be one of the two you are
     deliberately holding side by side. */
  if (view === 'themes') {
    const ids = slots();
    if (ids.indexOf(id) === -1) {
      if (ids.length < MAX_SLOTS) ids.push(id); else ids[ids.length - 1] = id;
      try { Rec.setting('style', 'slots', ids); } catch (e) {}
    }
  }
  drawAll();
}

/* ---- the editor ---- */
/* ---- the editor ----
   Built out of shared/ui.js and nothing else: UI.row for every line, UI.field
   for text, UI.toggle for a switch, UI.segmented for a short choice, and the
   shared .mb-group heading and .mb-swatch colour well. STYLE used to hand-roll
   all of this, which is exactly why it looked like a different product from
   the rest of the suite. A component from the kit inherits every theme and
   every future fix for free; a copy of it inherits nothing. */

const btn = (id, ico, label) =>
  '<button class="mb-btn mb-press mb-tap" id="' + id + '">'
  + Icons.svg(ico, { size: 15 }) + '<span>' + label + '</span></button>';

/* A colour: the hex you can type into, and the well you can pick from. */
function colourRow(title, note, get, set, sel) {
  const wrap = document.createElement('div');
  wrap.className = 'pair';
  const hex = UI.field('text', { value: get() });
  hex.classList.add('hex');
  const well = document.createElement('input');
  well.type = 'color';
  well.className = 'mb-swatch';
  well.value = hex6(get());
  hex.onchange = () => {
    const v = hex.value.trim();
    if (!/^#[0-9a-f]{3,8}$/i.test(v)) { hex.value = get(); return; }
    set(v); well.value = hex6(v); touch();
  };
  well.oninput = () => { set(well.value); hex.value = well.value; touch(); };
  wrap.appendChild(hex); wrap.appendChild(well);
  return points(UI.row(title, note, wrap), sel);
}

/* A number you drag, with the value read out beside it. */
function slideRow(title, note, min, max, step, get, set, sel) {
  const wrap = document.createElement('div');
  wrap.className = 'pair';
  const r = document.createElement('input');
  r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = get();
  r.className = 'mb-range';
  const out = document.createElement('span');
  out.className = 'val';
  out.textContent = get();
  r.oninput = () => { set(+r.value); out.textContent = r.value; touch(); };
  wrap.appendChild(r); wrap.appendChild(out);
  return points(UI.row(title, note, wrap), sel);
}

function pickRow(title, note, opts, cur, set, pointsAt) {
  const sel = document.createElement('select');
  sel.className = 'mb-sel';
  sel.innerHTML = opts.map(o => {
    const [v, l] = Array.isArray(o) ? o : [o, o];
    return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
  sel.onchange = () => { set(sel.value); touch(); };
  return points(UI.row(title, note, sel), pointsAt);
}

function drawEditor() {
  const box = $('#editor');
  highlight(null, false);
  box.innerHTML = '';
  box.onmouseleave = () => highlight(null, false);
  if (!draft) {
    box.innerHTML = '<div class="pad"><p class="note">Pick a theme on the left to edit it.</p></div>';
    return;
  }
  const s = draft;
  const isNew = !Skins.factory(s.id);
  const tex = s.texture || (s.texture = {});
  const ico = s.icon || (s.icon = {});

  const pad = document.createElement('div');
  pad.className = 'pad';
  box.appendChild(pad);
  const group = t => { pad.appendChild(el('div', 'mb-group', t)); };
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  /* -- name and the actions -- */
  const name = UI.field('text', { value: s.name });
  name.oninput = () => { s.name = name.value; touch(); };
  pad.appendChild(UI.row('Name', null, name));

  const rm = removal(Skins.get(s.id));
  const acts = el('div', 'btns',
    btn('e-save', 'save', 'SAVE') + btn('e-use', 'theme', 'USE IN STYLE')
    + btn('e-copy', 'copy', 'COPY JSON')
    + (rm ? btn('e-del', 'delete', rm.label) : ''));
  pad.appendChild(acts);
  const dmsg = el('p', 'dirty', '');
  dmsg.id = 'e-dirty';
  pad.appendChild(dmsg);
  acts.querySelector('#e-save').onclick = save;
  acts.querySelector('#e-use').onclick = () => {
    if (dirty) save();
    const live = Skins.get(s.id);
    Skins.apply(live);
    /* A theme that names a sound brings it along: look, sound and feel are one
       idea, and Minecraft should not sound like Ornate. */
    if (live.sound) Sfx.pack(live.sound);
    Sfx.play('drop'); drawAll();
    UI.toast('STYLE is <b>' + esc(s.name) + '</b>'
      + (live.sound ? ', sounding like <b>' + esc(live.sound) + '</b>' : ''));
  };
  acts.querySelector('#e-copy').onclick = () => copyJSON(s);
  const d1 = acts.querySelector('#e-del'); if (d1) d1.onclick = remove;

  /* -- colour -- */
  group('COLOUR');
  [['bg', 'Page background', 'behind everything', 'bg'],
   ['panel', 'Card fill', 'the surface things sit on', 'panel'],
   ['accent', 'Accent', 'buttons and selection', 'accent'],
   ['text', 'Text', 'the main reading colour', 'text']]
    .forEach(([k, t, n, sel]) => pad.appendChild(
      colourRow(t, n, () => s.base[k], v => { s.base[k] = v; }, sel)));
  pad.appendChild(pickRow('Mode', 'light or dark furniture', ['dark', 'light'],
    s.mode, v => { s.mode = v; }));

  /* -- the six chart colours -- */
  group('CHART COLOURS');
  const auto = !(s.ramp && s.ramp.length === 6);
  pad.appendChild(UI.row('Work them out for me',
    'six hues spread from the accent, pinned to read against the page',
    UI.toggle(auto, on => {
      if (on) delete s.ramp; else s.ramp = Skins.autoRamp(s.base);
      touch(); drawEditor();
    })));
  const defRamp = [1, 2, 3, 4, 5, 6].map(i => Skins.tokensFor(s)['--data-' + i]);
  const ramp = (s.ramp && s.ramp.length === 6) ? s.ramp : defRamp;
  if (auto) pad.appendChild(el('p', 'note',
    'These follow the accent. Change the accent and they all move with it.'));
  const rampBox = el('div', 'mb-chips');
  ramp.forEach((c, i) => {
    const w = document.createElement('input');
    w.type = 'color'; w.className = 'mb-swatch'; w.value = hex6(c);
    w.disabled = auto;
    w.oninput = () => {
      if (!s.ramp || s.ramp.length !== 6) s.ramp = ramp.slice();
      s.ramp[i] = w.value; touch();
    };
    rampBox.appendChild(w);
  });
  points(rampBox, 'ramp');
  pad.appendChild(rampBox);

  /* -- feel -- */
  group('FEEL');
  const cut = parseFloat(tex.cut != null ? tex.cut : (s.cut || '10px')) || 0;
  pad.appendChild(slideRow('Corner roundness', 'square through to soft', 0, 24, 1,
    () => cut, v => { tex.cut = v + 'px'; }, 'cut'));
  /* halves, because 1 to 2 is a bigger jump than it sounds: at 2px a hairline
     theme becomes a drawn one, and there was nothing in between. */
  pad.appendChild(slideRow('Border weight', 'hairline through to drawn', 0, 4, 0.5,
    () => (s.weight != null ? s.weight : 1), v => { s.weight = v; }, 'weight'));
  pad.appendChild(pickRow('Depth', 'how a surface sits on the page',
    DEPTHS, s.depth || 'soft', v => { s.depth = v; }, 'depth'));
  pad.appendChild(pickRow('Motion', 'how fast it responds',
    Object.keys(MOTIONS).concat(motionName(s.motion) === 'custom' ? ['custom'] : []),
    motionName(s.motion), v => {
      if (v === 'custom') return;
      s.motion = clone(MOTIONS[v]);
      if (!Object.keys(s.motion).length) delete s.motion;
    }));
  pad.appendChild(el('p', 'note',
    'Spacing and tap targets are not on this list on purpose. A theme changes '
    + 'how a box is drawn, never where it sits.'));

  /* -- the surfaces the four base colours cannot reach -- */
  group('SURFACES');
  pad.appendChild(el('p', 'note',
    'These are worked out from the four colours above. Set one only when the '
    + 'guess is wrong for this theme, which is usually a raised button that '
    + 'needs to be lighter than the card it sits on.'));
  const OVR = [
    ['--surface-2', 'Recessed fill', 'wells, rows, inputs'],
    ['--surface-3', 'Raised fill', 'button faces'],
    ['--border', 'Border', 'the ordinary line'],
    ['--border-strong', 'Strong border', 'the emphasised line'],
    ['--text-2', 'Secondary text', 'still readable, less loud'],
    ['--text-muted', 'Muted text', 'notes and captions'],
  ];
  const derived = Skins.tokensFor(Object.assign({}, s, { overrides: {} }));
  OVR.forEach(([k, t, n]) => {
    const o = s.overrides || (s.overrides = {});
    /* each surface probes its own token, so what lights up is what that
       token actually reaches in THIS theme */
    TOKENS['ovr' + k] = [k];
    const row = colourRow(t, n + (o[k] ? '' : ' (worked out)'),
      () => o[k] || derived[k],
      v => { o[k] = v; }, 'ovr' + k);
    /* a way back to the worked-out value */
    const clear = document.createElement('button');
    clear.className = 'mini';
    clear.textContent = 'auto';
    clear.title = 'Go back to the worked-out colour';
    clear.onclick = () => { delete o[k]; touch(); drawEditor(); };
    if (o[k]) row.querySelector('.pair').appendChild(clear);
    pad.appendChild(row);
  });

  /* -- the page behind everything -- */
  group('BACKGROUND');
  const BGS = [
    ['none', 'Nothing'],
    ['glow', 'Glow from the top'],
    ['grid', 'Grid'],
    ['dots', 'Dots'],
    ['lines', 'Scanlines'],
    ['hatch', 'Diagonal hatch'],
    ['paper', 'Paper grain'],
    ['custom', 'My own CSS'],
    ['image', 'A picture'],
  ];
  const bgKind = () => {
    const im = tex.image || 'none';
    if (im === 'none' || !im) return 'none';
    if (/^url\(/.test(im)) return 'image';
    for (const k of Object.keys(BGP)) if (im === BGP[k]().image) return k;
    return 'custom';
  };
  pad.appendChild(pickRow('Pattern', 'drawn behind every screen',
    BGS, bgKind(), v => {
      if (v === 'none') { tex.image = 'none'; tex.size = 'auto'; }
      else if (v === 'custom' || v === 'image') { /* leave what is there */ }
      else { const p = BGP[v](); tex.image = p.image; tex.size = p.size; }
      drawEditor();
    }, 'texture'));

  if (bgKind() === 'image') {
    pad.appendChild(el('p', 'note', 'A picture is stored inside the theme, so it '
      + 'travels in the backup and works offline. It is shrunk on the way in.'));
  }
  const pickFile = document.createElement('input');
  pickFile.type = 'file'; pickFile.accept = 'image/*'; pickFile.style.display = 'none';
  pickFile.onchange = () => { if (pickFile.files[0]) loadBackground(pickFile.files[0]); };
  const chooser = document.createElement('button');
  chooser.className = 'mb-btn mb-press mb-tap';
  chooser.innerHTML = Icons.svg('photo', { size: 15 }) + '<span>CHOOSE A PICTURE</span>';
  chooser.onclick = () => pickFile.click();
  const bgBtns = el('div', 'btns');
  bgBtns.appendChild(chooser);
  if (/^url\(/.test(tex.image || '')) {
    const drop = document.createElement('button');
    drop.className = 'mb-btn mb-press mb-tap';
    drop.innerHTML = Icons.svg('delete', { size: 15 }) + '<span>REMOVE</span>';
    drop.onclick = () => { tex.image = 'none'; tex.size = 'auto'; touch(); drawEditor(); };
    bgBtns.appendChild(drop);
  }
  bgBtns.appendChild(pickFile);
  pad.appendChild(bgBtns);

  const bgCss = UI.field('text', { value: tex.image || 'none' });
  bgCss.classList.add('mono');
  bgCss.onchange = () => { tex.image = bgCss.value.trim() || 'none'; touch(); };
  pad.appendChild(UI.row('CSS background', 'any background-image value', bgCss));
  const bgSize = UI.field('text', { value: tex.size || 'auto' });
  bgSize.classList.add('mono');
  bgSize.onchange = () => { tex.size = bgSize.value.trim() || 'auto'; touch(); };
  pad.appendChild(UI.row('Size', 'cover, auto, or per layer', bgSize));

  /* -- letter spacing -- */
  group('LETTER SPACING');
  const tr = s.track || (s.track = {});
  const trackRow = (key, title, note, def, sel) => {
    const f = UI.field('text', { value: tr[key] != null ? tr[key] : def });
    f.classList.add('mono');
    f.onchange = () => { tr[key] = f.value.trim(); touch(); };
    pad.appendChild(points(UI.row(title, note, f), sel));
  };
  trackRow('cap', 'Small capitals', 'headings and buttons', '.18em', 'trackCap');
  trackRow('body', 'Body text', 'usually zero', '0', 'trackBody');
  trackRow('tight', 'Big numbers', 'usually slightly negative', '-.01em', 'trackTight');
  pad.appendChild(el('p', 'note', 'Kept on a short leash on purpose. This is the '
    + 'one lever that can wreck a line of text at a width nobody tested.'));

  /* -- type -- */
  group('TYPE');
  const dCur = fontByStack(tex.display || ''), bCur = fontByStack(tex.body || '');
  const names = FONTS.map(f => f[0]);
  const setFonts = () => {
    const d = FONTS.filter(f => f[0] === dSel.value)[0];
    const b = FONTS.filter(f => f[0] === bSel.value)[0];
    if (d[0] === 'system') delete tex.display; else tex.display = d[1];
    if (b[0] === 'system') delete tex.body; else tex.body = b[1];
    const specs = [d[2], b[2]].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);
    if (specs.length) s.font = specs.length === 1 ? specs[0] : specs; else delete s.font;
    touch();
  };
  const dRow = pickRow('Headings and buttons', null, names, dCur[0], () => setFonts(), 'fdisplay');
  const bRow = pickRow('Body text', null, names, bCur[0], () => setFonts(), 'fbody');
  pad.appendChild(dRow); pad.appendChild(bRow);
  const dSel = dRow.querySelector('select'), bSel = bRow.querySelector('select');
  pad.appendChild(el('p', 'note',
    'Fonts come from Google and need a connection the first time. Offline they '
    + 'fall back to the system face.'));

  /* -- icons -- */
  group('ICON PACK');
  const packOpts = Icons.packs().map(id => [id, Icons.pack(id).name]);
  pad.appendChild(pickRow('Pack', 'swaps every icon at once',
    packOpts, Icons.packOf(s), v => { s.iconPack = v; delete s.icon; drawEditor(); }));
  const pk = Icons.pack(Icons.packOf(s));
  const redrawn = Icons.packRedraws(Icons.packOf(s)).length;
  pad.appendChild(el('p', 'note', esc(pk.note)
    + (redrawn ? ' <b>' + redrawn + ' of ' + Icons.list().length
        + '</b> drawings are its own; the rest inherit.' : '')));
  const packStrip = el('div', 'iprev wrap');
  packStrip.innerHTML = ['add','delete','today','food','train','settings','chart',
    'search','play','grid','star','close']
    .map(r => Icons.svg(r, { size: 22, skin: s })).join('');
  pad.appendChild(packStrip);

  group('FINE TUNING');
  pad.appendChild(el('p', 'note',
    'The pack sets these. Change one only if this theme needs to differ from it.'));
  const ipreview = el('div', 'iprev');
  const ipaint = () => {
    ipreview.innerHTML = ['add', 'delete', 'today', 'food', 'train', 'settings']
      .map(r => Icons.svg(r, { size: 24, skin: s })).join('');
  };
  const st = Icons.styleFor(s);
  pad.appendChild(slideRow('Line weight', 'how heavy the stroke is', 1, 3, 0.05,
    () => st.weight, v => { ico.weight = v; ipaint(); }));
  pad.appendChild(pickRow('Line ends', null, ['round', 'butt', 'square'],
    st.cap, v => { ico.cap = v; ipaint(); }));
  pad.appendChild(pickRow('Corners', null, ['round', 'miter', 'bevel'],
    st.join, v => { ico.join = v; ipaint(); }));
  pad.appendChild(UI.row('Hand-drawn wobble', 'for a theme that is drawn, not printed',
    UI.toggle(!!st.wobble, v => { ico.wobble = v; ipaint(); touch(); })));
  pad.appendChild(ipreview);
  ipaint();
  pad.appendChild(el('p', 'note',
    'A theme changes the stroke, never the shape. That is what stops a new '
    + 'theme costing fifty new drawings.'));

  /* -- the theme's own css -- */
  group('THIS THEME’S OWN CSS');
  const ta = UI.field('note', { value: s.css || '', rows: 8 });
  ta.classList.add('css');
  ta.spellcheck = false;
  ta.oninput = () => { s.css = ta.value; touch(); };
  pad.appendChild(ta);
  pad.appendChild(el('p', 'note',
    'This is what turns a recolour into a different universe. It styles the '
    + 'shared class names, so it reaches every app. It cannot move anything.'));

  /* -- readability -- */
  group('READABILITY');
  const chk = Skins.check(s.base);
  pad.appendChild(el('p', chk.ok ? 'note' : 'warn', chk.ok
    ? 'Contrast passes. Accent on background ' + chk.accentOnBg.toFixed(1)
      + ':1, text on card ' + chk.textOnPanel.toFixed(1) + ':1.'
    : 'Hard to read. Accent on background is ' + chk.accentOnBg.toFixed(1)
      + ':1 (wants 3.0) and text on a card is ' + chk.textOnPanel.toFixed(1)
      + ':1 (wants 4.5). Your call, but it will be uncomfortable in daylight.'));

  markDirty();
}

const hex6 = v => {
  let h = String(v || '#000000').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return '#' + h.slice(0, 6).padEnd(6, '0');
};

/* An edit repaints its own preview and nothing else. */
let paintTimer = null;
function touch() {
  dirty = true;
  markDirty();
  clearTimeout(paintTimer);
  paintTimer = setTimeout(() => repaint(draft), 90);
}
function markDirty() {
  const d = $('#e-dirty');
  if (d) d.innerHTML = dirty ? 'Unsaved changes. Nothing else sees them until you press SAVE.' : '';
}

/* ---- saving ----
   One row per theme, so two devices that each made a different theme both keep
   theirs. A theme that shares an id with a factory one simply replaces it, and
   deleting the row is the reset. */
function save() {
  if (!draft) return;
  Skins.saveCustom(Object.assign({}, draft, { custom: true }));
  dirty = false;
  Sfx.play('drop');
  /* If STYLE is wearing the theme that just changed, repaint the app too. */
  if (Skins.current && Skins.current.id === draft.id) Skins.apply(Skins.get(draft.id));
  drawAll();
  UI.toast('saved <b>' + esc(draft.name) + '</b>');
}

function remove() {
  const live = Skins.get(draft.id);
  const rm = removal(live);
  if (!rm) { UI.toast('<b>' + esc(live.name) + '</b> ships with the app, so there '
    + 'is nothing of yours to delete.'); return; }
  const id = draft.id, nm = draft.name;
  const payload = clone(Rec.get('skin', null, id) || draft);
  UI.confirm(rm.ask, rm.detail, { title: rm.label, yes: 'DELETE', danger: true })
    .then(ok => {
      if (!ok) return;
      Skins.forget(id);
      const back = Skins.factory(id);
      if (Skins.current && Skins.current.id === id) Skins.apply(Skins.get(back ? id : Skins.list()[0].id));
      sel = back ? id : Skins.list()[0].id;
      draft = clone(Skins.get(sel));
      dirty = false;
      drawAll();
      UI.undo('deleted <b>' + esc(nm) + '</b>', () => {
        Rec.set('skin', null, id, payload);
        select(id);
      });
    });
}

function duplicate(skin) {
  if (!roomForOne()) return;
  const copy = clone(skin);
  copy.id = slug(skin.name + ' copy');
  copy.name = skin.name + ' copy';
  copy.custom = true;
  Skins.saveCustom(copy);
  select(copy.id);
  UI.toast('made <b>' + esc(copy.name) + '</b>');
}

function newTheme() {
  if (!roomForOne()) return;
  const base = clone(Skins.get(sel || Skins.list()[0].id));
  base.id = slug('theme ' + (Skins.customs().length + 1));
  base.name = 'New theme';
  base.custom = true;
  Skins.saveCustom(base);
  select(base.id);
}

const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-')
  .replace(/^-|-$/g, '').slice(0, 32) || ('theme-' + Date.now().toString(36));

/* ---- the paste box ----
   The whole reason STYLE exists in the shape it does. Show Claude some
   screenshots, get one block of JSON, paste it here. */
function pasteTheme() {
  UI.dialog({
    title: 'PASTE A THEME', width: 560,
    body: b => {
      b.innerHTML =
        '<p class="note" style="margin-bottom:var(--s-3)">Paste one theme, as JSON. '
        + 'This is the same shape a theme has in the file, so anything COPY JSON '
        + 'gives you can come straight back in here.</p>'
        + '<textarea id="p-json" spellcheck="false" style="min-height:220px" '
        + 'placeholder=\'{ "id": "ragnarok", "name": "Ragnarok", ... }\'></textarea>'
        + '<p class="warn" id="p-err"></p>';
    },
    actions: [
      { label: 'CANCEL' },
      {
        label: 'ADD', kind: 'go',
        fn: h => {
          const ta = h.body.querySelector('#p-json');
          const err = h.body.querySelector('#p-err');
          const r = readTheme(ta.value);
          if (r.error) { err.textContent = r.error; return false; }
          Skins.saveCustom(r.skin);
          h.close();
          select(r.skin.id);
          Sfx.play('drop');
          UI.toast('added <b>' + esc(r.skin.name) + '</b>');
        },
      },
    ],
  });
}

/* Validation says what is wrong in words, because the person pasting is not
   going to read a stack trace. */
function readTheme(txt) {
  let o;
  try { o = JSON.parse(String(txt || '').trim()); }
  catch (e) { return { error: 'That is not valid JSON. ' + e.message }; }
  if (Array.isArray(o)) return { error: 'That is a list of themes. Paste one theme on its own.' };
  if (!o || typeof o !== 'object') return { error: 'That is not a theme object.' };
  if (o.skins) return { error: 'That is the whole themes file. Paste just one entry from its "skins" list.' };
  if (!o.base || typeof o.base !== 'object') return { error: 'No "base" colours. A theme needs base.bg, base.panel, base.accent and base.text.' };
  const miss = ['bg', 'panel', 'accent', 'text'].filter(k => !o.base[k]);
  if (miss.length) return { error: 'base is missing: ' + miss.join(', ') + '.' };
  const bad = ['bg', 'panel', 'accent', 'text'].filter(k => !/^#[0-9a-f]{3,8}$/i.test(String(o.base[k]).trim()));
  if (bad.length) return { error: 'These need to be hex colours like #1A2B3C: ' + bad.join(', ') + '.' };
  if (!o.name) o.name = 'Pasted theme';
  o.id = slug(o.id || o.name);
  if (o.mode !== 'light') o.mode = o.mode === 'dark' ? 'dark' : (Skins.util.lum(o.base.bg) > .5 ? 'light' : 'dark');
  o.custom = true;
  /* Anything the engine does not know about is left alone rather than stripped:
     a theme from a newer Claude may carry a lever this build has not got yet,
     and throwing it away would lose it silently. */
  return { skin: o };
}

/* ---- handing a theme back out ---- */
function copyJSON(skin) {
  const o = clone(skin);
  delete o.custom;
  toClipboard(JSON.stringify(o, null, 2), esc(skin.name) + ' copied as JSON');
}

function toClipboard(text, msg) {
  const done = () => UI.toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallback());
  } else fallback();
  function fallback() {
    /* No clipboard permission, or an insecure origin, which is exactly what
       opening the file from a folder is. Show it and select it instead of
       failing quietly. */
    UI.dialog({
      title: 'COPY THIS', width: 560,
      body: b => {
        b.innerHTML = '<p class="note" style="margin-bottom:var(--s-3)">Press Ctrl+C.</p>'
          + '<textarea spellcheck="false" style="min-height:260px"></textarea>';
        const ta = b.querySelector('textarea');
        ta.value = text;
        setTimeout(() => { ta.focus(); ta.select(); }, 50);
      },
      actions: [{ label: 'DONE' }],
    });
  }
}

/* ---- the brief ----
   Copy this, paste it into Claude Code with your screenshots, get a theme back.
   It is written out in full rather than pointing at a file, because the whole
   point is that it travels on its own into a fresh conversation. */
function briefForClaude() {
  const example = JSON.stringify(clone(Skins.get('ragnarok') || Skins.list()[0]), null, 2);
  const brief =
'I am going to show you screenshots of an interface. Turn them into ONE theme for\n' +
'my app suite, and give it back as a single JSON object I can paste in.\n' +
'\n' +
'A theme changes how every box is DRAWN. It must not change layout: no boxes\n' +
'move, none are added or removed, and nothing gets smaller than a 44px tap\n' +
'target. Spacing and type sizes are fixed by the suite and are not yours to set.\n' +
'\n' +
'THE SHAPE\n' +
'  id       short lowercase slug\n' +
'  name     what it is called\n' +
'  mode     "dark" or "light"\n' +
'  base     bg (page), panel (card fill), accent, text. Hex.\n' +
'  overrides  optional. Any single CSS token, forced. Useful ones:\n' +
'             --surface-2 (recessed), --surface-3 (raised), --border,\n' +
'             --border-strong, --text-2, --text-muted\n' +
'  ramp     six hex colours for charts\n' +
'  weight   border thickness in px, 1 to 4\n' +
'  depth    "soft"   shadows, things float\n' +
'           "flat"   no shadow at all, borders do the work\n' +
'           "bevel"  plates with thickness, lit top-left, shaded bottom-right\n' +
'           "glow"   light comes off the element, built from the accent\n' +
'  track    optional { cap, tight, body } letter spacing. Keep it small.\n' +
'  motion   optional { tap, fast, med, slow, sheet, ease } as CSS values\n' +
'  texture  { display, body, cut, image, size }\n' +
'             display / body are full CSS font stacks\n' +
'             cut is corner roundness, e.g. "0px". The whole radius family\n' +
'             follows it.\n' +
'             image / size are a CSS background for the page\n' +
'  font     Google Fonts spec, e.g. "Silkscreen:wght@400;700". A string, or a\n' +
'           list of two if the display and body faces differ. Always give a\n' +
'           system fallback in the stack, because offline it will be used.\n' +
'  css      a stylesheet for this theme only. THIS is what makes it feel like a\n' +
'           different universe rather than a recolour. Style these class names:\n' +
'             header .logo h2 .card .item .chk #fab\n' +
'             .mb-btn .mb-act .mb-input .mb-sel .mb-chip .mb-x .mb-opt\n' +
'             .mb-sheet .mb-sheet-head .mb-toast .mb-menu .mb-sw\n' +
'           Use var(--token) for colour, never a raw hex, or palette edits\n' +
'           break. Useful: var(--e-1..5), var(--bevel-in), var(--accent),\n' +
'           var(--accent-fg), var(--surface-1..3), var(--border),\n' +
'           var(--border-width), var(--radius-md), var(--font-display).\n' +
'           Do not set width, height, padding, margin, position or font-size.\n' +
'\n' +
'RULES\n' +
'  - No layout changes. Draw the boxes differently, do not move them.\n' +
'  - Body text stays readable. Put a decorative or pixel face on headings and\n' +
'    buttons only.\n' +
'  - Text on a card wants 4.5:1 contrast, accent on background wants 3:1.\n' +
'  - Give me the JSON and nothing else. No commentary around it.\n' +
'\n' +
'HERE IS A COMPLETE EXAMPLE OF THE FORMAT\n' +
example + '\n';
  toClipboard(brief, 'brief copied &mdash; paste it into Claude with your screenshots');
}

/* ---- which app wears what ----
   The theme is chosen per app on purpose, so ARC can be Doodle while BLOCK is
   Ice. This is the one place you can see all of them at once. */
const SUITE = [
  ['home', 'HOME'], ['arc', 'ARC'], ['block', 'BLOCK'], ['habits', 'HABITS'],
  ['form', 'FORM'], ['status', 'STATUS'], ['train', 'TRAIN'], ['style', 'STYLE'],
];
function assignApps() {
  UI.dialog({
    title: 'WHICH APP WEARS WHAT', width: 460,
    body: b => {
      const list = Skins.list();
      b.innerHTML = '<p class="note" style="margin-bottom:var(--s-3)">Each app keeps its own '
        + 'theme. ARC still carries its own copy of the theme engine, so it will '
        + 'ignore this until that is changed.</p>';
      SUITE.forEach(([id, nm]) => {
        const cur = localStorage.getItem('suite_skin.' + id) || '';
        const row = document.createElement('div');
        row.className = 'fld';
        row.innerHTML = '<label>' + nm + '</label><select data-app="' + id + '">'
          + '<option value="">(first theme)</option>'
          + list.map(s => '<option value="' + esc(s.id) + '"' + (s.id === cur ? ' selected' : '') + '>'
              + esc(s.name) + '</option>').join('')
          + '</select>';
        row.querySelector('select').onchange = e => {
          const v = e.target.value;
          if (v) localStorage.setItem('suite_skin.' + id, v);
          else localStorage.removeItem('suite_skin.' + id);
          if (id === APP.id) { Skins.apply(v || Skins.list()[0].id); drawAll(); }
          UI.toast(nm + ' is <b>' + esc(v ? Skins.get(v).name : 'the first theme') + '</b>');
        };
        b.appendChild(row);
      });
      const all = document.createElement('button');
      all.className = 'mb-btn mb-press mb-tap';
      all.style.marginTop = 'var(--s-3)';
      all.textContent = 'SET EVERY APP TO THE SELECTED THEME';
      all.onclick = () => {
        if (!sel) return;
        SUITE.forEach(([id]) => localStorage.setItem('suite_skin.' + id, sel));
        Skins.apply(sel); drawAll();
        UI.toast('every app is <b>' + esc(Skins.get(sel).name) + '</b>');
        b.querySelectorAll('select').forEach(s => { s.value = sel; });
      };
      b.appendChild(all);
    },
    actions: [{ label: 'DONE' }],
  });
}

/* ---- boot ----
   skins.json has to be in before anything can be drawn, and Rec has to be
   there before Skins.customs() can find the saved themes. */
Skins.load('../shared/skins.json?v=13').then(() => {
  staleCheck();
  Skins.restore(APP.id);
  sel = (Skins.current && Skins.current.id) || Skins.list()[0].id;
  draft = clone(Skins.get(sel));
  drawAll();
  setView('themes');
  /* Ask for every icon the bar needs once the set is there. */
  document.querySelectorAll('header [data-ico]').forEach(b => {
    b.insertAdjacentHTML('afterbegin', Icons.svg(b.dataset.ico, { size: 15 }));
  });
});

/* A theme saved in another tab is a row like anything else, so the store tells
   us and the rail and the canvas catch up without a refresh. */
Rec.on(() => { if (!dirty) { drawRail(); drawGrid(); } });
</script>
