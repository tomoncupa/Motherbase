<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STYLE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◧</text></svg>">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* A desktop app, like most of the suite: only STATUS and TRAIN are built for a
   phone. Comparing themes means seeing several real screens at once, and on a
   phone two previews side by side are 170px each, which is too small to judge
   type, spacing or shadows honestly.

   It still must not fall over on a phone, so the three panes stack and the page
   says what it is for.

   Almost everything here comes from shared/ui.js. What is left in this
   stylesheet is the three-pane layout and the preview tiles, which the kit has
   no opinion about. Every colour and size is a token, so STYLE is themed by
   whichever theme STYLE is wearing. */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-2);font-weight:var(--w-body);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
  background-image:var(--tex-image);background-size:var(--tex-size);
}

/* ---------- the app bar ---------- */
/* The bar wraps rather than running off the side. Five actions and a wordmark
   do not fit on a narrow window, and a page that scrolls sideways is broken
   however desktop-first it is. */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);z-index:5;
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);
  font-size:var(--f-5);letter-spacing:var(--track-cap)}
.logo b{color:var(--accent)}
.spacer{flex:1}
.sub{color:var(--text-muted);font-size:var(--f-1)}
/* Every action carries its icon. STYLE owns the icon set; it should be the
   first thing using it. */
header .mb-btn{display:inline-flex;align-items:center;gap:6px}
.grp{display:flex;align-items:center;gap:var(--s-2)}

/* ---------- three panes ---------- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:210px 1fr 360px}
.rail,.editor,.canvas{min-height:0;min-width:0;overflow:auto}
.rail{border-right:var(--border-width) solid var(--border);background:var(--surface-1)}
.editor{border-left:var(--border-width) solid var(--border);background:var(--surface-1)}
.canvas{padding:var(--s-4)}

/* ---------- the theme list ---------- */
.railhead{padding:var(--s-3) var(--s-4) var(--s-2);color:var(--text-muted);
  font-size:var(--f-1);letter-spacing:var(--track-cap);font-family:var(--font-display)}
.tline{display:flex;align-items:center;gap:var(--s-3);width:100%;
  padding:var(--s-3) var(--s-4);min-height:var(--tap);cursor:pointer;
  color:var(--text-1);font:inherit;text-align:left;
  border-left:3px solid transparent}
.tline:hover{background:var(--surface-2)}
.tline.on{background:var(--surface-2);border-left-color:var(--accent)}
/* One press to remove a theme of your own. Hunting for it through a menu is
   how five mock-ups end up sitting there. */
.tline .del{opacity:0;border:0;background:none;color:var(--text-muted);
  cursor:pointer;padding:2px 4px;border-radius:var(--radius-sm);
  display:flex;align-items:center;flex:0 0 auto}
.tline:hover .del,.tline.on .del{opacity:1}
.tline .del:hover{color:var(--danger);background:var(--surface-3)}
.tline.over{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.tline .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:2px;flex:0 0 auto}
.dots i{width:11px;height:11px;border-radius:2px;display:block;
  border:1px solid rgba(128,128,128,.35)}
.tag{font-size:10px;letter-spacing:.08em;color:var(--text-muted);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:1px 4px}

/* ---------- the compare canvas ---------- */
/* Fixed at a true phone width, never stretched to fill the column. A preview
   that is 404px wide is a picture of a phone nobody owns, and judging type,
   spacing and shadows against it tells you nothing about the real screen.
   Wider monitors get MORE previews, not fatter ones. */
.grid{display:grid;gap:var(--s-4);justify-content:start;
  grid-template-columns:repeat(auto-fill,360px)}
@media (max-width:1180px){.grid{grid-template-columns:repeat(auto-fill,320px)}}
.pv{background:var(--surface-1);border:var(--border-width) solid var(--border);
  border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--e-1)}
.pv.on{border-color:var(--accent);box-shadow:var(--e-3)}
.pvhead{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-3);
  border-bottom:var(--border-width) solid var(--border);background:var(--surface-2)}
.pvhead .nm{flex:1;font-family:var(--font-display);font-size:var(--f-1);
  letter-spacing:var(--track-cap);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvwrap{position:relative;height:540px}
.pvwrap iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
/* The frame is a picture of a theme, not a working app: the sheet swallows
   clicks so the whole tile is one target and nothing inside is tappable. */
.pvsheet{position:absolute;inset:0;cursor:pointer}
.mini{border:0;background:none;color:var(--text-muted);cursor:pointer;
  font:inherit;font-size:var(--f-1);padding:var(--s-1) var(--s-2);
  border-radius:var(--radius-sm)}
.mini:hover{background:var(--surface-3);color:var(--text-1)}

/* ---------- the icon database ---------- */
.icons{display:flex;flex-direction:column;gap:var(--s-4)}
.isum{color:var(--text-2);font-size:var(--f-2);line-height:var(--lh-body)}
.isum b{color:var(--accent)}
.igrid{display:grid;gap:var(--s-3);
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.icard{background:var(--surface-1);border:var(--border-width) solid var(--border);
  border-radius:var(--radius-md);padding:var(--s-3);display:flex;gap:var(--s-3)}
.icard .draw{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;background:var(--surface-2);border-radius:var(--radius-sm);
  color:var(--text-1)}
.icard .meta{flex:1;min-width:0}
.icard .iname{font-family:var(--font-display);font-size:var(--f-1);
  letter-spacing:var(--track-cap);color:var(--text-1)}
.icard .inote{color:var(--text-muted);font-size:var(--f-1);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:var(--s-2)}
.chip{font-size:11px;padding:1px 6px;border-radius:var(--radius-full);
  border:1px solid var(--border);color:var(--text-2);background:none;
  cursor:pointer;font-family:var(--font-body)}
.chip:hover{border-color:var(--accent);color:var(--text-1)}
.chip.moved{border-color:var(--accent);color:var(--accent)}

/* ---------- the editor ----------
   Almost nothing, on purpose. Every line in the editor is a shared .mb-row and
   every control is a shared component, so what is left here is the pane it
   sits in and two shapes the kit has no opinion about. */
.pad{padding:var(--s-4)}
.pair{display:flex;align-items:center;gap:var(--s-2);flex:0 0 auto}
.pair .hex{width:104px;font-family:var(--font-mono);font-size:var(--f-1)}
.pair .val{min-width:38px;text-align:right;color:var(--text-muted);font-size:var(--f-1)}
.mb-range{width:120px}
.btns{display:flex;flex-wrap:wrap;gap:var(--s-2);margin:var(--s-3) 0}
.btns .mb-btn{display:inline-flex;align-items:center;gap:6px}
.iprev{display:flex;gap:var(--s-4);padding:var(--s-3) 0;color:var(--text-1)}
.css{font-family:var(--font-mono);font-size:var(--f-1);min-height:150px}
.warn{color:var(--warn);font-size:var(--f-1);line-height:var(--lh-body)}
.note{color:var(--text-muted);font-size:var(--f-1);line-height:var(--lh-body);
  padding-bottom:var(--s-3)}
.dirty{color:var(--warn);font-size:var(--f-1)}

/* ---------- phone ---------- */
.phoneonly{display:none}
@media (max-width:900px){
  body{overflow:auto}
  .work{grid-template-columns:1fr;display:block}
  .rail,.editor{border:0;border-top:var(--border-width) solid var(--border)}
  .phoneonly{display:block;padding:var(--s-4);color:var(--text-muted);
    font-size:var(--f-1);line-height:var(--lh-body);
    border-bottom:var(--border-width) solid var(--border)}
}
</style>
</head>
<body>
<header>
  <div class="logo">STY<b>LE</b></div>
  <div class="sub" id="count"></div>
  <div class="sub" id="build" title="If this number is behind, your browser is showing you a cached copy. Hold Shift and press reload."></div>
  <div class="spacer"></div>
  <div id="tabs"></div>
  <button class="mb-btn mb-press mb-tap" data-ico="upload" onclick="pasteTheme()">PASTE</button>
  <button class="mb-btn mb-press mb-tap" data-ico="brief" onclick="briefForClaude()">BRIEF</button>
  <button class="mb-btn mb-press mb-tap" data-ico="app.home" onclick="assignApps()">APPS</button>
  <button class="mb-btn mb-press mb-tap" data-ico="settings" onclick="UI.settings(APP.id)">SETTINGS</button>
</header>

<div class="phoneonly">
  STYLE is built for a computer. Comparing themes means seeing several real
  screens side by side, and a phone cannot show two of them at an honest size.
  It works down here, but the editor is cramped.
</div>

<div class="work">
  <div class="rail" id="rail"></div>
  <div class="canvas"><div class="grid" id="grid"></div></div>
  <div class="editor" id="editor"></div>
</div>

<script>
/* ══════════════════════════ STYLE ══════════════════════════
   Pick, compare, edit and add themes.

   The point of the paste box is the workflow Tom actually wants: show Claude a
   few screenshots of a game or an app, get back one block of JSON, paste it in
   here, and it is a theme. So the exchange format IS a skins.json entry and
   nothing else — there is no second format to keep in step.                   */

/* Bumped whenever this file changes in a way you would notice. If the number
   on screen is behind the one in the repo, the browser is serving a cached
   copy and nothing you do will appear to work. */
const BUILD = 'build 5';

const APP = {
  id: 'style',
  name: 'STYLE',
  icon: '◧',
  blurb: 'pick, compare, edit and add themes',
  types: ['skin'],
};

document.getElementById('build').textContent = BUILD;

Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
IO.register({ app: APP.id, name: APP.name, types: APP.types });

/* ---- state ----
   `draft` is a working copy. Edits repaint its preview immediately but do not
   touch storage until SAVE, so a half-made theme never leaks into other apps.
   That is also what keeps the live preview honest: nothing is persisted just
   because you dragged a slider. */
let sel = null;      /* id of the selected theme */
let draft = null;    /* the working copy being edited */
let dirty = false;

const $ = s => document.querySelector(s);
const esc = s => UI.esc(String(s == null ? '' : s));
const clone = o => JSON.parse(JSON.stringify(o));

/* ---- the pickable faces ----
   A curated list rather than all of Google Fonts: every one here has been
   chosen because it says something an interface can use, and each carries the
   exact spec string the loader needs. `system` means no fetch at all, which is
   also the honest choice for a theme that must look right offline. */
const FONTS = [
  ['system',    'system-ui,-apple-system,sans-serif',           ''],
  ['Inter Tight','\'Inter Tight\',system-ui,sans-serif',        'Inter+Tight:wght@400;500;700'],
  ['Chakra Petch','\'Chakra Petch\',system-ui,sans-serif',      'Chakra+Petch:wght@500;700'],
  ['Orbitron',  '\'Orbitron\',system-ui,sans-serif',            'Orbitron:wght@500;700'],
  ['Rajdhani',  '\'Rajdhani\',system-ui,sans-serif',            'Rajdhani:wght@500;600;700'],
  ['Oswald',    '\'Oswald\',system-ui,sans-serif',              'Oswald:wght@400;600'],
  ['Archivo',   '\'Archivo\',system-ui,sans-serif',             'Archivo:wght@400;500;700'],
  ['Silkscreen','\'Silkscreen\',system-ui,sans-serif',          'Silkscreen:wght@400;700'],
  ['Press Start 2P','\'Press Start 2P\',system-ui,sans-serif',  'Press+Start+2P'],
  ['VT323',     '\'VT323\',ui-monospace,monospace',             'VT323'],
  ['IBM Plex Mono','\'IBM Plex Mono\',ui-monospace,monospace',  'IBM+Plex+Mono:wght@400;600'],
  ['Space Mono','\'Space Mono\',ui-monospace,monospace',        'Space+Mono:wght@400;700'],
  ['Gloria Hallelujah','\'Gloria Hallelujah\',system-ui,sans-serif','Gloria+Hallelujah'],
  ['Patrick Hand','\'Patrick Hand\',system-ui,sans-serif',      'Patrick+Hand'],
  ['Architects Daughter','\'Architects Daughter\',system-ui,sans-serif','Architects+Daughter'],
  ['Bebas Neue','\'Bebas Neue\',system-ui,sans-serif',          'Bebas+Neue'],
  ['Playfair Display','\'Playfair Display\',Georgia,serif',     'Playfair+Display:wght@400;700'],
  ['Cinzel',    '\'Cinzel\',Georgia,serif',                     'Cinzel:wght@400;700'],
];
const fontByStack = st => FONTS.filter(f => f[1] === st)[0] || FONTS[0];

const DEPTHS = [
  ['soft',  'Soft — shadows, things float'],
  ['flat',  'Flat — no shadow, borders do the work'],
  ['bevel', 'Bevel — plates with thickness'],
  ['glow',  'Glow — light comes off the element'],
];

/* Presets rather than five duration fields: the tempo is one decision. */
const MOTIONS = {
  standard: {},
  instant:  { tap:'0ms', fast:'0ms',  med:'0ms',   slow:'0ms',   sheet:'120ms', ease:'linear' },
  snappy:   { tap:'0ms', fast:'60ms', med:'100ms', slow:'160ms', sheet:'180ms', ease:'linear' },
  soft:     { tap:'120ms', fast:'200ms', med:'320ms', slow:'520ms', sheet:'460ms',
              ease:'cubic-bezier(.34,1.56,.64,1)' },
};
function motionName(m) {
  const s = JSON.stringify(m || {});
  const hit = Object.keys(MOTIONS).filter(k => JSON.stringify(MOTIONS[k]) === s)[0];
  return hit || 'custom';
}

/* ---- the sample screen ----
   Deliberately the same class names the real apps and shared/mobile.js use, so
   a theme that looks right here looks right in BLOCK. It is a copy of that
   vocabulary rather than the real thing, which is the one honest weakness of
   this preview: if an app grows a component that is not in here, this screen
   will not show you what the theme does to it. */
const SAMPLE_CSS = `
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-body);
  font-size:var(--f-3);font-weight:var(--w-body);display:flex;flex-direction:column;
  background-image:var(--tex-image);background-size:var(--tex-size);
  letter-spacing:var(--track-body);overflow:hidden;-webkit-font-smoothing:antialiased}
header{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);background:var(--surface-1);box-shadow:var(--e-1),var(--rim)}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);
  letter-spacing:var(--track-cap)}
.logo b{color:var(--accent)}
.spacer{flex:1}
.mb-btn{min-height:var(--tap);padding:0 var(--s-3);cursor:pointer;
  background:var(--surface-2);color:var(--text-1);font-family:var(--font-display);
  font-size:var(--f-1);letter-spacing:var(--track-cap);
  border:var(--border-width) solid var(--border);border-radius:var(--radius-md)}
.mb-btn.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
main{flex:1;min-height:0;padding:var(--s-4);display:flex;flex-direction:column;

.card{border-radius:var(--radius-lg);background:var(--surface-1);padding:var(--s-4);
  box-shadow:var(--e-1),var(--rim)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-3)}
.list{display:flex;flex-direction:column;gap:var(--s-2)}
.item{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3);
  min-height:var(--tap);border-radius:var(--radius-md);background:var(--surface-2)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.on .nm{text-decoration:line-through;color:var(--text-muted)}
.chk{width:28px;height:28px;flex:0 0 auto;padding:0;border:2px solid var(--border-strong);
  border-radius:50%;background:none;color:transparent;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.chk.on{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.stats{display:flex;gap:var(--s-3)}
.stat{flex:1;background:var(--surface-2);border-radius:var(--radius-md);padding:var(--s-3);
  text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:var(--f-6);
  line-height:var(--lh-tight);letter-spacing:var(--track-tight)}
.stat span{display:block;font-size:var(--f-1);color:var(--text-muted);margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:var(--s-2);height:56px;margin-top:var(--s-3)}
.bars i{flex:1;display:block;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.mb-input{width:100%;min-height:var(--tap);padding:var(--s-3);background:var(--surface-2);
  color:var(--text-1);font:inherit;font-size:var(--f-2);
  border:var(--border-width) solid var(--border);border-radius:var(--radius-md)}
.row{display:flex;gap:var(--s-2);margin-top:var(--s-3);justify-content:flex-end}
#fab{position:absolute;right:var(--s-4);bottom:var(--s-4);width:58px;height:58px;border:0;
  border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:28px;
  line-height:1;box-shadow:var(--e-3);display:flex;align-items:center;justify-content:center}
`;

const SAMPLE_HTML = `
<header><div class="logo">NEW<b>APP</b></div><div class="spacer"></div>
<button class="mb-btn">SETTINGS</button></header>
<main>
  <div class="card">
    <h2>TODAY &middot; THU 21 AUG</h2>
    <div class="list">
      <div class="item"><span class="nm">Morning run</span><button class="chk">&#10003;</button></div>
      <div class="item on"><span class="nm">Cold shower</span><button class="chk on">&#10003;</button></div>
      <div class="item"><span class="nm">Read 20 pages</span><button class="chk">&#10003;</button></div>
    </div>
  </div>
  <div class="card">
    <h2>THIS WEEK</h2>
    <div class="stats">
      <div class="stat"><b>12</b><span>sessions</span></div>
      <div class="stat"><b>4.2k</b><span>volume</span></div>
      <div class="stat"><b>7</b><span>streak</span></div>
    </div>
    <div class="bars">
      <i style="height:62%;background:var(--data-1)"></i>
      <i style="height:88%;background:var(--data-2)"></i>

      <i style="height:100%;background:var(--data-4)"></i>

      <i style="height:74%;background:var(--data-6)"></i>
    </div>
  </div>

    <input class="mb-input" value="Morning run" readonly>

    <button class="mb-btn go">ADD</button></div>
  </div>
</main>
<button id="fab">+</button>
`;

/* The full token set for a theme, palette included, without painting the page.
   This is `apply()` minus the side effects, which is exactly what a preview
   needs and exactly what a live edit needs. */
function tokensFull(skin, pal) {
  const use = pal || (Skins.isCustomised(skin.id) ? Skins.paletteFor(skin.id) : null);
  const t = Skins.tokensFor(skin);
  return use ? Object.assign(t, Skins.palTokens(use)) : t;
}

function frameHTML(skin) {
  const t = tokensFull(skin);
  const vars = Object.keys(t).map(k => k + ':' + t[k]).join(';');
  return '<!doctype html><html data-mode="' + esc(skin.mode || 'dark') + '"><head><meta charset="utf-8">'
    + Skins.fontLinks(skin)
    + '<style>:root{' + vars + '}</style>'
    + '<style>' + SAMPLE_CSS + '</style>'
    + '<style>' + (skin.css || '') + '</style>'
    + '</head><body>' + SAMPLE_HTML + '</body></html>';
}

/* ---- the left rail ---- */
function drawRail() {
  const list = Skins.list();
  /* Anything past the limit, so it is visible which ones to remove rather than
     just a warning that you have too many. */
  const yours = list.filter(s => !Skins.factory(s.id));
  const over = yours.slice(MAX_MINE).map(s => s.id);
  const n = yours.length;
  $('#count').innerHTML = list.length + ' themes'
    + (n ? ' &middot; ' + n + ' of yours' : '')
    + (n > MAX_MINE
        ? ' <b style="color:var(--warn)">&middot; ' + (n - MAX_MINE)
          + ' over, delete ' + (n - MAX_MINE === 1 ? 'one' : 'some') + '</b>'
        : '');
  const box = $('#rail');
  box.innerHTML = '<div class="railhead">THEMES</div>';
  list.forEach(s => {
    const t = tokensFull(s);
    const isNew = !Skins.factory(s.id);
    const edited = Skins.isEdited(s.id) && !isNew;
    /* A row, not a button, because it holds a button. */
    const b = document.createElement('div');
    b.className = 'tline mb-press' + (s.id === sel ? ' on' : '')
      + (isNew && over.indexOf(s.id) > -1 ? ' over' : '');
    b.tabIndex = 0;
    b.setAttribute('role', 'button');
    b.innerHTML =
      '<span class="dots">'
      + '<i style="background:' + t['--bg'] + '"></i>'
      + '<i style="background:' + t['--surface-1'] + '"></i>'
      + '<i style="background:' + t['--accent'] + '"></i></span>'
      + '<span class="nm" style="font-family:' + t['--font-display'] + '">' + esc(s.name) + '</span>'
      + (edited ? '<span class="tag">EDITED</span>' : '');
    b.onclick = () => select(s.id);
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(s.id); } };
    b.oncontextmenu = e => { e.preventDefault(); themeMenu(s, e.clientX, e.clientY); };
    if (isNew) {
      const x = document.createElement('button');
      x.className = 'del';
      x.title = 'Delete ' + s.name;
      x.setAttribute('aria-label', 'Delete ' + s.name);
      x.innerHTML = Icons.svg('delete', { size: 15 });
      x.onclick = e => { e.stopPropagation(); select(s.id); remove(); };
      b.appendChild(x);
    }
    box.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'tline mb-press';
  add.innerHTML = '<span class="dots"><i style="background:var(--surface-2)"></i>'
    + '<i style="background:var(--surface-3)"></i><i style="background:var(--accent)"></i></span>'
    + '<span class="nm">+ New theme</span>';
  add.onclick = newTheme;
  box.appendChild(add);
}

/* ---- the compare canvas ---- */
/* ---- which screen the middle pane is showing ----
   The rail keeps working in both: picking a theme in ICONS redraws every icon
   in that theme, which is the only honest way to judge whether a stroke weight
   survives contact with a hand-drawn face. */
let view = 'themes';
function drawTabs() {
  const box = document.getElementById('tabs');
  box.innerHTML = '';
  /* The shared segmented control, not a pair of buttons pretending to be one.
     Every other app uses it; STYLE was the only one hand-rolling its chrome. */
  box.appendChild(UI.segmented(
    [{ id: 'themes', name: 'THEMES' }, { id: 'icons', name: 'ICONS' }],
    view, id => setView(id)));
}
function setView(v) {
  view = v;
  drawTabs();
  drawGrid();
}

/* ---- the icon master database ----
   One drawing serves many buttons. This screen exists to keep that ratio
   honest: it shows every drawing with the buttons hanging off it, so adding a
   forty-first is visibly a bigger decision than pointing a new button at one
   that already exists. */
function drawIcons() {
  const box = $('#grid');
  box.className = 'icons';
  box.innerHTML = '';
  const skin = draft || Skins.current;
  const r = Icons.reuse();
  const over = Icons.overrides();

  const sum = document.createElement('div');
  sum.className = 'isum';
  sum.innerHTML = '<b>' + r.drawings + '</b> drawings carrying <b>' + r.roles
    + '</b> buttons, <b>' + r.perDrawing + '</b> buttons each. Drawn in <b>'
    + esc(skin ? skin.name : '-') + '</b>.'
    + '<br>Click a button name to point it at a different drawing. '
    + 'Reach for an existing drawing before adding one: every new drawing is '
    + 'another thing to keep in step across every theme.';
  box.appendChild(sum);

  /* anything a build asks for that nothing draws */
  const gaps = Object.keys(Icons.ROLES).filter(k => !Icons.pathFor(k, skin));
  if (gaps.length) {
    const g = document.createElement('div');
    g.className = 'warn';
    g.textContent = gaps.length + ' buttons have no drawing: ' + gaps.join(', ');
    box.appendChild(g);
  }

  const audit = document.createElement('div');
  audit.className = 'isum';
  audit.innerHTML = '<b>Coverage.</b> Checking which apps still use a plain '
    + 'character where an icon belongs\u2026';
  box.appendChild(audit);
  runAudit(audit);

  const grid = document.createElement('div');
  grid.className = 'igrid';
  Icons.list().forEach(id => {
    const users = Object.keys(Icons.ROLES).concat(Object.keys(over))
      .filter((v, i, a) => a.indexOf(v) === i)
      .filter(role => Icons.iconFor(role) === id).sort();
    const c = document.createElement('div');
    c.className = 'icard';
    c.innerHTML =
      '<div class="draw">' + Icons.svg(users[0] || id, { size: 26, skin: skin }) + '</div>'
      + '<div class="meta"><div class="iname">' + esc(id) + '</div>'
      + '<div class="inote">' + esc(Icons.NOTES[id] || (users.length + ' buttons')) + '</div>'
      + '<div class="chips"></div></div>';
    const chips = c.querySelector('.chips');
    users.forEach(role => {
      const b = document.createElement('button');
      b.className = 'chip' + (over[role] ? ' moved' : '');
      b.textContent = role;
      b.onclick = e => moveRole(role, e.clientX, e.clientY);
      chips.appendChild(b);
    });
    grid.appendChild(c);
  });
  box.appendChild(grid);
}

/* ---- the coverage audit ----
   The reason a master set exists is so no app goes on drawing its own buttons
   out of Unicode. A character is not an icon: it renders differently on every
   device, cannot take a colour, and disappears when a font does. This reads
   each app as it actually ships and says which ones are still doing it, so
   the answer is checked rather than assumed.

   It needs the folder served, because a page opened off the disk cannot fetch.
   It says so rather than reporting a clean bill it has not earned. */
const GLYPHS = /[\u2190-\u21FF\u2500-\u257F\u25A0-\u25FF\u2600-\u27BF\u2B00-\u2BFF\uFF0B]|[\uD83C-\uDBFF][\uDC00-\uDFFF]/g;
const AUDIT_FILES = [
  ['home', '../index.html'], ['block', '../block/index.html'],
  ['habits', '../habits/index.html'], ['form', '../form/index.html'],
  ['status', '../status/index.html'], ['train', '../train/index.html'],
  ['arc', '../arc/index.html'], ['style', 'index.html'],
  ['template', '../_template/index.html'],
];

async function runAudit(into) {
  const rows = [];
  let reachable = 0;
  for (const [name, url] of AUDIT_FILES) {
    let txt = null;
    try { const r = await fetch(url, { cache: 'no-cache' }); if (r.ok) txt = await r.text(); }
    catch (e) {}
    if (txt == null) { rows.push([name, null]); continue; }
    reachable++;
    /* Comments and the icon set's own table are not buttons, so they are cut
       before counting. This is a smell test, not a parser: it is meant to say
       which app to look at next, not to be exact. */
    const body = txt.replace(/<!--[\s\S]*?-->/g, '').replace(/\/\*[\s\S]*?\*\//g, '');
    const hits = body.match(GLYPHS) || [];
    const uses = Icons.svg ? (body.match(/Icons\.svg|Icons\.el/g) || []).length : 0;
    rows.push([name, { glyphs: hits.length, distinct: [...new Set(hits)].join(' '), uses: uses }]);
  }
  if (!reachable) {
    into.innerHTML = '<b>Coverage.</b> Cannot read the other apps from here. '
      + 'This page has to be served for the audit to run \u2014 opened straight '
      + 'off the disk a page cannot fetch its neighbours. Nothing is wrong; '
      + 'it simply cannot tell you either way.';
    return;
  }
  const clean = rows.filter(r => r[1] && r[1].glyphs === 0).length;
  into.innerHTML = '<b>Coverage.</b> ' + clean + ' of ' + reachable
    + ' apps are drawing every button. The rest are still using a plain '
    + 'character somewhere, which renders differently on every phone and cannot '
    + 'take a theme colour.<br>'
    + rows.map(([name, d]) => {
        if (!d) return '<span style="color:var(--text-muted)">' + esc(name) + ' not found</span>';
        if (!d.glyphs) return '<b style="color:var(--success)">' + esc(name) + ' clean</b>'
          + ' <span style="color:var(--text-muted)">(' + d.uses + ' drawn)</span>';
        return '<span style="color:var(--warn)">' + esc(name) + ' ' + d.glyphs
          + '</span> <span style="color:var(--text-muted)">' + esc(d.distinct.slice(0, 40))
          + (d.uses ? ' \u00b7 ' + d.uses + ' drawn' : '') + '</span>';
      }).join(' &nbsp;\u00b7&nbsp; ');
}

/* Point one button at a different drawing. Saved as a setting, so it is in the
   backup and it does not need this file edited. */
function moveRole(role, x, y) {
  const cur = Icons.iconFor(role);
  const items = Icons.list().map(id => ({
    label: (id === cur ? '\u2713 ' : '   ') + id,
    fn: () => {
      const o = Object.assign({}, Icons.overrides());
      if (id === Icons.ROLES[role]) delete o[role]; else o[role] = id;
      Rec.setting('style', 'icons', o);
      drawGrid();
      UI.toast('<b>' + esc(role) + '</b> is now <b>' + esc(id) + '</b>');
    },
  }));
  UI.menu(x, y, items);
}

function drawGrid() {
  if (view === 'icons') return drawIcons();
  const box = $('#grid');
  box.className = 'grid';
  box.innerHTML = '';
  Skins.list().forEach(s => box.appendChild(tile(s)));
}

function tile(skin) {
  const d = document.createElement('div');
  d.className = 'pv' + (skin.id === sel ? ' on' : '');
  d.dataset.id = skin.id;
  const inUse = Skins.current && Skins.current.id === skin.id;
  d.innerHTML =
    '<div class="pvhead"><span class="nm">' + esc(skin.name) + '</span>'
    + (inUse ? '<span class="tag">STYLE</span>' : '')
    + '<button class="mini" data-act="use">USE HERE</button>'
    + '<button class="mini" data-act="more">\u22ef</button></div>'
    + '<div class="pvwrap"><iframe title="' + esc(skin.name) + ' preview"></iframe>'
    + '<div class="pvsheet"></div></div>';
  const f = d.querySelector('iframe');
  f.srcdoc = frameHTML(skin);
  d.querySelector('.pvsheet').onclick = () => select(skin.id);
  d.oncontextmenu = e => { e.preventDefault(); themeMenu(skin, e.clientX, e.clientY); };
  d.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const a = b.dataset.act;
      if (a === 'use') { Skins.apply(skin.id); Sfx.play('drop'); drawAll(); UI.toast('STYLE is <b>' + esc(skin.name) + '</b>'); }
      if (a === 'more') { const r = b.getBoundingClientRect(); themeMenu(skin, r.left, r.bottom + 4); }
    };
  });
  return d;
}

/* Repaint one tile only. Repainting all eleven on every slider drag is what
   would make the editor feel like treacle. */
function repaint(skin) {
  const d = $('.pv[data-id="' + skin.id + '"]');
  if (!d) { drawGrid(); return; }
  d.querySelector('iframe').srcdoc = frameHTML(skin);
  d.querySelector('.pvhead .nm').textContent = skin.name;
}

function drawAll() { drawRail(); drawGrid(); drawEditor(); }

/* ---- right-click a theme ----
   Everything you can do to a theme, in one place, on both the list and the
   tile. The destructive ones live here rather than on the tile, because a
   button sitting next to USE HERE is one slip away from a theme you did not
   mean to make. */
function themeMenu(skin, x, y) {
  const isMine = !Skins.factory(skin.id);
  const items = [
    { label: 'USE IN STYLE', fn: () => {
        Skins.apply(skin.id); Sfx.play('drop'); drawAll();
        UI.toast('STYLE is <b>' + esc(skin.name) + '</b>');
      } },
    { label: 'EDIT', fn: () => select(skin.id) },
    { label: 'COPY AS JSON', fn: () => copyJSON(skin) },
    '-',
    { label: 'DUPLICATE', fn: () => duplicate(skin) },
  ];
  if (!isMine && Skins.isEdited(skin.id))
    items.push({ label: 'RESET TO FACTORY', fn: () => { select(skin.id); reset(); } });
  if (isMine)
    items.push({ label: 'DELETE', kind: 'bad', fn: () => { select(skin.id); remove(); } });
  UI.menu(x, y, items, { title: skin.name });
}

/* ---- how many themes are yours ----
   Factory themes do not count: they are always there and cannot be lost. */
const MAX_MINE = 3;
const mine = () => Skins.list().filter(s => !Skins.factory(s.id));
function roomForOne() {
  const n = mine().length;
  if (n < MAX_MINE) return true;
  UI.toast('You keep <b>' + MAX_MINE + '</b> of your own themes and you have <b>' + n +
    '</b>. Right-click one and delete it first.', { bad: true });
  return false;
}

/* ---- selecting ---- */
function select(id) {
  if (dirty && draft && draft.id !== id &&
      !confirm('Discard the unsaved changes to ' + draft.name + '?')) return;
  sel = id;
  draft = clone(Skins.get(id));
  dirty = false;
  drawAll();
}

/* ---- the editor ---- */
/* ---- the editor ----
   Built out of shared/ui.js and nothing else: UI.row for every line, UI.field
   for text, UI.toggle for a switch, UI.segmented for a short choice, and the
   shared .mb-group heading and .mb-swatch colour well. STYLE used to hand-roll
   all of this, which is exactly why it looked like a different product from
   the rest of the suite. A component from the kit inherits every theme and
   every future fix for free; a copy of it inherits nothing. */

const btn = (id, ico, label) =>
  '<button class="mb-btn mb-press mb-tap" id="' + id + '">'
  + Icons.svg(ico, { size: 15 }) + '<span>' + label + '</span></button>';

/* A colour: the hex you can type into, and the well you can pick from. */
function colourRow(title, note, get, set) {
  const wrap = document.createElement('div');
  wrap.className = 'pair';
  const hex = UI.field('text', { value: get() });
  hex.classList.add('hex');
  const well = document.createElement('input');
  well.type = 'color';
  well.className = 'mb-swatch';
  well.value = hex6(get());
  hex.onchange = () => {
    const v = hex.value.trim();
    if (!/^#[0-9a-f]{3,8}$/i.test(v)) { hex.value = get(); return; }
    set(v); well.value = hex6(v); touch();
  };
  well.oninput = () => { set(well.value); hex.value = well.value; touch(); };
  wrap.appendChild(hex); wrap.appendChild(well);
  return UI.row(title, note, wrap);
}

/* A number you drag, with the value read out beside it. */
function slideRow(title, note, min, max, step, get, set) {
  const wrap = document.createElement('div');
  wrap.className = 'pair';
  const r = document.createElement('input');
  r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = get();
  r.className = 'mb-range';
  const out = document.createElement('span');
  out.className = 'val';
  out.textContent = get();
  r.oninput = () => { set(+r.value); out.textContent = r.value; touch(); };
  wrap.appendChild(r); wrap.appendChild(out);
  return UI.row(title, note, wrap);
}

function pickRow(title, note, opts, cur, set) {
  const sel = document.createElement('select');
  sel.className = 'mb-sel';
  sel.innerHTML = opts.map(o => {
    const [v, l] = Array.isArray(o) ? o : [o, o];
    return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
  sel.onchange = () => { set(sel.value); touch(); };
  return UI.row(title, note, sel);
}

function drawEditor() {
  const box = $('#editor');
  box.innerHTML = '';
  if (!draft) {
    box.innerHTML = '<div class="pad"><p class="note">Pick a theme on the left to edit it.</p></div>';
    return;
  }
  const s = draft;
  const isNew = !Skins.factory(s.id);
  const tex = s.texture || (s.texture = {});
  const ico = s.icon || (s.icon = {});

  const pad = document.createElement('div');
  pad.className = 'pad';
  box.appendChild(pad);
  const group = t => { pad.appendChild(el('div', 'mb-group', t)); };
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  /* -- name and the actions -- */
  const name = UI.field('text', { value: s.name });
  name.oninput = () => { s.name = name.value; touch(); };
  pad.appendChild(UI.row('Name', null, name));

  const acts = el('div', 'btns',
    btn('e-save', 'save', 'SAVE') + btn('e-use', 'theme', 'USE IN STYLE')
    + btn('e-copy', 'copy', 'COPY JSON')
    + (isNew ? btn('e-del', 'delete', 'DELETE')
             : (Skins.isEdited(s.id) ? btn('e-reset', 'undo', 'RESET') : '')));
  pad.appendChild(acts);
  const dmsg = el('p', 'dirty', '');
  dmsg.id = 'e-dirty';
  pad.appendChild(dmsg);
  acts.querySelector('#e-save').onclick = save;
  acts.querySelector('#e-use').onclick = () => {
    if (dirty) save();
    Skins.apply(Skins.get(s.id)); Sfx.play('drop'); drawAll();
    UI.toast('STYLE is <b>' + esc(s.name) + '</b>');
  };
  acts.querySelector('#e-copy').onclick = () => copyJSON(s);
  const d1 = acts.querySelector('#e-del'); if (d1) d1.onclick = remove;
  const r1 = acts.querySelector('#e-reset'); if (r1) r1.onclick = reset;

  /* -- colour -- */
  group('COLOUR');
  [['bg', 'Page background', 'behind everything'],
   ['panel', 'Card fill', 'the surface things sit on'],
   ['accent', 'Accent', 'buttons and selection'],
   ['text', 'Text', 'the main reading colour']]
    .forEach(([k, t, n]) => pad.appendChild(
      colourRow(t, n, () => s.base[k], v => { s.base[k] = v; })));
  pad.appendChild(pickRow('Mode', 'light or dark furniture', ['dark', 'light'],
    s.mode, v => { s.mode = v; }));

  /* -- the six chart colours -- */
  group('CHART COLOURS');
  const defRamp = [1, 2, 3, 4, 5, 6].map(i => Skins.tokensFor(s)['--data-' + i]);
  const ramp = (s.ramp && s.ramp.length === 6) ? s.ramp : defRamp;
  const rampBox = el('div', 'mb-chips');
  ramp.forEach((c, i) => {
    const w = document.createElement('input');
    w.type = 'color'; w.className = 'mb-swatch'; w.value = hex6(c);
    w.oninput = () => {
      if (!s.ramp || s.ramp.length !== 6) s.ramp = ramp.slice();
      s.ramp[i] = w.value; touch();
    };
    rampBox.appendChild(w);
  });
  pad.appendChild(rampBox);

  /* -- feel -- */
  group('FEEL');
  const cut = parseFloat(tex.cut != null ? tex.cut : (s.cut || '10px')) || 0;
  pad.appendChild(slideRow('Corner roundness', 'square through to soft', 0, 24, 1,
    () => cut, v => { tex.cut = v + 'px'; }));
  pad.appendChild(slideRow('Border weight', 'hairline through to drawn', 0, 4, 1,
    () => (s.weight != null ? s.weight : 1), v => { s.weight = v; }));
  pad.appendChild(pickRow('Depth', 'how a surface sits on the page',
    DEPTHS, s.depth || 'soft', v => { s.depth = v; }));
  pad.appendChild(pickRow('Motion', 'how fast it responds',
    Object.keys(MOTIONS).concat(motionName(s.motion) === 'custom' ? ['custom'] : []),
    motionName(s.motion), v => {
      if (v === 'custom') return;
      s.motion = clone(MOTIONS[v]);
      if (!Object.keys(s.motion).length) delete s.motion;
    }));
  pad.appendChild(el('p', 'note',
    'Spacing and tap targets are not on this list on purpose. A theme changes '
    + 'how a box is drawn, never where it sits.'));

  /* -- type -- */
  group('TYPE');
  const dCur = fontByStack(tex.display || ''), bCur = fontByStack(tex.body || '');
  const names = FONTS.map(f => f[0]);
  const setFonts = () => {
    const d = FONTS.filter(f => f[0] === dSel.value)[0];
    const b = FONTS.filter(f => f[0] === bSel.value)[0];
    if (d[0] === 'system') delete tex.display; else tex.display = d[1];
    if (b[0] === 'system') delete tex.body; else tex.body = b[1];
    const specs = [d[2], b[2]].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);
    if (specs.length) s.font = specs.length === 1 ? specs[0] : specs; else delete s.font;
    touch();
  };
  const dRow = pickRow('Headings and buttons', null, names, dCur[0], () => setFonts());
  const bRow = pickRow('Body text', null, names, bCur[0], () => setFonts());
  pad.appendChild(dRow); pad.appendChild(bRow);
  const dSel = dRow.querySelector('select'), bSel = bRow.querySelector('select');
  pad.appendChild(el('p', 'note',
    'Fonts come from Google and need a connection the first time. Offline they '
    + 'fall back to the system face.'));

  /* -- icons -- */
  group('ICONS');
  const ipreview = el('div', 'iprev');
  const ipaint = () => {
    ipreview.innerHTML = ['add', 'delete', 'today', 'food', 'train', 'settings']
      .map(r => Icons.svg(r, { size: 24, skin: s })).join('');
  };
  pad.appendChild(slideRow('Line weight', 'how heavy the stroke is', 1, 3, 0.05,
    () => (ico.weight != null ? ico.weight : 1.75), v => { ico.weight = v; ipaint(); }));
  pad.appendChild(pickRow('Line ends', null, ['round', 'butt', 'square'],
    ico.cap || 'round', v => { ico.cap = v; ipaint(); }));
  pad.appendChild(pickRow('Corners', null, ['round', 'miter', 'bevel'],
    ico.join || 'round', v => { ico.join = v; ipaint(); }));
  pad.appendChild(UI.row('Hand-drawn wobble', 'for a theme that is drawn, not printed',
    UI.toggle(!!ico.wobble, v => { ico.wobble = v; ipaint(); touch(); })));
  pad.appendChild(ipreview);
  ipaint();
  pad.appendChild(el('p', 'note',
    'A theme changes the stroke, never the shape. That is what stops a new '
    + 'theme costing fifty new drawings.'));

  /* -- the theme's own css -- */
  group('THIS THEME’S OWN CSS');
  const ta = UI.field('note', { value: s.css || '', rows: 8 });
  ta.classList.add('css');
  ta.spellcheck = false;
  ta.oninput = () => { s.css = ta.value; touch(); };
  pad.appendChild(ta);
  pad.appendChild(el('p', 'note',
    'This is what turns a recolour into a different universe. It styles the '
    + 'shared class names, so it reaches every app. It cannot move anything.'));

  /* -- readability -- */
  group('READABILITY');
  const chk = Skins.check(s.base);
  pad.appendChild(el('p', chk.ok ? 'note' : 'warn', chk.ok
    ? 'Contrast passes. Accent on background ' + chk.accentOnBg.toFixed(1)
      + ':1, text on card ' + chk.textOnPanel.toFixed(1) + ':1.'
    : 'Hard to read. Accent on background is ' + chk.accentOnBg.toFixed(1)
      + ':1 (wants 3.0) and text on a card is ' + chk.textOnPanel.toFixed(1)
      + ':1 (wants 4.5). Your call, but it will be uncomfortable in daylight.'));

  markDirty();
}

const hex6 = v => {
  let h = String(v || '#000000').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return '#' + h.slice(0, 6).padEnd(6, '0');
};

/* An edit repaints its own preview and nothing else. */
let paintTimer = null;
function touch() {
  dirty = true;
  markDirty();
  clearTimeout(paintTimer);
  paintTimer = setTimeout(() => repaint(draft), 90);
}
function markDirty() {
  const d = $('#e-dirty');
  if (d) d.innerHTML = dirty ? 'Unsaved changes. Nothing else sees them until you press SAVE.' : '';
}

/* ---- saving ----
   One row per theme, so two devices that each made a different theme both keep
   theirs. A theme that shares an id with a factory one simply replaces it, and
   deleting the row is the reset. */
function save() {
  if (!draft) return;
  Skins.saveCustom(Object.assign({}, draft, { custom: true }));
  dirty = false;
  Sfx.play('drop');
  /* If STYLE is wearing the theme that just changed, repaint the app too. */
  if (Skins.current && Skins.current.id === draft.id) Skins.apply(Skins.get(draft.id));
  drawAll();
  UI.toast('saved <b>' + esc(draft.name) + '</b>');
}

function reset() {
  const f = Skins.factory(draft.id);
  if (!f) return;
  const id = draft.id;
  UI.confirm('Put ' + f.name + ' back to how it ships?',
    'Throws away your changes to this one theme. Every other theme is left alone.',
    { title: 'RESET', yes: 'RESET' }
  ).then(ok => {
    if (!ok) return;
    Skins.forget(id);
    if (Skins.current && Skins.current.id === id) Skins.apply(Skins.get(id));
    select(id);
    UI.toast('<b>' + esc(f.name) + '</b> is back to factory');
  });
}

function remove() {
  const id = draft.id, nm = draft.name;
  const payload = clone(Rec.get('skin', null, id) || draft);
  UI.confirm('Delete ' + nm + '?',
    'Any app set to it falls back to the first theme. You can undo this straight after.',
    { title: 'DELETE', yes: 'DELETE', danger: true }
  ).then(ok => {
    if (!ok) return;
    Skins.forget(id);
    sel = null; draft = null; dirty = false;
    drawAll();
    UI.undo('deleted <b>' + esc(nm) + '</b>', () => {
      Rec.set('skin', null, id, payload);
      select(id);
    });
  });
}

function duplicate(skin) {
  if (!roomForOne()) return;
  const copy = clone(skin);
  copy.id = slug(skin.name + ' copy');
  copy.name = skin.name + ' copy';
  copy.custom = true;
  Skins.saveCustom(copy);
  select(copy.id);
  UI.toast('made <b>' + esc(copy.name) + '</b>');
}

function newTheme() {
  if (!roomForOne()) return;
  const base = clone(Skins.get(sel || Skins.list()[0].id));
  base.id = slug('theme ' + (Skins.customs().length + 1));
  base.name = 'New theme';
  base.custom = true;
  Skins.saveCustom(base);
  select(base.id);
}

const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-')
  .replace(/^-|-$/g, '').slice(0, 32) || ('theme-' + Date.now().toString(36));

/* ---- the paste box ----
   The whole reason STYLE exists in the shape it does. Show Claude some
   screenshots, get one block of JSON, paste it here. */
function pasteTheme() {
  UI.dialog({
    title: 'PASTE A THEME', width: 560,
    body: b => {
      b.innerHTML =
        '<p class="note" style="margin-bottom:var(--s-3)">Paste one theme, as JSON. '
        + 'This is the same shape a theme has in the file, so anything COPY JSON '
        + 'gives you can come straight back in here.</p>'
        + '<textarea id="p-json" spellcheck="false" style="min-height:220px" '
        + 'placeholder=\'{ "id": "ragnarok", "name": "Ragnarok", ... }\'></textarea>'
        + '<p class="warn" id="p-err"></p>';
    },
    actions: [
      { label: 'CANCEL' },
      {
        label: 'ADD', kind: 'go',
        fn: h => {
          const ta = h.body.querySelector('#p-json');
          const err = h.body.querySelector('#p-err');
          const r = readTheme(ta.value);
          if (r.error) { err.textContent = r.error; return false; }
          Skins.saveCustom(r.skin);
          h.close();
          select(r.skin.id);
          Sfx.play('drop');
          UI.toast('added <b>' + esc(r.skin.name) + '</b>');
        },
      },
    ],
  });
}

/* Validation says what is wrong in words, because the person pasting is not
   going to read a stack trace. */
function readTheme(txt) {
  let o;
  try { o = JSON.parse(String(txt || '').trim()); }
  catch (e) { return { error: 'That is not valid JSON. ' + e.message }; }
  if (Array.isArray(o)) return { error: 'That is a list of themes. Paste one theme on its own.' };
  if (!o || typeof o !== 'object') return { error: 'That is not a theme object.' };
  if (o.skins) return { error: 'That is the whole themes file. Paste just one entry from its "skins" list.' };
  if (!o.base || typeof o.base !== 'object') return { error: 'No "base" colours. A theme needs base.bg, base.panel, base.accent and base.text.' };
  const miss = ['bg', 'panel', 'accent', 'text'].filter(k => !o.base[k]);
  if (miss.length) return { error: 'base is missing: ' + miss.join(', ') + '.' };
  const bad = ['bg', 'panel', 'accent', 'text'].filter(k => !/^#[0-9a-f]{3,8}$/i.test(String(o.base[k]).trim()));
  if (bad.length) return { error: 'These need to be hex colours like #1A2B3C: ' + bad.join(', ') + '.' };
  if (!o.name) o.name = 'Pasted theme';
  o.id = slug(o.id || o.name);
  if (o.mode !== 'light') o.mode = o.mode === 'dark' ? 'dark' : (Skins.util.lum(o.base.bg) > .5 ? 'light' : 'dark');
  o.custom = true;
  /* Anything the engine does not know about is left alone rather than stripped:
     a theme from a newer Claude may carry a lever this build has not got yet,
     and throwing it away would lose it silently. */
  return { skin: o };
}

/* ---- handing a theme back out ---- */
function copyJSON(skin) {
  const o = clone(skin);
  delete o.custom;
  toClipboard(JSON.stringify(o, null, 2), esc(skin.name) + ' copied as JSON');
}

function toClipboard(text, msg) {
  const done = () => UI.toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallback());
  } else fallback();
  function fallback() {
    /* No clipboard permission, or an insecure origin, which is exactly what
       opening the file from a folder is. Show it and select it instead of
       failing quietly. */
    UI.dialog({
      title: 'COPY THIS', width: 560,
      body: b => {
        b.innerHTML = '<p class="note" style="margin-bottom:var(--s-3)">Press Ctrl+C.</p>'
          + '<textarea spellcheck="false" style="min-height:260px"></textarea>';
        const ta = b.querySelector('textarea');
        ta.value = text;
        setTimeout(() => { ta.focus(); ta.select(); }, 50);
      },
      actions: [{ label: 'DONE' }],
    });
  }
}

/* ---- the brief ----
   Copy this, paste it into Claude Code with your screenshots, get a theme back.
   It is written out in full rather than pointing at a file, because the whole
   point is that it travels on its own into a fresh conversation. */
function briefForClaude() {
  const example = JSON.stringify(clone(Skins.get('ragnarok') || Skins.list()[0]), null, 2);
  const brief =
'I am going to show you screenshots of an interface. Turn them into ONE theme for\n' +
'my app suite, and give it back as a single JSON object I can paste in.\n' +
'\n' +
'A theme changes how every box is DRAWN. It must not change layout: no boxes\n' +
'move, none are added or removed, and nothing gets smaller than a 44px tap\n' +
'target. Spacing and type sizes are fixed by the suite and are not yours to set.\n' +
'\n' +
'THE SHAPE\n' +
'  id       short lowercase slug\n' +
'  name     what it is called\n' +
'  mode     "dark" or "light"\n' +
'  base     bg (page), panel (card fill), accent, text. Hex.\n' +
'  overrides  optional. Any single CSS token, forced. Useful ones:\n' +
'             --surface-2 (recessed), --surface-3 (raised), --border,\n' +
'             --border-strong, --text-2, --text-muted\n' +
'  ramp     six hex colours for charts\n' +
'  weight   border thickness in px, 1 to 4\n' +
'  depth    "soft"   shadows, things float\n' +
'           "flat"   no shadow at all, borders do the work\n' +
'           "bevel"  plates with thickness, lit top-left, shaded bottom-right\n' +
'           "glow"   light comes off the element, built from the accent\n' +
'  track    optional { cap, tight, body } letter spacing. Keep it small.\n' +
'  motion   optional { tap, fast, med, slow, sheet, ease } as CSS values\n' +
'  texture  { display, body, cut, image, size }\n' +
'             display / body are full CSS font stacks\n' +
'             cut is corner roundness, e.g. "0px". The whole radius family\n' +
'             follows it.\n' +
'             image / size are a CSS background for the page\n' +
'  font     Google Fonts spec, e.g. "Silkscreen:wght@400;700". A string, or a\n' +
'           list of two if the display and body faces differ. Always give a\n' +
'           system fallback in the stack, because offline it will be used.\n' +
'  css      a stylesheet for this theme only. THIS is what makes it feel like a\n' +
'           different universe rather than a recolour. Style these class names:\n' +
'             header .logo h2 .card .item .chk #fab\n' +
'             .mb-btn .mb-act .mb-input .mb-sel .mb-chip .mb-x .mb-opt\n' +
'             .mb-sheet .mb-sheet-head .mb-toast .mb-menu .mb-sw\n' +
'           Use var(--token) for colour, never a raw hex, or palette edits\n' +
'           break. Useful: var(--e-1..5), var(--bevel-in), var(--accent),\n' +
'           var(--accent-fg), var(--surface-1..3), var(--border),\n' +
'           var(--border-width), var(--radius-md), var(--font-display).\n' +
'           Do not set width, height, padding, margin, position or font-size.\n' +
'\n' +
'RULES\n' +
'  - No layout changes. Draw the boxes differently, do not move them.\n' +
'  - Body text stays readable. Put a decorative or pixel face on headings and\n' +
'    buttons only.\n' +
'  - Text on a card wants 4.5:1 contrast, accent on background wants 3:1.\n' +
'  - Give me the JSON and nothing else. No commentary around it.\n' +
'\n' +
'HERE IS A COMPLETE EXAMPLE OF THE FORMAT\n' +
example + '\n';
  toClipboard(brief, 'brief copied &mdash; paste it into Claude with your screenshots');
}

/* ---- which app wears what ----
   The theme is chosen per app on purpose, so ARC can be Doodle while BLOCK is
   Ice. This is the one place you can see all of them at once. */
const SUITE = [
  ['home', 'HOME'], ['arc', 'ARC'], ['block', 'BLOCK'], ['habits', 'HABITS'],
  ['form', 'FORM'], ['status', 'STATUS'], ['train', 'TRAIN'], ['style', 'STYLE'],
];
function assignApps() {
  UI.dialog({
    title: 'WHICH APP WEARS WHAT', width: 460,
    body: b => {
      const list = Skins.list();
      b.innerHTML = '<p class="note" style="margin-bottom:var(--s-3)">Each app keeps its own '
        + 'theme. ARC still carries its own copy of the theme engine, so it will '
        + 'ignore this until that is changed.</p>';
      SUITE.forEach(([id, nm]) => {
        const cur = localStorage.getItem('suite_skin.' + id) || '';
        const row = document.createElement('div');
        row.className = 'fld';
        row.innerHTML = '<label>' + nm + '</label><select data-app="' + id + '">'
          + '<option value="">(first theme)</option>'
          + list.map(s => '<option value="' + esc(s.id) + '"' + (s.id === cur ? ' selected' : '') + '>'
              + esc(s.name) + '</option>').join('')
          + '</select>';
        row.querySelector('select').onchange = e => {
          const v = e.target.value;
          if (v) localStorage.setItem('suite_skin.' + id, v);
          else localStorage.removeItem('suite_skin.' + id);
          if (id === APP.id) { Skins.apply(v || Skins.list()[0].id); drawAll(); }
          UI.toast(nm + ' is <b>' + esc(v ? Skins.get(v).name : 'the first theme') + '</b>');
        };
        b.appendChild(row);
      });
      const all = document.createElement('button');
      all.className = 'mb-btn mb-press mb-tap';
      all.style.marginTop = 'var(--s-3)';
      all.textContent = 'SET EVERY APP TO THE SELECTED THEME';
      all.onclick = () => {
        if (!sel) return;
        SUITE.forEach(([id]) => localStorage.setItem('suite_skin.' + id, sel));
        Skins.apply(sel); drawAll();
        UI.toast('every app is <b>' + esc(Skins.get(sel).name) + '</b>');
        b.querySelectorAll('select').forEach(s => { s.value = sel; });
      };
      b.appendChild(all);
    },
    actions: [{ label: 'DONE' }],
  });
}

/* ---- boot ----
   skins.json has to be in before anything can be drawn, and Rec has to be
   there before Skins.customs() can find the saved themes. */
Skins.load('../shared/skins.json').then(() => {
  Skins.restore(APP.id);
  sel = (Skins.current && Skins.current.id) || Skins.list()[0].id;
  draft = clone(Skins.get(sel));
  drawAll();
  setView('themes');
  /* Ask for every icon the bar needs once the set is there. */
  document.querySelectorAll('header [data-ico]').forEach(b => {
    b.insertAdjacentHTML('afterbegin', Icons.svg(b.dataset.ico, { size: 15 }));
  });
});

/* A theme saved in another tab is a row like anything else, so the store tells
   us and the rail and the canvas catch up without a refresh. */
Rec.on(() => { if (!dirty) { drawRail(); drawGrid(); } });
</script>
