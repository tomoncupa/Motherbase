<!--  CODEX is a guest in this repo, like reckon/ and calcount/. It loads
      nothing from ../shared: no store, no themes, no icons, no sounds. Every
      line it needs is in this file, so the folder lifts out into its own repo
      with nothing to untangle. Its storage keys all start "cx." and it never
      reads or writes Motherbase's rows. See codex/CLAUDE.md.

      The one font is Rajdhani from Google Fonts, for the System-window look.
      If it does not load, the stack falls back to the system's own and
      nothing else changes.                                                  -->

<style>
/* ─────────────────────────── the system ───────────────────────────
   Every colour in this file is declared here and nowhere else. The look
   is the System window from NOTICE's HUNTER palette: near-black navy,
   one cyan that means "this is live", cut corners and a faint glow.
   Each bracket gets its own colour so a term's family is visible at a
   glance; gold is kept for MASTERED and nothing else.                */
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --f1:12px; --f2:14px; --f3:16px; --f4:18px; --f5:20px; --f6:24px; --f7:30px; --f8:36px; --f9:48px;

  --bg:#05070D;
  --bg-2:#0A1830;
  --s-1:#0B1626;          /* a window or card */
  --s-2:#102036;          /* a row on a card */
  --s-3:#17304D;          /* a key or a pressed row */
  --line:#1F3A5A;
  --line-2:#4A7BA8;       /* a line that carries meaning */

  --t1:#EAF7FF;           /* primary text */
  --t2:#B4D4EA;           /* secondary */
  --t3:#8DB0CB;           /* tertiary, 5:1 or better on a row */

  --acc:#5FD3FF;
  --acc-fg:#03121F;
  --glow:rgba(95,211,255,.45);
  --glow-2:rgba(95,211,255,.14);
  --gold:#F2C14E;
  --gold-fg:#1E1503;
  --good:#5BD98A;
  --good-bg:rgba(91,217,138,.12);
  --bad:#FF7A7A;
  --bad-bg:rgba(255,122,122,.12);
  --scrim:rgba(2,5,10,.78);
  --knob:#EAF7FF;

  /* one per bracket, in the order the database lists them */
  --b1:#5FD3FF; --b2:#F2C14E; --b3:#FF8A7A; --b4:#C79BFF; --b5:#5BD98A; --b6:#FF85C8;

  --face:'Rajdhani','Bahnschrift','DIN Alternate','Segoe UI',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',system-ui,sans-serif;
  --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;

  --r1:6px; --r2:10px; --r3:16px; --r4:999px;
  --cut:12px;
  --clip:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));
  --tap:44px;
  --e1:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.35);
  --e2:0 4px 12px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.35);
  --e3:0 12px 32px rgba(0,0,0,.55);

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  --fast:120ms; --med:220ms; --slow:420ms;
  --out:cubic-bezier(.2,.8,.3,1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100dvh;color:var(--t1);
  background:radial-gradient(120% 70% at 50% -10%,var(--bg-2),var(--bg) 70%) fixed,var(--bg);
  font-family:var(--body);font-size:var(--f3);line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;display:flex;flex-direction:column;
}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sheet:focus,.play:focus{outline:none}
.press{transition:transform var(--fast) var(--out),background-color var(--fast) linear,border-color var(--fast) linear}
.press:active:not(:disabled){transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .hov:hover:not(:disabled){background:var(--s-3)} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important;transition-duration:.01ms !important} }
.face{font-family:var(--face);letter-spacing:.06em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ─────────────────────────── shell ─────────────────────────── */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s2);position:sticky;top:0;z-index:10;
  padding:calc(var(--s2) + var(--safe-t)) calc(var(--s3) + var(--safe-r)) var(--s2) calc(var(--s4) + var(--safe-l));
  background:var(--s-1);border-bottom:1px solid var(--line);
}
.mark{font-family:var(--face);font-size:var(--f5);font-weight:700;letter-spacing:.24em;display:flex;align-items:center;gap:var(--s1)}
.mark b{color:var(--acc);font-weight:700}
.grow{flex:1}
.hbtn{min-width:var(--tap);min-height:var(--tap);display:flex;align-items:center;justify-content:center;
  border-radius:var(--r1);color:var(--t2)}
.streak{display:flex;align-items:baseline;gap:var(--s1);font-size:var(--f2);color:var(--t2);
  min-height:var(--tap);padding:0 var(--s2);border-radius:var(--r1)}
.streak b{font-family:var(--face);font-size:var(--f5);color:var(--acc);font-weight:700}
.streak.off b{color:var(--t3)}

main{flex:1}
.wrap{max-width:760px;margin:0 auto;
  padding:var(--s5) calc(var(--s4) + var(--safe-r)) calc(var(--s7) + var(--safe-b)) calc(var(--s4) + var(--safe-l));
  display:flex;flex-direction:column;gap:var(--s5)}

/* ─────────────────────── the System window ───────────────────────
   An octagon with its corners cut, drawn twice: the outer box is the
   line colour, the inner box is the panel, inset by one pixel. A
   clip-path cannot carry a border, and this is the way round it. The
   glow sits on a wrapper because a clipped box cannot cast a shadow. */
.glow{filter:drop-shadow(0 0 10px var(--glow-2)) drop-shadow(0 0 2px var(--glow))}
.win{background:var(--c,var(--acc));clip-path:var(--clip);padding:1px}
.win>.in{background:linear-gradient(180deg,var(--s-1),var(--bg));clip-path:var(--clip);padding:var(--s5)}
.kick{font-family:var(--face);font-size:var(--f2);font-weight:700;letter-spacing:.18em;color:var(--c,var(--acc))}
.chip{display:inline-flex;align-items:center;font-family:var(--face);font-weight:700;letter-spacing:.1em;
  font-size:var(--f2);color:var(--c,var(--acc));border:1px solid currentColor;border-radius:var(--r1);
  padding:0 var(--s2);line-height:1.6;white-space:nowrap}
.draft{font-family:var(--face);font-size:var(--f1);font-weight:700;letter-spacing:.14em;color:var(--t3);
  border:1px dashed var(--line-2);border-radius:var(--r1);padding:0 var(--s1);white-space:nowrap}

/* ─────────────────────────── home ─────────────────────────── */
.next .in{display:flex;flex-direction:column;gap:var(--s2)}
.next h1{font-family:var(--face);font-size:var(--f8);line-height:1.05;font-weight:700;letter-spacing:.04em}
.next p{color:var(--t2)}
.go{margin-top:var(--s3);width:100%;min-height:56px;border-radius:var(--r2);
  background:var(--acc);color:var(--acc-fg);font-family:var(--face);font-size:var(--f5);font-weight:700;letter-spacing:.16em}
.go:disabled{background:var(--s-2);color:var(--t3)}
.go.ghost{background:none;color:var(--t1);border:1px solid var(--line-2)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  min-height:72px;padding:var(--s3) var(--s4);border-radius:var(--r2);background:var(--s-1);border:1px solid var(--line)}
.mode .nm{font-family:var(--face);font-size:var(--f5);font-weight:700;letter-spacing:.14em}
.mode .sub{font-size:var(--f2);color:var(--t3)}
.mode.lock{background:var(--bg)}
.mode.lock .nm{color:var(--t3)}

.tally{display:flex;flex-direction:column;gap:var(--s2)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--s-2)}
.bar i{display:block;height:100%}
.bar .m{background:var(--gold)} .bar .k{background:var(--acc)} .bar .f{background:var(--line-2)}
.tally .txt{font-size:var(--f2);color:var(--t2);display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4)}
.tally .txt b{color:var(--t1);font-family:var(--face);font-size:var(--f4)}

.search{display:flex;align-items:center;gap:var(--s2);background:var(--s-1);border:1px solid var(--line);
  border-radius:var(--r2);padding:0 var(--s3);min-height:48px;color:var(--t3)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--t1);font-size:var(--f3);min-height:46px}
.search input::placeholder{color:var(--t3)}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.search input:focus-visible{outline:none}

.brk{display:flex;flex-direction:column;gap:var(--s3)}
.brk-h{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.brk-h .chip{font-size:var(--f4)}
.brk-h .cnt{font-family:var(--face);font-size:var(--f4);color:var(--t2);font-weight:600}
.brk-h .means{flex-basis:100%;font-size:var(--f2);color:var(--t3)}
.brk-h .boss{margin-left:auto}
.small{min-height:var(--tap);padding:0 var(--s3);border-radius:var(--r1);font-family:var(--face);font-weight:700;
  letter-spacing:.12em;font-size:var(--f2);border:1px solid var(--line-2);color:var(--t1);display:inline-flex;align-items:center;gap:var(--s2)}
.small.hot{border-color:var(--c,var(--acc));color:var(--c,var(--acc))}
.seal{font-family:var(--face);font-weight:700;letter-spacing:.14em;font-size:var(--f2);color:var(--gold);
  border:1px solid var(--gold);border-radius:var(--r1);padding:var(--s1) var(--s2);margin-left:auto}
.gate{font-size:var(--f2);color:var(--t3);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2)}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:var(--s2);text-align:left;
  min-height:72px;padding:var(--s3);border-radius:var(--r1);background:var(--s-1);
  border:1px solid var(--line);border-left:3px solid var(--c)}
.tile .nm{font-family:var(--face);font-size:var(--f4);font-weight:700;line-height:1.15;letter-spacing:.02em;overflow-wrap:anywhere}
.tile .st{display:flex;align-items:center;gap:var(--s2);font-size:var(--f1);color:var(--t3);letter-spacing:.12em;font-family:var(--face);font-weight:700}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:4px;border-radius:2px;background:var(--s-3)}
.pips i.on{background:var(--c)}
.tile.t3{border-color:var(--gold);border-left-color:var(--gold)}
.tile.t3 .pips i.on{background:var(--gold)}
.tile.lock{border-left-color:var(--line-2);background:var(--bg)}
.tile.lock .nm{color:var(--t2);font-weight:600}
.tile .due{position:absolute;top:var(--s2);right:var(--s2);width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--glow)}
.tile.fresh{animation:flip var(--slow) var(--out)}
@keyframes flip{from{transform:rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
.empty{border:1px dashed var(--line-2);border-radius:var(--r2);padding:var(--s4);color:var(--t3);font-size:var(--f2);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--s3)}
.none{color:var(--t3);font-size:var(--f2);text-align:center;padding:var(--s5)}
.banner{display:flex;flex-direction:column;gap:var(--s2);border:1px dashed var(--line-2);border-radius:var(--r2);
  padding:var(--s3) var(--s4);font-size:var(--f2);color:var(--t2)}
.banner .row{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* ─────────────────────────── play ─────────────────────────── */
.play{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  background:radial-gradient(120% 70% at 50% -10%,var(--bg-2),var(--bg) 70%),var(--bg)}
.ptop{flex:0 0 auto;display:flex;align-items:center;gap:var(--s3);
  padding:calc(var(--s2) + var(--safe-t)) calc(var(--s4) + var(--safe-r)) var(--s2) calc(var(--s2) + var(--safe-l))}
.prog{flex:1;height:6px;border-radius:3px;background:var(--s-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width var(--med) var(--out)}
.prog.time i{background:var(--gold);transition:width 250ms linear}
.ptag{flex:0 0 auto;min-width:56px;text-align:right;font-family:var(--face);font-weight:700;font-size:var(--f4);color:var(--t2);letter-spacing:.06em}
.pbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pwrap{max-width:640px;margin:0 auto;padding:var(--s4) calc(var(--s4) + var(--safe-r)) var(--s4) calc(var(--s4) + var(--safe-l));
  display:flex;flex-direction:column;gap:var(--s4);min-height:100%}
.pfoot{flex:0 0 auto;padding:var(--s3) calc(var(--s4) + var(--safe-r)) calc(var(--s3) + var(--safe-b)) calc(var(--s4) + var(--safe-l));
  border-top:1px solid var(--line);background:var(--s-1)}
.pfoot .inner{max-width:640px;margin:0 auto;display:flex;gap:var(--s3)}
.pfoot .inner > *{flex:1}
.pfoot .go{margin-top:0}
.pfoot:empty{display:none}

.q .in{display:flex;flex-direction:column;gap:var(--s3)}
.q .top{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.q .top .chip{margin-left:auto}
.big{font-family:var(--face);font-size:var(--f8);font-weight:700;line-height:1.08;letter-spacing:.03em;overflow-wrap:anywhere}
.big.xl{font-size:var(--f9)}
.def{font-size:var(--f4);line-height:1.55;color:var(--t1)}
.def .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--c,var(--acc));color:transparent;user-select:none}
.def .ref{color:var(--acc);font-weight:600}
.hint{font-family:var(--mono);font-size:var(--f4);color:var(--t2);letter-spacing:.18em}

.opts{display:flex;flex-direction:column;gap:var(--s2)}
.opt{display:flex;align-items:center;gap:var(--s3);text-align:left;width:100%;
  min-height:56px;padding:var(--s3) var(--s4);border-radius:var(--r2);background:var(--s-1);border:1px solid var(--line)}
.opt .k{flex:0 0 26px;height:26px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;
  font-family:var(--face);font-weight:700;font-size:var(--f2);background:var(--s-3);color:var(--t2)}
.opt .v{flex:1;min-width:0}
.opt.term .v{font-family:var(--face);font-size:var(--f5);font-weight:700;letter-spacing:.03em}
.opt.defn .v{font-size:var(--f3);line-height:1.45}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);color:var(--acc-fg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .k{background:var(--bad);color:var(--acc-fg)}
.opt.dim{opacity:.45}
@media (pointer:coarse){ .opt .k{display:none} }
.sorts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.sorts .opt{justify-content:center;min-height:64px;border-left:3px solid var(--c)}
.sorts .opt .v{flex:0 1 auto;font-family:var(--face);font-weight:700;letter-spacing:.12em;font-size:var(--f4);color:var(--c)}

.type{display:flex;gap:var(--s2)}
.type input{flex:1;min-width:0;min-height:56px;padding:0 var(--s4);border-radius:var(--r2);background:var(--s-1);
  border:1px solid var(--line-2);font-family:var(--face);font-size:var(--f5);font-weight:600;letter-spacing:.04em;color:var(--t1)}
.type input::placeholder{color:var(--t3);font-weight:500}
.type input.ok{border-color:var(--good);background:var(--good-bg)}
.type input.no{border-color:var(--bad);background:var(--bad-bg)}
.type .go{width:auto;flex:0 0 auto;margin-top:0;padding:0 var(--s4)}

.fb{border-radius:var(--r2);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s1)}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb .h{font-family:var(--face);font-weight:700;letter-spacing:.14em;font-size:var(--f3)}
.fb.ok .h{color:var(--good)} .fb.no .h{color:var(--bad)}
.fb .t{font-size:var(--f3);color:var(--t1)}
.fb .t b{font-family:var(--face);font-size:var(--f4);letter-spacing:.03em}
.rankup{color:var(--gold);font-family:var(--face);font-weight:700;letter-spacing:.1em}

.open{animation:open var(--slow) var(--out)}
@keyframes open{from{transform:scaleY(.04);opacity:0}60%{opacity:1}to{transform:none}}

.res .in{display:flex;flex-direction:column;gap:var(--s4)}
.score{display:flex;align-items:baseline;gap:var(--s3)}
.score .v{font-family:var(--face);font-size:64px;font-weight:700;line-height:1;color:var(--t1)}
.score .k{font-size:var(--f3);color:var(--t2)}
.best{font-family:var(--face);font-weight:700;letter-spacing:.16em;color:var(--gold)}
.list{display:flex;flex-direction:column;gap:var(--s2)}
.list h4{font-family:var(--face);font-size:var(--f2);font-weight:700;letter-spacing:.16em;color:var(--t3)}
.li{display:flex;flex-direction:column;gap:2px;padding:var(--s2) var(--s3);border-radius:var(--r1);background:var(--s-2);border-left:3px solid var(--c)}
.li .a{font-family:var(--face);font-weight:700;font-size:var(--f4);letter-spacing:.03em}
.li .b{font-size:var(--f2);color:var(--t2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chips .chip{white-space:normal;overflow-wrap:anywhere;text-align:left}

/* ─────────────────────────── sheet ─────────────────────────── */
.sheet-bg{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity var(--med) linear}
.sheet-bg.up{opacity:1}
.sheet{width:100%;max-width:580px;background:var(--s-1);border-radius:var(--r3) var(--r3) 0 0;box-shadow:var(--e3);
  border-top:1px solid var(--line-2);max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:var(--s3) calc(var(--s5) + var(--safe-r)) calc(var(--s5) + var(--safe-b)) calc(var(--s5) + var(--safe-l));
  transform:translateY(100%);transition:transform 360ms cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;gap:var(--s3)}
.sheet-bg.up .sheet{transform:none}
@media (min-width:640px){
  .sheet-bg{align-items:center}
  .sheet{border-radius:var(--r3);border:1px solid var(--line-2);max-height:88dvh;transform:translateY(16px) scale(.98);opacity:0;
    transition:transform var(--med) var(--out),opacity var(--med) linear}
  .sheet-bg.up .sheet{transform:none;opacity:1}
}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto var(--s2)}
.sheet h3{font-family:var(--face);font-size:var(--f7);font-weight:700;letter-spacing:.04em;line-height:1.1}
.sheet .lede{color:var(--t2);font-size:var(--f3)}
.sheet .btns{display:flex;flex-wrap:wrap;gap:var(--s2)}
.sheet .btns .go{flex:1 1 160px}
.sheet .def{font-size:var(--f3)}

/* ══════════════════════════════════════════════════════════════════
   CODEX: Tom's Skool bracket database, played.

   The database files every term under a bracket: [SKILLS], [STATS],
   [CONDITIONS], [TRAITS]. The game teaches two things about each term:
   what it MEANS, and which BRACKET it lives in. The second is the one the
   database itself is about, which is why SORT exists and why it needs
   nothing but the names.

   Built-in: the 39 names and their brackets exactly as Tom pasted them on
   2026-10-13. Every definition and every bracket meaning built into this
   file is a DRAFT Claude wrote, marked as one on screen, because the real
   definitions live on Tom's Skool pages and Skool's paid text never goes
   into this public repo. Tom's own words arrive through LOAD (paste or a
   file) or EDIT, and are kept in this browser only, under "cx." keys.

   Storage is one key per fact, never one blob: a card per term, a row per

const P = 'cx.';
const DB = {
  get(k, dflt) {
    try { const raw = localStorage.getItem(P + k); return raw == null ? dflt : JSON.parse(raw); }
    catch (e) { return dflt; }
  },
  /* `ok` says whether the last write was kept, so a screen never says
     "saved" about something the browser refused */
  ok: true,
  set(k, v) {
    try { localStorage.setItem(P + k, JSON.stringify(v)); DB.ok = true; return true; }
    catch (e) { DB.ok = false; return false; /* full, or private mode */ }
  },
  /* merge, never replace: read what is there, change the named fields,
     write it back whole */
  patch(k, changes) {
    const now = Object.assign({}, DB.get(k, {}), changes);
    DB.set(k, now); return now;
  },
  del(k) { try { localStorage.removeItem(P + k); DB.ok = true; } catch (e) { DB.ok = false; } },
  keys(prefix) {
    const out = [];

      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);

    } catch (e) { /* nothing readable */ }

};

/* Can this browser keep anything at all? Private modes and full disks say

const STORE_OK = (() => { try { localStorage.setItem(P + '__t', '1'); localStorage.removeItem(P + '__t'); return true; } catch (e) { return false; } })();

/* ── days ─────────────────────────────────────────────────────── */
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return ymd(d); };

function niceDay(s) {

  if (g === -1) return 'yesterday';
  const d = new Date(s + 'T12:00');
  return d.getDate() + ' ' + MONTHS[d.getMonth()];

/* ── little helpers ───────────────────────────────────────────── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

/* A term's id is its slug, so the same name typed twice is the same entry
   and progress follows the name across an import. */
function slug(s) {
  return String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/['’]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
/* What two answers have to agree on to be the same answer: case, accents,
   apostrophes, punctuation, spacing and a leading article do not count. */
function norm(s) {
  return String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/['’`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim().replace(/^(the|a|an) /, '');
}
/* optimal string alignment distance: one swap of neighbours counts as one */
function dist(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 99;
  const d = [];
  for (let i = 0; i <= m; i++) { d[i] = [i]; }
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[m][n];
}

/* Drawings, because a character is not an icon. Strokes, so they take the

/* ══════════════════ THE DATABASE ══════════════════

const BRACKETS0 = [

const TERMS0 = [

/* ── the deck as it stands: built-in, with Tom's changes laid over ──
   A change is its own row, `cx.term.<id>`, holding only what he changed.
   `del: true` hides an entry without forgetting it, so a deletion can be
   undone and a re-import cannot resurrect it by accident.             */
let DECK = null;

  const terms = [], seen = new Set();
  TERMS0.forEach((b, i) => {
    const id = slug(b.t); seen.add(id);
    const o = over[id] || {};
    if (o.del) return;
    terms.push({
      id, ord: i,
      term: o.term || b.t,
      bracket: o.bracket || b.b,
      def: o.def != null ? o.def : b.d,
      aka: Array.isArray(o.aka) ? o.aka : (b.a || []),

    terms.push({ id, ord: 1000 + (o.ord || 0), term: o.term, bracket: o.bracket || 'UNSORTED', def: o.def || '',

  terms.forEach(t => { if (ids.indexOf(t.bracket) < 0) ids.push(t.bracket); });
  const brackets = ids.map((id, i) => {
    const b0 = BRACKETS0.find(b => b.id === id) || {};
    const m = DB.get('bkt.' + id, null);
    return { id, i, color: 'var(--b' + (i % 6 + 1) + ')',
      means: (m && m.means) || b0.means || '', meansSrc: (m && m.means) ? 'yours' : (b0.means ? 'draft' : ''),
      empty: b0.empty || 'No entries yet.' };

}

const bkt = id => deck().brackets.find(b => b.id === id) || { id, color: 'var(--b6)', means: '', empty: '' };

const draftMark = t => t && t.src === 'draft' ? ' <span class="draft" title="Claude wrote this definition. Replace it with yours from Skool.">DRAFT</span>' : '';

/* Every way an answer may be written: the name, its other names, and
   anything in brackets inside the name, both with and without it. */
function answers(t) {
  const out = new Set();
  const add = s => { const n = norm(s); if (n) out.add(n); };
  add(t.term); (t.aka || []).forEach(add);
  const m = String(t.term).match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if (m) { add(m[1]); add(m[2]); }
  return Array.from(out);
}
/* The definition with the answer taken out of it, so a definition that
   spells out its own name ("Delayed onset muscle soreness: ...") is not a
   giveaway. Works on the escaped text, so the names are escaped too.    */
function namesOf(t) {
  const names = [t.term].concat(t.aka || []);
  const m = String(t.term).match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if (m) names.push(m[1], m[2]);
  return names.map(x => String(x || '').trim()).filter(x => x.length > 1);
}
/* One replace over the whole text, longest name first, so markup it has
   written is never searched again (an alias like "Label" would otherwise
   match inside aria-label). A plural, a possessive, a curly apostrophe or
   a hyphen in place of a space still counts as the name. */
function masked(t, text) {
  let h = esc(text == null ? t.def : text);
  const toPat = x => esc(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&#39;/g, '(?:&#39;|\u2019)').replace(/\s+|-/g, '[\\s-]+');
  const alt = namesOf(t).sort((a, b) => b.length - a.length).map(toPat).join('|');
  if (alt) h = h.replace(new RegExp('(^|[^A-Za-z0-9])((?:' + alt + ')(?:s|es|(?:&#39;|\u2019)s)?)(?=[^A-Za-z0-9]|$)', 'gi'),
    '$1<span class="blank" aria-label="blank">____</span>');
  return refs(h);
}
/* A definition that says its own name cannot be a "which definition?"
   question: the blank would point at the answer. */
const selfNamed = t => /class="blank"/.test(masked(t));
/* [Term] inside a definition is a reference to another entry. */
const refs = h => h.replace(/\[([^\]<>]{1,40})\]/g, '<span class="ref">[$1]</span>');

/* ══════════════════ PROGRESS ══════════════════
   A card per term: which box it is in, when it is next due, and the
   highest box it has ever reached. The box moves both ways; `best` only
   goes up, and the codex draws from `best`, so earned progress is never
   taken away by a bad day. Review timing reads `box`.               */
const INTERVAL = [0, 1, 3, 7, 16, 35, 80];   /* days after a right answer in that box */
const CARD0 = { box: 0, best: 0, due: null, seen: null, right: 0, wrong: 0, last: null };
const card = id => Object.assign({}, CARD0, DB.get('card.' + id, {}));
const TIER = ['LOCKED', 'FOUND', 'KNOWN', 'MASTERED'];
function tier(c) { return !c.seen ? 0 : c.best >= 5 ? 3 : c.best >= 3 ? 2 : 1; }
const isDue = c => c.box >= 1 && !!c.due && c.due <= today();

const SET0 = { sound: true, buzz: true, typing: true, newPer: 5, auto: true };
const settings = () => Object.assign({}, SET0, DB.get('set', {}));
const REC0 = { blitz: 0, blitzAt: null, sort: 0, sortAt: null, seals: {} };
const rec = () => Object.assign({}, REC0, DB.get('rec', {}));

/* Grade one answer. `early` is a review of a card that was not due yet
   (a boss fight): a right answer then counts but does not push the
   schedule further out, and a wrong one still sends it back. `lapsed` is
   the second try at a card missed earlier in the same round.          */
function grade(id, ok, opts) {
  opts = opts || {};
  const c = card(id), before = tier(c), now = new Date().toISOString();
  let box = c.box;
  if (ok && opts.early) { /* counted, not moved */ }
  else if (ok && !opts.lapsed) box = Math.min(6, Math.max(1, c.box + 1));
  else box = 1;
  const moved = !(ok && opts.early);
  const next = {
    box, best: Math.max(c.best, box),
    due: moved ? addDays(today(), INTERVAL[box]) : c.due,
    seen: c.seen || now, last: now,
    right: c.right + (ok ? 1 : 0), wrong: c.wrong + (ok ? 0 : 1),
  };
  DB.patch('card.' + id, next);
  touchDay(ok);
  const after = tier(Object.assign({}, c, next));
  return { before, after, box };
}
function discover(id) {
  const c = card(id);
  if (!c.seen) DB.patch('card.' + id, { seen: new Date().toISOString() });
}

/* ── the day and the streak ──
   The streak continues if he played at all, not if he played well. A
   freeze is earned every seventh day, capped at three, and spent without
   a word on a missed day. It is never offered at the moment of failure. */
function touchDay(ok) {
  const k = 'day.' + today(), d = Object.assign({ n: 0, right: 0 }, DB.get(k, {}));
  DB.set(k, { n: d.n + 1, right: d.right + (ok ? 1 : 0) });
  touchStreak();
}
const streak = () => Object.assign({ n: 0, last: null, freeze: 0, best: 0 }, DB.get('streak', {}));
function touchStreak() {
  const s = streak(), t = today();
  if (s.last === t) return;
  const gap = s.last ? daysBetween(s.last, t) : null;
  if (gap != null && gap < 0) return;   /* the clock went backwards: keep what was earned */
  let n, freeze = s.freeze;
  if (gap === 1) n = s.n + 1;
  else if (gap != null && gap > 1 && gap - 1 <= freeze) { freeze -= gap - 1; n = s.n + 1; }
  else n = 1;
  if (n % 7 === 0) freeze = Math.min(3, freeze + 1);
  DB.set('streak', { n, last: t, freeze, best: Math.max(s.best, n) });
}
/* What the streak is worth TODAY, without writing anything. */
function streakNow() {
  const s = streak();
  if (!s.last) return 0;
  const gap = daysBetween(s.last, today());
  if (gap <= 1) return s.n;
  return s.freeze >= gap - 1 ? s.n : 0;
}

/* ── sound: synthesised, short, no files ── */
let AC = null;
function beep(freq, ms, kind, vol, at) {
  if (!settings().sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + (at || 0) / 1000;
    o.type = kind || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol == null ? .06 : vol, t + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t + ms / 1000);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + ms / 1000 + .02);
  } catch (e) { /* no audio here, and that is fine */ }
}
function buzz(p) { if (!settings().buzz) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* none */ } }
/* Small things stay small. Only a finish, a new best and a cleared boss
   run long, and they climb with what was actually done. */
const cue = {
  tap:    () => { beep(880, 24, 'square', .018); buzz(4); },
  right:  () => { beep(740, 50, 'sine', .06); beep(1108, 70, 'sine', .05, 40); buzz(8); },
  wrong:  () => { beep(160, 140, 'sawtooth', .04); buzz([14, 50, 14]); },
  found:  () => { beep(587, 60, 'triangle', .06); beep(880, 60, 'triangle', .06, 55); beep(1175, 80, 'triangle', .05, 110); buzz([6, 30, 10]); },
  rank:   () => { [659, 830, 988].forEach(f => beep(f, 180, 'triangle', .05)); buzz([10, 40, 14]); },
  finish: () => { [523, 659, 784, 1046].forEach((f, i) => beep(f, 240, 'triangle', .06, i * 100)); buzz([10, 40, 10, 40, 22]); },
};

/* ── toast ── */
let toastT = null;
function toast(msg, undo) {
  let n = document.querySelector('.toast');
  if (!n) { n = el('div', 'toast'); n.setAttribute('role', 'status'); document.body.appendChild(n); }
  n.className = 'toast' + (undo ? ' act' : '') + (n.classList.contains('up') ? ' up' : '');
  n.innerHTML = '<span>' + msg + '</span>';
  if (undo) n.appendChild(btn('undo press', 'UNDO', () => { clearTimeout(toastT); n.classList.remove('up'); undo(); }));
  requestAnimationFrame(() => n.classList.add('up'));
  clearTimeout(toastT);
  toastT = setTimeout(() => n.classList.remove('up'), undo ? 6000 : 2600);
}
const say = s => { const l = document.getElementById('live'); if (l) { l.textContent = ''; setTimeout(() => { l.textContent = s; }, 30); } };

/* ══════════════════ HOME ══════════════════ */
let query = '';
let freshIds = new Set();
let drawnDay = '';

function counts() {
  const d = deck(), out = { found: 0, known: 0, mastered: 0, due: 0, fresh: 0, withDef: 0, total: d.terms.length, nextDue: null, nextN: 0 };
  d.terms.forEach(t => {
    const c = card(t.id), ti = tier(c);
    if (t.def) out.withDef++;
    if (ti >= 1) out.found++;
    if (ti >= 2) out.known++;
    if (ti === 3) out.mastered++;
    if (isDue(c)) out.due++;
    else if (c.box >= 1 && c.due) {
      if (!out.nextDue || c.due < out.nextDue) { out.nextDue = c.due; out.nextN = 1; }
      else if (c.due === out.nextDue) out.nextN++;
    }
    if (c.box === 0) out.fresh++;
  });
  return out;
}

function drawHome() {
  const h = document.getElementById('home');
  const top = window.scrollY;
  h.innerHTML = '';
  const d = deck(), n = counts(), s = settings();

  drawnDay = today();
  const r = rec();
  const sortable = d.brackets.filter(b => d.terms.some(t => t.bracket === b.id)).length >= 2;
  const blitzPool = d.terms.filter(t => t.def && tier(card(t.id)) >= 1).length;
  const openNow = sortable && blitzPool >= 4 ? ' SORT and BLITZ are open any time.' : sortable ? ' SORT is open any time.' : '';

  if (!STORE_OK) h.appendChild(el('div', 'banner', '<div><b>This browser is not keeping anything.</b> Storage is off (a private window) or full, so every answer is lost when the page closes.</div>'));

  /* the one primary thing: today's quest */
  const newToday = Math.min(n.fresh, s.newPer);
  const due = Math.min(n.due, 20);
  const card1 = el('section', 'next glow');
  const w = el('div', 'win'), inn = el('div', 'in');
  w.appendChild(inn); card1.appendChild(w);
  if (due + newToday > 0) {
    inn.appendChild(el('div', 'kick', '[SYSTEM] DAILY QUEST'));
    inn.appendChild(el('h1', null, 'QUEST'));
    const bits = [];
    if (due) bits.push(plural(due, 'entry', 'entries') + ' to review');
    if (newToday) bits.push(plural(newToday, 'new entry', 'new entries') + ' to find');
    inn.appendChild(el('p', null, esc(bits.join(' · ')) + '.'));
    inn.appendChild(btn('go press', 'START', startQuest));
  } else {
    inn.appendChild(el('div', 'kick', '[SYSTEM] ALL CLEAR'));
    inn.appendChild(el('h1', null, 'NOTHING DUE'));
    inn.appendChild(el('p', null, (n.nextDue
      ? 'Next review ' + esc(niceDay(n.nextDue)) + ': ' + plural(n.nextN, 'entry', 'entries') + '.'
      : (n.withDef ? 'Every entry is found.' : 'No entry has a definition to learn yet.')) + openNow));
  }
  h.appendChild(card1);

  /* the two games that need no schedule */
  const modes = el('div', 'modes');
  modes.appendChild(modeBtn('SORT', sortable ? '30 s · file each term · best ' + r.sort : 'Needs two brackets with entries', sortable, startSort));
  modes.appendChild(modeBtn('BLITZ', blitzPool >= 4 ? '60 s · name or define · best ' + r.blitz : 'Find ' + (4 - blitzPool) + ' more ' + (4 - blitzPool === 1 ? 'entry' : 'entries') + ' to open', blitzPool >= 4, startBlitz));
  h.appendChild(modes);

  /* the collection, in one bar */
  const tally = el('div', 'tally');
  const pct = x => (n.total ? (x / n.total * 100) : 0) + '%';
  tally.innerHTML = '<div class="bar" role="img" aria-label="' + n.found + ' of ' + n.total + ' found"><i class="m" style="width:' + pct(n.mastered) + '"></i><i class="k" style="width:' + pct(n.known - n.mastered) + '"></i><i class="f" style="width:' + pct(n.found - n.known) + '"></i></div>' +
    '<div class="txt"><span><b>' + n.found + '</b> of ' + n.total + ' found</span><span><b>' + n.known + '</b> known</span><span><b>' + n.mastered + '</b> mastered</span></div>';
  h.appendChild(tally);

  /* the banner that tells the truth about the definitions */
  const drafts = d.terms.filter(t => t.src === 'draft' && t.def).length, withDef = d.terms.filter(t => t.def).length;
  if (drafts) {
    const b = el('div', 'banner');
    b.innerHTML = '<div><b>' + drafts + ' of ' + withDef + (withDef === 1 ? ' definition ' : ' definitions ') + (drafts === 1 ? 'is a draft.' : 'are drafts.') + '</b> The names and brackets are your database. The drafts were written by Claude, because yours live on your Skool pages. Paste them in and yours replace the drafts.</div>';
    const row = el('div', 'row');
    row.appendChild(btn('small press', 'LOAD YOUR DEFINITIONS', openImport));
    b.appendChild(row);
    h.appendChild(b);
  }

  /* search */
  const sr = el('label', 'search');
  sr.innerHTML = ICON.search + '<span class="sr">Search the codex</span>';
  const inp = el('input');
  inp.type = 'search'; inp.placeholder = 'Search ' + plural(d.terms.length, 'entry', 'entries'); inp.value = query;
  inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('spellcheck', 'false');
  inp.oninput = () => { query = inp.value; drawBrackets(list); };
  sr.appendChild(inp);
  h.appendChild(sr);

  const list = el('div');
  list.style.display = 'flex'; list.style.flexDirection = 'column'; list.style.gap = 'var(--s6)';
  h.appendChild(list);
  drawBrackets(list);
  drawStreak();
  window.scrollTo(0, top);
  freshIds = new Set();
}

function modeBtn(name, sub, on, fn) {
  const b = btn('mode press hov' + (on ? '' : ' lock'), '<span class="nm">' + name + '</span><span class="sub">' + esc(sub) + '</span>', on ? fn : () => toast(esc(sub) + '.'));
  return b;
}

function drawBrackets(list) {
  list.innerHTML = '';
  const d = deck(), q = norm(query), r = rec();
  let shown = 0;
  d.brackets.forEach(b => {
    const all = d.terms.filter(t => t.bracket === b.id);
    const hit = !q ? all : all.filter(t => norm(t.term + ' ' + (t.aka || []).join(' ') + ' ' + (tier(card(t.id)) ? t.def : '')).indexOf(q) >= 0);
    if (q && !hit.length) return;
    const sec = el('section', 'brk');
    sec.style.setProperty('--c', b.color);
    const head = el('div', 'brk-h');
    const found = all.filter(t => tier(card(t.id)) >= 1).length;
    head.innerHTML = chip(b.id) + '<span class="cnt">' + found + ' / ' + all.length + '</span>';
    /* the boss: every entry with a definition at KNOWN or better */
    const fightable = all.filter(t => t.def);
    const seal = r.seals && r.seals[b.id];
    if (seal) head.appendChild(el('span', 'seal', 'CLEARED ' + esc(niceDay(seal).toUpperCase())));
    if (fightable.length >= 3) {
      const short = fightable.filter(t => tier(card(t.id)) < 2).length;
      if (!short) head.appendChild(btn('small hot press boss', seal ? 'REMATCH' : 'BOSS', () => startBoss(b.id), (seal ? 'Rematch the ' : 'Fight the ') + b.id + ' boss'));
      else if (!seal) head.appendChild(el('span', 'gate', 'Boss opens at all KNOWN · ' + short + ' to go'));
    }
    head.appendChild(el('div', 'means', esc(b.means) + (b.meansSrc === 'draft' ? ' <span class="draft">DRAFT</span>' : '')));
    sec.appendChild(head);
    if (!all.length) {
      const e = el('div', 'empty', esc(b.empty));
      e.appendChild(btn('small press', ICON.plus + 'ADD THE FIRST ' + esc(b.id.replace(/S$/, '')), () => openEdit(null, b.id)));
      sec.appendChild(e);
    } else {
      const g = el('div', 'grid');
      hit.forEach(t => { g.appendChild(tile(t)); shown++; });
      sec.appendChild(g);
      if (!q) {
        const add = btn('linkish', 'Add an entry to [' + esc(b.id) + ']', () => openEdit(null, b.id));
        add.style.alignSelf = 'flex-start';
        sec.appendChild(add);
      }
    }
    list.appendChild(sec);
  });
  if (q && !shown) list.appendChild(el('div', 'none', 'Nothing in the codex matches "' + esc(query) + '".'));
}

function tile(t) {
  const c = card(t.id), ti = tier(c), b = bkt(t.bracket);
  const cls = 'tile press hov' + (ti === 0 ? ' lock' : '') + (ti === 3 ? ' t3' : '') + (freshIds.has(t.id) ? ' fresh' : '');
  const pips = '<span class="pips">' + [1, 2, 3].map(i => '<i class="' + (ti >= i ? 'on' : '') + '"></i>').join('') + '</span>';
  const b2 = btn(cls, '<span class="nm">' + esc(t.term) + '</span><span class="st">' + pips + TIER[ti] + '</span>' + (isDue(c) ? '<span class="due" title="Review due"></span>' : ''),
    () => openEntry(t.id), t.term + ', ' + TIER[ti].toLowerCase() + (isDue(c) ? ', review due' : ''));
  b2.style.setProperty('--c', b.color);
  return b2;
}

function drawStreak() {
  const n = streakNow(), s = streak(), b = document.getElementById('streak');
  b.className = 'streak press' + (n ? '' : ' off');
  b.innerHTML = '<b>' + n + '</b>' + (n === 1 ? 'day' : 'days');
  b.setAttribute('aria-label', 'Streak ' + n + (n === 1 ? ' day' : ' days'));
  const owed = s.last ? Math.max(0, daysBetween(s.last, today()) - 1) : 0, left = Math.max(0, s.freeze - owed);
  b.onclick = () => toast(n ? 'Streak ' + plural(n, 'day') + '. Best ' + s.best + '. ' + (left ? plural(left, 'freeze', 'freezes') + ' banked.' : owed ? 'No freezes left: answer anything today to keep it.' : 'A freeze is earned every 7th day.') : 'Answer anything today to start a streak.');
}

/* ══════════════════ ENTRY SHEET ══════════════════ */
function openEntry(id) {
  const t = term(id); if (!t) return;
  const c = card(id), ti = tier(c), b = bkt(t.bracket);
  sheet(h => {
    h.style.setProperty('--c', b.color);
    h.appendChild(el('div', null, chip(t.bracket)));
    h.appendChild(el('h3', null, esc(t.term)));
    if (t.aka && t.aka.length) h.appendChild(el('div', 'note', 'Also: ' + esc(t.aka.join(', '))));
    const defBox = el('div');
    const showDef = () => { defBox.innerHTML = t.def ? '<p class="def">' + refs(esc(t.def)) + draftMark(t) + '</p>' : '<p class="note">No definition yet. EDIT to add yours.</p>'; };
    if (ti >= 1 || !t.def) showDef();
    else {
      defBox.appendChild(el('p', 'note', 'Not found yet. It turns up in a QUEST, and finding it there is how it joins the codex.'));
      defBox.appendChild(btn('linkish', 'Show the definition anyway', showDef));
    }
    h.appendChild(defBox);
    const facts = el('div', 'facts');
    const f = (v, k) => facts.appendChild(el('div', 'fact', '<div class="v">' + esc(v) + '</div><div class="k">' + esc(k) + '</div>'));
    f(TIER[ti], 'RANK');
    f(c.right + ' / ' + (c.right + c.wrong), 'RIGHT');
    f(c.box ? (isDue(c) ? 'Due now' : niceDay(c.due)) : '–', 'NEXT REVIEW');
    h.appendChild(facts);
    const row = el('div', 'btns');
    row.appendChild(btn('go ghost press', 'EDIT', () => { h.close(); openEdit(id); }));
    row.appendChild(btn('go press', 'DONE', () => h.close()));
    h.appendChild(row);
  });
}

/* ══════════════════ EDIT AND ADD ══════════════════
   Tom's own words go here. A change is written as its own row holding
   only the fields he touched; RESET hands the entry back to the draft. */
function openEdit(id, bracket) {
  const t = id ? term(id) : null;
  const d = deck();
  let pick = t ? t.bracket : (bracket || d.brackets[0].id);
  sheet(h => {
    h.appendChild(el('h3', null, t ? 'Edit entry' : 'New entry'));
    const fT = field('NAME', 'input', t ? t.term : '');
    const fA = field('ALSO ACCEPT (comma between)', 'input', t ? (t.aka || []).join(', ') : '');
    const fD = field('DEFINITION', 'textarea', t ? t.def : '');
    h.appendChild(fT.wrap);
    const bw = el('div', 'field'); bw.appendChild(el('span', null, 'BRACKET'));
    bw.appendChild(seg(d.brackets.map(b => [b.id, '[' + b.id + ']']), pick, v => { pick = v; }));
    h.appendChild(bw);
    h.appendChild(fD.wrap);
    h.appendChild(fA.wrap);
    if (t && t.src === 'draft') h.appendChild(el('p', 'note', 'The definition above is Claude\'s draft. Whatever you save here is yours and replaces it.'));
    const row = el('div', 'btns');
    row.appendChild(btn('go press', 'SAVE', () => {
      const name = fT.input.value.trim().replace(/\s+/g, ' ');
      if (!name) { toast('Give it a name.'); fT.input.focus(); return; }
      if (name.length > 60) { toast('Keep the name to 60 characters.'); return; }
      const aka = fA.input.value.split(',').map(s => s.trim()).filter(Boolean);
      const def = fD.input.value.trim().replace(/\s+\n/g, '\n');
      const nid = t ? id : slug(name);
      if (!nid) { toast('That name has no letters or numbers in it.'); return; }
      const mine = [name].concat(aka).map(norm).filter(Boolean);
      const clash = deck().terms.find(x => x.id !== (t ? id : '') && (x.id === nid || answers(x).some(a => mine.indexOf(a) >= 0)));
      if (clash) { toast('Already in the database as ' + esc(clash.term) + '.'); return; }
      if (!t) {
        /* a deleted entry brought back keeps the progress it had */
        DB.set('term.' + nid, { term: name, bracket: pick, def, aka, del: false, at: new Date().toISOString(), ord: deck().terms.length });
        if (!DB.ok) { toast('Not saved: this browser is not keeping anything.'); return; }
      } else {
        const ch = { at: new Date().toISOString() };
        if (name !== t.term) ch.term = name;
        if (pick !== t.bracket) ch.bracket = pick;
        if (def !== t.def) ch.def = def;
        if (aka.join('|') !== (t.aka || []).join('|')) ch.aka = aka;
        if (Object.keys(ch).length === 1) { h.close(); return; }
        DB.patch('term.' + nid, ch);
        if (!DB.ok) { toast('Not saved: this browser is not keeping anything.'); return; }
      }
      invalidate(); h.close(); drawHome();
      toast(t ? 'Saved.' : 'Added ' + esc(name) + ' to [' + esc(pick) + '].');
    }));
    h.appendChild(row);
    if (t) {
      const row2 = el('div', 'btns');
      if (t.base && t.changed) row2.appendChild(btn('small press', 'RESET TO DRAFT', () => {
        const was = DB.get('term.' + id, null);
        DB.del('term.' + id);
        if (!DB.ok) { toast('Not saved: this browser is not keeping anything.'); return; }
        invalidate(); h.close(); drawHome();
        toast('Back to the draft.', () => { DB.set('term.' + id, was); invalidate(); drawHome(); });
      }));
      row2.appendChild(btn('small press', 'DELETE', () => {
        const was = DB.get('term.' + id, null);
        DB.patch('term.' + id, { del: true, at: new Date().toISOString() });
        if (!DB.ok) { toast('Not saved: this browser is not keeping anything.'); return; }
        invalidate(); h.close(); drawHome();
        toast(esc(t.term) + ' deleted. Its progress is kept.', () => { if (was) DB.set('term.' + id, was); else DB.del('term.' + id); invalidate(); drawHome(); });
      }));

}
function field(label, kind, value) {
  const wrap = el('label', 'field');
  wrap.appendChild(el('span', null, esc(label)));
  const input = el(kind);
  if (kind === 'input') { input.type = 'text'; input.setAttribute('autocomplete', 'off'); }
  input.value = value || '';

/* ══════════════════ THE ROUND ══════════════════
   One runner for every mode. A round is a queue of items; an item is a
   term and a step. What is asked about a term depends on how well it is
   known: pick the name, then pick the meaning, then name it with a hint,
   then name it cold. Each answer is saved the moment it is given, so
   leaving halfway loses nothing.                                      */
let run = null;

function kindFor(t, c, mode) {
  const typing = settings().typing;
  if (mode === 'sort') return 'sort';
  if (!t.def) return 'classify';
  const rev = () => selfNamed(t) ? 'identify' : 'reverse';
  if (mode === 'blitz') return Math.random() < .5 ? 'identify' : rev();
  if (mode === 'boss') return typing ? 'recall' : 'identify';
  if (c.box <= 1) return 'identify';
  if (c.box === 2) return rev();
  if (c.box === 3) return typing ? 'hint' : rev();
  return typing ? 'recall' : 'identify';
}

/* Wrong answers worth considering: same bracket first, so the choice is
   about meaning and not about family. No two options say the same thing. */
function decoys(t, field, n, hard) {
  const pool = deck().terms.filter(x => x.id !== t.id && (field !== 'def' || x.def));
  const key = x => norm(field === 'def' ? x.def : x.term);
  const same = shuffle(pool.filter(x => x.bracket === t.bracket)), other = shuffle(pool.filter(x => x.bracket !== t.bracket));
  let order;
  if (hard) order = same.concat(other);
  else { order = []; while (same.length || other.length) { if (same.length) order.push(same.shift()); if (other.length) order.push(other.shift()); } }
  const out = [], keys = new Set([key(t)]);
  for (const x of order) { const k = key(x); if (!k || keys.has(k)) continue; keys.add(k); out.push(x); if (out.length >= n) break; }
  return out;
}

function stopRun() { if (run) { clearInterval(run.timer); clearTimeout(run.wait); run.timer = run.wait = null; } }
function openPlay(mode, label) {
  closePlay(true);
  const p = el('div', 'play');
  p.setAttribute('role', 'dialog'); p.setAttribute('aria-modal', 'true'); p.setAttribute('aria-label', label);
  p.innerHTML = '<div class="ptop"></div><div class="pbody"><div class="pwrap"></div></div><div class="pfoot"></div>';
  const top = p.querySelector('.ptop');
  top.appendChild(btn('hbtn press hov', ICON.close, () => leave(), 'Leave'));
  top.appendChild(el('div', 'prog' + (mode === 'blitz' || mode === 'sort' ? ' time' : ''), '<i></i>'));
  top.appendChild(el('div', 'ptag'));
  document.body.appendChild(p);
  document.body.style.overflow = 'hidden';
  p.tabIndex = -1;
  syncInert();
  p.focus({ preventScroll: true });
  guardOpen();
  return p;
}
function closePlay(silent) {
  const p = document.querySelector('.play');
  if (run && run.timer) clearInterval(run.timer);
  if (run && run.wait) clearTimeout(run.wait);
  if (p) p.remove();
  document.body.style.overflow = '';
  syncInert();
  if (!silent) { run = null; guardClose(); drawHome(); }
}
const LABEL = { quest: 'quest', boss: 'boss fight', blitz: 'blitz', sort: 'sort' };
function leave() {
  if (!run) { closePlay(); return; }
  const r = run;
  closePlay();
  if (r.done) return;
  if (r.mode === 'quest' || r.mode === 'boss') {
    const n = r.asked.size;
    if (n) toast('Left the ' + LABEL[r.mode] + '. ' + (DB.ok ? plural(n, 'answer') + ' saved.' : 'Nothing was saved: this browser is not keeping anything.'));
  } else if (r.started) toast('Left the ' + LABEL[r.mode] + '. A score only counts when the clock runs out.');
}

const $ = s => document.querySelector('.play ' + s);
function setProg(frac, tag) {
  const i = $('.prog i'); if (i) i.style.width = Math.max(0, Math.min(1, frac)) * 100 + '%';
  const g = $('.ptag'); if (g) g.textContent = tag;
}

/* ── QUEST ── */
function startQuest() {
  const d = deck(), s = settings();
  const due = d.terms.filter(t => isDue(card(t.id)))
    .sort((a, b) => { const ca = card(a.id), cb = card(b.id); return ca.due < cb.due ? -1 : ca.due > cb.due ? 1 : ca.box - cb.box; })
    .slice(0, 20);
  const fresh = d.terms.filter(t => card(t.id).box === 0).slice(0, s.newPer);
  if (!due.length && !fresh.length) { toast('Nothing due right now.'); return; }
  stopRun();
  /* spread the new ones through the reviews so the round is not front-loaded */
  const q = due.map(t => ({ id: t.id, step: 'ask', tries: 0 }));
  const D = due.length;
  fresh.forEach((t, i) => {
    const at = Math.min(q.length, Math.round((i + 1) * D / (fresh.length + 1)) + i);
    q.splice(at, 0, { id: t.id, step: card(t.id).seen ? 'ask' : 'discover', tries: 0, fresh: true });
  });
  run = { mode: 'quest', queue: q, total: due.length + fresh.length, asked: new Set(), firstRight: 0, answered: 0,
    found: [], ranks: [], missed: [], done: false };
  openPlay('quest', 'Quest');
  nextQ();
}

/* ── BOSS ── */
function startBoss(id) {
  const all = deck().terms.filter(t => t.bracket === id && t.def);
  if (all.length < 3) return;
  stopRun();
  run = { mode: 'boss', bracket: id, queue: shuffle(all).map(t => ({ id: t.id, step: 'ask', tries: 0 })), total: all.length,
    asked: new Set(), firstRight: 0, answered: 0, found: [], ranks: [], missed: [], done: false, need: Math.ceil(all.length * .9) };
  openPlay('boss', 'Boss: ' + id);
  nextQ();
}

/* ── BLITZ and SORT: against the clock, nothing scheduled ── */
function startBlitz() {
  const pool = deck().terms.filter(t => t.def && tier(card(t.id)) >= 1);
  if (pool.length < 4) return;
  timed('blitz', pool, 60);
}
function startSort() {
  const d = deck();
  const pool = d.terms.slice();
  if (d.brackets.filter(b => d.terms.some(t => t.bracket === b.id)).length < 2) return;
  timed('sort', pool, 30);
}
function timed(mode, pool, secs) {
  stopRun();
  run = { mode, pool, bag: [], secs, end: 0, right: 0, wrong: 0, answered: 0, missed: [], done: false, started: false, last: null };
  openPlay(mode, mode.toUpperCase());
  /* a READY screen first, so the clock starts on a press and not on a
     page that is still sliding in */
  const w = $('.pwrap'); w.innerHTML = '';
  const g = el('div', 'q glow'), win = el('div', 'win'), inn = el('div', 'in');
  win.appendChild(inn); g.appendChild(win);
  const r = rec();
  inn.appendChild(el('div', 'kick', mode === 'blitz' ? '[SYSTEM] TIME TRIAL' : '[SYSTEM] SORTING TRIAL'));
  inn.appendChild(el('div', 'big xl', mode.toUpperCase()));
  inn.appendChild(el('p', 'def', mode === 'blitz'
    ? 'Sixty seconds. Pick the name for a definition, or the definition for a name. Only entries you have found are asked.'
    : 'Thirty seconds. Each name belongs to one bracket. File as many as you can. The near twins are the point: Stress and Stressed are not in the same place.'));
  inn.appendChild(el('p', 'note', 'Best: ' + (mode === 'blitz' ? r.blitz : r.sort) + '. It does not change any schedule.'));
  w.appendChild(g);
  setProg(1, secs + ' s');
  foot([['START', () => go(), 'go press']]);
  function go() {
    run.started = true; run.end = Date.now() + secs * 1000;
    run.timer = setInterval(tickClock, 250);
    tickClock(); nextQ();
  }
}
function tickClock() {
  if (!run || !run.started || run.done) return;
  const left = Math.max(0, run.end - Date.now());
  setProg(left / (run.secs * 1000), Math.ceil(left / 1000) + ' s');
  if (left <= 0) { clearInterval(run.timer); finishTimed(); }
}
function drawTimed() {
  /* a bag that empties before it refills, so nothing repeats until
     everything has had a turn */
  if (!run.bag.length) { run.bag = shuffle(run.pool); if (run.bag.length > 1 && run.bag[0] === run.last) run.bag.push(run.bag.shift()); }
  const t = run.bag.shift(); run.last = t;
  return { id: t.id, step: 'ask', tries: 0 };
}

/* ── one question ── */
function nextQ() {
  if (!run) return;
  if (run.wait) { clearTimeout(run.wait); run.wait = null; }
  let item;
  if (run.mode === 'blitz' || run.mode === 'sort') { if (!run.started || run.done) return; if (Date.now() >= run.end) { finishTimed(); return; } item = drawTimed(); }
  else {
    if (!run.queue.length) { finishRound(); return; }
    item = run.queue.shift();
    const adv = item.step === 'ask' && !run.asked.has(item.id) ? 1 : 0;
    setProg(run.asked.size / run.total, Math.min(run.total, run.asked.size + adv) + ' / ' + run.total);
  }
  const t = term(item.id);
  if (!t) { nextQ(); return; }
  run.item = item; run.t = t; run.locked = false;
  run.choices = null; run.kind = null; run.input = null;
  if (item.step === 'discover') { drawDiscover(t); return; }
  const c = card(t.id);
  let kind = kindFor(t, c, run.mode);
  run.kind = kind;
  drawQ(t, kind);
}

function windowFor(t, kick) {
  const b = bkt(t.bracket);
  const g = el('div', 'q glow open'), win = el('div', 'win'), inn = el('div', 'in');
  g.style.setProperty('--c', b.color);
  win.appendChild(inn); g.appendChild(win);
  const top = el('div', 'top');
  top.appendChild(el('span', 'kick', kick));
  g._top = top; g._in = inn;
  inn.appendChild(top);
  return g;
}

function drawDiscover(t) {
  const w = $('.pwrap'); w.innerHTML = '';
  const g = windowFor(t, '[SYSTEM] NEW ENTRY');
  g._top.insertAdjacentHTML('beforeend', chip(t.bracket));
  const name = el('div', 'big xl'); g._in.appendChild(name);
  decode(name, t.term);
  if (t.aka && t.aka.length) g._in.appendChild(el('div', 'note', 'Also: ' + esc(t.aka.join(', '))));
  g._in.appendChild(t.def ? el('p', 'def', refs(esc(t.def)) + draftMark(t)) : el('p', 'note', 'No definition yet. Add yours with EDIT on its codex entry. For now it is asked by bracket.'));
  w.appendChild(g);
  discover(t.id);
  freshIds.add(t.id);
  run.found.push(t.id);
  cue.found();
  say('New entry: ' + t.term + ', in ' + t.bracket + '. ' + (t.def || ''));
  foot([['GOT IT', () => {
    /* it comes back as a question two or three turns later, not at once */
    run.queue.splice(Math.min(run.queue.length, 2), 0, { id: t.id, step: 'ask', tries: 0, fresh: true });
    nextQ();
  }, 'go press']]);
}
/* The name decodes out of noise. It is the one flourish, it is short,
   and with reduced motion it simply appears. */
function decode(node, text) {
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  node.textContent = text;
  if (reduce) return;
  const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%';
  const t0 = performance.now(), dur = 420;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), n = Math.floor(text.length * k);
    node.textContent = text.slice(0, n) + text.slice(n).replace(/[^\s]/g, () => glyphs[Math.floor(Math.random() * glyphs.length)]);
    if (k < 1 && node.isConnected) requestAnimationFrame(step); else node.textContent = text;
  };
  requestAnimationFrame(step);
}

const KICK = { identify: 'WHICH ENTRY IS THIS?', reverse: 'WHAT DOES IT MEAN?', hint: 'NAME THIS ENTRY', recall: 'NAME THIS ENTRY', classify: 'WHICH BRACKET?', sort: 'FILE IT' };
function drawQ(t, kind) {
  const w = $('.pwrap'); w.innerHTML = '';
  const g = windowFor(t, (run.mode === 'boss' ? '[BOSS] ' : '') + KICK[kind]);
  const showChip = kind !== 'classify' && kind !== 'sort';
  if (showChip) g._top.insertAdjacentHTML('beforeend', chip(t.bracket));
  if (kind === 'sort' || kind === 'classify') g.style.setProperty('--c', 'var(--acc)');
  const inn = g._in;
  w.appendChild(g);
  run.choices = null;

  if (kind === 'identify' || kind === 'hint' || kind === 'recall') inn.appendChild(el('p', 'def', masked(t)));
  if (kind === 'reverse' || kind === 'sort' || kind === 'classify') inn.appendChild(el('div', 'big' + (kind === 'sort' ? ' xl' : ''), esc(t.term)));

  if (kind === 'identify' || kind === 'reverse') {
    const hard = run.mode === 'boss' || card(t.id).box >= 4;
    const field = kind === 'identify' ? 'term' : 'def';
    const opts = shuffle([t].concat(decoys(t, field, 3, hard)));
    if (opts.length < 2) { drawFlash(t, inn, kind); return; }
    const box = el('div', 'opts' + (kind === 'identify' ? ' two' : ''));
    run.choices = opts.map((o, i) => {
      const label = kind === 'identify' ? esc(o.term) : refs(esc(o.def));
      const b = btn('opt press hov ' + (kind === 'identify' ? 'term' : 'defn'), '<span class="k">' + (i + 1) + '</span><span class="v">' + label + '</span>', () => choose(i));
      b._ok = o.id === t.id; b._o = o;
      box.appendChild(b);
      return b;
    });
    w.appendChild(box);
    foot([['I DON\'T KNOW', () => choose(-1), 'go ghost press']]);
  } else if (kind === 'sort' || kind === 'classify') {
    const box = el('div', 'sorts');
    run.choices = deck().brackets.map((b, i) => {
      const x = btn('opt press hov', '<span class="k">' + (i + 1) + '</span><span class="v">[' + esc(b.id) + ']</span>', () => choose(i));
      x.style.setProperty('--c', b.color);
      x._ok = b.id === t.bracket; x._b = b;
      box.appendChild(x);
      return x;
    });
    w.appendChild(box);
    if (run.mode !== 'sort') foot([['I DON\'T KNOW', () => choose(-1), 'go ghost press']]);
    else foot([]);
  } else {
    if (kind === 'hint') {
      const ans = t.term;
      inn.appendChild(el('div', 'hint', esc(ans.replace(/[A-Za-z0-9]/g, (ch, i) => i === 0 || /\s/.test(ans[i - 1] || ' ') ? ch : '_'))));
    }
    const row = el('form', 'type');
    row.setAttribute('autocomplete', 'off');
    const inp = el('input');
    inp.type = 'text'; inp.placeholder = 'Type the name';
    ['autocomplete', 'autocorrect', 'autocapitalize'].forEach(a => inp.setAttribute(a, 'off'));
    inp.setAttribute('spellcheck', 'false'); inp.setAttribute('enterkeyhint', 'done'); inp.setAttribute('aria-label', 'Your answer');
    row.appendChild(inp);
    const go = btn('go press', 'CHECK'); go.type = 'submit';
    row.appendChild(go);
    row.onsubmit = e => { e.preventDefault(); if (!run.locked) typed(inp.value); };
    w.appendChild(row);
    run.input = inp;
    foot([['I DON\'T KNOW', () => typed(null), 'go ghost press']]);
    inp.focus({ preventScroll: true });
  }
  const dq = inn.querySelector('.def');
  say((run.lastSay ? run.lastSay + ' ' : '') + (kind === 'sort' || kind === 'classify' || kind === 'reverse' ? t.term : (KICK[kind] + ' ' + (dq ? dq.textContent : ''))));
  run.lastSay = '';
}

/* Fewer than two options possible (a one-entry database): a plain flash
   card, graded by him. */
function drawFlash(t, inn, kind) {
  const d = el('p', 'def', '');
  inn.appendChild(d);
  foot([['SHOW IT', () => {
    d.innerHTML = kind === 'reverse' ? refs(esc(t.def)) + draftMark(t) : '<b>' + esc(t.term) + '</b>';
    foot([['NOT YET', () => settle(false, null), 'go ghost press'], ['KNEW IT', () => settle(true, null), 'go press']]);
  }, 'go press']]);
}

function choose(i) {
  if (!run || run.locked || !run.choices || (run.item && run.item.step === 'discover')) return;
  const ok = i >= 0 && !!run.choices[i]._ok;
  run.choices.forEach((b, j) => {
    b.disabled = true;
    if (b._ok) b.classList.add('ok');
    else if (j === i) b.classList.add('no');
    else b.classList.add('dim');
  });
  settle(ok, null);
}

function typed(value) {
  if (!run || run.locked) return;
  const t = run.t;
  let ok = false, spelled = null;
  if (value != null) {
    const v = norm(value);
    if (!v) { toast('Type the name, or press I DON\'T KNOW.'); return; }
    const acc = answers(t);
    if (acc.indexOf(v) >= 0) ok = true;
    else {
      /* The slack belongs to the answer it is measured against: none for
         four letters or fewer, where one letter is the whole difference,
         one up to eight, two beyond. And a typo is only forgiven when it is
         nearer this entry than any other, so "Stresse" is neither twin. */
      const tol = a => { const n = a.replace(/ /g, '').length; return n <= 4 ? 0 : n <= 8 ? 1 : 2; };
      const hit = acc.map(a => ({ a, d: dist(v, a) })).filter(x => x.d <= tol(x.a)).sort((x, y) => x.d - y.d)[0];
      if (hit) {
        let rival = 99;
        deck().terms.forEach(x => { if (x.id !== t.id) answers(x).forEach(b => { const dd = dist(v, b); if (dd < rival) rival = dd; }); });
        if (rival > hit.d) { ok = true; spelled = namesOf(t).find(x => norm(x) === hit.a) || t.term; }
        else if (rival === hit.d) { toast('That is as close to another entry. Check the spelling.'); return; }
      }
    }
  }
  if (run.input) { run.input.classList.add(ok ? 'ok' : 'no'); run.input.readOnly = true; run.input.blur(); }
  settle(ok, spelled);
}

/* An answer is in. Save it, say so, and move on. */
function settle(ok, closeSpelling) {
  run.locked = true;
  const t = run.t, item = run.item, mode = run.mode;
  run.answered++;
  let res = null;
  if (mode === 'blitz' || mode === 'sort') {
    if (ok) run.right++; else { run.wrong++; run.missed.push(t.id); }
    touchDay(ok);
  } else {
    const first = item.tries === 0;
    if (first) {
      run.asked.add(t.id);
      res = grade(t.id, ok, { early: mode === 'boss' && !isDue(card(t.id)), lapsed: false });
      if (ok) run.firstRight++;
      else run.missed.push(t.id);
      if (res.after > res.before && res.after >= 2) run.ranks.push({ id: t.id, to: res.after });
    }
    if (!ok && mode === 'quest' && item.tries < 2) {
      run.queue.splice(Math.min(run.queue.length, 3), 0, { id: t.id, step: 'ask', tries: item.tries + 1 });
    }
  }
  if (ok) cue.right(); else cue.wrong();
  const rank = res && res.after > res.before && res.after >= 2;
  if (rank) setTimeout(cue.rank, 90);

  /* the verdict */
  const w = $('.pwrap');
  if (mode !== 'blitz' && mode !== 'sort') {
    const fb = el('div', 'fb ' + (ok ? 'ok' : 'no'));
    fb.setAttribute('role', 'status');
    let html = '<div class="h">' + (ok ? (closeSpelling ? 'ACCEPTED' : 'RIGHT') : 'NOT QUITE') + '</div>';
    if (closeSpelling) html += '<div class="t">It is spelled <b>' + esc(closeSpelling) + '</b>' + (norm(closeSpelling) !== norm(t.term) ? ' (' + esc(t.term) + ')' : '') + '.</div>';
    if (!ok) {
      if (run.kind === 'classify') html += '<div class="t"><b>' + esc(t.term) + '</b> is in ' + chip(t.bracket) + '</div>';
      else html += '<div class="t"><b>' + esc(t.term) + '</b>: ' + refs(esc(t.def)) + '</div>';
      if (mode === 'quest' && item.tries < 2) html += '<div class="t" style="color:var(--t3)">It comes back in this round.</div>';
    }
    if (rank) html += '<div class="rankup">[' + esc(t.term.toUpperCase()) + '] IS NOW ' + TIER[res.after] + '</div>';
    fb.innerHTML = html;
    w.appendChild(fb);
    fb.scrollIntoView({ block: 'nearest' });
    say((ok ? 'Right. ' : 'Not quite. It was ' + t.term + '. ') + (rank ? t.term + ' is now ' + TIER[res.after] + '.' : ''));
    const s = settings();
    const auto = ok && s.auto && !closeSpelling && !rank && !nextNeedsKeyboard();
    foot([[run.queue.length ? 'NEXT' : 'FINISH', () => nextQ(), 'go press']]);
    if (auto) run.wait = setTimeout(nextQ, 750);
    else focusFoot();
  } else {
    if (!ok && run.mode === 'sort') {
      const fb = el('div', 'fb no');
      fb.innerHTML = '<div class="t"><b>' + esc(t.term) + '</b> is in ' + chip(t.bracket) + '</div>';
      w.appendChild(fb);
      fb.scrollIntoView({ block: 'nearest' });
    }
    run.lastSay = ok ? 'Right.' : (run.mode === 'sort' ? t.term + ' is in ' + t.bracket + '.' : 'No. It was ' + t.term + '.');
    run.wait = setTimeout(nextQ, ok ? 260 : 950);
  }
}
/* iPhone only raises the keyboard for a focus that happens inside a tap,
   so a question that wants typing is never reached by a timer. */
function nextNeedsKeyboard() {
  if (!run || !run.queue || !run.queue.length || !settings().typing) return false;
  const it = run.queue[0];
  if (it.step === 'discover') return false;
  const t = term(it.id); if (!t) return false;
  const k = kindFor(t, card(t.id), run.mode);
  return k === 'hint' || k === 'recall';
}
function focusFoot() { const all = document.querySelectorAll('.play .pfoot .go:not(.ghost)'), b = all[all.length - 1]; if (b) b.focus({ preventScroll: true }); }

function foot(list) {
  const f = document.querySelector('.play .pfoot'); if (!f) return;
  f.innerHTML = '';
  if (!list.length) return;
  const inner = el('div', 'inner'), born = performance.now();
  list.forEach(([label, fn, cls]) => inner.appendChild(btn(cls, label, () => { if (performance.now() - born < 350) return; fn(); })));
  f.appendChild(inner);
}

/* ── the end of a round ── */
function finishRound() {
  run.done = true; run.locked = true; run.choices = null;
  const mode = run.mode, w = $('.pwrap');
  setProg(1, run.total + ' / ' + run.total);
  w.innerHTML = '';
  const g = el('div', 'res glow open'), win = el('div', 'win'), inn = el('div', 'in');
  win.appendChild(inn); g.appendChild(win);
  let cleared = false;
  if (mode === 'boss') {
    cleared = run.firstRight >= run.need;

/* ══════════════════ LOAD: Tom's definitions, pasted ══════════════════

     [SKILLS]                          a bracket heading, then under it
     Food Weighing, Calorie Counting   names with commas (his own list)
     Food Weighing: definition         or one name and its meaning a line
     **Food Weighing** - definition    bold, a dash, an en or em dash
     Food Weighing [SKILLS]: def       a bracket on the line itself
     Food Weighing | [SKILLS] | def    pipes
     | Term | Bracket | Definition |   a markdown table, with a header
     [Palatability]                    a Skool page title, then its body
     How rewarding a food tastes...    on the lines under it

function parseDeck(raw) {

/* JSON: an array of entries, {terms: [...]}, {brackets: ...}, a map of

  if (!j || typeof j !== 'object') return;

    const bs = Array.isArray(j.brackets) ? j.brackets : Object.keys(j.brackets).map(k => {
      const v = j.brackets[k];
      return typeof v === 'string' ? { id: k, means: v } : Array.isArray(v) ? { id: k, terms: v } : Object.assign({ id: k }, v);

/* Text, line by line. The hard part is telling a name from a sentence,

    if (ns) { ns.forEach(n => push(n, '', lineBr)); last = null; prevList = true; return; }

    /* a name alone, written like a name, under a bracket */
    const bare = termLike(s) && words(s) <= 6 && !/[.!?]$/.test(s) && (titleCase(s) || isTermName(s)) && (sec || lineBr || marked);
    if (last && !(bare && (lineBr || isTermName(s) || !last.def || bulleted))) { appendTo(last, s, bulleted); return; }

/* Split a line into a name and its meaning at the first separator, if the

function splitTD(s) {
  const bold = s.match(/^\*\*(.+?)\*\*\s*(?:[:\-–—=|]\s*)?(.*)$/);

/* One item per name. Said twice, the first definition stays and the

    const x = { id, term, def: cleanDef(it.def), bracket: bracketId(it.bracket), aka: (it.aka || []).map(a => String(a).trim()).filter(Boolean) };
    if (seenAt[id] != null) {
      const y = items[seenAt[id]];
      if (x.def && y.def && x.def !== y.def) out.dupes.push(term);
      if (x.def && !y.def) y.def = x.def;
      if (x.bracket && !y.bracket) y.bracket = x.bracket;
      x.aka.forEach(a => { if (y.aka.indexOf(a) < 0) y.aka.push(a); });

/* Which entry a pasted name is. By its id first; then by a part of it
   ("Personal Record (PR)", "Height (cm)", "A / B"); then by an alias, but
   only one Tom gave himself or one close to the entry's own name, so a
   draft alias never pulls a different page onto an entry. */
function matchEntry(name) {
  const d = deck(), id = slug(name);
  if (d.byId[id]) return { t: d.byId[id], via: false };

  const parts = [name].concat(m ? [m[1], m[2]] : [], name.indexOf('/') >= 0 ? name.split(/\s*\/\s*/) : []).map(norm).filter(Boolean);
  let t = d.terms.find(x => parts.indexOf(norm(x.term)) >= 0);
  if (t) return { t, via: true };
  t = d.terms.find(x => {
    const own = ((DB.get('term.' + x.id, {}) || {}).aka || []).map(norm);
    return answers(x).some(a => parts.indexOf(a) >= 0 && (own.indexOf(a) >= 0 || dist(a, norm(x.term)) <= 3));
  });
  return t ? { t, via: true } : null;
}
/* What a parsed paste would change, before anything is written. */
function plan(parsed) {
  const d = deck(), now = new Date().toISOString();
  const res = { add: [], update: [], back: [], same: 0, rows: {}, means: {}, dupes: (parsed.dupes || []).slice(), via: [] };
  const done = new Set();
  parsed.items.forEach(it => {
    const hit = matchEntry(it.term);
    if (!hit) {
      if (res.rows[it.id]) return;
      const row0 = DB.get('term.' + it.id, null), base = TERMS0.some(b => slug(b.t) === it.id);
      if (row0 && row0.del) {
        /* a deleted entry brought back: only what was pasted changes, so a
           built-in keeps its own bracket, draft and aliases */
        const r = Object.assign({}, row0, { del: false, at: now });
        if (it.def) r.def = it.def;
        if (it.bracket) r.bracket = it.bracket;
        if (it.aka.length) r.aka = it.aka;
        if (!base) { r.term = r.term || it.term; r.bracket = r.bracket || 'UNSORTED'; }
        const b0 = TERMS0.find(b => slug(b.t) === it.id);
        res.back.push({ term: it.term, def: it.def, bracket: r.bracket || (b0 && b0.b) || 'UNSORTED' });
        res.rows[it.id] = r;
        return;
      }
      res.add.push(it);
      res.rows[it.id] = { term: it.term, bracket: it.bracket || 'UNSORTED', def: it.def, aka: it.aka, del: false, at: now, ord: d.terms.length + res.add.length };
      return;
    }
    const t = hit.t, ch = {};
    if (it.def && it.def !== t.def) ch.def = it.def;
    if (it.bracket && it.bracket !== t.bracket) ch.bracket = it.bracket;
    if (it.aka.length) { const merged = (t.aka || []).slice(); it.aka.forEach(a => { if (merged.indexOf(a) < 0) merged.push(a); }); if (merged.length !== (t.aka || []).length) ch.aka = merged; }
    if (done.has(t.id)) {
      /* the same entry twice in one paste: the first definition stays */
      res.dupes.push(it.term + (norm(it.term) !== norm(t.term) ? ' (' + t.term + ')' : ''));
      const u = res.update.find(x => x.t.id === t.id);
      if (u) {
        if (!u.ch.bracket && ch.bracket) u.ch.bracket = ch.bracket;
        if (ch.aka) u.ch.aka = ch.aka;
        res.rows[t.id] = Object.assign({}, DB.get('term.' + t.id, {}), u.ch, { at: now });
      }
      return;
    }
    done.add(t.id);
    if (hit.via) res.via.push(it.term + ' → ' + t.term);
    if (!Object.keys(ch).length) { res.same++; return; }
    res.update.push({ t, ch, via: hit.via ? it.term : '' });
    res.rows[t.id] = Object.assign({}, DB.get('term.' + t.id, {}), ch, { at: now });
  });
  Object.keys(parsed.means || {}).forEach(b => { if (parsed.means[b] && parsed.means[b] !== bkt(b).means) res.means[b] = parsed.means[b]; });
  return res;
}

/* ══════════════════ SHEET ══════════════════
   One component, two shapes: up from the bottom on a phone, centred on a
   desktop. Back closes it. */
const stack = [];
/* Only the top layer can be reached: the page under a round, a round or
   page under a sheet, a sheet under another sheet. */
function syncInert() {
  const main = document.querySelector('main'), header = document.querySelector('header'), play = document.querySelector('.play');
  const sheets = Array.from(document.querySelectorAll('.sheet-bg:not([data-gone])'));
  const cover = sheets.length > 0 || !!play;
  main.inert = cover; header.inert = cover;
  if (play) play.inert = sheets.length > 0;
  sheets.forEach((b, i) => { b.inert = i < sheets.length - 1; });
}
let sheetN = 0;
function sheet(fill, opts) {
  opts = opts || {};
  const bg = el('div', 'sheet-bg');
  const s = el('div', 'sheet');
  s.setAttribute('role', 'dialog'); s.setAttribute('aria-modal', 'true');
  s.appendChild(el('div', 'grab'));
  bg.appendChild(s);
  document.body.appendChild(bg);
  const opener = document.activeElement;
  let closed = false;
  function close() {
    if (closed) return; closed = true;
    bg.dataset.gone = '1';
    bg.classList.remove('up');
    setTimeout(() => bg.remove(), 360);
    const at = stack.indexOf(close);
    if (at >= 0) stack.splice(at, 1);
    syncInert();
    if (opener && opener.isConnected && !opener.closest('[inert]')) opener.focus({ preventScroll: true });
    guardClose();
    if (opts.onClose) opts.onClose();
  }
  s.close = close;
  stack.push(close);
  fill(s);
  const h3 = s.querySelector('h3');
  if (h3) { h3.id = 'sheet-h-' + (++sheetN); s.setAttribute('aria-labelledby', h3.id); }
  s.tabIndex = -1;
  syncInert();
  if (!s.contains(document.activeElement)) s.focus({ preventScroll: true });
  requestAnimationFrame(() => bg.classList.add('up'));
  guardOpen();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  return s;
}

/* ── the back gesture ──
   Back closes what is open. Only when nothing is open does it leave the
   app. One history entry covers everything, however deep, and the wait in
   guardClose is what lets "close this, open that" happen in one tick
   without the entry being dropped between them.                       */
let depth = 0, popping = 0;
const anythingOpen = () => !!document.querySelector('.sheet-bg:not([data-gone])') || !!document.querySelector('.play');
function guardOpen() { if (depth === 0) { depth = 1; history.pushState({ cx: 1 }, ''); } }
let closeQ = false;
function guardClose() {
  if (closeQ) return;
  closeQ = true;
  setTimeout(() => { closeQ = false; if (depth === 1 && !anythingOpen()) { depth = 0; popping++; history.back(); } }, 0);
}
addEventListener('popstate', () => {
  if (popping > 0) { popping--; depth = 0; return; }
  depth = 0;
  const top = stack[stack.length - 1];
  if (top) { top(); if (anythingOpen()) guardOpen(); return; }
  if (document.querySelector('.play')) leave();
});

/* ── keys, for the desk ── */
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const top = stack[stack.length - 1];
    if (top) { top(); e.preventDefault(); return; }
    if (document.querySelector('.play')) { leave(); e.preventDefault(); }
    return;
  }
  if (!run || !document.querySelector('.play') || stack.length) return;
  const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName) && !document.activeElement.readOnly;
  if (!typing && /^[1-9]$/.test(e.key) && run.choices && !run.locked) {
    const i = +e.key - 1;
    if (run.choices[i]) { choose(i); e.preventDefault(); }
    return;
  }
  if (e.key === 'Enter' && !typing) {
    const all = document.querySelectorAll('.play .pfoot .go:not(.ghost)'), b = all[all.length - 1];
    if (b && document.activeElement !== b) { b.click(); e.preventDefault(); }
  }
});

      const n = mergeRows(j.rows);
      invalidate(); drawHome();
      if (mergeRows.failed) toast('Storage is full: ' + plural(mergeRows.failed, 'row') + ' could not be merged in.');
      else toast(n ? 'Restored: ' + plural(n, 'row') + ' merged in.' : 'Nothing new in that backup.');
    };
    rd.readAsText(fl);
  };
  f.click();
}
/* Newer wins, per row, and nothing earned is lost: a card keeps the
   higher `best`, a day keeps the bigger count, a record keeps the better
   score and every seal. */
function mergeRows(rows) {
  let n = 0, failed = 0;
  Object.keys(rows).forEach(k => {
    const v = rows[k], mine = DB.get(k, null);
    if (v == null) return;
    let out = null;
    if (k.indexOf('card.') === 0) {
      if (!mine) out = v;
      else { out = (v.last || '') > (mine.last || '') ? Object.assign({}, mine, v) : Object.assign({}, v, mine); out.best = Math.max(v.best || 0, mine.best || 0); out.seen = mine.seen && v.seen ? (mine.seen < v.seen ? mine.seen : v.seen) : (mine.seen || v.seen); }
    } else if (k.indexOf('day.') === 0) {
      out = !mine ? v : (v.n > mine.n ? v : mine);
    } else if (k === 'rec') {
      const m = Object.assign({}, REC0, mine || {});
      out = Object.assign({}, m);
      if ((v.blitz || 0) > m.blitz) { out.blitz = v.blitz; out.blitzAt = v.blitzAt; }
      if ((v.sort || 0) > m.sort) { out.sort = v.sort; out.sortAt = v.sortAt; }
      out.seals = Object.assign({}, v.seals || {}, m.seals || {});
      Object.keys(v.seals || {}).forEach(b => { if (m.seals && m.seals[b] && v.seals[b] < m.seals[b]) out.seals[b] = v.seals[b]; });
    } else if (k === 'streak') {
      out = !mine ? v : ((v.last || '') > (mine.last || '') ? Object.assign({}, v, { best: Math.max(v.best || 0, mine.best || 0) }) : Object.assign({}, mine, { best: Math.max(v.best || 0, mine.best || 0) }));
    } else if (k.indexOf('term.') === 0 || k.indexOf('bkt.') === 0) {
      if (!mine) out = v;
      else if ((v.at || '') > (mine.at || '')) { out = Object.assign({}, mine, v); if (!('del' in v)) out.del = false; }
      else out = mine;
    } else if (k === 'set') {
      out = mine || v;
    } else return;
    const full = (x) => x && k === 'rec' ? Object.assign({}, REC0, x) : x && k.indexOf('card.') === 0 ? Object.assign({}, CARD0, x) : x;
    if (JSON.stringify(full(out)) !== JSON.stringify(full(mine))) { if (DB.set(k, out)) n++; else failed++; }
  });
  mergeRows.failed = failed;
  return n;
}

/* ══════════════════ START ══════════════════ */
if (history.state && history.state.cx) { popping++; history.back(); }
drawHome();
/* logic-5: a page left open past midnight redraws when the day turns,
   unless something is open or the search box is being typed in */
const dayCheck = () => {
  if (today() !== drawnDay && !document.querySelector('.play') && !stack.length && !(document.activeElement && document.activeElement.type === 'search')) drawHome();
};
setInterval(dayCheck, 60000);
addEventListener('focus', dayCheck);
addEventListener('pageshow', e => { if (e.persisted) { invalidate(); drawHome(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('.play')) drawHome(); });
</script>
