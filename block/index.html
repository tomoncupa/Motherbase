    if (!blocks.length) return;
    list.appendChild(el('div', 'cat', esc(cat)));
    blocks.forEach(b => {
      const c = el('div', 'chip');
      c.style.setProperty('--c', b.color);
      c.innerHTML = '<span class="nm">' + esc(b.name) + '</span><span class="eg">' + EGLYPH[b.energy || 2] + '</span><span class="mn">' + dur2s(b.dur) + '</span>';
      c.dataset.tip = '<b>' + esc(b.name) + '</b> — ' + dur2s(b.dur) + ', ' + ENAME[b.energy || 2] + ' effort<br>click to drop it into <b>' + esc((focusLaneObj() || {}).name || '') + '</b>';
      const d = el('button', 'del', '✕');
      d.onclick = e => { e.stopPropagation(); snap(); S.lib = S.lib.filter(x => x.id !== b.id); render(); };
      c.appendChild(d);
      const drop = () => { const l = focusLaneObj(); if (l) { addItem(l.id, b); toast('<b>' + esc(b.name) + '</b> → ' + esc(l.name) + ' · Ctrl+Z to undo'); } };
      c.addEventListener('pointerdown', e => { if (e.target === d || e.button === 2) return; startDrag(e, { kind: 'lib', src: b, node: c, onTap: drop }); });
      c.addEventListener('contextmenu', ev => {
        ev.preventDefault();
        openMenu(ev.clientX, ev.clientY, [
          { head: b.name },
          { label: 'Add to routine', sub: LANES().map(L => ({ label: L.name, fn: () => { addItem(L.id, b); toast('added to <b>' + esc(L.name) + '</b>'); } })) },
          { sep: 1 },
          { label: 'Rename…', fn: () => { const v = prompt('Name', b.name); if (v) { snap(); b.name = v.trim(); render(); } } },
          { label: 'Set duration…', fn: () => { const v = prompt('Minutes', b.dur); if (v) { snap(); b.dur = clamp(parseInt(v) || b.dur, 1, 1440); render(); } } },
          { label: 'Effort', sub: [1, 2, 3].map(k => ({ label: EGLYPH[k] + ' ' + ENAME[k], check: (b.energy || 2) === k, fn: () => { snap(); b.energy = k; render(); } })) },
          { sep: 1 },
          { label: 'Delete from bin', danger: 1, fn: () => { snap(); S.lib = S.lib.filter(x => x.id !== b.id); render(); } },
        ]);
      });
      list.appendChild(c);
    });
  });
  if (!list.children.length) list.appendChild(el('div', 'cat', 'no matches'));
}
function applyTemplate(t, laneId, idx) {
  snap();
  const arr = items(laneId);
  const made = t.blocks.map(b => mkItem(b));
  arr.splice(idx == null ? arr.length : idx, 0, ...made);
  render(); toast('<b>' + esc(t.name) + '</b> — ' + made.length + ' blocks added');
}

/* ---------- day view ---------- */
/* ── walking through the dates ──
   The board used to answer "what does a Tuesday look like". This answers "what
   does THIS Tuesday look like", which is the question you have on a Tuesday.

   Stepping to a date opens whatever runs on it — the one-off if there is one,
   otherwise the weekday's template — so the arrows browse your actual plan
   rather than a list of templates. Landing on a date with nothing on it offers
   to build one there, which is how a content day gets made on the day itself.

   It only changes what you are LOOKING at. Ticking still belongs to today: the
   week view is where a past day gets corrected, and that has not moved. */
/* ── walking through the dates ──
   The board used to answer "what does a Tuesday look like". This answers "what
   does THIS Tuesday look like", which is the question you have on a Tuesday.

   Three controls, not six. The first version put a date-picker input next to a
   label showing the same date in a different format, a name for the day that
   the tab strip two inches to the right was already showing, and a "+ one-off"
   that the + Day menu already offers. Four things on the row said something
   another thing on the row was also saying. What is left is a back arrow, the
   date, and a forward arrow.

   The date is the picker. There is no reason for a second control to exist
   when the thing you would click to change the date is already on screen and
   already says the date.                                                    */
function renderDateBar(bar) {
  const key = viewKey(), today = todayKey();

  const back = el('button', 'dnav', '\u2039');
  back.dataset.tip = 'The day before';
  back.onclick = () => goDate(shiftDate(key, -1));
  bar.appendChild(back);

  /* The label IS the date picker. `showPicker` is the supported way to open a
     date input from a click on something else; where it is missing the input
     is still focusable, so the control degrades to a normal date field rather
     than to nothing. */
  const jump = document.createElement('input');
  jump.type = 'date'; jump.value = key; jump.className = 'datejump';
  jump.tabIndex = -1;
  jump.setAttribute('aria-hidden', 'true');
  jump.onchange = () => { if (jump.value) goDate(jump.value); };

  const vid = dayForDate(key);
  const v = variant(vid);
  const lab = el('button', 'datenow' + (key === today ? ' istoday' : ''));
  /* The day's name is on the tab strip already, so it is not repeated here.
     The one thing worth saying is when NOTHING runs, because an empty board
     otherwise looks like a bug rather than an unassigned day. */
  lab.innerHTML = '<b>' + esc(dateLabel(key)) + '</b>' +
    (key === today ? '<em>today</em>' : '') +
    (v ? '' : '<span>nothing runs on this day</span>');
  lab.dataset.tip = 'Jump to a date';
  lab.onclick = () => {
    try { jump.showPicker(); } catch (e) { jump.focus(); jump.click(); }
  };
  bar.appendChild(lab);
  bar.appendChild(jump);

  const fwd = el('button', 'dnav', '\u203a');
  fwd.dataset.tip = 'The day after';
  fwd.onclick = () => goDate(shiftDate(key, 1));
  bar.appendChild(fwd);

  /* Only when you have wandered off, and then it is the most useful thing on
     the row. On today it would be a button that does nothing. */
  if (key !== today) {
    const home = el('button', 'dtoday', 'Today');
    home.dataset.tip = 'Back to today';
    home.onclick = () => goDate(today);
    bar.appendChild(home);
  }
}

/** open a date, and with it whatever day runs there */
function goDate(key) {
  S.viewDate = key === todayKey() ? null : key;
  const vid = dayForDate(key);
  if (vid && variant(vid)) S.current = vid;
  render();
}

function renderBoard() {
  const b = $('#board'); b.innerHTML = '';
  /* finished routines can stay put, slide to the end, or get out of the way entirely */
  const bcol = viewCol();
  const also = alsoToday(bcol);
  if (also) b.appendChild(also);
  const isDoneLane = L => { const a = items(L.id).filter(x => !x.hidden); return a.length > 0 && a.every(x => isDoneOn(x, bcol, L)); };
  let lanes = LANES();
  /* Getting out of the way is about DOING the day, so it only happens on
     today. A date you stepped back to is a record, and a record that hides
     the routine you finished is the exact opposite of useful — finishing it
     is why you went to look. */
  if (bcol.isToday && S.doneRoutines === 'right') lanes = lanes.slice().sort((a, b) => (isDoneLane(a) ? 1 : 0) - (isDoneLane(b) ? 1 : 0));
  if (bcol.isToday && S.doneRoutines === 'hide') {
    const hidden = lanes.filter(isDoneLane);
    lanes = lanes.filter(L => !isDoneLane(L));
    if (hidden.length) {
      /* It used to say only that something was hidden. A routine you cannot
         see and did not ask to lose reads as a routine that has been deleted,
         so this now names it and says out loud that it is still here. */
      const note = el('button', 'donenote',
        '✓ ' + esc(hidden.map(L => L.name).join(', ')) + ' — finished, so ' +
        (hidden.length > 1 ? 'they are' : 'it is') + ' tucked away. Nothing deleted. Click to show ' +
        (hidden.length > 1 ? 'them' : 'it') + ' again.');
      note.dataset.tip = 'You have this set to <b>hide finished routines</b>.<br>Click here, or turn it off in settings, to keep them on the board.';
      note.onclick = () => { S.doneRoutines = 'stay'; save(); render(); toast('Finished routines stay on the board now'); };
      b.appendChild(note);
    }
  }
  if (!lanes.length) {
    /* An empty day is normal now, so it says what to do rather than looking
       broken. Both routes are one click from here. */
    const em = el('div', 'dayempty');
    em.innerHTML = '<b>' + esc(M() ? M().name : 'This day') + ' has no routines on it yet.</b>' +
      '<span>' + (S.lanes.length
        ? 'A day is a set of routines. Put the ones this day needs on it.'
        : 'A group of blocks is a routine. A group of routines is a day. Think about the routines you would like to have in your day and try putting blocks in them.') +
      '</span>';
    /* With no routines anywhere, offering a list of routines to add is the dead
       end this empty state exists to prevent. It builds one instead. */
    const none = !S.lanes.length;
    const add = el('button', 'btn acc', none ? '+ Build your first routine' : '+ Add a routine');
    add.onclick = ev => {
      if (none) return void newRoutine();
      const off = S.lanes.filter(L => !dayHas(M(), L.id));
      if (!off.length) {
        return openMenu(ev.clientX, ev.clientY, [{ head: 'Every routine you own is already here' },
          { label: '+ Build another routine', fn: newRoutine }]);
      }
      openMenu(ev.clientX, ev.clientY, [{ head: 'Put a routine on ' + M().name },
        ...off.map(L => ({ label: L.name, k: (items(L.id) || []).length ? '' : 'empty', fn: () => addLaneToDay(L.id) })),
        { sep: 1 }, { label: '+ Build a new routine', fn: newRoutine }]);
    };
    em.appendChild(add);
    b.appendChild(em);
  }
  lanes.forEach((L, li) => {
    const d = el('div', 'lane' + (L.id === focusId ? ' focus' : ''));
    d.dataset.lane = L.id;

    const head = el('div', 'lane-head');
    const top = el('div', 'lane-top');
    /* grab here to slide the whole routine left or right */
    const grip = el('button', 'lane-grip', '⠿');
    grip.dataset.tip = 'Drag to reorder this routine — or use the arrows';
    grip.addEventListener('pointerdown', ev => startLaneDrag(ev, L, d));
    top.appendChild(grip);
    const lt = el('button', 'lane-arr', '◀'); lt.dataset.tip = 'Move left';
    lt.onclick = () => moveLane(L.id, -1);
    const rt = el('button', 'lane-arr', '▶'); rt.dataset.tip = 'Move right';
    rt.onclick = () => moveLane(L.id, 1);
    const nm = el('input', 'lane-name'); nm.value = L.name;
    nm.dataset.tip = 'Rename this routine — it becomes a section in Todoist';
    nm.onchange = () => { snap(); L.name = nm.value.trim() || 'Routine'; render(); };
    nm.onfocus = () => { focusId = L.id; renderBin(); };
    top.appendChild(nm);
    top.appendChild(lt); top.appendChild(rt);
    if (LANES().length > 1) {
      const x = el('button', 'lane-x', '✕');
      x.dataset.tip = 'Take <b>' + esc(L.name) + '</b> off ' + esc(M().name) + '.<br>It keeps running on your other days — right-click the header to delete it everywhere.';
      x.onclick = () => removeLaneFromDay(L.id);
      top.appendChild(x);
    }
    head.appendChild(top);

    const row = el('div', 'lane-row');
    if (L.start == null) {
      const un = el('button', 'lane-untimed', '◷ no set time');
      un.dataset.tip = 'This routine is an ordered list with no clock. Click to give it a start time.';
      un.onclick = () => { snap(); L.start = '09:00'; render(); };
      row.appendChild(un);
    } else {
      /* UI.timeField, not a raw time input: on a PC that is a box you type
         into with an AM/PM button beside it, instead of three little spinners
         you have to tab between. The phone still gets its wheel. */
      const st = UI.timeField(L.start, v => { snap(); L.start = v || '00:00'; render(); });
      st.dataset.tip = 'When this routine starts — everything below flows from here.<br>Right-click for “no set time”.';
      st.oncontextmenu = ev => { ev.preventDefault(); snap(); L.start = null; render(); toast('<b>' + esc(L.name) + '</b> is now untimed'); };
      row.appendChild(st);
      row.appendChild(el('span', null, '→'));
      row.appendChild(el('span', 'end', fmt(laneEnd(L.id))));
    }

    const sc = schedule(L.id);
    const meta = el('div', 'lane-meta');
    const nb = sc.length;
    /* Count and length are things the routine IS, not things you can press.
       They were two bordered chips sitting in a row of buttons that look
       identical, so nothing in the row said what was clickable. One quiet
       line, no border, and the buttons beside it become obvious. */
    meta.appendChild(el('span', 'read', nb + (nb === 1 ? ' block' : ' blocks') + ' · ' + dur2s(laneMins(L.id))));
    if (L.target && L.start != null) {
      const delta = laneEnd(L.id) - hm2min(L.target);
      const t = el('span', 'tag ' + (delta > 0 ? 'over' : 'ok'), (delta > 0 ? '+' : '') + dur2s(Math.abs(delta)) + (delta > 0 ? ' over' : ' spare'));
      t.dataset.tip = 'Target finish is <b>' + fmt(hm2min(L.target)) + '</b>';
      meta.appendChild(t);
    }
    const clashes = sc.filter(r => r.clash > 0).length;
    if (clashes) {
      const c = el('span', 'tag over', '⚠ ' + clashes + ' clash' + (clashes > 1 ? 'es' : ''));
      c.dataset.tip = 'A block runs past an ⚓ anchored start below it';
      meta.appendChild(c);
    }
    /* routines are independent clocks — say so when two of them cover the same wall time */
    const mySpan = L.start == null ? null : [hm2min(L.start), laneEnd(L.id)];
    const bump = !mySpan ? [] : S.lanes.filter(O => O.id !== L.id && O.start != null && items(O.id).length)
      .filter(O => mySpan[0] < laneEnd(O.id) && hm2min(O.start) < mySpan[1]).map(O => O.name);
    if (sc.length && bump.length) {
      /* This chip used to carry the other routine's name, and a routine can be
         called "Deep Work/ Main Quest Work". In a 278px column that one chip
         wrapped the header onto five lines. The name lives in the tooltip,
         which already listed every overlapping routine in full. */
      const b2 = el('span', 'tag warn', '⚠ overlaps' + (bump.length > 1 ? ' ×' + bump.length : ''));
      b2.dataset.tip = 'This routine runs at the same wall-clock time as <b>' + esc(bump.join(', ')) + '</b>';
      meta.appendChild(b2);
    }
    /* ── the header must not say "never" while listing blocks that run ──
       A routine with no days of its own, holding blocks that each carry their
       own, is not a routine that never runs. That is the shape you get when a
       routine exists to hold a few things on separate schedules: Sunday Meds
       on Sundays, Thursday Meds on Thursdays. The header was describing the
       container and ignoring the contents, so it read "never" above two blocks
       that between them run four days a week. It now reports what actually
       runs, which is the only number anyone wanted from it. */
    const ownDays = L.days || [1, 1, 1, 1, 1, 1, 1];
    const runDays = ownDays.some(Boolean) ? ownDays
      : [0, 1, 2, 3, 4, 5, 6].map(d => items(L.id).some(it => !it.hidden && effDays(L, it)[d]) ? 1 : 0);
    const ld = el('button', 'lane-days', daysShort(runDays));
    ld.dataset.tip = ownDays.some(Boolean)
      ? 'Days this whole routine runs — blocks follow it unless they carry an exception'
      : 'This routine has no days of its own, so these are the days its blocks run on.';
    ld.onclick = ev => { ev.stopPropagation(); laneMenu(L, ev.clientX, ev.clientY); };
    meta.appendChild(ld);
    /* A "must be done by" time means nothing on a routine that has no start
       time — the code below already refuses to draw the over/spare chip
       without one. So the button was offering something that could not work,
       and on an untimed routine it was the chip that pushed the row onto a
       second line. It appears once there is a clock to measure against. */
    if (L.start != null) {
      const tg = el('button', 'tag', L.target ? '⏱ ' + L.target : '⏱ target');
      tg.dataset.tip = 'Set a “must be done by” time for this routine';
      tg.onclick = () => { const v = prompt('Target end time (HH:MM), blank to clear', L.target || ''); if (v !== null) { snap(); L.target = v.trim(); render(); } };
      meta.appendChild(tg);
    }
    /* ── when it runs, and what is in it, are one line ──
       These were two rows only because they are built at two points in this
       function. On a routine holding eleven blocks nobody noticed. On one
       holding two, the header stood taller than its contents: 164px of chrome
       over 74px of blocks, measured. Same information, one row less, on every
       routine on the board. */
    /* An untimed routine says "no set time" in 88px and joins the chip row.
       A timed one carries a real time field, which is 219px on a desktop and
       wrapped the row onto four lines, so it keeps its own line. Merging both
       was the tidier-looking change and the worse-measuring one. */
    if (L.start == null) meta.insertBefore(row, meta.firstChild);
    else head.appendChild(row);
    head.appendChild(meta);

    /* progress + load meters */
    const bars = el('div', 'bars');
    const done = sc.filter(r => isDoneOn(r.it, viewCol(), L)).length;
    if (nb) {
      const p = el('div', 'prog'); p.dataset.tip = '<b>' + done + ' of ' + nb + '</b> checked off in this routine';
      p.appendChild(el('i')).style.width = (done / nb * 100) + '%';
      bars.appendChild(p);
      const lb = el('div', 'loadbar');
      lb.dataset.tip = 'Effort load <b>' + laneLoad(L.id).toFixed(1) + '</b> — width is time, colour is effort (◔ light / ◑ medium / ● heavy)';
      sc.forEach(({ it }) => { const i = el('i'); i.style.flex = it.dur; i.style.background = ECOL[energyOf(it)]; lb.appendChild(i); });
      bars.appendChild(lb);
      head.appendChild(bars);
      /* The "load 0.1" chip that used to sit here showed the same effort the
         bar directly above it draws in colour, and the bar's own tooltip
         already gives the number. Two elements, one fact, and one of them a
         figure nobody can act on. Deleting it took a whole row off every
         routine on the board. The heavy-in-a-row warning stays: that is not a
         readout, it is the one thing here worth interrupting for. */
      let run = 0, worst = 0;
      items(L.id).forEach(it => { run = energyOf(it) === 3 ? run + 1 : 0; worst = Math.max(worst, run); });
      if (worst > 1) {
        const lm = el('div', 'lane-meta');
        const w = el('span', 'tag warn', '⚡ ' + worst + ' heavy in a row');
        w.dataset.tip = 'Back-to-back heavy blocks — consider putting something light between them';
        lm.appendChild(w);
        head.appendChild(lm);
      }
    }

    const tools = el('div', 'lane-tools');
    const mk = (label, tip, fn, cls, rc) => {
      const x = el('button', 'btn ' + (cls || ''), label); x.dataset.tip = tip; x.onclick = fn;
      if (rc) x.oncontextmenu = rc;
      tools.appendChild(x);
    };
    mk(L.byPri ? '◧P' : '↓P', L.byPri
      ? 'Showing this routine <b>by priority</b> — times still belong to the real order. Click to go back.'
      : 'Sort by priority — P1 first. Pinned 📌 and anchored ⚓ stay put.<br>Right-click for a view-only version that leaves the order alone.',
      () => sortPri(L.id), '', ev => {
        ev.preventDefault();
        openMenu(ev.clientX, ev.clientY, [{ head: 'Priority in ' + L.name },
          { label: 'Sort them for real', fn: () => sortPri(L.id) },
          { label: 'Just show me by priority', check: !!L.byPri, fn: () => { L.byPri = !L.byPri; render(); } }]);
      });
    mk('⇩ template', 'Save this routine as a reusable template', () => saveTemplate(L.id), 'hov');
    mk('⌫', 'Empty this routine', () => { if (items(L.id).length && confirm('Clear ' + L.name + '?')) { snap(); M().items[L.id] = []; render(); } }, 'hov');
    head.appendChild(tools);
    d.appendChild(head);

    d.addEventListener('contextmenu', ev => { if (ev.target.closest('.block')) return; ev.preventDefault(); laneMenu(L, ev.clientX, ev.clientY); });

    const body = el('div', 'lane-body'); body.dataset.lane = L.id;
    body.onclick = () => { if (focusId !== L.id) { focusId = L.id; renderBoard(); renderBin(); } };
    if (!sc.length) body.appendChild(el('div', 'lane-empty', 'Drag a block here<br><span style="opacity:.6">or click one in the bin</span>'));
    const nowM = nowMin();
    /* only where the clock actually is: the routine has to cover this minute */
    const covers = L.start != null && sc.length && nowM >= hm2min(L.start) && nowM <= laneEnd(L.id);
    const showNow = S.nowline && L.nowline !== false && covers && !L.byPri;
    /* view-only priority ordering: the clock times stay attached to the real order */
    const view = L.byPri ? sc.slice().sort((a, b) => ((a.it.pri || 9) - (b.it.pri || 9)) || (a.s - b.s)) : sc;
    view.forEach(({ it, s, e, gap, clash, hidden }) => {
      const nd = blockNode(L.id, it, s, e, { gap, clash, ongoing: it.ongoing });
      if (showNow && e != null && e <= nowM && !hidden) nd.classList.add('past');
      body.appendChild(nd);
    });
    /* draw each ongoing block's shadow down over the blocks it overlaps */
    requestAnimationFrame(() => {
      view.forEach(({ it, e }) => {
        if (!it.ongoing || e == null) return;
        const node = body.querySelector('[data-id="' + it.id + '"]');
        if (!node) return;
        const covered = view.filter(r => r.it !== it && r.s != null && r.s >= 0 && r.s < e && view.indexOf(r) > view.findIndex(z => z.it === it));
        let h = 0;
        covered.forEach(r => { const n2 = body.querySelector('[data-id="' + r.it.id + '"]'); if (n2) h += n2.offsetHeight + 8; });
        const old = node.querySelector('.b-cover'); if (old) old.remove();
        if (h > 6) {
          const cov = el('div', 'b-cover', '<b>⟲ while this runs</b>');
          cov.style.height = (h - 8) + 'px';
          node.appendChild(cov);
        }
      });
    });
    /* deferred layout: needs real measured heights, so it runs after paint —
       but stays callable on demand (resize, tests) rather than only inside rAF */
    if (S.proportional) LAYOUT.push({ kind: 'prop', body, view });
    if (showNow) LAYOUT.push({ kind: 'now', body, view, nowM });
    d.appendChild(body);

    const add = el('button', 'lane-add', '+ blank block');
    add.dataset.tip = 'Add an empty block and type your own name';
    add.onclick = () => {
      focusId = L.id;
      const it = addItem(L.id, { name: 'New block', dur: 30, color: PAL[Math.floor(Math.random() * PAL.length)], energy: 2 });
      setTimeout(() => { const n = document.querySelector('[data-id="' + it.id + '"] .b-name'); if (n) { n.focus(); document.getSelection().selectAllChildren(n); } }, 20);
    };
    d.appendChild(add);
    b.appendChild(d);
  });

  const al = el('button', null, '+'); al.id = 'addlane';
  al.dataset.tip = 'Add another routine — <b>Client block</b>, <b>Night shift</b>, anything';
  al.onclick = ev => {
    const off = S.lanes.filter(L => !LANES().some(x => x.id === L.id));
    openMenu(ev.clientX - 150, ev.clientY, [
      { head: 'Add a routine to ' + M().name },
      { label: '+ Build a new routine', fn: () => {
          const n = prompt('Routine name', 'Routine ' + (S.lanes.length + 1)); if (!n) return;
          snap();
          const L = { id: uid(), name: n.trim(), start: '09:00', target: '' };
          S.lanes.push(L);
          S.variants.forEach(v => { v.items[L.id] = []; });
          const v = M(); if (!v.routines) v.routines = S.lanes.map(x => x.id); else v.routines.push(L.id);
          render();
        } },
      ...(off.length ? [{ sep: 1 }, { head: 'Or reuse one from another day' },
        ...off.map(L => ({ label: L.name, k: (items(L.id) || []).length ? '' : 'empty', fn: () => addLaneToDay(L.id) }))] : []),
    ]);
  };
  b.appendChild(al);
  requestAnimationFrame(runLayout);
}
/** drag a routine sideways past its neighbours */
function startLaneDrag(ev, L, node) {
  if (ev.button != null && ev.button !== 0) return;
  ev.preventDefault(); ev.stopPropagation();
  node.classList.add('dragging');
  const move = e => {
    const others = [...document.querySelectorAll('.lane')].filter(n => n !== node);
    for (const o of others) {
      const r = o.getBoundingClientRect();
      if (e.clientX > r.left && e.clientX < r.right) {
        const v = M();
        if (!v.routines) v.routines = S.lanes.map(x => x.id);
        const from = v.routines.indexOf(L.id);
        const to = v.routines.indexOf(o.dataset.lane);
        if (from > -1 && to > -1 && from !== to) {
          snap();
          const [x] = v.routines.splice(from, 1); v.routines.splice(to, 0, x);
          focusId = L.id; renderBoard();
          const again = document.querySelector('[data-lane="' + L.id + '"]');
          if (again) again.classList.add('dragging');
        }
        break;
      }
    }
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    document.querySelectorAll('.lane.dragging').forEach(n => n.classList.remove('dragging'));
    render();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up, { once: true });
}
/* ── these three ask to be saved, out loud ──
   Which routines a day runs is `v.routines`, and taking one off REPLACES that
   array while putting one back or moving one EDITS IT IN PLACE. Under the old
   save, a replaced array looked different and was written; an edited one could
   not look different from itself and was not. So a routine taken off a day
   stayed off, and putting it back changed only what was on the screen. The tab
   you were in looked right and a new tab read storage and the routine was
   gone. That is fixed in writeRows, and none of the three asked for a save of
   its own either — they left it to whatever happened next, which on a tab you
   then closed was nothing. */
/** take a routine out of THIS day, leaving it intact everywhere else */
function removeLaneFromDay(id) {
  const v = M();
  if (!v.routines) v.routines = S.lanes.map(l => l.id);
  /* A day with nothing on it is a legitimate day — it is what a new one is,
     and what a rest day looks like before you decide it needs anything. */
  snap();
  v.routines = v.routines.filter(x => x !== id);
  save();
  focusId = null; render();
  toast('<b>' + esc(lane(id).name) + '</b> is off ' + esc(v.name) + ' — its blocks are kept, and it still runs on your other days');
}
/* Build a routine and put it on the day being looked at. One function, because
   there are now three ways in — the board's empty state, the routine bin, and
   the + at the end of the board — and three copies of a prompt is three places
   for them to drift apart. */
function newRoutine() {
  const nm = prompt('Name this routine', S.lanes.length ? 'Routine ' + (S.lanes.length + 1) : 'Morning');
  if (!nm) return null;
  snap();
  const L = { id: uid(), name: nm.trim(), start: '09:00', target: '' };
  S.lanes.push(L);
  S.variants.forEach(v => { v.items[L.id] = []; });
  addLaneToDay(L.id);
  return L;
}

function addLaneToDay(id) {
  const v = M();
  if (!v.routines) v.routines = S.lanes.map(l => l.id);
  if (v.routines.includes(id)) return;
  snap();
  /* Back where it belongs, not on the end. S.lanes is the shelf and its order
     is the one you arranged, so a routine taken off a day and put back lands
     between the same two neighbours instead of jumping to the far right. */
  const shelf = S.lanes.map(l => l.id);
  const want = shelf.indexOf(id);
  let at = v.routines.length;
  for (let i = 0; i < v.routines.length; i++) {
    const k = shelf.indexOf(v.routines[i]);
    if (k > want) { at = i; break; }
  }
  v.routines.splice(at, 0, id);
  save();
  render();
}
/** order is a per-day thing, so reordering here never disturbs your other days */
function moveLane(id, dir) {
  const v = M();
  if (!v.routines) v.routines = S.lanes.map(l => l.id);
  const i = v.routines.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= v.routines.length) return toast('already at the end');
  snap();
  const [x] = v.routines.splice(i, 1); v.routines.splice(j, 0, x);
  save();
  focusId = id; render();
}
/**
 * Which weekdays a block actually runs: the routine decides, and a block only
 * overrides it if you set an exception (right-click → Days).
 */
function effDays(L, it) {
  if (it.daysEx) return it.days.slice();          /* an exception overrules the routine outright */
  return ((L && L.days) || [1, 1, 1, 1, 1, 1, 1]).slice();
}

/* ---------- right-click: routine ---------- */
function laneMenu(L, x, y) {
  const others = S.variants.filter(v => v.id !== S.current);
  openMenu(x, y, [
    { head: L.name },
    { label: 'Add blank block', fn: () => { const it = addItem(L.id, { name: 'New block', dur: 30, color: PAL[Math.floor(Math.random() * PAL.length)], energy: 2 }); setTimeout(() => { const n = document.querySelector('[data-id="' + it.id + '"] .b-name'); if (n) { n.focus(); document.getSelection().selectAllChildren(n); } }, 20); } },
    { label: 'Sort by priority', k: '↓P', fn: () => sortPri(L.id) },
    { label: 'Save as template', k: '⇩', fn: () => saveTemplate(L.id) },
    { sep: 1 },
    { label: 'Set start time…', fn: () => promptTime('Routine starts at (HH:MM)', L.start || '', v => { snap(); L.start = v || '00:00'; render(); }) },
    { label: 'No set time', check: L.start == null, fn: () => { snap(); L.start = L.start == null ? '09:00' : null; render(); } },
    { label: 'Show the now line here', check: L.nowline !== false, fn: () => { L.nowline = L.nowline === false; render(); } },
    { label: 'Set target finish…', fn: () => promptTime('Must be done by (HH:MM)', L.target || '', v => { snap(); L.target = v; render(); }) },
    { label: 'Rename routine…', fn: () => { const v = prompt('Routine name', L.name); if (v) { snap(); L.name = v.trim(); render(); } } },
    { label: 'Days this routine runs', sub: () => {
        const cur = L.days || [1, 1, 1, 1, 1, 1, 1];
        const set = arr => { snap(); L.days = arr; render(); };
        return [
          { label: 'Every day it exists', check: !L.days, fn: () => { snap(); L.days = null; render(); } },
          { label: 'Weekdays only', check: !!L.days && L.days.join('') === '0111110', fn: () => set([0, 1, 1, 1, 1, 1, 0]) },
          { label: 'Weekend only', check: !!L.days && L.days.join('') === '1000001', fn: () => set([1, 0, 0, 0, 0, 0, 1]) },
          { sep: 1 },
          ...weekOrd().map(d => ({ label: DAYS[d], check: !!cur[d], keepOpen: 1,
          fn: () => { snap(); const n = (L.days || [1, 1, 1, 1, 1, 1, 1]).slice(); n[d] = n[d] ? 0 : 1; L.days = n; render(); } })),
        ];
      } },
    { label: 'Move left', fn: () => moveLane(L.id, -1) },
    { label: 'Move right', fn: () => moveLane(L.id, 1) },
    { sep: 1 },
    ...(others.length ? [{ label: 'Copy this routine into', sub: others.map(v => ({ label: v.name, fn: () => {
        snap();
        v.items[L.id] = (v.items[L.id] || []).concat(items(L.id).map(it => Object.assign({}, it, { id: uid(), days: it.days.slice(), done: false })));
        render(); toast('copied into <b>' + esc(v.name) + '</b>');
      } })) }] : []),
    { label: 'Clear its blocks', danger: 1, fn: () => { if (items(L.id).length && confirm('Clear ' + L.name + '?')) { snap(); M().items[L.id] = []; render(); } } },
    { label: 'Remove from ' + M().name, danger: 1, fn: () => { removeLaneFromDay(L.id); } },
    ...(S.lanes.length > 1 ? [{ label: 'Delete it from every day', danger: 1, fn: () => {
        if (!confirm('Delete the routine "' + L.name + '" everywhere?\n\nIts blocks are removed from every day. To just drop it from ' + M().name + ', use “Remove from ' + M().name + '”.')) return;
        snap();
        S.lanes = S.lanes.filter(z => z.id !== L.id);
        S.variants.forEach(v => { delete v.items[L.id]; if (v.routines) v.routines = v.routines.filter(id => id !== L.id); });
        render();
      } }] : []),
  ]);
}
function saveTemplate(laneId) {
  const arr = items(laneId);
  if (!arr.length) return toast('nothing in this routine to save');
  const n = prompt('Template name', lane(laneId).name); if (!n) return;
  snap();
  S.templates.push({ id: uid(), name: n.trim(), blocks: arr.map(it => ({ name: it.name, dur: it.dur, color: it.color, note: it.note, days: it.days.slice(), pri: it.pri, energy: it.energy })) });
  render(); toast('saved <b>' + esc(n.trim()) + '</b> to the bin');
}

/* ---------- deferred, measurement-dependent layout ---------- */
const LAYOUT = [];
function runLayout() {
  const jobs = LAYOUT.splice(0);
  jobs.forEach(j => {
    if (!j.body.isConnected) return;
    if (j.kind === 'prop') {
      const rows = j.view.filter(r => !r.hidden && r.s != null);
      const total = rows.reduce((a, r) => a + Math.max(1, r.it.dur), 0);
      if (!total) return;
      const avail = j.body.clientHeight - 10 - (rows.length - 1) * 4;
      if (avail < 40) return;
      const per = avail / total;
      j.body.classList.add('prop');
      rows.forEach(r => {
        const nd = j.body.querySelector('[data-id="' + r.it.id + '"]');
        if (!nd) return;
        const h = Math.max(r.it.dur <= 5 ? 13 : 18, r.it.dur * per);
        nd.style.minHeight = '0'; nd.style.height = h + 'px';
        nd.classList.toggle('squeezed', h < 46);
      });
    }
    if (j.kind === 'now') {
      let top = null;
      for (const r of j.view) {
        if (r.hidden || r.s == null) continue;
        const nd = j.body.querySelector('[data-id="' + r.it.id + '"]');
        if (!nd) continue;
        if (j.nowM >= r.s && j.nowM < r.e) { top = nd.offsetTop + (j.nowM - r.s) / Math.max(1, r.e - r.s) * nd.offsetHeight; break; }
        if (j.nowM < r.s) { top = Math.max(3, nd.offsetTop - 4); break; }
      }
      if (top == null) return;
      const line = nowLine(j.nowM);
      line.style.top = top + 'px';
      j.body.appendChild(line);
    }
  });
}
function nowLine(m) {
  const n = el('div', 'nowline', '<em></em><b>NOW ' + fmt(m) + '</b><i></i>');
  n.dataset.tip = 'Where you are in the day. Turn it off in ⚙, or per routine with right-click.';
  return n;
}
/* ---------- sounds ----------
 * Synthesised, no files. A tick should feel like a small physical click with a
 * pitch that RISES as you get closer to finishing (that rise is most of the
 * satisfaction); finishing the day gets a proper little fanfare.
 */
const THEMES = {
  soft:    { name: 'Soft', wave: 'sine',     tick: [1, 2.01], decay: .17, bright: .55 },
  marimba: { name: 'Marimba', wave: 'sine',  tick: [1, 4.02, 6.5], decay: .3, bright: .5 },
  arcade:  { name: 'Arcade', wave: 'square', tick: [1, 1.5], decay: .1, bright: .3 },
  bell:    { name: 'Bell', wave: 'triangle', tick: [1, 2.76, 5.4], decay: .45, bright: .42 },
};
let AC;
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();      /* browsers park it until you interact */
  return AC;
}
function tone(f, t, dur, vol, wave) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave || 'sine'; o.frequency.setValueAtTime(f, AC.currentTime + t);
  g.gain.setValueAtTime(0.0001, AC.currentTime + t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), AC.currentTime + t + .008);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(AC.currentTime + t); o.stop(AC.currentTime + t + dur + .02);
}
/** how far through today's list we are — drives the rising pitch */
function progressRatio() {
  try {
    const col = viewCol();
    const td = pairsFor(routineForDate(col.key), col.key);
    if (!td.length) return 0;
    return td.filter(({ it, l }) => isDoneOn(it, col, l)).length / td.length;
  } catch (e) { return 0; }
}
function beep(kind) {
  if (!S.sound || S.soundTheme === 'off') return;
  const T = THEMES[S.soundTheme] || THEMES.soft;
  const vol = (S.volume == null ? 0.6 : S.volume) * 0.16;
  if (vol <= 0) return;
  try {
    audio();
    if (kind === 'untick') { tone(240, 0, .12, vol * .45, T.wave); return; }
    if (kind === 'done') {
      /* pentatonic step up the list: C D E G A C — never a sour note, always "one more" */
      const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
      const base = scale[Math.min(scale.length - 1, Math.round(progressRatio() * (scale.length - 1)))];
      T.tick.forEach((mult, i) => tone(base * mult, i * .012, T.decay * (i ? T.bright : 1), vol / (i + 1.4), T.wave));
      return;
    }
    if (kind === 'complete') {
      const chord = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      chord.forEach((f, i) => {
        T.tick.forEach((mult, j) => tone(f * mult, i * .085 + j * .012, (T.decay + .35) / (j + 1), vol / (j + 1.3), T.wave));
      });
      tone(1567.98, .5, .7, vol * .5, T.wave);      /* the little sparkle on top */
      return;
    }
    tone(440, 0, .12, vol, T.wave);
  } catch (e) {}
}

function blockNode(laneId, it, s, e, meta) {
  meta = meta || {};
  const broke = RULECHK.byItem.get(it.id);
  const mini = isMini(it);
  /* the tick shown is the one belonging to the date on screen, never the
     block's own flag — that flag is today's, and today is one of many days */
  const col = viewCol(), vL = lane(laneId);
  const isDn = isDoneOn(it, col, vL), isSk = isSkippedOn(it, col, vL);
  const n = el('div', 'block' + (mini ? ' mini' : '') + (it.pin ? ' pinned' : '') + (isDn ? ' done' : '') + (isSk ? ' skipped' : '') + (it.hidden ? ' hid' : '') + (it.ongoing ? ' ongoing' : '') + (broke ? ' broke' : ''));
  n.dataset.id = it.id; n.dataset.lane = laneId;
  n.style.setProperty('--c', it.color);
  if (!mini) n.style.minHeight = blockMin(it.dur) + 'px';

  const startTip = it.at
    ? 'Starts at <b>' + it.at + '</b> — anchored, so it holds this time and the rest flows around it.<br>Click to change or release.'
    : 'Click to set an exact <b>start</b> time (anchors the block)';
  const endTip = 'Click to set when this <b>finishes</b> — the duration adjusts to match';

  if (!mini) {
    /* --- top row: start – end, warnings, duration --- */
    const top = el('div', 'b-top');
    if (s == null) {
      const u = el('span', 'b-flag', '◷ no set time');
      u.dataset.tip = 'This routine has no clock — the order is what matters';
      top.appendChild(u);
    } else {
      const t0 = el('button', 'b-time' + (it.at ? ' anc' : '') + (meta.clash ? ' clash' : ''), (it.at ? '⚓ ' : '') + fmt(s));
      t0.dataset.tip = startTip;
      t0.onclick = ev => { ev.stopPropagation(); editTime(t0, it, s); };
      const t1 = el('button', 'b-time b-end', fmt(e));
      t1.dataset.tip = endTip;
      t1.onclick = ev => { ev.stopPropagation(); editEnd(t1, it, s); };
      top.appendChild(t0); top.appendChild(el('span', 'b-dash', '–')); top.appendChild(t1);
    }
    if (meta.gap > 0) {
      const g = el('button', 'b-flag', '↧' + dur2s(meta.gap));
      g.dataset.tip = '<b>' + dur2s(meta.gap) + '</b> of empty time before this block — click to see what fits';
      g.onclick = ev => { ev.stopPropagation(); const f = findItem(it.id); whatFits(g.getBoundingClientRect(), laneId, f ? f.i : 0, meta.gap); };
      top.appendChild(g);
    }
    if (meta.clash > 0) { const g = el('span', 'b-flag bad', '⚠' + dur2s(meta.clash)); g.dataset.tip = 'The block above runs <b>' + dur2s(meta.clash) + '</b> past this anchored start'; top.appendChild(g); }
    if (broke) { const g = el('span', 'b-flag bad', '⚠ rule'); g.dataset.tip = broke.map(esc).join('<br>'); top.appendChild(g); }
    if (it.ongoing) { const g = el('span', 'b-flag', '⟲ ongoing'); g.dataset.tip = 'Runs <b>alongside</b> the blocks below — they don’t wait for it'; top.appendChild(g); }
    top.appendChild(el('span', 'b-sp'));
    const du = el('div', 'b-dur');
    const step = durStep(it.dur);
    const mi = el('button', null, '−'), pl = el('button', null, '+');
    mi.dataset.tip = step + ' minute' + (step > 1 ? 's' : '') + ' shorter'; pl.dataset.tip = step + ' minute' + (step > 1 ? 's' : '') + ' longer';
    mi.onclick = ev => { ev.stopPropagation(); snap(); it.dur = Math.max(1, it.dur - durStep(it.dur)); syncKin(it, { dur: it.dur }); render(); };
    pl.onclick = ev => { ev.stopPropagation(); snap(); it.dur += durStep(it.dur + 1); syncKin(it, { dur: it.dur }); render(); };
    const db = el('b', null, dur2s(it.dur));
    db.dataset.tip = 'Click to type exact minutes — <b>1</b> is fine';
    db.onclick = ev => { ev.stopPropagation(); editDur(db, it); };
    du.appendChild(mi); du.appendChild(db); du.appendChild(pl);
    top.appendChild(du);
    n.appendChild(top);
  }

  /* --- checkbox + name --- */
  const main = el('div', 'b-main');
  const ck = el('button', 'b-check' + (isDn ? ' on' : '') + (isSk ? ' skip' : ''), isSk ? '–' : '✓');
  const when = col.isToday ? 'today' : dateLabel(col.key);
  ck.dataset.tip = isSk
    ? '<b>Not needed ' + esc(when) + '</b> — counts neither as done nor as owed, and cannot break your streak.<br>Click to put it back.'
    : (isDn ? 'Done — click to un-check'
      : col.isFuture ? 'You can tick this off on the day'
      : col.isToday ? 'Check it off. When today’s whole routine is ticked, it resets itself.<br>Right-click for <b>not needed today</b>.'
      : 'Tick it off for <b>' + esc(when) + '</b> — backfilling a past day is normal.<br>Right-click for <b>not needed</b>.');
  ck.onclick = ev => { ev.stopPropagation(); if (isSk) return setSkippedOn(it, col, vL); setDoneOn(it, col, scheduledFor(col.key), vL); };
  /* right on the box, because the box is where you are already deciding
     whether this happened */
  ck.oncontextmenu = ev => { ev.preventDefault(); ev.stopPropagation(); setSkippedOn(it, col, vL); };
  main.appendChild(ck);
  const txt = el('div', 'b-txt');

  /* ── a block that goes somewhere ──
     Tom, 2026-09-05: "I want the title itself to act at the link." He is
     right. "Todoist Run Through" IS the link — a second line under it saying
     where it goes is the same fact written twice, and on forty-one blocks
     that is a wall.

     So a block with a link has a title you click to go there, and renaming it
     moves to the menu, which is where everything else about a block already
     lives. A block WITHOUT a link is untouched: the title is still the thing
     you click to rename, because that is the common case and it should not
     get worse to serve the rare one. */
  if (it.link) {
    const a = el('a', 'b-name b-titlelink');
    a.textContent = it.name;
    a.href = it.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = it.link + '  —  right-click the block to rename it';
    a.onclick = ev => ev.stopPropagation();
    txt.appendChild(a);
  } else {

  const nm = el('div', 'b-name', esc(it.name));
  nm.contentEditable = 'true'; nm.spellcheck = false;
  nm.onblur = () => {
    const v = nm.textContent.replace(/\s+/g, ' ').trim();
    if (!v || v === it.name) { nm.textContent = it.name; return; }
    snap();
    const p = parseTrailingDur(v);            /* "Vitamins 1m" sets the name AND the duration */
    const patch = (p && p.dur >= 1 && p.dur <= 1440) ? { name: p.name, dur: p.dur } : { name: v };
    Object.assign(it, patch);
    const kin = kinOf(it);
    if (kin.length) {
      /* a renamed block has copies elsewhere — follow them, or break away */
      if (confirm('“' + it.name + '” has ' + kin.length + ' linked cop' + (kin.length > 1 ? 'ies' : 'y') + ' in other days.\n\nOK — rename them too and stay linked.\nCancel — split this one off and let it live its own life.')) {
        syncKin(it, patch);
      } else { it.srcId = uid(); ensureInBin(it); }
    } else ensureInBin(it);
    render();
  };
  nm.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); nm.blur(); } ev.stopPropagation(); };
  txt.appendChild(nm);
  }
  if (it.note || it.noteOpen) {
    const no = el('div', 'b-note', linkify(it.note || ''));
    no.contentEditable = 'true'; no.spellcheck = false;
    /* editing sees the text it will save; reading sees the links */
    no.onfocus = () => { no.textContent = it.note || ''; };
    no.onblur = () => {
      const v = no.textContent.replace(/\s+/g, ' ').trim();
      if (v !== it.note) { snap(); it.note = v; syncKin(it, { note: v }); }
      if (!v) { it.noteOpen = false; render(); return; }
      no.innerHTML = linkify(v);
      save();
    };
    /* a click on a link opens it instead of dropping a caret into the middle
       of the address — the note only becomes editable when you click the text
       around it */
    no.addEventListener('pointerdown', ev => {
      const a = ev.target.closest('a.b-link');
      if (!a || no === document.activeElement) return;
      ev.preventDefault(); ev.stopPropagation();
      window.open(a.href, '_blank', 'noopener,noreferrer');
    }, true);
    no.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === 'Escape') { ev.preventDefault(); no.blur(); } ev.stopPropagation(); };
    txt.appendChild(no);
    if (it.noteOpen) setTimeout(() => no.focus(), 10);
  }
  main.appendChild(txt);
  if (mini) {
    const mt = el('button', 'b-mtime' + (it.at ? ' anc' : ''), s == null ? '◷' : (it.at ? '⚓' : '') + fmt(s));
    mt.dataset.tip = startTip;
    mt.onclick = ev => { ev.stopPropagation(); editTime(mt, it, s); };
    const md = el('span', 'b-mdays', daysShort(it.days) + ' · ' + dur2s(it.dur));
    md.dataset.tip = 'Runs <b>' + esc(daysLabel(it.days)) + '</b> · ' + dur2s(it.dur) + '<br>Right-click for days, duration, effort…';
    if (broke) { const g = el('span', 'b-flag bad', '⚠'); g.dataset.tip = broke.map(esc).join('<br>'); main.appendChild(g); }
    main.appendChild(mt); main.appendChild(md);
  }
  n.appendChild(main);

  /* --- foot: days, badges, hover controls --- */
  const foot = el('div', 'b-foot');
  const L0 = lane(laneId), ed = L0 ? effDays(L0, it) : it.days;
  /* days follow the routine (and the routine follows the day) — so only SAY anything
     when this block breaks step. Otherwise it is noise on every card. */
  if (it.daysEx) {
    const dz = el('button', 'b-dayex', daysShort(ed));
    dz.dataset.tip = '<b>Day exception</b> — runs ' + esc(daysLabel(ed)) + ' instead of following <b>' + esc(L0 ? L0.name : '') + '</b>.<br>Click to change or clear.';
    dz.onclick = ev => { ev.stopPropagation(); blockMenu(laneId, it, ev.clientX, ev.clientY); };
    foot.appendChild(dz);
  }

  const ctl = el('div', 'b-ctl');
  const eg = el('button', 'b-badge ' + (it.energy ? 'e' + it.energy : 'dim'), it.energy ? EGLYPH[it.energy] : '◌');
  eg.dataset.tip = 'Effort: <b>' + ENAME[energyOf(it)] + '</b> — click to cycle ◔ light / ◑ medium / ● heavy.<br>Feeds the routine’s load meter.';
  eg.onclick = ev => { ev.stopPropagation(); snap(); it.energy = ((it.energy || 0) % 3) + 1; syncKin(it, { energy: it.energy }); render(); };
  const pr = el('button', 'b-badge ' + (it.pri ? 'p' + it.pri : 'dim'), it.pri ? PRI[it.pri] : 'P');
  pr.dataset.tip = 'Priority: <b>' + (it.pri ? 'P' + it.pri : 'none') + '</b> — click to pick.<br>Exports as Todoist p1–p3 and drives the ↓P sort.';
  pr.onclick = ev => {
    ev.stopPropagation();
    const r = pr.getBoundingClientRect();
    openMenu(r.left, r.bottom + 4, [{ head: 'Priority' },
      ...[1, 2, 3, 0].map(k => ({ label: k ? 'P' + k + (k === 1 ? ' — must happen' : k === 2 ? ' — should happen' : ' — nice to have') : 'No priority',
        check: (it.pri || 0) === k, fn: () => { snap(); it.pri = k; render(); } }))]);
  };
  const nt = el('button', 'hov' + (it.note ? ' on' : ''), '✎'); nt.dataset.tip = 'Add a note (exports as the task description)';
  nt.onclick = ev => { ev.stopPropagation(); it.noteOpen = !it.noteOpen; render(); };
  const pin = el('button', 'hov' + (it.pin ? ' on' : ''), '📌'); pin.dataset.tip = 'Pin this block’s position so ↓P sort leaves it alone';
  pin.onclick = ev => { ev.stopPropagation(); snap(); it.pin = !it.pin; render(); };
  const cp = el('button', 'hov', '⧉'); cp.dataset.tip = 'Duplicate';
  cp.onclick = ev => { ev.stopPropagation(); const f = findItem(it.id); snap(); f.arr.splice(f.i + 1, 0, Object.assign({}, it, { id: uid(), days: it.days.slice(), at: null, done: false })); render(); };
  const rm = el('button', 'hov', '✕'); rm.dataset.tip = 'Remove this block';
  rm.onclick = ev => { ev.stopPropagation(); removeItem(laneId, it.id); };
  const mo = el('button', 'hov', '⋯'); mo.dataset.tip = 'Everything else — days, move, times… (same as right-click)';
  mo.onclick = ev => { ev.stopPropagation(); const r = mo.getBoundingClientRect(); blockMenu(laneId, it, r.left, r.bottom + 4); };
  (mini ? [eg, pr, mo] : [eg, pr, nt, pin, cp, rm, mo]).forEach(x => ctl.appendChild(x));
  foot.appendChild(ctl);
  n.appendChild(foot);

  const grip = el('div', 'b-grip'); grip.dataset.tip = 'Drag to change how long this takes';
  grip.addEventListener('pointerdown', ev => startResize(ev, it, n));
  n.appendChild(grip);

  if (SEL.has(it.id)) n.classList.add('sel');
  n.addEventListener('pointerdown', ev => {
    if (ev.button === 2) return;
    if (ev.target.closest('.b-ctl,.b-days,.b-dur,.b-grip,.b-name,.b-note,.b-time,.b-mtime,.b-timein,.b-durin,.b-check')) return;
    if (ev.ctrlKey || ev.metaKey || ev.shiftKey) {      /* multi-select instead of dragging */
      ev.preventDefault();
      if (ev.shiftKey && SEL.size) {
        const ids = items(laneId).map(x => x.id);
        const last = [...SEL].filter(id => ids.includes(id)).pop();
        const a = ids.indexOf(last), b = ids.indexOf(it.id);
        if (a > -1 && b > -1) ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(id => SEL.add(id));
        else SEL.add(it.id);
      } else SEL.has(it.id) ? SEL.delete(it.id) : SEL.add(it.id);
      render();
      return;
    }
    startDrag(ev, { kind: 'move', id: it.id, node: n });
  });
  n.addEventListener('contextmenu', ev => {
    ev.preventDefault(); ev.stopPropagation();
    if (SEL.size > 1 && SEL.has(it.id)) return selMenu(ev.clientX, ev.clientY);
    blockMenu(laneId, it, ev.clientX, ev.clientY);
  });
  return n;
}

/* ---------- right-click: block ---------- */
function blockMenu(laneId, it, x, y) {
  const setDays = arr => { snap(); it.days = arr.slice(); it.daysEx = true; render(); };
  openMenu(x, y, [
    { head: it.name },
    (() => {
      const col = viewCol(), L0 = lane(laneId), sk = isSkippedOn(it, col, L0);
      const when = col.isToday ? 'today' : dateLabel(col.key);
      return { label: sk ? 'Put it back on ' + when : 'Not needed ' + when, k: '–',
        fn: () => setSkippedOn(it, col, L0) };
    })(),
    { sep: 1 },
    { label: 'Set start time…', k: '⚓', fn: () => promptTime('Start time (HH:MM) — anchors the block', it.at || '', v => { snap(); it.at = v || null; render(); }) },
    { label: 'Set end time…', fn: () => {
        const st = schedule(laneId).find(r => r.it.id === it.id);
        promptTime('Finish time (HH:MM)', hhmm(st.e), v => { if (!v) return; snap(); let d = hm2min(v) - (st.s % 1440); if (d <= 0) d += 1440; it.dur = clamp(d, 1, 1440); syncKin(it, { dur: it.dur }); render(); });
      } },
    { label: 'Set duration…', fn: () => { const v = prompt('Minutes', it.dur); if (v) { snap(); it.dur = clamp(parseInt(v) || it.dur, 1, 1440); render(); } } },
    { sep: 1 },
    { label: 'Effort', sub: [1, 2, 3].map(k => ({ label: EGLYPH[k] + ' ' + ENAME[k], check: energyOf(it) === k, fn: () => { snap(); it.energy = k; syncKin(it, { energy: k }); render(); } })) },
    { label: 'Priority', sub: [0, 1, 2, 3].map(k => ({ label: k ? 'P' + k : 'none', check: (it.pri || 0) === k, fn: () => { snap(); it.pri = k; render(); } })) },
    { label: 'Colour', sub: [{ pal: PAL.map((c, i) => ({
      color: c, label: PALNAME[i], on: it.color === c,
      fn: () => { snap(); it.color = c; syncKin(it, { color: c }); render(); },
    })) }] },
    { label: 'Days', sub: () => {
        const L = lane(laneId);
        const rd = (L.days || [1, 1, 1, 1, 1, 1, 1]);
        return [
          { head: it.daysEx ? 'Exception' : 'Following ' + L.name },
          { label: 'Follow the routine (' + daysShort(rd) + ')', check: !it.daysEx, fn: () => { snap(); it.daysEx = false; render(); } },
          { sep: 1 },
          { label: 'Exception: every day', keepOpen: 1, fn: () => setDays([1, 1, 1, 1, 1, 1, 1]) },
          { label: 'Exception: weekdays', keepOpen: 1, fn: () => setDays([0, 1, 1, 1, 1, 1, 0]) },
          { label: 'Exception: weekend', keepOpen: 1, fn: () => setDays([1, 0, 0, 0, 0, 0, 1]) },
          ...weekOrd().map(d => ({ label: DAYS[d], check: !!effDays(L, it)[d], keepOpen: 1,
            fn: () => { snap(); if (!it.daysEx) { it.days = rd.slice(); it.daysEx = true; } it.days[d] = it.days[d] ? 0 : 1; render(); } })),
        ];
      } },
    { sep: 1 },
    /* ── the link, and the rename it displaces ──
       A linked block's title opens the link, so renaming has to live here.
       Only shown on a block that HAS one: an extra line in the menu for every
       block, to serve the few that go somewhere, is the same clutter in a
       different place. */
    { label: it.link ? 'Change where it goes' : 'Make the title a link',
      fn: () => {
        const now = prompt(
          'Paste an address. The title becomes a link to it.' +
          String.fromCharCode(10) + String.fromCharCode(10) +
          'Leave it empty to remove the link.' + String.fromCharCode(10) +
          'https://todoist.com/app/today' + String.fromCharCode(10) +
          'https://calendar.google.com/calendar/r/day',
          it.link || 'https://');
        if (now === null) return;
        const v = now.trim();
        if (v && !LINK_OK.test(v)) return toast('Only web addresses, starting <b>http</b> or <b>https</b>');
        snap();
        it.link = v || '';
        syncKin(it, { link: it.link });
        render();
        toast(v ? '<b>' + esc(it.name) + '</b> opens that now' : 'link removed');
      } },
    ...(it.link ? [{ label: 'Rename', fn: () => {
        const v = (prompt('Rename this block', it.name) || '').replace(/\s+/g, ' ').trim();
        if (!v || v === it.name) return;
        snap(); it.name = v; syncKin(it, { name: v }); ensureInBin(it); render();
      } }] : []),
    { label: it.note ? 'Edit note' : 'Add note', fn: () => { it.noteOpen = true; it.compact = false; render(); } },
    { label: 'Pin position', check: !!it.pin, fn: () => { snap(); it.pin = !it.pin; render(); } },
    { label: 'Timeless — no clock, just a to-do', check: !!it.timeless,
      fn: () => { snap(); it.timeless = !it.timeless; render(); } },
    { label: 'Ongoing / multi-tasked', check: !!it.ongoing,
      fn: () => { snap(); it.ongoing = !it.ongoing; render(); toast(it.ongoing ? 'the blocks after it now run <b>alongside</b> it' : 'back in the queue'); } },
    { label: isMini(it) ? 'Expand to full card' : 'Compact to one line', check: isMini(it),
      fn: () => { it.compact = !isMini(it); render(); } },
    { sep: 1 },
    { label: 'Add to every day', k: kinOf(it).length ? kinOf(it).length + ' linked' : '',
      fn: () => { snap(); ensureInBin(it); const n = spreadToAllDays(laneId, it); render(); toast(n ? 'added to <b>' + n + '</b> other day' + (n > 1 ? 's' : '') + ' — edits stay in sync' : 'already in every day'); } },
    { label: 'Hide in this day', check: !!it.hidden,
      fn: () => { snap(); it.hidden = !it.hidden; render(); toast(it.hidden ? 'hidden here — it still runs in your other days' : 'back in'); } },
    ...(kinOf(it).length ? [{ label: 'Unlink from its copies', fn: () => { snap(); it.srcId = uid(); ensureInBin(it); render(); toast('unlinked — edits here stay here'); } }] : []),
    { sep: 1 },
    { label: 'Move to routine', sub: S.lanes.filter(L => L.id !== laneId).map(L => ({
        label: L.name, fn: () => { const f = findItem(it.id); snap(); f.arr.splice(f.i, 1); items(L.id).push(it); render(); } })) },

function promptTime(msg, cur, fn) {

/** setting the finish time is just duration arithmetic — end before start means it runs past midnight */
function editEnd(node, it, s) {

}

/* ---------- week view ---------- */

    const b2 = el('button', S.weekMode === k ? 'on' : '', label);

    b2.onclick = () => { S.weekMode = k; render(); };
    seg.appendChild(b2);
  });
  bar.appendChild(seg);
  const kd = el('button', 'btn sm' + (S.keepDone ? ' acc' : ''), S.keepDone ? '✓ showing done' : '⊘ hiding done');
  kd.dataset.tip = 'Keep finished blocks visible in the week, or clear them out as you go';
  kd.onclick = () => { S.keepDone = !S.keepDone; render(); };
  bar.appendChild(kd);
  const ws = el('button', 'btn sm', 'starts ' + (S.weekStart === 'today' ? 'today' : DSHORT[S.weekStart]));

  ws.onclick = ev => openMenu(ev.clientX, ev.clientY, [{ head: 'Week starts on' },

    { sep: 1 },
    ...[0, 1, 6].map(k => ({ label: DAYS[k], check: S.weekStart === k, fn: () => { S.weekStart = k; render(); } }))]);
  bar.appendChild(ws);
  const done = weekOrd().reduce((a, d) => a + (variant(S.week[d]) ? 1 : 0), 0);
  bar.appendChild(el('span', 'wbnote', done + '/7 weekdays assigned'));
  w.appendChild(bar);
  weekCols().forEach(col => {
    const d = col.d;
    /* what actually runs that day, which a one-off can take over */
    const one = oneOffFor(col.key);

    sel.dataset.tip = 'Which day runs on ' + DAYS[d] + '?';

       made it look like a day he had built and named. It is the absence of
       one. */
    sel.appendChild(el('option', null, '— none —')).value = '';
    /* One-offs are not on the menu: they belong to a date, not to a weekday,
       and offering one here would ask you to run Tuesday's shoot every week. */
    templates().forEach(x => { const o = el('option', null, esc(x.name)); o.value = x.id; if (x.id === vid) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => {
      snap(); S.week[d] = sel.value || null;
      /* a routine put on Saturday whose blocks are all set to weekdays would silently vanish — offer the fix up front */
      const nv = variant(S.week[d]);
      if (nv) {
        const off = withVariant(nv.id, () => LANES(nv.id).flatMap(l => items(l.id).map(it => ({ l, it }))).filter(({ l, it }) => !effDays(l, it)[d]).map(({ it }) => it));
        if (off.length && confirm(nv.name + ' now runs on ' + DAYS[d] + ', but ' + off.length + ' of its blocks aren\'t set to run that day.\n\nTurn ' + DSHORT[d] + ' on for them?')) {
          off.forEach(it => { if (!it.daysEx) { it.days = [1,1,1,1,1,1,1]; it.daysEx = true; } it.days[d] = 1; });
        }

    if (v) {
      const rows = withVariant(v.id, () => LANES(v.id).map(L => ({ L, sc: schedule(L.id).filter(r => effDays(L, r.it)[d]) })).filter(x => x.sc.length));
      const mins = rows.reduce((a, x) => a + x.sc.reduce((b, r) => b + r.it.dur, 0), 0);
      const load = rows.reduce((a, x) => a + x.sc.reduce((b, r) => b + loadOf(r.it), 0), 0);

      const chk = checkRules(v.id);
      meta.appendChild(el('span', null, nblocks + (nblocks === 1 ? ' block' : ' blocks')));
      meta.appendChild(el('span', null, dur2s(mins)));

      const off = withVariant(v.id, () => LANES(v.id).flatMap(l => items(l.id).map(it => ({ l, it }))).filter(({ l, it }) => !effDays(l, it)[d]).map(({ it }) => it));
      if (off.length) {

        b.style.cursor = 'pointer';
        b.onclick = () => { snap(); off.forEach(it => { if (!it.daysEx) { it.days = [1,1,1,1,1,1,1]; it.daysEx = true; } it.days[d] = 1; }); render(); };
        meta.appendChild(b);
      }
      head.appendChild(meta);

      const body = el('div', 'day-body');
      const names = rows.flatMap(x => x.sc.map(r => tickKey(r.it, x.L)));
      /* priority mode: one flat list per day, P1 first, routine shown as the subtitle */
      const groups = S.weekMode === 'pri'
        ? [1, 2, 3, 0].map(k => ({
            L: { name: k ? 'P' + k : 'Unflagged', pri: k },
            sc: rows.flatMap(x => x.sc.filter(r => (r.it.pri || 0) === k).map(r => Object.assign({ from: x.L }, r))),
          })).filter(g => g.sc.length)
        : rows;
      groups.forEach(({ L, sc }) => {
        const shown = sc.filter(r => S.keepDone || !isDoneOn(r.it, col, r.from || L));
        if (!shown.length) return;
        body.appendChild(el('div', 'day-lane' + (L.pri ? ' p' + L.pri : ''), esc(L.name)));
        shown.forEach(({ it, s, from }) => {
          const on = isDoneOn(it, col, from || L);
          const r = el('div', 'day-b' + (on ? ' isdone' : '')); r.style.setProperty('--c', it.color);
          r.appendChild(el('i'));
          const ck = el('button', 'day-ck' + (on ? ' on' : '') + (col.isFuture ? ' fut' : ''), on ? '✓' : '');
          ck.dataset.tip = col.isToday ? (on ? 'Done today — click to un-tick' : 'Tick it off')
            : col.isPast ? 'Backfill <b>' + DSHORT[d] + ' ' + col.date.getDate() + '</b> — ticks belong to that date, not to the block'
            : 'Not yet — you can tick this on the day';
          ck.onclick = ev => { ev.stopPropagation(); setDoneOn(it, col, names, from || L); };
          r.appendChild(ck);
          r.appendChild(el('span', null, (S.weekMode !== 'pri' && it.pri ? '<b style="color:#ff8a9c">' + PRI[it.pri] + '</b> ' : '') + esc(it.name)));
          r.appendChild(el('em', null, S.weekMode === 'pri' && from ? esc(from.name) : (s == null ? '◷' : fmt(s))));
          r.dataset.tip = '<b>' + esc(it.name) + '</b> — ' + dur2s(it.dur) + ', ' + ENAME[energyOf(it)] + ' effort' +
            (from ? '<br>' + esc(from.name) + (s == null ? '' : ' · ' + fmt(s)) : '');
          body.appendChild(r);
        });
      });
      if (!rows.length) body.appendChild(el('div', 'day-rest', 'nothing scheduled on ' + DSHORT[d]));
      colEl.appendChild(body);
      const ed = el('button', 'day-edit', '✎ edit ' + esc(v.name));
      ed.onclick = () => { S.current = v.id; S.view = 'day'; render(); };
      colEl.appendChild(ed);
    } else {
      head.appendChild(meta);
      colEl.appendChild(head);
      colEl.appendChild(el('div', 'day-body', '<div class="day-rest">— rest day —<br><span style="opacity:.6">pick a routine above</span></div>'));
    }
    w.appendChild(colEl);
  });
}


/* ---------- every and anytime: the two rhythms beyond the week ----------
   Tom, 2026-09-14. Everything else on this board repeats weekly: a day sits on
   weekdays, and a routine or a block can be switched off on some of them. Two
   things do not fit that. A deload, a monthly review or a haircut comes round
   every so many days, weeks or months. Gym three times or reading four times
   comes round a number of times a week, on no particular day and at no set
   time. Each has its own tab rather than a place on the day, which is what he
   asked for.

   One row each, type `rhythm`. Never folded into the settings: the settings
   are everything that is not a list, and a list saved as a setting is a blob.

   What got done is not stored here. It is the shared tick log, filed under
   the slug of the name with no routine on it, so a tick for the same name
   from anywhere in the suite counts, and a Block of that name inside a
   routine (filed as name.routine) is not mixed up with it.

   Missed is OWED, Tom's call: an Every block keeps showing until it is done,
   and the next one is counted from the day it was done, not the day it was
   due. */
const RH_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const RH_UNIT = { day: ['day', 'days'], week: ['week', 'weeks'], month: ['month', 'months'] };
const rhythms = kind => (S.rhythms || (S.rhythms = [])).filter(r => r.kind === kind);
const rhTick = r => (window.LifeOS ? LifeOS.slug(r.name) : null);
const rhDate = k => { const d = new Date(k + 'T12:00:00'); return DSHORT[d.getDay()] + ' ' + d.getDate() + ' ' + RH_MON[d.getMonth()]; };
const rhEvery = r => 'every ' + (r.n > 1 ? r.n + ' ' + RH_UNIT[r.unit][1] : RH_UNIT[r.unit][0]);
const rhTimes = r => (r.times === 1 ? 'once' : r.times + ' times') + ' a week';

/** A date moved on by n days, weeks or months. A month keeps its day where
    the month has one and takes its last day where it does not, so the 31st
    of January is followed by the 28th of February, not the 3rd of March. */
function rhAdd(date, n, unit) {
  if (unit === 'day') return Day.shift(date, n);
  if (unit === 'week') return Day.shift(date, 7 * n);
  const [y, m, d] = date.split('-').map(Number);
  const first = new Date(y, m - 1 + n, 1, 12);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12).getDate();
  return first.getFullYear() + '-' + pad(first.getMonth() + 1) + '-' + pad(Math.min(d, last));
}
/** Every day each tick was made, by tick id, oldest first. Nothing in the future. */
function rhLog() {
  const m = {}, today = todayKey();
  if (window.Rec) Rec.all('tick').forEach(t => { if (t.date && t.date <= today) (m[t.key] || (m[t.key] = [])).push(t.date); });
  Object.keys(m).forEach(k => m[k].sort());
  return m;
}
/** Where an Every block stands. Pure, so the self-test can hand it any dates. */
function everyState(r, dates, today) {
  const last = dates.length ? dates[dates.length - 1] : null;
  if (last === today) return { st: 'done', last: last, next: rhAdd(today, r.n, r.unit) };
  const due = last ? rhAdd(last, r.n, r.unit) : (r.from || today);
  const late = Day.diff(today, due);
  return { st: late > 0 ? 'owed' : late === 0 ? 'due' : 'later', last: last, due: due, late: late };
}
/** The first day of the week today sits in, by the "week starts on" setting.
    Set to today, the week is the last seven days. */
function rhWeekStart(today, start) {
  if (start === 'today') return Day.shift(today, -6);
  const dow = new Date(today + 'T12:00:00').getDay();
  return Day.shift(today, -((dow - (start == null ? 1 : start) + 7) % 7));
}
function anytimeState(r, dates, today, start) {
  const from = rhWeekStart(today, start);
  const n = dates.filter(d => d >= from && d <= today).length;
  return { n: n, of: r.times, met: n >= r.times, today: dates.indexOf(today) >= 0 };
}

function rhToggle(r, date, force) {
  const id = rhTick(r);
  if (!id) return toast('the shared tick log did not load, so this cannot be ticked');
  date = date || todayKey();
  const on = force != null ? force : !LifeOS.isDone(id, date);
  LifeOS.done(id, date, on, { src: 'block' });
  if (on && typeof beep === 'function') beep('done');
  render();
}

function rhGroup(p, title, rows) {
  if (!rows.length) return;
  const sec = el('div', 'rhsec');
  sec.appendChild(el('div', 'sumh', title));
  rows.forEach(x => sec.appendChild(x));
  p.appendChild(sec);
}

function rhRow(r, meta, status, cls) {
  const row = el('div', 'rhrow' + (cls ? ' ' + cls : ''));
  row.style.setProperty('--c', r.color || PAL[0]);
  row.dataset.rh = r.id;
  const ck = el('button', 'rhck' + (meta.done ? ' on' : ''));
  ck.setAttribute('aria-label', meta.done ? 'Untick today' : 'Tick today');
  ck.dataset.tip = meta.done ? 'Done today. Click to untick.' : 'Done it today';
  const box = el('span', 'rhbox');
  if (meta.done) { box.dataset.icon = 'done'; box.dataset.iconSize = '12'; }
  ck.appendChild(box);
  ck.onclick = e => { e.stopPropagation(); rhToggle(r); };
  row.appendChild(ck);
  row.appendChild(el('span', 'rhn', esc(r.name)));
  if (meta.extra) row.appendChild(meta.extra);
  row.appendChild(el('span', 'rhm', meta.how));
  row.appendChild(el('span', 'rhs' + (meta.tone ? ' ' + meta.tone : ''), status));
  const more = el('button', 'btn rhmore');
  more.dataset.icon = 'more';
  more.setAttribute('aria-label', 'More');
  more.dataset.tip = 'Done on another day, change, rename, delete';
  more.onclick = e => { e.stopPropagation(); const b = more.getBoundingClientRect(); rhMenu(r, b.left, b.bottom); };
  row.appendChild(more);
  row.oncontextmenu = e => { e.preventDefault(); rhMenu(r, e.clientX, e.clientY); };
  return row;
}

function rhAddBar(kind) {
  const f = el('div', 'rhadd');
  const name = document.createElement('input');
  name.type = 'text'; name.className = 'rhname'; name.autocomplete = 'off';
  name.placeholder = kind === 'every' ? 'Deload week, monthly review, haircut…' : 'Gym, read, stretch…';
  f.appendChild(name);
  const num = (v, min, max) => { const i = document.createElement('input'); i.type = 'number'; i.min = min; if (max) i.max = max; i.value = v; i.className = 'rhnum'; return i; };
  let n, unit, from, times;
  if (kind === 'every') {
    f.appendChild(el('span', 'rhword', 'every'));
    n = num(2, 1); f.appendChild(n);
    unit = document.createElement('select'); unit.className = 'rhunit';
    ['day', 'week', 'month'].forEach(u => { const o = document.createElement('option'); o.value = u; o.textContent = RH_UNIT[u][1]; o.selected = u === 'week'; unit.appendChild(o); });
    f.appendChild(unit);
    f.appendChild(el('span', 'rhword', 'first due'));
    from = document.createElement('input'); from.type = 'date'; from.value = todayKey(); from.className = 'rhfrom';
    f.appendChild(from);
  } else {
    times = num(3, 1, 7); f.appendChild(times);
    f.appendChild(el('span', 'rhword', 'times a week'));
  }
  const go = el('button', 'btn acc rhgo', 'Add');
  const add = () => {
    const nm = name.value.trim();
    if (!nm) { name.focus(); return toast('give it a name first'); }
    /* the ticks are filed by name, so two with one name would share them */
    if ((S.rhythms || []).some(x => x.name.toLowerCase() === nm.toLowerCase())) return toast('<b>' + esc(nm) + '</b> is already on Every or Anytime');
    const r = { id: uid(), kind: kind, name: nm, color: PAL[Math.floor(Math.random() * PAL.length)] };
    if (kind === 'every') { r.n = Math.max(1, Math.round(+n.value || 1)); r.unit = unit.value; r.from = from.value || todayKey(); }
    else r.times = clamp(Math.round(+times.value || 1), 1, 7);
    snap(); rhythms(kind); S.rhythms.push(r); render();
    const again = $('#' + kind + ' .rhname'); if (again) again.focus();
  };
  go.onclick = add;
  f.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  f.appendChild(go);
  return f;
}

function renderEvery() {
  const p = $('#every'); p.innerHTML = '';
  const bar = el('div', 'weekbar');
  bar.appendChild(el('span', 'wbnote', 'Comes round every few days, weeks or months. Missed, it stays owed until it is done.'));
  p.appendChild(bar);
  p.appendChild(rhAddBar('every'));
  const log = rhLog(), today = todayKey();
  const list = rhythms('every').map(r => ({ r: r, s: everyState(r, log[rhTick(r)] || [], today) }));
  if (!list.length) { p.appendChild(el('div', 'hint', 'Nothing here yet. Name one above and say how often it comes round.')); return; }
  const how = x => rhEvery(x.r) + (x.s.last ? ', last done ' + rhDate(x.s.last) : ', not done yet');
  const by = st => list.filter(x => x.s.st === st);
  rhGroup(p, 'Owed', by('owed').sort((a, b) => b.s.late - a.s.late)
    .map(x => rhRow(x.r, { how: how(x), tone: 'owed' }, 'owed since ' + rhDate(x.s.due))));
  rhGroup(p, 'Due today', by('due').map(x => rhRow(x.r, { how: how(x), tone: 'due' }, 'due today')));
  rhGroup(p, 'Done today', by('done').map(x => rhRow(x.r, { how: rhEvery(x.r), done: true }, 'next ' + rhDate(x.s.next), 'isdone')));
  rhGroup(p, 'Coming up', by('later').sort((a, b) => (a.s.due < b.s.due ? -1 : 1))
    .map(x => rhRow(x.r, { how: how(x) }, rhDate(x.s.due) + (x.s.late === -1 ? ', tomorrow' : ', in ' + (-x.s.late) + ' days'))));
}

function renderAnytime() {
  const p = $('#anytime'); p.innerHTML = '';
  const today = todayKey(), start = S.weekStart, from = rhWeekStart(today, start);
  const bar = el('div', 'weekbar');
  bar.appendChild(el('span', 'wbnote', 'Done a few times a week, on any day. ' +
    (start === 'today' ? 'Counting the last seven days.' : 'This week is ' + rhDate(from) + ' to ' + rhDate(Day.shift(from, 6)) + '.')));
  p.appendChild(bar);
  p.appendChild(rhAddBar('anytime'));
  const log = rhLog();
  const list = rhythms('anytime').map(r => ({ r: r, s: anytimeState(r, log[rhTick(r)] || [], today, start) }));
  if (!list.length) { p.appendChild(el('div', 'hint', 'Nothing here yet. Name one above and say how many times a week.')); return; }
  const dots = s => { const d = el('span', 'rhdots'); for (let i = 0; i < Math.max(s.of, s.n); i++) d.appendChild(el('i', i < s.n ? 'on' : '')); return d; };
  const row = x => rhRow(x.r, { how: rhTimes(x.r), done: x.s.today, extra: dots(x.s) }, x.s.n + ' of ' + x.s.of, x.s.met ? 'met' : '');
  rhGroup(p, 'This week', list.filter(x => !x.s.met).map(row));
  rhGroup(p, 'Done for this week', list.filter(x => x.s.met).map(row));
}

/* Only Every carries a number on its tab: owed or due today. A count of
   Anytime habits not yet met would read as a debt every Monday morning. */
function rhBadge() {
  const b = $('#vEvery'); if (!b) return;
  const log = rhLog(), today = todayKey();
  const n = rhythms('every').filter(r => { const s = everyState(r, log[rhTick(r)] || [], today).st; return s === 'owed' || s === 'due'; }).length;
  b.innerHTML = 'Every' + (n ? '<span class="vbadge">' + n + '</span>' : '');
}

function rhMenu(r, x, y) {
  const every = r.kind === 'every';
  openMenu(x, y, [
    { head: r.name },
    { label: 'Done on another day…', fn: () => rhBackfill(r) },
    { label: every ? 'How often…' : 'Times a week…', fn: () => rhEdit(r) },
    { label: 'Rename…', fn: () => {
        const v = prompt('Name', r.name), nm = v && v.trim();
        if (!nm || nm === r.name) return;
        if ((S.rhythms || []).some(z => z !== r && z.name.toLowerCase() === nm.toLowerCase())) return toast('<b>' + esc(nm) + '</b> is already on Every or Anytime');
        snap();
        /* The ticks are filed under the name, so a new name starts a fresh
           page, as renaming a block on the board does. An Every block keeps
           its place in the schedule by taking the date it was next due. */
        if (every) { const s = everyState(r, rhLog()[rhTick(r)] || [], todayKey()); r.from = s.st === 'done' ? s.next : s.due; }
        r.name = nm; render();
      } },
    { sep: 1 },
    { label: 'Delete', fn: () => {
        const at = S.rhythms.indexOf(r);
        snap(); S.rhythms.splice(at, 1); render();

        else toast(esc(r.name) + ' deleted. Its ticks are kept.');
      } },
  ]);
}

/* ── what Every and Anytime put on one day ──
   Tom, 2026-09-14, "Build everything", answering whether an owed Every block
   should also show on the Day. They still live on their own tabs; this reads
   those tabs for one date, for the Day board and for the published plan:
   what is owed or due, what is still to do this week, and what was ticked
   that day. Counted only from ticks up to that day, so a date you step back
   to reads as it stood then. */
function rhFor(day, log) {
  const out = [];
  rhythms('every').forEach(r => {
    const s = everyState(r, (log[rhTick(r)] || []).filter(d => d <= day), day);
    if (s.st === 'owed') out.push({ r: r, done: false, tone: 'owed', why: 'owed since ' + rhDate(s.due) });
    else if (s.st === 'due') out.push({ r: r, done: false, tone: 'due', why: 'due' });
    else if (s.st === 'done') out.push({ r: r, done: true, why: 'done, next ' + rhDate(s.next) });
  });
  rhythms('anytime').forEach(r => {
    const s = anytimeState(r, (log[rhTick(r)] || []).filter(d => d <= day), day, S.weekStart);
    if (s.today || !s.met) out.push({ r: r, done: s.today, why: s.n + ' of ' + s.of + ' this week' });
  });
  return out;
}

/* The column on the Day. Not a routine, so nothing in it drags, and a future
