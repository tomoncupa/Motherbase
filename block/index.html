<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLOCK — routine scheduler</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<!-- No font link. skins.js fetches the face the chosen theme asks for and
     falls back to a system stack offline; a link here meant every theme
     rendered in Chakra Petch. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  /* ── the bridge ──
     Fifteen fixed values, which is what BLOCK's whole look used to be. It was
     a good look, and it is now a theme called Block that any app in the suite
     can wear — which is exactly why this app must stop hard-coding it. An app
     that paints its own colours cannot be re-themed, including back into the
     one it started with.

     Every rule below still says --panel and --txt and did not change. --bg and
     --warn are gone rather than aliased: those are already skin tokens under
     those names, and redefining them here shadowed the theme with a copy. */
  --panel:var(--surface-1);  --panel2:var(--surface-2);
  --line:var(--border);      --line2:var(--border-strong);
  --txt:var(--text-1);       --dim:var(--text-2);   --dim2:var(--text-muted);
  --acc:var(--accent);
  /* the dim accent used for edges and rings, mixed live so a colour edit
     reaches it instead of leaving it behind */
  --acc-d:color-mix(in srgb, var(--accent) 34%, var(--bg));
  --bad:var(--danger);       --good:var(--success);
  --f1:var(--font-display);  --f2:var(--font-body);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, var(--surface-2) 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 100%, color-mix(in srgb, var(--info) 14%, var(--bg)) 0%, transparent 55%),
    var(--bg);
  color:var(--txt); font-family:var(--f2); font-size:13px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:12px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:rgba(10,15,22,.85);backdrop-filter:blur(8px);flex:0 0 auto;
}
.logo{font-family:var(--f1);font-weight:700;font-size:17px;letter-spacing:.14em;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.logo b{color:var(--acc)}
.views{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--surface-1);flex:0 0 auto}
.views button{
  padding:4px 13px;border-radius:6px;font-family:var(--f1);font-size:12px;letter-spacing:.08em;color:var(--dim);
}
/* A selected tab is the accent with --accent-fg on it. Never a hand-picked
   pair: --accent-fg is worked out from the accent by the engine, so it stays
   legible on a theme whose accent is nearly white and on one where it is
   nearly black. This was a two-stop gradient with the accent as text, which
   measured 1.53 on Minecraft -- a tab you could see was selected and could
   not read. */
.views button.on{background:var(--accent);color:var(--accent-fg);box-shadow:0 0 0 1px var(--acc-d)}
#tabs{display:flex;gap:6px;align-items:center;overflow-x:auto;flex:1;padding:2px;min-width:0}
.tab{
  padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  font-family:var(--f1);font-size:12px;letter-spacing:.04em;color:var(--dim);white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.tab:hover{border-color:var(--line2);color:var(--txt)}
.tab.on{border-color:var(--acc);color:var(--acc);background:linear-gradient(180deg,var(--surface-2),var(--surface-2))}
.tab .x,.tab .cp{opacity:0;font-size:11px}
.tab:hover .x,.tab:hover .cp{opacity:.45}
.tab .x:hover{opacity:1;color:var(--bad)}
.tab .cp:hover{opacity:1;color:var(--acc)}
.tab .daypip{font-size:9px;color:var(--dim2);letter-spacing:.06em}
.hbtns{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.btn{
  padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  font-family:var(--f1);font-size:12px;letter-spacing:.04em;color:var(--txt);white-space:nowrap;
  transition:border-color .12s,background .12s,color .12s;
}
.btn:hover{border-color:var(--line2);background:var(--panel2)}
.btn.acc{border-color:var(--acc-d);color:var(--acc)}
.btn.acc:hover{border-color:var(--acc);background:var(--surface-2)}
.btn.sm{padding:3px 7px;font-size:11px;border-radius:5px}
.btn .bad{color:var(--bad)}
main{display:flex;flex:1;min-height:0}

/* ---------- date strip ---------- */
/* One group, so it reads as one control rather than three loose buttons: the
   arrows sit tight against the date and the whole thing is spaced away from
   what surrounds it. */
#datebar{display:flex;align-items:center;gap:2px;flex:0 0 auto;min-width:0;margin-right:6px}
.dnav{width:24px;height:30px;border-radius:6px;color:var(--dim);font-size:15px;line-height:1}
.dnav:hover{background:var(--panel2);color:var(--txt)}
.datenow{display:flex;align-items:baseline;gap:6px;padding:0 8px;height:30px;border-radius:6px}
.datenow:hover{background:var(--panel2)}
.datenow b{font-size:12.5px;color:var(--txt);font-weight:600;white-space:nowrap}
.datenow em{font-style:normal;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.datenow span{font-size:10.5px;color:var(--dim2);white-space:nowrap}
/* present for the picker, never seen: the label above is what you click */
.datejump{position:absolute;width:0;height:0;opacity:0;pointer-events:none;border:0;padding:0}
.dtoday{padding:0 9px;height:30px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);font-size:11px;color:var(--dim);margin-left:4px}
.dtoday:hover{border-color:var(--acc-d);color:var(--acc)}

/* ---------- bin ---------- */
#bin{
  width:238px;flex:0 0 auto;border-right:1px solid var(--line);background:rgba(12,17,24,.6);
  display:flex;flex-direction:column;min-height:0;
}
.bin-tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);flex:0 0 auto}
.bin-tabs button{flex:1;padding:8px 6px;font-family:var(--f1);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim2);border-bottom:2px solid transparent;font-weight:600}
.bin-tabs button:hover{color:var(--txt)}
.bin-tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.bin-tabs .binhide{flex:0 0 auto;width:26px;padding:0;font-size:13px;letter-spacing:0;border-bottom-color:transparent}
#bin.hid{display:none}
#binShow{display:none;flex:0 0 auto;width:20px;border-right:1px solid var(--line);
  background:rgba(12,17,24,.6);color:var(--dim);font-size:13px}
#binShow:hover{color:var(--acc);background:var(--panel2)}
#binShow.on{display:block}
#routinelist{flex:1;overflow-y:auto;padding:9px}
#routinelist.hide{display:none}
.rchip{display:flex;align-items:center;gap:8px;padding:8px 9px;margin-bottom:5px;
  border:1px solid var(--line);border-radius:6px;background:var(--panel);
  cursor:pointer;text-align:left;width:100%}
.rchip:hover{background:var(--panel2);border-color:var(--line2)}
.rchip.on{border-color:var(--acc-d);background:var(--surface-2)}
.rchip .tick{flex:0 0 14px;font-size:11px;color:var(--acc);line-height:1}
.rchip .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.rchip.on .nm{color:var(--txt)}
.rchip .wh{font-family:var(--f1);font-size:9.5px;color:var(--dim2);flex:0 0 auto}
.bin-head{padding:10px 11px 8px;border-bottom:1px solid var(--line)}
.bin-head h2{font-family:var(--f1);font-size:11px;letter-spacing:.16em;color:var(--dim);font-weight:600;text-transform:uppercase;margin-bottom:3px}
.bin-head p{font-size:10.5px;color:var(--dim2);line-height:1.4;margin-bottom:8px}
#search{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface-1);font-size:12px;outline:none}
#search:focus{border-color:var(--acc-d)}
#binlist{flex:1;overflow-y:auto;padding:9px}
.cat{font-family:var(--f1);font-size:10px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase;margin:11px 0 6px;padding-left:2px}
.cat:first-child{margin-top:0}
.binempty{padding:14px 4px 12px;line-height:1.5}
.binempty b{display:block;font-size:12.5px;color:var(--txt);margin-bottom:4px}
.binempty span{display:block;font-size:10.5px;color:var(--dim2)}
.dayempty{flex:1;min-width:260px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  padding:22px;border:1px dashed var(--line2);border-radius:10px;background:var(--panel)}
.dayempty b{font-size:13px;color:var(--txt)}
.dayempty span{font-size:11px;color:var(--dim2);line-height:1.5}
.chip{
  position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:4px;
  border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;background:var(--panel);
  cursor:grab;touch-action:none;user-select:none;
}
.chip:hover{background:var(--panel2);border-color:var(--line2);border-left-color:var(--c)}
.chip .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .mn{font-family:var(--f1);font-size:10.5px;color:var(--dim2)}
.chip .eg{font-size:9px;color:var(--dim2)}
.chip .del{opacity:0;font-size:11px;color:var(--dim);padding:0 2px}
.chip:hover .del{opacity:.6}
.chip .del:hover{color:var(--bad);opacity:1}
.chip.tpl{border-left-color:var(--acc);background:var(--surface-2)}
.bin-foot{padding:9px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#newform{display:none;flex-direction:column;gap:6px}
#newform.on{display:flex}
#newform input,#newform select{padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface-1);outline:none;font-size:12px}
#newform input:focus{border-color:var(--acc-d)}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.sw{width:18px;height:18px;border-radius:5px;border:2px solid transparent}
.sw.on{border-color:var(--text-1)}

/* ---------- board ---------- */
#board{flex:1;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:12px;min-width:0;align-items:flex-start}
#board.hide,#week.hide{display:none}
.lane{
  flex:0 0 264px;display:flex;flex-direction:column;max-height:100%;min-height:0;
  border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,rgba(19,27,38,.75),rgba(11,16,23,.55));
}
.lane.focus{border-color:var(--border-strong)}
.lane.dragging{opacity:.65;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.lane-grip{color:var(--dim2);font-size:12px;cursor:grab;padding:0 2px;touch-action:none;opacity:.35}
.lane:hover .lane-grip{opacity:1}
.lane-arr{color:var(--dim2);font-size:9px;padding:2px 3px;opacity:0}
.lane:hover .lane-arr{opacity:.6}
.lane-arr:hover{color:var(--acc);opacity:1}
.bin-target{
  display:flex;align-items:center;gap:6px;width:100%;margin-top:7px;padding:5px 8px;border:1px solid var(--line);
  border-radius:6px;background:var(--surface-1);font-size:11.5px;color:var(--dim);
}
.bin-target:hover{border-color:var(--acc-d);color:var(--txt)}
.bin-target b{color:var(--acc);font-family:var(--f1);font-weight:600;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane.over{border-color:var(--acc-d);box-shadow:0 0 0 1px var(--acc-d)}
.lane-head{padding:9px 10px 8px;border-bottom:1px solid var(--line)}
.lane-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.lane-name{
  flex:1;background:none;border:1px solid transparent;border-radius:5px;padding:2px 5px;
  font-family:var(--f1);font-size:13.5px;font-weight:600;letter-spacing:.05em;outline:none;min-width:0;
}
.lane-name:hover{border-color:var(--line)}
.lane-name:focus{border-color:var(--acc-d);background:var(--surface-1)}
.lane-x{color:var(--dim2);font-size:12px;padding:2px 4px;opacity:0}
.lane:hover .lane-x{opacity:.55}
.lane-x:hover{color:var(--bad);opacity:1}
.lane-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.lane-row input[type=time]{
  background:var(--surface-1);border:1px solid var(--line);border-radius:5px;padding:2px 5px;
  font-family:var(--f1);font-size:11.5px;color:var(--acc);outline:none;
}
.lane-row input[type=time]:focus{border-color:var(--acc-d)}
.lane-row .end{font-family:var(--f1);color:var(--txt)}
.lane-meta{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap;font-size:10.5px;color:var(--dim2);font-family:var(--f1);letter-spacing:.04em}
.lane-meta .tag{padding:1px 5px;border:1px solid var(--line);border-radius:4px}
.lane-meta .tag.over{border-color:color-mix(in srgb, var(--danger) 34%, var(--bg));color:var(--bad)}
.lane-meta .tag.ok{border-color:color-mix(in srgb, var(--success) 30%, var(--bg));color:var(--good)}
.lane-meta .tag.warn{border-color:color-mix(in srgb, var(--warn) 32%, var(--bg));color:var(--warn)}
.bars{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.prog{height:3px;border-radius:2px;background:var(--surface-1);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb, var(--success) 55%, var(--accent)),var(--good));transition:width .25s}
.loadbar{display:flex;height:5px;gap:1px;border-radius:3px;overflow:hidden;background:var(--surface-1)}
.loadbar i{display:block;height:100%}
.lane-tools{display:flex;gap:4px;margin-top:8px}
.lane-tools .btn{flex:1;text-align:center;padding:3px 0;font-size:10.5px;letter-spacing:.05em}
.lane-tools .hov{opacity:.25;transition:opacity .12s}
.lane:hover .lane-tools .hov{opacity:1}
.lane-body{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px;min-height:74px}
.lane-empty{border:1px dashed var(--line2);border-radius:8px;padding:14px 8px;text-align:center;color:var(--dim2);font-size:11.5px;line-height:1.5}
.lane-add{margin:0 9px 9px;padding:5px;border:1px dashed var(--line);border-radius:7px;color:var(--dim2);font-family:var(--f1);font-size:11px;letter-spacing:.06em}
.lane-add:hover{border-color:var(--acc-d);color:var(--acc)}
#addlane{flex:0 0 44px;align-self:stretch;border:1px dashed var(--line);border-radius:11px;color:var(--dim2);font-family:var(--f1);font-size:16px}
#addlane:hover{border-color:var(--acc-d);color:var(--acc)}

/* ---------- block ---------- */
.brick{
  position:relative;border-radius:8px;padding:8px 9px 10px;flex:0 0 auto;
  display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,var(--surface-1)),color-mix(in srgb,var(--c) 13%,var(--surface-1)));
  border:1px solid color-mix(in srgb,var(--c) 40%,var(--surface-1));
  border-top:1px solid color-mix(in srgb,var(--c) 62%,var(--surface-1));
  box-shadow:0 2px 0 color-mix(in srgb,var(--c) 22%,var(--bg)), 0 4px 12px rgba(0,0,0,.35);
  cursor:grab;touch-action:none;user-select:none;
}
.brick.pinned{box-shadow:0 0 0 1px var(--acc) inset,0 2px 0 color-mix(in srgb,var(--c) 22%,var(--bg))}
.brick.done{opacity:.42;filter:saturate(.4)}
.brick.hid{opacity:.3;filter:grayscale(.7);border-style:dashed}
.brick.sel{box-shadow:0 0 0 2px var(--acc),0 4px 14px rgba(0,0,0,.4)}
.brick.ongoing{border-left:3px dashed color-mix(in srgb,var(--c) 75%,var(--surface-1))}
.b-cover{
  position:absolute;left:-1px;right:-1px;top:100%;pointer-events:none;border-radius:0 0 8px 8px;
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 13%,transparent) 0 7px,transparent 7px 14px);
  border:1px dashed color-mix(in srgb,var(--c) 32%,transparent);border-top:0;
}
.b-cover b{position:absolute;bottom:3px;right:6px;font-family:var(--f1);font-size:8.5px;color:color-mix(in srgb,var(--c) 70%,var(--text-1));opacity:.75}
.brick.hid .b-name{text-decoration:line-through;text-decoration-style:dotted}
.b-link{font-family:var(--f1);font-size:9px;color:var(--dim2);opacity:.75}
.brick.done .b-name{text-decoration:line-through;text-decoration-color:var(--dim2)}
.brick.broke{border-color:color-mix(in srgb, var(--danger) 52%, var(--bg))}
.brick.celebrate{animation:cel .5s ease}
@keyframes cel{0%{box-shadow:0 0 0 0 var(--good)}50%{box-shadow:0 0 0 3px rgba(110,231,168,.5)}100%{box-shadow:0 0 0 0 transparent}}
.b-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap;row-gap:2px;min-height:15px}
.b-time{
  font-family:var(--f1);font-size:10.5px;letter-spacing:.04em;color:color-mix(in srgb,var(--c) 80%,var(--text-1));
  border-radius:4px;padding:1px 4px;margin-left:-4px;cursor:text;white-space:nowrap;
}
.b-time:hover{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--line2)}
.b-time.anc{color:var(--acc);box-shadow:0 0 0 1px var(--acc-d)}
.b-time.clash{color:var(--bad);box-shadow:0 0 0 1px color-mix(in srgb, var(--danger) 34%, var(--bg))}
.b-dash{font-family:var(--f1);font-size:10.5px;color:var(--dim2);margin:0 -2px}
.b-timein{background:var(--bg);border:1px solid var(--acc-d);border-radius:4px;color:var(--acc);font-family:var(--f1);font-size:10.5px;padding:1px 3px;outline:none;width:92px}
.b-flag{font-family:var(--f1);font-size:9px;color:var(--dim2);border:1px solid var(--line);border-radius:3px;padding:0 3px;white-space:nowrap}
.b-flag.bad{color:var(--bad);border-color:color-mix(in srgb, var(--danger) 34%, var(--bg))}
.b-sp{flex:1}
.b-dur{font-family:var(--f1);font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:3px}
.b-dur button{color:var(--dim2);padding:0 3px;font-size:12px;line-height:1;opacity:.3;transition:opacity .12s}
.brick:hover .b-dur button{opacity:1}
.b-dur button:hover{color:var(--acc)}
.b-dur b{min-width:30px;text-align:center;color:var(--txt);font-weight:500;border-radius:3px;cursor:text}
.b-dur b:hover{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--line2)}
.b-durin{background:var(--bg);border:1px solid var(--acc-d);border-radius:4px;color:var(--acc);font-family:var(--f1);font-size:10.5px;padding:0 2px;outline:none;width:40px;text-align:center}
.b-main{display:flex;align-items:flex-start;gap:7px}
.b-check{
  flex:0 0 auto;width:16px;height:16px;margin-top:1px;border-radius:5px;border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--border-strong));
  background:rgba(0,0,0,.28);font-size:10px;line-height:1;color:transparent;display:flex;align-items:center;justify-content:center;
}
.b-check:hover{border-color:var(--good);color:rgba(110,231,168,.35)}
.b-check.on{background:var(--good);border-color:var(--good);color:color-mix(in srgb, var(--success) 12%, var(--bg));font-weight:700}
/* struck out and stood down: clearly not outstanding, clearly not done */
.b-check.skip{background:transparent;border-style:dashed;border-color:var(--dim);color:var(--dim);font-weight:700}
.brick.skipped{opacity:.5}
.brick.skipped .b-name{text-decoration:line-through;text-decoration-thickness:1px}
.b-txt{flex:1;min-width:0}
.b-name{font-size:12.5px;line-height:1.28;outline:none;border-radius:4px;padding:1px 2px;margin-left:-2px;word-break:break-word;cursor:text}
.b-name:focus{background:var(--bg);box-shadow:0 0 0 1px var(--acc-d)}
.b-note{font-size:10.5px;color:var(--dim);line-height:1.34;outline:none;padding:1px 2px;margin-left:-2px;border-radius:4px;cursor:text}
.b-note:focus{background:var(--bg);box-shadow:0 0 0 1px var(--acc-d)}
.b-note:empty:before{content:'note…';color:var(--dim2);opacity:.4}
.b-link{color:var(--acc);text-decoration:underline;text-underline-offset:2px;cursor:pointer;word-break:break-all}
.b-link:hover{color:var(--txt)}
.b-foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:5px}
.b-days{display:flex;gap:2px}
.b-days b{
  width:13px;height:13px;border-radius:3px;font-family:var(--f1);font-size:8.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;background:var(--surface-1);color:var(--dim2);
  border:1px solid var(--line);cursor:pointer;
}
.b-days b.on{background:color-mix(in srgb,var(--c) 42%,var(--bg));color:var(--accent-fg);border-color:transparent}
.b-dayex{
  font-family:var(--f1);font-size:9px;letter-spacing:.06em;color:var(--warn);
  border:1px solid color-mix(in srgb, var(--warn) 32%, var(--bg));background:color-mix(in srgb, var(--warn) 15%, var(--bg));border-radius:3px;padding:1px 4px;
}
.b-dayex:hover{border-color:var(--warn)}
.lane-untimed{font-family:var(--f1);font-size:11.5px;color:var(--dim2);border:1px dashed var(--line);border-radius:5px;padding:2px 7px}
.lane-untimed:hover{border-color:var(--acc-d);color:var(--acc)}
.lane-days{font-family:var(--f1);font-size:10.5px;color:var(--dim2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.lane-days:hover{border-color:var(--acc-d);color:var(--acc)}
.b-ctl{margin-left:auto;display:flex;gap:2px;align-items:center}
.b-ctl button{color:var(--dim2);font-size:10.5px;padding:1px 3px;border-radius:4px}
.b-ctl button:hover{color:var(--txt);background:rgba(0,0,0,.44)}
.b-ctl button.on{color:var(--acc)}
.b-ctl .hov{opacity:0;transition:opacity .12s}
.brick:hover .b-ctl .hov{opacity:1}
.b-badge{font-family:var(--f1);font-size:8.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:3px;padding:1px 3px;color:var(--dim2);line-height:1.1}
.b-badge.dim{opacity:0;transition:opacity .12s}
.brick:hover .b-badge.dim{opacity:.55}
.b-badge.p1{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 40%, var(--bg));background:color-mix(in srgb, var(--danger) 18%, var(--bg))}
.b-badge.p2{color:var(--warn);border-color:color-mix(in srgb, var(--warn) 32%, var(--bg));background:color-mix(in srgb, var(--warn) 15%, var(--bg))}
.b-badge.p3{color:var(--info);border-color:var(--info);background:var(--info)}
.b-badge.e1{color:var(--success);border-color:color-mix(in srgb, var(--success) 30%, var(--bg))}
.b-badge.e2{color:var(--warn);border-color:color-mix(in srgb, var(--warn) 32%, var(--bg))}
.b-badge.e3{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 40%, var(--bg));background:color-mix(in srgb, var(--danger) 18%, var(--bg))}
.b-grip{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.b-grip:hover{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c) 45%,transparent))}
/* --- compact row for the one-minute stuff --- */
.brick.mini{flex-direction:row;align-items:center;gap:8px;padding:5px 9px 5px 9px;min-height:0!important}
.brick.mini .b-main{flex:1;min-width:0;align-items:center;gap:7px}
.brick.mini .b-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brick.mini .b-mtime{font-family:var(--f1);font-size:10px;color:color-mix(in srgb,var(--c) 80%,var(--text-1));white-space:nowrap;border-radius:4px;padding:1px 4px;cursor:text}
.brick.mini .b-mtime:hover{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--line2)}
.brick.mini .b-mtime.anc{color:var(--acc)}
.brick.mini .b-mdays{font-family:var(--f1);font-size:9px;color:var(--dim2);white-space:nowrap}
.brick.mini .b-foot{
  position:absolute;top:0;right:0;bottom:0;margin:0;padding:0 8px 0 26px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 17%,var(--surface-1)) 32%);
  opacity:0;transition:opacity .12s;
}
.brick.mini:hover .b-foot{opacity:1}
.brick.mini .b-days,.brick.mini .b-grip{display:none}
.brick.mini .b-ctl .hov{opacity:1}
/* the now line floats OVER the blocks, at the real position inside the current one */
.lane-body{position:relative}
.nowline{
  position:absolute;left:4px;right:4px;z-index:5;pointer-events:none;
  display:flex;align-items:center;gap:5px;transform:translateY(-50%);
}
.nowline i{flex:1;height:2px;background:linear-gradient(90deg,var(--danger),rgba(255,59,92,.3));border-radius:2px;box-shadow:0 0 8px rgba(255,59,92,.55)}
.nowline b{
  font-family:var(--f1);font-size:8.5px;letter-spacing:.08em;color:var(--accent-fg);font-weight:600;
  background:var(--danger);border-radius:3px;padding:1px 4px;box-shadow:0 2px 6px rgba(0,0,0,.45);
}
.nowline em{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:0 0 auto;box-shadow:0 0 8px var(--danger)}
.brick.past{opacity:.5}
.brick.past.done{opacity:.3}
/* proportional mode — an hour looks like an hour; tiny blocks stay legible slivers */
.lane-body.prop{gap:4px;overflow:hidden}
.lane-body.prop .brick{padding:4px 8px;gap:0;overflow:hidden}
.lane-body.prop .brick.squeezed{flex-direction:row;align-items:center;gap:6px;padding:2px 8px}
.lane-body.prop .brick.squeezed .b-top,.lane-body.prop .brick.squeezed .b-foot,
.lane-body.prop .brick.squeezed .b-note,.lane-body.prop .brick.squeezed .b-grip{display:none}
.lane-body.prop .brick.squeezed .b-main{flex:1;align-items:center;min-width:0}
.lane-body.prop .brick.squeezed .b-name{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.lane-body.prop .brick.squeezed .b-check{width:12px;height:12px;font-size:8px;margin:0}
.lane-body.prop .brick.squeezed .b-mtime,.lane-body.prop .brick.squeezed .b-mdays{font-size:8.5px}
.lane-body.prop .b-foot{padding-top:2px}
.lane-body.prop .brick .b-note{display:none}
.placeholder{flex:0 0 auto;border:1px dashed var(--acc);border-radius:8px;background:var(--surface-2);opacity:.7}
#dragghost{position:fixed;z-index:9999;pointer-events:none;opacity:.92;transform:rotate(-1.4deg) scale(1.02);width:240px}
#dragghost.tplghost{
  background:var(--panel2);border:1px solid var(--acc);border-radius:9px;padding:10px 12px;
  font-family:var(--f1);font-size:12px;color:var(--acc);
}

/* ---------- week ---------- */
#week{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;align-content:start}
.weekbar{grid-column:1/-1;display:flex;align-items:center;gap:7px;margin-bottom:2px}
#pri,#sum{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px;max-width:920px}
#pri.hide,#sum.hide{display:none}
.sumcards{display:flex;gap:10px;flex-wrap:wrap}
.sumcard{
  flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);
  display:flex;flex-direction:column;gap:3px;
}
.sumcard b{font-family:var(--f1);font-size:23px;color:var(--acc);font-weight:600;letter-spacing:.02em}
.sumcard span{font-size:11px;color:var(--dim2)}
.sumh{font-family:var(--f1);font-size:11px;letter-spacing:.15em;color:var(--dim2);text-transform:uppercase;margin-bottom:-6px}
.spark{display:flex;align-items:flex-end;gap:4px;height:50px;padding:0 2px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:3px;display:block}
.advice{display:flex;flex-direction:column;gap:8px}
.adv{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.55;background:var(--panel)}
.adv.good{border-left-color:var(--good)}
.adv.note{border-left-color:var(--acc)}
.adv i{font-style:italic}
.histlog{display:flex;flex-direction:column;gap:3px}
.hrow{display:flex;align-items:center;gap:10px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:11.5px}
.hrow .hd2{font-family:var(--f1);width:76px;color:var(--dim);flex:0 0 auto}
.hrow .hbar{flex:1;height:5px;background:var(--surface-1);border-radius:3px;overflow:hidden}
.hrow .hbar i{display:block;height:100%;background:var(--dim2)}
.hrow.full .hbar i{background:var(--good)}
.hrow.half .hbar i{background:var(--warn)}
.hrow.low .hbar i{background:var(--bad)}
.hrow .hn{font-family:var(--f1);font-size:10.5px;color:var(--dim2);width:44px;text-align:right;flex:0 0 auto}
.adv .dim{color:var(--dim)}
.advbtns{display:flex;gap:6px;margin-top:8px}
.prisec h4{font-family:var(--f1);font-size:12px;letter-spacing:.12em;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.prisec h4 span{font-size:10px;color:var(--dim2);letter-spacing:.05em}
.prisec h4.pri1{color:var(--danger)}.prisec h4.pri2{color:var(--warn)}.prisec h4.pri3{color:var(--info)}.prisec h4.pri0{color:var(--dim2)}
.prirow{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-left:3px solid var(--c);
  border-radius:7px;background:var(--panel);margin-bottom:5px;cursor:pointer;
}
.prirow:hover{background:var(--panel2);border-color:var(--line2);border-left-color:var(--c)}
.prirow .pn{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prirow .pw{font-family:var(--f1);font-size:10.5px;color:var(--dim2);white-space:nowrap}
.prirow.isdone .pn{text-decoration:line-through;color:var(--dim2)}
.wbnote{font-family:var(--f1);font-size:10.5px;color:var(--dim2);letter-spacing:.05em}
.day-ck{
  flex:0 0 auto;width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line2);background:rgba(0,0,0,.3);
  font-size:8px;line-height:1;color:transparent;display:flex;align-items:center;justify-content:center;
}
.day-ck:hover{border-color:var(--good)}
.day-ck.on{background:var(--good);border-color:var(--good);color:color-mix(in srgb, var(--success) 12%, var(--bg));font-weight:700}
.day-b.isdone span{text-decoration:line-through;color:var(--dim2)}
.day{border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,rgba(19,27,38,.75),rgba(11,16,23,.55));display:flex;flex-direction:column;min-height:220px}
.day.today{border-color:var(--acc-d);box-shadow:0 0 0 1px var(--acc-d)}
.day.wpast{opacity:.72}
.day-head h3 .dnum{font-size:10px;color:var(--dim2);font-weight:400}
.day-ck.fut{opacity:.35}
.day-head{padding:9px 10px;border-bottom:1px solid var(--line)}
.day-head h3{font-family:var(--f1);font-size:13px;letter-spacing:.09em;display:flex;align-items:center;gap:6px}
.day-head h3 em{font-style:normal;font-size:9px;color:var(--acc);border:1px solid var(--acc-d);border-radius:3px;padding:0 4px}
.day-head select{
  width:100%;margin-top:7px;background:var(--surface-1);border:1px solid var(--line);border-radius:6px;padding:4px 6px;
  font-family:var(--f1);font-size:11.5px;color:var(--txt);outline:none;
}
.day-head select:focus{border-color:var(--acc-d)}
.day-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;font-family:var(--f1);font-size:10px;color:var(--dim2)}
.day-meta span{border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.day-meta span.bad{border-color:color-mix(in srgb, var(--danger) 34%, var(--bg));color:var(--bad)}
.day-body{flex:1;overflow-y:auto;padding:8px 9px;display:flex;flex-direction:column;gap:8px}
.day-lane{font-family:var(--f1);font-size:9.5px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase;margin-top:3px}
.day-lane.p1{color:var(--danger)}.day-lane.p2{color:var(--warn)}.day-lane.p3{color:var(--info)}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--surface-1)}
.seg button{padding:3px 9px;border-radius:5px;font-family:var(--f1);font-size:11px;color:var(--dim)}
.seg button.on{background:var(--accent);color:var(--accent-fg);box-shadow:0 0 0 1px var(--acc-d)}
.donenote{
  flex:0 0 auto;align-self:flex-start;margin-top:4px;padding:7px 11px;border:1px dashed var(--line2);border-radius:9px;
  font-family:var(--f1);font-size:11px;color:var(--good);letter-spacing:.05em;
}
.donenote:hover{border-color:var(--good)}
.day-b{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0;line-height:1.25}
.day-b i{width:3px;align-self:stretch;min-height:12px;border-radius:2px;background:var(--c);flex:0 0 auto}
.day-b span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-b em{font-style:normal;color:var(--dim2);font-family:var(--f1);font-size:9.5px}
.day-rest{padding:18px 8px;text-align:center;color:var(--dim2);font-size:11px}
.day-edit{margin:0 9px 9px;padding:4px;border:1px dashed var(--line);border-radius:7px;color:var(--dim2);font-family:var(--f1);font-size:10.5px;letter-spacing:.05em}
.day-edit:hover{border-color:var(--acc-d);color:var(--acc)}

/* ---------- footer ---------- */
footer{
  flex:0 0 auto;border-top:1px solid var(--line);padding:6px 14px;display:flex;align-items:center;gap:14px;
  font-family:var(--f1);font-size:11px;letter-spacing:.05em;color:var(--dim2);background:rgba(10,15,22,.7);
}
footer b{color:var(--txt);font-weight:500}
footer .sp{flex:1}
.step{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:1px 3px}
.step button{color:var(--dim2);padding:0 4px;font-size:12px;line-height:1}
.step button:hover{color:var(--acc)}
.step b{min-width:26px;text-align:center}
.dayprog{width:80px;height:4px;border-radius:2px;background:var(--surface-1);overflow:hidden;display:inline-block;vertical-align:middle}
.dayprog i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb, var(--success) 55%, var(--accent)),var(--good))}

/* ---------- modal + tooltip ---------- */
#veil{position:fixed;inset:0;background:rgba(4,7,11,.72);backdrop-filter:blur(3px);z-index:500;display:none;align-items:center;justify-content:center;padding:24px}
#veil.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:13px;width:100%;max-width:840px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--f1);font-size:14px;letter-spacing:.1em;font-weight:600;flex:1}
.modal-body{padding:14px;overflow-y:auto;flex:1}
.mtabs{display:flex;gap:5px;padding:10px 14px 0;flex-wrap:wrap}
.mtab{padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-family:var(--f1);font-size:11.5px;color:var(--dim)}
.mtab.on{border-color:var(--acc-d);color:var(--acc);background:var(--surface-2)}
.modal textarea{width:100%;height:250px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.5;color:var(--text-2);resize:vertical;outline:none}
.hint{font-size:11.5px;color:var(--dim);line-height:1.6;margin-bottom:10px}
.hint code,.hint b.k{background:var(--surface-1);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px;color:var(--acc);font-weight:500}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.glinks{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:200px;overflow-y:auto}
.glink{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:11.5px}
.glink span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glink a{color:var(--acc);text-decoration:none;font-family:var(--f1);font-size:11px}
.set{display:grid;grid-template-columns:1fr auto;gap:12px 16px;align-items:center;font-size:12.5px}
.set label{display:flex;flex-direction:column;gap:2px}
.set label span{font-size:10.5px;color:var(--dim2);line-height:1.35}
.set input[type=range]{width:190px;accent-color:var(--acc)}
.set input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.set input[type=text],.set input[type=number],.set select{background:var(--surface-1);border:1px solid var(--line);border-radius:6px;padding:5px 8px;outline:none;min-width:190px}
.set input:focus,.set select:focus{border-color:var(--acc-d)}
.cmp{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.cmp-col{flex:0 0 215px;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--panel2)}
.cmp-col.on{border-color:var(--acc-d)}
.cmp-col h4{font-family:var(--f1);font-size:12.5px;letter-spacing:.06em}
.cmp-col .sub{font-size:10.5px;color:var(--dim2);margin-bottom:8px;font-family:var(--f1)}
.rule{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-size:12px}
.rule.broke{border-color:color-mix(in srgb, var(--danger) 34%, var(--bg));background:color-mix(in srgb, var(--danger) 11%, var(--bg))}
.rule .txt{flex:1;line-height:1.4}
.rule .st{font-family:var(--f1);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--good)}
.rule .st.bad{color:var(--bad);border-color:color-mix(in srgb, var(--danger) 34%, var(--bg))}
.rule input[type=checkbox]{accent-color:var(--acc)}
.rulebuild{border:1px dashed var(--line2);border-radius:8px;padding:10px;margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12px}
.rulebuild select,.rulebuild input{background:var(--surface-1);border:1px solid var(--line);border-radius:6px;padding:5px 7px;outline:none;font-size:12px}
.rulebuild input[type=text]{width:150px}
.rulebuild input[type=number]{width:66px}
.rulebuild .f{display:none;align-items:center;gap:6px}
.rulebuild .f.on{display:flex}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:900;background:var(--panel2);border:1px solid var(--acc-d);color:var(--acc);border-radius:8px;padding:8px 15px;font-family:var(--f1);font-size:12px;letter-spacing:.05em;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:70vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
#tip{
  position:fixed;z-index:1000;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;
  font-size:11.5px;line-height:1.45;color:var(--txt);max-width:250px;pointer-events:none;opacity:0;
  box-shadow:0 8px 22px rgba(0,0,0,.5);transition:opacity .08s;
}
#tip.on{opacity:1}
#tip b{color:var(--acc);font-weight:600}
.ctxmenu{
  position:fixed;z-index:1200;background:var(--surface-1);border:1px solid var(--line2);border-radius:9px;padding:5px;
  min-width:192px;box-shadow:0 18px 42px rgba(0,0,0,.62);font-size:12.5px;
}
.ctxmenu .mi{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.ctxmenu .mi:hover{background:var(--panel2)}
.ctxmenu .mi.danger:hover{background:color-mix(in srgb, var(--danger) 18%, var(--bg));color:var(--danger)}
.ctxmenu .mi .k{margin-left:auto;color:var(--dim2);font-size:10.5px;font-family:var(--f1);padding-left:14px}
.ctxmenu .sep{height:1px;background:var(--line);margin:4px 6px}
.ctxmenu .hd{padding:4px 9px 6px;font-family:var(--f1);font-size:10px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.pop{
  position:fixed;z-index:1300;background:var(--surface-1);border:1px solid var(--acc-d);border-radius:9px;padding:10px;
  box-shadow:0 18px 42px rgba(0,0,0,.62);display:flex;flex-direction:column;gap:8px;min-width:176px;
}
.pop h5{font-family:var(--f1);font-size:10px;letter-spacing:.13em;color:var(--dim2);text-transform:uppercase;font-weight:600}
.pop input{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;outline:none;font-family:var(--f1);font-size:14px;color:var(--acc);width:100%}
.pop input:focus{border-color:var(--acc)}
.pop .prow{display:flex;gap:6px}

<script>
/* ══════════════════════════ LIFEOS KERNEL v2 ══════════════════════════
   Identical in every app that shares data — edit the copy in index.html and
   re-run the sync script.

   v1 kept the shared state as ONE JSON blob and broadcast it whole, with the
   shell as the single writer and a postMessage broker underneath. That is the
   shape the brief forbids and the shape SystemOS died of, so v2 is a thin view
   over `shared/records.js` instead:

     activities → one `activity` row each
     habits     → one `habit` row each
     ticks      → one `tick` row per activity per day
     today      → one dated `plan` row, published by whoever owns the schedule

   Every app now writes directly. There is no broker and no hosted/solo split,
   because every app on this origin reads and writes the same rows. What remains
   is a nudge: frames opened from a folder do not reliably get storage events, so
   a writer tells its neighbours to look again. It sends no data.

   The API is unchanged from v1 on purpose — the apps did not have to move.

   Load order in the page, before this block:
     shared/day.js  then  shared/records.js
   (written without tags on purpose: a literal closing script tag inside an
    inline script ends the script element, even inside a comment)
                                                                            */
window.LifeOS = (function () {
  if (!window.Rec || !window.Day) {
    console.error('[lifeos] records.js and day.js must load first');
    return { broken: 1, ready: function () {}, on: function () { return function () {}; },
             doc: function () { return { activities: {}, habits: {}, log: {}, today: null }; },
             isDone: function () { return false; }, dayLog: function () { return {}; },
             done: function () { return Promise.resolve(); }, acts: function () { return Promise.resolve(); } };
  }

  const HOSTED = (function () { try { return !!(window.parent && window.parent !== window); } catch (e) { return false; } })();
  let doc = null, subs = [], booted = false, bootQ = [];

  /* ─── the view: rows assembled into the shape the apps already expect ─── */
  function build() {
    const d = { v: 2, ts: Date.now(), activities: {}, habits: {}, log: {}, today: null };
    Rec.all('activity').forEach(r => { d.activities[r.key] = Object.assign({ id: r.key }, r.payload); });
    Rec.all('habit').forEach(r => { d.habits[r.key] = Object.assign({ id: r.key }, r.payload); });
    /* the row carries the time now, but callers still expect payload.ts */
    Rec.all('tick').forEach(r => {
      (d.log[r.date] || (d.log[r.date] = {}))[r.key] =
        Object.assign({ ts: Date.parse(r.updated_at) || 0 }, r.payload);

    doc = build();
    if (!booted) { booted = true; bootQ.splice(0).forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } }); }
    subs.forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } });
  }

  /* ─── neighbours ───
     Same storage, but a frame loaded from a folder may never see the storage
     event. A write pokes everyone else; they re-read for themselves. */
  function poke() {
    const msg = { lifeos: 2, poke: 1 };
    try { if (HOSTED) window.parent.postMessage(msg, '*'); } catch (e) {}
    document.querySelectorAll('iframe').forEach(f => { try { f.contentWindow.postMessage(msg, '*'); } catch (e) {} });

  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || m.lifeos !== 2 || !m.poke) return;
    Rec.reload();
    /* pass it on once, so a frame's sibling hears about it too */
    if (!m.relay) {
      const on = { lifeos: 2, poke: 1, relay: 1 };
      try { if (HOSTED && e.source !== window.parent) window.parent.postMessage(on, '*'); } catch (err) {}
      document.querySelectorAll('iframe').forEach(f => { try { if (f.contentWindow !== e.source) f.contentWindow.postMessage(on, '*'); } catch (err) {} });
    }
  });

     data is its own backup if anything here is wrong. */
  function migrate() {
    if (Rec.setting('lifeos', 'migrated')) return 0;
    let old = null;
    try { old = JSON.parse(localStorage.getItem('lifeos_v1')); } catch (e) {}
    let n = 0;
    if (old && old.v) {
      Object.keys(old.activities || {}).forEach(id => {
        const a = old.activities[id];
        Rec.set('activity', null, id, { name: a.name, cat: a.cat || '', dur: a.dur || 0, color: a.color || '', energy: a.energy || 2 }); n++;
      });
      Object.keys(old.habits || {}).forEach(id => { Rec.set('habit', null, id, old.habits[id]); n++; });
      Object.keys(old.log || {}).forEach(date => {
        const day = old.log[date] || {};

      });

    },
    act: id => (doc.activities[id] || null),

    /** the one tick, everywhere. One row: one activity, one day. */
    done(actId, date, on, meta) {
      if (!actId) return Promise.resolve(doc);
      const d = date || Day.today();
      if (on === false) Rec.del('tick', d, actId);
      else Rec.set('tick', d, actId, Object.assign({ src: '?' }, meta || {}));

    },
    isDone: (actId, date) => Rec.has('tick', date || Day.today(), actId),
    dayLog: date => (doc.log[date || Day.today()] || {}),

    habit(h) { if (!h || !h.id) return Promise.resolve(doc); Rec.set('habit', null, h.id, Object.assign({ created: Day.today(), archived: false, cadence: { type: 'daily', days: [1, 1, 1, 1, 1, 1, 1], target: 7 } }, doc.habits[h.id], h)); return wrote(doc); },
    habitDel(id) { Rec.del('habit', null, id); return wrote(doc); },

    /** whoever owns the schedule publishes today's plan for everyone else */
    publishToday(t) { if (t && t.date) Rec.set('plan', t.date, 'routine', t); return wrote(doc); },

    /** local-only housekeeping: really drop ancient ticks, no tombstones */
    prune(days) { return Rec.purge('tick', Day.shift(Day.today(), -(days || 800))); },

    /** consecutive due-days ending today (today still counts as open, not broken) */
    streak(actId, cadence) {
      const due = d => (!cadence || cadence.type !== 'days') ? true : !!cadence.days[Day.dow(d)];
      let n = 0, d = Day.today(), guard = 0;

        if (!API.isDone(actId, d)) break;
        n++; d = Day.shift(d, -1);
      }
      return n;
    },
    count(actId, n) {
      let c = 0, d = Day.today();
      for (let i = 0; i < (n || 30); i++) { if (API.isDone(actId, d)) c++; d = Day.shift(d, -1); }
      return c;
    },

    /** rows persist themselves; kept so v1 callers do not break */
    get persist() { return null; }, set persist(f) {},
    /** restore path: a v1-shaped doc becomes rows */
    _adopt(d) {
      d = d || {};
      Object.keys(d.activities || {}).forEach(id => Rec.set('activity', null, id, d.activities[id]));
      Object.keys(d.habits || {}).forEach(id => Rec.set('habit', null, id, d.habits[id]));
      Object.keys(d.log || {}).forEach(date => Object.keys(d.log[date]).forEach(k => Rec.set('tick', date, k, d.log[date][k])));
      if (d.today && d.today.date) Rec.set('plan', d.today.date, 'routine', d.today);
      poke(); refresh();
    },
    rows: () => Rec,
  };

  Rec.on(refresh);
  migrate();
  refresh();
  return API;
})();
/* ════════════════════════ END LIFEOS KERNEL ════════════════════════ */

 * so a focus wobble can never silently swallow the edit (which is what broke the old inline editor).
 */
/* ── typing a time ──
   `<input type=time>` is three little spinners in a trench coat. You cannot
   type 9 and be done, tabbing lands you in the minutes, the AM/PM segment eats
   an arrow key, and on a desktop it is slower than a text box in every case.

   So: a plain text box that accepts what a person would actually type.

     9      9:00      930     09:30      9.30
     9pm    9:30 pm   21:30   2130

   Anything it cannot read leaves the value alone rather than silently writing
   midnight, which is the one outcome worse than being fiddly. */
function parseTime(str) {
  const t = String(str == null ? '' : str).trim().toLowerCase().replace(/\s+/g, '');
  if (!t) return null;
  const m = t.match(/^(\d{1,2})(?::|\.)?(\d{2})?(am|pm|a|p)?$/);
  if (!m) return null;
  let h = +m[1];
  const mins = m[2] == null ? 0 : +m[2];
  const ap = m[3] ? m[3][0] : '';
  if (mins > 59) return null;
  /* four digits and no separator is 24-hour: 2130, 0930 */
  if (!m[2] && m[1].length > 2) return null;
  if (ap) {
    if (h < 1 || h > 12) return null;
    if (ap === 'p' && h !== 12) h += 12;
    if (ap === 'a' && h === 12) h = 0;
  } else if (h > 23) return null;
  return pad(h) + ':' + pad(mins);
}

/* ── links in a note ──
   A block's note is where the thing you need in order to do the block lives:
   the doc, the call, the video you are filming against. Reading a URL off the
   screen and retyping it into a browser is not a workflow.

   Two shapes, because both get typed:

     https://example.com/thing          a bare address
     [the brief](https://example.com)   when the address is ugly

   The note stays a plain-text field. It is contenteditable, and putting live
   anchors inside something you are typing into is how you end up with half an
   <a> tag in your data. So the links are painted only while it is NOT focused;
   focusing strips back to text, blurring re-paints. What is stored is always
   exactly what you typed.

   Only http and https are turned into links. A javascript: or data: URL in a
   note is not a feature, and this is the one place text from a file becomes a
   thing you can click. */
const LINK_OK = /^https?:\/\//i;
function linkify(raw) {
  const text = String(raw == null ? '' : raw);
  let out = '', at = 0;
  /* [label](url) first, so its url is not also matched as a bare one */
  const re = /\[([^\]\n]{1,120})\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>"']+)/gi;
  let m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(at, m.index));
    const url = m[2] || m[3];
    const label = m[1] || url;
    out += LINK_OK.test(url)
      ? '<a class="b-link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + '</a>'
      : esc(m[0]);
    at = m.index + m[0].length;
  }
  return out + esc(text.slice(at));
}

function popEdit(anchor, opt) {
  closePop();
  const p = el('div', 'pop');
  p.appendChild(el('h5', null, esc(opt.title)));
  const inp = el('input');
  const timey = (opt.type || 'time') === 'time';
  inp.type = timey ? 'text' : opt.type;
  if (timey) { inp.inputMode = 'numeric'; inp.autocomplete = 'off'; inp.placeholder = '9:30 or 930 or 9pm'; }
  inp.value = opt.value || '';
  if (opt.type === 'number') { inp.min = opt.min || 1; inp.max = opt.max || 1440; }
  p.appendChild(inp);
  /* Says what it read, live, so a typo is visible before it is committed
     rather than after the whole routine has shuffled around it. */
  let echo = null;
  if (timey) {
    echo = el('div', 'note');
    const say = () => {
      const v = inp.value.trim();
      const t = parseTime(v);
      echo.innerHTML = !v ? '<span style="opacity:.6">blank clears it</span>'
        : t ? 'reads as <b>' + t + '</b>'
            : '<span style="color:var(--danger)">cannot read that</span>';
    };
    inp.addEventListener('input', say);
    say();
    p.appendChild(echo);
  }
  if (opt.note) p.appendChild(el('div', 'note', opt.note));
  const row = el('div', 'prow');
  const ok = el('button', 'btn acc', opt.okLabel || 'Set');
  ok.onclick = () => {
    let v = inp.value;
    if (timey && v.trim()) {
      const t = parseTime(v);
      /* refuse rather than guess — a misread anchor drags the whole routine */
      if (!t) { inp.focus(); inp.select(); return; }
      v = t;
    }
    closePop(); opt.onSet(v);
  };
  row.appendChild(ok);
  if (opt.onClear) { const c = el('button', 'btn', opt.clearLabel || 'Clear'); c.onclick = () => { closePop(); opt.onClear(); }; row.appendChild(c); }
  if (timey) {
    /* the two edits that actually come up: move it a bit earlier, a bit later */
    const nudge = el('div', 'prow');
    [['-15', -15], ['-5', -5], ['+5', 5], ['+15', 15]].forEach(([lbl, d]) => {
      const b = el('button', 'btn sm', lbl);
      b.onclick = () => {
        const base = parseTime(inp.value) || opt.value || '00:00';
        inp.value = hhmm(hm2min(base) + d);
        inp.dispatchEvent(new Event('input'));
      };
      nudge.appendChild(b);
    });
    /* appended, not inserted before `row`: `row` is not a child of the popover
       yet at this point, and insertBefore against a non-child throws — which
       took the entire time popover down with it. */
    p.appendChild(nudge);
  }
  const x = el('button', 'btn', '✕'); x.onclick = closePop; row.appendChild(x);
  p.appendChild(row);
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  p.style.left = clamp(r.left - 4, 6, innerWidth - p.offsetWidth - 6) + 'px';
  p.style.top = clamp(r.bottom + 6, 6, innerHeight - p.offsetHeight - 6) + 'px';
  inp.focus(); inp.select && inp.select();
  inp.onkeydown = ev => { ev.stopPropagation(); if (ev.key === 'Enter') ok.click(); if (ev.key === 'Escape') closePop(); };
}

/* ============================ time ============================ */

function toggleSkip(it) {

  it.skipped = !it.skipped;
  /* a skipped block cannot also be ticked — the two are different answers to
     the same question, and holding both would double-count it in the log */
  if (it.skipped && it.done) { it.done = false; if (window.LifeOS) LifeOS.done(actIdOf(it), todayKey(), false, { src: 'block' }); }
  beep(it.skipped ? 'untick' : 'done');
  logToday();
  save(); render();
  toast(it.skipped
    ? '<b>' + esc(it.name) + '</b> not needed today — it will not count against you'
    : '<b>' + esc(it.name) + '</b> is back on today');
}

/** every block in the open day sharing this one's name — the reason ticks must not collapse */
const sameNameCount = it => LANES().reduce((n, L) => n + items(L.id).filter(x => x.name === it.name && !x.hidden).length, 0);
function clearDone(vid) { withVariant(vid, () => LANES(vid).forEach(l => items(l.id).forEach(it => { it.done = false; it.skipped = false; }))); }
/** new day → yesterday's ticks are gone, and today's come back from the LifeOS
    log (you may have ticked something in HABITS or on the home screen already) */
/* ---------- history: what was scheduled, and what actually got ticked ----------
 * S.log[date] = { t: names scheduled, d: names ticked }. Names rather than ids,
 * so a block keeps its record when you rebuild the routine around it.
 */
function logToday() {
  const k = todayKey();
  S.log = S.log || {};
  const all = todaysPairs(routineForToday());
  if (!all.length) return;
  const e = S.log[k] || (S.log[k] = { t: [], d: [] });
  /* A skipped block never enters the scheduled set, so it is not something the
     day owed you. That is the whole mechanism: the streak asks whether
     everything scheduled got ticked, and this was not scheduled. */
  e.t = [...new Set(all.filter(({ it }) => !isSkipped(it)).map(({ it, l }) => tickKey(it, l)))];
  const ticked = new Set(e.d);
  all.forEach(({ it, l }) => { if (it.done && !isSkipped(it)) ticked.add(tickKey(it, l)); });
  e.d = [...ticked].filter(n => e.t.includes(n));
  const keys = Object.keys(S.log).sort();
  while (keys.length > 180) delete S.log[keys.shift()];
}
/** completion rate per block name across the recorded history */
function blockStats() {
  const m = {};
  Object.values(S.log || {}).forEach(e => {
    (e.t || []).forEach(k => { (m[k] = m[k] || { key: k, n: keyName(k), where: String(k).split('||')[1] || '', seen: 0, done: 0 }).seen++; });
    (e.d || []).forEach(k => { if (m[k]) m[k].done++; });
  });
  return Object.values(m).map(x => Object.assign(x, { rate: x.seen ? x.done / x.seen : 0 })).sort((a, b) => a.rate - b.rate);
}
/** consecutive days back from today where everything scheduled got ticked */
function streak() {
  let n = 0;
  for (let i = 0; i < 180; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const e = (S.log || {})[d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())];
    if (!e || !e.t.length) { if (i === 0) continue; break; }
    if (e.d.length >= e.t.length) n++; else break;
  }
  return n;
}
function rolloverIfNewDay() {
  if (S.doneDate === todayKey()) return;
  logToday();                                  /* close yesterday's page before turning it */
  S.doneDate = todayKey();
  S.variants.forEach(v => clearDone(v.id));
  pullDone();
  save();
}
function toggleDone(it) {
  it.done = !it.done;
  /* an explicit tick outranks a post-completion clear */
  if (S.cleared && S.cleared.date === todayKey() && window.LifeOS) delete S.cleared.ids[actIdOf(it)];
  /* the tick is not ours to keep — it goes in the shared day log, which is what
     HABITS and the home screen read. Same block name = same tick, everywhere. */
  /* report to the shared log by name, but only flip it off once EVERY block with that
     name is unticked — otherwise un-ticking your evening brush would erase the morning one */
  const twins = LANES().flatMap(L => items(L.id)).filter(x => x.name === it.name && !x.hidden);
  LifeOS.done(actIdOf(it), todayKey(), twins.some(x => x.done), { src: 'block' });
  /* if the shared log can't actually store it (private mode, blocked storage, quota),
     stop mirroring from it — otherwise pullDone would quietly un-tick everything */
  if (LIFEOS_OK && LifeOS.isDone(actIdOf(it), todayKey()) !== twins.some(x => x.done)) {
    LIFEOS_OK = false;
    toast('shared log unavailable — ticks are being kept locally');
  }
  save();
  if (!it.done) { beep('untick'); return render(); }
  beep('done');
  const vid = routineForToday();
  /* what today actually asks of you: skipped blocks are not part of it, so a
     day where dinner was handed to you still completes */
  const todays = todaysBlocks(vid).filter(b => !isSkipped(b));
  const open = todays.filter(b => !b.done);
  logToday();
  render();
  if (todays.length && !open.length) {
    document.querySelectorAll('.brick').forEach(n => n.classList.add('celebrate'));
    beep('complete');
    toast('✓ <b>' + todays.length + '/' + todays.length + '</b> — day complete, logged. Clearing the boxes…');
    setTimeout(() => { clearForNextPass(vid); render(); }, 1500);
  }
}
/**
 * Wipe the checkboxes for a fresh run WITHOUT un-saying that it happened:
 * the shared LifeOS log keeps the tick (habits + streaks depend on it), and
 * pullDone() is told not to paint these back on for the rest of today.
 */
function clearForNextPass(vid) {
  if (!S.cleared || S.cleared.date !== todayKey()) S.cleared = { date: todayKey(), ids: {} };
  withVariant(vid, () => LANES(vid).forEach(l => items(l.id).forEach(it => {
    if (!it.done) return;
    it.done = false;
    if (window.LifeOS) S.cleared.ids[actIdOf(it)] = 1;
  })));
  save();
}

/* ============================ rules ============================ */
const RULEKINDS = {
  after: { label: '‹A› starts at least ‹N›m after ‹B› ends', f: ['a', 'mins', 'b'] },
  order: { label: '‹A› comes before ‹B›', f: ['a', 'b'] },
  notbefore: { label: '‹A› never starts before ‹time›', f: ['a', 'time'] },
  notafter: { label: '‹A› never starts after ‹time›', f: ['a', 'time'] },
  endby: { label: '‹A› is finished by ‹time›', f: ['a', 'time'] },
  maxheavy: { label: 'no more than ‹N› ● heavy blocks back to back', f: ['mins'] },
};
function ruleText(r) {
  const a = '<b>' + esc(r.a || '?') + '</b>', b = '<b>' + esc(r.b || '?') + '</b>';
  if (r.kind === 'after') return a + ' starts at least <b>' + (r.mins || 0) + 'm</b> after ' + b + ' ends';
  if (r.kind === 'order') return a + ' comes before ' + b;
  if (r.kind === 'notbefore') return a + ' never starts before <b>' + esc(r.time || '') + '</b>';
  if (r.kind === 'notafter') return a + ' never starts after <b>' + esc(r.time || '') + '</b>';
  if (r.kind === 'endby') return a + ' is finished by <b>' + esc(r.time || '') + '</b>';
  if (r.kind === 'maxheavy') return 'no more than <b>' + (r.mins || 2) + '</b> ● heavy blocks back to back';
  return '?';
}
/** check the arrangement against every enabled rule; returns per-block messages + per-rule status */
function checkRules(vid) {
  const res = { byItem: new Map(), byRule: new Map(), count: 0 };
  const rows = withVariant(vid || S.current, () => LANES(vid || S.current).flatMap(L => schedule(L.id).map(r => Object.assign({ lane: L }, r))));
  const hit = (r, ids, msg) => {
    res.count++;
    res.byRule.set(r.id, (res.byRule.get(r.id) || 0) + 1);
    ids.forEach(id => { if (!res.byItem.has(id)) res.byItem.set(id, []); res.byItem.get(id).push(msg); });
  };
  const named = n => rows.filter(r => r.it.name.toLowerCase().trim() === String(n || '').toLowerCase().trim());
  (S.rules || []).filter(r => r.on !== false).forEach(r => {
    const A = named(r.a), B = named(r.b);
    if (r.kind === 'after') A.forEach(a => B.forEach(b => { if (a.s < b.e + (+r.mins || 0)) hit(r, [a.it.id, b.it.id], a.it.name + ' needs ' + r.mins + 'm after ' + b.it.name); }));
    if (r.kind === 'order') A.forEach(a => B.forEach(b => { if (a.s >= b.s) hit(r, [a.it.id, b.it.id], a.it.name + ' should come before ' + b.it.name); }));
    if (r.kind === 'notbefore') A.forEach(a => { if (a.s < hm2min(r.time)) hit(r, [a.it.id], a.it.name + ' starts before ' + r.time); });
    if (r.kind === 'notafter') A.forEach(a => { if (a.s > hm2min(r.time)) hit(r, [a.it.id], a.it.name + ' starts after ' + r.time); });
    if (r.kind === 'endby') A.forEach(a => { if (a.e > hm2min(r.time)) hit(r, [a.it.id], a.it.name + ' runs past ' + r.time); });
    if (r.kind === 'maxheavy') {
      const lim = +r.mins || 2;
      withVariant(vid || S.current, () => LANES(vid || S.current).forEach(L => {
        let run = [];
        items(L.id).forEach(it => {
          if (energyOf(it) === 3) run.push(it); else run = [];
          if (run.length > lim) hit(r, run.map(x => x.id), run.length + ' heavy blocks in a row in ' + L.name);
        });
      }));
    }
  });
  return res;
}
let RULECHK = { byItem: new Map(), byRule: new Map(), count: 0 };

/* ============================ render ============================ */
function render() {
  rolloverIfNewDay();
  RULECHK = checkRules(S.current);
  $('#board').classList.toggle('hide', S.view !== 'day');

     without the button that reports it taking up the bar. */
  $('#bMore').innerHTML = RULECHK.count ? '⋯ <span class="bad">⚠' + RULECHK.count + '</span>' : '⋯';
  /* the bin's two tabs, and whether it is there at all */

function renderTabs() {

  S.variants.forEach(v => {
    const b = el('div', 'tab' + (v.id === S.current ? ' on' : ''));
    const dys = weekOrd().filter(d => S.week[d] === v.id).map(d => DLET[d]).join('');
    const pip = isOneOff(v) ? dateLabel(v.date) : dys;
    b.appendChild(el('span', null, esc(v.name) + (pip ? ' <span class="daypip">' + esc(pip) + '</span>' : '')));
    b.dataset.tip = '<b>' + esc(v.name) + '</b>' + (dys ? ' — runs on ' + weekOrd().filter(d => S.week[d] === v.id).map(d => DSHORT[d]).join(', ') : ' — not on the week yet') + '<br><b>Right-click</b> to set which weekdays it runs · double-click to rename';
    b.ondblclick = () => { const n = prompt('Day name', v.name); if (n) { snap(); v.name = n.trim(); render(); } };
    if (v.id === S.current) {
      const cp = el('button', 'cp', '⧉'); cp.dataset.tip = 'Duplicate this routine';
      cp.onclick = e => { e.stopPropagation(); dupVariant(v); };
      b.appendChild(cp);
    }
    if (S.variants.length > 1) {
      const x = el('button', 'x', '✕'); x.dataset.tip = 'Delete this routine';
      x.onclick = e => {
        e.stopPropagation();
        if (!confirm('Delete day "' + v.name + '"?')) return;
        snap(); S.variants = S.variants.filter(z => z.id !== v.id);
        S.week = S.week.map(w => w === v.id ? null : w);
        if (S.current === v.id) S.current = S.variants[0].id;
        render();

    b.onclick = () => { S.current = v.id; render(); };
    b.oncontextmenu = ev => { ev.preventDefault(); dayMenu(v, ev.clientX, ev.clientY); };
    t.appendChild(b);

}

        S.week = S.week.map(w => w === v.id ? null : w);

  ]);

function dupVariant(src) {
  snap();
  const v = { id: uid(), name: src.name + ' copy', items: {} };
  v.routines = (src.routines || S.lanes.map(l => l.id)).slice();
  S.lanes.forEach(l => v.items[l.id] = (src.items[l.id] || []).map(it => Object.assign({}, it, { id: uid(), srcId: uid(), days: it.days.slice(), done: false })));
  S.variants.push(v); S.current = v.id; render();
}

/* ── the routine bin ──
   The block bin holds the things that go INTO a routine. This holds the
   routines themselves, which is the other half of the same idea and had no
   home: a routine only existed on a day, so putting Morning onto a second day
   meant hunting through a menu behind a small + at the end of the board.

   Every routine you own, in one list, with whether it is on the day you are
   looking at. Click to put it on or take it off. That is the whole thing.   */
function renderRoutines() {
  const list = $('#routinelist'); list.innerHTML = '';
  const v = M();
  const on = LANES().map(L => L.id);

  if (!S.lanes.length) {
    list.appendChild(el('div', 'cat', 'Nothing yet'));
  }

  S.lanes.forEach(L => {
    const has = on.indexOf(L.id) > -1;
    const b = el('button', 'rchip' + (has ? ' on' : ''));
    /* how much is actually in it, across every day, so an empty routine is
       obvious before you put it on something */
    let blocks = 0;
    S.variants.forEach(x => { blocks += (x.items[L.id] || []).filter(z => !z.hidden).length; });
    b.innerHTML = '<span class="tick">' + (has ? '\u2713' : '') + '</span>' +
      '<span class="nm">' + esc(L.name) + '</span>' +
      '<span class="wh">' + (blocks || 'empty') + '</span>';
    b.dataset.tip = has
      ? 'On <b>' + esc(v.name) + '</b>. Click to take it off — its blocks are kept, and it stays on your other days.'
      : 'Put <b>' + esc(L.name) + '</b> on <b>' + esc(v.name) + '</b>';
    b.onclick = () => { has ? removeLaneFromDay(L.id) : addLaneToDay(L.id); };
    b.oncontextmenu = ev => {
      ev.preventDefault();
      openMenu(ev.clientX, ev.clientY, [
        { head: L.name },
        { label: 'Rename\u2026', fn: () => {
            const nm = prompt('Routine name', L.name); if (!nm) return;
            snap(); L.name = nm.trim(); render();
          } },
        { sep: 1 },
        { label: 'Delete everywhere', danger: 1, fn: () => {
            if (!confirm('Delete the routine "' + L.name + '" from every day?\n\nIts blocks go with it.')) return;
            snap();
            S.lanes = S.lanes.filter(z => z.id !== L.id);
            S.variants.forEach(x => { delete x.items[L.id]; if (x.routines) x.routines = x.routines.filter(z => z !== L.id); });
            if (focusId === L.id) focusId = null;
            render();
          } },
      ]);
    };
    list.appendChild(b);
  });

  const mk = el('button', 'btn');
  mk.style.marginTop = '10px';
  mk.textContent = '+ Build a routine';
  mk.onclick = () => { newRoutine(); };
  list.appendChild(mk);
}
