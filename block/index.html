/* ---------- summary: what the record says about your routine ---------- */
function renderSum() {
  const p = $('#sum'); p.innerHTML = '';
  const stats = blockStats();
  const days = Object.keys(S.log || {}).sort();
  const st = streak();

  const bar = el('div', 'weekbar');
  bar.appendChild(el('span', 'wbnote', days.length ? days.length + ' days recorded' : 'no history yet — tick some blocks off'));
  const wipe = el('button', 'btn sm', 'Clear history');
  wipe.onclick = () => { if (confirm('Delete the completion history? Your routines stay.')) { snap(); S.log = {}; render(); } };
  bar.appendChild(wipe);
  p.appendChild(bar);

  const cards = el('div', 'sumcards');
  const last14 = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); last14.push(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())); }
  const rates = last14.map(k => { const e = (S.log || {})[k]; return e && e.t.length ? e.d.length / e.t.length : null; });
  const avg = rates.filter(r => r != null);
  const card = (big, label, tip) => { const c = el('div', 'sumcard'); c.innerHTML = '<b>' + big + '</b><span>' + label + '</span>'; if (tip) c.dataset.tip = tip; return c; };
  cards.appendChild(card(st + (st === 1 ? ' day' : ' days'), 'current streak',
    'Days in a row where everything scheduled got ticked' +
    (S.streakFrom ? ' — counting from ' + S.streakFrom : '')));
  cards.appendChild(card(avg.length ? Math.round(avg.reduce((a, b) => a + b, 0) / avg.length * 100) + '%' : '—', 'finished, last 14 days'));
  cards.appendChild(card(stats.length ? stats.filter(s => s.rate >= .8 && s.seen >= 3).length : 0, 'blocks you reliably do', 'Done 80%+ of the times they came up'));
  p.appendChild(cards);

  /* ── where the record starts ──
     A date, not a button. Tom, 2026-09-05: "I don't need a count from the
     beginning again button, maybe we can manually set the count date." A
     two-state toggle only ever offers today or the beginning, and neither is
     the answer when what you want is "from the Monday I actually restarted".

     Everything before this date stays logged and stays on the chart. It stops
     being evidence, not history. */
  const fresh = el('div', 'freshrow');
  fresh.appendChild(el('span', 'freshlab', 'Counting since'));
  const fd = document.createElement('input');
  fd.type = 'date';
  fd.value = S.streakFrom || '';
  fd.max = todayKey();
  fd.dataset.tip = 'Days before this stay logged and stay on the chart. They stop counting toward the streak, and the notes below stop being about them.';
  fd.onchange = () => {
    const was = S.streakFrom || null;
    S.streakFrom = fd.value || null;
    save(); render();
    if (window.UI && UI.undo) {
      UI.undo(S.streakFrom ? 'Counting from ' + S.streakFrom : 'Counting from the first day you logged',
        () => { S.streakFrom = was; save(); render(); });
    }
  };
  fresh.appendChild(fd);
  if (S.streakFrom) {
    const clr = el('button', 'btn sm', 'All of it');
    clr.dataset.tip = 'Count from the first day you ever logged';
    clr.onclick = () => {
      const was = S.streakFrom;
      S.streakFrom = null; save(); render();
      if (window.UI && UI.undo) UI.undo('Counting all of it', () => { S.streakFrom = was; save(); render(); });
    };
    fresh.appendChild(clr);
  }
  p.appendChild(fresh);

  const spark = el('div', 'spark');
  last14.forEach((k, i) => {
    const r = rates[i];
    const b = el('i'); b.style.height = (r == null ? 3 : Math.max(4, r * 46)) + 'px';
    b.style.background = r == null ? 'var(--surface-3)' : r >= 1 ? 'var(--good)' : r >= .5 ? 'var(--warn)' : 'var(--bad)';
    b.dataset.tip = k + (r == null ? ' — nothing recorded' : ' — ' + Math.round(r * 100) + '% finished');
    spark.appendChild(b);
  });
  p.appendChild(el('h4', 'sumh', 'Last 14 days'));
  p.appendChild(spark);

  /* ── naming what keeps not happening ──
     Only ever about days since the line, and never more than three at once.
     Thirty-seven cards is not feedback, it is an inventory of failure, and
     nobody acts on an inventory. Three is a thing you can do something about
     this week. */
  const chronic = stats.filter(s => s.seen >= 4 && s.rate < .5).slice(0, 3);
  const solid = stats.filter(s => s.seen >= 3 && s.rate >= .8);
  const sinceLine = statsFrom() ? days.filter(k => k >= statsFrom()).length : days.length;
  p.appendChild(el('h4', 'sumh', 'What the record says'));
  const advice = el('div', 'advice');
  /* A restart means there is nothing to report yet, and saying so is the
     point. Four days is the floor for calling anything a pattern. */
  if (statsFrom() && sinceLine < 4) {
    advice.appendChild(el('div', 'adv',
      'Counting from <b>' + esc(statsFrom()) + '</b>. ' +
      (sinceLine ? sinceLine + (sinceLine === 1 ? ' day' : ' days') + ' in.' : 'Starts today.') +
      ' <span class="dim">Nothing to say yet.</span>'));
  } else if (!days.length) {
    advice.appendChild(el('div', 'adv', 'Tick a few days off and this fills in. One bad day is never a pattern.'));
  } else if (!chronic.length) {
    /* competence + autonomy, not praise for its own sake: name the specific thing that worked */
    const best = solid[solid.length - 1];
    advice.appendChild(el('div', 'adv good',
      '<b>Everything is holding.</b> <span class="dim">' +
      (best ? esc(best.n) + ' at ' + Math.round(best.rate * 100) + '%. ' : '') +
      'Room to add something.</span>'));
  } else {
    /* One line. The long version said the right things and said them four
       times; he has read it. */
    advice.appendChild(el('div', 'adv note',
      '<b>' + chronic.length + (chronic.length > 1 ? ' blocks are' : ' block is') + ' not sticking.</b> ' +
      '<span class="dim">That is the plan, not you. Make it smaller, or put it after something you already do.</span>'));
  }
  chronic.forEach(s => {
    const pct = Math.round(s.rate * 100);
    const found = S.variants.flatMap(v => withVariant(v.id, () => LANES(v.id).flatMap(l => items(l.id).filter(i => i.name === s.n && (!s.where || l.name === s.where)).map(i => ({ v, l, i })))))[0];
    const anchor = found ? withVariant(found.v.id, () => {
      const sc = schedule(found.l.id).filter(r => !r.hidden);
      const i = sc.findIndex(r => r.it.id === found.i.id);
      const prev = i > 0 ? sc[i - 1].it : null;
      const st = prev ? stats.find(x => x.n === prev.name && (!x.where || x.where === found.l.name)) : null;
      return (st && st.rate >= .8) ? prev.name : null;
    }) : null;
    const d = el('div', 'adv');
    const why = found && found.i.dur >= 45
      ? 'It is ' + dur2s(found.i.dur) + ' long. Long blocks need a clear runway; short ones survive bad days. Halve it and let it earn the time back.'
      : found && found.i.at
        ? 'It is anchored to ' + found.i.at + '. A fixed time only works if that minute is genuinely free — if it is not, unanchor it and let it flow.'
        : anchor
          ? 'It sits right after <b>' + esc(anchor) + '</b>, which you do ' + Math.round((stats.find(x => x.n === anchor) || { rate: 0 }).rate * 100) + '% of the time. That is a strong cue going unused — make this one small enough that finishing ' + esc(anchor) + ' carries you straight into it.'
          : 'No obvious cue in front of it. Blocks that follow something already automatic stick far better than blocks that rely on remembering.';
    d.innerHTML = '<b>' + esc(s.n) + '</b> — done <b>' + pct + '%</b> of the ' + s.seen + ' times it came up' +
      (found ? ' · ' + esc(found.l.name) + ' · ' + esc(found.v.name) : '') +
      '<br><span class="dim">' + why + '</span>';
    if (found) {
      const row = el('div', 'advbtns');
      const go = el('button', 'btn sm', 'Show me'); go.onclick = () => { S.current = found.v.id; S.view = 'day'; render(); };
      const half = el('button', 'btn sm', 'Halve it'); half.onclick = () => { snap(); found.i.dur = Math.max(1, Math.round(found.i.dur / 2)); syncKin(found.i, { dur: found.i.dur }); render(); toast('<b>' + esc(s.n) + '</b> → ' + dur2s(found.i.dur)); };
      const cut = el('button', 'btn sm', 'Cut it'); cut.onclick = () => { if (confirm('Remove "' + s.n + '" from ' + found.l.name + '?')) { snap(); const f = findItemIn(found.v.id, found.i.id); if (f) f.arr.splice(f.i, 1); render(); } };
      [go, half, cut].forEach(b => row.appendChild(b));
      d.appendChild(row);
    }
    advice.appendChild(d);
  });
  p.appendChild(advice);

  /* ---------- history log ---------- */
  p.appendChild(el('h4', 'sumh', 'History'));
  const log = el('div', 'histlog');
  const keys = Object.keys(S.log || {}).sort().reverse();
  if (!keys.length) log.appendChild(el('div', 'adv', 'Nothing logged yet.'));
  keys.slice(0, 60).forEach(k => {
    const e = S.log[k], rate = e.t.length ? e.d.length / e.t.length : 0;
    const dt = new Date(k + 'T00:00:00');
    const row = el('div', 'hrow' + (rate >= 1 ? ' full' : rate >= .5 ? ' half' : ' low'));
    row.innerHTML =
      '<span class="hd2">' + DSHORT[dt.getDay()] + ' ' + dt.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][dt.getMonth()] + '</span>' +
      '<span class="hbar"><i style="width:' + Math.round(rate * 100) + '%"></i></span>' +
      '<span class="hn">' + e.d.length + '/' + e.t.length + '</span>';
    row.dataset.tip = e.t.length
      ? '<b>Done:</b> ' + (e.d.length ? esc(e.d.join(', ')) : '—') + '<br><b>Missed:</b> ' + (esc(e.t.filter(n => !e.d.includes(n)).join(', ')) || '—')
      : 'nothing scheduled';
    log.appendChild(row);
  });
  p.appendChild(log);
}

/* ============================ drag & drop ============================ */
let drag = null;
function startDrag(ev, cfg) {
  if (ev.button != null && ev.button !== 0) return;
  const rect = cfg.node.getBoundingClientRect();
  drag = { cfg, startX: ev.clientX, startY: ev.clientY, offX: ev.clientX - rect.left, offY: ev.clientY - rect.top, moved: false, ghost: null, ph: null, target: null, idx: 0 };
  ev.preventDefault();
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp, { once: true });
}
function onDragMove(ev) {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.abs(ev.clientX - drag.startX) < 5 && Math.abs(ev.clientY - drag.startY) < 5) return;
    drag.moved = true;
    tipBox.classList.remove('on');
    const c = drag.cfg;
    snap();
    let g, h;
    if (c.kind === 'tpl') {
      drag.payload = c.tpl.blocks.map(b => mkItem(b));
      g = el('div', 'tplghost', '⇩ ' + esc(c.tpl.name) + ' · ' + c.tpl.blocks.length + ' blocks');
      h = 46;
    } else {
      if (c.kind === 'lib') drag.payload = mkItem(c.src);
      else { const f = findItem(c.id); if (!f) return cancelDrag(); drag.payload = f.it; drag.from = f; f.arr.splice(f.i, 1); }
      g = blockNode('ghost', drag.payload, 0, drag.payload.dur, {});
      h = Math.max(blockMin(drag.payload.dur), 68);
    }
    g.id = 'dragghost'; g.style.minHeight = h + 'px';
    document.body.appendChild(g); drag.ghost = g;
    drag.ph = el('div', 'placeholder'); drag.ph.style.height = h + 'px';
    if (c.kind === 'move') renderBoardKeepDrag();
    document.body.style.cursor = 'grabbing';
  }
  drag.ghost.style.left = (ev.clientX - Math.min(drag.offX, 220)) + 'px';
  drag.ghost.style.top = (ev.clientY - drag.offY) + 'px';

  drag.ghost.style.display = 'none';
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  drag.ghost.style.display = '';
  const body = (under && under.closest('.lane-body')) || bodyAt(ev.clientX, ev.clientY);
  document.querySelectorAll('.lane').forEach(l => l.classList.remove('over'));
  if (!body) { if (drag.ph.parentNode) drag.ph.remove(); drag.target = null; return; }
  body.closest('.lane').classList.add('over');
  drag.target = body.dataset.lane;
  const kids = [...body.children].filter(k => k.classList.contains('block'));
  let idx = kids.length;
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (ev.clientY < r.top + r.height / 2) { idx = i; break; }
  }
  drag.idx = idx;
  const empty = body.querySelector('.lane-empty'); if (empty) empty.remove();
  if (kids[idx]) body.insertBefore(drag.ph, kids[idx]); else body.appendChild(drag.ph);
}
function renderBoardKeepDrag() { const keep = drag; renderBoard(); drag = keep; }
/** geometric fallback so drops near a routine's padding still land */
function bodyAt(x, y) {
  let hit = null;
  document.querySelectorAll('.lane').forEach(l => {
    const r = l.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = l.querySelector('.lane-body');
  });
  return hit;
}
function onDragUp() {
  window.removeEventListener('pointermove', onDragMove);
  document.body.style.cursor = '';
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  if (d.ph && d.ph.parentNode) d.ph.remove();
  /* a click that never became a drag must leave the DOM alone — re-rendering here
     destroyed the node between the two halves of a double-click */
  if (!d.moved) { if (d.cfg.onTap) d.cfg.onTap(); return; }
  if (d.target) {
    const arr = items(d.target);
    if (Array.isArray(d.payload)) arr.splice(d.idx, 0, ...d.payload);
    else arr.splice(d.idx, 0, d.payload);
  } else if (d.from) toast('block removed — <b>Ctrl+Z</b> to undo');
  else HIST.pop();
  render();
}
function cancelDrag() {
  window.removeEventListener('pointermove', onDragMove);
  if (drag && drag.ghost) drag.ghost.remove();
  if (drag && drag.moved) HIST.pop();
  drag = null; render();
}
window.addEventListener('keydown', e => { if (e.key === 'Escape' && drag) { const d = drag; if (d.from) d.from.arr.splice(d.from.i, 0, d.payload); cancelDrag(); } });

function startResize(ev, it, node) {
  ev.preventDefault(); ev.stopPropagation();
  const y0 = ev.clientY, h0 = node.getBoundingClientRect().height, d0 = it.dur;
  let last = d0;
  const mv = e => {
    const h = Math.max(30, h0 + (e.clientY - y0));
    const raw = (h - 22) / SCALE;
    const d = raw < 15 ? Math.max(1, Math.round(raw)) : Math.round(raw / 5) * 5;
    if (d !== last) { last = d; node.style.minHeight = blockMin(d) + 'px'; const b = node.querySelector('.b-dur b'); if (b) b.textContent = dur2s(d); }
  };
  const up = () => {
    window.removeEventListener('pointermove', mv);
    if (last !== d0) { snap(); it.dur = last; }
    render();
  };
  window.addEventListener('pointermove', mv);
  window.addEventListener('pointerup', up, { once: true });
}

/* ============================ exports ============================ */
/** rows for export. Week scope = every routine that owns a weekday, intersected with each block's own days. */
function allRows() {
  const weekly = S.exportScope === 'week' && S.week.some(Boolean);
  const vs = weekly ? S.variants.filter(v => S.week.includes(v.id)) : [M()];
  const out = [];
  vs.forEach(v => withVariant(v.id, () => {
    LANES(v.id).forEach(L => schedule(L.id).filter(r => !r.hidden).forEach(({ it, s, e }) => {
      const ed = effDays(L, it); const days = weekly ? ed.map((d, i) => d && S.week[i] === v.id ? 1 : 0) : ed;
      if (days.some(Boolean)) out.push({ v, lane: L, it, s, e, days, weekly });
    }));
  }));
  return out;
}
const bydays = days => days.map((d, i) => d ? ICSD[i] : null).filter(Boolean);
function daysLabel(days) {
  const on = days.map((d, i) => d ? i : -1).filter(i => i >= 0);
  if (!on.length) return '(no days)';
  if (on.length === 7) return 'every day';
  if (on.length === 5 && on.join() === '1,2,3,4,5') return 'every weekday';

}
function nextDateFor(days, minutes) {

  const shift = Math.floor(minutes / 1440);

    const d = new Date(base); d.setDate(base.getDate() + k);
    if (days[d.getDay()]) { d.setDate(d.getDate() + shift); return d; }
  }

}
function icsFold(line) { const out = []; let s = line; while (s.length > 73) { out.push(s.slice(0, 73)); s = ' ' + s.slice(73); } out.push(s); return out.join('\r\n'); }
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
const hms = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + pad(m % 60) + '00'; };

function buildICS() {
  const now = new Date();
  const stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + 'Z';
  const rows = allRows();
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BLOCK routine builder//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'X-WR-CALNAME:' + icsEsc(S.calName + (rows[0] && rows[0].weekly ? ' — week' : ' — ' + M().name)), 'X-WR-TIMEZONE:' + S.tz];
  rows.forEach(({ v, lane, it, s, e, days }) => {
    const bd = bydays(days); if (!bd.length) return;
    const d = nextDateFor(days, s);
    const d2 = new Date(d); d2.setDate(d.getDate() + (Math.floor(e / 1440) - Math.floor(s / 1440)));
    L.push('BEGIN:VEVENT');
    L.push('UID:' + it.id + '-' + v.id + '@block');
    L.push('DTSTAMP:' + stamp);
    if (s == null) {                                   /* untimed → an all-day recurring event */
      L.push('DTSTART;VALUE=DATE:' + ymd(d));
      const nd = new Date(d); nd.setDate(d.getDate() + 1);
      L.push('DTEND;VALUE=DATE:' + ymd(nd));
      L.push('RRULE:FREQ=WEEKLY;BYDAY=' + bd.join(','));
      L.push(icsFold('SUMMARY:' + icsEsc((it.pri ? '[P' + it.pri + '] ' : '') + it.name)));
      L.push('TRANSP:TRANSPARENT');
      L.push('END:VEVENT');
      return;
    }
    L.push('DTSTART:' + ymd(d) + 'T' + hms(s));
    L.push('DTEND:' + ymd(d2) + 'T' + hms(e));
    L.push('RRULE:FREQ=WEEKLY;BYDAY=' + bd.join(','));
    L.push(icsFold('SUMMARY:' + icsEsc((it.pri ? '[P' + it.pri + '] ' : '') + it.name)));
    if (it.pri) L.push('PRIORITY:' + [0, 1, 5, 9][it.pri]);
    L.push(icsFold('DESCRIPTION:' + icsEsc((it.note ? it.note + '\n' : '') + lane.name + ' · ' + v.name + ' · ' + dur2s(it.dur) + ' · ' + ENAME[energyOf(it)] + ' effort')));
    L.push(icsFold('CATEGORIES:' + icsEsc(lane.name)));
    L.push('TRANSP:OPAQUE');
    L.push('END:VEVENT');

}
function gcalLink(r) {
  const d = nextDateFor(r.days, r.s);
  const d2 = new Date(d); d2.setDate(d.getDate() + (Math.floor(r.e / 1440) - Math.floor(r.s / 1440)));
  const p = new URLSearchParams({
    action: 'TEMPLATE', text: (r.it.pri ? '[P' + r.it.pri + '] ' : '') + r.it.name,
    dates: ymd(d) + 'T' + hms(r.s) + '/' + ymd(d2) + 'T' + hms(r.e),
    details: (r.it.note ? r.it.note + ' — ' : '') + r.lane.name + ' · ' + r.v.name, ctz: S.tz,
  });
  const bd = bydays(r.days);
  return 'https://calendar.google.com/calendar/render?' + p.toString() + (bd.length ? '&recur=' + encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY=' + bd.join(',')) : '');
}
const csvQ = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
const tdPri = it => it.pri ? [0, 4, 3, 2][it.pri] : S.tdPriority;
function buildTodoistCSV() {
  const out = ['TYPE,CONTENT,DESCRIPTION,PRIORITY,INDENT,AUTHOR,RESPONSIBLE,DATE,DATE_LANG,TIMEZONE,DURATION,DURATION_UNIT'];
  const blank = ',,,,,,,,,,,';
  const rows = allRows();
  const sections = [...new Set(rows.map(r => (r.weekly && S.variants.length > 1 ? r.v.name + ' — ' : '') + r.lane.name))];
  sections.forEach(sec => {
    out.push(['section', csvQ(sec), '', '', '', '', '', '', '', '', '', ''].join(','));
    out.push(blank);
    rows.filter(r => ((r.weekly && S.variants.length > 1 ? r.v.name + ' — ' : '') + r.lane.name) === sec).forEach(r => {
      const when = daysLabel(r.days); if (when === '(no days)') return;
      out.push(['task', csvQ(r.it.name), csvQ(r.it.note || ''), tdPri(r.it), 1, '', '', csvQ(when + (r.s == null ? '' : ' at ' + hhmm(r.s))), 'en', csvQ(S.tz), r.it.dur, 'minute'].join(','));

}
function buildQuickAdd() {
  const out = []; let sec = null;
  allRows().forEach(r => {
    const s = (r.weekly ? r.v.name + ' / ' : '') + r.lane.name;
    if (s !== sec) { sec = s; out.push('', '# ' + s); }
    const when = daysLabel(r.days); if (when === '(no days)') return;
    out.push(r.it.name + ' ' + when + (r.s == null ? '' : ' at ' + hhmm(r.s)) + ' for ' + r.it.dur + 'min #' + S.tdProject.replace(/\s+/g, '')
      + (r.it.pri ? ' p' + r.it.pri : (S.tdPriority > 1 ? ' p' + (5 - S.tdPriority) : '')));
  });
  return out.join('\n').trim();
}
function buildText() {
  const rows = allRows();
  const out = ['# ' + S.calName + (rows[0] && rows[0].weekly ? ' — full week' : ' — ' + M().name), ''];
  let sec = null;
  rows.forEach(r => {
    const s = (r.weekly ? r.v.name + ' / ' : '') + r.lane.name;
    if (s !== sec) { sec = s; out.push('', '## ' + s); }
    out.push('- ' + fmt(r.s) + '–' + fmt(r.e) + '  ' + (r.it.pri ? '[P' + r.it.pri + '] ' : '') + r.it.name + (r.it.at ? ' ⚓' : '')
      + '  (' + dur2s(r.it.dur) + ', ' + EGLYPH[energyOf(r.it)] + ', ' + daysLabel(r.days) + ')' + (r.it.note ? ' — ' + r.it.note : ''));
  });

}
function download(name, text, mime) {

function copy(text) {

function fallbackCopy(text) {

  try { document.execCommand('copy'); toast('copied'); } catch (e) { toast('copy failed — select it manually'); }
  t.remove();
}

/* ── for someone else: a start, not a backup ──
   Tom, 2026-09-14: "Sometimes I'll help people start up." Backup is the whole
   board, history and all, and restoring it replaces everything on the other
   end: right for moving your own board, wrong for handing somebody a start.
   This carries only what was ticked: the days, the routines on them, their
   blocks, which weekdays each runs on, and any Every or Anytime habits. No
   ticks, no history, no settings, no rules.

   Importing ADDS. Every id is made new. A routine or day whose name is taken
   gets a number after it. A weekday that already has a day keeps it. An Every
   or Anytime habit whose name is taken is skipped, because its ticks are
   filed by name. The one exception is a board that is still the untouched
   starter: nobody built it, so it is replaced. */
let SHARE = null;
const starterCopy = o => JSON.parse(JSON.stringify(o));

function buildStarter(dayIds, rhIds, withBin) {
  const days = S.variants.filter(v => dayIds.indexOf(v.id) >= 0);
  const used = {}, src = {};
  days.forEach(v => LANES(v.id).forEach(l => { used[l.id] = 1; }));
  const outDays = days.map(v => {
    const d = starterCopy(v);
    delete d.date;
    d.routines = LANES(v.id).map(l => l.id);
    d.items = {};
    d.routines.forEach(lid => {
      d.items[lid] = (v.items[lid] || []).map(it => {
        src[it.srcId] = 1;
        const c = starterCopy(it);
        c.done = false; delete c.skipped;
        return c;
      });
    });
    d.weekdays = [0, 1, 2, 3, 4, 5, 6].filter(k => S.week[k] === v.id);
    return d;
  });
  return {
    kind: 'motherbase-block-starter', v: 1, at: new Date().toISOString(),
    lanes: S.lanes.filter(l => used[l.id]).map(l => starterCopy(l)),
    lib: (S.lib || []).filter(b => withBin || src[b.id]).map(b => starterCopy(b)),
    days: outDays,
    /* the first due date is the giver's, so the other end starts from its own today */
    rhythms: (S.rhythms || []).filter(r => rhIds.indexOf(r.id) >= 0).map(r => { const c = starterCopy(r); delete c.from; return c; }),
  };
}

function importStarter(pack) {
  if (pack && pack.lanes && pack.variants && !pack.kind) throw new Error('That is a full backup, not a file made for someone else. Restore it from Export, Backup.');
  if (!pack || pack.kind !== 'motherbase-block-starter') throw new Error('That is not a BLOCK file made for someone else.');
  snap();
  const days = pack.days || [];
  /* Untouched means nobody built anything on it. A tick is not building: the
     starter's blocks pick up a tick from the shared log the moment somebody
     with a "Brush teeth" of their own opens BLOCK, so ticks are left out of
     the comparison. */
  const bare = st => {
    const c = starterCopy(st);
    (c.variants || []).forEach(v => Object.keys(v.items || {}).forEach(k => v.items[k].forEach(it => { it.done = false; delete it.skipped; })));
    return boardShape(c);
  };
  const fresh = days.length > 0 && (showingDemo || bare(S) === bare(seedState()));
  if (fresh) { S.lanes = []; S.variants = []; S.lib = []; S.week = [null, null, null, null, null, null, null]; }
  const low = s => String(s || '').toLowerCase();
  const uniq = (name, taken) => { let n = name, k = 2; while (taken[low(n)]) n = name + ' (' + (k++) + ')'; taken[low(n)] = 1; return n; };
  const got = { days: 0, routines: 0, rhythms: 0, skipped: 0, busy: 0, filled: 0 };
  /* A day made for one person usually runs on no weekday on the giver's
     board, whose week is the giver's own. Arriving like that it would run on
     nothing, so the first day takes every weekday that has no day yet. */
  const noWeek = !days.some(d => (d.weekdays || []).length);

  /* A day with no list of its own runs every routine there is, so it would
     quietly pick up the new ones. Written down first, so it keeps exactly
     the routines it had. */
  S.variants.forEach(v => { if (!v.routines) v.routines = S.lanes.map(l => l.id); });

  const laneTaken = {}, laneMap = {};
  S.lanes.forEach(l => { laneTaken[low(l.name)] = 1; });
  (pack.lanes || []).forEach(l => {
    const id = uid();
    laneMap[l.id] = id;
    S.lanes.push(Object.assign(starterCopy(l), { id: id, name: uniq(l.name, laneTaken) }));
    S.variants.forEach(v => { v.items[id] = []; });
    got.routines++;
  });

  /* a bin block with a name already on the shelf is that block, not a second one */
  const libByName = {}, libMap = {};
  S.lib.forEach(b => { libByName[low(b.name)] = b.id; });
  (pack.lib || []).forEach(b => {
    if (libByName[low(b.name)]) { libMap[b.id] = libByName[low(b.name)]; return; }
    const id = uid();
    libMap[b.id] = id; libByName[low(b.name)] = id;
    S.lib.push(Object.assign(starterCopy(b), { id: id }));
  });

  const dayTaken = {};
  S.variants.forEach(v => { dayTaken[low(v.name)] = 1; });
  days.forEach(d => {
    const v = starterCopy(d), wd = v.weekdays || [];
    delete v.weekdays;
    v.id = uid(); v.name = uniq(d.name, dayTaken);
    v.routines = (d.routines || []).map(id => laneMap[id]).filter(Boolean);
    v.items = {};
    S.lanes.forEach(l => { v.items[l.id] = []; });
    Object.keys(d.items || {}).forEach(old => {
      if (!laneMap[old]) return;
      v.items[laneMap[old]] = d.items[old].map(it => Object.assign(starterCopy(it), { id: uid(), srcId: libMap[it.srcId] || uid(), done: false }));
    });
    S.variants.push(v);
    wd.forEach(k => { if (S.week[k]) got.busy++; else S.week[k] = v.id; });
    if (noWeek && got.days === 0) for (let k = 0; k < 7; k++) { if (!S.week[k]) { S.week[k] = v.id; got.filled++; } }
    got.days++;
  });

  S.rhythms = S.rhythms || [];
  (pack.rhythms || []).forEach(r => {
    if (S.rhythms.some(x => low(x.name) === low(r.name))) { got.skipped++; return; }
    const c = Object.assign(starterCopy(r), { id: uid() });
    if (c.kind === 'every') c.from = todayKey();
    S.rhythms.push(c);
    got.rhythms++;
  });

  if ((fresh || !variant(S.current)) && S.variants.length) S.current = S.variants[0].id;
  save(); render();
  return got;
}

function pickStarter() {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = '.json,application/json';

          (got.rhythms ? ' and ' + n('rhythms', 'habit', 'habits') : '') +
          (got.busy ? '. ' + n('busy', 'weekday', 'weekdays') + ' already had a day, so kept it' : '') +
          (got.filled ? '. It runs on the ' + n('filled', 'weekday', 'weekdays') + ' that had nothing on them' : '') +
          (got.skipped ? '. ' + n('skipped', 'habit was', 'habits were') + ' already here, so skipped' : ''));
      } catch (e) { toast(esc(e && e.message ? e.message : 'That file could not be read.')); }
    };
    fr.readAsText(f);
  };
  i.click();
}

    '<div class="hint">For helping somebody start. This is the day on screen, <b>' + esc(v.name) + '</b>: ' + n + (n === 1 ? ' routine' : ' routines') +

/* ============================ self-test ============================
 * Drives the REAL DOM events every control uses — pointer sequences, clicks,
 * contextmenu, submenu hovers — because testing the functions behind them is
 * exactly how the bin double-click and the vanishing submenu got shipped broken.
 * Runs on a scratch state and restores yours afterwards. ⚙ → Run self-test.
 */
function selfTest() {
  const backup = JSON.stringify(S);
  const R = [];
  /* Three results, not two. A check that needs a laid-out window cannot answer
     anything in a pane with no height, and reporting that as FAIL is how a list
     of checks stops being read. Return 'skip: <reason>' and it says so. */
  const ok = (name, fn) => {
    try {
      const r = fn();
      if (typeof r === 'string' && r.slice(0, 5) === 'skip:') { R.push(['skip', name, r.slice(5).trim()]); return; }
      R.push([r === true, name, r === true ? '' : String(r)]);
    } catch (e) { R.push([false, name, e.message]); }
  };
  const pd = (n, x, y) => n.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, pointerId: 1 }));
  const pm = (x, y) => window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: x, clientY: y, pointerId: 1 }));
  const pu = (x, y) => window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, clientX: x, clientY: y, pointerId: 1 }));
  const rc = n => n.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 200, clientY: 200 }));
  const enter = n => n.dispatchEvent(new MouseEvent('mouseenter', { bubbles: false }));
  const chip = nm => [...document.querySelectorAll('.chip')].find(c => c.textContent.includes(nm));
  /* ── the nth block in the bin, whatever it happens to be ──
     These checks used to name blocks: chip('Coffee'), chip('Journal'). Trimming
     the starter list to a shorter, more generic set broke four of them, which
     is a test failing because the DEFAULTS changed rather than because the
     BEHAVIOUR did. A test that pins the contents of an editable list is testing
     the wrong thing. */
  const nthChip = i => [...document.querySelectorAll('.chip')][i];
  const blocks = () => [...document.querySelectorAll('.block')];
  const tap = n => { const r = n.getBoundingClientRect(); pd(n, r.x + 25, r.y + 4); pu(r.x + 25, r.y + 4); };

  try {
    /* ── the test builds its own world ──
       It used to lean on seedState() shipping routines and blocks. It ships
       neither now, deliberately, so leaning on that was leaning on a default
       rather than on behaviour — the same mistake as naming chip('Coffee').
       Two routines and three blocks, made here, so what is under test is the
       app and not the starter content. */
    S = seedState(); S.view = 'day'; closeModal();
    S.lanes = [
      { id: uid(), name: 'Test A', start: '06:00', target: '09:00' },
      { id: uid(), name: 'Test B', start: '12:00', target: '' },
    ];
    S.lib = [
      { id: uid(), name: 'Alpha', dur: 10, color: PAL[0], cat: 'Test', energy: 1 },
      { id: uid(), name: 'Bravo', dur: 20, color: PAL[1], cat: 'Test', energy: 2 },
      { id: uid(), name: 'Charlie', dur: 60, color: PAL[2], cat: 'Test', energy: 3 },
    ];
    S.variants.forEach(v => { v.routines = S.lanes.map(l => l.id); S.lanes.forEach(l => { v.items[l.id] = []; }); });
    render();
    const L = S.lanes[0].id, L2 = S.lanes[1].id;

    ok('bin block: single click adds it', () => { tap(nthChip(0)); return items(L).length === 1 || 'got ' + items(L).length; });
    ok('bin block: clicking twice adds two', () => { tap(nthChip(1)); return items(L).length === 2 || 'got ' + items(L).length; });
    ok('bin block: drag into a routine', () => {
      const c = nthChip(2), r = c.getBoundingClientRect(), t = document.querySelectorAll('.lane')[1].getBoundingClientRect();
      pd(c, r.x + 25, r.y + 4); pm(r.x + 40, r.y + 30); pm(t.x + t.width / 2, t.y + 2); pu(t.x + t.width / 2, t.y + 2);
      return items(L2).length === 1 || 'landed ' + items(L2).length;
    });
    ok('block: drag between routines', () => {
      const b = blocks()[0], r = b.getBoundingClientRect(), t = document.querySelectorAll('.lane')[1].getBoundingClientRect();
      pd(b, r.x + 40, r.y + 2); pm(r.x + 50, r.y + 30); pm(t.x + t.width / 2, t.y + 2); pu(t.x + t.width / 2, t.y + 2);
      return items(L2).length === 2 || 'landed ' + items(L2).length;
    });
    ok('block: start-time popover anchors it', () => {
      blocks()[0].querySelector('.b-time,.b-mtime').click();
      const p = document.querySelector('.pop'); if (!p) return 'no popover';
      p.querySelector('input').value = '07:30'; p.querySelector('.btn.acc').click();
      return !!findItem(blocks()[0].dataset.id) && S.lanes.flatMap(l => items(l.id)).some(i => i.at === '07:30') || 'not anchored';
    });
    ok('block: end-time popover sets the duration', () => {
      const b = blocks().find(x => x.querySelector('.b-end')); if (!b) return 'no full card';
      const it = findItem(b.dataset.id).it, before = it.dur;
      const st = schedule(findItem(b.dataset.id).laneId).find(r => r.it.id === it.id);
      b.querySelector('.b-end').click();
      const p = document.querySelector('.pop'); if (!p) return 'no popover';
      p.querySelector('input').value = hhmm(st.s + 45); p.querySelector('.btn.acc').click();
      return it.dur === 45 || 'dur ' + it.dur + ' (was ' + before + ')';
    });
    ok('block: duration popover accepts 1 minute', () => {
      const b = blocks().find(x => x.querySelector('.b-dur b'));
      const it = findItem(b.dataset.id).it;
      b.querySelector('.b-dur b').click();
      const p = document.querySelector('.pop'); p.querySelector('input').value = '1'; p.querySelector('.btn.acc').click();
      return it.dur === 1 || 'dur ' + it.dur;
    });
    ok('duration steps: 1 below 10, 5 from 10 up', () => (durStep(1) === 1 && durStep(9) === 1 && durStep(10) === 5 && durStep(45) === 5) || 'steps wrong');
    ok('compact: works at any duration', () => {
      const it = S.lanes.flatMap(l => items(l.id)).find(i => i.dur >= 20) || items(L2)[0];
      it.dur = 30; it.compact = true; render();
      const n = document.querySelector('[data-id="' + it.id + '"]');
      const r = n.classList.contains('mini'); it.compact = null; render();

    });
    ok('right-click: block menu opens', () => { rc(blocks()[0]); const m = document.querySelector('.ctxmenu'); const n = m && m.querySelectorAll('.mi').length; closeMenu(); return n > 8 || 'items ' + n; });
    ok('right-click: submenu survives crossing sibling rows', () => {
      rc(blocks()[0]);
      const m = document.querySelector('.ctxmenu');
      const days = [...m.querySelectorAll('.mi')].find(x => x.textContent.startsWith('Days'));
      enter(days);
      if (!document.querySelector('.ctxmenu.sub')) return 'submenu never opened';
      [...m.querySelectorAll('.mi')].slice(0, 3).forEach(enter);
      const alive = !!document.querySelector('.ctxmenu.sub');
      closeMenu();
      return alive || 'submenu vanished on the way over';
    });
    ok('right-click: submenu action applies', () => {
      const it = findItem(blocks()[0].dataset.id).it;
      rc(blocks()[0]);
      const m = document.querySelector('.ctxmenu');
      enter([...m.querySelectorAll('.mi')].find(x => x.textContent.startsWith('Days')));
      const row = [...document.querySelector('.ctxmenu.sub').querySelectorAll('.mi')].find(x => /every day/i.test(x.textContent));
      if (!row) return 'no “every day” row in the Days submenu';
      row.click();
      return (it.daysEx && it.days.join('') === '1111111') || 'daysEx ' + !!it.daysEx + ' days ' + it.days.join('');
    });
    ok('right-click: routine menu opens', () => { rc(document.querySelector('.lane-head')); const n = document.querySelectorAll('.ctxmenu .mi').length; closeMenu(); return n > 5 || 'items ' + n; });
    ok('right-click: bin menu opens', () => { rc(nthChip(0)); const n = document.querySelectorAll('.ctxmenu .mi').length; closeMenu(); return n >= 5 || 'items ' + n; });
    ok('check-off: ticking everything resets the list', () => {
      const vid = routineForToday(), td = todaysBlocks(vid);
      if (!td.length) return 'nothing scheduled today';
      td.forEach(b => b.done = true); render();
      const allOn = document.querySelectorAll('.b-check.on').length === document.querySelectorAll('.block').length;
      clearDone(vid); render();
      return allOn || 'checkboxes did not all show';
    });
    ok('rules: a broken rule is detected and shown', () => {
      const nm = S.lanes.flatMap(l => items(l.id))[0].name;
      S.rules = [{ id: 'test', kind: 'notafter', a: nm, time: '00:01', on: true }];
      render();
      const found = RULECHK.count > 0 && document.querySelectorAll('.block.broke').length > 0;
      S.rules = []; render();
      return found || 'not flagged';
    });
    ok('exports: all four builders produce output', () => {
      const a = buildICS(), b = buildTodoistCSV(), c = buildQuickAdd(), d = buildText();
      return (/BEGIN:VEVENT/.test(a) && /^task/m.test(b) && c.length > 5 && d.length > 5) || 'a builder came back empty';
    });
    ok('undo: Ctrl+Z restores the previous arrangement', () => {
      const before = items(L).length;
      addItem(L, { name: 'zz', dur: 5, color: '#fff', energy: 1 });
      undo();
      return items(L).length === before || 'expected ' + before + ' got ' + items(L).length;
    });
    /* ── one level under "Check Ins also ticks Bed" ──
       The symptom was two named blocks moving together. The mechanism is that
       a block's tick identity could stop matching its name, and then any two
       blocks could collide, in any combination, with no clue on screen. So the
       check is on the mechanism: a rename must move the identity with it. */
    ok('a renamed block takes its tick identity with it', () => {
      const it = addItem(L, { name: 'New block', dur: 5, color: '#fff', energy: 1 });
      const before = actIdOf(it);
      it.name = 'Check Ins & Online Coaching';
      const after = actIdOf(it);
      removeItem(L, it.id);
      const r = '.' + LifeOS.slug(lane(L).name);
      if (before !== 'new-block' + r) return 'placeholder id was ' + before;
      return after === 'check-ins-online-coaching' + r || 'stayed ' + after;
    });
    /* One level under both "Check Ins also ticks Bed" and "the two Brush Teeth
       sync". Both bugs were an identity that stopped meaning what it said: a
       stamp left over from a placeholder name, and a name that ignored the
       routine. So: no block carries a stored id, and blocks in two different
       routines never land on one row. */
    ok('routines never share a tick row, and no block carries a stored id', () => {
      const seen = {}, bad = [];
      S.variants.forEach(v => S.lanes.forEach(l => (v.items[l.id] || []).forEach(it => {
        if (it.actId) bad.push(it.name + ' carries a stored id ' + it.actId);
        const id = actIdOf(it, l);
        if (seen[id] && seen[id] !== l.id) bad.push(id + ' is shared by two routines');
        seen[id] = l.id;
      })));
      return !bad.length || bad.join(', ');
    });
    /* One level under "the evening brush came back undefined": the shared log
       has to answer a yes or a no. Anything else compared with !== against a
       box's false is a phantom change. */
    ok('the shared log answers yes or no, never nothing', () => {
      const never = LifeOS.isDone('zz-never-written.nowhere', todayKey());
      return typeof never === 'boolean' || 'a missing row answered ' + String(never);
    });
    /* The second mechanism: twins found by name wrote "any of them done", so
       unticking the morning brush with the evening one ticked wrote the morning
       row straight back to true. Driven with real clicks on the real boxes. */
    ok('the same block in two routines ticks separately, both ways', () => {
      const R = LANES();
      if (R.length < 2) return 'skip: needs two routines on this day';
      const a = addItem(R[0].id, { name: 'zz brush', dur: 5, color: '#fff', energy: 1 });
      const b = addItem(R[1].id, { name: 'zz brush', dur: 5, color: '#fff', energy: 1 });
      const ia = actIdOf(a, R[0]), ib = actIdOf(b, R[1]), t = todayKey();
      const box = x => document.querySelector('[data-id="' + x.id + '"] .b-check');
      const out = [];
      box(b).click();                                   /* evening brushed */
      box(a).click(); box(a).click();                   /* morning ticked, then unticked */
      out.push(ia !== ib, !LifeOS.isDone(ia, t), !!LifeOS.isDone(ib, t), !a.done, !!b.done);
      if (b.done) box(b).click();
      LifeOS.done(ia, t, false, { src: 'test' }); LifeOS.done(ib, t, false, { src: 'test' });
      removeItem(R[0].id, a.id); removeItem(R[1].id, b.id);
      return out.every(Boolean) || 'different ids ' + out[0] + ', morning row clear ' + out[1] +
        ', evening row kept ' + out[2] + ', morning box clear ' + out[3] + ', evening box kept ' + out[4];
    });
    ok('week view renders 7 days', () => { S.view = 'week'; render(); const n = document.querySelectorAll('.day').length; S.view = 'day'; render(); return n === 7 || 'got ' + n; });
    ok('week view: a checkbox ticks the block', () => {
      S.week[todayIdx()] = S.current; S.view = 'week'; render();
      const ck = document.querySelector('.day-ck');
      if (!ck) { S.view = 'day'; render(); return 'no checkbox'; }
      ck.click();
      /* The click writes a real row in the shared log, and this check used to
         leave it there. The next run on the same store then started with that
         box already on, clicked it off, and reported "nothing ticked". A check
         that fails only on its second run is a check about its own litter. */
      const ticked = S.lanes.flatMap(l => items(l.id).filter(i => i.done).map(i => [i, l]));
      ticked.forEach(([i, l]) => LifeOS.done(actIdOf(i, l), todayKey(), false, { src: 'test' }));
      S.lanes.forEach(l => items(l.id).forEach(i => i.done = false));
      S.view = 'day'; render();
      return ticked.length > 0 || 'nothing ticked';
    });
    ok('week: priority mode groups by P, keeps the routine as subtitle', () => {
      const it = LANES().flatMap(l => items(l.id))[0]; it.pri = 1;
      S.week = S.week.map(() => S.current);
      S.view = 'week'; S.weekMode = 'pri'; render();
      const heads = [...document.querySelectorAll('.day-lane')].map(x => x.textContent);
      S.weekMode = 'time'; S.view = 'day'; render();
      return heads.includes('P1') || 'headings ' + heads.join(',');
    });
    ok('a routine can be dropped from one day and kept in others', () => {
      const other = seedVariant('Other day');
      S.lanes.forEach(l => other.items[l.id] = []);
      other.routines = S.lanes.map(l => l.id);
      S.variants.push(other);
      const keep = S.current; S.current = other.id;
      const before = LANES().length;
      removeLaneFromDay(S.lanes[0].id);
      const after = LANES().length;
      S.current = keep;
      const stillHere = LANES().some(l => l.id === S.lanes[0].id);
      S.variants = S.variants.filter(v => v.id !== other.id);
      return (after === before - 1 && stillHere) || 'dropped ' + before + '→' + after + ', other day kept ' + stillHere;
    });
    ok('finished routines can slide right or hide', () => {
      const L = LANES()[0];
      items(L.id).forEach(i => i.done = true);
      if (!items(L.id).length) return 'no blocks';
      S.doneRoutines = 'right'; render();
      const last = [...document.querySelectorAll('.lane-name')].pop();
      const wentRight = last && last.value === L.name;
      S.doneRoutines = 'hide'; render();
      const hidden = ![...document.querySelectorAll('.lane-name')].some(i => i.value === L.name) && !!document.querySelector('.donenote');
      S.doneRoutines = 'stay'; items(L.id).forEach(i => i.done = false); render();
      return (wentRight && hidden) || 'right ' + wentRight + ', hide ' + hidden;
    });
    ok('the same block in two routines ticks independently', () => {
      const A = LANES()[0], B = LANES()[1];
      if (!A || !B) return 'need 2 routines';
      const am = addItem(A.id, { name: 'Brush teeth', dur: 3, color: PAL[0], energy: 1 });
      const pm = addItem(B.id, { name: 'Brush teeth', dur: 3, color: PAL[0], energy: 1 });
      am.done = false; pm.done = false;
      toggleDone(am);
      const split = am.done === true && pm.done === false;
      /* and the history keeps them apart too */
      logToday();
      const e = S.log[todayKey()] || { t: [], d: [] };
      const keysDiffer = tickKey(am, A) !== tickKey(pm, B);
      const loggedOne = e.d.filter(k => keyName(k) === 'Brush teeth').length === 1;
      toggleDone(am);
      [am, pm].forEach(x => { const f = findItem(x.id); if (f) f.arr.splice(f.i, 1); });
      render();
      return (split && keysDiffer && loggedOne) || 'independent ' + split + ', keys differ ' + keysDiffer + ', logged ' + loggedOne;

 * layer (notes, effort, priority) and keeps the times, names and tick boxes.

function buildPrint(client, noDialog) {
  const a = $('#printarea') || document.body.appendChild(el('div', null, '')); a.id = 'printarea';
  const rows = S.lanes.map(L => ({ L, sc: schedule(L.id).filter(r => !r.hidden) })).filter(x => x.sc.length);

    '<h1>' + esc(client ? S.calName : M().name) + '</h1>' +
    '<div class="psub">' + esc(client ? '' : S.calName + ' · ') + rows.reduce((n, x) => n + x.sc.length, 0) + ' blocks · ' +
    dur2s(S.lanes.reduce((n, l) => n + laneMins(l.id), 0)) + (client ? '' : ' · load ' + S.lanes.reduce((n, l) => n + laneLoad(l.id), 0).toFixed(1)) + '</div>' +
    rows.map(({ L, sc }) =>
      '<div class="prt"><h2>' + esc(L.name) + (L.start != null ? ' · ' + fmt(hm2min(L.start)) + '–' + fmt(laneEnd(L.id)) : '') + '</h2>' +
      sc.map(r =>
        '<div class="pb"><span class="box"></span><span class="pt">' + (r.s == null ? '' : fmt(r.s) + ' – ' + fmt(r.e)) + '</span>' +
        '<span class="pn">' + esc(r.it.name) + (client ? '' : (r.it.pri ? ' [P' + r.it.pri + ']' : '')) + '</span>' +
        '<span class="pd">' + dur2s(r.it.dur) + (client ? '' : ' ' + EGLYPH[energyOf(r.it)]) + '</span></div>' +

/* BLOCK owns these three, so it says so once and gets backup, the readable
   spreadsheet and the sheet mirror for free, the same as every other app. */
/* `rhythm` and `plan` were declared to the store and never registered here,
   so an Every or Anytime habit and the published plan never went to the sheet
   and never reached another device (found 2026-09-15). `reads`: ticks from
   the apps that tick BLOCK's blocks, from their own sheet tabs. */
/* ══════════════ the calendar ══════════════
   Tom, 2026-09-17: "I think I just want to push the routines and not the
   individual blocks. Can you write the blocks as details IN the routines?"

   So one event per ROUTINE per day, running from its start to where its last
   block ends, with the blocks listed inside it. A calendar of forty entries a
   day is a calendar nobody opens; four is a day you can read at a glance, and
   the detail is one tap away when you want it.

   What is NOT sent, and why:
     · A routine with no start time. It is an ordered list, not a time, and a
       calendar has nowhere to put it.
     · A hidden block, and a block on a routine that is not running that day.
     · Anything before today. The past is a record and the calendar is a plan;
       rewriting last week every sync would be work for nothing.

   `CAL_DAYS` ahead, because a weekday template is the same every week and
   pushing a year of it would be a year to clean up if he stops.

   The KEY is what makes a second push an update rather than a duplicate. It is
   the date and the routine, which is exactly what one event means here, so the
   same routine on the same day always lands on the same event however many
   times this runs. */
const CAL_DAYS = 14;
function calEvents() {
  const out = [];
  const t = todayKey();
  for (let i = 0; i < CAL_DAYS; i++) {
    const key = shiftDate(t, i);
    const vid = dayForDate(key);
    if (!vid) continue;
    const v = variant(vid);
    if (!v) continue;
    withVariant(vid, () => {
      LANES(vid).forEach(L => {
        if (!dayHas(v, L.id)) return;
        if (L.start == null) return;
        const end = laneEnd(L.id);
        if (end == null) return;
        const sc = schedule(L.id).filter(r => !r.hidden);
        if (!sc.length) return;
        /* The blocks, as they read on the board: the clock, the name, how long.
           A timeless block has no clock and says so rather than borrowing one. */
        const lines = sc.map(r => {
          const name = String((r.it && r.it.name) || '').trim() || 'Block';
          if (r.timeless || r.s == null) return '\u2022 ' + name;
          return fmt(r.s) + '  ' + name + (r.it.dur ? '  (' + dur2s(r.it.dur) + ')' : '');
        });
        const note = String(L.note || '').trim();
        out.push({
          key: key + '|' + L.id,
          date: key,
          start: hhmm(hm2min(L.start)),
          end: hhmm(end),
          title: String(L.name || 'Routine').trim(),
          details: lines.join('\n') + (note ? '\n\n' + note : ''),
        });
      });
    });
  }
  /* In date order, because the script clears the window between the first and
     the last before writing, and a window read off an unsorted list is wrong. */
  out.sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start));
  return out;
}

IO.register({ app: 'block', name: 'BLOCK', types: ['lane', 'item', 'routine', 'rhythm', 'plan'],
  calendar: calEvents,
  reads: { status: ['tick', 'activity'], quest: ['tick', 'activity'], log: ['tick', 'activity'],
    train: ['tick', 'activity'], speak: ['tick', 'activity'] } });

/* ── rows that arrive after the board is already on screen ──

   Two ways that happens. A row over 64KB lives only in IndexedDB and lands a
   few milliseconds after boot; nothing here is that big today, but a pasted
   note on a block would be. And a sync, or this app open in another tab, can
   hand over a whole board at any moment.

   BLOCK used to read its lanes and routines out of the store exactly once, at
   startup. So a sync worked, the rows were genuinely there, and the screen
   went on showing what it had loaded until the page was reloaded. Same
   rebuild, run whenever the store says something moved.

   Two guards. `touched` means an edit is still on its way to the store, and
   that edit is the newer one, so it is left alone. And a rebuild that comes
   out identical to what is already on screen is dropped without a repaint,
   which is what makes this cost nothing when the row that moved was our own.

   ── and then a third, 2026-09-17: the board does not move under your hands ──

   Those two guards covered a quarter of a second each. `touched` is only the
   gap between changing something and it reaching the store, and `drag` is
   only while the mouse button is actually down. Everything else about
   building a board was unprotected, and the sheet is read every forty five
   seconds while the app is on screen, so ten minutes of laying out a week
   took thirteen full repaints. Each one throws away the board object, builds
   a new one, and redraws: the menu you had open closes, the name you were
   halfway through typing goes, what you had selected clears, and the scroll
   jumps. Tom, 2026-09-16: "Things get missarranged, I don't want block to
   update so much."

   Nothing about the sync changed. It still pulls on the same clock and rows
   still merge the moment they land, so no edit of yours and none of another
   device's is lost or delayed by this. What waits is the REPAINT. While you
   are working the board on screen is left exactly as it is, and the rebuild
   is taken the first moment you are not: twenty seconds with no click and no
   key, nothing open, nothing focused.

   Working means any of these, and the clock is the last of them on purpose —
   a menu left open or a cursor left in a text box is someone mid-thought, and
   no amount of sitting still makes it a good moment to redraw. */
const QUIET_MS = 20000;
let lastTouch = 0;
let quietT = null;
/* Any press or key anywhere counts, taken in the capture phase so it is seen
   whatever the target does with the event afterwards. */
['pointerdown', 'keydown', 'wheel'].forEach(ev =>
  document.addEventListener(ev, () => { lastTouch = Date.now(); }, true));

/** Why now is a bad moment to redraw, or null when it is a fine one. */
function boardBusy() {
  if (touched) return 'saving';
  if (typeof drag !== 'undefined' && drag) return 'dragging';
  /* BLOCK's own modal, its right-click menu and its popovers, plus the shared
     layer's menus and sheets. All four are put into the page when they open
     and taken out when they close, so being there is being open. */
  if (document.querySelector('#veil.on, .ctxmenu, .pop, .mb-menu, .mb-sheet')) return 'open';
  const a = document.activeElement;
  if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return 'typing';
  if (Date.now() - lastTouch < QUIET_MS) return 'working';
  return null;
}

/** Turned away for now. Ask again once the reason has had time to pass.
    Re-arms itself if you are still busy when it fires, so an update can never
    be dropped for good — it only ever waits. */
function adoptSoon() {
  pendingAdopt = true;
  clearTimeout(quietT);
  quietT = setTimeout(() => {
    quietT = null;
    if (!pendingAdopt) return;
    pendingAdopt = false;
    adoptRows();
  }, QUIET_MS + 500);
}

function adoptRows() {
  const why = boardBusy();
  if (why) { adoptSoon(); return false; }
  clearTimeout(quietT); quietT = null;
  const fresh = blockState();
  if (!fresh) return false;

  const before = boardSig(S);

  /* ── a demo an older version already wrote down ──

     The demo is not saved any more, but versions before this one saved it the
     moment the app opened, so there are devices carrying starter rows with
     their own random ids. Those cannot merge with anybody else's and would sit
     alongside the real board as a second Morning Routine.

     Recognised by shape rather than by id, and only when it is untouched, so a
     starter board you have changed anything at all about is yours and is left
     alone. Then it is cleared out and the real one takes its place. */
  const demoNow = boardShape(seedState());
  if (showingDemo || boardShape(S) === demoNow) {
    if (boardShape(fresh) !== demoNow) {          /* a real board has turned up */
      /* Clear our own starter rows first, if an older version wrote them down.
         Ours by name, taken from the board we are showing, so nothing that
         arrived is touched. */
      if (!showingDemo) {
        const mine = blockRows(S);
        ['lane', 'routine', 'item'].forEach(t => Object.keys(mine[t]).forEach(k => Rec.del(t, null, k)));
      }
      const after = blockState();
      if (after) {
        S = after; normalise(); lastRows = rowSnap(blockRows()); showingDemo = false;
        try { render(); } catch (e) {}
        return true;
      }
    }
  }

  if (boardSig(fresh) === before) return false;  /* nothing moved that we can see */
  showingDemo = false;
  S = fresh; normalise(); lastRows = rowSnap(blockRows());
  try { render(); } catch (e) {}
  return true;
}
/* ── the board is taken once, when you open it ──

   Tom, 2026-09-17: "BLock never really have to update because I only use it
   on my pc, once instance at a time."

   That is the whole case for a live subscription gone. `Rec.on(adoptRows)`
   existed so that a board arriving from somewhere else — another device, the
   sheet, a second tab — would appear without a reload. Nobody is on the other
   end of it. What it actually did was hand BLOCK a reason to rebuild and
   redraw the board every forty five seconds, which is the sheet's clock, in
   the middle of the one job this app has.

   So the board is read out of the store when the app opens and it is yours
   until you open it again. `Rec.ready` stays, and it is not the same thing: a
   row over 64KB lives only in IndexedDB and lands a few milliseconds after
   boot, so without it a pasted note on a block would be missing from the first
   paint. That is still the opening, not an interruption.

   Nothing about the sync changed. BLOCK still pushes every edit up and still
   pulls everything down; the rows are in the store either way and no work is
   lost in either direction. What no longer happens is the SCREEN changing
   while you are looking at it. If a board ever does arrive from elsewhere, it
   is on screen the next time BLOCK is opened.

   The guards above are not dead with this gone. `Rec.ready` can answer up to
   two and a half seconds after boot, by which time you may already be
   clicking, and writeRows still asks for a rebuild it had to defer. Both go
   through the same door. */
Rec.ready(adoptRows);

/* ── and a board that arrives while it is already open ──

   Tom, 2026-09-17: "Block, my local file is syncing supposedly, my web page
   version isnt getting it."

   He is right and the paragraph above is what did it. It took "I only use it
   on my pc, once instance at a time" as a description of BLOCK's world and
   cut the wire on that basis, and he has at least two copies: the folder on
   this machine and the one on the web, with the sheet between them. So the
   rows genuinely arrived, merged and sat in the store while the screen went on
   showing the board it had read at boot, until the page was reloaded — and
   nothing said so, which is the part that makes it look like the sync is
   broken when the sync is fine.

   Cutting the subscription was the wrong half to cut. What he actually
   complained about, "Things get missarranged, I don't want block to update so
   much", was already answered by the quiet rule above: the repaint waits for
   twenty seconds with no click, no key, nothing open and nothing focused, and
   a rebuild that comes out the same as what is on screen is dropped without
   drawing anything. Those two together mean your own editing never repaints
   and a board from elsewhere never lands mid-sentence. The subscription only
   ever decides WHETHER the screen catches up; the guards decide when.

   So it goes through `adoptSoon` rather than straight to `adoptRows`: every
   arriving row asks for the quiet moment and resets the wait, so a sync that
   brings down forty rows asks once. */
Rec.on(adoptSoon);

/* ══════════════════════ LifeOS bridge ══════════════════════
   BLOCK owns the schedule. LifeOS owns what actually got done. Three wires:
     library  →  the shared activity vocabulary (so HABITS can promote any of it)
     ticks    →  the shared day log (so a tick here is a tick everywhere)
     plan     →  today's blocks, published for the home screen to show and tick
   Blocks are matched across apps by name AND routine: see actIdOf below.  */
/* ── a block's tick identity is its NAME, worked out fresh every time ──
   This used to be cached: the first time a block was asked for its identity it
   was stamped with the slug of whatever it was called AT THAT MOMENT, and the
   stamp was never revisited. Every block starts life called "New block", so a
   board built the ordinary way — click "+ New block", type the real name over
   it — left every one of them stamped `new-block`, and the shared log then
   believed eight different things were one thing. Ticking Check Ins also
   ticked Bed, Daily Pic and both Meds.

   The guard against exactly that (pullDone's `seen[it.name] > 1`) asks whether
   two blocks share a NAME. It waved these through, because they don't. The
   stamp and the guard were using two different ideas of what makes two blocks
   the same block. Deriving it from the current name every time leaves one
   idea, which is the one the rest of this file already uses: twins are found
   by name, the day log is keyed by name, the vocabulary is slugged by name.

   The cost of not caching is that renaming a block moves its shared streak to
   a new name. That is the right answer anyway — BLOCK's own day log is keyed
   by name and lane, so a rename already starts a fresh page there.

   ── and then the routine joined it, 2026-09-14 ──
   Name alone still made morning Brush Teeth and evening Brush Teeth one row,
   while BLOCK's own page — keyed by name and routine since it was written —
   said they were two. Same disease as the stamp: two ideas of what makes a
   block the same block. The id is now built from tickKey, the one BLOCK's page
   already used, so there is one idea again and it is the one Tom asked for.
   Renaming a ROUTINE now moves the streaks of everything in it, for the same
   reason renaming a block does, and BLOCK's page already behaved that way. */
const actIdOf = (it, L) => idFromKey(tickKey(it, L || laneOf(it)));

/* ── one-off: unstick the blocks that were stamped with a placeholder name ──
   A board built before the fix above carries a frozen `actId` on every block.
   Where that stamp disagrees with the block's name, its ticks were filed under
   something else — usually `new-block`, shared with every other block made by
   clicking "+ New block" and typing over it. This puts each one's history back
   under its own name, reading it out of BLOCK's own day log, which was never
   confused because it is keyed by name and routine rather than by the stamp.
   Runs once per board. */
function repairActIds() {
  if (S.actIdFixed) return 0;
  S.actIdFixed = 1;
  const filed = {};                        /* stored id → the names filed under it */
  const stale = [];                        /* blocks whose stamp outlived their name */
  const eachBlock = fn => S.variants.forEach(v => S.lanes.forEach(l => (v.items[l.id] || []).forEach(fn)));
  eachBlock(it => {
    if (!it.actId) return;
    const f = filed[it.actId] || (filed[it.actId] = []);
    if (f.indexOf(it.name) < 0) f.push(it.name);
    if (it.actId !== LifeOS.slug(it.name)) stale.push(it);
    delete it.actId;                       /* identity comes from the name now */
  });
  if (!stale.length) { saveQuiet(); return 0; }

  const want = {};
  stale.forEach(it => want[it.name] = 1);
  let moved = 0;
  Object.keys(S.log || {}).forEach(date => ((S.log[date] || {}).d || []).forEach(k => {
    const nm = keyName(k);
    if (!want[nm]) return;
    LifeOS.done(LifeOS.slug(nm), date, true, { src: 'block' });
    moved++;
  }));
  /* today has not been closed into the log yet, so it is still in the boxes */
  stale.forEach(it => { if (it.done) { LifeOS.done(actIdOf(it), todayKey(), true, { src: 'block' }); moved++; } });

  /* then drop the rows that claimed all of them at once. Only where no block
     answers to that id any more, so one genuinely called "New block" keeps its
     ticks. */
  const live = {};
  eachBlock(it => live[LifeOS.slug(it.name)] = 1);
  Object.keys(filed).forEach(id => {
    if (filed[id].length < 2 || live[id]) return;
    Object.keys(S.log || {}).forEach(date => LifeOS.done(id, date, false, { src: 'block' }));
    LifeOS.done(id, todayKey(), false, { src: 'block' });
  });
  saveQuiet();
  console.info('[block] ' + stale.length + ' blocks were filed under a name they no longer have; moved ' + moved + ' ticks');
  return moved;
}

/* ── one-off: refile the tick history by routine ──
   Every past tick BLOCK wrote sits under the name alone. BLOCK's own day pages
   know the routine for each one, so they are replayed into the new rows and
   nothing anyone did is lost. The old name-only rows are left where they are:
   some were written by other apps, all of them are true, and nothing reads
   them for BLOCK any more.

   The store tells every listener about every write, one at a time, and BLOCK's
   own listener re-syncs the whole board each time. A year of pages is a
   thousand writes, so BLOCK stops listening for the length of the replay and
   syncs once at the end. Runs once per board. */
let REPLAYING = false;
function repairTickIds() {
  if (S.tickIdsByRoutine) return 0;
  S.tickIdsByRoutine = 1;
  let n = 0;
  REPLAYING = true;
  try {
    Object.keys(S.log || {}).forEach(date => ((S.log[date] || {}).d || []).forEach(k => {
      if (String(k).indexOf('||') < 0) return;
      const id = idFromKey(k);
      if (!LifeOS.isDone(id, date)) { LifeOS.done(id, date, true, { src: 'block' }); n++; }
    }));
    /* today's page is written as you go, but the boxes are the truth for today */
    S.variants.forEach(v => withVariant(v.id, () => LANES(v.id).forEach(l => items(l.id).forEach(it => {
      const id = actIdOf(it, l);
      if (it.done && !LifeOS.isDone(id, todayKey())) { LifeOS.done(id, todayKey(), true, { src: 'block' }); n++; }
    }))));
  } finally { REPLAYING = false; }
  saveQuiet();
  console.info('[block] tick history refiled by routine: ' + n + ' rows');
  return n;
}

function pushLib() {
  const seen = {}, out = [];
  const add = (id, name, cat, dur, color, energy) => {
    if (seen[id]) return; seen[id] = 1;
    out.push({ id: id, name: name, cat: cat || '', dur: dur || 0, color: color || '', energy: energy || 2 });
  };
  S.lib.forEach(l => add(LifeOS.slug(l.name), l.name, l.cat, l.dur, l.color, l.energy));
  /* A block in a routine is offered under the id its ticks are filed under,
     with the routine as its category, so anything that picks it from this list
     finds its real history and can tell the morning brush from the evening. */
  S.variants.forEach(v => S.lanes.forEach(l => (v.items[l.id] || []).forEach(it =>
    add(actIdOf(it, l), it.name, l.name, it.dur, it.color, it.energy))));
  LifeOS.acts(out);
}
/* ── publishing the plan ──
   One day's blocks, worked out for a date and written where anything else can
   read them. The phone cannot work this out for itself: the routines, the
   lanes and the day rules all live in here.

   AHEAD, not just today. Tom, 2026-09-05: "What if I just open block 1x a week
   and pre plan it?" That is the right way round, and it costs almost nothing,
   because everything under this already takes a date - routineForDate(key)
   picks the routine and pairsFor(vid, key) filters by that date's weekday.
   Only this function was pinned to today, so a phone opened on a morning the
   computer had not been touched found nothing and looked broken.

   A fortnight, so a week of pre-planning has a week of slack behind it. */
const PUBLISH_AHEAD = 14;

/* `quiet` writes the row without telling anyone. LifeOS.publishToday pokes
   every frame on the page, and a poke makes each one reload the store - fine
   once, fourteen times per render is fourteen reloads of the home screen while
   you are dragging a block around. So the fortnight is written quietly and
   today goes through the shim, which is one poke for the lot. */
function publishFor(key, quiet, log) {
  const vid = routineForDate(key), d = Day.dow(key);
  /* "Not needed" leaves the day's scheduled set, so it leaves the plan too.
     Tom, 2026-09-14: "If I put a block as not needed today in BLOCK, it still
     shows up in today view." The live flag belongs to S.doneDate; any other
     day keeps its skips in that day's log page. */
  const skipped = (it, L) => key === (S.doneDate || todayKey())
    ? !!it.skipped
    : ((((S.log || {})[key]) || {}).s || []).includes(tickKey(it, L));
  const blocks = withVariant(vid, () => S.lanes.flatMap(l =>
    schedule(l.id).filter(r => effDays(lane(l.id), r.it)[d] && !skipped(r.it, lane(l.id))).map(r => ({
      id: r.it.id, actId: actIdOf(r.it, lane(l.id)), name: r.it.name, s: r.s, dur: r.it.dur,
      color: r.it.color, lane: lane(l.id).name,
      /* Where it goes, if it goes anywhere. "Todoist Run Through" is only
         useful as a link on the screen he is actually following, which is the
         phone. The note comes too, because a link written in a note before
         there was a link field should not stop working. */
      link: r.it.link || '',
      note: r.it.note || '',
    })))).sort((a, b) => a.s - b.s);
  /* Every and Anytime ride along at the end, with no clock (`s: null`, which
     every reader already handles for an untimed routine) and `why`, the few
     words that say where each one stands. Their tick is the ordinary tick
     under the name, so ticking one on the home screen or in QUESTS ticks it
     here. */
  const extra = rhFor(key, log || rhLog()).map(x => ({
    id: x.r.id, actId: rhTick(x.r), name: x.r.name, s: null, dur: 0, color: x.r.color || '',
    lane: x.r.kind === 'every' ? 'Every' : 'Anytime', why: x.why, link: '', note: '',
  }));
  const plan = { date: key, vid: vid, name: (variant(vid) || {}).name || 'routine', blocks: blocks.concat(extra) };
  if (quiet) Rec.set('plan', key, 'routine', plan);
  else LifeOS.publishToday(plan);
}

function publishToday() {
  /* The days ahead first and quietly, then today through the shim, so exactly
     one poke goes out and it goes out after everything is written. */
  const log = rhLog();
  for (let i = 1; i < PUBLISH_AHEAD; i++) publishFor(Day.shift(todayKey(), i), true, log);
  publishFor(todayKey(), false, log);
}
/** the shared log is the truth about what got done — mirror it onto the blocks */
let LIFEOS_OK = true;
function pullDone() {
  if (!LIFEOS_OK) return 0;
  if (!window.LifeOS) return 0;
  const date = todayKey(); let changed = 0;
  const cleared = (S.cleared && S.cleared.date === date) ? S.cleared.ids : {};
  S.variants.forEach(v => withVariant(v.id, () => {
    /* the shared log files each block by name and routine. Where two blocks
       land on one row — the same name twice in ONE routine, capitals aside —
       the row cannot say which was done, so local ticks win. Counted by row
       id, the same thing the drawer counts by. */
    const seen = {};
    LANES(v.id).forEach(l => items(l.id).forEach(it => { const k = actIdOf(it, l); seen[k] = (seen[k] || 0) + 1; }));
    LANES(v.id).forEach(l => items(l.id).forEach(it => {
      const aid = actIdOf(it, l);
      if (seen[aid] > 1) return;
      if (cleared[aid]) return;            /* boxes deliberately cleared after a full pass — leave them empty */
      const on = LifeOS.isDone(aid, date);
      if (!!it.done !== on) { it.done = on; changed++; }
    }));
  }));
  return changed;
}

let pubT;
const _render = render;
render = function () { _render.apply(this, arguments); clearTimeout(pubT); pubT = setTimeout(() => { pushLib(); publishToday(); }, 400); };
/* someone ticked something elsewhere — only repaint if it actually moved */
LifeOS.on(() => {
  if (REPLAYING) return;                /* repairTickIds syncs once when it is done */
  /* Not while the starter board is only being shown. This fires when rows
     arrive, which is exactly when the other device's board is landing, and
     saving here would write the demo down with this second's clock on it —
     newer than the real board, and therefore the winner. That is how a fresh
     laptop used to overwrite the phone. */
  if (pullDone()) { saveQuiet(); render(); }
});
LifeOS.ready(() => { repairActIds(); repairTickIds(); pullDone(); render(); });

render();
/* keep the now line honest without redrawing the world */
setInterval(() => { if (S.view === 'day' && S.nowline) renderBoard(); }, 60000);
if (!S.lanes.some(l => items(l.id).length) && !S.templates.length) setTimeout(openHelp, 400);
</script>
