<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mb-version" content="1.0.19, 2026-09-23">
<title>QUESTS</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- The shared foundation. quest/CLAUDE.md is this app's brief. -->
<script src="../shared/skins.js"></script>
<script src="../shared/day.js"></script>
<script src="../shared/records.js"></script>
<script src="../shared/journal.js"></script>
<script src="../shared/mobile.js"></script>
<script src="../shared/sound.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  background-image:var(--tex-image);background-size:var(--tex-size);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);position:relative;z-index:2;
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}

/* ── the frame: projects down the left on a wide window, a strip on a phone ── */
#app{flex:1;min-height:0;display:grid;grid-template-columns:calc(var(--s-10) * 2) 1fr}
#side{overflow:auto;padding:var(--s-4) var(--s-3);border-right:var(--border-width) solid var(--border);
  display:flex;flex-direction:column;gap:var(--s-1)}
#side h3{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);
  color:var(--text-muted);padding:var(--s-4) var(--s-3) var(--s-2);text-transform:uppercase}
.nav{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap);padding:0 var(--s-3);
  border:0;background:none;border-radius:var(--radius-md);cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--surface-2);color:var(--accent)}
.nav .ic{width:var(--s-5);display:flex;justify-content:center;color:var(--text-muted)}
.nav.on .ic{color:var(--accent)}
.nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{font-family:var(--font-mono);font-size:var(--f-1);color:var(--text-muted)}
.hash{font-family:var(--font-mono);font-weight:var(--w-bold)}

main{overflow:auto;min-height:0;padding:var(--s-5) var(--s-5) calc(var(--s-9) + var(--safe-b))}
.wrap{max-width:calc(var(--s-10) * 6);margin:0 auto;display:flex;flex-direction:column}
h1{font-family:var(--font-display);font-size:var(--f-6);font-weight:var(--w-bold);margin-bottom:var(--s-4)}
h1 small{font-family:var(--font-body);font-size:var(--f-2);color:var(--text-muted);font-weight:var(--w-body);margin-left:var(--s-3)}

@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #side{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;
    border-bottom:var(--border-width) solid var(--border);padding:var(--s-2) var(--s-3)}
  #side h3{display:none}
  .nav{width:auto;flex:0 0 auto}
  .nav .ct{display:none}
  main{padding:var(--s-4) var(--s-4) calc(var(--s-9) + var(--safe-b))}
}

/* ── adding: one line, with what it read highlighted underneath the words ── */
.add{background:var(--surface-1);border-radius:var(--radius-lg);box-shadow:var(--e-1),var(--rim);
  padding:var(--s-3);margin-bottom:var(--s-5)}
.qin{position:relative;background:var(--surface-2);border-radius:var(--radius-md);
  border:var(--border-width) solid var(--border)}
.qin:focus-within{border-color:var(--focus)}
.qin input,.qin .hl{font:inherit;font-size:var(--f-4);line-height:var(--lh-body);
  padding:var(--s-3);min-height:var(--tap);width:100%;border:0;letter-spacing:normal;white-space:pre}
.qin input{position:relative;background:transparent;color:var(--text-1);outline:none;z-index:1}
.qin .hl{position:absolute;inset:0;color:transparent;overflow:hidden;pointer-events:none}
.qin .hl mark{color:transparent;border-radius:var(--radius-sm);
  background:color-mix(in srgb,var(--accent) 28%,transparent)}
/* A tag is not the accent, because a line can carry several and they would
   read as one long highlight against one project. */
.qin .hl mark.tag{background:color-mix(in srgb,var(--data-3) 30%,transparent)}
/* ── the labels you already have ──
   Tom, 2026-09-17: "How can we ensure labels get used correctly?" The thing
   that ruins a label set is not misuse, it is SPRAWL: @phone, @Phone and
   @calls all meaning one condition, after which no label view is complete and
   you stop trusting them. Case is already dealt with, since a label is
   slugged. This is the rest of it — the moment you type @, the ones you
   already use are in front of you, so picking an existing label is less work
   than inventing a new one. */
.sug{display:flex;flex-wrap:wrap;gap:var(--s-1);margin-top:var(--s-1)}
.sug button{
  min-height:var(--tap);padding:0 var(--s-3);border-radius:var(--radius-md);
  border:var(--border-width) solid var(--border);background:var(--surface-2);
  color:var(--text-2);font-size:var(--f-2);cursor:pointer;
}
.sug button:hover,.sug button.on{border-color:color-mix(in srgb,var(--data-3) 55%,transparent);color:var(--text-1)}
.sug .new{color:var(--text-muted)}
.at{color:var(--data-3);font-family:var(--f1)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-2);align-items:center}
.chip{display:inline-flex;align-items:center;gap:var(--s-1);min-height:var(--tap);
  padding:0 var(--s-3);border-radius:var(--radius-md);border:var(--border-width) solid var(--border);
  background:var(--surface-2);cursor:pointer;font-size:var(--f-2);color:var(--text-2)}
.chip:hover{border-color:var(--border-strong)}
.chip.set{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip .x{display:inline-flex;align-items:center;justify-content:center;
  width:var(--s-5);height:var(--s-5);border-radius:var(--radius-full);color:var(--text-muted)}
.chip .x:hover{background:var(--surface-3);color:var(--text-1)}
.chip.p1{color:var(--danger)} .chip.p2{color:var(--warn)} .chip.p3{color:var(--info)}
.go{margin-left:auto}

/* ── a group, and a row in it ── */
.grp{margin-bottom:var(--s-5)}
.gh{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) 0;
  border-bottom:var(--border-width) solid var(--border);min-height:var(--tap)}
.gh b{font-family:var(--font-display);font-size:var(--f-3)}
.gh .n{font-family:var(--font-mono);font-size:var(--f-1);color:var(--text-muted)}
.gh .lnk{margin-left:auto;border:0;background:none;cursor:pointer;min-height:var(--tap);
  padding:0 var(--s-2);color:var(--danger);font-weight:var(--w-bold)}
.gh .lnk:hover{text-decoration:underline}
.gh.over b{color:var(--danger)}

.row{display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-3) 0;
  border-bottom:var(--border-width) solid var(--border);cursor:pointer;position:relative}
.row:hover{background:linear-gradient(90deg,transparent,var(--surface-2) 8%,var(--surface-2) 92%,transparent)}
.tk{flex:0 0 auto;width:var(--tap);height:var(--tap);margin:calc(var(--s-3) * -1) 0 calc(var(--s-3) * -1) calc(var(--s-3) * -1);
  display:flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer}
.tk i{display:block;width:var(--s-5);height:var(--s-5);border-radius:var(--radius-full);
  border:2px solid var(--border-strong);transition:background-color var(--dur-fast) var(--ease-out)}
/* A todo's tick box is STATUS's box from shared/journal.js, with no priority
   colour (Tom, 2026-09-14: no differences, STATUS wins). The round .tk below
   is left for BLOCK's plan rows. Priority still shows on the Priority button. */
.tk:hover i{background:color-mix(in srgb,var(--text-muted) 30%,transparent)}
.row.done .tk i{background:var(--text-muted);border-color:var(--text-muted)}
.row .body{flex:1;min-width:0}
.row .tt{line-height:var(--lh-body);overflow-wrap:anywhere}
.row.done .tt{text-decoration:line-through;color:var(--text-muted)}
.row .meta{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-3);margin-top:var(--s-1);
  font-size:var(--f-1);color:var(--text-muted);align-items:center}
.row .meta span{display:inline-flex;align-items:center;gap:var(--s-1)}
.row .meta .late{color:var(--danger)}
.row .meta .soon{color:var(--success)}
.row .meta svg{width:var(--f-2);height:var(--f-2)}
.row .pj{margin-left:auto;font-size:var(--f-1);color:var(--text-muted);white-space:nowrap}
/* The row's own buttons, always showing. Tom, 2026-09-14: "I don't want to
   have to right click to show the menu, there's so much space on the right
   side." The right click and the hold still open the same menu. */
.row .acts{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-1);margin:calc(var(--s-3) * -1) 0}
.row .acts button{width:var(--tap);height:var(--tap);border:0;background:none;cursor:pointer;
  color:var(--text-muted);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center}
.row .acts button:hover,.row .acts button:focus-visible{background:var(--surface-3);color:var(--text-1);outline:none}
.row .acts button.on{color:var(--accent)}
.row .acts button.p1{color:var(--danger)} .row .acts button.p2{color:var(--warn)} .row .acts button.p3{color:var(--info)}
@media (max-width:600px){.row .acts button.wide{display:none}}
.src{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);text-transform:uppercase;
  color:var(--text-muted);border:var(--border-width) solid var(--border);border-radius:var(--radius-sm);padding:0 var(--s-1)}
.row.blk.past .tt{color:var(--text-muted)}
.row.blk.now{background:color-mix(in srgb,var(--success) 8%,transparent)}
.tk:disabled{cursor:default;opacity:.4}
.empty{color:var(--text-muted);padding:var(--s-6) 0;text-align:center}
/* the daily brief: Tom, 2026-09-22 */
.brief .gh{cursor:pointer}
.brief .gh .chev{margin-left:auto;color:var(--text-muted);display:flex}
.brief .gh .when{font-family:var(--font-mono);font-size:var(--f-1);color:var(--text-muted)}
.brief .bx{padding:var(--s-3) 0;line-height:var(--lh-body);overflow-wrap:anywhere}
.brief .bx p{margin:0 0 var(--s-2)}
.brief .bx h4{margin:var(--s-3) 0 var(--s-1);font-family:var(--font-display);font-size:var(--f-2);
  letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--text-muted)}
.brief .bx ul{margin:0 0 var(--s-2);padding-left:var(--s-5)}
/* the month grid: Tom, 2026-09-18 */
.calbar{display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-3)}
.calbar b{font-family:var(--font-display);font-size:var(--f-3);flex:1}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s-1)}
.calgrid .wd{font-size:var(--f-1);color:var(--text-muted);text-align:center;padding-bottom:var(--s-1)}
.calgrid .cd{min-height:calc(var(--tap) * 2);border:0;border-radius:var(--radius-sm);background:var(--surface-1);
  color:var(--text-1);font:inherit;text-align:left;padding:var(--s-1);cursor:pointer;min-width:0;
  display:flex;flex-direction:column;gap:var(--s-1);overflow:hidden}
.calgrid .cd.out{opacity:.4}
.calgrid .cd.today{box-shadow:inset 0 0 0 var(--border-width) var(--accent)}
.calgrid .cd .dn{font-family:var(--font-mono);font-size:var(--f-1);color:var(--text-muted)}
.calgrid .cd.today .dn{color:var(--accent)}
.calgrid .ct{font-size:var(--f-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-radius:var(--radius-sm);padding:0 var(--s-1);background:var(--surface-2)}
.calgrid .ct.done{text-decoration:line-through;color:var(--text-muted)}
.calgrid .ct.late{color:var(--danger)}
.calgrid .more{font-size:var(--f-1);color:var(--text-muted)}
@media (max-width:700px){.calgrid .ct{display:none}.calgrid .cd .n{font-size:var(--f-1);color:var(--accent)}}
@media (min-width:701px){.calgrid .cd .n{display:none}}

/* ── the popover: Todoist's date menu, and the small lists ── */
.pop{position:fixed;z-index:1000;background:var(--surface-1);color:var(--text-1);
  border:var(--border-width) solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--e-4);width:calc(var(--s-10) * 2.3);max-height:calc(100vh - var(--s-6));
  display:flex;flex-direction:column;overflow:hidden}
.pop.list{width:auto;min-width:calc(var(--s-10) * 1.6);padding:var(--s-2)}
.pick{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap);width:100%;
  padding:0 var(--s-3);border:0;background:none;cursor:pointer;border-radius:var(--radius-md);text-align:left}
.pick:hover,.pick:focus-visible{background:var(--surface-2);outline:none}
.pick .ic{width:var(--s-5);display:flex;justify-content:center}
.pick .nm{flex:1}
.pick .rt{color:var(--text-muted);font-size:var(--f-2)}
.pick.on .nm{color:var(--accent);font-weight:var(--w-bold)}
.pick.p1 .ic{color:var(--danger)} .pick.p2 .ic{color:var(--warn)} .pick.p3 .ic{color:var(--info)}
.dm-top{padding:var(--s-3);border-bottom:var(--border-width) solid var(--border)}
.dm-top input{width:100%;font:inherit;font-size:var(--f-3);background:var(--surface-2);color:var(--text-1);
  border:var(--border-width) solid var(--border);border-radius:var(--radius-md);padding:var(--s-2) var(--s-3);min-height:var(--tap)}
.dm-top .hint{font-size:var(--f-1);color:var(--text-muted);margin-top:var(--s-1);min-height:var(--f-1)}
.dm-quick{padding:var(--s-2);border-bottom:var(--border-width) solid var(--border)}
.ic-today{color:var(--success)} .ic-tom{color:var(--warn)} .ic-wkd{color:var(--info)} .ic-nxt{color:var(--data-4)}
.dm-cal{overflow:auto;padding:var(--s-2) var(--s-3);flex:1;min-height:0;max-height:calc(var(--s-10) * 2.4)}
.dm-mh{display:flex;align-items:center;font-family:var(--font-display);font-weight:var(--w-bold);
  padding:var(--s-2) 0;position:sticky;top:0;background:var(--surface-1);z-index:1}
.dm-mh .sp{flex:1}
.dm-mh button{width:var(--tap);height:var(--tap);border:0;background:none;cursor:pointer;color:var(--text-2);
  display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md)}
.dm-mh button:hover{background:var(--surface-2)}
.dm-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dm-grid .wd{font-size:var(--f-1);color:var(--text-muted);padding:var(--s-1) 0}
.dm-grid button{height:var(--tap);border:0;background:none;cursor:pointer;border-radius:var(--radius-full);
  font-family:var(--font-mono);font-size:var(--f-2);position:relative}
.dm-grid button:hover{background:var(--surface-2)}
.dm-grid button:disabled{color:var(--text-muted);opacity:.5;cursor:default;background:none}
.dm-grid button.today{color:var(--danger);font-weight:var(--w-bold)}
.dm-grid button.sel{background:var(--accent);color:var(--accent-fg)}
.dm-grid button.has::after{content:'';position:absolute;left:50%;bottom:var(--s-1);width:var(--s-1);height:var(--s-1);
  margin-left:calc(var(--s-1) / -2);border-radius:var(--radius-full);background:currentColor;opacity:.6}
.dm-foot{padding:var(--s-3);border-top:var(--border-width) solid var(--border);display:flex;flex-direction:column;gap:var(--s-2)}
.dm-foot .bar{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap);
  border:var(--border-width) solid var(--border);border-radius:var(--radius-md);padding:0 var(--s-2)}
.dm-foot .bar > button{flex:1;border:0;background:none;cursor:pointer;min-height:var(--tap);
  display:flex;align-items:center;justify-content:center;gap:var(--s-2)}
.dm-foot .bar .x{flex:0 0 var(--tap)}
.dm-foot .mb-timefield{flex:1}
.sheet-date .pop{position:static;width:100%;box-shadow:none;border:0;max-height:none}
</style>
</head>
<body>
<header>
  <div class="logo">QUE<b>STS</b></div>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" onclick="openSettings()">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>
<div id="app">
  <nav id="side"></nav>
  <main class="mb-scroll"><div class="wrap" id="main"></div></main>
</div>

<script>
/* ══════════════════ QUESTS ══════════════════
   The todolist, copied from Todoist. quest/CLAUDE.md is the brief.

   A quest is not a row of its own. It is STATUS's `note` row of kind `todo`,
   with `due`, `pri`, `proj` and `rep` added, so a todo written here is in
   STATUS's journal and a todo ticked there is ticked here. Every write reads
   the row and merges into it, so STATUS's own fields always survive.       */

const APP = {
  id: 'quest',
  name: 'Quests',
  icon: '◆',
  blurb: 'what you have to do, and when',
  types: ['project'],
};

Skins.load('../shared/skins.json').then(() => {
  Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true });
  draw();
});
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* `note` is registered as well as `project`, or restoring a QUESTS backup
   would bring back the projects and none of the todos in them. */
/* `reads`: todos written in STATUS and LOG, and BLOCK's published plan for
   Today, each from its own app's tab on the sheet (shared/io.js, pull). */
IO.register({ app: APP.id, name: APP.name, types: ['note', 'project'],
  reads: { status: ['note'], log: ['note'], block: ['plan'] } });
/* `brief` is read, never written: the daemon on the PC writes it. */

const $ = s => document.querySelector(s);
const esc = s => UI.esc(String(s == null ? '' : s));
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
const ico = (role, size) => window.Icons ? Icons.svg(role, { size: size || 18 }) : '';
const S = {
  get: (k, d) => { const v = Rec.setting(APP.id, k); return v == null ? d : v; },
  set: (k, v) => Rec.setting(APP.id, k, v),
};

/* ── settings ──
   Tom, 2026-09-15: QUESTS gets a tab of its own, holding only real choices:
   what Today shows among your tasks. Its theme is picked in STYLE. */
function openSettings() {
  UI.settings(APP.id, [{ id: 'quests', name: 'QUESTS', draw: pane => {
    const sw = (label, note, k) => pane.appendChild(UI.row(label, note,
      UI.toggle(S.get(k, 1) !== 0, v => { S.set(k, v ? 1 : 0); draw(); })));
    sw('BLOCK’s plan on Today', 'What BLOCK planned for today, among your tasks by time', 'showPlan');
    sw('Finished tasks on Today', 'What you ticked today, at the bottom', 'showDone');
  } }], { order: ['quests', 'data'] });
}
let seq = 0;
const newId = () => Rec.USER + '-' + Date.now().toString(36) + '-' +
  (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
const narrow = () => (window.Mobile && typeof Mobile.sheetish === 'function') ? Mobile.sheetish() : innerWidth <= 900;
const nowHHMM = () => { const n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); };

/* ══════════════ STATUS'S JOURNAL ══════════════
   `NOTE_KINDS`, `bare`, `notes` and `publishNotes` are shared/journal.js, the
   same rules STATUS, LOG and the home screen read, including the due-date
   rule: a todo with a `due` shows on that day and follows you forward.       */
const NOTE_KINDS = Journal.KINDS;
function bare(x) { return Journal.bare(x); }
function notes(date) { return Journal.notes(date || Day.today()); }
function publishNotes(date) { return Journal.publishNotes(date || Day.today(), APP.id); }

/* ══════════════ DATES ══════════════
   Everything is a plain calendar date through day.js, so "today" here is the
   same today as every other app's.                                          */
const pad = n => String(n).padStart(2, '0');
const T = () => Day.today();
const ymd = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);
const partsOf = s => { const a = s.split('-').map(Number); return { y: a[0], m: a[1] - 1, d: a[2] }; };
const lastDay = (y, m) => new Date(y, m + 1, 0).getDate();

  RULES.forEach(rule => {
    /* the kind a rule reads is not always the field it fills */
    const field = { date: 'due', time: 'at' }[rule.kind] || rule.kind;
    const already = out[field];
    if (already != null) return;
    const re = new RegExp('(^|[\\s,(])(' + rule.src + ')(?=$|[\\s,.;!?)])', 'giu');

      if (re.lastIndex <= m.index) re.lastIndex = m.index + 1;

      const v = rule.fn(word, out);
      if (v == null || v === '') continue;
      taken.push([start, end]);
      spans.push({ start: start, end: end, kind: rule.kind, word: word });

      else if (rule.kind === 'proj') { out.proj = slug(v); out.projName = v; if (!out.proj) { taken.pop(); spans.pop(); continue; } }

      else if (rule.kind === 'tag') {

/* ══════════════ THE TODOS ══════════════ */
const quests = () => Rec.all('note')
  .filter(r => r.payload && r.payload.kind === 'todo' && !r.payload.cancelled)

const movedFrom = d => quests().filter(x => {
  const p = Journal.place({ key: x.key, date: x.date, payload: x }, d);
  return p && p.movedAway;

   a task is from?" QUESTS stamps `src` on what it writes. A row from before

   creation, and STATUS's otherwise. LOG writes STATUS's payload, so a line
   added in LOG reads STATUS too. ARC writes a todo for a skill in training
   and for a review that is due (2026-09-16), stamped `arc`.

   WEALTH writes one per bill coming up, stamped `wealth`, and those were
   reading STATUS. The bug was not the missing name: it was that an app this

   arrive would have been mislabelled the same way and nothing would have

const srcOf = x => x.src || (('pri' in x && 'proj' in x && 'rep' in x) ? 'quest' : 'status');

const projects = () => Object.entries(Rec.map('project'))
  .map(e => Object.assign({ key: e[0] }, e[1])).sort((a, b) => (a.ord || 0) - (b.ord || 0));

  if (!key || Rec.get('project', null, key)) return;
  const n = projects().length;
  Rec.set('project', null, key, { name: name || key, slot: (n % 6) + 1, ord: n });
}

/* Every change re-reads the row and merges into it (root brief, many
   writers): STATUS keeps fields this app never shows, and a rebuilt payload
   would drop them. */
function saveRow(x, patch) {
  const cur = Rec.get('note', x.date, x.key) || bare(x);
  /* Rescheduled to a later day: it stays as > on the day it sat on and the
     day it was moved from, and not on the days it skips (Tom, 2026-09-14).
     Journal.movedAfter, the rule Move to tomorrow uses. */
  if (patch.due && !cur.done && patch.due > T() && patch.due !== dueOf(Object.assign({ date: x.date }, cur)))
    patch = Object.assign({}, patch, { moved: Journal.movedAfter(cur, x.date, patch.due, T()) });
  if (patch.proj) ensureProject(patch.proj, patch.projName);
  const next = Object.assign({}, cur, patch);
  delete next.projName;
  Rec.set('note', x.date, x.key, next);
  publishNotes(x.date);
  Mobile.feedback('select');
}

/* The suite's one creator in shared/journal.js (2026-09-18), with the words
   already read by QUESTS's own reader, plus the fields QUESTS adds. */
function addQuest(p) {
  const d = T();
  if (p.proj) ensureProject(p.proj, p.projName);
  const ex = { parsed: true, src: 'quest', at: p.at || null, dur: p.dur || null,
    due: p.due || '', pri: p.pri || 0, proj: p.proj || '', rep: p.rep || null };
  if (p.tags && p.tags.length) ex.tags = p.tags;
  Journal.add(d, 'todo', p.text, ex, APP.id);
  Mobile.feedback('success');
}

/* Ticking is Journal.tick in shared/journal.js, the tick STATUS and the home
   screen use. A plain todo flips. A repeating todo is not finished, it has
   done a round: a finished copy on today, so STATUS and LOG show it happened
   today, and the todo moves on to its next date. */
function tick(x) {
  const res = Journal.tick(x.date, x.key, { day: T(), stamp: nowHHMM(), row: x, src: APP.id });
  if (!res) return;
  Mobile.feedback(res.done ? 'tick' : 'untick');
  if (res.round) UI.undo('Next: <b>' + esc(whenLabel(res.next, res.at)) + '</b>', res.undo);
  else if (res.done) UI.undo('Completed <b>' + esc(res.text) + '</b>', res.undo);
}

function removeQuest(x) {
  const keep = Rec.get('note', x.date, x.key);
  if (!keep) return;
  Rec.del('note', x.date, x.key);
  publishNotes(x.date);
  Mobile.haptic('warn');
  UI.undo('Deleted <b>' + esc(keep.text) + '</b>', () => { Rec.set('note', x.date, x.key, keep); publishNotes(x.date); });
}

/* Hold on a touch screen opens the same menu a right click does. */
function holdMenu(node, fn) {
  let timer = null, start = null;
  node.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    start = { x: e.clientX, y: e.clientY };
    timer = setTimeout(() => { timer = null; node.dataset.held = '1'; Mobile.haptic('select'); fn(start); }, 500);
  });
  const stop = e => {
    if (timer && e && e.type === 'pointermove' && start && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 10) return;
    clearTimeout(timer); timer = null;
  };
  node.addEventListener('pointermove', stop);
  node.addEventListener('pointerup', stop);
  node.addEventListener('pointercancel', stop);
  node.addEventListener('click', e => { if (node.dataset.held) { delete node.dataset.held; e.stopPropagation(); e.preventDefault(); } }, true);
}

/* ══════════════ POPOVERS ══════════════
   Todoist's menus sit beside what was clicked. The shared UI.menu closes
   before its own items can be clicked on a PC (root brief, foundation item
   10), and cannot hold a calendar, so the popover is here. A press inside it
   never closes it. On a phone the same content comes up as a sheet.        */
let POP = null, POPCLOSE = null;
function closePop() {
  document.removeEventListener('pointerdown', popOutside, true);
  document.removeEventListener('keydown', popKey, true);
  if (POPCLOSE) { const f = POPCLOSE; POPCLOSE = null; f(); }
  if (POP) { POP.remove(); POP = null; }
}
function popOutside(e) { if (POP && !POP.contains(e.target)) closePop(); }
function popKey(e) { if (e.key === 'Escape' && POP) { e.stopPropagation(); e.preventDefault(); closePop(); } }
function openPop(anchor, node, cls) {
  closePop();

  p.appendChild(node);
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect()
    : { left: anchor.x, right: anchor.x, top: anchor.y, bottom: anchor.y };
  const w = p.offsetWidth, h = p.offsetHeight, m = 8;
  let top = r.bottom + 4;
  if (top + h > innerHeight - m) top = Math.max(m, r.top - h - 4);
  p.style.left = Math.min(Math.max(m, r.left), innerWidth - w - m) + 'px';
  p.style.top = top + 'px';
  POP = p;
  setTimeout(() => {
    document.addEventListener('pointerdown', popOutside, true);
    document.addEventListener('keydown', popKey, true);
  }, 0);

/* ══════════════ THE DATE MENU ══════════════
   Todoist's, copied: a box to type a date into, Today, Tomorrow, This

   Repeat. `pick` gets {due, at, rep}; `due` is '' for No date.            */
function dateMenu(anchor, cur, pick, opts) {
  opts = opts || {};

  let done = () => closePop();
  const apply = (patch, keep) => {
    Object.assign(st, patch);
    if (st.rep) st.rep = Object.assign({}, st.rep, { from: st.due || firstDue(st.rep) });
    if (st.rep && !st.due) st.due = st.rep.from;

  const top = el('div', 'dm-top');

  inp.oninput = () => {
    const p = parseQuest(inp.value);
    hint.textContent = (p.due || p.at || p.rep) ? whenLabel(p.due, p.at) + (p.rep ? ' · ' + repLabel(p.rep) : '') : '';
  };

  const t = T();

  const sat = nextDow(t, 6, true), mon = Day.shift(weekStart(t), 7);
  const short = s => asDate(s).toLocaleDateString('en-US', { weekday: 'short' });
  const md = s => asDate(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  [['Today', 'today', 'ic-today', t, short(t)],
   ['Tomorrow', 'forward', 'ic-tom', Day.shift(t, 1), short(Day.shift(t, 1))],
   ['This weekend', 'star', 'ic-wkd', sat, short(sat)],
   ['Next week', 'next', 'ic-nxt', mon, md(mon)],

    const b = el('button', 'pick' + (st.due === q[3] && (q[3] || cur.due != null) ? ' on' : ''),
      '<span class="ic ' + q[2] + '">' + ico(q[1]) + '</span><span class="nm">' + q[0] + '</span><span class="rt">' + q[4] + '</span>');
    b.onclick = () => apply({ due: q[3], rep: q[3] ? st.rep : null, at: q[3] ? st.at : null });
    quick.appendChild(b);
  });
  box.appendChild(quick);

  /* twelve months, scrolled; a dot on any day that already has something due */
  const cal = el('div', 'dm-cal');
  const busy = {};
  quests().forEach(x => { if (!x.done && dueOf(x)) busy[dueOf(x)] = 1; });
  const tp = partsOf(t), months = [];
  for (let k = 0; k < 12; k++) {
    const first = new Date(tp.y, tp.m + k, 1), y = first.getFullYear(), m = first.getMonth();
    const sec = el('div');

      prev.setAttribute('aria-label', 'Previous month'); home.setAttribute('aria-label', 'This month'); next.setAttribute('aria-label', 'Next month');
      const at = () => Math.max(0, months.findIndex(s => s.offsetTop + s.offsetHeight > cal.scrollTop + 4));
      prev.onclick = () => { const i = at(); cal.scrollTop = months[Math.max(0, i - 1)].offsetTop - cal.offsetTop; };
      next.onclick = () => { const i = at(); cal.scrollTop = months[Math.min(11, i + 1)].offsetTop - cal.offsetTop; };
      home.onclick = () => { cal.scrollTop = 0; };
      head.appendChild(prev); head.appendChild(home); head.appendChild(next);
    }
    sec.appendChild(head);
    const grid = el('div', 'dm-grid');
    if (k === 0) 'SMTWTFS'.split('').forEach(c => grid.appendChild(el('div', 'wd', c)));
    for (let i = 0; i < first.getDay(); i++) grid.appendChild(el('div'));
    for (let d = 1; d <= lastDay(y, m); d++) {
      const s = ymd(y, m, d);
      const b = el('button', (s === t ? 'today' : '') + (s === st.due ? ' sel' : '') + (busy[s] ? ' has' : ''), String(d));

    tbar.appendChild(tx);

    const rbar = el('div', 'bar');
    const rb = el('button', null, ico('repeat') + '<span>' + esc(repLabel(st.rep) || 'Repeat') + '</span>');
    rbar.appendChild(rb);
    const list = el('div');
    list.style.display = 'none';
    rb.onclick = () => {
      if (list.style.display === 'none') {
        const base = st.due || t, dom = partsOf(base).d;
        list.innerHTML = '';
        [['Every day', { unit: 'day', every: 1 }],
         ['Every weekday (Mon to Fri)', { unit: 'weekday', every: 1 }],
         ['Every week on ' + DAYNAME[Day.dow(base)], { unit: 'week', every: 1, days: [Day.dow(base)] }],
         ['Every month on the ' + ordinal(dom), { unit: 'month', every: 1, dom: dom }],
         ['Every year on ' + asDate(base).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), { unit: 'year', every: 1 }],
         ['No repeat', null]].forEach(r => {
          const b = el('button', 'pick' + (repLabel(st.rep) === repLabel(r[1]) && r[1] ? ' on' : ''), '<span class="nm">' + esc(r[0]) + '</span>');
          b.onclick = () => apply({ rep: r[1] ? Object.assign({ txt: r[0].toLowerCase() }, r[1]) : null });
          list.appendChild(b);
        });
        list.style.display = '';

    };
    if (st.rep) {
      const rx = el('button', 'x', ico('clear'));
      rx.setAttribute('aria-label', 'No repeat');

    }
    foot.appendChild(rbar);
    foot.appendChild(list);

  }

  if (opts.inline) {
    opts.inline.innerHTML = '';
    const wrap = el('div', 'sheet-date');
    const p = el('div', 'pop'); p.appendChild(box); wrap.appendChild(p);
    opts.inline.appendChild(wrap);
    done = () => { opts.inline.innerHTML = ''; if (opts.onDone) opts.onDone(); };
    return;
  }
  if (narrow()) {
    UI.dialog({ title: opts.bulk ? 'RESCHEDULE' : 'DUE DATE', width: 420, body: (b, h) => {
      const wrap = el('div', 'sheet-date');
      const p = el('div', 'pop'); p.appendChild(box); wrap.appendChild(p);
      b.appendChild(wrap);
      done = () => h.close();
    } });
    return;
  }
  openPop(anchor, box);
  setTimeout(() => { inp.focus(); inp.select(); }, 0);

/* ══════════════ THE ADD BAR ══════════════ */
let ADD = null;
function ensureAddBar() {
  if (ADD) return;
  const m = $('#main');
  m.innerHTML = '';
  const h = el('h1'); h.id = 'vtitle'; m.appendChild(h);
  const box = el('div', 'add');
  const q = el('div', 'qin'), hl = el('div', 'hl');
  const inp = document.createElement('input');
  inp.type = 'text'; inp.autocomplete = 'off';
  inp.setAttribute('enterkeyhint', 'done'); inp.setAttribute('autocapitalize', 'sentences');
  inp.setAttribute('aria-label', 'Add a task');
  inp.placeholder = 'Add a task';
  q.appendChild(hl); q.appendChild(inp);
  const chips = el('div', 'chips');
  const sug = el('div', 'sug');
  box.appendChild(q); box.appendChild(sug); box.appendChild(chips);
  const list = el('div'); list.id = 'list';
  m.appendChild(box); m.appendChild(list);

  let ignore = [], set = {}, view = {};
  const words = (p, kinds) => p.spans.filter(s => kinds.indexOf(s.kind) > -1).map(s => s.word);
  const dropWords = (p, kinds) => {
    let v = inp.value;
    p.spans.filter(s => kinds.indexOf(s.kind) > -1).sort((a, b) => b.start - a.start)
      .forEach(s => { v = v.slice(0, s.start) + v.slice(s.end); });
    inp.value = v.replace(/\s{2,}/g, ' ');
  };
  function final() {
    const p = parseQuest(inp.value, ignore);
    const o = { text: p.text, due: p.due, at: p.at, dur: p.dur, pri: p.pri, proj: p.proj, projName: p.projName, rep: p.rep, p: p };
    if (o.due == null) {
      if (set.date) { o.due = set.date.due; o.at = o.at || set.date.at; o.rep = set.date.rep; }
      else o.due = o.at ? T() : (view.due || '');
    }
    if (o.pri == null) o.pri = set.pri || 0;
    if (!o.proj) {
      if (set.proj !== undefined) { o.proj = set.proj ? set.proj.key : ''; o.projName = set.proj ? set.proj.name : ''; }
      else o.proj = view.proj || '';
    }
    return o;
  }
  function chip(label, cls, onClick, onClear) {
    const c = el('button', 'chip' + (cls ? ' ' + cls : ''), '<span>' + label + '</span>');
    c.type = 'button';
    c.onclick = e => { if (e.target.closest('.x')) return; onClick(c); };
    if (onClear) {
      const x = el('span', 'x', ico('clear'));
      x.setAttribute('role', 'button'); x.setAttribute('aria-label', 'Remove');
      x.onclick = e => { e.stopPropagation(); onClear(); };
      c.appendChild(x);
    }
    chips.appendChild(c);
  }
  /* The @word the caret is sitting in, or null. Read off the caret rather than
     off the whole line, so typing a second label does not offer suggestions
     for the first one. */
  function tagBeingTyped(v) {
    const caret = inp.selectionStart == null ? v.length : inp.selectionStart;
    const before = v.slice(0, caret);
    const m = /(^|\s)@([^\s@]*)$/.exec(before);
    if (!m) return null;
    return { word: m[2], start: caret - m[2].length };
  }

  function paintSug(v) {
    sug.innerHTML = '';
    const t = tagBeingTyped(v);
    if (!t) return;
    const typed = slug(t.word);
    const already = (parseQuest(v, ignore).tags) || [];
    /* What he already uses, narrowed by what he has typed so far, and never
       offering one this line already carries. */
    const near = tagsInUse()
      .filter(x => already.indexOf(x) < 0)
      .filter(x => !typed || x.indexOf(typed) === 0)
      .slice(0, 8);
    const put = (label, cls, onPick) => {
      const b = el('button', cls || '', label);
      b.type = 'button';
      /* mousedown, not click: a click would land after the input has already
         lost focus and the caret position this reads would be gone. */
      b.onmousedown = e => { e.preventDefault(); onPick(); };

      inp.value = v.slice(0, t.start) + x + v.slice(caret) + ' ';
      inp.focus();

      html += esc(v.slice(at, s.start)) +
        '<mark' + (s.kind === 'tag' ? ' class="tag"' : '') + '>' + esc(s.word) + '</mark>';
      at = s.end;
    });
    hl.innerHTML = html + esc(v.slice(at)) + ' ';
    hl.scrollLeft = inp.scrollLeft;
    paintSug(v);
    chips.innerHTML = '';
    const typedDate = words(p, ['date', 'time', 'rep']);
    chip(ico('calendar') + ' ' + esc(o.due || o.at ? whenLabel(o.due, o.at) : 'Date') + (o.rep ? ' · ' + esc(repLabel(o.rep)) : ''),
      o.due ? 'set' : '',
      c => dateMenu(c, { due: o.due, at: o.at, rep: o.rep }, val => { dropWords(parseQuest(inp.value, ignore), ['date', 'time', 'rep']); set.date = val; paint(); }),
      typedDate.length ? () => { ignore = ignore.concat(typedDate); paint(); }
        : (set.date ? () => { delete set.date; paint(); } : null));
    const typedPri = words(p, ['pri']);
    chip(o.pri ? 'P' + o.pri : 'Priority', o.pri ? 'set p' + o.pri : '',
      c => choose(c, 'Priority', priItems(o.pri, n => { dropWords(parseQuest(inp.value, ignore), ['pri']); set.pri = n; paint(); })),
      typedPri.length ? () => { ignore = ignore.concat(typedPri); paint(); } : (set.pri ? () => { delete set.pri; paint(); } : null));
    const typedProj = words(p, ['proj']);
    chip(o.proj ? '<span class="hash">#</span> ' + esc(o.projName || projName(o.proj)) : 'Inbox', o.proj ? 'set' : '',
      c => choose(c, 'Project', projItems(o.proj, pr => { dropWords(parseQuest(inp.value, ignore), ['proj']); set.proj = pr; paint(); })),
      typedProj.length ? () => { ignore = ignore.concat(typedProj); paint(); } : (set.proj !== undefined ? () => { delete set.proj; paint(); } : null));
    /* One chip per tag typed, each giving its own word back. A single chip
       saying "3 labels" would leave no way to take one of them off. */
    (o.tags || []).forEach(t2 => {
      const typedTag = words(p, ['tag']).filter(w => slug(w.slice(1)) === t2);
      chip('<span class="at">@</span> ' + esc(t2), 'set', null,
        typedTag.length ? () => { ignore = ignore.concat(typedTag); paint(); } : null);
    });
    const addB = el('button', 'mb-btn mb-press mb-tap go', 'ADD');
    addB.onclick = submit;
    chips.appendChild(addB);
  }
  function submit() {
    const o = final();
    if (!o.text) { UI.toast('Nothing to add', { bad: true }); inp.focus(); return; }
    addQuest(o);
    inp.value = ''; ignore = []; set = {};
    paint();
    inp.focus();
  }
  inp.addEventListener('input', paint);
  /* Moving the caret changes which @word you are in, and that changes what is

  inp.addEventListener('keyup', e => { if (/^Arrow|^Home$|^End$/.test(e.key)) paint(); });
  inp.addEventListener('click', paint);
  inp.addEventListener('blur', () => setTimeout(() => { sug.innerHTML = ''; }, 120));

  });
  ADD = {
    setView(info) { view = info; if (!inp.value) { ignore = []; } paint(); },
    focus() { inp.focus(); },
    input: inp,
  };
}

/* ══════════════ EDITING ONE TASK ══════════════
   The words, then Date, Priority and Project as chips, like Todoist's task
   view. Anything new typed into the words is read out of them on save. */
function editSheet(x) {
  const cur = Rec.get('note', x.date, x.key);
  if (!cur) return;
  x = Object.assign({ key: x.key, date: x.date }, cur);
  const st = { due: dueOf(x) || '', at: x.at || null, rep: x.rep || null, pri: x.pri || 0, proj: x.proj || '', projName: '' };
  let input = null;
  const save = () => {
    const p = parseQuest(input.value);
    if (!p.text) { UI.toast('Nothing to save', { bad: true }); return false; }
    const patch = { text: p.text, due: st.due, at: st.at, rep: st.rep, pri: st.pri, proj: st.proj };
    if (p.due) { patch.due = p.due; patch.at = p.at || null; patch.rep = p.rep || null; }
    else if (p.at) patch.at = p.at;
    if (p.at) patch.dur = p.dur || null;
    if (p.pri != null) patch.pri = p.pri;
    if (p.proj) { patch.proj = p.proj; patch.projName = p.projName; }
    else if (st.projName) patch.projName = st.projName;
    if (patch.rep && !patch.rep.from) patch.rep = Object.assign({}, patch.rep, { from: patch.due });
    saveRow(x, patch);
    return true;
  };
  UI.dialog({
    title: 'TASK', width: 520,
    body: (b, h) => {
      input = UI.field('text', { value: x.text });
      input.setAttribute('autocapitalize', 'sentences');
      input.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); if (save()) h.close(); } };
      b.appendChild(input);
      const chips = el('div', 'chips');
      const inline = el('div');
      b.appendChild(chips);
      b.appendChild(inline);
      const paint = () => {
        chips.innerHTML = '';
        const mk = (label, cls, fn) => { const c = el('button', 'chip' + (cls ? ' ' + cls : ''), label); c.type = 'button'; c.onclick = () => fn(c); chips.appendChild(c); };
        mk(ico('calendar') + ' ' + esc(st.due || st.at ? whenLabel(st.due, st.at) : 'Date') + (st.rep ? ' · ' + esc(repLabel(st.rep)) : ''),
          st.due ? 'set' : '', c => {
            const onPick = v => { st.due = v.due || ''; st.at = v.at || null; st.rep = v.rep || null; paint(); };
            if (narrow()) {
              if (inline.children.length) { inline.innerHTML = ''; return; }
              dateMenu(c, { due: st.due, at: st.at, rep: st.rep }, onPick, { inline: inline });
            } else dateMenu(c, { due: st.due, at: st.at, rep: st.rep }, onPick);
          });
        mk(st.pri ? 'P' + st.pri : 'Priority', st.pri ? 'set p' + st.pri : '', c => choose(c, 'Priority', priItems(st.pri, n => { st.pri = n; paint(); })));
        mk(st.proj ? '<span class="hash">#</span> ' + esc(st.projName || projName(st.proj)) : 'Inbox', st.proj ? 'set' : '',
          c => choose(c, 'Project', projItems(st.proj, pr => { st.proj = pr ? pr.key : ''; st.projName = pr ? pr.name : ''; paint(); })));
      };
      paint();
      if (x.t) {
        const w = new Date(x.t);
        b.appendChild(el('div', 'empty', 'Written ' + w.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
          clock12(pad(w.getHours()) + ':' + pad(w.getMinutes())) + (x.done && x.doneOn ? ' · Done ' + dayWord(x.doneOn) : '')));
      }
      setTimeout(() => { input.focus(); try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {} }, 60);
    },
    actions: [
      { label: 'DELETE', kind: 'bad', fn: () => { removeQuest(x); } },
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: () => save() ? undefined : false },
    ],
  });
}

/* ══════════════ KEYS, AND STARTING ══════════════
   Q adds, as it does in Todoist. #add on the address opens with the cursor in
   the add box, which is what a shortcut to this page wants. */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
  if (typing || document.querySelector('.mb-sheet.on, .mb-veil.on') || POP) return;
  if (e.key === 'q' || e.key === 'Q') { e.preventDefault(); if (ADD) ADD.focus(); }
});

Rec.on(draw);
Day.on(draw);
draw();
Rec.ready(draw);
/* Now and Next on BLOCK's rows move with the clock. */
setInterval(() => { if (!POP) draw(); }, 60000);
if (location.hash === '#add' && ADD) UI.focusSoon(ADD.input);
</script>
</body>
</html>
