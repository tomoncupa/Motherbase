    r.style.marginBottom = 'var(--s4)';
    const hit = days.filter(d => { const v = value(d, f.id); if (v == null) return false; return f.target ? (f.dir === 'lte' ? v <= f.target : v >= f.target) : true; }).length;
    r.innerHTML = '<div style="display:flex;font-size:var(--t2)"><b style="font-weight:600;color:var(--text-2)">' +
      esc(f.label) + '</b><span class="mono muted" style="margin-left:auto">' + hit + '/28</span></div>';
    const g = el('div', 'grid28');
    days.forEach(d => {
      const v = value(d, f.id);
      const on = v != null && (!f.target || (f.dir === 'lte' ? v <= f.target : v >= f.target));
      g.appendChild(el('i', on ? 'on' : (v != null ? 'part' : '')));
    });
    r.appendChild(g);
    c3.appendChild(r);
  });
  m.appendChild(c3);
}

/* raw weights as dots, the 7-day average as the line, the goal as a dash */
function weightChart(e) {
  const W = 320, H = 172, PL = 30, PR = 6, PT = 8, PB = 16;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('class', 'chart');
  svg.setAttribute('preserveAspectRatio', 'none');
  const ser = e.series || e.rows, roll = e.roll;
  const pts = ser.filter(x => x.w != null);
  if (pts.length < 2) {
    const t = document.createElementNS(svg.namespaceURI, 'text');
    t.setAttribute('x', 8); t.setAttribute('y', 24); t.setAttribute('class', 'lab');
    t.textContent = 'two weigh-ins and this draws itself';
    svg.appendChild(t); return svg;
  }
  const goal = num(S.get('goalWeight', null));
  let lo = Math.min.apply(null, pts.map(p => p.w)), hi = Math.max.apply(null, pts.map(p => p.w));
  if (goal != null) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  const pad = Math.max(1, (hi - lo) * .12); lo -= pad; hi += pad;
  const X = i => PL + (i / Math.max(1, ser.length - 1)) * (W - PL - PR);
  const Y = v => PT + (1 - (v - lo) / Math.max(.001, hi - lo)) * (H - PT - PB);
  const add = (tag, attrs, cls) => {
    const n = document.createElementNS(svg.namespaceURI, tag);
    Object.keys(attrs).forEach(k => n.setAttribute(k, attrs[k]));
    if (cls) n.setAttribute('class', cls);
    svg.appendChild(n); return n;
  };
  [0, .5, 1].forEach(t => {
    const y = PT + t * (H - PT - PB);
    add('line', { x1: PL, y1: y, x2: W - PR, y2: y }, 'gl');
    const lab = add('text', { x: 2, y: y + 3 }, 'lab');
    lab.textContent = r1(hi - t * (hi - lo));
  });
  if (goal != null) add('line', { x1: PL, y1: Y(goal), x2: W - PR, y2: Y(goal) }, 'goal');
  pts.forEach(p => add('circle', { cx: X(ser.indexOf(p)), cy: Y(p.w), r: 1.9 }, 'raw'));
  if (roll.length > 1) add('path', { d: roll.map((p, i) => (i ? 'L' : 'M') + X(p.i) + ' ' + Y(p.y)).join(' ') }, 'avg');
  return svg;
}

/* ── the painter ── */
function draw() {
  const m = document.getElementById('main');
  m.innerHTML = '';
  const db = document.getElementById('datebar');
  db.innerHTML = ''; db.appendChild(dateBar());
  document.getElementById('hdate').textContent = Day.short(Day.today());
  document.getElementById('fab').className = outstanding().length ? 'dot' : '';
  if (TAB === 'now') drawNow(m);
  else if (TAB === 'food') drawFood(m);
  else if (TAB === 'money') drawMoney(m);
  else drawTrends(m);
  drawNav();
}
</script>

<script>
/* ══════════════ SETTINGS ══════════════ */

function toggleRow(label, sub, on, fn) {
  const r = el('div', 'sw');
  r.innerHTML = '<span class="nm">' + esc(label) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>';
  const t = el('div', 'tg' + (on ? ' on' : ''), '<i></i>');
  t.onclick = () => fn(!on);
  r.appendChild(t);
  return r;
}
function fieldRow(pane, label, key, val, hint) {
  const w = el('div', 'field');
  w.appendChild(el('label', 'fl', label));
  const i = document.createElement('input');
  i.type = 'text'; i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*');
  i.value = val == null ? '' : String(val);
  i.onchange = () => { const v = num(i.value); if (v != null) { S.set(key, v); TD._dirty = true; draw(); } };
  w.appendChild(i);
  if (hint) w.appendChild(el('div', 'note', hint));
  pane.appendChild(w);
  return i;
}

function openSettings() {
  UI.settings(APP.id, [
    { id: 'track', name: 'TRACK', draw: drawTrackTab },
    { id: 'goals', name: 'GOALS', draw: drawGoalsTab },
    { id: 'sync',  name: 'SYNC',  draw: drawSyncTab },
  ]);
}

function drawTrackTab(pane) {
  settingsPane = pane;
  Object.values(fields()).sort((a, b) => (a.order || 0) - (b.order || 0)).forEach(f => {
    const kind = { number: 'once a day', amount: 'a dose, added up', scale: '1 to 5, any time', check: 'done or not' }[f.measure] || '';
    pane.appendChild(toggleRow(f.label, kind + (f.unit ? ' · ' + f.unit : '') + (f.target ? ' · ' + (f.dir === 'lte' ? '≤' : '≥') + ' ' + f.target : ''), !!f.on, on => {
      Rec.set('field', null, f.id, Object.assign({}, f, { on: on ? 1 : 0 }));
      drawSettingsPane('track'); draw();
    }));
  });
  pane.appendChild(el('div', 'note', 'Turning something off hides it everywhere. Its history is kept.'));

  /* the library: an empty setup screen is a dead end */
  const have = fields();
  const rest = LIBRARY.filter(l => !have[l.id]);
  pane.appendChild(el('label', 'fl', 'Add'));
  if (rest.length) {
    const w = el('div', 'chips');
    rest.forEach(l => {
      const b = el('button', 'chip', '+ ' + esc(l.label));
      b.onclick = () => { addField(l); Mobile.feedback('select'); drawSettingsPane('track'); draw(); };
      w.appendChild(b);
    });
    pane.appendChild(w);
  }
  const custom = el('button', 'btn wide', 'Something else');
  custom.onclick = () => newFieldForm(pane);
  pane.appendChild(custom);

  pane.appendChild(el('label', 'fl', 'Accounts'));
  accts().forEach(a => {
    const r = el('div', 'row');
    r.innerHTML = '<span class="nm">' + esc(a.name) + '</span>';
    const x = el('button', 'x', '✕');
    x.onclick = () => { Rec.del('acct', null, a.name.toLowerCase()); drawSettingsPane('track'); };
    r.appendChild(x); pane.appendChild(r);
  });
  const add = el('div', 'stepper');
  const ni = document.createElement('input'); ni.type = 'text'; ni.placeholder = 'New account';
  const ab = el('button', null, '+');
  ab.onclick = () => { const v = ni.value.trim(); if (!v) return; Rec.set('acct', null, v.toLowerCase(), { name: v, order: accts().length }); drawSettingsPane('track'); };
  add.appendChild(ni); add.appendChild(ab);
  pane.appendChild(add);

  pane.appendChild(el('label', 'fl', 'Photos'));
  const n = shotCount();
  pane.appendChild(el('div', 'note', n + ' stored. Storage on a phone is about 5MB in total, and photos are the only thing here big enough to fill it.'));
  const clr = el('button', 'btn wide', 'Delete all photos');
  clr.onclick = () => UI.confirm('Delete every photo?', 'The entries they belong to stay.')
    .then(ok => { if (ok) { Rec.all('shot').forEach(r => Rec.del('shot', r.date, r.key)); drawSettingsPane('track'); } });
  pane.appendChild(clr);
}

/* anything not in the library */
function newFieldForm(pane) {
  pane.innerHTML = '';
  pane.appendChild(el('label', 'fl', 'Name'));
  const nm = document.createElement('input'); nm.type = 'text'; nm.placeholder = 'Collagen';
  pane.appendChild(nm);

  pane.appendChild(el('label', 'fl', 'Unit'));
  const un = document.createElement('input'); un.type = 'text'; un.placeholder = 'g';
  pane.appendChild(un);

  pane.appendChild(el('label', 'fl', 'Kind'));
  let measure = 'amount';
  const seg = el('div', 'seg');
  const paint = () => {
    seg.innerHTML = '';
    [['amount', 'A dose'], ['number', 'One a day'], ['scale', '1 to 5'], ['check', 'Done or not']].forEach(k => {
      const b = el('button', measure === k[0] ? 'on' : '', k[1]);
      b.onclick = () => { measure = k[0]; paint(); };
      seg.appendChild(b);
    });
  };
  paint();
  pane.appendChild(seg);

  pane.appendChild(el('label', 'fl', 'Target, if it has one'));
  const tg = document.createElement('input');
  tg.type = 'text'; tg.inputMode = 'decimal'; tg.placeholder = 'optional';
  pane.appendChild(tg);

  const save = el('button', 'btn go wide', 'Add it');
  save.style.marginTop = 'var(--s5)';
  save.onclick = () => {
    const label = nm.value.trim();
    if (!label) return UI.toast('It needs a name', { bad: true });
    const spec = { id: uid(), label: label, unit: un.value.trim(), measure: measure };
    const t = num(tg.value);
    if (t != null) { spec.target = t; spec.dir = 'gte'; }
    if (measure === 'amount' || measure === 'number') { spec.step = 1; spec.dec = 1; }
    addField(spec);
    Mobile.feedback('select');
    drawSettingsPane('track'); draw();
  };
  pane.appendChild(save);
  const back = el('button', 'btn wide quiet', 'Cancel');
  back.onclick = () => drawSettingsPane('track');
  pane.appendChild(back);
}

function drawGoalsTab(pane) {
  settingsPane = pane;
  const tg = TARGETS();
  let mode = S.get('calMode', 'fixed');

  pane.appendChild(el('label', 'fl', 'Calorie target'));
  const seg = el('div', 'seg');
  [['fixed', 'A number I set'], ['tdee', 'From my TDEE']].forEach(k => {
    const b = el('button', mode === k[0] ? 'on' : '', k[1]);
    b.onclick = () => { S.set('calMode', k[0]); drawSettingsPane('goals'); draw(); };
    seg.appendChild(b);
  });
  pane.appendChild(seg);

  if (mode === 'tdee') {
    const e = TD.estimate();
    fieldRow(pane, 'Lose this much a week (lb)', 'goalRate', S.get('goalRate', 1.25),
      'Target = TDEE − (rate × ' + TD.ed() + ' ÷ 7), which is ' + Math.round(S.get('goalRate', 1.25) * TD.ed() / 7) + ' kcal a day under.');
    pane.appendChild(el('div', e.basis === 'measured' ? 'note' : 'warnbox',
      e.basis === 'measured'
        ? 'Target right now: ' + calTarget().v.toLocaleString() + ' kcal, from a measured TDEE of ' + (e.predicted || e.tdee).toLocaleString() + '.'
        : 'Your TDEE is not measured yet — ' + esc(e.why || '') + '. Until it is, the fixed number below is used.'));
  }
  const kc = el('div', 'field');
  kc.appendChild(el('label', 'fl', mode === 'tdee' ? 'Fallback calories' : 'Calories'));
  const ki = document.createElement('input');
  ki.type = 'text'; ki.inputMode = 'decimal'; ki.value = String(tg.kcal == null ? '' : tg.kcal);
  ki.onchange = () => { const t = TARGETS(); t.kcal = num(ki.value, t.kcal); S.set('targets', t); draw(); };
  kc.appendChild(ki);
  pane.appendChild(kc);

  pane.appendChild(el('label', 'fl', 'Macros'));
  const g = el('div', 'grid3');
  [['p', 'Protein g'], ['c', 'Carbs g'], ['f', 'Fat g']].forEach(k => {
    const w = el('div');
    w.appendChild(el('label', 'fl', k[1]));
    const i = document.createElement('input');
    i.type = 'text'; i.inputMode = 'decimal'; i.value = String(tg[k[0]] == null ? '' : tg[k[0]]);
    i.onchange = () => { const t = TARGETS(); t[k[0]] = num(i.value, t[k[0]]); S.set('targets', t); draw(); };
    w.appendChild(i); g.appendChild(w);
  });
  pane.appendChild(g);

  fieldRow(pane, 'Goal weight (lb)', 'goalWeight', S.get('goalWeight', null), 'Drawn on the weight chart. Optional.');

  pane.appendChild(el('label', 'fl', 'The estimator'));
  pane.appendChild(el('div', 'note', 'Defaults are what the brief calls for. Backtest before changing them by hand.'));
  fieldRow(pane, 'Energy per lb (kcal)', 'ed', TD.ed(), 'What one pound of change is worth. A working figure, not a law.');
  fieldRow(pane, 'Half-life (days)', 'halfLife', S.get('halfLife', 21), 'How fast old data stops counting. At 21, three weeks ago counts half.');
  fieldRow(pane, 'Adaptation rate', 'alpha', TD.alpha(), 'How far the estimate moves toward each new reading.');
  fieldRow(pane, 'Trend window (days)', 'win', TD.win(), 'How far back the weight trend line looks.');
  fieldRow(pane, 'Starting guess (kcal per lb)', 'perLb', TD.perLb(), 'Before there is data: weight × this. 13 is what your sheet used.');
  fieldRow(pane, 'Brake (kcal)', 'guard', TD.guard(), 'The most one update may move the estimate.');

  const bt = el('button', 'btn wide', 'Backtest the settings');
  bt.style.marginTop = 'var(--s4)';
  bt.onclick = () => runBacktest();
  pane.appendChild(bt);

  const rc = el('button', 'btn wide quiet', 'Recalculate from scratch');
  rc.onclick = () => { S.set('tdeeState', null); TD._dirty = true; TD.tick(); draw(); drawSettingsPane('goals'); UI.toast('Recalculated'); };
  pane.appendChild(rc);
}

/* score the current settings against history, then sweep for better ones */
function runBacktest() {
  const base = TD.backtest(null, 14);
  if (base.mae == null || base.n < 10) {
    return UI.dialog({ title: 'BACKTEST', width: 460,
      body: b => { b.appendChild(el('div', 'empty',
        'Not enough history yet. This needs roughly two months of weights and food logged before it can tell you anything. It found ' + base.n + ' usable stretches and needs at least 10.')); },
      actions: [{ label: 'OK', kind: 'go' }] });
  }
  UI.toast('Sweeping…');
  setTimeout(() => {
    const res = TD.optimise();
    UI.dialog({
      title: 'BACKTEST', width: 500,
      body: b => {
        b.appendChild(el('div', 'note', 'Each setting is scored on how well it predicted the next 14 days of weight change, across ' + base.n + ' stretches of your history. The number is how many pounds it was out by. Lower is better.'));
        b.appendChild(el('div', 'note', 'Energy per lb is not tested here. It sets the estimate and converts it back again, so it cancels out and every value scores the same. Leave it at 3500 unless you have a reason.'));
        const now = el('div', 'row');
        now.innerHTML = '<span class="nm">What you use now</span><span class="fig">' + r1(base.mae * 10) / 10 + ' lb off</span>';
        b.appendChild(now);
        b.appendChild(el('label', 'fl', 'Best found'));
        res.slice(0, 5).forEach(r => {
          const row = el('div', 'row tap');
          row.innerHTML = '<span class="nm">Half-life ' + r.p.halfLife + ' days' +
            '<small>adaptation ' + r.p.alpha + ' · window ' + r.p.trendWin + ' days</small></span>' +
            '<span class="fig">' + Math.round(r.mae * 100) / 100 + '</span>';
          row.onclick = () => UI.confirm('Use these settings?', 'Half-life ' + r.p.halfLife + ' days, adaptation ' + r.p.alpha + ', window ' + r.p.trendWin + ' days.')
            .then(ok => { if (ok) { Object.keys(r.p).forEach(k => S.set(k === 'trendWin' ? 'win' : k, r.p[k])); TD._dirty = true; draw(); UI.toast('Applied'); } });
          b.appendChild(row);
        });
      },
      actions: [{ label: 'DONE', kind: 'go' }],
    });
  }, 60);
}

function drawSyncTab(pane) {
  settingsPane = pane;
  pane.appendChild(el('div', 'note', 'Two ways out, and they do different jobs. <b>Backup</b> is a file that restores. <b>Export</b> is a spreadsheet you can read but not restore from. Both live in the DATA tab.'));
  const cfg = S.get('mirror', { url: '', on: 0, at: null });

  pane.appendChild(el('label', 'fl', 'GOOGLE SHEET MIRROR'));
  pane.appendChild(el('div', 'warnbox', '<b>Untested.</b> I cannot try this end to end without your sheet, so treat the first run as the test. It never blocks anything: if the push fails, STATUS carries on and tries again next time.'));
  pane.appendChild(el('div', 'note', 'Setup, once: make a blank Google Sheet → Extensions → Apps Script → paste the script below → Deploy → New deployment → Web app → Execute as <b>me</b>, access <b>anyone</b> → copy the URL → paste it here.'));

  const u = document.createElement('input');
  u.type = 'text'; u.placeholder = 'https://script.google.com/macros/s/…/exec';
  u.value = cfg.url || '';
  u.onchange = () => { const c = S.get('mirror', {}); c.url = u.value.trim(); S.set('mirror', c); };
  pane.appendChild(u);

  pane.appendChild(toggleRow('Push at the end of each day', cfg.at ? 'last pushed ' + cfg.at : 'never pushed yet', !!cfg.on, on => {
    const c = S.get('mirror', {}); c.on = on ? 1 : 0; S.set('mirror', c); drawSettingsPane('sync');
  }));

  const now = el('button', 'btn go wide', 'PUSH NOW');
  now.style.minHeight = '46px';
  now.onclick = () => Mirror.push(true).then(() => drawSettingsPane('sync'));
  pane.appendChild(now);

  const show = el('button', 'btn wide', 'SHOW ME THE SCRIPT TO PASTE');
  show.style.marginTop = '8px';
  show.onclick = () => {
    const t = document.createElement('textarea');
    t.rows = 14; t.value = Mirror.script();
    t.style.fontFamily = 'var(--font-mono)'; t.style.fontSize = '11px';
    UI.dialog({ title: 'APPS SCRIPT', width: 560, body: b => { b.appendChild(t); setTimeout(() => { t.select(); }, 50); },
      actions: [{ label: 'DONE', kind: 'go' }] });
  };
  pane.appendChild(show);
}

/* Repaint one settings pane in place. The pane element is handed to each tab
   when it draws, so hold on to it rather than hunting for it in the DOM —
   shared/ui.js owns that markup and has already changed it once. */
let settingsPane = null;
function drawSettingsPane(which) {
  const pane = settingsPane;
  if (!pane) return;
  pane.innerHTML = '';
  if (which === 'track') drawTrackTab(pane);
  else if (which === 'goals') drawGoalsTab(pane);
  else drawSyncTab(pane);
}

/* ══════════════ THE SHEET MIRROR ══════════════ */

const Mirror = {
  script() {
    return [
      'function doPost(e) {',
      '  var body = JSON.parse(e.postData.contents);',
      '  var ss = SpreadsheetApp.getActiveSpreadsheet();',
      '  body.sheets.forEach(function (s) {',
      '    var sh = ss.getSheetByName(s.name) || ss.insertSheet(s.name);',
      '    sh.clear();',
      '    if (s.rows.length) sh.getRange(1, 1, s.rows.length, s.rows[0].length).setValues(s.rows);',
      '  });',
      '  return ContentService.createTextOutput(JSON.stringify({ ok: true }))',
      '    .setMimeType(ContentService.MimeType.JSON);',
      '}',
    ].join('\n');
  },
  push(manual) {
    const cfg = S.get('mirror', {});
    if (!cfg.url) { if (manual) UI.toast('paste the web app URL first', { bad: true }); return Promise.resolve(false); }
    const sheets = exportSheets().map(s => ({ name: s.name, rows: s.rows }));
    if (manual) UI.toast('pushing…');
    return fetch(cfg.url, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },  /* text/plain avoids the CORS preflight Apps Script cannot answer */
      body: JSON.stringify({ app: APP.id, at: new Date().toISOString(), sheets: sheets }),
    }).then(r => {
      const c = S.get('mirror', {}); c.at = Day.today(); S.set('mirror', c);
      if (manual) UI.toast('pushed <b>' + sheets.length + ' tabs</b>');
      return true;
    }).catch(e => {
      if (manual) UI.toast('could not reach the sheet — <b>nothing lost</b>, it will try again', { bad: true });
      return false;
    });
  },
  maybe() {
    const cfg = S.get('mirror', {});
    if (!cfg.on || !cfg.url) return;
    if (cfg.at === Day.today()) return;
    if (!Day.isClosed || !Day.isClosed(Day.today())) return;
    Mirror.push(false);
  },
};

/* ══════════════ EXPORT ══════════════ */

function exportSheets() {
  const days = Day.last(370);
  const live = Object.values(fields()).sort((a, b) => (a.order || 0) - (b.order || 0));

  const daily = [['Date', 'Day'].concat(live.map(f => f.label + (f.unit ? ' (' + f.unit + ')' : '')))
    .concat(['Calories', 'Protein g', 'Carbs g', 'Fat g', 'Sodium mg', 'Potassium mg', 'Caffeine mg', 'Food eaten ₱', 'Spent ₱'])];
  days.forEach(d => {
    const t = dayTotals(d), sp = spendTotal(d);
    const any = live.some(f => value(d, f.id) != null) || t.kcal || sp;
    if (!any) return;
    daily.push([d, new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' })].concat(live.map(f => { const v = value(d, f.id); return v == null ? '' : r1(v); }))
      .concat([Math.round(t.kcal), r1(t.p), r1(t.c), r1(t.f), Math.round(t.na), Math.round(t.k), Math.round(t.caff),
        Math.round(t.price), Math.round(sp)]));
  });

  const mealRows = [['Date', 'Time', 'Food', 'Serving', 'Amount', 'Unit', 'Calories', 'Protein', 'Carbs', 'Fat', 'Sodium', 'Potassium', 'Caffeine', 'Price']];
  days.forEach(d => meals(d).forEach(x => mealRows.push([d, new Date(x.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    x.name, x.serve || '', r1(x.amt), x.unit || '', Math.round(x.kcal), r1(x.p), r1(x.c), r1(x.f), Math.round(x.na), Math.round(x.k), Math.round(x.caff), Math.round(x.price)])));

  const spendRows = [['Date', 'Time', 'Amount', 'Account', 'Details']];
  days.forEach(d => spends(d).forEach(s => spendRows.push([d, new Date(s.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    r1(s.amt), s.acct || '', s.note || ''])));

  const foodRows = [['Food', 'Brand', 'Group', 'Serving', 'Unit', 'Calories', 'Protein', 'Carbs', 'Fat', 'Sodium', 'Potassium', 'Caffeine', 'Price', 'Your servings', 'Times logged']];
  Object.values(foods()).forEach(f => foodRows.push([f.name, f.brand || '', f.cat || '', r1(num(f.base.amt, 0)), f.base.unit || '',
    num(f.base.kcal, ''), num(f.base.p, ''), num(f.base.c, ''), num(f.base.f, ''), num(f.base.na, ''), num(f.base.k, ''), num(f.base.caff, ''), num(f.base.price, ''),
    (f.serves || []).map(s => s.label + ' = ' + r1(s.mult) + '×').join('; '), f.uses || 0]));

  const e = TD.estimate();
  const tdeeRows = [['Measure', 'Value'],
    ['TDEE', e.tdee == null ? '' : e.tdee], ['Basis', e.basis], ['Confidence %', e.conf],
    ['Average intake', e.intake == null ? '' : e.intake], ['Trend lb/week', e.rate == null ? '' : r1(e.rate)],
    ['Days of food logged', e.calDays], ['Weigh-ins', e.weighIns],
    ['Energy per lb', TD.ed()], ['Smoothing', TD.alpha()], ['Window days', TD.win()],
    ['Target intake', TD.targetIntake() == null ? '' : TD.targetIntake()]];

  return [
    { name: 'Daily', rows: daily, widths: daily[0].map(() => 12) },
    { name: 'Meals', rows: mealRows, widths: mealRows[0].map(() => 12) },
    { name: 'Spending', rows: spendRows, widths: [11, 8, 10, 12, 30] },
    { name: 'Foods', rows: foodRows, widths: foodRows[0].map(() => 13) },
    { name: 'TDEE', rows: tdeeRows, widths: [24, 14] },
  ];
}

/* ══════════════ BOOT ══════════════ */

Rec.onfull = () => UI.toast('<b>storage is full.</b> Settings → TRACK → delete photos, or back up and clear.', { bad: true });

Rec.ready(() => {
  seedFields();
  TD.tick();
  Mirror.maybe();
  draw();
  if (IO.isStale(APP.id)) setTimeout(() => UI.toast('no backup in ' + (IO.staleDays(APP.id) == null ? 'a while' : IO.staleDays(APP.id) + ' days') + ' — <b>settings → data</b>'), 1500);
});
Rec.on(draw);
Day.on(() => { TD.tick(); draw(); });
</script>
