       chips walks straight past them and adopts the NEXT field's box, so
       tapping Account put the cursor in Details. */
    for (let i = 0; n && i < 3 && !box && !n.matches('label.fl'); i++, n = n.nextElementSibling) {
      box = n.matches('input,textarea,select') ? n : n.querySelector('input:not([type=range]),textarea,select');
    }
    if (!box || box.disabled || box.readOnly) return;
    lb.style.cursor = 'pointer';
    lb.onclick = () => {
      box.focus();
      if (box.setSelectionRange && /^(text|search|tel|url|password)$/.test(box.type || 'text')) {
        try { box.setSelectionRange(box.value.length, box.value.length); } catch (e) {}
      }
    };
  });
}

function closeSheet() {
  const h = sheetH; sheetH = null;
  if (h) { try { h.close(); } catch (e) {} }
}

/* small builders ---------------------------------------------------- */
function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
function chipRow(vals, onPick, cls) {
  const w = el('div', 'chips');
  vals.forEach(v => {
    const b = el('button', 'chip' + (cls ? ' ' + cls : ''), esc(v.label != null ? v.label : v));
    b.onclick = () => onPick(v.value != null ? v.value : v);
    w.appendChild(b);
  });
  return w;
}
function numberInput(v, step, dec) {
  const w = el('div', 'stepper');
  const minus = el('button', null, '−'), plus = el('button', null, '+');
  const i = document.createElement('input');
  i.className = 'num';
  Mobile.field(i, dec ? 'decimal' : 'number');
  i.value = v == null ? '' : String(v);
  /* The buttons have to announce themselves. Setting .value from script fires
     no event, so every sheet that watches `oninput` to recompute something —
     the whole of the food amount sheet — sat there showing one multiple and
     logging another. Typing worked and pressing + did nothing, which is
     exactly how "logging by multiples doesn't work" looks from outside. */
  const bump = d => {
    const cur = num(i.value, 0) || 0;
    const n = Math.max(0, cur + d * step);
    i.value = dec ? String(r1(n)) : String(Math.round(n));
    i.dispatchEvent(new Event('input', { bubbles: true }));
  };
  minus.onclick = () => bump(-1); plus.onclick = () => bump(1);
  w.appendChild(minus); w.appendChild(i); w.appendChild(plus);
  w.input = i;
  return w;
}
/* ── a wheel, next to the keypad ──
   Only worth adding where dragging changes something else you are watching.
   Without a coupled readout a keypad is faster and more precise, so this lives
   in Goals — where grams drive calories and a rate drives a target — and
   nowhere else.

   Both controls edit the same value and stay in step. The keypad is for when
   you know the number; the wheel is for when you are looking for it.        */
function wheelInput(v, opts) {
  opts = opts || {};
  const lo = opts.min == null ? 0 : opts.min;
  const hi = opts.max == null ? 100 : opts.max;
  const step = opts.step || 1;
  const dec = opts.dec ? 1 : 0;

  const w = el('div', 'wheel');
  const i = document.createElement('input');
  i.className = 'num';
  Mobile.field(i, dec ? 'decimal' : 'number');
  i.value = v == null ? '' : String(v);

  const r = document.createElement('input');
  r.type = 'range'; r.className = 'mb-range';
  r.min = lo; r.max = hi; r.step = step;
  r.value = v == null ? lo : Math.max(lo, Math.min(hi, v));

  const val = () => num(i.value, lo) || 0;
  const say = () => { if (opts.onChange) opts.onChange(val()); };

  /* Dragging is the whole point, so it reports on every frame rather than on
     release — the number it drives has to move with your thumb or there is no
     reason to drag instead of type. */
  r.oninput = () => {
    i.value = dec ? String(r1(+r.value)) : String(Math.round(+r.value));
    say();
  };
  i.oninput = () => { r.value = Math.max(lo, Math.min(hi, val())); say(); };

  w.appendChild(i); w.appendChild(r);
  w.input = i;
  w.set = n => { i.value = dec ? String(r1(n)) : String(Math.round(n)); r.value = n; };
  return w;
}

function saveBar(label, fn) {
  const b = el('button', 'btn go wide', label || 'SAVE');
  b.style.marginTop = '12px'; b.style.minHeight = '50px';
  b.onclick = fn;
  return b;
}

/* ══════════════ PHOTOS ══════════════
   The camera comes through a plain file input, which is the one route that
   works on an iPhone opened from a folder. Pictures are shrunk before they
   are stored: a full phone photo is 3MB and the whole store is about 5MB. */

function pickPhoto(cb) {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  i.setAttribute('capture', 'environment');
  i.style.display = 'none';
  document.body.appendChild(i);
  i.onchange = () => {
    const f = i.files && i.files[0];
    document.body.removeChild(i);
    if (f) cb(f);
  };
  i.click();
}
function shrink(file, max, quality) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('could not read the photo'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('could not open the photo'));
      img.onload = () => {
        let w = img.width, h = img.height;
        const s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function saveShot(kind, dataUrl, ref) {
  const id = uid();
  Rec.set('shot', vd(), id, { img: dataUrl, kind: kind, ref: ref || null, t: Date.now() });
  return id;
}
const shotCount = () => Rec.all('shot').length;

/* ══════════════ READING TEXT OFF A PHOTO ══════════════
   Loaded from a CDN only when asked for, and only ever an assist. If it
   does not load, or reads nonsense, the manual form is right there with
   the picture beside it. Never a dependency.                              */

const OCR = {
  url: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  loading: null,
  load() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (OCR.loading) return OCR.loading;
    OCR.loading = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = OCR.url;
      s.onload = () => res(window.Tesseract);
      s.onerror = () => rej(new Error('offline'));
      document.head.appendChild(s);
      setTimeout(() => rej(new Error('timeout')), 20000);
    }).catch(e => { OCR.loading = null; throw e; });
    return OCR.loading;
  },
  read(dataUrl, onProgress) {
    return OCR.load().then(T => T.recognize(dataUrl, 'eng', {
      logger: m => { if (m.status === 'recognizing text' && onProgress) onProgress(m.progress); },
    })).then(r => r.data.text || '');
  },
};

/* pull a number that follows a word, tolerating the usual label noise */
function grab(text, words, unit) {
  const t = text.replace(/[,]/g, '').toLowerCase();
  for (let i = 0; i < words.length; i++) {
    const re = new RegExp(words[i] + '[^0-9\\n]{0,24}([0-9]+(?:\\.[0-9]+)?)\\s*' + (unit || ''), 'i');
    const m = t.match(re);
    if (m) return parseFloat(m[1]);
  }
  return null;
}
function parseLabel(text) {
  const o = {};
  o.kcal = grab(text, ['energy', 'calories', 'calorie', 'kcal']);
  o.p    = grab(text, ['protein'], 'g?');
  o.c    = grab(text, ['total carbohydrate', 'carbohydrate', 'carbs', 'carb'], 'g?');
  o.f    = grab(text, ['total fat', 'fat'], 'g?');
  o.na   = grab(text, ['sodium'], 'mg?');
  o.k    = grab(text, ['potassium'], 'mg?');
  o.caff = grab(text, ['caffeine'], 'mg?');
  const sz = text.match(/serving size[^0-9\n]{0,20}([0-9]+(?:\.[0-9]+)?)\s*(g|ml|mL|G|ML)/i);
  if (sz) { o.amt = parseFloat(sz[1]); o.unit = sz[2].toLowerCase(); }
  return o;
}
function parseReceipt(text) {
  const o = {};
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++) {
    if (/total/i.test(lines[i]) && !/sub\s*total/i.test(lines[i])) {
      const m = lines[i].replace(/,/g, '').match(/([0-9]+(?:\.[0-9]{1,2})?)/g);
      if (m && m.length) { o.amt = parseFloat(m[m.length - 1]); break; }
    }
  }
  if (o.amt == null) {
    const all = (text.replace(/,/g, '').match(/[0-9]+\.[0-9]{2}/g) || []).map(parseFloat);
    if (all.length) o.amt = Math.max.apply(null, all);
  }
  if (lines.length) o.note = lines[0].slice(0, 40);
  return o;
}

/* the photo strip used by both the label reader and the receipt reader */
function photoBlock(body, kind, onText, onShot) {
  const wrap = el('div', 'shot');
  const status = el('div', 'note', 'Photograph the label, then check what it read.');
  let imgEl = null;
  const take = el('button', 'btn', 'Photo');
  take.onclick = () => pickPhoto(file => {
    status.textContent = 'shrinking…';
    shrink(file, 1400, .8).then(big => {
      return shrink(file, 360, .6).then(small => {
        const id = saveShot(kind, small);
        if (onShot) onShot(id, small);
        if (!imgEl) { imgEl = document.createElement('img'); wrap.insertBefore(imgEl, wrap.firstChild); }
        imgEl.src = small;
        status.textContent = 'reading…';
        return OCR.read(big, p => { status.textContent = 'reading… ' + Math.round(p * 100) + '%'; })
          .then(txt => { status.textContent = 'read it — check every number before saving.'; onText(txt); })
          .catch(() => { status.textContent = 'could not read it. Type it in.'; });
      });
    }).catch(e => { status.textContent = 'could not use that photo: ' + e.message; });
  });
  const col = el('div');
  col.style.flex = '1';
  col.appendChild(take);
  col.appendChild(status);
  wrap.appendChild(col);
  body.appendChild(wrap);
}
</script>

<script>
/* ══════════════ THE FAST INPUT ══════════════
   One tap to open, one tap to log. Anything measured once a day drops off
   this list the moment it is logged, so what is left is only what is left
   to do.                                                                  */

/* A field with `days` is only due on those weekdays — 0 is Sunday. Without
   `days` it is due every day, which is what everything used to be. `slot` is
   just a word for when, printed next to it: "Sunday morning". */
const dueToday = (f, date) => !f.days || !f.days.length || f.days.indexOf(Day.dow(date || vd())) > -1;
const outstanding = () => liveFields().filter(f => f.once && dueToday(f) && !logged(vd(), f.id));

/* ── the quick add ──
   Two halves, and the top one empties itself.

   Above: whatever is still unlogged today, in the order the tiles are in on
   Today. Same list, same sequence, so the button is where the gap was — you
   look at the island, see a dash, open the sheet, and the thing is in the
   position you just looked at. That is the part worth keeping: while there is
   a list, it is the shortest path to the end of it, and it shrinks by one
   every time you use it.

   Below: four that never move. Mood, Energy, Food, Spending — the things you
   do more than once a day, so they can never be "done" and can never leave.
   They stay in the same four places whether the list above is five items or
   nothing, which is what makes the sheet learnable rather than something you
   read each time.

   So it builds itself until everything once-a-day is in, then it settles down
   to the four. The amber dot on the + tracks the top half exactly, and when
   the top half is empty the dot is gone.

   Food and Spending sit below rather than in the list because they are never
   finished either — hiding them behind an unweighed morning would mean not
   logging lunch until you had stood on a scale.

   Mood and Energy are looked up rather than assumed, so turning one off takes
   its button with it instead of leaving one that opens nothing. QUICK is the
   line to change to pick a different two. */
const QUICK = ['mood', 'energy'];

function quickField(key) {
  const all = Object.values(fields());
  return all.filter(f => f.on && (f.id === key || String(f.label).toLowerCase() === key))[0] || null;
}

function fastInput() {
  openSheet('Log', body => {
    if (!Day.isToday(vd())) body.appendChild(el('div', 'warnbox', 'Logging into ' + esc(Day.label(vd())) + ', not today.'));

    /* outstanding() is liveFields() narrowed, so it is already in tile order
       — the island and this list cannot drift apart without someone changing
       both */
    const out = outstanding();
    if (out.length) {
      const g = el('div');
      g.style.marginBottom = 'var(--s-2)';
      out.forEach(f => {
        const hint = f.target ? '<span class="muted mono">' + (f.dir === 'lte' ? '≤' : '≥') + ' ' + f.target +
          (f.unit ? ' ' + esc(f.unit) : '') + '</span>' : '';
        const b = el('button', 'btn wide mb-press mb-tap', esc(f.label) + (hint ? '  ' + hint : ''));
        b.style.cssText = 'margin-bottom:var(--s-2);min-height:var(--tap);text-align:left';
        b.onclick = () => fieldSheet(f, vd());
        g.appendChild(b);
      });
      body.appendChild(g);
    }

    const row = el('div', 'grid2');
    const big = (label, fn) => {
      const b = el('button', 'btn wide mb-press mb-tap', esc(label));
      b.style.minHeight = '54px';
      b.onclick = fn;
      row.appendChild(b);
    };
    QUICK.forEach(key => {
      const f = quickField(key);
      if (f) big(f.label, () => fieldSheet(f, vd()));
    });
    big('Food', foodPicker);
    big('Spending', () => spendSheet());
    body.appendChild(row);
  });
}

/* ── half-life ──
   For anything with a `half` (hours): every dose decays on its own clock and
   what is left is the sum of them. 200mg of caffeine at 8am with a 5 hour
   half-life is 100mg at 1pm and 50mg at 6pm. Doses from yesterday still count,
   which is the whole point — that is why an evening coffee shows up in your
   sleep.                                                                    */
function remaining(f, when) {
  if (!f.half) return null;
  const now = when == null ? Date.now() : when;
  let total = 0;
  /* three half-lives back is 12% left; anything older is noise */
  const span = Math.ceil(f.half * 4 / 24) + 1;
  Day.last(span).forEach(date => {
    /* food counts here too: an evening coffee is why you are awake, whether
       it was logged as a dose or eaten as a meal */
    entries(date, f.id).forEach(e => {
      const hrs = (now - e.t) / 3600000;
      if (hrs < 0) return;
      total += e.v * Math.pow(0.5, hrs / f.half);
    });
  });
  return total;
}
/** when the level will next fall below `to` — the practical question */
function clearsAt(f, to) {
  const now = remaining(f);
  if (!now || now <= to) return null;
  return Date.now() + f.half * Math.log(now / to) / Math.log(2) * 3600000;
}

/* A meal logged without a food behind it. Same `meal` row as any other, with
   no `fid`, so it counts everywhere and simply has nothing to edit back into. */
function oneOffSheet() {
  const d = vd();
  openSheet('One-off', body => {
    const f = {};
    const add = (key, label, kind) => {
      body.appendChild(el('label', 'fl', label));
      const i = document.createElement('input');
      if (kind === 'name') { i.type = 'text'; i.setAttribute('autocapitalize', 'words'); }
      else { i.type = 'text'; i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*'); }
      f[key] = i; body.appendChild(i);
      return i;
    };
    add('name', 'What was it', 'name').placeholder = 'Chicken rice, the place on the corner';
    const g = el('div', 'grid2');
    [['kcal', 'Calories'], ['price', 'Price']].forEach(k => {
      const w = el('div'); w.appendChild(el('label', 'fl', k[1]));
      const i = document.createElement('input');
      i.type = 'text'; i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*');
      f[k[0]] = i; w.appendChild(i); g.appendChild(w);
    });
    body.appendChild(g);
    const g2 = el('div', 'grid3');
    [['p', 'Protein'], ['c', 'Carbs'], ['f', 'Fat']].forEach(k => {
      const w = el('div'); w.appendChild(el('label', 'fl', k[1]));
      const i = document.createElement('input');
      i.type = 'text'; i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*');
      f[k[0]] = i; w.appendChild(i); g2.appendChild(w);
    });
    body.appendChild(g2);

    /* The rest of the label. These were hard-coded to zero, so a can of
       something logged here counted its calories and threw its caffeine away
       — and the Caffeine tile stayed empty with no way to tell why. Blank
       still means zero; the difference is that now there is somewhere to type
       it. */
    const g3 = el('div', 'grid3');
    [['na', 'Sodium mg'], ['k', 'Potassium mg'], ['caff', 'Caffeine mg']].forEach(k => {
      const w = el('div'); w.appendChild(el('label', 'fl', k[1]));
      const i = document.createElement('input');
      i.type = 'text'; i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*');
      f[k[0]] = i; w.appendChild(i); g3.appendChild(w);
    });
    body.appendChild(g3);

    /* If calories are left blank, work them out from whatever macros were
       given rather than logging a zero. */
    const note = el('div', 'note');
    body.appendChild(note);
    const derived = () => Math.round((num(f.p.value, 0) || 0) * 4 + (num(f.c.value, 0) || 0) * 4 + (num(f.f.value, 0) || 0) * 9);
    const sync = () => {
      const k = derived();
      note.textContent = num(f.kcal.value) == null
        ? (k ? 'Calories will be ' + k + ', from the macros.' : '')
        : (k && Math.abs(k - num(f.kcal.value, 0)) > Math.max(50, num(f.kcal.value, 0) * .1)
            ? 'Those macros come to ' + k + ' kcal.' : '');
    };
    ['p', 'c', 'f', 'kcal'].forEach(k => { f[k].oninput = sync; });

    /* A one-off is almost always a plate somebody else cooked, and a plate
       somebody else cooked is a guess. Urban 2011 measured restaurant meals
       averaging around 18% above their stated calories, so a fifth out is the
       honest starting point rather than pretending to know. One tap says
       otherwise when you read it off a menu. */
    let err = .2, acct = '';
    body.appendChild(el('label', 'fl', 'How sure'));
    body.appendChild(errChips(err, v => { err = v; }));
    body.appendChild(el('label', 'fl', 'Paid from'));
    body.appendChild(acctChips(acct, v => { acct = v; }));

    Mobile.form(body);

    body.appendChild(saveBar('Log it', () => {
      const name = f.name.value.trim();
      if (!name) return UI.toast('It needs a name', { bad: true });
      const kcal = num(f.kcal.value) == null ? derived() : num(f.kcal.value, 0);
      const row = { fid: null, name: name, serve: 'one-off', unit: '', amt: 1, mult: 1, t: Date.now(),
        kcal: kcal, p: num(f.p.value, 0) || 0, c: num(f.c.value, 0) || 0, f: num(f.f.value, 0) || 0,
        na: num(f.na.value, 0) || 0, k: num(f.k.value, 0) || 0, caff: num(f.caff.value, 0) || 0,
        price: num(f.price.value, 0) || 0, err: err, acct: acct };
      const key = uid();
      Rec.set('meal', d, key, row);
      mealSpend(d, key, row);
      Mobile.feedback('success');
      closeSheet(); draw();
    }));
  });
}

/* ── correcting the past ──
   A meal row froze its numbers when it was logged, so fixing a food's macros
   does not touch what you already ate. That is right by default — it is what
   stops last month's log rewriting itself every time you tidy the database.

   But a typo has to be correctable, or every serving keeps the wrong number
   forever. So after a real change to a food's per-unit numbers, offer to
   recalculate the servings that used it. Each one keeps its own amount and is
   rescaled from the corrected food, so the amounts you actually ate survive.

   The offer names the count, because rewriting history should never happen as
   a side effect of saving a form. */
function recost(row, before) {
  if (!before || !before.base) return;
  const changed = NUTS.concat(['price', 'amt']).some(n =>
    (num(before.base[n], 0) || 0) !== (num(row.base[n], 0) || 0));
  if (!changed) return;

  const hits = Rec.all('meal').filter(r => r.payload && r.payload.fid === row.id);
  if (!hits.length) return;

  UI.confirm(
    'Update ' + hits.length + ' logged serving' + (hits.length === 1 ? '' : 's') + '?',
    'Each keeps the amount you ate and is recalculated from the corrected ' + row.name + '. Leave it and only future servings use the new numbers.',
    { yes: 'UPDATE', no: 'LEAVE THEM' }
  ).then(ok => {
    if (!ok) return;
    let n = 0;
    hits.forEach(r => {
      const m = r.payload;
      /* rebuild from the amount actually eaten, not from the stored multiple —
         the multiple was relative to the old serving size */
      const mult = (num(row.base.amt, 1) || 1) ? num(m.amt, 0) / (num(row.base.amt, 1) || 1) : (m.mult || 1);
      const sc = scale(row, mult);
      const next = Object.assign({}, m, { unit: row.base.unit, mult: mult, amt: sc.amt, price: sc.price, name: row.name });
      NUTS.forEach(k => { next[k] = sc[k]; });
      Rec.set('meal', r.date, r.key, next);
      n++;
    });
    Mobile.feedback('success');
    UI.toast('<b>' + n + '</b> serving' + (n === 1 ? '' : 's') + ' recalculated');
    draw();
  });
}

/* ── editing a logged meal ──
   Two doors, deliberately separate.

   `meal` rows freeze their numbers at the moment of logging, so editing a food
   tomorrow does not silently rewrite what you ate today. That is the right
   default and it stays. But it also meant a typo in a food's macros was
   uncorrectable: every past serving kept the wrong numbers forever.

   So: editing the SERVING changes this one row. Editing the FOOD changes the
   database entry, and then offers to push the corrected numbers back through
   every serving that used it. The offer is explicit and says how many rows it
   would touch, because rewriting history should never be a side effect. */
function mealMenu(x, d) {
  const fd = foods()[x.fid];
  UI.menu(0, 0, [
    { label: 'Edit this serving', note: 'Only this one row', icon: '✎', fn: () => mealSheet(x, d) },
    fd ? { label: 'Edit ' + fd.name, note: 'The food itself, everywhere', icon: '◈', fn: () => foodEditor(fd) } : null,
    '-',
    { label: 'Delete', kind: 'bad', icon: '⌫', fn: () => {
      const row = Object.assign({}, x); delete row.key;
      Rec.del('meal', d, x.key); mealSpend(d, x.key, null); Mobile.haptic('warn'); draw();
      UI.undo('removed <b>' + esc(x.name) + '</b>',
        () => { Rec.set('meal', d, x.key, row); mealSpend(d, x.key, row); draw(); });
    } },
  ].filter(Boolean), { title: x.name });
}

/* one logged serving: change how much, or when */
function mealSheet(x, d) {
  const fd = foods()[x.fid];
  openSheet(x.name, body => {
    body.appendChild(el('div', 'note', 'This serving only. ' +
      (fd ? 'Hold the row to edit ' + esc(fd.name) + ' itself.' : 'Its food is no longer in your list.')));

    body.appendChild(el('label', 'fl', 'Amount' + (x.unit ? ' (' + esc(x.unit) + ')' : '')));
    const amt = document.createElement('input');
    amt.className = 'num'; amt.type = 'text'; amt.inputMode = 'decimal';
    amt.setAttribute('pattern', '[0-9.]*'); amt.value = String(r1(x.amt));
    body.appendChild(amt);

    let err = num(x.err, 0) || 0, acct = x.acct || '';
    body.appendChild(el('label', 'fl', 'How sure'));
    body.appendChild(errChips(err, v => { err = v; }));

    /* The cost of THIS serving, and it had nowhere to be typed.
       Until now the only way a price moved was by rescaling: change the
       amount and the cost followed proportionally. That is right when the
       label price is right and you ate a different amount, and useless the
       rest of the time - a deal, a different shop, a restaurant that charged
       what it charged, or a food whose price was never filled in.

       Left alone it still rescales with the amount, exactly as before. Type
       in it and the number you typed is the number, because at that point you
       know something the arithmetic does not. */
    /* Protein, for the same reason as cost and more often. A label is a legal
       minimum rounded down, a butcher's chicken is not the database's chicken,
       and a scoop is whatever the scoop actually held. Correcting it is the
       single most common thing a coach does to a logged row. */
    let protTyped = false;
    body.appendChild(el('label', 'fl', 'Protein (g)'));
    const prot = numberInput(x.p != null ? r1(x.p) : '', 1, 1);
    prot.input.oninput = () => { protTyped = true; };
    body.appendChild(prot);
    body.appendChild(el('div', 'note',
      'Calories, carbs and fat still follow the amount. Correcting protein does '
      + 'not touch them, because a corrected protein is usually a better label '
      + 'reading rather than a different quantity.'));

    let costTyped = false;
    body.appendChild(el('label', 'fl', 'Cost'));
    const cost = numberInput(x.price != null ? r1(x.price) : '', 5, 1);
    cost.input.oninput = () => { costTyped = true; };
    body.appendChild(cost);
    body.appendChild(el('div', 'note',
      'Blank means it cost nothing today &mdash; food bought on another day is '
      + 'already paid for. Give it a cost AND an account and it lands on the '
      + 'money screen as well.'));

    body.appendChild(el('label', 'fl', 'Paid from'));
    body.appendChild(acctChips(acct, v => { acct = v; }));

    body.appendChild(saveBar('Save', () => {
      const v = num(amt.value);
      if (v == null || v <= 0) return UI.toast('How much?', { bad: true });
      /* rescale the frozen numbers by how much the amount moved, so the row
         stays internally consistent without going back to the food */
      const k = x.amt ? v / x.amt : 1;
      const row = Object.assign({}, x); delete row.key;
      NUTS.forEach(n => { if (row[n] != null) row[n] = row[n] * k; });
      /* Same rule as cost: a typed number is a correction, not a resize. */
      if (protTyped) {
        const g = num(prot.input.value, 0);
        if (g != null && g >= 0) row.p = g; else delete row.p;
      }
      /* A typed cost wins over the rescale: you are correcting it, not
         resizing it. An untouched one follows the amount as it always did. */
      if (costTyped) {
        const c = num(cost.input.value, 0) || 0;
        if (c > 0) row.price = c; else delete row.price;
      } else if (row.price != null) row.price = row.price * k;
      row.amt = v; row.mult = (x.mult || 1) * k;
      /* a fraction, so it survives a rescale untouched */
      row.err = err; row.acct = acct;
      Rec.set('meal', d, x.key, row);
      mealSpend(d, x.key, row);
      Mobile.feedback('success');
      closeSheet(); draw();
    }));
  });
}

/* ── one field, one sheet ── */
function fieldSheet(f, date) {
  if (f.measure === 'scale') return scaleSheet(f, date);
  if (f.measure === 'check') return toggleCheck(f, date);
  return numberSheet(f, date);
}

/* a check needs no sheet at all: tapping it is the whole interaction */
function toggleCheck(f, date) {
  const d = date || vd();
  if (logged(d, f.id)) { Rec.del('ev', d, f.id); Mobile.feedback('untick'); }
  else { evAdd(d, f.id, 1); Mobile.feedback('tick'); }
  closeSheet(); draw();
}

/* ── the doses you actually take ──
   A fixed chip list is a guess made once, by whoever wrote the library, about
   what a coffee is. It is wrong within a week: the shots you actually drink
   are 95, 160, 210, not the round 100/150/200/300 that shipped.

   So the chips are read back out of your own log: the last three distinct
   amounts, most recent first. Three because a row of six is a list to read
   rather than a target to hit, and because the fourth-most-recent dose is not
   a thing anyone reaches for.

   The library's list only stands in until you have logged three of your own,
   so a field added this morning still has something on it. After that it is
   entirely yours and it keeps following you as what you take changes.      */
const DOSE_CHIPS = 3;
function recentDoses(f) {
  const seen = Object.create(null), out = [];
  const days = Day.last(60);
  /* newest day first, and newest entry first within a day */
  for (let i = days.length - 1; i >= 0 && out.length < DOSE_CHIPS; i--) {
    const list = entries(days[i], f.id);
    for (let j = list.length - 1; j >= 0 && out.length < DOSE_CHIPS; j--) {
      /* a figure off a food label is not a dose you chose, so it is not
         offered back to you as one */
      if (list[j].food) continue;
      const v = r1(list[j].v);
      if (!v || seen[v]) continue;
      seen[v] = 1; out.push(v);
    }
  }
  (f.chips || []).forEach(v => { if (out.length < DOSE_CHIPS && !seen[v]) { seen[v] = 1; out.push(v); } });
  return out.sort((a, b) => a - b);
}

/* ── fast typing ──
   These ADD to what is in the box rather than replacing it, which is what
   makes a step count three taps instead of five digits.

   They used to be derived from the field's own step, and the arithmetic was
   right while the idea was wrong: weight steps by 0.1 and got +0.2 / +0.1,
   sleep got +1 / +0.5 / +0.1. Nobody adds a fifth of a pound to their body
   weight. A number you read off a scale is typed, not accumulated, and a row
   of buttons under it is noise on every single open.

   So a field says whether it wants them:

     `bump` on the field    exactly those, in that order — steps asks for
                            +1000 / +500 / +100
     a dose, and no bump    one button, its own step. Creatine is +5, caffeine
                            +50, water +0.5. A dose is the one thing you take
                            repeatedly in the same size, so one button covers
                            it and the rest comes off your own history below.
     anything else          none

   Which means weight and sleep get nothing, which is correct.              */
function bumpsFor(f) {
  if (f.bump && f.bump.length) return f.bump.filter(v => v > 0);
  if (f.measure === 'amount') { const b = num(f.step, 1) || 1; return b > 0 ? [b] : []; }
  return [];
}

/* numbers and doses. A dose adds up through the day; a number replaces. */
function numberSheet(f, date) {
  /* a half-life field opens with what is still in you, not just today's total */
  const d = date || vd();
  const dose = f.measure === 'amount';
  openSheet(f.label + (Day.isToday(d) ? '' : ' · ' + Day.short(d)), body => {
    /* For anything that wears off, the useful number is not what you took, it
       is what is still in you now. */
    const hl = Day.isToday(d) ? halfLine(f) : null;
    if (hl) body.appendChild(el('div', 'note', hl));
    const cur = dose ? null : value(d, f.id);
    let prev = null, prevAgo = 0;
    if (!dose) {
      const back = Day.last(30, Day.shift(d, -1));
      for (let i = back.length - 1; i >= 0; i--) {
        const v = value(back[i], f.id);
        if (v != null) { prev = v; prevAgo = Day.diff(d, back[i]); break; }
      }
    }
    const commit = v => {
      if (v == null || !isFinite(v)) return UI.toast('Type a number first', { bad: true });
      evAdd(d, f.id, v);
      Mobile.feedback(f.target && (f.dir === 'lte' ? v <= f.target : v >= f.target) ? 'success' : 'tick');
      afterLog();
    };

    /* A dose offers what you have actually been taking; everything else offers
       the list its definition carries. */
    const chips = dose ? recentDoses(f) : (f.chips || []);
    if (chips.length) {
      body.appendChild(chipRow(chips.map(v => ({ label: String(v), value: v })), commit));
    }

    /* ── blank, not filled in ──
       It used to open showing the last value logged, days old, sitting in the
       box you are about to type into. That is not a suggestion — it reads as a
       number already in the record, and pressing Save without noticing files
       last Tuesday's steps as today's. Repeating a reading should be a
       deliberate press, and it already has its own button below.           */
    const inp = numberInput(cur, f.step || 1, f.dec ? 1 : 0);
    body.appendChild(inp);

    const add = n => {
      const at = (num(inp.input.value, 0) || 0) + n;
      inp.input.value = f.dec ? String(r1(at)) : String(Math.round(at));
      inp.input.dispatchEvent(new Event('input', { bubbles: true }));
      Mobile.haptic('select');
    };
    const bumps = bumpsFor(f);
    if (bumps.length) body.appendChild(chipRow(bumps.map(v => ({ label: '+' + r1(v), value: v })), add));

    if (prev != null) {
      const p = el('button', 'btn wide quiet', 'Last ' + prev + (f.unit ? ' ' + f.unit : '') + ' · ' + (prevAgo === 1 ? 'yesterday' : prevAgo + ' days ago'));
      p.style.marginTop = 'var(--s-2)';
      p.onclick = () => commit(prev);
      body.appendChild(p);
    }
    body.appendChild(saveBar('Save', () => commit(num(inp.input.value))));

    if (dose) {
      const list = entries(d, f.id);
      if (list.length) {
        const tot = el('div', 'note', 'Today: ' + r1(value(d, f.id)) + (f.unit ? ' ' + f.unit : ''));
        body.appendChild(tot);
        list.slice().reverse().forEach(e => body.appendChild(entryRow(f, d, e)));
      }
    }
    /* The box is the point of the sheet, so the cursor starts in it. Chips no
       longer suppress that: a chip is one tap either way, and having to tap
       the field first was the slower path for everything else.             */
  }, { focus: true });
}

/* one logged entry, with the time it happened and a way to take it back */
function entryRow(f, d, e) {
  const r = el('div', 'row');
  r.innerHTML = '<span class="nm">' + r1(e.v) + (f.unit ? ' ' + esc(f.unit) : '') +
    (e.food ? '<small>' + esc(e.food) + '</small>' : '') +
    '</span><span class="fig">' + new Date(e.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '</span>';
  /* One that came off a food label has no row of its own to delete: it is the
     meal, read a different way. Removing it means removing the meal, which is
     one screen away and where you would expect to do it. */
  if (!e.food) {
    const x = el('button', 'x', '✕');
    x.onclick = () => { evDrop(d, f.id, e.t); fieldSheet(f, d); };
    r.appendChild(x);
  }
  return r;
}

function scaleSheet(f, date) {
  const d = date || vd();
  /* A scale runs 1..max, and max is whatever the field says — 3, 5, 10. The
     words are stretched over whatever range that is rather than assuming five,
     so a 1-to-3 scale reads bad / ok / great and a 1-to-10 still labels its
     ends. */
  const hi = Math.max(2, Math.min(10, f.max || 5));
  const WORDS = v => {
    const t = (v - 1) / (hi - 1);
    return t === 0 ? 'bad' : t === 1 ? 'great' : t < .34 ? 'low' : t > .66 ? 'good' : 'ok';
  };
  openSheet(f.label, body => {
    const w = el('div', 'chips');
    for (let v = 1; v <= hi; v++) {
      const b = el('button', 'chip big', v + '<small>' + WORDS(v) + '</small>');
      b.onclick = (n => () => { evAdd(d, f.id, n); Mobile.feedback('tick'); afterLog(); })(v);
      w.appendChild(b);
    }
    body.appendChild(w);
    entries(d, f.id).slice().reverse().forEach(e => body.appendChild(entryRow(f, d, e)));
  });
}

/* after any log: if that was the last outstanding once-a-day thing, say so */
function afterLog() {
  const left = outstanding().length;
  closeSheet();
  draw();
  if (!left) { Mobile.feedback('complete'); UI.toast('Day complete'); }
}

/* ══════════════ SPENDING ══════════════
   Amount, account, details. The time fills itself in unless you change it. */

function spendSheet(existing) {
  openSheet(existing ? 'Edit spend' : 'Spend', body => {
    let shotId = existing ? existing.shot : null;
    let acct = existing ? existing.acct : S.get('lastAcct', (accts()[0] || {}).name || 'Cash');
    const when = new Date(existing ? existing.t : Date.now());

    const amt = numberInput(existing ? existing.amt : null, 50, 1);
    body.appendChild(el('label', 'fl', 'Amount'));
    body.appendChild(amt);

    body.appendChild(el('label', 'fl', 'Account'));
    const aw = el('div', 'chips');
    const paint = () => {
      aw.innerHTML = '';
      accts().forEach(a => {
        const b = el('button', 'chip' + (a.name === acct ? ' on' : ''), esc(a.name));
        b.onclick = () => { acct = a.name; paint(); };
        aw.appendChild(b);
      });
    };
    paint();
    body.appendChild(aw);

    body.appendChild(el('label', 'fl', 'Details'));
    const note = document.createElement('input');
    note.type = 'text'; note.placeholder = 'What for';
    note.value = existing ? (existing.note || '') : '';
    body.appendChild(note);

    body.appendChild(el('label', 'fl', 'Time'));
    const tm = document.createElement('input');
    tm.type = 'time';                    /* the phone's own time wheel, colon included */
    tm.value = String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0');
    body.appendChild(tm);

    body.appendChild(el('label', 'fl', 'Receipt'));
    photoBlock(body, 'receipt', txt => {
      const g = parseReceipt(txt);
      if (g.amt != null) amt.input.value = String(g.amt);
      if (g.note && !note.value) note.value = g.note;
    }, id => { shotId = id; });

    body.appendChild(saveBar(existing ? 'Update' : 'Save', () => {
      const v = num(amt.input.value);
      if (v == null || v <= 0) return UI.toast('How much?', { bad: true });
      const parts = String(tm.value).split(':');
      const dt = new Date(when);
      if (parts.length === 2) dt.setHours(num(parts[0], 0) || 0, num(parts[1], 0) || 0, 0, 0);
      const row = { amt: v, acct: acct, note: note.value.trim(), t: dt.getTime(), shot: shotId };
      Rec.set('spend', existing ? existing.date : vd(), existing ? existing.key : uid(), row);
      S.set('lastAcct', acct);
      Mobile.feedback('tick');
      closeSheet(); draw();
    }));
  }, { focus: !existing });
}
</script>

<script>
/* ══════════════ FOOD ══════════════ */

function foodPicker() {
  openSheet('Food', body => {
    const q = document.createElement('input');
    q.type = 'search'; q.placeholder = 'Search foods';
    body.appendChild(q);

    const list = el('div');
    list.style.marginTop = '9px';
    const paint = () => {
      const term = q.value.trim().toLowerCase();
      const all = Object.values(foods())
        .filter(f => !term || (f.name + ' ' + (f.brand || '')).toLowerCase().indexOf(term) > -1)
        .sort((a, b) => (b.uses || 0) - (a.uses || 0) || String(a.name).localeCompare(String(b.name)));
      list.innerHTML = '';
      if (!all.length) {
        list.appendChild(el('div', 'empty', Object.keys(foods()).length
          ? 'Nothing matches, so try fewer letters or add it as a new food.'
          : 'Photograph a nutrition panel or type one in, and logging it after that is two taps.'));
      }
      all.slice(0, 40).forEach(f => {
        const r = el('div', 'row tap');
        r.innerHTML = '<span class="nm">' + esc(f.name) +
          '<small>' + esc(f.brand || '') + (f.brand ? ' · ' : '') + r1(num(f.base.amt, 0)) + ' ' + esc(f.base.unit || '') + ' · ' +
          Math.round(num(f.base.kcal, 0)) + ' kcal · ' + r1(num(f.base.p, 0)) + 'p</small></span>';
        r.onclick = () => amountSheet(f);
        const e = el('button', 'x', '✎');
        e.onclick = ev => { ev.stopPropagation(); foodEditor(f); };
        r.appendChild(e);
        list.appendChild(r);
      });
    };
    q.oninput = paint; paint();
    body.appendChild(list);

    const add = el('button', 'btn go wide', 'New food');
    add.style.cssText = 'margin-top:var(--s-2);min-height:var(--tap)';
    add.onclick = () => foodEditor(null);
    body.appendChild(add);
  });
}

/* Which account it came out of. Blank is a real answer and the default: most
   food was paid for on some other day. */
function acctChips(cur, onPick) {
  const w = el('div', 'chips');
  const paint = () => {
    w.innerHTML = '';
    [{ name: '', label: 'Not now' }].concat(accts()).forEach(a => {
      const b = el('button', 'chip' + (cur === a.name ? ' on' : ''), esc(a.label || a.name));
      b.onclick = () => { cur = a.name; onPick(cur); paint(); Mobile.haptic('select'); };
      w.appendChild(b);
    });
  };
  paint();
  return w;
}

/* how much of it — servings, straight units, or "however much hits 50g protein" */
function amountSheet(fd) {
  openSheet(fd.name, body => {
    const serves = foodServes(fd);
    let mode = 'serve', si = Math.min(fd.dflt || 0, serves.length - 1), mult = serves[si].mult;

    const seg = el('div', 'seg');
    const out = el('div');
    const preview = el('div');

    const setMult = m => { mult = m > 0 ? m : 0; paintPreview(); };

    function paintPreview() {
      const s = scale(fd, mult);
      preview.innerHTML =
        '<div class="row" style="margin-top:var(--s-2)"><span class="nm">' + r1(s.amt) + ' ' + esc(fd.base.unit || '') +
        '<small>' + r1(mult) + ' × the label serving</small></span>' +
        '<span class="fig">' + Math.round(s.kcal) + ' kcal<br>' + r1(s.p) + 'p · ' + r1(s.c) + 'c · ' + r1(s.f) + 'f</span></div>' +
        (s.price ? '<div class="note">Costs ' + money(s.price) + ', which lands on the money screen too.</div>' : '');
    }

    function paintMode() {
      seg.innerHTML = '';
      [['serve', 'Servings'], ['unit', fd.base.unit || 'Units'], ['hit', 'To hit']].forEach(m => {
        const b = el('button', mode === m[0] ? 'on' : '', m[1]);
        b.onclick = () => { mode = m[0]; paintMode(); };
        seg.appendChild(b);
      });
      out.innerHTML = '';

      if (mode === 'serve') {
        const cw = el('div', 'chips');
        serves.forEach((s, i) => {
          const b = el('button', 'chip' + (i === si ? ' on' : ''), esc(s.label));
          b.onclick = () => { si = i; setMult(s.mult * (num(qty.input.value, 1) || 1)); paintMode(); };
          cw.appendChild(b);
        });
        out.appendChild(cw);
        var qty = numberInput(r1(mult / serves[si].mult), .5, 1);
        qty.input.oninput = () => setMult(serves[si].mult * (num(qty.input.value, 0) || 0));
        out.appendChild(el('label', 'fl', 'How many'));
        out.appendChild(qty);
      } else if (mode === 'unit') {
        const a = numberInput(r1(mult * num(fd.base.amt, 0)), Math.max(1, Math.round(num(fd.base.amt, 100) / 10)), 1);
        a.input.oninput = () => setMult((num(a.input.value, 0) || 0) / (num(fd.base.amt, 1) || 1));
        out.appendChild(el('label', 'fl', 'How much, in ' + (fd.base.unit || 'units')));
        out.appendChild(a);
        out.appendChild(chipRow([50, 100, 150, 200, 250, 500].map(v => ({ label: String(v), value: v })), v => {
          a.input.value = String(v); setMult(v / (num(fd.base.amt, 1) || 1));
        }));
      } else {
        let key = 'p';
        const kw = el('div', 'chips');
        [['p', 'Protein g'], ['kcal', 'Calories']].forEach(k => {
          const b = el('button', 'chip' + (key === k[0] ? ' on' : ''), k[1]);
          b.onclick = () => { key = k[0]; paintMode(); };
          kw.appendChild(b);
        });
        out.appendChild(el('label', 'fl', 'Hit this much'));
        out.appendChild(kw);
        const per = num(fd.base[key], 0) || 0;
        if (per <= 0) {
          out.appendChild(el('div', 'warnbox', 'This food has no ' + (key === 'p' ? 'protein' : 'calorie') + ' figure on its label, so there is nothing to solve for. Edit the food and add it.'));
        } else {
          const t = numberInput(key === 'p' ? 50 : 500, key === 'p' ? 5 : 50, 0);
          t.input.oninput = () => setMult((num(t.input.value, 0) || 0) / per);
          out.appendChild(t);
          setMult((num(t.input.value, 0) || 0) / per);
        }
      }
      paintPreview();
    }

    body.appendChild(seg);
    body.appendChild(out);
    body.appendChild(preview);
    paintMode();

    let err = 0, acct = '';
    body.appendChild(el('label', 'fl', 'How sure'));
    body.appendChild(errChips(err, v => { err = v; }));

    /* Only where there is a price to pay. Blank means the food was already
       bought, which is the normal case for anything in your own kitchen. */
    if (num(fd.base.price, 0)) {
      body.appendChild(el('label', 'fl', 'Paid from, if you paid just now'));
      body.appendChild(acctChips('', v => { acct = v; }));
    }

    body.appendChild(saveBar('Log it', () => {
      if (!mult || mult <= 0) return UI.toast('How much?', { bad: true });
      logMeal(fd, mult, mode === 'serve' ? serves[si].label : (mode === 'unit' ? r1(mult * num(fd.base.amt, 0)) + ' ' + (fd.base.unit || '') : 'to target'),
        { err: err, acct: acct });
      Mobile.feedback('tick');
      closeSheet(); draw();
    }));
  });
}

/* the food itself: the label as printed, then your own servings on top */
function foodEditor(fd) {
  const isNew = !fd;
  const f = fd ? JSON.parse(JSON.stringify(fd)) : { id: uid(), name: '', brand: '', base: { amt: 100, unit: 'g' }, serves: [], uses: 0 };
  openSheet(isNew ? 'New food' : 'Edit food', body => {
    const inputs = {};
    let shotId = f.shot || null;

    photoBlock(body, 'label', txt => {
      const g = parseLabel(txt);
      Object.keys(g).forEach(k => { if (g[k] != null && inputs[k]) inputs[k].value = String(g[k]); });
      UI.toast('Check every number');
    }, id => { shotId = id; });

    const TEXTY = { name: 1, brand: 1, unit: 1, cat: 1 };
    const groups = [];
    Object.values(foods()).forEach(x => { if (x.cat && groups.indexOf(x.cat) < 0) groups.push(x.cat); });
    const mk = (key, label, val, wide) => {
      const w = el('div', 'field');
      w.appendChild(el('label', 'fl', label));
      const i = document.createElement('input');
      i.type = 'text';
      if (!TEXTY[key]) { i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*'); }
      if (key === 'cat' && groups.length) {          /* pick a group you already use, or type a new one */
        const dl = document.createElement('datalist');
        dl.id = 'grp-' + f.id;
        groups.forEach(gname => { const o = document.createElement('option'); o.value = gname; dl.appendChild(o); });
        w.appendChild(dl);
        i.setAttribute('list', dl.id);
      }
      i.value = val == null ? '' : String(val);
      inputs[key] = i; w.appendChild(i);
      if (wide) w.style.gridColumn = '1 / -1';
      return w;
    };

    body.appendChild(mk('name', 'Name', f.name, 1));
    const g1 = el('div', 'grid2');
    g1.appendChild(mk('brand', 'Brand or place', f.brand));
    g1.appendChild(mk('cat', 'Group', f.cat));
    body.appendChild(g1);

    body.appendChild(el('label', 'fl', 'One serving, as printed on the label'));
    const g2 = el('div', 'grid2');
    g2.appendChild(mk('amt', 'Amount', f.base.amt));
    g2.appendChild(mk('unit', 'Unit', f.base.unit));
    body.appendChild(g2);

    const g3 = el('div', 'grid3');
    g3.appendChild(mk('kcal', 'Calories', f.base.kcal));
    g3.appendChild(mk('p', 'Protein g', f.base.p));
    g3.appendChild(mk('c', 'Carbs g', f.base.c));
    g3.appendChild(mk('f', 'Fat g', f.base.f));
    g3.appendChild(mk('na', 'Sodium mg', f.base.na));
    g3.appendChild(mk('k', 'Potassium mg', f.base.k));
    g3.appendChild(mk('caff', 'Caffeine mg', f.base.caff));
    g3.appendChild(mk('price', 'Price ₱', f.base.price));
    body.appendChild(g3);

    const calc = el('button', 'btn wide quiet', 'Work calories out from the macros');
    calc.style.marginTop = '8px';
    calc.onclick = () => {
      const k = (num(inputs.p.value, 0) || 0) * 4 + (num(inputs.c.value, 0) || 0) * 4 + (num(inputs.f.value, 0) || 0) * 9;
      inputs.kcal.value = String(Math.round(k));
      UI.toast('Calories worked out from the macros');
    };
    body.appendChild(calc);

    /* your servings — the whole point. A Cobra bottle is 1.3 label servings. */
    body.appendChild(el('label', 'fl', 'Your servings'));
    body.appendChild(el('div', 'note', 'How you actually eat it. A whole bottle, a scoop, a pack.'));
    const sw = el('div');
    const paintServes = () => {
      sw.innerHTML = '';
      (f.serves || []).forEach((s, i) => {
        const baseAmt = num(inputs.amt.value, num(f.base.amt, 1)) || 1;
        const r = el('div', 'row');
        r.innerHTML = '<span class="nm">' + esc(s.label) + '<small>' + r1(s.mult * baseAmt) + ' ' + esc(inputs.unit.value || f.base.unit || '') +
          ' · ' + r1(s.mult) + ' × label</small></span>';
        const x = el('button', 'x', '✕');
        x.onclick = () => { f.serves.splice(i, 1); paintServes(); };
        r.appendChild(x);
        sw.appendChild(r);
      });
      const add = el('div', 'grid2');
      const nm = document.createElement('input'); nm.type = 'text'; nm.placeholder = 'Bottle';
      const am = document.createElement('input'); am.type = 'text'; am.inputMode = 'decimal'; am.placeholder = 'how much, e.g. 330';
      add.appendChild(nm); add.appendChild(am);
      sw.appendChild(add);
      const ab = el('button', 'btn wide', 'Add serving');
      ab.style.marginTop = '7px';
      ab.onclick = () => {
        const baseAmt = num(inputs.amt.value, 0);
        const a = num(am.value);
        if (!nm.value.trim() || a == null || !baseAmt) return UI.toast('Needs a name and an amount', { bad: true });
        f.serves = (f.serves || []).concat([{ label: nm.value.trim(), mult: a / baseAmt }]);
        paintServes();
      };
      sw.appendChild(ab);
    };
    paintServes();
    body.appendChild(sw);

    body.appendChild(saveBar(isNew ? 'Save' : 'Update', () => {
      const name = inputs.name.value.trim();
      if (!name) return UI.toast('It needs a name', { bad: true });
      const base = { amt: num(inputs.amt.value, 1) || 1, unit: inputs.unit.value.trim() || 'serving' };
      NUTS.concat(['price']).forEach(n => { const v = num(inputs[n].value); if (v != null) base[n] = v; });
      const row = { id: f.id, name: name, brand: inputs.brand.value.trim(), cat: inputs.cat.value.trim(),
        base: base, serves: f.serves || [], dflt: f.dflt || 0, uses: f.uses || 0, shot: shotId };
      Rec.set('food', null, f.id, row);
      Mobile.feedback('select');
      /* Straight on to how much, swapping this sheet's contents. Closing
         first and reopening would race the shared sheet's history unwind. */
      if (isNew) { amountSheet(row); }
      else { closeSheet(); recost(row, fd); draw(); }
    }));

    if (!isNew) {
      const del = el('button', 'btn wide quiet', 'Delete this food');
      del.style.marginTop = '8px';
      del.onclick = () => UI.confirm('Delete ' + f.name + '?', 'Meals you already logged keep the numbers they were saved with.')
        .then(ok => { if (ok) { Rec.del('food', null, f.id); closeSheet(); draw(); } });
      body.appendChild(del);
    }
  });
}
</script>

<script>
/* ══════════════ THE SCREENS ══════════════ */

let TAB = 'now';
/* Backfill is normal, not an exception. VIEW is the day being looked at;
   null means today. The future is not a record and cannot be reached. */
let VIEW = null;
const vd = () => VIEW || Day.today();
function shiftView(n) {
  const d = Day.shift(vd(), n);
  if (!Day.editable(d)) return UI.toast('The future is not a record');
  VIEW = d === Day.today() ? null : d;
  Mobile.feedback('nav');
  draw();
}
function dateBar() {
  const w = el('div', 'seg');
  const back = el('button', null, '‹');
  const mid = el('button', VIEW ? 'on' : '', VIEW ? Day.short(vd()) + ' · back to today' : 'Today');
  const fwd = el('button', null, '›');
  back.onclick = () => shiftView(-1);
  fwd.onclick = () => shiftView(1);
  mid.onclick = () => { VIEW = null; draw(); };
  w.appendChild(back); w.appendChild(mid); w.appendChild(fwd);
  return w;
}
const NAV = [['now', '◐', 'Today'], ['food', '◍', 'Food'], ['money', '₱', 'Money'], ['trends', '◭', 'Trends']];

function drawNav() {
  const n = document.getElementById('nav');
  n.innerHTML = '';
  NAV.forEach(t => {
    const b = el('button', TAB === t[0] ? 'on' : '', '<span class="g">' + t[1] + '</span>' + t[2]);
    b.onclick = () => {
      if (TAB === t[0]) return;
      /* Trends has no date bar, so a backdated view would be stranded there
         with no way to see it or clear it. Coming back should be today. */
      if (t[0] === 'trends') VIEW = null;
      TAB = t[0]; Mobile.feedback('nav'); draw();
    };
    n.appendChild(b);
  });
}

function card(title, sub) {
  const c = el('div', 'card');
  if (title) c.appendChild(el('h2', null, esc(title) + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '')));
  return c;
}

function tile(label, val, unit, cls, onclick, pct, sub) {
  const t = el('button', 'tile ' + (cls || ''));
  t.innerHTML = '<div class="vl">' + (val == null ? '–' : esc(val)) +
    (unit ? '<span class="un">' + esc(unit) + '</span>' : '') + '</div>' +
    '<div class="lb">' + esc(label) + (sub ? '<i>' + esc(sub) + '</i>' : '') + '</div>';
  if (pct != null) {
    const bar = el('div', 'bar');
    bar.innerHTML = '<i style="width:' + Math.min(100, Math.round(pct * 100)) + '%"></i>';
    t.appendChild(bar);
  }
  if (onclick) t.onclick = onclick;
  return t;
}

/* how a field's value reads on its tile */
function halfLine(f) {
  if (!f.half) return null;
  const now = remaining(f);
  if (now == null || now < 1) return null;
  const gone = clearsAt(f, Math.max(1, (f.target || 0) * .25 || 25));
  return Math.round(now) + (f.unit || '') + ' still in you' +
    (gone ? ', down to a trace by ' + new Date(gone).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '');
}

function tileValue(f, v) {
  if (v == null) return f.measure === 'check' ? '·' : '–';
  if (f.measure === 'check') return '✓';
  if (f.measure === 'scale') return r1(v);
  if (f.dec) return r1(v);
  return Math.round(v).toLocaleString();
}

/* ── NOW ── */
function drawNow(m) {
  const d = vd();

  const t = dayTotals(d), ct = calTarget();
  /* No heading and no date. The date bar sits directly above this card and
     already says which day is on screen; repeating it underneath was one line
     of chrome saying nothing the eye had not just read. */
  const c = card();

  const left = ct.v - Math.round(t.kcal);
  const hero = el('div', 'hero', left.toLocaleString() + '<span class="u">calories left of ' + ct.v.toLocaleString() + '</span>');
  hero.style.marginBottom = 'var(--s-4)';
  if (left < 0) hero.style.color = 'var(--warn)';
  c.appendChild(hero);

  const g = el('div', 'tiles');
  liveFields().filter(f => dueToday(f, d)).forEach(f => {
    const v = value(d, f.id);
    let cls = v == null ? 'todo' : '';
    let pct = null;
    if (f.target && v != null) {
      pct = v / f.target;
      if (f.dir === 'lte' && v > f.target) cls += ' over';
    }
    /* An edge outranks a target: being outside one is the thing to notice,
       whether or not you also hit what you were aiming at. */
    if (v != null && ((f.min != null && v < f.min) || (f.max != null && v > f.max))) cls += ' over';
    /* a decaying field says what is still in you under its label, because the
       total you took today stops being the interesting number by mid-afternoon */
    const left = (f.half && Day.isToday(d)) ? remaining(f) : null;
    g.appendChild(tile(f.label, tileValue(f, v), f.unit, cls, () => fieldSheet(f, d), pct,
      left != null && left >= 1 ? Math.round(left) + (f.unit || '') + ' left' : null));
  });
  g.appendChild(tile('Protein', Math.round(t.p) + '/' + Math.round(TARGETS().p), 'g', t.p ? '' : 'todo', () => { TAB = 'food'; draw(); }, t.p / TARGETS().p));
  g.appendChild(tile('Spent', Math.round(dayMoney(d)).toLocaleString(), '₱', dayMoney(d) ? '' : 'todo', () => { TAB = 'money'; draw(); }));
  c.appendChild(g);

  m.appendChild(c);

  /* "Through the day" used to repeat every multi-entry field underneath the
     tiles, with its running total on the right — the same number the tile
     already shows. The individual readings are still one tap away, in the
     field's own sheet, which is where you go to add one anyway. */
  seamButton(m);
  drawJournal(m);
}

/* ── the add button, in the seam ──
   Sitting in the gap between two cards rather than floating over the corner of
   one. It overlaps both, which is what makes the gap read as a seam the button
   belongs to rather than a button dropped on top of a card.

   The trade, stated plainly: it scrolls with the page instead of being pinned,
   so on a screen long enough to scroll it can leave the view. Today, Food and
   Money all fit, so it does not — but a screen that grows would need it back
   on the glass. */
function seamButton(m) {
  const w = el('div', 'seam');
  const b = el('button', 'fab mb-press mb-tap');
  b.setAttribute('aria-label', 'Add');
  b.textContent = '+';
  /* exactly the list at the top of the sheet, so the badge is a promise the
     sheet keeps */
  if (outstanding().length) b.className += ' dot';
  b.onclick = () => { Mobile.feedback('open'); fastInput(); };
  w.appendChild(b);
  m.appendChild(w);
}

/* ── FOOD ── */
/* ── the journal, on the main screen ──
   Paragraph or bullets, chosen per day rather than globally: some days are one
   piece of writing and some are a list, and having to pick once for all time
   makes one of those days awkward forever. */
function drawJournal(m) {
  const d = vd();
  const list = notes(d).filter(x => x.kind !== 'para');

  /* No prose in this card at all. The four buttons sit on the heading line and
     say what they do by being pressed; an empty journal that explains itself
     is a journal that has decided you cannot read. */
  const c = card('Journal');
  const head = c.querySelector('h2');
  if (head) {
    const row = el('div', 'jbtns');
    NOTE_KINDS.forEach(k => {
      const b = el('button', 'jb mb-press mb-tap', noteSvg(k.id));
      b.setAttribute('aria-label', k.label);
      b.title = k.label;
      b.onclick = () => noteSheet({ kind: k.id, text: '' }, d);
      row.appendChild(b);
    });
    head.appendChild(row);
  }

  const wrap = el('div', 'list');
  list.forEach((x, i) => {
    const r = el('div', 'note-row' + (x.done ? ' done' : '') + (x.cancelled ? ' cancelled' : ''));
    /* ── two targets, two meanings ──
       The line used to do one thing: tapping anywhere ticked it, and the only
       way to fix a typo was to hold. That is backwards. A written line is text
       first, so tapping the words puts the cursor in them; ticking is what the
       box is for, and the box is the thing that looks like a control.

       It is also what every list app already does, which means it needs no
       explaining. */
    r.innerHTML = '<button class="k" type="button"></button>' +
      '<span class="tx">' + esc(x.text) +
      /* The time you typed, given back in the shape you typed it. It sits
         after the words rather than before them because the words are what
         you scan for; the clock is the detail. */
      (x.at ? '<i class="at">' + esc(clockLabel(x.at)) + (x.dur ? ' \u00b7 ' + durLabel(x.dur) : '') + '</i>'
            : (x.dur ? '<i class="at">' + durLabel(x.dur) + '</i>' : '')) +
      /* how long it has been following you — quiet, but it should sting a bit */
      (x.carried ? '<i class="carried">' + x.carried + 'd</i>' : '') + '</span>';
    const box = r.querySelector('.k');
    box.innerHTML = noteSvg(x.kind, x.carried);
    box.setAttribute('aria-label', x.kind === 'todo' ? (x.done ? 'Untick' : 'Tick') : noteKind(x.kind).label);
    if (x.kind === 'todo') {
      box.onclick = e => {
        e.stopPropagation();
        /* write to the row's own date, not the one being looked at — a carried
           task is the original seen from later, not a copy */
        const own = x.date || d;
        Rec.set('note', own, x.key, Object.assign(bare(x), { done: x.done ? 0 : 1 }));
        Mobile.feedback(x.done ? 'untick' : 'tick');
        publishNotes(own); draw();
      };
    } else {
      box.tabIndex = -1;
      box.style.cursor = 'inherit';
    }
    r.onclick = () => noteSheet(x, x.date || d);
    Mobile.hold(r, () => noteMenu(x, d, i, list.length));
    wrap.appendChild(r);
  });
  c.appendChild(wrap);
  m.appendChild(c);
}

/* write or edit one line */
function noteSheet(x, d) {
  const isNew = !x.key;
  /* Reusing a sheet that is already up needs no wait; opening a new one has to
     let it finish rising or the focus lands mid-animation and the keyboard
     fights the transform. */
  const reopening = !!sheetH;
  openSheet(noteKind(x.kind).label, body => {
    const seg = el('div', 'seg');
    let kind = x.kind;
    NOTE_KINDS.forEach(k => {
      const b = el('button', kind === k.id ? 'on' : '', noteSvg(k.id) + '<span>' + k.label + '</span>');
      b.setAttribute('aria-label', k.label);
      b.onclick = () => { kind = k.id; [].forEach.call(seg.children, n => n.className = ''); b.className = 'on'; };
      seg.appendChild(b);
    });
    body.appendChild(seg);

    const ta = document.createElement('textarea');
    /* An entry is prose and wants room; the others are a line. */
    ta.rows = x.kind === 'entry' ? 6 : 3;
    ta.value = x.text || '';
    ta.placeholder = '';
    ta.setAttribute('autocapitalize', 'sentences');
    body.appendChild(ta);

    /* `again` reopens an empty line of the same kind instead of closing, which
       is what makes a list a list. */
    const commit = again => {
      const text = ta.value.trim();
      if (!text) return UI.toast('Nothing to save', { bad: true });
      if (isNew) addNote(d, kind, text);
      else {
        const pz = parseLine(text);
        Rec.set('note', x.date || d, x.key, Object.assign(bare(x), {
          kind: kind, text: pz.text, at: pz.at, dur: pz.dur,
        }));
      }
      publishNotes(d);
      Mobile.feedback(again ? 'tick' : 'success');
      if (again) { draw(); noteSheet({ kind: kind, text: '' }, d); return; }
      closeSheet(); draw();
    };

    /* ── Enter carries on the list ──
       A bullet is one line, so Return has nothing useful to do inside the box:
       it makes an invisible second line in a field three rows tall. Writing
       five todos meant Add, tap the todo button, type, Add, tap, type. Now it
       is type, Enter, type, Enter — which is how every outliner and every
       paper bullet journal already behaves.

       An Entry is the exception and keeps Return as a newline, because an
       entry is prose and genuinely has paragraphs. Shift+Enter forces a
       newline anywhere, and an empty line closes the sheet — that is the
       gesture for "done making these".                                     */
    ta.onkeydown = e => {
      if (e.key !== 'Enter' || e.shiftKey || e.altKey || kind === 'entry') return;
      /* mid-composition on an IME, Enter is choosing a candidate, not a line */
      if (e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      if (!ta.value.trim()) { closeSheet(); draw(); return; }
      commit(true);
    };

    body.appendChild(saveBar(isNew ? 'Add' : 'Save', () => commit(false)));

    /* ── the cursor starts in the box ──
       This used to look the textarea up as `#sheet textarea`. Nothing on the
       page has that id — it only ever existed as a CSS selector — so the
       lookup matched nothing, hit its own `if (!t) return`, and quietly did
       nothing at all. Every note sheet opened with no cursor in it.

       That also made Enter look broken, which it was not: the key is bound to
       this textarea, and a box that never receives focus never sees a
       keystroke. One missing element, two symptoms.

       Held onto directly now rather than searched for. Focus alone drops the
       caret wherever the platform feels like, so it goes after the last
       character, which is what "carry on writing" means. */
    setTimeout(() => {
      ta.focus();
      try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
    }, reopening ? 40 : 380);
  });
}

function noteMenu(x, d, i, n) {
  const manual = S.get('noteSort', 'manual') === 'manual';
  const own = x.date || d;
  const isTask = x.kind === 'todo';
  const save = patch => {
    Rec.set('note', own, x.key, Object.assign(bare(x), patch));
    Mobile.feedback('select'); publishNotes(own); draw();
  };
  UI.menu(0, 0, [
    { label: 'Edit', icon: '✎', fn: () => noteSheet(x, own) },
    /* Cancelled is not deleted. A task you decided not to do is a real
       outcome and worth keeping — deleting it pretends you never planned it,
       which is the one thing a log should never do. */
    isTask && !x.cancelled ? { label: 'Cancel it', note: 'Kept, but stops following you', icon: '⊘',
      fn: () => save({ cancelled: 1, done: 0 }) } : null,
    isTask && x.cancelled ? { label: 'Put it back', icon: '↺', fn: () => save({ cancelled: 0 }) } : null,
    manual && i > 0 ? { label: 'Move up', icon: '↑', fn: () => moveNote(d, x, -1) } : null,
    manual && i < n - 1 ? { label: 'Move down', icon: '↓', fn: () => moveNote(d, x, 1) } : null,
    '-',
    { label: 'Delete', kind: 'bad', icon: '⌫', fn: () => {
      const keep = bare(x);
      Rec.del('note', own, x.key); Mobile.haptic('warn'); publishNotes(own); draw();
      UI.undo('removed the line', () => { Rec.set('note', own, x.key, keep); publishNotes(own); draw(); });
    } },
  ].filter(Boolean), { title: noteKind(x.kind).label });
}

function moveNote(d, x, dir) {
  const list = notes(d).filter(y => y.kind !== 'para');
  const i = list.findIndex(y => y.key === x.key), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  list.forEach((y, n) => Rec.set('note', y.date || d, y.key, Object.assign(bare(y), { ord: n })));
  Mobile.feedback('select');
  draw();
}


function drawFood(m) {
  const d = vd(), t = dayTotals(d), tg = TARGETS(), ct = calTarget();

  const c = card('Food', Math.round(t.kcal).toLocaleString() + ' kcal');
  const left = ct.v - Math.round(t.kcal);
  const hero = el('div', 'hero', left.toLocaleString() + '<span class="u">kcal left</span>');
  hero.style.marginBottom = 'var(--s-4)';
  if (left < 0) hero.style.color = 'var(--warn)';
  c.appendChild(hero);

  /* Every macro gets a bar. A targeted one fills toward its target. An
     untargeted one fills by its share of the calories you actually ate — 4
     kcal a gram for protein and carbohydrate, 9 for fat — so it still shows
     the shape of the day without inventing a goal you never set. It is drawn
     faded and reads "31% of intake" rather than "x / y", because it is a
     description of what happened, not progress toward anything. */
  const on = S.get('macroOn', { p: 1, c: 1, f: 1 });
  const KCALG = { p: 4, c: 4, f: 9 };
  [['kcal', 'Calories', ct.v, 'k1', 'lte'], ['p', 'Protein', tg.p, 'k2', 'gte'],
   ['c', 'Carbs', tg.c, 'k3', 'lte'], ['f', 'Fat', tg.f, 'k4', 'lte']]
   .forEach(row => {
    const key = row[0], v = t[key] || 0;
    const targeted = key === 'kcal' || on[key];
    const w = el('div', 'macro ' + row[3] + (targeted ? '' : ' untargeted'));
    if (targeted) {
      const lim = row[2] || 0, pct = lim ? v / lim : 0;
      const over = row[4] === 'lte' && v > lim;
      if (over) w.className += ' over';
      /* the band on calories only, because that is the one it changes a
         decision about — the macros inherit the same doubt and saying so four
         times is noise */
      const band = (key === 'kcal' && t.kerr >= 25) ? ' ±' + Math.round(t.kerr) : '';
      w.innerHTML = '<div class="top"><b>' + row[1] + '</b><span class="n">' + Math.round(v) + band + ' / ' + Math.round(lim) + '</span></div>' +
        '<div class="track"><i style="width:' + Math.min(100, Math.round(pct * 100)) + '%"></i></div>';
    } else {
      const share = t.kcal > 0 ? (v * KCALG[key]) / t.kcal : 0;
      w.innerHTML = '<div class="top"><b>' + row[1] + '</b><span class="n derived-tag">' +
        Math.round(v) + 'g · ' + Math.round(share * 100) + '% of intake</span></div>' +
        '<div class="track"><i style="width:' + Math.min(100, Math.round(share * 100)) + '%"></i></div>';
    }
    c.appendChild(w);
  });
  const bits = [];
  if (on.p) bits.push(Math.max(0, Math.round(tg.p - t.p)) + 'g protein to go');
  bits.push(Math.round(t.na) + 'mg sodium', Math.round(t.k) + 'mg potassium');
  if (ct.src === 'tdee') bits.push('target from measured TDEE');
  if (ct.src === 'macros') bits.push('calories from macros');
  c.appendChild(el('div', 'note', bits.join(' · ')));
  m.appendChild(c);
  seamButton(m);

  const list = meals(d);
  const c2 = card('Logged', list.length ? money(t.price) : '');
  if (!list.length) c2.appendChild(el('div', 'empty', 'Nothing yet.'));
  list.forEach(x => {
    const r = el('div', 'row tap');
    const marks = [esc(x.serve || ''), r1(x.amt) + ' ' + esc(x.unit || '')]
      .concat(errTag(x.err) ? [errTag(x.err)] : []).concat(x.acct ? [esc(x.acct)] : []);
    r.innerHTML = '<span class="nm">' + esc(x.name) + '<small>' + marks.filter(Boolean).join(' · ') + '</small></span>' +
      '<span class="fig">' + Math.round(x.kcal) + '<small>' + r1(x.p) + 'g protein</small></span>';
    const del = el('button', 'x', '✕');
    del.onclick = e => {
      e.stopPropagation();
      const row = Object.assign({}, x); delete row.key;
      Rec.del('meal', d, x.key); mealSpend(d, x.key, null); Mobile.feedback('untick'); draw();
      UI.undo('removed <b>' + esc(x.name) + '</b>',
        () => { Rec.set('meal', d, x.key, row); mealSpend(d, x.key, row); draw(); });
    };
    r.appendChild(del);
    /* Tap edits this serving. Hold asks the wider question — because "change
       what I ate" and "change what this food is" are genuinely different, and
       one of them rewrites history. */
    r.onclick = () => mealSheet(x, d);
    Mobile.hold(r, () => mealMenu(x, d), { skip: '.x' });
    c2.appendChild(r);
  });
  const b = el('button', 'btn go wide', 'Log food');
  b.style.marginTop = 'var(--s-2)';
  b.onclick = foodPicker;
  c2.appendChild(b);
  /* Quieter on purpose: a one-off leaves nothing behind to log again, so it is
     the wrong default. It is here for a restaurant meal you will never eat
     twice, where adding it to the database is just litter. */
  const one = el('button', 'btn wide quiet', 'One-off');
  one.style.marginTop = 'var(--s-2)';
  one.onclick = oneOffSheet;
  c2.appendChild(one);
  m.appendChild(c2);
}
