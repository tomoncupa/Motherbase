   press that travels first was a scroll, so it is let go.

   Both surfaces, one path: pointer events cover the thumb and the mouse
   without either needing its own version. Right-click is deliberately NOT
   wired to this — you cannot drag with a button you are holding for a menu.

   The click that follows a drag is swallowed. Without that, putting a tile
   down also opens the sheet behind it. */
function makeTilesSortable(g, commit) {
  let wait = null, drag = null, dropped = false;

  const stop = () => { if (wait) { clearTimeout(wait.timer); wait = null; } };
  const end = () => {
    stop();
    if (!drag) return;
    drag.t.classList.remove('lifted');
    g.classList.remove('sorting');
    const moved = drag.moved;
    drag = null;
    if (!moved) return;
    dropped = true;
    Mobile.feedback('select');
    commit([...g.children].map(n => n.dataset.tile).filter(Boolean));
  };

  g.addEventListener('pointerdown', e => {
    const t = e.target.closest('.tile');
    if (!t || !t.dataset.tile) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    wait = { t: t, id: e.pointerId, x: e.clientX, y: e.clientY, timer: setTimeout(() => {
      if (!wait) return;
      drag = { t: wait.t, id: wait.id, moved: false };
      wait = null;
      drag.t.classList.add('lifted');
      g.classList.add('sorting');
      Mobile.haptic('heavy');
    }, 450) };
  });

  /* On the window, not the grid: a finger that leaves the tile it started on
     still owns the gesture, and letting go outside the island must still put
     the tile down rather than leave it stuck up. */
  addEventListener('pointermove', e => {
    if (wait && e.pointerId === wait.id) {
      if (Math.abs(e.clientX - wait.x) + Math.abs(e.clientY - wait.y) > 10) stop();
      return;
    }
    if (!drag || e.pointerId !== drag.id) return;
    e.preventDefault();
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const over = under && under.closest ? under.closest('.tile') : null;
    if (!over || over === drag.t || over.parentNode !== g) return;
    /* which side of the tile you are on decides which side of it you land,
       so dragging left and dragging right both do what they look like */
    const r = over.getBoundingClientRect();
    g.insertBefore(drag.t, (e.clientX - r.left) > r.width / 2 ? over.nextSibling : over);
    drag.moved = true;
    /* `nav` is the lightest buzz there is — one per tile you pass, so the
       reshuffle is felt as well as seen without turning into a rattle. */
    Mobile.haptic('nav');
  }, { passive: false });

  addEventListener('pointerup', end);
  addEventListener('pointercancel', end);

  /* iOS decides whether a touch scrolls the page early, and only a
     non-passive touchmove that says no can stop it once a tile is up. */
  g.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });

  g.addEventListener('click', e => {
    if (!dropped) return;
    dropped = false;
    e.preventDefault(); e.stopPropagation();
  }, true);
}

/* ── the calorie reading, sized to the room it actually has ──
   This was decided by counting characters: over ten figures went one size
   down, over twelve went two. "2,155 / 4,400" is exactly ten, so it took no
   step at all and clipped to "2,155 / 4,4" on Tom's phone.

   Counting was never going to work. The room left depends on the badge beside
   it, which is wider when the percentage has three digits, and on the word
   "left" underneath, and on whatever font the theme brought. So it is
   measured: step the size down while the text is wider than the box, and if
   two steps are not enough, scale it the rest of the way. */
function fitHero(root) {
  const h = (root || document).querySelector('.islehero .hero');
  if (!h) return;
  h.classList.remove('tight', 'tighter');
  h.style.fontSize = '';
  if (h.scrollWidth <= h.clientWidth) return;
  h.classList.add('tight');
  if (h.scrollWidth <= h.clientWidth) return;
  h.classList.replace('tight', 'tighter');
  if (h.scrollWidth <= h.clientWidth) return;
  /* Still over: take the last of it off by measure, so it can never clip. */
  const now = parseFloat(getComputedStyle(h).fontSize) || 24;
  h.style.fontSize = Math.max(12, Math.floor(now * (h.clientWidth / h.scrollWidth))) + 'px';
}

/* ── which measure is the big one ──
   Tom, 2026-09-04: "We can set one metric as the main tracked to replace
   calories." So the hero is a choice, not a hard-coded thing. Whatever is
   picked here is the big number on Today AND the big number on the share
   picture, because they read the same function and cannot disagree.

   A reading is: what it is called, where you are, what you were aiming at,
   and what to call the gap. Calories are the odd one, and only because they
   count DOWN - the number worth seeing is what is left in the day, not what
   is gone. */
function statReading(id, d) {
  const t = dayTotals(d);
  if (id === '@kcal') {
    const ct = calTarget(), left = ct.v - Math.round(t.kcal);
    return { id: '@kcal', label: 'Calories', now: left, target: ct.v, unit: '', word: 'left', over: left < 0 };
  }
  if (id === '@protein') {
    return { id: '@protein', label: 'Protein', now: Math.round(t.p),
             target: Math.round(TARGETS().p) || null, unit: 'g' };
  }
  const f = liveFields().filter(x => x.id === id)[0];
  if (!f) return null;
  const v = value(d, f.id);
  return { id: f.id, label: f.label, unit: f.unit || '', target: f.target || null,
           now: v == null ? null : (f.dec || f.measure === 'scale' ? r1(v) : Math.round(v)),
           over: v != null && f.dir === 'lte' && f.target && v > f.target };
}

/* Everything that could be the big one. Calories first because it is the
   default and the one most people mean. */
function heroChoices() {
  return [{ id: '@kcal', label: 'Calories' }, { id: '@protein', label: 'Protein' }]
    .concat(liveFields().map(f => ({ id: f.id, label: f.label })));
}
const heroPick = () => S.get('heroStat', '@kcal');
function heroReading(d) {
  return statReading(heroPick(), d) || statReading('@kcal', d);
}

/* Which pillar a field is. The names in PILLARS are the ideas - sleep, steps,
   training - and a field is called whatever you called it, so the two are
   matched loosely on purpose. */
const pillarKey = id => /sleep/i.test(id) ? 'sleep' : /step/i.test(id) ? 'steps'
  : /^train/i.test(id) ? 'training' : id;

function tile(label, val, unit, cls, onclick, pct, sub) {
  const t = el('button', 'tile ' + (cls || ''));
  /* Measured in characters, because a tile is a fixed width and the font is
     whatever the theme brought: a value like "200/175" plus its unit is
     nearly twice the width of a plain number and was running off the edge. */
  const n = String(val == null ? '' : val).length + String(unit || '').length;
  const fit = n > 10 ? ' longer' : n > 7 ? ' long' : '';
  t.innerHTML = '<div class="vl' + fit + '">' + (val == null ? '–' : esc(val)) +
    (unit ? '<span class="un">' + esc(unit) + '</span>' : '') + '</div>' +
    '<div class="lb">' + esc(label) + (sub ? '<i>' + esc(sub) + '</i>' : '') + '</div>';
  if (pct != null) {
    const bar = el('div', 'bar');
    bar.innerHTML = '<i style="width:' + Math.min(100, Math.round(pct * 100)) + '%"></i>';
    t.appendChild(bar);
  }
  if (onclick) t.onclick = onclick;
  return t;
}

/* how a field's value reads on its tile */
function halfLine(f) {
  if (!f.half) return null;
  const now = remaining(f);
  if (now == null || now < 1) return null;
  const gone = clearsAt(f, Math.max(1, (f.target || 0) * .25 || 25));
  return Math.round(now) + (f.unit || '') + ' still in you' +
    (gone ? ', down to a trace by ' + new Date(gone).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '');
}

function tileValue(f, v) {
  if (v == null) return f.measure === 'check' ? '·' : '–';
  if (f.measure === 'check') return '✓';
  if (f.measure === 'scale') return r1(v);
  if (f.dec) return r1(v);
  return Math.round(v).toLocaleString();
}

/* ── NOW ──
   The island: what today is, in one card. Built by its own function because
   the export is a picture of THIS, and a second drawing of the same thing is
   a second thing to keep in step. Tom, 2026-08-28: "export should literally
   just be stats island on the first tab." */
function islandCard(d, opts) {
  opts = opts || {};
  const t = dayTotals(d);
  /* On screen this card has no heading - the date is in the app's own header
     a few pixels above it. A picture leaves the app behind, so the export
     asks for the date and gets it in the shape every other card in here uses
     for a heading. Nothing else about the card changes. */
  const c = card(opts.title || null);
  if (opts.seethru) c.classList.add('seethru');

  const h = heroReading(d);
  const hero = el('div', 'hero',
    (h.now == null ? '–' : h.now.toLocaleString()) +
    (h.target ? '<span class="sl">/</span>' + h.target.toLocaleString() : '') +
    '<span class="u">' + esc(h.word || h.unit || h.label.toLowerCase()) + '</span>');
  if (h.over) hero.style.color = 'var(--warn)';

  /* The rank sits up here beside the calories, because this is the screen he
     opens and the rank is the one-glance answer to how it is going. The big
     letter is the LAST SEVEN COMPLETED DAYS and does not move during the day. */
  const top = el('div', 'islerow');
  const heroBox = el('div', 'islehero'); heroBox.appendChild(hero);
  top.appendChild(heroBox);
  top.appendChild(rankBadge(d));
  top.style.marginBottom = 'var(--s-4)';
  c.appendChild(top);

  const g = el('div', 'tiles');
  /* Named and collected before any of them is drawn, because the order is a
     property of the whole set and cannot be decided one tile at a time. */
  const made = [];
  /* Which of these the grade is actually built from. Everything on this
     screen was drawn at the same size in the same colour, so Creatine shouted
     exactly as loudly as Steps and you could not see what was being graded.
     A pillar keeps the full treatment; everything else steps back. */
  const live = PILLARS();
  const isPillar = id => live.indexOf(pillarKey(id)) > -1;
  /* Whatever is the big number at the top does not also need a tile. */
  const heroId = heroPick();

  liveFields().filter(f => dueToday(f, d) && f.id !== heroId).forEach(f => {
    const v = value(d, f.id);
    let cls = (v == null ? 'todo' : '') + (isPillar(f.id) ? ' pillar' : ' aside');
    let pct = null;
    if (f.target && v != null) {
      pct = v / f.target;
      if (f.dir === 'lte' && v > f.target) cls += ' over';
    }
    /* An edge outranks a target: being outside one is the thing to notice,
       whether or not you also hit what you were aiming at. */
    if (v != null && ((f.min != null && v < f.min) || (f.max != null && v > f.max))) cls += ' over';
    /* a decaying field says what is still in you under its label, because the
       total you took today stops being the interesting number by mid-afternoon */
    const lf = (f.half && Day.isToday(d)) ? remaining(f) : null;
    made.push({ key: f.id, node: tile(f.label, tileValue(f, v), f.unit, cls, () => fieldSheet(f, d), pct,
      lf != null && lf >= 1 ? Math.round(lf) + (f.unit || '') + ' left' : null) });
  });
  if (heroId !== '@protein') {
    made.push({ key: '@protein', node: tile('Protein', Math.round(t.p) + '/' + Math.round(TARGETS().p), 'g', 'pillar' + (t.p ? '' : ' todo'), () => { TAB = 'food'; draw(); }, t.p / (TARGETS().p || 1)) });
  }
  /* Two different questions, and both have to say yes. `opts.money` is the
     export asking not to put money into a picture that leaves the phone.
     `spendTile` is Tom deciding he does not want to look at it at all. */
  if (opts.money !== false && S.get('spendTile', 0)) {
    made.push({ key: '@spent', node: tile('Spent', Math.round(dayMoney(d)).toLocaleString(), '\u20b1', 'aside' + (dayMoney(d) ? '' : ' todo'), () => { TAB = 'money'; draw(); }) });
  }
  inTileOrder(made, x => x.key).forEach(x => { x.node.dataset.tile = x.key; g.appendChild(x.node); });
  c.appendChild(g);
  /* Not wired on the export's copy: that one is built off screen to be
     photographed, and nothing there is ever going to be held. */
  if (opts.sortable) makeTilesSortable(g, keys => { setTileOrder(keys); draw(); });
  return c;
}

function drawNow(m) {
  const d = vd();
  m.appendChild(islandCard(d, { sortable: true }));

  /* "Through the day" used to repeat every multi-entry field underneath the
     tiles, with its running total on the right — the same number the tile
     already shows. The individual readings are still one tap away, in the
     field's own sheet, which is where you go to add one anyway. */
  seamButton(m);
  drawJournal(m);
}

/* ── the add button, in the seam ──
   Sitting in the gap between two cards rather than floating over the corner of
   one. It overlaps both, which is what makes the gap read as a seam the button
   belongs to rather than a button dropped on top of a card.

   The trade, stated plainly: it scrolls with the page instead of being pinned,
   so on a screen long enough to scroll it can leave the view. Today, Food and
   Money all fit, so it does not — but a screen that grows would need it back
   on the glass. */
function seamButton(m) {
  const w = el('div', 'seam');
  const b = el('button', 'fab mb-press mb-tap');
  b.setAttribute('aria-label', 'Add');
  b.textContent = '+';
  /* exactly the list at the top of the sheet, so the badge is a promise the
     sheet keeps */
  if (outstanding().length) b.className += ' dot';
  b.onclick = () => { Mobile.feedback('open'); fastInput(); };
  w.appendChild(b);
  m.appendChild(w);
}

/* ── FOOD ── */
/* ── the journal, on the main screen ──
   Paragraph or bullets, chosen per day rather than globally: some days are one
   piece of writing and some are a list, and having to pick once for all time
   makes one of those days awkward forever. */
function drawJournal(m) {
  const d = vd();
  const list = notes(d).filter(x => x.kind !== 'para');

  /* No prose in this card at all. The four buttons sit on the heading line and
     say what they do by being pressed; an empty journal that explains itself
     is a journal that has decided you cannot read. */
  const c = card('Journal');
  const head = c.querySelector('h2');
  if (head) {
    /* The heading is the sort control. Tom, 2026-09-03: "Let the journal word
       act as a button to sort bullets by time." Nothing new on the screen -
       the word was already there doing nothing. Todos stay on top whichever
       way it is sorted, which is the rule in noteOrder and not negotiable
       here: an open task is not a diary entry and never sorts among them. */
    /* The word stays one word. Tom, 2026-09-04: "I don't want the sort to be
       visible beside journal, can we do a pop up that vanishes?" So the mode
       is announced when it changes and then gets out of the way - a label that
       lives on the heading forever is a permanent explanation of something you
       did on purpose two seconds ago. */
    head.classList.add('jsort');
    const modes = ['manual', 'time', 'newest'];
    const says = { manual: 'As you arranged them', time: 'By time', newest: 'Newest first' };
    const mode = S.get('noteSort', 'manual');
    head.innerHTML = 'Journal';
    head.title = 'Sort: ' + says[mode];
    head.onclick = () => {
      const next = modes[(modes.indexOf(mode) + 1) % modes.length];
      S.set('noteSort', next);
      Mobile.feedback('select'); draw();
      UI.toast(says[next]);
    };
    const row = el('div', 'jbtns');
    NOTE_KINDS.forEach(k => {
      const b = el('button', 'jb mb-press mb-tap', noteSvg(k.id));
      b.setAttribute('aria-label', k.label);
      b.title = k.label;
      b.onclick = () => noteSheet({ kind: k.id, text: '' }, d);
      row.appendChild(b);
    });
    head.appendChild(row);
  }

  const wrap = el('div', 'list');
  list.forEach((x, i) => {
    const r = el('div', 'note-row' + (x.done ? ' done' : '') + (x.cancelled ? ' cancelled' : ''));
    /* ── two targets, two meanings ──
       The line used to do one thing: tapping anywhere ticked it, and the only
       way to fix a typo was to hold. That is backwards. A written line is text
       first, so tapping the words puts the cursor in them; ticking is what the
       box is for, and the box is the thing that looks like a control.

       It is also what every list app already does, which means it needs no
       explaining. */
    r.innerHTML = '<button class="k" type="button"></button>' +
      '<span class="tx">' + esc(x.text) +
      /* The time you typed, given back in the shape you typed it. It sits
         after the words rather than before them because the words are what
         you scan for; the clock is the detail. */
      /* Times, in the order a task moves through them: when it starts, how
         long it takes, when it is due, and when it was actually done. Tom,
         2026-09-03: "Bullet time can be beside entry when checked." */
      (x.at ? '<i class="at">' + esc(clockLabel(x.at)) + (x.dur ? ' \u00b7 ' + durLabel(x.dur) : '') + '</i>'
            : (x.dur ? '<i class="at">' + durLabel(x.dur) + '</i>' : '')) +
      /* ── one Done time, not two ──
         Tom, 2026-09-05: "Todos with a done time should not have a visible
         seperate ticked time." Right: the row was carrying "by 4:44" AND the
         moment it was ticked, which is the same question answered twice and
         made a finished line the busiest thing on the screen.

         `by` is the Done time now and the tick writes into it, so this is the
         only clock a finished task shows. Still open, it reads "by" because
         that is what a time in the future means. */
      (x.by ? '<i class="at by">' + (x.done ? '' : 'by ') + esc(clockLabel(x.by)) + '</i>' : '') +
      /* An entry has no time of its own, so the useful clock is when it was
         written. Only where nothing else is showing, or the row starts
         carrying three times and says nothing. */
      (x.kind !== 'todo' && !x.at && !x.dur && x.t
        ? '<i class="at wrote">' + esc(clockLabel(hhmm(x.t))) + '</i>' : '') +
      /* how long it has been following you — quiet, but it should sting a bit */
      (x.carried ? '<i class="carried">' + x.carried + 'd</i>' : '') +
      /* Finished here, written earlier. Says how long it sat, so a task you
         finally cleared reads as cleared rather than as a line you wrote
         today. */
      (x.from ? '<i class="carried">' + Day.diff(d, x.from) + 'd</i>' : '') + '</span>';
    const box = r.querySelector('.k');
    /* The mark says WHEN you are looking, not where the row came from. A box
       is something to do today; an arrow is something that has moved on. Tom,
       2026-08-28: "To do Bullets should only show as > on past days, and as
       check boxes on the present day." */
    box.innerHTML = noteSvg(x.kind, d !== Day.today());
    box.setAttribute('aria-label', x.kind === 'todo' ? (x.done ? 'Untick' : 'Tick') : noteKind(x.kind).label);
    if (x.kind === 'todo') {
      box.onclick = e => {
        e.stopPropagation();
        /* write to the row's own date, not the one being looked at — a carried
           task is the original seen from later, not a copy */
        const own = x.date || d;
        /* When it was actually done, kept on the row. Un-ticking clears it,
           because a time that outlives the tick is a time that lies. */
        const now = new Date();
        const stamp = String(now.getHours()).padStart(2, '0') + ':' +
                      String(now.getMinutes()).padStart(2, '0');
        Rec.set('note', own, x.key, Object.assign(bare(x), {
          done: x.done ? 0 : 1,
          /* ── the Done time, and whose it is ──
             The field IS the tick time: ticking writes the real one over
             whatever you were aiming at, because a field called Done showing a
             time you did not finish at would be a lie on the row.

             But a time you typed is yours. Tom, 2026-09-05: "unticking keeps
             manually put done time." So the tick puts yours aside rather than
             over the side, and un-ticking hands it back. Tick, untick, and the
             4:44 you meant to finish by is still 4:44.

             `byAuto` is how it knows whose the current one is. The sheet
             clears it whenever you set the field yourself. */
          by: x.done ? (x.byWas || null) : stamp,
          byWas: x.done ? null : (x.byAuto ? (x.byWas || null) : (x.by || null)),
          byAuto: x.done ? 0 : 1,
          doneAt: x.done ? null : stamp,
          /* WHICH DAY you ticked it, so a task written on Monday and finished
             on Thursday shows up on Thursday. Cleared on un-ticking, like the
             time is, because a day that outlives the tick lies the same way. */
          doneOn: x.done ? null : d,
        }));
        Mobile.feedback(x.done ? 'untick' : 'tick');
        publishNotes(own); draw();
      };
    } else {
      box.tabIndex = -1;
      box.style.cursor = 'inherit';
    }
    r.onclick = () => noteSheet(x, x.date || d);
    Mobile.hold(r, () => noteMenu(x, d, i, list.length));
    wrap.appendChild(r);
  });
  c.appendChild(wrap);
  m.appendChild(c);
}

/* write or edit one line */
function noteSheet(x, d) {
  const isNew = !x.key;
  /* Reusing a sheet that is already up needs no wait; opening a new one has to
     let it finish rising or the focus lands mid-animation and the keyboard
     fights the transform. */
  const reopening = !!sheetH;
  /* Held out here so the focus can happen AFTER the sheet is in the document
     but still inside the tap. ui.js builds the body first and appends the
     dialog second, so a focus() inside the builder lands on an element that
     is not in the page yet and does nothing at all. */
  let taRef = null;
  /* ── when it was written, in the title ──
     Tom, 2026-09-05: "'written 9:18' should just be '9:18' beside todo." It
     was a whole row at the bottom of the sheet for a fact you glance at, and
     the word "Written" was doing no work that its position does not already
     do. A date only appears when it is not today, because on today it says
     nothing. */
  let stamp = '';
  if (!isNew && x.t) {
    const w = new Date(x.t);
    stamp = clockLabel(String(w.getHours()).padStart(2, '0') + ':' + String(w.getMinutes()).padStart(2, '0'));
    if (x.date !== Day.today()) {
      stamp += ' \u00b7 ' + w.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    }
  }
  openSheet(noteKind(x.kind).label + (stamp ? '  ' + stamp : ''), body => {
    const seg = el('div', 'seg');
    let kind = x.kind;
    NOTE_KINDS.forEach(k => {
      const b = el('button', kind === k.id ? 'on' : '', noteSvg(k.id) + '<span>' + k.label + '</span>');
      b.setAttribute('aria-label', k.label);
      b.onclick = () => { kind = k.id; [].forEach.call(seg.children, n => n.className = ''); b.className = 'on'; };
      seg.appendChild(b);
    });
    body.appendChild(seg);

    const ta = document.createElement('textarea');
    /* An entry is prose and wants room; the others are a line. */
    ta.rows = x.kind === 'entry' ? 6 : 3;
    ta.value = x.text || '';
    ta.placeholder = '';
    ta.setAttribute('autocapitalize', 'sentences');
    body.appendChild(ta);

    /* A todo runs between two clocks: when you mean to start and when it has
       to be done. The start can be typed into the line as it always could;
       both are here as fields because a deadline is not something you want to
       discover you typed wrong. Only todos have them - an idea is not due. */
    let atVal = x.at || '', byVal = x.by || '';
    const times = el('div', 'grid2');
    times.style.display = kind === 'todo' ? '' : 'none';
    /* ── Start and Done ──
       "By" was the time you meant to finish. Calling it Done makes it the time
       you DID, which is the fact worth keeping once the day has happened - and
       it is the same box, so setting one ahead is still how you say when you
       mean to be finished.

       Ticking writes the real time over it. That loses the time you were
       aiming at, and that is the trade: a field called Done that shows a time
       you did not finish at would be a lie on the row. */
    [['Start', 'at', atVal], ['Done', 'by', byVal]].forEach(([lbl, key, val]) => {
      const w = el('div', 'field');
      w.appendChild(el('label', 'fl', lbl));
      const i = timeInput(val, v => { if (key === 'at') atVal = v; else byVal = v; });
      w.appendChild(i);
      times.appendChild(w);
    });
    body.appendChild(times);
    /* The picker above can change the kind after this is built. */
    seg.addEventListener('click', () => { times.style.display = kind === 'todo' ? '' : 'none'; });

    /* `again` reopens an empty line of the same kind instead of closing, which
       is what makes a list a list. */
    const commit = again => {
      const text = ta.value.trim();
      if (!text) return UI.toast('Nothing to save', { bad: true });
      if (isNew) {
        addNote(d, kind, text);
        /* addNote made the row; the two clocks go on straight after it. */
        if (kind === 'todo' && (atVal || byVal)) {
          const list = Rec.all('note', { date: d })
            .sort((a2, b2) => (b2.payload.t || 0) - (a2.payload.t || 0));
          if (list[0]) Rec.set('note', d, list[0].key,
            Object.assign({}, list[0].payload, { at: atVal || list[0].payload.at, by: byVal || null }));
        }
      } else {
        const pz = parseLine(text);
        Rec.set('note', x.date || d, x.key, Object.assign(bare(x), {
          kind: kind, text: pz.text,
          /* A time typed into the line still wins: it is the more recent thing
             the person did. */
          at: pz.at || (kind === 'todo' ? (atVal || null) : null),
          dur: pz.dur,
          by: kind === 'todo' ? (byVal || null) : null,
          /* You set it, so it is yours: a later tick puts this aside rather
             than over the side, and un-ticking hands it back. */
          byAuto: 0,
        }));
      }
      publishNotes(d);
      Mobile.feedback(again ? 'tick' : 'success');
      if (again) { draw(); noteSheet({ kind: kind, text: '' }, d); return; }
      closeSheet(); draw();
    };

    /* ── Enter carries on the list ──
       A bullet is one line, so Return has nothing useful to do inside the box:
       it makes an invisible second line in a field three rows tall. Writing
       five todos meant Add, tap the todo button, type, Add, tap, type. Now it
       is type, Enter, type, Enter — which is how every outliner and every
       paper bullet journal already behaves.

       An Entry is the exception and keeps Return as a newline, because an
       entry is prose and genuinely has paragraphs. Shift+Enter forces a
       newline anywhere, and an empty line closes the sheet — that is the
       gesture for "done making these".                                     */
    ta.onkeydown = e => {
      if (e.key !== 'Enter' || e.shiftKey || e.altKey || kind === 'entry') return;
      /* mid-composition on an IME, Enter is choosing a candidate, not a line */
      if (e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      if (!ta.value.trim()) { closeSheet(); draw(); return; }
      commit(true);
    };

    body.appendChild(saveBar(isNew ? 'Add' : 'Save', () => commit(false)));

    /* ── the cursor starts in the box ──
       This used to look the textarea up as `#sheet textarea`. Nothing on the
       page has that id — it only ever existed as a CSS selector — so the
       lookup matched nothing, hit its own `if (!t) return`, and quietly did
       nothing at all. Every note sheet opened with no cursor in it.

       That also made Enter look broken, which it was not: the key is bound to
       this textarea, and a box that never receives focus never sees a
       keystroke. One missing element, two symptoms.

       Held onto directly now rather than searched for. Focus alone drops the
       caret wherever the platform feels like, so it goes after the last
       character, which is what "carry on writing" means. */
    taRef = ta;
    setTimeout(() => {
      /* ui.js focuses the first input in a dialog 40ms in, which since todos
         gained a Start field is now a time picker rather than the Save button.
         Take the caret back. */
      if (document.activeElement !== ta) ta.focus();
      try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
    }, reopening ? 40 : 120);
  });

  /* iOS raises the keyboard only when focus happens inside the tap that asked
     for it. The old code focused on a 380ms timer, so the caret appeared and
     the keyboard did not - which is what Tom kept seeing. This line is still
     inside the same click, and the sheet is in the document by now. */
  /* One way to do this, in shared/ui.js, so the next app does not have to
     rediscover that iOS only honours a focus inside the gesture. */
  UI.focusSoon(taRef, reopening);
}

function noteMenu(x, d, i, n) {
  const manual = S.get('noteSort', 'manual') === 'manual';
  const own = x.date || d;
  const isTask = x.kind === 'todo';
  const save = patch => {
    Rec.set('note', own, x.key, Object.assign(bare(x), patch));
    Mobile.feedback('select'); publishNotes(own); draw();
  };
  UI.menu(0, 0, [
    { label: 'Edit', icon: '✎', fn: () => noteSheet(x, own) },
    /* Cancelled is not deleted. A task you decided not to do is a real
       outcome and worth keeping — deleting it pretends you never planned it,
       which is the one thing a log should never do. */
    isTask && !x.cancelled ? { label: 'Cancel it', note: 'Kept, but stops following you', icon: '⊘',
      fn: () => save({ cancelled: 1, done: 0 }) } : null,
    isTask && x.cancelled ? { label: 'Put it back', icon: '↺', fn: () => save({ cancelled: 0 }) } : null,
    manual && i > 0 ? { label: 'Move up', icon: '↑', fn: () => moveNote(d, x, -1) } : null,
    manual && i < n - 1 ? { label: 'Move down', icon: '↓', fn: () => moveNote(d, x, 1) } : null,
    '-',
    { label: 'Delete', kind: 'bad', icon: '⌫', fn: () => {
      const keep = bare(x);
      Rec.del('note', own, x.key); Mobile.haptic('warn'); publishNotes(own); draw();
      UI.undo('removed the line', () => { Rec.set('note', own, x.key, keep); publishNotes(own); draw(); });
    } },
  ].filter(Boolean), { title: noteKind(x.kind).label });
}

function moveNote(d, x, dir) {
  const list = notes(d).filter(y => y.kind !== 'para');
  const i = list.findIndex(y => y.key === x.key), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  list.forEach((y, n) => Rec.set('note', y.date || d, y.key, Object.assign(bare(y), { ord: n })));
  Mobile.feedback('select');
  draw();
}


function drawFood(m) {

     faded and reads "31% of intake" rather than "x / y", because it is a
     description of what happened, not progress toward anything. */
  const on = S.get('macroOn', { p: 1, c: 1, f: 1 });

    const w = el('div', 'macro ' + row[3] + (targeted ? '' : ' untargeted'));
    if (targeted) {
      const lim = row[2] || 0, pct = lim ? v / lim : 0;
      const over = row[4] === 'lte' && v > lim;
      if (over) w.className += ' over';
      /* the band on calories only, because that is the one it changes a
         decision about — the macros inherit the same doubt and saying so four
         times is noise */
      const band = (key === 'kcal' && t.kerr >= 25) ? ' ±' + Math.round(t.kerr) : '';
      w.innerHTML = '<div class="top"><b>' + row[1] + '</b><span class="n">' + Math.round(v) + band + ' / ' + Math.round(lim) + '</span></div>' +

    } else {
      const share = t.kcal > 0 ? (v * KCALG[key]) / t.kcal : 0;
      w.innerHTML = '<div class="top"><b>' + row[1] + '</b><span class="n derived-tag">' +
        Math.round(v) + 'g · ' + Math.round(share * 100) + '% of intake</span></div>' +
        '<div class="track"><i style="width:' + Math.min(100, Math.round(share * 100)) + '%"></i></div>';
    }

  if (on.p) bits.push(Math.max(0, Math.round(tg.p - t.p)) + 'g protein to go');
  bits.push(Math.round(t.na) + 'mg sodium', Math.round(t.k) + 'mg potassium');
  if (ct.src === 'tdee') bits.push('target from measured TDEE');
  if (ct.src === 'macros') bits.push('calories from macros');

    r.innerHTML = '<span class="nm">' + esc(x.name) + '<small>' + marks.filter(Boolean).join(' · ') + '</small></span>' +
      '<span class="fig">' + Math.round(x.kcal) + '<small>' + r1(x.p) + 'g protein</small></span>';
    const del = el('button', 'x', '✕');
    del.onclick = e => {
      e.stopPropagation();
      const row = Object.assign({}, x); delete row.key;
      Rec.del('meal', d, x.key); mealSpend(d, x.key, null); Mobile.feedback('untick'); draw();
      UI.undo('removed <b>' + esc(x.name) + '</b>',
        () => { Rec.set('meal', d, x.key, row); mealSpend(d, x.key, row); draw(); });
    };
    r.appendChild(del);
    /* Tap edits this serving. Hold asks the wider question — because "change
       what I ate" and "change what this food is" are genuinely different, and

  b.style.marginTop = 'var(--s-2)';
  b.onclick = foodPicker;

  one.style.marginTop = 'var(--s-2)';
  one.onclick = oneOffSheet;
  c2.appendChild(one);
  m.appendChild(c2);

/* ── TRENDS ── */

/* ══════════════ ADHERENCE, AND THE RANK IT EARNS ══════════════

   THE PILLARS. Five things build a physique and they are the only things
   scored: protein, sleep, steps, calories and training. Weight, mood and
   everything else is tracked and never scored - a number with no target is
   not an instruction, and scoring mood would be inventing a pass mark for how
   somebody felt.

   The list can be changed. It is deliberately not on the main settings screen,
   because a score you can quietly redefine is a score that means nothing.

   THE BANDS. Tom set S and A and said F is failing; the middle is spaced from
   those two and lives in one array, so it is one edit.

   NOTHING IS PASS OR FAIL. Six and a half hours of a seven hour target is
   most of a night's sleep, not a zero. Every pillar scores between 0 and 1:
   full marks within 5% of target, nothing at all once 20% away, and a straight
   line between. Going OVER a target you are meant to reach - protein, sleep,
   steps - is full marks and never more, so a huge day cannot pad the week.
   Calories taper both ways, because both directions are a miss.

   TRAINING IS NOT IN THE AVERAGE. It raises the grade a whole letter, and
   without it S is unreachable. That shape is deliberate: it is the strongest
   lever in the score without ever taking anything away from you, which is
   what CLAUDE.md means by "never remove earned progress" and "design for
   month 6, not week 2". A penalty would win week two and lose month six.

   TWO CAPS, one rule. A day cannot exceed A if it was a rest day, or if the
   day is not over yet. Rest matters and you cannot rest your way to a
   physique; and at eleven in the morning nobody has earned an S, because the
   hard pillars have not happened yet.                                        */

const tok = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

const RANKS = [
  { k: 'S', at: 95, say: 'Near perfect' },
  { k: 'A', at: 88, say: 'Strong' },
  { k: 'B', at: 80, say: 'Good' },
  { k: 'C', at: 70, say: 'Patchy' },
  { k: 'D', at: 60, say: 'Slipping' },
  { k: 'E', at: 50, say: 'Barely there' },
  { k: 'F', at: 0,  say: 'Failing' },
];
const rankFor = pct => RANKS.find(r => pct >= r.at) || RANKS[RANKS.length - 1];
const rankColour = k => tok('--rank-' + k) || tok('--accent');
const rankUp = (k, n) => {
  const i = RANKS.findIndex(r => r.k === k);
  return RANKS[Math.max(0, i - (n || 1))].k;
};
const rankCap = (k, cap) => {
  const i = RANKS.findIndex(r => r.k === k), c = RANKS.findIndex(r => r.k === cap);
  return i < c ? cap : k;
};
/* The other direction: a letter this day cannot go below, whatever the four
   numbers say. Tom, 2026-08-28: "a day trained can never be F." Training is
   the day's hardest thing to do and the one the other four are in service of,
   so a day you trained is not a failed day even if you ate badly and slept
   badly on top of it. */
const rankFloor = (k, floor) => {
  const i = RANKS.findIndex(r => r.k === k), f = RANKS.findIndex(r => r.k === floor);
  return i > f ? floor : k;
};

/* ── the adherence standards ──
   From Tom's table, 2026-08-29. Each pillar is a LADDER, not a percentage of
   a target: a number gets a letter directly, and the day is the average of
   the letters it earned.

   This replaces one curve doing four jobs. A curve has to decide how far off
   is "half marks", which is a question with a different answer for hours of
   sleep than it has for grams of protein. A ladder does not ask it - the
   table says what eight hours is worth and what six is worth, and that is
   the whole answer.

   Sleep and steps are absolute: eight hours is an S whatever you set your
   own target to. Calories and protein are ACCURACY - how close you landed to
   your own target, either side - because a target of 2,400 means something
   different for each person and being 400 over is as wrong as 400 under.

   Kept as a setting so the standards can be raised without a code change. */
const STANDARDS = () => S.get('standards', {
  sleep:   [['S', 8], ['A', 7.5], ['B', 7], ['C', 6.5], ['D', 6], ['E', 5.5]],
  steps:   [['S', 12500], ['A', 10000], ['B', 8800], ['C', 7500], ['D', 6500], ['E', 5000]],
  kcal:    [['S', 97], ['A', 95], ['B', 90], ['C', 85], ['D', 80], ['E', 75], ['F', 70]],
  protein: [['S', 97], ['A', 95], ['B', 90], ['C', 85], ['D', 80], ['E', 75], ['F', 70]],
});

/* Training is graded against the plan you set rather than a flat number,
   because four sessions out of four is not the same day's work as four out
   of six. Straight from the table, one column per weekly plan. A plan of two
   or three tops out at A: you cannot rest your way to an S. */
const TRAIN_STANDARD = () => S.get('trainStandard', {
  6: { 6: 'S', 5: 'A', 4: 'B', 3: 'C', 2: 'D', 1: 'E', 0: 'F' },
  5: { 5: 'S', 4: 'A', 3: 'B', 2: 'C', 1: 'D', 0: 'F' },
  4: { 4: 'S', 3: 'A', 2: 'B', 1: 'D', 0: 'F' },
  3: { 3: 'A', 2: 'B', 1: 'D', 0: 'F' },
  2: { 2: 'A', 1: 'C', 0: 'F' },
});

/** where a letter sits: S is 0, F is the last one */
const rankIndex = k => {
  const i = RANKS.findIndex(r => r.k === k);
  return i < 0 ? RANKS.length - 1 : i;
};

/** the letter a number earns on a ladder, or F if it clears nothing */
function ladderLetter(rungs, v) {
  if (v == null) return 'F';
  for (let i = 0; i < rungs.length; i++) if (v >= rungs[i][1]) return rungs[i][0];
  return 'F';
}

/** how close you landed to a target, as a percentage.

    `free` names the direction that costs nothing: 'over' means at or above
    the target is full marks, 'under' means at or below it is. Anything else
    counts both ways.

    Tom, 2026-09-03: "Going above protein is okay, the accuracy only counts
    for under." Two hundred grams against a target of a hundred and seventy
    five is not a miss by fourteen percent, it is the target met, and grading
    it as a C was the model being tidy rather than right. Protein is always
    'over'; calories are whichever the user picked. */
function accuracy(v, target, free) {
  if (!target) return null;
  if (v == null) return 0;
  if (free === 'over' && v >= target) return 100;
  if (free === 'under' && v <= target) return 100;
  return Math.max(0, 100 - Math.abs(v - target) / target * 100);
}

/** the letter for one pillar on one day, or null if it does not apply */
function pillarLetter(id, v, target) {
  const st = STANDARDS();
  if (id === 'kcal' || id === 'protein') {
    /* Protein is always free above the target. Calories are whichever way
       the user said a miss should count. */
    const free = id === 'protein' ? 'over' : kcalDir();
    const a = accuracy(v, target, free);
    return a == null ? null : ladderLetter(st[id], a);
  }
  if (!st[id]) return null;
  return ladderLetter(st[id], v);
}

/** the training letter for a stretch, against the plan */
function trainLetter(sessions, perWeek, weeks) {
  const table = TRAIN_STANDARD();
  const plan = Math.max(2, Math.min(6, Math.round(num(perWeek, 4) || 4)));
  const col = table[plan] || table[4];
  /* Over more than a week the plan scales with it, and so does what you did. */
  const per = weeks > 0 ? sessions / weeks : sessions;
  const hit = Math.max(0, Math.min(plan, Math.round(per)));
  return col[hit] || 'F';
}

/** letters in, one letter out */
function averageLetter(letters) {
  const ok = letters.filter(Boolean);
  if (!ok.length) return null;
  const mean = ok.reduce((a, k) => a + rankIndex(k), 0) / ok.length;
  return RANKS[Math.max(0, Math.min(RANKS.length - 1, Math.round(mean)))].k;
}

/* The old curve, kept because the tiles and the charts still ask "how close
   is this to the target" as a fraction, which is a different question from
   what letter it earned. */
const FULL = 0.05, ZERO = 0.20;
function closeness(v, target, both) {
  if (target == null || !target) return null;
  if (v == null) return 0;
  if (!both) {
    const r = v / target;
    return r >= 1 - FULL ? 1 : Math.max(0, r);
  }
  const d = Math.abs((v - target) / target);
  if (d <= FULL) return 1;
  if (d >= ZERO) return 0;
  return 1 - (d - FULL) / (ZERO - FULL);
}

/* ── which five, and when each one settles ──
   The times are the user's. A pillar that has not settled is not counted
   against today, which is the whole reason today can be scored at all. */
const PILLARS = () => S.get('pillars', ['protein', 'sleep', 'steps', 'kcal', 'training']);
const SETTLE = () => S.get('settle', { sleep: 10, steps: 20, kcal: 21, protein: 21, training: 20 });
const settledYet = id => {
  const h = num(SETTLE()[id], 21); return new Date().getHours() >= (h == null ? 21 : h);
};

/* Training comes from TRAIN if it is there, and from a tracked yes/no in here
   if it is not. Naming a body part is itself a yes. */
function trainedOn(date) {
  if (Rec.get('session', date, '')) return true;
  if (Rec.all('set', { date: date }).length) return true;
  const f = Object.values(fields()).filter(x => /^train/i.test(x.id) || /training/i.test(x.label || ''))[0];
  if (f && logged(date, f.id)) return true;
  return false;
}

/* ── one day ── */
function dayScore(date) {
  const live = PILLARS(), parts = [], pending = [];
  const today = date === Day.today();
  const T = TARGETS(), tot = dayTotals(date), ate = meals(date).length > 0;

  /* Each pillar earns a letter off its own ladder and the day is the average
     of those letters. `score` is the same letter as a fraction, so the tiles
     and the "costing the most" list still have something to sort on, and so
     the percentage on the badge can never disagree with the letter beside it.

     Sleep and steps read straight off the table. Calories and protein are
     scored on ACCURACY to your own target, either side, because 400 over is
     as wrong as 400 under. */
  const asScore = k => 1 - rankIndex(k) / (RANKS.length - 1);

  /* ── every pillar keeps its working ──
     A letter with no number behind it is a verdict you cannot argue with,
     which is the opposite of useful. Tom, 2026-09-05: "When I click the
     letter, I wanna see the data for the day." So each part carries what it
     was measured on, and for calories and protein the accuracy the ladder
     actually read. */
  const add = (id, label, letter, monotonic, val, target, unit) => {
    if (letter == null) return;
    /* A pillar that can only go up counts as soon as it is at A or better.
       Hitting your steps at 2pm is done, and waiting until 8pm to admit it is
       what made the grade look broken. One still short of an A can improve,
       and one that can get worse by eating more, both wait for their hour. */
    const banked = monotonic && rankIndex(letter) <= rankIndex('A');
    if (today && !banked && !settledYet(id)) { pending.push(label); return; }
    const acc = (id === 'kcal' || id === 'protein')
      ? accuracy(val, target, id === 'protein' ? 'over' : kcalDir()) : null;
    parts.push({ id: id, label: label, letter: letter, score: asScore(letter),
                 val: val, target: target, unit: unit || '', acc: acc });
  };

  if (live.indexOf('protein') > -1)
    add('protein', 'Protein', pillarLetter('protein', ate ? num(tot.p, 0) : null, num(T.p, 0)), false,
        ate ? Math.round(num(tot.p, 0)) : null, Math.round(num(T.p, 0)), 'g');
  if (live.indexOf('kcal') > -1)
    add('kcal', 'Calories', pillarLetter('kcal', ate ? num(tot.kcal, 0) : null, num(T.kcal, 0)), false,
        ate ? Math.round(num(tot.kcal, 0)) : null, Math.round(num(T.kcal, 0)), '');

  /* The ladders for sleep and steps are absolute, so a field with no target
     of its own is still graded - eight hours is an S whatever you aimed at. */
  Object.values(fields()).forEach(f => {
    if (!f.on || !dueToday(f, date)) return;
    const id = /sleep/i.test(f.id) ? 'sleep' : /step/i.test(f.id) ? 'steps' : f.id;
    if (live.indexOf(id) === -1) return;
    add(id, f.label, pillarLetter(id, value(date, f.id), num(f.target, 0)), true,
        value(date, f.id), num(f.target, 0) || null, f.unit || '');
  });

  const scored = parts;
  const letter = averageLetter(scored.map(p => p.letter));
  const pct = scored.length ? Math.round(scored.reduce((a, p) => a + p.score, 0) / scored.length * 100) : null;

  /* ── a day you never opened is not a day you failed ──

     Every pillar with no reading scores zero, which is right for a day you
     used and missed on, and wrong for a day the app was not open. Those two
     were being counted as the same thing, so the seven days before you started
     were seven zeroes and the badge said F, 0% — on a morning with eight hours
     of sleep, twelve thousand steps and every gram of protein in.

     A first impression of F is not a motivator, it is a reason to close the
     app, and CLAUDE.md is explicit that progress starts above zero and that
     earned progress is never taken away. So a day with nothing on it at all is
     left out of the average rather than counted as a nought, and the card says
     how many days the number is actually built from. */
  const used = ate || trainedOn(date) ||
    !!(Rec.get('day', date, '') || {}).note ||
    !!(Rec.get('day', date, '') || {}).rest ||
    Object.values(fields()).some(f => logged(date, f.id));

  return {
    date: date, pct: pct, letter: letter, parts: scored, pending: pending,
    used: used,
    trained: trainedOn(date),
    rest: !!(Rec.get('day', date, '') || {}).rest,
    partial: pending.length > 0,
  };
}

/* ── a stretch of days ──
   Today is never in here. It moves all day and a rank that moves all day is
   one you stop reading; it is shown beside this instead. */
function adherence(days) {
  const rows = [];
  for (let i = days; i >= 1; i--) rows.push(dayScore(Day.shift(Day.today(), -i)));
  /* Only days that were actually used. A day with nothing on it says nothing
     about how you did, so it says nothing about the average either. */
  const scored = rows.filter(r => r.pct != null && r.used);
  const touched = rows.filter(r => r.used);
  const pct = scored.length ? Math.round(scored.reduce((a, r) => a + r.pct, 0) / scored.length) : null;

  /* Training has its own ladder, graded against the plan you set: four out of
     four is not the same week's work as four out of six. */
  const sessions = rows.filter(r => r.trained).length;
  const perWeek = num(S.get('trainPerWeek', 4), 4);
  const want = perWeek * (days / 7);
  const trainK = trainLetter(sessions, perWeek, days / 7);
  const hitTraining = sessions >= Math.floor(want);

  /* No days to go on means no letter. Showing F would be inventing a verdict
     out of an absence of evidence. */
  const dayLetters = scored.map(r => r.letter).filter(Boolean);
  let k = dayLetters.length ? averageLetter(dayLetters) : (pct == null ? null : rankFor(pct).k);
  if (k) {
    /* Training is the fifth pillar, so it averages in with the rest rather
       than being bolted on afterwards - but it can still only ever help, so
       a bad training week never drags a good one below where it stood. */
    const withTrain = averageLetter(dayLetters.concat([trainK]));
    if (rankIndex(withTrain) < rankIndex(k)) k = withTrain;
    if (!hitTraining) k = rankCap(k, 'A');   /* no training, no S */
  }

  /* what is costing the most, by how much it gave up rather than by count */
  const lost = {};
  rows.forEach(r => r.parts.forEach(p => {
    lost[p.label] = (lost[p.label] || 0) + (1 - p.score);
  }));
  const worst = Object.entries(lost).filter(w => w[1] > 0.5)
    .sort((a, b) => b[1] - a[1]).slice(0, 3);

  return { pct: pct, rank: k ? RANKS.find(r => r.k === k) : null, days: days, rows: rows,
           sessions: sessions, want: Math.floor(want), hitTraining: hitTraining,
           trainRank: trainK, perWeek: perWeek,
           worst: worst, scoredDays: scored.length, loggedDays: touched.length };
}

/* One day on its own, capped at A while it is unfinished or was a rest day.

   Takes a date, because the badge sits on a screen you can step backwards
   through. It used to be today and only today, so stepping back a day left the
   letter reporting THIS morning - and at eight in the morning this morning has
   nothing graded, so a finished day from last week showed a dash. The letter
   was not missing, it was answering a question about a different day. */
function scoreFor(date) {
  const d = dayScore(date || Day.today());
  if (d.pct == null) return d;
  /* Same rule as the days behind it: a morning you have not touched yet is not
     a morning you are failing. It gets a number once it gets a reading. */
  if (!d.used) { d.pct = null; return d; }
  /* The letter now comes off the pillars' own letters rather than being read
     back out of a percentage, so the two can never disagree. */
  let k = d.letter || rankFor(d.pct).k;
  if (d.trained) k = rankFloor(rankUp(k, 1), 'E');
  if (d.partial) k = rankCap(k, 'A');
  if (d.rest) k = rankCap(k, 'A');
  d.rank = RANKS.find(r => r.k === k);
  return d;
}
const todayScore = () => scoreFor(Day.today());

/* ══════════════ THE DAY BEHIND THE LETTER ══════════════
   Tom, 2026-09-05: "When I click the letter, I wanna see the data for the
   day." The badge used to jump to Trends, which answers a different question -
   how is the WEEK going - and left today's letter unexplained.

   A grade you cannot see the working of is a grade you argue with. Every
   pillar shows what it was measured on, what it was measured against, and the
   letter that came out. Calories and protein also show the accuracy the
   ladder actually read, because "2,155 against 2,220" and "97%" are the same
   fact and only one of them explains an S.

   And the things that moved the letter afterwards - the training bump, the
   rest-day cap, the not-over-yet cap - are named. Those are the parts that
   surprise you. */
function daySheet(date) {
  const sc = date === Day.today() ? todayScore() : scoreFor(date);
  const k = sc && sc.rank ? sc.rank.k : (sc && sc.letter) || null;
  openSheet(Day.label(date), body => {
    const head = el('div', 'dayhead');
    const col = k ? rankColour(k) : tok('--text-muted');
    head.innerHTML = '<span class="rk" style="color:' + col + ';border-color:' + col + '">' +
      (k || '\u2013') + '</span>' +
      '<span class="dhs">' + (sc && sc.pct != null ? sc.pct + '%' : 'nothing graded') +
      '<i>' + esc(sc && sc.rank ? sc.rank.say : 'nothing logged on this day') + '</i></span>';
    body.appendChild(head);

    const parts = (sc && sc.parts) || [];
    if (parts.length) {
      const list = el('div', 'pillars');
      parts.forEach(pt => {
        const c = rankColour(pt.letter);
        const shown = pt.val == null ? '\u2013'
          : (pt.val % 1 ? r1(pt.val) : Math.round(pt.val)).toLocaleString();
        const against = pt.target ? ' / ' + pt.target.toLocaleString() : '';
        list.appendChild(el('div', 'pillar',
          '<span class="pl">' + esc(pt.label) + '</span>' +
          '<span class="pv">' + shown + against + (pt.unit ? ' ' + esc(pt.unit) : '') +
          (pt.acc != null ? '<i>' + Math.round(pt.acc) + '% accurate</i>' : '') + '</span>' +
          '<span class="pk" style="color:' + c + '">' + pt.letter + '</span>'));
      });
      body.appendChild(list);
    }

    /* Still to come, and named, so a middling letter at noon reads as
       unfinished rather than as a verdict. */
    if (sc && sc.pending && sc.pending.length) {
      body.appendChild(el('div', 'note', 'Not counted yet: <b>' +
        sc.pending.map(esc).join('</b>, <b>') + '</b>. They settle later in the day.'));
    }
    const moved = [];
    if (sc && sc.trained) moved.push('trained, so the letter went up one');
    if (sc && sc.rest) moved.push('rest day, so it tops out at A');
    if (sc && sc.partial) moved.push('the day is not over, so it tops out at A');
    if (moved.length) body.appendChild(el('div', 'note', moved.join(' \u00b7 ')));

    if (!parts.length) {
      body.appendChild(el('div', 'empty', 'Log a measurement and this fills in.'));
    }
  });
}

/* ── a letter for every day ──
   "Week trends I wanna see the letter grade for each day, same with month."
   One letter per day, in its own colour, so a bad patch has a shape. Days you
   never logged are a dash and not an F - the difference between not doing it
   and not being there is the difference between a plan failing and a person
   being on holiday. */
function letterRun(days) {
  const wrap = el('div', 'lrun');
  const today = Day.today();
  for (let i = days - 1; i >= 0; i--) {
    const d = Day.shift(today, -i);
    const sc = d === today ? todayScore() : scoreFor(d);
    const k = sc && sc.rank ? sc.rank.k : (sc && sc.letter) || null;
    const b = el('button', 'ld' + (d === today ? ' now' : ''), k || '\u00b7');
    if (k) b.style.color = rankColour(k);
    b.dataset.tip = Day.label(d) + (k ? ' \u2014 ' + k + (sc.pct != null ? ' \u00b7 ' + sc.pct + '%' : '') : ' \u2014 nothing logged');
    b.setAttribute('aria-label', b.dataset.tip);
    b.onclick = () => daySheet(d);
    wrap.appendChild(b);
  }
  return wrap;
}

/* ── the badge ── */
function rankBadge(date) {
  /* The letter beside the calories is the DAY YOU ARE LOOKING AT. It was the
     last seven completed days once, which is a defensible number on the wrong
     screen; then it was today, which is right until you step back a day. The
     week is on Trends, where the working lives. */
  const d = date || vd();
  const today = Day.isToday(d);
  const t = scoreFor(d);
  const w = el('button', 'rankbadge mb-press mb-tap');
  w.title = t.rank
    ? (today ? 'Today so far. Tap for the week and the working.'
             : Day.label(d) + '. Tap for the week and the working.')
    : (today ? 'Nothing graded yet today. Tap to see what it needs.'
             : 'Nothing logged on ' + Day.label(d) + '.');
  /* Nothing to grade yet reads as a dash, not as an F. The letter arrives the
     day after the first day you log. */
  const mark = t.rank ? t.rank.k : '–';
  const col = t.rank ? rankColour(t.rank.k) : tok('--text-muted');
  /* The letter and nothing else. Tom, 2026-09-03: "I don't want the % number
     to be visible just the letter is cleaner." He is right - the percentage
     was the same fact said twice, in the less readable of the two ways, and
     it was the thing crowding the calorie reading beside it.

     The number is not gone, it is on Trends, which is where you go when you
     want the working rather than the answer. */
  w.innerHTML =
    '<span class="rk" style="color:' + col + ';border-color:' + col + '">' + mark + '</span>';
  /* The day it is showing, not the week. Trends is one tap further on and
     answers a different question. */
  w.onclick = () => { Mobile.feedback('open'); daySheet(d); };
  return w;
}

/* ── the full working, on Trends ── */
function rankCard() {
  const days = num(S.get('rankDays', 7), 7) || 7;
  /* Set below; the letter runs read it so the row matches the window. */
  const a = adherence(days);
  const c = card('RANK', a.loggedDays + ' of ' + days + ' days logged');

  const seg = el('div', 'seg');
  [[7, '7 days'], [30, '30 days'], [90, '90 days']].forEach(([n, lbl]) => {
    const b = el('button', n === days ? 'on' : '', lbl);
    b.onclick = () => { S.set('rankDays', n); draw(); };
    seg.appendChild(b);
  });
  c.appendChild(seg);

  const head = el('div', 'rankrow');
  const mk = a.rank ? a.rank.k : '–';
  const mcol = a.rank ? rankColour(a.rank.k) : tok('--text-muted');
  head.innerHTML =
    '<div class="rankmark" style="color:' + mcol + ';border-color:' + mcol + '">' + mk + '</div>' +
    '<div class="rankside"><div class="hero">' + (a.pct == null ? '–' : a.pct + '<span class="u">%</span>') + '</div>' +
    '<div class="lb">' + esc(a.rank ? a.rank.say : 'Nothing to grade yet') + '</div></div>';
  c.appendChild(head);

  /* ── the days themselves ──
     The big letter is an average and an average hides the shape: four Ss and
     three Fs average to the same place as seven Cs, and they are not the same
     week. Tap any day for its working. */
  c.appendChild(el('label', 'fl', days === 7 ? 'Each day this week' : 'Each day'));
  c.appendChild(letterRun(days));

  /* training, said plainly, because it is the only thing that moves a letter */
  c.appendChild(el('div', 'note',
    a.hitTraining
      ? '<b>' + a.sessions + ' sessions</b> against ' + a.want + '. Raised a letter.'
      : '<b>' + a.sessions + ' sessions</b> against ' + a.want + '. A letter is waiting.'));

  if (a.worst.length) {
    c.appendChild(el('div', 'note', 'Costing the most: ' +
      a.worst.map(w => esc(w[0])).join(', ') + '.'));
  }
  if (!a.loggedDays) {
    c.appendChild(el('div', 'note',
      'Nothing logged in this stretch, so there is nothing to grade. Log a day and the letter arrives tomorrow.'));
  } else if (a.loggedDays < days) {
    /* Said out loud, because an average over two days and an average over
       thirty are not the same claim and the letter looks identical. */
    c.appendChild(el('div', 'note',
      'Built from the <b>' + a.loggedDays + '</b> day' + (a.loggedDays === 1 ? '' : 's') +
      ' you logged. Days the app was not opened are left out rather than counted as noughts.'));
  }

  /* today, kept out of the number above */
  const t = todayScore();
  c.appendChild(el('label', 'fl', 'Today'));
  if (t.pct == null) {
    c.appendChild(el('div', 'note',
      t.used ? 'Nothing due yet today.' : 'Nothing logged yet today.'));
  } else {
    c.appendChild(el('div', 'note',
      '<b>' + t.pct + '%</b>' + (t.rank ? ' &middot; ' + t.rank.k : '') +
      (t.partial ? ' &middot; still going. Waiting on '
        + t.pending.map(esc).join(', ') : '') +
      (t.rest ? ' &middot; rest day, tops out at A' : '')));
  }

  const bar = el('div', 'btns');
  const story = el('button', 'btn', 'STORY');
  const feed = el('button', 'btn', 'POST');
  story.onclick = () => shareCard(a, 'story');
  feed.onclick = () => shareCard(a, 'feed');
  bar.appendChild(story); bar.appendChild(feed);
  c.appendChild(el('label', 'fl', 'Share it'));
  c.appendChild(bar);
  /* The picture is the Today card, so if the Spent tile is on your Today it is
     in the picture too. It starts hidden: what you spend is nobody's business
     and a default that leaks it is the wrong default. */
  /* ── one choice, not three switches ──
     Tom, 2026-09-05: "strava leads you to a swipe menu of setting styles, so
     it can be transparent or a solid block." Right, and three checkboxes was
     me exposing the machinery instead of the choice. See-through and darken
     are not two decisions, they are one look, and nobody wants a transparent
     card with no scrim - that is the unreadable combination. */
  const nowStyle = shareStyle();
  c.appendChild(el('label', 'fl', 'Style'));
  const sseg = el('div', 'seg');
  SHARE_STYLES.forEach(st => {
    const sb = el('button', st[0] === nowStyle ? 'on' : '', esc(st[1]));
    sb.onclick = () => { S.set('shareStyle', st[0]); Mobile.feedback('select'); draw(); };
    sseg.appendChild(sb);
  });
  c.appendChild(sseg);
  c.appendChild(el('div', 'note', esc(styleDef()[4])));

  const nowSize = shareSize()[0];
  c.appendChild(el('label', 'fl', 'Island size'));
  const zseg = el('div', 'seg');
  SHARE_SIZES.forEach(z => {
    const zb = el('button', z[0] === nowSize ? 'on' : '', esc(z[1]));
    zb.onclick = () => { S.set('shareSize', z[0]); Mobile.feedback('select'); draw(); };
    zseg.appendChild(zb);
  });
  c.appendChild(zseg);

  const w = el('label', 'shopt');
  const b = document.createElement('input');
  b.type = 'checkbox'; b.checked = !!S.get('hideSpend', 1);
  b.onchange = () => S.set('hideSpend', b.checked ? 1 : 0);
  w.appendChild(b); w.appendChild(el('span', null, 'Leave spending out'));
  c.appendChild(w);
  return c;
}

/* ── the overlay ──
   A see-through PNG of the Today card, to sit on top of a photo or a clip.

   It does not redraw anything. It photographs the real card: islandCard()
   builds the same element the Today screen shows, and IO.shot() rasterises
   it. So the picture cannot drift from the app - change the card and the
   picture changes with it, with nothing here to keep in step.

   Everything that used to make this hard - the page's colours and typeface
   going missing inside an SVG - now lives in IO.shot, in the shared drawer,
   where the next app to want a picture gets it working the first time. Tom,
   2026-09-04: "Okay, add it to shared."

   What is left here is the three decisions that are STATUS's own: which card,
   how wide, and the date on top of it. */

/* Three, his names. I cut Transparent as "a mistake you can pick" and he put
   it back, which is his call to make: on a dark plain photo it is the best of
   the three and the gradient is the thing in the way.
   id, label, see-through, gradient behind it, what it is for */
const SHARE_STYLES = [
  ['clear', 'Transparent', 1, 0, 'Just the card, nothing behind it. Best on a dark, plain photo.'],
  ['glass', 'Translucent', 1, 1, 'The photo shows through, on a soft gradient so it reads on anything.'],
  ['solid', 'Opaque',      0, 0, 'A solid card. Nothing shows through, so nothing can fight the numbers.'],
];
const shareStyle = () => S.get('shareStyle', 'glass');

/* ── how big the island sits in the frame ──
   Tom, 2026-09-05: "We might want the gradient to be bigger than the island,
   allowing us to have the island be smaller on the actual story post."

   The gradient always covers the whole frame; what changes is the card. At
   88% the card IS the post and the photo is a border. Smaller, the photo is
   the post and the numbers are an overlay on it, which is what a story
   usually wants. */
const SHARE_SIZES = [['big', 'Big', 0.88], ['mid', 'Medium', 0.68], ['small', 'Small', 0.52]];
const shareSize = () => {
  const id = S.get('shareSize', 'mid');
  return SHARE_SIZES.filter(x => x[0] === id)[0] || SHARE_SIZES[1];
};
const styleDef = () => SHARE_STYLES.filter(x => x[0] === shareStyle())[0] || SHARE_STYLES[0];

async function shareCard(a, kind) {
  const d = vd();

  /* The width matters more than it looks. The tile grid is auto-fit at a 92px
     minimum, so a wide stage gives four tiles across where his phone gives
     three - and four across is not the same screen. So it copies the width of
     a real card on the page, which on a phone IS his screen, and clamps it in
     case the export is run from a wide window. */
  const onScreen = document.querySelector('#main .card');
  const cardW = onScreen ? Math.round(onScreen.getBoundingClientRect().width) : 0;

  const shot = islandCard(d, {
    /* On by default: the point of a transparent PNG is that the photo is part
       of the picture, and a solid panel over your own body is a sticker. Off
       is there for a busy photo, where see-through costs you the numbers. */
    seethru: !!styleDef()[2],
    /* The picture is the card, so if the Spent tile is on your Today it is in
       the picture. hideSpend keeps it out, and starts on. */
    money: !S.get('hideSpend', 1),
    /* On screen the date is in the app's header a few pixels above this card.
       A picture leaves the header behind, so the card takes the date itself,
       in the shape every other card in here uses for a heading. */
    title: new Date(d + 'T12:00:00').toLocaleDateString(undefined,
      { weekday: 'long', day: 'numeric', month: 'long' }),
  });

  try {
    await IO.saveShot(shot, 'status-' + (a && a.rank ? a.rank.k : 'day') + '-' + kind, {
      w: 1080, h: kind === 'story' ? 1920 : 1350,
      /* The gradient still fills the frame; only the card shrinks. */
      fill: shareSize()[2],
      /* On by default. It is the thing that makes one picture work on a dark
         photo and a bright one without asking him which he has. */
      scrim: !!styleDef()[3],
      width: Math.max(340, Math.min(440, cardW || 390)),
      /* The reading is sized by measuring, and this copy has never been
         measured - without this a long one clips in the picture while looking
         fine on the screen it was copied from. */
      before: n => fitHero(n),
    });
  } catch (e) { /* saveShot has already said so */ }
}

function drawTrends(m) {
  /* The rank goes first: it is the answer to "how am I doing", and everything
     under it is the working. */
  m.appendChild(rankCard());
  const e = TD.estimate();
  const c = card('TDEE', e.basis === 'measured' ? 'measured' : 'starting estimate');
  if (e.tdee == null) {
    c.appendChild(el('div', 'empty', 'Log a weight and this starts working'));
  } else if (e.basis !== 'measured') {
    c.appendChild(el('div', 'hero', e.tdee.toLocaleString() + '<span class="u">kcal/day</span>'));
    c.appendChild(el('div', 'note', 'Your weight × ' + TD.perLb() + '. Measured once there is ' + esc(e.why || 'more data')));
  } else {
    /* two numbers, kept apart on purpose */
    const sp = el('div', 'split');
    sp.innerHTML =
      '<div><div class="k">' + (e.predicted || e.tdee).toLocaleString() + '</div><div class="kl">now' +
        (e.err ? ', ±' + e.err.toLocaleString() : '') + '</div></div>' +
      '<div><div class="k muted">' + e.observed.toLocaleString() + '</div><div class="kl">measured, ' + e.calDays + ' days</div></div>';
    c.appendChild(sp);
    c.appendChild(el('div', 'note',
      'You ate ' + e.intake.toLocaleString() + ' kcal a day while your weight went ' +
      (e.rate > 0 ? 'up ' : 'down ') + r1(Math.abs(e.rate)) + ' ' + esc(TD.unit()) + ' a week.'));

    /* rounded, because "reading lower by 0 kcal" is a sentence about nothing */
    if (Math.round(e.adj)) {
      c.appendChild(el('div', 'note', 'Reading ' + (e.adj > 0 ? 'higher' : 'lower') +
        ' by ' + Math.abs(Math.round(e.adj)) + ' kcal today: steps are ' +
        (e.stepDelta < 0 ? 'down ' : 'up ') + Math.abs(Math.round(e.stepDelta)) + ' on your normal. ' +
        (e.stepSrc && e.stepSrc.indexOf('population') === 0
          ? 'Using a population figure until it has learned yours.'
          : 'Using your own rate, ' + esc(e.stepSrc || '') + '.')));
    }
    if (e.sleepNote) c.appendChild(el('div', 'note', esc(e.sleepNote)));
    /* Only when guessed food is actually part of it, because otherwise the
       band is the scale and saying so adds nothing. */
    if (e.errGuess >= 25) c.appendChild(el('div', 'note',
      '±' + e.errGuess.toLocaleString() + ' of that is food you marked unsure. Weigh more of it and the band closes.'));

    const cf = el('div');
    cf.innerHTML = '<div class="note">Confidence ' + e.conf + '%</div><div class="conf"><i style="width:' + e.conf + '%"></i></div>';
    c.appendChild(cf);
  }
  m.appendChild(c);

  /* what is actually plotted, not the trend window — they were different
     numbers and the label was quoting the wrong one */
  const plotted = (e.series || e.rows).length;
  const c2 = card('Weight', plotted + ' days');

  /* ── the range, on the chart ──
     Tom, 2026-09-05: "different tabs if we're in STATUS." It was a setting
     called "History read" three screens away, which is a strange place for
     the answer to "show me the last month".

     It is the SAME setting, moved rather than copied. It decides how far back
     everything is read, the estimate included, so a chart-only version would
     draw ninety days beside a TDEE worked out from three years and the two
     would quietly disagree. One control, where it is used. */
  const lbNow = num(S.get('lookback', 0), 0) || 0;
  const lbSeg2 = el('div', 'seg');
  [[30, '30d'], [90, '90d'], [365, '1y'], [0, 'All']].forEach(([n, lbl]) => {
    const b = el('button', lbNow === n ? 'on' : '', lbl);
    b.onclick = () => { S.set('lookback', n); TD._dirty = true; Mobile.feedback('select'); draw(); };
    lbSeg2.appendChild(b);
  });
  c2.appendChild(lbSeg2);

  c2.appendChild(weightChart(e));
  const w = TD.lastWeight(e.rows), goal = num(S.get('goalWeight', null));

  /* Three lines is two more than the eye can identify unaided, so name them —
     and only name the ones actually drawn. */
  const goalOn2 = S.get('goalDate', '') || '';
  const ahead = goal != null && goalOn2 && goalOn2 > Day.today();
  const keys = [['avg', '7-day average']];
  if (ahead) keys.push(['reality', 'to hit ' + r1(goal) + ' by ' + Day.short(goalOn2)]);
  const showPredict = ahead && !!(e.predicted || e.tdee);
  /* Three futures, named for the question each answers. "Where you are
     heading" was doing for one line what now needs three, and the difference
     between eating your target and eating what you actually eat is the whole
     point of drawing both. */
  if (showPredict) keys.push(['predict', 'if you eat your target']);
  if (ahead && e.intake != null) keys.push(['actual', 'if you keep eating as you have']);
  if (ahead && e.intake != null && e.err) keys.push(['cone', 'the give-or-take on that']);
  if (keys.length > 1) {
    const lg = el('div', 'legend');
    keys.forEach(k => {
      const it = el('span', 'lgi');
      it.innerHTML = '<i class="' + k[0] + '"></i>' + esc(k[1]);
      lg.appendChild(it);
    });
    c2.appendChild(lg);
  }

  /* ── the verdict ──
     The whole reason for two future lines: one says where you must be, the
     other where you will be. The useful sentence is the gap between them. */
  if (showPredict) {
    const nowW2 = (e.roll && e.roll.length) ? e.roll[e.roll.length - 1].y : w;
    const days = Day.diff(goalOn2, Day.today());
    const pr = predictWeight(nowW2, days);
    if (pr && pr.pts.length) {
      const end = pr.pts[pr.pts.length - 1].w;
      const miss = end - goal;
      const rate = (nowW2 - end) / Math.max(1, days) * 7;
      let line;
      if (Math.abs(miss) < 1) {
        line = 'At ' + pr.intake.toLocaleString() + ' kcal you land on <b>' + r1(end) +
          '</b> by ' + Day.short(goalOn2) + '. That is your goal.';
      } else if (miss > 0) {
        /* short of it: say by how much, and what it would actually take —
           solved with the same model the line uses, not a linear shortcut */
        const need = intakeToReach(nowW2, goal, days);
        line = 'At ' + pr.intake.toLocaleString() + ' kcal you reach <b>' + r1(end) + '</b> by ' +
          Day.short(goalOn2) + ', which is ' + r1(miss) + ' lb short.' +
          (need ? ' <b>' + need.toLocaleString() + '</b> a day would get you there.' : '');
      } else {
        line = 'At ' + pr.intake.toLocaleString() + ' kcal you pass your goal, reaching <b>' +
          r1(end) + '</b> by ' + Day.short(goalOn2) + '.';
      }
      /* Say which TDEE this rests on. A number from your own logging and one
         from bodyweight × 13 deserve different amounts of trust, and the only
         way you can weigh that is if the sentence tells you which it is. */
      const src = e.basis === 'measured'
        ? 'a measured TDEE of ' + Math.round(pr.tdee).toLocaleString() + ', ' + e.conf + '% confident'
        : 'a starting estimate of ' + Math.round(pr.tdee).toLocaleString() +
          ' (bodyweight × ' + r1(TD.perUnit()) + '), which sharpens as you log';
      c2.appendChild(el('div', 'note derived', line +
        ' <span style="opacity:.8">That is ' + r1(Math.abs(rate)) + ' ' + esc(TD.unit()) + ' a week, from ' + src + '.</span>'));
      if (pr.settles && pr.settles > 0 && Math.abs(pr.settles - goal) > 2) {
        c2.appendChild(el('div', 'note derived',
          'Held forever, that intake settles you around <b>' + r1(pr.settles) + ' lb</b>.'));
      }
    }
  }
  c2.appendChild(el('div', 'note', (w ? r1(w) + ' lb' : 'nothing logged') +
    (goal != null && w ? ' · ' + r1(Math.abs(w - goal)) + ' lb to go' : '') +
    (e.rate != null ? ' · ' + (e.rate > 0 ? '+' : '') + r1(e.rate) + ' ' + esc(TD.unit()) + ' a week' : '')));
  m.appendChild(c2);

  if (e.basis === 'measured' && e.learn && e.learn.steps) {
    const ls = e.learn.steps;
    const c4 = card('What steps do to you');
    if (ls.k != null) {
      c4.appendChild(el('div', 'hero', Math.round(ls.k * 1000) + '<span class="u">kcal per 1,000 steps</span>'));
      c4.appendChild(el('div', 'note', 'Learned from ' + ls.n + ' two-week blocks of your own data.'));
    } else {
      c4.appendChild(el('div', 'empty', 'Not learned yet: ' + esc(ls.why || '') + '. Needs a few two-week blocks with food and weight logged.'));
    }
    m.appendChild(c4);
  }

  /* Only what you asked to see. A field turned out of the visualiser is still
     logged and still on Today — it has simply stopped being one more row on a
     card that only works while you can take it in at a glance. */
  const c3 = card('Last 28 days');
  const shown = liveFields().filter(f => f.viz !== 0);
  if (!shown.length) c3.appendChild(el('div', 'empty', 'Nothing is set to show here'));
  shown.forEach(f => {
    const days = Day.last(28);
    const r = el('div');
    r.style.marginBottom = 'var(--s-3)';
    const hit = days.filter(d => { const v = value(d, f.id); if (v == null) return false; return f.target ? (f.dir === 'lte' ? v <= f.target : v >= f.target) : true; }).length;
    r.innerHTML = '<div style="display:flex;font-size:var(--f-1)"><b style="font-weight:600;color:var(--text-2)">' +
      esc(f.label) + '</b><span class="mono muted" style="margin-left:auto">' + hit + '/28</span></div>';
    const g = el('div', 'grid28');
    /* Its own colour, so twelve stacked grids are twelve things rather than
       one accent-coloured smear. Set on the row and inherited by the cells,
       which keeps it one property instead of twenty-eight. */
    g.style.setProperty('--cell', fieldColor(f));
    days.forEach(d => {
      const v = value(d, f.id);
      const on = v != null && (!f.target || (f.dir === 'lte' ? v <= f.target : v >= f.target));
      g.appendChild(el('i', on ? 'on' : (v != null ? 'part' : '')));
    });
    r.appendChild(g);
    c3.appendChild(r);
  });
  m.appendChild(c3);
}

/* raw weights as dots, the 7-day average as the line, the goal as a dash */
/* ── the prediction ──
   Two different questions, and the chart should answer both:

     the LINE OF REALITY is where you have to be to arrive on time
     the PREDICTION is where you will actually be if nothing changes

   Above the reality line and below the prediction is the only combination
   that means "on track and going to make it".

   The arithmetic: eat `intake` against a measured TDEE and the daily shortfall
   is `tdee - intake`, which at `ed` kilocalories per pound is that much weight
   a day. But TDEE is not a constant — a smaller body costs less to run, so the
   shortfall shrinks as you lose and the loss slows. Modelling that is the
   difference between a line that is roughly right for a fortnight and one that
   is still honest in three months, and it is why real weight loss curves
   rather than running straight into the floor.

   The part of TDEE that scales with mass is taken as `perLb` kcal per pound —
   the same population figure the estimator already falls back on. Whatever is
   left over is treated as fixed. That is a simplification, and it is the
   reason this is drawn as a thin dotted line rather than a promise.        */
/* What intake actually lands on `goal` in `days`, according to the same model
   the line is drawn from. Solved by bisection rather than algebra, because the
   model recomputes the burn each day and inverting that in closed form buys
   nothing — twenty-four halvings on a bounded range is exact to the calorie
   and takes no measurable time.

   Doing it this way matters: the obvious shortcut is deficit = (lb to lose ×
   kcal per lb) ÷ days, which is the LINEAR answer. Recommending a linear
   number beside a curved line means the app disagrees with itself, and the
   recommendation would leave you short. */
function intakeToReach(w0, goalW, days) {
  if (!w0 || goalW == null || days < 1) return null;
  const at = intake => {
    const pr = predictWeight(w0, days, intake);
    return pr ? pr.pts[pr.pts.length - 1].w : null;
  };
  let lo = 500, hi = 6000;
  if (at(hi) < goalW) return hi;      /* even eating freely you would get there */
  if (at(lo) > goalW) return null;    /* not reachable on any sane intake */
  for (let i = 0; i < 24; i++) {
    const mid = (lo + hi) / 2;
    if (at(mid) > goalW) hi = mid; else lo = mid;
  }
  return Math.round((lo + hi) / 2);
}

function predictWeight(w0, days, intakeOver, tdeeOver) {
  const e = TD.estimate();
  const tdee = tdeeOver != null ? tdeeOver : (e.predicted != null ? e.predicted : e.tdee);
  const intake = intakeOver != null ? intakeOver : calTarget().v;
  if (!tdee || !intake || !w0) return null;

  const P = TD.P();
  /* Per logged unit, not per pound — see TD.lbPer(). */
  const ed = (P.ed || 3500) * TD.lbPer();
  const perLb = (P.perLb || 13) * TD.lbPer();
  /* split the measured TDEE into the part that follows body mass and the part
     that does not, using this body as the reference point */
  const fixed = tdee - w0 * perLb;

  const out = [];
  let w = w0;
  for (let i = 0; i <= days; i++) {
    out.push({ i: i, w: w });
    const burn = fixed + w * perLb;
    w = w - (burn - intake) / ed;
    if (!isFinite(w) || w <= 0) break;
  }
  return { pts: out, tdee: tdee, intake: intake, settles: perLb > 0 ? (intake - fixed) / perLb : null };
}

/* ── the weight chart ──
   Three things are drawn: the raw weigh-ins, the 7-day average, and the line
   of reality — a straight line from where you are now to your goal weight on
   your goal date. That line is the point of the chart. It answers "am I on
   track", which a trailing average alone never does: you can only tell by
   whether the accent line sits above or below it.

   The x-axis therefore has to reach into the future far enough to include the
   goal date, and the y-axis has to include both the data and the goal. That
   used to be done by stretching the y-axis to swallow the goal, which meant
   the further away your goal was, the flatter and more useless the actual
   trend became — exactly backwards. The scale is configurable now, and when
   it is left on auto it fits the data first and only widens for the goal if
   the goal is close enough not to crush everything else. */
function weightChart(e) {
  const W = 320, H = 172, PL = 34, PR = 8, PT = 10, PB = 18;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('class', 'chart');
