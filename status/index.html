<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:contain}
body{
  background:var(--bg);color:var(--text-1);font-family:var(--font-body);font-size:15px;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
header{
  display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  flex:0 0 auto;border-bottom:1px solid var(--border);background:var(--surface-1);
}
.logo{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.2em}
.logo b{color:var(--accent)}
.spacer{flex:1}
.date{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.05em}
.btn{
  padding:8px 12px;min-height:34px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-2);cursor:pointer;
  font-family:var(--font-display);font-size:11px;letter-spacing:.1em;
}
.btn:active{border-color:var(--accent);color:var(--accent)}
.btn.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.wide{width:100%}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 130px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

.card{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-1);padding:13px}
h2{font-family:var(--font-display);font-size:10.5px;letter-spacing:.2em;color:var(--text-muted);
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
h2 .sub{margin-left:auto;letter-spacing:.05em;font-family:var(--font-mono);color:var(--text-muted)}
.empty{color:var(--text-muted);line-height:1.65;font-size:13.5px}
.muted{color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.sm{font-size:12px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px}
.tile{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-2);
  padding:9px;text-align:left;cursor:pointer;min-height:68px;display:flex;flex-direction:column;gap:2px}
.tile:active{border-color:var(--accent)}
.tile .lb{font-family:var(--font-display);font-size:9.5px;letter-spacing:.14em;color:var(--text-muted)}
.tile .vl{font-family:var(--font-mono);font-size:19px;line-height:1.15;color:var(--text-1)}
.tile .un{font-size:10px;color:var(--text-muted);margin-left:2px}
.tile.done .vl{color:var(--accent)}
.tile.todo .vl{color:var(--text-muted)}
.tile .bar{height:3px;border-radius:2px;background:var(--surface-3);margin-top:auto;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.tile.over .bar i{background:var(--warn)}

.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);
  border-radius:var(--radius-md);background:var(--surface-2);margin-bottom:6px;min-height:46px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;color:var(--text-muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .fig{font-family:var(--font-mono);font-size:13px;color:var(--text-2);flex:0 0 auto;text-align:right}
.row .x{flex:0 0 auto;width:32px;height:32px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:none;color:var(--text-muted);cursor:pointer;font-size:15px}
.row.tap{cursor:pointer}

.macro{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.macro .top{display:flex;align-items:baseline;gap:6px;font-size:12px}
.macro .top b{font-family:var(--font-display);font-size:10px;letter-spacing:.14em;color:var(--text-muted);font-weight:600}
.macro .top .n{margin-left:auto;font-family:var(--font-mono);color:var(--text-2);font-size:12px}
.macro .track{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.macro .track i{display:block;height:100%;background:var(--accent)}
.macro.k1 .track i{background:var(--data-1)}
.macro.k2 .track i{background:var(--data-2)}
.macro.k3 .track i{background:var(--data-3)}
.macro.k4 .track i{background:var(--data-4)}
.macro.k5 .track i{background:var(--data-5)}
.macro.over .track i{background:var(--warn)}

#fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:40;
  width:58px;height:58px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);
  color:var(--accent-fg);font-size:28px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
#fab:active{transform:scale(.94)}
#fab i{position:absolute;top:3px;right:3px;width:12px;height:12px;border-radius:50%;
  background:var(--warn);border:2px solid var(--surface-1);display:none}
#fab.dot i{display:block}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--surface-1);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 4px 11px;background:none;border:0;cursor:pointer;color:var(--text-muted);
  font-family:var(--font-display);font-size:9.5px;letter-spacing:.14em;display:flex;
  flex-direction:column;align-items:center;gap:3px;min-height:54px}
nav button .g{font-size:17px;line-height:1}
nav button.on{color:var(--accent)}

#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.open{display:block}
#sheet .veil{position:absolute;inset:0;background:var(--overlay);backdrop-filter:blur(3px)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;
  background:var(--surface-1);border-top:1px solid var(--border-strong);
  border-radius:var(--radius-md) var(--radius-md) 0 0;
  padding:14px 13px calc(18px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;animation:up var(--dur-fast) ease}
@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
#sheet h3{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--text-muted);
  margin-bottom:11px;display:flex;align-items:center;gap:8px}
#sheet h3 .x{margin-left:auto;background:none;border:0;color:var(--text-muted);font-size:19px;cursor:pointer;
  width:34px;height:34px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chip{padding:9px 13px;min-height:42px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-2);cursor:pointer;font-family:var(--font-mono);font-size:13px}
.chip:active,.chip.on{border-color:var(--accent);color:var(--accent);background:var(--surface-3)}
.chip.big{flex:1;min-width:54px;text-align:center;font-size:17px;padding:14px 6px}

input[type=text],input[type=search],input.num,textarea,select{
  width:100%;min-width:0;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--surface-2);color:var(--text-1);font:inherit}
input.num{font-family:var(--font-mono);font-size:23px;text-align:center;letter-spacing:.04em}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px}
label.fl{display:block;font-family:var(--font-display);font-size:9.5px;letter-spacing:.14em;
  color:var(--text-muted);margin:9px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stepper{display:flex;align-items:center;gap:7px}
.stepper input{flex:1;min-width:0}
.stepper button{width:46px;height:46px;flex:0 0 auto;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-2);font-size:19px;cursor:pointer}
.seg{display:flex;margin-bottom:10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden}
.seg button{flex:1;padding:9px 4px;background:var(--surface-2);border:0;border-right:1px solid var(--border);
  color:var(--text-muted);font-family:var(--font-display);font-size:10px;letter-spacing:.1em;cursor:pointer;min-height:40px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--surface-3);color:var(--accent)}

.shot{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.shot img{width:76px;height:76px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border)}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);flex:0 0 auto}

.chart{width:100%;height:172px;display:block}
.chart .gl{stroke:var(--border);stroke-width:1}
.chart .raw{fill:var(--text-muted)}
.chart .avg{fill:none;stroke:var(--data-1);stroke-width:2;stroke-linejoin:round}
.chart .goal{stroke:var(--data-3);stroke-width:1;stroke-dasharray:4 4;fill:none}
.chart .lab{fill:var(--text-muted);font-family:var(--font-mono);font-size:9px}

.grid28{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:5px}
.grid28 i{aspect-ratio:1;border-radius:2px;background:var(--surface-3);display:block}
.grid28 i.on{background:var(--accent)}
.grid28 i.part{background:var(--data-2)}

.conf{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.conf i{display:block;height:100%;background:var(--data-2)}
.big{font-family:var(--font-mono);font-size:31px;line-height:1.1}
.warnbox{border:1px solid var(--warn);border-radius:var(--radius-sm);padding:9px 10px;
  font-size:12.5px;line-height:1.55;color:var(--text-2);margin-bottom:9px}
.note{font-size:12px;color:var(--text-muted);line-height:1.55;margin-top:7px}
.sw{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);
  border-radius:var(--radius-md);background:var(--surface-2);margin-bottom:6px;min-height:44px}
.sw .nm{flex:1;min-width:0}
.sw .tg{width:46px;height:27px;border-radius:14px;background:var(--surface-3);border:1px solid var(--border-strong);
  position:relative;cursor:pointer;flex:0 0 auto}
.sw .tg i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:var(--text-muted);transition:all var(--dur-fast)}
.sw .tg.on{background:var(--surface-3);border-color:var(--accent)}
.sw .tg.on i{left:22px;background:var(--accent)}
</style>

<body>
<header>
  <div class="logo">STA<b>TUS</b></div>
  <div class="spacer"></div>
  <div class="date" id="hdate"></div>
  <button class="btn" onclick="openSettings()">SET</button>
  <button class="btn" onclick="location.href='../index.html'">◈</button>
</header>
<main><div class="wrap" id="main"></div></main>

<button id="fab" onclick="fastInput()">+<i></i></button>

<nav id="nav"></nav>

<div id="sheet"><div class="veil" onclick="closeSheet()"></div><div class="panel" id="sheetPanel"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   STATUS — sleep, weight, mood, energy, steps, food and money.
   One writer for every fact it owns. Everything through the shared store.
   ═══════════════════════════════════════════════════════════════════════ */

const APP = {
  id: 'status',
  name: 'Status',
  icon: '◐',
  blurb: 'sleep, weight, mood, food and money',
  types: ['field', 'ev', 'day', 'food', 'meal', 'spend', 'acct', 'shot'],
};

/* ── settings, all namespaced under status. ───────────────────────────── */
const S = {
  get(k, d) { const v = Rec.setting(APP.id, k); return v == null ? d : v; },
  set(k, v) { Rec.setting(APP.id, k, v); },
};

Skins.load('../shared/skins.json').then(() => { if (Skins.restore) Skins.restore(APP.id); else Skins.apply(Skins.for(APP.id)); });
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* the spreadsheet builder lives further down the file, so it is reached
   through a wrapper rather than by name — a name would be read now. */
IO.register({ app: APP.id, name: APP.name, types: APP.types, sheets: function () { return exportSheets(); } });
const uid = () => Rec.USER + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const esc = s => UI.esc(String(s == null ? '' : s));
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : (d == null ? null : d); };
const r1 = n => Math.round(n * 10) / 10;
const money = n => '₱' + Math.round(n).toLocaleString();

/* ══════════════ FIELDS — the things being tracked ══════════════
   A field is a definition. Its values live in `ev` rows, one row per field
   per day, holding a list of timestamped entries. That shape covers both
   "weigh once" and "log mood five times" without a second code path.      */

const SEED = [
  { id: 'weight', label: 'Weight',  unit: 'lb',    measure: 'number', once: 1, agg: 'last', step: .1,  dec: 1, keypad: 1, order: 1, on: 1 },
  { id: 'sleep',  label: 'Sleep',   unit: 'hrs',   measure: 'number', once: 1, agg: 'last', step: .5,  dec: 1, target: 7,     dir: 'gte', order: 2, on: 1,
    chips: [5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9] },
  { id: 'steps',  label: 'Steps',   unit: '',      measure: 'number', once: 1, agg: 'last', step: 500, dec: 0, target: 10000, dir: 'gte', keypad: 1, order: 3, on: 1,
    chips: [3000, 5000, 8000, 10000, 12000, 15000] },
  { id: 'mood',   label: 'Mood',    unit: '/5',    measure: 'scale',  once: 0, agg: 'avg',  order: 4, on: 1 },
  { id: 'energy', label: 'Energy',  unit: '/5',    measure: 'scale',  once: 0, agg: 'avg',  order: 5, on: 1 },
];

function seedFields() {
  if (S.get('seeded')) return;
  SEED.forEach(f => Rec.set('field', null, f.id, f));
  ['Cash', 'GCash', 'Card', 'Bank'].forEach((n, i) => Rec.set('acct', null, n.toLowerCase(), { name: n, order: i }));
  S.set('seeded', 1);
}

const fields = () => Rec.map('field');
const field = id => fields()[id] || null;
const liveFields = () => Object.values(fields()).filter(f => f.on).sort((a, b) => (a.order || 0) - (b.order || 0));

/* ── values ── */
function evList(date, fid) { const r = Rec.get('ev', date, fid); return r && r.e ? r.e : []; }

function evAdd(date, fid, v) {
  const f = field(fid) || {};
  const e = f.once ? [] : evList(date, fid).slice();
  e.push({ t: Date.now(), v: v });
  Rec.set('ev', date, fid, { e: e });
}
function evDrop(date, fid, t) {
  const e = evList(date, fid).filter(x => x.t !== t);
  if (e.length) Rec.set('ev', date, fid, { e: e }); else Rec.del('ev', date, fid);
}
function value(date, fid) {
  const e = evList(date, fid); if (!e.length) return null;
  const f = field(fid) || {};
  if (f.agg === 'sum') return e.reduce((a, x) => a + x.v, 0);
  if (f.agg === 'avg') return e.reduce((a, x) => a + x.v, 0) / e.length;
  return e[e.length - 1].v;
}
const logged = (date, fid) => evList(date, fid).length > 0;

/* ══════════════ FOOD ══════════════
   A `food` row is the label as printed, plus your own serving sizes on top
   of it. The label never changes; your servings are what you actually eat.
   A `meal` row is one logged serving with its numbers frozen in, so editing
   a food tomorrow never rewrites what you ate today.                       */

const NUTS = ['p', 'c', 'f', 'kcal', 'na', 'k', 'caff'];
const foods = () => Rec.map('food');

function foodServes(fd) {
  const out = [{ label: '1 serving (' + r1(num(fd.base.amt, 1)) + ' ' + (fd.base.unit || '') + ')', mult: 1 }];
  const u = String(fd.base.unit || '').toLowerCase();
  if ((u === 'g' || u === 'ml') && fd.base.amt > 0) out.push({ label: '100 ' + u, mult: 100 / fd.base.amt });
  (fd.serves || []).forEach(s => out.push(s));
  return out;
}
function scale(fd, mult) {
  const o = { mult: mult };
  NUTS.forEach(n => { o[n] = (num(fd.base[n], 0) || 0) * mult; });
  o.price = (num(fd.base.price, 0) || 0) * mult;
  o.amt = (num(fd.base.amt, 0) || 0) * mult;
  return o;
}
function logMeal(fd, mult, serveLabel) {
  const s = scale(fd, mult);
  const row = { fid: fd.id, name: fd.name, serve: serveLabel, unit: fd.base.unit, t: Date.now() };
  NUTS.forEach(n => { row[n] = s[n]; });
  row.price = s.price; row.amt = s.amt; row.mult = mult;
  Rec.set('meal', vd(), uid(), row);
  Rec.set('food', null, fd.id, Object.assign({}, fd, { uses: (fd.uses || 0) + 1, last: Day.today() }));
}
const meals = date => Rec.all('meal', { date: date }).map(r => Object.assign({ key: r.key }, r.payload)).sort((a, b) => a.t - b.t);

function dayTotals(date) {
  const t = { p: 0, c: 0, f: 0, kcal: 0, na: 0, k: 0, caff: 0, price: 0 };
  meals(date).forEach(m => { Object.keys(t).forEach(n => { t[n] += num(m[n], 0) || 0; }); });
  return t;
}
const TARGETS = () => S.get('targets', { p: 175, c: 200, f: 80, kcal: 2220, na: 3500, k: 4500 });

/* ══════════════ MONEY ══════════════ */
const accts = () => Object.values(Rec.map('acct')).sort((a, b) => (a.order || 0) - (b.order || 0));
const spends = date => Rec.all('spend', { date: date }).map(r => Object.assign({ key: r.key }, r.payload)).sort((a, b) => a.t - b.t);
const spendTotal = date => spends(date).reduce((a, s) => a + (num(s.amt, 0) || 0), 0);
/* Food prices are part of the meal row, never copied into a spend row.
   One writer per fact — the money screen adds them up as a derived line.  */
const dayMoney = date => spendTotal(date) + dayTotals(date).price;

/* ══════════════ TDEE ══════════════
   An empirical, adaptive estimator: what you ate, against what your weight
   actually did. Not a BMR equation. Built to the spec in the brief —
   7-day rolling average, regression over the trend, smoothed update.      */

const TD = {
  ed:    () => S.get('ed', 3500),      /* kcal per lb of change. Adjustable, not a law of physics. */
  alpha: () => S.get('alpha', .25),    /* how fast the estimate moves toward new evidence */
  win:   () => S.get('win', 28),       /* days of history the regression looks at */
  perLb: () => S.get('perLb', 13),     /* the starting guess before there is data: lb x 13 */
  guard: () => S.get('guard', 250),    /* the most one update may move the estimate */

  /* raw daily series over the window */
  series() {
    const days = Day.last(TD.win());
    return days.map(d => {
      const w = value(d, 'weight');
      const m = meals(d);
      const kcal = m.reduce((a, x) => a + (num(x.kcal, 0) || 0), 0);
      return { d: d, w: w, kcal: m.length && kcal > 0 ? kcal : null };
    });
  },

  /* 7-day rolling average of weight. Two conditions, both load-bearing:
     the window must be a FULL seven days, and it must hold at least three
     weigh-ins. Partial windows at the start of the range are averages of a
     different width, which bends the line and flattens the trend by a few
     percent — measured at 4% on a straight test series. Three readings is
     the floor below which it is noise wearing a trend's clothes.          */
  rolling(series) {
    const out = [];
    for (let i = 6; i < series.length; i++) {
      const win = series.slice(i - 6, i + 1).filter(x => x.w != null);
      if (win.length >= 3) out.push({ i: i, d: series[i].d, y: win.reduce((a, x) => a + x.w, 0) / win.length, n: win.length });
    }
    return out;
  },

  /* least squares over the rolling average: lb per day, and how clean it is */
  slope(pts) {
    const n = pts.length; if (n < 2) return { m: 0, r2: 0 };
    let sx = 0, sy = 0, sxy = 0, sxx = 0, syy = 0;
    pts.forEach(p => { sx += p.i; sy += p.y; sxy += p.i * p.y; sxx += p.i * p.i; syy += p.y * p.y; });
    const den = n * sxx - sx * sx; if (!den) return { m: 0, r2: 0 };
    const m = (n * sxy - sx * sy) / den;
    const num2 = n * sxy - sx * sy;
    const den2 = Math.sqrt(Math.max(0, (n * sxx - sx * sx) * (n * syy - sy * sy)));
    const r = den2 ? num2 / den2 : 0;
    return { m: m, r2: r * r };
  },

  state() { return S.get('tdeeState', null); },

  /* the estimate, with everything needed to judge it */
  estimate() {
    const ser = TD.series();
    const roll = TD.rolling(ser);
    const calDays = ser.filter(x => x.kcal != null);
    const weighIns = ser.filter(x => x.w != null).length;
    const lastW = TD.lastWeight();
    const baseline = lastW ? Math.round(lastW * TD.perLb()) : null;
    const st = TD.state();
    const old = st && st.v ? st.v : baseline;

    const out = {
      tdee: old, baseline: baseline, basis: 'baseline', rate: null, intake: null,
      conf: 0, calDays: calDays.length, weighIns: weighIns, roll: roll, series: ser, r2: 0, observed: null,
    };
    if (!lastW) { out.tdee = null; out.why = 'no weight logged yet'; return out; }
    if (calDays.length < 7) { out.why = calDays.length + ' of 7 days of food logged'; out.conf = Math.round(20 * calDays.length / 7); return out; }
    if (roll.length < 14) { out.why = roll.length + ' of 14 days of weight trend'; out.conf = Math.round(20 * roll.length / 14); return out; }

    const sl = TD.slope(roll);
    const intake = calDays.reduce((a, x) => a + x.kcal, 0) / calDays.length;
    const observed = intake - (sl.m * TD.ed());   /* losing weight = negative slope = TDEE above intake */
    let next = old + TD.alpha() * (observed - old);
    const g = TD.guard();
    if (Math.abs(next - old) > g) next = old + (next > old ? g : -g);

    const c1 = Math.min(1, calDays.length / 21);
    const c2 = Math.min(1, weighIns / Math.max(1, TD.win() * .7));
    const c3 = Math.min(1, sl.r2);
    const c4 = 1 - Math.min(1, Math.abs(observed - old) / 600);
    out.tdee = Math.round(next);
    out.observed = Math.round(observed);
    out.basis = 'measured';
    out.rate = sl.m * 7;              /* lb per week */
    out.intake = Math.round(intake);
    out.r2 = sl.r2;
    out.conf = Math.round(100 * (.30 * c1 + .25 * c2 + .25 * c3 + .20 * c4));
    return out;
  },

  lastWeight() {
    const days = Day.last(60);
    for (let i = days.length - 1; i >= 0; i--) { const w = value(days[i], 'weight'); if (w != null) return w; }
    return null;
  },

  /* the estimate only moves once a day, so opening the app twice cannot
     walk it twice. */
  tick() {
    const st = TD.state();
    if (st && st.at === Day.today()) return;
    const e = TD.estimate();
    if (e.tdee == null) return;
    S.set('tdeeState', { v: e.tdee, at: Day.today(), conf: e.conf, basis: e.basis });
  },

  /* what to eat to hit the goal rate */
  targetIntake() {
    const e = TD.estimate();
    if (e.tdee == null) return null;
    const rate = S.get('goalRate', 1.25);          /* lb per week, positive = losing */
    return Math.round(e.tdee - (rate * TD.ed() / 7));
  },
};
</script>

<script>
/* ══════════════ THE ENTRY SHEET ══════════════
   Everything you log slides up from the bottom, within thumb reach, and
   closes itself the moment the fact is saved.                            */

let sheetStack = [];
function openSheet(title, build, opts) {
  const box = document.getElementById('sheet'), p = document.getElementById('sheetPanel');
  p.innerHTML = '';
  const h = document.createElement('h3');
  h.innerHTML = '<span>' + esc(title) + '</span>';
  const x = document.createElement('button');
  x.className = 'x'; x.textContent = '✕'; x.onclick = closeSheet;
  h.appendChild(x); p.appendChild(h);
  const body = document.createElement('div');
  p.appendChild(body);
  build(body, { close: closeSheet, panel: p });
  box.classList.add('open');
  Sfx.play('open');
  if (opts && opts.focus) setTimeout(() => { const i = body.querySelector('input'); if (i) i.focus(); }, 60);
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetPanel').innerHTML = '';
  Sfx.play('close');
}

/* small builders ---------------------------------------------------- */
function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
function chipRow(vals, onPick, cls) {
  const w = el('div', 'chips');
  vals.forEach(v => {
    const b = el('button', 'chip' + (cls ? ' ' + cls : ''), esc(v.label != null ? v.label : v));
    b.onclick = () => onPick(v.value != null ? v.value : v);
    w.appendChild(b);
  });
  return w;
}
function numberInput(v, step, dec) {
  const w = el('div', 'stepper');
  const minus = el('button', null, '−'), plus = el('button', null, '+');
  const i = document.createElement('input');
  i.className = 'num'; i.type = 'text';
  i.inputMode = dec ? 'decimal' : 'numeric';
  i.setAttribute('pattern', dec ? '[0-9.]*' : '[0-9]*');
  i.value = v == null ? '' : String(v);
  const bump = d => {
    const cur = num(i.value, 0) || 0;
    const n = Math.max(0, cur + d * step);
    i.value = dec ? String(r1(n)) : String(Math.round(n));
  };
  minus.onclick = () => bump(-1); plus.onclick = () => bump(1);
  w.appendChild(minus); w.appendChild(i); w.appendChild(plus);
  w.input = i;
  return w;
}
function saveBar(label, fn) {
  const b = el('button', 'btn go wide', label || 'SAVE');
  b.style.marginTop = '12px'; b.style.minHeight = '50px';
  b.onclick = fn;
  return b;
}

/* ══════════════ PHOTOS ══════════════
   The camera comes through a plain file input, which is the one route that
   works on an iPhone opened from a folder. Pictures are shrunk before they
   are stored: a full phone photo is 3MB and the whole store is about 5MB. */

function pickPhoto(cb) {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  i.setAttribute('capture', 'environment');
  i.style.display = 'none';
  document.body.appendChild(i);
  i.onchange = () => {
    const f = i.files && i.files[0];
    document.body.removeChild(i);
    if (f) cb(f);
  };
  i.click();
}
function shrink(file, max, quality) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('could not read the photo'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('could not open the photo'));
      img.onload = () => {
        let w = img.width, h = img.height;
        const s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function saveShot(kind, dataUrl, ref) {
  const id = uid();
  Rec.set('shot', vd(), id, { img: dataUrl, kind: kind, ref: ref || null, t: Date.now() });
  return id;
}
const shotCount = () => Rec.all('shot').length;

/* ══════════════ READING TEXT OFF A PHOTO ══════════════
   Loaded from a CDN only when asked for, and only ever an assist. If it
   does not load, or reads nonsense, the manual form is right there with
   the picture beside it. Never a dependency.                              */

const OCR = {
  url: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  loading: null,
  load() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (OCR.loading) return OCR.loading;
    OCR.loading = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = OCR.url;
      s.onload = () => res(window.Tesseract);
      s.onerror = () => rej(new Error('offline'));
      document.head.appendChild(s);
      setTimeout(() => rej(new Error('timeout')), 20000);
    }).catch(e => { OCR.loading = null; throw e; });
    return OCR.loading;
  },
  read(dataUrl, onProgress) {
    return OCR.load().then(T => T.recognize(dataUrl, 'eng', {
      logger: m => { if (m.status === 'recognizing text' && onProgress) onProgress(m.progress); },
    })).then(r => r.data.text || '');
  },
};

/* pull a number that follows a word, tolerating the usual label noise */
function grab(text, words, unit) {
  const t = text.replace(/[,]/g, '').toLowerCase();
  for (let i = 0; i < words.length; i++) {
    const re = new RegExp(words[i] + '[^0-9\\n]{0,24}([0-9]+(?:\\.[0-9]+)?)\\s*' + (unit || ''), 'i');
    const m = t.match(re);
    if (m) return parseFloat(m[1]);
  }
  return null;
}
function parseLabel(text) {
  const o = {};
  o.kcal = grab(text, ['energy', 'calories', 'calorie', 'kcal']);
  o.p    = grab(text, ['protein'], 'g?');
  o.c    = grab(text, ['total carbohydrate', 'carbohydrate', 'carbs', 'carb'], 'g?');
  o.f    = grab(text, ['total fat', 'fat'], 'g?');
  o.na   = grab(text, ['sodium'], 'mg?');
  o.k    = grab(text, ['potassium'], 'mg?');
  o.caff = grab(text, ['caffeine'], 'mg?');
  const sz = text.match(/serving size[^0-9\n]{0,20}([0-9]+(?:\.[0-9]+)?)\s*(g|ml|mL|G|ML)/i);
  if (sz) { o.amt = parseFloat(sz[1]); o.unit = sz[2].toLowerCase(); }
  return o;
}
function parseReceipt(text) {
  const o = {};
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++) {
    if (/total/i.test(lines[i]) && !/sub\s*total/i.test(lines[i])) {
      const m = lines[i].replace(/,/g, '').match(/([0-9]+(?:\.[0-9]{1,2})?)/g);
      if (m && m.length) { o.amt = parseFloat(m[m.length - 1]); break; }
    }
  }
  if (o.amt == null) {
    const all = (text.replace(/,/g, '').match(/[0-9]+\.[0-9]{2}/g) || []).map(parseFloat);
    if (all.length) o.amt = Math.max.apply(null, all);
  }
  if (lines.length) o.note = lines[0].slice(0, 40);
  return o;
}

/* the photo strip used by both the label reader and the receipt reader */
function photoBlock(body, kind, onText, onShot) {
  const wrap = el('div', 'shot');
  const status = el('div', 'note', 'Take a picture and I will try to read it. If that fails, or you are offline, type it in — the picture stays attached either way.');
  let imgEl = null;
  const take = el('button', 'btn', '📷 PHOTO');
  take.onclick = () => pickPhoto(file => {
    status.textContent = 'shrinking…';
    shrink(file, 1400, .8).then(big => {
      return shrink(file, 360, .6).then(small => {
        const id = saveShot(kind, small);
        if (onShot) onShot(id, small);
        if (!imgEl) { imgEl = document.createElement('img'); wrap.insertBefore(imgEl, wrap.firstChild); }
        imgEl.src = small;
        status.textContent = 'reading…';
        return OCR.read(big, p => { status.textContent = 'reading… ' + Math.round(p * 100) + '%'; })
          .then(txt => { status.textContent = 'read it — check every number before saving.'; onText(txt); })
          .catch(() => { status.textContent = 'could not read the picture. Type the numbers in — the photo is saved.'; });
      });
    }).catch(e => { status.textContent = 'could not use that photo: ' + e.message; });
  });
  const col = el('div');
  col.style.flex = '1';
  col.appendChild(take);
  col.appendChild(status);
  wrap.appendChild(col);
  body.appendChild(wrap);
}
</script>

<script>
/* ══════════════ THE FAST INPUT ══════════════
   One tap to open, one tap to log. Anything measured once a day drops off
   this list the moment it is logged, so what is left is only what is left
   to do.                                                                  */

const outstanding = () => liveFields().filter(f => f.once && !logged(vd(), f.id));

function fastInput() {
  openSheet('LOG', body => {
    const out = outstanding();
    const multi = liveFields().filter(f => !f.once);
    if (!Day.isToday(vd())) body.appendChild(el('div', 'note', 'Logging into <b>' + esc(Day.label(vd())) + '</b>, not today.'));

    if (out.length) {
      const g = el('div');
      out.forEach(f => {
        const b = el('button', 'btn wide', f.label.toUpperCase() + (f.target ? '  <span class="muted mono">' + (f.dir === 'lte' ? '≤' : '≥') + ' ' + f.target + '</span>' : ''));
        b.style.cssText = 'margin-bottom:7px;min-height:52px;text-align:left';
        b.onclick = () => fieldSheet(f, vd());
        g.appendChild(b);
      });
      body.appendChild(g);
      body.appendChild(el('div', 'note', 'These are the once-a-day ones still open. They disappear from here once logged.'));
      body.appendChild(el('div', null, '&nbsp;'));
    }

    const row = el('div', 'grid2');
    multi.forEach(f => {
      const b = el('button', 'btn wide', f.label.toUpperCase());
      b.style.minHeight = '52px';
      b.onclick = () => fieldSheet(f, vd());
      row.appendChild(b);
    });
    const fb = el('button', 'btn wide', '🍽 FOOD');       fb.style.minHeight = '52px'; fb.onclick = foodPicker;
    const sb = el('button', 'btn wide', '₱ SPEND');       sb.style.minHeight = '52px'; sb.onclick = () => spendSheet();
    row.appendChild(fb); row.appendChild(sb);
    body.appendChild(row);
  });
}

/* ── one field, one sheet ── */
function fieldSheet(f, date) {
  if (f.measure === 'scale') return scaleSheet(f, date);
  return numberSheet(f, date);
}

function numberSheet(f, date) {
  const d = date || Day.today();
  openSheet(f.label.toUpperCase() + (Day.isToday(d) ? '' : ' · ' + Day.short(d)), body => {
    const cur = value(d, f.id);
    let prev = null, prevAgo = 0;
    const back = Day.last(30, Day.shift(d, -1));
    for (let i = back.length - 1; i >= 0; i--) { const v = value(back[i], f.id); if (v != null) { prev = v; prevAgo = Day.diff(d, back[i]); break; } }

    const inp = numberInput(cur != null ? cur : prev, f.step || 1, f.dec ? 1 : 0);
    const commit = v => {
      if (v == null || !isFinite(v)) return UI.toast('type a number first', { bad: true });
      evAdd(d, f.id, v);
      Sfx.play(f.target && (f.dir === 'lte' ? v <= f.target : v >= f.target) ? 'done' : 'tick');
      afterLog();
    };

    if (f.chips && f.chips.length) {
      body.appendChild(chipRow(f.chips.map(v => ({ label: String(v), value: v })), v => commit(v)));
    }
    body.appendChild(inp);
    if (prev != null) {
      const p = el('button', 'btn wide', 'SAME AS LAST · ' + prev + ' ' + (f.unit || '') + '  <span class="muted">(' + (prevAgo === 1 ? 'yesterday' : prevAgo + ' days ago') + ')</span>');
      p.style.marginTop = '8px';
      p.onclick = () => commit(prev);
      body.appendChild(p);
    }
    body.appendChild(saveBar('SAVE ' + f.label.toUpperCase(), () => commit(num(inp.input.value))));
    if (f.target) body.appendChild(el('div', 'note', 'Target ' + (f.dir === 'lte' ? 'at most ' : 'at least ') + f.target + ' ' + (f.unit || '') + '.'));
  }, { focus: !f.chips });
}

function scaleSheet(f, date) {
  const d = date || Day.today();
  const WORDS = { 1: 'bad', 2: 'low', 3: 'ok', 4: 'good', 5: 'great' };
  openSheet(f.label.toUpperCase(), body => {
    const w = el('div', 'chips');
    [1, 2, 3, 4, 5].forEach(v => {
      const b = el('button', 'chip big', v + '<div class="muted" style="font-size:9px;letter-spacing:.1em">' + WORDS[v] + '</div>');
      b.onclick = () => { evAdd(d, f.id, v); Sfx.play('tick'); afterLog(); };
      w.appendChild(b);
    });
    body.appendChild(w);

    const list = evList(d, f.id);
    if (list.length) {
      body.appendChild(el('div', 'note', 'Logged today — tap ✕ to remove one.'));
      list.slice().reverse().forEach(e => {
        const r = el('div', 'row');
        r.innerHTML = '<span class="nm">' + e.v + ' / 5</span><span class="fig">' + new Date(e.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</span>';
        const x = el('button', 'x', '✕');
        x.onclick = () => { evDrop(d, f.id, e.t); scaleSheet(f, d); };
        r.appendChild(x);
        body.appendChild(r);
      });
    } else {
      body.appendChild(el('div', 'note', 'Log this as many times a day as you like. The tile shows the average, the history keeps every one.'));
    }
  });
}

/* after any log: if that was the last outstanding once-a-day thing, say so */
function afterLog() {
  const left = outstanding().length;
  closeSheet();
  draw();
  if (!left) { Sfx.play('complete', { level: 2 }); UI.toast('daily check-in <b>done</b>'); }
}

/* ══════════════ SPENDING ══════════════
   Amount, account, details. The time fills itself in unless you change it. */

function spendSheet(existing) {
  openSheet(existing ? 'EDIT SPEND' : 'SPEND', body => {
    let shotId = existing ? existing.shot : null;
    let acct = existing ? existing.acct : S.get('lastAcct', (accts()[0] || {}).name || 'Cash');
    const when = new Date(existing ? existing.t : Date.now());

    const amt = numberInput(existing ? existing.amt : null, 50, 1);
    body.appendChild(el('label', 'fl', 'AMOUNT'));
    body.appendChild(amt);

    body.appendChild(el('label', 'fl', 'ACCOUNT'));
    const aw = el('div', 'chips');
    const paint = () => {
      aw.innerHTML = '';
      accts().forEach(a => {
        const b = el('button', 'chip' + (a.name === acct ? ' on' : ''), esc(a.name));
        b.onclick = () => { acct = a.name; paint(); };
        aw.appendChild(b);
      });
    };
    paint();
    body.appendChild(aw);

    body.appendChild(el('label', 'fl', 'DETAILS'));
    const note = document.createElement('input');
    note.type = 'text'; note.placeholder = 'what it was for';
    note.value = existing ? (existing.note || '') : '';
    body.appendChild(note);

    body.appendChild(el('label', 'fl', 'TIME'));
    const tm = document.createElement('input');
    tm.type = 'text'; tm.inputMode = 'numeric';
    tm.value = String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0');
    body.appendChild(tm);

    body.appendChild(el('label', 'fl', 'RECEIPT'));
    photoBlock(body, 'receipt', txt => {
      const g = parseReceipt(txt);
      if (g.amt != null) amt.input.value = String(g.amt);
      if (g.note && !note.value) note.value = g.note;
    }, id => { shotId = id; });

    body.appendChild(saveBar(existing ? 'UPDATE' : 'SAVE SPEND', () => {
      const v = num(amt.input.value);
      if (v == null || v <= 0) return UI.toast('how much?', { bad: true });
      const parts = String(tm.value).split(':');
      const dt = new Date(when);
      if (parts.length === 2) dt.setHours(num(parts[0], 0) || 0, num(parts[1], 0) || 0, 0, 0);
      const row = { amt: v, acct: acct, note: note.value.trim(), t: dt.getTime(), shot: shotId };
      Rec.set('spend', existing ? existing.date : vd(), existing ? existing.key : uid(), row);
      S.set('lastAcct', acct);
      Sfx.play('tick');
      closeSheet(); draw();
    }));
  }, { focus: !existing });
}
</script>

<script>
/* ══════════════ FOOD ══════════════ */

function foodPicker() {
  openSheet('FOOD', body => {
    const q = document.createElement('input');
    q.type = 'search'; q.placeholder = 'search your foods';
    body.appendChild(q);

    const list = el('div');
    list.style.marginTop = '9px';
    const paint = () => {
      const term = q.value.trim().toLowerCase();
      const all = Object.values(foods())
        .filter(f => !term || (f.name + ' ' + (f.brand || '')).toLowerCase().indexOf(term) > -1)
        .sort((a, b) => (b.uses || 0) - (a.uses || 0) || String(a.name).localeCompare(String(b.name)));
      list.innerHTML = '';
      if (!all.length) {
        list.appendChild(el('div', 'empty', Object.keys(foods()).length
          ? 'Nothing matches. Try fewer letters, or add it as a new food.'
          : 'No foods yet. Add one by photographing its nutrition panel, or type it in. Once it is in here, logging it is two taps.'));
      }
      all.slice(0, 40).forEach(f => {
        const r = el('div', 'row tap');
        r.innerHTML = '<span class="nm">' + esc(f.name) +
          '<small>' + esc(f.brand || '') + (f.brand ? ' · ' : '') + r1(num(f.base.amt, 0)) + ' ' + esc(f.base.unit || '') + ' · ' +
          Math.round(num(f.base.kcal, 0)) + ' kcal · ' + r1(num(f.base.p, 0)) + 'p</small></span>';
        r.onclick = () => amountSheet(f);
        const e = el('button', 'x', '✎');
        e.onclick = ev => { ev.stopPropagation(); foodEditor(f); };
        r.appendChild(e);
        list.appendChild(r);
      });
    };
    q.oninput = paint; paint();
    body.appendChild(list);

    const add = el('button', 'btn go wide', '+ NEW FOOD');
    add.style.cssText = 'margin-top:10px;min-height:50px';
    add.onclick = () => foodEditor(null);
    body.appendChild(add);
  });
}

/* how much of it — servings, straight units, or "however much hits 50g protein" */
function amountSheet(fd) {
  openSheet(esc(fd.name).toUpperCase(), body => {
    const serves = foodServes(fd);
    let mode = 'serve', si = Math.min(fd.dflt || 0, serves.length - 1), mult = serves[si].mult;

    const seg = el('div', 'seg');
    const out = el('div');
    const preview = el('div');

    const setMult = m => { mult = m > 0 ? m : 0; paintPreview(); };

    function paintPreview() {
      const s = scale(fd, mult);
      preview.innerHTML =
        '<div class="row" style="margin-top:10px"><span class="nm">' + r1(s.amt) + ' ' + esc(fd.base.unit || '') +
        '<small>' + r1(mult) + ' × the label serving</small></span>' +
        '<span class="fig">' + Math.round(s.kcal) + ' kcal<br>' + r1(s.p) + 'p · ' + r1(s.c) + 'c · ' + r1(s.f) + 'f</span></div>' +
        (s.price ? '<div class="note">Costs ' + money(s.price) + ', which lands on the money screen too.</div>' : '');
    }

    function paintMode() {
      seg.innerHTML = '';
      [['serve', 'SERVINGS'], ['unit', (fd.base.unit || 'UNITS').toUpperCase()], ['hit', 'TO HIT ⌖']].forEach(m => {
        const b = el('button', mode === m[0] ? 'on' : '', m[1]);
        b.onclick = () => { mode = m[0]; paintMode(); };
        seg.appendChild(b);
      });
      out.innerHTML = '';

      if (mode === 'serve') {
        const cw = el('div', 'chips');
        serves.forEach((s, i) => {
          const b = el('button', 'chip' + (i === si ? ' on' : ''), esc(s.label));
          b.onclick = () => { si = i; setMult(s.mult * (num(qty.input.value, 1) || 1)); paintMode(); };
          cw.appendChild(b);
        });
        out.appendChild(cw);
        var qty = numberInput(r1(mult / serves[si].mult), .5, 1);
        qty.input.oninput = () => setMult(serves[si].mult * (num(qty.input.value, 0) || 0));
        out.appendChild(el('label', 'fl', 'HOW MANY'));
        out.appendChild(qty);
      } else if (mode === 'unit') {
        const a = numberInput(r1(mult * num(fd.base.amt, 0)), Math.max(1, Math.round(num(fd.base.amt, 100) / 10)), 1);
        a.input.oninput = () => setMult((num(a.input.value, 0) || 0) / (num(fd.base.amt, 1) || 1));
        out.appendChild(el('label', 'fl', 'HOW MUCH, IN ' + (fd.base.unit || 'UNITS').toUpperCase()));
        out.appendChild(a);
        out.appendChild(chipRow([50, 100, 150, 200, 250, 500].map(v => ({ label: String(v), value: v })), v => {
          a.input.value = String(v); setMult(v / (num(fd.base.amt, 1) || 1));
        }));
      } else {
        let key = 'p';
        const kw = el('div', 'chips');
        [['p', 'PROTEIN g'], ['kcal', 'CALORIES']].forEach(k => {
          const b = el('button', 'chip' + (key === k[0] ? ' on' : ''), k[1]);
          b.onclick = () => { key = k[0]; paintMode(); };
          kw.appendChild(b);
        });
        out.appendChild(el('label', 'fl', 'HIT THIS MUCH'));
        out.appendChild(kw);
        const per = num(fd.base[key], 0) || 0;
        if (per <= 0) {
          out.appendChild(el('div', 'warnbox', 'This food has no ' + (key === 'p' ? 'protein' : 'calorie') + ' figure on its label, so there is nothing to solve for. Edit the food and add it.'));
        } else {
          const t = numberInput(key === 'p' ? 50 : 500, key === 'p' ? 5 : 50, 0);
          t.input.oninput = () => setMult((num(t.input.value, 0) || 0) / per);
          out.appendChild(t);
          setMult((num(t.input.value, 0) || 0) / per);
        }
      }
      paintPreview();
    }

    body.appendChild(seg);
    body.appendChild(out);
    body.appendChild(preview);
    paintMode();

    body.appendChild(saveBar('LOG IT', () => {
      if (!mult || mult <= 0) return UI.toast('how much?', { bad: true });
      logMeal(fd, mult, mode === 'serve' ? serves[si].label : (mode === 'unit' ? r1(mult * num(fd.base.amt, 0)) + ' ' + (fd.base.unit || '') : 'to target'));
      Sfx.play('tick');
      closeSheet(); draw();
    }));
  });
}

/* the food itself: the label as printed, then your own servings on top */
function foodEditor(fd) {
  const isNew = !fd;
  const f = fd ? JSON.parse(JSON.stringify(fd)) : { id: uid(), name: '', brand: '', base: { amt: 100, unit: 'g' }, serves: [], uses: 0 };
  openSheet(isNew ? 'NEW FOOD' : 'EDIT FOOD', body => {
    const inputs = {};
    let shotId = f.shot || null;

    photoBlock(body, 'label', txt => {
      const g = parseLabel(txt);
      Object.keys(g).forEach(k => { if (g[k] != null && inputs[k]) inputs[k].value = String(g[k]); });
      UI.toast('read what it could — <b>check every number</b>');
    }, id => { shotId = id; });

    const mk = (key, label, val, wide) => {
      const w = el('div');
      w.appendChild(el('label', 'fl', label));
      const i = document.createElement('input');
      i.type = 'text';
      if (key !== 'name' && key !== 'brand' && key !== 'unit') { i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*'); }
      i.value = val == null ? '' : String(val);
      inputs[key] = i; w.appendChild(i);
      if (wide) w.style.gridColumn = '1 / -1';
      return w;
    };

    body.appendChild(mk('name', 'NAME', f.name, 1));
    const g1 = el('div', 'grid2');
    g1.appendChild(mk('brand', 'BRAND / PLACE', f.brand));
    g1.appendChild(mk('cat', 'GROUP', f.cat));
    body.appendChild(g1);

    body.appendChild(el('label', 'fl', 'ONE SERVING AS PRINTED ON THE LABEL'));
    const g2 = el('div', 'grid2');
    g2.appendChild(mk('amt', 'AMOUNT', f.base.amt));
    g2.appendChild(mk('unit', 'UNIT (g, ml, pc)', f.base.unit));
    body.appendChild(g2);

    const g3 = el('div', 'grid3');
    g3.appendChild(mk('kcal', 'CALORIES', f.base.kcal));
    g3.appendChild(mk('p', 'PROTEIN g', f.base.p));
    g3.appendChild(mk('c', 'CARBS g', f.base.c));
    g3.appendChild(mk('f', 'FAT g', f.base.f));
    g3.appendChild(mk('na', 'SODIUM mg', f.base.na));
    g3.appendChild(mk('k', 'POTASSIUM mg', f.base.k));
    g3.appendChild(mk('caff', 'CAFFEINE mg', f.base.caff));
    g3.appendChild(mk('price', 'PRICE ₱', f.base.price));
    body.appendChild(g3);

    const calc = el('button', 'btn wide', 'CALORIES FROM THE MACROS');
    calc.style.marginTop = '8px';
    calc.onclick = () => {
      const k = (num(inputs.p.value, 0) || 0) * 4 + (num(inputs.c.value, 0) || 0) * 4 + (num(inputs.f.value, 0) || 0) * 9;
      inputs.kcal.value = String(Math.round(k));
      UI.toast('4 / 4 / 9 — a check, not the truth');
    };
    body.appendChild(calc);

    /* your servings — the whole point. A Cobra bottle is 1.3 label servings. */
    body.appendChild(el('label', 'fl', 'YOUR SERVINGS'));
    body.appendChild(el('div', 'note', 'How you actually eat it. Give it a name and how much is really in one — a whole bottle, a scoop, a pack. STATUS works out the rest.'));
    const sw = el('div');
    const paintServes = () => {
      sw.innerHTML = '';
      (f.serves || []).forEach((s, i) => {
        const baseAmt = num(inputs.amt.value, num(f.base.amt, 1)) || 1;
        const r = el('div', 'row');
        r.innerHTML = '<span class="nm">' + esc(s.label) + '<small>' + r1(s.mult * baseAmt) + ' ' + esc(inputs.unit.value || f.base.unit || '') +
          ' · ' + r1(s.mult) + ' × label</small></span>';
        const x = el('button', 'x', '✕');
        x.onclick = () => { f.serves.splice(i, 1); paintServes(); };
        r.appendChild(x);
        sw.appendChild(r);
      });
      const add = el('div', 'grid2');
      const nm = document.createElement('input'); nm.type = 'text'; nm.placeholder = 'Bottle';
      const am = document.createElement('input'); am.type = 'text'; am.inputMode = 'decimal'; am.placeholder = 'how much, e.g. 330';
      add.appendChild(nm); add.appendChild(am);
      sw.appendChild(add);
      const ab = el('button', 'btn wide', '+ ADD SERVING');
      ab.style.marginTop = '7px';
      ab.onclick = () => {
        const baseAmt = num(inputs.amt.value, 0);
        const a = num(am.value);
        if (!nm.value.trim() || a == null || !baseAmt) return UI.toast('needs a name and an amount', { bad: true });
        f.serves = (f.serves || []).concat([{ label: nm.value.trim(), mult: a / baseAmt }]);
        paintServes();
      };
      sw.appendChild(ab);
    };
    paintServes();
    body.appendChild(sw);

    body.appendChild(saveBar(isNew ? 'SAVE FOOD' : 'UPDATE FOOD', () => {
      const name = inputs.name.value.trim();
      if (!name) return UI.toast('it needs a name', { bad: true });
      const base = { amt: num(inputs.amt.value, 1) || 1, unit: inputs.unit.value.trim() || 'serving' };
      NUTS.concat(['price']).forEach(n => { const v = num(inputs[n].value); if (v != null) base[n] = v; });
      const row = { id: f.id, name: name, brand: inputs.brand.value.trim(), cat: inputs.cat.value.trim(),
        base: base, serves: f.serves || [], dflt: f.dflt || 0, uses: f.uses || 0, shot: shotId };
      Rec.set('food', null, f.id, row);
      Sfx.play('drop');
      closeSheet();
      if (isNew) amountSheet(row); else draw();
    }));

    if (!isNew) {
      const del = el('button', 'btn wide', 'DELETE THIS FOOD');
      del.style.marginTop = '8px';
      del.onclick = () => UI.confirm('Delete ' + f.name + '?', 'Meals you already logged keep their own numbers and are not touched.')
        .then(ok => { if (ok) { Rec.del('food', null, f.id); closeSheet(); draw(); } });
      body.appendChild(del);
    }
  });
}
</script>

<script>
/* ══════════════ THE SCREENS ══════════════ */

let TAB = 'now';
/* Backfill is normal, not an exception. VIEW is the day being looked at;
   null means today. The future is not a record and cannot be reached. */
let VIEW = null;
const vd = () => VIEW || Day.today();
function shiftView(n) {
  const d = Day.shift(vd(), n);
  if (!Day.editable(d)) return UI.toast('the future is not a record');
  VIEW = d === Day.today() ? null : d;
  draw();
}
function dateBar() {
  const w = el('div', 'seg');
  const back = el('button', null, '‹ EARLIER');
  const mid = el('button', VIEW ? 'on' : '', VIEW ? Day.label(vd()).toUpperCase() + ' · TAP FOR TODAY' : 'TODAY');
  const fwd = el('button', null, 'LATER ›');
  back.onclick = () => shiftView(-1);
  fwd.onclick = () => shiftView(1);
  mid.onclick = () => { VIEW = null; draw(); };
  w.appendChild(back); w.appendChild(mid); w.appendChild(fwd);
  return w;
}
const NAV = [['now', '◐', 'NOW'], ['food', '🍽', 'FOOD'], ['money', '₱', 'MONEY'], ['trends', '◭', 'TRENDS']];

function drawNav() {
  const n = document.getElementById('nav');
  n.innerHTML = '';
  NAV.forEach(t => {
    const b = el('button', TAB === t[0] ? 'on' : '', '<span class="g">' + t[1] + '</span>' + t[2]);
    b.onclick = () => { TAB = t[0]; draw(); };
    n.appendChild(b);
  });
}

function card(title, sub) {
  const c = el('div', 'card');
  if (title) c.appendChild(el('h2', null, esc(title) + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '')));
  return c;
}

function tile(label, val, unit, cls, onclick, pct) {
  const t = el('button', 'tile ' + (cls || ''));
  t.innerHTML = '<div class="lb">' + esc(label) + '</div><div class="vl">' + (val == null ? '–' : esc(val)) +
    (unit ? '<span class="un">' + esc(unit) + '</span>' : '') + '</div>';
  if (pct != null) {
    const bar = el('div', 'bar');
    bar.innerHTML = '<i style="width:' + Math.min(100, Math.round(pct * 100)) + '%"></i>';
    t.appendChild(bar);
  }
  if (onclick) t.onclick = onclick;
  return t;
}

/* ── NOW ── */
function drawNow(m) {
  const d = vd();
  m.appendChild(dateBar());
  const c = card(Day.isToday(d) ? 'TODAY' : 'THAT DAY', Day.label(d));
  const g = el('div', 'tiles');

  liveFields().forEach(f => {
    const v = value(d, f.id);
    const has = v != null;
    const shown = has ? (f.dec || f.measure === 'scale' ? r1(v) : Math.round(v).toLocaleString()) : null;
    let cls = has ? 'done' : 'todo';
    let pct = null;
    if (f.target && has) { pct = f.dir === 'lte' ? v / f.target : v / f.target; if (f.dir === 'lte' && v > f.target) cls += ' over'; }
    g.appendChild(tile(f.label, shown, f.unit, cls, () => fieldSheet(f, d), pct));
  });

  const t = dayTotals(d), tg = TARGETS();
  g.appendChild(tile('Calories', Math.round(t.kcal).toLocaleString(), '', t.kcal > tg.kcal ? 'done over' : (t.kcal ? 'done' : 'todo'), () => { TAB = 'food'; draw(); }, t.kcal / tg.kcal));
  g.appendChild(tile('Protein', Math.round(t.p), 'g', t.p >= tg.p ? 'done' : 'todo', () => { TAB = 'food'; draw(); }, t.p / tg.p));
  g.appendChild(tile('Spent', money(dayMoney(d)).replace('₱', ''), '₱', dayMoney(d) ? 'done' : 'todo', () => { TAB = 'money'; draw(); }));
  c.appendChild(g);

  const left = outstanding();
  if (left.length) {
    c.appendChild(el('div', 'note', 'Still open today: <b>' + left.map(f => f.label).join(', ') + '</b>. The + button has them.'));
  }
  m.appendChild(c);

  /* what to eat today */
  const est = TD.estimate(), target = TD.targetIntake();
  if (target != null) {
    const c2 = card('TODAY’S NUMBER');
    const eaten = Math.round(t.kcal), leftK = target - eaten;
    c2.innerHTML += '<div class="big">' + leftK.toLocaleString() + ' <span class="muted" style="font-size:13px">kcal left of ' + target.toLocaleString() + '</span></div>' +
      '<div class="note">' + (est.basis === 'measured'
        ? 'From your measured TDEE of ' + est.tdee.toLocaleString() + ', minus ' + S.get('goalRate', 1.25) + ' lb a week.'
        : 'From the starting estimate of weight × ' + TD.perLb() + '. ' + esc(est.why || '') + '.') + '</div>';
    m.appendChild(c2);
  }

  /* mood and energy through the day */
  const multi = liveFields().filter(f => !f.once && evList(d, f.id).length);
  if (multi.length) {
    const c3 = card('THROUGH THE DAY');
    multi.forEach(f => {
      const e = evList(d, f.id);
      const r = el('div', 'row');
      r.innerHTML = '<span class="nm">' + esc(f.label) + '<small>' + e.map(x => x.v).join(' · ') + '</small></span>' +
        '<span class="fig">avg ' + r1(value(d, f.id)) + '</span>';
      c3.appendChild(r);
    });
    m.appendChild(c3);
  }
}

/* ── FOOD ── */
function drawFood(m) {
  const d = vd(), t = dayTotals(d), tg = TARGETS();
  m.appendChild(dateBar());
  const c = card(Day.isToday(d) ? 'TODAY’S FOOD' : 'FOOD THAT DAY', Math.round(t.kcal).toLocaleString() + ' kcal');
  [['kcal', 'CALORIES', tg.kcal, 'k1', 'lte'], ['p', 'PROTEIN', tg.p, 'k2', 'gte'],
   ['c', 'CARBS', tg.c, 'k3', 'lte'], ['f', 'FAT', tg.f, 'k4', 'lte']].forEach(row => {
    const v = t[row[0]], lim = row[2], pct = lim ? v / lim : 0;
    const over = row[4] === 'lte' && v > lim;
    const w = el('div', 'macro ' + row[3] + (over ? ' over' : ''));
    w.innerHTML = '<div class="top"><b>' + row[1] + '</b><span class="n">' + Math.round(v) + ' / ' + lim + '</span></div>' +
      '<div class="track"><i style="width:' + Math.min(100, Math.round(pct * 100)) + '%"></i></div>';
    c.appendChild(w);
  });
  c.appendChild(el('div', 'note', 'Left to go: <b>' + Math.max(0, Math.round(tg.p - t.p)) + 'g protein</b>, ' +
    Math.max(0, Math.round(tg.kcal - t.kcal)).toLocaleString() + ' kcal. Sodium ' + Math.round(t.na) + ', potassium ' + Math.round(t.k) +
    (t.caff ? ', caffeine ' + Math.round(t.caff) + 'mg' : '') + '.'));
  m.appendChild(c);

  const c2 = card('LOGGED', meals(d).length + ' items · ' + money(t.price));
  const list = meals(d);
  if (!list.length) c2.appendChild(el('div', 'empty', 'Nothing logged today. The + button, then FOOD.'));
  list.forEach(x => {
    const r = el('div', 'row');
    r.innerHTML = '<span class="nm">' + esc(x.name) + '<small>' + esc(x.serve || '') + ' · ' + r1(x.amt) + ' ' + esc(x.unit || '') +
      (x.price ? ' · ' + money(x.price) : '') + '</small></span>' +
      '<span class="fig">' + Math.round(x.kcal) + ' kcal<br>' + r1(x.p) + 'p</span>';
    const del = el('button', 'x', '✕');
    del.onclick = () => { Rec.del('meal', d, x.key); Sfx.play('untick'); draw(); };
    r.appendChild(del);
    c2.appendChild(r);
  });
  const b = el('button', 'btn go wide', '+ LOG FOOD');
  b.style.minHeight = '48px';
  b.onclick = foodPicker;
  c2.appendChild(b);
  m.appendChild(c2);
}

/* ── MONEY ── */
function drawMoney(m) {
  const d = vd();
  m.appendChild(dateBar());
  const sp = spends(d), food = dayTotals(d).price;
  const c = card(Day.isToday(d) ? 'TODAY' : Day.label(d), money(dayMoney(d)));
  c.innerHTML += '<div class="big">' + money(dayMoney(d)) + '</div>' +
    '<div class="note">' + money(spendTotal(d)) + ' logged spending' + (food ? ' plus ' + money(food) + ' of food, counted from what you ate' : '') + '.</div>';
  if (!sp.length && !food) c.appendChild(el('div', 'empty', 'Nothing yet today.'));
  sp.slice().reverse().forEach(s => {
    const r = el('div', 'row tap');
    r.innerHTML = (s.shot ? '<img class="thumb" src="' + (Rec.get('shot', d, s.shot) || {}).img + '">' : '') +
      '<span class="nm">' + esc(s.note || '(no details)') + '<small>' + esc(s.acct) + ' · ' +
      new Date(s.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</small></span>' +
      '<span class="fig">' + money(s.amt) + '</span>';
    r.onclick = () => spendSheet(Object.assign({ date: d }, s));
    const del = el('button', 'x', '✕');
    del.onclick = ev => { ev.stopPropagation(); Rec.del('spend', d, s.key); Sfx.play('untick'); draw(); };
    r.appendChild(del);
    c.appendChild(r);
  });
  const b = el('button', 'btn go wide', '+ ADD SPEND');
  b.style.minHeight = '48px'; b.onclick = () => spendSheet();
  c.appendChild(b);
  m.appendChild(c);

  /* last 7 and 30 days, and where it went */
  const c2 = card('RECENT');
  const sum = n => Day.last(n).reduce((a, x) => a + dayMoney(x), 0);
  c2.innerHTML += '<div class="row"><span class="nm">Last 7 days</span><span class="fig">' + money(sum(7)) + '</span></div>' +
    '<div class="row"><span class="nm">Last 30 days</span><span class="fig">' + money(sum(30)) + '</span></div>' +
    '<div class="row"><span class="nm">Daily average, 30 days</span><span class="fig">' + money(sum(30) / 30) + '</span></div>';
  const byAcct = {};
  Day.last(30).forEach(dd => spends(dd).forEach(s => { byAcct[s.acct] = (byAcct[s.acct] || 0) + (num(s.amt, 0) || 0); }));
  Object.keys(byAcct).sort((a, b) => byAcct[b] - byAcct[a]).forEach(a => {
    c2.innerHTML += '<div class="row"><span class="nm">' + esc(a) + '<small>30 days</small></span><span class="fig">' + money(byAcct[a]) + '</span></div>';
  });
  m.appendChild(c2);
}

/* ── TRENDS ── */
function drawTrends(m) {
  const e = TD.estimate();
  const c = card('TDEE', e.basis === 'measured' ? 'measured' : 'estimated');
  if (e.tdee == null) {
    c.appendChild(el('div', 'empty', 'Log a weight and this starts working.'));
  } else {
    c.innerHTML += '<div class="big">' + e.tdee.toLocaleString() + ' <span class="muted" style="font-size:13px">kcal/day</span></div>';
    if (e.basis === 'measured') {
      c.innerHTML += '<div class="note">From ' + e.calDays + ' days of food averaging <b>' + e.intake.toLocaleString() + ' kcal</b> ' +
        'against a weight trend of <b>' + (e.rate > 0 ? '+' : '') + r1(e.rate) + ' lb a week</b>. ' +
        'This week’s reading was ' + e.observed.toLocaleString() + '; the estimate moved ' + Math.round(TD.alpha() * 100) + '% of the way toward it.</div>';
    } else {
      c.innerHTML += '<div class="note">Still the starting estimate: your weight × ' + TD.perLb() + '. It becomes measured once there is enough data — ' + esc(e.why || '') + '.</div>';
    }
    const cf = el('div');
    cf.innerHTML = '<div class="note">Confidence ' + e.conf + '%</div><div class="conf"><i style="width:' + e.conf + '%"></i></div>';
    c.appendChild(cf);
    c.appendChild(el('div', 'note', 'An estimate that gets better, not a measurement. It is deliberately slow to move so a salty meal cannot rewrite it.'));
  }
  m.appendChild(c);

  const c2 = card('WEIGHT', TD.win() + ' days');
  c2.appendChild(weightChart(e));
  const w = TD.lastWeight(), goal = S.get('goalWeight', null);
  c2.innerHTML += '<div class="note">' + (w ? 'Last ' + r1(w) + ' lb' : 'nothing logged') +
    (goal ? ' · goal ' + goal + ' lb · ' + r1(w - goal) + ' to go' : '') +
    (e.rate != null ? ' · trend ' + (e.rate > 0 ? '+' : '') + r1(e.rate) + ' lb/wk' : '') + '</div>';
  m.appendChild(c2);

  const c3 = card('LAST 28 DAYS');
  liveFields().forEach(f => {
    const days = Day.last(28);
    const r = el('div');
    const hit = days.filter(d => { const v = value(d, f.id); if (v == null) return false; return f.target ? (f.dir === 'lte' ? v <= f.target : v >= f.target) : true; }).length;
    r.innerHTML = '<div class="top" style="display:flex;font-size:12px"><b style="font-family:var(--font-display);font-size:10px;letter-spacing:.14em;color:var(--text-muted)">' +
      esc(f.label.toUpperCase()) + '</b><span class="n mono" style="margin-left:auto;color:var(--text-2)">' + hit + '/28</span></div>';
    const g = el('div', 'grid28');
    days.forEach(d => {
      const v = value(d, f.id);
      const on = v != null && (!f.target || (f.dir === 'lte' ? v <= f.target : v >= f.target));
      g.appendChild(el('i', on ? 'on' : (v != null ? 'part' : '')));
    });
    r.appendChild(g);
    r.style.marginBottom = '11px';
    c3.appendChild(r);
  });
  m.appendChild(c3);
}

/* raw weights as dots, the 7-day average as the line, the goal as a dash */
function weightChart(e) {
  const W = 320, H = 172, PL = 30, PR = 6, PT = 8, PB = 16;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('class', 'chart');
  svg.setAttribute('preserveAspectRatio', 'none');
  const ser = e.series, roll = e.roll;
  const pts = ser.filter(x => x.w != null);
  if (pts.length < 2) {
    const t = document.createElementNS(svg.namespaceURI, 'text');
    t.setAttribute('x', 8); t.setAttribute('y', 24); t.setAttribute('class', 'lab');
    t.textContent = 'two weigh-ins and this draws itself';
    svg.appendChild(t); return svg;
  }
  const goal = num(S.get('goalWeight', null));
  let lo = Math.min.apply(null, pts.map(p => p.w)), hi = Math.max.apply(null, pts.map(p => p.w));
  if (goal != null) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  const pad = Math.max(1, (hi - lo) * .12); lo -= pad; hi += pad;
  const X = i => PL + (i / Math.max(1, ser.length - 1)) * (W - PL - PR);
  const Y = v => PT + (1 - (v - lo) / Math.max(.001, hi - lo)) * (H - PT - PB);
  const add = (tag, attrs, cls) => {
    const n = document.createElementNS(svg.namespaceURI, tag);
    Object.keys(attrs).forEach(k => n.setAttribute(k, attrs[k]));
    if (cls) n.setAttribute('class', cls);
    svg.appendChild(n); return n;
  };
  [0, .5, 1].forEach(t => {
    const y = PT + t * (H - PT - PB);
    add('line', { x1: PL, y1: y, x2: W - PR, y2: y }, 'gl');
    const lab = add('text', { x: 2, y: y + 3 }, 'lab');
    lab.textContent = r1(hi - t * (hi - lo));
  });
  if (goal != null) add('line', { x1: PL, y1: Y(goal), x2: W - PR, y2: Y(goal) }, 'goal');
  pts.forEach(p => add('circle', { cx: X(ser.indexOf(p)), cy: Y(p.w), r: 1.9 }, 'raw'));
  if (roll.length > 1) add('path', { d: roll.map((p, i) => (i ? 'L' : 'M') + X(p.i) + ' ' + Y(p.y)).join(' ') }, 'avg');
  return svg;
}

/* ── the painter ── */
function draw() {
  const m = document.getElementById('main');
  m.innerHTML = '';
  document.getElementById('hdate').textContent = Day.short(Day.today());
  document.getElementById('fab').className = outstanding().length ? 'dot' : '';
  if (TAB === 'now') drawNow(m);
  else if (TAB === 'food') drawFood(m);
  else if (TAB === 'money') drawMoney(m);
  else drawTrends(m);
  drawNav();
}
</script>

<script>
/* ══════════════ SETTINGS ══════════════ */

function toggleRow(label, sub, on, fn) {
  const r = el('div', 'sw');
  r.innerHTML = '<span class="nm">' + esc(label) + (sub ? '<br><small class="muted sm">' + esc(sub) + '</small>' : '') + '</span>';
  const t = el('div', 'tg' + (on ? ' on' : ''), '<i></i>');
  t.onclick = () => { fn(!on); };
  r.appendChild(t);
  return r;
}
function fieldRow(pane, label, key, val, hint, step) {
  const w = el('div');
  w.appendChild(el('label', 'fl', label));
  const i = document.createElement('input');
  i.type = 'text'; i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*');
  i.value = val == null ? '' : String(val);
  i.onchange = () => { const v = num(i.value); if (v != null) { S.set(key, v); draw(); } };
  w.appendChild(i);
  if (hint) w.appendChild(el('div', 'note', hint));
  pane.appendChild(w);
  return i;
}

function openSettings() {
  UI.settings(APP.id, [
    { id: 'track', name: 'TRACK', draw: drawTrackTab },
    { id: 'goals', name: 'GOALS', draw: drawGoalsTab },
    { id: 'sync',  name: 'SYNC',  draw: drawSyncTab },
  ]);
}

function drawTrackTab(pane) {
  pane.appendChild(el('div', 'note', 'Turn something off and it stops appearing anywhere — the tiles, the fast input, the 28-day grid. <b>Nothing is deleted.</b> Turn it back on and its whole history is still there.'));
  Object.values(fields()).sort((a, b) => (a.order || 0) - (b.order || 0)).forEach(f => {
    pane.appendChild(toggleRow(f.label, (f.once ? 'once a day' : 'as often as you like') + (f.target ? ' · target ' + (f.dir === 'lte' ? '≤' : '≥') + ' ' + f.target + ' ' + (f.unit || '') : ''), !!f.on, on => {
      Rec.set('field', null, f.id, Object.assign({}, f, { on: on ? 1 : 0 }));
      drawSettingsPane('track');
      draw();
    }));
  });
  pane.appendChild(el('label', 'fl', 'ACCOUNTS FOR SPENDING'));
  const aw = el('div');
  accts().forEach(a => {
    const r = el('div', 'row');
    r.innerHTML = '<span class="nm">' + esc(a.name) + '</span>';
    const x = el('button', 'x', '✕');
    x.onclick = () => { Rec.del('acct', null, a.name.toLowerCase()); drawSettingsPane('track'); };
    r.appendChild(x); aw.appendChild(r);
  });
  const add = el('div', 'stepper');
  const ni = document.createElement('input'); ni.type = 'text'; ni.placeholder = 'new account';
  const ab = el('button', null, '+');
  ab.onclick = () => { const v = ni.value.trim(); if (!v) return; Rec.set('acct', null, v.toLowerCase(), { name: v, order: accts().length }); drawSettingsPane('track'); };
  add.appendChild(ni); add.appendChild(ab);
  aw.appendChild(add);
  pane.appendChild(aw);

  pane.appendChild(el('label', 'fl', 'PHOTOS'));
  const n = shotCount();
  pane.appendChild(el('div', 'note', n + ' picture' + (n === 1 ? '' : 's') + ' stored, shrunk to thumbnails. Storage on a phone is about 5MB in total, so this is the one thing that can fill it up.'));
  const clr = el('button', 'btn wide', 'DELETE ALL PHOTOS');
  clr.onclick = () => UI.confirm('Delete every stored photo?', 'The entries they belong to stay. Only the pictures go.')
    .then(ok => { if (ok) { Rec.all('shot').forEach(r => Rec.del('shot', r.date, r.key)); drawSettingsPane('track'); } });
  pane.appendChild(clr);
}

function drawGoalsTab(pane) {
  const tg = TARGETS();
  pane.appendChild(el('label', 'fl', 'DAILY FOOD TARGETS'));
  const g = el('div', 'grid2');
  [['kcal', 'CALORIES'], ['p', 'PROTEIN g'], ['c', 'CARBS g'], ['f', 'FAT g'], ['na', 'SODIUM mg'], ['k', 'POTASSIUM mg']].forEach(k => {
    const w = el('div');
    w.appendChild(el('label', 'fl', k[1]));
    const i = document.createElement('input');
    i.type = 'text'; i.inputMode = 'decimal'; i.value = String(tg[k[0]] == null ? '' : tg[k[0]]);
    i.onchange = () => { const t = TARGETS(); t[k[0]] = num(i.value, t[k[0]]); S.set('targets', t); draw(); };
    w.appendChild(i); g.appendChild(w);
  });
  pane.appendChild(g);

  pane.appendChild(el('label', 'fl', 'WEIGHT'));
  fieldRow(pane, 'GOAL WEIGHT (lb)', 'goalWeight', S.get('goalWeight', null), 'Drawn as a dashed line on the chart.');
  fieldRow(pane, 'GOAL RATE (lb per week)', 'goalRate', S.get('goalRate', 1.25), 'What to eat = TDEE − (rate × ' + TD.ed() + ' ÷ 7). At ' + S.get('goalRate', 1.25) + ' lb a week that is ' + Math.round(S.get('goalRate', 1.25) * TD.ed() / 7) + ' kcal a day under.');

  pane.appendChild(el('label', 'fl', 'THE TDEE ESTIMATOR'));
  pane.appendChild(el('div', 'note', 'These are the knobs on the estimator. The defaults are the ones the brief calls for. Change them only if you know why.'));
  fieldRow(pane, 'ENERGY PER LB (kcal)', 'ed', TD.ed(), 'How many calories one pound of change is worth. 3500 is the working figure, not a law — real weight loss is not pure fat.');
  fieldRow(pane, 'SMOOTHING (0.2 – 0.4)', 'alpha', TD.alpha(), 'How far the estimate moves toward each new reading. 0.25 means a quarter of the way, so one strange week cannot swing it.');
  fieldRow(pane, 'WINDOW (days)', 'win', TD.win(), 'How far back the trend line looks. 28 is the default; below 14 it gets noisy.');
  fieldRow(pane, 'STARTING GUESS (kcal per lb)', 'perLb', TD.perLb(), 'Before there is data: bodyweight × this. 13 is what your Motherbase sheet used.');
  fieldRow(pane, 'MOST ONE UPDATE MAY MOVE IT', 'guard', TD.guard(), 'A hard brake, in calories, on top of the smoothing.');
  const rc = el('button', 'btn wide', 'RECALCULATE NOW');
  rc.style.marginTop = '9px';
  rc.onclick = () => { S.set('tdeeState', null); TD.tick(); draw(); UI.toast('recalculated from scratch'); drawSettingsPane('goals'); };
  pane.appendChild(rc);
}

function drawSyncTab(pane) {
  pane.appendChild(el('div', 'note', 'Two ways out, and they do different jobs. <b>Backup</b> is a file that restores. <b>Export</b> is a spreadsheet you can read but not restore from. Both live in the DATA tab.'));
  const cfg = S.get('mirror', { url: '', on: 0, at: null });

  pane.appendChild(el('label', 'fl', 'GOOGLE SHEET MIRROR'));
  pane.appendChild(el('div', 'warnbox', '<b>Untested.</b> I cannot try this end to end without your sheet, so treat the first run as the test. It never blocks anything: if the push fails, STATUS carries on and tries again next time.'));
  pane.appendChild(el('div', 'note', 'Setup, once: make a blank Google Sheet → Extensions → Apps Script → paste the script below → Deploy → New deployment → Web app → Execute as <b>me</b>, access <b>anyone</b> → copy the URL → paste it here.'));

  const u = document.createElement('input');
  u.type = 'text'; u.placeholder = 'https://script.google.com/macros/s/…/exec';
  u.value = cfg.url || '';
  u.onchange = () => { const c = S.get('mirror', {}); c.url = u.value.trim(); S.set('mirror', c); };
  pane.appendChild(u);

  pane.appendChild(toggleRow('Push at the end of each day', cfg.at ? 'last pushed ' + cfg.at : 'never pushed yet', !!cfg.on, on => {
    const c = S.get('mirror', {}); c.on = on ? 1 : 0; S.set('mirror', c); drawSettingsPane('sync');
  }));

  const now = el('button', 'btn go wide', 'PUSH NOW');
  now.style.minHeight = '46px';
  now.onclick = () => Mirror.push(true).then(() => drawSettingsPane('sync'));
  pane.appendChild(now);

  const show = el('button', 'btn wide', 'SHOW ME THE SCRIPT TO PASTE');
  show.style.marginTop = '8px';
  show.onclick = () => {
    const t = document.createElement('textarea');
    t.rows = 14; t.value = Mirror.script();
    t.style.fontFamily = 'var(--font-mono)'; t.style.fontSize = '11px';
    UI.dialog({ title: 'APPS SCRIPT', width: 560, body: b => { b.appendChild(t); setTimeout(() => { t.select(); }, 50); },
      actions: [{ label: 'DONE', kind: 'go' }] });
  };
  pane.appendChild(show);
}

/* repaint one settings pane in place, since the dialog owns the tab bar */
function drawSettingsPane(which) {
  const panes = document.querySelectorAll('.mb-dialog .mb-body > div');
  const pane = panes[panes.length - 1];
  if (!pane) return;
  pane.innerHTML = '';
  if (which === 'track') drawTrackTab(pane);
  else if (which === 'goals') drawGoalsTab(pane);
  else drawSyncTab(pane);
}

/* ══════════════ THE SHEET MIRROR ══════════════ */

const Mirror = {
  script() {
    return [
      'function doPost(e) {',
      '  var body = JSON.parse(e.postData.contents);',
      '  var ss = SpreadsheetApp.getActiveSpreadsheet();',
      '  body.sheets.forEach(function (s) {',
      '    var sh = ss.getSheetByName(s.name) || ss.insertSheet(s.name);',
      '    sh.clear();',
      '    if (s.rows.length) sh.getRange(1, 1, s.rows.length, s.rows[0].length).setValues(s.rows);',
      '  });',
      '  return ContentService.createTextOutput(JSON.stringify({ ok: true }))',
      '    .setMimeType(ContentService.MimeType.JSON);',
      '}',
    ].join('\n');
  },
  push(manual) {
    const cfg = S.get('mirror', {});
    if (!cfg.url) { if (manual) UI.toast('paste the web app URL first', { bad: true }); return Promise.resolve(false); }
    const sheets = exportSheets().map(s => ({ name: s.name, rows: s.rows }));
    if (manual) UI.toast('pushing…');
    return fetch(cfg.url, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },  /* text/plain avoids the CORS preflight Apps Script cannot answer */
      body: JSON.stringify({ app: APP.id, at: new Date().toISOString(), sheets: sheets }),
    }).then(r => {
      const c = S.get('mirror', {}); c.at = Day.today(); S.set('mirror', c);
      if (manual) UI.toast('pushed <b>' + sheets.length + ' tabs</b>');
      return true;
    }).catch(e => {
      if (manual) UI.toast('could not reach the sheet — <b>nothing lost</b>, it will try again', { bad: true });
      return false;
    });
  },
  maybe() {
    const cfg = S.get('mirror', {});
    if (!cfg.on || !cfg.url) return;
    if (cfg.at === Day.today()) return;
    if (!Day.isClosed || !Day.isClosed(Day.today())) return;
    Mirror.push(false);
  },
};

/* ══════════════ EXPORT ══════════════ */

function exportSheets() {
  const days = Day.last(370);
  const live = Object.values(fields()).sort((a, b) => (a.order || 0) - (b.order || 0));

  const daily = [['Date', 'Day'].concat(live.map(f => f.label + (f.unit ? ' (' + f.unit + ')' : '')))
    .concat(['Calories', 'Protein g', 'Carbs g', 'Fat g', 'Sodium mg', 'Potassium mg', 'Caffeine mg', 'Food ₱', 'Other ₱', 'Total ₱'])];
  days.forEach(d => {
    const t = dayTotals(d), sp = spendTotal(d);
    const any = live.some(f => value(d, f.id) != null) || t.kcal || sp;
    if (!any) return;
    daily.push([d, new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' })].concat(live.map(f => { const v = value(d, f.id); return v == null ? '' : r1(v); }))
      .concat([Math.round(t.kcal), r1(t.p), r1(t.c), r1(t.f), Math.round(t.na), Math.round(t.k), Math.round(t.caff),
        Math.round(t.price), Math.round(sp), Math.round(t.price + sp)]));
  });

  const mealRows = [['Date', 'Time', 'Food', 'Serving', 'Amount', 'Unit', 'Calories', 'Protein', 'Carbs', 'Fat', 'Sodium', 'Potassium', 'Caffeine', 'Price']];
  days.forEach(d => meals(d).forEach(x => mealRows.push([d, new Date(x.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    x.name, x.serve || '', r1(x.amt), x.unit || '', Math.round(x.kcal), r1(x.p), r1(x.c), r1(x.f), Math.round(x.na), Math.round(x.k), Math.round(x.caff), Math.round(x.price)])));

  const spendRows = [['Date', 'Time', 'Amount', 'Account', 'Details']];
  days.forEach(d => spends(d).forEach(s => spendRows.push([d, new Date(s.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    r1(s.amt), s.acct || '', s.note || ''])));

  const foodRows = [['Food', 'Brand', 'Group', 'Serving', 'Unit', 'Calories', 'Protein', 'Carbs', 'Fat', 'Sodium', 'Potassium', 'Caffeine', 'Price', 'Your servings', 'Times logged']];
  Object.values(foods()).forEach(f => foodRows.push([f.name, f.brand || '', f.cat || '', r1(num(f.base.amt, 0)), f.base.unit || '',
    num(f.base.kcal, ''), num(f.base.p, ''), num(f.base.c, ''), num(f.base.f, ''), num(f.base.na, ''), num(f.base.k, ''), num(f.base.caff, ''), num(f.base.price, ''),
    (f.serves || []).map(s => s.label + ' = ' + r1(s.mult) + '×').join('; '), f.uses || 0]));

  const e = TD.estimate();
  const tdeeRows = [['Measure', 'Value'],
    ['TDEE', e.tdee == null ? '' : e.tdee], ['Basis', e.basis], ['Confidence %', e.conf],
    ['Average intake', e.intake == null ? '' : e.intake], ['Trend lb/week', e.rate == null ? '' : r1(e.rate)],
    ['Days of food logged', e.calDays], ['Weigh-ins', e.weighIns],
    ['Energy per lb', TD.ed()], ['Smoothing', TD.alpha()], ['Window days', TD.win()],
    ['Target intake', TD.targetIntake() == null ? '' : TD.targetIntake()]];

  return [
    { name: 'Daily', rows: daily, widths: daily[0].map(() => 12) },
    { name: 'Meals', rows: mealRows, widths: mealRows[0].map(() => 12) },
    { name: 'Spending', rows: spendRows, widths: [11, 8, 10, 12, 30] },
    { name: 'Foods', rows: foodRows, widths: foodRows[0].map(() => 13) },
    { name: 'TDEE', rows: tdeeRows, widths: [24, 14] },
  ];
}

/* ══════════════ BOOT ══════════════ */

Rec.onfull = () => UI.toast('<b>storage is full.</b> Settings → TRACK → delete photos, or back up and clear.', { bad: true });

Rec.ready(() => {
  seedFields();
  TD.tick();
  Mirror.maybe();
  draw();
  if (IO.isStale(APP.id)) setTimeout(() => UI.toast('no backup in ' + (IO.staleDays(APP.id) == null ? 'a while' : IO.staleDays(APP.id) + ' days') + ' — <b>settings → data</b>'), 1500);
});
Rec.on(draw);
Day.on(() => { TD.tick(); draw(); });
</script>
