<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STATUS">
<title>STATUS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◐</text></svg>">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">

<script src="../shared/skins.js"></script>
<script src="../shared/day.js"></script>
<script src="../shared/records.js"></script>
<script src="../shared/mobile.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/io.js"></script>
<script src="../shared/health.js"></script>

<style>
/* ── the system, decided once ──────────────────────────────────────────
   Spacing and type both step by at least 25%, so there is never a choice
   to agonise over between two near-identical values.

   Separation comes from background and space, not from borders. A border
   on every card and every row is what made this look busy. Borders are
   now reserved for things you type into.

   Three weights, six sizes, and one accent colour that only ever marks
   the single most important thing on screen.                            */
:root{
  --s1:4px; --s2:6px; --s3:8px; --s4:12px; --s5:16px; --s6:24px; --s7:32px;
  --t1:11px; --t2:12px; --t3:13px; --t4:15px; --t5:17px; --t6:22px; --t7:28px; --t8:40px;
  --lift:0 1px 2px rgba(0,0,0,.28);
  --lift2:0 6px 24px rgba(0,0,0,.42);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}
html{height:100%}
body{
  height:100%;overflow:hidden;                    /* only main scrolls, so Safari cannot bounce the page */
  overscroll-behavior:none;
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--t4);line-height:1.45;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input,textarea,select{-webkit-user-select:text;user-select:text}

/* ── header: present, not competing ── */
header{
  display:flex;align-items:center;gap:var(--s3);flex:0 0 auto;
  padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s5) var(--s4);
  background:var(--surface-1);
}
.logo{font-family:var(--font-display);font-weight:700;font-size:var(--t3);letter-spacing:.18em}
.logo b{color:var(--accent);font-weight:700}
.spacer{flex:1}
.hbtn{
  width:44px;height:44px;flex:0 0 auto;border:0;border-radius:50%;
  background:var(--surface-2);color:var(--text-muted);font-size:var(--t4);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.hbtn:active{background:var(--surface-3);color:var(--text-1)}

main{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:var(--s4) var(--s4) 132px;
}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s4)}

/* ── cards: background does the separating ── */
.card{background:var(--surface-1);border-radius:var(--radius-md);padding:var(--s5);box-shadow:var(--lift)}
h2{
  font-family:var(--font-display);font-size:var(--t1);letter-spacing:.16em;font-weight:600;
  color:var(--text-muted);margin-bottom:var(--s4);display:flex;align-items:baseline;gap:var(--s3);
}
h2 .sub{margin-left:auto;letter-spacing:0;font-family:var(--font-mono);font-size:var(--t2)}
.empty{color:var(--text-muted);font-size:var(--t3);line-height:1.6}
.muted{color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.note{font-size:var(--t2);color:var(--text-muted);line-height:1.55;margin-top:var(--s3)}

/* ── the hero number ── */
.hero{font-family:var(--font-mono);font-size:var(--t8);font-weight:600;line-height:1.05;letter-spacing:-.02em}
.hero .u{font-size:var(--t3);font-weight:400;color:var(--text-muted);letter-spacing:0;margin-left:var(--s2)}

/* ── tiles: value is the point, label recedes ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:var(--s2)}
.tile{
  background:var(--surface-2);border:0;border-radius:var(--radius-md);
  padding:var(--s4) var(--s4) var(--s3);text-align:left;cursor:pointer;
  min-height:76px;display:flex;flex-direction:column;gap:var(--s1);
  font-size:var(--t2);font-family:inherit;color:inherit;
}
.tile:active{background:var(--surface-3)}
.tile .vl{font-family:var(--font-mono);font-size:var(--t6);font-weight:600;line-height:1.1;color:var(--text-1)}
.tile .vl .un{font-size:var(--t2);font-weight:400;color:var(--text-muted);margin-left:2px}
.tile .lb{font-size:var(--t2);color:var(--text-muted);margin-top:auto}
.tile.todo .vl{color:var(--text-muted);opacity:.5}
.tile .bar{height:2px;border-radius:1px;background:var(--surface-3);overflow:hidden;margin-top:var(--s2)}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.tile.over .bar i{background:var(--warn)}

/* ── rows ── */
.row{
  display:flex;align-items:center;gap:var(--s4);
  padding:var(--s4);border-radius:var(--radius-md);background:var(--surface-2);
  margin-bottom:var(--s2);min-height:52px;
}
.row .nm{flex:1;min-width:0;font-size:var(--t4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;color:var(--text-muted);font-size:var(--t2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .fig{font-family:var(--font-mono);font-size:var(--t3);color:var(--text-2);flex:0 0 auto;text-align:right}
.row .fig small{display:block;color:var(--text-muted);font-size:var(--t2)}
.row .x{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:50%;
  background:none;color:var(--text-muted);cursor:pointer;font-size:var(--t4)}
.row .x:active{background:var(--surface-3);color:var(--text-1)}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--surface-3)}

/* ── progress ── */
.macro{margin-bottom:var(--s4)}
.macro .top{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s2)}
.macro .top b{font-weight:600;font-size:var(--t3);color:var(--text-2)}
.macro .top .n{margin-left:auto;font-family:var(--font-mono);font-size:var(--t2);color:var(--text-muted)}
.macro .track{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.macro .track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.macro.k1 .track i{background:var(--data-1)}
.macro.k2 .track i{background:var(--data-2)}
.macro.k3 .track i{background:var(--data-3)}
.macro.k4 .track i{background:var(--data-4)}
.macro.over .track i{background:var(--warn)}

/* ── buttons ── */
.btn{
  padding:var(--s3) var(--s4);min-height:40px;border:0;border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-2);cursor:pointer;
  font-family:var(--font-body);font-size:var(--t3);font-weight:600;
}
.btn:active{background:var(--surface-3)}
.btn.go{background:var(--accent);color:var(--accent-fg)}
.btn.wide{width:100%;min-height:48px}
.btn.quiet{background:none;color:var(--text-muted)}
.btn.quiet:active{background:var(--surface-2)}

/* ── the one big action ── */
#fab{
  position:fixed;right:var(--s5);bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;
  width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);
  color:var(--accent-fg);font-size:var(--t7);font-weight:400;line-height:1;cursor:pointer;
  box-shadow:var(--lift2);display:flex;align-items:center;justify-content:center;
}
#fab:active{transform:scale(.93)}
#fab i{position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;
  background:var(--warn);border:2px solid var(--bg);display:none}
#fab.dot i{display:block}

/* ── tabs ── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--surface-1);padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;padding:var(--s3) var(--s1) var(--s3);background:none;border:0;cursor:pointer;
  color:var(--text-muted);opacity:.55;font-size:10px;letter-spacing:.1em;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;
  font-family:var(--font-display);
}
nav button .g{font-size:var(--t5);line-height:1}
nav button.on{color:var(--accent);opacity:1}

/* ── chips ── */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
.chip{
  padding:var(--s3) var(--s5);min-height:46px;border:0;border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-2);cursor:pointer;
  font-family:var(--font-mono);font-size:var(--t4);
}
.chip:active{background:var(--surface-3)}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.chip.big{flex:1;min-width:56px;text-align:center;font-size:var(--t5);padding:var(--s5) var(--s2);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.chip.big small{font-size:10px;opacity:.7;font-family:var(--font-body)}

/* ── things you type into: the one place a border earns its keep ── */
input[type=text],input[type=search],input[type=time],input.num,textarea,select{
  width:100%;min-width:0;padding:var(--s4);border:1px solid var(--border);
  border-radius:var(--radius-md);background:var(--surface-2);color:var(--text-1);
  font:inherit;font-size:var(--t4);
}
input.num{font-family:var(--font-mono);font-size:var(--t7);font-weight:600;text-align:center;padding:var(--s4) var(--s2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=time]{font-family:var(--font-mono);text-align:center}
label.fl{
  display:block;font-size:var(--t2);font-weight:600;color:var(--text-muted);
  margin:var(--s5) 0 var(--s2);
}
label.fl:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s3)}
.field{margin-bottom:var(--s5)}          /* more space around a group than inside it */
.stepper{display:flex;align-items:center;gap:var(--s3)}
.stepper input{flex:1;min-width:0}
.stepper button{
  width:52px;height:52px;flex:0 0 auto;border:0;border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-2);font-size:var(--t6);cursor:pointer;
}
.stepper button:active{background:var(--surface-3)}
#datebar{flex:0 0 auto;padding:0 var(--s4) var(--s3);background:var(--surface-1)}
#datebar .seg{margin-bottom:0}
.seg{display:flex;gap:2px;margin-bottom:var(--s4);background:var(--surface-3);
  padding:2px;border-radius:var(--radius-sm)}
.seg button{
  flex:1;padding:var(--s3) var(--s1);background:none;border:0;border-radius:calc(var(--radius-sm) - 1px);
  color:var(--text-muted);font-size:var(--t2);font-weight:600;cursor:pointer;min-height:44px;
  font-family:inherit;
}
.seg button.on{background:var(--surface-1);color:var(--text-1)}

/* ── switches ── */
.sw{display:flex;align-items:center;gap:var(--s4);padding:var(--s4);border-radius:var(--radius-md);
  background:var(--surface-2);margin-bottom:var(--s2);min-height:52px}
.sw .nm{flex:1;min-width:0;font-size:var(--t4)}
.sw .nm small{display:block;color:var(--text-muted);font-size:var(--t2);margin-top:1px}
.sw .tg{width:48px;height:28px;border-radius:14px;background:var(--surface-3);
  position:relative;cursor:pointer;flex:0 0 auto;transition:background var(--dur-fast)}
.sw .tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--text-muted);transition:all var(--dur-fast)}
.sw .tg.on{background:var(--accent)}
.sw .tg.on i{left:23px;background:var(--accent-fg)}

/* ── photo ── */
.shot{display:flex;gap:var(--s4);align-items:flex-start;margin-bottom:var(--s4)}
.shot img{width:80px;height:80px;object-fit:cover;border-radius:var(--radius-sm)}
.thumb{width:40px;height:40px;object-fit:cover;border-radius:var(--radius-sm);flex:0 0 auto}

/* ── chart ── */
.chart{width:100%;height:180px;display:block}
.chart .gl{stroke:var(--surface-3);stroke-width:1}
.chart .raw{fill:var(--text-muted);opacity:.45}
.chart .avg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .goal{stroke:var(--data-3);stroke-width:1;stroke-dasharray:3 5;fill:none}
.chart .lab{fill:var(--text-muted);font-family:var(--font-mono);font-size:9px}

.grid28{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:var(--s2)}
.grid28 i{aspect-ratio:1;border-radius:2px;background:var(--surface-3);display:block}
.grid28 i.on{background:var(--accent)}
.grid28 i.part{background:var(--accent);opacity:.35}

.conf{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:var(--s2)}
.conf i{display:block;height:100%;background:var(--accent);border-radius:2px}
.warnbox{border-radius:var(--radius-sm);padding:var(--s4);background:var(--surface-2);
  border-left:3px solid var(--warn);font-size:var(--t2);line-height:1.55;
  color:var(--text-2);margin-bottom:var(--s4)}
.split{display:flex;gap:var(--s6);align-items:flex-start}
.split>div{flex:1;min-width:0}
.k{font-family:var(--font-mono);font-size:var(--t6);font-weight:600;line-height:1.1}
.kl{font-size:var(--t2);color:var(--text-muted);margin-top:2px}

</style>
</head>
<body>
<header>
  <div class="logo">STA<b>TUS</b></div>
  <div class="spacer"></div>
  <div class="date muted mono" id="hdate" style="font-size:var(--t2)"></div>
  <button class="hbtn" onclick="openSettings()" aria-label="Settings">⚙</button>
  <button class="hbtn" onclick="location.href='../index.html'" aria-label="Home">◈</button>
</header>
<!-- Which day you are looking at is chrome, not content. It used to be the
     first card in the scrolling area and slid away the moment you scrolled,
     which is exactly the thing that reads as a web page. -->
<div id="datebar"></div>
<main class="mb-scroll"><div class="wrap" id="main"></div></main>

<button id="fab" onclick="fastInput()">+<i></i></button>

<nav id="nav"></nav>


<script>
/* ═══════════════════════════════════════════════════════════════════════
   STATUS — sleep, weight, mood, energy, steps, food and money.
   One writer for every fact it owns. Everything through the shared store.
   ═══════════════════════════════════════════════════════════════════════ */

const APP = {
  id: 'status',
  name: 'Status',
  icon: '◐',
  blurb: 'sleep, weight, mood, food and money',
  types: ['field', 'ev', 'day', 'food', 'meal', 'spend', 'acct', 'shot'],
};

/* ── settings, all namespaced under status. ───────────────────────────── */
const S = {
  get(k, d) { const v = Rec.setting(APP.id, k); return v == null ? d : v; },
  set(k, v) { Rec.setting(APP.id, k, v); },
};

Skins.load('../shared/skins.json').then(() => { if (Skins.restore) Skins.restore(APP.id); else Skins.apply(Skins.for(APP.id)); });
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* the spreadsheet builder lives further down the file, so it is reached
   through a wrapper rather than by name — a name would be read now. */
IO.register({ app: APP.id, name: APP.name, types: APP.types, sheets: function () { return exportSheets(); } });
/* ── row ids ──
   Every row this app keys by time comes through here: meals, spending, photos,
   foods and field definitions. Three parts, and each one is doing a job:

     the clock      so ids sort in the order things happened
     a counter      so two rows made in the same millisecond CANNOT collide.
                    Random characters only make that unlikely — three base-36
                    characters is one chance in 46,656 per pair, which is fine
                    until something writes in a loop. A counter makes it
                    impossible within a session, which is where loops live.
     random         so two DEVICES writing in the same millisecond with the
                    same counter still differ. Both carry user_id 'local', so
                    without this a merge could fuse two different meals into
                    one row and the older one would just be gone.

   Rec.set is keyed on (user, type, date, key), so a repeated key is not a new
   row — it is a write over the one that is already there, and it is silent. */
let seq = 0;
const uid = () => Rec.USER + '-' + Date.now().toString(36) + '-' +
  (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
const esc = s => UI.esc(String(s == null ? '' : s));
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : (d == null ? null : d); };
const r1 = n => Math.round(n * 10) / 10;
const money = n => '₱' + Math.round(n).toLocaleString();

/* ══════════════ FIELDS — the things being tracked ══════════════
   A field is a definition. Its values live in `ev` rows, one row per field
   per day, holding a list of timestamped entries. That shape covers both
   "weigh once" and "log mood five times" without a second code path.      */

/* Four kinds of thing, and that is the whole vocabulary:
     number  one reading a day        weight, sleep, steps, resting heart rate
     amount  a dose, logged as often as you like, added up   creatine, water
     scale   one to five, many times a day                   mood, energy
     check   done or not done                                morning walk    */

const SEED = [
  { id: 'weight', label: 'Weight', unit: 'lb',  measure: 'number', once: 1, agg: 'last', step: .1,  dec: 1, order: 1, on: 1 },
  { id: 'sleep',  label: 'Sleep',  unit: 'hrs', measure: 'number', once: 1, agg: 'last', step: .5,  dec: 1, target: 7, dir: 'gte', order: 2, on: 1,
    chips: [5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9] },
  { id: 'steps',  label: 'Steps',  unit: '',    measure: 'number', once: 1, agg: 'last', step: 500, dec: 0, target: 10000, dir: 'gte', order: 3, on: 1,
    chips: [3000, 5000, 8000, 10000, 12000, 15000] },
  { id: 'mood',   label: 'Mood',   unit: '',    measure: 'scale',  once: 0, agg: 'avg',  order: 4, on: 1 },
  { id: 'energy', label: 'Energy', unit: '',    measure: 'scale',  once: 0, agg: 'avg',  order: 5, on: 1 },
];

/* Things worth tracking that most people want eventually. An empty setup
   screen is a dead end; a list is an invitation.                          */
const LIBRARY = [
  { id: 'creatine',  label: 'Creatine',   unit: 'g',   measure: 'amount', step: 5,   dec: 0, chips: [5, 10, 20] },
  { id: 'potassium', label: 'Potassium',  unit: 'g',   measure: 'amount', step: .5,  dec: 1, chips: [1, 2, 3, 4] },
  { id: 'sodium',    label: 'Sodium',     unit: 'g',   measure: 'amount', step: .5,  dec: 1, chips: [1, 2, 3, 4, 5] },
  { id: 'caffeine',  label: 'Caffeine',   unit: 'mg',  measure: 'amount', step: 50,  dec: 0, chips: [100, 150, 200, 300] },
  { id: 'magnesium', label: 'Magnesium',  unit: 'mg',  measure: 'amount', step: 100, dec: 0, chips: [200, 400, 600] },
  { id: 'zinc',      label: 'Zinc',       unit: 'mg',  measure: 'amount', step: 5,   dec: 0, chips: [15, 30, 50] },
  { id: 'water',     label: 'Water',      unit: 'L',   measure: 'amount', step: .5,  dec: 1, chips: [.5, 1, 1.5, 2] },
  { id: 'rhr',       label: 'Resting HR', unit: 'bpm', measure: 'number', step: 1,   dec: 0 },
];

/* the defaults each kind of measure carries, so nothing has to be repeated */
const MEASURE = {
  number: { once: 1, agg: 'last' },
  amount: { once: 0, agg: 'sum'  },
  scale:  { once: 0, agg: 'avg'  },
  check:  { once: 1, agg: 'last' },
};
function makeField(spec) {
  const m = MEASURE[spec.measure] || MEASURE.number;
  const order = Object.values(fields()).reduce((a, f) => Math.max(a, f.order || 0), 0) + 1;
  return Object.assign({ on: 1, order: order, step: 1, dec: 0 }, m, spec);
}
function addField(spec) {
  const f = makeField(spec);
  Rec.set('field', null, f.id, f);
  return f;
}

function seedFields() {
  if (S.get('seeded')) return;
  SEED.forEach(f => Rec.set('field', null, f.id, f));
  ['Cash', 'GCash', 'Card', 'Bank'].forEach((n, i) => Rec.set('acct', null, n.toLowerCase(), { name: n, order: i }));
  S.set('seeded', 1);
}

const fields = () => Rec.map('field');
const field = id => fields()[id] || null;
const liveFields = () => Object.values(fields()).filter(f => f.on).sort((a, b) => (a.order || 0) - (b.order || 0));

/* ── values ── */
function evList(date, fid) { const r = Rec.get('ev', date, fid); return r && r.e ? r.e : []; }

function evAdd(date, fid, v) {
  const f = field(fid) || {};
  const e = f.once ? [] : evList(date, fid).slice();
  e.push({ t: Date.now(), v: v });
  Rec.set('ev', date, fid, { e: e });
}
function evDrop(date, fid, t) {
  const e = evList(date, fid).filter(x => x.t !== t);
  if (e.length) Rec.set('ev', date, fid, { e: e }); else Rec.del('ev', date, fid);
}
function value(date, fid) {
  const e = evList(date, fid); if (!e.length) return null;
  const f = field(fid) || {};
  if (f.agg === 'sum') return e.reduce((a, x) => a + x.v, 0);
  if (f.agg === 'avg') return e.reduce((a, x) => a + x.v, 0) / e.length;
  return e[e.length - 1].v;
}
const logged = (date, fid) => evList(date, fid).length > 0;

/* ══════════════ FOOD ══════════════
   A `food` row is the label as printed, plus your own serving sizes on top
   of it. The label never changes; your servings are what you actually eat.
   A `meal` row is one logged serving with its numbers frozen in, so editing
   a food tomorrow never rewrites what you ate today.                       */

const NUTS = ['p', 'c', 'f', 'kcal', 'na', 'k', 'caff'];
const foods = () => Rec.map('food');

function foodServes(fd) {
  const out = [{ label: '1 serving (' + r1(num(fd.base.amt, 1)) + ' ' + (fd.base.unit || '') + ')', mult: 1 }];
  const u = String(fd.base.unit || '').toLowerCase();
  if ((u === 'g' || u === 'ml') && fd.base.amt > 0) out.push({ label: '100 ' + u, mult: 100 / fd.base.amt });
  (fd.serves || []).forEach(s => out.push(s));
  return out;
}
function scale(fd, mult) {
  const o = { mult: mult };
  NUTS.forEach(n => { o[n] = (num(fd.base[n], 0) || 0) * mult; });
  o.price = (num(fd.base.price, 0) || 0) * mult;
  o.amt = (num(fd.base.amt, 0) || 0) * mult;
  return o;
}
function logMeal(fd, mult, serveLabel) {
  const s = scale(fd, mult);
  const row = { fid: fd.id, name: fd.name, serve: serveLabel, unit: fd.base.unit, t: Date.now() };
  NUTS.forEach(n => { row[n] = s[n]; });
  row.price = s.price; row.amt = s.amt; row.mult = mult;
  Rec.set('meal', vd(), uid(), row);
  Rec.set('food', null, fd.id, Object.assign({}, fd, { uses: (fd.uses || 0) + 1, last: Day.today() }));
}
const meals = date => Rec.all('meal', { date: date }).map(r => Object.assign({ key: r.key }, r.payload)).sort((a, b) => a.t - b.t);

function dayTotals(date) {
  const t = { p: 0, c: 0, f: 0, kcal: 0, na: 0, k: 0, caff: 0, price: 0 };
  meals(date).forEach(m => { Object.keys(t).forEach(n => { t[n] += num(m[n], 0) || 0; }); });
  return t;
}
const TARGETS = () => S.get('targets', { p: 175, c: 200, f: 80, kcal: 2220, na: 3500, k: 4500 });

/* One number, one place it comes from. Either you set it, or it is derived
   from the measured TDEE and a goal rate you chose. Never invented.      */
function calTarget() {
  if (S.get('calMode', 'fixed') === 'tdee') {
    const t = TD.targetIntake();
    if (t != null) return { v: t, src: 'tdee' };
  }
  return { v: num(TARGETS().kcal, 2220), src: 'fixed' };
}

/* ══════════════ MONEY ══════════════ */
const accts = () => Object.values(Rec.map('acct')).sort((a, b) => (a.order || 0) - (b.order || 0));
const spends = date => Rec.all('spend', { date: date }).map(r => Object.assign({ key: r.key }, r.payload)).sort((a, b) => a.t - b.t);
const spendTotal = date => spends(date).reduce((a, s) => a + (num(s.amt, 0) || 0), 0);
/* Spending is what you paid, on the day you paid it. The price on a meal is
   the value of the food eaten, which is a different fact: the groceries were
   very likely bought on some other day. It is kept for cost-per-protein and
   never added to spending.                                                 */
const dayMoney = date => spendTotal(date);

/* ══════════════ TDEE ══════════════
   A personal metabolic model that keeps learning, not a static calculator.

   The hierarchy of evidence is fixed and deliberate:

     1. what you ate against what your weight actually did   ← strongest
     2. steps and training, as learned personal predictors
     3. sleep, as context that explains the other two
     4. population averages, only ever as a fallback

   Nothing below rule 1 may overrule it. Steps are allowed to move the
   estimate before the scale has confirmed the change, but the scale is what
   settles the argument, every time.

   Missing is missing. A day with no food logged is excluded from the intake
   average; it is never counted as a zero-calorie day. Same for weight,
   steps and sleep.

   Every parameter lives in P(). Nothing numeric is hard-coded in the maths
   below, so backtest() can sweep any of them.                              */

const dayKcal = d => {
  const m = meals(d);
  if (!m.length) return null;                 /* nothing logged ≠ ate nothing */
  const k = m.reduce((a, x) => a + (num(x.kcal, 0) || 0), 0);
  return k > 0 ? k : null;
};

const TD = {
  P(over) {
    const p = {
      halfLife:  S.get('halfLife', 21),      /* days until an observation counts half */
      ed:        S.get('ed', 3500),          /* kcal per lb of scale change */
      alpha:     S.get('alpha', .25),        /* how fast the estimate adapts */
      trendWin:  S.get('win', 28),           /* days the weight trend looks at */
      lookback:  S.get('lookback', 120),     /* days of history considered at all */
      smooth:    S.get('smooth', 'roll7'),   /* roll7 | ewma */
      perLb:     S.get('perLb', 13),         /* population fallback: weight × this */
      guard:     S.get('guard', 250),        /* most one update may move it */
      minCal:    S.get('minCal', 7),         /* valid food days before measuring */
      minPts:    S.get('minPts', 14),        /* trend points before measuring */
      blockDays: S.get('blockDays', 14),     /* size of one learning block */
      stepPrior: S.get('stepPrior', .0002),  /* kcal per step per lb — population only */
      adjCap:    S.get('adjCap', 400),       /* most steps and training may shift it */
    };
    if (over) Object.keys(over).forEach(k => { p[k] = over[k]; });
    return p;
  },
  /* the accessors the settings panel and the export still speak to */
  ed: () => TD.P().ed, alpha: () => TD.P().alpha, win: () => TD.P().trendWin,
  perLb: () => TD.P().perLb, guard: () => TD.P().guard,

  /* ── one row per day, with recency weight. Missing stays null. ── */
  frame(P, end, len) {
    const days = Day.last(len || P.lookback, end || Day.today());
    const last = days.length - 1;
    return days.map((d, i) => ({
      d: d, i: i, age: last - i,
      rw: Math.exp(-Math.LN2 * (last - i) / P.halfLife),
      w: value(d, 'weight'),
      kcal: dayKcal(d),
      steps: value(d, 'steps'),
      sleep: value(d, 'sleep'),
      train: value(d, 'train'),
    }));
  },

  /* ── a smoothed weight signal, never raw day-to-day change ──
     roll7 windows must be a FULL seven days: partial windows at the start of
     a range are averages of a different width, which bends the line and
     flattened the trend by 4% on a straight test series.                    */
  smooth(rows, P) {
    const out = [];
    if (P.smooth === 'ewma') {
      const a = 2 / 8; let s = null, n = 0;
      rows.forEach(r => {
        if (r.w != null) { s = s == null ? r.w : s + a * (r.w - s); n++; }
        if (s != null && n >= 3) out.push({ i: r.i, d: r.d, y: s });
      });
      return out;
    }
    for (let i = 6; i < rows.length; i++) {
      const win = rows.slice(i - 6, i + 1).filter(x => x.w != null);
      if (win.length >= 3) out.push({ i: i, d: rows[i].d, y: win.reduce((a, x) => a + x.w, 0) / win.length });
    }
    return out;
  },

  /* weighted least squares. wOf returns the weight of a point, or null for
     an unweighted fit. */
  wls(pts, wOf) {
    const n = pts.length;
    if (n < 2) return { m: 0, b: 0, r2: 0, n: n };
    let S0 = 0, S1 = 0, S2 = 0, Sy = 0, Sxy = 0;
    pts.forEach(p => { const w = wOf ? wOf(p) : 1; S0 += w; S1 += w * p.i; S2 += w * p.i * p.i; Sy += w * p.y; Sxy += w * p.i * p.y; });
    const den = S0 * S2 - S1 * S1;
    if (!den || !S0) return { m: 0, b: 0, r2: 0, n: n };
    const m = (S0 * Sxy - S1 * Sy) / den, b = (Sy - m * S1) / S0, ybar = Sy / S0;
    let ssRes = 0, ssTot = 0;
    pts.forEach(p => { const w = wOf ? wOf(p) : 1; ssRes += w * Math.pow(p.y - (m * p.i + b), 2); ssTot += w * Math.pow(p.y - ybar, 2); });
    return { m: m, b: b, r2: ssTot > 0 ? Math.max(0, 1 - ssRes / ssTot) : 0, n: n };
  },

  /* recency-weighted mean, skipping missing values entirely */
  wmean(rows, pick) {
    let sw = 0, sv = 0;
    rows.forEach(r => { const v = pick(r); if (v == null) return; sw += r.rw; sv += r.rw * v; });
    return sw > 0 ? sv / sw : null;
  },
  mean(rows, pick) {
    const v = rows.map(pick).filter(x => x != null);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  },

  /* ── rule 1: intake against the weight trend ── */
  observed(rows, P) {
    const all = TD.smooth(rows, P);
    const cut = rows.length - P.trendWin;
    const pts = all.filter(p => p.i >= cut);
    const cal = rows.filter(r => r.kcal != null);
    const res = { pts: pts, calDays: cal.length, weighIns: rows.filter(r => r.w != null).length,
      tdee: null, intake: null, rate: null, r2: 0 };
    if (cal.length < P.minCal || pts.length < P.minPts) return res;
    const last = rows.length - 1;
    const fit = TD.wls(pts, p => Math.exp(-Math.LN2 * (last - p.i) / P.halfLife));
    res.intake = TD.wmean(cal, r => r.kcal);
    res.rate = fit.m;                      /* lb per day, negative = losing */
    res.r2 = fit.r2;
    res.tdee = res.intake - fit.m * P.ed;  /* losing weight means burning above intake */
    return res;
  },

  /* ── learning blocks: each is an independent little experiment ── */
  blocks(rows, P) {
    const out = [];
    for (let start = 0; start + P.blockDays <= rows.length; start += P.blockDays) {
      const seg = rows.slice(start, start + P.blockDays);
      const cal = seg.filter(r => r.kcal != null);
      const pts = TD.smooth(seg, P);
      if (cal.length < Math.ceil(P.blockDays * .4) || pts.length < 5) continue;
      const fit = TD.wls(pts, null);
      out.push({
        from: seg[0].d, to: seg[seg.length - 1].d,
        tdee: (cal.reduce((a, r) => a + r.kcal, 0) / cal.length) - fit.m * P.ed,
        steps: TD.mean(seg, r => r.steps),
        train: TD.mean(seg, r => r.train),
        sleep: TD.mean(seg, r => r.sleep),
      });
    }
    return out;
  },

  /* regress block TDEE against one predictor. Refuses to claim a
     relationship it cannot see. */
  learn(blocks, key, lo, hi) {
    const b = blocks.filter(x => x[key] != null && isFinite(x.tdee));
    if (b.length < 5) return { k: null, n: b.length, r2: 0, why: b.length + ' of 5 blocks with ' + key };
    const fit = TD.wls(b.map(x => ({ i: x[key], y: x.tdee })), null);
    if (fit.r2 < .3) return { k: null, n: b.length, r2: fit.r2, why: 'no clear pattern yet' };
    if (fit.m < lo || fit.m > hi) return { k: null, n: b.length, r2: fit.r2, why: 'the fit is not physically sensible' };
    return { k: fit.m, n: b.length, r2: fit.r2 };
  },

  state() { return S.get('tdeeState', null); },
  lastWeight(rows) {
    for (let i = rows.length - 1; i >= 0; i--) if (rows[i].w != null) return rows[i].w;
    return null;
  },

  estimate() {
    if (TD._cache && !TD._dirty) return TD._cache;
    TD._cache = TD.compute(); TD._dirty = false;
    return TD._cache;
  },

  compute(over) {
    const P = TD.P(over);
    const rows = TD.frame(P);
    const obs = TD.observed(rows, P);
    const lastW = TD.lastWeight(rows);
    const baseline = lastW ? Math.round(lastW * P.perLb) : null;
    const st = TD.state();
    /* The smoothing exists to damp day-to-day updates, not to make the very
       first estimate crawl up from a population guess. With no saved state,
       start where the evidence already points.                            */
    const prev = st && st.v ? st.v
      : (obs.tdee != null ? Math.round(obs.tdee) : baseline);

    const o = {
      P: P, rows: rows, series: rows, roll: obs.pts, blocks: [],
      baseline: baseline, calDays: obs.calDays, weighIns: obs.weighIns,
      observed: null, tdee: prev, predicted: null, basis: 'baseline',
      rate: null, intake: null, r2: 0, conf: 0, why: null, gap: null,
      stepK: null, stepSrc: null, trainK: null, stepDelta: 0, trainDelta: 0,
      sleepNote: null, learn: {},
    };

    if (!lastW) { o.tdee = null; o.why = 'no weight logged yet'; return o; }
    if (obs.tdee == null) {
      o.why = obs.calDays < P.minCal
        ? obs.calDays + ' of ' + P.minCal + ' days of food logged'
        : obs.pts.length + ' of ' + P.minPts + ' days of weight trend';
      o.conf = Math.round(15 * Math.min(1, obs.calDays / P.minCal));
      return o;
    }

    /* rule 1 has spoken */
    o.basis = 'measured';
    o.observed = Math.round(obs.tdee);
    o.intake = Math.round(obs.intake);
    o.rate = obs.rate * 7;                  /* lb per week */
    o.r2 = obs.r2;

    /* rules 2 and 3: what steps and training say, learned from this person */
    const blocks = TD.blocks(rows, P);
    o.blocks = blocks;
    const ls = TD.learn(blocks, 'steps', 0, .15);      /* kcal per step */
    const lt = TD.learn(blocks, 'train', 0, 40);       /* kcal per unit of training */
    o.learn = { steps: ls, train: lt };

    const recent = rows.slice(-7);
    const stepsNow = TD.wmean(recent, r => r.steps), stepsBase = TD.wmean(rows, r => r.steps);
    const trainNow = TD.wmean(recent, r => r.train), trainBase = TD.wmean(rows, r => r.train);
    const sleepNow = TD.wmean(recent, r => r.sleep), sleepBase = TD.wmean(rows, r => r.sleep);

    if (ls.k != null) { o.stepK = ls.k; o.stepSrc = 'learned from ' + ls.n + ' blocks'; }
    else if (lastW) { o.stepK = P.stepPrior * lastW; o.stepSrc = 'population figure, not yours yet'; }
    /* training gets no population figure at all. A generic calorie burn per
       workout is a guess dressed as data, so until it is learned it is zero. */
    if (lt.k != null) o.trainK = lt.k;

    let adj = 0;
    if (o.stepK != null && stepsNow != null && stepsBase != null) {
      o.stepDelta = stepsNow - stepsBase;
      adj += o.stepK * o.stepDelta;
    }
    if (o.trainK != null && trainNow != null && trainBase != null) {
      o.trainDelta = trainNow - trainBase;
      adj += o.trainK * o.trainDelta;
    }
    if (adj > P.adjCap) adj = P.adjCap;
    if (adj < -P.adjCap) adj = -P.adjCap;
    o.adj = adj;

    /* sleep is context, never calories */
    if (sleepNow != null && sleepBase != null && Math.abs(sleepNow - sleepBase) >= .75) {
      const dir = sleepNow < sleepBase ? 'down' : 'up';
      o.sleepNote = 'Sleep is ' + dir + ' ' + r1(Math.abs(sleepNow - sleepBase)) + ' hrs on your own average' +
        (o.stepDelta ? ', and steps are ' + (o.stepDelta < 0 ? 'down ' : 'up ') + Math.abs(Math.round(o.stepDelta)) : '') +
        '. Sleep is not counted as calories — it is here to explain the rest.';
    }

    /* confidence, before the update, so the update can use it */
    const c1 = Math.min(1, obs.calDays / (P.trendWin * .8));
    const c2 = Math.min(1, obs.weighIns / (P.trendWin * .7));
    const c3 = Math.min(1, obs.r2);
    const c4 = Math.min(1, rows.filter(r => r.w != null || r.kcal != null).length / 60);
    const c5 = 1 - Math.min(1, Math.abs(obs.tdee - prev) / 600);
    const c6 = 1 - Math.min(1, Math.abs(adj) / 400);
    o.conf = Math.round(100 * (.22 * c1 + .20 * c2 + .20 * c3 + .10 * c4 + .14 * c5 + .14 * c6));

    /* adapt faster on good recent data, slower on poor data */
    const aEff = P.alpha * (.3 + .7 * (o.conf / 100));
    o.alphaUsed = aEff;
    let next = prev + aEff * (obs.tdee - prev);
    if (Math.abs(next - prev) > P.guard) next = prev + (next > prev ? P.guard : -P.guard);
    o.tdee = Math.round(next);

    /* the two numbers, kept separate on purpose */
    o.predicted = Math.round(next + adj);
    o.gap = o.predicted - o.observed;
    return o;
  },

  /* the estimate moves once a day, so opening the app twice cannot walk it twice */
  tick() {
    const st = TD.state();
    if (st && st.at === Day.today()) return;
    const e = TD.estimate();
    if (e.tdee == null) return;
    S.set('tdeeState', { v: e.tdee, at: Day.today(), conf: e.conf, basis: e.basis });
    TD._dirty = true;
  },

  /* what to eat: the current best estimate of right now, minus the goal */
  targetIntake() {
    const e = TD.estimate();
    const base = e.predicted != null ? e.predicted : e.tdee;
    if (base == null) return null;
    return Math.round(base - (S.get('goalRate', 1.25) * TD.P().ed / 7));
  },

  /* ══════ BACKTEST ══════
     Walk history forward. At each day, estimate TDEE from that day's data
     only, then predict what the weight should do over the next `horizon`
     days given what was actually eaten, and compare with what it did.
     The score is mean absolute error in pounds. Lower is better.          */
  backtest(over, horizon) {
    const P = TD.P(over);
    const H = horizon || 14;
    const rows = TD.frame(P);
    const truth = TD.smooth(rows, P);
    const byI = {}; truth.forEach(p => { byI[p.i] = p.y; });
    let sum = 0, n = 0, est = null;
    for (let t = P.minPts + 6; t < rows.length - H; t++) {
      const sub = rows.slice(0, t + 1).map(r => ({
        i: r.i, d: r.d, w: r.w, kcal: r.kcal, steps: r.steps, sleep: r.sleep, train: r.train,
        rw: Math.exp(-Math.LN2 * (t - r.i) / P.halfLife),
      }));
      const obs = TD.observed(sub, P);
      if (obs.tdee == null) continue;
      /* walk the adaptive estimate forward exactly as the app would, so the
         adaptation rate and the brake are genuinely being scored and not
         quietly ignored. */
      if (est == null) est = obs.tdee;
      else {
        let nx = est + P.alpha * (obs.tdee - est);
        if (Math.abs(nx - est) > P.guard) nx = est + (nx > est ? P.guard : -P.guard);
        est = nx;
      }
      if (byI[t] == null || byI[t + H] == null) continue;
      const fwd = rows.slice(t + 1, t + 1 + H).filter(r => r.kcal != null);
      if (fwd.length < H * .6) continue;
      const predLb = fwd.reduce((a, r) => a + (r.kcal - est), 0) / P.ed;
      const realLb = byI[t + H] - byI[t];
      sum += Math.abs(predLb - realLb); n++;
    }
    return { mae: n ? sum / n : null, n: n, horizon: H };
  },

  /* sweep the parameters that matter and rank them honestly */
  optimise(onStep) {
    /* Energy density is deliberately NOT swept. It sits on both sides of the
       score — it sets the estimate and it converts the estimate back into
       pounds — so it cancels out and every value scores identically. A sweep
       would return a confident-looking number that means nothing. It stays a
       manual setting. */
    const grid = {
      halfLife: [10, 14, 21, 28, 42],
      alpha:    [.15, .25, .35],
      trendWin: [21, 28, 35],
    };
    const out = [];
    const keys = Object.keys(grid);
    const rec = (i, acc) => {
      if (i === keys.length) {
        const r = TD.backtest(acc, 14);
        if (r.mae != null && r.n >= 10) out.push({ p: Object.assign({}, acc), mae: r.mae, n: r.n });
        return;
      }
      grid[keys[i]].forEach(v => { acc[keys[i]] = v; rec(i + 1, acc); });
    };
    rec(0, {});
    out.sort((a, b) => a.mae - b.mae);
    return out;
  },
};
TD._dirty = true;
Rec.on(() => { TD._dirty = true; });
Day.on(() => { TD._dirty = true; });

/* ══════════════ THE ENTRY SHEET ══════════════
   Everything you log slides up from the bottom, within thumb reach, and
   closes itself the moment the fact is saved.                            */

/* The sheet is the shared one now. Loading shared/mobile.js turns every
   UI.dialog into a bottom sheet that the back gesture closes, that can be
   thrown away downwards, and that gets out of the keyboard's way. All of
   that used to be hand-rolled in this file and is now deleted.          */
let sheetH = null;

/* Stepping from the Log sheet into Weight is navigation inside one sheet,
   not a second sheet on top of the first. Closing one and opening another
   also breaks: the shared sheet unwinds its own history entry on close, and
   that back() lands asynchronously — after the replacement has already
   pushed its own. Do that a few times and the stack walks off the page.
   So there is exactly one sheet, and moving around swaps what is in it. */
function fillSheet(h, title, build, opts) {
  const t = h.panel.querySelector('.mb-sheet-head h3');
  if (t) t.textContent = title || '';
  h.body.innerHTML = '';
  h.body.scrollTop = 0;
  build(h.body, { close: closeSheet, panel: h.body });
  Mobile.form(h.body);          /* Next moves down the fields, Done closes the keyboard */
  if (opts && opts.focus) {
    setTimeout(() => { const f = h.body.querySelector('input,textarea,select'); if (f) f.focus(); }, 380);
  }
}

function openSheet(title, build, opts) {
  if (sheetH) {
    Mobile.feedback('select');
    fillSheet(sheetH, title, build, opts);
    return sheetH;
  }
  return UI.dialog({
    title: title,
    width: 620,
    onClose: () => { sheetH = null; },     /* back gesture, veil tap and drag all land here */
    body: (b, h) => { sheetH = h; fillSheet(h, title, build, opts); },
  });
}

function closeSheet() {
  const h = sheetH; sheetH = null;
  if (h) { try { h.close(); } catch (e) {} }
}

/* small builders ---------------------------------------------------- */
function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
function chipRow(vals, onPick, cls) {
  const w = el('div', 'chips');
  vals.forEach(v => {
    const b = el('button', 'chip' + (cls ? ' ' + cls : ''), esc(v.label != null ? v.label : v));
    b.onclick = () => onPick(v.value != null ? v.value : v);
    w.appendChild(b);
  });
  return w;
}
function numberInput(v, step, dec) {
  const w = el('div', 'stepper');
  const minus = el('button', null, '−'), plus = el('button', null, '+');
  const i = document.createElement('input');
  i.className = 'num';
  Mobile.field(i, dec ? 'decimal' : 'number');
  i.value = v == null ? '' : String(v);
  const bump = d => {
    const cur = num(i.value, 0) || 0;
    const n = Math.max(0, cur + d * step);
    i.value = dec ? String(r1(n)) : String(Math.round(n));
  };
  minus.onclick = () => bump(-1); plus.onclick = () => bump(1);
  w.appendChild(minus); w.appendChild(i); w.appendChild(plus);
  w.input = i;
  return w;
}
function saveBar(label, fn) {
  const b = el('button', 'btn go wide', label || 'SAVE');
  b.style.marginTop = '12px'; b.style.minHeight = '50px';
  b.onclick = fn;
  return b;
}

/* ══════════════ PHOTOS ══════════════
   The camera comes through a plain file input, which is the one route that
   works on an iPhone opened from a folder. Pictures are shrunk before they
   are stored: a full phone photo is 3MB and the whole store is about 5MB. */

function pickPhoto(cb) {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  i.setAttribute('capture', 'environment');
  i.style.display = 'none';
  document.body.appendChild(i);
  i.onchange = () => {
    const f = i.files && i.files[0];
    document.body.removeChild(i);
    if (f) cb(f);
  };
  i.click();
}
function shrink(file, max, quality) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('could not read the photo'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('could not open the photo'));
      img.onload = () => {
        let w = img.width, h = img.height;
        const s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function saveShot(kind, dataUrl, ref) {
  const id = uid();
  Rec.set('shot', vd(), id, { img: dataUrl, kind: kind, ref: ref || null, t: Date.now() });
  return id;
}
const shotCount = () => Rec.all('shot').length;

/* ══════════════ READING TEXT OFF A PHOTO ══════════════
   Loaded from a CDN only when asked for, and only ever an assist. If it
   does not load, or reads nonsense, the manual form is right there with
   the picture beside it. Never a dependency.                              */

const OCR = {
  url: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  loading: null,
  load() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (OCR.loading) return OCR.loading;
    OCR.loading = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = OCR.url;
      s.onload = () => res(window.Tesseract);
      s.onerror = () => rej(new Error('offline'));
      document.head.appendChild(s);
      setTimeout(() => rej(new Error('timeout')), 20000);
    }).catch(e => { OCR.loading = null; throw e; });
    return OCR.loading;
  },
  read(dataUrl, onProgress) {
    return OCR.load().then(T => T.recognize(dataUrl, 'eng', {
      logger: m => { if (m.status === 'recognizing text' && onProgress) onProgress(m.progress); },
    })).then(r => r.data.text || '');
  },
};

/* pull a number that follows a word, tolerating the usual label noise */
function grab(text, words, unit) {
  const t = text.replace(/[,]/g, '').toLowerCase();
  for (let i = 0; i < words.length; i++) {
    const re = new RegExp(words[i] + '[^0-9\\n]{0,24}([0-9]+(?:\\.[0-9]+)?)\\s*' + (unit || ''), 'i');
    const m = t.match(re);
    if (m) return parseFloat(m[1]);
  }
  return null;
}
function parseLabel(text) {
  const o = {};
  o.kcal = grab(text, ['energy', 'calories', 'calorie', 'kcal']);
  o.p    = grab(text, ['protein'], 'g?');
  o.c    = grab(text, ['total carbohydrate', 'carbohydrate', 'carbs', 'carb'], 'g?');
  o.f    = grab(text, ['total fat', 'fat'], 'g?');
  o.na   = grab(text, ['sodium'], 'mg?');
  o.k    = grab(text, ['potassium'], 'mg?');
  o.caff = grab(text, ['caffeine'], 'mg?');
  const sz = text.match(/serving size[^0-9\n]{0,20}([0-9]+(?:\.[0-9]+)?)\s*(g|ml|mL|G|ML)/i);
  if (sz) { o.amt = parseFloat(sz[1]); o.unit = sz[2].toLowerCase(); }
  return o;
}
function parseReceipt(text) {
  const o = {};
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++) {
    if (/total/i.test(lines[i]) && !/sub\s*total/i.test(lines[i])) {
      const m = lines[i].replace(/,/g, '').match(/([0-9]+(?:\.[0-9]{1,2})?)/g);
      if (m && m.length) { o.amt = parseFloat(m[m.length - 1]); break; }
    }
  }
  if (o.amt == null) {
    const all = (text.replace(/,/g, '').match(/[0-9]+\.[0-9]{2}/g) || []).map(parseFloat);
    if (all.length) o.amt = Math.max.apply(null, all);
  }
  if (lines.length) o.note = lines[0].slice(0, 40);
  return o;
}

/* the photo strip used by both the label reader and the receipt reader */
function photoBlock(body, kind, onText, onShot) {
  const wrap = el('div', 'shot');
  const status = el('div', 'note', 'Take a picture and it will try to read the numbers. Check them.');
  let imgEl = null;
  const take = el('button', 'btn', 'Photo');
  take.onclick = () => pickPhoto(file => {
    status.textContent = 'shrinking…';
    shrink(file, 1400, .8).then(big => {
      return shrink(file, 360, .6).then(small => {
        const id = saveShot(kind, small);
        if (onShot) onShot(id, small);
        if (!imgEl) { imgEl = document.createElement('img'); wrap.insertBefore(imgEl, wrap.firstChild); }
        imgEl.src = small;
        status.textContent = 'reading…';
        return OCR.read(big, p => { status.textContent = 'reading… ' + Math.round(p * 100) + '%'; })
          .then(txt => { status.textContent = 'read it — check every number before saving.'; onText(txt); })
          .catch(() => { status.textContent = 'could not read the picture. Type the numbers in — the photo is saved.'; });
      });
    }).catch(e => { status.textContent = 'could not use that photo: ' + e.message; });
  });
  const col = el('div');
  col.style.flex = '1';
  col.appendChild(take);
  col.appendChild(status);
  wrap.appendChild(col);
  body.appendChild(wrap);
}
</script>

<script>
/* ══════════════ THE FAST INPUT ══════════════
   One tap to open, one tap to log. Anything measured once a day drops off
   this list the moment it is logged, so what is left is only what is left
   to do.                                                                  */

const outstanding = () => liveFields().filter(f => f.once && !logged(vd(), f.id));

function fastInput() {
  openSheet('Log', body => {
    const out = outstanding();
    const multi = liveFields().filter(f => !f.once);
    if (!Day.isToday(vd())) body.appendChild(el('div', 'warnbox', 'Logging into ' + esc(Day.label(vd())) + ', not today.'));

    if (out.length) {
      const g = el('div');
      out.forEach(f => {
        const b = el('button', 'btn wide', f.label + (f.target ? '  <span class="muted mono">' + (f.dir === 'lte' ? '≤' : '≥') + ' ' + f.target + '</span>' : ''));
        b.style.cssText = 'margin-bottom:var(--s2);min-height:54px;text-align:left';
        b.onclick = () => fieldSheet(f, vd());
        g.appendChild(b);
      });
      body.appendChild(g);
    }

    const row = el('div', 'grid2');
    multi.forEach(f => {
      const b = el('button', 'btn wide', f.label);
      b.style.minHeight = '54px';
      b.onclick = () => fieldSheet(f, vd());
      row.appendChild(b);
    });
    const fb = el('button', 'btn wide', 'Food');   fb.style.minHeight = '54px'; fb.onclick = foodPicker;
    const sb = el('button', 'btn wide', 'Spend');  sb.style.minHeight = '54px'; sb.onclick = () => spendSheet();
    row.appendChild(fb); row.appendChild(sb);
    body.appendChild(row);
  });
}

/* ── one field, one sheet ── */
function fieldSheet(f, date) {
  if (f.measure === 'scale') return scaleSheet(f, date);
  if (f.measure === 'check') return toggleCheck(f, date);
  return numberSheet(f, date);
}

/* a check needs no sheet at all: tapping it is the whole interaction */
function toggleCheck(f, date) {
  const d = date || vd();
  if (logged(d, f.id)) { Rec.del('ev', d, f.id); Mobile.feedback('untick'); }
  else { evAdd(d, f.id, 1); Mobile.feedback('tick'); }
  closeSheet(); draw();
}

/* numbers and doses. A dose adds up through the day; a number replaces. */
function numberSheet(f, date) {
  const d = date || vd();
  const dose = f.measure === 'amount';
  openSheet(f.label + (Day.isToday(d) ? '' : ' · ' + Day.short(d)), body => {
    const cur = dose ? null : value(d, f.id);
    let prev = null, prevAgo = 0;
    if (!dose) {
      const back = Day.last(30, Day.shift(d, -1));
      for (let i = back.length - 1; i >= 0; i--) {
        const v = value(back[i], f.id);
        if (v != null) { prev = v; prevAgo = Day.diff(d, back[i]); break; }
      }
    }
    const commit = v => {
      if (v == null || !isFinite(v)) return UI.toast('Type a number first', { bad: true });
      evAdd(d, f.id, v);
      Mobile.feedback(f.target && (f.dir === 'lte' ? v <= f.target : v >= f.target) ? 'success' : 'tick');
      afterLog();
    };

    if (f.chips && f.chips.length) {
      body.appendChild(chipRow(f.chips.map(v => ({ label: String(v), value: v })), commit));
    }
    const inp = numberInput(cur != null ? cur : prev, f.step || 1, f.dec ? 1 : 0);
    body.appendChild(inp);

    if (prev != null) {
      const p = el('button', 'btn wide quiet', 'Last ' + prev + (f.unit ? ' ' + f.unit : '') + ' · ' + (prevAgo === 1 ? 'yesterday' : prevAgo + ' days ago'));
      p.style.marginTop = 'var(--s3)';
      p.onclick = () => commit(prev);
      body.appendChild(p);
    }
    body.appendChild(saveBar('Save', () => commit(num(inp.input.value))));

    if (dose) {
      const list = evList(d, f.id);
      if (list.length) {
        const tot = el('div', 'note', 'Today: ' + r1(value(d, f.id)) + (f.unit ? ' ' + f.unit : ''));
        body.appendChild(tot);
        list.slice().reverse().forEach(e => body.appendChild(entryRow(f, d, e)));
      }
    }
  }, { focus: !(f.chips && f.chips.length) });
}

/* one logged entry, with the time it happened and a way to take it back */
function entryRow(f, d, e) {
  const r = el('div', 'row');
  r.innerHTML = '<span class="nm">' + r1(e.v) + (f.unit ? ' ' + esc(f.unit) : '') +
    '</span><span class="fig">' + new Date(e.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '</span>';
  const x = el('button', 'x', '✕');
  x.onclick = () => { evDrop(d, f.id, e.t); fieldSheet(f, d); };
  r.appendChild(x);
  return r;
}

function scaleSheet(f, date) {
  const d = date || vd();
  const WORDS = { 1: 'bad', 2: 'low', 3: 'ok', 4: 'good', 5: 'great' };
  openSheet(f.label, body => {
    const w = el('div', 'chips');
    [1, 2, 3, 4, 5].forEach(v => {
      const b = el('button', 'chip big', v + '<small>' + WORDS[v] + '</small>');
      b.onclick = () => { evAdd(d, f.id, v); Mobile.feedback('tick'); afterLog(); };
      w.appendChild(b);
    });
    body.appendChild(w);
    evList(d, f.id).slice().reverse().forEach(e => body.appendChild(entryRow(f, d, e)));
  });
}

/* after any log: if that was the last outstanding once-a-day thing, say so */
function afterLog() {
  const left = outstanding().length;
  closeSheet();
  draw();
  if (!left) { Mobile.feedback('complete'); UI.toast('Day complete'); }
}

/* ══════════════ SPENDING ══════════════
   Amount, account, details. The time fills itself in unless you change it. */

function spendSheet(existing) {
  openSheet(existing ? 'Edit spend' : 'Spend', body => {
    let shotId = existing ? existing.shot : null;
    let acct = existing ? existing.acct : S.get('lastAcct', (accts()[0] || {}).name || 'Cash');
    const when = new Date(existing ? existing.t : Date.now());

    const amt = numberInput(existing ? existing.amt : null, 50, 1);
    body.appendChild(el('label', 'fl', 'Amount'));
    body.appendChild(amt);

    body.appendChild(el('label', 'fl', 'Account'));
    const aw = el('div', 'chips');
    const paint = () => {
      aw.innerHTML = '';
      accts().forEach(a => {
        const b = el('button', 'chip' + (a.name === acct ? ' on' : ''), esc(a.name));
        b.onclick = () => { acct = a.name; paint(); };
        aw.appendChild(b);
      });
    };
    paint();
    body.appendChild(aw);

    body.appendChild(el('label', 'fl', 'Details'));
    const note = document.createElement('input');
    note.type = 'text'; note.placeholder = 'What for';
    note.value = existing ? (existing.note || '') : '';
    body.appendChild(note);

    body.appendChild(el('label', 'fl', 'Time'));
    const tm = document.createElement('input');
    tm.type = 'time';                    /* the phone's own time wheel, colon included */
    tm.value = String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0');
    body.appendChild(tm);

    body.appendChild(el('label', 'fl', 'Receipt'));
    photoBlock(body, 'receipt', txt => {
      const g = parseReceipt(txt);
      if (g.amt != null) amt.input.value = String(g.amt);
      if (g.note && !note.value) note.value = g.note;
    }, id => { shotId = id; });

    body.appendChild(saveBar(existing ? 'Update' : 'Save', () => {
      const v = num(amt.input.value);
      if (v == null || v <= 0) return UI.toast('How much?', { bad: true });
      const parts = String(tm.value).split(':');
      const dt = new Date(when);
      if (parts.length === 2) dt.setHours(num(parts[0], 0) || 0, num(parts[1], 0) || 0, 0, 0);
      const row = { amt: v, acct: acct, note: note.value.trim(), t: dt.getTime(), shot: shotId };
      Rec.set('spend', existing ? existing.date : vd(), existing ? existing.key : uid(), row);
      S.set('lastAcct', acct);
      Mobile.feedback('tick');
      closeSheet(); draw();
    }));
  }, { focus: !existing });
}
</script>

<script>
/* ══════════════ FOOD ══════════════ */

function foodPicker() {
  openSheet('Food', body => {
    const q = document.createElement('input');
    q.type = 'search'; q.placeholder = 'Search foods';
    body.appendChild(q);

    const list = el('div');
    list.style.marginTop = '9px';
    const paint = () => {
      const term = q.value.trim().toLowerCase();
      const all = Object.values(foods())
        .filter(f => !term || (f.name + ' ' + (f.brand || '')).toLowerCase().indexOf(term) > -1)
        .sort((a, b) => (b.uses || 0) - (a.uses || 0) || String(a.name).localeCompare(String(b.name)));
      list.innerHTML = '';
      if (!all.length) {
        list.appendChild(el('div', 'empty', Object.keys(foods()).length
          ? 'Nothing matches. Try fewer letters, or add it as a new food.'
          : 'No foods yet. Add one by photographing its nutrition panel, or type it in. Once it is in here, logging it is two taps.'));
      }
      all.slice(0, 40).forEach(f => {
        const r = el('div', 'row tap');
        r.innerHTML = '<span class="nm">' + esc(f.name) +
          '<small>' + esc(f.brand || '') + (f.brand ? ' · ' : '') + r1(num(f.base.amt, 0)) + ' ' + esc(f.base.unit || '') + ' · ' +
          Math.round(num(f.base.kcal, 0)) + ' kcal · ' + r1(num(f.base.p, 0)) + 'p</small></span>';
        r.onclick = () => amountSheet(f);
        const e = el('button', 'x', '✎');
        e.onclick = ev => { ev.stopPropagation(); foodEditor(f); };
        r.appendChild(e);
        list.appendChild(r);
      });
    };
    q.oninput = paint; paint();
    body.appendChild(list);

    const add = el('button', 'btn go wide', 'New food');
    add.style.cssText = 'margin-top:10px;min-height:50px';
    add.onclick = () => foodEditor(null);
    body.appendChild(add);
  });
}

/* how much of it — servings, straight units, or "however much hits 50g protein" */
function amountSheet(fd) {
  openSheet(fd.name, body => {
    const serves = foodServes(fd);
    let mode = 'serve', si = Math.min(fd.dflt || 0, serves.length - 1), mult = serves[si].mult;

    const seg = el('div', 'seg');
    const out = el('div');
    const preview = el('div');

    const setMult = m => { mult = m > 0 ? m : 0; paintPreview(); };

    function paintPreview() {
      const s = scale(fd, mult);
      preview.innerHTML =
        '<div class="row" style="margin-top:10px"><span class="nm">' + r1(s.amt) + ' ' + esc(fd.base.unit || '') +
        '<small>' + r1(mult) + ' × the label serving</small></span>' +
        '<span class="fig">' + Math.round(s.kcal) + ' kcal<br>' + r1(s.p) + 'p · ' + r1(s.c) + 'c · ' + r1(s.f) + 'f</span></div>' +
        (s.price ? '<div class="note">Costs ' + money(s.price) + ', which lands on the money screen too.</div>' : '');
    }

    function paintMode() {
      seg.innerHTML = '';
      [['serve', 'Servings'], ['unit', fd.base.unit || 'Units'], ['hit', 'To hit']].forEach(m => {
        const b = el('button', mode === m[0] ? 'on' : '', m[1]);
        b.onclick = () => { mode = m[0]; paintMode(); };
        seg.appendChild(b);
      });
      out.innerHTML = '';

      if (mode === 'serve') {
        const cw = el('div', 'chips');
        serves.forEach((s, i) => {
          const b = el('button', 'chip' + (i === si ? ' on' : ''), esc(s.label));
          b.onclick = () => { si = i; setMult(s.mult * (num(qty.input.value, 1) || 1)); paintMode(); };
          cw.appendChild(b);
        });
        out.appendChild(cw);
        var qty = numberInput(r1(mult / serves[si].mult), .5, 1);
        qty.input.oninput = () => setMult(serves[si].mult * (num(qty.input.value, 0) || 0));
        out.appendChild(el('label', 'fl', 'How many'));
        out.appendChild(qty);
      } else if (mode === 'unit') {
        const a = numberInput(r1(mult * num(fd.base.amt, 0)), Math.max(1, Math.round(num(fd.base.amt, 100) / 10)), 1);
        a.input.oninput = () => setMult((num(a.input.value, 0) || 0) / (num(fd.base.amt, 1) || 1));
        out.appendChild(el('label', 'fl', 'How much, in ' + (fd.base.unit || 'units')));
        out.appendChild(a);
        out.appendChild(chipRow([50, 100, 150, 200, 250, 500].map(v => ({ label: String(v), value: v })), v => {
          a.input.value = String(v); setMult(v / (num(fd.base.amt, 1) || 1));
        }));
      } else {
        let key = 'p';
        const kw = el('div', 'chips');
        [['p', 'Protein g'], ['kcal', 'Calories']].forEach(k => {
          const b = el('button', 'chip' + (key === k[0] ? ' on' : ''), k[1]);
          b.onclick = () => { key = k[0]; paintMode(); };
          kw.appendChild(b);
        });
        out.appendChild(el('label', 'fl', 'Hit this much'));
        out.appendChild(kw);
        const per = num(fd.base[key], 0) || 0;
        if (per <= 0) {
          out.appendChild(el('div', 'warnbox', 'This food has no ' + (key === 'p' ? 'protein' : 'calorie') + ' figure on its label, so there is nothing to solve for. Edit the food and add it.'));
        } else {
          const t = numberInput(key === 'p' ? 50 : 500, key === 'p' ? 5 : 50, 0);
          t.input.oninput = () => setMult((num(t.input.value, 0) || 0) / per);
          out.appendChild(t);
          setMult((num(t.input.value, 0) || 0) / per);
        }
      }
      paintPreview();
    }

    body.appendChild(seg);
    body.appendChild(out);
    body.appendChild(preview);
    paintMode();

    body.appendChild(saveBar('Log it', () => {
      if (!mult || mult <= 0) return UI.toast('How much?', { bad: true });
      logMeal(fd, mult, mode === 'serve' ? serves[si].label : (mode === 'unit' ? r1(mult * num(fd.base.amt, 0)) + ' ' + (fd.base.unit || '') : 'to target'));
      Mobile.feedback('tick');
      closeSheet(); draw();
    }));
  });
}

/* the food itself: the label as printed, then your own servings on top */
function foodEditor(fd) {
  const isNew = !fd;
  const f = fd ? JSON.parse(JSON.stringify(fd)) : { id: uid(), name: '', brand: '', base: { amt: 100, unit: 'g' }, serves: [], uses: 0 };
  openSheet(isNew ? 'New food' : 'Edit food', body => {
    const inputs = {};
    let shotId = f.shot || null;

    photoBlock(body, 'label', txt => {
      const g = parseLabel(txt);
      Object.keys(g).forEach(k => { if (g[k] != null && inputs[k]) inputs[k].value = String(g[k]); });
      UI.toast('Check every number');
    }, id => { shotId = id; });

    const TEXTY = { name: 1, brand: 1, unit: 1, cat: 1 };
    const groups = [];
    Object.values(foods()).forEach(x => { if (x.cat && groups.indexOf(x.cat) < 0) groups.push(x.cat); });
    const mk = (key, label, val, wide) => {
      const w = el('div', 'field');
      w.appendChild(el('label', 'fl', label));
      const i = document.createElement('input');
      i.type = 'text';
      if (!TEXTY[key]) { i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*'); }
      if (key === 'cat' && groups.length) {          /* pick a group you already use, or type a new one */
        const dl = document.createElement('datalist');
        dl.id = 'grp-' + f.id;
        groups.forEach(gname => { const o = document.createElement('option'); o.value = gname; dl.appendChild(o); });
        w.appendChild(dl);
        i.setAttribute('list', dl.id);
      }
      i.value = val == null ? '' : String(val);
      inputs[key] = i; w.appendChild(i);
      if (wide) w.style.gridColumn = '1 / -1';
      return w;
    };

    body.appendChild(mk('name', 'Name', f.name, 1));
    const g1 = el('div', 'grid2');
    g1.appendChild(mk('brand', 'Brand or place', f.brand));
    g1.appendChild(mk('cat', 'Group', f.cat));
    body.appendChild(g1);

    body.appendChild(el('label', 'fl', 'One serving, as printed on the label'));
    const g2 = el('div', 'grid2');
    g2.appendChild(mk('amt', 'Amount', f.base.amt));
    g2.appendChild(mk('unit', 'Unit', f.base.unit));
    body.appendChild(g2);

    const g3 = el('div', 'grid3');
    g3.appendChild(mk('kcal', 'Calories', f.base.kcal));
    g3.appendChild(mk('p', 'Protein g', f.base.p));
    g3.appendChild(mk('c', 'Carbs g', f.base.c));
    g3.appendChild(mk('f', 'Fat g', f.base.f));
    g3.appendChild(mk('na', 'Sodium mg', f.base.na));
    g3.appendChild(mk('k', 'Potassium mg', f.base.k));
    g3.appendChild(mk('caff', 'Caffeine mg', f.base.caff));
    g3.appendChild(mk('price', 'Price ₱', f.base.price));
    body.appendChild(g3);

    const calc = el('button', 'btn wide quiet', 'Work calories out from the macros');
    calc.style.marginTop = '8px';
    calc.onclick = () => {
      const k = (num(inputs.p.value, 0) || 0) * 4 + (num(inputs.c.value, 0) || 0) * 4 + (num(inputs.f.value, 0) || 0) * 9;
      inputs.kcal.value = String(Math.round(k));
      UI.toast('4 / 4 / 9. A check, not the truth');
    };
    body.appendChild(calc);

    /* your servings — the whole point. A Cobra bottle is 1.3 label servings. */
    body.appendChild(el('label', 'fl', 'Your servings'));
    body.appendChild(el('div', 'note', 'How you actually eat it. A whole bottle, a scoop, a pack.'));
    const sw = el('div');
    const paintServes = () => {
      sw.innerHTML = '';
      (f.serves || []).forEach((s, i) => {
        const baseAmt = num(inputs.amt.value, num(f.base.amt, 1)) || 1;
        const r = el('div', 'row');
        r.innerHTML = '<span class="nm">' + esc(s.label) + '<small>' + r1(s.mult * baseAmt) + ' ' + esc(inputs.unit.value || f.base.unit || '') +
          ' · ' + r1(s.mult) + ' × label</small></span>';
        const x = el('button', 'x', '✕');
        x.onclick = () => { f.serves.splice(i, 1); paintServes(); };
        r.appendChild(x);
        sw.appendChild(r);
      });
      const add = el('div', 'grid2');
      const nm = document.createElement('input'); nm.type = 'text'; nm.placeholder = 'Bottle';
      const am = document.createElement('input'); am.type = 'text'; am.inputMode = 'decimal'; am.placeholder = 'how much, e.g. 330';
      add.appendChild(nm); add.appendChild(am);
      sw.appendChild(add);
      const ab = el('button', 'btn wide', 'Add serving');
      ab.style.marginTop = '7px';
      ab.onclick = () => {
        const baseAmt = num(inputs.amt.value, 0);
        const a = num(am.value);
        if (!nm.value.trim() || a == null || !baseAmt) return UI.toast('Needs a name and an amount', { bad: true });
        f.serves = (f.serves || []).concat([{ label: nm.value.trim(), mult: a / baseAmt }]);
        paintServes();
      };
      sw.appendChild(ab);
    };
    paintServes();
    body.appendChild(sw);

    body.appendChild(saveBar(isNew ? 'Save' : 'Update', () => {
      const name = inputs.name.value.trim();
      if (!name) return UI.toast('It needs a name', { bad: true });
      const base = { amt: num(inputs.amt.value, 1) || 1, unit: inputs.unit.value.trim() || 'serving' };
      NUTS.concat(['price']).forEach(n => { const v = num(inputs[n].value); if (v != null) base[n] = v; });
      const row = { id: f.id, name: name, brand: inputs.brand.value.trim(), cat: inputs.cat.value.trim(),
        base: base, serves: f.serves || [], dflt: f.dflt || 0, uses: f.uses || 0, shot: shotId };
      Rec.set('food', null, f.id, row);
      Mobile.feedback('select');
      /* Straight on to how much, swapping this sheet's contents. Closing
         first and reopening would race the shared sheet's history unwind. */
      if (isNew) { amountSheet(row); }
      else { closeSheet(); draw(); }
    }));

    if (!isNew) {
      const del = el('button', 'btn wide quiet', 'Delete this food');
      del.style.marginTop = '8px';
      del.onclick = () => UI.confirm('Delete ' + f.name + '?', 'Meals you already logged keep their own numbers and are not touched.')
        .then(ok => { if (ok) { Rec.del('food', null, f.id); closeSheet(); draw(); } });
      body.appendChild(del);
    }
  });
}
</script>

<script>
/* ══════════════ THE SCREENS ══════════════ */

let TAB = 'now';
/* Backfill is normal, not an exception. VIEW is the day being looked at;
   null means today. The future is not a record and cannot be reached. */
let VIEW = null;
const vd = () => VIEW || Day.today();
function shiftView(n) {
  const d = Day.shift(vd(), n);
  if (!Day.editable(d)) return UI.toast('The future is not a record');
  VIEW = d === Day.today() ? null : d;
  draw();
}
function dateBar() {
  const w = el('div', 'seg');
  const back = el('button', null, '‹');
  const mid = el('button', VIEW ? 'on' : '', VIEW ? Day.short(vd()) + ' · back to today' : 'Today');
  const fwd = el('button', null, '›');
  back.onclick = () => shiftView(-1);
  fwd.onclick = () => shiftView(1);
  mid.onclick = () => { VIEW = null; draw(); };
  w.appendChild(back); w.appendChild(mid); w.appendChild(fwd);
  return w;
}
const NAV = [['now', '◐', 'Today'], ['food', '◍', 'Food'], ['money', '₱', 'Money'], ['trends', '◭', 'Trends']];

function drawNav() {
  const n = document.getElementById('nav');
  n.innerHTML = '';
  NAV.forEach(t => {
    const b = el('button', TAB === t[0] ? 'on' : '', '<span class="g">' + t[1] + '</span>' + t[2]);
    b.onclick = () => { TAB = t[0]; draw(); };
    n.appendChild(b);
  });
}

function card(title, sub) {
  const c = el('div', 'card');
  if (title) c.appendChild(el('h2', null, esc(title) + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '')));
  return c;
}

function tile(label, val, unit, cls, onclick, pct) {
  const t = el('button', 'tile ' + (cls || ''));
  t.innerHTML = '<div class="vl">' + (val == null ? '–' : esc(val)) +
    (unit ? '<span class="un">' + esc(unit) + '</span>' : '') + '</div>' +
    '<div class="lb">' + esc(label) + '</div>';
  if (pct != null) {
    const bar = el('div', 'bar');
    bar.innerHTML = '<i style="width:' + Math.min(100, Math.round(pct * 100)) + '%"></i>';
    t.appendChild(bar);
  }
  if (onclick) t.onclick = onclick;
  return t;
}

/* how a field's value reads on its tile */
function tileValue(f, v) {
  if (v == null) return f.measure === 'check' ? '·' : '–';
  if (f.measure === 'check') return '✓';
  if (f.measure === 'scale') return r1(v);
  if (f.dec) return r1(v);
  return Math.round(v).toLocaleString();
}

/* ── NOW ── */
function drawNow(m) {
  const d = vd();

  const t = dayTotals(d), ct = calTarget();
  const c = card('Today', Day.label(d));

  const left = ct.v - Math.round(t.kcal);
  const hero = el('div', 'hero', left.toLocaleString() + '<span class="u">left of ' + ct.v.toLocaleString() + '</span>');
  hero.style.marginBottom = 'var(--s5)';
  if (left < 0) hero.style.color = 'var(--warn)';
  c.appendChild(hero);

  const g = el('div', 'tiles');
  liveFields().forEach(f => {
    const v = value(d, f.id);
    let cls = v == null ? 'todo' : '';
    let pct = null;
    if (f.target && v != null) {
      pct = v / f.target;
      if (f.dir === 'lte' && v > f.target) cls += ' over';
    }
    g.appendChild(tile(f.label, tileValue(f, v), f.unit, cls, () => fieldSheet(f, d), pct));
  });
  g.appendChild(tile('Protein', Math.round(t.p), 'g', t.p ? '' : 'todo', () => { TAB = 'food'; draw(); }, t.p / TARGETS().p));
  g.appendChild(tile('Spent', Math.round(dayMoney(d)).toLocaleString(), '₱', dayMoney(d) ? '' : 'todo', () => { TAB = 'money'; draw(); }));
  c.appendChild(g);

  const open = outstanding();
  if (open.length) c.appendChild(el('div', 'note', 'Still open: ' + open.map(f => f.label).join(', ')));
  m.appendChild(c);

  const multi = liveFields().filter(f => !f.once && evList(d, f.id).length);
  if (multi.length) {
    const c3 = card('Through the day');
    multi.forEach(f => {
      const e = evList(d, f.id);
      const r = el('div', 'row tap');
      r.innerHTML = '<span class="nm">' + esc(f.label) + '<small>' + e.map(x => r1(x.v)).join(' · ') + '</small></span>' +
        '<span class="fig">' + r1(value(d, f.id)) + (f.unit ? ' ' + esc(f.unit) : '') + '</span>';
      r.onclick = () => fieldSheet(f, d);
      c3.appendChild(r);
    });
    m.appendChild(c3);
  }
}

/* ── FOOD ── */
function drawFood(m) {
  const d = vd(), t = dayTotals(d), tg = TARGETS(), ct = calTarget();

  const c = card('Food', Math.round(t.kcal).toLocaleString() + ' kcal');
  const left = ct.v - Math.round(t.kcal);
  const hero = el('div', 'hero', left.toLocaleString() + '<span class="u">kcal left</span>');
  hero.style.marginBottom = 'var(--s5)';
  if (left < 0) hero.style.color = 'var(--warn)';
  c.appendChild(hero);

  [['kcal', 'Calories', ct.v, 'k1', 'lte'], ['p', 'Protein', tg.p, 'k2', 'gte'],
   ['c', 'Carbs', tg.c, 'k3', 'lte'], ['f', 'Fat', tg.f, 'k4', 'lte']].forEach(row => {
    const v = t[row[0]], lim = row[2] || 0, pct = lim ? v / lim : 0;
    const over = row[4] === 'lte' && v > lim;
    const w = el('div', 'macro ' + row[3] + (over ? ' over' : ''));
    w.innerHTML = '<div class="top"><b>' + row[1] + '</b><span class="n">' + Math.round(v) + ' / ' + Math.round(lim) + '</span></div>' +
      '<div class="track"><i style="width:' + Math.min(100, Math.round(pct * 100)) + '%"></i></div>';
    c.appendChild(w);
  });
  c.appendChild(el('div', 'note', Math.max(0, Math.round(tg.p - t.p)) + 'g protein to go · ' +
    Math.round(t.na) + 'mg sodium · ' + Math.round(t.k) + 'mg potassium' +
    (ct.src === 'tdee' ? ' · target from measured TDEE' : '')));
  m.appendChild(c);

  const list = meals(d);
  const c2 = card('Logged', list.length ? money(t.price) + ' eaten' : '');
  if (!list.length) c2.appendChild(el('div', 'empty', 'Nothing yet.'));
  list.forEach(x => {
    const r = el('div', 'row');
    r.innerHTML = '<span class="nm">' + esc(x.name) + '<small>' + esc(x.serve || '') + ' · ' + r1(x.amt) + ' ' + esc(x.unit || '') + '</small></span>' +
      '<span class="fig">' + Math.round(x.kcal) + '<small>' + r1(x.p) + 'g protein</small></span>';
    const del = el('button', 'x', '✕');
    del.onclick = () => { Rec.del('meal', d, x.key); Mobile.feedback('untick'); draw(); };
    r.appendChild(del);
    c2.appendChild(r);
  });
  const b = el('button', 'btn go wide', 'Log food');
  b.style.marginTop = 'var(--s3)';
  b.onclick = foodPicker;
  c2.appendChild(b);
  m.appendChild(c2);
}

/* ── MONEY ── */
function drawMoney(m) {
  const d = vd();
  const sp = spends(d), food = dayTotals(d).price;
  const c = card('Spending', Day.label(d));
  const hero = el('div', 'hero', money(dayMoney(d)));
  hero.style.marginBottom = 'var(--s5)';
  c.appendChild(hero);
  if (!sp.length) c.appendChild(el('div', 'empty', 'Nothing yet.'));
  sp.slice().reverse().forEach(s => {
    const shot = s.shot ? Rec.get('shot', d, s.shot) : null;
    const r = el('div', 'row tap');
    r.innerHTML = (shot ? '<img class="thumb" src="' + shot.img + '">' : '') +
      '<span class="nm">' + esc(s.note || 'No details') + '<small>' + esc(s.acct) + ' · ' +
      new Date(s.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '</small></span>' +
      '<span class="fig">' + money(s.amt) + '</span>';
    r.onclick = () => spendSheet(Object.assign({ date: d }, s));
    const del = el('button', 'x', '✕');
    del.onclick = ev => { ev.stopPropagation(); Rec.del('spend', d, s.key); Mobile.feedback('untick'); draw(); };
    r.appendChild(del);
    c.appendChild(r);
  });
  const b = el('button', 'btn go wide', 'Add spend');
  b.style.marginTop = 'var(--s3)';
  b.onclick = () => spendSheet();
  c.appendChild(b);
  if (food) c.appendChild(el('div', 'note', 'You ate ' + money(food) + ' of food today. Not counted here — it was bought on another day.'));
  m.appendChild(c);

  const c2 = card('Recent');
  const sum = n => Day.last(n).reduce((a, x) => a + dayMoney(x), 0);
  c2.innerHTML += '<div class="row"><span class="nm">Last 7 days</span><span class="fig">' + money(sum(7)) + '</span></div>' +
    '<div class="row"><span class="nm">Last 30 days</span><span class="fig">' + money(sum(30)) + '</span></div>' +
    '<div class="row"><span class="nm">Daily average</span><span class="fig">' + money(sum(30) / 30) + '</span></div>';
  const byAcct = {};
  Day.last(30).forEach(dd => spends(dd).forEach(s => { byAcct[s.acct] = (byAcct[s.acct] || 0) + (num(s.amt, 0) || 0); }));
  Object.keys(byAcct).sort((a, b) => byAcct[b] - byAcct[a]).forEach(a => {
    c2.innerHTML += '<div class="row"><span class="nm">' + esc(a) + '</span><span class="fig">' + money(byAcct[a]) + '</span></div>';
  });
  m.appendChild(c2);
}

/* ── TRENDS ── */
function drawTrends(m) {
  const e = TD.estimate();
  const c = card('TDEE', e.basis === 'measured' ? 'measured' : 'starting estimate');
  if (e.tdee == null) {
    c.appendChild(el('div', 'empty', 'Log a weight and this starts working.'));
  } else if (e.basis !== 'measured') {
    c.appendChild(el('div', 'hero', e.tdee.toLocaleString() + '<span class="u">kcal/day</span>'));
    c.appendChild(el('div', 'note', 'Your weight × ' + TD.perLb() + ', the same start your sheet uses. It becomes measured once there is ' + esc(e.why || 'more data') + '.'));
  } else {
    /* two numbers, kept apart on purpose */
    const sp = el('div', 'split');
    sp.innerHTML =
      '<div><div class="k">' + (e.predicted || e.tdee).toLocaleString() + '</div><div class="kl">now</div></div>' +
      '<div><div class="k muted">' + e.observed.toLocaleString() + '</div><div class="kl">measured, ' + e.calDays + ' days</div></div>';
    c.appendChild(sp);
    c.appendChild(el('div', 'note',
      'You ate ' + e.intake.toLocaleString() + ' kcal a day while your weight went ' +
      (e.rate > 0 ? 'up ' : 'down ') + r1(Math.abs(e.rate)) + ' lb a week.'));

    if (e.adj) {
      c.appendChild(el('div', 'note', 'Reading ' + (e.adj > 0 ? 'higher' : 'lower') +
        ' by ' + Math.abs(Math.round(e.adj)) + ' kcal today: steps are ' +
        (e.stepDelta < 0 ? 'down ' : 'up ') + Math.abs(Math.round(e.stepDelta)) + ' on your normal. ' +
        (e.stepSrc && e.stepSrc.indexOf('population') === 0
          ? 'Using a population figure until it has learned yours.'
          : 'Using your own rate, ' + esc(e.stepSrc || '') + '.')));
    }
    if (e.sleepNote) c.appendChild(el('div', 'note', esc(e.sleepNote)));

    const cf = el('div');
    cf.innerHTML = '<div class="note">Confidence ' + e.conf + '%</div><div class="conf"><i style="width:' + e.conf + '%"></i></div>';
    c.appendChild(cf);
  }
  m.appendChild(c);

  const c2 = card('Weight', TD.win() + ' days');
  c2.appendChild(weightChart(e));
  const w = TD.lastWeight(e.rows), goal = num(S.get('goalWeight', null));
  c2.appendChild(el('div', 'note', (w ? r1(w) + ' lb' : 'nothing logged') +
    (goal != null && w ? ' · ' + r1(Math.abs(w - goal)) + ' lb to go' : '') +
    (e.rate != null ? ' · ' + (e.rate > 0 ? '+' : '') + r1(e.rate) + ' lb a week' : '')));
  m.appendChild(c2);

  if (e.basis === 'measured' && e.learn && e.learn.steps) {
    const ls = e.learn.steps;
    const c4 = card('What steps do to you');
    if (ls.k != null) {
      c4.appendChild(el('div', 'hero', Math.round(ls.k * 1000) + '<span class="u">kcal per 1,000 steps</span>'));
      c4.appendChild(el('div', 'note', 'Learned from ' + ls.n + ' two-week blocks of your own data.'));
    } else {
      c4.appendChild(el('div', 'empty', 'Not learned yet: ' + esc(ls.why || '') + '. It needs several two-week blocks where your steps differed and both food and weight were logged.'));
    }
    m.appendChild(c4);
  }

  const c3 = card('Last 28 days');
  liveFields().forEach(f => {
    const days = Day.last(28);
    const r = el('div');
