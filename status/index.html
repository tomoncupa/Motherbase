  /* No preserveAspectRatio="none": it stretched the axis labels and turned the
     round weigh-in dots into ellipses at any width but one. */
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  const add = (tag, attrs, cls) => {
    const n = document.createElementNS(svg.namespaceURI, tag);
    Object.keys(attrs).forEach(k => n.setAttribute(k, attrs[k]));
    if (cls) n.setAttribute('class', cls);
    svg.appendChild(n); return n;
  };

  const ser = e.series || e.rows, roll = e.roll;
  const pts = ser.filter(x => x.w != null);
  if (pts.length < 2) {
    const t = add('text', { x: 8, y: 24 }, 'lab');
    t.textContent = 'two weigh-ins and this draws itself';
    return svg;
  }

  const goal = num(S.get('goalWeight', null));
  const goalOn = S.get('goalDate', '') || '';
  const today = Day.today();
  const startDate = ser[0].d || Day.shift(today, -(ser.length - 1));

  /* how many days wide: the history, plus the run to the goal date if it is
     still ahead of us */
  const histDays = Math.max(1, ser.length - 1);
  const aheadDays = (goal != null && goalOn && goalOn > today) ? Day.diff(goalOn, today) : 0;
  const spanDays = histDays + aheadDays;
  const X = d => PL + (Day.diff(d, startDate) / spanDays) * (W - PL - PR);
  const Xi = i => PL + (i / spanDays) * (W - PL - PR);

  /* the y range */
  let lo, hi;
  const fixLo = num(S.get('wScaleLo', null)), fixHi = num(S.get('wScaleHi', null));
  if (fixLo != null && fixHi != null && fixHi > fixLo) {
    lo = fixLo; hi = fixHi;                     /* he set it, so it is his */
  } else {
    lo = Math.min.apply(null, pts.map(p => p.w));
    hi = Math.max.apply(null, pts.map(p => p.w));
    const dataSpan = Math.max(1, hi - lo);
    /* Include the goal only while doing so does not crush the trend. Past
       roughly double the data's own range it stops being a chart of your
       weight and becomes a chart of the gap. */
    if (goal != null && goal >= lo - dataSpan && goal <= hi + dataSpan) {
      lo = Math.min(lo, goal); hi = Math.max(hi, goal);
    }
    const pad = Math.max(1, (hi - lo) * .12); lo -= pad; hi += pad;
    /* ── round numbers up the side ──
       Tom, 2026-09-05: "I can't even tell what the dots mean numerically."
       The range was the data plus a 12% pad, sliced into quarters, so the
       labels came out 197, 203, 209 — true, and unreadable. A scale you have
       to do arithmetic against is not a scale. Snapped to a round step, the
       same chart reads 190, 200, 210 and a dot has a value you can see.

       Only on auto. A range he set by hand is his and is left alone. */
    const STEPS = [0.5, 1, 2, 5, 10, 20, 25, 50, 100];
    const step = STEPS.filter(x => (hi - lo) / x <= 5)[0] || 100;
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
  }
  const Y = v => PT + (1 - (v - lo) / Math.max(.001, hi - lo)) * (H - PT - PB);
  const clamp = v => Math.max(PT, Math.min(H - PB, Y(v)));
  const inView = v => v >= lo && v <= hi;

  /* ── gridlines and their labels ──
     One line per round step where the scale is automatic, so every label is a
     number you recognise. A hand-set range keeps the old five slices, because
     his numbers are his and quartering them is the only honest thing to do
     with a range somebody chose. */
  const fixed = (fixLo != null && fixHi != null && fixHi > fixLo);
  const GSTEPS = [0.5, 1, 2, 5, 10, 20, 25, 50, 100];
  const gstep = GSTEPS.filter(x => (hi - lo) / x <= 6)[0] || 100;
  const ticks = fixed ? [0, .25, .5, .75, 1]
    : (() => { const out = []; for (let v = hi; v >= lo - 0.0001; v -= gstep) out.push((hi - v) / (hi - lo)); return out; })();
  ticks.forEach(t => {
    const y = PT + t * (H - PT - PB);
    add('line', { x1: PL, y1: y, x2: W - PR, y2: y }, 'gl');
    const lab = add('text', { x: PL - 4, y: y + 3, 'text-anchor': 'end' }, 'lab');
    const val = hi - t * (hi - lo);
    lab.textContent = gstep < 1 ? val.toFixed(1) : Math.round(val);
  });

  /* today, when the chart runs past it */
  if (aheadDays > 0) {
    add('line', { x1: X(today), y1: PT, x2: X(today), y2: H - PB }, 'now');
    const nl = add('text', { x: X(today), y: H - 5, 'text-anchor': 'middle' }, 'lab');
    nl.textContent = 'today';
  }

  /* the goal weight, as a level */
  if (goal != null && inView(goal)) {
    add('line', { x1: PL, y1: Y(goal), x2: W - PR, y2: Y(goal) }, 'goal');
  } else if (goal != null) {
    /* off the top or bottom: say so at the edge rather than distorting the axis */
    const y = clamp(goal);
    const t = add('text', { x: W - PR, y: goal < lo ? y - 3 : y + 9, 'text-anchor': 'end' }, 'lab');
    t.textContent = 'goal ' + r1(goal);
  }

  /* ── the line of reality ── */
  const nowW = roll.length ? roll[roll.length - 1].y : pts[pts.length - 1].w;
  if (goal != null && aheadDays > 0 && nowW != null) {
    add('line', { x1: X(today), y1: clamp(nowW), x2: X(goalOn), y2: clamp(goal) }, 'reality');
  }

  /* ══════════════ THE THREE LINES AHEAD ══════════════
     Tom, 2026-09-05, asked for three projections and he is right that they are
     three different questions:

       REALITY   where you have to travel to arrive on time. A straight line
                 from today to the goal weight on the goal date. It is not a
                 prediction, it is the deadline.
       TARGET    where you land if you eat the calorie target you set. This is
                 the plan working.
       ACTUAL    where you land if you keep eating what you have ACTUALLY been
                 eating. This is the plan as lived, and the gap between it and
                 TARGET is the whole coaching conversation.

     ACTUAL comes with a cone, because it is the only one built on measurement
     and measurement has a give-or-take. The cone is the same projection run at
     the top and bottom of the TDEE error band, so it opens with time exactly
     as the uncertainty does. A single confident line off an estimate that is
     itself ±200 kcal is a lie with a nice slope.

     Drawn as soon as there is a weight to start from. Bodyweight x 13 is a
     serviceable opening guess and the estimator moves off it within days of
     real logging, so withholding these hid a useful answer for two months to
     avoid overstating it by a few per cent. */
  const pathOf = pr => pr && pr.pts.length > 1
    ? pr.pts.map((q, i) => (i ? 'L' : 'M') + X(Day.shift(today, q.i)) + ' ' + clamp(q.w)).join(' ')
    : null;

  const shown = { reality: false, target: false, actual: false, cone: false };
  if (aheadDays > 0 && nowW != null) {
    const est = TD.estimate();
    const baseT = est.predicted != null ? est.predicted : est.tdee;
    const eaten = est.intake;
    const err = est.err;

    /* the cone first, so both lines sit on top of it */
    if (eaten != null && baseT && err) {
      const hiP = predictWeight(nowW, aheadDays, eaten, baseT - err);   /* burning less -> heavier */
      const loP = predictWeight(nowW, aheadDays, eaten, baseT + err);
      if (hiP && loP && hiP.pts.length > 1 && loP.pts.length === hiP.pts.length) {
        const top = hiP.pts.map((q, i) => (i ? 'L' : 'M') + X(Day.shift(today, q.i)) + ' ' + clamp(q.w));
        const bot = loP.pts.slice().reverse().map(q => 'L' + X(Day.shift(today, q.i)) + ' ' + clamp(q.w));
        add('path', { d: top.concat(bot).join(' ') + ' Z' }, 'cone');
        shown.cone = true;
      }
    }

    /* what you have actually been eating */
    if (eaten != null) {
      const d = pathOf(predictWeight(nowW, aheadDays, eaten));
      if (d) { add('path', { d: d }, 'actual'); shown.actual = true; }
    }

    /* what you said you would eat */
    const dt = pathOf(predictWeight(nowW, aheadDays));
    if (dt) { add('path', { d: dt }, 'predict'); shown.target = true; }
  }
  shown.reality = !!(goal != null && aheadDays > 0 && nowW != null);
  svg.dataset.shown = JSON.stringify(shown);

  /* raw weigh-ins. Thinned once they would overlap, or they smear into a grey
     band that hides the average line the chart exists to show. */
  const step = Math.max(1, Math.ceil(pts.length / 60));
  pts.forEach((p, i) => {
    if (i % step && i !== pts.length - 1) return;
    add('circle', { cx: Xi(ser.indexOf(p)), cy: Y(p.w), r: 1.9 }, 'raw');
  });
  if (roll.length > 1) {
    add('path', { d: roll.map((p, i) => (i ? 'L' : 'M') + Xi(p.i) + ' ' + Y(p.y)).join(' ') }, 'avg');
  }
  return svg;
}

/* ── swipe the day ──
   The arrows in the date bar still work; this is the same action for a thumb
   that is already on the screen. Left is forward in time, matching the way a
   photo roll or a calendar moves — you are pushing the current day aside to
   reveal the next one.

   Only horizontal gestures count, and only past a threshold well clear of the
   wobble in a vertical scroll, or the screen changes day while you are trying
   to read it. */
function wireDaySwipe() {
  const m = document.getElementById('main');
  let x0 = 0, y0 = 0, live = false;
  m.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { live = false; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; live = true;
  }, { passive: true });
  m.addEventListener('touchend', e => {
    if (!live) return;
    live = false;
    if (TAB === 'trends') return;              /* no day to move on that screen */
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    /* clearly horizontal, and far enough to be deliberate */
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2) return;
    shiftView(dx < 0 ? 1 : -1);
  }, { passive: true });
}

/* ── the painter ── */
function draw() {
  const m = document.getElementById('main');
  m.innerHTML = '';
  /* Trends reads Day.last(28) and Day.today(), never the selected day — so a
     date bar there does nothing visible while still moving VIEW. Tapping it and
     going back to Today then logged into the wrong date, silently. Hiding it
     is not cosmetic: it was a way to corrupt a week of records by accident.
     The + button is hidden for the same reason — it logs, which is not what
     that screen is for, and it sat on top of the content. */
  const chrome = TAB !== 'trends';
  const db = document.getElementById('datebar');
  db.style.display = chrome ? '' : 'none';
  if (chrome) { db.innerHTML = ''; db.appendChild(dateBar()); }
  document.getElementById('hdate').textContent = Day.short(Day.today());
  if (TAB === 'now') drawNow(m);
  else if (TAB === 'food') drawFood(m);
  else if (TAB === 'money') drawMoney(m);
  else drawTrends(m);
  drawNav();
  /* After it is on the screen, because the size that fits can only be known
     once there is a box to measure. */
  fitHero(m);
}
/* A rotation changes the room without redrawing anything. */
addEventListener('resize', () => { try { fitHero(); } catch (e) {} });
</script>

<script>
/* ══════════════ SETTINGS ══════════════ */

function toggleRow(label, sub, on, fn) {
  const r = el('div', 'sw');
  r.innerHTML = '<span class="nm">' + esc(label) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>';
  const t = el('div', 'tg' + (on ? ' on' : ''), '<i></i>');
  t.onclick = () => fn(!on);
  r.appendChild(t);
  return r;
}
function fieldRow(pane, label, key, val, hint) {
  const w = el('div', 'field');
  w.appendChild(el('label', 'fl', label));
  const i = document.createElement('input');
  i.type = 'text'; i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*');
  i.value = val == null ? '' : String(val);
  i.onchange = () => { const v = num(i.value); if (v != null) { S.set(key, v); TD._dirty = true; draw(); } };
  w.appendChild(i);
  if (hint) w.appendChild(el('div', 'note', hint));
  pane.appendChild(w);
  return i;
}

function openSettings() {
  UI.settings(APP.id, [
    { id: 'quests', name: 'QUESTS', draw: drawQuestsTab },
    { id: 'track', name: 'TRACK', draw: drawTrackTab },
    { id: 'goals', name: 'GOALS', draw: drawGoalsTab },
  ], {
    order: ['quests', 'track', 'goals', 'app', 'data'],
    /* the sheet mirror is a way of getting data out, so it belongs under DATA
       with the backup and the export rather than in a tab of its own */
    append: { data: drawSyncTab },
  });
}

/* Move a field up or down the list. `order` already decided the tile order on
   Today; nothing could change it. Renumbering the whole list on every move
   keeps the numbers dense and means a field added later cannot land in the
   middle of the pack by accident. */
function moveField(id, dir) {
  const list = groupedFields();
  const i = list.findIndex(f => f.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  /* within its own group only — the button is already disabled at the edges,
     and this is the guard that keeps that true if anything else calls it */
  if ((list[j].cat || '') !== (list[i].cat || '')) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  list.forEach((f, n) => Rec.set('field', null, f.id, Object.assign({}, f, { order: n })));
  /* Keep the tile order saying the same thing. The fields take the new
     sequence; anything that is not a field — Protein, Spent — stays at the
     index it already had, so an arrow never shuffles those two. */
  const ord = tileOrder();
  if (ord.length) {
    const fresh = list.map(f => f.id).filter(id => ord.indexOf(id) > -1);
    let k = 0;
    setTileOrder(ord.map(key => (key.charAt(0) === '@' ? key : fresh[k++]) || key));
  }
  Mobile.feedback('select');
  drawSettingsPane('track'); draw();
}

/* Renaming an account changes its key, and every spend row points at the old
   one by name. So the rows move with it — otherwise a rename quietly orphans
   every payment you ever made from that account. */
function renameAcct(a) {
  UI.dialog({
    title: 'Rename', width: 380, focus: true,
    body: (b, h) => {
      const i = UI.field('name', { value: a.name });
      b.appendChild(i);
      h.input = i;
    },
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: h => {
      const v = h.body.querySelector('input').value.trim();
      if (!v || v === a.name) return;
      const oldKey = a.name.toLowerCase(), newKey = v.toLowerCase();
      let moved = 0;
      Rec.all('spend').forEach(r => {
        if (!r.payload || r.payload.acct !== a.name) return;
        Rec.set('spend', r.date, r.key, Object.assign({}, r.payload, { acct: v }));
        moved++;
      });
      Rec.set('acct', null, newKey, { name: v, order: a.order || 0 });
      if (newKey !== oldKey) Rec.del('acct', null, oldKey);
      if (S.get('lastAcct', '') === a.name) S.set('lastAcct', v);
      Mobile.feedback('success');
      drawSettingsPane('track'); draw();
      if (moved) UI.toast('<b>' + moved + '</b> payment' + (moved === 1 ? '' : 's') + ' moved with it');
    } }],
  });
}

function moveAcct(i, dir) {
  const list = accts(), j = i + dir;
  if (j < 0 || j >= list.length) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  list.forEach((a, n) => Rec.set('acct', null, a.name.toLowerCase(), Object.assign({}, a, { order: n })));
  Mobile.feedback('select');
  drawSettingsPane('track');
}

function removeAcct(a) {
  const used = Rec.all('spend').filter(r => r.payload && r.payload.acct === a.name).length;
  const go = () => {
    const keep = Object.assign({}, a);
    Rec.del('acct', null, a.name.toLowerCase());
    Mobile.haptic('warn');
    drawSettingsPane('track');
    UI.undo('removed <b>' + esc(a.name) + '</b>',
      () => { Rec.set('acct', null, a.name.toLowerCase(), keep); drawSettingsPane('track'); });
  };
  if (!used) return go();
  /* The payments stay either way — they carry the name, not a link. Saying so
     is the difference between a confident delete and a nervous one. */
  UI.confirm('Delete ' + a.name + '?',
    used + ' payment' + (used === 1 ? '' : 's') + ' used it. They stay on the money screen.',
    { yes: 'DELETE', danger: true }).then(ok => { if (ok) go(); });
}

function drawTrackTab(pane) {
  settingsPane = pane; pane.classList.add('setpane');
  const list = groupedFields();
  let lastCat = null;
  list.forEach((f, i) => {
    const c = f.cat || '';
    if (c !== lastCat) {
      lastCat = c;
      if (c) pane.appendChild(el('label', 'fl', esc(catLabel(c) || c)));
    }
    const kind = { number: 'once a day', amount: 'a dose, added up', scale: '1 to ' + (f.max || 5), check: 'done or not' }[f.measure] || '';
    const bits = [kind];
    if (f.unit) bits.push(f.unit);
    if (f.target) bits.push((f.dir === 'lte' ? '\u2264' : '\u2265') + ' ' + f.target);
    if (f.days && f.days.length) bits.push(f.days.map(i => DOW[i]).join(' '));
    if (f.slot) bits.push(whenLabel(f.slot) || f.slot);
    if (f.min != null) bits.push('\u2265 ' + f.min);
    if (f.max != null) bits.push('\u2264 ' + f.max);
    if (f.half) bits.push('half-life ' + f.half + 'h');
    /* Whether it is fed by food, said out loud. Without this a tile that
       ignores what you ate looks identical to one that counts it, and the
       only symptom is a number that stays at nothing. */
    if (f.from) bits.push('+ ' + ((NUT_FROM.filter(n => n[0] === f.from)[0] || [])[1] || f.from).toLowerCase() + ' from food');
    /* Said out loud, for the same reason the food link is: a field missing
       from the chart looks identical to a field with no data. */
    if (f.viz === 0) bits.push('not charted');
    const row = toggleRow(f.label, bits.join(' \u00b7 '), !!f.on, on => {
      Rec.set('field', null, f.id, Object.assign({}, f, { on: on ? 1 : 0 }));
      drawSettingsPane('track'); draw();
    });
    const mv = el('div');
    mv.style.cssText = 'display:flex;gap:2px;flex:0 0 auto;order:-1';
    /* An arrow may not carry a field out of its category: that would silently
       recategorise it, which is not what an up arrow means anywhere. So the
       first and last of each group have nowhere to go. */
    const sameCat = k => list[k] && (list[k].cat || '') === c;
    [['↑', -1, !sameCat(i - 1)], ['↓', 1, !sameCat(i + 1)]].forEach(([g, d, off]) => {
      const b = el('button', 'ord mb-press mb-tap', g);
      b.disabled = off;
      b.setAttribute('aria-label', (d < 0 ? 'Move up: ' : 'Move down: ') + f.label);
      b.onclick = () => moveField(f.id, d);
      mv.appendChild(b);
    });
    row.insertBefore(mv, row.firstChild);
    /* A dot in the field's own colour, so the list and the chart agree about
       which line is which without either of them having to say so. */
    const dot = el('i', 'fdot');
    dot.style.background = fieldColor(f);
    row.insertBefore(dot, row.firstChild);
    /* tapping the name opens the field, so everything about it is editable */
    /* ── the way in to a field's settings ──
       This used to look for `.lbl` or a `<b>`. toggleRow makes neither — it
       makes `<span class="nm">` — so the lookup found nothing, the `if` skipped,
       and tapping a name did nothing at all. There was no route to a target,
       an edge, a colour or a category from anywhere in the app.

       Tapping the name works now, and there is a button beside it as well,
       because a tap target you cannot see is not a route either. */
    const nm = row.querySelector('.nm');
    if (nm) { nm.style.cursor = 'pointer'; nm.onclick = () => newFieldForm(settingsPane, f); }
    const ed = el('button', 'ord mb-press mb-tap');
    ed.setAttribute('data-icon', 'edit');
    ed.setAttribute('data-icon-size', '14');
    ed.setAttribute('aria-label', 'Settings for ' + f.label);
    ed.title = 'Goal, edges, colour, category';
    ed.onclick = () => newFieldForm(settingsPane, f);
    row.appendChild(ed);
    pane.appendChild(row);
  });
  pane.appendChild(el('div', 'note', 'Tap a name to set its goal, colour and group. The arrows set the order on Today, and so does holding a tile on Today and dragging it.'));

  /* ── the big number ──
     Whichever of these is picked stops being a tile and becomes the reading at
     the top of Today, and the reading on the share picture with it. Calories
     is only the default because it is the one that moves all day. */
  pane.appendChild(el('label', 'fl', 'The big number on Today'));
  const hseg = el('div', 'seg wrapseg');
  const hp = heroPick();
  heroChoices().forEach(o => {
    const b = el('button', o.id === hp ? 'on' : '', esc(o.label));
    b.onclick = () => { S.set('heroStat', o.id); Mobile.feedback('select'); drawSettingsPane('track'); draw(); };
    hseg.appendChild(b);
  });
  pane.appendChild(hseg);
  pane.appendChild(el('div', 'note', 'It leaves the tiles and goes to the top, so it is never shown twice.'));

  /* ── the two tiles that are not fields ──
     Protein and Spent sit on Today beside the fields but are not in the list
     above, because neither is something you set a goal on or turn into a
     chart. Spent is the one people want gone, so it is the one with a switch.
     Turning it off hides the tile and nothing else: the Money tab, the
     Spending button and every payment already logged stay exactly where they
     are, and turning it back on brings the tile back with them. */
  pane.appendChild(el('label', 'fl', 'Money'));
  pane.appendChild(toggleRow('Spent tile on Today', 'Off by default. Your payments stay either way.',
    !!S.get('spendTile', 0), on => { S.set('spendTile', on ? 1 : 0); drawSettingsPane('track'); draw(); }));
  pane.appendChild(toggleRow('Money tab', 'The tab at the bottom. Turning it off hides the screen, not the data.',
    !!S.get('moneyTab', 1), on => {
      S.set('moneyTab', on ? 1 : 0);
      /* Standing on a tab that has just been hidden strands you there. */
      if (!on && TAB === 'money') TAB = 'now';
      drawSettingsPane('track'); draw();
    }));
  if (tileOrder().length) {
    const rst = el('button', 'btn wide', 'Reset tile order');
    rst.onclick = () => {
      S.set('tileOrder', []);
      Mobile.feedback('select');
      UI.toast('Tiles back to their normal order');
      drawSettingsPane('track'); draw();
    };
    pane.appendChild(rst);
  }

  /* the library: an empty setup screen is a dead end */
  const have = fields();
  /* by name as well as by id: a Caffeine you made yourself has a timestamp
     for an id, so the library went on offering you a second one */
  const names = {};
  Object.values(have).forEach(f => { names[String(f.label || '').toLowerCase()] = 1; });
  const rest = LIBRARY.filter(l => !have[l.id] && !names[String(l.label).toLowerCase()]);
  pane.appendChild(el('label', 'fl', 'Add'));
  if (rest.length) {
    const w = el('div', 'chips');
    rest.forEach(l => {
      const b = el('button', 'chip', '+ ' + esc(l.label));
      b.onclick = () => { addField(l); Mobile.feedback('select'); drawSettingsPane('track'); draw(); };
      w.appendChild(b);
    });
    pane.appendChild(w);
  }
  const custom = el('button', 'btn wide', 'Something else');
  custom.onclick = () => newFieldForm(pane);
  pane.appendChild(custom);

  pane.appendChild(el('label', 'fl', 'Accounts'));
  const all = accts();
  all.forEach((a, i) => {
    const r = el('div', 'row tap');
    r.innerHTML = '<span class="nm">' + esc(a.name) + '</span>';
    const x = el('button', 'x', '✕');
    x.onclick = e => { e.stopPropagation(); removeAcct(a); };
    r.appendChild(x);
    r.onclick = () => renameAcct(a);
    Mobile.hold(r, () => UI.menu(0, 0, [
      { label: 'Rename', icon: '✎', fn: () => renameAcct(a) },
      i > 0 ? { label: 'Move up', icon: '↑', fn: () => moveAcct(i, -1) } : null,
      i < all.length - 1 ? { label: 'Move down', icon: '↓', fn: () => moveAcct(i, 1) } : null,
      '-',
      { label: 'Delete', kind: 'bad', icon: '⌫', fn: () => removeAcct(a) },
    ].filter(Boolean), { title: a.name }), { skip: '.x' });
    pane.appendChild(r);
  });
  const add = el('div', 'stepper');
  const ni = document.createElement('input'); ni.type = 'text'; ni.placeholder = 'New account';
  const ab = el('button', null, '+');
  ab.onclick = () => { const v = ni.value.trim(); if (!v) return; Rec.set('acct', null, v.toLowerCase(), { name: v, order: accts().length }); drawSettingsPane('track'); };
  add.appendChild(ni); add.appendChild(ab);
  pane.appendChild(add);

  pane.appendChild(el('label', 'fl', 'Photos'));
  const n = shotCount();
  pane.appendChild(el('div', 'note', n + ' stored. Photos are the largest thing here'));
  const clr = el('button', 'btn wide', 'Delete all photos');
  clr.onclick = () => UI.confirm('Delete every photo?', 'The entries they belong to stay.')
    .then(ok => { if (ok) { Rec.all('shot').forEach(r => Rec.del('shot', r.date, r.key)); drawSettingsPane('track'); } });
  pane.appendChild(clr);
}

/* anything not in the library */
const DOW = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

/* One form for adding a field and for editing one that already exists.
   Everything a field can be lives here: what it measures, how far its scale
   runs, which days it is due, and whether it wears off. */
/* How many of the field's units one of the label's units is. Only the two
   conversions that actually come up: milligrams to grams and back. Anything
   else is one to one, which is right for calories, protein and the rest. */
function nutPer(from, unit) {
  const lab = (NUT_FROM.filter(n => n[0] === from)[0] || [])[2] || '';
  const u = String(unit || '').trim().toLowerCase();
  if (lab === 'mg' && u === 'g') return .001;
  if (lab === 'g' && u === 'mg') return 1000;
  return 1;
}

function newFieldForm(pane, existing) {
  const f = existing || {};
  pane.innerHTML = '';
  pane.appendChild(el('label', 'fl', 'Name'));
  const nm = document.createElement('input'); nm.type = 'text'; nm.placeholder = 'Collagen';
  nm.value = f.label || '';
  pane.appendChild(nm);

  pane.appendChild(el('label', 'fl', 'Unit'));
  const un = document.createElement('input'); un.type = 'text'; un.placeholder = 'g';
  un.value = f.unit || '';
  pane.appendChild(un);

  pane.appendChild(el('label', 'fl', 'Kind'));
  let measure = f.measure || 'amount';
  let hi = f.max || 5;
  const seg = el('div', 'seg');
  const extra = el('div');
  const paint = () => {
    seg.innerHTML = '';
    [['amount', 'A dose'], ['number', 'One a day'], ['scale', 'A scale'], ['check', 'Done or not']].forEach(k => {
      const b = el('button', measure === k[0] ? 'on' : '', k[1]);
      b.onclick = () => { measure = k[0]; paint(); };
      seg.appendChild(b);
    });
    /* how far the scale runs. 1 to 3 is a perfectly good scale. */
    extra.innerHTML = '';
    if (measure === 'scale') {
      extra.appendChild(el('label', 'fl', 'How far it runs'));
      const w = el('div', 'chips');
      [3, 4, 5, 10].forEach(n => {
        const b = el('button', 'chip' + (hi === n ? ' on' : ''), '1 to ' + n);
        b.onclick = () => { hi = n; paint(); };
        w.appendChild(b);
      });
      extra.appendChild(w);
    }
  };
  paint();
  pane.appendChild(seg);
  pane.appendChild(extra);

  /* ── what kind of thing this is ──
     First on the form, because it decides what the rest of it offers. A weight
     has no half-life: it does not wear off, and a box inviting a number would
     only let the tile start lying. A mood has no target in pounds. */
  pane.appendChild(el('label', 'fl', 'What kind of thing is it'));
  let cat = f.cat || '';
  const catw = el('div', 'chips');
  const catNote = el('div', 'note');
  pane.appendChild(catw);
  pane.appendChild(catNote);

  /* Each block below is a section the category can switch off. Switching one
     off only hides it: whatever the field already had is left alone unless you
     change it, so nothing is quietly wiped by picking a category. */
  const sect = {};
  const section = key => (sect[key] = el('div'));

  const sTarget = section('target');
  sTarget.appendChild(el('label', 'fl', 'Target, if it has one'));
  const tg = document.createElement('input');
  tg.type = 'text'; tg.inputMode = 'decimal'; tg.placeholder = 'optional';
  tg.value = f.target == null ? '' : String(f.target);
  sTarget.appendChild(tg);
  pane.appendChild(sTarget);

  /* A target is what you are aiming at. A floor and a ceiling are the edges
     you should not be outside — different question, and both can be true at
     once. Sodium has a ceiling and no target; sleep has a floor and a target;
     blood pressure has both edges and no target at all. */
  const sEdges = section('edges');
  sEdges.appendChild(el('label', 'fl', 'Edges, if it has them'));
  const lim = el('div', 'grid2');
  const mkLim = (key, label, ph) => {
    const w = el('div');
    w.appendChild(el('label', 'fl', label));
    const i2 = document.createElement('input');
    i2.type = 'text'; i2.inputMode = 'decimal'; i2.setAttribute('pattern', '[0-9.]*');
    i2.placeholder = ph;
    i2.value = f[key] == null ? '' : String(f[key]);
    w.appendChild(i2); lim.appendChild(w);
    return i2;
  };
  const loI = mkLim('min', 'At least', 'none');
  const hiI = mkLim('max', 'At most', 'none');
  sEdges.appendChild(lim);
  sEdges.appendChild(el('div', 'note', 'Going outside either edge is flagged on the tile.'));
  pane.appendChild(sEdges);

  /* Which days it is due. Nothing picked means every day, which is the common
     case and should not cost seven taps to say. */
  const sDays = section('days');
  sDays.appendChild(el('label', 'fl', 'Due on — nothing picked means every day'));
  const days = (f.days || []).slice();
  const dw = el('div', 'chips');
  DOW.forEach((lbl, i3) => {
    const b = el('button', 'chip' + (days.indexOf(i3) > -1 ? ' on' : ''), lbl);
    b.onclick = () => {
      const at = days.indexOf(i3);
      if (at > -1) days.splice(at, 1); else days.push(i3);
      b.className = 'chip' + (days.indexOf(i3) > -1 ? ' on' : '');
      Mobile.haptic('select');
    };
    dw.appendChild(b);
  });
  sDays.appendChild(dw);
  pane.appendChild(sDays);

  /* ── when in the day ──
     A fixed five rather than a text box. It orders your Today tiles, and a
     sort on typed words is a sort on spelling: "evening", "Evening" and "at
     night" are three strings and one intention. */
  const sWhen = section('when');
  sWhen.appendChild(el('label', 'fl', 'When in the day — sets the order on Today'));
  let slot = f.slot || '';
  const ww = el('div', 'chips');
  const paintWhen = () => {
    ww.innerHTML = '';
    [{ id: '', label: 'Any time' }].concat(WHENS).forEach(w => {
      const b = el('button', 'chip' + (slot === w.id ? ' on' : ''), esc(w.label));
      b.onclick = () => { slot = w.id; paintWhen(); Mobile.haptic('select'); };
      ww.appendChild(b);
    });
  };
  paintWhen();
  sWhen.appendChild(ww);
  pane.appendChild(sWhen);

  /* Which nutrient on a food label this is the same substance as. Without it
     a Caffeine tile counts your capsules and ignores your coffee. */
  const sFrom = section('from');
  sFrom.appendChild(el('label', 'fl', 'Also count it from food'));
  let from = f.from || '';
  const fw = el('div', 'chips');
  const paintFrom = () => {
    fw.innerHTML = '';
    [['', 'No']].concat(NUT_FROM.map(nn => [nn[0], nn[1]])).forEach(nn => {
      const b = el('button', 'chip' + (from === nn[0] ? ' on' : ''), esc(nn[1]));
      b.onclick = () => { from = nn[0]; paintFrom(); Mobile.haptic('select'); };
      fw.appendChild(b);
    });
  };
  paintFrom();
  sFrom.appendChild(fw);
  pane.appendChild(sFrom);

  /* Half-life. Caffeine is about 5 hours; most things worth tracking have a
     published number. Leave it blank and nothing decays. */
  const sHalf = section('half');
  sHalf.appendChild(el('label', 'fl', 'Half-life in hours, if it wears off'));
  const hl = document.createElement('input');
  hl.type = 'text'; hl.inputMode = 'decimal'; hl.placeholder = 'caffeine is about 5';
  hl.value = f.half == null ? '' : String(f.half);
  sHalf.appendChild(hl);
  pane.appendChild(sHalf);

  /* Show only what this kind of thing actually has. A field with no category
     set keeps everything, so nothing a field already carries can be hidden by
     a category it never chose. */
  const gate = () => {
    Object.keys(sect).forEach(k => {
      sect[k].style.display = (!cat || catOf(cat).has.indexOf(k) > -1) ? '' : 'none';
    });
  };
  const paintCat = () => {
    catw.innerHTML = '';
    CATS.forEach(c => {
      const b = el('button', 'chip' + (cat === c.id ? ' on' : ''), esc(c.label));
      b.onclick = () => { cat = c.id; paintCat(); gate(); Mobile.haptic('select'); };
      catw.appendChild(b);
    });
    catNote.textContent = cat ? catOf(cat).note
      : 'Pick one and the settings below narrow to what applies.';
  };
  paintCat();
  gate();

  /* ── its colour ──
     A slot, one to six, never a hex. The six are the theme's own chart ramp,
     so a field keeps its identity across every skin and STYLE can still
     repaint the whole suite. Picking a hex here would be picking a colour that
     is right in Ice and invisible in Monarch. */
  pane.appendChild(el('label', 'fl', 'Colour'));
  let color = num(f.color, 0) || 0;
  const cw = el('div', 'chips');
  const paintColor = () => {
    cw.innerHTML = '';
    for (let i = 0; i <= 6; i++) {
      const b = el('button', 'chip swatch' + (color === i ? ' on' : ''), i ? '' : 'Auto');
      if (i) b.style.setProperty('--sw', 'var(--data-' + i + ')');
      b.setAttribute('aria-label', i ? 'Colour ' + i : 'Automatic colour');
      b.onclick = (k => () => { color = k; paintColor(); Mobile.haptic('select'); })(i);
      cw.appendChild(b);
    }
  };
  paintColor();
  pane.appendChild(cw);

  /* ── whether it is drawn ──
     Separate from `on`. Turning a field OFF stops you logging it; turning it
     out of the visualiser keeps logging it and stops it crowding the chart.
     Twenty fields on one 28-day grid is not a picture of anything.        */
  let viz = f.viz == null ? 1 : (f.viz ? 1 : 0);
  const vizRow = toggleRow('Show in the visualiser', 'The 28-day grid on Trends', !!viz, v => { viz = v ? 1 : 0; });
  pane.appendChild(vizRow);

  const save = el('button', 'btn go wide', existing ? 'Save' : 'Add it');
  save.style.marginTop = 'var(--s-4)';
  save.onclick = () => {
    const label = nm.value.trim();
    if (!label) return UI.toast('Needs a name', { bad: true });
    const spec = Object.assign({}, f, {
      id: f.id || uid(), label: label, unit: un.value.trim(), measure: measure,
    });
    /* A control the category switched off is not read and not saved — its
       value is whatever the field already had, and hiding a box is not the
       same as clearing it. `on` is that test. */
    const on = k => !cat || catOf(cat).has.indexOf(k) > -1;

    if (on('target')) {
      const t = num(tg.value);
      if (t != null) { spec.target = t; if (!spec.dir) spec.dir = 'gte'; } else { delete spec.target; }
    }
    if (on('half')) {
      const h = num(hl.value);
      if (h != null && h > 0) spec.half = h; else delete spec.half;
    } else {
      /* Nothing in this category wears off, so a half-life left over from
         before would keep decaying a number that does not decay. */
      delete spec.half;
    }
    if (on('from')) {
      if (from) {
        spec.from = from;
        /* the label is in the unit NUT_FROM names; `per` gets it into yours */
        spec.per = nutPer(from, spec.unit);
      } else { delete spec.from; delete spec.per; }
    } else { delete spec.from; delete spec.per; }

    const lv = on('edges') ? num(loI.value) : null;
    const hv = on('edges') ? num(hiI.value) : null;
    if (lv != null) spec.min = lv; else delete spec.min;
    /* `max` carries two meanings and the scale one wins where it applies: on a
       scale it is how far the scale runs, everywhere else it is the ceiling
       typed into Edges. Setting the ceiling and then deleting it on the next
       line meant "at most" never saved for anything. */
    if (measure === 'scale') spec.max = hi;
    else if (hv != null) spec.max = hv;
    else delete spec.max;

    if (days.length && days.length < 7) spec.days = days.slice().sort(); else delete spec.days;
    if (on('when') && slot) spec.slot = slot; else delete spec.slot;
    if (cat) spec.cat = cat; else delete spec.cat;
    if (color) spec.color = color; else delete spec.color;
    spec.viz = viz;
    if (measure === 'amount' || measure === 'number') { spec.step = spec.step || 1; spec.dec = spec.dec == null ? 1 : spec.dec; }
    if (existing) Rec.set('field', null, spec.id, spec); else addField(spec);
    Mobile.feedback('select');
    drawSettingsPane('track'); draw();
  };
  pane.appendChild(save);
  const back = el('button', 'btn wide quiet', 'Cancel');
  back.onclick = () => drawSettingsPane('track');
  pane.appendChild(back);
}

function drawTargets(pane) {
  settingsPane = pane; pane.classList.add('setpane');
  const tg = TARGETS();
  let mode = S.get('calMode', 'fixed');

  pane.appendChild(el('label', 'fl', 'Calorie target'));
  const seg = el('div', 'seg');
  [['fixed', 'A number I set'], ['tdee', 'From my TDEE'], ['macros', 'From my macros']].forEach(k => {
    const b = el('button', mode === k[0] ? 'on' : '', k[1]);
    b.onclick = () => { S.set('calMode', k[0]); drawSettingsPane('goals'); draw(); };
    seg.appendChild(b);
  });
  pane.appendChild(seg);

  if (mode === 'tdee') {
    const e = TD.estimate();
    /* The other place a wheel earns its keep: the rate drives the daily
       target, and watching it move is the whole point of choosing a rate. */
    pane.appendChild(el('label', 'fl', 'Lose this much a week (lb)'));
    const rateOut = el('div', 'note derived');
    const rw = wheelInput(S.get('goalRate', 1.25), { min: 0, max: 3, step: .25, dec: 1,
      onChange: r => {
        const under = Math.round(r * TD.ed() / 7);
        const est = TD.estimate();
        const base = est.predicted || est.tdee;
        rateOut.innerHTML = base
          ? '<span class="derived-tag">' + Math.max(0, Math.round(base - under)).toLocaleString() + ' kcal</span> a day — ' + under + ' under your measured ' + Math.round(base).toLocaleString() + '.'
          : '<span class="derived-tag">' + under + ' kcal</span> a day under, once your TDEE is measured.';
      } });
    rw.input.onchange = () => { S.set('goalRate', num(rw.input.value, 1.25)); TD._dirty = true; draw(); };
    rw.querySelector('input[type=range]').onchange = () => { S.set('goalRate', num(rw.input.value, 1.25)); TD._dirty = true; draw(); };
    pane.appendChild(rw);
    pane.appendChild(rateOut);
    pane.appendChild(el('div', e.basis === 'measured' ? 'note' : 'warnbox',
      e.basis === 'measured'
        ? 'Target right now: ' + calTarget().v.toLocaleString() + ' kcal, from a measured TDEE of ' +
          (e.predicted || e.tdee).toLocaleString() + (e.err ? ' ± ' + e.err.toLocaleString() : '') + '.'
        : 'Your TDEE is not measured yet — ' + esc(e.why || '') + '. Until it is, the fixed number below is used.'));
  }
  const kc = el('div', 'field');
  kc.style.display = mode === 'macros' ? 'none' : '';   /* derived, so not typed */
  kc.appendChild(el('label', 'fl', mode === 'tdee' ? 'Fallback calories' : 'Calories'));
  const ki = document.createElement('input');
  ki.type = 'text'; ki.inputMode = 'decimal'; ki.value = String(tg.kcal == null ? '' : tg.kcal);
  ki.onchange = () => { const t = TARGETS(); t.kcal = num(ki.value, t.kcal); S.set('targets', t); draw(); };
  kc.appendChild(ki);
  pane.appendChild(kc);

  /* ── which macros you are actually chasing ──
     Not everybody tracks all three, and pretending otherwise means three
     boxes that have to be filled in with numbers that do not mean anything.
     A macro that is off is simply not a target: it still gets counted and
     shown, it just has no bar to fill.

     Calories can also be derived rather than set — 4 kcal per gram of protein
     and carbohydrate, 9 per gram of fat. Those are the Atwater factors, the
     standard rounded figures used on every food label. */
  pane.appendChild(el('label', 'fl', 'Track a target for'));
  const want = S.get('macroOn', { p: 1, c: 1, f: 1 });
  const chips = el('div', 'mb-chips');
  [['p', 'Protein'], ['c', 'Carbs'], ['f', 'Fat']].forEach(k => {
    const b = el('button', 'mb-chip mb-press mb-tap' + (want[k[0]] ? ' on' : ''), k[1]);
    b.onclick = () => {
      const w2 = Object.assign({}, S.get('macroOn', { p: 1, c: 1, f: 1 }));
      w2[k[0]] = w2[k[0]] ? 0 : 1;
      S.set('macroOn', w2);
      drawSettingsPane('goals'); draw();
    };
    chips.appendChild(b);
  });
  pane.appendChild(chips);

  const g = el('div', 'grid3');
  const macroIn = {};
  const kcalFromMacros = () => {
    const t = TARGETS(), w2 = S.get('macroOn', { p: 1, c: 1, f: 1 });
    let k = 0, any = false;
    [['p', 4], ['c', 4], ['f', 9]].forEach(x => {
      if (!w2[x[0]]) return;
      const v = num(macroIn[x[0]] ? macroIn[x[0]].value : t[x[0]], 0) || 0;
      k += v * x[1]; any = any || v > 0;
    });
    return any ? Math.round(k) : null;
  };

  /* Each macro gets a wheel as well as a keypad, because the calorie total
     underneath moves as you drag — which is the only reason a wheel beats
     typing. The ceilings are generous rather than opinionated. */
  const MAXG = { p: 400, c: 700, f: 250 };
  [['p', 'Protein g'], ['c', 'Carbs g'], ['f', 'Fat g']].forEach(k => {
    const w = el('div');
    w.appendChild(el('label', 'fl', k[1]));
    const wh = wheelInput(tg[k[0]] == null ? 0 : tg[k[0]], {
      min: 0, max: MAXG[k[0]], step: 5,
      onChange: () => paintSum(),
    });
    if (!want[k[0]]) { wh.style.opacity = '.4'; wh.input.disabled = true; wh.querySelector('input[type=range]').disabled = true; }
    wh.input.onchange = () => { const t = TARGETS(); t[k[0]] = num(wh.input.value, t[k[0]]); S.set('targets', t); draw(); paintSum(); };
    wh.querySelector('input[type=range]').onchange = () => {
      const t = TARGETS(); t[k[0]] = num(wh.input.value, t[k[0]]); S.set('targets', t); draw(); paintSum();
    };
    macroIn[k[0]] = wh.input;
    w.appendChild(wh); g.appendChild(w);
  });
  pane.appendChild(g);

  /* ── does the arithmetic agree? ──
     Setting calories and macros independently is normal and usually fine —
     they are two different ways of steering. But when they disagree badly one
     of them is wrong, and nothing on screen would otherwise say so. */
  const sum = el('div');
  pane.appendChild(sum);
  function paintSum() {
    const t = TARGETS(), w2 = S.get('macroOn', { p: 1, c: 1, f: 1 });
    const all = w2.p && w2.c && w2.f;
    const k = kcalFromMacros();
    sum.innerHTML = '';

    if (mode === 'macros') {
      if (k == null) return;
      sum.appendChild(el('div', 'note derived',
        'Calories work out to <span class="derived-tag">' + k.toLocaleString() + '</span>, from your macros.'));
      if (t.kcal !== k) { t.kcal = k; S.set('targets', t); }
      return;
    }

    const set = num(TARGETS().kcal, 0) || 0;
    if (!set) return;

    /* ── nothing to correct, only something to offer ──
       Leaving a macro untargeted is a choice, not an omission. With all three
       set the two numbers are two descriptions of one day and either agree or
       do not. With any of them left open there is no disagreement possible —
       what is left is simply room, and the useful thing to say is how much. */
    if (!all) {
      const spent = k || 0;
      const left = set - spent;
      const named = [['p', 'protein'], ['c', 'carbs'], ['f', 'fat']]
        .filter(x => w2[x[0]]).map(x => x[1]);
      if (!named.length) {
        sum.appendChild(el('div', 'note',
          'All ' + set.toLocaleString() + ' calories are yours to spend however you like.'));
      } else {
        sum.appendChild(el('div', 'note',
          'Your ' + named.join(' and ') + (named.length > 1 ? ' take ' : ' takes ') +
          spent.toLocaleString() + ', leaving ' + Math.max(0, left).toLocaleString() + ' to allocate.'));
      }
      if (left < 0) {
        sum.appendChild(el('div', 'warnbox',
          'That is ' + Math.abs(left).toLocaleString() + ' more than your calorie target.'));
      }
      return;
    }

    if (k == null) return;
    const off = k - set;
    /* No tolerance. Two numbers meant to describe the same day either agree or
       they do not, and a band of "close enough" is a place for a mistake to
       live. */
    if (off === 0) {
      sum.appendChild(el('div', 'note', 'Your macros come to exactly your target'));
    } else {
      sum.appendChild(el('div', 'warnbox',
        'Your macros come to <b>' + k.toLocaleString() + '</b>, which is ' +
        Math.abs(off).toLocaleString() + (off > 0 ? ' over' : ' under') + ' your target.'));
      const b = el('button', 'btn wide quiet', 'Set target to ' + k.toLocaleString());
      b.onclick = () => { const t2 = TARGETS(); t2.kcal = k; S.set('targets', t2); drawSettingsPane('goals'); draw(); };
      sum.appendChild(b);
    }
  }

  paintSum();

}

/* ══════════════ DAILY QUESTS ══════════════
   The five things the day is graded on, and the settings that belong to them
   rather than to the app.

   A phase - cutting, massing, maintenance - was built here and taken back out
   the same day. Tom, 2026-09-03: "let's never mind the phasing, it adds
   complications." He was right: it set a rate you could already set, and it
   promised to change the pass marks, which meant inventing two more sets of
   numbers to sit beside the one real table.

   What it was actually FOR survives as one switch. Cutting and massing differ
   in which direction a calorie miss matters, and that is the whole of it. */

/** Which way a calorie miss costs you.

    The id is the direction that is FREE, which is the opposite of the label -
    "only if I go over" means going over is the thing that costs, so being
    under is free. I had these the wrong way round first time and the test
    caught it: picking "only if I go over" was handing out full marks for
    being fourteen percent over. */
const KCAL_DIRS = [
  ['both',  'Both ways',            'Over and under both cost marks'],
  ['under', 'Only if I go over',    'At or under the target is full marks'],
  ['over',  'Only if I fall short', 'At or over the target is full marks'],
];
const kcalDir = () => S.get('kcalDir', 'both');

function drawQuestsTab(pane) {
  settingsPane = pane; pane.classList.add('setpane');

  /* Everything that decides a daily number: the calorie target, the macros
     you are chasing, and the rate the phase set for you. */
  drawTargets(pane);

  /* ── the pass marks ──
     The table, on the screen, because a grade you cannot see the rules for is
     a grade you argue with. */
  pane.appendChild(el('label', 'fl', 'What each letter needs'));
  const st = STANDARDS();
  const tbl = el('div', 'gradetbl');
  const cols = [['sleep', 'Sleep'], ['steps', 'Steps'], ['kcal', 'Cals'], ['protein', 'Protein']];
  tbl.innerHTML =
    '<div class="gr hd"><b></b>' + cols.map(c => '<b>' + c[1] + '</b>').join('') + '</div>' +
    RANKS.map(r => {
      const cells = cols.map(c => {
        const rung = (st[c[0]] || []).filter(x => x[0] === r.k)[0];
        const v = rung ? rung[1] : null;
        if (v == null) return '<span>·</span>';
        if (c[0] === 'kcal' || c[0] === 'protein') return '<span>' + v + '%</span>';
        return '<span>' + (v >= 1000 ? v.toLocaleString() : v) + '</span>';
      }).join('');
      return '<div class="gr"><b style="color:' + rankColour(r.k) + '">' + r.k + '</b>' + cells + '</div>';
    }).join('');
  pane.appendChild(tbl);
  /* The one thing a phase was for. Somebody eating under wants going over to
     cost them and being under to be free; somebody eating over wants the
     opposite. Two lines instead of three phases. */
  pane.appendChild(el('label', 'fl', 'A calorie miss counts'));
  const kseg = el('div', 'seg');
  const kd = kcalDir();
  KCAL_DIRS.forEach(d => {
    const b = el('button', d[0] === kd ? 'on' : '', d[1]);
    b.onclick = () => { S.set('kcalDir', d[0]); Mobile.feedback('select'); drawSettingsPane('quests'); draw(); };
    kseg.appendChild(b);
  });
  pane.appendChild(kseg);
  pane.appendChild(el('div', 'note',
    esc((KCAL_DIRS.filter(d => d[0] === kd)[0] || KCAL_DIRS[0])[2]) +
    '. Protein counts only if you fall short'));

  /* ── training ──
     Graded against the plan rather than a flat number, so the question is
     what you said you would do, not what somebody else does. */
  pane.appendChild(el('label', 'fl', 'Sessions a week'));
  const tseg = el('div', 'seg');
  const per = num(S.get('trainPerWeek', 4), 4);
  [2, 3, 4, 5, 6].forEach(n => {
    const b = el('button', n === per ? 'on' : '', String(n));
    b.onclick = () => { S.set('trainPerWeek', n); Mobile.feedback('select'); drawSettingsPane('quests'); draw(); };
    tseg.appendChild(b);
  });
  pane.appendChild(tseg);
  const col = TRAIN_STANDARD()[Math.max(2, Math.min(6, per))] || {};
  pane.appendChild(el('div', 'note',
    Object.keys(col).sort((a, b) => b - a)
      .map(n => n + ' \u2192 ' + col[n]).join('   ')));
}

      : 'Before there is data. You log in ' + esc(TD.unit()) + ', so that is weight × ' + r1(TD.perUnit()));
  fieldRow(pane, 'Brake (kcal)', 'guard', TD.guard(), 'The most one update may move the estimate');

  pane.appendChild(rc);
}

/* score the current settings against history, then sweep for better ones */
function runBacktest() {
  const base = TD.backtest(null, 14);
  if (base.mae == null || base.n < 10) {
    return UI.dialog({ title: 'BACKTEST', width: 460,
      body: b => { b.appendChild(el('div', 'empty',
        'Needs about two months of weights and food. Found ' + base.n + ' usable stretches and needs at least 10.')); },
      actions: [{ label: 'OK', kind: 'go' }] });
  }
  UI.toast('Sweeping…');
  setTimeout(() => {
    const res = TD.optimise();
    UI.dialog({
      title: 'BACKTEST', width: 500,
      body: b => {
        b.appendChild(el('div', 'note', 'Scored on how well each predicted the next 14 days, across ' + base.n + ' stretches. Lower is better'));
        b.appendChild(el('div', 'note', 'Energy per lb is not tested here'));
        const now = el('div', 'row');
        now.innerHTML = '<span class="nm">What you use now</span><span class="fig">' + r1(base.mae * 10) / 10 + ' lb off</span>';
        b.appendChild(now);
        b.appendChild(el('label', 'fl', 'Best found'));
        res.slice(0, 5).forEach(r => {
          const row = el('div', 'row tap');
          row.innerHTML = '<span class="nm">Half-life ' + r.p.halfLife + ' days' +
            '<small>adaptation ' + r.p.alpha + ' · window ' + r.p.trendWin + ' days</small></span>' +
            '<span class="fig">' + Math.round(r.mae * 100) / 100 + '</span>';
          row.onclick = () => UI.confirm('Use these settings?', 'Half-life ' + r.p.halfLife + ' days, adaptation ' + r.p.alpha + ', window ' + r.p.trendWin + ' days.')
            .then(ok => { if (ok) { Object.keys(r.p).forEach(k => S.set(k === 'trendWin' ? 'win' : k, r.p[k])); TD._dirty = true; draw(); UI.toast('Applied'); } });
          b.appendChild(row);
        });
      },
      actions: [{ label: 'DONE', kind: 'go' }],
    });
  }, 60);
}

/* ── which copy of the app am I looking at ──
   Added 2026-09-05 after a real half hour was lost to it. Tom reported the
   share picture coming out in a shape that had been deleted from the code the
   day before, and then that it was no longer transparent. Both were true of
   his phone and neither was true of the app: a browser had cached the page
   and kept serving it, and there was nothing on screen that could have told
   him so. The next best thing to never caching is being able to see it.

   BUILT is stamped by tools/build-client.py where it can be; where it cannot
   — opening the folder straight off disk — it says so rather than lying. */
function drawFreshness(pane) {
  pane.appendChild(el('label', 'fl', 'THIS COPY'));
  const stamp = document.documentElement.getAttribute('data-built') || '';
  pane.appendChild(el('div', 'note',
    'Script <b>v' + IO.SCRIPT_V + '</b>' +
    (stamp ? ' · built <b>' + esc(stamp) + '</b>' : '') +
    '. If something here does not match what you were told changed, ' +
    'this is the first thing to check.'));

  const b = el('button', 'btn wide mb-press mb-tap', 'Get the newest version');
  b.onclick = () => {
    UI.toast('fetching…');
    /* Refetch every shared script past the cache, THEN reload the page with a
       query it has never seen. Either half alone leaves the other stale, which
       is exactly the state his phone was in. */
    const srcs = [].map.call(document.querySelectorAll('script[src]'), n => n.src);
    Promise.all(srcs.map(u => fetch(u, { cache: 'reload' }).catch(() => null)))
      .then(() => location.replace(location.pathname + '?v=' + Date.now()));
  };
  pane.appendChild(b);
  pane.appendChild(el('div', 'note',
    'Loads the app again from scratch. Your data is not touched — it lives in this browser, not in the file.'));
}

function drawSyncTab(pane) {
  settingsPane = pane; pane.classList.add('setpane');
  drawFreshness(pane);
  pane.appendChild(el('div', 'note', 'Backup creates a file you can restore from. Export creates a spreadsheet you can read, and it restores too. Both are in the DATA tab.'));
  const cfg = Mirror.settings;

  pane.appendChild(el('label', 'fl', 'GOOGLE SHEET MIRROR'));

  /* Which script this app writes, and which one the sheet is actually
     running. They drift the moment a new version ships and the sheet is not
     re-deployed, and that drift is invisible - the sync just quietly does
     less. Tom, 2026-09-03: "we should probably put a version number
     somewhere in settings." */
  const mine = IO.SCRIPT_V, theirs = cfg.sheetV || 0;
  const vrow = el('div', 'note');
  vrow.innerHTML = 'App writes script <b>v' + mine + '</b>. ' +
    (!cfg.url ? 'No sheet linked yet.'
      : !theirs ? 'The sheet has not answered yet.'
      : theirs >= mine ? 'The sheet is running <b>v' + theirs + '</b>.'
      : 'The sheet is running <b>v' + theirs + '</b>, which is older. Copy the script again and re-deploy.');
  if (theirs && theirs < mine) vrow.className = 'warnbox';
  pane.appendChild(vrow);
  pane.appendChild(el('div', 'warnbox', '<b>Untested.</b> A failed push never blocks anything and goes again next time.'));
  pane.appendChild(el('div', 'note', 'Setup, once: blank Google Sheet → Extensions → Apps Script → paste the script below → Deploy → New deployment → Web app → Execute as <b>me</b>, access <b>anyone</b> → copy the URL → paste it here.'));

  const u = document.createElement('input');
  u.type = 'text'; u.placeholder = 'https://script.google.com/macros/s/…/exec';
  u.value = cfg.url || '';
  /* on `input`, not `onchange`. change only fires when the field loses focus,
     and pasting a URL then tapping DONE closes the sheet and removes the node
     before that ever happens — so the link was silently never saved. */
  u.oninput = () => Mirror.set({ url: u.value.trim() });
  pane.appendChild(u);

  pane.appendChild(toggleRow('Push at the end of each day', cfg.at ? 'last pushed ' + cfg.at : 'never pushed yet', !!cfg.on, on => {
    Mirror.set({ on: on ? 1 : 0 }); drawSettingsPane('sync');
  }));

  const now = el('button', 'btn go wide', 'Save & sync');
  now.style.minHeight = 'var(--tap)';
  now.onclick = () => {
    /* Take whatever is in the box first. Pressing a button that says Save and
       having it not save what is on screen is the kind of thing that makes
       people paste a link four times. */
    Mirror.set({ url: u.value.trim() });
    if (!Mirror.ready()) return UI.toast('Paste the link first', { bad: true });
    Mirror.sync(APP.id).then(() => drawSettingsPane('sync'));
  };
  pane.appendChild(now);

  const show = el('button', 'btn wide', 'Copy the script');
  show.style.marginTop = 'var(--s-2)';
  show.onclick = () => {
    const code = Mirror.script();
    /* One tap, whole thing. Selecting it by hand on a phone is how characters
       go missing: a copy that drops two pipes turns line seven into a syntax
       error, and the error names a line rather than the cause. */
    const done = ok2 => {
      const t = document.createElement('textarea');
      t.rows = 12; t.value = code;
      t.style.fontFamily = 'var(--font-mono)'; t.style.fontSize = 'var(--f-1)';
      t.setAttribute('readonly', '');
      UI.dialog({
        title: 'APPS SCRIPT', width: 560,
        body: b => {
          b.appendChild(el('div', 'note', ok2
            ? 'Copied. Paste it over everything in the Apps Script editor'
            : 'Copy this and paste it over everything in the Apps Script editor'));
          b.appendChild(t);
          if (!ok2) setTimeout(() => { t.select(); }, 50);
        },
        actions: [{ label: 'DONE', kind: 'go' }],
      });
      if (ok2) Mobile.feedback('success');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(() => done(true)).catch(() => done(false));
    } else done(false);
  };
  pane.appendChild(show);
}

/* Repaint one settings pane in place. The pane element is handed to each tab
   when it draws, so hold on to it rather than hunting for it in the DOM —
   shared/ui.js owns that markup and has already changed it once. */
let settingsPane = null;
function drawSettingsPane(which) {
  const pane = settingsPane;
  if (!pane) return;
  pane.innerHTML = '';
  if (which === 'track') drawTrackTab(pane);
  else if (which === 'goals') drawGoalsTab(pane);
  else drawSyncTab(pane);
}

/* ══════════════ THE SHEET MIRROR ══════════════ */

/* The mirror moved to shared/io.js on 2026-08-21. One sheet is the save
   file for the whole suite, so one link belongs to the suite rather than
   to this app, and TRAIN and the home screen use the same one. */
const Mirror = IO.mirror;

/* ══════════════ EXPORT ══════════════ */

function exportSheets() {
  const days = Day.last(370);
  const live = Object.values(fields()).sort((a, b) => (a.order || 0) - (b.order || 0));

  const daily = [['Date', 'Day'].concat(live.map(f => f.label + (f.unit ? ' (' + f.unit + ')' : '')))
    .concat(['Calories', 'Calories ±', 'Protein g', 'Carbs g', 'Fat g', 'Sodium mg', 'Potassium mg', 'Calcium mg', 'Caffeine mg', 'Food eaten ₱', 'Spent ₱'])];
  days.forEach(d => {
    const t = dayTotals(d), sp = spendTotal(d);
    const any = live.some(f => value(d, f.id) != null) || t.kcal || sp;
    if (!any) return;
    daily.push([d, new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' })].concat(live.map(f => { const v = value(d, f.id); return v == null ? '' : r1(v); }))
      .concat([Math.round(t.kcal), Math.round(t.kerr), r1(t.p), r1(t.c), r1(t.f), Math.round(t.na), Math.round(t.k), Math.round(t.ca), Math.round(t.caff),
        Math.round(t.price), Math.round(sp)]));
  });

  const mealRows = [['Date', 'Time', 'Food', 'Serving', 'Amount', 'Unit', 'Calories', 'Protein', 'Carbs', 'Fat', 'Sodium', 'Potassium', 'Calcium', 'Caffeine', 'Price', 'Margin', 'Paid from']];
  days.forEach(d => meals(d).forEach(x => mealRows.push([d, new Date(x.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    x.name, x.serve || '', r1(x.amt), x.unit || '', Math.round(x.kcal), r1(x.p), r1(x.c), r1(x.f), Math.round(x.na), Math.round(x.k), Math.round(x.ca), Math.round(x.caff), Math.round(x.price),
    errTag(x.err), x.acct || ''])));

  const spendRows = [['Date', 'Time', 'Amount', 'Account', 'Details']];
  days.forEach(d => spends(d).forEach(s => spendRows.push([d, new Date(s.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    r1(s.amt), s.acct || '', s.note || ''])));

  const foodRows = [['Food', 'Brand', 'Group', 'Serving', 'Unit', 'Calories', 'Protein', 'Carbs', 'Fat', 'Sodium', 'Potassium', 'Calcium', 'Caffeine', 'Price', 'Your servings', 'Times logged']];
  Object.values(foods()).forEach(f => foodRows.push([f.name, f.brand || '', f.cat || '', r1(num(f.base.amt, 0)), f.base.unit || '',
    num(f.base.kcal, ''), num(f.base.p, ''), num(f.base.c, ''), num(f.base.f, ''), num(f.base.na, ''), num(f.base.k, ''), num(f.base.ca, ''), num(f.base.caff, ''), num(f.base.price, ''),
    (f.serves || []).map(s => s.label + ' = ' + r1(s.mult) + '×').join('; '), f.uses || 0]));

  const e = TD.estimate();
  const tdeeRows = [['Measure', 'Value'],
    ['TDEE', e.tdee == null ? '' : e.tdee], ['Margin of error', e.err == null ? '' : e.err],
    ['  of which, weight trend', e.errTrend == null ? '' : e.errTrend],
    ['  of which, guessed food', e.errGuess == null ? '' : e.errGuess],
    ['Basis', e.basis], ['Confidence %', e.conf],
    ['Average intake', e.intake == null ? '' : e.intake], ['Trend lb/week', e.rate == null ? '' : r1(e.rate)],
    ['Days of food logged', e.calDays], ['Weigh-ins', e.weighIns],
    ['Energy per lb', TD.ed()], ['Smoothing', TD.alpha()], ['Window days', TD.win()],
    ['Target intake', TD.targetIntake() == null ? '' : TD.targetIntake()]];

  return [
    { name: 'Daily', rows: daily, widths: daily[0].map(() => 12) },
    { name: 'Meals', rows: mealRows, widths: mealRows[0].map(() => 12) },
    { name: 'Spending', rows: spendRows, widths: [11, 8, 10, 12, 30] },
    { name: 'Foods', rows: foodRows, widths: foodRows[0].map(() => 13) },
    { name: 'TDEE', rows: tdeeRows, widths: [24, 14] },
  ];
}

/* ══════════════ BOOT ══════════════ */

Rec.onfull = () => UI.toast('<b>Storage is full.</b> Photos are not being saved.', { bad: true });

/* ── draw the buttons ──
   Anything in the markup carrying data-icon gets its drawing here. Called
   again on every theme change, because the stroke recipe belongs to the theme
   — a pixel theme wants a squared-off cap and a hand-drawn one wants a wobble,
   and those are different paths rather than a different colour. */
if (window.Icons) Icons.paint();

Rec.ready(() => {
  seedFields();
  linkNutrients();
  fixSeedFields();
  TD.tick();
  /* On open, quietly: pull anything typed into the sheet since last time.
     Never blocks, never speaks unless it actually brought something back. */
  Mirror.onOpen(APP.id);
  draw();
  if (IO.isStale(APP.id)) setTimeout(() => UI.toast('no backup in ' + (IO.staleDays(APP.id) == null ? 'a while' : IO.staleDays(APP.id) + ' days') + ' — <b>settings → data</b>'), 1500);
});
wireDaySwipe();
Rec.on(draw);
Day.on(() => { TD.tick(); draw(); });
</script>
