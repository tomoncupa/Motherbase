<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STATUS">
<title>STATUS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◐</text></svg>">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">

<script src="../shared/skins.js"></script>
<script src="../shared/day.js"></script>
<script src="../shared/records.js"></script>
<script src="../shared/mobile.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/io.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/health.js"></script>

<style>
/* ── the system, decided once ──────────────────────────────────────────
   Spacing and type both step by at least 25%, so there is never a choice
   to agonise over between two near-identical values.

   Separation comes from background and space, not from borders. A border
   on every card and every row is what made this look busy. Borders are
   now reserved for things you type into.

   Three weights, six sizes, and one accent colour that only ever marks
   the single most important thing on screen.                            */
/* ── no scales of its own ──
   This block used to hold a private spacing scale, a private type scale and
   two hand-written shadows. Colours came from the theme, so the app LOOKED
   like it was on the system, and every measurement in it was still its own.

   What that cost, measured rather than guessed:

     · the type scale ran 11, 12, 13, 15, 17, 22, 28, 40. Three of those sit
       within two pixels of each other, which is exactly the choice a scale
       exists to abolish, and 11px is below what anybody should have to read
       on a phone.
     · --s8 was used by the photo thumbnail and never defined, so the images
       were sized by whatever the browser fell back to.
     · --lift and --lift2 were fixed black at fixed opacity, so they did not
       get the doubling skins.js applies on a dark theme, and a light theme
       got shadows built for a dark one.

   Everything now points at the shared tokens: --s-1..--s-10 for space,
   --f-1..--f-9 for type, --e-1..--e-5 for depth. One scale for the suite. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}
/* The band under the tab bar was the page background showing through below
   the app's own column: a stripe of a different colour between the bar and the
   home indicator, which no native app has. html takes the bar's colour, so
   anything outside the column reads as the bar continuing. dvh measures the
   viewport as it actually is rather than as tall as it ever gets. */
html{height:100%;height:100dvh;background:var(--surface-1)}
body{
  height:100%;height:100dvh;overflow:hidden;      /* only main scrolls, so Safari cannot bounce the page */
  overscroll-behavior:none;
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);line-height:1.45;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input,textarea,select{-webkit-user-select:text;user-select:text}

/* ── header: present, not competing ── */
header{
  display:flex;align-items:center;gap:var(--s-2);flex:0 0 auto;
  padding:calc(var(--s-3) + env(safe-area-inset-top)) var(--s-4) var(--s-3);
  background:var(--surface-1);
}
/* A theme is allowed to repaint the header -- Slab makes it the accent, and
   Ragnarok gives it a blue gradient. When it does, anything in there that
   forces its own colour is left behind on a ground that has moved: the date
   read grey-on-orange at 1:1 in Slab. So inside the header, quiet text is
   quiet by transparency rather than by colour, and follows whatever the theme
   put underneath it. */
header .muted{color:inherit;opacity:.65}
.logo{font-family:var(--font-display);font-weight:700;font-size:var(--f-2);letter-spacing:.18em}
.logo b{color:var(--accent);font-weight:700}
.spacer{flex:1}
.hbtn{
  width:44px;height:44px;flex:0 0 auto;border:0;border-radius:50%;
  background:var(--surface-2);color:var(--text-muted);font-size:var(--f-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.hbtn:active{background:var(--surface-3);color:var(--text-1)}

main{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  /* Enough to clear the fixed bar and the home indicator. It was 132px, which
     also cleared the whole floating button — but content is allowed to scroll
     under a floating button, and reserving room for it left a dead band at the
     bottom of every screen. */
  /* clears the fixed tab bar and the home indicator, nothing more */
  padding:var(--s-3) var(--s-3) calc(70px + env(safe-area-inset-bottom));
}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-3)}

/* ── cards: background does the separating ── */
.card{background:var(--surface-1);border-radius:var(--radius-md);padding:var(--s-4);box-shadow:var(--e-1)}
h2{
  font-family:var(--font-display);font-size:var(--f-1);letter-spacing:.16em;font-weight:600;
  color:var(--text-muted);margin-bottom:var(--s-3);display:flex;align-items:baseline;gap:var(--s-2);
}
h2 .sub{margin-left:auto;letter-spacing:0;font-family:var(--font-mono);font-size:var(--f-1)}
.empty{color:var(--text-muted);font-size:var(--f-2);line-height:1.6}
.muted{color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.note{font-size:var(--f-1);color:var(--text-muted);line-height:1.55;margin-top:var(--s-2)}

/* ── the hero number ── */
.hero{font-family:var(--font-mono);font-size:var(--f-8);font-weight:600;line-height:1.05;letter-spacing:-.02em}
/* the rank, and the number behind it */
/* the day card's top line: calories on the left, rank on the right */
.islerow{display:flex;align-items:flex-start;gap:var(--s-3)}
.islehero{flex:1;min-width:0}
/* "609 / 2,220 left" is one reading and it breaks in half if it is allowed to
   wrap: the number on one line and the word under it, which looks like two
   facts. It stays on one line and steps down the type scale instead, because
   a smaller number is still one number. */
.islehero .hero{white-space:nowrap;overflow:hidden;text-overflow:clip}
.islehero .hero.tight{font-size:var(--f-7)}
.islehero .hero.tighter{font-size:var(--f-6)}
.rankbadge{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-2);
  background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.rankbadge .rk{width:46px;height:46px;display:flex;align-items:center;
  justify-content:center;font-family:var(--font-display);font-size:var(--f-6);
  font-weight:700;line-height:1;border:2px solid;border-radius:var(--radius-md)}
.rankbadge .rkm{display:flex;flex-direction:column;text-align:left;line-height:1.2}
.rankbadge .rkm b{font-family:var(--font-mono);font-size:var(--f-2)}
.rankbadge .rkm i{font-style:normal;font-size:var(--f-1);color:var(--text-muted)}
.rankrow{display:flex;align-items:center;gap:var(--s-4);margin:var(--s-3) 0}
.rankmark{width:96px;height:96px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-family:var(--font-display);font-size:var(--f-9);
  font-weight:700;line-height:1;border:3px solid;border-radius:var(--radius-md)}
.rankside{flex:1;min-width:0}
.rankside .lb{font-size:var(--f-1);color:var(--text-muted);margin-top:var(--s-1)}
.hero .u{font-size:var(--f-2);font-weight:400;color:var(--text-muted);letter-spacing:0;margin-left:var(--s-1)}
/* the divider in "1,680 / 2,400" - present, and quieter than either number */
.hero .sl{color:var(--text-muted);font-weight:400;margin:0}
/* A value with a slash in it - 200/175 - is nearly twice as wide as a plain
   one and was running under the unit. It steps down instead of overflowing;
   the tile is a fixed width and the number has to live inside it. */
.tile .vl.long{font-size:var(--f-5)}
.tile .vl.longer{font-size:var(--f-4)}
/* the pass marks, as the table Tom drew them */
.gradetbl{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin:var(--s-2) 0}
.gradetbl .gr{display:grid;grid-template-columns:2.2em repeat(4,1fr);align-items:center;
  font-family:var(--font-mono);font-size:var(--f-2);border-top:1px solid var(--border)}
.gradetbl .gr:first-child{border-top:0}
.gradetbl .gr>b,.gradetbl .gr>span{padding:var(--s-2) 0;text-align:center}
.gradetbl .gr>b{font-weight:700}
.gradetbl .hd{color:var(--text-muted);font-size:var(--f-1);letter-spacing:.06em}
.gradetbl .hd b{font-weight:500}
.shopt{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap);
  font-size:var(--f-2);color:var(--text-2);cursor:pointer}
.shopt input{width:18px;height:18px;accent-color:var(--accent)}

/* ── tiles: value is the point, label recedes ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:var(--s-2)}
.tile{
  background:var(--surface-2);border:0;border-radius:var(--radius-md);
  padding:var(--s-3) var(--s-3) var(--s-2);text-align:left;cursor:pointer;
  /* 76 is not a scale step and should not be: it is the height at which a
     value, its unit and its label all fit without the label wrapping. Sized
     to its contents, which is the one good reason to leave the scale. */
  min-height:76px;display:flex;flex-direction:column;gap:var(--s-1);
  font-size:var(--f-1);font-family:inherit;color:inherit;
}
.tile:active{background:var(--surface-3)}
.tile .vl{font-family:var(--font-mono);font-size:var(--f-6);font-weight:600;line-height:1.1;color:var(--text-1)}
.tile .vl .un{font-size:var(--f-1);font-weight:400;color:var(--text-muted);margin-left:2px}
.tile .lb{font-size:var(--f-1);color:var(--text-muted);margin-top:auto}
/* ── which of these is being graded ──
   Hierarchy by taking away rather than adding: a pillar is left alone and
   everything beside it steps back a size and loses some contrast. Nothing
   here is a new colour - `aside` is the muted text the labels already use. */
.tile.aside{background:color-mix(in srgb,var(--surface-2) 62%,transparent)}
.tile.aside .vl{font-size:var(--f-4);color:var(--text-2);font-weight:500}
.tile.aside .lb{opacity:.8}
.tile .lb i{display:block;font-style:normal;font-size:var(--f-1);opacity:.75}
.tile.todo .vl{color:var(--text-muted);opacity:.5}
.tile .bar{height:2px;border-radius:1px;background:var(--surface-3);overflow:hidden;margin-top:var(--s-2)}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.tile.over .bar i{background:var(--warn)}
/* ── a tile being moved ──
   `touch-action:none` goes on the GRID and only while something is lifted.
   Put it on the tile permanently and the island stops being somewhere you can
   start a scroll, which on a phone is most of the first screen. */
.tiles.sorting{touch-action:none}
.tile.lifted{box-shadow:var(--e-3);outline:2px solid var(--accent);
  transform:scale(1.04);position:relative;z-index:2;opacity:.95}

/* the two arrows that set the tile order, in Settings → Track */
.ord{width:30px;height:34px;padding:0;border:0;border-radius:var(--radius-sm);
  background:var(--surface-3);color:var(--text-2);font-size:var(--f-2);cursor:pointer;font-family:inherit}
.ord:disabled{opacity:.25}

/* ── rows ── */
.row{
  display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3);border-radius:var(--radius-md);background:var(--surface-2);
  margin-bottom:var(--s-2);min-height:var(--tap);
}
.row .nm{flex:1;min-width:0;font-size:var(--f-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;color:var(--text-muted);font-size:var(--f-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .fig{font-family:var(--font-mono);font-size:var(--f-2);color:var(--text-2);flex:0 0 auto;text-align:right}
.row .fig small{display:block;color:var(--text-muted);font-size:var(--f-1)}
.row .x{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:50%;
  background:none;color:var(--text-muted);cursor:pointer;font-size:var(--f-3)}
.row .x:active{background:var(--surface-3);color:var(--text-1)}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--surface-3)}

/* ── progress ── */
.macro{margin-bottom:var(--s-3)}
.macro .top{display:flex;align-items:baseline;gap:var(--s-2);margin-bottom:var(--s-2)}
.macro .top b{font-weight:600;font-size:var(--f-2);color:var(--text-2)}
.macro .top .n{margin-left:auto;font-family:var(--font-mono);font-size:var(--f-1);color:var(--text-muted)}
.macro .track{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.macro .track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.macro.k1 .track i{background:var(--data-1)}
.macro.k2 .track i{background:var(--data-2)}
.macro.k3 .track i{background:var(--data-3)}
.macro.k4 .track i{background:var(--data-4)}
.macro.over .track i{background:var(--warn)}
/* no target, so the bar describes rather than measures */
.macro.untargeted{opacity:.62}
.macro.untargeted .track i{background:var(--text-muted)}

/* ── buttons ── */
.btn{
  padding:var(--s-2) var(--s-3);min-height:var(--tap);border:0;border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-2);cursor:pointer;
  font-family:var(--font-body);font-size:var(--f-2);font-weight:600;
}
.btn:active{background:var(--surface-3)}
.btn.go{background:var(--accent);color:var(--accent-fg)}
.btn.wide{width:100%;min-height:48px}
.btn.quiet{background:none;color:var(--text-muted)}
.btn.quiet:active{background:var(--surface-2)}

/* ── the one big action ── */
/* ── the add button, in the seam between two cards ──
   The wrapper is zero-height and sits in the flow, so the button hangs into
   the gap above and below it. Overlapping both cards is what makes it read as
   belonging to the seam rather than sitting on top of a card. */
.seam{height:0;display:flex;justify-content:flex-end;position:relative;z-index:20}
.fab{
  width:56px;height:56px;margin-top:calc(var(--s-3) * -1 - 28px);
  border-radius:50%;border:0;background:var(--accent);
  color:var(--accent-fg);font-size:var(--f-7);font-weight:400;line-height:1;cursor:pointer;
  box-shadow:var(--e-4);display:flex;align-items:center;justify-content:center;
  position:relative;
}
.fab:active{transform:scale(.94)}
/* something is still open today */
.fab.dot::after{content:'';position:absolute;top:2px;right:2px;width:12px;height:12px;
  border-radius:50%;background:var(--warn);border:2px solid var(--surface-1)}

/* ── tabs ── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--surface-1);padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;padding:var(--s-2) var(--s-1) var(--s-2);background:none;border:0;cursor:pointer;
  color:var(--text-muted);opacity:.55;font-size:var(--f-1);letter-spacing:.1em;font-weight:600;
  /* the bar is deliberately taller than one tap target: it carries an icon
     over a label, and 44 crushes them together */
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;
  font-family:var(--font-display);
}
nav button .g{font-size:var(--f-4);line-height:1}
nav button.on{color:var(--accent);opacity:1}

/* ── chips ── */
.chips{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-bottom:var(--s-3)}
.chip{
  padding:var(--s-2) var(--s-4);min-height:var(--tap);border:0;border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-2);cursor:pointer;
  font-family:var(--font-mono);font-size:var(--f-3);
}
.chip:active{background:var(--surface-3)}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.chip.big{flex:1;min-width:var(--s-6);text-align:center;font-size:var(--f-4);padding:var(--s-4) var(--s-2);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.chip.big small{font-size:var(--f-1);opacity:.7;font-family:var(--font-body)}

/* ── things you type into: the one place a border earns its keep ── */
input[type=text],input[type=search],input[type=time],input.num,textarea,select{
  width:100%;min-width:0;padding:var(--s-3);border:1px solid var(--border);
  border-radius:var(--radius-md);background:var(--surface-2);color:var(--text-1);
  font:inherit;font-size:var(--f-3);
}
input.num{font-family:var(--font-mono);font-size:var(--f-7);font-weight:600;text-align:center;padding:var(--s-3) var(--s-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=time]{font-family:var(--font-mono);text-align:center}
label.fl{
  display:block;font-size:var(--f-1);font-weight:600;color:var(--text-muted);
  margin:var(--s-4) 0 var(--s-2);
}
label.fl:first-child{margin-top:0}

/* ── settings, as sections rather than a form ──
   A pane was a flat stack: a label, a control, a grey line, repeat, with the
   switches the only thing sitting on a card. Half of it looked designed and
   half of it looked like the raw form underneath, which is the "unfinished"
   Tom is seeing.

   Two changes and no new colours. A label that is a direct child of the pane
   is a SECTION HEADING and is drawn like one. Everything under it sits on the
   same card the switches already use, so a group reads as a group. */
.setpane > label.fl{
  text-transform:uppercase;letter-spacing:.12em;font-size:var(--f-1);
  color:var(--text-2);margin:var(--s-5) 0 var(--s-2);
  padding-bottom:var(--s-2);border-bottom:1px solid var(--border);
}
.setpane > label.fl:first-child{margin-top:0}
.setpane > .field{
  background:var(--surface-2);border-radius:var(--radius-md);
  padding:var(--s-3);margin-bottom:var(--s-2);
}
.setpane > .field > label.fl{margin-top:0}
/* A note that belongs to the group above it should sit with it, not float
   between two of them. */
.setpane > .field > .note{margin-bottom:0}
.setpane > .seg{margin-bottom:var(--s-2)}
.seg.wrapseg{flex-wrap:wrap}

/* ── the day behind the letter ── */
.dayhead{display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-4)}
.dayhead .rk{flex:none;display:grid;place-items:center;width:56px;height:56px;
  border:2px solid;border-radius:var(--radius-md);font-family:var(--font-mono);
  font-size:var(--f-6);font-weight:700}
.dayhead .dhs{font-family:var(--font-mono);font-size:var(--f-4)}
.dayhead .dhs i{display:block;font-style:normal;font-family:var(--font-ui);
  font-size:var(--f-1);color:var(--text-muted);margin-top:2px}
.pillars{display:flex;flex-direction:column;gap:var(--s-2)}
.pillar{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-3);
  background:var(--surface-2);border-radius:var(--radius-sm);min-height:var(--tap)}
.pillar .pl{flex:1;min-width:0}
.pillar .pv{font-family:var(--font-mono);color:var(--text-2);text-align:right}
.pillar .pv i{display:block;font-style:normal;font-size:var(--f-1);color:var(--text-muted)}
.pillar .pk{flex:none;width:1.6em;text-align:center;font-family:var(--font-mono);
  font-size:var(--f-4);font-weight:700}

/* One letter per day. A row you can read the shape of a week from. */
.lrun{display:flex;flex-wrap:wrap;gap:var(--s-1);margin-bottom:var(--s-3)}
.lrun .ld{flex:1 0 auto;min-width:30px;min-height:36px;padding:0;
  background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius-sm);
  font-family:var(--font-mono);font-size:var(--f-3);font-weight:700;
  color:var(--text-muted);cursor:pointer}
.lrun .ld.now{border-color:var(--accent)}
/* The two ways out of the food search. Stacked, full width, and below the list
   so they never compete with a result you could have just tapped. */
/* The brand, beside the name rather than buried in the small print. A tint
   rather than a size, so a long name still wins the line. */
.nm .brand{font-weight:400;font-size:var(--f-1);color:var(--accent);
  margin-left:var(--s-2);letter-spacing:.04em;white-space:nowrap}
.foodroutes{display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-3)}
.foodroutes .btn{min-height:var(--tap)}

/* ── the card, on a photograph ──
   Tom, 2026-09-05: "This card could not be opaque." He is right. An overlay
   that blocks the picture it is sitting on is a sticker, and the whole reason
   the PNG has a transparent surround is so the photo is part of it.

   The colours stay the theme's — color-mix cuts their ALPHA and nothing else,
   so a themed card is still that theme's card, just see-through. A browser
   that does not know color-mix drops the line and gets the solid card, which
   is the old behaviour rather than a broken one.

   Only ever added by the export. Nothing on screen wears this.

   THE ARITHMETIC, because the first attempt looked solid and was not obviously
   wrong: a tile sits ON the card, so their alphas COMPOUND. Card at 74% with
   tiles at 62% composites to 90% behind every number, which is where the eye
   actually goes - nearly solid, and the photo only showed in the gaps. The
   card is mostly a container now and the tiles carry the wash. */
.card.seethru{background:color-mix(in srgb, var(--surface-1) 32%, transparent);
  border-color:color-mix(in srgb, var(--border) 55%, transparent)}
.card.seethru .tile{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
/* One soft shadow, and deliberately nothing like the 3px stroke he rejected in
   August - that one filled the glyphs and turned his yellow calories black.
   This is a single 2px blur that does nothing on a dark photo and keeps the
   numbers off a bright one. Text over a picture needs something; it does not
   need much. */
.card.seethru, .card.seethru *{text-shadow:0 1px 2px rgba(0,0,0,.45)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s-2)}
.field{margin-bottom:var(--s-4)}          /* more space around a group than inside it */
.stepper{display:flex;align-items:center;gap:var(--s-2)}
.stepper input{flex:1;min-width:0}
.stepper button{
  width:var(--s-6);height:var(--s-6);flex:0 0 auto;border:0;border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-2);font-size:var(--f-6);cursor:pointer;
}
.stepper button:active{background:var(--surface-3)}
#datebar{flex:0 0 auto;padding:0 var(--s-3) var(--s-2);background:var(--surface-1)}
#datebar .seg{margin-bottom:0}
.seg{display:flex;gap:2px;margin-bottom:var(--s-3);background:var(--surface-3);
  padding:2px;border-radius:var(--radius-sm)}
.seg button{
  flex:1;padding:var(--s-2) var(--s-1);background:none;border:0;border-radius:calc(var(--radius-sm) - 1px);
  color:var(--text-muted);font-size:var(--f-1);font-weight:600;cursor:pointer;min-height:44px;
  font-family:inherit;
}
.seg button.on{background:var(--surface-1);color:var(--text-1)}

/* ── switches ── */
.sw{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3);border-radius:var(--radius-md);
  background:var(--surface-2);margin-bottom:var(--s-2);min-height:var(--tap)}
.sw .nm{flex:1;min-width:0;font-size:var(--f-3)}
.sw .nm small{display:block;color:var(--text-muted);font-size:var(--f-1);margin-top:1px}
.sw .tg{width:48px;height:28px;border-radius:14px;background:var(--surface-3);
  position:relative;cursor:pointer;flex:0 0 auto;transition:background var(--dur-fast)}
/* the switch knob: 22 inside a 28 track with 3 of padding either side */
.sw .tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--text-muted);transition:all var(--dur-fast)}
.sw .tg.on{background:var(--accent)}
.sw .tg.on i{left:23px;background:var(--accent-fg)}

/* ── photo ── */
.shot{display:flex;gap:var(--s-3);align-items:flex-start;margin-bottom:var(--s-3)}
.shot img{width:var(--s-7);height:var(--s-7);object-fit:cover;border-radius:var(--radius-sm)}
.thumb{width:var(--s-5);height:var(--s-5);object-fit:cover;border-radius:var(--radius-sm);flex:0 0 auto}

.fdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;order:-1;align-self:center;display:block}
.chip.swatch{min-width:var(--tap);position:relative}
.chip.swatch[style*="--sw"]::after{content:'';position:absolute;inset:var(--s-2);
  border-radius:calc(var(--radius-1) / 2);background:var(--sw)}

/* ── chart legend ──
   Named lines, because three unlabelled dashes are decoration. */
.legend{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-2)}
.lgi{display:flex;align-items:center;gap:var(--s-2);font-size:var(--f-1);color:var(--text-muted)}
.lgi i{width:16px;height:0;border-top-width:2px;border-top-style:solid;display:block}
.lgi i.avg{border-color:var(--accent)}
.lgi i.reality{border-color:var(--data-5);border-top-style:dashed}
.lgi i.predict{border-color:var(--data-2);border-top-style:dotted}
.lgi i.actual{border-color:var(--data-4)}
.lgi i.cone{border-color:var(--data-4);border-top-width:8px;opacity:.3}

/* ── the wheel ── */
.wheel{display:flex;flex-direction:column;gap:var(--s-2)}
.wheel .num{width:100%}

/* ── derived numbers ──
   Anything the app worked out rather than something you typed. Faded and
   marked, so at a glance you can tell what you set from what followed from it
   — and so changing a derived number never feels like changing a fact. */
.derived{opacity:.62}
.derived-tag{font-size:var(--f-1);color:var(--text-muted);letter-spacing:.04em;
  border-bottom:1px dotted var(--border-strong);padding-bottom:1px}

/* ── journal ── */
textarea{width:100%;background:var(--surface-2);border:0;border-radius:var(--radius-md);
  padding:var(--s-2);color:var(--text-1);font:inherit;font-size:var(--f-2);
  line-height:var(--lh-body);resize:vertical}
textarea:focus{outline:2px solid var(--focus);outline-offset:-1px}

/* the four marks. One drawing, sized by whatever contains it. */
.ni{width:1em;height:1em;display:block;fill:none;stroke:currentColor;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* on the heading line, so the card needs no row of its own for them */
.jbtns{display:flex;gap:var(--s-1);margin-left:auto}
.jb{width:var(--tap);height:34px;padding:0;border:0;border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:var(--f-3)}
.jb:active{background:var(--surface-3);color:var(--accent)}

.note-row{display:flex;align-items:flex-start;gap:var(--s-2);padding:var(--s-2);
  min-height:var(--tap);border-radius:var(--radius-md);background:var(--surface-2);cursor:pointer}
.note-row .k{flex:0 0 auto;width:16px;display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:var(--f-3);line-height:1.5;font-family:var(--font-mono);
  position:relative;background:none;border:0;padding:0;cursor:pointer}
/* The box is 13px of ink and a full finger of target. Growing the ink would
   make the list shout; growing the reach costs nothing on screen. */
.note-row .k::after{content:'';position:absolute;left:50%;top:50%;
  width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}
/* the open box, the only mark you tick */
.nm-box{width:13px;height:13px;border:1.5px solid currentColor;border-radius:3px;display:block}
.nm-ch{display:block;font-weight:700}
.note-row .tx{flex:1;min-width:0;line-height:var(--lh-body);overflow-wrap:anywhere}
/* Done and cancelled are different outcomes and must not look the same. Done
   is struck through — you did it. Cancelled is faded with the mark crossed —
   you decided not to, which is still a decision worth keeping. */
.note-row.done .tx{text-decoration:line-through;color:var(--text-muted)}
.note-row.done .k{color:var(--text-muted)}
.note-row.done .nm-box{background:var(--text-muted);border-color:var(--text-muted)}
.note-row.cancelled{opacity:.45}
.note-row.cancelled .tx{text-decoration:line-through;text-decoration-style:double}
.note-row.cancelled .nm-box{border-style:dashed}
.nm-mig{line-height:13px}
/* how many days it has been following you */
.note-row .at{font-style:normal;font-family:var(--font-mono);font-size:var(--f-1);
  color:var(--accent);margin-left:var(--s-2);white-space:nowrap}
/* `by` is a deadline and `did` is what happened, so they read differently:
   one is a warning colour waiting to be earned, the other is spent. */
.tx .at.by{color:var(--warn)}
.tx .at.did{color:var(--ok,var(--accent))}
.tx .at.wrote{opacity:.6}
/* The journal heading is the biggest word on its card because it is also the
   control that sorts it, and a heading nobody reads as pressable is a control
   nobody presses. */
.jsort{font-size:var(--f-4) !important;cursor:pointer;display:flex;align-items:baseline;gap:var(--s-2)}
.jsort b{font-weight:400;font-size:var(--f-1);color:var(--text-muted);letter-spacing:.04em}
.carried{font-style:normal;font-family:var(--font-mono);font-size:var(--f-1);
  color:var(--warn);margin-left:var(--s-2);opacity:.8}

/* the kind picker inside the sheet: mark over label */
#sheet .seg button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--f-1)}
#sheet .seg .ni{font-size:var(--f-3)}

/* ── chart ── */
.chart{width:100%;height:180px;display:block}
.chart .gl{stroke:var(--surface-3);stroke-width:1}
.chart .raw{fill:var(--text-muted);opacity:.45}
.chart .avg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .goal{stroke:var(--data-3);stroke-width:1;stroke-dasharray:3 5;fill:none}
/* the line of reality: where you have to travel to arrive on time */
.chart .reality{stroke:var(--data-5);stroke-width:1.5;stroke-dasharray:5 4;fill:none;opacity:.9}
/* the prediction: where you are actually heading. Thinner and dotted, because
   it is derived from an estimate and should not read as a promise. */
.chart .predict{stroke:var(--data-2);stroke-width:1.5;stroke-dasharray:1 3;fill:none;opacity:.75}
/* Where you land on what you have actually been eating. Solid, because unlike
   the target it is built on something that happened. */
.chart .actual{stroke:var(--data-4);stroke-width:1.75;fill:none;opacity:.95}
/* The same projection at both ends of the TDEE error band. It opens with time
   because the uncertainty does, and no stroke at all: an edge would read as
   two more predictions rather than the width of one. */
.chart .cone{fill:var(--data-4);opacity:.14;stroke:none}
.chart .now{stroke:var(--border-strong);stroke-width:1;stroke-dasharray:2 3}
.chart .lab{fill:var(--text-muted);font-family:var(--font-mono);font-size:var(--f-1)}

.grid28{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:var(--s-2)}
.grid28 i{aspect-ratio:1;border-radius:2px;background:var(--surface-3);display:block}
.grid28 i.on{background:var(--cell,var(--accent))}
.grid28 i.part{background:var(--cell,var(--accent));opacity:.35}

.conf{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:var(--s-2)}
.conf i{display:block;height:100%;background:var(--accent);border-radius:2px}
.warnbox{border-radius:var(--radius-sm);padding:var(--s-3);background:var(--surface-2);
  border-left:3px solid var(--warn);font-size:var(--f-1);line-height:1.55;
  color:var(--text-2);margin-bottom:var(--s-3)}
.split{display:flex;gap:var(--s-5);align-items:flex-start}
.split>div{flex:1;min-width:0}
.k{font-family:var(--font-mono);font-size:var(--f-6);font-weight:600;line-height:1.1}
.kl{font-size:var(--f-1);color:var(--text-muted);margin-top:2px}

</style>

</header>
<!-- Which day you are looking at is chrome, not content. It used to be the
     first card in the scrolling area and slid away the moment you scrolled,
     which is exactly the thing that reads as a web page. -->
<div id="datebar"></div>
<main class="mb-scroll"><div class="wrap" id="main"></div></main>



<nav id="nav"></nav>


<script>
/* ═══════════════════════════════════════════════════════════════════════
   STATUS — sleep, weight, mood, energy, steps, food and money.
   One writer for every fact it owns. Everything through the shared store.
   ═══════════════════════════════════════════════════════════════════════ */

const APP = {
  id: 'status',
  name: 'Status',
  icon: '◐',
  blurb: 'sleep, weight, mood, food and money',
  types: ['field', 'ev', 'day', 'food', 'meal', 'spend', 'acct', 'shot', 'note'],
};

/* ── settings, all namespaced under status. ───────────────────────────── */
const S = {
  get(k, d) { const v = Rec.setting(APP.id, k); return v == null ? d : v; },
  set(k, v) { Rec.setting(APP.id, k, v); },
};

Skins.load('../shared/skins.json').then(() => {
  if (Skins.restore) Skins.restore(APP.id); else Skins.apply(Skins.for(APP.id));
  /* The theme is fetched, so it can land AFTER the first paint. Anything drawn
     before it read an empty token: rankColour() came back as nothing and the
     grade letter was left inheriting plain white until you touched the screen
     and something redrew. Draw again once the colours are actually here.
     Rec.ready runs it now if the store is up and queues it if it is not. */
  Rec.ready(draw);
});
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* the spreadsheet builder lives further down the file, so it is reached
   through a wrapper rather than by name — a name would be read now. */
/* ── what can be typed into ──
   One line per real thing, so a line can be found again and saved back. The
   daily summary and the calendar are deliberately absent: those are sums, and
   a sum has no row to write an edit into.

   `base.kcal` and the like reach into the nested shape, so a food's label
   numbers sit flat in the sheet where they are easy to fill in forty at a
   time. That is the whole point of these tabs. */
IO.register({
  app: APP.id, name: APP.name, types: APP.types,
  sheets: function () { return exportSheets(); },
  tables: [
    { name: 'Food', type: 'food', cols: [
      ['name', 'Name'], ['brand', 'Brand'], ['cat', 'Group'],
      ['base.amt', 'Serving'], ['base.unit', 'Unit'],
      ['base.kcal', 'Calories'], ['base.p', 'Protein'], ['base.c', 'Carbs'], ['base.f', 'Fat'],
      ['base.na', 'Sodium'], ['base.k', 'Potassium'], ['base.ca', 'Calcium'], ['base.caff', 'Caffeine'],
      ['base.price', 'Price'],
    ] },
    { name: 'Meals', type: 'meal', cols: [
      ['name', 'Food'], ['serve', 'Serving'], ['amt', 'Amount'], ['unit', 'Unit'],
      ['kcal', 'Calories'], ['p', 'Protein'], ['c', 'Carbs'], ['f', 'Fat'], ['price', 'Price'],
      ['err', 'Margin'], ['acct', 'Paid from'],
    ] },
    { name: 'Spending', type: 'spend', cols: [
      ['amt', 'Amount'], ['acct', 'Account'], ['note', 'Details'],
    ] },
    { name: 'Journal', type: 'note', cols: [
      /* the words the app calls them, not the slugs it stores — and derived
         from NOTE_KINDS so a new bullet type cannot forget to appear here */
      ['kind', 'Kind', () => kindLabels()], ['text', 'Text'], ['done', 'Done'], ['cancelled', 'Cancelled'],
    ] },
    { name: 'Tracked', type: 'field', cols: [
      /* "Measured as" rather than a second column called Kind meaning something
         else entirely one tab over */
      ['label', 'Name'], ['unit', 'Unit'], ['measure', 'Measured as', () => MEASURE_LABELS], ['target', 'Target'],
      ['min', 'At least'], ['max', 'At most'], ['half', 'Half-life'], ['on', 'On'],
    ] },
  ],
});
/* ── row ids ──
   Every row this app keys by time comes through here: meals, spending, photos,
   foods and field definitions. Three parts, and each one is doing a job:

     the clock      so ids sort in the order things happened
     a counter      so two rows made in the same millisecond CANNOT collide.
                    Random characters only make that unlikely — three base-36
                    characters is one chance in 46,656 per pair, which is fine
                    until something writes in a loop. A counter makes it
                    impossible within a session, which is where loops live.
     random         so two DEVICES writing in the same millisecond with the
                    same counter still differ. Both carry user_id 'local', so
                    without this a merge could fuse two different meals into
                    one row and the older one would just be gone.

   Rec.set is keyed on (user, type, date, key), so a repeated key is not a new
   row — it is a write over the one that is already there, and it is silent. */
let seq = 0;
const uid = () => Rec.USER + '-' + Date.now().toString(36) + '-' +
  (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
const esc = s => UI.esc(String(s == null ? '' : s));
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : (d == null ? null : d); };
const r1 = n => Math.round(n * 10) / 10;
const money = n => '₱' + Math.round(n).toLocaleString();

/* ══════════════ FIELDS — the things being tracked ══════════════
   A field is a definition. Its values live in `ev` rows, one row per field
   per day, holding a list of timestamped entries. That shape covers both
   "weigh once" and "log mood five times" without a second code path.      */

/* Four kinds of thing, and that is the whole vocabulary:
     number  one reading a day        weight, sleep, steps, resting heart rate
     amount  a dose, logged as often as you like, added up   creatine, water
     scale   one to five, many times a day                   mood, energy
     check   done or not done                                morning walk    */

const SEED = [
  { id: 'weight', label: 'Weight', unit: 'lb',  measure: 'number', once: 1, agg: 'last', step: .1,  dec: 1, order: 1, on: 1 },
  { id: 'sleep',  label: 'Sleep',  unit: 'hrs', measure: 'number', once: 1, agg: 'last', step: .5,  dec: 1, target: 7, dir: 'gte', order: 2, on: 1,
    chips: [5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9] },
  /* No chips: a step count is not a number you pick off a list, it is one you
     build up. The three bumps are the whole interaction. */
  { id: 'steps',  label: 'Steps',  unit: '',    measure: 'number', once: 1, agg: 'last', step: 500, dec: 0, target: 10000, dir: 'gte', order: 3, on: 1,
    bump: [1000, 500, 100] },
  { id: 'mood',   label: 'Mood',   unit: '',    measure: 'scale',  once: 0, agg: 'avg',  order: 4, on: 1 },
  { id: 'energy', label: 'Energy', unit: '',    measure: 'scale',  once: 0, agg: 'avg',  order: 5, on: 1 },
  /* Training is one of the five pillars and the only one that moves a whole
     letter, and it was read out of TRAIN's rows alone. Anybody not using
     TRAIN had no way to record it, so their rank sat capped at A for good.
     trainedOn() already looks for a field whose id starts with "train"; this
     is that field, and it ships on. */
  { id: 'trained', label: 'Trained', unit: '', measure: 'check', once: 1, agg: 'last', order: 6, on: 1 },

  /* ── daylight ──
     Two different things get called sun and they are not the same dose at the
     same time of day, which is why this is minutes rather than a tick.

     MORNING LIGHT is the one that matters for mood and sleep. It works on
     brightness and duration, not on UV: the trials that move depression use
     10,000 lux for 30 minutes, 5,000 for an hour or 2,500 for two, and outdoor
     light clears 10,000 easily even under cloud. Thirty minutes in the first
     couple of hours awake is the target here.

     VITAMIN D is a different mechanism and in Manila it is close to a solved
     problem: at a UV index above 10, five to fifteen minutes of midday sun on
     arms and face is a maintenance dose for lighter skin, longer for darker.
     Anyone getting their morning half hour outdoors has it covered.

     So one field, in minutes, and the useful discipline is WHEN rather than
     how long. */
  { id: 'sun', label: 'Sun', unit: 'min', measure: 'amount', once: 0, agg: 'sum',
    step: 5, target: 30, dir: 'gte', order: 7, on: 1,
    chips: [5, 10, 15, 20, 30, 45, 60] },

  /* ── main quest ──
     Tom, 2026-09-05: "work that leads to an improvement of life circumstances
     or progress in a true passion project."

     A tick, like Trained, and for the same reason: the question is whether it
     happened, and asking for minutes invites the arithmetic that turns a good
     day into a bad one. Tracked, not scored - the five pillars are what build
     a physique and this is not one of them. Whether it should count toward a
     day's letter is a real question and a separate decision. */
  { id: 'quest', label: 'Main quest', unit: '', measure: 'check', once: 1, agg: 'last',
    order: 8, on: 1 },
];

/* Things worth tracking that most people want eventually. An empty setup
   screen is a dead end; a list is an invitation.                          */
/* `from` is the nutrient on a food label this field is the same substance as,
   and `per` converts the label's unit into the field's. A coffee logged in
   FOOD is caffeine you drank; it has to show up under Caffeine or the tile is
   lying by omission. See NUT_FROM. */
const LIBRARY = [
  { id: 'creatine',  label: 'Creatine',   unit: 'g',   measure: 'amount', step: 5,   dec: 0, chips: [5, 10, 20] },
  { id: 'potassium', label: 'Potassium',  unit: 'g',   measure: 'amount', step: .5,  dec: 1, chips: [1, 2, 3, 4], from: 'k',    per: .001 },
  { id: 'sodium',    label: 'Sodium',     unit: 'g',   measure: 'amount', step: .5,  dec: 1, chips: [1, 2, 3, 4, 5], from: 'na', per: .001 },
  { id: 'caffeine',  label: 'Caffeine',   unit: 'mg',  measure: 'amount', step: 50,  dec: 0, chips: [100, 150, 200, 300], from: 'caff', per: 1 },
  { id: 'calcium',   label: 'Calcium',    unit: 'mg',  measure: 'amount', step: 100, dec: 0, chips: [500, 800, 1000, 1200], from: 'ca', per: 1 },
  { id: 'magnesium', label: 'Magnesium',  unit: 'mg',  measure: 'amount', step: 100, dec: 0, chips: [200, 400, 600] },
  { id: 'zinc',      label: 'Zinc',       unit: 'mg',  measure: 'amount', step: 5,   dec: 0, chips: [15, 30, 50] },
  { id: 'water',     label: 'Water',      unit: 'L',   measure: 'amount', step: .5,  dec: 1, chips: [.5, 1, 1.5, 2] },
  { id: 'rhr',       label: 'Resting HR', unit: 'bpm', measure: 'number', step: 1,   dec: 0 },
];

/* the defaults each kind of measure carries, so nothing has to be repeated */
/* the same four words the field form offers, so the sheet and the app agree */
const MEASURE_LABELS = {
  number: 'One a day', amount: 'A dose', scale: 'A scale', check: 'Done or not',
};
const MEASURE = {
  number: { once: 1, agg: 'last' },
  amount: { once: 0, agg: 'sum'  },
  scale:  { once: 0, agg: 'avg'  },
  check:  { once: 1, agg: 'last' },
};
function makeField(spec) {
  const m = MEASURE[spec.measure] || MEASURE.number;
  const order = Object.values(fields()).reduce((a, f) => Math.max(a, f.order || 0), 0) + 1;
  return Object.assign({ on: 1, order: order, step: 1, dec: 0 }, m, spec);
}
function addField(spec) {
  const f = makeField(spec);
  Rec.set('field', null, f.id, f);
  return f;
}

/* ── linking the fields that were made before links existed ──
   A Caffeine tile built last week has no idea that `caff` on a food label is
   the same substance, so it would go on ignoring your coffee forever.

   Matched on the name, not only on the id. A field added from the library has
   the id `caffeine`; one you made yourself by typing "Caffeine" into
   Something else has a timestamp for an id and would never have matched. Both
   are the same thing to the person who made them, so both link.

   The guard carries a number rather than a flag, so adding a link to the
   library later runs the pass again instead of being locked out by a tick
   left behind by the previous version. Never overwrites a link you set. */
const NUTLINK = 2;
function linkNutrients() {
  if (num(S.get('nutlinked', 0), 0) >= NUTLINK) return;
  const byName = {};
  LIBRARY.forEach(l => { if (l.from) byName[String(l.label).toLowerCase()] = l; });
  Object.values(fields()).forEach(f => {
    if (f.from) return;
    const lib = byName[String(f.label || '').toLowerCase()];
    if (!lib) return;
    Rec.set('field', null, f.id, Object.assign({}, f, { from: lib.from, per: nutPer(lib.from, f.unit) }));
  });
  S.set('nutlinked', NUTLINK);
}

/* ── bringing existing fields into line ──
   SEED only ever runs once, so a Steps field made last week still carries the
   six chips it shipped with and no bumps. Same pass and same guard shape as
   linkNutrients: a number rather than a flag, so a later change runs again
   instead of being locked out by a tick from the previous version. Only the
   library's own fields are touched, and only where nothing was set by hand. */
const FIELDFIX = 4;   /* 4 adds Sun and Main quest to an install that already exists */
/* Which kind of thing each library field is, so the form can narrow itself
   without him having to categorise five things by hand first. */
const SEEDCAT = {
  weight: 'body', rhr: 'body', sleep: 'body',
  steps: 'activity',
  mood: 'feeling', energy: 'feeling',
  creatine: 'intake', potassium: 'intake', sodium: 'intake', caffeine: 'intake',
  magnesium: 'intake', zinc: 'intake', water: 'intake',
};
function fixSeedFields() {
  if (num(S.get('fieldfix', 0), 0) >= FIELDFIX) return;
  /* A SEED field added after someone was already set up never reaches them,
     because seedFields() runs once. Anything in SEED that is simply not there
     gets made here, which is how Trained arrives for an existing install. */
  const have = fields();
  SEED.forEach(f => { if (!have[f.id]) Rec.set('field', null, f.id, f); });
  const want = {};
  SEED.concat(LIBRARY).forEach(l => { if (l.bump) want[l.id] = l; });
  Object.values(fields()).forEach(f => {
    const lib = want[f.id];
    const kind = SEEDCAT[f.id];
    if (!lib && !kind) return;
    const next = Object.assign({}, f);
    if (lib && !f.bump) {
      next.bump = lib.bump.slice();
      /* the list it shipped with goes when the field is meant to be built up
         rather than picked from */
      if (!lib.chips) delete next.chips;
    }
    /* Only where he has not chosen one himself. */
    if (kind && !f.cat) next.cat = kind;
    /* A body measurement does not wear off, so a half-life on one is a
       leftover that would decay a number that does not decay. */
    if (next.cat && catOf(next.cat).has.indexOf('half') < 0) delete next.half;
    Rec.set('field', null, f.id, next);
  });
  S.set('fieldfix', FIELDFIX);
}

function seedFields() {
  if (S.get('seeded')) return;
  SEED.forEach(f => Rec.set('field', null, f.id, f));
  ['Cash', 'GCash', 'Card', 'Bank'].forEach((n, i) => Rec.set('acct', null, n.toLowerCase(), { name: n, order: i }));
  S.set('seeded', 1);
}

const fields = () => Rec.map('field');
const field = id => fields()[id] || null;
/* ══════════════ WHEN, AND WHAT KIND OF THING ══════════════

   Both of these used to be free text boxes that did nothing much. `When` was
   stored, printed once in grey on the settings list, and read by nothing.
   `Category` grouped the settings list and stopped there.

   They are fixed lists now, and each one earns its place:

   WHEN orders your Today tiles. Nothing else about a field can say that a
   weigh-in belongs before breakfast and a sleep score belongs after it. Fixed
   rather than typed because "evening", "Evening" and "at night" are three
   different strings and one intention, and a sort on free text is a sort on
   spelling.

   CATEGORY decides which settings a field even has. A weight has no half-life:
   it does not wear off, and offering the box invites a number that would make
   the tile lie. A mood has no target in pounds. Rather than show every control
   for every field and trust you to ignore the wrong ones, the category says
   what applies and the form shows only that.                                */
const WHENS = [
  { id: 'morning', label: 'Morning' },
  { id: 'midday',  label: 'Midday' },
  { id: 'afternoon', label: 'Afternoon' },
  { id: 'evening', label: 'Evening' },
  { id: 'bed',     label: 'Before bed' },
];
const whenLabel = id => (WHENS.filter(w => w.id === id)[0] || {}).label || '';
/* where a field sits in the day. No answer sorts last, keeping the manual
   order you set with the arrows. */
const whenRank = f => {
  const i = WHENS.findIndex(w => w.id === f.slot);
  return i < 0 ? WHENS.length : i;
};

/* `has` lists the controls this kind of thing actually has. Anything not
   listed is not drawn and not stored. */
const CATS = [
  { id: 'body',     label: 'Body',     note: 'weight, resting heart rate',
    has: ['target', 'edges', 'days', 'when'] },
  { id: 'intake',   label: 'Intake',   note: 'anything you take or drink',
    has: ['target', 'half', 'from', 'days', 'when'] },
  { id: 'activity', label: 'Activity', note: 'steps, minutes moved',
    has: ['target', 'edges', 'days', 'when'] },
  { id: 'feeling',  label: 'Feeling',  note: 'mood, energy, soreness',
    has: ['scale', 'days', 'when'] },
  { id: 'other',    label: 'Other',    note: 'everything else',
    has: ['target', 'edges', 'half', 'from', 'days', 'when'] },
];
const catOf = id => CATS.filter(c => c.id === id)[0] || CATS[CATS.length - 1];
const catLabel = id => (CATS.filter(c => c.id === id)[0] || {}).label || '';
/* An older field with no category set keeps every control, so nothing a field
   already carries can be hidden by a category it never chose. */
const catHas = (f, what) => !f.cat ? true : catOf(f.cat).has.indexOf(what) > -1;

/* ── the tracker list, grouped ──
   Sorting by order alone and emitting a heading whenever it changes gives you
   "Body" twice the moment an uncategorised field sits between two Body ones.
   So the groups are collected first and only then flattened: the unnamed group
   leads, because a field with no category is not in a group and should not be
   filed under whichever name happens to sort first, and every named category
   follows in the order its first field appears.

   The flattened result is also the order the arrows renumber, so what the
   tracker screen shows and what Today shows stay the same list. */
function groupedFields() {
  const list = Object.values(fields()).sort((a, b) => (a.order || 0) - (b.order || 0));
  const byCat = Object.create(null), order = [];
  list.forEach(f => {
    const c = f.cat || '';
    if (!byCat[c]) { byCat[c] = []; order.push(c); }
    byCat[c].push(f);
  });
  const out = (byCat[''] || []).slice();
  order.forEach(c => { if (c) byCat[c].forEach(f => out.push(f)); });
  return out;
}

/* A field's colour as a token, never a hex. An explicit slot wins; otherwise
   it is dealt round the ramp by position, so a screen of fields that nobody
   has coloured still reads as six distinct things rather than six greys. */
const fieldColor = f => 'var(--data-' + ((num(f.color, 0) || (((f.order || 0) % 6) + 1))) + ')';
/* Tile order on Today: where a field sits in the day first, then the order you
   set with the arrows. A field with no When sorts last, so setting it on one
   thing does not reshuffle everything else. */
const liveFields = () => Object.values(fields()).filter(f => f.on)
  .sort((a, b) => (whenRank(a) - whenRank(b)) || ((a.order || 0) - (b.order || 0)));

/* ── values ── */
function evList(date, fid) { const r = Rec.get('ev', date, fid); return r && r.e ? r.e : []; }

function evAdd(date, fid, v) {
  const f = field(fid) || {};
  const e = f.once ? [] : evList(date, fid).slice();
  e.push({ t: Date.now(), v: v });
  Rec.set('ev', date, fid, { e: e });
}
function evDrop(date, fid, t) {
  const e = evList(date, fid).filter(x => x.t !== t);
  if (e.length) Rec.set('ev', date, fid, { e: e }); else Rec.del('ev', date, fid);
}
/* ── what a nutrient field can be fed by ──
   Every number a food label carries, in the unit the label uses. A field says
   which one it is made of and what to multiply by, and from then on eating
   counts toward it exactly as taking a dose does.

   No copying. The meal row stays the only record of the coffee; the caffeine
   figure is read out of it every time. A copy would double up the moment you
   edited the meal, and nothing would say which of the two was the real one. */
const NUT_FROM = [
  ['kcal', 'Calories', 'kcal'], ['p', 'Protein', 'g'], ['c', 'Carbs', 'g'], ['f', 'Fat', 'g'],
  ['na', 'Sodium', 'mg'], ['k', 'Potassium', 'mg'], ['ca', 'Calcium', 'mg'], ['caff', 'Caffeine', 'mg'],
];

function fromFood(date, f) {
  if (!f || !f.from) return [];
  const per = f.per == null ? 1 : f.per;
  const out = [];
  meals(date).forEach(m => {
    const v = (num(m[f.from], 0) || 0) * per;
    if (v > 0) out.push({ t: m.t, v: v, food: m.name });
  });
  return out;
}

/* Every reading for a field on a day, in the order they happened. */
function entries(date, fid) {
  const f = field(fid) || {};
  if (!f.from) return evList(date, fid);
  return evList(date, fid).concat(fromFood(date, f)).sort((a, b) => a.t - b.t);
}

function value(date, fid) {
  const e = entries(date, fid); if (!e.length) return null;
  const f = field(fid) || {};
  if (f.agg === 'sum') return e.reduce((a, x) => a + x.v, 0);
  if (f.agg === 'avg') return e.reduce((a, x) => a + x.v, 0) / e.length;
  return e[e.length - 1].v;
}
const logged = (date, fid) => entries(date, fid).length > 0;

/* ══════════════ FOOD ══════════════
   A `food` row is the label as printed, plus your own serving sizes on top
   of it. The label never changes; your servings are what you actually eat.
   A `meal` row is one logged serving with its numbers frozen in, so editing
   a food tomorrow never rewrites what you ate today.                       */

const NUTS = ['p', 'c', 'f', 'kcal', 'na', 'k', 'ca', 'caff'];

/* ══ how sure you are of a meal ══
   A weighed chicken breast and a plate of adobo somebody else cooked are not
   the same kind of number, and treating them as one is why measured intake
   drifts from real intake. `err` on a meal is a fraction: .2 means the
   calories could be a fifth out either way.

   Added up rather than squared: a guess about portion size leans the same
   way each time — people under-guess restaurant food, consistently — so the
   errors do not cancel the way independent ones would.

   It matters most to TDEE, which is measured intake minus what the scale
   did. A systematic 15% under-guess moves the estimate by 15% of intake and
   never corrects itself, so the band has to say so. */
const ERRS = [[0, 'Sure'], [.1, '±10%'], [.2, '±20%'], [.3, '±30%']];
function errChips(cur, onPick) {
  const w = el('div', 'chips');
  const paint = () => {
    w.innerHTML = '';
    ERRS.forEach(e => {
      const b = el('button', 'chip' + (Math.abs(cur - e[0]) < .001 ? ' on' : ''), e[1]);
      b.onclick = () => { cur = e[0]; onPick(cur); paint(); Mobile.haptic('select'); };
      w.appendChild(b);
    });
  };
  paint();
  return w;
}
const errTag = e => (num(e, 0) || 0) > 0 ? '±' + Math.round(e * 100) + '%' : '';
const foods = () => Rec.map('food');

function foodServes(fd) {
  const out = [{ label: '1 serving (' + r1(num(fd.base.amt, 1)) + ' ' + (fd.base.unit || '') + ')', mult: 1 }];
  const u = String(fd.base.unit || '').toLowerCase();
  if ((u === 'g' || u === 'ml') && fd.base.amt > 0) out.push({ label: '100 ' + u, mult: 100 / fd.base.amt });
  (fd.serves || []).forEach(s => out.push(s));
  return out;
}
function scale(fd, mult) {
  const o = { mult: mult };
  NUTS.forEach(n => { o[n] = (num(fd.base[n], 0) || 0) * mult; });
  o.price = (num(fd.base.price, 0) || 0) * mult;
  o.amt = (num(fd.base.amt, 0) || 0) * mult;
  return o;
}
function logMeal(fd, mult, serveLabel, extra) {
  const s = scale(fd, mult);
  const row = { fid: fd.id, name: fd.name, serve: serveLabel, unit: fd.base.unit, t: Date.now() };
  NUTS.forEach(n => { row[n] = s[n]; });
  row.price = s.price; row.amt = s.amt; row.mult = mult;
  Object.assign(row, extra || {});
  const key = uid();
  Rec.set('meal', vd(), key, row);
  mealSpend(vd(), key, row);
  Rec.set('food', null, fd.id, Object.assign({}, fd, { uses: (fd.uses || 0) + 1, last: Day.today() }));
}

/* ══ eating out is money leaving an account ══
   The price on a meal is normally the VALUE of what you ate, not a payment:
   the rice was bought on some other day and counting it as today's spending
   would double it. That is why food has never touched the money screen.

   A restaurant breaks that. You ate it and you paid for it, in one act, from
   one account. So the account is the switch: name one and the meal becomes a
   real spend as well; leave it blank and nothing changes.

   The spend is a row of its own, keyed off the meal, so the money screen
   needs no special case and the two can never disagree — change the amount,
   change the account, delete the meal, and the spend follows. */
function mealSpend(date, key, row) {
  const id = 'meal-' + key;
  const paid = row && row.acct && (num(row.price, 0) || 0) > 0;
  if (!paid) { if (Rec.get('spend', date, id)) Rec.del('spend', date, id); return; }
  Rec.set('spend', date, id, {
    amt: num(row.price, 0) || 0, acct: row.acct, note: row.name,
    t: row.t || Date.now(), viaMeal: key,
  });
}
const meals = date => Rec.all('meal', { date: date }).map(r => Object.assign({ key: r.key }, r.payload)).sort((a, b) => a.t - b.t);

function dayTotals(date) {
  const t = { p: 0, c: 0, f: 0, kcal: 0, na: 0, k: 0, ca: 0, caff: 0, price: 0 };
  meals(date).forEach(m => { Object.keys(t).forEach(n => { t[n] += num(m[n], 0) || 0; }); });
  /* how many of today's calories are guessed rather than read off a label */
  t.kerr = meals(date).reduce((a, m) => a + (num(m.kcal, 0) || 0) * (num(m.err, 0) || 0), 0);
  return t;
}
const TARGETS = () => S.get('targets', { p: 175, c: 200, f: 80, kcal: 2220, na: 3500, k: 4500 });

/* One number, one place it comes from. Either you set it, or it is derived
   from the measured TDEE and a goal rate you chose. Never invented.      */
function calTarget() {
  const mode = S.get('calMode', 'fixed');
  if (mode === 'tdee') {
    const t = TD.targetIntake();
    if (t != null) return { v: t, src: 'tdee' };
  }
  if (mode === 'macros') {
    /* 4 kcal per gram of protein and carbohydrate, 9 per gram of fat — the
       Atwater factors, the rounded figures every food label uses. Only the
       macros you actually target count toward it. */
    const t = TARGETS(), on = S.get('macroOn', { p: 1, c: 1, f: 1 });
    let k = 0;
    [['p', 4], ['c', 4], ['f', 9]].forEach(x => { if (on[x[0]]) k += (num(t[x[0]], 0) || 0) * x[1]; });
    if (k > 0) return { v: Math.round(k), src: 'macros' };
  }
  return { v: num(TARGETS().kcal, 2220), src: 'fixed' };
}

/* ══════════════ JOURNAL ══════════════
   One `note` row per line, dated, so a day's writing merges the same way
   everything else does and two devices cannot clobber each other.

   Four kinds. They are not decoration — the kind decides where the line ends
   up once the rest of the suite exists:

     Todo   → QUEST      the todo module
     Entry  → LOG        the journal module
     Event  → LOG
     Idea   → LOG and SPARK, the brain bank

   None of those apps are built. The routing is written down here anyway,
   because the alternative is that the destinations live in somebody's memory
   and the notes get typed for two months before anyone asks what should
   happen to them. `NOTE_KINDS[].to` is the record; when QUEST exists it reads
   this rather than being told again.

   An Entry is prose — what used to be its own paragraph mode is simply a
   longer kind of line, which removes a whole switch from the screen.       */

const NOTE_KINDS = [
  { id: 'todo',  label: 'Todo',  rank: 0, to: 'QUEST' },
  { id: 'entry', label: 'Entry', rank: 1, to: 'LOG' },
  { id: 'event', label: 'Event', rank: 2, to: 'LOG' },
  { id: 'idea',  label: 'Idea',  rank: 3, to: 'LOG,SPARK' },
];

/* The marks, in bullet-journal notation rather than pictures. A dash, a dot
   and a bang are faster to read than any icon, they cannot render differently
   on another platform, and they are what the notation already means:

     todo   an open box, the only one you tick
     entry  ·  a dot — something written down
     event  –  a dash — something that happened
     idea   !  a bang — something worth keeping

   Drawn as one glyph each so they take the theme's colour and scale with the
   text around them. */
const NOTE_MARK = { todo: '', entry: '·', event: '–', idea: '!' };
/* A task that has followed you here is drawn `>`, not as a box.

   That is what the notation already means — migrated — and it is the whole
   point of the mark: an open box is something you decided to do today, and a
   `>` is something you have now decided to do four times. Same row, same tick,
   different glyph, so the list tells you which is which at a glance instead of
   making you read the little age badge on the right. */
const noteSvg = (id, migrated) =>
  id !== 'todo'
    ? '<span class="nm-ch" aria-hidden="true">' + (NOTE_MARK[id] || '·') + '</span>'
    : migrated
      ? '<span class="nm-ch nm-mig" aria-hidden="true">&gt;</span>'
      : '<span class="nm-box" aria-hidden="true"></span>';

const noteKind = id => NOTE_KINDS.filter(k => k.id === id)[0] || NOTE_KINDS[1];
/* ── what a Kind column says in the spreadsheet ──
   Built from NOTE_KINDS rather than typed out again, so adding a bullet type
   cannot leave the export writing a slug nobody recognises.

   `para` is not a kind you can pick any more — an Entry absorbed it — but rows
   written before that still carry it, and a spreadsheet that showed them blank
   would be lying about what is in the file. */
const kindLabels = () => {
  const m = {};
  /* The real kinds first. `para` shares Entry's label, and a lookup coming back
     from the sheet takes the first key that matches — listing the legacy one
     first filed every hand-typed "Entry" as a `para`.

     One consequence, deliberate: a `para` row exported as "Entry" and read back
     in becomes a real `entry`. That is a normalisation rather than a loss —
     `para` has not been a kind you can choose since Entry absorbed it, and the
     app already draws and counts it as an Entry everywhere. The sheet round
     trip is simply where the last of them get tidied up. */
  NOTE_KINDS.forEach(k => m[k.id] = k.label);
  m.para = 'Entry';
  return m;
};

/* Everything written on this day, plus any task still open from before it.

   An unfinished task is not finished because the date changed, so it comes
   with you. It stays one row on its original date — carrying it forward is a
   view, not a copy — which means the history stays honest and ticking a
   carried task closes the original rather than leaving a twin behind.

   Only tasks migrate. An entry, an event and an idea are records of a
   particular day and belong to that day. */
function notes(date) {
  const d = date || vd();
  const out = [];
  Rec.all('note').forEach(r => {
    const p = r.payload;
    if (!p) return;
    /* written on this day */
    if (r.date === d) { out.push(Object.assign({ key: r.key, date: d }, p)); return; }
    if (!r.date) return;
    /* still open, written before this day: it follows you forward */
    if (p.kind === 'todo' && !p.done && !p.cancelled && r.date < d) {
      out.push(Object.assign({ key: r.key, date: r.date, carried: Day.diff(d, r.date) }, p));
      return;
    }
    /* DONE ON this day, written on another. Tom, 2026-09-04: "I want done
       tasks to show up on the day I did them, so I know that I did them on
       that day." The row does not move - it stays on the day it was written,
       which is what keeps the history honest - but the day you finished it
       shows it too, marked with where it came from. */
    if (p.kind === 'todo' && p.done && p.doneOn === d) {
      out.push(Object.assign({ key: r.key, date: r.date, from: r.date }, p));
    }
  });
  return out.sort(noteOrder);
}

/* Sorting. To-dos hold the top whatever else is chosen, because an open task
   is the one kind of line you need to see without looking for it. Everything
   below that follows the chosen order. */
/* Strip the view-only fields before storing.

   `key`, `date` and `carried` describe where a line is being *shown*, not what
   it is, and they must not end up in the payload. Setting them to undefined in
   an Object.assign does not remove them — the property is still there, and
   JSON only drops it on the way to storage. In memory the row keeps
   `key: undefined`, so the very next read overwrites the real key with
   nothing, and the row after that gets written to a fresh id called
   "undefined". Delete them properly. */
function bare(x) {
  const o = Object.assign({}, x);
  delete o.key; delete o.date; delete o.carried; delete o.from;
  return o;
}

/* The clock a line sorts by, which is not the same question as the clock it
   shows. A finished task happened when you ticked it, not when you wrote it
   down - Tom, 2026-09-04: "done tasks sort with the journal bullet types,
   according to the time I checked them." A line with no clock at all falls
   back to when it was written, so the list is one real sequence rather than a
   timed half and an untimed clump. */
function noteClock(x) {
  const s = (x.kind === 'todo' && x.done && x.doneAt) ? x.doneAt : x.at;
  if (s) return +String(s).replace(':', '');
  if (x.t) { const w = hhmm(x.t); return w ? +w.replace(':', '') : 9999; }
  return 9999;
}

function noteOrder(a, b) {
  /* An open task holds the top whatever else is chosen: it is the one kind of
     line you need to see without looking for it. A DONE one does not - it has
     stopped being a task and gone back to being a thing that happened, which
     is exactly what everything else on this list is. */
  const top = x => (x.kind === 'todo' && !x.done && !x.cancelled) ? 0 : 1;
  if (top(a) !== top(b)) return top(a) - top(b);
  const mode = S.get('noteSort', 'manual');
  if (mode === 'manual') return (a.ord || 0) - (b.ord || 0);
  if (mode === 'time') {
    if (noteClock(a) !== noteClock(b)) return noteClock(a) - noteClock(b);
    return (a.t || 0) - (b.t || 0);
  }
  return mode === 'oldest' ? (a.t || 0) - (b.t || 0) : (b.t || 0) - (a.t || 0);
}

/* ═══════════════ WRITING A TIME INTO A LINE ═══════════════
   "Train 2:45" should be a line that says Train and knows it is at 2:45. Not a
   form with a time picker on it — the whole point of a journal line is that it
   is one field you type into.

   ONLY AT THE END OF THE LINE. That single rule is what makes this safe to
   have on by default: "Train 2:45" gets a time, and "Call Dan about the 2:45
   train" does not, because the number is in the middle of a sentence where it
   is doing a different job. A parser that grabs any time anywhere would eat
   part of what you wrote, which is worse than not parsing at all.

   Times are 2:45, 2:45pm, 14:45, 9am. Durations need a unit — 45m, 1h, 1h30,
   90min — so a bare number is never mistaken for one. Both may appear:
   "Train 2:45 90m".

   A bare 2:45 with no am/pm is read the way a person means it: hours 1 to 6
   are afternoon, because nobody journals a 2:45am lift. 7 to 12 are taken as
   written.                                                                  */
const TIME_RE = /\s+(?:at\s+)?(\d{1,2})(?::|\.)(\d{2})\s*(am|pm)?$/i;
const HOUR_RE = /\s+(?:at\s+)?(\d{1,2})\s*(am|pm)$/i;
const DUR_RE  = /\s+(?:for\s+)?(?:(\d+)\s*h(?:rs?|ours?)?\s*(\d{1,2})?|(\d+)\s*(m|min|mins|minutes?))$/i;

function parseLine(raw) {
  let text = String(raw == null ? '' : raw).trim();
  let at = null, dur = null;

  /* duration first: "1h30" would otherwise look like nothing, and stripping it
     leaves a clean end for the time to match against */
  const d = text.match(DUR_RE);
  if (d) {
    dur = d[1] != null ? (+d[1] * 60 + (+d[2] || 0)) : +d[3];
    if (!(dur > 0)) dur = null; else text = text.slice(0, d.index).trim();
  }

  let m = text.match(TIME_RE);
  if (m) {
    let h = +m[1], mm = +m[2];
    if (mm <= 59 && h <= 23) {
      const ap = (m[3] || '').toLowerCase();
      if (ap === 'pm' && h < 12) h += 12;
      else if (ap === 'am' && h === 12) h = 0;
      else if (!ap && h >= 1 && h <= 6) h += 12;   /* 2:45 means the afternoon */
      at = String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
      text = text.slice(0, m.index).trim();
    }
  } else {
    m = text.match(HOUR_RE);
    if (m) {
      let h = +m[1];
      if (h >= 1 && h <= 12) {
        if (m[2].toLowerCase() === 'pm' && h < 12) h += 12;
        if (m[2].toLowerCase() === 'am' && h === 12) h = 0;
        at = String(h).padStart(2, '0') + ':00';
        text = text.slice(0, m.index).trim();
      }
    }
  }
  /* Nothing left but a time is not a line, it is a time. Give the text back. */
  if (!text) return { text: String(raw).trim(), at: null, dur: null };
  return { text: text, at: at, dur: dur };
}

/** "14:45" as "2:45pm", the way it is read back on screen. */
/** a timestamp as the HH:MM the clock label wants */
/* Typing a time lives in shared/ui.js now, because BLOCK wanted the same
   thing and two copies of a parser is two parsers to fix. UI.timeField gives
   the phone its wheel and a PC a box you type into with an AM/PM button. */
const smartTime = (raw, nowMin) => UI.smartTime(raw, nowMin);
const timeInput = (val, onset) => UI.timeField(val, onset);

function hhmm(ms) {
  const d = new Date(ms);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function clockLabel(at) {
  if (!at) return '';
  const [h, m] = at.split(':').map(Number);
  const ap = h < 12 ? 'am' : 'pm', hh = h % 12 === 0 ? 12 : h % 12;
  return hh + ':' + String(m).padStart(2, '0') + ap;
}
const durLabel = d => !d ? '' : (d >= 60 ? (d % 60 ? Math.floor(d / 60) + 'h' + String(d % 60).padStart(2, '0') : Math.floor(d / 60) + 'h') : d + 'm');

const addNote = (date, kind, text) => {
  const list = Rec.all('note', { date: date });
  const parsed = parseLine(text);
  Rec.set('note', date, uid(), {
    /* `t` is when it was written, which is not the same as the day it belongs
       to — a task logged at midnight for tomorrow, or a line backfilled a week
       later, both need the two kept apart. `at` is different again: it is the
       time the thing happens, which is the one you typed. */
    kind: kind, text: parsed.text, t: Date.now(), made: date,
    at: parsed.at, dur: parsed.dur,
    ord: list.length, done: 0, cancelled: 0,
  });
  /* published here rather than at the call site, so a line reaches the hub
     however it was written */
  publishNotes(date);
};

/* A tick is the one row every app may write, which makes it the only way to
   tell the rest of the suite something happened without the other end knowing
   this app exists. So each kind ticks its own counter, and the home screen
   shows whichever it cares about — a journal widget today, QUEST and SPARK
   when they arrive. */
/* ── a line with a time on it is an event the whole suite can see ──
   A tick is the one row every app may write, so it is the only way to tell the
   home screen that something happened without the home screen knowing STATUS
   exists. A journal line carrying a time becomes one, with the time in the
   payload so DAY LOG can show 2:45pm rather than the moment you typed it.

   THIS CAN DOUBLE UP, and that is accepted rather than overlooked. If BLOCK
   already has a Training block today and you also write "Train 2:45" here,
   the home screen shows both. Tom's call: the alternative is guessing that two
   similarly named things are the same thing, and a wrong guess silently hides
   something you wrote. Two lines is a smaller problem than a missing one.

   Keyed on the text, so editing the line updates its entry instead of leaving
   the old one behind, and writing the same thing twice is one row.          */
function publishTimed(d) {
  const want = {};
  notes(d).filter(x => x.date === d && x.at && !x.done && !x.cancelled).forEach(x => {
    const id = 'note-at-' + String(x.text).toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40);
    if (!id || id === 'note-at-') return;
    want[id] = 1;
    Rec.set('activity', null, id, { name: x.text, cat: 'journal' });
    Rec.set('tick', d, id, { src: APP.id, qty: 1, at: x.at, dur: x.dur || 0 });
  });
  /* anything that used to be a timed line here and is not any more */
  Rec.all('tick', { date: d }).forEach(r => {
    if (r.key.indexOf('note-at-') === 0 && !want[r.key]) Rec.del('tick', d, r.key);
  });
}

function publishNotes(date) {
  const d = date || Day.today();
  publishTimed(d);
  NOTE_KINDS.forEach(k => {
    const n = Rec.all('note', { date: d })
      .filter(r => r.payload && r.payload.kind === k.id && !(k.id === 'todo' && r.payload.done)).length;
    const id = 'note-' + k.id;
    Rec.set('activity', null, id, { name: k.label + 's', cat: 'journal' });
    if (n) Rec.set('tick', d, id, { src: APP.id, qty: n, to: k.to });
    else Rec.del('tick', d, id);
  });
}

/* ══════════════ MONEY ══════════════ */
const accts = () => Object.values(Rec.map('acct')).sort((a, b) => (a.order || 0) - (b.order || 0));
const spends = date => Rec.all('spend', { date: date }).map(r => Object.assign({ key: r.key }, r.payload)).sort((a, b) => a.t - b.t);
const spendTotal = date => spends(date).reduce((a, s) => a + (num(s.amt, 0) || 0), 0);
/* Spending is what you paid, on the day you paid it. The price on a meal is
   the value of the food eaten, which is a different fact: the groceries were
   very likely bought on some other day. It is kept for cost-per-protein and
   never added to spending.                                                 */
const dayMoney = date => spendTotal(date);

/* ══════════════ TDEE ══════════════
   A personal metabolic model that keeps learning, not a static calculator.

   The hierarchy of evidence is fixed and deliberate:

     1. what you ate against what your weight actually did   ← strongest
     2. steps and training, as learned personal predictors
     3. sleep, as context that explains the other two
     4. population averages, only ever as a fallback

   Nothing below rule 1 may overrule it. Steps are allowed to move the
   estimate before the scale has confirmed the change, but the scale is what
   settles the argument, every time.

   Missing is missing. A day with no food logged is excluded from the intake
   average; it is never counted as a zero-calorie day. Same for weight,
   steps and sleep.

   Every parameter lives in P(). Nothing numeric is hard-coded in the maths
   below, so backtest() can sweep any of them.                              */

const dayKcal = d => {
  const m = meals(d);
  if (!m.length) return null;                 /* nothing logged ≠ ate nothing */
  const k = m.reduce((a, x) => a + (num(x.kcal, 0) || 0), 0);
  return k > 0 ? k : null;
};

/* the guessed part of a day's calories, in calories */
const dayKerr = d => {
  const m = meals(d);
  if (!m.length) return null;
  return m.reduce((a, x) => a + (num(x.kcal, 0) || 0) * (num(x.err, 0) || 0), 0);
};

const TD = {
  P(over) {
    const p = {
      halfLife:  S.get('halfLife', 21),      /* days until an observation counts half */
      ed:        S.get('ed', 3500),          /* kcal per lb of scale change — see TD.lbPer() */
      alpha:     S.get('alpha', .25),        /* how fast the estimate adapts */
      trendWin:  S.get('win', 28),           /* days the weight trend looks at */
      /* ── how far back anything is read at all ──
         This was 120 days, which quietly capped the weight chart: a weigh-in
         from five months ago was in the store and not on the screen.

         0 now means "everything since your first weigh-in". That is safe for
         the estimate as well as right for the chart, because `halfLife` has
         already made old readings weigh nothing — at the default 21 days, a
         reading from 120 days ago counts about 2% and one from a year ago
         counts about two millionths. The cutoff was saving arithmetic, not
         protecting the number. */
      lookback:  num(S.get('lookback', 0), 0) || 0,
      smooth:    S.get('smooth', 'roll7'),   /* roll7 | ewma */
      perLb:     S.get('perLb', 13),         /* population fallback: weight × this */
      guard:     S.get('guard', 250),        /* most one update may move it */
      minCal:    S.get('minCal', 7),         /* valid food days before measuring */
      minPts:    S.get('minPts', 14),        /* trend points before measuring */
      blockDays: S.get('blockDays', 14),     /* size of one learning block */
      stepPrior: S.get('stepPrior', .0002),  /* kcal per step per lb — population only */
      adjCap:    S.get('adjCap', 400),       /* most steps and training may shift it */
    };
    if (over) Object.keys(over).forEach(k => { p[k] = over[k]; });
    return p;
  },
  /* the accessors the settings panel and the export still speak to */
  ed: () => TD.P().ed, alpha: () => TD.P().alpha, win: () => TD.P().trendWin,
  perLb: () => TD.P().perLb, guard: () => TD.P().guard,

  /* ── pounds per logged unit ──
     BOTH energy constants above are PER POUND: perLb is upkeep per pound of
     body, ed is calories per pound of scale change. The weight field's unit
     has only ever been a LABEL - nothing converted it. So a client logging in
     kilos got her kilos multiplied by a per-pound number: 65 x 13 = 845, and
     an 845 kcal TDEE told her to eat almost nothing.

     Found by Tom on 2026-09-05 on a real client. The fix is here rather than
     on every weight, because scaling the two constants is the same arithmetic
     and it leaves every reading, chart and label showing the number she
     actually typed. */
  unit() { const f = fields()['weight']; return String((f && f.unit) || 'lb').toLowerCase().trim(); },
  lbPer() { return /^(kg|kilo|kilos|kilogram|kilogrammes?|kilograms)$/.test(TD.unit()) ? 2.20462 : 1; },
  /* the two constants, in the unit she actually logs in */
  perUnit: () => TD.P().perLb * TD.lbPer(),
  edUnit:  () => TD.P().ed * TD.lbPer(),

  /* ── one row per day, with recency weight. Missing stays null. ── */
  /** The first day there is anything to read, so "all of it" has a length.
      Capped at five years so a stray date far in the past cannot make the
      chart draw ten thousand columns. */
  span() {
    const rows = Rec.all('ev').filter(r => r.date && (r.key === 'weight'));
    const first = rows.length ? rows[0].date : null;
    if (!first) return 120;
    return Math.max(14, Math.min(1825, Day.diff(Day.today(), first) + 1));
  },

  frame(P, end, len) {
    const days = Day.last(len || P.lookback || TD.span(), end || Day.today());
    const last = days.length - 1;
    return days.map((d, i) => ({
      d: d, i: i, age: last - i,
      rw: Math.exp(-Math.LN2 * (last - i) / P.halfLife),
      w: value(d, 'weight'),
      kcal: dayKcal(d),
      kerr: dayKerr(d),
      steps: value(d, 'steps'),
      sleep: value(d, 'sleep'),
      train: value(d, 'train'),
    }));
  },

  /* ── a smoothed weight signal, never raw day-to-day change ──
     roll7 windows must be a FULL seven days: partial windows at the start of
     a range are averages of a different width, which bends the line and
     flattened the trend by 4% on a straight test series.                    */
  smooth(rows, P) {
    const out = [];
    if (P.smooth === 'ewma') {
      const a = 2 / 8; let s = null, n = 0;
      rows.forEach(r => {
        if (r.w != null) { s = s == null ? r.w : s + a * (r.w - s); n++; }
