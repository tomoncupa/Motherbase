<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);position:relative;z-index:2;
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}

/* ── the three tabs: plain buttons, the suite's idiom (CHECK IN, SPEAK) ── */
nav.kx-tabs{flex:0 0 auto;display:flex;gap:var(--s-1);padding:var(--s-2) var(--s-4);background:var(--surface-1);overflow-x:auto}
nav.kx-tabs button{flex:1;min-height:var(--tap);border:0;border-radius:var(--radius-md);background:none;color:var(--text-muted);
  font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);letter-spacing:var(--track-cap);
  cursor:pointer;white-space:nowrap;padding:0 var(--s-3)}
nav.kx-tabs button.on{background:var(--surface-2);color:var(--text-1)}

main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-9) + var(--safe-b))}
.wrap{max-width:calc(var(--s-10) * 6);margin:0 auto;display:flex;flex-direction:column;gap:var(--s-4)}
/* the week of PLAN on a wide window uses the whole room */
.wrap.kx-wide{max-width:none}

/* ── cards and plate rows. The material draws the box; we set corners and room ── */
.kx-card{border-radius:var(--radius-lg);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)}
.kx-card h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);text-transform:uppercase;
  display:flex;align-items:center;gap:var(--s-3)}
.kx-card h2 .r{margin-left:auto;font-family:var(--font-mono);letter-spacing:0;text-transform:none}
.kx-list{display:flex;flex-direction:column;gap:var(--s-2)}
.kx-row{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3);min-height:var(--tap);
  border-radius:var(--radius-md);cursor:pointer;text-align:left;width:100%;border:0}
.kx-row .tx{flex:1;min-width:0}
.kx-row .nm{display:block;font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-body);overflow-wrap:anywhere}
.kx-row .nm small{font-family:var(--font-body);font-weight:var(--w-body);font-size:var(--f-2);color:var(--text-muted);letter-spacing:0}
.kx-row .sub{display:block;font-size:var(--f-2);color:var(--text-2);line-height:var(--lh-body);margin-top:var(--s-1)}
.kx-row .num{font-family:var(--font-mono);font-size:var(--f-2);color:var(--text-2);white-space:nowrap;flex:0 0 auto;text-align:right}
.kx-flag{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--warn);margin-right:var(--s-2)}
.kx-gh{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);letter-spacing:var(--track-cap);
  text-transform:uppercase;color:var(--text-muted);margin-top:var(--s-2)}
.kx-empty{color:var(--text-muted);line-height:var(--lh-body)}
.kx-q{color:var(--text-muted);font-size:var(--f-2);line-height:var(--lh-body)}
.kx-note{color:var(--text-2);font-size:var(--f-2);line-height:var(--lh-body)}
.kx-btns{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.kx-btns .mb-btn{flex:1 1 auto}
.kx-ib{display:inline-flex;align-items:center;justify-content:center;min-width:var(--tap);min-height:var(--tap);
  border:0;background:none;border-radius:var(--radius-md);color:var(--text-2);cursor:pointer;flex:0 0 auto}
/* hover only for a real mouse: on a phone it sticks after a tap */
@media (hover:hover) and (pointer:fine){
  .kx-ib:hover{background:var(--surface-2);color:var(--text-1)}
}
.kx-ib svg{pointer-events:none}
.kx-lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:inherit;min-height:var(--tap)}
a.kx-src{color:var(--text-2)}

/* the one primary button sits where a thumb is */
.kx-foot{position:sticky;bottom:calc(var(--s-3) + var(--safe-b));display:flex;z-index:1}
.kx-foot .mb-btn{flex:1}

/* ── SHELF ── */
.kx-out{display:flex;align-items:center;gap:var(--s-2);background:none;border:0;cursor:pointer;min-height:var(--tap);
  color:var(--text-2);font-size:var(--f-2);text-align:left;padding:0}

/* ── food sheet ── */
.kx-big{font-family:var(--font-display);font-size:var(--f-8);font-weight:var(--w-bold);line-height:var(--lh-tight);font-variant-numeric:tabular-nums}
.kx-big small{display:block;font-size:var(--f-3);color:var(--text-2);font-weight:var(--w-body);margin-top:var(--s-1)}
.kx-acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--s-10) + var(--s-5)),1fr));gap:var(--s-2);margin:var(--s-4) 0}
.kx-ev{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap);border-bottom:var(--border-width) solid var(--border);font-size:var(--f-2);color:var(--text-2);
  -webkit-user-select:none;user-select:none}
.kx-ev .tx{flex:1;min-width:0;line-height:var(--lh-body)}
.kx-ev .tx b{color:var(--text-1);font-weight:var(--w-body)}
.kx-sec{display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-4)}

/* ── the amount box and its units ── */
.kx-amt{display:flex;flex-direction:column;gap:var(--s-2)}
.kx-amt .ln{display:flex;align-items:center;gap:var(--s-3)}
.kx-amt .ln .mb-input{flex:1;min-width:0}
.kx-amt .u{color:var(--text-2);white-space:nowrap}
.kx-lab{display:flex;flex-direction:column;gap:var(--s-1);font-size:var(--f-2);color:var(--text-2)}
.kx-form{display:flex;flex-direction:column;gap:var(--s-3)}
.kx-two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}

/* ── PLAN ── */
.kx-wk{display:flex;align-items:center;gap:var(--s-2)}
.kx-wk .t{flex:1;min-width:0;text-align:center;font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-body)}
.kx-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s-1)}
.kx-d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-1);
  min-height:calc(var(--tap) + var(--s-4));border:var(--border-width) solid transparent;border-radius:var(--radius-md);
  background:none;cursor:pointer;color:var(--text-2);padding:var(--s-1) 0}
.kx-d small{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--text-muted)}
.kx-d b{font-family:var(--font-mono);font-size:var(--f-4)}
.kx-d i{display:block;width:var(--s-2);height:var(--s-1);border-radius:var(--radius-full);background:var(--text-muted)}
.kx-d i.no{background:none}
.kx-d.on{background:var(--surface-2);color:var(--text-1)}
/* today carries an outline, so it reads without colour */
.kx-d.now{border-color:var(--accent)}
.kx-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s-2);align-items:start}
.kx-week .kx-card{padding:var(--s-3);gap:var(--s-2)}
.kx-week .kx-row{padding:var(--s-2);gap:var(--s-2)}
/* a week column is narrow: the words take the whole row, the tick goes under */
.kx-week .kx-item{flex-wrap:wrap}
.kx-week .kx-item .tx{flex:1 0 100%}
.kx-week .kx-tick{margin:0 calc(var(--s-2) * -1) calc(var(--s-2) * -1) auto}
.kx-dh{display:flex;align-items:center;gap:var(--s-2);-webkit-user-select:none;user-select:none}
.kx-dh .t{flex:1;min-width:0;font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-body)}
.kx-dh .t small{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--accent);margin-left:var(--s-2)}
.kx-slot{display:flex;flex-direction:column;gap:var(--s-1)}
/* the buttons drop under the name when a week column has no room for both */
.kx-sh{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:var(--s-2);min-height:var(--tap);
  -webkit-user-select:none;user-select:none}
.kx-sh span{flex:1 1 auto;min-width:0;font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kx-item.done .nm{color:var(--text-2)}
.kx-tick{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);
  margin:calc(var(--s-2) * -1) calc(var(--s-2) * -1) calc(var(--s-2) * -1) 0;border:0;background:none;cursor:pointer;color:var(--accent-fg)}
.kx-tick i{display:flex;align-items:center;justify-content:center;width:var(--s-5);height:var(--s-5);
  border-radius:var(--radius-full);border:calc(var(--border-width) * 2) solid var(--border-strong)}
.kx-tick.on i{background:var(--accent);border-color:var(--accent)}
.kx-dayfoot{font-size:var(--f-2);color:var(--text-2);line-height:var(--lh-body);font-variant-numeric:tabular-nums;
  border-top:var(--border-width) solid var(--border);padding-top:var(--s-2)}
.kx-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--s-9) + var(--s-6)),1fr));gap:var(--s-2)}

/* ── GUIDE: words above the bar, never on the fill (root brief) ── */
.kx-nrow{display:flex;flex-direction:column;gap:var(--s-1);width:100%;min-height:var(--tap);padding:var(--s-2) 0;
  background:none;border:0;cursor:pointer;text-align:left}
.kx-meter{display:flex;flex-direction:column;gap:var(--s-1);width:100%}
.kx-mline{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-2)}
.kx-mline span{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--text-muted)}
.kx-mline b{font-weight:var(--w-body);font-size:var(--f-2);color:var(--text-1);font-variant-numeric:tabular-nums;text-align:right}
.kx-bar{display:flex;height:var(--s-2);border-radius:var(--radius-sm);background:var(--surface-3);overflow:hidden}
.kx-bar i{display:block;height:100%;background:var(--c,var(--accent))}
/* planned is striped, eaten is solid: the two read apart without colour */
.kx-bar i.plan{background:repeating-linear-gradient(135deg,var(--c,var(--accent)) 0 var(--s-1),transparent var(--s-1) var(--s-2))}
.kx-nrow .kx-q{font-size:var(--f-1)}
.kx-short{display:flex;flex-direction:column;gap:var(--s-2)}
.kx-short h3{font-family:var(--font-display);font-size:var(--f-2);font-weight:var(--w-bold);letter-spacing:var(--track-body)}

@media (max-width:420px){
  .kx-two{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo">KITC<b>HEN</b></div>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" id="bSet" type="button">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" id="bHome" type="button" aria-label="Home" data-icon="app.home"></button>
</header>
<nav class="kx-tabs" aria-label="KITCHEN">
  <button type="button" class="mb-press" data-tab="shelf">SHELF</button>
  <button type="button" class="mb-press" data-tab="plan">PLAN</button>
  <button type="button" class="mb-press" data-tab="guide">GUIDE</button>
</nav>
<main class="mb-scroll"><div class="wrap" id="view"></div></main>

<script>
'use strict';
/* KITCHEN: plan what you eat from what you have. The shelf is the input, the
   plan is the job, the guide is the check on the plan. kitchen/CLAUDE.md is
   the brief. Everything on screen is worked out from rows on every draw;
   nothing here keeps its own copy of the store. */
const APP = {
  id: 'kitchen', name: 'KITCHEN', icon: '',
  blurb: 'Plan what you eat from what you have.',
  types: ['kcount', 'kfood', 'kplan', 'kdish', 'kskip'],
};

/* ══════════════ the reference intakes ══════════════
   Adult RDA / AI values, and sodium's chronic disease risk reduction intake,
   by sex and age band (19 = 19-30, 31 = 31-50, 51 = 51-70, 71 = over 70).
   Vocabulary, not prescription: facts that hold whoever you are, and any of
   them can be typed over in Settings. Copper is in mg to fit its key. */
const REF = {
  source: 'US National Academies of Sciences, Engineering, and Medicine, Dietary Reference Intakes summary tables (Dietary Reference Intakes for Sodium and Potassium, 2019, Appendix J), including the 2019 potassium AI and sodium CDRR',
  url: 'https://nap.nationalacademies.org/read/25353/chapter/28',
  rows: [
    { k: 'fib', unit: 'g', kind: 'ai', m19: 38, m31: 38, m51: 30, m71: 30, f19: 25, f31: 25, f51: 21, f71: 21 },
    { k: 'k', unit: 'mg', kind: 'ai', m19: 3400, m31: 3400, m51: 3400, m71: 3400, f19: 2600, f31: 2600, f51: 2600, f71: 2600 },
    { k: 'na', unit: 'mg', kind: 'limit', m19: 2300, m31: 2300, m51: 2300, m71: 2300, f19: 2300, f31: 2300, f51: 2300, f71: 2300 },
    { k: 'ca', unit: 'mg', kind: 'rda', m19: 1000, m31: 1000, m51: 1000, m71: 1200, f19: 1000, f31: 1000, f51: 1200, f71: 1200 },
    { k: 'fe', unit: 'mg', kind: 'rda', m19: 8, m31: 8, m51: 8, m71: 8, f19: 18, f31: 18, f51: 8, f71: 8 },
    { k: 'mg', unit: 'mg', kind: 'rda', m19: 400, m31: 420, m51: 420, m71: 420, f19: 310, f31: 320, f51: 320, f71: 320 },
    { k: 'ph', unit: 'mg', kind: 'rda', m19: 700, m31: 700, m51: 700, m71: 700, f19: 700, f31: 700, f51: 700, f71: 700 },
    { k: 'zn', unit: 'mg', kind: 'rda', m19: 11, m31: 11, m51: 11, m71: 11, f19: 8, f31: 8, f51: 8, f71: 8 },
    { k: 'cu', unit: 'mg', kind: 'rda', m19: 0.9, m31: 0.9, m51: 0.9, m71: 0.9, f19: 0.9, f31: 0.9, f51: 0.9, f71: 0.9 },
    { k: 'mn', unit: 'mg', kind: 'ai', m19: 2.3, m31: 2.3, m51: 2.3, m71: 2.3, f19: 1.8, f31: 1.8, f51: 1.8, f71: 1.8 },
    { k: 'se', unit: 'mcg', kind: 'rda', m19: 55, m31: 55, m51: 55, m71: 55, f19: 55, f31: 55, f51: 55, f71: 55 },
    { k: 'io', unit: 'mcg', kind: 'rda', m19: 150, m31: 150, m51: 150, m71: 150, f19: 150, f31: 150, f51: 150, f71: 150 },
    { k: 'rae', unit: 'mcg', kind: 'rda', m19: 900, m31: 900, m51: 900, m71: 900, f19: 700, f31: 700, f51: 700, f71: 700 },
    { k: 'vc', unit: 'mg', kind: 'rda', m19: 90, m31: 90, m51: 90, m71: 90, f19: 75, f31: 75, f51: 75, f71: 75 },
    { k: 'vd', unit: 'mcg', kind: 'rda', m19: 15, m31: 15, m51: 15, m71: 20, f19: 15, f31: 15, f51: 15, f71: 20 },
    { k: 've', unit: 'mg', kind: 'rda', m19: 15, m31: 15, m51: 15, m71: 15, f19: 15, f31: 15, f51: 15, f71: 15 },
    { k: 'vk', unit: 'mcg', kind: 'ai', m19: 120, m31: 120, m51: 120, m71: 120, f19: 90, f31: 90, f51: 90, f71: 90 },
    { k: 'b1', unit: 'mg', kind: 'rda', m19: 1.2, m31: 1.2, m51: 1.2, m71: 1.2, f19: 1.1, f31: 1.1, f51: 1.1, f71: 1.1 },
    { k: 'b2', unit: 'mg', kind: 'rda', m19: 1.3, m31: 1.3, m51: 1.3, m71: 1.3, f19: 1.1, f31: 1.1, f51: 1.1, f71: 1.1 },
    { k: 'b3', unit: 'mg', kind: 'rda', m19: 16, m31: 16, m51: 16, m71: 16, f19: 14, f31: 14, f51: 14, f71: 14 },
    { k: 'b5', unit: 'mg', kind: 'ai', m19: 5, m31: 5, m51: 5, m71: 5, f19: 5, f31: 5, f51: 5, f71: 5 },
    { k: 'b6', unit: 'mg', kind: 'rda', m19: 1.3, m31: 1.3, m51: 1.7, m71: 1.7, f19: 1.3, f31: 1.3, f51: 1.5, f71: 1.5 },
    { k: 'fol', unit: 'mcg', kind: 'rda', m19: 400, m31: 400, m51: 400, m71: 400, f19: 400, f31: 400, f51: 400, f71: 400 },
    { k: 'b12', unit: 'mcg', kind: 'rda', m19: 2.4, m31: 2.4, m51: 2.4, m71: 2.4, f19: 2.4, f31: 2.4, f51: 2.4, f71: 2.4 },
    { k: 'ch', unit: 'mg', kind: 'ai', m19: 550, m31: 550, m51: 550, m71: 550, f19: 425, f31: 425, f51: 425, f71: 425 },
  ],
};
REF.byK = {};
REF.rows.forEach(r => { REF.byK[r.k] = r; });

/* The order the guide lists them in: fibre, then minerals, then vitamins. */
const MINERALS = ['k', 'na', 'ca', 'fe', 'mg', 'ph', 'zn', 'cu', 'mn', 'se', 'io'];
const VITAMINS = ['rae', 'vc', 'vd', 've', 'vk', 'b1', 'b2', 'b3', 'b5', 'b6', 'fol', 'b12', 'ch'];
const ORDER = [['fib', 'fib']].concat(MINERALS.map(k => [k, 'min']), VITAMINS.map(k => [k, 'vit']));
/* Nutrients with no reference intake, shown in a detail sheet and never as
   a target: under Fat, Carbs and Vitamin A. */
const ALSO = { f: ['sat', 'epa', 'dha', 'chol'], c: ['sug'], rae: ['bc', 'va'] };
const CORE = [
  { k: 'kcal', label: 'Calories', unit: 'kcal' },
  { k: 'p', label: 'Protein', unit: 'g' },
  { k: 'c', label: 'Carbs', unit: 'g' },
  { k: 'f', label: 'Fat', unit: 'g' },
];
/* The eight nutrients STATUS freezes onto a meal, in its own order. */
const NUTS = ['p', 'c', 'f', 'kcal', 'na', 'k', 'ca', 'caff'];
/* Words for keys STATUS owns, and two that read better than the sheet's
   column names. Folate counts whatever figure the food carries. */
const LABEL = { k: 'Potassium', na: 'Sodium', ca: 'Calcium', rae: 'Vitamin A', fol: 'Folate (food figure)', fib: 'Fibre' };
const NLIST = (window.Nutrients && Nutrients.LIST) || [];
const labelOf = k => LABEL[k] || ((NLIST.find(n => n.k === k) || {}).label) || k;
const unitOfK = k => (REF.byK[k] && REF.byK[k].unit) || ((NLIST.find(n => n.k === k) || {}).unit) || '';

const SLOTS = [['b', 'Breakfast'], ['l', 'Lunch'], ['d', 'Dinner'], ['s', 'Snacks']];
const SLOT_NAME = { b: 'Breakfast', l: 'Lunch', d: 'Dinner', s: 'Snacks' };
const slotOf = p => SLOT_NAME[p && p.slot] ? p.slot : 's';

/* ══════════════ small tools ══════════════ */
const $ = s => document.querySelector(s);
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
const esc = s => UI.esc(String(s == null ? '' : s));
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : (d === undefined ? null : d); };
/* a blank is not known, never zero */

/* ══════════════ the world: one read of the store per store change ══════════════

/* A purchase in the food's base unit, or why it cannot be counted. Mass

    const on = b.dataset.tab === TAB;
    b.classList.toggle('on', on);

  });

  v.classList.toggle('kx-wide', TAB === 'plan' && wideNow);

function go(tab) {

/* ══════════════ SHELF ══════════════ */
function drawShelf(v) {
  const w = W(), ids = Object.keys(w.foods);
  const inK = ids.filter(id => stock(id).inKitchen);
  const buy = toBuy();

  /* 1. what to buy, only when something is needed */
  if (buy.length) {
    const c = card('To buy', String(buy.length));
    const list = el('div', 'kx-list');
    buy.forEach(x => {
      const off = needOffer(x.fd, x.need);
      const r = el('button', 'kx-row mb-plate mb-press');
      r.type = 'button';
      r.innerHTML = '<span class="tx"><span class="nm">' + esc(nameOf(x.fd)) + '</span>' +
        '<span class="sub">' + esc(x.have > EPS ? 'have ' + amtText(x.fd, x.have, true) : stock(x.id).unknown ? 'have an amount not counted' : 'have none') + '</span></span>' +
        '<span class="num">need ' + esc(off.text) + '</span>';
      r.onclick = () => boughtSheet(x.id, off);
      Mobile.hold(r, e => shelfMenu(x.id, e));
      list.appendChild(r);
    });
    c.appendChild(list);
    const sh = button('SHARE LIST', 'quiet', () => shareList(buy));
    sh.insertAdjacentHTML('afterbegin', ico('share', 16) + ' ');
    c.appendChild(el('div', 'kx-btns')).appendChild(sh);
    v.appendChild(c);
  }

  /* nothing in the kitchen yet: say what the shelf is and fill it */
  if (!inK.length) {
    const c = card('The shelf');
    c.appendChild(el('p', 'kx-empty', 'The shelf is what is in your kitchen now. Nothing is on it yet.'));
    c.appendChild(el('div', 'kx-btns')).appendChild(button('ADD FOOD', 'go', addToShelf));
    v.appendChild(c);
    return;
  }

  /* 2. the search, then the shelf */
  const search = UI.field('search', { placeholder: 'Search the shelf', value: SQ });
  search.setAttribute('aria-label', 'Search the shelf');
  const box = el('div', 'kx-form');
  search.addEventListener('input', () => { SQ = search.value; paintShelf(box, inK); });
  v.appendChild(search);
  v.appendChild(box);
  paintShelf(box, inK);

  /* purchases that could not be counted are listed, never dropped */
  const lost = inK.reduce((n, id) => n + stock(id).lost.length, 0);
  if (lost) {
    const l = el('button', 'kx-out mb-press', esc(lost + (lost === 1 ? ' purchase' : ' purchases') + ' could not be counted.') + ' ' + ico('next', 14));
    l.type = 'button';
    l.onclick = lostSheet;
    v.appendChild(l);
  }

  /* 4. the one primary button, where a thumb is */
  v.appendChild(el('div', 'kx-foot')).appendChild(button('ADD FOOD', 'go', addToShelf));
}
function paintShelf(box, inK) {
  const w = W(), q = SQ.trim().toLowerCase();
  const match = id => { const f = w.foods[id]; return !q || (String(f.name || '') + ' ' + String(f.brand || '')).toLowerCase().indexOf(q) >= 0; };
  /* a food bought in a unit that could not be counted stays on the shelf */
  const onShelf = id => { const s = stock(id); return s.q > EPS || s.unknown; };
  const on = inK.filter(id => onShelf(id) && match(id));
  const out = inK.filter(id => !onShelf(id) && match(id));
  box.innerHTML = '';
  if (!on.length) box.appendChild(el('p', 'kx-empty', q ? 'Nothing on the shelf matches.' : 'Everything in the kitchen is used up.'));
  /* grouped the way the person's own foods fall, most used first */
  const groups = {};
  on.forEach(id => { const g = catOf(w.foods[id]); (groups[g] = groups[g] || []).push(id); });
  groupOrder().forEach(g => {
    if (!groups[g]) return;
    const c = card(g, String(groups[g].length));
    const list = el('div', 'kx-list');
    groups[g].sort((a, b) => byUse(w.foods[a], w.foods[b])).forEach(id => list.appendChild(shelfRow(id)));
    c.appendChild(list);
    box.appendChild(c);
  });
  /* 3. foods at nothing, folded away */
  if (out.length) {
    const t = el('button', 'kx-out mb-press', esc(out.length + (out.length === 1 ? ' food out' : ' foods out')) + ' ' + ico(OUT_OPEN ? 'collapse' : 'expand', 14));
    t.type = 'button';
    t.setAttribute('aria-expanded', OUT_OPEN ? 'true' : 'false');
    t.onclick = () => { OUT_OPEN = !OUT_OPEN; Mobile.feedback('select'); paintShelf(box, inK); };
    box.appendChild(t);
    if (OUT_OPEN) {
      const list = el('div', 'kx-list');
      out.sort((a, b) => nameOf(w.foods[a]).localeCompare(nameOf(w.foods[b]))).forEach(id => list.appendChild(shelfRow(id)));
      box.appendChild(list);
    }
  }
}
function shelfRow(id) {
  const fd = food(id), s = stock(id), min = minOf(id);
  const blind = s.q <= EPS && s.unknown;
  const flags = [];
  if (s.flag || blind) flags.push('<span class="kx-flag">count it</span>');
  if (min > 0 && s.q < min - EPS && !blind) flags.push('<span class="kx-flag">low</span>');
  const r = el('button', 'kx-row mb-plate mb-press');
  r.type = 'button';
  r.innerHTML = '<span class="tx"><span class="nm">' + esc(nameOf(fd)) + (fd.brand ? ' <small>' + esc(fd.brand) + '</small>' : '') + '</span>' +
    (flags.length ? '<span class="sub">' + flags.join('') + '</span>' : '') + '</span>' +
    '<span class="num">' + esc(s.q > EPS ? amtText(fd, s.q) : blind ? 'not counted' : 'out') + '</span>';
  r.onclick = () => foodSheet(id);
  Mobile.hold(r, e => shelfMenu(id, e));
  return r;
}
function shelfMenu(id, e) {
  const fd = food(id);
  if (!fd) return;
  menu(e, [
    { label: 'Bought', fn: () => boughtSheet(id) },
    { label: 'Count', fn: () => countSheet(id) },
    canUseUp(id) ? { label: 'Used up', fn: () => usedUp(id) } : null,
    { label: 'Keep at least', fn: () => keepSheet(id) },
  ], nameOf(fd));
}
/* only something in the kitchen can be used up, the same test as the food sheet */
const canUseUp = id => { const s = stock(id); return s.inKitchen && (s.q > EPS || s.unknown); };
const addToShelf = () => pickFood({ title: 'ADD FOOD' }, fid => boughtSheet(fid));

/* The list as plain text, for a phone note or a chat. */
function shareList(buy) {
  const text = 'To buy\n' + buy.map(x => nameOf(x.fd) + ': ' + needOffer(x.fd, x.need).text).join('\n');
  const show = () => UI.dialog({
    title: 'TO BUY', width: 460,
    body: b => { const t = UI.field('note', { rows: Math.min(12, buy.length + 2) }); t.value = text; b.appendChild(t); setTimeout(() => t.select(), 0); },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
  if (navigator.share) { navigator.share({ title: 'To buy', text }).catch(() => {}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => UI.toast('List copied.'), show);
    return;
  }
  show();

/* ── one food: its stock, what to do with it, and what happened ── */
function foodSheet(fid) {
  liveSheet({ title: nameOf(food(fid)), width: 520, actions: [{ label: 'DONE', kind: 'go' }] }, b => {
    const fd = food(fid);
    if (!fd) { b.appendChild(el('p', 'kx-empty', 'This food was deleted.')); return; }
    const s = stock(fid), min = minOf(fid);
    const bits = [fd.brand, fd.cat].filter(Boolean).map(String);
    if (min > 0) bits.push('keep at least ' + amtText(fd, min, true));
    const blind = s.q <= EPS && s.unknown;
    b.appendChild(el('div', 'kx-big', esc(s.inKitchen ? (s.q > EPS ? amtText(fd, s.q) : blind ? 'Not counted' : 'Used up') : 'Not in the kitchen') +
      (bits.length ? '<small>' + esc(bits.join(' · ')) + '</small>' : '')));
    if (s.flag) b.appendChild(el('p', 'kx-note', '<span class="kx-flag">count it</span>Logged more than was stocked.'));
    if (min > 0 && s.q < min - EPS && !blind) b.appendChild(el('p', 'kx-note', '<span class="kx-flag">low</span>Under the amount to keep.'));
    if (s.lost.length) {
      const l = el('button', 'kx-lnk', esc(s.lost.length + (s.lost.length === 1 ? ' purchase' : ' purchases') + ' could not be counted.'));
      l.type = 'button';
      l.onclick = lostSheet;
      b.appendChild(l);
    }
    const acts = el('div', 'kx-acts');
    acts.appendChild(button('BOUGHT', '', () => boughtSheet(fid)));
    acts.appendChild(button('COUNT', '', () => countSheet(fid)));
    if (canUseUp(fid)) acts.appendChild(button('USED UP', '', () => usedUp(fid)));
    acts.appendChild(button('KEEP AT LEAST', '', () => keepSheet(fid)));
    if (isMV(fd) && !pieceServe(fd)) acts.appendChild(button('PIECE WEIGHT', '', () => pieceSheet(fid)));
    b.appendChild(acts);

    /* the last twelve things that happened, newest first */
    const ev = s.events.slice().reverse().slice(0, 12);
    const sec = el('div', 'kx-sec');
    sec.appendChild(el('div', 'kx-gh', 'History'));
    if (!ev.length) sec.appendChild(el('p', 'kx-empty', 'Nothing yet. A purchase or a count puts it on the shelf.'));
    ev.forEach(e => sec.appendChild(eventRow(fd, e)));
    b.appendChild(sec);
  });
}
function eventRow(fd, e) {
  const r = el('div', 'kx-ev');
  let text = '', items = null;
  if (e.kind === 'count') {
    text = e.q > EPS ? 'Counted <b>' + esc(amtText(fd, e.q, true)) + '</b> · ' + esc(dd(e.date)) : '<b>Used up</b> · ' + esc(dd(e.date));
  } else if (e.kind === 'in') {
    const p = e.p || {};
    const what = e.q != null ? amtText(fd, e.q, true) : [known(p.qty) ? fx(num(p.qty), 2) : '', p.unit || ''].join(' ').trim() || 'an amount not given';
    text = 'Bought <b>' + esc(what) + '</b>' + (p.shop ? ' · ' + esc(p.shop) : '') + ' · ' + esc(dd(e.date)) + (e.q == null ? ' · not counted' : '');
    /* only a purchase typed here can go; a receipt's lines belong to RECEIPTS */
    if (p.src === 'kitchen') items = [{ label: 'Remove', kind: 'bad', fn: () => removeBuy(e.date, e.key) }];
  } else {
    const p = e.p || {};
    let where = '';
    if (String(e.key).indexOf('kitchen-') === 0) {
      const pl = Rec.get('kplan', e.date, String(e.key).slice(8));
      if (pl) where = SLOT_NAME[slotOf(pl)];
    } else if (/^\d{1,2}:\d{2}$/.test(String(p.at || ''))) where = UI.clockLabel(p.at);
    text = 'Ate <b>' + esc(e.q != null ? amtText(fd, e.q, true) : (p.serve || 'an amount')) + '</b>' + (where ? ' · ' + esc(where) : '') + ' · ' + esc(dd(e.date)) +
      (e.skip ? ' · not from the kitchen' : '');
    items = [e.skip
      ? { label: 'From the kitchen', fn: () => { Rec.del('kskip', e.date, e.key); Mobile.feedback('select'); } }
      : { label: 'Not from the kitchen', fn: () => { Rec.set('kskip', e.date, e.key, { skip: 1 }); Mobile.feedback('select'); } }];
  }
  r.appendChild(el('span', 'tx', text));
  if (items) {
    const m = iconBtn('more', 'Options');
    m.onclick = ev => menu(ev, items, nameOf(fd));
    r.appendChild(m);
    Mobile.hold(r, ev => menu(ev, items, nameOf(fd)), { skip: 'button' });
  }
  return r;
}
function removeBuy(date, key) {
  const was = Rec.get('buy', date, key);
  if (!was) return;
  Rec.del('buy', date, key);
  Mobile.haptic('warn');
  UI.undo('Removed a purchase.', () => Rec.set('buy', date, key, was));
}
function usedUp(fid) {
  const fd = food(fid), t = Day.today();
  if (!fd) return;
  const was = Rec.get('kcount', t, fid);
  Rec.set('kcount', t, fid, { q: 0, t: Date.now() });
  Mobile.haptic('warn');
  UI.undo('<b>' + esc(nameOf(fd)) + '</b> used up.', () => { if (was) Rec.set('kcount', t, fid, was); else Rec.del('kcount', t, fid); });
}

/* ── the amount box and the units allowed for one food ── */
function unitsFor(fd) {
  const u = unitOf(fd), out = [];
  if (u === 'g') out.push({ id: 'g', name: 'g', want: 'g', f: 1 }, { id: 'kg', name: 'kg', want: 'kg', f: 1000 });
  else if (u === 'ml') out.push({ id: 'ml', name: 'ml', want: 'ml', f: 1 }, { id: 'l', name: 'L', want: 'l', f: 1000 });
  else if (u === 'serving') out.push({ id: 'serving', name: 'servings', f: 1 });
  else out.push({ id: u, name: unitText(fd), f: 1 });
  const pa = pieceAmt(fd);
  if (pa > 0) out.push({ id: 'pc', name: pieceWord(fd)[1], f: pa, pc: 1 });
  return out;
}
function amountBox(fd, placeholder) {
  const units = unitsFor(fd);
  let cur = units[0];
  const wrap = el('div', 'kx-amt'), ln = el('div', 'ln');
  const input = UI.field('decimal', { placeholder: placeholder || '' });
  input.setAttribute('aria-label', 'Amount');
  ln.appendChild(input);
  if (units.length === 1) ln.appendChild(el('span', 'u', esc(cur.name)));
  wrap.appendChild(ln);
  if (units.length > 1) {
    const chips = el('div', 'mb-chips');
    units.forEach(u => {
      const c = el('button', 'mb-chip mb-press' + (u === cur ? ' on' : ''), esc(u.name));
      c.type = 'button';
      c.setAttribute('aria-pressed', u === cur ? 'true' : 'false');
      c.onclick = () => {
        cur = u;
        chips.querySelectorAll('.mb-chip').forEach(x => { x.classList.toggle('on', x === c); x.setAttribute('aria-pressed', x === c ? 'true' : 'false'); });
        Mobile.feedback('select');
      };
      chips.appendChild(c);
    });
    wrap.appendChild(chips);
  }
  return {
    node: wrap, input,
    /* {base: in the food's base unit, qty and unit as a purchase line} */
    read() {
      const t = input.value.trim();
      if (!t) return null;
      if (cur.want) {
        const v = UI.amount(t, cur.want);
        if (!(v > 0)) return null;
        const base = v * cur.f;
        return { base, qty: base, unit: unitOf(fd) };
      }
      const n = num(t.replace(/,/g, ''));
      if (!(n > 0)) return null;
      return cur.pc ? { base: n * cur.f, qty: n, unit: 'pc' } : { base: n, qty: n, unit: cur.id === 'serving' ? 'serving' : unitText(fd) };
    },
  };
}

/* ── Bought: one purchase line, typed here (clients have no RECEIPTS) ── */
function writeBuy(fid, qty, unit, day) {
  const fd = food(fid), key = uid(), t = Day.today(), date = day || t;
  /* dated the day bought; a past day is at noon, as a receipt with no time is */
  const at = date === t ? Date.now() : noonMs(date);
  /* never a spend: money is STATUS's and WEALTH's */
  Rec.set('buy', date, key, { food: fid, text: nameOf(fd), qty, unit, t: at, src: 'kitchen' });
  Mobile.feedback('success');
  UI.undo('Bought <b>' + esc(amtText(fd, toBase(fd, qty, unit).v || 0, true)) + '</b> of ' + esc(nameOf(fd)) + '.', () => Rec.del('buy', date, key));
}
function boughtSheet(fid, offer) {
  const fd = food(fid);
  if (!fd) return;
  let box, day = Day.today();
  const h = UI.dialog({
    title: 'BOUGHT', width: 460,
    body: (b, hh) => {
      b.appendChild(el('p', 'kx-note', esc(nameOf(fd)) + (inStock(fid) ? ' · have ' + esc(amtText(fd, stock(fid).q)) : '')));
      /* the day bought: backfill is normal, the future is not a record */
      const t = Day.today(), yd = Day.shift(t, -1);
      const dc = el('div', 'mb-chips');
      const chip = (label, d) => {
        const c = el('button', 'mb-chip mb-press' + (d === day ? ' on' : ''), esc(label));
        c.type = 'button';
        c.setAttribute('aria-pressed', d === day ? 'true' : 'false');
        c.onclick = () => {
          if (d) { day = d; paintDays(); Mobile.feedback('select'); return; }
          pickDay('BOUGHT ON', x => { day = x; paintDays(); }, null, true);
        };
        return c;
      };
      const paintDays = () => {
        dc.innerHTML = '';
        dc.appendChild(chip('Today', t));
        dc.appendChild(chip('Yesterday', yd));
        const early = day !== t && day !== yd;
        const e = chip(early ? dayName(day) : 'Earlier', null);
        e.classList.toggle('on', early);
        e.setAttribute('aria-pressed', early ? 'true' : 'false');
        dc.appendChild(e);
      };
      paintDays();
      b.appendChild(dc);
      if (offer) {
        const o = button('BOUGHT ' + offer.text, 'go', () => { hh.close(); writeBuy(fid, offer.qty, offer.unit, day); });
        o.style.marginTop = 'var(--s-3)';
        b.appendChild(el('div', 'kx-btns')).appendChild(o);
        b.appendChild(el('p', 'kx-q', 'Or another amount.'));
      }
      box = amountBox(fd, 'How much');
      box.node.style.marginTop = 'var(--s-3)';
      b.appendChild(box.node);
      Mobile.form(b, () => save(hh));
    },
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: hh => { save(hh); return false; } }],
  });
  function save(hh) {
    const a = box.read();
    if (!a) { UI.focusSoon(box.input, true); return; }
    hh.close();
    writeBuy(fid, a.qty, a.unit, day);
  }
  if (h && h.body) UI.focusSoon(box.input);
}
/* ── Count: what is there now; the latest count is the anchor ── */
function countSheet(fid) {
  const fd = food(fid);
  if (!fd) return;
  let box;
  const h = UI.dialog({
    title: 'COUNT', width: 460,
    body: (b, hh) => {
      b.appendChild(el('p', 'kx-note', esc(nameOf(fd)) + '. How much is there now?'));
      box = amountBox(fd, 'Amount there now');
      b.appendChild(box.node);
      Mobile.form(b, () => save(hh));
    },
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: hh => { save(hh); return false; } }],
  });
  function save(hh) {
    const t = box.input.value.trim();
    /* "0" is a real count: used up */
    const a = /^0+([.,]0*)?\s*[a-z]*$/i.test(t) ? { base: 0 } : box.read();
    if (!a) { UI.focusSoon(box.input, true); return; }
    const d = Day.today(), was = Rec.get('kcount', d, fid);
    Rec.set('kcount', d, fid, { q: a.base, t: Date.now() });
    hh.close();
    Mobile.feedback('success');
    UI.undo('Counted <b>' + esc(amtText(fd, a.base, true)) + '</b> of ' + esc(nameOf(fd)) + '.', () => { if (was) Rec.set('kcount', d, fid, was); else Rec.del('kcount', d, fid); });
  }
  if (h && h.body) UI.focusSoon(box.input);
}
/* ── Keep at least: kept off the food row, blank clears it ── */
function keepSheet(fid) {
  const fd = food(fid);
  if (!fd) return;
  const u = unitOf(fd), cur = minOf(fid);
  let i;
  const h = UI.dialog({
    title: 'KEEP AT LEAST', width: 420,
    body: (b, hh) => {
      b.appendChild(el('p', 'kx-note', esc(nameOf(fd)) + ' goes on the list under this amount.'));
      const ln = el('div', 'kx-amt');
      const row = el('div', 'ln');
      i = UI.field('decimal', { placeholder: 'Blank for none', value: cur > 0 ? String(Math.round(cur * 1000) / 1000) : '' });
      i.setAttribute('aria-label', 'Keep at least');
      row.appendChild(i);
      row.appendChild(el('span', 'u', esc(u === 'serving' ? 'servings' : unitText(fd))));
      ln.appendChild(row);
      b.appendChild(ln);
      Mobile.form(b, () => save(hh));
    },
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: hh => { save(hh); return false; } }],
  });
  function save(hh) {
    const t = i.value.trim();
    const v = t ? ((u === 'g' || u === 'ml') ? UI.amount(t, u) : num(t.replace(/,/g, ''))) : null;
    if (t && v == null) { UI.focusSoon(i, true); return; }
    const was = Rec.get('kfood', null, fid), before = was ? num(was.min, 0) : 0;
    hh.close();
    if ((v > 0 ? v : 0) === before) return;
    if (v > 0) Rec.patch('kfood', null, fid, { min: v });
    else if (was) Rec.del('kfood', null, fid);
    Mobile.feedback('success');
    /* every change to the minimum can be taken back, a cleared one too */
    UI.undo(v > 0 ? 'Keep at least <b>' + esc(amtText(fd, v, true)) + '</b>.' : 'Keep at least cleared.',
      () => { if (was) Rec.set('kfood', null, fid, was); else Rec.del('kfood', null, fid); });
  }
  if (h && h.body) UI.focusSoon(i);
}
/* ── Piece weight: merged into the food's servings as "1 piece" ── */
function pieceSheet(fid, done) {
  const fd = food(fid);
  if (!fd) return;
  const u = unitOf(fd);
  let i;
  const h = UI.dialog({
    title: 'PIECE WEIGHT', width: 420,
    body: (b, hh) => {
      b.appendChild(el('p', 'kx-note', esc(nameOf(fd)) + '. How much one piece weighs.'));
      const row = el('div', 'ln');
      i = UI.field('decimal', { placeholder: u === 'ml' ? 'Millilitres per piece' : 'Grams per piece' });
      i.setAttribute('aria-label', 'Per piece');
      row.appendChild(i);
      row.appendChild(el('span', 'u', esc(u)));
      b.appendChild(el('div', 'kx-amt')).appendChild(row);
      Mobile.form(b, () => save(hh));
    },
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: hh => { save(hh); return false; } }],
  });
  function save(hh) {
    const v = UI.amount(i.value, u);
    if (!(v > 0)) { UI.focusSoon(i, true); return; }
    /* read, add, patch: the other servings stay exactly as they were */
    const cur = Rec.get('food', null, fid);
    if (!cur) { hh.close(); return; }
    const sv = (Array.isArray(cur.serves) ? cur.serves : []).filter(s => !(s && /^1\s*piece$/i.test(String(s.label || '').trim())));
    sv.push({ label: '1 piece', mult: v / baseAmt(cur) });

    hh.close();
    Mobile.feedback('success');
    UI.toast('One piece of ' + esc(nameOf(fd)) + ' is ' + esc(fx(v, 1) + ' ' + u) + '.');

  }
  if (h && h.body) UI.focusSoon(i);
}

/* A sheet that repaints when the store changes. A box being typed in is
   left alone. */
function liveSheet(o, paint) {
  let h = null;
  const fn = () => {
    if (!h || !h.body.isConnected) { LIVE.delete(fn); return; }
    const a = document.activeElement;
    if (a && h.body.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    const top = h.body.scrollTop;
    h.body.innerHTML = '';
    paint(h.body, h);
    h.body.scrollTop = top;
  };
  const was = o.onClose;
  o.onClose = v => { LIVE.delete(fn); if (was) was(v); };
  o.body = (b, hh) => { h = hh; paint(b, hh); };
  h = UI.dialog(o);
  LIVE.add(fn);
  return h;
}

/* ══════════════ SCAN ══════════════
   The camera, or the number typed, then Open Food Facts (barcode.js). A code
   already on a food picks that food. Otherwise NEW FOOD opens with what the
   lookup found, or empty with the code kept, so the next scan finds it. */
function scanFood(cb) {
  if (!window.Barcode) { UI.toast('The scanner did not load.', { bad: 1 }); return; }
  Barcode.open({
    known: code => {
      const foods = W().foods;
      const id = Object.keys(foods).find(i => Barcode.same(foods[i].barcode, code));
      return id ? () => { UI.toast('Already in your foods: <b>' + esc(nameOf(foods[id])) + '</b>.'); cb(id); } : null;
    },
    found: r => newFood(r.food ? r.food.name : '', cb, r),
  });
}
/* A new food with only what was typed: blank boxes stay off the row. A scan
   (`scan`, Barcode.lookup's answer) fills the boxes it has figures for, adds
   the rest of what it found to `base`, and keeps the code on the food. */
function newFood(name, cb, scan) {
  let unit = null, cat = null;
  const f = {};
  const got = scan && scan.food ? scan.food : null;
  const h = UI.dialog({
    title: 'NEW FOOD', width: 520,
    body: (b, hh) => {
      const form = el('div', 'kx-form');
      const lab = (text, node) => { const l = el('label', 'kx-lab', '<span>' + esc(text) + '</span>'); l.appendChild(node); return l; };
      f.name = UI.field('name', { placeholder: 'Name', value: name || '' });
      form.appendChild(lab('Name', f.name));
      /* groups already in use; a new one can be typed */
      const groups = groupOrder().filter(g => Object.keys(W().foods).some(id => String(W().foods[id].cat || '').trim() === g));
      if (groups.length) {
        const chips = el('div', 'mb-chips');
        groups.forEach(g => {
          const c = el('button', 'mb-chip mb-press', esc(g));
          c.type = 'button';
          c.onclick = () => {
            cat = cat === g ? null : g;
            chips.querySelectorAll('.mb-chip').forEach(x => x.classList.toggle('on', x === c && cat === g));
            Mobile.feedback('select');
          };
          chips.appendChild(c);
        });
        const gl = el('div', 'kx-lab', '<span>Group</span>');
        gl.appendChild(chips);
        form.appendChild(gl);
      }
      f.cat = UI.field('text', { placeholder: groups.length ? 'Or a new group' : 'Group' });
      form.appendChild(groups.length ? f.cat : lab('Group', f.cat));
      /* the amount the numbers below are for */
      f.amt = UI.field('decimal', { placeholder: '100', value: got ? String(got.amt) : null });
      const al = lab('The numbers are for', f.amt);
      const uc = el('div', 'mb-chips');
      [['g', 'g'], ['ml', 'ml'], ['serving', 'serving']].forEach(x => {
        const c = el('button', 'mb-chip mb-press', x[1]);
        c.type = 'button';
        c.onclick = () => { unit = x[0]; uc.querySelectorAll('.mb-chip').forEach(y => y.classList.toggle('on', y === c)); Mobile.feedback('select'); };
        if (got && got.unit === x[0]) { unit = x[0]; c.classList.add('on'); }
        uc.appendChild(c);
      });
      al.appendChild(uc);
      form.appendChild(al);
      /* a device that does not count food is never asked for calories */
      if (countCal()) {
        const two = el('div', 'kx-two');
        const pre = k => got && got.base[k] != null ? String(got.base[k]) : null;
        f.kcal = UI.field('decimal', { placeholder: 'kcal', value: pre('kcal') });
        f.p = UI.field('decimal', { placeholder: 'g', value: pre('p') });
        f.c = UI.field('decimal', { placeholder: 'g', value: pre('c') });
        f.f = UI.field('decimal', { placeholder: 'g', value: pre('f') });
        two.appendChild(lab('Calories', f.kcal));
        two.appendChild(lab('Protein', f.p));
        two.appendChild(lab('Carbs', f.c));
        two.appendChild(lab('Fat', f.f));
        form.appendChild(two);
      }
      if (scan) {
        const n = got ? Object.keys(got.base).length : 0;
        form.insertBefore(el('p', 'kx-note', esc(
          got ? 'From Open Food Facts: ' + n + ' figure' + (n === 1 ? '' : 's') + ' per 100 ' + got.unit + '. Check them against the pack.'
            : scan.status === 'offline' ? 'No signal. Type it from the label.'
            : 'Not on Open Food Facts. Type it from the label.') +
          ' <small>' + esc(scan.code) + '</small>'), form.firstChild);
      }
      form.appendChild(el('p', 'kx-q', 'Full labels live in STATUS.'));
      b.appendChild(form);
      Mobile.form(form, () => save(hh));
    },
    actions: [{ label: 'CANCEL' }, { label: 'ADD', kind: 'go', fn: hh => { save(hh); return false; } }],
  });
  function save(hh) {
    const n = f.name.value.trim();
    if (!n) { UI.focusSoon(f.name, true); return; }
    /* "100g" in the amount box names its own unit */
    const m = f.amt.value.trim().toLowerCase().replace(/,/g, '').match(/^([0-9]*\.?[0-9]+)\s*(g|ml|servings?)?$/);
    if (m && m[2] && !unit) unit = m[2].indexOf('serv') === 0 ? 'serving' : m[2];
    const a = m ? num(m[1]) : null;
    /* the box is the signal */
    if (!(a > 0)) { UI.focusSoon(f.amt, true); return; }
    if (!unit) { UI.toast('No unit.', { bad: 1 }); return; }
    const base = { amt: a, unit };
    [['kcal', ''], ['p', 'g'], ['c', 'g'], ['f', 'g']].forEach(x => {
      if (!f[x[0]]) return;
      const t = f[x[0]].value.trim();
      if (!t) return;
      const v = x[1] ? UI.amount(t, x[1]) : num(t.replace(/,/g, ''));
      if (v != null && v >= 0) base[x[0]] = v;
    });
    /* what the scan found beyond the four boxes; a box typed over wins, a
       box emptied stays empty (blank is not known, never zero) */
    if (got) {
      Object.keys(got.base).forEach(k => { if (!(k in f) && base[k] == null) base[k] = got.base[k]; });
      base.src = 'off';
    }
    const typed = f.cat.value.trim(), id = uid();
    const row = { id, name: n, brand: got && got.brand ? got.brand : '', base, uses: 0 };
    if (typed || cat) row.cat = typed || cat;
    if (scan && scan.code) row.barcode = scan.code;
    /* no serves: an empty list does not survive live sync, and none is needed */
    Rec.set('food', null, id, row);
    Mobile.feedback('success');
    hh.close();
    UI.toast('Added <b>' + esc(n) + '</b>.');
    if (cb) cb(id);
  }
  if (h && h.body) UI.focusSoon(name ? (got ? null : f.amt) || f.name : f.name);
}

/* ══════════════ PLAN ══════════════ */
function drawPlan(v) {
  const t = Day.today(), ws = weekStart(PDAY);
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => Day.shift(ws, i));

  /* the week, and a way back to this one */
  const bar = el('div', 'kx-wk');
  const prev = iconBtn('back', 'Previous week');
  prev.onclick = () => { PDAY = Day.shift(PDAY, -7); Mobile.feedback('nav'); draw(); };
  const next = iconBtn('next', 'Next week');
  next.onclick = () => { PDAY = Day.shift(PDAY, 7); Mobile.feedback('nav'); draw(); };
  bar.appendChild(prev);
  bar.appendChild(el('span', 't', esc(dd(days[0]) + ' to ' + dd(days[6]))));
  if (days.indexOf(t) < 0) bar.appendChild(button('TODAY', 'quiet', () => { PDAY = t; Mobile.feedback('nav'); draw(); }));
  bar.appendChild(next);
  v.appendChild(bar);

  const has = {};
  days.forEach(d => { has[d] = planRows(d).length; });
  if (!days.some(d => has[d])) {
    const c = card('The plan');
    c.appendChild(el('p', 'kx-empty', 'The plan is what you mean to eat, day by day. Nothing is planned this week.'));
    c.appendChild(el('div', 'kx-btns')).appendChild(button('PLAN A MEAL', 'go', () =>
      pickFood({ plan: 1, title: 'PLAN A MEAL' }, fid => amountSheet(fid, { date: PDAY, slot: 'b', pickSlot: 1 }))));
    v.appendChild(c);
  }

  if (wideNow) {
    /* the whole week, each column the same day view */
    const g = el('div', 'kx-week');
    days.forEach(d => g.appendChild(dayCard(d)));
    v.appendChild(g);
    return;
  }
  const strip = el('div', 'kx-strip');
  days.forEach(d => {
    const b = el('button', 'kx-d mb-press mb-tap' + (d === PDAY ? ' on' : '') + (d === t ? ' now' : ''),
      '<small>' + WD[Day.dow(d)] + '</small><b>' + Number(d.slice(8)) + '</b><i class="' + (has[d] ? '' : 'no') + '"></i>');
    b.type = 'button';
    b.setAttribute('aria-label', dayName(d) + (d === t ? ', today' : '') + (has[d] ? ', planned' : ''));
    if (d === t) b.setAttribute('aria-current', 'date');
    b.onclick = () => { PDAY = d; Mobile.feedback('nav'); draw(); };
    strip.appendChild(b);
  });
  v.appendChild(strip);
  v.appendChild(dayCard(PDAY));
}
/* One day: its four meals and its totals. Both layouts use it. */
function dayCard(date) {

function slotView(date, s, items) {
  const box = el('div', 'kx-slot');

  /* add opens the picker straight away, keyboard up; saved meals are in it */

  add.onclick = () => addFood(date, s);
  hd.appendChild(add);

     An empty one's menu would only repeat the add button */

    const more = iconBtn('more', 'Options for ' + SLOT_NAME[s]);
    more.onclick = e => slotMenu(date, s, items, e);
    hd.appendChild(more);
  }
  Mobile.hold(hd, e => slotMenu(date, s, items, e), { skip: 'button' });
  box.appendChild(hd);
  /* an empty meal is the one quiet line above, not a box */
  if (items.length) {
    const list = el('div', 'kx-list');
    items.forEach(r => list.appendChild(itemRow(r)));
    box.appendChild(list);
  }
  return box;
}
function itemRow(r) {
  const p = r.payload || {}, fd = food(p.food), mult = num(p.mult, 0);
  const canTick = Day.editable(r.date), ate = canTick && eaten(r.date, r.key);
  const bits = [];
  if (fd) {
    bits.push(planText(fd, mult));
    if (countCal()) {
      const kc = baseVal(fd, 'kcal'), pr = baseVal(fd, 'p');
      if (kc != null) bits.push(fx(kc * mult) + ' kcal');
      if (pr != null) bits.push(nf(pr * mult) + ' g protein');
    }
  }
  const row = el('div', 'kx-row kx-item mb-plate mb-press' + (ate ? ' done' : ''));
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  row.innerHTML = '<span class="tx"><span class="nm">' + esc(fd ? nameOf(fd) : 'Deleted food') + '</span>' +
    (bits.length ? '<span class="sub">' + esc(bits.join(' · ')) + '</span>' : '') + '</span>';
  /* today and the past can be ticked; the future is a plan, not a record */
  if (canTick) {
    const tk = el('button', 'kx-tick mb-press' + (ate ? ' on' : ''), '<i>' + (ate ? ico('done', 14) : '') + '</i>');
    tk.type = 'button';
    tk.setAttribute('aria-label', (ate ? 'Eaten: ' : 'Mark eaten: ') + (fd ? nameOf(fd) : 'food'));
    tk.setAttribute('aria-pressed', ate ? 'true' : 'false');
    tk.onclick = e => { e.stopPropagation(); if (ate) uneat(r.date, r.key); else eat(r.date, r.key); };
    row.appendChild(tk);
  }
  row.onclick = () => { if (fd) amountSheet(p.food, { date: r.date, slot: slotOf(p), key: r.key, mult }); else itemMenu(r, null); };
  row.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); row.click(); } };
  Mobile.hold(row, e => itemMenu(r, e), { skip: '.kx-tick' });
  return row;
}
/* Planned totals against STATUS's targets, numbers only. */
function dayFoot(date, rows) {
  if (!countCal()) return null;
  const today = date === Day.today();
  if (!rows.length && !today) return null;
  const lines = [];
  if (rows.length) {
    let kc = 0, pr = 0;
    const gone = {};
    rows.forEach(r => {
      const fd = food(r.payload.food), m = num(r.payload.mult, 0);
      const a = fd ? baseVal(fd, 'kcal') : null, b = fd ? baseVal(fd, 'p') : null;
      /* counted by food, as the guide counts them: one food planned twice is one */
      if (a == null || b == null) gone[r.payload.food || r.key] = 1;
      kc += (a || 0) * m; pr += (b || 0) * m;
    });
    const miss = Object.keys(gone).length;
    const kt = kcalTarget(), pt = macroTarget('p');
    lines.push((kt ? fx(kc) + ' of ' + fx(kt.v) + ' kcal' + (kt.note ? ' ' + kt.note : '') : fx(kc) + ' kcal') + ' · ' +
      (pt ? nf(pr) + ' of ' + fx(pt.v) + ' g protein' : nf(pr) + ' g protein') +
      (miss ? ' · not known for ' + miss + (miss === 1 ? ' food' : ' foods') : ''));
  }
  if (today) {
    const logged = Rec.all('meal', { date }).reduce((n, r) => n + (num(r.payload.kcal, 0) || 0), 0);
    lines.push('Logged in STATUS: ' + fx(logged) + ' kcal');
  }
  return el('div', 'kx-dayfoot', lines.map(esc).join('<br>'));
}

/* ── the amount sheet: how much of a food to plan ──
   o: {date, slot, key and mult when changing one, pickSlot, offer} */
function amountSheet(fid, o) {
  const fd = food(fid);
  if (!fd) { UI.toast('This food is no longer in the library.', { bad: 1 }); return; }
  const sv = servesOf(fd), u = unitOf(fd), byUnit = u === 'g' || u === 'ml';
  const edit = !!o.key;
  let slot = o.slot || 's', mode = byUnit ? 'unit' : 0, input, lab, prevw, modeChips;
  const readMult = () => {
    const t = input.value.trim();
    if (!t) return null;
    if (mode === 'unit') { const v = UI.amount(t, u); return v > 0 ? v / baseAmt(fd) : null; }
    const n = num(t.replace(/,/g, ''));
    return n > 0 ? n * sv[mode].mult : null;
  };
  const show = m => {
    if (mode === 'unit') input.value = m > 0 ? String(Math.round(baseAmt(fd) * m * 10) / 10) : '';

  };
  const paintMode = () => {
    lab.textContent = mode === 'unit' ? (u === 'g' ? 'Grams' : 'Millilitres') : 'How many of ' + sv[mode].label;
    modeChips.querySelectorAll('.mb-chip').forEach(c => {
      const on = String(c.dataset.m) === String(mode);
      c.classList.toggle('on', on);

    });
  };

    const m = readMult();
    if (!m) { prevw.textContent = ''; return; }
    const bits = [planText(fd, m)];
    if (countCal()) {
      const kc = baseVal(fd, 'kcal'), pr = baseVal(fd, 'p');
      if (kc != null) bits.push(fx(kc * m) + ' kcal');
      if (pr != null) bits.push(nf(pr * m) + ' g protein');
    }
    prevw.textContent = bits.join(' · ');
  };
  const setMode = (m, keep) => {
    const was = keep ? readMult() : null;
    mode = m;

    title: nameOf(fd), width: 480,

          c.type = 'button';
          c.onclick = () => { slot = x[0]; sc.querySelectorAll('.mb-chip').forEach(y => y.classList.toggle('on', y === c)); Mobile.feedback('select'); };
          sc.appendChild(c);
        });
        b.appendChild(sc);

      /* servings first, then straight weight when it is weighed */
      modeChips = el('div', 'mb-chips');
      modeChips.style.marginTop = 'var(--s-3)';
      sv.forEach((s, i) => {
        const c = el('button', 'mb-chip mb-press', esc(s.label));
        c.type = 'button';
        c.dataset.m = String(i);
        c.onclick = () => { setMode(i, true); Mobile.feedback('select'); UI.focusSoon(input, true); };
        modeChips.appendChild(c);
      });
      if (byUnit) {
        const c = el('button', 'mb-chip mb-press', u === 'g' ? 'Grams' : 'Millilitres');
        c.type = 'button';
        c.dataset.m = 'unit';
        c.onclick = () => { setMode('unit', true); Mobile.feedback('select'); UI.focusSoon(input, true); };
        modeChips.appendChild(c);

      b.appendChild(modeChips);
      /* offers say what they are and fill the box; nothing is prefilled */
      const offers = el('div', 'mb-chips');
      offers.style.marginTop = 'var(--s-3)';
      const last = lastMult(fid);
      if (last && !(edit && Math.abs(last - (o.mult || 0)) < 1e-9)) {
        const c = el('button', 'mb-chip mb-press', esc('Last: ' + planText(fd, last)));
        c.type = 'button';
        c.onclick = () => { show(last); preview(); Mobile.feedback('select'); UI.focusSoon(input, true); };
        offers.appendChild(c);

      if (o.offer) {

        c.type = 'button';

        offers.appendChild(c);
      }

    },
    actions: edit
      ? [{ label: 'REMOVE', kind: 'bad', fn: () => (removeItem(o.date, o.key) ? undefined : false) },
         { label: 'MOVE', kind: 'quiet', fn: () => { const r = { date: o.date, key: o.key, payload: Rec.get('kplan', o.date, o.key) || {} }; setTimeout(() => itemMenu(r, null), 0); } },
         { label: 'SAVE', kind: 'go', fn: hh => { save(hh); return false; } }]

  });
  function save(hh) {

    if (edit) {

  }
  if (h && h.body) UI.focusSoon(input);

/* ══════════════ GUIDE ══════════════
   Numbers only. Never praise, never a grade. */

/* One eaten or planned thing, and what it carries of a nutrient. */
function eatItem(r) {
  const p = r.payload || {}, fid = p.fid || null, fd = fid ? food(fid) : null;
  /* from the amount eaten when the units match, not the label as it is now */
  const mult = mealMult(fd, p);
  return { src: 'eat', date: r.date, key: r.key, p, fid, fd, mult, id: fid || ('name:' + String(p.name || '').trim().toLowerCase()), name: fd ? nameOf(fd) : String(p.name || 'One-off') };
}
function planItem(r) {
  const p = r.payload || {}, fd = food(p.food);
  return { src: 'plan', date: r.date, key: r.key, p, fid: p.food, fd, mult: num(p.mult, 0), id: p.food, name: fd ? nameOf(fd) : 'Deleted food' };
}
const MACRO = { kcal: 1, p: 1, c: 1, f: 1 };
/* null means not known, never zero */
function itemVal(it, k) {
  if (it.src === 'plan') { const b = it.fd ? baseVal(it.fd, k) : null; return b == null ? null : b * it.mult; }
  const p = it.p;
  const v = known(p[k]) ? num(p[k]) : null;
  /* the macros frozen on a meal are what STATUS counts. A blank on the food
     was frozen as 0, which is not known; a number typed over it in STATUS
     is kept */
  if (MACRO[k]) return (it.fd && baseVal(it.fd, k) == null && !(v > 0)) ? null : v;
  if (k === 'na' || k === 'k' || k === 'ca') {
    if (it.fd) {
      const b = baseVal(it.fd, k);
      if (b == null) return null;
      /* frozen as 0 before the food had a figure: the food's figure now */
      if (v == null || (v === 0 && b > 0 && it.mult > 0)) return it.mult == null ? null : b * it.mult;
      return v;
    }
    /* the food was deleted: its frozen figure still stands, a 0 does not */
    if (it.fid) return v > 0 ? v : null;
    return v;
  }
  /* ELEMENT's salt and citrate carry no vitamins or other minerals */
  if (p.src === 'mix' && !it.fid) return 0;
  if (!it.fd || it.mult == null) return null;
  const b = baseVal(it.fd, k);
  return b == null ? null : b * it.mult;
}
function periodOf(kind) {
  const t = Day.today(), items = [];
  if (kind === 'next') {
    const to = Day.shift(t, 6), ds = {};
    Rec.all('kplan', { from: t, to }).forEach(r => { items.push(planItem(r)); ds[r.date] = 1; });
    const n = Object.keys(ds).length;
    return { kind, items, days: Math.max(1, n),
      note: n ? 'Average of ' + n + ' planned ' + (n === 1 ? 'day' : 'days') + ', ' + dd(t) + ' to ' + dd(to) + '.' : 'Nothing is planned from ' + dd(t) + ' to ' + dd(to) + '.' };
  }
  if (kind === 'last') {
    const from = Day.shift(t, -7), to = Day.shift(t, -1), ds = {}, rows = Rec.all('meal', { from, to });
    /* a day counts once food was logged on it; ELEMENT's salt alone is not a
       logged day, and a day that does not count adds nothing to the sum */
    rows.forEach(r => { if ((r.payload || {}).src !== 'mix') ds[r.date] = 1; });
    rows.forEach(r => { if (ds[r.date]) items.push(eatItem(r)); });
    const n = Object.keys(ds).length;
    return { kind, items, days: Math.max(1, n),
      note: n ? 'Average of ' + n + ' logged ' + (n === 1 ? 'day' : 'days') + ', ' + dd(from) + ' to ' + dd(to) + '.' : 'Nothing was logged from ' + dd(from) + ' to ' + dd(to) + '.' };
  }
  Rec.all('meal', { date: t }).forEach(r => items.push(eatItem(r)));
  planRows(t).forEach(r => { if (!eaten(r.date, r.key)) items.push(planItem(r)); });
  return { kind, items, days: 1, note: 'Solid is eaten today. Striped is planned for today.' };

function sumOf(P, k) {
  const o = { eat: 0, plan: 0, miss: {}, n: 0, ok: 0 };
  const salts = k === 'na' || k === 'k' || k === 'ca';
  P.items.forEach(it => {
    /* ELEMENT's rows add 0 to everything but the salts, so they say
       nothing about how well the rest is known */
    if (!salts && it.src === 'eat' && it.p.src === 'mix' && !it.fid) return;
    o.n++;
    const v = itemVal(it, k);
    if (v == null) { o.miss[it.id] = it.name; return; }
    o.ok++;
    o[it.src] += v;
  });
  o.eat /= P.days; o.plan /= P.days;

}

function shortCard(P, rows) {
  const c = card(P.kind === 'today' ? 'Short today' : 'Short this week');
  const under = rows.filter(r => shortable(r) && r.s.total < r.t.v - EPS);
  const ranked = under.filter(r => r.s.cover >= 0.5).sort((a, b) => a.s.total / a.t.v - b.s.total / b.t.v).slice(0, 3);
  const vague = under.filter(r => r.s.cover < 0.5);
  if (!under.length) c.appendChild(el('p', 'kx-empty', 'Nothing is under target.'));
  ranked.forEach(r => {
    const blk = el('div', 'kx-short');
    blk.appendChild(el('h3', null, esc(r.label + ' · ' + valText(r))));
    let picks = richest(r.k, 3, true), off = false;
    if (!picks.length) { picks = richest(r.k, 3, false); off = true; }
    if (!picks.length) blk.appendChild(el('p', 'kx-q', 'No food in the library carries a figure for it.'));
    const list = el('div', 'kx-list');
    picks.forEach(x => {
      const s = el('button', 'kx-row mb-plate mb-press');
      s.type = 'button';
      const serv = unitOf(x.fd) === 'serving' && baseAmt(x.fd) === 1 ? '1 serving' : '1 serving (' + planText(x.fd, 1) + ')';
      s.innerHTML = '<span class="tx"><span class="nm">' + esc(serv + ' of ' + nameOf(x.fd) + ' adds ' + nf(x.v) + ' ' + (r.k === 'kcal' ? 'kcal' : r.unit + ' ' + inSentence(r.label))) + '</span>' +
        (off ? '<span class="sub">not on the shelf</span>' : '') + '</span>' + ico('add', 18);
      s.onclick = () => suggestAdd(x.id, P);
      list.appendChild(s);
    });
    blk.appendChild(list);
    c.appendChild(blk);
  });
  if (vague.length) c.appendChild(el('p', 'kx-q', esc('Not known well enough to rank: ' + vague.map(r => r.label).join(', ') + '.')));
  return c;
}
/* One step only: a single serving, never a plan. */
function suggestAdd(fid, P) {
  if (P.kind === 'next') return pickDay('ADD ON', d => amountSheet(fid, { date: d, slot: 's', pickSlot: 1, offer: 1 }));
  amountSheet(fid, { date: Day.today(), slot: 's', pickSlot: 1, offer: 1 });
}
/* Where a nutrient came from, and the reference part of the guide. */
function nutSheet(row, P) {
  const k = row.k, u = row.unit ? ' ' + row.unit : '';
  UI.dialog({
    title: row.label.toUpperCase(), width: 560,
    body: b => {
      b.appendChild(el('div', 'kx-big', esc(valText(row)) + '<small>' + esc(P.note) + '</small>'));
      const t = row.t;
      if (t) b.appendChild(el('p', 'kx-q', esc(t.typed ? 'A typed target.' : t.kind === 'target' ? "STATUS's target." + (t.note ? ' ' + t.note : '') :
        (t.kind === 'limit' ? 'A limit' : t.kind === 'ai' ? 'An adequate intake' : 'A recommended allowance') + ' from the US National Academies.')));
      /* by food, over the whole period, biggest first */
      const by = {};
      P.items.forEach(it => {
        const v = itemVal(it, k);
        if (v == null) return;
        const x = by[it.id] = by[it.id] || { name: it.name, v: 0, src: {} };
        x.v += v; x.src[it.src] = 1;
      });
      const from = Object.keys(by).map(id => by[id]).filter(x => x.v > 0).sort((a, c) => c.v - a.v);
      const sec = el('div', 'kx-sec');
      sec.appendChild(el('div', 'kx-gh', P.kind === 'today' ? 'Where it came from today' : 'Where it came from, in total'));
      if (!from.length) sec.appendChild(el('p', 'kx-empty', 'Nothing counted carries it.'));
      from.forEach(x => sec.appendChild(el('div', 'kx-ev', '<span class="tx"><b>' + esc(x.name) + '</b> · ' + esc(nf(x.v) + u) +
        ' · ' + esc(x.src.eat && x.src.plan ? 'eaten and planned' : x.src.eat ? 'eaten' : 'planned') + '</span>')));
      if (row.s.missN) {
        const names = Object.keys(row.s.miss).map(id => row.s.miss[id]);
        sec.appendChild(el('p', 'kx-q', esc('Not known for ' + names.join(', ') + '.')));
      }
      b.appendChild(sec);
      /* nutrients with no reference intake: counted, never a target */
      const also = (ALSO[k] || []).filter(x => NLIST.some(n => n.k === x));
      if (also.length) {
        const s3 = el('div', 'kx-sec');
        s3.appendChild(el('div', 'kx-gh', 'Also counted'));
        also.forEach(x => {
          const s = sumOf(P, x), ux = unitOfK(x);
          s3.appendChild(el('div', 'kx-ev', '<span class="tx"><b>' + esc(labelOf(x)) + '</b> · ' + esc(nf(s.total) + (ux ? ' ' + ux : '')) +
            (s.missN ? ' · ' + esc('not known for ' + s.missN + (s.missN === 1 ? ' food' : ' foods')) : '') + '</span>'));
        });
        b.appendChild(s3);
      }
      /* the library, richest first, shelf ones marked */
      const rich = (title, list, per) => {
        const s2 = el('div', 'kx-sec');
        s2.appendChild(el('div', 'kx-gh', title));
        if (!list.length) s2.appendChild(el('p', 'kx-empty', 'No food in the library carries a figure for it.'));
        list.forEach(x => s2.appendChild(el('div', 'kx-ev', '<span class="tx"><b>' + esc(nameOf(x.fd)) + '</b> · ' + esc(nf(x.v) + u + ' ' + per(x)) +
          (inStock(x.id) ? ' · on the shelf' : '') + '</span>')));
        b.appendChild(s2);
      };
      rich('Richest per serving', richest(k, 8, null), x => 'per ' + planText(x.fd, 1));
      /* a device that does not count food is never shown calories */
      if (k !== 'kcal' && countCal()) {
        const w = W();
        const per100 = Object.keys(w.foods).map(id => {
          const fd = w.foods[id], v = baseVal(fd, k), kc = baseVal(fd, 'kcal');
          return { id, fd, v: v > 0 && kc > 0 ? v / kc * 100 : 0 };
        }).filter(x => x.v > 0).sort((a, c) => c.v - a.v).slice(0, 8);
        rich('Richest per 100 kcal', per100, () => 'per 100 kcal');
      }
    },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
}

/* ── the reference choice: the setup card, and again in Settings ── */
function refPicker(done) {
  const r = S.get('ref', null) || {};
  let sex = r.none ? null : r.sex || null, age = r.none ? null : r.age || null;
  const box = el('div', 'kx-form');
  const save = () => { if (sex && age) { S.set('ref', { sex, age }); if (done) done(); } };
  box.appendChild(UI.segmented([{ id: 'm', name: 'MEN' }, { id: 'f', name: 'WOMEN' }], sex, v => { sex = v; save(); }));
  box.appendChild(UI.segmented([
    { id: '19', name: '19–30' }, { id: '31', name: '31–50' }, { id: '51', name: '51–70' }, { id: '71', name: '71+' },
  ], age, v => { age = v; save(); }));
  const none = button(r.none ? 'NO REFERENCE CHOSEN' : 'NO REFERENCE', 'quiet', () => { S.set('ref', { none: 1 }); if (done) done(); });
  if (r.none) none.disabled = true;
  box.appendChild(el('div', 'kx-btns')).appendChild(none);
  return box;
}
/* `short` drops the pointer to Settings, for use inside Settings */
function sourceLine(short) {
  const p = el('p', 'kx-q', "Values from the US National Academies' Dietary Reference Intakes. " + (short ? '' : 'Any target can be typed over in Settings. '));
  const a = el('a', 'kx-src mb-tap', 'Source');
  a.href = REF.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.title = REF.source;
  p.appendChild(a);
  return p;
}
function setupCard() {
  const c = card('Reference intakes');
  c.appendChild(el('p', 'kx-note', 'Pick the reference the guide measures against.'));
  c.appendChild(refPicker(draw));
  c.appendChild(sourceLine());
  return c;
}

/* ══════════════ Settings ══════════════ */
let SETH = null;
function openSettings(first) {
  SETH = UI.settings(APP.id, [
    { id: 'targets', name: 'TARGETS', draw: drawTargets },
    { id: 'meals', name: 'MEALS', draw: drawMeals },
  ], { order: first === 'meals' ? ['meals', 'targets', 'data'] : ['targets', 'meals', 'data'] });
}
function drawTargets(pane) {
  pane.innerHTML = '';
  pane.appendChild(el('div', 'mb-group', 'Reference'));
  pane.appendChild(refPicker(() => drawTargets(pane)));
  pane.appendChild(sourceLine(true));
  pane.appendChild(el('div', 'mb-group', 'Targets'));
  pane.appendChild(el('p', 'kx-q', 'A typed target replaces the reference.'));
  const typed = S.get('targets', null) || {}, hide = S.get('hide', null) || {};
  ORDER.forEach(x => {
    const k = x[0], unit = unitOfK(k), ref = refOf(k);
    const note = ref ? (ref.kind === 'limit' ? 'Limit ' : 'Reference ') + nf(ref.v) + ' ' + unit : 'No reference';
    const ctl = el('div', 'kx-btns');
    ctl.style.flexWrap = 'nowrap';
    ctl.style.alignItems = 'center';
    const i = UI.field('decimal', { placeholder: unit, value: known(typed[k]) ? String(typed[k]) : '' });
    i.style.maxWidth = 'calc(var(--s-9) + var(--s-6))';
    i.setAttribute('aria-label', labelOf(k) + ' target in ' + unit);
    i.addEventListener('change', () => {
      const v = UI.amount(i.value, unit), cur = Object.assign({}, S.get('targets', null) || {});
      if (v != null && v > 0) cur[k] = Math.round(v * 1000) / 1000; else delete cur[k];
      i.value = cur[k] != null ? String(cur[k]) : '';
      if (Object.keys(cur).length) S.set('targets', cur); else S.clear('targets');
    });
    const sw = UI.toggle(!hide[k], on => {
      const cur = Object.assign({}, S.get('hide', null) || {});
      if (on) delete cur[k]; else cur[k] = 1;
      if (Object.keys(cur).length) S.set('hide', cur); else S.clear('hide');
    });
    sw.setAttribute('aria-label', 'Show ' + labelOf(k));
    ctl.appendChild(i);
    ctl.appendChild(sw);
    pane.appendChild(UI.row(labelOf(k), esc(note), ctl));
  });
}
function drawMeals(pane) {
  pane.innerHTML = '';
  const list = dishList();
  if (!list.length) {
    pane.appendChild(el('p', 'kx-empty', 'Saved meals are made from a meal in PLAN.'));
    pane.appendChild(el('div', 'kx-btns')).appendChild(button('OPEN PLAN', 'go', () => {
      if (SETH && SETH.close) SETH.close();
      go('plan');
    }));
    return;
  }
  list.forEach(d => {
    const items = (d.items || []).map(it => { const fd = food(it.food); return fd ? nameOf(fd) + ' ' + planText(fd, num(it.mult, 0)) : 'a deleted food'; });
    const ctl = el('div', 'kx-btns');
    ctl.style.flexWrap = 'nowrap';
    const ren = iconBtn('edit', 'Rename ' + (d.name || 'meal'));
    const rm = iconBtn('del', 'Remove ' + (d.name || 'meal'));
    const rename = () => nameSheet('RENAME', d.name || '', 'Name of the meal', n => { Rec.patch('kdish', null, d.key, { name: n }); drawMeals(pane); });
    const remove = () => {
      const was = Rec.get('kdish', null, d.key);
      if (!was) return;
      Rec.del('kdish', null, d.key);
      Mobile.haptic('warn');
      drawMeals(pane);
      UI.undo('Removed <b>' + esc(d.name || 'meal') + '</b>.', () => { Rec.set('kdish', null, d.key, was); if (pane.isConnected) drawMeals(pane); });
    };
    ren.onclick = rename;
    rm.onclick = remove;
    ctl.appendChild(ren);
    ctl.appendChild(rm);
    const row = UI.row(d.name || 'Meal', esc(items.join(', ')), ctl);
    Mobile.hold(row, e => menu(e, [{ label: 'Rename', fn: rename }, '-', { label: 'Remove', kind: 'bad', fn: remove }], d.name || 'Meal'), { skip: 'button' });
    pane.appendChild(row);
  });
}

/* ══════════════ boot ══════════════ */
Skins.load('../shared/skins.json').then(() => {
  Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true });
  draw();
});
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* `buy` is here too, so a purchase typed in KITCHEN reaches this app's own
   sheet tab and backup. The reads bring other apps' rows to a device where
   those apps were never opened. */
IO.register({
  app: APP.id, name: APP.name, types: APP.types.concat(['buy']),
  reads: { status: ['food', 'meal'], portion: ['food'], receipts: ['buy', 'receipt'] },
});

document.querySelectorAll('nav.kx-tabs button').forEach(b => {
  b.onclick = () => { Mobile.feedback('nav'); go(b.dataset.tab); };
});
$('#bSet').onclick = () => openSettings();
$('#bHome').onclick = () => { location.href = '../index.html'; };
/* The home screen can open a tab here: postMessage({lifeos:1, show:'plan'}). */
addEventListener('message', e => {
  const m = e.data;
  if (m && m.lifeos === 1 && typeof m.show === 'string' && TABS.indexOf(m.show) >= 0) go(m.show);
});

/* Redraw on any store change, but never under a box being typed in: the
   shelf search is in the view, and a redraw would wipe it. */
const typing = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('#view') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); };
let soonT = null, pending = false;
function soon() {
  if (typing()) { pending = true; return; }
  clearTimeout(soonT);
  soonT = setTimeout(draw, 30);
}
document.addEventListener('focusout', () => setTimeout(() => { if (pending && !typing()) { pending = false; soon(); } }, 0));
Rec.on(() => { gen++; soon(); });
Day.on(soon);
/* Day.on does not fire at midnight, so look once a minute and on return. */
let shown = Day.today();
const rollover = () => {
  const t = Day.today();
  if (t === shown) return;
  if (PDAY === shown) PDAY = t;
  shown = t;
  soon();
};
setInterval(rollover, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) rollover(); });
/* PLAN changes shape at 1100px */
addEventListener('resize', () => { if (TAB === 'plan' && (innerWidth >= 1100) !== wideNow) soon(); });

draw();            /* paint what localStorage has now */
Rec.ready(draw);   /* again once IndexedDB (big rows) has merged in */
</script>
