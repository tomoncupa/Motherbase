<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFEOS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10; --panel:#0e141d; --panel2:#131b26; --line:#1e2a38; --line2:#2b3a4d;
  --txt:#dbe7f0; --dim:#7f93a8; --dim2:#5b6d80;
  --acc:#7ee8fa; --acc-d:#1a3a44; --warn:#ffb347; --bad:#ff6b81; --good:#6ee7a8;
  --f1:'Chakra Petch',system-ui,sans-serif; --f2:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, #10202b 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 100%, #131024 0%, transparent 55%),
    var(--bg);
  color:var(--txt); font-family:var(--f2); font-size:13px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#22303f;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

#wrap{display:flex;flex-direction:column;height:100vh}

/* ---------- dock ---------- */
header{
  display:flex;align-items:center;gap:14px;padding:9px 14px;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:rgba(10,15,22,.85);backdrop-filter:blur(8px);
}
.logo{font-family:var(--f1);font-weight:700;font-size:17px;letter-spacing:.2em;display:flex;align-items:center;gap:9px;cursor:pointer}
.logo b{color:var(--acc)}
.logo .mark{color:var(--acc);font-size:15px;filter:drop-shadow(0 0 6px rgba(126,232,250,.5))}
nav{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#0a1018}
nav button{
  padding:5px 14px;border-radius:6px;font-family:var(--f1);font-size:12px;letter-spacing:.1em;color:var(--dim);
  display:flex;align-items:center;gap:7px;white-space:nowrap;
}
nav button:hover{color:var(--txt)}
nav button.on{background:linear-gradient(180deg,#16303a,#102028);color:var(--acc);box-shadow:0 0 0 1px var(--acc-d)}
nav button .k{font-size:9px;opacity:.5}
nav button.dead{color:#43535f}
nav button.dead:hover{color:var(--bad)}
.spacer{flex:1}
.clock{font-family:var(--f1);font-size:12px;letter-spacing:.1em;color:var(--dim);text-align:right;line-height:1.35}
.clock b{display:block;color:var(--txt);font-size:14px;letter-spacing:.14em}
.hbtn{
  padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  font-family:var(--f1);font-size:11px;letter-spacing:.08em;color:var(--dim);
}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}

/* ---------- stage ---------- */
#stage{flex:1;position:relative;min-height:0}
#home{position:absolute;inset:0;overflow:auto;padding:18px 16px 40px}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frame.hide{display:none}

/* ---------- panels ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));max-width:1500px;margin:0 auto}
.grid.top{grid-template-columns:minmax(360px,1.35fr) minmax(320px,1fr);margin-bottom:14px}
@media(max-width:900px){.grid.top{grid-template-columns:1fr}}
.card{
  border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--panel),#0b1119);
  padding:14px 15px 15px;position:relative;overflow:hidden;
}
.card:before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--acc-d),transparent)}
.card h2{
  font-family:var(--f1);font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--dim);
  display:flex;align-items:center;gap:9px;margin-bottom:12px;
}
.card h2 .c{color:var(--acc);letter-spacing:.06em}
.card h2 .sub{margin-left:auto;font-family:var(--f2);font-size:11px;letter-spacing:0;color:var(--dim2);text-transform:none}
.empty{color:var(--dim2);font-size:12px;line-height:1.7;padding:6px 0 2px}
.empty b{color:var(--dim)}
.link{color:var(--acc);cursor:pointer;border-bottom:1px dotted var(--acc-d)}

/* ---------- today list ---------- */
.rowlist{display:flex;flex-direction:column;gap:5px;max-height:min(46vh,420px);overflow:auto;padding-right:3px}
.row{
  display:flex;align-items:center;gap:10px;padding:7px 9px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel2);position:relative;
}
.row:hover{border-color:var(--line2)}
.row .bar{position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--acc)}
.row .t{font-family:var(--f1);font-size:11px;letter-spacing:.06em;color:var(--dim);width:62px;flex:0 0 auto;padding-left:8px}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:10px;color:var(--dim2);font-family:var(--f1);letter-spacing:.06em;flex:0 0 auto}
.row.done .n{text-decoration:line-through;text-decoration-color:var(--dim2);color:var(--dim)}
.row.done{opacity:.5}
.chk{
  width:22px;height:22px;flex:0 0 auto;border:1px solid var(--line2);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.12s;
}
.chk:hover{border-color:var(--acc);color:var(--acc-d)}
.chk.on{background:linear-gradient(180deg,#16303a,#0f2028);border-color:var(--acc);color:var(--acc)}
.tag{font-size:9px;font-family:var(--f1);letter-spacing:.1em;color:var(--dim2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}

/* ---------- ring ---------- */
.ringwrap{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.ring{position:relative;width:74px;height:74px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-family:var(--f1);font-size:17px;letter-spacing:.04em;color:var(--acc);
}
.ring .num i{font-style:normal;font-size:9px;color:var(--dim2);letter-spacing:.14em}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f1);font-size:20px;color:var(--txt);letter-spacing:.04em;line-height:1.15}
.stat span{font-size:10px;letter-spacing:.14em;color:var(--dim2);font-family:var(--f1)}
.stat.acc b{color:var(--acc)}

/* ---------- habits ---------- */
.hrow{display:flex;align-items:center;gap:10px;padding:6px 2px}
.hrow+.hrow{border-top:1px solid #16202c}
.hrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .n small{display:block;color:var(--dim2);font-size:10px;font-family:var(--f1);letter-spacing:.08em}
.dots{display:flex;gap:3px;flex:0 0 auto}
.dots i{width:9px;height:9px;border-radius:3px;background:#182330;border:1px solid #1e2a38}
.dots i.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 5px rgba(126,232,250,.4)}
.dots i.miss{background:#1a1420;border-color:#2a1c26}
.dots i.na{opacity:.35}
.streak{font-family:var(--f1);font-size:12px;color:var(--warn);letter-spacing:.04em;width:40px;text-align:right;flex:0 0 auto}
.streak.zero{color:var(--dim2)}

/* ---------- heatmap ---------- */
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat .wk{display:flex;flex-direction:column;gap:3px}
.heat b{width:12px;height:12px;border-radius:3px;background:#131c26;border:1px solid #1a2531;display:block}
.heat b.l1{background:#16333c;border-color:#1d4550}
.heat b.l2{background:#1e5464;border-color:#276a7d}
.heat b.l3{background:#3a93a8;border-color:#49aec6}
.heat b.l4{background:var(--acc);border-color:var(--acc);box-shadow:0 0 6px rgba(126,232,250,.35)}
.heat b.fut{opacity:.25}
.legend{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:10px;color:var(--dim2);font-family:var(--f1);letter-spacing:.1em}
.legend b{width:10px;height:10px;border-radius:3px;display:block}

/* ---------- app tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{
  border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:13px 12px;text-align:left;
  display:flex;flex-direction:column;gap:5px;transition:.14s;position:relative;overflow:hidden;
}
.tile:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 22px -12px var(--acc)}
.tile .ic{font-size:19px;line-height:1;color:var(--acc)}
.tile .nm{font-family:var(--f1);font-size:13px;letter-spacing:.16em}
.tile .ds{font-size:10.5px;color:var(--dim2);line-height:1.45}
.tile .pill{
  position:absolute;top:10px;right:10px;font-family:var(--f1);font-size:8px;letter-spacing:.12em;
  color:var(--acc);border:1px solid var(--acc-d);border-radius:20px;padding:2px 6px;background:#0d1b21;
}
.tile.solo .pill{color:var(--dim2);border-color:var(--line)}
.tile.missing{opacity:.5}
.tile.missing:hover{border-color:var(--bad);box-shadow:none;transform:none}

/* ---------- misc ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#0d1620;border:1px solid var(--line2);border-radius:9px;padding:9px 15px;font-size:12px;
  transition:.22s;z-index:60;box-shadow:0 10px 40px -12px #000;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{color:var(--acc)}
.dotstat{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 7px var(--good)}
.dotstat.busy{background:var(--warn);box-shadow:0 0 7px var(--warn)}
kbd{font-family:var(--f1);font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--dim)}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="logo" onclick="go('home')"><span class="mark">◈</span>LIFE<b>OS</b></div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <div class="clock"><b id="cDate">—</b><span id="cSub">—</span></div>
    <button class="hbtn" id="btnExport" title="Download every LifeOS app's data as one JSON file">⭳ BACKUP</button>
    <button class="hbtn" id="btnImport" title="Restore a backup">⭱</button>
    <span class="dotstat" id="stat" title="shared data connected"></span>
  </header>
  <main id="stage">
    <section id="home"></section>
  </main>
</div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">

<script>
/* ══════════════════════════ LIFEOS KERNEL v1 ══════════════════════════
   The shared brain. This block is IDENTICAL in every LifeOS app — edit the
   copy in lifeos.html and re-paste it between the sentinels in the others.

   Two modes, decided at load:
     • hosted   — the app is in an iframe inside lifeos.html. Every mutation is
                  proxied to the shell over postMessage, so the shell is the
                  single writer and nothing races. Works on file:// too, where
                  frames cannot touch each other's DOM but postMessage still flows.
     • solo     — the app was opened on its own. It owns localStorage 'lifeos_v1'
                  directly and gossips over BroadcastChannel to other tabs.
   Either way the app calls the same API and never knows which one it got.

   The shared doc is small and is broadcast whole — no diffing, no versions to
   reconcile. Apps keep their own private state (block_v1, arc's IDB, …) exactly
   as before; only what MUST be shared lives here.                          */
window.LifeOS = (function () {
  const KEY = 'lifeos_v1';
  const HOSTED = (function () { try { return !!(window.parent && window.parent !== window); } catch (e) { return false; } })();
  const blank = () => ({ v: 1, ts: 0, activities: {}, habits: {}, log: {}, today: null });

  let doc = blank(), subs = [], waits = {}, seq = 0, bc = null, booted = false, bootQ = [], persistHook = null;

  const pad = n => String(n).padStart(2, '0');
  /** the only date format anything here speaks: YYYY-MM-DD, local time */
  const day = d => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  /** canonical activity id — apps agree on a thing by its NAME, slugged */
  const slug = s => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
  const shift = (date, n) => { const d = new Date(date + 'T12:00:00'); d.setDate(d.getDate() + n); return day(d); };

  /* ─── ops: the complete list of ways the shared doc may change ───
     Pure mutations on a doc. The authority (a solo app, or the shell) runs them;
     hosted apps only ever ask for them by name. */
  const OPS = {
    /** upsert activities — the vocabulary of things you do */
    acts(d, list) {
      (list || []).forEach(a => {
        if (!a || !a.name) return;
        const id = a.id || slug(a.name);
        d.activities[id] = Object.assign({ id: id, name: a.name, cat: '', dur: 0, color: '', energy: 2 }, d.activities[id], a, { id: id });
      });
    },
    /** tick / untick one activity on one date. Idempotent — the same cell no
        matter who writes it, which is what makes BLOCK and HABITS agree. */
    done(d, a) {
      const date = a.date || day(), id = a.actId;
      if (!id) return;
      const rec = d.log[date] || (d.log[date] = {});
      if (a.on === false) delete rec[id];
      else rec[id] = { ts: Date.now(), src: a.src || '?', habitId: a.habitId || null, note: a.note || '' };
      if (!Object.keys(rec).length) delete d.log[date];
    },
    habit(d, h) {
      if (!h || !h.id) return;
      d.habits[h.id] = Object.assign(
        { created: day(), archived: false, cadence: { type: 'daily', days: [1, 1, 1, 1, 1, 1, 1], target: 7 } },
        d.habits[h.id], h);
    },
    habitDel(d, id) { delete d.habits[id]; },
    /** whichever app owns the schedule publishes today's plan here, so the home
        screen (and anything else) can show and tick it without ever reading
        that app's private storage */
    today(d, t) { d.today = t || null; },
    /** housekeeping: the log only grows, so drop ancient days */
    prune(d, keepDays) {
      const cut = shift(day(), -(keepDays || 800));
      Object.keys(d.log).forEach(k => { if (k < cut) delete d.log[k]; });
    },
  };

  function emit() { subs.forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } }); }
  function onBoot(fn) { booted ? fn(doc) : bootQ.push(fn); }
  function setDoc(d) {
    doc = Object.assign(blank(), d || {});
    if (!booted) { booted = true; bootQ.splice(0).forEach(f => { try { f(doc); } catch (e) { console.warn('[lifeos]', e); } }); }
    emit();
    /* state that arrived from another tab (or from IndexedDB at boot) still has
       to reach the apps we are hosting, and still deserves persisting */
    if (!HOSTED) { toFrames({ lifeos: 1, ev: 'doc', doc: doc }); if (persistHook) persistHook(doc); }
  }

  /* ─── solo mode: this window owns the data ─── */
  function loadLocal() { try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.v) return Object.assign(blank(), r); } catch (e) {} return blank(); }
  function saveLocal() {
    doc.ts = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(doc)); } catch (e) { console.warn('[lifeos] localStorage full', e); }
    if (persistHook) persistHook(doc);              /* the shell hangs IndexedDB here */
    if (bc) { try { bc.postMessage({ lifeos: 1, ev: 'doc', doc: doc }); } catch (e) {} }
    toFrames({ lifeos: 1, ev: 'doc', doc: doc });   /* no-op unless we are the shell */
  }
  function apply(op, args) {
    if (!OPS[op]) throw new Error('lifeos: unknown op ' + op);
    OPS[op](doc, args); saveLocal(); emit(); return doc;
  }

  /* ─── hosted mode: ask the shell to do it ─── */
  function ask(op, args) {
    return new Promise(res => {
      const id = ++seq; waits[id] = res;
      try { window.parent.postMessage({ lifeos: 1, id: id, op: op, args: args }, '*'); }
      catch (e) { delete waits[id]; res(doc); return; }
      setTimeout(() => { if (waits[id]) { delete waits[id]; res(doc); } }, 4000);
    });
  }
  function toFrames(msg) {
    if (HOSTED) return;
    document.querySelectorAll('iframe').forEach(f => { try { f.contentWindow.postMessage(msg, '*'); } catch (e) {} });
  }

  const run = HOSTED ? ask : (op, args) => Promise.resolve(apply(op, args));

  /* ─── wiring ─── */
  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || m.lifeos !== 1) return;
    if (m.ev === 'doc') { setDoc(m.doc); return; }               /* the shell pushed new state */
    if (m.id && m.ok) { const w = waits[m.id]; delete waits[m.id]; setDoc(m.doc); if (w) w(doc); return; }
    /* a child frame is asking us to mutate — only the shell answers these */
    if (!HOSTED && m.op) {
      if (m.op !== 'hello') { try { apply(m.op, m.args); } catch (err) { console.warn('[lifeos]', err); } }
      try { e.source.postMessage({ lifeos: 1, id: m.id, ok: 1, doc: doc }, '*'); } catch (err) {}
    }
  });

  if (HOSTED) {
    try { window.parent.postMessage({ lifeos: 1, id: ++seq, op: 'hello' }, '*'); } catch (e) {}
    /* if no shell answers (the file was opened in a frame by hand), go solo */
    setTimeout(() => { if (!booted) setDoc(loadLocal()); }, 1200);
  } else {
    try { bc = new BroadcastChannel('lifeos'); bc.onmessage = e => { if (e.data && e.data.lifeos === 1 && e.data.ev === 'doc') setDoc(e.data.doc); }; } catch (e) {}
    window.addEventListener('storage', e => { if (e.key === KEY) setDoc(loadLocal()); });
    setDoc(loadLocal());
  }

  const API = {
    hosted: HOSTED,
    day: day, slug: slug, shift: shift,
    ready: onBoot,
    doc: () => doc,
    on: f => { subs.push(f); if (booted) f(doc); return () => { const i = subs.indexOf(f); if (i > -1) subs.splice(i, 1); }; },

    acts: list => run('acts', list),
    act: id => doc.activities[id] || null,
    done: (actId, date, on, meta) => run('done', Object.assign({ actId: actId, date: date || day(), on: on !== false }, meta || {})),
    isDone: (actId, date) => !!(doc.log[date || day()] || {})[actId],
    dayLog: date => doc.log[date || day()] || {},
    habit: h => run('habit', h),
    habitDel: id => run('habitDel', id),
    publishToday: t => run('today', t),
    prune: n => run('prune', n),

    /** consecutive due-days ending today (today still counts as open, not broken) */
    streak(actId, cadence) {
      const due = d => (!cadence || cadence.type !== 'days') ? true : !!cadence.days[new Date(d + 'T12:00:00').getDay()];
      let n = 0, d = day(), guard = 0;
      if (!API.isDone(actId, d)) d = shift(d, -1);
      while (guard++ < 900) {
        if (!due(d)) { d = shift(d, -1); continue; }
        if (!API.isDone(actId, d)) break;
        n++; d = shift(d, -1);
      }
      return n;
    },
    /** how many of the last n days this was done */
    count(actId, n) {
      let c = 0, d = day();
      for (let i = 0; i < (n || 30); i++) { if (API.isDone(actId, d)) c++; d = shift(d, -1); }
      return c;
    },
    /* the shell hangs IndexedDB durability here — an accessor, so the kernel
       never touches a binding that does not exist yet at boot */
    get persist() { return persistHook; },
    set persist(f) { persistHook = f; },
    _apply: apply,
    _adopt: d => { setDoc(d); saveLocal(); },
  };
  return API;
})();
/* ════════════════════════ END LIFEOS KERNEL ════════════════════════ */

/* ══════════════ shell: durability ══════════════
   localStorage is the fast synchronous copy the kernel already keeps. IndexedDB
   is the one that survives a big log — same doctrine as ARC: load the sync copy
   first, then swap in IDB if its stamp is newer. */
const IDB = (function () {
  let dbp = null;
  function db() {
    return dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('lifeos', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
  }
  return {
    get(k) { return db().then(d => new Promise((res, rej) => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
    set(k, v) { return db().then(d => new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); })); },
  };
})();
let persistT;
LifeOS.persist = d => { clearTimeout(persistT); const snap = JSON.stringify(d); persistT = setTimeout(() => IDB.set('doc', snap).catch(() => {}), 400); };
IDB.get('doc').then(raw => {
  if (!raw) return;
  const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
  if (d && d.ts > LifeOS.doc().ts) LifeOS._adopt(d);
}).catch(() => {});

/* ══════════════ the app roster ══════════════
   Adding an app to LifeOS is one entry here plus (if it wants to share data)
   the kernel block pasted into it. Nothing else in the shell knows their names. */
const APPS = [
  { id: 'home',   nm: 'HOME',   ic: '◈', file: null,               ds: 'today, streaks, everything at a glance' },
  { id: 'arc',    nm: 'ARC',    ic: '◇', file: 'arc.html',         ds: 'mind canvas — think, map, plan',            solo: 1 },
  { id: 'block',  nm: 'BLOCK',  ic: '▦', file: 'block.html',       ds: 'build the day out of blocks',               shares: 'routine + ticks' },
  { id: 'habits', nm: 'HABITS', ic: '◎', file: 'habits.html',      ds: 'cadence, streaks, the long view',           shares: 'the same ticks' },
  { id: 'form',   nm: 'FORM',   ic: '▶', file: 'form-review.html', ds: 'side-by-side lift review',                  solo: 1 },
];
const app = id => APPS.find(a => a.id === id);
const frames = {};      /* id -> iframe. Built on first visit, then kept alive. */
const missing = {};     /* id -> true once a HEAD check says the file is not there */
let view = 'home';

const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let toastT;
function toast(h) { const t = $('#toast'); t.innerHTML = h; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ══════════════ navigation ══════════════ */
function go(id) {
  const a = app(id); if (!a) return;
  view = id;
  location.hash = id === 'home' ? '' : id;
  $('#home').style.display = id === 'home' ? '' : 'none';
  Object.keys(frames).forEach(k => frames[k].classList.toggle('hide', k !== id));
  if (a.file && !frames[id]) {
    const f = el('iframe', 'frame');
    f.setAttribute('allow', 'camera; microphone; fullscreen; clipboard-read; clipboard-write');
    f.src = a.file;
    frames[id] = f; $('#stage').appendChild(f);
  }
  drawNav();
  if (id === 'home') drawHome();
}
/* apps can ask the shell to move: postMessage({lifeos:1, nav:'home'}) */
window.addEventListener('message', e => { const m = e.data; if (m && m.lifeos === 1 && m.nav && app(m.nav)) go(m.nav); });

function drawNav() {
  const n = $('#nav'); n.innerHTML = '';
  APPS.forEach((a, i) => {
    const b = el('button', (view === a.id ? 'on ' : '') + (missing[a.id] ? 'dead' : ''),
      '<span>' + a.ic + '</span>' + a.nm + '<span class="k">' + (i + 1) + '</span>');
    b.title = missing[a.id] ? a.file + ' is not in this folder' : a.ds;
    b.onclick = () => missing[a.id] ? toast('<b>' + esc(a.file) + '</b> is not next to lifeos.html') : go(a.id);
    n.appendChild(b);
  });
}
/* a tile for a file that is not there should say so, not open a blank frame */
function probe() {
  if (location.protocol === 'file:') return;   /* HEAD on file:// tells us nothing */
  APPS.filter(a => a.file).forEach(a => {
    fetch(a.file, { method: 'HEAD' }).then(r => { if (!r.ok) { missing[a.id] = 1; drawNav(); if (view === 'home') drawHome(); } }).catch(() => {});
  });
}

/* ══════════════ home ══════════════ */
const MIN2 = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; const h = Math.floor(m / 60), x = m % 60; const ap = h < 12 ? 'am' : 'pm', hh = h % 12 === 0 ? 12 : h % 12; return hh + ':' + String(x).padStart(2, '0') + ap; };
const DUR = d => d >= 60 ? (d % 60 ? Math.floor(d / 60) + 'h' + String(d % 60).padStart(2, '0') : Math.floor(d / 60) + 'h') : d + 'm';
const DLET = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

function ring(pct, big, small) {
  const R = 32, C = 2 * Math.PI * R;
  const w = el('div', 'ring');
  w.innerHTML =
    '<svg width="74" height="74" viewBox="0 0 74 74">' +
      '<circle cx="37" cy="37" r="' + R + '" fill="none" stroke="#16212c" stroke-width="6"></circle>' +
      '<circle cx="37" cy="37" r="' + R + '" fill="none" stroke="#7ee8fa" stroke-width="6" stroke-linecap="round"' +
      ' stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '"></circle>' +
    '</svg><div class="num">' + esc(big) + '<i>' + esc(small) + '</i></div>';
  return w;
}

/** every habit that wants doing today, with its activity id resolved */
function dueHabits(date) {
  const d = new Date((date || LifeOS.day()) + 'T12:00:00').getDay();
  return Object.values(LifeOS.doc().habits)
    .filter(h => !h.archived)
    .filter(h => h.cadence.type !== 'days' || h.cadence.days[d])
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
}

function drawHome() {
  const home = $('#home'); home.innerHTML = '';
  const doc = LifeOS.doc(), today = LifeOS.day();

  /* ---- today's routine ---- */
  const t = doc.today;
  const cToday = el('div', 'card');
  const blocks = (t && t.date === today) ? (t.blocks || []) : [];
  const done = blocks.filter(b => LifeOS.isDone(b.actId, today)).length;
  cToday.appendChild(el('h2', null,
    'TODAY <span class="c">' + esc(t && t.date === today ? (t.name || 'routine') : '') + '</span>' +
    '<span class="sub">' + (blocks.length ? done + ' / ' + blocks.length + ' checked' : 'nothing scheduled') + '</span>'));

  const rw = el('div', 'ringwrap');
  rw.appendChild(ring(blocks.length ? done / blocks.length : 0, blocks.length ? Math.round(done / blocks.length * 100) + '%' : '—', 'ROUTINE'));
  const st = el('div', 'stats');
  const mins = blocks.reduce((a, b) => a + (b.dur || 0), 0);
  const left = blocks.filter(b => !LifeOS.isDone(b.actId, today)).reduce((a, b) => a + (b.dur || 0), 0);
  st.appendChild(el('div', 'stat', '<b>' + DUR(mins || 0) + '</b><span>PLANNED</span>'));
  st.appendChild(el('div', 'stat acc', '<b>' + DUR(left || 0) + '</b><span>LEFT</span>'));
  st.appendChild(el('div', 'stat', '<b>' + Object.keys(LifeOS.dayLog(today)).length + '</b><span>LOGGED</span>'));
  rw.appendChild(st);
  cToday.appendChild(rw);

  if (!blocks.length) {
    cToday.appendChild(el('div', 'empty',
      (t && t.date !== today ? 'The last plan BLOCK published was for <b>' + esc(t.date) + '</b>. ' : '') +
      'Open <span class="link" onclick="go(\'block\')">BLOCK</span> and today&rsquo;s routine shows up here — ticking it in either place writes to the same log.'));
  } else {
    const list = el('div', 'rowlist');
    blocks.forEach(b => {
      const on = LifeOS.isDone(b.actId, today);
      const r = el('div', 'row' + (on ? ' done' : ''));
      const bar = el('div', 'bar'); if (b.color) bar.style.background = b.color; r.appendChild(bar);
      r.appendChild(el('div', 't', b.s == null ? '' : MIN2(b.s)));
      r.appendChild(el('div', 'n', esc(b.name)));
      if (b.lane) r.appendChild(el('div', 'tag', esc(b.lane)));
      r.appendChild(el('div', 'd', DUR(b.dur || 0)));
      const ck = el('button', 'chk' + (on ? ' on' : ''), '✓');
      ck.title = on ? 'logged today — click to undo' : 'check it off (BLOCK and HABITS both see this)';
      ck.onclick = () => LifeOS.done(b.actId, today, !on, { src: 'home' });
      r.appendChild(ck);
      list.appendChild(r);
    });
    cToday.appendChild(list);
  }

  /* ---- habits ---- */
  const cHab = el('div', 'card');
  const due = dueHabits(today);
  const hdone = due.filter(h => LifeOS.isDone(h.actId, today)).length;
  cHab.appendChild(el('h2', null, 'HABITS<span class="sub">' + (due.length ? hdone + ' / ' + due.length + ' today' : 'none yet') + '</span>'));
  if (!due.length) {
    cHab.appendChild(el('div', 'empty', 'No habits yet. Open <span class="link" onclick="go(\'habits\')">HABITS</span> — anything you already do in BLOCK can be promoted to a habit in one click, and the ticks you have already made count backwards.'));
  } else {
    due.forEach(h => {
      const on = LifeOS.isDone(h.actId, today), sk = LifeOS.streak(h.actId, h.cadence);
      const r = el('div', 'hrow');
      r.appendChild(el('div', 'n', esc(h.name) + '<small>' + esc(cadenceText(h.cadence)) + '</small>'));
      const dots = el('div', 'dots');
      for (let i = 6; i >= 0; i--) {
        const d = LifeOS.shift(today, -i);
        const isDue = h.cadence.type !== 'days' || h.cadence.days[new Date(d + 'T12:00:00').getDay()];
        dots.appendChild(el('i', LifeOS.isDone(h.actId, d) ? 'on' : (isDue ? (i ? 'miss' : '') : 'na')));
      }
      r.appendChild(dots);
      r.appendChild(el('div', 'streak' + (sk ? '' : ' zero'), sk ? '▲' + sk : '—'));
      const ck = el('button', 'chk' + (on ? ' on' : ''), '✓');
      ck.onclick = () => LifeOS.done(h.actId, today, !on, { src: 'home', habitId: h.id });
      r.appendChild(ck);
      cHab.appendChild(r);
    });
  }

  /* ---- momentum ---- */
  const cHeat = el('div', 'card');
  cHeat.appendChild(el('h2', null, 'MOMENTUM<span class="sub">last 16 weeks, everything logged</span>'));
  cHeat.appendChild(heatmap(16));
  const lg = el('div', 'legend', 'LESS');
  ['', 'l1', 'l2', 'l3', 'l4'].forEach(c => lg.appendChild(el('b', c)));
  lg.appendChild(el('span', null, 'MORE'));
  cHeat.appendChild(lg);

  /* ---- apps ---- */
  const cApps = el('div', 'card');
  cApps.appendChild(el('h2', null, 'APPS<span class="sub">press <kbd>1</kbd>–<kbd>' + APPS.length + '</kbd>, <kbd>esc</kbd> for home</span>'));
  const tiles = el('div', 'tiles');
  APPS.filter(a => a.file).forEach(a => {
    const b = el('button', 'tile' + (a.solo ? ' solo' : '') + (missing[a.id] ? ' missing' : ''));
    b.innerHTML = '<span class="ic">' + a.ic + '</span><span class="nm">' + a.nm + '</span><span class="ds">' +
      (missing[a.id] ? '<span style="color:var(--bad)">' + esc(a.file) + ' not found in this folder</span>' : esc(a.ds)) + '</span>' +
      '<span class="pill">' + (a.shares ? esc(a.shares) : 'standalone') + '</span>';
    b.onclick = () => missing[a.id] ? toast('drop <b>' + esc(a.file) + '</b> next to lifeos.html') : go(a.id);
    tiles.appendChild(b);
  });
  cApps.appendChild(tiles);

  const top = el('div', 'grid top'); top.appendChild(cToday); top.appendChild(cHab);
  const bot = el('div', 'grid'); bot.appendChild(cHeat); bot.appendChild(cApps);
  home.appendChild(top); home.appendChild(bot);
}

function cadenceText(c) {
  if (!c) return 'daily';
  if (c.type === 'week') return (c.target || 1) + '× a week';
  if (c.type === 'days') {
    const on = c.days.map((d, i) => d ? i : -1).filter(i => i >= 0);
    if (on.length === 7) return 'daily';
    if (on.join() === '1,2,3,4,5') return 'weekdays';
    if (on.join() === '0,6') return 'weekends';
    return on.map(i => DLET[i]).join('');
  }
  return 'daily';
}

/** columns = weeks, rows = weekday. Intensity = how many things were logged. */
function heatmap(weeks) {
  const wrap = el('div', 'heat');
  const today = LifeOS.day(), dow = new Date(today + 'T12:00:00').getDay();
  let cursor = LifeOS.shift(today, -(dow + 7 * (weeks - 1)));   /* the Sunday that starts the window */
  for (let w = 0; w < weeks; w++) {
    const col = el('div', 'wk');
    for (let d = 0; d < 7; d++) {
      const date = LifeOS.shift(cursor, w * 7 + d);
      const n = Object.keys(LifeOS.doc().log[date] || {}).length;
      const cls = date > today ? 'fut' : n >= 8 ? 'l4' : n >= 5 ? 'l3' : n >= 3 ? 'l2' : n >= 1 ? 'l1' : '';
      const b = el('b', cls); b.title = date + ' — ' + n + ' logged';
      col.appendChild(b);
    }
    wrap.appendChild(col);
  }
  return wrap;
}

/* ══════════════ backup ══════════════
   One file with the shared doc AND every app's private localStorage, because a
   backup that restores half your life is not a backup. */
function backup() {
  const bag = { kind: 'lifeos-backup', v: 1, at: new Date().toISOString(), shared: LifeOS.doc(), local: {} };
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); bag.local[k] = localStorage.getItem(k); }
  const a = el('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(bag)], { type: 'application/json' }));
  a.download = 'lifeos-' + LifeOS.day() + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('backup saved — <b>shared data + every app</b>');
}
function restore(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let bag; try { bag = JSON.parse(fr.result); } catch (e) { return toast('that file is not JSON'); }
    if (bag.kind !== 'lifeos-backup') return toast('not a LifeOS backup');
    if (!confirm('Replace ALL LifeOS data on this device with the backup from ' + (bag.at || '?') + '?')) return;
    Object.keys(bag.local || {}).forEach(k => { try { localStorage.setItem(k, bag.local[k]); } catch (e) {} });
    LifeOS._adopt(bag.shared || {});
    toast('restored — reloading…');
    setTimeout(() => location.reload(), 900);
  };
  fr.readAsText(file);
}

/* ══════════════ boot ══════════════ */
function clock() {
  const d = new Date();
  $('#cDate').textContent = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
  $('#cSub').textContent = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
$('#btnExport').onclick = backup;
$('#btnImport').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = e => { if (e.target.files[0]) restore(e.target.files[0]); e.target.value = ''; };
window.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,[contenteditable]')) return;
  if (e.key === 'Escape') return go('home');
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= APPS.length && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); go(APPS[n - 1].id); }
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1) || 'home'; if (id !== view && app(id)) go(id); });

/* any change from any app repaints home — the frames repaint themselves */
LifeOS.on(() => { if (view === 'home') drawHome(); });
LifeOS.ready(() => {
  LifeOS.prune(800);
  go(location.hash.slice(1) || 'home');
  probe();
});
clock(); setInterval(clock, 20000);
/* midnight: today rolls over, so the home screen must too */
setInterval(() => { if (view === 'home' && $('#home').dataset.d !== LifeOS.day()) { $('#home').dataset.d = LifeOS.day(); drawHome(); } }, 60000);
</script>
</body>
</html>
