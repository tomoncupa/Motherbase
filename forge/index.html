<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mb-version" content="1.0.1, 2026-09-24">

<script src="../shared/mobile.js"></script>

<style>
/* FORGE, built 2026-09-24. Tom: "A program builder - that functions like
   block - that outputs programs I can send to clients. Have it mesh with
   COACH and TRAIN."

   Desktop only, like BLOCK and ARC: used sitting down, with a mouse, to
   build a block of training. So the layout assumes a wide window and a
   pointer, hover is allowed, and a phone-width failure is not a bug. The
   44px targets stay, because they cost nothing with a mouse.

   The furniture is BLOCK's: each DAY is a lane (`mb-card`), each exercise
   in it a plate (`mb-plate`) in its muscle group's colour, the exercises
   you can use sit in a bin down the left, and you drag from the bin into a
   day. The weeks run along the top. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-body);font-size:var(--f-2);
  font-weight:var(--w-body);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
header{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
  padding:calc(var(--s-2) + var(--safe-t)) var(--s-4) var(--s-2);background:var(--surface-1);box-shadow:var(--e-1),var(--rim);position:relative;z-index:2}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em;flex:0 0 auto}
.logo b{color:var(--accent)}
.spacer{flex:1}
#pname{flex:0 1 calc(var(--s-10) * 2.4);min-width:calc(var(--s-10) * 1.3);font-family:var(--font-display);
  font-weight:var(--w-bold);letter-spacing:var(--track-cap)}
.ico{width:var(--tap);height:var(--tap);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  border:0;background:none;color:var(--text-muted);cursor:pointer;border-radius:var(--radius-md)}
.ico:hover{color:var(--text-1);background:var(--surface-2)}
.ico svg{width:var(--s-5);height:var(--s-5)}

/* the weeks */
#weeks{display:flex;align-items:center;gap:var(--s-1)}
#weeks .wk{min-width:var(--tap);height:var(--tap);padding:0 var(--s-2);border:0;border-radius:var(--radius-md);cursor:pointer;
  background:var(--surface-2);color:var(--text-2);font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-cap)}
#weeks .wk.on{box-shadow:inset 0 0 0 2px var(--accent);color:var(--text-1)}
#weeks .wk.has{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:.3em}
#weeks .lbl{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);margin-right:var(--s-1)}

#app{flex:1;min-height:0;display:flex}
#side{flex:0 0 calc(var(--s-10) * 2.3);min-width:0;display:flex;flex-direction:column;gap:var(--s-3);
  padding:var(--s-3) 0 var(--s-3) var(--s-3);min-height:0}
#side .card{padding:var(--s-3)}
#side .progs{flex:0 0 auto;max-height:38%;overflow:auto}
#side .bin{flex:1;min-height:0;display:flex;flex-direction:column}
#binList{flex:1;min-height:0;overflow:auto;margin-top:var(--s-2)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-2)}
.empty{color:var(--text-muted);line-height:var(--lh-body)}
.plist .p{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap);padding:0 var(--s-2);border-radius:var(--radius-md);cursor:pointer}
.plist .p:hover{background:var(--surface-2)}
.plist .p.on{box-shadow:inset 0 0 0 2px var(--accent)}
.plist .p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .p .c{color:var(--text-muted);font-size:var(--f-1);white-space:nowrap}
.plist .sub{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);margin:var(--s-3) 0 var(--s-1)}
.cat{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);font-weight:var(--w-bold);
  padding:var(--s-2) var(--s-1) var(--s-1);display:flex;align-items:center;gap:var(--s-2);position:sticky;top:0;background:var(--surface-1);z-index:1}
.dot{width:var(--s-2);height:var(--s-2);border-radius:var(--radius-full);background:var(--c, var(--accent));flex:0 0 auto}
.bx{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap);padding:0 var(--s-2);border-radius:var(--radius-md);
  cursor:grab;user-select:none}
.bx:hover{background:var(--surface-2)}
.bx .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bx .n{color:var(--text-muted);font-size:var(--f-1)}
.bx.new .nm{color:var(--accent)}

/* the board: one lane per day, side by side, the way BLOCK lays routines */
#board{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#sum{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;padding:var(--s-3) var(--s-4) 0;
  font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap)}
#sum .it{display:inline-flex;align-items:center;gap:var(--s-1)}
#sum b{color:var(--text-1);font-variant-numeric:tabular-nums}
#lanes{flex:1;min-height:0;display:flex;align-items:flex-start;gap:var(--s-3);overflow:auto;padding:var(--s-3) var(--s-4) var(--s-6)}
.lane{flex:0 0 calc(var(--s-10) * 2.35);max-height:100%;display:flex;flex-direction:column;padding:var(--s-2);border-radius:var(--radius-lg)}
.lane.act{box-shadow:inset 0 0 0 1px var(--accent)}
.lane.over{box-shadow:inset 0 0 0 2px var(--accent)}
.lhead{display:flex;align-items:center;gap:var(--s-1);margin-bottom:var(--s-2);cursor:grab}
.lhead .dname{flex:1;min-width:0;min-height:var(--tap);background:none;border:0;border-radius:var(--radius-md);padding:0 var(--s-2);
  font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-3);letter-spacing:var(--track-cap);
  display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.lhead .dname:hover,.lhead .dname:focus{background:var(--surface-2);outline:none}
.lhead .cnt{font-size:var(--f-1);color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.plates{display:flex;flex-direction:column;gap:var(--s-2);min-height:var(--tap);overflow:auto}
.drop{height:0;border-top:2px solid var(--accent);margin:calc(var(--s-1) * -1) 0}
.plate{border-radius:var(--radius-md);padding:var(--s-1) var(--s-2) var(--s-2)}
.phead{display:flex;align-items:center;gap:var(--s-1);cursor:grab;min-height:var(--tap)}
.phead .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--w-bold);font-size:var(--f-3)}
.phead .tag{font-size:var(--f-1);color:var(--text-muted);white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s-1)}
.pgrid label{display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.pgrid label span{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);text-align:center}
.pgrid input{width:100%;min-width:0;min-height:var(--tap);text-align:center;border-radius:var(--radius-sm);
  border:1px solid color-mix(in srgb, var(--c, var(--accent)) 30%, transparent);
  background:color-mix(in srgb, var(--bg) 45%, transparent);font-variant-numeric:tabular-nums;font-size:var(--f-3);padding:0}
.pgrid input:focus{outline:none;border-color:var(--accent)}
.pgrid input::placeholder{color:var(--text-muted);opacity:.8}
.pgrid input.own{color:var(--accent);font-weight:var(--w-bold)}
.pnote{margin-top:var(--s-2);font-size:var(--f-1);color:var(--text-2);line-height:var(--lh-body);cursor:text}
.ladd{margin-top:var(--s-2)}
.ladd input{font-size:var(--f-2)}
.addday{flex:0 0 calc(var(--s-10) * 1.5);min-height:calc(var(--tap) * 2);border:1px dashed var(--border-strong);border-radius:var(--radius-lg);
  background:none;color:var(--text-muted);cursor:pointer;font-family:var(--font-display);letter-spacing:var(--track-cap)}
.addday:hover{color:var(--text-1);border-color:var(--accent)}
.blank{max-width:calc(var(--s-10) * 4);margin:var(--s-8) auto;padding:var(--s-6);text-align:center;display:flex;flex-direction:column;gap:var(--s-4);align-items:center}
.blank b{font-family:var(--font-display);font-size:var(--f-5);letter-spacing:var(--track-cap)}

/* the weeks side by side: the whole block at a glance */
#grid{flex:1;min-height:0;overflow:auto;padding:var(--s-3) var(--s-4) var(--s-6);display:flex;flex-direction:column;gap:var(--s-3)}
#grid .card{padding:var(--s-3)}
table.wt{border-collapse:collapse;width:100%;font-size:var(--f-2)}
table.wt th,table.wt td{padding:var(--s-2);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.wt th{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);font-weight:var(--w-bold)}
table.wt th.w{cursor:pointer}
table.wt th.w.on{color:var(--accent)}
table.wt td.x{font-weight:var(--w-bold);position:sticky;left:0;background:var(--surface-1)}
table.wt td.v{font-variant-numeric:tabular-nums;color:var(--text-muted);cursor:pointer}
table.wt td.v.own{color:var(--text-1)}
table.wt td.v:hover{background:var(--surface-2)}

.pick{display:flex;flex-direction:column;gap:var(--s-1);max-height:55vh;overflow:auto}
.pick button{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap);padding:0 var(--s-3);border:0;border-radius:var(--radius-md);
  background:var(--surface-2);cursor:pointer;text-align:left}
.pick button:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.pick button .nm{flex:1}
.pick button .c{color:var(--text-muted);font-size:var(--f-1)}
.pick .sep{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);margin-top:var(--s-2)}
.form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s-3);align-items:center}
.form label{color:var(--text-muted);font-size:var(--f-1);letter-spacing:var(--track-cap)}

/* the sheet a client reads, printed or saved as a PDF. Paper is white
   whatever the theme, so the page is written in the system's own colours
   for the page and its text rather than in a theme's. */
#print{display:none}
@media print{
  html,body{height:auto;overflow:visible;display:block;background:Canvas;color:CanvasText;color-scheme:light}
  header,#app,.mb-toast{display:none !important}
  #print{display:block;font-family:var(--font-body);font-size:var(--f-2)}
  #print h1{font-family:var(--font-display);font-size:var(--f-6);letter-spacing:var(--track-cap);margin-bottom:var(--s-1)}
  #print .by{color:GrayText;margin-bottom:var(--s-5)}
  #print h2{color:CanvasText;font-size:var(--f-4);margin:var(--s-5) 0 var(--s-2);break-after:avoid}
  #print .wk{break-before:page}
  #print .wk:first-of-type{break-before:auto}
  #print h3{font-size:var(--f-3);margin:var(--s-4) 0 var(--s-1);break-after:avoid}
  #print table{width:100%;border-collapse:collapse;break-inside:avoid}
  #print th,#print td{text-align:left;padding:var(--s-1) var(--s-2);border-bottom:1px solid GrayText}
  #print th{font-size:var(--f-1);letter-spacing:var(--track-cap);color:GrayText}
  #print td.n{font-variant-numeric:tabular-nums}
  #print .cue{color:GrayText;font-size:var(--f-1)}
}
</style>
</head>
<body>
<header>
  <div class="logo">FOR<b>GE</b></div>
  <input class="mb-input" id="pname" placeholder="Program name" aria-label="Program name">
  <div id="weeks"></div>
  <div class="spacer"></div>
  <div id="viewSeg"></div>
  <button class="mb-btn mb-press mb-tap" id="printBtn">PRINT</button>
  <button class="mb-btn go mb-press mb-tap" id="sendBtn">SEND</button>
  <button class="mb-btn mb-press mb-tap" id="setBtn">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>
<div id="app">
  <aside id="side">
    <div class="card mb-card progs"><h2>PROGRAMS</h2><div class="plist" id="plist"></div></div>
    <div class="card mb-card bin"><h2>EXERCISES</h2>
      <input class="mb-input" id="q" placeholder="Find or add an exercise" aria-label="Find or add an exercise">
      <div id="binList"></div></div>
  </aside>
  <section id="board"></section>
</div>
<div id="print"></div>

<script>
/* ══════════════════ FORGE ══════════════════
   Tom only, never in the client build. Build a block of training out of
   weeks, days and exercises, and hand it to a client.

   ── the rows ──
     fprog   one program     key program id          {name, weeks, ord}
     fday    one day         key prog|day id         {name, ord}
     fex     one exercise    key prog|slot id        {day, name, cat, ord,
                                                      n, r, kg, rir, rest,
                                                      note, wk}
   Rows, never a blob: moving one exercise writes one row. A day belongs to
   every week of its program, so a week is not a row of its own; it is a
   column of values on each exercise.

   ── the Algrowrithm ──
   Tom's method, and the reason the numbers here are shaped the way they
   are. Effort is the constant: 0 to 3 reps from a true limit, 95% of the
   time. Reps travel DOWN a range across the sets (8-15 over three sets is
   13-15, then 10-13, then 8-10) and the load goes UP from how the set
   before went that day. So a fixed rep count is wrong on a good day and a
   bad one, set two onwards cannot be written in advance, and a load that
   rises on a calendar step is the wrong kind of progression. What FORGE
   holds is therefore: how many sets, the rep RANGE, the first set's load
   (blank: the client's last), the RIR (blank reads 0-3), and the rest.

   ── the weeks ──
   `n` sets, `r` the rep range as text ("8-15"), `kg` the first set's load
   and `rir` are week one's, on the row. A later week says only what
   CHANGES, in `wk[w]`, and everything it does not say it inherits from the
   week before it. There is no weekly load step: load rises from set one's
   result in the gym, never from the calendar. So week four of a four week
   block is typed once, in week one, and a deload is one week with a few
   numbers changed. An inherited value is drawn as a faded
   placeholder and never written (DOCTRINE law 4, blank means blank); a value
   typed into a later week is drawn in the accent, so which cells were
   decided by hand is visible at a glance. Rest and the coaching note are
   the same every week.

   ── what goes out ──
   COACH owns the program a client gets, `cprog`, and already knows how to
   send one. So FORGE does not grow a second sending path; it PUBLISHES each
   program into COACH's library as `cprog` key `f-<id>` (`src: 'forge'`),
   the way BLOCK publishes today's plan for anything that wants to read it.
   COACH lists it, sends it and puts it on a client, unchanged. SEND here
   does the same two things COACH does, so the round trip is one press:
   onto a client's first sets (`cprog` `c-<pid>`), and out as the file TRAIN
   opens.

   The file is COACH's `motherbase-program`, one day per week per day, each
   carrying `wk` and its plain `day` name, so TRAIN makes one routine per
   week. TRAIN still takes FIRST SETS ONLY (Tom, 2026-09-24, kept from
   2026-09-22): set one's weight travels as a set, its reps left for TRAIN
   to fill from last time, and the number of sets, the rep range, the RIR,
   the rest and the note travel beside it as a target TRAIN shows and never
   logs. */
const APP = { id: 'forge', name: 'Forge', icon: '⚒', blurb: 'build a program, send it to a client',
  types: ['fprog', 'fday', 'fex'] };
Skins.load('../shared/skins.json').then(() => { Skins.restore(APP.id); if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* `cprog` is COACH's, and FORGE writes it (the published programs, and a
   client's first sets on SEND), so it rides this tab too. The exercise
   vocabulary is TRAIN's and a client's own names are COACH's; the clients
   are CHECK IN's. Reading them by name means a device where those apps were
   never opened still has them. */
IO.register({ app: APP.id, name: 'FORGE', types: APP.types.concat(['cprog']),
  reads: { train: ['exercise', 'excat'], coach: ['cex', 'cprog'], checkin: ['cperson'] } });

const esc = UI.esc;
const ico = r => (window.Icons && Icons.svg(r)) || '';
let seq = 0;
const newId = () => Rec.USER + '-' + Date.now().toString(36) + '-' + (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
const opt = (k, d) => { const v = Rec.setting(APP.id, k); return v == null ? d : v; };
/* the unit follows COACH's until it is set here, because the two are read
   side by side */
const unit = () => opt('unit', Rec.setting('coach', 'unit') || 'kg');
const KG_LB = 2.20462;
const r1 = v => Math.round(v * 10) / 10;
const show = kg => kg == null ? '' : String(r1(unit() === 'lb' ? kg * KG_LB : kg));
const toKg = v => { const n = parseFloat(String(v).replace(',', '.')); if (!(n >= 0)) return null; return Math.round((unit() === 'lb' ? n / KG_LB : n) * 1000) / 1000; };
const MAX_WEEKS = 26;

/* ── reading ── */
const progs = () => Rec.map('fprog');
function progList() {
  const m = progs();
  return Object.keys(m).map(k => ({ key: k, p: m[k] }))
    .sort((a, b) => (a.p.ord || 0) - (b.p.ord || 0) || String(a.p.name).localeCompare(String(b.p.name)));
}
/* `Rec.all` hands rows back in no promised order (root brief, Known traps),
   so everything that is a list sorts on `ord` and then on the key, which is
   a timestamp for anything made here. */
const byOrd = (a, b) => (a.v.ord || 0) - (b.v.ord || 0) || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
function daysOf(pid) {
  return Rec.all('fday').filter(r => r.key.indexOf(pid + '|') === 0).map(r => ({ key: r.key, v: r.payload || {} })).sort(byOrd);
}
/* every exercise of a program, by the day it is in */
function exByDay(pid) {
  const out = {};
  Rec.all('fex').forEach(r => {
    if (r.key.indexOf(pid + '|') !== 0) return;
    const v = r.payload || {};
    (out[v.day] || (out[v.day] = [])).push({ key: r.key, v: v });
  });
  Object.keys(out).forEach(d => out[d].sort(byOrd));
  return out;
}

/* ── the weeks ──
   A value for week `w`: week one's off the row, then each later week either
   says it or inherits it. A `step` left on an old row is not read: load
   rises from the set before, not the calendar (the Algrowrithm). */
const WF = ['n', 'r', 'kg', 'rir'];
const has = (o, f) => !!o && Object.prototype.hasOwnProperty.call(o, f);
function val(x, f, w) {
  let v = x[f] == null ? null : x[f];
  for (let i = 2; i <= w; i++) {
    const o = x.wk && x.wk[i];
    if (has(o, f)) v = o[f];
  }
  return v;
}
const isOwn = (x, f, w) => w === 1 ? x[f] != null : has(x.wk && x.wk[w], f);
const weekHasOwn = (x, w) => w > 1 && !!(x.wk && x.wk[w] && WF.some(f => has(x.wk[w], f)));

/* ── words ── */
function restText(s) {
  if (s == null || s === '') return '';
  s = Math.round(+s);
  return s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : s + 's';
}
/* "2:30", "90", "90s", "2m" and "2.5m" all mean what they say. A bare number
   of ten or less is minutes, because nobody rests three seconds, and the box
   shows what it was read as the moment it is left. */
function readRest(t) {
  t = String(t || '').trim().toLowerCase();
  if (!t) return null;
  let m = /^(\d+):(\d{1,2})$/.exec(t);
  if (m) return +m[1] * 60 + +m[2];
  m = /^(\d+(?:\.\d+)?)\s*m(in)?$/.exec(t);
  if (m) return Math.round(+m[1] * 60);
  m = /^(\d+(?:\.\d+)?)\s*s?$/.exec(t);
  if (m) { const n = +m[1]; return n <= 10 ? Math.round(n * 60) : Math.round(n); }
  return undefined;
}
/* A rep range read off what was typed: "8-15", "8 – 15" and "12" all read,
   and anything else is not a range. */
function readReps(t) {
  const m = /^(\d{1,3})(?:\s*(?:-|–|—|to)\s*(\d{1,3}))?$/i.exec(String(t || '').trim());
  if (!m) return undefined;
  const a = +m[1], b = m[2] == null ? null : +m[2];
  if (b == null || a === b) return String(a);
  return Math.min(a, b) + '-' + Math.max(a, b);
}
/* The RIR: a number, or a range such as 0-3. Blank reads as 0-3. */
const RIR_DEFAULT = '0-3';
function readRir(t) {
  const m = /^(\d{1,2}(?:[.,]5)?)(?:\s*(?:-|–|—)\s*(\d{1,2}(?:[.,]5)?))?$/.exec(String(t || '').trim());
  if (!m) return undefined;
  const a = +m[1].replace(',', '.'), b = m[2] == null ? null : +m[2].replace(',', '.');
  if (a > 10 || (b != null && b > 10)) return undefined;
  return b == null || a === b ? String(a) : Math.min(a, b) + '-' + Math.max(a, b);
}
/* The Algrowrithm's bands: a range travelled down across the sets. 8-15
   over three sets is 13-15, 10-13, 8-10, which is the file's own example. */
function bands(range, n) {
  const m = /^(\d+)-(\d+)$/.exec(String(range || ''));
  if (!m || !(n > 1) || n > 8) return '';
  const lo = +m[1], hi = +m[2], step = (hi - lo) / n, out = [];
  for (let i = 0; i < n; i++) {
    const top = Math.round(hi - i * step), bot = Math.round(hi - (i + 1) * step);
    out.push(top === bot ? String(top) : bot + '-' + top);
  }
  return out.join(' · ');
}
function planText(x, w) {
  const n = val(x, 'n', w), r = val(x, 'r', w), kg = val(x, 'kg', w), rir = val(x, 'rir', w);
  const bits = [];
  if (n != null || r != null) bits.push((n != null ? n + ' × ' : '') + (r != null ? r : '?'));
  if (kg != null) bits.push(show(kg) + ' ' + unit());
  bits.push('RIR ' + (rir != null ? rir : RIR_DEFAULT));
  if (x.rest != null) bits.push(restText(x.rest) + ' rest');
  return bits.join(' · ');
}

/* ── the exercises you can use ──
   TRAIN's vocabulary, its 111 movements and whatever Tom has added, with its
   muscle groups and their colour slots; the names clients' own logs carry;
   and every name already in a program here. One entry per name. */
function vocab() {
  const cats = Rec.map('excat'), out = {};
  const put = (name, cat, slot) => {
    const nm = String(name || '').trim();
    if (!nm) return;
    const k = nm.toLowerCase();
    if (out[k] && out[k].cat !== 'Other') return;
    out[k] = { name: nm, cat: cat || 'Other', slot: slot };
  };
  const ex = Rec.map('exercise');
  Object.keys(ex).forEach(k => { const c = cats[ex[k].cat]; put(ex[k].name, c && c.name, c && c.slot); });
  Rec.all('cex').forEach(r => put((r.payload || {}).name));
  Rec.all('fex').forEach(r => put((r.payload || {}).name, (r.payload || {}).cat));
  return out;
}
/* a muscle group's colour: TRAIN's slot for it when TRAIN has one, and a
   stable one from the name otherwise, so a group is one colour everywhere */
let SLOT = {};
function slotsNow() {
  SLOT = {};
  const cats = Rec.map('excat');
  Object.keys(cats).forEach(k => { if (cats[k].name) SLOT[String(cats[k].name).toLowerCase()] = cats[k].slot | 0; });
}
function catColor(cat) {
  const k = String(cat || 'other').toLowerCase();
  let s = SLOT[k];
  if (s == null) { s = 0; for (let i = 0; i < k.length; i++) s = (s * 31 + k.charCodeAt(i)) % 997; }
  return 'var(--data-' + (s % 6 + 1) + ')';

/* ── publishing into COACH ──
   Every change to a program is published to its `cprog` row a moment later,
   so COACH's library is never more than half a second behind, and the
   write is skipped when nothing changed (Rec.set compares). Patched rather
   than set, so a field COACH or a later build adds to the row survives. */
const pubQ = {};
let pubT = null;
function touch(pid) { pubQ[pid] = 1; clearTimeout(pubT); pubT = setTimeout(publishAll, 400); }
function publishAll() {
  clearTimeout(pubT); pubT = null;
  Object.keys(pubQ).forEach(pid => { delete pubQ[pid]; publish(pid); });
}
function flatten(pid) {
  const p = progs()[pid];
  if (!p) return null;
  const weeks = Math.max(1, p.weeks | 0), days = daysOf(pid), EX = exByDay(pid), out = [];
  for (let w = 1; w <= weeks; w++) {
    days.forEach(d => {
      out.push({ name: weeks > 1 ? 'W' + w + ' · ' + (d.v.name || 'Day') : (d.v.name || 'Day'), day: d.v.name || 'Day', wk: w,
        ex: (EX[d.key] || []).filter(e => e.v.name).map(e => {
          const x = e.v, kg = val(x, 'kg', w), r = val(x, 'r', w), n = val(x, 'n', w), rir = val(x, 'rir', w);
          /* set one's load only: its reps are what the client did last time,
             because the range is a target and never a number to hit */
          const o = { name: x.name, sets: kg != null ? [{ kg: kg, r: null }] : [] };
          if (x.cat && x.cat !== 'Other') o.catName = x.cat;
          if (n != null) o.n = n;
          if (r != null) o.reps = String(r);
          if (r != null && n > 1 && bands(r, n)) o.bands = bands(r, n);
          o.rir = rir != null ? String(rir) : RIR_DEFAULT;
          if (x.rest != null) o.rest = x.rest;
          if (x.note) o.note = x.note;
          return o;
        }) });
    });
  }
  return { name: p.name || 'Program', weeks: weeks, days: out };
}
function publish(pid) {
  const f = flatten(pid);

}

function addEx(dayKey, name, cat, at) {

/* Put one exercise at a place in a day, and renumber that day. Only a row

function place(key, dayKey, at) {
  const pid = dayKey.split('|')[0];
  const list = (exByDay(pid)[dayKey] || []).map(e => e.key).filter(k => k !== key);
  list.splice(Math.max(0, Math.min(at, list.length)), 0, key);
  list.forEach((k, i) => {
    const x = Rec.get('fex', null, k);
    if (!x) return;
    const ch = {};
    if ((x.ord | 0) !== i) ch.ord = i;
    if (k === key && x.day !== dayKey) ch.day = dayKey;
    if (Object.keys(ch).length) Rec.patch('fex', null, k, ch);
  });
  touch(pid);
}
function moveDay(pid, dayKey, dir) {
  const days = daysOf(pid).map(d => d.key), i = days.indexOf(dayKey), j = i + dir;
  if (i < 0 || j < 0 || j >= days.length) return;
  days.splice(i, 1); days.splice(j, 0, dayKey);
  days.forEach((k, n) => { const d = Rec.get('fday', null, k); if (d && (d.ord | 0) !== n) Rec.patch('fday', null, k, { ord: n }); });
  touch(pid); draw();
}
function dropDay(pid, dayKey, at) {
  const days = daysOf(pid).map(d => d.key).filter(k => k !== dayKey);
  days.splice(Math.max(0, Math.min(at, days.length)), 0, dayKey);
  days.forEach((k, n) => { const d = Rec.get('fday', null, k); if (d && (d.ord | 0) !== n) Rec.patch('fday', null, k, { ord: n }); });
  touch(pid); draw();

/* Everything a program is, as rows, for a delete to hand back to UNDO. */
function rowsOf(pid) {
  const out = [];
  const p = Rec.get('fprog', null, pid); if (p) out.push(['fprog', pid, p]);
  Rec.all('fday').forEach(r => { if (r.key.indexOf(pid + '|') === 0) out.push(['fday', r.key, r.payload]); });
  Rec.all('fex').forEach(r => { if (r.key.indexOf(pid + '|') === 0) out.push(['fex', r.key, r.payload]); });
  const c = Rec.get('cprog', null, 'f-' + pid); if (c) out.push(['cprog', 'f-' + pid, c]);

}

  draw();

    rows.forEach(([t, k, v]) => Rec.set(t, null, k, v));

}
function duplicateProgram(pid) {

function duplicateDay(pid, dayKey) {

/* A week's own changes wiped, so it inherits again. */
function clearWeek(pid, w, onlyKey) {
  const undo = [];
  Rec.all('fex').forEach(r => {
    if (r.key.indexOf(pid + '|') !== 0 || (onlyKey && r.key !== onlyKey)) return;
    const x = r.payload || {};
    if (!(x.wk && x.wk[w])) return;
    undo.push([r.key, x]);
    Rec.patch('fex', null, r.key, { ['wk.' + w]: undefined });
  });
  touch(pid); draw();
  if (undo.length) UI.undo('Week ' + w + ' follows week ' + (w - 1) + ' again', () => { undo.forEach(([k, v]) => Rec.set('fex', null, k, v)); touch(pid); draw(); });

/* Remove week `w`: every later week's own changes move up one, so what
   week five said is what the new week four says. Removing week one makes
   week two's values the new week one's. */
function removeWeek(pid, w) {
  const p = progs()[pid]; if (!p || (p.weeks | 0) <= 1) return;
  const was = [];
  Rec.all('fex').forEach(r => {
    if (r.key.indexOf(pid + '|') !== 0) return;
    const x = r.payload || {}, nw = {};
    Object.keys(x.wk || {}).forEach(k => {
      const i = +k;
      if (i < w) nw[i] = x.wk[k];
      else if (i > w && i - 1 >= 2) nw[i - 1] = x.wk[k];
    });
    const ch = { wk: nw };
    if (w === 1) WF.forEach(f => { ch[f] = val(x, f, 2); });
    was.push([r.key, x]);
    Rec.patch('fex', null, r.key, ch);
  });
  Rec.patch('fprog', null, pid, { weeks: (p.weeks | 0) - 1 });
  if (wk > (p.weeks | 0) - 1) wk = (p.weeks | 0) - 1;
  touch(pid); draw();
  UI.undo('Week ' + w + ' removed', () => { was.forEach(([k, v]) => Rec.set('fex', null, k, v)); Rec.patch('fprog', null, pid, { weeks: p.weeks }); touch(pid); draw(); });
}

/* ── dragging ──
   HTML drag and drop, because this is a desktop app and a mouse is assumed.
   Three things can be carried: a name from the bin, an exercise already in
   a day, and a day by its head. Every one of them also has a menu route
   (DOCTRINE law 6), so the drag is a shortcut and never the only way. */
let drag = null;
function dropAt(lane, y) {
  const ps = [...lane.querySelectorAll('.plate')];
  for (let i = 0; i < ps.length; i++) {
    const r = ps[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) return i;
  }
  return ps.length;
}
function showMark(lane, at) {
  document.querySelectorAll('.drop').forEach(n => n.remove());
  const box = lane.querySelector('.plates'), ps = box.querySelectorAll('.plate');
  const m = document.createElement('div'); m.className = 'drop';
  if (at < ps.length) box.insertBefore(m, ps[at]); else box.appendChild(m);
}
function clearMarks() {
  document.querySelectorAll('.drop').forEach(n => n.remove());
  document.querySelectorAll('.lane.over').forEach(n => n.classList.remove('over'));
}
function wireLane(lane, dayKey, pid, index) {
  lane.addEventListener('dragover', e => {
    if (!drag) return;
    e.preventDefault();
    if (drag.kind === 'day') { lane.classList.add('over'); return; }
    e.dataTransfer.dropEffect = drag.kind === 'bin' ? 'copy' : 'move';
    lane.classList.add('over');
    showMark(lane, dropAt(lane, e.clientY));
  });
  lane.addEventListener('dragleave', e => { if (!lane.contains(e.relatedTarget)) { lane.classList.remove('over'); lane.querySelectorAll('.drop').forEach(n => n.remove()); } });
  lane.addEventListener('drop', e => {
    if (!drag) return;
    e.preventDefault();
    const d = drag; drag = null; clearMarks();
    if (d.kind === 'day') {
      const r = lane.getBoundingClientRect();
      dropDay(pid, d.key, e.clientX < r.left + r.width / 2 ? index : index + 1);
      return;
    }
    const at = dropAt(lane, e.clientY);
    if (d.kind === 'bin') addEx(dayKey, d.name, d.cat, at);
    else {
      /* moving down inside one day: the plate being carried still counts in
         `at`, so one less */

    const h = document.createElement('h2'); h.textContent = String(d.v.name || 'Day').toUpperCase(); card.appendChild(h);
    const list = EX[d.key] || [];
    if (!list.length) { const e = document.createElement('p'); e.className = 'empty'; e.textContent = 'Nothing in this day yet.'; card.appendChild(e); G.appendChild(card); return; }
    const wrap = document.createElement('div'); wrap.style.overflowX = 'auto';
    const t = document.createElement('table'); t.className = 'wt';
    let hr = '<tr><th>EXERCISE</th>';
    for (let w = 1; w <= weeks; w++) hr += '<th class="w' + (w === wk ? ' on' : '') + '" data-w="' + w + '">WEEK ' + w + '</th>';
    t.innerHTML = hr + '<th>REST</th></tr>';
    list.forEach(e => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="x" style="--c:' + catColor(e.v.cat) + '">' + esc(e.v.name) + '</td>';
      for (let w = 1; w <= weeks; w++) {
        const td = document.createElement('td');
        td.className = 'v' + (w === 1 || weekHasOwn(e.v, w) ? ' own' : '');
        const n = val(e.v, 'n', w), r = val(e.v, 'r', w), kg = val(e.v, 'kg', w), rir = val(e.v, 'rir', w);
        td.textContent = [(n != null || r != null) ? (n != null ? n + '×' : '') + (r ?? '?') : '', kg != null ? show(kg) : '', rir != null ? '@' + rir : ''].filter(Boolean).join(' · ') || '—';
        td.title = 'Week ' + w + ': ' + (planText(e.v, w) || 'nothing set') + (w > 1 && !weekHasOwn(e.v, w) ? ' (follows week ' + (w - 1) + ')' : '');
        td.onclick = () => { wk = w; view = 'board'; Rec.setting(APP.id, 'view', view); seg.select('board'); draw(); };
        tr.appendChild(td);
      }
      const rt = document.createElement('td'); rt.className = 'v own'; rt.textContent = restText(e.v.rest) || '—'; tr.appendChild(rt);
      t.appendChild(tr);
    });
    t.querySelectorAll('th.w').forEach(th => th.onclick = () => { wk = +th.dataset.w; draw(); });
    wrap.appendChild(t); card.appendChild(wrap); G.appendChild(card);
  });
  board.appendChild(G);
}

/* ── the screen ──
   Never redrawn under a box that is being typed in: a row arriving from
   another device waits for the box to be left. */
let pending = false;
function draw() {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && document.getElementById('app').contains(a) && a.id !== 'q') { pending = true; return; }
  drawNow();
}
function drawNow(force) {
  pending = false;
  void force;
  slotsNow();
  if (cur && !progs()[cur]) cur = '';
  if (!cur) { const l = progList(); if (l.length) cur = l[0].key; }
  drawHead();
  drawSide();
  const board = document.getElementById('board');
  const lanes = board.querySelector('#lanes'), keepX = lanes ? lanes.scrollLeft : 0;
  board.innerHTML = '';
  if (!cur) { blank(board); return; }
  if (view === 'grid') drawGrid(board); else drawBoard(board);
  const nl = board.querySelector('#lanes'); if (nl) nl.scrollLeft = keepX;
}
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if (pending && !(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))) drawNow();
}, 0));

function settings() {
  UI.settings(APP.id, [{ id: 'forge', name: 'FORGE', draw: pane => {
    pane.appendChild(UI.row('Weights in', 'How FORGE shows and takes loads. Stored in kilograms, as TRAIN keeps them', UI.segmented(
      [{ id: 'kg', name: 'KG' }, { id: 'lb', name: 'LB' }], unit(), v => { Rec.setting(APP.id, 'unit', v); draw(); })));
    const c = document.createElement('button'); c.type = 'button'; c.className = 'mb-btn mb-press mb-tap'; c.textContent = 'OPEN COACH';
    c.onclick = () => { location.href = '../coach/index.html'; };
    pane.appendChild(UI.row('Where programs go', 'Every program here is in COACH’s PROGRAMS list too. Your name on a file is set in COACH', c));
  } }]);
}

/* A program deleted on another device before its last publish would leave
   its COACH copy behind. Tidied once at start, and only for a program whose
   tombstone is here, so a program whose rows have not arrived yet is left
   alone. */
function tidy() {
  Object.entries(Rec.map('cprog')).forEach(([k, v]) => {
    if (v.src !== 'forge' || k.indexOf('f-') !== 0) return;
    const id = k.slice(2);
    if (!progs()[id] && Rec.tombstone('fprog', null, id)) Rec.del('cprog', null, k);
  });
  progList().forEach(({ key }) => { if (!Rec.get('cprog', null, 'f-' + key)) touch(key); });
}

let rt = null;
Rec.on(() => { clearTimeout(rt); rt = setTimeout(draw, 80); });
Rec.ready(() => { tidy(); draw(); });
if (/[?&]new=1/.test(location.search)) setTimeout(newProgram, 300);
draw();
</script>
