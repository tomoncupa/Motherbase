<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mb-version" content="1.0.0, 2026-10-27">
<title>Motherbase setup</title>
<!--
  The desktop setup, second half. Setup.exe asked "have you used Motherbase
  before?" and installed; Main Menu.exe opens this at
  <origin>/mb-desktop-setup.html?mode=new|existing&base=/Mainmenu-client/
  (desktop/SetupPage.cs). Same origin as the suite, so the store, the Google
  sign-in and STATUS's settings here are the real ones.

  Block, written down: this page is served outside the suite and loads no
  theme, so its tokens are its own, copied from skins.json's first skin.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080B10; --panel: #0E141D; --raised: #131B26; --line: #1E2A38; --line-2: #2B3A4D;
    --ink: #DBE7F0; --ink-2: #B8C9D8; --mut: #7F93A8; --acc: #F0B323; --good: #6EE7A8; --bad: #FF6B81;
    --head: 'Chakra Petch', 'Segoe UI Semibold', system-ui, sans-serif;
    --read: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
    --t-s: 12px; --t-m: 16px; --t-l: 24px; --t-xl: 32px;
    --r: 6px; --tap: 44px; --dur: 120ms;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: var(--t-m)/1.5 var(--read); }
  body { min-height: 100vh; display: flex; justify-content: center; padding: var(--s7) var(--s4); }
  main { width: 100%; max-width: 560px; }
  .brand { font: 600 var(--t-s)/1 var(--head); letter-spacing: .16em; color: var(--acc); }
  .count { font: 500 var(--t-s)/1 var(--head); letter-spacing: .08em; color: var(--mut); float: right; }
  h1 { font: 600 var(--t-xl)/1.2 var(--head); margin: var(--s5) 0 var(--s2); }
  p { margin: 0 0 var(--s4); color: var(--ink-2); max-width: 75ch; }
  .mut { color: var(--mut); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin: var(--s5) 0; }
  .row { display: flex; align-items: center; gap: var(--s4); min-height: var(--tap); padding: var(--s2) var(--s4); border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .what { flex: 1; min-width: 0; }
  .row .help { display: block; color: var(--mut); font-size: var(--t-s); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { min-height: var(--tap); padding: 0 var(--s5); border-radius: var(--r); border: 1px solid var(--line-2);
         background: var(--raised); font: 600 var(--t-m)/1 var(--head); letter-spacing: .06em; text-transform: uppercase; }
  .btn.go { border-color: var(--acc); color: var(--acc); background: var(--panel); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, .sw:focus-visible, .opt:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  @media (hover: hover) { .btn:not(:disabled):hover { border-color: var(--acc); } }
  .bar { display: flex; gap: var(--s3); align-items: center; margin-top: var(--s6); }
  .bar .back { margin-right: auto; background: none; border-color: transparent; color: var(--mut); padding: 0 var(--s3); }
  .sw { width: 52px; height: var(--tap); border: 0; background: none; padding: 0; position: relative; flex: none; }
  .sw::before { content: ''; position: absolute; left: 4px; right: 4px; top: 12px; height: 20px; border-radius: 10px; background: var(--line-2); transition: background var(--dur); }
  .sw::after { content: ''; position: absolute; left: 8px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--mut); transition: transform var(--dur), background var(--dur); }
  .sw[aria-checked="true"]::before { background: var(--raised); box-shadow: inset 0 0 0 1px var(--acc); }
  .sw[aria-checked="true"]::after { transform: translateX(20px); background: var(--acc); }
  .opts { display: grid; gap: var(--s2); margin: var(--s4) 0; }
  .opt { min-height: var(--tap); text-align: left; padding: var(--s3) var(--s4); border-radius: var(--r); border: 1px solid var(--line-2); background: var(--panel); display: flex; align-items: center; gap: var(--s3); }
  .opt::before { content: ''; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--mut); flex: none; }
  .opt[aria-checked="true"] { border-color: var(--acc); }
  .opt[aria-checked="true"]::before { background: var(--acc); border-color: var(--acc); }
  select { min-height: var(--tap); background: var(--raised); color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--r); padding: 0 var(--s3); font: inherit; }
  .say { min-height: var(--s5); margin: var(--s4) 0 0; color: var(--mut); }
  .say.bad { color: var(--bad); }
  .say.good::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: var(--s2); }
  .qr { display: flex; gap: var(--s5); align-items: center; }
  .qr .code { background: var(--ink); padding: var(--s3); border-radius: var(--r); flex: none; }
  .qr .code:empty { display: none; }
  .qr a { color: var(--acc); word-break: break-all; }
  .keys { font: 500 var(--t-m)/1 var(--head); color: var(--acc); }
  #status-frame { position: absolute; width: 1px; height: 1px; left: -10px; top: -10px; border: 0; opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div><span class="brand">MOTHERBASE SETUP</span><span class="count" id="count"></span></div>
  <section id="step"></section>
  <p class="say" id="say" role="status"></p>
  <div class="bar">
    <button class="btn back" id="back" type="button">Back</button>
    <button class="btn" id="skip" type="button" hidden>Later</button>
    <button class="btn go" id="next" type="button">Next</button>
  </div>
</main>
<script>
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var MODE = Q.get('mode') === 'existing' ? 'existing' : 'new';
  var BASE = (Q.get('base') || '/Mainmenu-client/').replace(/\/?$/, '/');
  var SITE = location.origin + BASE;
  var $ = function (id) { return document.getElementById(id); };
  var host = window.chrome && chrome.webview;
  var tell = function (m) { if (host) chrome.webview.postMessage('mbsetup:' + m); };

  /* what the person picked on this computer, sent to the window at the end */
  var desk = { hotkey: 'ctrl+b', top: true, boot: true };
  var F = null;            /* STATUS, opened unseen, so its own code makes its fields */
  var hadData = false;     /* a "first time" account that turns out to have rows */
  var picks = {};          /* settings he changed, written on Next */

  function say(text, kind) { var s = $('say'); s.textContent = text || ''; s.className = 'say' + (kind ? ' ' + kind : ''); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function sw(on, label, help, change) {
    var r = el('div', 'row'), w = el('span', 'what', label), b = el('button', 'sw');
    if (help) w.appendChild(el('span', 'help', help));
    b.type = 'button'; b.setAttribute('role', 'switch'); b.setAttribute('aria-label', label);
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    b.onclick = function () { var v = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', v); change(v); };
    r.appendChild(w); r.appendChild(b); return r;
  }
  function radios(list, cur, change) {
    var box = el('div', 'opts');
    box.setAttribute('role', 'radiogroup');
    list.forEach(function (o) {
      var b = el('button', 'opt', o.label);
      b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', o.id === cur ? 'true' : 'false');
      b.onclick = function () {
        [].forEach.call(box.children, function (c) { c.setAttribute('aria-checked', 'false'); });
        b.setAttribute('aria-checked', 'true'); change(o.id);
      };
      box.appendChild(b);
    });
    return box;
  }

  /* ── the shared files, from the suite this copy opens ── */
  function load(src) {
    return new Promise(function (ok, no) {
      var s = document.createElement('script');
      s.src = SITE + src; s.onload = ok; s.onerror = function () { no(new Error('no connection')); };
      document.head.appendChild(s);
    });
  }
  var shared = load('shared/skins.js').then(function () { return load('shared/records.js'); })
    .then(function () { return load('shared/cloud.js'); })
    .then(function () { if (Rec.need) Rec.need(); });

  function rows() {
    var n = 0;
    ['note', 'ev', 'field', 'set', 'tick', 'meal', 'day'].forEach(function (t) { try { n += Rec.count(t); } catch (e) {} });
    return n;
  }
  function waitFor(test, ms) {
    return new Promise(function (ok) {
      var t0 = Date.now();
      (function tick() { if (test() || Date.now() - t0 > ms) ok(test()); else setTimeout(tick, 250); })();
    });
  }

  /* STATUS makes its own fields the first time it opens. Opening it here,
     unseen, means the list below is STATUS's list, not a copy of it. */
  function openStatus() {
    if (F) return Promise.resolve(F);
    var f = document.createElement('iframe');
    f.id = 'status-frame'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
    f.src = SITE + 'status/index.html';
    document.body.appendChild(f);
    return waitFor(function () {
      var w = f.contentWindow;
      try { return w && w.Rec && w.Rec.count('field') > 0; } catch (e) { return false; }
    }, 30000).then(function (ok) {
      if (!ok) throw new Error('STATUS did not open');
      F = f.contentWindow; return F;
    });
  }
  function setting(k, d) { try { var v = F.Rec.setting('status', k); return v == null ? d : v; } catch (e) { return d; } }

  /* ── the steps ── */
  var SIGNIN = {
    title: 'Sign in',
    draw: function (box) {
      box.appendChild(el('h1', '', 'Sign in with Google'));
      box.appendChild(el('p', '', MODE === 'existing'
        ? 'Use the Google account you signed in with on your phone. Everything you have comes across.'
        : 'Your phone and this computer then hold the same entries. You can do it later in any app, Settings, DATA.'));
      var st = Cloud.state();
      if (st.on && st.email) say('Signed in as ' + st.email + '.', 'good');
      $('next').textContent = st.on ? 'Next' : 'Sign in';
      $('skip').hidden = MODE === 'existing' || st.on;
    },
    next: function () {
      if (Cloud.state().on) return afterSignIn();
      say('Opening Google…');
      return Cloud.signIn().then(function () {
        say('Signed in as ' + (Cloud.state().email || 'you') + '.', 'good');
        return afterSignIn();
      });
    }
  };
  function afterSignIn() {
    say('Fetching what this account holds…');
    return waitFor(function () { return Cloud.state().loaded; }, 20000).then(function () {
      var n = rows();
      if (MODE === 'new' && Rec.count('field') > 0) hadData = true;
      say(n ? n.toLocaleString() + ' entries are on this computer.' : 'Signed in as ' + Cloud.state().email + '.', 'good');
    });
  }

  var TRACK = {
    title: 'Track',
    skip: function () { return hadData; },
    draw: function (box) {
      box.appendChild(el('h1', '', 'What do you want to track?'));
      box.appendChild(el('p', '', 'Each one is a tile on STATUS. Change them any time in STATUS, Settings.'));
      var card = el('div', 'card');
      card.appendChild(el('div', 'row mut', 'Opening STATUS…'));
      box.appendChild(card);
      openStatus().then(function () {
        card.textContent = '';
        var list = Object.keys(F.Rec.map('field')).map(function (id) { var f = F.Rec.map('field')[id]; f.id = id; return f; })
          .filter(function (f) { return f.label; })
          .sort(function (a, b) { return (a.order || 99) - (b.order || 99); });
        list.forEach(function (f) {
          card.appendChild(sw(!!f.on, f.label, f.unit ? 'In ' + f.unit : '', function (v) { picks['field:' + f.id] = v ? 1 : 0; }));
        });
        card.appendChild(sw(!!setting('countCal', 1), 'Count calories', 'A Food tab for meals, calories and protein.',
          function (v) { picks.countCal = v ? 1 : 0; }));
      }).catch(function (e) { card.textContent = ''; card.appendChild(el('div', 'row', 'STATUS did not open. Set these later in STATUS, Settings.')); });
    }
  };

  var EVERY = [
    { id: '60', label: 'About every hour', min: 60, max: 90 },
    { id: '120', label: 'About every 2 hours', min: 120, max: 150 },
    { id: '180', label: 'About every 3 hours', min: 180, max: 210 },
    { id: 'off', label: 'Never' }
  ];
  function hourName(h) { return h === 0 || h === 24 ? '12am' : h === 12 ? '12pm' : h < 12 ? h + 'am' : (h - 12) + 'pm'; }
  function hours(from, to, cur, change) {
    var s = el('select');
    for (var h = from; h <= to; h++) { var o = el('option', '', hourName(h)); o.value = h; if (h === cur) o.selected = true; s.appendChild(o); }
    s.onchange = function () { change(+s.value); };
    return s;
  }
  var CHECK = {
    title: 'Check',
    skip: function () { return hadData; },
    draw: function (box) {
      box.appendChild(el('h1', '', 'How often should STATUS check in?'));
      box.appendChild(el('p', '', 'The status check asks your mood and energy. It fills the screen until you answer, and waits while you are away from the computer.'));
      var mount = el('div');
      box.appendChild(mount);
      openStatus().then(function () {
        var on = !!setting('desk.on', 1), min = +setting('desk.min', 60);
        var cur = !on ? 'off' : (EVERY.filter(function (e) { return e.min === min; })[0] || EVERY[0]).id;
        mount.appendChild(radios(EVERY, cur, function (id) { picks.every = id; }));
        var card = el('div', 'card'), r = el('div', 'row');
        r.appendChild(el('span', 'what', 'Between'));
        r.appendChild(hours(5, 12, +setting('desk.from', 8), function (v) { picks.from = v; }));
        r.appendChild(el('span', 'mut', 'and'));
        r.appendChild(hours(17, 24, +setting('desk.to', 21), function (v) { picks.to = v; }));
        card.appendChild(r); mount.appendChild(card);
      }).catch(function () { mount.appendChild(el('p', 'mut', 'STATUS did not open. Set this later in STATUS, Settings.')); });
    }
  };

  var KEYS = [
    { id: 'ctrl+b', label: 'Ctrl + B' },
    { id: 'ctrl+shift+b', label: 'Ctrl + Shift + B' },
    { id: 'alt+b', label: 'Alt + B' }
  ];
  var PC = {
    title: 'This computer',
    draw: function (box) {
      box.appendChild(el('h1', '', 'The STATUS widget'));
      box.appendChild(el('p', '', 'A small window in the corner with your last entry. A shortcut writes a new one from inside any program.'));
      box.appendChild(el('p', 'mut', 'Shortcut to write an entry'));
      box.appendChild(radios(KEYS, desk.hotkey, function (id) { desk.hotkey = id; }));
      var card = el('div', 'card');
      card.appendChild(sw(desk.top, 'Keep it above other windows', 'Off, it hides behind whatever is open.', function (v) { desk.top = v; }));
      card.appendChild(sw(desk.boot, 'Start it with Windows', 'It is there every time you turn the computer on.', function (v) { desk.boot = v; }));
      box.appendChild(card);
    }
  };

  var PHONE = {
    title: 'Phone',
    draw: function (box) {
      var link = SITE + 'status/index.html';
      box.appendChild(el('h1', '', 'On your phone'));
      box.appendChild(el('p', '', 'Point your phone camera at this. Add the page to your home screen, then sign in with the same Google account in Settings, DATA.'));
      var q = el('div', 'qr'), code = el('div', 'code'), a = el('a', '', link);
      a.href = link; a.target = '_blank'; a.rel = 'noopener';
      q.appendChild(code); q.appendChild(a); box.appendChild(q);
      /* the code is drawn by a small library; without a connection to it
         the link alone stays, which is still the whole instruction */
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s.onload = function () {
        try { new QRCode(code, { text: link, width: 160, height: 160, colorDark: '#080B10', colorLight: '#DBE7F0' }); } catch (e) {}
      };
      document.head.appendChild(s);
    }
  };

  var DONE = {
    title: 'Done',
    draw: function (box) {
      var k = (KEYS.filter(function (x) { return x.id === desk.hotkey; })[0] || KEYS[0]).label;
      box.appendChild(el('h1', '', 'Ready'));
      box.appendChild(el('p', '', 'STATUS opens in the top right corner. Every app is in this window, from the home screen.'));
      var card = el('div', 'card');
      var r = el('div', 'row'); r.appendChild(el('span', 'what', 'Write an entry from anywhere')); r.appendChild(el('span', 'keys', k)); card.appendChild(r);
      card.appendChild(el('div', 'row', 'Both are on your desktop and in the Start menu as Motherbase and STATUS.'));
      box.appendChild(card);
      $('next').textContent = 'Open Motherbase';
    },
    next: function () { tell('done'); return new Promise(function () {}); }
  };

  /* write only what he changed (a setting is written when the person changes it) */
  function saveStatus() {
    if (!F) return;
    Object.keys(picks).forEach(function (k) {
      if (k.indexOf('field:') === 0) F.Rec.patch('field', null, k.slice(6), { on: picks[k] });
    });
    if ('countCal' in picks) F.Rec.setting('status', 'countCal', picks.countCal);
    if ('every' in picks) {
      var e = EVERY.filter(function (x) { return x.id === picks.every; })[0];
      if (picks.every === 'off') F.Rec.setting('status', 'desk.on', 0);
      else { F.Rec.setting('status', 'desk.on', 1); F.Rec.setting('status', 'desk.min', e.min); F.Rec.setting('status', 'desk.max', e.max); }
    }
    if ('from' in picks) F.Rec.setting('status', 'desk.from', picks.from);
    if ('to' in picks) F.Rec.setting('status', 'desk.to', picks.to);
    picks = {};
  }

  var STEPS = MODE === 'existing' ? [SIGNIN, PC, DONE] : [SIGNIN, TRACK, CHECK, PC, PHONE, DONE];
  var at = 0;
  function shown() { return STEPS.filter(function (s) { return !s.skip || !s.skip(); }); }
  function draw() {
    var list = shown(), s = STEPS[at], box = $('step');
    box.textContent = ''; say('');
    $('count').textContent = 'STEP ' + (list.indexOf(s) + 1) + ' OF ' + list.length;
    $('back').style.visibility = at === 0 ? 'hidden' : 'visible';
    $('skip').hidden = true;
    $('next').textContent = 'Next';
    $('next').disabled = false;
    s.draw(box);
  }
  function move(by) {
    do { at += by; } while (STEPS[at] && STEPS[at].skip && STEPS[at].skip());
    at = Math.max(0, Math.min(STEPS.length - 1, at));
    draw();
  }
  $('next').onclick = function () {
    var s = STEPS[at], b = $('next'), was = b.textContent;
    b.disabled = true; b.textContent = 'Working…';
    Promise.resolve(s.next ? s.next() : null).then(function () {
      if (s === CHECK || s === TRACK) saveStatus();
      if (STEPS[at + 1] === DONE) tell('prefs|' + desk.hotkey + '|' + (desk.top ? 1 : 0) + '|' + (desk.boot ? 1 : 0));
      move(1);
    }).catch(function (e) {
      say(String(e && e.message || e), 'bad');
      b.disabled = false; b.textContent = was;
    });
  };
  $('back').onclick = function () { move(-1); };
  $('skip').onclick = function () { move(1); };

  $('next').disabled = true;
  say('Connecting…');
  shared.then(draw).catch(function () {
    say('No connection. Setup needs the internet once; connect and press Try again.', 'bad');
    $('next').disabled = false; $('next').textContent = 'Try again';
    $('next').onclick = function () { location.reload(); };
    $('back').style.visibility = 'hidden';
  });
})();
</script>
</body>
</html>
