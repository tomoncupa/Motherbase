<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}

header{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim)}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}

main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-8) + var(--safe-b))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-3)}

.card{border-radius:var(--radius-lg);background:var(--surface-1);
  padding:var(--s-4);box-shadow:var(--e-1),var(--rim)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-3)}
h3{font-size:var(--f-1);font-weight:var(--w-bold);letter-spacing:var(--track-cap);
  color:var(--text-muted);margin:var(--s-4) 0 var(--s-2);text-transform:uppercase}
h3:first-child{margin-top:0}
.note{color:var(--text-muted);font-size:var(--f-2);line-height:var(--lh-body)}

/* ---- the one block of inputs ---- */
.grid{display:grid;gap:var(--s-3)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.f label{display:block;font-size:var(--f-2);color:var(--text-muted);margin-bottom:var(--s-1)}
.f input,.f select{width:100%;min-height:var(--tap);
  background:var(--surface-2);color:var(--text-1);
  border:var(--border-width) solid var(--border);border-radius:var(--radius-md);
  padding:0 var(--s-3);font:inherit;font-variant-numeric:tabular-nums}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:1px}
.f .hint{font-size:var(--f-2);color:var(--text-muted);margin-top:var(--s-1);line-height:var(--lh-body)}
.sw{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap);
  background:var(--surface-2);border:var(--border-width) solid var(--border);
  border-radius:var(--radius-md);padding:0 var(--s-3);cursor:pointer}
.sw input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}

/* a group of inputs that folds away, so the block at the top stays short */
details{border-top:var(--border-width) solid var(--border);padding-top:var(--s-3);margin-top:var(--s-3)}
details:first-of-type{border-top:0;margin-top:0;padding-top:0}
summary{cursor:pointer;min-height:var(--tap);display:flex;align-items:center;
  font-size:var(--f-1);font-weight:var(--w-bold);letter-spacing:var(--track-cap);
  color:var(--text-muted);text-transform:uppercase;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';margin-right:var(--s-2);color:var(--accent)}
details[open]>summary::before{content:'▾'}
details>.grid,details>.note{margin-top:var(--s-3)}

/* ---- goals ---- */
.goal{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3);
  padding:var(--s-3) 0;border-top:var(--border-width) solid var(--border)}
.goal:first-child{border-top:0}
.goal .gl{font-size:var(--f-2);color:var(--text-muted)}
.goal .gn{font-family:var(--font-display);font-size:var(--f-4);font-weight:var(--w-bold);
  color:var(--accent);white-space:nowrap}
.goal .gw{font-size:var(--f-2);color:var(--text-muted);flex:1;line-height:var(--lh-body)}

/* ---- drink cards ---- */
.cards{display:grid;gap:var(--s-3);grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.vessel{border-radius:var(--radius-lg);background:var(--surface-1);padding:var(--s-4);
  box-shadow:var(--e-1),var(--rim);border:2px solid transparent;display:flex;flex-direction:column}
.vessel.over{border-color:var(--accent)}
.vessel.no{border-color:var(--danger)}
.vtop{display:flex;align-items:center;gap:var(--s-2)}
.vname{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);text-transform:uppercase;flex:1;min-width:0}
.voff{flex:0 0 auto;min-width:var(--tap);min-height:var(--tap);margin:calc(var(--s-2) * -1) calc(var(--s-2) * -1) 0 0;
  background:none;border:0;cursor:pointer;color:var(--text-muted);font-size:var(--f-4);line-height:1}
.voff:hover{color:var(--danger)}
.vtick{flex:0 0 auto;width:var(--tap);height:var(--tap);margin:calc(var(--s-2) * -1) 0 0 calc(var(--s-2) * -1);
  border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.vtick span{width:28px;height:28px;border-radius:50%;border:2px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;color:var(--accent-fg);font-size:var(--f-2);line-height:1}
.vtick.on span{background:var(--accent);border-color:var(--accent)}
.vtick:disabled{opacity:.3;cursor:default}
.vessel.done{opacity:.65}
.dose.taken{cursor:default}
.vsize{font-size:var(--f-2);color:var(--text-muted);margin-bottom:var(--s-3)}
.dose{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3);
  padding:var(--s-3) 0;border-top:var(--border-width) solid var(--border);cursor:grab}
.dose:first-of-type{border-top:0}
.dose.drag{opacity:.4}
.dl{font-size:var(--f-2);color:var(--text-muted)}
.dl small{display:block;color:var(--text-muted);opacity:.75}
.da{font-family:var(--font-display);font-size:var(--f-4);font-weight:var(--w-bold);
  color:var(--accent);white-space:nowrap}
.da small{font-family:var(--font-body);font-size:var(--f-2);font-weight:var(--w-body);
  color:var(--text-muted);display:block;text-align:right}
.vnil{font-size:var(--f-2);color:var(--success);padding:var(--s-3) 0}

/* ---- table ---- */
table{width:100%;border-collapse:collapse;font-size:var(--f-2)}
th,td{padding:var(--s-2) var(--s-2);text-align:right;border-top:var(--border-width) solid var(--border)}
th{color:var(--text-muted);font-weight:var(--w-body);text-transform:uppercase;letter-spacing:var(--track-cap)}
th:first-child,td:first-child{text-align:left}
.ok{color:var(--success)}.warnc{color:var(--warn)}.badc{color:var(--danger)}

/* ---- gauges, the look protocol.html's Ceilings had ---- */
.gauge{margin-bottom:var(--s-4)}
.grow{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3);margin-bottom:var(--s-2)}
.gtrack{height:8px;border-radius:999px;background:var(--surface-2);position:relative;overflow:visible}
.gfill{height:100%;border-radius:999px;background:var(--success);transition:width var(--dur-fast) var(--ease-out)}
.gfill.warn{background:var(--warn)}.gfill.over{background:var(--danger)}
.glimit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.gsub{font-size:var(--f-2);color:var(--text-muted);margin-top:var(--s-2)}
.eye{background:none;border:0;cursor:pointer;color:var(--text-muted);
  min-width:var(--tap);min-height:var(--tap);font-size:var(--f-3)}
.eye.off{opacity:.45}

/* ---- notes ---- */
.flag{border-radius:var(--radius-md);padding:var(--s-3);font-size:var(--f-2);
  line-height:var(--lh-body);margin-top:var(--s-3)}
.flag.bad{background:var(--surface-2);color:var(--danger);
  border-left:3px solid var(--danger)}
.flag.warn{background:var(--surface-2);color:var(--warn);
  border-left:3px solid var(--warn)}
.flag.info{background:var(--surface-2);color:var(--text-muted);
  border-left:3px solid var(--border-strong)}
.src{font-size:var(--f-2);color:var(--text-muted)}
.fact{border-radius:var(--radius-md);background:var(--surface-2);padding:var(--s-4)}
.frow{padding:var(--s-3) 0;border-top:var(--border-width) solid var(--border)}
.frow:first-of-type{border-top:0}
.fk{font-size:var(--f-2);color:var(--accent);letter-spacing:var(--track-cap);text-transform:uppercase;margin-bottom:var(--s-1)}
.ft{font-size:var(--f-2);color:var(--text-1);line-height:var(--lh-body)}
.note a{color:var(--accent)}
.row{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header>
  <div class="logo">ELE<b>MENT</b></div>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" onclick="IO.sync(APP.id)">SYNC</button>
  <button class="mb-btn mb-press mb-tap" onclick="openSettings()">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>
<main class="mb-scroll"><div class="wrap" id="main"></div></main>

<script>
/* ══════════════════════════ ELEMENT ══════════════════════════

   Called MIX until 2026-09-22, when Tom renamed it. The folder and the app id
   stay `mix`, the way FOODDÉX's stayed `portion`: settings, the card layout
   and the switched-off drinks are saved under the id, and renaming it would
   drop every one of them.

   What to weigh out today, in grams, on a 0.001 g scale.

   It replaces protocol.html, which asked you to type every food by hand and
   then measured you against fixed targets. Two things changed. The food comes
   from STATUS, because you already log it there and typing it twice is how
   two numbers start disagreeing. And the targets move with the day: sodium
   against what you actually sweat, magnesium against what you actually weigh.

   THE ONE THING TO UNDERSTAND, because it is the whole point of priority 1.
   Sodium base is the average sodium your FOOD gave you over the last seven
   whole days. Not the total you ate - the food half. The salt this app tells
   you to add is subtracted back out before the average is taken.

   Without that subtraction the number climbs by itself: today's added salt
   lands in STATUS, tomorrow reads it as food, the base goes up, tomorrow's
   dose goes up, and a week later you are eating a gram more than you were
   with nothing on screen saying why. Priority 1 is "keep the sodium I retain
   the same every day", and a base that ratchets is the exact opposite of it.  */

const APP = {
  id: 'mix',
  name: 'ELEMENT',
  icon: '◉',
  blurb: 'what to weigh out today, in grams',
  types: ['dose'],
};

Skins.load('../shared/skins.json').then(() => {
  Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true });
  Rec.ready(draw);
});
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* `reads` is what makes this work on a device where STATUS was never opened:
   the sync pulls STATUS's and TRAIN's own tabs, not just ours. */
IO.register({ app: APP.id, name: APP.name, types: APP.types,
  reads: { status: ['meal', 'food', 'ev', 'field', 'day'], train: ['session', 'set'] } });

const S = {
  get(k, d) { const v = Rec.setting(APP.id, k); return v == null ? d : v; },
  set(k, v) { Rec.setting(APP.id, k, v); },
};

const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = UI.esc;
const num = (s, d) => { const v = parseFloat(String(s).replace(/,/g, '')); return isFinite(v) ? v : d; };
const r0 = v => Math.round(v).toLocaleString('en-US');
const r1 = v => (Math.round(v * 10) / 10).toLocaleString('en-US');
const r2 = v => (Math.round(v * 100) / 100).toLocaleString('en-US');
const g3 = v => v.toFixed(3);                       /* every powder, to the scale's last digit */
const clamp0 = v => Math.max(0, v);

/* ══════════════ THE FOOD TABLE ══════════════
   Per 100 g as eaten. Thirteen of these came over from protocol.html
   unchanged. Four are new and marked `usda`, because they were typed from
   USDA FoodData Central rather than carried over, and nothing here has been
   checked against a live lookup - so the app says which ones they are rather
   than quietly mixing them in with the rest.

   zn zinc mg · mg magnesium mg · k potassium mg · na sodium mg · ca calcium mg
   cu copper mg · ch choline mg · va preformed vitamin A mcg                  */
const F = {
  chkOn:     { nm: 'Chicken, skin on',   kcal: 165.8, p: 17.6, c: 0,    f: 10.6, zn: 1.6, mg: 25,  k: 230, na: 80,   ca: 12,   cu: .08, ch: 70,  va: 15 },
  chkOff:    { nm: 'Chicken, skinless',  kcal: 112,   p: 19.4, c: 0,    f: 3.9,  zn: 1.8, mg: 27,  k: 250, na: 85,   ca: 12,   cu: .08, ch: 75,  va: 8 },
  liver:     { nm: 'Beef liver',         kcal: 135,   p: 20.4, c: 3.9,  f: 3.6,  zn: 4.0, mg: 18,  k: 313, na: 69,   ca: 5,    cu: 9.8, ch: 330, va: 4970 },
  giz:       { nm: 'Gizzard',            kcal: 94,    p: 17.7, c: 0,    f: 2.1,  zn: 2.7, mg: 15,  k: 179, na: 69,   ca: 11,   cu: .1,  ch: 80,  va: 0 },
  pot:       { nm: 'Potato',             kcal: 87,    p: 2.0,  c: 20.1, f: .1,   zn: .3,  mg: 23,  k: 379, na: 5,    ca: 8,    cu: .19, ch: 13,  va: 0 },
  rice:      { nm: 'Rice',               kcal: 130,   p: 2.7,  c: 28,   f: .3,   zn: .5,  mg: 12,  k: 35,  na: 1,    ca: 10,   cu: .07, ch: 2,   va: 0 },
  dilis:     { nm: 'Dilis',              kcal: 210,   p: 45,   c: 0,    f: 4,    zn: 3.0, mg: 100, k: 400, na: 3500, ca: 2300, cu: .5,  ch: 100, va: 15 },
  sard:      { nm: 'Sardines',           kcal: 208,   p: 24.6, c: 0,    f: 11.5, zn: 1.3, mg: 39,  k: 397, na: 505,  ca: 382,  cu: .19, ch: 75,  va: 32 },
  pechay:    { nm: 'Pechay',             kcal: 12,    p: 1.6,  c: 1.8,  f: .2,   zn: .2,  mg: 11,  k: 250, na: 34,   ca: 105,  cu: .02, ch: 6,   va: 0 },
  saluyot:   { nm: 'Saluyot',            kcal: 34,    p: 4.6,  c: 5.8,  f: .25,  zn: .8,  mg: 64,  k: 559, na: 8,    ca: 184,  cu: .26, ch: 8,   va: 0 },
  malunggay: { nm: 'Malunggay',          kcal: 64,    p: 9.4,  c: 8.3,  f: 1.4,  zn: .6,  mg: 147, k: 337, na: 9,    ca: 185,  cu: .1,  ch: 10,  va: 0 },
  kangkong:  { nm: 'Kangkong',           kcal: 19,    p: 2.6,  c: 3.1,  f: .2,   zn: .2,  mg: 71,  k: 312, na: 113,  ca: 77,   cu: .2,  ch: 6,   va: 0 },
  kalabasa:  { nm: 'Kalabasa',           kcal: 26,    p: 1.0,  c: 6.5,  f: .1,   zn: .3,  mg: 12,  k: 340, na: 1,    ca: 21,   cu: .13, ch: 8,   va: 0 },
  brocc:     { nm: 'Broccoli',           kcal: 34,    p: 2.8,  c: 6.6,  f: .4,   zn: .41, mg: 21,  k: 316, na: 33,   ca: 47,   cu: .049, ch: 18.7, va: 0, usda: 1 },
  carrot:    { nm: 'Carrot',             kcal: 41,    p: .9,   c: 9.6,  f: .2,   zn: .24, mg: 12,  k: 320, na: 69,   ca: 33,   cu: .045, ch: 8.8,  va: 0, usda: 1 },
  egg:       { nm: 'Egg, whole',         kcal: 143,   p: 12.6, c: .7,   f: 9.5,  zn: 1.29, mg: 12, k: 138, na: 142,  ca: 56,   cu: .072, ch: 293.8, va: 160, usda: 1 },
  banana:    { nm: 'Banana',             kcal: 89,    p: 1.1,  c: 22.8, f: .3,   zn: .15, mg: 27,  k: 358, na: 1,    ca: 5,    cu: .078, ch: 9.8,  va: 0, usda: 1 },
};
const NUTS = ['kcal', 'p', 'c', 'f', 'zn', 'mg', 'k', 'na', 'ca', 'cu', 'ch', 'va'];

/* Reading a logged meal's NAME back into the table. STATUS keeps sodium,
   potassium and calcium on the meal itself, so this is only ever asked for
   the five it does not keep: zinc, magnesium, copper, choline, vitamin A.
   Order matters - liver before chicken, skinless before chicken. */
const MATCH = [
  [/liver|atay/i, 'liver'],
  [/gizzard|balunbalunan/i, 'giz'],
  [/dilis|anchov/i, 'dilis'],
  [/sardin/i, 'sard'],
  [/pechay|bok\s*choy/i, 'pechay'],
  [/saluyot|jute/i, 'saluyot'],
  [/malunggay|moringa/i, 'malunggay'],
  [/kangkong|water\s*spinach/i, 'kangkong'],
  [/kalabasa|squash|pumpkin/i, 'kalabasa'],
  [/broccoli|brocolli/i, 'brocc'],
  [/carrot/i, 'carrot'],
  [/banana|saging/i, 'banana'],
  [/egg|itlog/i, 'egg'],
  [/potato|patatas/i, 'pot'],
  [/rice|kanin/i, 'rice'],
  [/skinless.*chicken|chicken.*skinless/i, 'chkOff'],
  [/chicken|manok/i, 'chkOn'],
];
const matchFood = name => { for (const [re, k] of MATCH) if (re.test(name || '')) return k; return null; };

/* ══════════════ INPUTS ══════════════
   One table, so a default lives in exactly one place and the settings row,
   the reset and the reader all read the same number. */
const IN = [
  ['sess',   120,  'Session minutes'],
  ['bike',   40,   'Biking minutes, round trip'],
  ['walk',   0,    'Walking minutes'],
  ['rLift',  .5,   'Lifting sweat, L per hour'],
  ['rBike',  1.0,  'Biking sweat, L per hour'],
  ['rWalk',  .3,   'Walking sweat, L per hour'],
  ['sweatNa', 830, 'Sweat sodium, mg per L'],
  ['repl',   75,   'Sweat replacement, %'],
  ['preNa',  1000, 'Pre-workout sodium, mg'],
  ['sweatK', 200,  'Sweat potassium, mg per L'],
  ['kRatio', 1.7,  'Potassium per sodium, mg:mg'],
  ['kFloor', 4700, 'Potassium floor, mg'],
  ['mgKg',   6,    'Magnesium per kg bodyweight, mg'],
  ['znT',    36,   'Zinc total target, mg'],
  ['pctNa',  39.3, 'Table salt, % sodium'],
  ['pctK',   36.2, 'Potassium citrate, % potassium'],
  ['pctZn',  28,   'Zinc glycinate, % zinc'],
  ['pctMg',  11,   'Magnesium glycinate, % magnesium'],
  ['capK',   5.0,  'Potassium citrate max per day, g'],
  ['capK1',  1000, 'Potassium single dose cap, mg'],
  ['capZn1', 20,   'Zinc single-dose cap, mg'],
  ['capZnT', 40,   'Zinc total ceiling, mg'],
  ['capMg',  350,  'Magnesium supplement cap, mg'],
  ['win',    21,   'Micro window, days'],
  ['pitch',  2,    'Number of day pitchers'],
  ['trainAt', '17:00', 'Training starts'],
  ['bed',    '22:30', 'Bedtime'],
  ['saltCut', '18:00', 'No salt on food after'],
  ['litres', 1.0,  'Litres per pitcher'],
  ['splitK', 50,   'Potassium, % in day pitchers'],
  ['splitMg', 50,  'Magnesium, % with meal'],
  ['bw',     null, 'Bodyweight'],
  ['yield',  72,   'Bone yield, edible %'],
  ['drip',   25,   'Fat lost to the pan, %'],
  ['skin',   'on', 'Chicken skin'],
];
const DEF = {}; IN.forEach(([k, v]) => { DEF[k] = v; });
const v = k => {
  const raw = S.get('in.' + k, null);
  const d = DEF[k];
  if (typeof d === 'string') return raw == null || raw === '' ? d : String(raw);
  return raw == null ? d : (num(raw, d) == null ? d : num(raw, d));
};
const setV = (k, val) => S.set('in.' + k, val);

/* the manual food block: everything protocol.html asked for, kept for the
   days STATUS has nothing in it, or for a food it has never heard of */
const MANUAL = ['chk', 'liver', 'giz', 'pot', 'rice', 'kalabasa', 'pechay', 'saluyot',
  'malunggay', 'kangkong', 'dilis', 'sard', 'brocc', 'carrot', 'egg', 'banana'];
const mv = k => num(S.get('man.' + k, 0), 0) || 0;

/* ══════════════ WHAT THE DAY GAVE YOU ══════════════ */
const today = () => Day.today();
const mealsOn = d => Rec.all('meal', { date: d }).map(r => Object.assign({ key: r.key }, r.payload));

/* The salt and citrate this app logs back into STATUS. Deterministic keys, so
   logging twice in one day updates one row rather than stacking two, and so
   the sodium base can find them again and take them out. */
const MIX_MEAL = { salt: 'mix-salt', cit: 'mix-cit' };
const isMixMeal = key => key === MIX_MEAL.salt || key === MIX_MEAL.cit;

/* ── one meal's micros ──
   From the food itself when the food carries them, which since 2026-09-22
   is any food FOODDÉX looked up in the USDA. The meal's `mult` is how many
   of the food's own servings it was, so the food's figures times that is
   the meal. Only when the food does not have a figure does the name table
   answer, and only when that fails too does the meal count as unread. */
const MICRO = ['zn', 'mg', 'cu', 'ch', 'va'];
function mealMicros(m) {
  const out = { zn: 0, mg: 0, cu: 0, ch: 0, va: 0, liver: 0, read: 0, from: '' };
  const fd = m.fid ? (Rec.get('food', null, m.fid) || null) : null;
  const mult = num(m.mult, null);
  const key = matchFood(m.name);
  const grams = (m.unit === 'g' || m.unit === 'ml') ? (num(m.amt, 0) || 0) : 0;
  MICRO.forEach(n => {
    const fv = fd && fd.base ? num(fd.base[n], null) : null;
    if (fv != null && mult > 0) { out[n] = fv * mult; out.read = 1; out.from = 'food'; return; }
    if (key && grams > 0) { out[n] = F[key][n] * grams / 100; out.read = 1; if (!out.from) out.from = 'table'; }
  });
  if (key === 'liver' && grams > 0) out.liver = grams;
  return out;
}

/* Today's food, from STATUS plus anything typed in by hand. Sodium, potassium
   and calcium come off the meal rows themselves. The other five are worked out
   from the food table by name, and any meal that could not be named or was not
   logged in grams is handed back so the screen can say so. */
function fromStore(d) {
  const t = {}; NUTS.forEach(n => { t[n] = 0; });
  const unnamed = [], mixed = [];
  mealsOn(d).forEach(m => {
    if (isMixMeal(m.key)) { mixed.push(m); return; }      /* our own doses are not food */
    t.na += num(m.na, 0) || 0;
    t.k  += num(m.k, 0) || 0;
    t.ca += num(m.ca, 0) || 0;
    t.kcal += num(m.kcal, 0) || 0;
    t.p += num(m.p, 0) || 0; t.c += num(m.c, 0) || 0; t.f += num(m.f, 0) || 0;
    const mm = mealMicros(m);
    if (mm.read) MICRO.forEach(n => { t[n] += mm[n]; });
    else unnamed.push(m.name + ((m.unit === 'g' || m.unit === 'ml') ? '' : ' (not logged in grams)'));
  });
  return { t: t, unnamed: unnamed, mixed: mixed, n: mealsOn(d).length - mixed.length };
}

function fromManual() {
  const t = {}; NUTS.forEach(n => { t[n] = 0; });
  const add = (food, grams) => { if (grams > 0) NUTS.forEach(n => { t[n] += (food[n] || 0) * grams / 100; }); };
  MANUAL.forEach(k => {
    if (k === 'chk') {
      const edible = mv('chk') * v('yield') / 100;
      const src = v('skin') === 'on' ? F.chkOn : F.chkOff;
      const cf = Object.assign({}, src);
      cf.f = cf.f * (1 - v('drip') / 100);
      cf.kcal = cf.p * 4 + cf.c * 4 + cf.f * 9;
      add(cf, edible);
    } else add(F[k], mv(k));
  });
  return t;
}

/* ── the sodium base ──
   Seven WHOLE days, yesterday backwards. Today is half-eaten and would drag
   the average down every morning. Only days with food logged count, so a
   week away does not read as a week of zero sodium. */
function sodiumBase() {
  const out = [];
  for (let i = 1; i <= 7; i++) {
    const d = Day.shift(today(), -i);
    const ms = mealsOn(d);
    const real = ms.filter(m => !isMixMeal(m.key));
    if (!real.length) continue;
    out.push({ d: d, na: real.reduce((a, m) => a + (num(m.na, 0) || 0), 0) });
  }
  if (out.length < 3) {
    const f = fromStore(today()).t.na + fromManual().na;
    return { base: f, days: out.length, settled: false };
  }
  return { base: out.reduce((a, x) => a + x.na, 0) / out.length, days: out.length, settled: true };
}

/* Bodyweight in kg. STATUS keeps weight in whatever unit the field says, and
   the field ships in pounds. Typing a number here overrides it. */
function bodyKg() {
  const typed = v('bw');
  const f = Rec.get('field', null, 'weight') || {};
  const unit = (f.unit || 'lb').toLowerCase();
  if (typed != null) return unit === 'kg' ? typed : typed / 2.20462;
  for (let i = 0; i <= 30; i++) {
    const r = Rec.get('ev', Day.shift(today(), -i), 'weight');
    if (r && r.e && r.e.length) {
      const last = r.e[r.e.length - 1].v;
      return unit === 'kg' ? last : last / 2.20462;
    }
  }
  return null;
}
const trainedToday = () => {
  const o = S.get('in.trained', null);
  if (o != null) return !!o;
  return !!Rec.get('session', today(), '') || Rec.all('set', { date: today() }).length > 0;
};
const sessionMin = () => {
  const o = S.get('in.sess', null);
  if (o != null) return num(o, DEF.sess);
  const s = Rec.get('session', today(), '');
  if (s && s.start && s.end) return Math.round((s.end - s.start) / 60000);
  return DEF.sess;
};

/* ══════════════ THE STORED MICROS ══════════════

   Tom, 2026-09-20: a kilo of beef liver over three weeks.

   Preformed vitamin A and copper are not spent the way sodium is. They are
   stored, mostly in the liver, so what matters is the average over weeks and
   not what any one day looked like. Measuring them against a daily ceiling
   makes the gauge say two things and neither is true: on a liver day it reads
   five times over, and on the other twenty days it reads almost nothing. One
   of those is a red line nobody should act on and the other is a green line
   that has not been earned.

   A kilo of liver over 21 days is the case. That is 49,700 mcg of vitamin A,
   which is 2,367 a day, under the 3,000 ceiling. Read one day at a time, the
   day he ate 330 g of it reads 16,400 and the gauge screams. Same food, same
   three weeks, opposite answers - so the window is the honest unit and the
   day is not.

   The window is his, default 21 days, because that is the rhythm he actually
   eats it on. Calcium and choline stay on the day, because those are spent
   daily and a three-week average would hide a week of missing both.

   One limit, said on the screen rather than hidden: the window reads STATUS's
   meals only. Anything typed into "Food not in STATUS" counts for today and
   cannot count for a day that has gone.                                     */
function windowRead() {
  const days = Math.max(1, Math.round(v('win')));
  const t = { zn: 0, mg: 0, cu: 0, ch: 0, va: 0, ca: 0 };
  let liver = 0, seen = 0;
  for (let i = 0; i < days; i++) {
    const d = Day.shift(today(), -i);
    const ms = mealsOn(d).filter(m => !isMixMeal(m.key));
    if (ms.length) seen++;
    ms.forEach(m => {
      t.ca += num(m.ca, 0) || 0;
      const mm = mealMicros(m);
      MICRO.forEach(n => { t[n] += mm[n]; });
      liver += mm.liver;
    });
  }
  /* today's typed-in food is one day inside the window, counted once */
  const man = fromManual();
  ['zn', 'mg', 'cu', 'ch', 'va', 'ca'].forEach(n => { t[n] += man[n]; });
  liver += mv('liver');
  const per = {}; Object.keys(t).forEach(n => { per[n] = t[n] / days; });
  return { days: days, per: per, liver: liver, seen: seen };
}

/* ══════════════ CLOCKS ══════════════ */
const hm = t => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const clock = mins => {
  if (mins == null) return '';
  mins = ((Math.round(mins) % 1440) + 1440) % 1440;
  const h = Math.floor(mins / 60), m = mins % 60;
  return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM');
};
const nowMins = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
/* When training starts: TRAIN's own clock if a session is running today,
   otherwise the time he set. A TRAIN session is a fact; the setting is a
   plan, so the fact wins. */
function trainStart() {
  const s = Rec.get('session', today(), '');
  if (s && s.start) { const d = new Date(s.start); return { m: d.getHours() * 60 + d.getMinutes(), from: 'TRAIN' }; }
  return { m: hm(v('trainAt')), from: 'set' };
}

/* ══════════════ HOW MUCH GETS IN ══════════════

   Tom picked this one, 2026-09-22: show what each zinc and magnesium dose
   actually delivers, not only what goes in the glass.

   Zinc is read straight off Tran and Miller's measured points, joined by
   straight lines, and flat past the last one. No curve is fitted here,
   because a fitted curve is a second claim on top of the study and these
   six points are the study. They measured zinc sulfate in water after a
   meal, which is close to the best case there is, so every number this
   gives is labelled "at best".

   Magnesium has no dose study of that quality for glycinate, so it gets the
   range from the literature, 20 to 25%, and says it is a range.           */
const ZN_CURVE = [[0, 0], [2.2, 1.6], [5.2, 3.5], [10.4, 7.4], [15.2, 9.5], [20.3, 11.0], [30.1, 11.2]];
function znAbs(mg) {
  if (!(mg > 0)) return 0;
  for (let i = 1; i < ZN_CURVE.length; i++) {
    const a = ZN_CURVE[i - 1], b = ZN_CURVE[i];
    if (mg <= b[0]) return a[1] + (b[1] - a[1]) * (mg - a[0]) / (b[0] - a[0]);
  }
  return ZN_CURVE[ZN_CURVE.length - 1][1];
}
const MG_ABS = [.20, .25];

/* ══════════════ THE MATHS ══════════════ */
function compute() {
  const store = fromStore(today());
  const man = fromManual();
  const food = {}; NUTS.forEach(n => { food[n] = store.t[n] + man[n]; });

  const base = sodiumBase();
  const trained = trainedToday();
  const sess = sessionMin();

  /* Sweat is sweat. The bike happens on rest days too, so its loss is
     replaced on rest days too; only the pre-workout floor waits for a
     session. Without this a rest day with a 40-minute round trip replaced
     nothing, which is 550 mg of sodium walked out of the door. */
  const sweatL = (trained ? sess / 60 * v('rLift') : 0)
    + v('bike') / 60 * v('rBike') + v('walk') / 60 * v('rWalk');
  const sweatNa = sweatL * v('sweatNa');
  const replace = sweatNa * v('repl') / 100;

  const naGoal = base.base + (trained ? Math.max(v('preNa'), replace) : replace);
  /* Potassium is measured against the sodium you HOLD, not the sodium you
     sweat out and put back. A litre of sweat costs about 200 mg of potassium
     and about 830 mg of sodium, so scaling potassium by the sweat-inflated
     sodium goal asks for roughly five times the potassium you actually lost,
     and the citrate cap binds every training day for no reason. */
  const kGoal = Math.max(v('kFloor'), base.base * v('kRatio') + sweatL * v('sweatK'));
  const kg = bodyKg();
  const mgGoal = kg == null ? null : kg * v('mgKg');
  const znGoal = v('znT');

  /* ---- sodium ---- */
  const naAdd = clamp0(naGoal - food.na);
  const preSalt = trained ? Math.min(v('preNa'), naAdd) : 0;
  const bottleSalt = trained ? clamp0(Math.min(naAdd - preSalt, replace - preSalt)) : 0;
  const foodSalt = clamp0(naAdd - preSalt - bottleSalt);

  /* ---- potassium ---- */
  const kRoom = v('capK') * v('pctK') * 10;              /* g × %  → mg of element */
  const kWant = clamp0(kGoal - food.k);
  const kSupp = Math.min(kWant, kRoom);
  const kShort = clamp0(kWant - kSupp);
  const kDay = kSupp * v('splitK') / 100;
  const kNight = kSupp - kDay;
  const pitchers = Math.max(0, Math.round(v('pitch')));

  /* ---- zinc ----
     The gap can be bigger than one dose is allowed to be. Rather than stop at
     the single-dose cap and quietly miss the target, the rest goes with the
     food: zinc on a full stomach is better tolerated than zinc fasted, and
     the total still stops at the ceiling. */
  const znRoom = clamp0(v('capZnT') - food.zn);
  const znWant = Math.min(clamp0(znGoal - food.zn), znRoom);
  const znNight = Math.min(v('capZn1'), znWant);
  const znMeal = clamp0(znWant - znNight);

  /* ---- magnesium ---- */
  const mgSupp = mgGoal == null ? 0 : Math.min(v('capMg'), clamp0(mgGoal - food.mg));
  const mgMeal = mgSupp * v('splitMg') / 100;
  const mgNight = mgSupp - mgMeal;

  const grams = (mg, pct) => mg / (pct / 100) / 1000;

  /* Every dose is one row in one list. The cards are a view over it, which is
     what makes dragging one from here to there a change of one word. */
  const doses = [];
  for (let i = 0; i < pitchers; i++) {
    doses.push({ id: 'k-p' + (i + 1), nut: 'k', name: 'Potassium citrate',
      mg: kDay / pitchers, g: grams(kDay / pitchers, v('pctK')), home: 'pitcher' + (i + 1) });
  }
  if (!pitchers && kDay > 0) {
    doses.push({ id: 'k-am', nut: 'k', name: 'Potassium citrate',
      mg: kDay, g: grams(kDay, v('pctK')), home: 'meal' });
  }
  doses.push({ id: 'k-night', nut: 'k', name: 'Potassium citrate', mg: kNight, g: grams(kNight, v('pctK')), home: 'night' });
  doses.push({ id: 'salt-pre', nut: 'na', name: 'Table salt', mg: preSalt, g: grams(preSalt, v('pctNa')), home: 'pre' });
  doses.push({ id: 'salt-bottle', nut: 'na', name: 'Table salt', mg: bottleSalt, g: grams(bottleSalt, v('pctNa')), home: 'bottle' });
  doses.push({ id: 'salt-food', nut: 'na', name: 'Salt on food', mg: foodSalt, g: grams(foodSalt, v('pctNa')), home: 'meal' });
  doses.push({ id: 'mg-meal', nut: 'mg', name: 'Magnesium glycinate', mg: mgMeal, g: grams(mgMeal, v('pctMg')), home: 'meal' });
  doses.push({ id: 'mg-night', nut: 'mg', name: 'Magnesium glycinate', mg: mgNight, g: grams(mgNight, v('pctMg')), home: 'night' });
  doses.push({ id: 'zn-meal', nut: 'zn', name: 'Zinc glycinate', mg: znMeal, g: grams(znMeal, v('pctZn')), home: 'meal' });
  doses.push({ id: 'zn-night', nut: 'zn', name: 'Zinc glycinate', mg: znNight, g: grams(znNight, v('pctZn')), home: 'night' });

  /* ── what has already gone down ──
     Tom, 2026-09-22: tick each drink as it is taken, instead of one LOG
     button that claimed the night drink before it was drunk.

     A ticked dose is a fact and keeps the number it had when it was
     ticked. What is still to take is worked out from what is left: the
     day's total for that mineral, minus what is already in you, shared
     across the untaken doses in the proportions they had. So logging more
     food at 3 PM shrinks the doses still to come, and never rewrites the
     one you drank at 9 AM. */
  const took = {};
  Rec.all('dose', { date: today() }).forEach(r => { took[r.key] = r.payload; });
  Object.keys(took).forEach(id => {
    if (!doses.some(d => d.id === id)) {
      const t = took[id];
      doses.push({ id: id, nut: t.nut, name: ({ na: 'Table salt', k: 'Potassium citrate', zn: 'Zinc glycinate', mg: 'Magnesium glycinate' })[t.nut] || id,
        mg: 0, g: 0, home: t.slot || 'meal' });
    }
  });
  ['na', 'k', 'zn', 'mg'].forEach(n => {
    const mine = doses.filter(d => d.nut === n);
    const total = mine.reduce((a, d) => a + d.mg, 0);
    const done = mine.filter(d => took[d.id]).reduce((a, d) => a + (num(took[d.id].mg, 0) || 0), 0);
    const rest = mine.filter(d => !took[d.id]);
    const was = rest.reduce((a, d) => a + d.mg, 0);
    const f = was > 0 ? clamp0(total - done) / was : 0;
    rest.forEach(d => { d.mg *= f; d.g *= f; });
    mine.filter(d => took[d.id]).forEach(d => {
      d.mg = num(took[d.id].mg, 0) || 0; d.g = num(took[d.id].g, 0) || 0; d.taken = 1; d.at = took[d.id].t;
    });
  });
  const supp = { na: 0, k: 0, zn: 0, mg: 0 };
  doses.forEach(d => { supp[d.nut] += d.mg; });
  const znPlan = znNight + znMeal;
  const ts = trainStart();

  return {
    store: store, food: food, base: base, trained: trained, sess: sess,
    sweatL: sweatL, sweatNa: sweatNa, replace: replace,
    naGoal: naGoal, kGoal: kGoal, mgGoal: mgGoal, znGoal: znGoal, kg: kg,
    naAdd: naAdd, kShort: kShort, kRoom: kRoom, pitchers: pitchers,
    doses: doses, supp: supp, znPlan: znPlan, znWant: znWant, tStart: ts.m, tFrom: ts.from,
  };
}

/* ══════════════ IS THIS FOOD UP TO DATE ══════════════

   Tom, 2026-09-21: "Put the sync time on MIX so I know its reading up to
   date food data."

   It is the only app in the suite where the question has teeth. Everywhere
   else a stale read shows you yesterday's screen and you notice. Here it
   comes out as a number of grams to put in your mouth, and a MIX reading
   a store that last heard from the phone this morning will confidently tell
   you to add salt for food you already ate.

   So it says the time, and it says it in the header where the answer is,
   not buried in a settings panel. Both roads are named because they fail
   separately: the sheet is the slow one everything rides on, live sync is
   the fast one that only exists once a config is pasted. */
function syncLine() {
  const out = [];
  let stale = 1;
  try {
    const m = IO.mirror && IO.mirror.settings;
    if (!m || !m.url) out.push('<b>no sync link on this device</b>');
    else if (!m.at) out.push('<b>linked, never synced</b>');
    else { out.push('sheet ' + esc(m.at)); stale = 0; }
  } catch (e) { out.push('sheet unknown'); }
  try {
    const c = window.Cloud && Cloud.state();
    if (c && c.has) {
      if (c.live && c.ok) { out.push('live sync on'); stale = 0; }
      else if (c.live) out.push('live sync connecting');
      else out.push('<b>live sync off</b>');
    }
  } catch (e) {}
  return { html: out.join(' · '), stale: stale };
}

/* ══════════════ WHICH DRINKS EXIST TODAY ══════════════

   Tom, 2026-09-21: "Put toggles to disable certain drinks."

   A drink switched off does not make its dose disappear, because the dose
   is what his body is short of and the card is only furniture. It moves to
   the first drink that is on and is allowed to hold it, which for salt is
   never the night drink. Nothing is ever silently dropped. */
const offSet = () => S.get('off', {}) || {};
const slotOn = id => !offSet()[id];
function setSlotOn(id, on) {
  const o = Object.assign({}, offSet());
  if (on) delete o[id]; else o[id] = 1;
  S.set('off', o);
}

/* ══════════════ LAYOUT ══════════════
   Which card each dose sits in. Kept as a setting row rather than in
   localStorage, because a setting row is in the backup and reaches the
   laptop; localStorage is one browser on one machine and is silently
   emptied by iOS after a week of not visiting. */
const layout = () => S.get('layout', {}) || {};
const legal = (d, id) => !(d.nut === 'na' && id === 'night');
/* where a dose actually lands: where he dragged it, or its home, and then
   the first live drink that will take it if that one is switched off */
function slotOf(d, L, live) {
  const want = L[d.id] || d.home;
  if (!live) return want;
  const ids = live.map(x => x.id);
  if (ids.indexOf(want) > -1 && legal(d, want)) return want;
  const from = Math.max(0, ids.indexOf(want));
  for (let i = 0; i < ids.length; i++) {
    const id = ids[(from + i) % ids.length];
    if (legal(d, id)) return id;
  }
  return ids[0];
}
const ALL_SLOTS = c => {
  const s = [];
  for (let i = 1; i <= c.pitchers; i++) s.push({ id: 'pitcher' + i, nm: 'DAY PITCHER ' + i, sub: r1(v('litres')) + ' L' });
  const st = c.tStart, src = c.tFrom === 'TRAIN' ? 'from TRAIN' : 'from your setting';
  if (c.trained) s.push({ id: 'pre', nm: 'PRE-WORKOUT',
    sub: st == null ? '30 to 60 minutes before' : 'about ' + clock(st - 45) + ', 45 minutes before a ' + clock(st) + ' start ' + src });
  if (c.trained) s.push({ id: 'bottle', nm: 'TRAINING BOTTLE',
    sub: st == null ? 'sipped through the session' : clock(st) + ' to ' + clock(st + c.sess) + ', through the session' });
  /* Tom, 2026-09-20: "I don't want it to assume any meals." It used to say
     WITH CHICKEN MEAL, which is a guess about what is on the plate, and a
     card that guesses wrong every time he eats something else is a card he
     has to translate before he can use it. It names the moment instead. */
  s.push({ id: 'meal', nm: 'WITH FOOD', sub: 'whichever meal you are eating · salt before ' + clock(hm(v('saltCut'))) });
  s.push({ id: 'night', nm: 'NIGHT DRINK', sub: 'at ' + clock(hm(v('bed'))) + ' · no sodium, ever' });
  return s;
};
/* the ones actually on. Never empty: with every drink switched off there is
   nowhere for a dose to go, so the last one standing cannot be switched off. */
const SLOTS = c => {
  const on = ALL_SLOTS(c).filter(x => slotOn(x.id));
  return on.length ? on : ALL_SLOTS(c).slice(-1);
};

/* ══════════════ DRAWING ══════════════ */
let C = null;

function draw() {
  C = compute();
  const m = $('#main');
  m.innerHTML = '';
  /* Tom, 2026-09-21: "I want the pitchers near the top."
     The first spec said every input at the top and every result below it,
     which is the right shape for a form you fill in and the wrong one for a
     screen you open to be told a number. He opens this to find out what to
     weigh, and the inputs are a thing he touches once a week. So the answer
     is first and the working is underneath it. */
  m.appendChild(cardsBlock(C));
  m.appendChild(goalsCard(C));
  m.appendChild(tableCard(C));
  m.appendChild(inputsCard());
  m.appendChild(microsCard(C));
  m.appendChild(factsCard());
  if (window.Icons) Icons.paint();
}

/* ---- the block at the top ---- */
function field(k, label, opts) {
  opts = opts || {};
  const w = el('div', 'f');
  w.appendChild(el('label', null, esc(label)));
  let i;
  if (opts.select) {
    i = el('select');
    opts.select.forEach(([val, txt]) => {
      const o = el('option', null, esc(txt)); o.value = val;
      if (String(v(k)) === String(val)) o.selected = true;
      i.appendChild(o);
    });
    i.onchange = () => { setV(k, i.value); draw(); };
  } else if (opts.time) {
    i = el('input');
    i.type = 'time';
    i.value = v(k);
    i.onchange = () => { setV(k, i.value || null); draw(); };
  } else {
    i = el('input');
    i.type = 'number'; i.step = opts.step || 'any';
    /* An `auto` box is one the store can answer for itself, so it shows the
       stored override if there is one and the derived number if there is not.
       Showing the default here while the maths used TRAIN's session length is
       how a screen starts disagreeing with itself. */
    const cur = opts.manual ? mv(k) : (opts.auto != null && S.get('in.' + k, null) == null ? opts.auto : v(k));
    i.value = cur == null ? '' : cur;
    if (opts.placeholder) i.placeholder = opts.placeholder;
    i.onchange = () => {
      const val = i.value === '' ? null : num(i.value, null);
      if (opts.manual) S.set('man.' + k, val || 0); else setV(k, val);
      draw();
    };
  }
  i.setAttribute('aria-label', label);
  w.appendChild(i);
  if (opts.hint) w.appendChild(el('div', 'hint', opts.hint));
  return w;
}

/* ---- the drink cards, and dragging a dose between them ---- */
function cardsBlock(c) {
  const box = el('div');
  const head = el('div', 'card');
  head.appendChild(el('h2', null, 'WHAT TO WEIGH'));
  const n = c.store.n;
  const sy = syncLine();
  head.appendChild(el('p', 'src', 'Drawn at <b>'
    + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + '</b> · '
    + n + ' meal' + (n === 1 ? '' : 's') + ' logged today'
    + (c.kg != null ? ' · ' + r1(c.kg * 2.20462) + ' lb' : ' · no weight found')
    + (c.trained ? ' · trained' : ' · rest day')));
  const sl = el('p', sy.stale ? 'flag warn' : 'src', (sy.stale ? 'Food may be out of date: ' : 'Food is up to date: ') + sy.html
    + (sy.stale ? '. Press SYNC, above.' : '.'));
  head.appendChild(sl);
  head.appendChild(el('p', 'note', 'Drag any line into another card. Salt can never go in the night drink.'));
  const row = el('div', 'row');
  row.style.marginTop = 'var(--s-3)';
  const reset = el('button', 'mb-btn mb-press mb-tap', 'RESET LAYOUT');
  reset.onclick = () => { S.set('layout', {}); Mobile.feedback('success'); draw(); };
  row.appendChild(reset);
  row.appendChild(el('span', 'src', 'Tick a drink when it has gone down. What is left recalculates around it.'));
  head.appendChild(row);
  box.appendChild(head);

  const L = layout();
  const live = SLOTS(c);
  const gone = ALL_SLOTS(c).filter(x => live.indexOf(x) < 0);
  if (gone.length) {
    const chips = el('div', 'row');
    chips.style.marginTop = 'var(--s-3)';
    chips.appendChild(el('span', 'src', 'SWITCHED OFF:'));
    gone.forEach(x => {
      const b = el('button', 'mb-btn mb-press mb-tap', esc(x.nm) + ' +');
      b.setAttribute('aria-label', 'Switch ' + x.nm + ' back on');
      b.onclick = () => { setSlotOn(x.id, true); Mobile.feedback('success'); draw(); };
      chips.appendChild(b);
    });
    head.appendChild(chips);
  }
  const grid = el('div', 'cards');
  grid.style.marginTop = 'var(--s-3)';
  live.forEach(s => {
    const card = el('div', 'vessel');
    card.dataset.slot = s.id;
    const top = el('div', 'vtop');
    top.appendChild(el('div', 'vname', esc(s.nm)));
    /* One drink must stay on, or a dose has nowhere to land. The last one
       says so rather than going dead under the finger. */
    const mineNow = c.doses.filter(d => slotOf(d, L, live) === s.id && d.mg > 0.5);
    const allTaken = mineNow.length > 0 && mineNow.every(d => d.taken);
    if (allTaken) card.classList.add('done');
    const tick = el('button', 'vtick mb-tap' + (allTaken ? ' on' : ''), '<span>' + (allTaken ? '✓' : '') + '</span>');
    tick.setAttribute('aria-label', (allTaken ? 'Untick ' : 'Tick ') + s.nm);
    tick.disabled = !mineNow.length;
    tick.onclick = () => tickCard(c, mineNow, !allTaken, s.id);
    top.insertBefore(tick, top.firstChild);
    const x = el('button', 'voff mb-tap', '×');
    x.setAttribute('aria-label', 'Switch off ' + s.nm);
    x.onclick = () => {
      if (live.length < 2) { UI.toast('One drink has to stay on'); return; }
      setSlotOn(s.id, false); Mobile.feedback('open'); draw();
    };
    top.appendChild(x);
    card.appendChild(top);
    card.appendChild(el('div', 'vsize', esc(s.sub)));
    const mine = c.doses.filter(d => slotOf(d, L, live) === s.id && d.mg > 0.5);
    if (!mine.length) {
      card.appendChild(el('div', 'vnil', s.id === 'bottle' ? 'Plain water' : 'Nothing here'));
    }
    mine.forEach(d => card.appendChild(doseRow(d)));

    /* a card refuses what it is not allowed to hold, and says so in colour
       before the finger lets go rather than after */
    card.ondragover = e => {
      const id = DRAG;
      if (!id) return;
      const d = c.doses.filter(x => x.id === id)[0];
      if (!d) return;
      if (!legal(d, s.id)) { card.classList.add('no'); return; }
      e.preventDefault();
      card.classList.add('over');
    };
    card.ondragleave = () => card.classList.remove('over', 'no');
    card.ondrop = e => {
      e.preventDefault();
      card.classList.remove('over', 'no');
      const d = c.doses.filter(x => x.id === DRAG)[0];
      if (!d) return;
      if (!legal(d, s.id)) { UI.toast('No sodium in the night drink, ever'); Mobile.haptic('warn'); return; }
      const L2 = Object.assign({}, layout());
      L2[d.id] = s.id;
      S.set('layout', L2);
      Mobile.feedback('success');
      draw();
    };
    grid.appendChild(card);
  });
  box.appendChild(grid);

  box.appendChild(warnings(c));
  return box;
}

    ? '<small>' + g3(d.g / v('litres')) + ' g per litre</small>' : '');
  r.appendChild(left);
  const right = el('div', 'da');
  let absorbed = '';
  if (d.nut === 'zn' && d.mg > 0.5) absorbed = '<small>about ' + r1(znAbs(d.mg)) + ' mg gets in, at best</small>';
  if (d.nut === 'mg' && d.mg > 0.5) absorbed = '<small>about ' + r0(d.mg * MG_ABS[0]) + ' to ' + r0(d.mg * MG_ABS[1]) + ' mg gets in</small>';
  right.innerHTML = g3(d.g) + ' g<small>' + r0(d.mg) + ' mg ' + ({ na: 'sodium', k: 'potassium', zn: 'zinc', mg: 'magnesium' })[d.nut] + '</small>' + absorbed
    + (d.taken && d.at ? '<small>taken ' + clock(new Date(d.at).getHours() * 60 + new Date(d.at).getMinutes()) + '</small>' : '');
  r.appendChild(right);
  r.ondragstart = e => { DRAG = d.id; r.classList.add('drag'); try { e.dataTransfer.setData('text/plain', d.id); } catch (x) {} };
  r.ondragend = () => { DRAG = null; r.classList.remove('drag'); document.querySelectorAll('.vessel').forEach(v2 => v2.classList.remove('over', 'no')); };
  return r;
}

/* ---- warnings ---- */
function warnings(c) {
  const w = el('div');
  if (c.food.na >= c.naGoal) {
    w.appendChild(el('div', 'flag bad', 'Food covered sodium. Add no salt today.'));
  }
  /* ── what a swing actually is ──
     Comparing the day's TOTAL against the base fires on every training day,
     because a training day is the base plus a gram of sweat replacement by
     design. A warning that is on every time you train is one you stop
     reading, and then it is not there on the day it means something.

     What priority 1 wants held steady is the sodium you KEEP: the total
     minus what went out in sweat and came straight back. That sits on the
     base on a normal day, training or not, and moves only when you have
     actually eaten off your usual. */
  const kept = c.food.na + c.supp.na - c.replace;
  if (c.base.settled && c.base.base > 0 && Math.abs(kept - c.base.base) / c.base.base > .2) {
    w.appendChild(el('div', 'flag warn', 'Big sodium swing = water swing for 2-3 days. After sweat, today keeps '
      + r0(kept) + ' mg against a base of ' + r0(c.base.base) + '.'));
  }
  /* ── the 6 PM rule, which nothing enforced ──
     Salt eaten late is the salt his face holds overnight, and it is priority
     1. Only the salt on FOOD is checked: pre-workout and bottle salt replace
     what training sweats out, whenever training happens to be. */
  const cut = hm(v('saltCut'));
  const lateSalt = c.doses.filter(d => d.id === 'salt-food' && !d.taken && d.mg > 50)[0];
  if (cut != null && lateSalt && nowMins() >= cut) {
    w.appendChild(el('div', 'flag warn', 'It is past ' + clock(cut) + ' and ' + g3(lateSalt.g) + ' g of salt is still meant to go on food. '
      + 'That is the salt your face keeps overnight. Skip it tonight, and it comes out of tomorrow\u2019s base as a lower day rather than a bloated one.'));
  }
  /* ── what a smaller zinc cap would buy ──
     Worked out live off the same measured points the dose rows use, and
     shown only when it is worth at least half a milligram a day. */
  const want = c.znPlan;
  if (want > 15 && v('capZn1') > 15) {
    const now = znAbs(Math.min(v('capZn1'), want)) + znAbs(clamp0(want - v('capZn1')));
    const alt = znAbs(Math.min(15, want)) + znAbs(clamp0(want - 15));
    if (alt - now >= .5) {
      w.appendChild(el('div', 'flag info', 'A 15 mg zinc single dose cap would get about ' + r1(alt - now)
        + ' mg more zinc into you a day, at best: ' + r1(now) + ' now, ' + r1(alt) + ' with it. Two smaller doses each get their own run at the absorption curve. It is in Caps, pitchers and splits.'));
    }
  }
  const znTot = c.food.zn + c.supp.zn;
  if (znTot > v('capZnT')) {
    w.appendChild(el('div', 'flag bad', 'Zinc total ' + r1(znTot) + ' mg is over your ' + v('capZnT') + ' mg ceiling.'));
  }
  if (c.kShort > 0) {
    w.appendChild(el('div', 'flag warn', 'At your GI ceiling. Still ' + r0(c.kShort)
      + ' mg of potassium short. Potato instead of rice closes about '
      + r0(Math.min(c.kShort, 300 * (F.pot.k - F.rice.k) / 100)) + ' mg per 300 g swapped.'));
  }
  /* ── one mouthful, not one day ──
     The daily cap answers the gut over a whole day and says nothing about
     how much lands at once, which is the other question and the one with
     the shorter fuse. Warned rather than moved: the cards are his to
     arrange, and a dose that shuffles itself out of the drink he put it in
     is the app arguing with the drag he just did. */
  const L = layout(), live = SLOTS(c);
  const perSlot = {};
  c.doses.forEach(d => { if (d.nut === 'k' && d.mg > 0) { const sl = slotOf(d, L, live); perSlot[sl] = (perSlot[sl] || 0) + d.mg; } });
  const over = Object.keys(perSlot).filter(k2 => perSlot[k2] > v('capK1'));
  if (over.length) {
    const names = {}; live.forEach(x => { names[x.id] = x.nm; });
    w.appendChild(el('div', 'flag warn', 'One drink is carrying ' + r0(Math.max.apply(null, over.map(k2 => perSlot[k2])))
      + ' mg of potassium, over your ' + r0(v('capK1')) + ' mg single dose cap: '
      + esc(over.map(k2 => names[k2] || k2).join(', ')) + '. Add a pitcher, or drag some of it into one.'));
  }
  w.appendChild(el('div', 'flag info', 'Potassium goes in a full glass or a full pitcher, never a small amount of water. Dilution is the whole margin: the 99 mg limit on shop-bought potassium is about undissolved tablets sitting against the gut wall, not about the dose.'));
  w.appendChild(el('div', 'flag info', 'If stools loosen, your powder is stronger than the % set. Raise the magnesium %.'));
  return w;
}

/* ---- the micros, folded away ---- */
const MICRO_DEF = { ca: 1, cu: 1, ch: 0, va: 1, cuC: 1, liver: 1 };
const microOn = id => { const s = S.get('micro', null) || MICRO_DEF; return s[id] ? 1 : 0; };
function microsCard(c) {
  const w = el('div', 'card');
  const d = el('details');
  d.open = !!S.get('microOpen', 0);
  d.ontoggle = () => S.set('microOpen', d.open ? 1 : 0);
  d.appendChild(el('summary', null, 'Micros and ceilings'));
  const grid = el('div', 'grid g2');

  const W = windowRead();
  const wd = W.days + ' days';
  /* ── a target and a ceiling are opposite things ──
     Six rows drawn one way said the wrong thing three times: 4.7 mg of
     copper against a 2.0 mg TARGET came out red, which is the colour for
     danger, when it is the number doing its job. A row now says which kind
     it is. Under a target is the problem; over a ceiling is the problem. */
  const rows = [
    ['ca', 'Calcium, today', 'target', c.food.ca, 1000, 'mg', 0, '1,000 mg/day · spent daily, so read daily'],
    ['ch', 'Choline, today', 'target', c.food.ch, 550, 'mg', 0, '550 mg/day · spent daily, so read daily'],
    ['cu', 'Copper, ' + wd, 'target', W.per.cu, 2.0, 'mg', 1, '2.0 mg/day on average · the floor zinc keeps pushing you under'],
    ['va', 'Vitamin A, preformed, ' + wd, 'ceiling', W.per.va, 3000, 'mcg', 0,
      '3,000 mcg/day on average · today alone was ' + r0(c.food.va) + ' mcg · liver is the only real source'],
    ['cuC', 'Copper ceiling, ' + wd, 'ceiling', W.per.cu, 10, 'mg', 1, '10 mg/day on average · you cannot monitor this without panels'],
    ['liver', 'Beef liver, ' + wd, 'ceiling', W.liver, 60 * W.days, 'g', 0,
      '60 g/day on average, ' + r0(60 * W.days) + ' g over ' + wd + ' · vitamin A binds before copper does'],
  ];
  rows.forEach(([id, label, kind, val, lim, unit, dec, sub]) => {
    const on = microOn(id);
    const p = lim ? val / lim : 1;
    const bad = kind === 'ceiling' ? p > 1 : p < .7;
    const soso = kind === 'ceiling' ? p > .85 : p < .95;
    const g = el('div', 'gauge');
    const head = el('div', 'grow');
    const lbl = el('span', null, esc(label));
    head.appendChild(lbl);
    const right = el('span', 'row');
    if (on) {
      const cls = bad ? 'badc' : soso ? 'warnc' : 'ok';
      right.appendChild(el('span', cls, (dec ? r1(val) : r0(val)) + ' ' + unit));
    } else right.appendChild(el('span', 'src', 'hidden'));
    const eye = el('button', 'eye mb-tap' + (on ? '' : ' off'), on ? '◉' : '○');
    eye.setAttribute('aria-label', (on ? 'Hide ' : 'Show ') + label);
    eye.onclick = () => {
      const s = Object.assign({}, S.get('micro', null) || MICRO_DEF);
      s[id] = on ? 0 : 1;
      S.set('micro', s); draw();
    };
    right.appendChild(eye);
    head.appendChild(right);
    g.appendChild(head);
    if (on) {
      const track = el('div', 'gtrack');
      const fill = el('div', 'gfill' + (bad ? ' over' : soso ? ' warn' : ''));
      fill.style.width = Math.min(val / lim * 75, 100) + '%';
      track.appendChild(fill);
      const lm = el('div', 'glimit'); lm.style.left = '75%';
      track.appendChild(lm);
      g.appendChild(track);
      g.appendChild(el('div', 'gsub', esc(sub)));
    }
    grid.appendChild(g);
  });
  d.appendChild(grid);
  d.appendChild(el('p', 'note', 'Vitamin A, copper and liver are stored rather than spent, so they are read as a daily average over ' + wd
    + ', set in Caps, pitchers and splits. The window reads STATUS meals only: food typed in by hand counts for today and cannot count for a day that has gone.'
    + (W.seen < W.days ? ' <b>' + W.seen + ' of ' + W.days + ' days have food logged</b>, so the average is over a thinner week than it looks.' : '')));
  d.appendChild(el('div', 'flag info', 'Zinc at ' + v('znT') + ' mg daily suppresses copper absorption. Early deficiency looks like fatigue, which reads as overtraining. Beef liver covers it. Do not skip it more than two weeks running.'));
  w.appendChild(d);
  return w;
}

/* ══════════════ THE NUMBERS BEHIND THIS ══════════════

   Tom, 2026-09-21: the facts at the bottom, with timing, how much of each
   one actually gets in, and how long it lasts.

   Two numbers get confused constantly and this app uses both, so the section
   opens by separating them. The percentage in the powder settings is how
   much of the POWDER is the mineral. That is chemistry, and it is on the
   label. Bioavailability is how much of that mineral crosses the gut wall.
   That is biology, and it is on no label. 1.000g of zinc glycinate at 28%
   puts 280mg of zinc in the glass; what reaches him is a third number.

   The zinc figures are the one place a source changes what he should DO, so
   they carry the study's own conditions rather than being rounded into a
   claim. Everything here says where it came from, and what is a measurement
   against what is a range.                                                 */
const FACTS = [
  { nm: 'SODIUM', sub: 'table salt, 39.3% sodium', rows: [
    ['How much gets in', 'Effectively all of it. Sodium chloride is absorbed almost completely, which is why the maths here treats a milligram eaten as a milligram taken.'],
    ['How long it acts', 'Plasma volume lifts within 30 to 60 minutes when it goes down with fluid. Your kidneys take about 2 to 3 days to re-set to a new level of intake, which is the water swing this app warns about.'],
    ['When to take it', '30 to 60 minutes before training for the pre-workout dose. Nothing after about 6 PM if facial bloat is the thing being protected, and never in the night drink.'],
  ] },
  { nm: 'POTASSIUM', sub: 'potassium citrate, 36.2% potassium', rows: [
    ['How much gets in', 'About 90% or more. Potassium from food and from soluble salts is well absorbed. The limit is your gut tolerating it, not your gut taking it up.'],
    ['How long it acts', 'Blood level peaks 1 to 2 hours after a dose and is back near baseline in 3 to 4 hours as it moves into cells and out through the kidneys. A dose is cleared inside about 12 hours, so spreading it across the day wastes nothing.'],
    ['When to take it', 'Spread it. 10 to 20 mEq is a normal single prescription dose, which is 390 to 780mg of potassium, and 1,000mg is about 26 mEq. Always a full glass or a full pitcher, never a small amount of water.'],
    ['The 99mg thing', 'The 99mg limit on shop-bought potassium is about solid TABLETS, which can sit undissolved against the gut wall and injure it. Dissolved in water that is not the same risk. It was never a statement about the dose.'],
  ] },
  { nm: 'ZINC', sub: 'zinc glycinate, 28% zinc', rows: [
    ['How much gets in', 'It saturates, and this is the number worth knowing. In Tran and Miller\u2019s dose study, 20.3mg of zinc gave 11.0mg absorbed and 30.1mg gave 11.2mg. Going from 20mg to 30mg in one go bought 0.2mg. The curve they fitted tops out near 13mg however much you take.'],
    ['The catch in that', 'Those doses were zinc sulfate in water taken after a meal. Out of an ordinary plate with grains in it the fraction absorbed is lower, roughly 20 to 40%, because phytate binds zinc. The ceiling is real, and your own number sits under theirs.'],
    ['How long it acts', 'Blood zinc peaks 2 to 3 hours after a dose and is back down within 6 to 8 hours. There is no large store to draw on, which is why it is a daily job rather than a weekly one.'],
    ['When to take it', 'Two separate doses beat one big one, because each gets its own run at the absorption curve. That is why anything over the single dose cap goes on the food instead of stacking at night. Keep it about 2 hours away from calcium and iron, which compete with it.'],
  ] },
  { nm: 'MAGNESIUM', sub: 'magnesium glycinate, 11% magnesium', rows: [
    ['How much gets in', 'Roughly 20 to 25% for glycinate, against about 4 to 12% for magnesium oxide, which is the cheap form and mostly passes through. As with zinc, the fraction absorbed falls as the dose rises.'],
    ['How long it acts', 'Peaks 2 to 3 hours after a dose. Your kidneys clear the excess within a day, so it does not stack up.'],
    ['When to take it', 'Split doses beat one, for the same reason as zinc. Evening is the common choice because glycine itself is mildly calming. Whatever is not absorbed pulls water into the gut, which is exactly what loose stools are telling you.'],
  ] },
  { nm: 'VITAMIN A AND COPPER', sub: 'from beef liver', rows: [
    ['How much gets in', 'Preformed vitamin A from liver is 70 to 90% absorbed and needs fat in the meal to get there. Copper runs around 30 to 40%, and falls as the dose rises.'],
    ['How long it acts', 'This is the one that is different. Vitamin A is stored in your liver with a half-life measured in months, not hours. That is why it is read as an average over 21 days instead of scored on the day you ate it, and why a kilo of liver over three weeks is a different thing from a kilo in one.'],
    ['Why copper is here', 'Zinc induces a protein in the gut wall that traps copper, so a high zinc intake pushes copper down over months. Liver is the cheapest way back. The gap between the 2.0mg target and the 10mg ceiling is deliberately wide.'],
  ] },
];
const SOURCES = [
  ['Tran and Miller, zinc absorbed against dose, American Journal of Clinical Nutrition', 'https://ajcn.nutrition.org/article/S0002-9165(22)03742-X/fulltext'],
  ['Zinc, Dietary Reference Intakes, National Academies', 'https://www.ncbi.nlm.nih.gov/books/NBK222317/'],
  ['Bioavailability of magnesium food supplements, a systematic review', 'https://www.sciencedirect.com/science/article/abs/pii/S0899900721001568'],
  ['Magnesium diglycinate against oxide', 'https://pubmed.ncbi.nlm.nih.gov/7815675/'],
  ['WHO guidance on sodium and potassium intake', 'https://www.who.int/news/item/31-01-2013-who-issues-new-guidance-on-dietary-salt-and-potassium'],
];
function factsCard() {
  const w = el('div', 'card');
  const d = el('details');
  d.open = !!S.get('factsOpen', 0);
  d.ontoggle = () => S.set('factsOpen', d.open ? 1 : 0);
  d.appendChild(el('summary', null, 'The numbers behind this'));
  d.appendChild(el('p', 'note', 'Two percentages, and they are not the same thing. The one in the powder settings is how much of the POWDER is the mineral, which is chemistry and is printed on your label. Bioavailability below is how much of that mineral crosses the gut wall, which is biology and is on no label. This app doses the first one, because it is the one you can weigh.'));
  const grid = el('div', 'grid g2');
  FACTS.forEach(f => {
    const box = el('div', 'fact');
    box.appendChild(el('div', 'vname', esc(f.nm)));
    box.appendChild(el('div', 'vsize', esc(f.sub)));
    f.rows.forEach(pair => {
      const r = el('div', 'frow');
      r.appendChild(el('div', 'fk', esc(pair[0])));
      r.appendChild(el('div', 'ft', esc(pair[1])));
      box.appendChild(r);
    });
    grid.appendChild(box);
  });
  d.appendChild(grid);
  const src = el('p', 'note');
  src.innerHTML = 'Where these came from: ' + SOURCES.map(x =>
    '<a href="' + x[1] + '" target="_blank" rel="noopener">' + esc(x[0]) + '</a>').join(' \u00b7 ')
    + '. The zinc figures are that study\u2019s own measured numbers. The magnesium and copper percentages are ranges from the literature rather than one measurement, and the timings are typical values, not yours.';
  d.appendChild(src);
  w.appendChild(d);
  return w;
}

/* ══════════════ LOGGING IT BACK ══════════════

   Three writes, and each one is a row keyed so that pressing the button twice
   updates rather than stacks.

   • `dose` rows are ours: what was mixed, slot by slot. They are the history
     the base subtracts from and the thing any future micro tracking reads.
   • `ev` rows on STATUS's zinc and magnesium fields, because those fields
     have no food source and a typed dose is the only thing that can fill them.
   • `meal` rows for the salt and the citrate, so STATUS's sodium and
     potassium tiles say what you actually took. These are the rows the
     sodium base takes back out again, by key.                                */
function tickCard(c, list, on, slot) {
  const d = today();
  list.forEach(x => {
    if (on) Rec.set('dose', d, x.id, { nut: x.nut, mg: Math.round(x.mg), g: +x.g.toFixed(3), slot: slot, t: Date.now() });
    else Rec.del('dose', d, x.id);
  });
  toStatus();
  Mobile.feedback(on ? 'success' : 'untick');
  draw();
}

/* STATUS is told what has actually gone down, summed from the ticked rows,
   so unticking a drink takes it back out of STATUS too. */
function toStatus() {
  if (!S.get('writeBack', 1)) return;
  const d = today();
  const sum = { na: 0, k: 0, zn: 0, mg: 0 };
  Rec.all('dose', { date: d }).forEach(r => { const p2 = r.payload; if (p2 && sum[p2.nut] != null) sum[p2.nut] += num(p2.mg, 0) || 0; });

  /* zinc and magnesium: read, drop what we wrote before, append one entry */
  [['zinc', sum.zn], ['magnesium', sum.mg]].forEach(([fid, mg]) => {
    const r = Rec.get('ev', d, fid);
    const e = (r && r.e ? r.e : []).filter(x => x.src !== APP.id);
    if (mg > 0) e.push({ t: Date.now(), v: Math.round(mg), src: APP.id });
    if (e.length) Rec.set('ev', d, fid, { e: e });
    else if (r) Rec.del('ev', d, fid);
  });

  /* salt and citrate as meals, so the sodium and potassium tiles are true */
  const meal = (key, name, na, k) => {
    if (!(na > 0 || k > 0)) { if (Rec.get('meal', d, key)) Rec.del('meal', d, key); return; }
    Rec.set('meal', d, key, {
      fid: null, name: name, serve: 'mixed by ELEMENT', unit: 'g', amt: 0, mult: 1,
      kcal: 0, p: 0, c: 0, f: 0, na: Math.round(na), k: Math.round(k), ca: 0, caff: 0,
      price: 0, t: Date.now(), src: APP.id,
    });
  };
  meal(MIX_MEAL.salt, 'Salt (ELEMENT)', sum.na, 0);
  meal(MIX_MEAL.cit, 'Potassium citrate (ELEMENT)', 0, sum.k);
}

/* ══════════════ SETTINGS ══════════════ */
function settingsTab(pane) {
  pane.appendChild(el('div', 'mb-group', 'STATUS'));
  pane.appendChild(UI.row('Write doses back to STATUS',
    'Zinc and magnesium as doses, salt and citrate as food, so the tiles are true. The sodium base takes its own salt back out again.',
    UI.toggle(!!S.get('writeBack', 1), on => S.set('writeBack', on ? 1 : 0))));
  pane.appendChild(el('div', 'mb-group', 'DEFAULTS'));
  const b = el('button', 'mb-btn mb-press mb-tap', 'RESET EVERY INPUT');
  b.onclick = () => UI.confirm('Put every number back to its default?',
    'The manual food amounts and the card layout stay as they are.').then(yes => {
      if (!yes) return;
      IN.forEach(([k]) => Rec.del('setting', null, APP.id + '.in.' + k));
      Rec.del('setting', null, APP.id + '.in.trained');
      draw(); UI.toast('back to defaults');
    });
  pane.appendChild(b);
}
window.openSettings = () => UI.settings(APP.id, [{ id: 'mix', name: 'ELEMENT', draw: settingsTab }], { order: ['mix', 'data'] });

Rec.on(draw);
Day.on(draw);
draw();
</script>
