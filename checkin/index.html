<style>
/* CHECK IN. Everywhere: built to the phone rules, laid out in two columns on a
   wide window. Every colour and size is a token. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em;white-space:nowrap}
.logo b{color:var(--accent)}
.spacer{flex:1}

main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-6) + var(--safe-b))}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s-4);align-items:start}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:var(--s-4);min-width:0}

.card{border-radius:var(--radius-lg);background:var(--surface-1);padding:var(--s-4);
  box-shadow:var(--e-1),var(--rim);display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted)}
.hd{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.hd h2{flex:1}
.hd input{width:auto}
.muted{color:var(--text-muted);font-size:var(--f-2);line-height:var(--lh-body)}

/* three photo slots, each a real button */
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-2)}
.slot{position:relative;aspect-ratio:3/4;border:0;border-radius:var(--radius-md);background:var(--surface-2);
  overflow:hidden;color:var(--text-muted);font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-1)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .lab{position:relative;font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);letter-spacing:var(--track-cap)}
.slot.has .lab{position:absolute;left:var(--s-1);bottom:var(--s-1);padding:0 var(--s-1);
  border-radius:var(--radius-sm);background:var(--surface-1);color:var(--text-1)}

.frow{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap)}
.frow .lbl{flex:1;min-width:0}
.frow .lbl small{display:block;color:var(--text-muted);font-size:var(--f-1)}
.frow input{width:6em;min-width:0;text-align:right}
.frow.stack{flex-direction:column;align-items:stretch;gap:var(--s-2)}
.frow textarea{width:100%}
.unit{color:var(--text-muted);font-size:var(--f-2);min-width:2em}
.acts{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}

.list{display:flex;flex-direction:column;gap:var(--s-2)}
.item{display:flex;align-items:center;gap:var(--s-3);padding:0 0 0 var(--s-3);min-height:var(--tap);
  border-radius:var(--radius-md);background:var(--surface-2);cursor:pointer}
.item.on{outline:2px solid var(--accent);outline-offset:-2px}
.item .nm{flex:1;min-width:0}
.item .nm small{display:block;color:var(--text-muted);font-size:var(--f-1)}
.item .mb-btn{min-width:var(--tap)}

.pick{display:flex;gap:var(--s-2);align-items:center}
.pick select{flex:1;min-width:0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-2)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-2)}
.fig{display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.fig img,.fig .nophoto{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--radius-md);background:var(--surface-2)}
.fig .nophoto{display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:var(--f-1)}
.fig figcaption{font-size:var(--f-1);color:var(--text-muted)}
.big{width:100%;border-radius:var(--radius-md)}

.tbl{overflow-x:auto}
table.nums{width:100%;border-collapse:collapse;font-size:var(--f-2)}
table.nums td,table.nums th{padding:var(--s-1) var(--s-2);text-align:right;white-space:nowrap}
table.nums th{color:var(--text-muted);font-weight:var(--w-body);font-size:var(--f-1)}
table.nums td:first-child,table.nums th:first-child{text-align:left;white-space:normal}
.said{white-space:pre-wrap;line-height:var(--lh-body)}
</style>
</head>
<body>
<header>
  <div class="logo">CHECK<b>IN</b></div>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" id="bSet" aria-label="Settings" data-icon="settings"></button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>
<main class="mb-scroll"><div class="wrap" id="main"></div></main>

<script>
/* ══════════════ CHECK IN ══════════════
   Physique check-ins, for Tom and for his clients. Set by Tom on 2026-09-14.

   A check-in is a date with a front photo (more if switched on), a weight and
   a few answers. The change between two of them is the point, so the first
   one is kept as the one every later one can be put beside.

   Rows, one fact each:
     cfield   key: field id          what a check-in asks {label, kind, unit, ord, on}
                                     kind: photo, number, scale or text
     cval     date, key: field id    one answer on one day {v}
     cphoto   date, key: field id    one shrunk photo {img, w, h}. Big, so it lives
                                     in IndexedDB and arrives after first paint
     checkin  date, key: ''          {sent} when this day was sent to a coach

   Weight is NOT here. It is STATUS's `ev` row for the field `weight`, read and
   written the way STATUS writes it, so a weight typed in either app is the
   same number in both. */

const APP = {
  id: 'checkin',
  name: 'CHECK IN',
  icon: '◎',
  blurb: 'photos, weight and how the week went',
  types: ['cfield', 'cval', 'cphoto', 'checkin'],
};

Skins.load('../shared/skins.json').then(() => { Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
IO.register({ app: APP.id, name: APP.name, types: APP.types });

const $ = s => document.querySelector(s);
const esc = UI.esc;
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const num = s => { const v = parseFloat(String(s).replace(',', '.')); return isFinite(v) ? v : null; };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'client';
const MAXPX = 1280;          /* long edge of a stored photo: sharp on a phone, ~200KB */

/* ── what a check-in asks ──
   Vocabulary, not prescription. These are shown until the list is changed,
   and written down the first time anything in it is, so a coach's own
   questions become data rather than something this file decides. */
const DEFAULTS = [
  /* Photos are questions too, and one ships: Front. Tom, 2026-09-14: "No
     need to specify side and back, just make it a clean Add a new Pose."
     Every other pose is added in Settings. */
  { id: 'front', label: 'Front', kind: 'photo', on: 1 },
  { id: 'waist', label: 'Waist', kind: 'number', unit: 'cm', on: 1 },
  { id: 'hips', label: 'Hips', kind: 'number', unit: 'cm', on: 0 },
  { id: 'chest', label: 'Chest', kind: 'number', unit: 'cm', on: 0 },
  { id: 'arm', label: 'Arm', kind: 'number', unit: 'cm', on: 0 },
  { id: 'thigh', label: 'Thigh', kind: 'number', unit: 'cm', on: 0 },
  { id: 'training', label: 'Training this week', kind: 'scale', on: 1 },
  { id: 'food', label: 'Food this week', kind: 'scale', on: 1 },
  { id: 'sleep', label: 'Sleep this week', kind: 'scale', on: 1 },
  { id: 'note', label: 'Anything else', kind: 'text', on: 1 },
].map((f, i) => Object.assign({ ord: i }, f));

/* A saved row wins over its default, and a default fills in wherever there
   is no row. So a question added to this list later still reaches somebody
   who had already changed a different one. */
function fieldMap() {
  const m = {};
  DEFAULTS.forEach(f => { const p = Object.assign({}, f); delete p.id; m[f.id] = p; });
  const rows = Rec.map('cfield');
  Object.keys(rows).forEach(id => { m[id] = Object.assign(m[id] || {}, rows[id]); });
  return m;
}
const fieldList = () => Object.entries(fieldMap()).map(([id, f]) => Object.assign({ id: id }, f))
  .sort((a, b) => (a.ord || 0) - (b.ord || 0));
const photoFields = () => fieldList().filter(f => f.kind === 'photo');
/* Merged into what is there, never rebuilt: root brief, many writers. */
function saveField(id, patch) {
  Rec.set('cfield', null, id, Object.assign({}, fieldMap()[id] || {}, patch));
}

/* ── weight, which is STATUS's ── */
const wField = () => Rec.map('field').weight || null;
const wUnit = () => (wField() || {}).unit || 'lb';      /* STATUS's own default, so both apps agree */
function weightOn(date) {
  const r = Rec.get('ev', date, 'weight'), e = r && r.e ? r.e : [];
  return e.length ? e[e.length - 1].v : null;
}
function setWeight(date, v) {
  if (v == null) { Rec.del('ev', date, 'weight'); return; }
  /* STATUS keeps one weight a day unless its field says otherwise, and its
     own evAdd replaces the day's reading. Same here, merged into the row. */
  const r = Rec.get('ev', date, 'weight') || {}, f = wField();
  const e = (f && !f.once) ? (r.e || []).slice() : [];
  e.push({ t: Date.now(), v: v });
  Rec.set('ev', date, 'weight', Object.assign(r, { e: e }));
}

/* ── answers and photos ── */
const valOf = (date, id) => { const r = Rec.get('cval', date, id); return r ? r.v : null; };
function setVal(date, id, v) {
  if (v == null || v === '') Rec.del('cval', date, id);
  else Rec.set('cval', date, id, { v: v });
}
const photoOf = (date, pose) => Rec.get('cphoto', date, pose);
/* A check-in exists on a day that has an answer, a photo or a sent stamp.
   A weight alone does not make one: STATUS logs weight every day. */
function checkinDates() {
  const s = new Set();
  ['cval', 'cphoto', 'checkin'].forEach(t => Rec.all(t).forEach(r => { if (r.date) s.add(r.date); }));
  return Array.from(s).sort();
}

function shrink(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAXPX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res({ img: c.toDataURL('image/jpeg', 0.82), w: w, h: h });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That picture could not be opened here.')); };
    img.src = url;
  });
}


/* ══════════════ the screen ══════════════ */
let day = Day.today();
let cmpA = null, cmpB = null;

/* A redraw while somebody is typing throws their cursor away. Wait for them. */
const typing = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); };
let pending = false;
function soon() { if (typing()) { pending = true; return; } draw(); }
document.addEventListener('focusout', () => setTimeout(() => { if (pending && !typing()) { pending = false; draw(); } }, 0));

function draw() {
  const m = $('#main');
  m.innerHTML = '';
  const left = el('div', 'col'), right = el('div', 'col');
  left.appendChild(drawForm());
  right.appendChild(drawCompare());
  right.appendChild(drawHistory());
  m.appendChild(left); m.appendChild(right);
}

function drawForm() {
  const c = el('div', 'card');
  const hd = el('div', 'hd');
  hd.appendChild(el('h2', null, day === Day.today() ? 'TODAY&#8217;S CHECK-IN' : 'CHECK-IN, ' + esc(Day.label(day).toUpperCase())));
  const d = UI.field('date', { value: day });
  d.max = Day.today();
  d.setAttribute('aria-label', 'Which day this check-in is for');
  d.onchange = () => { if (d.value && d.value <= Day.today()) { day = d.value; d.blur(); draw(); } else d.value = day; };
  hd.appendChild(d);
  c.appendChild(hd);

  const pf = photoFields().filter(f => f.on);
  if (pf.length) {
    const shots = el('div', 'shots');
    /* never wider than half the card, so one photo is not a poster */
    shots.style.gridTemplateColumns = 'repeat(' + Math.max(2, Math.min(3, pf.length)) + ',minmax(0,1fr))';
    pf.forEach(f => shots.appendChild(slot(f.id, f.label)));
    c.appendChild(shots);
  }

  const w = weightOn(day);
  c.appendChild(numRow('Weight', w, wUnit(), w != null ? 'the same number STATUS has' : 'saved in STATUS too', v => setWeight(day, v)));
  fieldList().filter(f => f.on && f.kind !== 'photo').forEach(f => {
    if (f.kind === 'number') c.appendChild(numRow(f.label, valOf(day, f.id), f.unit || '', '', v => setVal(day, f.id, v)));
    else if (f.kind === 'scale') c.appendChild(scaleRow(f));
    else c.appendChild(textRow(f));
  });

  const acts = el('div', 'acts');
  const send = el('button', 'mb-btn mb-press mb-tap go', 'Send to coach');
  send.dataset.icon = 'share';
  send.onclick = () => sendToCoach(day);
  acts.appendChild(send);
  const st = Rec.get('checkin', day, '');
  if (st && st.sent) acts.appendChild(el('span', 'muted', 'Sent ' + esc(Day.label(Day.calendar(Date.parse(st.sent))))));
  c.appendChild(acts);
  return c;
}

function numRow(label, value, unit, note, onset) {
  const r = el('label', 'frow');
  r.appendChild(el('span', 'lbl', esc(label) + (note ? '<small>' + esc(note) + '</small>' : '')));
  const i = UI.field('decimal', { value: value == null ? '' : String(value) });
  i.setAttribute('aria-label', label);
  i.addEventListener('change', () => {
    const t = i.value.trim(), v = t === '' ? null : num(t);
    if (t !== '' && v == null) { UI.toast(esc(t) + ' is not a number.', { bad: true }); return; }
    onset(v);
  });
  r.appendChild(i);
  r.appendChild(el('span', 'unit', esc(unit)));
  return r;
}

function scaleRow(f) {
  const r = el('div', 'frow stack');
  r.appendChild(el('span', 'lbl', esc(f.label) + '<small>1 is poor, 5 is great</small>'));
  const cur = valOf(day, f.id);
  r.appendChild(UI.segmented([1, 2, 3, 4, 5].map(n => ({ id: String(n), name: String(n) })),
    cur == null ? null : String(cur), id => setVal(day, f.id, +id)));
  return r;
}

function textRow(f) {
  const r = el('label', 'frow stack');
  r.appendChild(el('span', 'lbl', esc(f.label)));
  const t = UI.field('note', { value: valOf(day, f.id) || '', rows: 3 });
  t.addEventListener('change', () => setVal(day, f.id, t.value.trim() || null));
  r.appendChild(t);
  return r;
}

function slot(pose, name) {
  const p = photoOf(day, pose);
  const b = el('button', 'slot mb-press' + (p ? ' has' : ''));
  b.type = 'button';
  if (p) { const img = el('img'); img.src = p.img; img.alt = name; b.appendChild(img); }
  else { const ic = el('span'); ic.dataset.icon = 'photo'; ic.dataset.iconSize = '28'; b.appendChild(ic); }
  b.appendChild(el('span', 'lab', name));
  b.setAttribute('aria-label', (p ? 'The ' : 'Add a ') + name.toLowerCase() + ' photo');
  b.onclick = e => { if (p) photoMenu(pose, name, p, b, e); else pickPhoto(pose); };
  if (p) Mobile.hold(b, e => photoMenu(pose, name, p, b, e));
  return b;
}

function pickPhoto(pose) {
  const d = day, i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  i.onchange = () => {
    const f = i.files && i.files[0];
    if (!f) return;
    shrink(f).then(ph => { Rec.set('cphoto', d, pose, ph); Mobile.feedback('success'); },
      err => UI.toast(esc(err.message), { bad: true }));
  };
  i.click();
}

function photoMenu(pose, name, p, anchor, e) {
  const r = anchor.getBoundingClientRect(), d = day;
  UI.menu(e && e.clientX ? e.clientX : r.left, e && e.clientY ? e.clientY : r.bottom, [
    { label: 'See it bigger', fn: () => UI.dialog({ title: name.toUpperCase() + ', ' + Day.label(d).toUpperCase(), width: 640,
        body: b => { const img = el('img', 'big'); img.src = p.img; img.alt = name; b.appendChild(img); } }) },
    { label: 'Replace it', fn: () => pickPhoto(pose) },
    '-',
    { label: 'Remove it', kind: 'bad', fn: () => {
        Rec.del('cphoto', d, pose);
        UI.undo(name + ' photo removed', () => Rec.set('cphoto', d, pose, p));
      } },
  ], { title: name.toUpperCase() });
}

function drawCompare() {
  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'COMPARE'));
  const dates = checkinDates();
  if (dates.length < 2) {
    c.appendChild(el('p', 'muted', dates.length
      ? 'Your first check-in is saved. The next one sits beside it here.'
      : 'Once there are two check-ins, they sit side by side here.'));
    return c;
  }
  const a = dates.indexOf(cmpA) >= 0 ? cmpA : dates[0];
  const b = dates.indexOf(cmpB) >= 0 ? cmpB : dates[dates.length - 1];
  const pick = el('div', 'pick');
  const sel = (val, on, label) => {
    const s = el('select', 'mb-input');
    s.setAttribute('aria-label', label);
    dates.forEach(d => { const o = el('option', null, esc(Day.label(d))); o.value = d; o.selected = d === val; s.appendChild(o); });
    s.onchange = () => { on(s.value); s.blur(); draw(); };
    return s;
  };
  pick.appendChild(sel(a, v => { cmpA = v; }, 'Earlier check-in'));
  pick.appendChild(el('span', 'muted', 'and'));
  pick.appendChild(sel(b, v => { cmpB = v; }, 'Later check-in'));
  c.appendChild(pick);

  photoFields().forEach(({ id: pose, label: name }) => {
    const pa = photoOf(a, pose), pb = photoOf(b, pose);
    if (!pa && !pb) return;
    const g = el('div', 'pair');
    [[a, pa], [b, pb]].forEach(([d, p]) => g.appendChild(figure(p, name + ', ' + Day.label(d))));
    c.appendChild(g);
  });

  /* The numbers and the difference, and nothing about whether the difference
     is good. Root brief: show the number, never tell him what it means. */
  const rows = [['Weight', weightOn(a), weightOn(b), wUnit()]]
    .concat(fieldList().filter(f => f.kind !== 'text' && f.kind !== 'photo').map(f => [f.label, valOf(a, f.id), valOf(b, f.id), f.kind === 'scale' ? '' : (f.unit || '')]))
    .filter(r => r[1] != null || r[2] != null);
  if (rows.length) {
    const wrap = el('div', 'tbl'), t = el('table', 'nums');
    t.innerHTML = '<tr><th></th><th>' + esc(Day.short(a)) + '</th><th>' + esc(Day.short(b)) + '</th><th>Change</th></tr>' +
      rows.map(r => {
        const ch = r[1] != null && r[2] != null ? Math.round((r[2] - r[1]) * 10) / 10 : null;
        return '<tr><td>' + esc(r[0]) + '</td><td>' + fmt(r[1], r[3]) + '</td><td>' + fmt(r[2], r[3]) + '</td><td>' +
          (ch == null ? '' : (ch > 0 ? '+' : '') + fmt(ch, r[3])) + '</td></tr>';
      }).join('');
    wrap.appendChild(t);
    c.appendChild(wrap);
  }
  return c;
}
const fmt = (v, u) => v == null ? '' : esc((Math.round(v * 10) / 10) + (u ? ' ' + u : ''));
function figure(p, caption) {
  const f = el('figure', 'fig');
  if (p) { const img = el('img'); img.src = p.img; img.alt = caption; f.appendChild(img); }
  else f.appendChild(el('div', 'nophoto', 'No photo'));
  f.appendChild(el('figcaption', null, esc(caption)));
  return f;
}

function drawHistory() {
  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'EVERY CHECK-IN'));
  const dates = checkinDates().reverse();
  if (!dates.length) c.appendChild(el('p', 'muted', 'Nothing yet. Add a photo or an answer and the check-in is saved.'));
  const list = el('div', 'list');
  dates.forEach(d => {
    const r = el('div', 'item' + (d === day ? ' on' : ''));
    const n = photoFields().filter(f => photoOf(d, f.id)).length, w = weightOn(d);
    r.appendChild(el('span', 'nm', esc(Day.label(d)) + '<small>' + (n ? n + (n === 1 ? ' photo' : ' photos') : 'no photos') +
      (w != null ? ', ' + esc(w + ' ' + wUnit()) : '') + '</small>'));
    const more = el('button', 'mb-btn mb-press mb-tap flat');
    more.dataset.icon = 'more';
    more.setAttribute('aria-label', 'More for ' + Day.label(d));
    more.onclick = e => { e.stopPropagation(); const b = more.getBoundingClientRect(); dayMenu(d, b.left, b.bottom); };
    r.appendChild(more);
    r.onclick = () => { day = d; draw(); $('main').scrollTop = 0; };
    Mobile.hold(r, e => dayMenu(d, e.clientX, e.clientY), { skip: 'button' });
    list.appendChild(r);
  });
  c.appendChild(list);
  const open = el('button', 'mb-btn mb-press mb-tap', 'Open a client&#8217;s check-in');
  open.dataset.icon = 'import';
  open.onclick = openClientFiles;
  c.appendChild(open);
  return c;
}

function dayMenu(d, x, y) {
  UI.menu(x, y, [
    { label: 'Open it', fn: () => { day = d; draw(); } },
    { label: 'Compare it with the latest', fn: () => { cmpA = d; cmpB = null; draw(); } },
    { label: 'Send to coach', fn: () => sendToCoach(d) },
    '-',
    { label: 'Delete this check-in', kind: 'bad', fn: () => delCheckin(d) },
  ], { title: Day.label(d).toUpperCase() });
}

/* Deletes CHECK IN's rows for the day and offers them straight back. The
   weight is STATUS's and stays. */
function delCheckin(d) {
  const gone = [];
  ['cval', 'cphoto', 'checkin'].forEach(t => Rec.all(t, { date: d }).forEach(r => gone.push([t, r.key, r.payload])));
  gone.forEach(g => Rec.del(g[0], d, g[1]));
  Mobile.haptic('warn');
  UI.undo('Check-in for ' + esc(Day.label(d)) + ' deleted. The weight stays in STATUS.',
    () => gone.forEach(g => Rec.set(g[0], d, g[1], g[2])));
}

/* ══════════════ sending, and opening what was sent ══════════════
   No server and no account, so a check-in travels as a file: the phone's
   share menu hands it to Messenger, WhatsApp or email, and a desktop saves
   it. The file carries its own questions and weight unit, so it reads the
   same on a device that has never seen this client. */
function sendToCoach(d) {
  const rows = [];
  ['cval', 'cphoto', 'checkin'].forEach(t => Rec.all(t, { date: d }).forEach(r => rows.push(r)));
  if (!rows.length) return UI.toast('There is nothing in this check-in to send yet.');
  const name = Rec.setting(APP.id, 'name');
  if (!name) return askName(() => sendToCoach(d));
  const ev = Rec.row('ev', d, 'weight');
  if (ev) rows.push(ev);
  const bag = {
    kind: 'motherbase-checkin', v: 1, name: name, date: d, at: new Date().toISOString(),
    unit: wUnit(), fields: fieldList(),
    rows: rows.map(r => ({ type: r.type, date: r.date, key: r.key, payload: r.payload })),
  };
  handOverJson(JSON.stringify(bag), 'checkin-' + slug(name) + '-' + d + '.json').then(ok => {
    if (!ok) return;
    Rec.set('checkin', d, '', Object.assign(Rec.get('checkin', d, '') || {}, { sent: new Date().toISOString() }));
    Mobile.feedback('success');
  });
}

function handOverJson(text, name) {
  let f = null;
  try { f = new File([text], name, { type: 'application/json' }); } catch (e) {}
  if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
    return navigator.share({ files: [f], title: name }).then(() => true, err => {
      /* A cancel is not a failure and must not nag. */
      if (err && (err.name === 'AbortError' || /abort|cancel/i.test(err.message || ''))) return false;
      return download(text, name);
    });
  }
  return Promise.resolve(download(text, name));
}
function download(text, name) {
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  UI.toast('Saved as <b>' + esc(name) + '</b>. Send that file to your coach.');
  return true;
}

function askName(then) {
  const keep = (h, i) => {
    const v = i.value.trim();
    if (!v) { i.focus(); return; }
    Rec.setting(APP.id, 'name', v);
    h.close();
    if (then) then();
  };
  const h = UI.dialog({
    title: 'YOUR NAME', width: 420,
    body: (b, hh) => {
      b.appendChild(el('p', 'muted', 'It goes on the file, so your coach knows whose check-in it is.'));
      const i = UI.field('name', { placeholder: 'First and last name' });
      b.appendChild(i);
      Mobile.form(b, () => keep(hh, i));
    },
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: hh => { keep(hh, hh.body.querySelector('input')); return false; } }],
  });
  if (h && h.body) UI.focusSoon(h.body.querySelector('input'));
}

function openClientFiles() {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = '.json,application/json'; i.multiple = true;
  i.onchange = () => {
    const files = Array.from(i.files || []);
    if (!files.length) return;
    Promise.all(files.map(f => IO.read(f).catch(() => null))).then(bags => {
      const good = bags.filter(b => b && b.kind === 'motherbase-checkin' && Array.isArray(b.rows));
      if (!good.length) return UI.toast('Those files are not check-ins.', { bad: true });
      showClient(good.sort((x, y) => (x.date < y.date ? 1 : -1)), files.length - good.length);
    });
  };
  i.click();
}

/* ── a client's check-in, looked at and not kept ──
   Opening a file shows it and writes nothing. A client's rows merged into this
   store would sit beside the owner's own as if they were theirs: their waist,
   their photos. Keeping clients apart is COACH's job, with a profile each,
   and COACH is not built yet. Until it is, the file is the record. */
function showClient(bags, skipped) {
  const names = Array.from(new Set(bags.map(b => b.name || 'Client')));
  UI.dialog({
    title: names.length === 1 ? names[0].toUpperCase() : 'CHECK-INS', width: 760,
    body: b => {
      if (skipped) b.appendChild(el('p', 'muted', skipped + (skipped === 1 ? ' file was' : ' files were') + ' not a check-in, so left out.'));
      bags.forEach(bag => {
        const card = el('div', 'card');
        card.appendChild(el('h2', null, esc(((names.length > 1 ? (bag.name || 'Client') + ', ' : '') + Day.label(bag.date)).toUpperCase())));
        const got = (t, k) => { const r = bag.rows.filter(x => x.type === t && x.key === k)[0]; return r ? r.payload : null; };
        const g = el('div', 'gallery');
        /* the file's own photo questions, or the three every early file had */
        const own = (bag.fields || []).filter(f => f.kind === 'photo').map(f => [f.id, f.label]);
        (own.length ? own : [['front', 'Front'], ['side', 'Side'], ['back', 'Back']])
          .filter(([pose]) => got('cphoto', pose))
          .forEach(([pose, name]) => g.appendChild(figure(got('cphoto', pose), name)));
        card.appendChild(g);
        const ev = got('ev', 'weight'), lines = [];
        if (ev && ev.e && ev.e.length) lines.push(['Weight', ev.e[ev.e.length - 1].v + ' ' + (bag.unit || '')]);
        const said = [];
        (bag.fields || []).forEach(f => {
          const v = got('cval', f.id);
          if (!v || v.v == null) return;
          if (f.kind === 'text') said.push([f.label, v.v]);
          else lines.push([f.label, v.v + (f.kind === 'scale' ? ' of 5' : (f.unit ? ' ' + f.unit : ''))]);
        });
        if (lines.length) {
          const t = el('table', 'nums');
          t.innerHTML = lines.map(l => '<tr><td>' + esc(l[0]) + '</td><td>' + esc(l[1]) + '</td></tr>').join('');
          card.appendChild(t);
        }
        said.forEach(s => { card.appendChild(el('h2', null, esc(s[0].toUpperCase()))); card.appendChild(el('p', 'said', esc(s[1]))); });
        b.appendChild(card);
      });
    },
  });
}

/* ══════════════ settings ══════════════ */
function openSettings() {
  UI.settings(APP.id, [
    { id: 'questions', name: 'QUESTIONS', draw: drawQuestions },
    { id: 'you', name: 'YOU', draw: drawYou },
  ], { order: ['questions', 'you', 'app', 'data'] });
}
$('#bSet').onclick = openSettings;

function drawQuestions(p) {
  const redraw = () => { p.innerHTML = ''; drawQuestions(p); draw(); };
  p.appendChild(el('p', 'muted', 'What a check-in asks. Switching one off hides it and keeps every answer already given. Hold or right-click one to rename it.'));
  fieldList().forEach(f => {
    const note = f.kind === 'photo' ? 'a photo' : f.kind === 'number' ? 'a number' + (f.unit ? ', in ' + esc(f.unit) : '') : f.kind === 'scale' ? '1 to 5' : 'words';
    const row = UI.row(f.label, note, UI.toggle(!!f.on, on => { saveField(f.id, { on: on ? 1 : 0 }); draw(); }));
    Mobile.hold(row, e => UI.menu(e.clientX, e.clientY, [{ label: 'Rename', fn: () => renameField(f, redraw) }], { title: f.label.toUpperCase() }), { skip: '.mb-sw' });
    p.appendChild(row);
  });
  const acts = el('div', 'acts');
  const pose = el('button', 'mb-btn mb-press mb-tap', 'Add a new pose');
  pose.dataset.icon = 'photo';
  pose.onclick = () => addPose(redraw);
  const add = el('button', 'mb-btn mb-press mb-tap', 'Add a question');
  add.dataset.icon = 'add';
  add.onclick = () => addField(redraw);
  acts.appendChild(pose); acts.appendChild(add);
  p.appendChild(acts);
}

function addPose(redraw) {
  const h = UI.dialog({
    title: 'ADD A NEW POSE', width: 420,
    body: b => {
      b.appendChild(el('p', 'muted', 'Another photo every check-in asks for, like Side, Back or Front flexed.'));
      b.appendChild(UI.field('name', { placeholder: 'Side' }));
    },
    actions: [{ label: 'CANCEL' }, { label: 'ADD', kind: 'go', fn: hh => {
      const i = hh.body.querySelector('input'), n = i.value.trim();
      if (!n) { i.focus(); return false; }
      /* just after the last photo, so the photos stay together in the list */
      const last = photoFields().reduce((m, f) => Math.max(m, f.ord || 0), 0);
      saveField(slug(n) + '-' + Date.now().toString(36), { label: n, kind: 'photo', ord: last + 0.01, on: 1 });
      redraw();
    } }],
  });
  if (h && h.body) UI.focusSoon(h.body.querySelector('input'));
}

function addField(redraw) {
  let kind = 'scale', unit = null;
  const h = UI.dialog({
    title: 'ADD A QUESTION', width: 460,
    body: b => {
      const name = UI.field('text', { placeholder: 'Stress this week, hunger, steps' });
      name.classList.add('qname');
      b.appendChild(name);
      b.appendChild(UI.segmented([{ id: 'scale', name: '1 to 5' }, { id: 'number', name: 'A number' }, { id: 'text', name: 'Words' }], kind,
        k => { kind = k; unit.style.display = k === 'number' ? '' : 'none'; }));
      unit = UI.field('text', { placeholder: 'Unit, like cm' });
      unit.style.display = 'none';
      b.appendChild(unit);
    },
    actions: [{ label: 'CANCEL' }, { label: 'ADD', kind: 'go', fn: hh => {
      const n = hh.body.querySelector('.qname').value.trim();
      if (!n) { hh.body.querySelector('.qname').focus(); return false; }
      const ord = fieldList().reduce((m, f) => Math.max(m, f.ord || 0), 0) + 1;
      saveField(slug(n) + '-' + Date.now().toString(36), { label: n, kind: kind, unit: kind === 'number' ? unit.value.trim() : '', ord: ord, on: 1 });
      redraw();
    } }],
  });
  if (h && h.body) UI.focusSoon(h.body.querySelector('.qname'));
}

function renameField(f, redraw) {
  const h = UI.dialog({
    title: 'RENAME', width: 420,
    body: b => b.appendChild(UI.field('text', { value: f.label })),
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: hh => {
      const v = hh.body.querySelector('input').value.trim();
      if (!v) return false;
      saveField(f.id, { label: v });
      redraw();
    } }],
  });
  if (h && h.body) UI.focusSoon(h.body.querySelector('input'));
}

function drawYou(p) {
  const i = UI.field('name', { value: Rec.setting(APP.id, 'name') || '', placeholder: 'First and last name' });
  i.addEventListener('change', () => Rec.setting(APP.id, 'name', i.value.trim() || null));
  p.appendChild(UI.row('Your name', 'On every file you send, so your coach knows whose check-in it is.', i));
  const o = el('button', 'mb-btn mb-press mb-tap', 'Open');
  o.dataset.icon = 'import';
  o.onclick = openClientFiles;
  p.appendChild(UI.row('A client&#8217;s check-in', 'Look at files a client sent you. Nothing in them is saved here.', o));
}

/* First paint from what localStorage already has; photos are big rows and
   arrive from IndexedDB a moment later, so draw again when they land. */
Rec.on(soon);
Day.on(soon);
Rec.ready(draw);
draw();
</script>
