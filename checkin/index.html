}

/* ── putting saved photos back ── */
function addFromFiles(folder) {
  const i = document.createElement('input');
  i.type = 'file'; i.multiple = true; i.accept = 'image/*';
  if (folder) i.setAttribute('webkitdirectory', '');
  i.onchange = async () => {
    const files = Array.from(i.files || []).filter(f => /\.(jpe?g|png|webp|heic)$/i.test(f.name));
    if (!files.length) return;
    const pid = who, poses = posesOf(pid);
    let added = 0, kept = 0, skipped = 0, unread = 0;
    for (const f of files) {
      const m = /^(\d{4}-\d{2}-\d{2})\s+(.+)\.[a-z]+$/i.exec(f.name);
      const words = m ? m[2].toLowerCase() : '';
      const pose = m && poses.filter(p => words === p.label.toLowerCase() || words.endsWith(' ' + p.label.toLowerCase()))
        .sort((a, b) => b.label.length - a.label.length)[0];
      if (!pose) { skipped++; continue; }
      const key = K(pid, pose.id);
      if (Rec.has('cphoto', m[1], key)) { kept++; continue; }
      try {
        const ph = await shrink(f);
        Rec.set('cphoto', m[1], key, ph);
        queueMeasure('cphoto', m[1], key);
        added++;
      } catch (e) { unread++; }
    }
    const bits = [added + (added === 1 ? ' photo added' : ' photos added')];
    if (kept) bits.push(kept + ' already there');
    if (skipped) bits.push(skipped + ' without a date and pose in the name');
    if (unread) bits.push(unread + ' this browser could not open');
    UI.toast(esc(bits.join(', ')) + '.');
    draw();
  };
  i.click();
}

/* ══════════════ copy for Claude ══════════════
   Tom, 2026-09-15: not a paid connection, a bundle he pastes into his own
   Claude. One picture (goal, first and latest for every pose, with the
   numbers) and one question, already copied. One picture costs less to read
   than six, and it cannot arrive out of order. */
function claudeQuestion(pid) {
  const lines = [];
  lines.push('These are physique check-in photos of ' + (pid ? nameOf(pid) : (myName() || 'me')) + '. Each row is one pose: the goal photo if there is one, then the first check-in, then the latest, each with its date.');
  posesOf(pid).forEach(p => {
    const ds = poseDates(p.id, pid);
    if (!ds.length) return;
    const g = ratiosOf(goalMarkOf(p.id, pid)), a = ratiosOf(markOf(ds[0], p.id, pid)), b = ds.length > 1 ? ratiosOf(markOf(ds[ds.length - 1], p.id, pid)) : null;
    const say = (name, R) => R ? name + ' ' + RATIOS.map(([k, n]) => n.toLowerCase() + ' ' + fmtR(R[k])).join(', ') : null;
    const bits = [say('goal', g), say('first', a), say('latest', b)].filter(Boolean);
    if (bits.length) lines.push(p.label + ', widths measured from the body outline: ' + bits.join('; ') + '.');
  });
  const ds = checkinDates(pid), w0 = ds.length ? weightOf(ds[0], pid) : null, w1 = ds.length ? weightOf(ds[ds.length - 1], pid) : null;
  if (w0 != null || w1 != null) lines.push('Weight: ' + (w0 != null ? w0 + ' ' + unitOf(pid) + ' at the first check-in' : '') + (w0 != null && w1 != null ? ', ' : '') + (w1 != null ? w1 + ' ' + unitOf(pid) + ' at the latest' : '') + '.');
  lines.push('');
  lines.push('Compare the latest photos with the goal and with the first check-in. For each pose, describe the visible differences in muscle size, shape and leanness, which areas are closest to the goal and which are furthest from it, and what has changed since the first check-in. Say how confident you are, since light, pump and posture change how a photo looks.');
  return lines.join('\n');
}
async function claudePicture(pid) {
  const poses = posesOf(pid).filter(p => poseDates(p.id, pid).length || goalOf(p.id, pid));
  const CW = 480, PH = 640, LAB = 150, PAD = 24, HEAD = 96;
  const W = PAD + 3 * (CW + PAD), H = HEAD + poses.length * (PH + LAB + PAD) + PAD;
  const c = document.createElement('canvas');
  c.width = W; c.height = Math.max(H, 300);
  const g = c.getContext('2d');
  g.fillStyle = WHITE; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = INK; g.textBaseline = 'top';
  g.font = '700 40px system-ui, sans-serif';
  g.fillText(nameOf(pid) + ', check-ins', PAD, PAD);
  let y = HEAD;
  for (const p of poses) {
    const ds = poseDates(p.id, pid);
    const cells = [
      ['GOAL', goalOf(p.id, pid), goalMarkOf(p.id, pid)],
      ['FIRST, ' + (ds[0] ? Day.label(ds[0]) : ''), ds[0] ? photoOf(ds[0], p.id, pid) : null, ds[0] ? markOf(ds[0], p.id, pid) : null],
      ['LATEST, ' + (ds.length > 1 ? Day.label(ds[ds.length - 1]) : ''), ds.length > 1 ? photoOf(ds[ds.length - 1], p.id, pid) : null, ds.length > 1 ? markOf(ds[ds.length - 1], p.id, pid) : null],
    ];
    for (let i = 0; i < 3; i++) {
      const x = PAD + i * (CW + PAD), [label, ph, m] = cells[i];
      g.fillStyle = 'hsl(0 0% 92%)'; g.fillRect(x, y, CW, PH);
      if (ph) {
        const im = await loadImg(ph.img);
        const s = Math.min(CW / ph.w, PH / ph.h);
        g.drawImage(im, x + (CW - ph.w * s) / 2, y + (PH - ph.h * s) / 2, ph.w * s, ph.h * s);
      }
      g.fillStyle = INK; g.font = '700 26px system-ui, sans-serif';
      g.fillText(p.label.toUpperCase() + ', ' + label, x, y + PH + 10);
      const R = ratiosOf(m);
      g.font = '400 24px system-ui, sans-serif';
      if (R) RATIOS.forEach(([k, n], j) => g.fillText(n + ' ' + fmtR(R[k]), x, y + PH + 46 + j * 32));
      else if (!ph) g.fillText('No photo', x, y + PH + 46);
    }
    y += PH + LAB + PAD;
  }
  return c.toDataURL('image/jpeg', 0.85);
}
function forClaude() {
  const pid = who, text = claudeQuestion(pid);
  const copy = () => {
    try { return navigator.clipboard.writeText(text).then(() => { UI.toast('The question is copied.'); return true; }, () => false); }
    catch (e) { return Promise.resolve(false); }
  };
  copy();
  let pic = null;
  UI.dialog({
    title: 'COPY FOR CLAUDE', width: 560,
    body: b => {
      b.appendChild(el('p', 'muted', 'Save the picture, then paste the question and the picture into Claude together.'));
      const img = el('img', 'big');
      img.alt = 'Goal, first and latest photos for every pose';
      b.appendChild(img);
      const t = UI.field('note', { value: text, rows: 8 });

      t.setAttribute('aria-label', 'The question for Claude');

    },
    actions: [
      { label: 'COPY QUESTION', fn: () => { copy(); return false; } },
      { label: 'SAVE PICTURE', kind: 'go', fn: () => {

        handOver([{ name: Day.today() + ' ' + nameOf(pid) + ' for Claude.jpg', bytes: dataUrlBytes(pic), type: 'image/jpeg' }], 'for Claude');
        return false;

}

/* ══════════════ sending, and opening what was sent ══════════════
   No server and no account, so a check-in travels as a file: the phone's
   share menu hands it to Messenger, WhatsApp or email, and a desktop saves
   it. The file carries its own questions, poses, unit, dots and goal photos,
   so it reads the same on a device that has never seen this person.

   Opening one KEEPS it, since 2026-09-15: a client's check-ins live under
   their own id, so their numbers and their timelapse build up week on week.
   Tom's own file, sent from his phone to his desk, is recognised as his. */
function sendToCoach(d) {
  const rows = [];
  ['cval', 'cphoto', 'checkin', 'cmark'].forEach(t => Rec.all(t, { date: d }).forEach(r => { if (belongs(r.key, '')) rows.push(r); }));
  if (!rows.some(r => r.type !== 'cmark')) return UI.toast('There is nothing in this check-in to send yet.');
  const name = myName();
  if (!name) return askName(() => sendToCoach(d));
  const ev = Rec.row('ev', d, 'weight');
  if (ev) rows.push(ev);
  /* the goal photos go too, so the coach sees the same goal */
  ['cref', 'cmark'].forEach(t => Rec.all(t).forEach(r => { if (r.date == null && /^goal:/.test(r.key)) rows.push(r); }));
  const bag = {
    kind: 'motherbase-checkin', v: 2, name: name, pid: myPid(), animal: opt('animal', 'bear'), date: d, at: new Date().toISOString(),
    unit: wUnit(), fields: fieldList(),
    rows: rows.map(r => ({ type: r.type, date: r.date, key: r.key, payload: r.payload, updated_at: r.updated_at })),
  };
  const text = JSON.stringify(bag), file = 'checkin-' + slug(name) + '-' + d + '.json';
  handOver([{ name: file, blob: new Blob([text], { type: 'application/json' }), type: 'application/json' }], file).then(ok => {
    if (!ok) return;
    patch('checkin', d, '', { sent: new Date().toISOString() });
    Mobile.feedback('success');
  });
}

function askName(then) {
  const keep = (h, i) => {
    const v = i.value.trim();
    if (!v) { i.focus(); return; }
    Rec.setting(APP.id, 'name', v);
    h.close();
    if (then) then();
  };
  const h = UI.dialog({
    title: 'YOUR NAME', width: 420,
    body: (b, hh) => {
      b.appendChild(el('p', 'muted', 'It goes on the file, so your coach knows whose check-in it is.'));
      const i = UI.field('name', { placeholder: 'First and last name' });
      b.appendChild(i);
      Mobile.form(b, () => keep(hh, i));
    },
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: hh => { keep(hh, hh.body.querySelector('input')); return false; } }],
  });

}

function openFiles() {
  const i = document.createElement('input');

  i.onchange = () => {
    const files = Array.from(i.files || []);

    Promise.all(files.map(f => IO.read(f).catch(() => null))).then(bags => {

      if (!good.length) return UI.toast('Those files are not check-ins.', { bad: true });

/* whose file: this device's person, or a client. Asked once per sender. */
const bagPid = bag => bag.pid || ('n-' + slug(bag.name || 'client'));
async function takeBags(bags, skipped) {
  const mine = opt('mine', []) || [];
  let last = null, n = 0;
  for (const bag of bags) {
    const from = bagPid(bag);
    let target;
    if (from === Rec.setting(APP.id, 'pid') || mine.indexOf(from) >= 0) target = '';
    else if (people()[from]) target = from;
    else {
      const me = await UI.confirm('Is this check-in yours?', 'It is from ' + (bag.name || 'someone') + '. Yours joins your own check-ins, and anyone else’s gets a place of their own.', { yes: 'IT IS MINE', no: 'A CLIENT’S', title: 'WHOSE CHECK-IN' });
      if (me) { mine.push(from); Rec.setting(APP.id, 'mine', mine); target = ''; }
      else target = from;
    }
    takeBag(bag, target);
    last = target; n++;
  }
  who = last == null ? who : last;
  const lastBag = bags[bags.length - 1];
  day = lastBag.date || lastDate(who) || Day.today();
  view = 'today';
  draw();
  UI.toast(n + (n === 1 ? ' check-in' : ' check-ins') + ' from ' + esc(nameOf(who)) + ' kept.' + (skipped ? ' ' + skipped + ' other file' + (skipped === 1 ? ' was' : 's were') + ' not a check-in.' : ''));
  measureMissing(who);
}
function takeBag(bag, pid) {
  if (pid) {
    const cur = people()[pid] || {};
    patch('cperson', null, pid, {
      name: bag.name || cur.name || 'Client', animal: bag.animal || cur.animal || 'bear', unit: bag.unit || cur.unit || 'lb',
      fields: Array.isArray(bag.fields) && bag.fields.length ? bag.fields : (cur.fields || DEFAULTS), seen: new Date().toISOString(),
    });
  }
  /* a file from before the dots and the client ids still opens: its photos
     were front, side and back */
  bag.rows.forEach(r => {
    if (!r || !r.type) return;
    let type = r.type, key = String(r.key), payload = r.payload;
    if (type === 'ev') {
      if (key !== 'weight' || !payload || !payload.e || !payload.e.length) return;
      if (!pid) { if (!Rec.has('ev', r.date, 'weight')) Rec.set('ev', r.date, 'weight', payload); return; }
      type = 'cval'; payload = { v: payload.e[payload.e.length - 1].v };
    }
    if (APP.types.indexOf(type) < 0 || type === 'cfield' || type === 'cperson') return;
    const k = K(pid, key);
    const have = Rec.row(type, r.date, k);
    /* newer wins, the way the store merges: an old file never undoes a newer
       change, including dots the coach has checked */
    if (have && (!r.updated_at || have.updated_at >= r.updated_at)) return;
    Rec.set(type, r.date, k, payload);
  });
}

/* ══════════════ settings ══════════════ */
function openSettings() {
  UI.settings(APP.id, [
    { id: 'questions', name: 'QUESTIONS', draw: drawQuestions },
    { id: 'camera', name: 'CAMERA', draw: drawCamera },
    { id: 'you', name: 'YOU', draw: drawYou },
    { id: 'people', name: 'CLIENTS', draw: drawPeople },
  ], { order: ['questions', 'camera', 'you', 'people', 'app', 'data'] });
}
$('#bSet').onclick = openSettings;

function drawQuestions(p) {
  const redraw = () => { p.innerHTML = ''; drawQuestions(p); draw(); };
  p.appendChild(el('p', 'muted', 'What a check-in asks. Switching one off hides it and keeps every answer already given. Hold or right-click one to rename it.'));
  fieldList().forEach(f => {
    const note = f.kind === 'photo' ? (f.id === 'front' ? 'a photo, always asked' : 'a photo') : f.kind === 'number' ? 'a number' + (f.unit ? ', in ' + esc(f.unit) : '') : f.kind === 'scale' ? '1 to 5' : 'words';
    const row = UI.row(f.label, note, f.id === 'front' ? null : UI.toggle(!!f.on, on => { saveField(f.id, { on: on ? 1 : 0 }); draw(); }));
    Mobile.hold(row, e => UI.menu(e.clientX, e.clientY, [{ label: 'Rename', fn: () => renameField(f, redraw) }], { title: f.label.toUpperCase() }), { skip: '.mb-sw' });
    p.appendChild(row);
  });
  const acts = el('div', 'acts');
  const pose = el('button', 'mb-btn mb-press mb-tap', ICN('photo') + '<span>Add a pose</span>');
  pose.onclick = () => {
    const photos = photoFields(), last = photos.reduce((m, f) => Math.max(m, f.ord || 0), 0);
    saveField('pose-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4), { label: 'Pose ' + (photos.filter(f => f.on).length + 1), kind: 'photo', ord: last + 0.01, on: 1 });
    redraw();
  };
  const add = el('button', 'mb-btn mb-press mb-tap', ICN('add') + '<span>Add a question</span>');
  add.onclick = () => addField(redraw);
  acts.appendChild(pose); acts.appendChild(add);
  p.appendChild(acts);
  paintIcons(p);
}

function addField(redraw) {
  let kind = 'scale', unit = null;
  const h = UI.dialog({
    title: 'ADD A QUESTION', width: 460,
    body: b => {
      const name = UI.field('text', { placeholder: 'Stress this week, hunger, steps' });
      name.classList.add('qname');
      b.appendChild(name);
      b.appendChild(UI.segmented([{ id: 'scale', name: '1 to 5' }, { id: 'number', name: 'A number' }, { id: 'text', name: 'Words' }], kind,
        k => { kind = k; unit.style.display = k === 'number' ? '' : 'none'; }));
      unit = UI.field('text', { placeholder: 'Unit, like cm' });
      unit.style.display = 'none';
      b.appendChild(unit);
    },
    actions: [{ label: 'CANCEL' }, { label: 'ADD', kind: 'go', fn: hh => {
      const n = hh.body.querySelector('.qname').value.trim();
      if (!n) { hh.body.querySelector('.qname').focus(); return false; }
      const ord = fieldList().reduce((m, f) => Math.max(m, f.ord || 0), 0) + 1;
      saveField(slug(n) + '-' + Date.now().toString(36), { label: n, kind: kind, unit: kind === 'number' ? unit.value.trim() : '', ord: ord, on: 1 });
      redraw();
    } }],
  });
  if (h && h.body) UI.focusSoon(h.body.querySelector('.qname'));
}

function renameField(f, redraw) {
  const h = UI.dialog({
    title: 'RENAME', width: 420,
    body: b => b.appendChild(UI.field('text', { value: f.label })),
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: hh => {
      const v = hh.body.querySelector('input').value.trim();
      if (!v) return false;
      saveField(f.id, { label: v });
      redraw();
    } }],
  });
  if (h && h.body) UI.focusSoon(h.body.querySelector('input'));
}

function drawCamera(p) {
  const sw = (title, note, k, def) => p.appendChild(UI.row(title, note, UI.toggle(optOn(k, def), v => Rec.setting(APP.id, k, v ? 1 : 0))));
  p.appendChild(el('p', 'muted', 'How the Check In camera helps this week&#8217;s photo match last week&#8217;s.'));
  sw('Take it automatically', 'Once everything lines up and you hold still, it counts three and takes the photo.', 'auto', 1);
  sw('Beeps while lining up', 'Faster as you get closer, like a parking sensor.', 'beeps', 1);
  sw('Spoken directions', 'Step back, move left, and so on, in the phone&#8217;s own voice.', 'voice', 1);
  sw('Light check', 'Says when the light is brighter or darker than last time. It never stops the photo.', 'light', 1);
  sw('Setup photo', 'A photo of where the phone sits and where you stand, shown before every check-in.', 'setup', 0);
  const s = peek('cref', null, 'setup');
  if (s) {
    const b = el('button', 'mb-btn mb-press mb-tap', 'Forget the setup photo');
    b.onclick = () => { const was = Rec.get('cref', null, 'setup'); Rec.del('cref', null, 'setup'); UI.undo('Setup photo forgotten', () => Rec.set('cref', null, 'setup', was)); };
    p.appendChild(UI.row('The setup photo', 'Taken ' + esc(Day.label(Day.calendar(s.t || Date.now()))) + '.', b));
  }
  const cache = el('button', 'mb-btn mb-press mb-tap', 'Get it now');
  cache.onclick = () => { engine().then(() => UI.toast('The body finder is ready, and kept for next time.'), () => UI.toast('The body finder could not load.', { bad: true })); };
  p.appendChild(UI.row('The body finder', 'Downloads once, about 20MB, then works with no signal. It loads by itself the first time it is needed.', cache));
}

function drawYou(p) {
  const i = UI.field('name', { value: myName() || '', placeholder: 'First and last name' });
  i.addEventListener('change', () => { Rec.setting(APP.id, 'name', i.value.trim() || null); draw(); });
  p.appendChild(UI.row('Your name', 'On every file you send, so your coach knows whose check-in it is.', i));
  p.appendChild(el('p', 'muted', 'Your animal. It covers your face in a timelapse when you choose to, and it goes to your coach with your check-ins.'));
  p.appendChild(animalPicker(opt('animal', 'bear'), k => Rec.setting(APP.id, 'animal', k)));
  const o = el('button', 'mb-btn mb-press mb-tap', ICN('import') + '<span>Open</span>');
  o.onclick = openFiles;
  p.appendChild(UI.row('A check-in file', 'One a client sent you, or one you sent from your own phone. Each one is kept under whoever sent it.', o));
  paintIcons(p);
}

function drawPeople(p) {
  const ppl = people(), ids = Object.keys(ppl);
  if (!ids.length) { p.appendChild(el('p', 'muted', 'Nobody yet. Open a check-in file a client sent you and they appear here.')); return; }
  ids.sort((a, b) => String(ppl[a].name).localeCompare(String(ppl[b].name))).forEach(pid => {
    const n = checkinDates(pid).length;
    const b = el('button', 'mb-btn mb-press mb-tap', 'Remove');
    b.onclick = () => UI.confirm('Remove ' + (ppl[pid].name || 'this client') + '?', 'Their ' + n + (n === 1 ? ' check-in goes' : ' check-ins go') + ' from this device. Their own phone keeps its copy.', { danger: true, yes: 'REMOVE', title: 'REMOVE CLIENT' }).then(yes => {
      if (!yes) return;
      const gone = [];
      ['cval', 'cphoto', 'checkin', 'cmark', 'cref'].forEach(t => Rec.all(t).forEach(r => { if (belongs(r.key, pid)) gone.push([t, r.date, r.key, r.payload]); }));
      const person = Rec.get('cperson', null, pid);
      gone.forEach(g => Rec.del(g[0], g[1], g[2]));
      Rec.del('cperson', null, pid);
      if (who === pid) who = '';
      p.innerHTML = ''; drawPeople(p); draw();
      UI.undo(esc(person.name || 'Client') + ' removed', () => { Rec.set('cperson', null, pid, person); gone.forEach(g => Rec.set(g[0], g[1], g[2], g[3])); });
    });
    p.appendChild(UI.row(ppl[pid].name || 'Client', n + (n === 1 ? ' check-in' : ' check-ins') + (ppl[pid].seen ? ', last file ' + esc(Day.label(Day.calendar(Date.parse(ppl[pid].seen)))) : ''), b));
  });
}

/* First paint from what localStorage already has; photos are big rows and
   arrive from IndexedDB a moment later, so draw again when they land. */
Rec.on(soon);
Day.on(soon);
Rec.ready(draw);
draw();
</script>
