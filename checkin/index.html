<html lang="en">

<style>
/* CHECK IN. Everywhere: built to the phone rules, laid out in two columns on a
   wide window. Every colour and size is a token. */
*{box-sizing:border-box;margin:0;padding:0}
/* .mb-btn sets its own display, which would otherwise beat the hidden attribute */
[hidden]{display:none !important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em;white-space:nowrap}
.logo b{color:var(--accent)}
.spacer{flex:1}
#bWho{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* the three views. Real buttons at the full tap height, not the shared
   segmented control, which is still under it (root brief, foundation item 9) */
#nav{flex:0 0 auto;display:flex;gap:var(--s-1);padding:var(--s-2) var(--s-4);background:var(--surface-1);overflow-x:auto}
#nav button{flex:1;min-height:var(--tap);border:0;border-radius:var(--radius-md);background:none;color:var(--text-muted);
  font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);letter-spacing:var(--track-cap);cursor:pointer;white-space:nowrap;padding:0 var(--s-3)}
#nav button.on{background:var(--surface-2);color:var(--text-1)}

main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-6) + var(--safe-b))}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s-4);align-items:start}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:var(--s-4);min-width:0}

.card{border-radius:var(--radius-lg);background:var(--surface-1);padding:var(--s-4);
  box-shadow:var(--e-1),var(--rim);display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted)}
.hd{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.hd h2{flex:1}
.hd input,.hd select{width:auto}
.muted{color:var(--text-muted);font-size:var(--f-2);line-height:var(--lh-body)}
.warnline{color:var(--warn);font-size:var(--f-2);line-height:var(--lh-body)}

/* photo slots, each a real button */
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-2)}
.slot{position:relative;aspect-ratio:3/4;border:0;border-radius:var(--radius-md);background:var(--surface-2);
  overflow:hidden;color:var(--text-muted);font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-1)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .lab{position:relative;font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);letter-spacing:var(--track-cap)}
.slot.has .lab{position:absolute;left:var(--s-1);bottom:var(--s-1);padding:0 var(--s-1);
  border-radius:var(--radius-sm);background:var(--surface-1);color:var(--text-1)}
.slot.add{border:var(--border-width) dashed var(--border-strong);background:none}

.frow{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap)}
.frow .lbl{flex:1;min-width:0}
.frow .lbl small{display:block;color:var(--text-muted);font-size:var(--f-1)}
.frow input{width:6em;min-width:0;text-align:right}
.frow.stack{flex-direction:column;align-items:stretch;gap:var(--s-2)}
.frow textarea{width:100%}
.unit{color:var(--text-muted);font-size:var(--f-2);min-width:2em}
.acts{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}
.acts .grow{flex:1}

.list{display:flex;flex-direction:column;gap:var(--s-2)}
.item{display:flex;align-items:center;gap:var(--s-3);padding:0 0 0 var(--s-3);min-height:var(--tap);
  border-radius:var(--radius-md);background:var(--surface-2);cursor:pointer}
.item.on{outline:2px solid var(--accent);outline-offset:-2px}
.item .nm{flex:1;min-width:0}
.item .nm small{display:block;color:var(--text-muted);font-size:var(--f-1)}
.item .mb-btn{min-width:var(--tap)}
.item .fig3{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:var(--f-2);padding-right:var(--s-3);white-space:nowrap}

.chips{display:flex;gap:var(--s-2);flex-wrap:wrap}
.chips .mb-btn.on{background:var(--accent);color:var(--accent-fg)}

.pick{display:flex;gap:var(--s-2);align-items:center}
.pick select{flex:1;min-width:0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-2)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-2)}
.fig{display:flex;flex-direction:column;gap:var(--s-1);min-width:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.fig img,.fig .nophoto{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--radius-md);background:var(--surface-2)}
.fig .nophoto{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-muted);font-size:var(--f-1);padding:var(--s-2)}
.fig figcaption,.fig .cap{font-size:var(--f-1);color:var(--text-muted)}
.big{width:100%;border-radius:var(--radius-md)}

.tbl{overflow-x:auto}
table.nums{width:100%;border-collapse:collapse;font-size:var(--f-2);font-variant-numeric:tabular-nums}
table.nums td,table.nums th{padding:var(--s-1) var(--s-2);text-align:right;white-space:nowrap}
table.nums th{color:var(--text-muted);font-weight:var(--w-body);font-size:var(--f-1)}
table.nums td:first-child,table.nums th:first-child{text-align:left;white-space:normal}
.said{white-space:pre-wrap;line-height:var(--lh-body)}

/* ── the camera ── full screen, above everything, its own back step */
.full{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column}
.full.on{display:flex}
.fbar{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-2);padding:calc(var(--s-2) + var(--safe-t)) var(--s-3) var(--s-2);background:var(--surface-1)}
.fbar .t{flex:1;min-width:0}
.fbar .t b{display:block;font-family:var(--font-display);font-size:var(--f-2);letter-spacing:var(--track-cap)}
.fbar .t small{display:block;color:var(--text-muted);font-size:var(--f-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbot{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4) calc(var(--s-3) + var(--safe-b));background:var(--surface-1)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);touch-action:none}
.stage video,.stage .ghost,.stage canvas.over{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .ghost{pointer-events:none}
.stage.mirror video,.stage.mirror .ghost,.stage.mirror canvas.over{transform:scaleX(-1)}
.cchips{position:absolute;left:var(--s-2);right:var(--s-2);top:var(--s-2);display:flex;flex-wrap:wrap;gap:var(--s-1);pointer-events:none}
.cchip{padding:var(--s-1) var(--s-2);border-radius:var(--radius-full);background:var(--surface-1);color:var(--text-2);font-size:var(--f-1);box-shadow:var(--e-1)}
.cchip.ok{background:var(--success);color:var(--bg)}
.cchip.no{background:var(--warn);color:var(--bg)}
.csay{position:absolute;left:50%;bottom:var(--s-4);transform:translateX(-50%);max-width:90%;text-align:center;
  padding:var(--s-2) var(--s-4);border-radius:var(--radius-full);background:var(--surface-1);box-shadow:var(--e-2);
  font-family:var(--font-display);font-size:var(--f-4);font-weight:var(--w-bold);pointer-events:none}
.csay:empty{display:none}
.ccount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:var(--font-display);font-size:var(--f-9, var(--f-5));font-weight:var(--w-bold);color:var(--accent)}
.ccount:empty{display:none}
.cflash{position:absolute;inset:0;background:var(--text-1);opacity:0;pointer-events:none;transition:opacity var(--dur-fast)}
.cflash.on{opacity:.7}
.creview{position:absolute;right:var(--s-3);bottom:var(--s-3);width:32%;display:none;flex-direction:column;gap:var(--s-1);
  padding:var(--s-1);border-radius:var(--radius-md);background:var(--surface-1);box-shadow:var(--e-3)}
.creview.on{display:flex}
.creview img{width:100%;border-radius:var(--radius-sm)}
.setupimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.setupimg.on{display:block}
.shutter{flex:0 0 auto;width:calc(var(--tap) * 1.6);height:calc(var(--tap) * 1.6);border-radius:var(--radius-full);
  border:var(--s-1) solid var(--text-1);background:var(--accent);cursor:pointer}
.fbot input[type=range]{flex:1;min-width:0;height:var(--tap);accent-color:var(--accent)}
.fbot .mb-btn.on{background:var(--accent);color:var(--accent-fg)}
.fbot .side{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;flex:1}
.fbot .side small{font-size:var(--f-1);color:var(--text-muted)}

/* ── the dots ── */
.dots .stage img{position:absolute;object-fit:fill}
.dots svg{position:absolute;pointer-events:none;overflow:visible}
.handle{position:absolute;width:var(--tap);height:var(--tap);margin:calc(var(--tap) / -2) 0 0 calc(var(--tap) / -2);
  border:0;background:none;cursor:grab;touch-action:none;padding:0}
.handle::after{content:'';position:absolute;left:50%;top:50%;width:var(--s-4);height:var(--s-4);transform:translate(-50%,-50%);
  border-radius:var(--radius-full);background:var(--accent);box-shadow:var(--e-2);border:2px solid var(--bg)}
.handle.guess::after{background:var(--warn)}
.dread{padding:var(--s-2) var(--s-4);background:var(--surface-1);font-size:var(--f-2);color:var(--text-2);font-variant-numeric:tabular-nums}

/* ── the timelapse ── */
.player{display:flex;justify-content:center}
.player canvas{height:min(64vh,150vw);width:auto;max-width:100%;border-radius:var(--radius-md);background:var(--bg);touch-action:pan-y}
.scrub{width:100%;height:var(--tap);accent-color:var(--accent)}
.animals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-2)}
.animals button{aspect-ratio:1;border:2px solid transparent;border-radius:var(--radius-md);background:var(--surface-2);cursor:pointer;padding:var(--s-1);min-height:var(--tap)}
.animals button.on{border-color:var(--accent)}
.animals canvas{width:100%;height:100%}
</style>

<body>
<header>
  <div class="logo">CHECK<b>IN</b></div>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" id="bWho" aria-label="Whose check-ins" data-icon="person" hidden></button>
  <button class="mb-btn mb-press mb-tap" id="bSet" aria-label="Settings" data-icon="settings"></button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>
<nav id="nav">
  <button type="button" data-v="today" class="mb-press on">CHECK-IN</button>
  <button type="button" data-v="progress" class="mb-press">PROGRESS</button>
  <button type="button" data-v="timelapse" class="mb-press">TIMELAPSE</button>
</nav>
<main class="mb-scroll"><div class="wrap" id="main"></div></main>

<script>
/* ══════════════ CHECK IN ══════════════
   Physique check-ins, for Tom and for his clients. Set by Tom on 2026-09-14,
   and grown on 2026-09-15 into what he asked for first: "I give a goal
   physique, then regular check in pictures. You tell me how far off I am",
   with a timelapse. checkin/CLAUDE.md is this app's brief and says why each
   piece is the way it is.

   A check-in is a date with a front photo (and any pose added), a weight and
   a few answers. Each photo is measured: a body finder (Google's MediaPipe,
   running on the device) places dots at the shoulders, the narrowest waist and
   the hips, anyone can drag them, and three widths become three ratios. The
   same ratios on a goal photo are the goal. Numbers only, never a verdict.

   Rows, one fact each. A client's rows carry their id in front of the key,
   `pid|front`, the way ARC puts the map in front of a node. A key with no bar
   belongs to whoever uses this device.
     cfield   key: field id               what a check-in asks {label, kind, unit, ord, on}
     cval     date, key: field id         one answer on one day {v}. A client's weight is `pid|weight`
     cphoto   date, key: pose id          one photo {img, w, h, t, cam, src, lum, tilt, match}. Big: IndexedDB
     cmark    date, key: as the photo     the dots on that photo {pts, guess, lm, by, found}. Kept OFF the
                                          photo, so dragging a dot never rewrites a picture
     cref     key: goal:pose or setup     a goal photo, or where the phone stands. Undated
     cperson  key: pid                    a client {name, animal, fields, unit, seen}
     checkin  date, key: ''               {sent} when this day was sent to a coach

   Weight for the person on this device is NOT here. It is STATUS's `ev` row
   for the field `weight`, read and written the way STATUS writes it, so a
   weight typed in either app is the same number in both. */

const APP = {
  id: 'checkin',
  name: 'CHECK IN',
  icon: '◎',
  blurb: 'photos, weight and how the week went',
  /* `phase` is TRAIN's type and CHECK IN writes it too, since a project here
     IS a training block. Registered so the ones added from this screen reach
     the sheet, and read back from TRAIN below so a device where TRAIN has
     never been opened still sees the blocks (foundation item 19). */
  types: ['cfield', 'cval', 'cphoto', 'checkin', 'cmark', 'cref', 'cperson', 'phase'],
};

Skins.load('../shared/skins.json').then(() => { Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* `reads`: the weigh-ins, which are STATUS's rows, from STATUS's sheet tab */
IO.register({ app: APP.id, name: APP.name, types: APP.types,
  reads: { status: ['ev', 'field'], train: ['phase'] } });

const $ = s => document.querySelector(s);
const esc = UI.esc;
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const num = s => { const v = parseFloat(String(s).replace(',', '.')); return isFinite(v) ? v : null; };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'client';
const r1 = v => Math.round(v * 10) / 10;
const r2 = v => Math.round(v * 100) / 100;
const r4 = v => Math.round(v * 10000) / 10000;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* Long edge of a stored photo. 1920 is what a timelapse video is made at, so a
   photo is never the blurry frame in the video; about 400KB each. The phone's
   own camera takes more, and that original stays in the phone's Photos. */
const MAXPX = 1920;
const JPEG_Q = 0.85;
const ICN = role => '<span data-icon="' + role + '"></span>';
const paintIcons = n => { if (window.Icons) Icons.paint(n || document.body); };

/* A read that does not copy. Rec.get copies the payload, and a photo payload
   is a few hundred kilobytes, so counting photos with it copies megabytes.
   Never change what this hands back. */
const peek = (type, date, key) => { const r = Rec.row(type, date, key); return r ? r.payload : null; };
/* Merged into what is there, never rebuilt (root brief, many writers). */
function patch(type, date, key, changes) {
  if (Rec.patch) return Rec.patch(type, date, key, changes);
  return Rec.set(type, date, key, Object.assign({}, Rec.get(type, date, key) || {}, changes));
}
const opt = (k, def) => { const v = Rec.setting(APP.id, k); return v == null ? def : v; };
const optOn = (k, def) => { const v = opt(k, def); return v === true || +v === 1; };

/* ══════════════ whose check-ins ══════════════ */
let who = '';                                     /* '' is whoever uses this device */
const K = (pid, key) => pid ? pid + '|' + key : String(key);
const belongs = (key, pid) => pid ? String(key).indexOf(pid + '|') === 0 : String(key).indexOf('|') < 0;
const bare = key => { const s = String(key), i = s.indexOf('|'); return i < 0 ? s : s.slice(i + 1); };
const people = () => Rec.map('cperson');
const myName = () => Rec.setting(APP.id, 'name');
const nameOf = pid => pid ? ((people()[pid] || {}).name || 'Client') : (myName() || 'You');
function myPid() {
  let p = Rec.setting(APP.id, 'pid');
  if (!p) { p = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); Rec.setting(APP.id, 'pid', p); }
  return p;
}
const animalOf = pid => pid ? ((people()[pid] || {}).animal || 'bear') : opt('animal', 'bear');

/* ── what a check-in asks ──
   Vocabulary, not prescription. These are shown until the list is changed,
   and written down the first time anything in it is, so a coach's own
   questions become data rather than something this file decides. */
const DEFAULTS = [
  /* Photos are questions too, and one ships: Front. Every other pose is added
     with one tap and no name to type (Tom, 2026-09-15). */
  { id: 'front', label: 'Front', kind: 'photo', on: 1 },
  { id: 'waist', label: 'Waist', kind: 'number', unit: 'cm', on: 1 },
  { id: 'hips', label: 'Hips', kind: 'number', unit: 'cm', on: 0 },
  { id: 'chest', label: 'Chest', kind: 'number', unit: 'cm', on: 0 },
  { id: 'arm', label: 'Arm', kind: 'number', unit: 'cm', on: 0 },
  { id: 'thigh', label: 'Thigh', kind: 'number', unit: 'cm', on: 0 },
  { id: 'training', label: 'Training this week', kind: 'scale', on: 1 },
  { id: 'food', label: 'Food this week', kind: 'scale', on: 1 },
  { id: 'sleep', label: 'Sleep this week', kind: 'scale', on: 1 },
  { id: 'note', label: 'Anything else', kind: 'text', on: 1 },
].map((f, i) => Object.assign({ ord: i }, f));

/* A saved row wins over its default, and a default fills in wherever there
   is no row. So a question added to this list later still reaches somebody
   who had already changed a different one. */
function fieldMap() {
  const m = {};
  DEFAULTS.forEach(f => { const p = Object.assign({}, f); delete p.id; m[f.id] = p; });
  const rows = Rec.map('cfield');
  Object.keys(rows).forEach(id => { m[id] = Object.assign(m[id] || {}, rows[id]); });
  if (m.front) m.front.on = 1;                    /* Front is the one photo every check-in has */
  return m;
}
const fieldList = () => Object.entries(fieldMap()).map(([id, f]) => Object.assign({ id: id }, f))
  .sort((a, b) => (a.ord || 0) - (b.ord || 0));
const photoFields = () => fieldList().filter(f => f.kind === 'photo');
function saveField(id, changes) { patch('cfield', null, id, Object.assign({}, fieldMap()[id] || {}, changes)); }

/* A client's questions and poses are the ones their file carried. */
function fieldsOf(pid) {
  if (!pid) return fieldList();
  const f = (people()[pid] || {}).fields;
  return Array.isArray(f) && f.length ? f : DEFAULTS;
}
function posesOf(pid) {
  pid = pid == null ? who : pid;
  const list = fieldsOf(pid).filter(f => f.kind === 'photo' && (f.on || f.id === 'front'));
  return list.length ? list : [{ id: 'front', label: 'Front', kind: 'photo', on: 1 }];
}
const poseLabel = (pid, pose) => { const f = fieldsOf(pid).filter(x => x.id === pose)[0]; return f ? f.label : pose; };

/* ── weight, which is STATUS's for the person on this device ── */
const wField = () => Rec.map('field').weight || null;
const wUnit = () => (wField() || {}).unit || 'lb';      /* STATUS's own default, so both apps agree */
function weightOn(date) {
  const r = peek('ev', date, 'weight'), e = r && r.e ? r.e : [];
  return e.length ? e[e.length - 1].v : null;
}
function setWeight(date, v) {
  if (v == null) { Rec.del('ev', date, 'weight'); return; }
  /* STATUS keeps one weight a day unless its field says otherwise, and its
     own evAdd replaces the day's reading. Same here, merged into the row. */
  const r = Rec.get('ev', date, 'weight') || {}, f = wField();
  const e = (f && !f.once) ? (r.e || []).slice() : [];
  e.push({ t: Date.now(), v: v });
  Rec.set('ev', date, 'weight', Object.assign(r, { e: e }));
}
function weightOf(date, pid) {
  pid = pid == null ? who : pid;
  if (!pid) return weightOn(date);
  const r = peek('cval', date, K(pid, 'weight'));

/* ══════════════ projects ══════════════
   Tom, 2026-09-17: "be able to denote projects in check in", and a project is
   a training phase: a cut, a bulk, a prep. A named stretch with a start and
   maybe an end.

   These are TRAIN's `phase` rows, not a second list of the same thing. A
   training block is a training block whichever app you are standing in, and
   two lists would mean naming his cut twice and watching them disagree. The
   ownership rule permits this: an owner is who is responsible for the SHAPE,
   not who is allowed to write (root brief, "Many writers is fine"). So this
   reads them all and, when it adds one, patches rather than rebuilds, which is
   the rule that actually protects a row.

   because which block you are looking at is a view and not a record. */
const phases = () => Rec.all('phase')
  .filter(r => !r.deleted && r.payload && r.payload.start)
  .map(r => ({ key: r.key, name: r.payload.name || 'Block', start: r.payload.start, end: r.payload.end || null }))
  .sort((a, b) => String(b.start).localeCompare(String(a.start)));

}

function loadImg(src) {

      URL.revokeObjectURL(url);

    }, err => { URL.revokeObjectURL(url); rej(err); });

/* ══════════════ the body finder ══════════════
   Google's MediaPipe pose landmarker: 33 points on a body and an outline of
   it. Chosen 2026-09-15 as the best tool that runs on the device with no
   server: MoveNet has no outline, BodyPix is its retired predecessor, and the
   body-part models that measure a waist more precisely are 50 to 200MB.

   It runs on the processor, not the graphics chip. In the test browser the
   graphics path found no body in a photo the processor path found in 0.36s,
   and a wrong answer that looks like "nobody there" is the worst kind.

   About 9MB of model and 11MB of engine, fetched once. They are kept with the
   browser's Cache API, not the store: they are Google's code, not his data,
   and a backup has no business carrying them. If they cannot load, nothing
   breaks: the dots start in the middle of the photo and he drags them. */
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task';
const ENGINE_CACHE = 'checkin-body-finder-1';
let engineP = null, engineState = 'idle';

async function grab(url) {
  let c = null;
  try { c = window.caches ? await caches.open(ENGINE_CACHE) : null; } catch (e) { c = null; }
  if (c) { const hit = await c.match(url); if (hit) return hit; }
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
  if (c) { try { await c.put(url, r.clone()); } catch (e) {} }

}
async function blobUrl(url, type) {
  const r = await grab(url);

}
function engine() {
  if (engineP) return engineP;
  engineState = 'loading';
  engineNote();
  engineP = (async () => {
    const mod = await import(await blobUrl(MP + '/vision_bundle.mjs', 'text/javascript'));
    const simd = mod.FilesetResolver.isSimdSupported ? await mod.FilesetResolver.isSimdSupported() : true;
    const base = MP + '/wasm/vision_wasm_' + (simd ? '' : 'nosimd_') + 'internal';
    const files = {
      wasmLoaderPath: await blobUrl(base + '.js', 'text/javascript'),
      wasmBinaryPath: await blobUrl(base + '.wasm', 'application/wasm'),
    };
    const model = new Uint8Array(await (await grab(MODEL)).arrayBuffer());
    const make = mode => mod.PoseLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetBuffer: model.slice(), delegate: 'CPU' },
      runningMode: mode, numPoses: 1, outputSegmentationMasks: mode === 'IMAGE',
      minPoseDetectionConfidence: 0.3, minPosePresenceConfidence: 0.3,
    });
    const still = await make('IMAGE');
    const live = await make('VIDEO');
    engineState = 'ready';
    engineNote();
    return { still: still, live: live };
  })();
  engineP.catch(e => { console.warn('[checkin] the body finder did not load', e); engineState = 'failed'; engineP = null; engineNote(); });
  return engineP;
}
function engineNote() {
  document.querySelectorAll('.engineNote').forEach(n => { n.textContent = engineLine(); n.hidden = !n.textContent; });
}
function engineLine() {
  if (engineState === 'loading') return 'Getting the body finder ready. About 20MB, and only the first time.';
  if (engineState === 'failed') return 'The body finder could not load here, so the dots start in the middle for you to drag.';
  return '';
}

/* ── measuring one photo ──
   The widths are read off the outline, row by row, as the run of body that
   contains the middle of the torso:
     shoulders  the widest row from just above the shoulder joints to 15% of
                the way down the torso, deltoids included
     waist      the narrowest row between 35% and 90% of the torso
     hips       the widest row between 80% and 105%
   Where an arm hangs against the body the run includes it, so any arm or hand
   line crossing a waist or hip row inside the run cuts it there, and that dot
   is marked as a guess for him to look at. Tested 2026-09-15 on a photo with
   the arms apart: 339, 243 and 268 pixels, all three where an eye puts them. */
const KEEP = [0, 2, 5, 7, 8, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
function packLm(L) {
  const o = {};
  KEEP.forEach(i => { const p = L[i]; if (p) o[i] = [r4(p.x), r4(p.y), r4(p.z), r4(p.visibility || 0)]; });
  return o;
}
async function measure(photo) {
  const E = await engine();
  const im = await loadImg(photo.img);
  const c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  c.getContext('2d').drawImage(im, 0, 0);
  const res = E.still.detect(c);
  const L = res.landmarks && res.landmarks[0];
  const mk = res.segmentationMasks && res.segmentationMasks[0];
  try {
    if (!L) return Object.assign(centreMark(), { found: 0 });
    const out = mk ? outline(L, mk.getAsFloat32Array(), mk.width, mk.height) : joints(L);
    return Object.assign(out, { found: 1, lm: packLm(L), by: 'auto', v: 1 });
  } finally { if (mk && mk.close) mk.close(); }
}
function outline(L, f, W, H) {
  const P = i => ({ x: L[i].x * W, y: L[i].y * H });
  const s1 = P(11), s2 = P(12), h1 = P(23), h2 = P(24);
  const shy = (s1.y + s2.y) / 2, hpy = (h1.y + h2.y) / 2, t = Math.max(8, hpy - shy);
  const cx = (s1.x + s2.x + h1.x + h2.x) / 4;
  const arms = [[11, 13, 15], [12, 14, 16]].map(ch => {
    const a = P(ch[0]), b = P(ch[1]), w = P(ch[2]);
    return [a, b, w, { x: w.x + (w.x - b.x) * 0.45, y: w.y + (w.y - b.y) * 0.45 }];   /* the hand past the wrist */
  });
  const half = 0.07 * t;
  const on = (y, x) => x >= 0 && x < W && f[y * W + (x | 0)] >= 0.5;
  const armAt = (arm, y) => {
    for (let i = 0; i < 3; i++) {
      const p = arm[i], q = arm[i + 1];
      if (p.y !== q.y && (y - p.y) * (y - q.y) <= 0) return p.x + (q.x - p.x) * (y - p.y) / (q.y - p.y);
    }

  };
  function raw(y) {
    let x = Math.round(cx);
    if (!on(y, x)) {
      let k = 1;
      while (k < t * 0.3 && !on(y, x - k) && !on(y, x + k)) k++;
      if (on(y, x - k)) x -= k; else if (on(y, x + k)) x += k; else return null;
    }
    let a = x, b = x;
    while (a > 0 && on(y, a - 1)) a--;
    while (b < W - 1 && on(y, b + 1)) b++;

     between chest and hips: an arm hanging apart shows as a second patch of
     body beside the torso on most of them. Deciding row by row flickered at
     the threshold, and "widest row" then picked the rows that were not cut,
     so the same body at another distance got other hips (caught 2026-09-15). */
  /* An arm hanging apart can still meet the body lower down: a hand resting
     on the thigh joins the outline at hip height. So for that side the edge
     may not run past the furthest torso edge seen while the arm was clearly
     apart, plus a tenth of the torso for the hips flaring out. Found on the
     goal photo, 2026-09-15, where it added the hand to the hips. */

        if (cap > cx && b > cap) { b = Math.round(cap); g = 1; }

     and a hand curled onto the thigh: reaching to 30% took the flare of the

    pts: { sh: n(sh) || fb.pts.sh, wa: n(wa) || fb.pts.wa, hi: n(hi) || fb.pts.hi },

    const w = weightOn(day);
    c.appendChild(numRow('Weight', w, wUnit(), w != null ? 'the same number STATUS has' : 'saved in STATUS too', v => setWeight(day, v)));
    fieldList().filter(f => f.on && f.kind !== 'photo').forEach(f => {
      if (f.kind === 'number') c.appendChild(numRow(f.label, valOf(day, f.id, ''), f.unit || '', '', v => setVal(day, f.id, v)));
      else if (f.kind === 'scale') c.appendChild(scaleRow(f));
      else c.appendChild(textRow(f));
    });
    const acts = el('div', 'acts');
    const send = el('button', 'mb-btn mb-press mb-tap', ICN('share') + '<span>Send to coach</span>');
    send.onclick = () => sendToCoach(day);
    acts.appendChild(send);
    const st = peek('checkin', day, '');
    if (st && st.sent) acts.appendChild(el('span', 'muted', 'Sent ' + esc(Day.label(Day.calendar(Date.parse(st.sent))))));
    c.appendChild(acts);
  } else {
    c.appendChild(answersTable(who, day));
  }
  return c;
}

/* "Last check-in: 7:12am, 14 Sep". Nothing to fill in, and the easiest way
   to take the next one at the same time of day. */
function lastTime(date) {
  const earlier = checkinDates('').filter(d => d < date);
  for (let i = earlier.length - 1; i >= 0; i--) {
    const d = earlier[i];
    const t = posesOf('').map(p => (photoOf(d, p.id, '') || {}).t).filter(Boolean)[0];
    if (t) {
      const dt = new Date(t);
      return 'Last check-in: ' + UI.clockLabel(String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0')) + ', ' + Day.label(d) + '.';
    }
  }
  return '';
}

function answersTable(pid, date) {
  const wrap = el('div', 'list');
  const lines = [];
  const w = weightOf(date, pid);
  if (w != null) lines.push(['Weight', w + ' ' + unitOf(pid)]);
  const said = [];
  fieldsOf(pid).forEach(f => {
    if (f.kind === 'photo') return;
    const v = valOf(date, f.id, pid);
    if (v == null) return;
    if (f.kind === 'text') said.push([f.label, v]);
    else lines.push([f.label, v + (f.kind === 'scale' ? ' of 5' : (f.unit ? ' ' + f.unit : ''))]);
  });
  if (lines.length) {
    const t = el('table', 'nums');
    t.innerHTML = lines.map(l => '<tr><td>' + esc(l[0]) + '</td><td>' + esc(l[1]) + '</td></tr>').join('');
    wrap.appendChild(t);
  }
  said.forEach(s => { wrap.appendChild(el('h2', null, esc(s[0].toUpperCase()))); wrap.appendChild(el('p', 'said', esc(s[1]))); });
  if (!lines.length && !said.length) wrap.appendChild(el('p', 'muted', 'No answers in this check-in.'));
  return wrap;
}

function numRow(label, value, unit, note, onset) {
  const r = el('label', 'frow');
  r.appendChild(el('span', 'lbl', esc(label) + (note ? '<small>' + esc(note) + '</small>' : '')));
  const i = UI.field('decimal', { value: value == null ? '' : String(value) });
  i.setAttribute('aria-label', label);
  i.addEventListener('change', () => {
    const t = i.value.trim(), v = t === '' ? null : num(t);
    if (t !== '' && v == null) { UI.toast(esc(t) + ' is not a number.', { bad: true }); return; }
    onset(v);
  });
  r.appendChild(i);
  r.appendChild(el('span', 'unit', esc(unit)));
  return r;
}

function scaleRow(f) {
  const r = el('div', 'frow stack');
  r.appendChild(el('span', 'lbl', esc(f.label) + '<small>1 is poor, 5 is great</small>'));
  const cur = valOf(day, f.id, '');
  r.appendChild(UI.segmented([1, 2, 3, 4, 5].map(n => ({ id: String(n), name: String(n) })),
    cur == null ? null : String(cur), id => setVal(day, f.id, +id)));
  return r;
}

function textRow(f) {
  const r = el('label', 'frow stack');
  r.appendChild(el('span', 'lbl', esc(f.label)));
  const t = UI.field('note', { value: valOf(day, f.id, '') || '', rows: 3 });
  t.addEventListener('change', () => setVal(day, f.id, t.value.trim() || null));
  r.appendChild(t);
  return r;
}

/* One tap, no name to type. Tom, 2026-09-15: a pose is another line of
   photos with its own ghost. The name is there to change if he wants to. */
function addPose() {
  const photos = photoFields();
  const last = photos.reduce((m, f) => Math.max(m, f.ord || 0), 0);
  const id = 'pose-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
  const label = 'Pose ' + (photos.filter(f => f.on).length + 1);
  saveField(id, { label: label, kind: 'photo', ord: last + 0.01, on: 1 });
  Mobile.feedback('success');
  draw();
  const list = posesOf('');
  Cam.open({ date: day, poses: list, start: list.findIndex(x => x.id === id), only: true });
}

function pickPhoto(pose, how) {
  const d = day, i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  if (how === 'camera') i.setAttribute('capture', 'environment');
  i.onchange = () => {
    const f = i.files && i.files[0];
    if (!f) return;
    shrink(f).then(ph => {
      Rec.set('cphoto', d, pose, ph);
      queueMeasure('cphoto', d, pose);
      Mobile.feedback('success');
    }, err => UI.toast(esc(err.message), { bad: true }));
  };
  i.click();
}

/* Deletes CHECK IN's rows for the day and offers them straight back. The
   weight of the person on this device is STATUS's and stays. */
function delCheckin(d) {
  const gone = [], pid = who;
  ['cval', 'cphoto', 'checkin', 'cmark'].forEach(t => Rec.all(t, { date: d }).forEach(r => { if (belongs(r.key, pid)) gone.push([t, r.key, r.payload]); }));
  gone.forEach(g => Rec.del(g[0], d, g[1]));
  Mobile.haptic('warn');
  UI.undo('Check-in for ' + esc(Day.label(d)) + ' deleted.' + (pid ? '' : ' The weight stays in STATUS.'),
    () => gone.forEach(g => Rec.set(g[0], d, g[1], g[2])));
}

/* ── PROGRESS ──
   The goal, the first and the latest, with three ratios under each. Numbers,
   and the change since the first. Nothing on screen says whether a number is
   good; that is his to say (root brief, and Tom, 2026-09-15). */
function poseChips(cur, onPick, pid) {
  const box = el('div', 'chips');
  posesOf(pid).forEach(p => {
    const b = el('button', 'mb-btn mb-press mb-tap' + (p.id === cur ? ' on' : ''), esc(p.label));
    b.type = 'button';
    b.onclick = () => onPick(p.id);
    box.appendChild(b);
  });
  return box;
}
function drawProgress() {
  const c = el('div', 'card');
  const poses = posesOf(who);
  if (!poses.some(p => p.id === progPose)) progPose = poses[0].id;
  c.appendChild(el('h2', null, 'PROGRESS' + (who ? ', ' + esc(nameOf(who).toUpperCase()) : '')));
  c.appendChild(poseChips(progPose, id => { progPose = id; draw(); }, who));
  const note = el('p', 'muted engineNote', esc(engineLine()));
  note.hidden = !engineLine();
  c.appendChild(note);

  c.appendChild(projChips());

  const pose = progPose, label = poseLabel(who, pose);
  const allDates = poseDates(pose, who);
  const dates = projDates(allDates);
  const ph = phaseByKey(projNow());
  const first = dates[0], latest = dates.length > 1 ? dates[dates.length - 1] : null;
  const cols = [
    { name: 'Goal', ph: goalOf(pose), m: goalMarkOf(pose), open: () => goalMenu(pose, label) },
    { name: first ? (ph ? 'Block start, ' : 'First, ') + Day.short(first) : (ph ? 'Block start' : 'First'),
      ph: first ? photoOf(first, pose) : null, m: first ? markOf(first, pose) : null,
      open: first ? () => Dots.open({ src: 'cphoto', date: first, key: K(who, pose), title: label + ', ' + Day.label(first) }) : null },
    { name: latest ? 'Latest, ' + Day.short(latest) : 'Latest', ph: latest ? photoOf(latest, pose) : null, m: latest ? markOf(latest, pose) : null,
      open: latest ? () => Dots.open({ src: 'cphoto', date: latest, key: K(who, pose), title: label + ', ' + Day.label(latest) }) : null },
  ];
  const trio = el('div', 'trio');
  cols.forEach(col => {
    const f = el('button', 'fig mb-press');
    f.type = 'button';
    if (col.ph) { const img = el('img'); img.src = col.ph.img; img.alt = col.name; f.appendChild(img); }
    else f.appendChild(el('div', 'nophoto', col.name === 'Goal' ? (who ? 'No goal photo' : 'Add a goal photo') : 'No photo yet'));
    f.appendChild(el('span', 'cap', esc(col.name) + (col.ph && col.m ? (col.m.by === 'checked' ? ', dots checked' : ', dots by the app') : '')));
    if (col.open) f.onclick = col.open; else f.disabled = true;
    trio.appendChild(f);
  });
  c.appendChild(trio);

  const R = cols.map(col => ratiosOf(col.m));
  if (R.some(Boolean)) {
    const wrap = el('div', 'tbl'), t = el('table', 'nums');
    t.innerHTML = '<tr><th></th><th>Goal</th><th>' + (ph ? 'Block start' : 'First') + '</th><th>Latest</th><th>' +
      (ph ? 'This block' : 'Since first') + '</th></tr>' +
      RATIOS.map(([k, name]) => {
        const g = R[0] && R[0][k], a = R[1] && R[1][k], b = R[2] && R[2][k];
        /* rounded before the sign is chosen, or a change of -0.001 reads as "−0.00" */
        const ch = a != null && b != null ? Math.round((b - a) * 100) / 100 : null;
        return '<tr><td>' + esc(name) + '</td><td>' + fmtR(g) + '</td><td>' + fmtR(a) + '</td><td>' + fmtR(b) + '</td><td>' +
          (ch == null ? '' : (ch > 0 ? '+' : ch < 0 ? '−' : '') + Math.abs(ch).toFixed(2)) + '</td></tr>';
      }).join('');
    wrap.appendChild(t);
    c.appendChild(wrap);
    if (cols.some(col => col.m && col.m.by !== 'checked' && col.m.guess && (col.m.guess.wa || col.m.guess.hi || col.m.guess.sh)))
      c.appendChild(el('p', 'muted', 'Some dots are the app&#8217;s guesses, where an arm touches the body. Tap a photo to check them.'));
  } else if (dates.length) {
    c.appendChild(el('p', 'muted', 'The photos are being measured.'));
  } else if (ph && allDates.length) {
    c.appendChild(el('p', 'muted', 'No check-in for this pose inside ' + esc(ph.name) + ' yet. ' +
      allDates.length + ' outside it.'));
  } else {
    c.appendChild(el('p', 'muted', 'Once this pose has a photo, its measurements appear here.'));
  }

  const acts = el('div', 'acts');
  const cl = el('button', 'mb-btn mb-press mb-tap', ICN('copy') + '<span>Copy for Claude</span>');
  cl.onclick = forClaude;
  const sv = el('button', 'mb-btn mb-press mb-tap', ICN('download') + '<span>Save photos</span>');
  sv.onclick = () => saveMenu(who);
  acts.appendChild(cl); acts.appendChild(sv);
  c.appendChild(acts);
  return c;
}

/* ── ALL TIME, then one chip per block ──
   The same row of chips the poses already use, so there is one way to narrow
   this screen rather than two. The chip says the dates because a block called
   CUT means nothing six months later without them. */
function projChips() {
  const box = el('div', 'chips');
  const cur = projNow();

  const all = el('button', 'mb-btn mb-press mb-tap' + (cur ? '' : ' on'), 'ALL TIME');
  all.type = 'button';
  all.onclick = () => pick('');

  phases().forEach(ph => {
    const b = el('button', 'mb-btn mb-press mb-tap' + (ph.key === cur ? ' on' : ''),
      esc(ph.name) + ' <small>' + esc(Day.short(ph.start)) + (ph.end ? '\u2013' + esc(Day.short(ph.end)) : '') + '</small>');

/* Patched, never rebuilt: TRAIN writes these rows too and may know fields this
   screen has never heard of. */
function projSheet(ph) {
  UI.dialog({
    title: ph ? 'Training block' : 'New training block', width: 320,
    body: b => {
      b.appendChild(el('label', 'fl', 'Name'));
      const nm = UI.field('name', { value: ph ? ph.name : '' });

      b.appendChild(el('label', 'fl', 'Started'));
      const st = document.createElement('input');
      st.type = 'date'; st.className = 'mb-input'; st.style.width = '100%';
      st.value = ph ? ph.start : Day.today();
      b.appendChild(st);
      b.appendChild(el('label', 'fl', 'Ended, if it has'));
      const en = document.createElement('input');
      en.type = 'date'; en.className = 'mb-input'; en.style.width = '100%';
      en.value = ph && ph.end ? ph.end : '';
      b.appendChild(en);
      UI.focusSoon(nm.querySelector ? (nm.querySelector('input') || nm) : nm);
    },
    actions: [
      { label: 'CANCEL' },

        Rec.patch('phase', null, key, { name: name, start: start, end: end || undefined });
        Rec.setting(APP.id, 'proj', key);
        draw();
      } },
    ],
  });
}

      ? 'The first check-in is saved. The next one sits beside it here.'
      : 'Once there are two check-ins, they sit side by side here.'));
    return c;
  }
  const a = dates.indexOf(cmpA) >= 0 ? cmpA : dates[0];
  const b = dates.indexOf(cmpB) >= 0 ? cmpB : dates[dates.length - 1];
  const pick = el('div', 'pick');
  const sel = (val, on, label) => {
    const s = el('select', 'mb-input');
    s.setAttribute('aria-label', label);
    dates.forEach(d => { const o = el('option', null, esc(Day.label(d))); o.value = d; o.selected = d === val; s.appendChild(o); });
    s.onchange = () => { on(s.value); s.blur(); draw(); };
    return s;
  };
  pick.appendChild(sel(a, v => { cmpA = v; }, 'Earlier check-in'));
  pick.appendChild(el('span', 'muted', 'and'));
  pick.appendChild(sel(b, v => { cmpB = v; }, 'Later check-in'));
  c.appendChild(pick);

  posesOf(who).forEach(({ id: pose, label: name }) => {
    const pa = photoOf(a, pose), pb = photoOf(b, pose);
    if (!pa && !pb) return;
    const g = el('div', 'pair');
    [[a, pa], [b, pb]].forEach(([d, p]) => g.appendChild(figure(p, name + ', ' + Day.label(d))));
    c.appendChild(g);
  });

  /* The numbers and the difference, and nothing about whether the difference
     is good. Root brief: show the number, never tell him what it means. */
  const rows = [['Weight', weightOf(a, who), weightOf(b, who), unitOf(who)]]
    .concat(fieldsOf(who).filter(f => f.kind !== 'text' && f.kind !== 'photo').map(f => [f.label, valOf(a, f.id), valOf(b, f.id), f.kind === 'scale' ? '' : (f.unit || '')]))
    .concat(posesOf(who).reduce((out, p) => {
      const ra = ratiosOf(markOf(a, p.id)), rb = ratiosOf(markOf(b, p.id));
      if (ra || rb) RATIOS.forEach(([k, name]) => out.push([p.label + ', ' + name.toLowerCase(), ra && ra[k], rb && rb[k], '', 2]));
      return out;
    }, []))
    .filter(r => r[1] != null || r[2] != null);
  if (rows.length) {
    const wrap = el('div', 'tbl'), t = el('table', 'nums');
    t.innerHTML = '<tr><th></th><th>' + esc(Day.short(a)) + '</th><th>' + esc(Day.short(b)) + '</th><th>Change</th></tr>' +
      rows.map(r => {
        const dp = r[4] || 1, k = Math.pow(10, dp);
        const ch = r[1] != null && r[2] != null ? Math.round((r[2] - r[1]) * k) / k : null;
        return '<tr><td>' + esc(r[0]) + '</td><td>' + fmt(r[1], r[3], dp) + '</td><td>' + fmt(r[2], r[3], dp) + '</td><td>' +
          (ch == null ? '' : (ch > 0 ? '+' : '') + fmt(ch, r[3], dp)) + '</td></tr>';

}
const fmt = (v, u, dp) => { if (v == null) return ''; const k = Math.pow(10, dp || 1); return esc((dp === 2 ? (Math.round(v * k) / k).toFixed(2) : String(Math.round(v * k) / k)) + (u ? ' ' + u : '')); };
function figure(p, caption) {
  const f = el('figure', 'fig');
  if (p) { const img = el('img'); img.src = p.img; img.alt = caption; f.appendChild(img); }
  else f.appendChild(el('div', 'nophoto', 'No photo'));
  f.appendChild(el('figcaption', null, esc(caption)));
  return f;
}

/* ══════════════ the Check In camera ══════════════
   Everything that makes this week's photo the same photo as last week's:
     the ghost      last time's photo in this pose, see-through, over the live picture
     the body match last time's body drawn as an outline; distance, position, height
                    and turn each go green as they line up
     tilt           the phone's angle against last time's, where the phone will say
     same camera    front or back, remembered
     light          brightness against last time, a warning and never a blocker
     sound          a beep that quickens as it lines up, and a spoken direction
     itself         everything green and still for a moment, a three beat count, a photo
     setup photo    where the phone sits and where he stands, if switched on in Settings
   Tom, 2026-09-15, on each of these. The setup photo is off unless switched on,
   because anything that adds a step before the photo is friction. */
const Cam = (() => {
  let root, stage, video, ghost, over, chips, say, count, flashEl, review, reviewImg, titleEl, subEl, range, autoBtn, shutter, setupImg, startBtn;
  let stream = null, alive = false, release = null, loopT = null, busy = false, looking = false;
  let o = null, idx = 0, facing = 'user', setupStep = false;
  let ref = null, refMark = null, tilt = null, lastV = null, stillSince = 0, prevC = null;
  let lastBeep = 0, lastSpoke = 0, lastSaid = '', countT = null, counting = false, advanceT = null, lumNow = null, lumT = 0;
  const colours = {};

  function build() {
    if (root) return;
    root = el('div', 'full');
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-label', 'Camera');
    const bar = el('div', 'fbar');
    const x = el('button', 'mb-btn mb-press mb-tap flat', ICN('close'));
    x.setAttribute('aria-label', 'Close the camera');
    x.onclick = () => close();
    const t = el('div', 't');
    titleEl = el('b'); subEl = el('small');
    t.appendChild(titleEl); t.appendChild(subEl);
    const flip = el('button', 'mb-btn mb-press mb-tap flat', ICN('refresh'));
    flip.setAttribute('aria-label', 'Switch between the front and back camera');
    flip.onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; Rec.setting(APP.id, 'facing', facing); startStream(); };
    const snd = el('button', 'mb-btn mb-press mb-tap flat', ICN('sound'));
    snd.setAttribute('aria-label', 'Beeps and spoken directions');
    snd.onclick = e => {
      const r = snd.getBoundingClientRect();
      UI.menu(r.left, r.bottom, [
        { label: (optOn('beeps', 1) ? 'Stop' : 'Start') + ' the beeps', fn: () => Rec.setting(APP.id, 'beeps', optOn('beeps', 1) ? 0 : 1) },
        { label: (optOn('voice', 1) ? 'Stop' : 'Start') + ' the spoken directions', fn: () => { Rec.setting(APP.id, 'voice', optOn('voice', 1) ? 0 : 1); try { speechSynthesis.cancel(); } catch (e2) {} } },
      ], { title: 'SOUND' });
    };
    bar.appendChild(x); bar.appendChild(t); bar.appendChild(snd); bar.appendChild(flip);

    stage = el('div', 'stage');
    video = el('video');
    video.muted = true; video.playsInline = true; video.autoplay = true;
    video.setAttribute('playsinline', '');
    ghost = el('img', 'ghost'); ghost.alt = '';
    over = el('canvas', 'over');
    setupImg = el('img', 'setupimg'); setupImg.alt = 'Where the phone sits and where you stand';
    chips = el('div', 'cchips');
    say = el('div', 'csay');
    count = el('div', 'ccount');
    flashEl = el('div', 'cflash');
    review = el('div', 'creview');
    reviewImg = el('img'); reviewImg.alt = 'The photo just taken';
    const again = el('button', 'mb-btn mb-press mb-tap', 'Retake');
    again.onclick = () => { clearTimeout(advanceT); review.classList.remove('on'); busy = false; };
    review.appendChild(reviewImg); review.appendChild(again);
    [video, ghost, over, setupImg, chips, say, count, flashEl, review].forEach(n => stage.appendChild(n));

    const bot = el('div', 'fbot');
    const gs = el('div', 'side');
    range = el('input');
    range.type = 'range'; range.min = '0'; range.max = '0.8'; range.step = '0.05';
    range.setAttribute('aria-label', 'How see-through last time’s photo is');
    range.oninput = () => { ghost.style.opacity = range.value; Rec.setting(APP.id, 'ghost', +range.value); };
    gs.appendChild(range); gs.appendChild(el('small', null, 'Last time'));
    shutter = el('button', 'shutter mb-press');
    shutter.type = 'button';
    shutter.setAttribute('aria-label', 'Take the photo');
    shutter.onclick = () => { if (setupStep && startBtn.dataset.ready) return; capture(); };
    const as = el('div', 'side');
    autoBtn = el('button', 'mb-btn mb-press mb-tap', 'Auto');
    autoBtn.onclick = () => { const v = !optOn('auto', 1); Rec.setting(APP.id, 'auto', v ? 1 : 0); autoBtn.classList.toggle('on', v); if (!v) cancelCount(); };
    startBtn = el('button', 'mb-btn mb-press mb-tap go', 'Start');
    startBtn.hidden = true;
    startBtn.onclick = () => { setupStep = false; startBtn.hidden = true; setupImg.classList.remove('on'); loadPose(); };
    as.appendChild(autoBtn); as.appendChild(startBtn);
    bot.appendChild(gs); bot.appendChild(shutter); bot.appendChild(as);

    root.appendChild(bar); root.appendChild(stage); root.appendChild(bot);
    document.body.appendChild(root);
    paintIcons(root);
  }

  async function open(opts) {
    o = Object.assign({ date: Day.today(), poses: posesOf(''), start: 0 }, opts || {});
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      UI.toast('The Check In camera needs the app opened from its web address, so the phone&#8217;s own camera opens instead.');
      return pickPhoto(o.poses[o.start || 0].id, 'camera');
    }
    askTilt();
    /* Capture phase, so a remote's press reaches this before anything on the
       page can treat Enter as "press the focused button". */
    window.addEventListener('keydown', onRemote, true);
    build();
    const cs = getComputedStyle(document.body);
    ['--success', '--accent', '--text-1', '--warn'].forEach(k => { colours[k] = cs.getPropertyValue(k).trim() || 'white'; });
    facing = opt('facing', 'user');
    range.value = String(opt('ghost', 0.35));
    ghost.style.opacity = range.value;
    autoBtn.classList.toggle('on', optOn('auto', 1));
    idx = o.start || 0;
    alive = true; holdDraw++;
    root.classList.add('on');
    release = Mobile.trap(() => close(true));
    Mobile.feedback('open');
    engine();
    await startStream();
    if (!alive) return;
    const setup = peek('cref', null, 'setup');
    setupStep = optOn('setup', 0) && !o.only;
    if (setupStep) showSetup(setup); else loadPose();
    clearTimeout(loopT);
    tick();
  }

  function showSetup(setup) {
    titleEl.textContent = 'WHERE THE PHONE GOES';
    ghost.src = ''; ref = null; refMark = null;
    if (setup) {
      setupImg.src = setup.img; setupImg.classList.add('on');
      subEl.textContent = 'Set the phone up like this, then Start. The shutter retakes this photo.';
      startBtn.hidden = false; delete startBtn.dataset.ready;
    } else {
      setupImg.classList.remove('on');
      subEl.textContent = 'Take one photo of where the phone sits and where you stand. It shows here every time.';
      startBtn.hidden = true;
    }
  }

  async function startStream() {
    stopStream();
    stage.classList.toggle('mirror', facing === 'user');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1920 } }, audio: false,
      });
      if (!alive) return stopStream();
      video.srcObject = stream;
      await video.play().catch(() => {});
    } catch (e) {
      console.warn('[checkin] camera', e);
      UI.toast('The camera did not open. Check that Check In is allowed to use it.', { bad: true });
    }
  }
  function stopStream() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  function close(fromBack) {
    if (!alive) return;
    alive = false;
    clearTimeout(loopT); clearTimeout(advanceT); cancelCount();
    stopStream();
    try { speechSynthesis.cancel(); } catch (e) {}
    window.removeEventListener('deviceorientation', onTilt);
    window.removeEventListener('keydown', onRemote, true);
    root.classList.remove('on');
    review.classList.remove('on');
    if (release && !fromBack) release();
    release = null;
    holdDraw = Math.max(0, holdDraw - 1);
    Mobile.feedback('close');
    draw();
  }

  /* iOS asks for the motion sensor, and only inside the tap that opened the
     camera. A phone without one just has no tilt check. */
  function askTilt() {
    tilt = null;
    const on = () => window.addEventListener('deviceorientation', onTilt);
    try {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
        DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') on(); }, () => {});
      else on();
    } catch (e) {}
  }
  function onTilt(e) { if (e.beta != null) tilt = { b: e.beta, g: e.gamma }; }

  /* the reference: the latest earlier photo in this pose */
  function loadPose() {
    const pose = o.poses[idx];
    const earlier = poseDates(pose.id, '').filter(d => d !== o.date);
    const refDate = earlier.filter(d => d < o.date).pop() || earlier.pop();
    ref = refDate ? photoOf(refDate, pose.id, '') : null;
    refMark = refDate ? markOf(refDate, pose.id, '') : null;
    ghost.src = ref ? ref.img : '';
    ghost.hidden = !ref;
    titleEl.textContent = pose.label.toUpperCase() + (o.poses.length > 1 && !o.only ? ', ' + (idx + 1) + ' OF ' + o.poses.length : '');
    subEl.textContent = ref ? 'Last time: ' + Day.label(refDate) + (ref.t ? ', ' + UI.clockLabel(new Date(ref.t).toTimeString().slice(0, 5)) : '') + '.' : 'The first photo in this pose. The next one lines up with it.';
    stillSince = 0; prevC = null; lastSaid = '';
  }

  function tick() {
    if (!alive) return;
    loopT = setTimeout(tick, 220);
    if (!video.videoWidth || busy) return;
    if (over.width !== video.videoWidth || over.height !== video.videoHeight) { over.width = video.videoWidth; over.height = video.videoHeight; }
    const now = performance.now();
    if (optOn('light', 1) && now - lumT > 900) { lumNow = lumOf(video); lumT = now; }
    /* one look at a time: on a slow phone a look takes longer than the gap,
       and queued looks would describe where he stood a second ago */
    if (looking) return;
    if (engineState === 'ready' && engineP && !setupStep) {
      looking = true;
      engineP.then(E => {
        looking = false;
        if (!alive || busy) return;
        let L = null;
        try { const r = E.live.detectForVideo(video, performance.now()); L = r.landmarks && r.landmarks[0]; } catch (e) { L = null; }
        step(L);
      }, () => { looking = false; step(null); });
    } else step(null);
  }

  function step(L) {
    const v = setupStep ? { checks: [], say: '' } : judge(L);
    lastV = v;
    paint(L, v);
    guide(v);
  }

  /* landmark -> frame-height units, centred, so a photo and a video of a
     different shape still compare */
  const fromLive = (p, w, h) => ({ X: (p.x - 0.5) * w / h, Y: p.y, z: p.z, v: p.visibility == null ? 1 : p.visibility });
  const fromRef = (a, w, h) => a ? { X: (a[0] - 0.5) * w / h, Y: a[1], z: a[2], v: a[3] } : null;

  function judge(L) {
    const out = { checks: [], score: null, allOk: false, say: '' };
    if (!L) { out.say = engineState === 'ready' ? 'Step into the picture' : ''; return out; }
    const vw = video.videoWidth, vh = video.videoHeight;
    const A = {};
    [0, 11, 12, 23, 24, 27, 28].forEach(i => { A[i] = fromLive(L[i], vw, vh); });
    if (![11, 12, 23, 24].every(i => A[i].v > 0.5)) { out.say = 'Show your shoulders and hips'; return out; }
    const mid = (P, a, b) => ({ X: (P[a].X + P[b].X) / 2, Y: (P[a].Y + P[b].Y) / 2 });
    const torso = P => { const s = mid(P, 11, 12), h = mid(P, 23, 24); return Math.hypot(s.X - h.X, s.Y - h.Y) || 1e-6; };
    const centre = P => { const s = mid(P, 11, 12), h = mid(P, 23, 24); return { X: (s.X + h.X) / 2, Y: (s.Y + h.Y) / 2 }; };
    const cA = centre(A);
    if (prevC && Math.hypot(cA.X - prevC.X, cA.Y - prevC.Y) < 0.008) { if (!stillSince) stillSince = performance.now(); }
    else stillSince = 0;
    prevC = cA;

    const lm = refMark && refMark.lm;
    const R = {};
    if (lm) [0, 11, 12, 23, 24].forEach(i => { R[i] = fromRef(lm[i], ref.w, ref.h); });
    const hasRef = !!(lm && [11, 12, 23, 24].every(i => R[i]));
    const add = (id, label, err, tol, sayIt, blocks) => {
      const ok = Math.abs(err) <= tol;
      out.checks.push({ id: id, label: label, ok: ok, e: Math.min(4, Math.abs(err) / tol), say: ok ? '' : sayIt, blocks: blocks !== false });
    };
    if (!hasRef) {
      const whole = [0, 27, 28].every(i => A[i].v > 0.5);
      add('body', 'Whole body', whole ? 0 : 1, 0.5, 'Step back until your feet are in');
    } else {
      const size = torso(A) / torso(R) - 1;
      add('dist', 'Distance', size, 0.05, size > 0 ? 'Step back a little' : 'Step a little closer');
      const cR = centre(R), dx = cA.X - cR.X, dy = cA.Y - cR.Y;
      /* The camera faces him, so the right of the picture is his left. */
      add('pos', 'Position', dx, 0.035, dx < 0 ? 'Move a little to your left' : 'Move a little to your right');
      add('height', 'Height', dy, 0.035, dy > 0 ? 'Lower the phone a little' : 'Raise the phone a little');
      const wA = Math.abs(A[11].X - A[12].X) / torso(A), wR = Math.abs(R[11].X - R[12].X) / torso(R);
      const turn = wA / wR - 1;
      /* Which shoulder to bring forward: the one on the left of the picture is
         his right when he faces the camera, and his left when his back is to it. */
      const leftI = A[11].X < A[12].X ? 11 : 12, rightI = leftI === 11 ? 12 : 11;
      const zNow = A[leftI].z - A[rightI].z, zRef = (R[leftI].z || 0) - (R[rightI].z || 0);
      const facingCam = A[0].v > 0.5;
      const leftIsHis = facingCam ? 'right' : 'left', rightIsHis = facingCam ? 'left' : 'right';
      const turnSay = Math.abs(zNow - zRef) < 0.05 ? 'Face the camera the way you did last time'
        : 'Bring your ' + (zNow > zRef ? leftIsHis : rightIsHis) + ' shoulder forward a little';
      add('turn', 'Turn', turn, 0.08, turnSay);
    }
    if (tilt && ref && ref.tilt) {
      const db = tilt.b - ref.tilt.b, dg = tilt.g - ref.tilt.g;
      const worst = Math.abs(dg) > Math.abs(db) ? dg : db;
      add('tilt', 'Tilt', worst, 3, Math.abs(dg) > Math.abs(db) ? 'Level the phone' : (db > 0 ? 'Tip the top of the phone back' : 'Tip the top of the phone forward'));
    }
    if (optOn('light', 1) && ref && ref.lum && lumNow) {
      const d = lumNow / ref.lum - 1;
      add('light', 'Light', d, 0.15, d > 0 ? 'Brighter than last time' : 'Darker than last time', false);
    }
    const blocking = out.checks.filter(c => c.blocks);
    out.score = Math.round(clamp(100 - 25 * (blocking.reduce((s, c) => s + c.e, 0) / Math.max(1, blocking.length)), 0, 100));
    out.allOk = blocking.every(c => c.ok);
    const first = out.checks.filter(c => !c.ok)[0];
    out.say = out.allOk ? (counting ? '' : 'Hold still') : (first ? first.say : '');
    return out;
  }

  function paint(L, v) {
    const g = over.getContext('2d');
    g.clearRect(0, 0, over.width, over.height);
    if (setupStep) return;
    const W = over.width, H = over.height;
    const bones = [[11, 12], [11, 23], [12, 24], [23, 24], [11, 13], [13, 15], [12, 14], [14, 16], [23, 25], [25, 27], [24, 26], [26, 28]];
    const lw = Math.max(3, W / 240);
    if (refMark && refMark.lm) {
      const lm = refMark.lm;
      const at = a => ({ x: ((a[0] - 0.5) * ref.w / ref.h) * H + W / 2, y: a[1] * H });
      g.setLineDash([lw * 3, lw * 2]); g.lineWidth = lw; g.strokeStyle = colours['--text-1']; g.globalAlpha = 0.8;
      bones.forEach(([a, b]) => { if (lm[a] && lm[b]) { const p = at(lm[a]), q = at(lm[b]); g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke(); } });
      g.setLineDash([]); g.globalAlpha = 1;
    }
    if (L) {
      g.lineWidth = lw * 1.4; g.strokeStyle = v.allOk ? colours['--success'] : colours['--accent'];
      bones.forEach(([a, b]) => { const p = L[a], q = L[b]; if (p && q && (p.visibility || 0) > 0.5 && (q.visibility || 0) > 0.5) { g.beginPath(); g.moveTo(p.x * W, p.y * H); g.lineTo(q.x * W, q.y * H); g.stroke(); } });
    }
  }

  function guide(v) {
    chips.innerHTML = v.checks.map(c => '<span class="cchip ' + (c.ok ? 'ok' : (c.blocks ? 'no' : '')) + '">' + esc(c.label) + '</span>').join('') +
      (v.score != null && !setupStep ? '<span class="cchip">' + v.score + '</span>' : '');
    if (!counting) say.textContent = v.say || '';
    const now = performance.now();
    if (setupStep) return;
    if (optOn('auto', 1) && v.allOk && stillSince && now - stillSince > 700 && !counting && !busy) startCount();
    if (counting && !v.allOk) cancelCount();
    if (optOn('beeps', 1) && v.score != null && !v.allOk && !counting) {
      const gap = 180 + (100 - v.score) * 9;
      if (now - lastBeep > gap) { Sfx.play('blip'); lastBeep = now; }
    }
    if (optOn('voice', 1) && v.say && v.say !== lastSaid && now - lastSpoke > 2600 && window.speechSynthesis && !counting) {
      try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(v.say)); } catch (e) {}
      lastSaid = v.say; lastSpoke = now;
    }
  }

  function startCount() {
    counting = true;
    let n = 3;
    say.textContent = '';
    const beat = () => {
      if (!counting) return;
      if (n === 0) { count.textContent = ''; counting = false; capture(); return; }
      count.textContent = String(n);
      Sfx.play('tick');
      n--;
      countT = setTimeout(beat, 500);
    };
    beat();
  }
  function cancelCount() { counting = false; clearTimeout(countT); if (count) count.textContent = ''; }

  function capture() {
    if (busy || !video || !video.videoWidth) return;
    busy = true;
    cancelCount();
    const s = shrinkSource(video, video.videoWidth, video.videoHeight);
    flashEl.classList.add('on');
    setTimeout(() => flashEl.classList.remove('on'), 120);
    const ph = {
      img: s.img, w: s.w, h: s.h, t: Date.now(), cam: facing, src: 'camera', lum: lumOf(s.c),
      tilt: tilt ? { b: r1(tilt.b), g: r1(tilt.g) } : null,
      match: !setupStep && lastV && lastV.score != null && refMark ? lastV.score : null,
    };
    Mobile.feedback('success');
    if (setupStep) {
      Rec.set('cref', null, 'setup', ph);
      busy = false;
      showSetup(ph);
      return;
    }
    const pose = o.poses[idx];
    Rec.set('cphoto', o.date, pose.id, ph);
    queueMeasure('cphoto', o.date, pose.id);
    reviewImg.src = ph.img;
    review.classList.add('on');
    clearTimeout(advanceT);
    advanceT = setTimeout(() => {
      review.classList.remove('on');
      busy = false;
      if (o.only || idx >= o.poses.length - 1) { close(); UI.toast(o.only ? esc(pose.label) + ' photo saved.' : 'Check-in photos saved.'); return; }
      idx++;

/* ══════════════ checking the dots ══════════════
   Six dots on three lines. Drag a dot and its line follows it up or down, so a
   width is always measured straight across. Done means checked, and a checked
   photo is never re-measured by the app behind his back. */
const Dots = (() => {
  let root, stage, img, svg, read, titleEl, release = null, job = null, mark = null, ph = null, box = null;
  const H = {};

    bot.appendChild(again); bot.appendChild(el('div', 'spacer')); bot.appendChild(done);
    root.appendChild(bar); root.appendChild(stage); root.appendChild(read); root.appendChild(bot);
    document.body.appendChild(root);

  }

    if (!cur || !cur.pts) {

        '" style="stroke:var(--accent);stroke-width:3;stroke-linecap:round"></line>';

    lines.forEach(k => ['l', 'r'].forEach(side => {
      const b = H[k + side], p = mark.pts[k];

})();

/* ══════════════ the timelapse ══════════════
   Every photo in one pose, lined up on the body rather than on the picture:
   each frame is moved, scaled and turned so its shoulders and hips land where
   the first frame's did. That is what stops a timelapse jumping about. A
   story-shaped 1080 by 1920, because that is where it gets posted. */
const OW = 1080, OH = 1920;

  const st = { pose: 'front', i: 0, playing: false, recording: false, frames: [], M: [], canvas: null, scrub: null, raf: null, t0: 0, wipe: 0.5, key: '' };
  const imgCache = new Map();

  const put = (k, v) => Rec.setting(APP.id, 'tl' + k, v);

  function busy() { return st.playing || st.recording; }
  function stop() { st.playing = false; cancelAnimationFrame(st.raf); }

  async function frames(pid, pose) {

      const k = K(pid, pose), ph = peek('cphoto', d, k);
      if (!ph || (skip && ph.match != null && ph.match < 70)) continue;
      const ck = d + '|' + k + '|' + (ph.t || ph.img.length);
      let im = imgCache.get(ck);
      if (!im) { try { im = await loadImg(ph.img); imgCache.set(ck, im); } catch (e) { continue; } }
      out.push({ d: d, ph: ph, m: peek('cmark', d, k), img: im, w: weightOf(d, pid) });

  }

  const midP = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });
  function anchors(f) {
    const lm = f.m && f.m.lm;
    if (!lm || !lm[11] || !lm[12] || !lm[23] || !lm[24]) return null;
    const p = i => ({ x: lm[i][0] * f.ph.w, y: lm[i][1] * f.ph.h });
    return { A: midP(p(11), p(12)), B: midP(p(23), p(24)) };
  }
  const fit = (w, h) => { const s = Math.min(OW / w, OH / h); return [s, 0, 0, s, (OW - w * s) / 2, (OH - h * s) / 2]; };
  function transforms(list) {
    const ref = list.filter(f => anchors(f))[0];
    if (!ref) return list.map(f => fit(f.ph.w, f.ph.h));
    const b = fit(ref.ph.w, ref.ph.h), ra = anchors(ref);
    const A0 = { x: ra.A.x * b[0] + b[4], y: ra.A.y * b[0] + b[5] }, B0 = { x: ra.B.x * b[0] + b[4], y: ra.B.y * b[0] + b[5] };

      const s = Math.hypot(ux, uy) / Math.max(1e-6, Math.hypot(vx, vy));
      let th = Math.atan2(uy, ux) - Math.atan2(vy, vx);
      th = clamp(Math.atan2(Math.sin(th), Math.cos(th)), -0.17, 0.17);
      const cs = s * Math.cos(th), sn = s * Math.sin(th);

  function faceOf(f) {
    const lm = f.m && f.m.lm;
    if (!lm) return null;
    const P = i => lm[i] && lm[i][3] > 0.3 ? { x: lm[i][0] * f.ph.w, y: lm[i][1] * f.ph.h } : null;
    const pts = [0, 2, 5, 7, 8].map(P).filter(Boolean);
    const s1 = P(11) || (lm[11] && { x: lm[11][0] * f.ph.w, y: lm[11][1] * f.ph.h }), s2 = P(12) || (lm[12] && { x: lm[12][0] * f.ph.w, y: lm[12][1] * f.ph.h });

  function renderAt(t) {

    if (!st.frames.length) return;

    st.t0 = performance.now() - (st.i ? hold + (st.i) * hold : 0);

  }
  function showIndex(i) {

    if (get('Mode', 'flip') === 'wipe') renderAt(0);

  function card() {
    const c = el('div', 'card');

    c.appendChild(el('h2', null, 'TIMELAPSE' + (who ? ', ' + esc(nameOf(who).toUpperCase()) : '')));

    const pl = el('div', 'player');

    pb.onclick = () => {

    const pid = who, pose = st.pose, token = st.key = pid + '|' + pose + '|' + Date.now();
    frames(pid, pose).then(list => {

      scrub.hidden = list.length < 2;

      status.textContent = list.length + (list.length === 1 ? ' photo' : ' photos') + (get('Mode', 'flip') === 'wipe' ? '. Drag across the picture, or pick a photo below.' : '.') +

  }

  function options() {
    const c = el('div', 'card');

    seg('Speed', 'Speed', [{ id: 'slow', name: 'Slow' }, { id: 'mid', name: 'Normal' }, { id: 'fast', name: 'Fast' }], 'mid');
    seg('Face', 'Face', [{ id: 'none', name: 'Show it' }, { id: 'blur', name: 'Blur' }, { id: 'animal', name: 'Animal' }], 'none');
    if (get('Face', 'none') === 'animal') {
      if (who) c.appendChild(el('p', 'muted', esc(nameOf(who)) + '&#8217;s own animal, picked on their phone.'));
      else c.appendChild(animalPicker(opt('animal', 'bear'), k => { Rec.setting(APP.id, 'animal', k); }));
    }
    c.appendChild(UI.row('Date and weight', 'Written along the bottom.', UI.toggle(+get('Caption', 1) === 1, v => { put('Caption', v ? 1 : 0); draw(); })));
    c.appendChild(UI.row('Fade between photos', null, UI.toggle(+get('Fade', 1) === 1, v => { put('Fade', v ? 1 : 0); draw(); })));
    c.appendChild(UI.row('Leave out photos that did not line up', 'Any photo that matched last time under 70 of 100.', UI.toggle(+get('Skip', 0) === 1, v => { put('Skip', v ? 1 : 0); draw(); })));

  }

  /* ── saving it as a video ──
     Played once in real time onto the canvas while the browser records the
     canvas. MP4 where the browser can make one (Safari, recent Chrome), WebM

     longer than a tap lasts. */

    if (st.recording) return;
    if (st.frames.length < 1) return UI.toast('There are no photos in this pose yet.');

    const mime = window.MediaRecorder && st.canvas.captureStream ? types.filter(t => MediaRecorder.isTypeSupported(t))[0] : null;

    const stopped = new Promise(res => { rec.onstop = res; });
    const toast = UI.toast('Making the video. It plays through once.', { ms: 60000 });
    rec.start(250);
    const total = get('Mode', 'flip') === 'wipe' ? 8000 : lengthMs();
    const t0 = performance.now();
    await new Promise(res => {
      const stepV = () => {
        const t = performance.now() - t0;
        renderAt(Math.min(t, total));
        if (t >= total + 120) return res();
        setTimeout(stepV, 33);
      };
      stepV();
    });
    rec.stop();
    await stopped;
    stream.getTracks().forEach(t => t.stop());
    st.recording = false;
    const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    const name = Day.today() + ' ' + nameOf(who) + ' ' + poseLabel(who, st.pose) + ' timelapse.' + ext;
    UI.toast('The video is ready.');
    UI.dialog({
      title: 'TIMELAPSE VIDEO', width: 460,

        const v = el('video', 'big');

        v.setAttribute('playsinline', '');
        b.appendChild(v);
        b.appendChild(el('p', 'muted', esc(Math.round(blob.size / 1024 / 102.4) / 10 + 'MB, ' + ext.toUpperCase() + '.')));
      },
      actions: [{ label: 'SAVE VIDEO', kind: 'go', fn: () => { handOver([{ name: name, blob: blob }], name); return false; } }],
    });
    if (pending) soon();
  }

  return { card: card, options: options, stop: stop, busy: busy, frames: frames, transforms: transforms, st: st, renderAt: renderAt, faceOf: faceOf };
})();

/* ══════════════ handing files over ══════════════
   A phone gets its share menu, where Save to Files or Save Image puts them in
   iCloud Drive or Photos. A desktop gets a download, and several files arrive
   as one zip rather than a stack of prompts. */
function handOver(list, zipName) {
  const files = list.map(f => { try { return new File([f.blob || f.bytes], f.name, { type: f.type || (f.blob && f.blob.type) || 'image/jpeg' }); } catch (e) { return null; } }).filter(Boolean);
  if (files.length && navigator.canShare && navigator.canShare({ files: files }) && Mobile.touch) {
    return navigator.share({ files: files }).then(() => true, err => {
      if (err && (err.name === 'AbortError' || /abort|cancel/i.test(err.message || ''))) return false;
      return download(list, zipName);
    });
  }
  return Promise.resolve(download(list, zipName));
}
function download(list, zipName) {
  let blob, name;
  if (list.length === 1) { blob = list[0].blob || new Blob([list[0].bytes], { type: list[0].type || 'image/jpeg' }); name = list[0].name; }
  else { blob = zip(list.map(f => ({ name: f.name, data: f.bytes }))); name = zipName.replace(/\.zip$/i, '') + '.zip'; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  UI.toast('Saved as <b>' + esc(name) + '</b>.');
  return true;
}
/* A zip with nothing compressed. Photos are already compressed, so a real
   deflate would only add a library for no gain. */
function crc32(u) {
  const T = crc32.T || (crc32.T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })());
  let c = -1;
  for (let i = 0; i < u.length; i++) c = T[(c ^ u[i]) & 255] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}
function zip(entries) {
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0, cdSize = 0;
  entries.forEach(f => {
    const nm = enc.encode(f.name), data = f.data, crc = crc32(data), n = data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, n, true); h.setUint32(22, n, true);
    h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, nm, data);
    const d = new DataView(new ArrayBuffer(46));
    d.setUint32(0, 0x02014b50, true); d.setUint16(4, 20, true); d.setUint16(6, 20, true); d.setUint16(8, 0x0800, true); d.setUint16(10, 0, true);
    d.setUint16(12, 0, true); d.setUint16(14, 0x21, true); d.setUint32(16, crc, true); d.setUint32(20, n, true); d.setUint32(24, n, true);
    d.setUint16(28, nm.length, true); d.setUint32(42, off, true);
    central.push(d.buffer, nm);
    cdSize += 46 + nm.length;
    off += 30 + nm.length + n;
  });

  e.setUint32(0, 0x06054b50, true); e.setUint16(8, entries.length, true); e.setUint16(10, entries.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob(parts.concat(central, [e.buffer]), { type: 'application/zip' });
}

/* ── saving photos, one check-in or all of them ──
   Named "2026-09-15 Tom Front.jpg": the date first so a folder sorts itself,
   and so Add a folder puts each one back on its day and pose. */
const photoName = (d, pid, label) => d + ' ' + nameOf(pid).replace(/[\\/:*?"<>|]/g, '') + ' ' + label.replace(/[\\/:*?"<>|]/g, '') + '.jpg';
function savePhotos(pid, dates) {
  const list = [];
  dates.forEach(d => posesOf(pid).forEach(p => {
    const ph = photoOf(d, p.id, pid);
    if (ph) list.push({ name: photoName(d, pid, p.label), bytes: dataUrlBytes(ph.img), type: 'image/jpeg' });
  }));
  if (!list.length) return UI.toast('There are no photos to save there.');
  return handOver(list, nameOf(pid) + ' check-in photos');
}
function saveMenu(pid) {

  UI.menu(innerWidth / 2, innerHeight / 2, [
    { label: 'The latest check-in', note: Day.label(dates[dates.length - 1]), fn: () => savePhotos(pid, [dates[dates.length - 1]]) },
