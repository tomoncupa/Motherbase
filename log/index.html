<style>
/* Colours and sizes are tokens, never numbers. shared/THEMING.md is the
   contract this app obeys. The raw pixel values are geometry the script
   measures and hands over (--dh pixels per day, --sh the screen, --datew the
   widest date, block tops and column widths): measurements, not spacing
   decisions. The stroke widths and opacities on the day graph are chart
   values of the kind STATUS's own charts carry. `ch` widths are lengths of
   text, which is what they measure.

   A desktop app, read sitting down. Text size is a setting; --tb (bullets and
   written lines), --td (dates), --ts (small print) and --tl (block names) are
   each set to one of the type tokens by it. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--tb, var(--f-4));font-weight:var(--w-body);
  font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
body.resizing,body.resizing *{cursor:col-resize !important;user-select:none}

/* Wraps rather than pushing buttons off the edge in a narrow window. */
header{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);position:relative;z-index:5}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-6);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}
.yr{display:flex;align-items:center;gap:var(--s-1)}
.yr b{font-family:var(--font-display);font-size:var(--f-6);font-weight:var(--w-bold);
  min-width:var(--s-9);text-align:center}
.yr button:disabled{opacity:.35;cursor:default}
.quiet{font-size:var(--f-2);color:var(--text-muted)}

/* ── the filter bar ──
   Every choice is a labelled switch. It can be hidden in Settings, which
   gives the page back the height it takes. */
.bar{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3) var(--s-6)}
.bar[hidden]{display:none}
.bar .grp{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-4)}
.bar .grp[hidden]{display:none}
.bar .k{font-size:var(--f-2);color:var(--text-muted)}
.bar .sep{width:var(--border-width);align-self:stretch;background:var(--border)}
.tg{display:inline-flex;align-items:center;gap:var(--s-2)}
.tg .tl{font-size:var(--f-3);color:var(--text-2);cursor:pointer;user-select:none;white-space:nowrap}
/* The swatch is the legend: each graph switch wears its line's colour, next
   to the word, so the colour is never the only way to tell them apart. */
.sw{display:inline-block;width:var(--s-4);height:var(--s-1);border-radius:var(--radius-full);
  margin-right:var(--s-2);vertical-align:middle}
.sw.mood,.gr i.mood{background:var(--data-1)}
.sw.energy,.gr i.energy{background:var(--data-3)}
.sw.caffeine,.gr i.caffeine{background:var(--data-6)}

/* The only scrolling surface. The wheel scrolls it, a held button drags it,
   the side mouse buttons change the view. position:relative makes it what
   every offsetTop is measured from. */
main{flex:1;min-height:0;overflow:auto;overflow-anchor:none;position:relative;
  padding-bottom:var(--safe-b);cursor:grab}
main.dragging{cursor:grabbing;user-select:none}

/* ══════════ THE TIMELINE ══════════
   Side columns for the units bigger than the view, then the days. A block
   is placed by measuring where its first and last day actually are. */
.cal{min-width:100%;width:max-content}
.row{display:flex}
.agg{display:flex;position:sticky;left:0;z-index:2;background:var(--bg)}
.c-y{width:var(--w-y, var(--s-10))}
.c-q{width:var(--w-q, var(--s-10))}
.c-m{width:var(--w-m, clamp(var(--s-10), 14vw, calc(var(--s-10) * 2)))}
.c-w{width:var(--w-w, clamp(var(--s-10), 14vw, calc(var(--s-10) * 2)))}
.c-d{flex:1;min-width:calc(var(--s-10) * 2)}

.heads{position:sticky;top:0;z-index:3;background:var(--surface-1);
  box-shadow:0 var(--border-width) 0 var(--border-strong)}
.heads .agg{z-index:4;background:var(--surface-1)}
.heads .c{position:relative;padding:var(--s-2) var(--s-3);font-family:var(--font-display);font-size:var(--f-2);
  font-weight:var(--w-bold);letter-spacing:var(--track-cap);color:var(--text-muted);
  border-right:var(--border-width) solid var(--border-strong);flex:0 0 auto}
.heads .c.c-d{flex:1}
/* The drag handle on a column heading's right edge, as in Sheets. A
   double-click puts the width back. */
.rz{position:absolute;top:0;bottom:0;right:calc(var(--s-1) * -1);width:var(--s-2);cursor:col-resize;z-index:5}
.rz:hover,body.resizing .rz.on{background:var(--accent);opacity:.6}

.col{position:relative;flex:0 0 auto;border-right:var(--border-width) solid var(--border-strong)}
.col.c-d{flex:1 1 auto;background:var(--bg)}
.body{border-bottom:var(--border-width) solid var(--border)}

/* ── a week, month, quarter or year block ──
   Tom, 2026-09-13: "Add more differentiation between squares? Why does it
   not look visually pleasant?" It did not, because every block was the same
   flat colour behind the same hairline with its text jammed into the top
   corner, and the name and the count were the same weight. Neighbouring
   blocks now alternate between two surfaces, bigger units get the stronger
   line, there is room inside, and the count is quieter than the name.
   Name, count and written lines each have their own line, so everything a
   block says starts at the same left edge. */
.blk{position:absolute;left:0;right:0;top:0;background:var(--surface-1);
  border-top:var(--border-width) solid var(--border);
  padding:var(--s-2) var(--s-3) 0;line-height:var(--lh-tight);cursor:pointer}
.col .blk:nth-child(even){background:var(--surface-2)}
.c-y .blk,.c-q .blk,.blk.m0,.blk.y0{border-top-color:var(--border-strong)}
.stick{position:sticky;top:calc(var(--headh) + var(--s-2))}
.blk .lab{display:block;font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--tl, var(--f-4));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .tot{display:block;margin-top:var(--s-1);font-size:var(--ts, var(--f-2));color:var(--text-muted);white-space:nowrap}
.blk.zero .tot{opacity:.6}
.blk.bare{padding:0}
.blk.bare .stick,.blk.lab-only .tot{display:none}
.ws{margin-top:var(--s-2);font-size:var(--ts, var(--f-2));line-height:var(--lh-tight);color:var(--text-1);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--ln);overflow:hidden;
  overflow-wrap:anywhere}
.ws[hidden]{display:none}
/* The name opens the period; it underlines under the pointer so that can be
   found without being told. Tom, 2026-09-13. */
.blk .lab:hover,.hd .lab:hover{text-decoration:underline}

/* ══════════ A DAY ══════════
   A heading band on its own surface, the date in the display face and the
   day's own words beside it; bullets below on the page colour. */
.day{position:relative;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;
  border-top:var(--border-width) solid var(--border)}
.day.wk{border-top-color:var(--border-strong)}
.day.m0{border-top:calc(var(--border-width) * 3) solid var(--border-strong)}
.day>.mo,.day>.hd,.day>.bw{display:none}

/* Zoomed out: a day is exactly its share of the screen. */
.cal:not(.near) .day{height:var(--dh)}
.cal.tiny .day{border-top-width:0}
.cal.small:not(.near) .day>.hd{display:grid}

/* Zoomed in, and always in the notebook: a day grows to fit, so it never
   has to be opened to be read. */
.cal.near .day{min-height:var(--dh)}
.cal.near .day>.hd,.cal.near .day>.bw{display:grid}
.cal.near .day>.bw{display:flex}
.cal.near .day>.mo{display:block}

/* Where a month begins, a heading says which. The dates beside it no longer
   carry the month, so every date is the same width. */
.mo{padding:var(--s-4) var(--s-4) var(--s-2);background:var(--bg);font-family:var(--font-display);
  font-weight:var(--w-bold);font-size:var(--tl, var(--f-4));letter-spacing:var(--track-cap);color:var(--text-2)}

/* The date takes the width of the widest date, measured, so every day's
   own words start at the same place. Tom, 2026-09-13: "Have all the
   summaries be aligned the same." */
.hd{grid-template-columns:var(--datew, var(--s-9)) minmax(0,1fr);column-gap:var(--s-4);align-items:baseline;
  min-width:0;padding:var(--s-2) var(--s-4);background:var(--surface-1)}
.hd .lab{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--td, var(--f-5));
  white-space:nowrap;letter-spacing:var(--track-tight)}
.day.today .hd{background:var(--surface-3)}
.day.today .hd .lab{color:var(--accent)}
/* The one-line version, zoomed out. */
.cal.small:not(.near) .day>.hd{grid-template-columns:var(--datews, var(--s-8)) minmax(0,1fr);
  height:100%;align-items:center;padding:0 var(--s-3);background:none;line-height:1}
.cal.small:not(.near) .day>.hd .lab{font-family:var(--font-body);font-size:var(--ts, var(--f-2))}
.cal.small:not(.near) .day>.hd .sum{font-size:var(--ts, var(--f-2));line-height:1}

/* ── the day's own words ──
   Beside the date. Looks like text until it is pointed at or typed in. */
.sum{min-width:0;max-width:80ch;width:100%;font:inherit;font-size:var(--tb, var(--f-4));
  line-height:var(--lh-tight);color:var(--text-1);background:none;border:0;border-radius:0;
  border-bottom:var(--border-width) solid transparent;padding:0;cursor:text}
.sum:hover{border-bottom-color:var(--border)}
.sum:focus{outline:none;border-bottom-color:var(--accent)}

/* ── the bullets, below the band ── */
.bw{position:relative;flex:1 1 auto;flex-direction:column;min-height:0}
.bls{position:relative;z-index:1;display:flex;flex-direction:column;gap:var(--s-1);
  padding:var(--s-2) var(--s-4) var(--s-3) var(--s-6);max-width:90ch}
.bls:empty{padding:0}
.bl{display:flex;align-items:baseline;gap:var(--s-3);min-width:0;
  font-size:var(--tb, var(--f-4));line-height:var(--lh-tight);cursor:pointer}
.bl .tm{flex:0 0 auto;min-width:var(--s-8);text-align:right;font-size:var(--ts, var(--f-2));color:var(--text-2);white-space:nowrap}
.bl .tm.wrote{color:var(--text-muted)}
.bl .mk{flex:0 0 auto;width:var(--s-4);text-align:center;color:var(--text-muted)}
.bl .tx{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl .du{flex:0 0 auto;font-size:var(--ts, var(--f-2));color:var(--text-muted)}
.bl.open .tx{color:var(--text-2)}
.bl .bx{flex:0 0 auto;align-self:center;width:var(--s-4);height:var(--s-4);padding:0;cursor:pointer;
  border:var(--border-width) solid var(--text-2);border-radius:var(--radius-sm);background:none}
.bl .bx:hover{border-color:var(--accent)}

/* ── the day graph ── */
.gr{position:absolute;top:0;bottom:0;left:var(--s-4);right:var(--s-4);pointer-events:none;z-index:0}
.gr svg{position:absolute;left:0;top:0;width:100%;height:100%}
.gr path{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke}
.gr path.mood{stroke:var(--data-1);opacity:.22}
.gr path.energy{stroke:var(--data-3);opacity:.22}
.gr path.caffeine{stroke:var(--data-6);stroke-dasharray:3 3;opacity:.5}
.gr i{position:absolute;width:var(--s-2);height:var(--s-2);margin:calc(var(--s-1) * -1) 0 0 calc(var(--s-1) * -1);
  border-radius:var(--radius-full);pointer-events:auto;cursor:default}
.gr i.mood,.gr i.energy{opacity:.35}
.gr i.caffeine{opacity:.8}

/* ══════════ THE NOTEBOOK ══════════ */
.book{display:flex;flex-direction:column}
.spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:var(--sh);
  border-bottom:calc(var(--border-width) * 3) solid var(--border-strong)}
.page{display:flex;flex-direction:column;min-width:0}
.page+.page{border-left:calc(var(--border-width) * 2) solid var(--border-strong)}
.page>.day,.page>.filler{flex:1 1 0}
.filler{border-top:var(--border-width) solid var(--border)}

#probe{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;width:calc(var(--s-10) * 2)}
#probe .blk{position:static}
</style>
</head>
<body>
<header>
  <div class="logo">LO<b>G</b></div>
  <div class="yr">
    <button id="prevYr" class="mb-btn mb-press mb-tap" onclick="goYear(-1)" aria-label="Previous year" data-icon="prev"></button>
    <b id="yrLabel"></b>
    <button id="nextYr" class="mb-btn mb-press mb-tap" onclick="goYear(1)" aria-label="Next year" data-icon="next"></button>
  </div>
  <button class="mb-btn mb-press mb-tap" onclick="toToday()">TODAY</button>
  <div id="levels"></div>
  <button class="mb-btn go mb-press mb-tap" onclick="noteDialog({}, addTarget())">ADD</button>
  <span class="quiet" id="state"></span>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" onclick="openSettings()">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
  <div class="bar" id="bar"></div>
</header>
<main id="scroller" class="mb-scroll"><div class="cal" id="cal"></div></main>
<div id="probe" aria-hidden="true"></div>

<script>
/* ═══════════════════════════════ LOG ═══════════════════════════════
   The journal module. The last few weeks of bullets, set inside the year
   around them. See log/CLAUDE.md for what it is for and why each decision
   was made.

   A bullet is a `note` row and a day's own words are the `note` field of the
   `day` row, both STATUS's shapes, so a line written here or there is the
   same line in both. Mood, energy, caffeine, weight and sleep are read from
   STATUS and never written. The one type LOG owns is `recap`: what he wrote
   about a week group, month, quarter or year.                            */

const APP = {
  id: 'log',
  name: 'Log',
  icon: '▤',
  blurb: 'the journal, the last few weeks at a glance',
  /* `recap` is LOG's own. `note` and `day` are STATUS's shapes; LOG writes
     them by merging into what is there, under the root brief's many-writers
     rule. */
  types: ['recap'],
};

Skins.load('../shared/skins.json?v=13').then(() => { Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true });
  /* A theme changes the font, and the font changes how tall a line is. */
  measure(); applySizes(); if (!touched) toToday(); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* The backup carries the journal and everything written about it, or a
   restore of LOG is a restore of nothing. */
IO.register({ app: APP.id, name: APP.name, types: ['note', 'day', 'recap'] });

const esc = UI.esc;
const attr = s => esc(String(s == null ? '' : s)).replace(/"/g, '&quot;');
/* Month names in full. Tom, 2026-09-13: "Don't abbreviate the name of the
   months." */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DATE_OK = /^\d{4}-\d{2}-\d{2}$/;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let seq = 0;
const uid = () => Rec.USER + '-' + Date.now().toString(36) + '-' +
  (seq++).toString(36) + Math.random().toString(36).slice(2, 5);

const S = {
  get: (k, d) => { const v = Rec.setting(APP.id, k); return v == null ? d : v; },
  set: (k, v) => Rec.setting(APP.id, k, v),
};

/* ══════════════════════ VIEWS ══════════════════════
   Each is how many days fill the screen; Weeks is two, Month 31 and Quarter
   92 so the longest of each fits whole, Year 366.

   `cols` are the side columns, every unit bigger than the view. `spread` is
   how the view falls into notebook spreads: a number of days, or `w` for a
   week group and `ww` for two. 2 Days is always a notebook; the others that
   have a spread follow the Notebook switch. `snap` is the edge a scroll
   settles on: a day, or the named side block. */
const LEVELS = [
  { id: 'd1', name: 'Day',     n: 1,   cols: [],              spread: 1 },
  { id: 'd2', name: '2 Days',  n: 2,   cols: [],              spread: 2, book: true },
  { id: 'd3', name: '3 Days',  n: 3,   cols: [],              spread: 3 },
  { id: 'w1', name: 'Week',    n: 7,   cols: ['w'],           spread: 'w' },
  { id: 'w2', name: 'Weeks',   n: 14,  cols: ['w'],           spread: 'ww' },
  { id: 'm',  name: 'Month',   n: 31,  cols: ['m', 'w'],      snap: 'w' },
  { id: 'q',  name: 'Quarter', n: 92,  cols: ['q', 'm'],      snap: 'm' },
  { id: 'y',  name: 'Year',    n: 366, cols: ['y', 'q', 'm'], snap: 'q' },
];
const LV = id => LEVELS.findIndex(l => l.id === id);
/* The view LOG opens on is a setting; Month unless he picks another. */
const openLevel = () => { const i = LV(S.get('open', 'm')); return i < 0 ? LV('m') : i; };
const MIN_DH = 1;
const COL_NAMES = { y: 'Year', q: 'Quarters', m: 'Months', w: 'Weeks' };
const COL_KIND = { y: 'year', q: 'quarter', m: 'month', w: 'week' };
let level = LV('m'), dayHeight = 20;
let touched = false;         /* once he has moved the view himself, a late theme load must not yank it */

/* Newest days first, or oldest first. A re-click on the view that is on
   flips it, and the "Newest day first" switch shows and sets the same. */
const desc = () => !!S.get('desc', false);
const notebookOn = () => !!S.get('notebook', false);
const isBook = () => { const L = LEVELS[level]; return !!L.spread && (!!L.book || notebookOn()); };
const colsNow = () => isBook() ? [] : LEVELS[level].cols;

const TODAY = Day.today();

/* ── text size ──
   Tom, 2026-09-13: "Text can be a lot bigger, this is for PC." Large is the
   default; Settings has smaller and larger. Each size is four type tokens:
   bullets and written lines, dates, small print, block names. */
const TEXT = {
  normal: ['--f-3', '--f-4', '--f-1', '--f-3'],
  large:  ['--f-4', '--f-5', '--f-2', '--f-4'],
  larger: ['--f-5', '--f-6', '--f-3', '--f-5'],
};
function applyText() {
  const t = TEXT[S.get('text', 'large')] || TEXT.large, b = document.body.style;
  b.setProperty('--tb', 'var(' + t[0] + ')');
  b.setProperty('--td', 'var(' + t[1] + ')');
  b.setProperty('--ts', 'var(' + t[2] + ')');
  b.setProperty('--tl', 'var(' + t[3] + ')');
}

/* ══════════════════════ STATUS'S JOURNAL, MIRRORED ══════════════════════
   The kinds, the time parser, the clock labels, the two publish steps and
   the half-life sum below are COPIES of status/index.html as of 2026-09-13,
   kept to the letter so LOG and STATUS never disagree about a line or a
   coffee. Two copies is two things to keep in step; the right home is
   shared/, and an app session may not put it there. Change one, change
   both, until a foundation session moves them.                          */

const NOTE_KINDS = [
  { id: 'todo',  label: 'Todo',  plural: 'Todos',   to: 'QUEST' },
  { id: 'entry', label: 'Entry', plural: 'Entries', to: 'LOG' },
  { id: 'event', label: 'Event', plural: 'Events',  to: 'LOG' },
  { id: 'idea',  label: 'Idea',  plural: 'Ideas',   to: 'LOG,SPARK' },
];
/* Bullet-journal notation, as STATUS draws it. × is a finished task; an
   open one is drawn as a box you can tick. */
const MARK = { todo: '×', entry: '·', event: '–', idea: '!' };

/* A time goes at the END of the line: "Train 2:45". "Call Dan about the 2:45
   train" keeps its words. A bare 2:45 with no am/pm is the afternoon for
   hours 1 to 6. Durations need a unit: 45m, 1h, 1h30. */
const TIME_RE = /\s+(?:at\s+)?(\d{1,2})(?::|\.)(\d{2})\s*(am|pm)?$/i;
const HOUR_RE = /\s+(?:at\s+)?(\d{1,2})\s*(am|pm)$/i;
const DUR_RE  = /\s+(?:for\s+)?(?:(\d+)\s*h(?:rs?|ours?)?\s*(\d{1,2})?|(\d+)\s*(m|min|mins|minutes?))$/i;

function parseLine(raw) {
  let text = String(raw == null ? '' : raw).trim();
  let at = null, dur = null;
  const d = text.match(DUR_RE);
  if (d) {
    dur = d[1] != null ? (+d[1] * 60 + (+d[2] || 0)) : +d[3];
    if (!(dur > 0)) dur = null; else text = text.slice(0, d.index).trim();
  }
  let m = text.match(TIME_RE);
  if (m) {
    let h = +m[1], mm = +m[2];
    if (mm <= 59 && h <= 23) {
      const ap = (m[3] || '').toLowerCase();
      if (ap === 'pm' && h < 12) h += 12;
      else if (ap === 'am' && h === 12) h = 0;
      else if (!ap && h >= 1 && h <= 6) h += 12;
      at = String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
      text = text.slice(0, m.index).trim();
    }
  } else {
    m = text.match(HOUR_RE);
    if (m) {
      let h = +m[1];
      if (h >= 1 && h <= 12) {
        if (m[2].toLowerCase() === 'pm' && h < 12) h += 12;
        if (m[2].toLowerCase() === 'am' && h === 12) h = 0;
        at = String(h).padStart(2, '0') + ':00';
        text = text.slice(0, m.index).trim();
      }
    }
  }
  if (!text) return { text: String(raw).trim(), at: null, dur: null };
  return { text: text, at: at, dur: dur };
}

function hhmm(ms) {
  const d = new Date(ms);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function clockLabel(at) {
  if (!at) return '';
  const [h, m] = at.split(':').map(Number);
  const ap = h < 12 ? 'am' : 'pm', hh = h % 12 === 0 ? 12 : h % 12;
  return hh + ':' + String(m).padStart(2, '0') + ap;
}
const durLabel = d => !d ? '' : (d >= 60 ? (d % 60 ? Math.floor(d / 60) + 'h' + String(d % 60).padStart(2, '0') : Math.floor(d / 60) + 'h') : d + 'm');

/* After every write, the same two things STATUS does, or the home screen's
   journal counters and DAY LOG fall behind a line written here. */
function publishTimed(d) {
  const want = {};
  Rec.all('note', { date: d }).map(r => r.payload)
    .filter(x => x && x.at && !x.done && !x.cancelled).forEach(x => {
      const id = 'note-at-' + String(x.text).toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40);
      if (!id || id === 'note-at-') return;
      want[id] = 1;
      Rec.set('activity', null, id, { name: x.text, cat: 'journal' });
      Rec.set('tick', d, id, { src: APP.id, qty: 1, at: x.at, dur: x.dur || 0 });
    });
  Rec.all('tick', { date: d }).forEach(r => {
    if (r.key.indexOf('note-at-') === 0 && !want[r.key]) Rec.del('tick', d, r.key);
  });
}
function publishNotes(d) {
  publishTimed(d);
  NOTE_KINDS.forEach(k => {
    const n = Rec.all('note', { date: d })
      .filter(r => r.payload && r.payload.kind === k.id && !(k.id === 'todo' && r.payload.done)).length;
    const id = 'note-' + k.id;
    Rec.set('activity', null, id, { name: k.label + 's', cat: 'journal' });
    if (n) Rec.set('tick', d, id, { src: APP.id, qty: n, to: k.to });
    else Rec.del('tick', d, id);
  });
}

/* ══════════════════════ WHAT SHOWS, AND ON WHICH DAY ══════════════════════
   Tom, 2026-09-13: all four kinds count, a post is an ordinary bullet, and
   the filter bar picks which kinds show and how a day is sorted.

   The day rules are STATUS's:
     - an entry, event or idea is on the day it is written on
     - a finished todo is on the day it was ticked (`doneOn`)
     - an OPEN todo is on the day it was written, with a box to tick. It is
       shown so a todo added here does not vanish, and it is not counted.
   `para` is the old name for an entry and is read as one. Cancelled lines
   show nowhere. */
const shown = () => { const v = S.get('show', null); return Array.isArray(v) ? v : NOTE_KINDS.map(k => k.id); };
const sortMode = () => S.get('sort', 'time');
const SORTS = [{ id: 'time', name: 'By time' }, { id: 'manual', name: 'As arranged' }, { id: 'newest', name: 'Newest first' }];

let byDay = new Map();       /* display date → bullets, sorted */
let byKey = new Map();       /* row date|key → bullet, for clicks */
let firstMin = new Map();    /* display date → minute of the day's earliest bullet, whatever the filter */
let lineCount = 0;           /* every live line, whatever the filter */

/* The clock a line sorts by: a finished task's is when it was ticked, a
   line with a typed time uses it, and anything else falls back to when it
   was written, so a day is one real sequence. STATUS's noteClock. */
function sortClock(p) {
  const s = (p.kind === 'todo' && p.done && p.doneAt) ? p.doneAt : p.at;
  if (s) return +String(s).replace(':', '');
  if (p.t) return +hhmm(p.t).replace(':', '');
  return 9999;
}

function indexJournal() {
  byDay = new Map(); byKey = new Map(); firstMin = new Map(); lineCount = 0;
  const show = shown();
  Rec.all('note', {}).forEach(r => {
    const p = r.payload;
    if (!p || p.cancelled) return;
    const kind = p.kind === 'para' ? 'entry' : p.kind;
    if (!MARK[kind]) return;
    lineCount++;
    const open = kind === 'todo' && !p.done;
    const day = kind === 'todo' && p.done ? (p.doneOn || r.date) : r.date;
    if (!day || !DATE_OK.test(day)) return;
    /* Counted before the filter, so hiding a kind never moves the graph. */
    const c = sortClock(p);
    if (c !== 9999) {
      const m = Math.floor(c / 100) * 60 + c % 100;
      if (!firstMin.has(day) || m < firstMin.get(day)) firstMin.set(day, m);
    }
    if (show.indexOf(kind) < 0) return;
    const x = { key: r.key, date: r.date, day, kind, open, p };
    byKey.set(r.date + '|' + r.key, x);
    if (!byDay.has(day)) byDay.set(day, []);
    byDay.get(day).push(x);
  });
  const mode = sortMode();
  const cmp = (a, b) => {
    if (a.open !== b.open) return a.open ? -1 : 1;
    if (mode === 'manual') return (a.p.ord || 0) - (b.p.ord || 0) || (a.p.t || 0) - (b.p.t || 0);
    if (mode === 'newest') return (b.p.t || 0) - (a.p.t || 0);
    return sortClock(a.p) - sortClock(b.p) || (a.p.t || 0) - (b.p.t || 0);
  };
  byDay.forEach(list => list.sort(cmp));
}
const counted = d => (byDay.get(d) || []).filter(x => !x.open).length;

/* ══════════════════════ THE DAY GRAPH ══════════════════════
   Tom, 2026-09-13: "2 line graphs per day, with time stamps on the entries,
   I also want caffeine tracking." Read from STATUS, never written.

   WHERE A DAY STARTS: the earliest of the day's weigh-ins, sleep entries
   and bullets, to midnight on the right. Readings before it are not drawn.
   MOOD and ENERGY are STATUS's scale fields, one dot per reading placed by
   the time of day it was logged. CAFFEINE is STATUS's own half-life model:
   every dose, typed or read off a meal's label, decays on its own clock and
   the line is what is still in you. Doses from the day before count. */
const graphOn = () => { const v = S.get('graph', null); return Array.isArray(v) ? v : ['mood', 'energy', 'caffeine']; };
const GRAPH = [{ id: 'mood', name: 'Mood' }, { id: 'energy', name: 'Energy' }, { id: 'caffeine', name: 'Caffeine' }];
/* The top of the caffeine scale, a setting. 400mg a day is the ceiling the US
   FDA and the EU's food safety authority both give for healthy adults, which
   is why it is the default. A day past it stretches to fit. */
const cafTop = () => Math.max(50, +S.get('caftop', 400) || 400);
/* A graph spans at least six hours, or a day whose first line was at 11pm
   would be a graph one hour wide. */
const MIN_SPAN = 360;

let G = null;                /* { mood, energy, caf, meals: date → [meal] } */
function indexGraph() {
  const F = Rec.map('field');
  const caf = (F.caffeine && +F.caffeine.half > 0) ? F.caffeine
    : Object.values(F).find(f => f && f.from === 'caff' && +f.half > 0) || null;
  const meals = new Map();
  if (caf) Rec.all('meal', {}).forEach(r => {
    if (!r.payload || !r.date) return;
    if (!meals.has(r.date)) meals.set(r.date, []);
    meals.get(r.date).push(r.payload);
  });
  G = { mood: F.mood || null, energy: F.energy || null, caf, meals };
}
const evList = (date, fid) => { const r = Rec.get('ev', date, fid); return r && r.e ? r.e : []; };
const minuteOf = t => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };

function dayStart(d) {
  let s = firstMin.has(d) ? firstMin.get(d) : null;
  ['weight', 'sleep'].forEach(id => evList(d, id).forEach(e => {
    const m = minuteOf(e.t);
    if (s == null || m < s) s = m;
  }));
  return s == null ? 0 : Math.min(s, 1440 - MIN_SPAN);
}

/* STATUS's entries() for a food-fed field: typed doses plus label figures. */
function cafDoses(date) {
  const f = G.caf, per = f.per == null ? 1 : f.per;
  const out = evList(date, f.id).map(e => ({ t: e.t, v: +e.v || 0 }));
  (G.meals.get(date) || []).forEach(m => {
    const v = (parseFloat(m[f.from]) || 0) * per;
    if (v > 0) out.push({ t: m.t, v: v, food: m.name });
  });
  return out;
}

/* One day's graph as markup, or '' when there is nothing to draw. */
function graphHTML(d) {
  if (!G || d > TODAY) return '';
  const on = graphOn(), W = 1440, H = 100, PAD = 6;
  const start = dayStart(d);
  const xOf = m => (m - start) / (W - start) * W;
  const yOf = u => PAD + (1 - clamp(u, 0, 1)) * (H - PAD * 2);
  let svg = '', dots = '';
  const dot = (cls, m, u, tip) => {
    dots += '<i class="' + cls + '" style="left:' + (xOf(m) / W * 100).toFixed(2) + '%;top:' + (yOf(u) / H * 100).toFixed(2) +
      '%" title="' + attr(tip) + '"></i>';
  };

  ['mood', 'energy'].forEach(id => {
    const f = G[id];
    if (!f || on.indexOf(id) < 0) return;
    const top = Math.max(2, Math.min(10, f.max || 5));
    const pts = evList(d, id).map(e => ({ m: minuteOf(e.t), u: ((+e.v || 1) - 1) / (top - 1), e }))
      .filter(p => p.m >= start).sort((a, b) => a.m - b.m);
    if (!pts.length) return;
    if (pts.length > 1) svg += '<path class="' + id + '" d="' + pts.map((p, i) => (i ? 'L' : 'M') + xOf(p.m).toFixed(1) + ' ' + yOf(p.u).toFixed(1)).join(' ') + '"/>';
    pts.forEach(p => dot(id, p.m, p.u, clockLabel(hhmm(p.e.t)) + ' · ' + (f.label || id) + ' ' + p.e.v + ' of ' + top));
  });

  if (G.caf && on.indexOf('caffeine') > -1) {
    const f = G.caf, half = +f.half;
    const mid = new Date(d + 'T00:00:00').getTime();
    /* STATUS's window: three half-lives back is 12% left, older is noise. */
    const span = Math.ceil(half * 4 / 24) + 1;
    const doses = [];
    Day.range(Day.shift(d, -(span - 1)), d).forEach(x => cafDoses(x).forEach(e => doses.push(e)));
    const level = T => doses.reduce((a, e) => { const hrs = (T - e.t) / 3600000; return hrs < 0 ? a : a + e.v * Math.pow(0.5, hrs / half); }, 0);
    const samples = [];
    for (let m = start; m < W; m += 15) samples.push({ m, v: level(mid + m * 60000) });
    samples.push({ m: W, v: level(mid + W * 60000) });
    const peak = samples.reduce((a, s) => Math.max(a, s.v), 0);
    if (peak >= 1) {
      const topMg = Math.max(cafTop(), peak);
      svg += '<path class="caffeine" d="' + samples.map((s, i) => (i ? 'L' : 'M') + xOf(s.m).toFixed(1) + ' ' + yOf(s.v / topMg).toFixed(1)).join(' ') + '"/>';
      doses.filter(e => e.t >= mid + start * 60000 && e.t < mid + 86400000).forEach(e => {
        dot('caffeine', minuteOf(e.t), level(e.t + 1000) / topMg,
          clockLabel(hhmm(e.t)) + ' · ' + Math.round(e.v) + 'mg caffeine' + (e.food ? ' (' + e.food + ')' : ''));
      });
    }
  }
  if (!svg && !dots) return '';
  return '<div class="gr" aria-hidden="true"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + svg + '</svg>' + dots + '</div>';
}

/* ══════════════════════ DATE MATHS ══════════════════════
   Every period is {from, to, i0, n}: its first and last date, the index of
   its first day on the timeline and how many days it holds.

   THE TIMELINE RUNS FROM THE FIRST RECORD TO TODAY. Tom, 2026-09-13: "Hide
   all the past dates before the creation of the system. Hide future dates."
   The first record is the earliest dated journal line, day, measurement or
   meal; Settings can set a different start. A week, month, quarter or year
   that the timeline cuts through is drawn as the part inside it. */

function firstRecord() {
  let s = TODAY;
  ['note', 'day', 'ev', 'meal'].forEach(t => Rec.all(t, {}).forEach(r => {
    if (r.date && DATE_OK.test(r.date) && r.date < s) s = r.date;
  }));
  return s;
}
function startDate() {
  const set = S.get('start', '');
  return set && DATE_OK.test(set) && set <= TODAY ? set : firstRecord();
}

/* Week groups start on these days of every month. Tom, 2026-09-13: "divide
   the month into 1-7, 8-14, 15-21, 22-28, then show the remaining days as
   their own little group", and then "Put Week 1: 1-7". */
const WEEK_STARTS = [1, 8, 15, 22, 29];

function buildTimeline(first, last) {
  const days = Day.range(first, last);
  const span = (from, to, extra) => {
    const f = from < first ? first : from, t = to > last ? last : to;
    return f > t ? null : Object.assign({ from: f, to: t, i0: Day.diff(f, first), n: Day.diff(t, f) + 1 }, extra);
  };
  const mStart = (y, m) => y + '-' + String(m + 1).padStart(2, '0') + '-01';
  const mEnd = (y, m) => Day.shift(m === 11 ? (y + 1) + '-01-01' : mStart(y, m + 1), -1);
  const add = (list, s) => { if (s) list.push(s); };
  const y0 = +first.slice(0, 4), y1 = +last.slice(0, 4);

  const years = [], quarters = [], months = [], weeks = [];
  for (let y = y0; y <= y1; y++) {
    add(years, span(mStart(y, 0), mEnd(y, 11), { label: String(y) }));
    [0, 1, 2, 3].forEach(q => add(quarters, span(mStart(y, q * 3), mEnd(y, q * 3 + 2), { label: 'Q' + (q + 1) + ' ' + y })));
    MONTHS.forEach((nm, m) => {
      const ms = mStart(y, m), me = mEnd(y, m);
      /* The year goes on January, and on the first month the timeline shows. */
      add(months, span(ms, me, { label: nm + (m === 0 || (ms <= first && me >= first) ? ' ' + y : '') }));
      const end = +me.slice(8);
      WEEK_STARTS.forEach((s, i) => {
        if (s > end) return;
        const e = i < WEEK_STARTS.length - 1 ? Math.min(WEEK_STARTS[i + 1] - 1, end) : end;
        const dd = n => ms.slice(0, 8) + String(n).padStart(2, '0');
        const w = span(dd(s), dd(e), {});
        if (!w) return;
        const a = +w.from.slice(8), b = +w.to.slice(8);
        w.label = 'Week ' + (i + 1) + ': ' + a + (a === b ? '' : '–' + b);
        weeks.push(w);
      });
    });
  }

  const dayList = days.map(d => {
    const lab = Day.label(d, { weekday: 'short' }) + ' ' + +d.slice(8);
    const month = d.slice(8) === '01' || d === first ? MONTHS[+d.slice(5, 7) - 1] + ' ' + d.slice(0, 4) : '';
    return span(d, d, { label: lab, month });
  });

  const pre = [0];
  days.forEach((d, i) => { pre.push(pre[i] + counted(d)); });
  return { y0, y1, first, last, days, years, quarters, months, weeks, dayList, pre };
}
const countOf = p => T.pre[p.i0 + p.n] - T.pre[p.i0];
const bullets = n => n + (n === 1 ? ' bullet' : ' bullets');
/* A date's place in time, and its place on the page, which is the same
   thing backwards when the newest day is first. */
const ascIdx = date => clamp(Day.diff(date, T.first), 0, T.days.length - 1);
const domIdx = date => desc() ? T.days.length - 1 - ascIdx(date) : ascIdx(date);

/* ══════════════════════ DRAWING ══════════════════════ */
let T = null;
let blocks = [];             /* side-column blocks: [{el, col, from, to, state, ws, lines, top, h}] */
let aggCols = [];
let dayCol = null, dayEls = [];
let spreads = [];
let dayCache = new Map();    /* date → markup, cleared whenever the data changes */
const M = { near: 40, small: 18, lab: 24, full: 44, wsLine: 18 };   /* replaced by measure() before first use */

/* The time a bullet shows, STATUS's rules: a typed time; a finished todo's
   Done time; an open todo's start, or "by" its Done time; and for anything
   else with no time of its own, when it was written, drawn quieter. */
function timeOf(x) {
  const p = x.p;
  if (x.kind === 'todo') {
    if (p.done) return { s: clockLabel(p.by || p.doneAt), wrote: false };
    if (p.at) return { s: clockLabel(p.at), wrote: false };
    return { s: p.by ? 'by ' + clockLabel(p.by) : '', wrote: false };
  }
  if (p.at) return { s: clockLabel(p.at), wrote: false };
  if (!p.dur && p.t) return { s: clockLabel(hhmm(p.t)), wrote: true };
  return { s: '', wrote: false };
}

function bulletHTML(x) {
  const tm = timeOf(x), text = String(x.p.text || '');
  return '<div class="bl' + (x.open ? ' open' : '') + '" data-k="' + attr(x.key) + '" data-d="' + x.date + '">' +
    '<span class="tm' + (tm.wrote ? ' wrote' : '') + '">' + esc(tm.s) + '</span>' +
    (x.open ? '<button class="bx mb-tap" type="button" aria-label="Tick"></button>'
            : '<span class="mk">' + MARK[x.kind] + '</span>') +
    '<span class="tx" title="' + attr(text) + '">' + esc(text) + '</span>' +
    (x.p.dur ? '<span class="du">' + durLabel(x.p.dur) + '</span>' : '') + '</div>';
}

/* A week, month, quarter or year has one piece of writing, a `recap` row
   dated on its first day. */
const recapOf = (kind, from) => (Rec.get('recap', from, kind) || {}).text || '';

function dayHTML(p) {
  const hit = dayCache.get(p.from);
  if (hit) return hit;
  const cls = ['day'];
  if (p.from.slice(8) === '01') cls.push('m0');
  else if (WEEK_STARTS.indexOf(+p.from.slice(8)) > 0) cls.push('wk');
  if (p.from === TODAY) cls.push('today');
  const list = byDay.get(p.from) || [];
  const note = (Rec.get('day', p.from, '') || {}).note || '';
  const html = '<div class="' + cls.join(' ') + '" data-from="' + p.from + '"' +
    (note ? ' title="' + attr(p.label + ': ' + note) + '"' : '') + '>' +
    (p.month ? '<div class="mo">' + esc(p.month) + '</div>' : '') +
    '<div class="hd"><span class="lab">' + esc(p.label) + '</span>' +
      '<input class="sum" type="text" maxlength="240" data-d="' + p.from + '" value="' + attr(note) +
      '" aria-label="' + attr(p.label) + '"></div>' +
    '<div class="bw">' + graphHTML(p.from) + '<div class="bls">' + list.map(bulletHTML).join('') + '</div></div></div>';
  dayCache.set(p.from, html);
  return html;
}

function aggHTML(p, col) {
  const kind = COL_KIND[col];
  const cls = ['blk'];
  if (p.from.slice(5) === '01-01') cls.push('y0');
  else if (p.from.slice(8) === '01') cls.push('m0');
  const n = countOf(p);
  if (!n) cls.push('zero');
  const rc = recapOf(kind, p.from);
  const range = Day.label(p.from) + (p.n > 1 ? ' to ' + Day.label(p.to) : '') + ' ' + p.from.slice(0, 4);
  return '<div class="' + cls.join(' ') + '" data-kind="' + kind + '" data-from="' + p.from + '" data-to="' + p.to + '" title="' + attr(rc || range) + '">' +
    '<div class="stick"><span class="lab">' + esc(p.label) + '</span>' +
    '<span class="tot">' + bullets(n) + '</span>' +
    (rc ? '<div class="ws" hidden>' + esc(rc) + '</div>' : '') +
    '</div></div>';
}

/* The spreads a notebook view falls into: a number of days at a time, a
   week group, or two week groups (weeks 1 and 2, 3 and 4, then the rest). */
function spreadGroups(kind) {
  const L = T.dayList, out = [];
  if (typeof kind === 'number') {
    for (let i = 0; i < L.length; i += kind) out.push(L.slice(i, i + kind));
  } else {
    let cur = null;
    T.weeks.forEach(w => {
      const g = L.slice(w.i0, w.i0 + w.n), s = +w.from.slice(8);
      const second = s >= 8 && s < 15 || s >= 22 && s < 29;
      if (kind === 'ww' && second && cur && cur[0].from.slice(0, 7) === w.from.slice(0, 7)) cur.push.apply(cur, g);
      else { cur = g.slice(); out.push(cur); }
    });
  }
  return out;
}

let renderedKey = '';
function render(force) {
  const key = level + '|' + isBook() + '|' + desc();
  if (!force && key === renderedKey) return;
  renderedKey = key;
  const cal = $('cal'), book = isBook();
  cal.classList.toggle('book', book);
  if (book) {
    const L = LEVELS[level];
    let groups = spreadGroups(L.spread);
    if (desc()) groups = groups.reverse().map(g => g.slice().reverse());
    cal.innerHTML = '<div class="book">' + groups.map(g => {
      /* A single day sits on the left page alone. Otherwise the first half
         goes left, and the right page is padded so both have the same
         number of rows and a day lines up with the day beside it. */
      const half = L.spread === 1 ? g.length : Math.ceil(g.length / 2);
      const left = g.slice(0, half), right = g.slice(half);
      const pad = L.spread === 1 ? '' : '<div class="filler"></div>'.repeat(Math.max(0, half - right.length));
      const dates = g.map(p => p.from).sort();
      return '<div class="spread" data-from="' + dates[0] + '" data-to="' + dates[dates.length - 1] + '">' +
        '<div class="page">' + left.map(dayHTML).join('') + '</div>' +
        '<div class="page">' + right.map(dayHTML).join('') + pad + '</div></div>';
    }).join('') + '</div>';
    spreads = [...cal.querySelectorAll('.spread')];
    blocks = []; aggCols = []; dayCol = null; dayEls = [];
  } else {
    const c = colsNow(), sets = { y: T.years, q: T.quarters, m: T.months, w: T.weeks };
    const order = desc() ? T.dayList.slice().reverse() : T.dayList;
    cal.innerHTML =
      (c.length ? '<div class="row heads" id="heads"><div class="agg">' +
        c.map(k => '<div class="c c-' + k + '">' + COL_NAMES[k] + '<span class="rz" data-col="' + k + '" title="Drag to resize"></span></div>').join('') +
        '</div><div class="c c-d">Days</div></div>' : '') +
      '<div class="row body">' +
        (c.length ? '<div class="agg">' + c.map(k => '<div class="col c-' + k + '" data-col="' + k + '">' + sets[k].map(p => aggHTML(p, k)).join('') + '</div>').join('') + '</div>' : '') +
        '<div class="col c-d">' + order.map(dayHTML).join('') + '</div>' +
      '</div>';
    aggCols = [...cal.querySelectorAll('.body .agg .col')];
    blocks = [...cal.querySelectorAll('.body .agg .blk')].map(el => ({
      el, col: el.parentNode.dataset.col, from: el.dataset.from, to: el.dataset.to,
      state: '', ws: el.querySelector('.ws'), lines: -1, top: -1, h: -1,
    }));
    dayCol = cal.querySelector('.body .c-d');
    dayEls = [...dayCol.children];
    spreads = [];
  }
  $('state').textContent = !lineCount ? 'No journal lines' : !shown().length ? 'No bullet types selected' : '';
}

/* ── what fits ──
   Measured rather than guessed, because a theme and the text size change
   the font, and the font changes how tall a line is and how wide a date is. */
function measure() {
  const pr = $('probe');
  const h = (cls, html) => { pr.innerHTML = '<div class="' + cls + '">' + html + '</div>'; return pr.firstChild.offsetHeight; };
  const hd = '<span class="lab">Wed 30</span><input class="sum" value="Line">';
  pr.innerHTML = '<div class="cal near"><div class="day"><div class="hd" style="display:grid">' + hd + '</div></div></div>';
  M.near = pr.querySelector('.hd').offsetHeight;
  pr.innerHTML = '<div class="cal small"><div class="day"><div class="hd" style="display:grid;height:auto">' + hd + '</div></div></div>';
  M.small = pr.querySelector('.hd').offsetHeight;
  /* The widest date, in both sizes, so every day's words start in one place. */
  const widest = (ctx) => {
    pr.innerHTML = '<div class="cal ' + ctx + '"><div class="day"><div class="hd" style="display:block">' +
      ['Wed 30', 'Thu 28', 'Mon 31', 'Sat 22', 'Tue 20', 'Fri 29', 'Sun 30'].map(l => '<span class="lab" style="display:inline-block">' + l + '</span>').join('') +
      '</div></div></div>';
    return Math.ceil(Math.max.apply(null, [...pr.querySelectorAll('.lab')].map(s => s.getBoundingClientRect().width)));
  };
  document.body.style.setProperty('--datew', widest('near') + 'px');
  document.body.style.setProperty('--datews', widest('small') + 'px');
  const stick = inner => '<div class="stick">' + inner + '</div>';
  M.lab = h('blk', stick('<span class="lab">January 2026</span>'));
  M.full = h('blk', stick('<span class="lab">January 2026</span><span class="tot">0 bullets</span>'));
  M.wsLine = h('blk', stick('<span class="lab">January 2026</span><span class="tot">0 bullets</span><div class="ws" style="--ln:1">Line</div>')) - M.full;
  pr.innerHTML = '';
}

/* ══════════════════════ SIZES AND PLACES ══════════════════════ */
const sc = $('scroller');
const headH = () => { const h = $('heads'); return h ? h.offsetHeight : 0; };
const bodyH = () => sc.clientHeight - headH();

/* The day height that puts the view's days on the screen. Whole pixels
   while a day carries words; a fraction of a pixel once it is only texture,
   or a year at a whole pixel a day would not fit the screen. */
const dhFor = n => {
  const v = bodyH() / n;
  return v >= M.small ? Math.floor(v) : Math.max(0.5, v);
};
/* Bullets show once a day has room for two small lines, which is Weeks and
   closer. Month and further out show each day's date and words on a line. */
const nearAt = () => Math.min(M.near, M.small * 2);

function applySizes() {
  const cal = $('cal');
  if (isBook()) {
    cal.classList.add('near');
    cal.classList.remove('small', 'tiny');
    cal.style.setProperty('--dh', '0px');
    cal.style.setProperty('--sh', sc.clientHeight + 'px');
    return;
  }
  dayHeight = dhFor(LEVELS[level].n);
  cal.style.setProperty('--dh', dayHeight + 'px');
  cal.classList.toggle('near', dayHeight >= nearAt());
  cal.classList.toggle('small', dayHeight < nearAt() && dayHeight >= M.small);
  cal.classList.toggle('tiny', dayHeight < 3);
  cal.style.setProperty('--headh', headH() + 'px');
  layoutAgg();
}

/* A side block runs from the top of its first day to the bottom of its
   last, wherever they are. Then how much of its name, count and writing
   fits. Only what changed is written. */
function layoutAgg() {
  if (!dayCol || !blocks.length) return;
  const H = dayCol.offsetHeight;
  aggCols.forEach(c => { c.style.height = H + 'px'; });
  for (const b of blocks) {
    const a = dayEls[domIdx(b.from)], z = dayEls[domIdx(b.to)];
    const y1 = Math.min(a.offsetTop, z.offsetTop);
    const y2 = Math.max(a.offsetTop + a.offsetHeight, z.offsetTop + z.offsetHeight);
    if (y1 !== b.top) { b.el.style.top = y1 + 'px'; b.top = y1; }
    if (y2 - y1 !== b.h) { b.el.style.height = (y2 - y1) + 'px'; b.h = y2 - y1; }
    const px = b.h;
    const s = px < M.lab ? 'bare' : px < M.full ? 'lab-only' : '';
    if (s !== b.state) {
      if (b.state) b.el.classList.remove(b.state);
      if (s) b.el.classList.add(s);
      b.state = s;
    }
    if (b.ws) {
      /* Rounded down, so writing never runs into the block below. */
      const ln = s ? 0 : Math.max(0, Math.floor((px - M.full) / Math.max(1, M.wsLine)));
      if (ln !== b.lines) {
        b.ws.style.setProperty('--ln', ln);
        b.ws.hidden = ln < 1;
        b.lines = ln;
      }
    }
  }
}

/* Positions, all in the scroller's own coordinates. */
const dayY = i => dayCol.offsetTop + dayEls[i].offsetTop;
const dayHt = i => dayEls[i].offsetHeight;
function dateAt(y) {
  let lo = 0, hi = dayEls.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (dayY(mid) <= y) lo = mid; else hi = mid - 1; }
  return { i: lo, f: clamp((y - dayY(lo)) / Math.max(1, dayHt(lo)), 0, 1) };
}
function spreadAt(y) {
  let lo = 0, hi = spreads.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (spreads[mid].offsetTop <= y) lo = mid; else hi = mid - 1; }
  return spreads[lo];
}
function anchorAt(y) {
  if (spreads.length) { const s = spreadAt(y); return { date: desc() ? s.dataset.to : s.dataset.from, f: 0 }; }
  if (!dayEls.length) return { date: TODAY, f: 0 };
  const a = dateAt(y);
  return { date: dayEls[a.i].dataset.from, f: a.f };
}
function spreadOf(date) { return spreads.find(s => s.dataset.from <= date && s.dataset.to >= date) || spreads[0]; }

/* Code that moves the view on purpose says so, and a snap does not undo it. */
let progAt = 0;
function setTop(y) { progAt = Date.now(); sc.scrollTop = y; }

/* A view starts on a whole day. */
function snapTop() {
  if (!dayEls.length) return;
  const a = dateAt(sc.scrollTop + headH());
  const i = a.f > 0.5 ? Math.min(a.i + 1, dayEls.length - 1) : a.i;
  setTop(dayY(i) - headH());
}

function restore(an, y) {
  if (isBook()) { setTop(spreadOf(an.date).offsetTop); return; }
  const i = domIdx(an.date);
  setTop(dayY(i) + an.f * dayHt(i) - y);
}

/* Switch to a view, keeping the day at `anchorY` (pixels from the top of
   the screen) where it was, then starting on a whole day. */
function setLevel(i, anchorY) {
  i = clamp(i, 0, LEVELS.length - 1);
  if (anchorY == null) anchorY = sc.clientHeight / 2;
  const an = anchorAt(sc.scrollTop + anchorY);
  level = i;
  render();
  applySizes();
  syncLevels();
  restore(an, anchorY);
  snapTop();
  showYear();
  drawBar();
}

/* TODAY goes to today, in the view that is on. Tom, 2026-09-13: "Clicking
   today should not change the view mode at all." Today sits on the edge the
   days run towards: the bottom when the oldest day is first, the top when
   the newest is, and the top of the screen in Day. */
function toToday() {
  if (!T) return;
  if (isBook()) { setTop(spreadOf(TODAY).offsetTop); showYear(); return; }
  const i = domIdx(TODAY);
  setTop(desc() || LEVELS[level].n === 1 ? dayY(i) - headH() : dayY(i) + dayHt(i) - sc.clientHeight);
  showYear();
}

/* Open a box: a day at Day; a week group at Week, or at 2 or 3 Days for the
   short end-of-month groups; a month at Month; a quarter at Quarter; a year
   at Year. Its first day goes to the top. */
function openBox(box) {
  touched = true;
  const from = box.dataset.from, to = box.dataset.to || from;
  let id = 'd1';
  if (!box.classList.contains('day')) {
    const kind = box.dataset.kind, n = Day.diff(to, from) + 1;
    id = kind === 'year' ? 'y' : kind === 'quarter' ? 'q' : kind === 'month' ? 'm'
      : n <= 1 ? 'd1' : n === 2 ? 'd2' : n === 3 ? 'd3' : 'w1';
  }
  level = LV(id);
  render();
  applySizes();
  syncLevels();
  if (isBook()) setTop(spreadOf(from).offsetTop);
  else setTop(dayY(domIdx(desc() ? to : from)) - headH());
  showYear();
  drawBar();
  Mobile.feedback('open');
}

function viewDay() { return anchorAt(sc.scrollTop + headH() + bodyH() / 2).date; }
/* ADD writes to today, unless a single day is open, when it writes to that
   day. */
const addTarget = () => LEVELS[level].n === 1 ? viewDay() : TODAY;

function viewYear() { return +viewDay().slice(0, 4); }
function showYear() {
  if (!T) return;
  const y = viewYear();
  $('yrLabel').textContent = y;
  $('prevYr').disabled = y <= T.y0;
  $('nextYr').disabled = y >= T.y1;
}
function goYear(n) {
  const y = clamp(viewYear() + n, T.y0, T.y1);
  let d = desc() ? y + '-12-31' : y + '-01-01';
  if (d < T.first) d = T.first;
  if (d > T.last) d = T.last;
  touched = true;
  if (isBook()) setTop(spreadOf(d).offsetTop);
  else setTop(dayY(domIdx(d)) - headH());
  showYear();
}

function setDesc(on) {
  const an = anchorAt(sc.scrollTop + sc.clientHeight / 2);
  touched = true;
  S.set('desc', !!on);
  render(true);
  applySizes();
  restore(an, sc.clientHeight / 2);
  snapTop();
  showYear();
  drawBar();
  Mobile.feedback('toggle');
}

/* ── snap ──
   Tom, 2026-09-13: "add some snap functionality." When a scroll or a drag
   stops near an edge, the view glides onto it: the start of a day, or of a
   spread in the notebook, or of a week in Month, a month in Quarter, a
   quarter in Year. Near means within a fifth of the screen, so a long day
   can still be read halfway down without being pulled away from. */
function snapEdges() {
  if (isBook()) return spreads.map(s => s.offsetTop);
  const unit = LEVELS[level].snap;
  if (unit && blocks.length) return blocks.filter(b => b.col === unit).map(b => dayCol.offsetTop + b.top).sort((a, b) => a - b);
  return null;
}
let snapT = null, snapping = false;
function snapNow() {
  if (!T || drag || rz || snapping || Date.now() - progAt < 350) return;
  const top = sc.scrollTop + headH();
  let best = null;
  const edges = snapEdges();
  if (edges && edges.length) {
    let lo = 0, hi = edges.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (edges[mid] <= top) lo = mid; else hi = mid - 1; }
    best = edges[lo];
    if (lo + 1 < edges.length && edges[lo + 1] - top < top - best) best = edges[lo + 1];
  } else if (dayEls.length) {
    const a = dateAt(top), y1 = dayY(a.i), y2 = a.i + 1 < dayEls.length ? dayY(a.i + 1) : y1;
    best = top - y1 <= y2 - top ? y1 : y2;
  }
  if (best == null) return;
  const dist = Math.abs(best - top);
  if (dist < 1 || dist > sc.clientHeight * 0.2) return;
  snapping = true;
  const target = best - headH();
  sc.scrollTo({ top: target, behavior: 'smooth' });
  /* A smooth scroll only moves while the page is being drawn, and a tab that
     is not being drawn never runs it. Watched 2026-09-13: in a hidden window
     the glide never happened and nothing snapped. So once the glide has had
     its time, the view is put where it was going anyway. */
  setTimeout(() => {
    if (Math.abs(sc.scrollTop - target) > 1) setTop(target);
    snapping = false;
  }, 450);
}
const snapSoon = () => { clearTimeout(snapT); snapT = setTimeout(snapNow, 160); };

/* ── the view strip ──
   Says which view is on and is the way to them without the mouse's side
   buttons (DOCTRINE law 6). Clicking the one already on flips the order of
   the days. */
let levelSeg = null, syncing = false;
function drawLevels() {
  const box = $('levels');
  box.innerHTML = '';
  levelSeg = UI.segmented(LEVELS.map(l => ({ id: l.id, name: l.name })), LEVELS[level].id, id => {
    if (syncing) return;
    touched = true;
    setLevel(LV(id));
  });
  levelSeg.addEventListener('click', e => {
    /* syncLevels() presses the button that is already on, from code, every
       time the view changes. That is not him re-clicking it. */
    if (syncing) return;
    const b = e.target.closest('button');
    if (b && b.classList.contains('on')) setDesc(!desc());
  }, true);
  box.appendChild(levelSeg);
}
function syncLevels() {
  if (!levelSeg) return;
  syncing = true;
  levelSeg.select(LEVELS[level].id);
  syncing = false;
}

/* ══════════════════════ THE FILTER BAR ══════════════════════ */
const barOn = () => S.get('bar', true) !== false;
function toggleEl(label, on, onChange, sw) {
  const w = UI.el('span', 'tg');
  const t = UI.toggle(on, onChange);
  t.classList.add('mb-tap');
  t.setAttribute('aria-label', label);
  const l = UI.el('span', 'tl', (sw ? '<span class="sw ' + sw + '"></span>' : '') + esc(label));
  l.onclick = () => t.click();
  w.appendChild(l);
  w.appendChild(t);
  return w;
}
function drawBar() {
  const bar = $('bar');
  bar.hidden = !barOn();
  bar.innerHTML = '';
  /* A list setting keeps the bar's own order, so it reads the same way twice. */
  const setList = (key, all, cur, id, on) => S.set(key, all.filter(v => v === id ? on : cur.indexOf(v) > -1));
  const g = UI.el('div', 'grp');
  g.appendChild(UI.el('span', 'k', 'Show'));
  const kinds = NOTE_KINDS.map(k => k.id), lines = GRAPH.map(x => x.id);
  NOTE_KINDS.forEach(k => g.appendChild(toggleEl(k.plural, shown().indexOf(k.id) > -1,
    on => { setList('show', kinds, shown(), k.id, on); rebuild(); })));
  g.appendChild(UI.el('span', 'sep'));
  GRAPH.forEach(x => g.appendChild(toggleEl(x.name, graphOn().indexOf(x.id) > -1,
    on => { setList('graph', lines, graphOn(), x.id, on); rebuild(); }, x.id)));
  bar.appendChild(g);

  const g2 = UI.el('div', 'grp');
  g2.appendChild(UI.el('span', 'k', 'Bullets'));
  g2.appendChild(UI.segmented(SORTS, sortMode(), v => { S.set('sort', v); rebuild(); }));
  g2.appendChild(UI.el('span', 'sep'));
  g2.appendChild(toggleEl('Newest day first', desc(), on => setDesc(on)));
  bar.appendChild(g2);

  /* Only where it applies: the views that have a spread, less 2 Days, which
     is always one (DOCTRINE law 5). */
  const L = LEVELS[level];
  const g3 = UI.el('div', 'grp');
  g3.hidden = !L.spread || !!L.book;
  g3.appendChild(toggleEl('Notebook', notebookOn(), on => {
    const an = anchorAt(sc.scrollTop + sc.clientHeight / 2);
    touched = true;
    S.set('notebook', !!on);
    render(); applySizes(); restore(an, sc.clientHeight / 2); snapTop(); showYear();
  }));
  bar.appendChild(g3);
}

/* ══════════════════════ SETTINGS ══════════════════════
   Tom, 2026-09-13: "Expand settings menu functionality." A LOG tab first,
   ahead of the suite's own look and data tabs. One help line under each. */
function openSettings() {
  UI.settings(APP.id, [{ id: 'log', name: 'LOG', draw: drawLogSettings }], { order: ['log', 'app', 'data'] });
}

    UI.segmented([{ id: 'normal', name: 'Normal' }, { id: 'large', name: 'Large' }, { id: 'larger', name: 'Larger' }],
      S.get('text', 'large'), v => { S.set('text', v); applyText(); measure(); applySizes(); })));

  })));

  const rb = UI.el('button', 'mb-btn mb-press mb-tap', 'RESET');

}

/* ══════════════════════ COLUMN WIDTHS ══════════════════════
   Tom, 2026-09-13: "Let column width be adjustable just like sheets." Drag a
   heading's right edge; double-click it to put the width back. Kept per
   column, so a width set in Month is the same column in Quarter. */
const colW = () => { const v = S.get('colw', null); return v && typeof v === 'object' ? v : {}; };
function applyColW() {
  const w = colW(), cal = $('cal');
  ['y', 'q', 'm', 'w'].forEach(k => { if (w[k]) cal.style.setProperty('--w-' + k, w[k] + 'px'); else cal.style.removeProperty('--w-' + k); });
}
let rz = null, rzT = null;
$('cal').addEventListener('pointerdown', e => {
  const h = e.target.closest('.rz');
  if (!h) return;
  e.preventDefault(); e.stopPropagation();
  rz = { k: h.dataset.col, x: e.clientX, w: h.parentNode.getBoundingClientRect().width, cur: 0, h };
  h.classList.add('on');
  document.body.classList.add('resizing');
}, true);
window.addEventListener('pointermove', e => {
  if (!rz) return;
  rz.cur = Math.round(clamp(rz.w + e.clientX - rz.x, 64, 640));
  $('cal').style.setProperty('--w-' + rz.k, rz.cur + 'px');
  if (!rzT) rzT = setTimeout(() => { rzT = null; applySizes(); }, 40);
});
window.addEventListener('pointerup', () => {
  if (!rz) return;
  if (rz.cur) S.set('colw', Object.assign({}, colW(), { [rz.k]: rz.cur }));
  rz.h.classList.remove('on');
  rz = null;
  document.body.classList.remove('resizing');
  applySizes();
});
$('cal').addEventListener('dblclick', e => {
  const h = e.target.closest('.rz');
  if (!h) return;
  const w = colW();
  delete w[h.dataset.col];
  S.set('colw', w);
  applyColW(); applySizes();
});

/* ══════════════════════ WRITING ══════════════════════
   Every write re-reads the row first and merges into it, never rebuilds it
   from what is on screen. The root brief's many-writers rule. */
let reveal = null;           /* a day to keep on screen after the next redraw */
let heldAt = 0;              /* a menu just opened; the click that ends it must not also act */

/* ── a day's own words ──
   STATUS's `day` row already has a `note` field, one per day, which is
   exactly this, and which nothing else in the suite writes any more. The
   row also carries `rest`, the rest-day flag, so it is merged in and never
   replaces the row. */
function saveSummary(d, raw) {
  const v = String(raw || '').trim();
  const cur = Rec.get('day', d, '') || {};
  if ((cur.note || '') === v) return;
  const next = Object.assign({}, cur, { note: v });
  if (!v) delete next.note;
  if (Object.keys(next).length) Rec.set('day', d, '', next);
  else Rec.del('day', d, '');
}

/* ── writing about a day, week, month, quarter or year, in a box ──
   A day's words are STATUS's day note; the rest are `recap` rows. Enter
   saves; an empty box removes it. */
function summaryDialog(box) {
  const from = box.dataset.from, to = box.dataset.to || from;
  const kind = box.classList.contains('day') ? 'day' : box.dataset.kind;
  const month = MONTHS[+from.slice(5, 7) - 1] + ' ' + from.slice(0, 4);
  const title = (kind === 'day' ? Day.label(from, { weekday: 'short' }) + ' ' + +from.slice(8) + ' ' + month
    : kind === 'year' ? from.slice(0, 4)
    : kind === 'quarter' ? 'Q' + (Math.floor((+from.slice(5, 7) - 1) / 3) + 1) + ' ' + from.slice(0, 4)
    : kind === 'month' ? month
    : (box.querySelector('.lab') ? box.querySelector('.lab').textContent : +from.slice(8) + '–' + +to.slice(8)) + ' ' + month).toUpperCase();
  const current = kind === 'day' ? ((Rec.get('day', from, '') || {}).note || '') : recapOf(kind, from);
  let ta = null;
  const save = h => {
    const v = ta.value.trim();
    if (kind === 'day') saveSummary(from, v);
    else {
      const cur = Rec.get('recap', from, kind);
      if (v) Rec.set('recap', from, kind, Object.assign({}, cur || {}, { text: v }));
      else if (cur) Rec.del('recap', from, kind);
    }
    Mobile.feedback('success');
    h.close();
  };
  UI.dialog({
    title: title, width: 520,
    body: (b, h) => {
      ta = UI.field('note', { rows: kind === 'day' ? 2 : 5, value: current });
      ta.onkeydown = e => {
        if (e.key !== 'Enter' || e.shiftKey || e.altKey || e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        save(h);
      };
      b.appendChild(ta);
      UI.focusSoon(ta);
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: h => { save(h); return false; } },
    ],
  });
}

function noteDialog(x, d) {
  const isNew = !x.key;
  if (isNew && !Day.editable(d)) { UI.toast('Tomorrow isn’t here yet'); return; }
  let kind = x.kind || S.get('kind', 'entry');
  let ta = null;
  const title = (isNew ? 'ADD · ' : 'EDIT · ') +
    Day.label(isNew ? d : x.date, { weekday: 'short', day: 'numeric', month: 'long' }).toUpperCase();

  const commit = (h, again) => {
    const raw = ta.value.trim();
    if (!raw) { UI.toast('Nothing to save', { bad: true }); return; }
    const pz = parseLine(raw);
    let own = d;
    if (isNew) {
      const list = Rec.all('note', { date: d });
      /* STATUS's addNote, field for field. */
      Rec.set('note', d, uid(), {
        kind: kind, text: pz.text, t: Date.now(), made: d,
        at: pz.at, dur: pz.dur,
        ord: list.length, done: 0, cancelled: 0,
      });
      reveal = d;
    } else {
      own = x.date;
      const cur = Rec.get('note', own, x.key);
      if (!cur) { UI.toast('That line is gone', { bad: true }); h.close(); return; }
      Rec.set('note', own, x.key, Object.assign({}, cur, {
        kind: kind, text: pz.text, at: pz.at, dur: pz.dur,
        by: kind === 'todo' ? (cur.by || null) : null,
      }));
      reveal = x.day;
    }
    S.set('kind', kind);
    publishNotes(own);
    Mobile.feedback(again ? 'tick' : 'success');
    if (again) { ta.value = ''; UI.focusSoon(ta, true); }
    else h.close();
  };

  UI.dialog({
    title: title, width: 520,
    body: (b, h) => {
      b.appendChild(UI.segmented(NOTE_KINDS.map(k => ({ id: k.id, name: k.label })), kind, v => { kind = v; }));
      /* The time goes back in the words the way it would have been typed,
         so saving without touching it keeps it. */
      const p = x.p || {};
      ta = UI.field('note', { rows: 2, value: isNew ? '' :
        String(p.text || '') + (p.at ? ' ' + clockLabel(p.at) : '') + (p.dur ? ' ' + durLabel(p.dur) : '') });
      ta.style.marginTop = 'var(--s-3)';
      /* A bullet is one line: Enter adds it and leaves the box open for the
         next, Enter on an empty box closes, Shift+Enter is a new line. */
      ta.onkeydown = e => {
        if (e.key !== 'Enter' || e.shiftKey || e.altKey) return;
        if (e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        if (!ta.value.trim()) { h.close(); return; }
        commit(h, isNew);
      };
      b.appendChild(ta);
      UI.focusSoon(ta);
    },
    actions: [
      { label: 'CANCEL' },
      { label: isNew ? 'ADD' : 'SAVE', kind: 'go', fn: h => { commit(h, false); return false; } },
    ],
  });
}

/* Tick or untick, STATUS's box, field for field. Ticked here and now, so it
   is done today, whichever day it was written on. */
function tick(x) {
  const cur = Rec.get('note', x.date, x.key);
  if (!cur) return;
  const now = new Date(), was = !!cur.done;
  const stamp = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  Rec.set('note', x.date, x.key, Object.assign({}, cur, {
    done: was ? 0 : 1,
    by: was ? (cur.byWas || null) : stamp,
    byWas: was ? null : (cur.byAuto ? (cur.byWas || null) : (cur.by || null)),
    byAuto: was ? 0 : 1,
    doneAt: was ? null : stamp,
    doneOn: was ? null : TODAY,
  }));
  reveal = was ? x.date : TODAY;
  Mobile.feedback(was ? 'untick' : 'tick');
  publishNotes(x.date);
}

function removeLine(x) {
  const keep = Rec.get('note', x.date, x.key);
  if (!keep) return;
  Rec.del('note', x.date, x.key);
  publishNotes(x.date);
  Mobile.haptic('warn');
  UI.undo('Removed <b>' + esc(keep.text || '') + '</b>', () => { Rec.set('note', x.date, x.key, keep); publishNotes(x.date); });
}

const bulletOf = el => byKey.get(el.dataset.d + '|' + el.dataset.k);

/* Click. Tom, 2026-09-13: "click a date should open up that date, only
   clicking the blank space below/beside it enters summary entry." So the
   name of a day, week, month, quarter or year opens it; the space around it
   is for writing about it: a day's line takes the cursor, and anything
   bigger opens a box. A todo's box ticks and a bullet edits. */
$('cal').addEventListener('click', e => {
  if (Date.now() - heldAt < 800) return;
  if (e.target.closest('.sum, .rz')) return;
  const tickBox = e.target.closest('.bx');
  if (tickBox) { const x = bulletOf(tickBox.closest('.bl')); if (x) tick(x); return; }
  const box = e.target.closest('.day, .agg .blk');
  if (!box) return;
  if (e.target.closest('.lab, .mo')) { openBox(box); return; }
  const bl = e.target.closest('.bl');
  if (bl) { const x = bulletOf(bl); if (x) noteDialog(x, x.day); return; }
  if (box.classList.contains('day')) {
    const inp = box.querySelector('.sum');
    if (inp && inp.getClientRects().length) {
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
      return;
    }
  }
  summaryDialog(box);
});

/* A day's line saves when Enter is pressed and whenever it is left; Escape
   puts back what was there. Saved directly rather than on the browser's
   change event, which only fires for some kinds of edit. */
const leaveSummary = inp => {
  saveSummary(inp.dataset.d, inp.value);
  /* A redraw replaces every line on the page, so one that arrived
     mid-sentence waited; this is where it stops waiting. */
  if (pendingRebuild) { pendingRebuild = false; soon(); }
};
$('cal').addEventListener('keydown', e => {
  if (!e.target.classList.contains('sum')) return;
  if (e.key === 'Enter') { e.preventDefault(); leaveSummary(e.target); e.target.blur(); }
  else if (e.key === 'Escape') { e.target.value = e.target.defaultValue; e.target.blur(); }
});
$('cal').addEventListener('focusout', e => {
  if (e.target.classList.contains('sum')) leaveSummary(e.target);
});

/* A right click without a drag, or a hold with a finger: a menu of what a
   click already does (DOCTRINE law 14). A left-button hold does nothing but
   pan now, because holding a button is how he moves the page. */
Mobile.hold($('cal'), e => {
  if (e.type !== 'contextmenu' && e.pointerType === 'mouse') return;
  heldAt = Date.now();
  const bl = e.target.closest('.bl');
  if (bl) {
    const x = bulletOf(bl);
    if (!x) return;
    UI.menu(e.clientX, e.clientY, [
      { label: 'Edit', fn: () => noteDialog(x, x.day) },
      x.kind === 'todo' ? { label: x.p.done ? 'Untick' : 'Tick', fn: () => tick(x) } : null,
      '-',
      { label: 'Delete', kind: 'bad', fn: () => removeLine(x) },
    ].filter(Boolean), { title: x.p.text || '' });
    return;
  }
  const box = e.target.closest('.day, .agg .blk');
  if (!box) return;
  const d = box.dataset.from;
  const items = [{ label: 'Open', fn: () => openBox(box) }, { label: 'Write about it', fn: () => summaryDialog(box) }];
  if (box.classList.contains('day') && Day.editable(d)) items.push({ label: 'Add a bullet', fn: () => noteDialog({}, d) });
  const lab = box.querySelector('.lab');
  UI.menu(e.clientX, e.clientY, items, { title: lab ? lab.textContent : Day.label(d) });
}, { skip: '.sum,.bx,.rz' });

/* ══════════════════════ MOVING AROUND ══════════════════════
   Tom, 2026-09-13: "Change mouse wheel to vertical scroll. Mouse 4 for zoom
   in, Mouse 5 for zoom out. Hold left or right click to pan."

   The wheel is left to the browser, so it scrolls. The side buttons, which
   a browser reads as Back and Forward, are stopped from doing that and move
   one view in or out toward the pointer. */
const sideButton = e => e.button === 3 || e.button === 4;
window.addEventListener('mousedown', e => { if (sideButton(e)) e.preventDefault(); });
window.addEventListener('auxclick', e => { if (sideButton(e)) e.preventDefault(); });
window.addEventListener('mouseup', e => {
  if (!sideButton(e)) return;
  e.preventDefault();
  touched = true;
  const r = sc.getBoundingClientRect();
  setLevel(level + (e.button === 3 ? -1 : 1), clamp(e.clientY - r.top, 0, sc.clientHeight));
});

/* A held left or right button drags the page. Nothing moves until the
   pointer has travelled a few pixels. The click that ends a left drag is
   swallowed, and so is the menu that would open at the end of a right one. */
let drag = null, swallowClick = false, swallowMenuAt = 0;
sc.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || (e.button !== 0 && e.button !== 2)) return;
  if (e.target.closest('button,input,select,textarea,a,.rz')) return;
  drag = { x: e.clientX, y: e.clientY, top: sc.scrollTop, left: sc.scrollLeft, moved: false, button: e.button };
});
window.addEventListener('pointermove', e => {
  if (!drag || rz) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 4) return;
    drag.moved = true; touched = true;
    sc.classList.add('dragging');
  }
  sc.scrollTop = drag.top - dy;
  sc.scrollLeft = drag.left - dx;
});
const endDrag = () => {
  if (drag && drag.moved) {
    if (drag.button === 2) swallowMenuAt = Date.now();
    else { swallowClick = true; setTimeout(() => { swallowClick = false; }, 0); }
    drag = null;
    sc.classList.remove('dragging');
    snapSoon();
    return;
  }
  drag = null;
  sc.classList.remove('dragging');
};
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
sc.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);
sc.addEventListener('contextmenu', e => {
  if (Date.now() - swallowMenuAt < 800) { e.preventDefault(); e.stopPropagation(); }
}, true);
sc.addEventListener('scroll', () => {
  showYear();
  if (drag && drag.moved) return;
  snapSoon();
}, { passive: true });

/* ── start, and keep up ──
   Paint what localStorage already has; redraw when the store's slower half
   lands and whenever anything changes anywhere, STATUS included. A redraw
   keeps the day at the top of the screen where it was, and then makes sure
   a day just written to is on screen. */
function rebuild() {
  const an = T ? anchorAt(sc.scrollTop + headH()) : null;
  indexJournal();
  indexGraph();
  T = buildTimeline(startDate(), TODAY);
  dayCache = new Map();
  applyColW();
  render(true);
  applySizes();
  if (!touched) toToday();
  else if (an) restore(an, headH());
  if (reveal) {
    const d = reveal;
    reveal = null;
    if (isBook()) {
      const s = spreadOf(d);
      if (s.offsetTop + s.offsetHeight <= sc.scrollTop || s.offsetTop >= sc.scrollTop + sc.clientHeight) setTop(s.offsetTop);
    } else {
      const i = domIdx(d), top = dayY(i), bot = top + dayHt(i);
      if (bot > sc.scrollTop + sc.clientHeight) setTop(bot - sc.clientHeight);
      if (top < sc.scrollTop + headH()) setTop(top - headH());
    }
  }
  showYear();
}
let rebuildT = null, pendingRebuild = false;
const typing = () => { const a = document.activeElement; return !!(a && a.classList && a.classList.contains('sum')); };
const soon = () => {
  clearTimeout(rebuildT);
  rebuildT = setTimeout(() => { if (typing()) { pendingRebuild = true; return; } rebuild(); }, 60);
};

applyText();
indexJournal();
indexGraph();
T = buildTimeline(startDate(), TODAY);
level = openLevel();
applyColW();
drawLevels();
drawBar();
measure();
render(true);
applySizes();
syncLevels();
toToday();
Rec.ready(soon);
Rec.on(soon);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); applySizes(); if (!touched) toToday(); });
/* The screen changes height after the first paint (the theme and icons land,
   the header can wrap) and whenever the window is resized. A view is a
   number of days on the screen, so the day height follows the screen. */
if (window.ResizeObserver) new ResizeObserver(() => {
  const an = anchorAt(sc.scrollTop + headH());
  applySizes();
  if (!touched) toToday(); else restore(an, headH());
}).observe(sc);
</script>
</body>
</html>
