<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▤</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Colours and sizes are tokens, never numbers. shared/THEMING.md is the
   contract this app obeys. The raw pixel values are the block geometry,
   which the script hands over as --dh (pixels per day) and --line (one line
   of a day, measured): measurements of time and of the font, not spacing
   decisions, the same way a chart's plot coordinates are. The stroke widths
   and opacities on the day graph are the same kind of chart value STATUS's
   own charts carry. `ch` widths are lengths of text, which is what they
   measure. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* Wraps rather than pushing buttons off the edge in a narrow window. */
header{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);position:relative;z-index:5}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}
.yr{display:flex;align-items:center;gap:var(--s-1)}
.yr b{font-family:var(--font-display);font-size:var(--f-5);font-weight:var(--w-bold);
  min-width:var(--s-9);text-align:center}
.yr button:disabled{opacity:.35;cursor:default}
.quiet{font-size:var(--f-1);color:var(--text-muted)}

/* ── the filter bar ──
   Every choice is a switch: which kinds of bullet show, and which lines the
   day graph draws. Tom, 2026-09-13: "have mood, energy, and caffeine be
   toggles as well." Then how a day is sorted. */
.bar{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3) var(--s-6)}
.bar .grp{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-4)}
.bar .k{font-size:var(--f-1);color:var(--text-muted)}
.bar .sep{width:var(--border-width);align-self:stretch;background:var(--border)}
.tg{display:inline-flex;align-items:center;gap:var(--s-2)}
.tg .tl{font-size:var(--f-2);color:var(--text-2);cursor:pointer;user-select:none;white-space:nowrap}
/* The swatch is the legend: each graph switch wears its line's colour, next
   to the word, so the colour is never the only way to tell them apart. */
.sw{display:inline-block;width:var(--s-3);height:var(--s-1);border-radius:var(--radius-full);
  margin-right:var(--s-2);vertical-align:middle}
.sw.mood,.gr i.mood{background:var(--data-1)}
.sw.energy,.gr i.energy{background:var(--data-3)}
.sw.caffeine,.gr i.caffeine{background:var(--data-6)}

/* The only scrolling surface, both ways. The wheel zooms it rather than
   scrolling it, and a drag moves it, like a map. overflow-anchor is off
   because the browser's own scroll anchoring would fight the zoom's.
   position:relative makes it the thing every day's offsetTop is measured
   from. */
main{flex:1;min-height:0;overflow:auto;overflow-anchor:none;position:relative;
  padding-bottom:var(--safe-b);cursor:grab}
main.dragging{cursor:grabbing;user-select:none}

/* ── the bracket ──
   Three columns: months, weeks, days. Zoomed out, every block is placed at
   (first day × --dh) and is (days × --dh) tall, so a boundary in one column
   is the same pixel in every other column by construction.

   What a day looks like follows from how tall it is:
     far    months and weeks with their counts and written summaries; days
            are texture
     small  the same, and each day shows its date and summary on one line
     near   months and weeks step aside; each day is its date and summary,
            with its bullets underneath, one line each */
.cal{min-width:100%;width:max-content}
.cal.near .agg,.cal.near .heads{display:none}
.row{display:flex}
.agg{display:flex;position:sticky;left:0;z-index:2;background:var(--surface-1)}
/* Wide enough for a summary to be read, and no wider than it needs. */
.c-m,.c-w{width:clamp(var(--s-10), 15vw, calc(var(--s-10) * 2))}
.c-d{flex:1;min-width:var(--s-10)}

.heads{position:sticky;top:0;z-index:3;background:var(--surface-1);
  box-shadow:0 var(--border-width) 0 var(--border-strong)}
.heads .agg{z-index:4}
.heads .c{padding:var(--s-2);font-family:var(--font-display);font-size:var(--f-1);
  font-weight:var(--w-bold);letter-spacing:var(--track-cap);color:var(--text-muted);
  border-right:var(--border-width) solid var(--border)}

.col{position:relative;height:calc(var(--days) * var(--dh));
  border-right:var(--border-width) solid var(--border)}
.cal.near .col.c-d{height:auto}
.body{border-bottom:var(--border-width) solid var(--border)}
.c-d.col{background:var(--bg)}

/* The line sits on the TOP edge of each block, inside its own height, so the
   boundary lands exactly on the block's first pixel in every column. */
.blk{position:absolute;left:0;right:0;top:calc(var(--i) * var(--dh));height:calc(var(--n) * var(--dh));
  border-top:var(--border-width) solid var(--border);
  padding:var(--s-1) var(--s-2) 0;line-height:var(--lh-tight);cursor:pointer}
/* Two targets on every box. Tom, 2026-09-13: "Clicking on a box should open
   it, clicking on the numbers/name is what opens the summary." The name, the
   count and the summary underline under the pointer, so the second target
   can be found without being told. */
.blk .lab:hover,.blk .tot:hover,.agg .blk .ws:hover{text-decoration:underline}
/* The label, count and summary of a tall block ride down the screen with
   it, so a month that starts far above the view still says what it is. */
/* Name and count share a line, so a week at Quarter (about 42px tall) still
   has a line left for its summary. Watched 2026-09-13 at 1280x800: on two
   lines they took 38px and no week summary could show. */
.stick{position:sticky;top:calc(var(--headh) + var(--s-1));
  display:flex;flex-wrap:wrap;align-items:baseline;column-gap:var(--s-2)}
.stick .ws{flex-basis:100%}
.blk .lab{font-weight:var(--w-bold);font-size:var(--f-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.blk .tot{font-size:var(--f-1);color:var(--text-2);white-space:nowrap}
.blk.bare{padding:0}
.blk.bare .stick,.blk.lab-only .tot{display:none}
/* A week's or month's written summary: as many lines as the block has room
   for, worked out in fit(). The word "Summary" only shows under the pointer. */
.ws{margin-top:var(--s-1);font-size:var(--f-1);line-height:var(--lh-tight);color:var(--text-1);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--ln);overflow:hidden;
  overflow-wrap:anywhere}
.ws[hidden]{display:none}
.ws.add{color:transparent}
.agg .blk:hover .ws.add{color:var(--text-muted)}

/* ── a day ── */
.c-d .blk{border-top-color:var(--surface-2);overflow:hidden;padding:0}
.c-d .blk>.hd,.c-d .blk>.bls,.c-d .blk>.gr{display:none}
.cal.small .c-d .blk>.hd,.cal.near .c-d .blk>.hd{display:flex}
.cal.near .c-d .blk>.bls{display:flex}
.cal.near .c-d .blk>.gr{display:block}
/* Lines say where a week group and a month begin. */
.c-d .blk.wk{border-top-color:var(--border)}
.blk.m0,.blk.y0{border-top-color:var(--border-strong)}
.c-d .blk.today{background:var(--surface-3)}
.c-d .blk.today .lab{color:var(--accent)}
.c-d .blk.future .lab{color:var(--text-muted);font-weight:var(--w-body)}

/* The day's first line: its date, then its summary straight after it.
   Line length is capped near the top of the readable range, 45 to 75
   characters. */
.hd{display:flex;align-items:baseline;gap:var(--s-3);min-width:0;max-width:80ch}
.hd .lab{flex:0 0 auto;min-width:var(--s-8);font-weight:var(--w-bold);font-size:var(--f-2);white-space:nowrap}

/* Zoomed out but tall enough for one small line: date and summary only. */
.cal:not(.near) .c-d .hd{align-items:center;line-height:1;font-size:var(--f-1)}
.cal:not(.near) .c-d .hd .lab,.cal:not(.near) .c-d .hd .sum{font-size:var(--f-1);line-height:1}
.cal:not(.near) .c-d .blk>.hd{height:100%;padding:0 var(--s-2)}

/* Zoomed in: the day is a small stack, from the top. A short day centres its
   one line in its row; a day as tall as the screen does not float its date
   halfway down it. A day with bullets gets room below, so the space between
   two days is larger than the space between two lines inside one. */
.cal.near .c-d .blk{position:relative;top:auto;height:auto;min-height:var(--dh);
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:clamp(0px, calc((var(--dh) - var(--line)) / 2), var(--s-2)) var(--s-2) 0}
.cal.near .c-d .blk.has{padding-top:var(--s-1);padding-bottom:var(--s-2)}
.cal.near .c-d .blk>:not(.gr){position:relative;z-index:1}

/* ── the day summary ──
   A line of text after the date. It looks like text until it is pointed at
   or typed in, because a thousand empty boxes down a page is a form, not a
   journal. */
.sum{flex:1 1 auto;min-width:0;font:inherit;font-size:var(--f-2);
  line-height:var(--lh-tight);color:var(--text-1);background:none;border:0;border-radius:0;
  border-bottom:var(--border-width) solid transparent;padding:0;cursor:text}
.sum::placeholder{color:transparent}
.blk:hover .sum::placeholder,.blk.today .sum::placeholder,.sum:focus::placeholder{color:var(--text-muted)}
.sum:hover{border-bottom-color:var(--border)}
.sum:focus{outline:none;border-bottom-color:var(--accent)}

/* ── bullets, under the date ──
   Time, mark, words. The time column is sized so the words start in line
   with the summary above them: one left edge to read down. */
.bls{flex-direction:column;gap:var(--s-1);min-width:0;margin-top:var(--s-1);max-width:80ch}
.bl{display:flex;align-items:baseline;gap:var(--s-2);min-width:0;
  font-size:var(--f-2);line-height:var(--lh-tight);cursor:pointer}
.bl .tm{flex:0 0 auto;min-width:var(--s-7);text-align:right;font-size:var(--f-1);color:var(--text-2);white-space:nowrap}
.bl .tm.wrote{color:var(--text-muted)}
.bl .mk{flex:0 0 auto;width:var(--s-3);text-align:center;color:var(--text-muted)}
.bl .tx{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl .du{flex:0 0 auto;font-size:var(--f-1);color:var(--text-muted)}
.bl.open .tx{color:var(--text-2)}
.bl .bx{flex:0 0 auto;align-self:center;width:var(--s-3);height:var(--s-3);padding:0;cursor:pointer;
  border:var(--border-width) solid var(--text-2);border-radius:var(--radius-sm);background:none}
.bl .bx:hover{border-color:var(--accent)}

/* ── the day graph ──
   Behind the whole day, from the day's start on the left to midnight on the
   right. Faint on purpose, mood and energy most of all (Tom, 2026-09-13:
   "make mood and energy more transparent"). The drawing is stretched to fill
   the row, so strokes are told not to stretch with it. Dots are page
   elements rather than svg circles, so they stay round, and each says its
   time on hover. */
.gr{position:absolute;top:0;bottom:0;left:var(--s-2);right:var(--s-2);pointer-events:none;z-index:0}
.gr svg{position:absolute;left:0;top:0;width:100%;height:100%}
.gr path{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke}
.gr path.mood{stroke:var(--data-1);opacity:.22}
.gr path.energy{stroke:var(--data-3);opacity:.22}
.gr path.caffeine{stroke:var(--data-6);stroke-dasharray:3 3;opacity:.5}
.gr i{position:absolute;width:var(--s-2);height:var(--s-2);margin:calc(var(--s-1) * -1) 0 0 calc(var(--s-1) * -1);
  border-radius:var(--radius-full);pointer-events:auto;cursor:default}
.gr i.mood,.gr i.energy{opacity:.35}
.gr i.caffeine{opacity:.8}
</style>
</head>
<body>
<header>
  <div class="logo">LO<b>G</b></div>
  <div class="yr">
    <button id="prevYr" class="mb-btn mb-press mb-tap" onclick="goYear(-1)" aria-label="Previous year" data-icon="prev"></button>
    <b id="yrLabel"></b>
    <button id="nextYr" class="mb-btn mb-press mb-tap" onclick="goYear(1)" aria-label="Next year" data-icon="next"></button>
  </div>
  <button class="mb-btn mb-press mb-tap" onclick="touched = false; goToday()">TODAY</button>
  <div id="levels"></div>
  <button class="mb-btn go mb-press mb-tap" onclick="noteDialog({}, addTarget())">ADD</button>
  <span class="quiet" id="state"></span>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" onclick="UI.settings(APP.id)">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
  <div class="bar" id="bar"></div>
</header>
<main id="scroller" class="mb-scroll"><div class="cal" id="cal"></div></main>

<script>
/* ═══════════════════════════════ LOG ═══════════════════════════════
   The journal module. The last few weeks of bullets, set inside the year
   around them. See log/CLAUDE.md for what it is for and why each decision
   was made.

   A bullet is a `note` row and a day's summary is the `note` field of the
   `day` row, both STATUS's shapes, so a line written here or there is the
   same line in both. Mood, energy, caffeine, weight and sleep are read from
   STATUS and never written. The one type LOG owns is `recap`: the written
   summary of a week group or a month.                                    */

const APP = {
  id: 'log',
  name: 'Log',
  icon: '▤',
  blurb: 'the journal, the last few weeks at a glance',
  /* `recap` is LOG's own. `note` and `day` are STATUS's shapes; LOG writes
     them by merging into what is there, under the root brief's many-writers
     rule. */
  types: ['recap'],
};

Skins.load('../shared/skins.json?v=13').then(() => { Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true });
  /* A theme changes the font, and the font changes how tall a line is and
     how tall the column headings are. */
  measure(); fit(); if (!touched) goToday(); else setLevel(level); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* The backup carries the journal and every summary, or a restore of LOG is
   a restore of nothing. */
IO.register({ app: APP.id, name: APP.name, types: ['note', 'day', 'recap'] });

const esc = UI.esc;
const attr = s => esc(String(s == null ? '' : s)).replace(/"/g, '&quot;');
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DATE_OK = /^\d{4}-\d{2}-\d{2}$/;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let seq = 0;
const uid = () => Rec.USER + '-' + Date.now().toString(36) + '-' +
  (seq++).toString(36) + Math.random().toString(36).slice(2, 5);

const S = {
  get: (k, d) => { const v = Rec.setting(APP.id, k); return v == null ? d : v; },
  set: (k, v) => Rec.setting(APP.id, k, v),
};

/* ── zoom ──
   Seven steps, and nothing in between. Tom, 2026-09-13: "Day, 2 Days, 3 Days,
   Week, Weeks, Month, Quarter." Each is how many days fill the screen. Weeks
   is two; Month is 31 and Quarter 92, so the longest month and the longest
   quarter both fit whole.

   dayHeight is still the one number the layout hangs off: the screen's
   height divided by the step's days. Zoomed out, every block is (days it
   contains) × dayHeight tall; zoomed in, it is the least a day can be, and a
   busy day is taller. */
const LEVELS = [
  { id: 'd1', name: 'Day',     n: 1 },
  { id: 'd2', name: '2 Days',  n: 2 },
  { id: 'd3', name: '3 Days',  n: 3 },
  { id: 'w1', name: 'Week',    n: 7 },
  { id: 'w2', name: 'Weeks',   n: 14 },
  { id: 'm',  name: 'Month',   n: 31 },
  { id: 'q',  name: 'Quarter', n: 92 },
];
const LV = id => LEVELS.findIndex(l => l.id === id);
/* Opening view: today on the bottom edge, a month above it. Tom, 2026-09-13:
   the app is mostly for the past three to eight weeks; Month is the step
   nearest that. */
const OPEN_LEVEL = LV('m');
const MIN_DH = 2;
let level = OPEN_LEVEL, dayHeight = 4;
let touched = false;         /* once he has zoomed or dragged, a late theme load must not yank the view */

const TODAY = Day.today();
const THIS_YEAR = +TODAY.slice(0, 4);

/* ══════════════════════ STATUS'S JOURNAL, MIRRORED ══════════════════════
   The kinds, the time parser, the clock labels, the two publish steps and
   the half-life sum below are COPIES of status/index.html as of 2026-09-13,
   kept to the letter so LOG and STATUS never disagree about a line or a
   coffee. Two copies is two things to keep in step; the right home is
   shared/, and an app session may not put it there. Change one, change
   both, until a foundation session moves them.                          */

const NOTE_KINDS = [
  { id: 'todo',  label: 'Todo',  plural: 'Todos',   to: 'QUEST' },
  { id: 'entry', label: 'Entry', plural: 'Entries', to: 'LOG' },
  { id: 'event', label: 'Event', plural: 'Events',  to: 'LOG' },
  { id: 'idea',  label: 'Idea',  plural: 'Ideas',   to: 'LOG,SPARK' },
];
/* Bullet-journal notation, as STATUS draws it. × is a finished task; an
   open one is drawn as a box you can tick. */
const MARK = { todo: '×', entry: '·', event: '–', idea: '!' };

/* A time goes at the END of the line: "Train 2:45". "Call Dan about the 2:45
   train" keeps its words. A bare 2:45 with no am/pm is the afternoon for
   hours 1 to 6. Durations need a unit: 45m, 1h, 1h30. */
const TIME_RE = /\s+(?:at\s+)?(\d{1,2})(?::|\.)(\d{2})\s*(am|pm)?$/i;
const HOUR_RE = /\s+(?:at\s+)?(\d{1,2})\s*(am|pm)$/i;
const DUR_RE  = /\s+(?:for\s+)?(?:(\d+)\s*h(?:rs?|ours?)?\s*(\d{1,2})?|(\d+)\s*(m|min|mins|minutes?))$/i;

function parseLine(raw) {
  let text = String(raw == null ? '' : raw).trim();
  let at = null, dur = null;
  const d = text.match(DUR_RE);
  if (d) {
    dur = d[1] != null ? (+d[1] * 60 + (+d[2] || 0)) : +d[3];
    if (!(dur > 0)) dur = null; else text = text.slice(0, d.index).trim();
  }
  let m = text.match(TIME_RE);
  if (m) {
    let h = +m[1], mm = +m[2];
    if (mm <= 59 && h <= 23) {
      const ap = (m[3] || '').toLowerCase();
      if (ap === 'pm' && h < 12) h += 12;
      else if (ap === 'am' && h === 12) h = 0;
      else if (!ap && h >= 1 && h <= 6) h += 12;
      at = String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
      text = text.slice(0, m.index).trim();
    }
  } else {
    m = text.match(HOUR_RE);
    if (m) {
      let h = +m[1];
      if (h >= 1 && h <= 12) {
        if (m[2].toLowerCase() === 'pm' && h < 12) h += 12;
        if (m[2].toLowerCase() === 'am' && h === 12) h = 0;
        at = String(h).padStart(2, '0') + ':00';
        text = text.slice(0, m.index).trim();
      }
    }
  }
  if (!text) return { text: String(raw).trim(), at: null, dur: null };
  return { text: text, at: at, dur: dur };
}

function hhmm(ms) {
  const d = new Date(ms);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function clockLabel(at) {
  if (!at) return '';
  const [h, m] = at.split(':').map(Number);
  const ap = h < 12 ? 'am' : 'pm', hh = h % 12 === 0 ? 12 : h % 12;
  return hh + ':' + String(m).padStart(2, '0') + ap;
}
const durLabel = d => !d ? '' : (d >= 60 ? (d % 60 ? Math.floor(d / 60) + 'h' + String(d % 60).padStart(2, '0') : Math.floor(d / 60) + 'h') : d + 'm');

/* After every write, the same two things STATUS does, or the home screen's
   journal counters and DAY LOG fall behind a line written here. */
function publishTimed(d) {
  const want = {};
  Rec.all('note', { date: d }).map(r => r.payload)
    .filter(x => x && x.at && !x.done && !x.cancelled).forEach(x => {
      const id = 'note-at-' + String(x.text).toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40);
      if (!id || id === 'note-at-') return;
      want[id] = 1;
      Rec.set('activity', null, id, { name: x.text, cat: 'journal' });
      Rec.set('tick', d, id, { src: APP.id, qty: 1, at: x.at, dur: x.dur || 0 });
    });
  Rec.all('tick', { date: d }).forEach(r => {
    if (r.key.indexOf('note-at-') === 0 && !want[r.key]) Rec.del('tick', d, r.key);
  });
}
function publishNotes(d) {
  publishTimed(d);
  NOTE_KINDS.forEach(k => {
    const n = Rec.all('note', { date: d })
      .filter(r => r.payload && r.payload.kind === k.id && !(k.id === 'todo' && r.payload.done)).length;
    const id = 'note-' + k.id;
    Rec.set('activity', null, id, { name: k.label + 's', cat: 'journal' });
    if (n) Rec.set('tick', d, id, { src: APP.id, qty: n, to: k.to });
    else Rec.del('tick', d, id);
  });
}

/* ══════════════════════ WHAT SHOWS, AND ON WHICH DAY ══════════════════════
   Tom, 2026-09-13: all four kinds count, a post is an ordinary bullet, and
   the filter bar picks which kinds show and how a day is sorted.

   The day rules are STATUS's:
     - an entry, event or idea is on the day it is written on
     - a finished todo is on the day it was ticked (`doneOn`)
     - an OPEN todo is on the day it was written, with a box to tick. It is
       shown so a todo added here does not vanish, and it is not counted.
   `para` is the old name for an entry and is read as one. Cancelled lines
   show nowhere. */
const shown = () => { const v = S.get('show', null); return Array.isArray(v) ? v : NOTE_KINDS.map(k => k.id); };
const sortMode = () => S.get('sort', 'time');
const SORTS = [{ id: 'time', name: 'By time' }, { id: 'manual', name: 'As arranged' }, { id: 'newest', name: 'Newest first' }];

let byDay = new Map();       /* display date → bullets, sorted */
let byKey = new Map();       /* row date|key → bullet, for clicks */
let firstMin = new Map();    /* display date → minute of the day's earliest bullet, whatever the filter */
let lineCount = 0;           /* every live line, whatever the filter */

/* The clock a line sorts by: a finished task's is when it was ticked, a
   line with a typed time uses it, and anything else falls back to when it
   was written, so a day is one real sequence. STATUS's noteClock. */
function sortClock(p) {
  const s = (p.kind === 'todo' && p.done && p.doneAt) ? p.doneAt : p.at;
  if (s) return +String(s).replace(':', '');
  if (p.t) return +hhmm(p.t).replace(':', '');
  return 9999;
}

function indexJournal() {
  byDay = new Map(); byKey = new Map(); firstMin = new Map(); lineCount = 0;
  const show = shown();
  Rec.all('note', {}).forEach(r => {
    const p = r.payload;
    if (!p || p.cancelled) return;
    const kind = p.kind === 'para' ? 'entry' : p.kind;
    if (!MARK[kind]) return;
    lineCount++;
    const open = kind === 'todo' && !p.done;
    const day = kind === 'todo' && p.done ? (p.doneOn || r.date) : r.date;
    if (!day || !DATE_OK.test(day)) return;
    /* Counted before the filter, so hiding a kind never moves the graph. */
    const c = sortClock(p);
    if (c !== 9999) {
      const m = Math.floor(c / 100) * 60 + c % 100;
      if (!firstMin.has(day) || m < firstMin.get(day)) firstMin.set(day, m);
    }
    if (show.indexOf(kind) < 0) return;
    const x = { key: r.key, date: r.date, day, kind, open, p };
    byKey.set(r.date + '|' + r.key, x);
    if (!byDay.has(day)) byDay.set(day, []);
    byDay.get(day).push(x);
  });
  const mode = sortMode();
  const cmp = (a, b) => {
    if (a.open !== b.open) return a.open ? -1 : 1;
    if (mode === 'manual') return (a.p.ord || 0) - (b.p.ord || 0) || (a.p.t || 0) - (b.p.t || 0);
    if (mode === 'newest') return (b.p.t || 0) - (a.p.t || 0);
    return sortClock(a.p) - sortClock(b.p) || (a.p.t || 0) - (b.p.t || 0);
  };
  byDay.forEach(list => list.sort(cmp));
}
const counted = d => (byDay.get(d) || []).filter(x => !x.open).length;

/* ══════════════════════ THE DAY GRAPH ══════════════════════
   Tom, 2026-09-13: "2 line graphs per day, with time stamps on the entries,
   I also want caffeine tracking." Read from STATUS, never written.

   WHERE A DAY STARTS. Tom, 2026-09-13: "Check weight, bullets, or sleep -
   whatever came first, use that as the start of the day for the graphs."
   So the left edge is the earliest of the day's weigh-ins, sleep entries
   and bullets, and the right edge is midnight. A day with none of those
   starts at midnight. Readings logged before the start are not drawn.

   MOOD and ENERGY are STATUS's scale fields: every reading has a timestamp
   and a score from 1 to the field's top (5 unless he changed it). Each is a
   line placed by the time of day it was logged, one dot per reading.

   CAFFEINE is STATUS's own model, not a new one: every dose, typed or read
   off a meal's label, decays on its own clock at the field's half-life, and
   what is still in you is the sum. Doses from the day before count, which
   is why an evening coffee shows the next morning. Drawn only if a caffeine
   field with a half-life exists; STATUS adds one from its library. */
const graphOn = () => { const v = S.get('graph', null); return Array.isArray(v) ? v : ['mood', 'energy', 'caffeine']; };
const GRAPH = [{ id: 'mood', name: 'Mood' }, { id: 'energy', name: 'Energy' }, { id: 'caffeine', name: 'Caffeine' }];
/* The top of the caffeine scale. 400mg a day is the ceiling the US FDA and
   the EU's food safety authority both give for healthy adults, so a line at
   the top of a row means that much in you at once. A day that goes past it
   stretches to fit rather than clipping. */
const CAF_TOP = 400;
/* However late the first thing happened, a graph spans at least six hours,
   or a day whose first line was at 11pm would be a graph one hour wide. */
const MIN_SPAN = 360;

let G = null;                /* { mood, energy, caf, meals: date → [meal] } */
function indexGraph() {
  const F = Rec.map('field');
  const caf = (F.caffeine && +F.caffeine.half > 0) ? F.caffeine
    : Object.values(F).find(f => f && f.from === 'caff' && +f.half > 0) || null;
  const meals = new Map();
  if (caf) Rec.all('meal', {}).forEach(r => {
    if (!r.payload || !r.date) return;
    if (!meals.has(r.date)) meals.set(r.date, []);
    meals.get(r.date).push(r.payload);
  });
  G = { mood: F.mood || null, energy: F.energy || null, caf, meals };
}
const evList = (date, fid) => { const r = Rec.get('ev', date, fid); return r && r.e ? r.e : []; };
const minuteOf = t => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };

/* The earliest weigh-in, sleep entry or bullet, as a minute of the day. */
function dayStart(d) {
  let s = firstMin.has(d) ? firstMin.get(d) : null;
  ['weight', 'sleep'].forEach(id => evList(d, id).forEach(e => {
    const m = minuteOf(e.t);
    if (s == null || m < s) s = m;
  }));
  return s == null ? 0 : Math.min(s, 1440 - MIN_SPAN);
}

/* STATUS's entries() for a food-fed field: typed doses plus label figures. */
function cafDoses(date) {
  const f = G.caf, per = f.per == null ? 1 : f.per;
  const out = evList(date, f.id).map(e => ({ t: e.t, v: +e.v || 0 }));
  (G.meals.get(date) || []).forEach(m => {
    const v = (parseFloat(m[f.from]) || 0) * per;
    if (v > 0) out.push({ t: m.t, v: v, food: m.name });
  });
  return out;
}

/* One day's graph as markup, or '' when there is nothing to draw. */
function graphHTML(d) {
  if (!G || d > TODAY) return '';
  const on = graphOn(), W = 1440, H = 100, PAD = 6;
  const start = dayStart(d);
  const xOf = m => (m - start) / (W - start) * W;
  const yOf = u => PAD + (1 - clamp(u, 0, 1)) * (H - PAD * 2);
  let svg = '', dots = '';
  const dot = (cls, m, u, tip) => {
    dots += '<i class="' + cls + '" style="left:' + (xOf(m) / W * 100).toFixed(2) + '%;top:' + (yOf(u) / H * 100).toFixed(2) +
      '%" title="' + attr(tip) + '"></i>';
  };

  ['mood', 'energy'].forEach(id => {
    const f = G[id];
    if (!f || on.indexOf(id) < 0) return;
    const top = Math.max(2, Math.min(10, f.max || 5));
    const pts = evList(d, id).map(e => ({ m: minuteOf(e.t), u: ((+e.v || 1) - 1) / (top - 1), e }))
      .filter(p => p.m >= start).sort((a, b) => a.m - b.m);
    if (!pts.length) return;
    if (pts.length > 1) svg += '<path class="' + id + '" d="' + pts.map((p, i) => (i ? 'L' : 'M') + xOf(p.m).toFixed(1) + ' ' + yOf(p.u).toFixed(1)).join(' ') + '"/>';
    pts.forEach(p => dot(id, p.m, p.u, clockLabel(hhmm(p.e.t)) + ' · ' + (f.label || id) + ' ' + p.e.v + ' of ' + top));
  });

  if (G.caf && on.indexOf('caffeine') > -1) {
    const f = G.caf, half = +f.half;
    const mid = new Date(d + 'T00:00:00').getTime();
    /* STATUS's window: three half-lives back is 12% left, older is noise. */
    const span = Math.ceil(half * 4 / 24) + 1;
    const doses = [];
    Day.range(Day.shift(d, -(span - 1)), d).forEach(x => cafDoses(x).forEach(e => doses.push(e)));
    const level = T => doses.reduce((a, e) => { const hrs = (T - e.t) / 3600000; return hrs < 0 ? a : a + e.v * Math.pow(0.5, hrs / half); }, 0);
    const samples = [];
    for (let m = start; m < W; m += 15) samples.push({ m, v: level(mid + m * 60000) });
    samples.push({ m: W, v: level(mid + W * 60000) });
    const peak = samples.reduce((a, s) => Math.max(a, s.v), 0);
    if (peak >= 1) {
      const topMg = Math.max(CAF_TOP, peak);
      svg += '<path class="caffeine" d="' + samples.map((s, i) => (i ? 'L' : 'M') + xOf(s.m).toFixed(1) + ' ' + yOf(s.v / topMg).toFixed(1)).join(' ') + '"/>';
      doses.filter(e => e.t >= mid + start * 60000 && e.t < mid + 86400000).forEach(e => {
        dot('caffeine', minuteOf(e.t), level(e.t + 1000) / topMg,
          clockLabel(hhmm(e.t)) + ' · ' + Math.round(e.v) + 'mg caffeine' + (e.food ? ' (' + e.food + ')' : ''));
      });
    }
  }
  if (!svg && !dots) return '';
  return '<div class="gr" aria-hidden="true"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + svg + '</svg>' + dots + '</div>';
}

/* ══════════════════════ DATE MATHS ══════════════════════
   Every period is {from, to, i0, n}: its first and last date, the index of
   its first day on the timeline and how many days it holds.

   ONE TIMELINE, not one year per page. Tom, 2026-09-13: in January the last
   eight weeks are mostly December, and a page break there would cut exactly
   the stretch the app is for. Years stack; December sits on January.     */

function firstYear() {
  let y = THIS_YEAR - 1;
  Rec.all('note', {}).forEach(r => { if (r.date && DATE_OK.test(r.date)) y = Math.min(y, +r.date.slice(0, 4)); });
  return y;
}

/* Week groups start on these days of every month. Tom, 2026-09-13: "divide
   the month into 1-7, 8-14, 15-21, 22-28, then show the remaining days as
   their own little group." */
const WEEK_STARTS = [1, 8, 15, 22, 29];

function buildTimeline(y0, y1) {
  const first = y0 + '-01-01', last = y1 + '-12-31';
  const days = Day.range(first, last);            /* leap years for free */
  const span = (from, to, extra) => Object.assign({ from, to, i0: Day.diff(from, first), n: Day.diff(to, from) + 1 }, extra);
  const mStart = (y, m) => y + '-' + String(m + 1).padStart(2, '0') + '-01';
  const mEnd = (y, m) => Day.shift(m === 11 ? (y + 1) + '-01-01' : mStart(y, m + 1), -1);

  /* Halves and quarters were removed. Tom, 2026-09-13. The year goes on
     January and nowhere else. */
  const months = [], weeks = [];
  for (let y = y0; y <= y1; y++) {
    MONTHS.forEach((nm, m) => months.push(span(mStart(y, m), mEnd(y, m), { label: m ? nm : nm + ' ' + y })));
  }

  /* 1–7, 8–14, 15–21, 22–28, and whatever is left: 29, 29–30 or 29–31, or
     nothing at all in a February that is not a leap year. */
  months.forEach(mo => {
    const ym = mo.from.slice(0, 8), end = +mo.to.slice(8);
    WEEK_STARTS.forEach((s, i) => {
      if (s > end) return;
      const e = i < WEEK_STARTS.length - 1 ? Math.min(WEEK_STARTS[i + 1] - 1, end) : end;
      const dd = n => ym + String(n).padStart(2, '0');
      weeks.push(span(dd(s), dd(e), { label: s === e ? String(s) : s + '–' + e }));
    });
  });

  const dayList = days.map(d => {
    const md = d.slice(5), day = +d.slice(8), wd = Day.label(d, { weekday: 'short' });
    const label = md === '01-01' ? wd + ' 1 Jan ' + d.slice(0, 4)
      : day === 1 ? wd + ' 1 ' + MONTHS[+d.slice(5, 7) - 1] : wd + ' ' + day;
    return span(d, d, { label });
  });

  const pre = [0];
  days.forEach((d, i) => { pre.push(pre[i] + counted(d)); });
  return { y0, y1, first, days, months, weeks, dayList, pre };
}
const countOf = p => T.pre[p.i0 + p.n] - T.pre[p.i0];
const bullets = n => n + (n === 1 ? ' bullet' : ' bullets');
const idx = date => clamp(Day.diff(date, T.first), 0, T.days.length - 1);

/* ══════════════════════ DRAWING ══════════════════════ */
let T = null;
let blocks = [];             /* month and week blocks: [{el, n, state, ws, lines}] — what fit() walks on every zoom */
let dayCol = null, dayEls = [];
const M = { lab: 20, full: 36, wsLine: 16, small: 14, dayLine: 18, heads: 32 };   /* replaced by measure() before first use */

/* The time a bullet shows, STATUS's rules: a typed time; a finished todo's
   Done time; an open todo's start, or "by" its Done time; and for anything
   else with no time of its own, when it was written, drawn quieter. */
function timeOf(x) {
  const p = x.p;
  if (x.kind === 'todo') {
    if (p.done) return { s: clockLabel(p.by || p.doneAt), wrote: false };
    if (p.at) return { s: clockLabel(p.at), wrote: false };
    return { s: p.by ? 'by ' + clockLabel(p.by) : '', wrote: false };
  }
  if (p.at) return { s: clockLabel(p.at), wrote: false };
  if (!p.dur && p.t) return { s: clockLabel(hhmm(p.t)), wrote: true };
  return { s: '', wrote: false };
}

function bulletHTML(x) {
  const tm = timeOf(x), text = String(x.p.text || '');
  return '<div class="bl' + (x.open ? ' open' : '') + '" data-k="' + attr(x.key) + '" data-d="' + x.date + '">' +
    '<span class="tm' + (tm.wrote ? ' wrote' : '') + '">' + esc(tm.s) + '</span>' +
    (x.open ? '<button class="bx mb-tap" type="button" aria-label="Tick"></button>'
            : '<span class="mk">' + MARK[x.kind] + '</span>') +
    '<span class="tx" title="' + attr(text) + '">' + esc(text) + '</span>' +
    (x.p.dur ? '<span class="du">' + durLabel(x.p.dur) + '</span>' : '') + '</div>';
}

/* A week or a month has one written summary, a `recap` row dated on its
   first day. */
const recapKind = colCls => colCls === 'c-m' ? 'month' : 'week';
const recapOf = (kind, from) => (Rec.get('recap', from, kind) || {}).text || '';

function blockHTML(p, kind, colCls) {
  const cls = ['blk'];
  if (p.from.slice(5) === '01-01') cls.push('y0');
  else if (p.from.slice(8) === '01') cls.push('m0');
  const future = p.from > TODAY;
  const style = '--i:' + p.i0 + ';--n:' + p.n;
  if (kind === 'd') {
    const list = byDay.get(p.from) || [];
    if (WEEK_STARTS.indexOf(+p.from.slice(8)) > 0) cls.push('wk');
    if (p.from === TODAY) cls.push('today');
    if (future) cls.push('future');
    if (list.length) cls.push('has');
    const note = future ? '' : (Rec.get('day', p.from, '') || {}).note || '';
    const sum = future ? ''
      : '<input class="sum" type="text" maxlength="240" placeholder="Summary" data-d="' + p.from + '" value="' +
        attr(note) + '" aria-label="Summary for ' + attr(p.label) + '">';
    return '<div class="' + cls.join(' ') + '" style="' + style + '" data-from="' + p.from + '"' +
      (note ? ' title="' + attr(p.label + ': ' + note) + '"' : '') + '>' +
      '<div class="hd"><span class="lab">' + esc(p.label) + '</span>' + sum + '</div>' +
      '<div class="bls">' + list.map(bulletHTML).join('') + '</div>' +
      graphHTML(p.from) + '</div>';
  }
  const rc = future ? '' : recapOf(recapKind(colCls), p.from);
  const range = Day.label(p.from) + (p.n > 1 ? ' to ' + Day.label(p.to) : '') + ' ' + p.from.slice(0, 4);
  return '<div class="' + cls.join(' ') + '" style="' + style + '" title="' + attr(rc || range) + '" data-from="' + p.from + '" data-to="' + p.to + '">' +
    '<div class="stick"><div class="lab">' + esc(p.label) + '</div>' +
    (future ? '' : '<div class="tot">' + bullets(countOf(p)) + '</div>') +
    (future ? '' : rc ? '<div class="ws" hidden>' + esc(rc) + '</div>' : '<div class="ws add" hidden>Summary</div>') +
    '</div></div>';
}

function build() {
  const cal = $('cal');
  const col = (cls, list, kind) => '<div class="col c ' + cls + '">' + list.map(p => blockHTML(p, kind, cls)).join('') + '</div>';
  cal.style.setProperty('--days', T.days.length);
  cal.style.setProperty('--dh', dayHeight + 'px');
  cal.innerHTML =
    '<div class="row heads" id="heads"><div class="agg">' +
      '<div class="c c-m">Months</div><div class="c c-w">Weeks</div></div>' +
      '<div class="c c-d">Days</div></div>' +
    '<div class="row body"><div class="agg">' +
      col('c-m', T.months) + col('c-w', T.weeks) +
    '</div>' + col('c-d', T.dayList, 'd') + '</div>';
  blocks = [...cal.querySelectorAll('.body .agg .blk')].map(el => ({
    el, n: +el.style.getPropertyValue('--n'), state: '', ws: el.querySelector('.ws'), lines: -1,
  }));
  dayCol = cal.querySelector('.body .c-d');
  dayEls = [...dayCol.children];
  const show = shown();
  $('state').textContent = !lineCount ? 'No journal lines' : !show.length ? 'No bullet types selected' : '';
}

/* ── what text fits ──
   Measured rather than guessed, because a theme changes the font and the
   font changes how tall a line is. Runs once per theme, not once per zoom.
   Months and weeks are measured with the zoomed-out styles, a day's lines
   with the zoomed-in ones. */
function measure() {
  const cal = $('cal'), wasNear = cal.classList.contains('near');
  const probe = (parent, cls, html, css) => {
    const b = document.createElement('div');
    b.className = cls;
    b.style.cssText = 'visibility:hidden;' + css;
    b.innerHTML = html;
    parent.appendChild(b);
    const h = b.offsetHeight;
    b.remove();
    return h;
  };
  const hd = '<span class="lab">Wed 30</span><input class="sum" value="Line">';
  const bl = '<span class="tm">12:45pm</span><span class="mk">·</span><span class="tx">Line</span>';
  cal.classList.remove('near');
  M.heads = $('heads').offsetHeight;
  const mcol = cal.querySelector('.body .c-m');
  const agg = html => probe(mcol, 'blk', '<div class="stick">' + html + '</div>', 'top:0;height:auto');
  M.lab = agg('<div class="lab">Jan 2026</div>');
  M.full = agg('<div class="lab">Jan 2026</div><div class="tot">0 bullets</div>');
  M.wsLine = agg('<div class="lab">Jan 2026</div><div class="tot">0 bullets</div><div class="ws" style="--ln:1">Line</div>') - M.full;
  M.small = probe(dayCol, 'hd', hd, 'position:absolute;left:0;top:0');
  cal.classList.add('near');
  M.dayLine = Math.max(probe(dayCol, 'hd', hd, 'position:absolute;left:0;top:0'),
    probe(dayCol, 'bl', bl, 'position:absolute;left:0;top:0'));
  cal.style.setProperty('--line', M.dayLine + 'px');
  cal.classList.toggle('near', wasNear);
}

/* How a day is drawn at this height, and for each month and week block,
   how much of its label, count and summary fits. Only blocks whose answer
   changed are touched. */
function fit() {
  const h = dayHeight, cal = $('cal');
  cal.classList.toggle('near', h >= M.dayLine);
  cal.classList.toggle('small', h < M.dayLine && h >= M.small);
  cal.style.setProperty('--headh', headH() + 'px');
  for (const b of blocks) {
    const px = b.n * h;
    const s = px < M.lab ? 'bare' : px < M.full ? 'lab-only' : '';
    if (s !== b.state) {
      if (b.state) b.el.classList.remove(b.state);
      if (s) b.el.classList.add(s);
      b.state = s;
    }
    if (b.ws) {
      /* Rounded down, so a summary never runs into the block below. */
      const ln = s ? 0 : Math.max(0, Math.floor((px - M.full) / Math.max(1, M.wsLine)));
      if (ln !== b.lines) {
        b.ws.style.setProperty('--ln', ln);
        b.ws.hidden = ln < 1;
        b.lines = ln;
      }
    }
  }
}

/* ══════════════════════ WHERE THINGS ARE ══════════════════════
   Zoomed in, days are different heights, so a position is read off the page
   rather than worked out as (day × dayHeight). All positions are in the
   scroller's own coordinates, so `scrollTop = dayY(i)` puts day i at the
   top edge. */
const sc = $('scroller');
const headH = () => { const h = $('heads'); return h ? h.offsetHeight : 0; };   /* 0 while stepped aside */
const bodyH = () => sc.clientHeight - headH();
const dayY = i => dayCol.offsetTop + dayEls[i].offsetTop;
const dayHt = i => dayEls[i].offsetHeight;
function dateAt(y) {
  let lo = 0, hi = dayEls.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (dayY(mid) <= y) lo = mid; else hi = mid - 1; }
  return { i: lo, f: clamp((y - dayY(lo)) / Math.max(1, dayHt(lo)), 0, 1) };
}
const posOf = (i, f) => dayY(i) + f * dayHt(i);

function applyDH(dh) {
  dayHeight = dh;
  $('cal').style.setProperty('--dh', dh + 'px');
  fit();
}

/* The day height that puts `n` days on the screen. Zoomed out the headings
   take room, so that answer is worked out without them. */
function dhFor(n) {
  const dh = Math.max(MIN_DH, Math.floor(sc.clientHeight / n));
  return dh >= M.dayLine ? dh : Math.max(MIN_DH, Math.floor((sc.clientHeight - M.heads) / n));
}

/* Go to a zoom step, keeping the day at `anchorY` (pixels from the top of the
   scroller) exactly where it was. */
function setLevel(i, anchorY) {
  i = clamp(i, 0, LEVELS.length - 1);
  if (anchorY == null) anchorY = sc.clientHeight / 2;
  const at = dateAt(sc.scrollTop + anchorY);
  level = i;
  applyDH(dhFor(LEVELS[i].n));
  sc.scrollTop = posOf(at.i, at.f) - anchorY;
  syncLevels();
  showYear();
}

/* Put `date` just under the headings, or with `bottom`, its last pixel on
   the bottom edge of the screen. */
function scrollToDate(date, bottom) {
  const i = idx(date);
  sc.scrollTop = bottom ? dayY(i) + dayHt(i) - sc.clientHeight : dayY(i) - headH();
  showYear();
}

/* The opening view: a month, today on the bottom edge. */
function goToday() {
  level = OPEN_LEVEL;
  applyDH(dhFor(LEVELS[level].n));
  syncLevels();
  scrollToDate(TODAY, true);
}

/* Open a box: a day at Day, a week group at Week (or the short end-of-month
   groups at 2 or 3 Days, their own length), a month at Month. Its first day
   goes to the top of the screen. */
function openBox(blk) {
  touched = true;
  const from = blk.dataset.from;
  let i = LV('d1');
  if (blk.closest('.agg')) {
    if (blk.parentNode.classList.contains('c-m')) i = LV('m');
    else {
      const n = +blk.style.getPropertyValue('--n');
      i = n <= 1 ? LV('d1') : n === 2 ? LV('d2') : n === 3 ? LV('d3') : LV('w1');
    }
  }
  level = i;
  applyDH(dhFor(LEVELS[i].n));
  syncLevels();
  scrollToDate(from);
  Mobile.feedback('open');
}

function viewDay() { return T.days[dateAt(sc.scrollTop + headH() + bodyH() / 2).i]; }
/* ADD writes to today, unless a single day is open, when it writes to that
   day. */
const addTarget = () => LEVELS[level].n === 1 ? viewDay() : TODAY;

function viewYear() { return +viewDay().slice(0, 4); }
function showYear() {
  const y = viewYear();
  $('yrLabel').textContent = y;
  $('prevYr').disabled = y <= T.y0;
  $('nextYr').disabled = y >= T.y1;
}
function goYear(n) {
  const y = clamp(viewYear() + n, T.y0, T.y1);
  touched = true;
  scrollToDate(y + '-01-01');
}

/* ── the zoom steps, on screen ──
   The wheel moves through them; this strip says which one you are on and is
   the way to them for somebody who never tries the wheel (DOCTRINE law 6). */
let levelSeg = null, syncing = false;
function drawLevels() {
  const box = $('levels');
  box.innerHTML = '';
  levelSeg = UI.segmented(LEVELS.map(l => ({ id: l.id, name: l.name })), LEVELS[level].id, id => {
    if (syncing) return;
    touched = true;
    setLevel(LV(id));
  });
  box.appendChild(levelSeg);
}
function syncLevels() {
  if (!levelSeg) return;
  syncing = true;
  levelSeg.select(LEVELS[level].id);
  syncing = false;
}

/* ══════════════════════ THE FILTER BAR ══════════════════════ */
function drawBar() {
  const bar = $('bar');
  bar.innerHTML = '';
  /* A list setting keeps the bar's own order, so it reads the same way twice. */
  const setList = (key, all, cur, id, on) => S.set(key, all.filter(v => v === id ? on : cur.indexOf(v) > -1));
  const toggle = (label, on, onChange, sw) => {
    const w = UI.el('span', 'tg');
    const t = UI.toggle(on, onChange);
    t.classList.add('mb-tap');
    t.setAttribute('aria-label', label);
    const l = UI.el('span', 'tl', (sw ? '<span class="sw ' + sw + '"></span>' : '') + esc(label));
    l.onclick = () => t.click();
    w.appendChild(l);
    w.appendChild(t);
    return w;
  };
  const g = UI.el('div', 'grp');
  g.appendChild(UI.el('span', 'k', 'Show'));
  const kinds = NOTE_KINDS.map(k => k.id), lines = GRAPH.map(x => x.id);
  NOTE_KINDS.forEach(k => g.appendChild(toggle(k.plural, shown().indexOf(k.id) > -1,
    on => { setList('show', kinds, shown(), k.id, on); rebuild(); })));
  g.appendChild(UI.el('span', 'sep'));
  GRAPH.forEach(x => g.appendChild(toggle(x.name, graphOn().indexOf(x.id) > -1,
    on => { setList('graph', lines, graphOn(), x.id, on); rebuild(); }, x.id)));
  bar.appendChild(g);
  const g2 = UI.el('div', 'grp');
  g2.appendChild(UI.el('span', 'k', 'Sort'));
  g2.appendChild(UI.segmented(SORTS, sortMode(), v => { S.set('sort', v); rebuild(); }));
  bar.appendChild(g2);
}

/* ══════════════════════ WRITING ══════════════════════
   Every write re-reads the row first and merges into it, never rebuilds it
   from what is on screen. The root brief's many-writers rule. */
let reveal = null;           /* a day to keep on screen after the next redraw */
let heldAt = 0;              /* a hold opens a menu; the click that ends it must not also open a dialog */

/* ── a day's summary ──
   STATUS's `day` row already has a `note` field, one per day, which is
   exactly this, and which nothing else in the suite writes any more. The
   row also carries `rest`, the rest-day flag, so the summary is merged in
   and never replaces the row. */
function saveSummary(d, raw) {
  const v = String(raw || '').trim();
  const cur = Rec.get('day', d, '') || {};
  if ((cur.note || '') === v) return;
  const next = Object.assign({}, cur, { note: v });
  if (!v) delete next.note;
  if (Object.keys(next).length) Rec.set('day', d, '', next);
  else Rec.del('day', d, '');
}

/* ── the summary box, for a day, a week or a month ──
   Opened by clicking a box's name, dates or count. Tom, 2026-09-13. A day's
   summary is STATUS's day note; a week's or month's is a `recap` row. Enter
   saves; an empty box removes it. */
function summaryDialog(blk) {
  const from = blk.dataset.from, to = blk.dataset.to || from;
  if (from > TODAY) { UI.toast('Tomorrow isn’t here yet'); return; }
  const kind = !blk.closest('.agg') ? 'day' : recapKind(blk.parentNode.classList.contains('c-m') ? 'c-m' : 'c-w');
  const month = MONTHS[+from.slice(5, 7) - 1] + ' ' + from.slice(0, 4);
  const title = (kind === 'day' ? Day.label(from, { weekday: 'short' }) + ' ' + +from.slice(8) + ' ' + month
    : kind === 'month' ? month
    : +from.slice(8) + (from === to ? '' : '–' + +to.slice(8)) + ' ' + month).toUpperCase();
  const current = kind === 'day' ? ((Rec.get('day', from, '') || {}).note || '') : recapOf(kind, from);
  let ta = null;
  const save = h => {
    const v = ta.value.trim();
    if (kind === 'day') saveSummary(from, v);
    else {
      const cur = Rec.get('recap', from, kind);
      if (v) Rec.set('recap', from, kind, Object.assign({}, cur || {}, { text: v }));
      else if (cur) Rec.del('recap', from, kind);
    }
    Mobile.feedback('success');
    h.close();
  };
  UI.dialog({
    title: title, width: 460,
    body: (b, h) => {
      ta = UI.field('note', { rows: kind === 'day' ? 2 : 4, value: current });
      ta.onkeydown = e => {
        if (e.key !== 'Enter' || e.shiftKey || e.altKey || e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        save(h);
      };
      b.appendChild(ta);
      UI.focusSoon(ta);
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: h => { save(h); return false; } },
    ],
  });
}

function noteDialog(x, d) {
  const isNew = !x.key;
  if (isNew && !Day.editable(d)) { UI.toast('Tomorrow isn’t here yet'); return; }
  let kind = x.kind || S.get('kind', 'entry');
  let ta = null;
  const title = (isNew ? 'ADD · ' : 'EDIT · ') +
    Day.label(isNew ? d : x.date, { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();

  const commit = (h, again) => {
    const raw = ta.value.trim();
    if (!raw) { UI.toast('Nothing to save', { bad: true }); return; }
    const pz = parseLine(raw);
    let own = d;
    if (isNew) {
      const list = Rec.all('note', { date: d });
      /* STATUS's addNote, field for field. */
      Rec.set('note', d, uid(), {
        kind: kind, text: pz.text, t: Date.now(), made: d,
        at: pz.at, dur: pz.dur,
        ord: list.length, done: 0, cancelled: 0,
      });
      reveal = d;
    } else {
      own = x.date;
      const cur = Rec.get('note', own, x.key);
      if (!cur) { UI.toast('That line is gone', { bad: true }); h.close(); return; }
      Rec.set('note', own, x.key, Object.assign({}, cur, {
        kind: kind, text: pz.text, at: pz.at, dur: pz.dur,
        by: kind === 'todo' ? (cur.by || null) : null,
      }));
      reveal = x.day;
    }
    S.set('kind', kind);
    publishNotes(own);
    Mobile.feedback(again ? 'tick' : 'success');
    if (again) { ta.value = ''; UI.focusSoon(ta, true); }
    else h.close();
  };

  UI.dialog({
    title: title, width: 460,
    body: (b, h) => {
      b.appendChild(UI.segmented(NOTE_KINDS.map(k => ({ id: k.id, name: k.label })), kind, v => { kind = v; }));
      /* The time goes back in the words the way it would have been typed,
         so saving without touching it keeps it. */
      const p = x.p || {};
      ta = UI.field('note', { rows: 2, value: isNew ? '' :
        String(p.text || '') + (p.at ? ' ' + clockLabel(p.at) : '') + (p.dur ? ' ' + durLabel(p.dur) : '') });
      ta.style.marginTop = 'var(--s-3)';
      /* A bullet is one line: Enter adds it and leaves the box open for the
         next, Enter on an empty box closes, Shift+Enter is a new line. */
      ta.onkeydown = e => {
        if (e.key !== 'Enter' || e.shiftKey || e.altKey) return;
        if (e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        if (!ta.value.trim()) { h.close(); return; }
        commit(h, isNew);
      };
      b.appendChild(ta);
      UI.focusSoon(ta);
    },
    actions: [
      { label: 'CANCEL' },
      { label: isNew ? 'ADD' : 'SAVE', kind: 'go', fn: h => { commit(h, false); return false; } },
    ],
  });
}

/* Tick or untick, STATUS's box, field for field. Ticked here and now, so it
   is done today, whichever day it was written on. */
function tick(x) {
  const cur = Rec.get('note', x.date, x.key);
  if (!cur) return;
  const now = new Date(), was = !!cur.done;
  const stamp = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  Rec.set('note', x.date, x.key, Object.assign({}, cur, {
    done: was ? 0 : 1,
    by: was ? (cur.byWas || null) : stamp,
    byWas: was ? null : (cur.byAuto ? (cur.byWas || null) : (cur.by || null)),
    byAuto: was ? 0 : 1,
    doneAt: was ? null : stamp,
    doneOn: was ? null : TODAY,
  }));
  reveal = was ? x.date : TODAY;
  Mobile.feedback(was ? 'untick' : 'tick');
  publishNotes(x.date);
}

function removeLine(x) {
  const keep = Rec.get('note', x.date, x.key);
  if (!keep) return;
  Rec.del('note', x.date, x.key);
  publishNotes(x.date);
  Mobile.haptic('warn');
  UI.undo('Removed <b>' + esc(keep.text || '') + '</b>', () => { Rec.set('note', x.date, x.key, keep); publishNotes(x.date); });
}

const bulletOf = el => byKey.get(el.dataset.d + '|' + el.dataset.k);

/* Click. The name, dates, count or written summary of any box opens its
   summary; a todo's box ticks; a bullet edits; anywhere else on a box opens
   it. The day summary line is left alone to be typed in. */
$('cal').addEventListener('click', e => {
  if (Date.now() - heldAt < 800) return;
  if (e.target.closest('.sum')) return;
  const box = e.target.closest('.bx');
  if (box) { const x = bulletOf(box.closest('.bl')); if (x) tick(x); return; }
  const blk = e.target.closest('.blk');
  if (!blk) return;
  if (e.target.closest('.lab, .tot, .ws')) { summaryDialog(blk); return; }
  const bl = e.target.closest('.bl');
  if (bl) { const x = bulletOf(bl); if (x) noteDialog(x, x.day); return; }
  openBox(blk);
});

/* The day summary saves when Enter is pressed and whenever the box is left;
   Escape puts back what was there. Saved directly rather than on the
   browser's change event, which only fires for some kinds of edit: watched
   2026-09-13, an Enter that did not save. saveSummary does nothing when the
   text is what is already stored, so saving twice is harmless. */
const leaveSummary = inp => {
  saveSummary(inp.dataset.d, inp.value);
  /* A redraw replaces every box on the page, so one that arrived mid-sentence
     waited; this is where it stops waiting. */
  if (pendingRebuild) { pendingRebuild = false; soon(); }
};
$('cal').addEventListener('keydown', e => {
  if (!e.target.classList.contains('sum')) return;
  if (e.key === 'Enter') { e.preventDefault(); leaveSummary(e.target); e.target.blur(); }
  else if (e.key === 'Escape') { e.target.value = e.target.defaultValue; e.target.blur(); }
});
$('cal').addEventListener('focusout', e => {
  if (e.target.classList.contains('sum')) leaveSummary(e.target);
});

/* Right click with a mouse, hold with a finger: the same menu, and only
   ever a shortcut to what a click already does (DOCTRINE law 14). */
Mobile.hold($('cal'), e => {
  heldAt = Date.now();
  const blk = e.target.closest('.blk');
  if (!blk) return;
  const bl = e.target.closest('.bl');
  if (bl && $('cal').classList.contains('near')) {
    const x = bulletOf(bl);
    if (!x) return;
    UI.menu(e.clientX, e.clientY, [
      { label: 'Edit', fn: () => noteDialog(x, x.day) },
      x.kind === 'todo' ? { label: x.p.done ? 'Untick' : 'Tick', fn: () => tick(x) } : null,
      '-',
      { label: 'Delete', kind: 'bad', fn: () => removeLine(x) },
    ].filter(Boolean), { title: x.p.text || '' });
    return;
  }
  const d = blk.dataset.from, isDay = !blk.closest('.agg');
  const items = [{ label: 'Open', fn: () => openBox(blk) }];
  if (d <= TODAY) items.push({ label: 'Write summary', fn: () => summaryDialog(blk) });
  if (isDay && Day.editable(d)) items.push({ label: 'Add a bullet', fn: () => noteDialog({}, d) });
  const lab = blk.querySelector('.lab');
  UI.menu(e.clientX, e.clientY, items, { title: lab ? lab.textContent : Day.label(d) });
}, { skip: '.sum,.bx' });

/* ══════════════════════ MOVING AROUND ══════════════════════ */

/* One zoom step per wheel notch, toward the pointer. A trackpad sends many
   small movements and a long glide after them, so the small ones add up to
   a notch's worth, and a short pause after each step keeps one flick from
   racing straight to Quarter. */
let wheelAcc = 0, wheelAt = 0;
sc.addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  e.preventDefault();
  touched = true;
  const now = Date.now();
  if (now - wheelAt < 180) { wheelAcc = 0; return; }
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16;                   /* lines, on some mice */
  else if (e.deltaMode === 2) dy *= sc.clientHeight; /* pages */
  wheelAcc += dy;
  if (Math.abs(wheelAcc) < 50) return;
  const step = wheelAcc > 0 ? 1 : -1;
  wheelAcc = 0; wheelAt = now;
  setLevel(level + step, e.clientY - sc.getBoundingClientRect().top);
}, { passive: false });

let drag = null, swallowClick = false;
sc.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  if (e.target.closest('button,input,select,textarea,a')) return;
  drag = { x: e.clientX, y: e.clientY, top: sc.scrollTop, left: sc.scrollLeft, moved: false };
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 4) return;
    drag.moved = true; touched = true;
    sc.classList.add('dragging');
  }
  sc.scrollTop = drag.top - dy;
  sc.scrollLeft = drag.left - dx;
});
const endDrag = () => {
  if (drag && drag.moved) { swallowClick = true; setTimeout(() => { swallowClick = false; }, 0); }
  drag = null;
  sc.classList.remove('dragging');
};
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
sc.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);
sc.addEventListener('scroll', showYear, { passive: true });

/* ── start, and keep up ──
   Paint what localStorage already has; redraw when the store's slower half
   lands and whenever anything changes anywhere, STATUS included. A redraw
   keeps the date at the top of the screen where it was, and then makes sure
   a day just written to is on screen. */
function rebuild() {
  let keep = null;
  if (T && touched) { const a = dateAt(sc.scrollTop + headH()); keep = { date: T.days[a.i], f: a.f }; }
  indexJournal();
  indexGraph();
  T = buildTimeline(firstYear(), THIS_YEAR);
  build();
  fit();
  if (!touched) goToday();
  else if (keep) sc.scrollTop = posOf(idx(keep.date), keep.f) - headH();
  if (reveal) {
    const i = idx(reveal), top = dayY(i), bot = top + dayHt(i);
    reveal = null;
    if (bot > sc.scrollTop + sc.clientHeight) sc.scrollTop = bot - sc.clientHeight;
    if (top < sc.scrollTop + headH()) sc.scrollTop = top - headH();
  }
  showYear();
}
let rebuildT = null, pendingRebuild = false;
const typing = () => { const a = document.activeElement; return !!(a && a.classList && a.classList.contains('sum')); };
const soon = () => {
  clearTimeout(rebuildT);
  rebuildT = setTimeout(() => { if (typing()) { pendingRebuild = true; return; } rebuild(); }, 60);
};

indexJournal();
indexGraph();
T = buildTimeline(firstYear(), THIS_YEAR);
build();
drawBar();
drawLevels();
measure();
fit();
goToday();
Rec.ready(soon);
Rec.on(soon);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); fit(); if (!touched) goToday(); else setLevel(level); });
/* The screen changes height after the first paint (the theme and icons land,
   the header can wrap) and whenever the window is resized. A zoom step is a
   number of days on the screen, so the day height follows the screen. */
if (window.ResizeObserver) new ResizeObserver(() => { if (!touched) goToday(); else setLevel(level); }).observe(sc);
</script>
</body>
</html>
