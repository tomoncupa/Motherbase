<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mb-version" content="1.0.16, 2026-09-23">

<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="../shared/skins.js"></script>
<script src="../shared/day.js"></script>
<script src="../shared/records.js"></script>
<script src="../shared/journal.js"></script>
<script src="../shared/measure.js"></script>
<script src="../shared/mobile.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/chart.js"></script>
<script src="../shared/io.js"></script>
<script src="../shared/health.js"></script>
<script src="../shared/icons.js"></script>

<style>
/* Colours and sizes are tokens, never numbers. shared/THEMING.md is the
   contract this app obeys. The raw pixel values are geometry the script
   measures and hands over (--dh pixels per day, --sh the screen, --datew the
   widest date, block tops and column widths): measurements, not spacing
   decisions. The stroke widths and opacities on the day graph are chart
   values of the kind STATUS's own charts carry. `ch` widths are lengths of
   text, which is what they measure.

   A desktop app, read sitting down. Text size is a setting; --tb (bullets and
   written lines), --td (dates), --ts (small print) and --tl (block names) are
   each set to one of the type tokens by it. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--tb, var(--f-4));font-weight:var(--w-body);
  font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
body.resizing,body.resizing *{cursor:col-resize !important;user-select:none}
body.moving,body.moving *{cursor:grabbing !important;user-select:none}

/* Wraps rather than pushing buttons off the edge in a narrow window. */
header{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);position:relative;z-index:5}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-6);letter-spacing:.18em}
.logo b{color:var(--accent)}
/* Below this width the header's controls need the logo's room to stay on one
   row; the browser tab already says LOG. Measured at 1280 wide, 2026-09-14. */
@media (max-width: 1359px){ .logo{display:none} }
.spacer{flex:1}
.yr{display:flex;align-items:center;gap:var(--s-1)}
.yr b{font-family:var(--font-display);font-size:var(--f-4);font-weight:var(--w-bold);
  min-width:calc(var(--s-10) * 1.5);text-align:center;white-space:nowrap}
.yr button:disabled{opacity:.35;cursor:default}
.quiet{font-size:var(--f-2);color:var(--text-muted)}
.quiet:empty{display:none}

/* ── the filters ──
   Which bullets show and how they sit. Tom, 2026-09-14, asking for a
   prettier screen, picked "filters into one button": the switches that were
   a second header row drop from a filter icon beside ADD. A dot on the icon
   says some kinds are hidden, so a filtered page never passes for a quiet
   one. */
#filterBtn{position:relative}
#filterBtn.on::after{content:'';position:absolute;top:var(--s-1);right:var(--s-1);width:var(--s-2);height:var(--s-2);
  border-radius:var(--radius-full);background:var(--accent)}
.bar{position:absolute;top:100%;left:0;z-index:20;margin-top:var(--s-2);display:flex;flex-direction:column;align-items:flex-start;
  gap:var(--s-4);padding:var(--s-4);background:var(--surface-3);border-radius:var(--radius-md);box-shadow:var(--e-3),var(--rim)}
.bar[hidden]{display:none}
.bar .grp{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-4)}
.bar .k{font-size:var(--f-2);color:var(--text-muted);min-width:var(--s-9)}
.tg{display:inline-flex;align-items:center;gap:var(--s-2)}
.tg .tl{font-size:var(--f-3);color:var(--text-2);cursor:pointer;user-select:none;white-space:nowrap}
/* A row of switches inside a Settings row. */
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-4);max-width:calc(var(--s-10) * 3)}
.opts .k{font-size:var(--f-2);color:var(--text-muted);min-width:var(--s-9)}
.opts .line{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-4);flex-basis:100%}
/* The swatch is the legend: each graph switch wears its line's colour, next
   to the word, so the colour is never the only way to tell them apart. */
.sw{display:inline-block;width:var(--s-4);height:var(--s-1);border-radius:var(--radius-full);
  margin-right:var(--s-2);vertical-align:middle}
.sw.mood,.gr i.mood{background:var(--data-1)}
.sw.energy,.gr i.energy{background:var(--data-3)}
.sw.caffeine,.gr i.caffeine{background:var(--data-6)}

/* The only scrolling surface. The wheel scrolls it, a held button drags it,
   the side mouse buttons change the view. position:relative makes it what
   every offsetTop is measured from. */
main{flex:1;min-height:0;overflow:auto;overflow-anchor:none;position:relative;
  padding-bottom:var(--safe-b);cursor:grab}
main.dragging{cursor:grabbing;user-select:none}

/* ══════════ THE TIMELINE ══════════
   Side columns for the units bigger than the view, then the day columns:
   the days themselves, what got done, mood and energy, in his order. A side
   block is placed by measuring where its first and last day actually are;
   the day columns are cells of one row, so they always share its height. */
.cal{min-width:100%;width:max-content}
.row{display:flex}
/* No grid. Tom, 2026-09-14, picked "no grid lines": columns are told apart
   by space and surface, and a line is drawn only where a month begins. */
.agg{display:flex;position:sticky;left:0;z-index:2;background:var(--bg);margin-right:var(--s-3)}
.c-y{width:var(--w-y, var(--s-10))}
.c-q{width:var(--w-q, var(--s-10))}
.c-m{width:var(--w-m, clamp(var(--s-10), 14vw, calc(var(--s-10) * 2)))}
.c-w{width:var(--w-w, clamp(var(--s-10), 14vw, calc(var(--s-10) * 2)))}
/* A day column's width comes from its own --w-<key> once dragged, else its
   starting width; the script hands both over as --cw. */
.heads .c.cx,.xt,.xn{width:var(--cw, var(--s-9))}

/* Headings are small print: they name columns, they are not the content. A
   column's edge shows only while the pointer is over the headings, which is
   when he might resize one. */
.heads{position:sticky;top:0;z-index:3;background:var(--surface-1);
  box-shadow:0 var(--border-width) 0 var(--border)}
.heads .agg{z-index:4;background:var(--surface-1)}
.heads .c{position:relative;flex:0 0 auto;min-width:0;padding:var(--s-2) var(--s-3);font-family:var(--font-body);font-size:var(--f-2);
  font-weight:var(--w-body);color:var(--text-muted);
  border-right:var(--border-width) solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover) and (pointer:fine){ .heads:hover .c{border-right-color:var(--border)} }
.heads .c.c-d{flex:1 1 auto;min-width:calc(var(--s-10) * 2)}
/* A day column's heading drags sideways to rearrange. */
.heads .c[data-x]{cursor:grab}
.heads .c.lift{opacity:.4}
.heads .c.drop-l::before,.heads .c.drop-r::after{content:'';position:absolute;top:0;bottom:0;width:var(--s-1);background:var(--accent)}
.heads .c.drop-l::before{left:0}
.heads .c.drop-r::after{right:0}
.ghost{position:fixed;z-index:50;pointer-events:none;padding:var(--s-2) var(--s-3);background:var(--surface-3);
  color:var(--text-1);border:var(--border-width) solid var(--accent);border-radius:var(--radius-sm);box-shadow:var(--e-3);
  font-family:var(--font-display);font-size:var(--f-2);font-weight:var(--w-bold);letter-spacing:var(--track-cap);white-space:nowrap}
/* The drag handle on a column heading's right edge, as in Sheets. A
   double-click puts the width back. */
.rz{position:absolute;top:0;bottom:0;right:0;width:var(--s-2);cursor:col-resize;z-index:5}
.rz:hover,body.resizing .rz.on{background:var(--accent);opacity:.6}

.col{position:relative;flex:0 0 auto}
.col.c-d{flex:1 1 auto;background:var(--bg)}

/* ── a week, month, quarter or year block ──
   Neighbours alternate between two surfaces, bigger units take the stronger
   line, and name, count and writing each start at the same left edge. */
.blk{position:absolute;left:0;right:0;top:0;background:var(--surface-1);
  padding:var(--s-2) var(--s-3) 0;line-height:var(--lh-tight);cursor:pointer}
.col .blk:nth-child(even){background:var(--surface-2)}
.c-y .blk,.c-q .blk,.blk.m0,.blk.y0{box-shadow:inset 0 var(--border-width) 0 var(--border-strong)}
.stick{position:sticky;top:calc(var(--headh) + var(--s-2))}
.blk .lab{display:block;font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--tl, var(--f-4));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .tot{display:block;margin-top:var(--s-1);font-size:var(--ts, var(--f-2));color:var(--text-muted);white-space:nowrap}
.blk.zero .tot{opacity:.6}
.blk.bare{padding:0}
.blk.bare .stick,.blk.lab-only .tot{display:none}
.ws{margin-top:var(--s-2);font-size:var(--ts, var(--f-2));line-height:var(--lh-tight);color:var(--text-1);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--ln);overflow:hidden;
  overflow-wrap:anywhere}
.ws[hidden]{display:none}
/* The name opens the period; it underlines under the pointer. */
.blk .lab:hover,.hd .lab:hover{text-decoration:underline}

/* ══════════ A DAY ══════════
   A month heading where a month begins, then one row of cells. The day
   cell is a heading band (the date and the day's line) with bullets below;
   the other cells are what got done, and the day's average mood and energy. */
.day{position:relative;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.day.m0{border-top:var(--border-width) solid var(--border-strong)}
/* In the rows of Month, Quarter and Year every other week group sits on a
   soft surface, so weeks read as groups with no lines; zoomed in, each
   day's own heading band does that job. */
.cal:not(.near) .day.alt{background:var(--surface-1)}
/* Today: a bar of the accent down its left edge, over whatever is there. */
.day.today::before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--s-1);background:var(--accent);z-index:3;pointer-events:none}
.cal:not(.near) .day.today{background:var(--surface-2)}
.drow{display:flex;flex:1 1 auto;min-height:0}
.xc{position:relative;flex:0 0 auto;min-width:0}
.xd{flex:1 1 auto;display:flex;flex-direction:column;min-width:calc(var(--s-10) * 2)}
.day>.mo,.xd>.hd,.xd>.bw,.xl{display:none}

/* Zoomed out: a day is exactly its share of the screen. */
.cal:not(.near) .day{height:var(--dh)}
.cal.tiny .day{border-top-width:0}
.cal.small:not(.near) .xd>.hd{display:grid}
.cal:not(.near):not(.small) .xt>*,.cal:not(.near):not(.small) .xn>*{display:none}

/* Zoomed in, and always in the notebook: a day grows to fit, so it never
   has to be opened to be read. */
.cal.near .day{min-height:var(--dh)}
.cal.near .xd>.hd{display:grid}
.cal.near .xd>.bw{display:flex}
.cal.near .day>.mo{display:block}

.mo{padding:var(--s-4) var(--s-4) var(--s-2);background:var(--bg);font-family:var(--font-display);
  font-weight:var(--w-bold);font-size:var(--tl, var(--f-4));letter-spacing:var(--track-cap);color:var(--text-2)}

/* The date takes the width of the widest date, measured, so every day's
   line starts at the same place. */
.hd{grid-template-columns:var(--datew, var(--s-9)) minmax(0,1fr);column-gap:var(--s-4);align-items:baseline;
  min-width:0;padding:var(--s-2) var(--s-4);background:var(--surface-1)}
/* The date is quieter than the line he wrote beside it: the same size, a
   softer colour. Tom, 2026-09-14, picked "today and your line stand out". */
.hd .lab{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--tb, var(--f-4));
  white-space:nowrap;letter-spacing:var(--track-tight);color:var(--text-2)}
.day.today .hd{background:var(--surface-3)}
.day.today .hd .lab{color:var(--accent)}
.cal.small:not(.near) .xd>.hd{grid-template-columns:var(--datews, var(--s-8)) minmax(0,1fr);
  height:100%;align-items:center;padding:0 var(--s-3);background:none;line-height:1}
.cal.small:not(.near) .xd>.hd .lab{font-family:var(--font-body);font-size:var(--ts, var(--f-2))}
.cal.small:not(.near) .xd>.hd .sum{font-size:var(--ts, var(--f-2));line-height:1}

/* The day's line, beside the date. Looks like text until pointed at. */
.sum{min-width:0;max-width:80ch;width:100%;font:inherit;font-size:var(--tb, var(--f-4));
  line-height:var(--lh-tight);color:var(--text-1);background:none;border:0;border-radius:0;
  border-bottom:var(--border-width) solid transparent;padding:0;cursor:text}
.sum:hover{border-bottom-color:var(--border)}
.sum:focus{outline:none;border-bottom-color:var(--accent)}

/* ── bullets, below the band ── */
.bw{position:relative;flex:1 1 auto;flex-direction:column;min-height:0}
.bls{position:relative;z-index:1;display:flex;flex-direction:column;gap:var(--s-1);
  padding:var(--s-2) var(--s-4) var(--s-3) var(--s-6);max-width:90ch}
.bls:empty{padding:0}
.bl{display:flex;align-items:baseline;gap:var(--s-3);min-width:0;
  font-size:var(--tb, var(--f-4));line-height:var(--lh-tight);cursor:pointer}
/* The mark, the words and the time are shared/journal.js, drawn the way
   STATUS draws them (Tom, 2026-09-14). LOG keeps the line to one row. */
.bl .k{align-self:center}
.bl .tx{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── what got done ──
   Tom, 2026-09-13: a column for "What got done today", functionally
   different from the day's line. A box of its own, as many lines as it
   needs; the day grows with it. Zoomed out, its first line. */
.cell{display:block;width:100%;height:100%;min-height:100%;field-sizing:content;resize:none;
  border:0;border-radius:0;background:none;color:var(--text-1);font:inherit;font-size:var(--tb, var(--f-4));
  line-height:var(--lh-tight);padding:var(--s-2) var(--s-3);cursor:text}
.cell:focus{outline:var(--border-width) solid var(--accent);outline-offset:calc(var(--border-width) * -1)}
.cal.small:not(.near) .cell{font-size:var(--ts, var(--f-2));line-height:1;padding:0 var(--s-3);
  white-space:pre;overflow:hidden;display:flex;align-items:center}

/* ── the day's average mood and energy ── */
.xn{display:flex;justify-content:flex-end;align-items:flex-start}
.xv{padding:var(--s-2) var(--s-3);font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--tb, var(--f-4))}
.xn.f-mood .xv{color:var(--data-1)}
.xn.f-energy .xv{color:var(--data-3)}
.xv .xu{margin-left:var(--s-1);font-family:var(--font-body);font-weight:var(--w-body);font-size:var(--ts, var(--f-2));color:var(--text-muted)}
.cal.small:not(.near) .xn{align-items:center}
.cal.small:not(.near) .xv{padding:0 var(--s-3);font-size:var(--ts, var(--f-2))}

/* ── the day graph ── */
.gr{position:absolute;top:0;bottom:0;left:var(--s-4);right:var(--s-4);pointer-events:none;z-index:0}
.gr svg{position:absolute;left:0;top:0;width:100%;height:100%}
.gr path{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke}
.gr path.mood{stroke:var(--data-1);opacity:.22}
.gr path.energy{stroke:var(--data-3);opacity:.22}
.gr path.caffeine{stroke:var(--data-6);stroke-dasharray:3 3;opacity:.5}
.gr i{position:absolute;width:var(--s-2);height:var(--s-2);margin:calc(var(--s-1) * -1) 0 0 calc(var(--s-1) * -1);
  border-radius:var(--radius-full);pointer-events:auto;cursor:default}
.gr i.mood,.gr i.energy{opacity:.35}
.gr i.caffeine{opacity:.8}

/* ══════════ THE NOTEBOOK ══════════
   Tom, 2026-09-14: "Scrolling down - If something leaves the upper right
   area it shows up in the lower left again." One stream of days, read down
   the left page and on down the right. Both pages hold the same stream and
   stay on screen; the script slides the left one by the scroll and the right
   one by the scroll plus a page, so the stream wraps from one to the other.
   `clip`, not `hidden`, so focusing a box on a page cannot scroll the page
   itself. The pad under the pages is what gives the scroller its length.
   There are no column headings on a page, so a day's other cells sit under
   its bullets, each with its name. */
.cal.book{width:100%}
.pages{position:sticky;top:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:var(--sh)}
.page{position:relative;min-width:0;overflow:clip}
.page+.page{border-left:calc(var(--border-width) * 2) solid var(--border-strong)}
.flow{position:absolute;left:0;right:0;top:0}
.cal.book .drow{flex-direction:column}
.cal.book .xc{border-right:0}
.cal.book .xt,.cal.book .xn{width:auto}
.cal.book .xl{display:block;padding:var(--s-2) var(--s-4) 0;font-size:var(--ts, var(--f-2));color:var(--text-muted)}
.cal.book .xn{justify-content:space-between;align-items:baseline}
.cal.book .xn.empty{display:none}
.cal.book .cell{padding:var(--s-1) var(--s-4) var(--s-2)}

/* ══════════ LIST ══════════
   Tom, 2026-09-22: the days listed on the left, one day open on the right.
   The list is one screen tall and scrolls by itself; the day on the right
   is Day's own drawing and scrolls with the page. */
.cal.list{display:flex;align-items:flex-start;width:100%}
.dlist{position:sticky;top:0;left:0;z-index:4;flex:0 0 auto;display:flex;flex-direction:column;
  width:calc(var(--s-10) * 2.5);height:var(--sh);overflow-y:auto;background:var(--surface-1);box-shadow:var(--rim)}
.lday{flex:1 1 auto;min-width:0}
.lrow{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--s-3);align-items:baseline;
  width:100%;min-height:var(--tap);padding:var(--s-2) var(--s-4);border:0;border-radius:0;background:none;
  color:var(--text-1);font:inherit;text-align:left;cursor:pointer}
.lrow:hover{background:var(--surface-2)}
.lrow.m0{border-top:var(--border-width) solid var(--border-strong)}
.lrow.on{background:var(--surface-3);box-shadow:inset var(--s-1) 0 0 var(--accent)}
.lrow .ln{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--tb, var(--f-4));color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.today .ln,.lrow.on .ln{color:var(--accent)}
.lrow .lc{font-size:var(--ts, var(--f-2));color:var(--text-muted)}
.lrow .lc.zero{opacity:.6}
.lrow .lt{grid-column:1 / -1;margin-top:var(--s-1);font-size:var(--ts, var(--f-2));line-height:var(--lh-tight);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#probe{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;width:calc(var(--s-10) * 2)}
#probe .blk{position:static}
</style>
</head>
<body>
<header>
  <div class="logo">LO<b>G</b></div>
  <div class="yr">
    <button id="prevBtn" class="mb-btn mb-press mb-tap" onclick="goStep(-1)" aria-label="Back" data-icon="prev"></button>
    <b id="focusLabel"></b>
    <button id="nextBtn" class="mb-btn mb-press mb-tap" onclick="goStep(1)" aria-label="Forward" data-icon="next"></button>
  </div>
  <button class="mb-btn mb-press mb-tap" onclick="toToday()">TODAY</button>
  <div id="levels"></div>
  <button id="filterBtn" class="mb-btn mb-press mb-tap" aria-label="Filters" aria-expanded="false" data-icon="filter"></button>
  <button class="mb-btn go mb-press mb-tap" onclick="noteDialog({}, addTarget())">ADD</button>
  <span class="quiet" id="state"></span>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" onclick="openSettings()" aria-label="Settings" title="Settings" data-icon="settings"></button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
  <div class="bar" id="bar" hidden></div>
</header>
<main id="scroller" class="mb-scroll"><div class="cal" id="cal"></div></main>
<div id="probe" aria-hidden="true"></div>

<script>
/* ═══════════════════════════════ LOG ═══════════════════════════════
   The journal module. The last few weeks of bullets, set inside the year
   around them. See log/CLAUDE.md for what it is for and why each decision
   was made.

   A bullet is a `note` row and a day's line is the `note` field of the `day`
   row, both STATUS's shapes, so a line written here or there is the same
   line in both. Mood, energy, caffeine, weight and sleep are read from
   STATUS and never written. LOG owns two types: `recap`, what he wrote about
   a week group, month, quarter or year, and `cell`, one day's entry in one
   of his text columns.                                                    */

const APP = {
  id: 'log',
  name: 'Log',
  icon: '▤',
  blurb: 'the journal, the last few weeks at a glance',
  /* `recap` and `cell` are LOG's own. `note` and `day` are STATUS's shapes;
     LOG writes them by merging into what is there, under the root brief's
     many-writers rule. */

const NOTE_KINDS = Journal.KINDS;

/* ══════════════════════ WHAT SHOWS, AND ON WHICH DAY ══════════════════════
   The day rules are STATUS's: an entry, event or idea is on the day it is
   written on; a finished todo is on the day it was ticked; an open todo is
   on the day it was written, with a box to tick, and not counted. `para` is
   the old name for an entry. Cancelled lines show nowhere. */
const shown = () => { const v = S.get('show', null); return Array.isArray(v) ? v : NOTE_KINDS.map(k => k.id); };
const sortMode = () => S.get('sort', 'time');
const SORTS = [{ id: 'time', name: 'By time' }, { id: 'manual', name: 'As arranged' }, { id: 'newest', name: 'Latest first' }];

let byDay = new Map();
let byKey = new Map();
let firstMin = new Map();
let lineCount = 0;

/* Time order is the start, the same as STATUS: Journal.sortClock. */
function sortClock(p) { return Journal.sortClock(p); }

function indexJournal() {
  byDay = new Map(); byKey = new Map(); firstMin = new Map(); lineCount = 0;
  const show = shown();
  Rec.all('note', {}).forEach(r => {
    const p = r.payload;
    if (!p) return;
    const kind = p.kind === 'para' ? 'entry' : p.kind;
    if (!MARK[kind]) return;
    lineCount++;
    /* A cancelled todo shows faded and is not counted, the way STATUS shows
       it. An open todo with a due date sits on its due day, so Move to
       tomorrow moves it here too. (Tom, 2026-09-14: no differences.) */
    const open = kind === 'todo' && !p.done && !p.cancelled;
    /* `due: ''` is QUESTS's No date: shown nowhere until done, as in STATUS */
    if (open && p.due === '') return;
    const day = kind === 'todo' && p.done ? (p.doneOn || r.date) : (open && p.due ? p.due : r.date);
    if (!day || !DATE_OK.test(day)) return;
    const c = sortClock(p);
    if (c !== 9999) {
      const m = Math.floor(c / 100) * 60 + c % 100;
      if (!firstMin.has(day) || m < firstMin.get(day)) firstMin.set(day, m);
    }
    if (show.indexOf(kind) < 0) return;
    const x = { key: r.key, date: r.date, day, kind, open, p };
    byKey.set(r.date + '|' + r.key, x);
    if (!byDay.has(day)) byDay.set(day, []);
    byDay.get(day).push(x);
    /* A todo moved to another day still shows on the days it was moved from,
       as > at the bottom, the way STATUS shows it (Tom, 2026-09-14). The
       spans are `moved`, written by Journal.moveToTomorrow. */
    if (kind === 'todo' && Array.isArray(p.moved)) p.moved.forEach(m => {
      if (!m || !DATE_OK.test(m.from || '') || !DATE_OK.test(m.to || '')) return;
      /* every day it touched and was not done on, from the day it sat on to
         the day it was moved from; never the days it skipped after the move
         (Tom, 2026-09-14) */
      for (let dd = m.from, n = 0; dd <= m.to && n < 400; dd = Day.shift(dd, 1), n++) {
        if (dd === day || (p.due && dd >= p.due) || (p.done && p.doneOn === dd)) continue;
        if (!byDay.has(dd)) byDay.set(dd, []);
        if (byDay.get(dd).some(y => y.key === r.key && y.movedAway)) continue;
        byDay.get(dd).push({ key: r.key, date: r.date, day: dd, kind, open: false, p, movedAway: true });
      }
    });
  });
  const mode = sortMode();
  const cmp = (a, b) => {
    if (!!a.movedAway !== !!b.movedAway) return a.movedAway ? 1 : -1;
    if (a.open !== b.open) return a.open ? -1 : 1;
    if (mode === 'manual') return (a.p.ord || 0) - (b.p.ord || 0) || (a.p.t || 0) - (b.p.t || 0);

}
const counted = d => (byDay.get(d) || []).filter(x => !x.open && !x.p.cancelled && !x.movedAway).length;

/* ══════════════════════ THE DAY GRAPH ══════════════════════

   sleep entry or bullet that day, the right edge midnight. Mood and energy

const graphOn = () => { const v = S.get('graph', null); return Array.isArray(v) ? v : ['mood', 'energy', 'caffeine']; };
const GRAPH = [{ id: 'mood', name: 'Mood' }, { id: 'energy', name: 'Energy' }, { id: 'caffeine', name: 'Caffeine' }];
/* 400mg a day is the ceiling the US FDA and the EU's food safety authority

let G = null;
function indexGraph() {
  const F = Rec.map('field');

    : Object.values(F).find(f => f && f.from === 'caff' && +f.half > 0) || null;

/* A day's figure for a column, as STATUS shows it on its tile. A measure is

   then the last reading, the average or the total, as the field says. A

const r1 = v => String(Math.round(v * 10) / 10);
const money = v => Math.round(v).toLocaleString();
function xValue(def, d) {

    return s ? Math.round(s).toLocaleString() : '';

  if (def.kind === 'spend') {

    return s ? money(s) : '';

  const v = Measure.dayValue(f, e);

}

function dayStart(d) {
  let s = firstMin.has(d) ? firstMin.get(d) : null;
  ['weight', 'sleep'].forEach(id => evList(d, id).forEach(e => {
    const m = minuteOf(e.t);
    if (s == null || m < s) s = m;

  return s == null ? 0 : Math.min(s, 1440 - MIN_SPAN);

function cafDoses(date) {
  const f = G.caf, per = f.per == null ? 1 : f.per;
  const out = evList(date, f.id).map(e => ({ t: e.t, v: +e.v || 0 }));
  (G.meals.get(date) || []).forEach(m => {
    const v = (parseFloat(m[f.from]) || 0) * per;

function graphHTML(d) {
  if (!G || d > TODAY) return '';
  const on = graphOn(), W = 1440, H = 100, PAD = 6;
  const start = dayStart(d);
  const xOf = m => (m - start) / (W - start) * W;
  const yOf = u => PAD + (1 - clamp(u, 0, 1)) * (H - PAD * 2);
  let drew = false, dots = '';
  /* The lines are shared/chart.js, stretched to the day's row; the dots stay
     HTML so they stay round at any row size. */
  const c = Chart.make({ w: W, h: H, pad: { l: 0, r: 0, t: PAD, b: PAD }, stretch: true });
  c.xLinear(start, W).ySet(0, 1, 1);
  const dot = (cls, m, u, tip) => {
    dots += '<i class="' + cls + '" style="left:' + (xOf(m) / W * 100).toFixed(2) + '%;top:' + (yOf(u) / H * 100).toFixed(2) +
      '%" title="' + attr(tip) + '"></i>';
  };
  ['mood', 'energy'].forEach(id => {
    const f = G[id];
    if (!f || on.indexOf(id) < 0) return;
    const top = Math.max(2, Math.min(10, f.max || 5));
    const pts = evList(d, id).map(e => ({ m: minuteOf(e.t), u: ((+e.v || 1) - 1) / (top - 1), e }))
      .filter(p => p.m >= start).sort((a, b) => a.m - b.m);
    if (!pts.length) return;
    if (pts.length > 1) { c.line(pts.map(p => [p.m, p.u]), id); drew = true; }
    pts.forEach(p => dot(id, p.m, p.u, clockLabel(hhmm(p.e.t)) + ' · ' + (f.label || id) + ' ' + p.e.v + ' of ' + top));
  });
  if (G.caf && on.indexOf('caffeine') > -1) {
    const f = G.caf, half = +f.half;
    const mid = new Date(d + 'T00:00:00').getTime();
    const span = Math.ceil(half * 4 / 24) + 1;
    const doses = [];
    Day.range(Day.shift(d, -(span - 1)), d).forEach(x => cafDoses(x).forEach(e => doses.push(e)));
    const level = T => Measure.decay(doses, half, T);
    const samples = [];
    for (let m = start; m < W; m += 15) samples.push({ m, v: level(mid + m * 60000) });
    samples.push({ m: W, v: level(mid + W * 60000) });
    const peak = samples.reduce((a, s) => Math.max(a, s.v), 0);
    if (peak >= 1) {
      const topMg = Math.max(cafTop(), peak);
      c.line(samples.map(s => [s.m, s.v / topMg]), 'caffeine');
      drew = true;
      doses.filter(e => e.t >= mid + start * 60000 && e.t < mid + 86400000).forEach(e => {
        dot('caffeine', minuteOf(e.t), level(e.t + 1000) / topMg,

/* ══════════════════════ DATE MATHS ══════════════════════
   The timeline runs from the first record to today. The first record is the
   earliest dated journal line, day, measurement or meal; Settings can set a
   different start. A period the timeline cuts through is drawn as the part
   inside it. */
function firstRecord() {
  let s = TODAY;
  ['note', 'day', 'ev', 'meal', 'spend', 'cell'].forEach(t => Rec.all(t, {}).forEach(r => {
    if (r.date && DATE_OK.test(r.date) && r.date < s) s = r.date;
  }));
  return s;
}
function startDate() {
  const set = S.get('start', '');
  return set && DATE_OK.test(set) && set <= TODAY ? set : firstRecord();
}

const WEEK_STARTS = [1, 8, 15, 22, 29];

/* ── what a day is called ──
   Tom, 2026-09-14: "I want to see things like 2026, M9, Week 37, Day 256",
   configured in Settings, since sometimes just "Day 256" or "Week 37" or
   "Week 37/52" or "Week 37 Day 2" is what he wants. So a label is built from
   parts he switches on, always in this order: the year, the month's number,
   the week of the year with the day's place in that week, the day of the
   year, then the date in words. "Out of" adds the totals.

   WEEKS OF THE YEAR count from January 1 in sevens by default, the same way
   his week groups count from the 1st of a month, so week 1 is January 1 to 7
   and Day 2 of a week is its second day. Settings can switch to ISO weeks
   instead: Monday to Sunday, week 1 holding the year's first Thursday, Day 1
   a Monday. Either way a 365-day year has 53 weeks, the last one short. */
const LABEL_PARTS = [
  { id: 'yr', name: 'Year' },
  { id: 'mn', name: 'Month number' },
  { id: 'wk', name: 'Week of year' },
  { id: 'wn', name: 'Day of week' },
  { id: 'dy', name: 'Day of year' },
  { id: 'wd', name: 'Weekday' },
  { id: 'dt', name: 'Date' },
  { id: 'mo', name: 'Month' },
];
const labelParts = () => {
  const v = S.get('dlabel', null);
  const ok = Array.isArray(v) ? LABEL_PARTS.map(p => p.id).filter(id => v.indexOf(id) > -1) : [];
  return ok.length ? ok : ['wd', 'dt'];
};
const labelTotals = () => !!S.get('dltot', false);
const weekMode = () => S.get('wkmode', 'jan1') === 'iso' ? 'iso' : 'jan1';
const labelKey = () => labelParts().join() + '|' + labelTotals() + '|' + weekMode();
const yearLen = y => Day.diff(y + '-12-31', y + '-01-01') + 1;
function isoWeek(d) {
  const t = new Date(d + 'T12:00:00'), wd = (t.getDay() + 6) % 7;
  t.setDate(t.getDate() - wd + 3);
  const jan4 = new Date(t.getFullYear(), 0, 4, 12);
  return { week: 1 + Math.round(((t - jan4) / 86400000 - 3 + (jan4.getDay() + 6) % 7) / 7), year: t.getFullYear() };
}
function dayLabel(d) {
  const parts = labelParts(), tot = labelTotals(), has = id => parts.indexOf(id) > -1;
  const y = +d.slice(0, 4), doy = Day.diff(d, y + '-01-01') + 1, out = [];
  if (has('yr')) out.push(String(y));
  if (has('mn')) out.push('M' + +d.slice(5, 7));
  let week = '';
  if (weekMode() === 'iso') {
    const w = isoWeek(d);
    if (has('wk')) week = 'Week ' + w.week + (tot ? '/' + isoWeek(w.year + '-12-28').week : '');
    if (has('wn')) week += (week ? ' ' : '') + 'Day ' + ((Day.dow(d) + 6) % 7 + 1) + (tot ? '/7' : '');
  } else {
    if (has('wk')) week = 'Week ' + Math.ceil(doy / 7) + (tot ? '/' + Math.ceil(yearLen(y) / 7) : '');
    if (has('wn')) week += (week ? ' ' : '') + 'Day ' + ((doy - 1) % 7 + 1) + (tot ? '/7' : '');
  }
  if (week) out.push(week);
  if (has('dy')) out.push('Day ' + doy + (tot ? '/' + yearLen(y) : ''));
  const words = [];
  if (has('wd')) words.push(Day.label(d, { weekday: 'short' }));
  if (has('dt')) words.push(String(+d.slice(8)));
  if (has('mo')) words.push(MONTHS[+d.slice(5, 7) - 1]);
  if (words.length) out.push(words.join(' '));
  return out.join(', ');
}

function buildTimeline(first, last) {
  const days = Day.range(first, last);
  const span = (from, to, extra) => {
    const f = from < first ? first : from, t = to > last ? last : to;
    return f > t ? null : Object.assign({ from: f, to: t, i0: Day.diff(f, first), n: Day.diff(t, f) + 1 }, extra);
  };
  const mStart = (y, m) => y + '-' + String(m + 1).padStart(2, '0') + '-01';
  const mEnd = (y, m) => Day.shift(m === 11 ? (y + 1) + '-01-01' : mStart(y, m + 1), -1);
  const add = (list, s) => { if (s) list.push(s); };
  const y0 = +first.slice(0, 4), y1 = +last.slice(0, 4);

  const years = [], quarters = [], months = [], weeks = [];
  for (let y = y0; y <= y1; y++) {
    add(years, span(mStart(y, 0), mEnd(y, 11), { label: String(y) }));
    [0, 1, 2, 3].forEach(q => add(quarters, span(mStart(y, q * 3), mEnd(y, q * 3 + 2), { label: 'Q' + (q + 1) + ' ' + y })));
    MONTHS.forEach((nm, m) => {
      const ms = mStart(y, m), me = mEnd(y, m);
      add(months, span(ms, me, { label: nm + (m === 0 || (ms <= first && me >= first) ? ' ' + y : '') }));
      const end = +me.slice(8);
      WEEK_STARTS.forEach((s, i) => {
        if (s > end) return;
        const e = i < WEEK_STARTS.length - 1 ? Math.min(WEEK_STARTS[i + 1] - 1, end) : end;
        const dd = n => ms.slice(0, 8) + String(n).padStart(2, '0');
        const w = span(dd(s), dd(e), {});
        if (!w) return;
        const a = +w.from.slice(8), b = +w.to.slice(8);
        w.label = 'Week ' + (i + 1) + ': ' + a + (a === b ? '' : '–' + b);
        weeks.push(w);
      });
    });
  }

  const dayList = days.map(d => {
    const lab = dayLabel(d);
    const month = d.slice(8) === '01' || d === first ? MONTHS[+d.slice(5, 7) - 1] + ' ' + d.slice(0, 4) : '';
    return span(d, d, { label: lab, month });
  });
  /* Every other week group along the whole timeline, for the soft surface
     that groups days without lines. */
  weeks.forEach((w, gi) => { for (let k = 0; k < w.n; k++) dayList[w.i0 + k].alt = gi % 2 === 1; });

  const pre = [0];
  days.forEach((d, i) => { pre.push(pre[i] + counted(d)); });
  return { y0, y1, first, last, days, years, quarters, months, weeks, dayList, pre };
}
const countOf = p => T.pre[p.i0 + p.n] - T.pre[p.i0];
const bullets = n => n + (n === 1 ? ' bullet' : ' bullets');
const ascIdx = date => clamp(Day.diff(date, T.first), 0, T.days.length - 1);
/* List draws one day, so every day is the one on the page. */
const domIdx = date => listMode() ? 0 : desc() ? T.days.length - 1 - ascIdx(date) : ascIdx(date);

/* ══════════════════════ SIZES AND PLACES ══════════════════════ */
const sc = $('scroller');
const headH = () => { const h = $('heads'); return h ? h.offsetHeight : 0; };
const bodyH = () => sc.clientHeight - headH();
const dhFor = n => {
  const v = bodyH() / n;
  return v >= M.small ? Math.floor(v) : Math.max(0.5, v);
};
const nearAt = () => Math.min(M.near, M.small * 2);

function applySizes() {
  const cal = $('cal');
  /* In the notebook the screen is two pages, so a day is at least its share
     of both: Day fills the spread, 2 Days a page each. */
  if (isBook()) {
    const H = sc.clientHeight;
    cal.classList.add('near');
    cal.classList.remove('small', 'tiny');
    cal.style.setProperty('--sh', H + 'px');
    cal.style.setProperty('--dh', Math.floor(2 * H / LEVELS[level].n) + 'px');
    /* The pages stay put; the notebook's own height is what scrolls, one
       screen plus as far as the stream runs past two pages. */
    if (flows.length) cal.style.height = (H + Math.max(0, flows[0].offsetHeight - 2 * H)) + 'px';
    flowBook();

  }
  /* In List the days' column is one screen tall and scrolls by itself. */
  if (listMode()) cal.style.setProperty('--sh', sc.clientHeight + 'px');
  dayHeight = dhFor(LEVELS[level].n);
  cal.style.setProperty('--dh', dayHeight + 'px');
  cal.classList.toggle('near', dayHeight >= nearAt());
  cal.classList.toggle('small', dayHeight < nearAt() && dayHeight >= M.small);
  cal.classList.toggle('tiny', dayHeight < 3);
  cal.style.setProperty('--headh', headH() + 'px');

}

function layoutAgg() {
  if (!dayCol || !blocks.length) return;
  const H = dayCol.offsetHeight;
  aggCols.forEach(c => { c.style.height = H + 'px'; });
  for (const b of blocks) {
    const a = dayEls[domIdx(b.from)], z = dayEls[domIdx(b.to)];
    const y1 = Math.min(a.offsetTop, z.offsetTop);
    const y2 = Math.max(a.offsetTop + a.offsetHeight, z.offsetTop + z.offsetHeight);
    if (y1 !== b.top) { b.el.style.top = y1 + 'px'; b.top = y1; }
    if (y2 - y1 !== b.h) { b.el.style.height = (y2 - y1) + 'px'; b.h = y2 - y1; }
    const px = b.h;
    const s = px < M.lab ? 'bare' : px < M.full ? 'lab-only' : '';
    if (s !== b.state) {
      if (b.state) b.el.classList.remove(b.state);
      if (s) b.el.classList.add(s);
      b.state = s;
    }
    if (b.ws) {
      const ln = s ? 0 : Math.max(0, Math.floor((px - M.full) / Math.max(1, M.wsLine)));
      if (ln !== b.lines) {
        b.ws.style.setProperty('--ln', ln);
        b.ws.hidden = ln < 1;
        b.lines = ln;

/* A day's place on the scroller. In the notebook that is its place in the

const dayY = i => (dayCol ? dayCol.offsetTop : 0) + dayEls[i].offsetTop;
const dayHt = i => dayEls[i].offsetHeight;
/* How much of the stream is on screen: one screen, or two pages. */
const screenH = () => isBook() ? 2 * sc.clientHeight : sc.clientHeight;
function dateAt(y) {

}

/* Slide the notebook's pages to the scroll: the left page shows the stream
   from the scroll down, the right page the page after it. */
function flowBook() {
  if (flows.length < 2) return;
  const s = sc.scrollTop, H = sc.clientHeight;

/* ── the day in focus ──
   Tom, 2026-09-14: "Changing the view group should never change the date
   focused on." One date, kept apart from the scroll position: his own
   scrolling, the arrows, TODAY and opening a box move it; changing the view,
   the order or the notebook only puts it back at the top. It is the top day

  const a = dateAt(sc.scrollTop + headH());

}

  if (focus > T.last) focus = T.last;
  /* In List the focus is the day on the right: draw it if it changed. */
  if (listMode()) { render(); applySizes(); setTop(0); return; }
  setTop(dayY(domIdx(focus)) - headH());
}

/* The bar and the label first: either can change the header's height, and
   the sizes are measured off what is left of the screen. */
function setLevel(i) {
  level = clamp(i, 0, LEVELS.length - 1);

  render();
  syncLevels();
  showFocus();
  applySizes();
  placeFocus();
  showFocus();
}
/* One offered view in or out from the current one. */
function stepLevel(dir) {
  for (let j = level + dir; j >= 0 && j < LEVELS.length; j += dir) if (viewOn(j)) return j;
  return level;
}

/* TODAY goes to today, in the view that is on. */
function toToday() {
  if (!T) return;
  focus = TODAY;
  placeFocus();
  showFocus();
}

/* Open a box: a day at Day; a week group at Week, or at 2 or 3 Days for the
   short end-of-month groups; a month at Month; a quarter at Quarter; a year
   at Year. If that view is not offered, the nearest one that is. */

  let id = 'd1';
  if (!box.classList.contains('day')) {
    const kind = box.dataset.kind, n = Day.diff(to, from) + 1;
    id = kind === 'year' ? 'y' : kind === 'quarter' ? 'q' : kind === 'month' ? 'm'

  }
  level = nearestView(LV(id), -1);

  drawBar();
  render();
  syncLevels();
  showFocus();
  applySizes();
  placeFocus();
  showFocus();

const addTarget = () => LEVELS[level].n === 1 ? focus : TODAY;

/* ── the arrows ──
   Tom, 2026-09-14: "The arrows should change between dates, not the year."
   One step is what the view shows: Day, 2 Days and 3 Days move that many
   days; Week one week group; Weeks two (1–14, 15–28, the rest); Month a
   month; Quarter a quarter; Year a year. Between them, what is in focus. */
const p2 = n => String(n).padStart(2, '0');
const monthOn = (d, k) => { const t = new Date(+d.slice(0, 4), +d.slice(5, 7) - 1 + k, 1, 12); return t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-01'; };

function unitStart(d) {
  const id = LEVELS[level].id, m = +d.slice(5, 7);
  if (id === 'y') return d.slice(0, 4) + '-01-01';
  if (id === 'q') return d.slice(0, 5) + p2(m - (m - 1) % 3) + '-01';
  if (id === 'm') return d.slice(0, 8) + '01';
  return d.slice(0, 8) + p2(STEP_STARTS[id].filter(s => s <= +d.slice(8)).pop());
}
function nextStart(u) {
  const id = LEVELS[level].id;
  if (id === 'y') return (+u.slice(0, 4) + 1) + '-01-01';
  if (id === 'q') return monthOn(u, 3);
  if (id === 'm') return monthOn(u, 1);
  const len = new Date(+u.slice(0, 4), +u.slice(5, 7), 0).getDate();
  const s = STEP_STARTS[id].find(v => v > +u.slice(8));
  return s && s <= len ? u.slice(0, 8) + p2(s) : monthOn(u, 1);

/* Where an arrow would put the focus. The same date back means it cannot go. */

  if (!T) return focus;
  const n = LEVELS[level].n;
  if (n <= 3) {
    if (!desc()) {
      const base = focus === T.last ? Day.shift(T.last, 1 - n) : focus;
      const t = Day.shift(base, dir * n);
      if (Day.shift(t, n - 1) >= T.last) return T.last;
      return t < T.first ? T.first : t;
    }
    const base = focus === T.first ? Day.shift(T.first, n - 1) : focus;
    const t = Day.shift(base, dir * n);
    if (Day.shift(t, 1 - n) <= T.first) return T.first;
    return t > T.last ? T.last : t;
  }
  const cur = unitStart(focus);
  if (dir < 0 && cur <= T.first) return focus;
  const u = dir > 0 ? nextStart(cur) : unitStart(Day.shift(cur, -1));
  if (u > T.last) return focus;
  const end = Day.shift(nextStart(u), -1);
  if (desc()) return end > T.last ? T.last : end;
  if (end >= T.last) return T.last;
  return u < T.first ? T.first : u;
}

  focus = t;
  placeFocus();
  showFocus();
}
/* The header names the days on screen: one date in Day, else the first and
   last day showing. Tom, 2026-09-14, picked "say each thing once": the side
   columns already name the week, month and year, so the header names the
   days instead of repeating one of them. */
function focusLabel() {
  const yr = d => d.slice(0, 4), mon = d => MONTHS[+d.slice(5, 7) - 1];
  const one = d => Day.label(d, { weekday: 'short' }) + ' ' + +d.slice(8) + ' ' + mon(d).slice(0, 3) + ' ' + yr(d);
  if (LEVELS[level].n === 1 || !dayEls.length) return one(focus);
  const top = dateAt(sc.scrollTop + headH()), bot = dateAt(sc.scrollTop + screenH() - 1);
  const i = top.f > 0.5 && top.i + 1 < dayEls.length ? top.i + 1 : top.i;
  const j = Math.max(i, bot.f < 0.5 && bot.i > 0 ? bot.i - 1 : bot.i);
  let a = dayEls[i].dataset.from, b = dayEls[j].dataset.from;
  if (a > b) { const t = a; a = b; b = t; }
  if (a === b) return one(a);
  const short = d => mon(d).slice(0, 3);
  if (a.slice(0, 7) === b.slice(0, 7)) return +a.slice(8) + '–' + +b.slice(8) + ' ' + short(b) + ' ' + yr(b);
  return +a.slice(8) + ' ' + short(a) + (yr(a) === yr(b) ? '' : ' ' + yr(a)) + ' – ' + +b.slice(8) + ' ' + short(b) + ' ' + yr(b);
}
function showFocus() {

  $('focusLabel').textContent = focusLabel();
  $('prevBtn').disabled = arrowTarget(-1) === focus;
  $('nextBtn').disabled = arrowTarget(1) === focus;

function setDesc(on) {
  touched = true;
  S.set('desc', !!on);
  render(true);
  applySizes();
  placeFocus();
  showFocus();
  drawBar();

/* ── snap ── */
function snapEdges() {
  if (isBook()) return null;
  const unit = LEVELS[level].snap;
  if (unit && blocks.length) return blocks.filter(b => b.col === unit).map(b => dayCol.offsetTop + b.top).sort((a, b) => a - b);
  return null;
}
let snapT = null, snapping = false;
function snapNow() {
  if (!T || drag || rz || mv || snapping || listMode() || Date.now() - progAt < 350) return;
  const top = sc.scrollTop + headH();
  let best = null;
  const edges = snapEdges();
  if (edges && edges.length) {
    let lo = 0, hi = edges.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (edges[mid] <= top) lo = mid; else hi = mid - 1; }
    best = edges[lo];
    if (lo + 1 < edges.length && edges[lo + 1] - top < top - best) best = edges[lo + 1];
  } else if (dayEls.length) {
    const a = dateAt(top), y1 = dayY(a.i), y2 = a.i + 1 < dayEls.length ? dayY(a.i + 1) : y1;
    best = top - y1 <= y2 - top ? y1 : y2;

  const dist = Math.abs(best - top);
  if (dist < 1 || dist > sc.clientHeight * 0.2) return;

     has had its time, the view is put where it was going anyway. */

    if (Math.abs(sc.scrollTop - target) > 1) setTop(target);
    snapping = false;

}

/* ── the view strip ──

   the days; a right click picks which views are offered. */

function drawLevels() {

  const on = LEVELS.filter((l, i) => viewOn(i));
  levelSeg = UI.segmented(on.map(l => ({ id: l.id, name: l.name })), LEVELS[level].id, id => {

  grp.appendChild(UI.more('More', box => {
    const views = opts();
    OFFERABLE.forEach(l => views.appendChild(toggleEl(l.name, viewOn(LV(l.id)), () => toggleView(l.id))));
    box.appendChild(UI.row('Views', 'Which views the strip offers', views));

    const first = firstRecord();
    const di = document.createElement('input');
    di.type = 'date'; di.className = 'mb-input'; di.max = TODAY;
    di.value = S.get('start', '') || '';
    di.onchange = () => { S.set('start', di.value && di.value <= TODAY ? di.value : ''); touched = false; };
    box.appendChild(UI.row('Timeline starts', 'Blank starts at your first record, ' + Day.label(first) + ' ' + first.slice(0, 4), di));

    const side = opts();
    OFFERABLE.filter(l => l.cols.length).forEach(l => {
      const line = UI.el('div', 'line');
      /* "In Month" rather than "Month", or the list read Week, Weeks, Weeks */
      line.appendChild(UI.el('span', 'k', 'In ' + l.name));
      l.cols.forEach(k => line.appendChild(toggleEl(COL_NAMES[k], hiddenSide(l.id).indexOf(k) < 0, () => toggleSide(l.id, k))));
      side.appendChild(line);
    });
    box.appendChild(UI.row('Side columns', 'The bigger units shown beside each view', side));

    /* What each day is called, with today's name shown as it will read. */
    const labels = opts(), preview = UI.el('div', 'line k');
    const showPreview = () => { preview.textContent = 'Today reads: ' + dayLabel(TODAY); };
    LABEL_PARTS.forEach(pt => labels.appendChild(toggleEl(pt.name, labelParts().indexOf(pt.id) > -1, on => {
      setInList('dlabel', LABEL_PARTS.map(p => p.id), labelParts(), pt.id, on);
      showPreview();
    })));
    labels.appendChild(toggleEl('Out of', labelTotals(), on => { S.set('dltot', !!on); showPreview(); }));
    labels.appendChild(preview);
    showPreview();
    box.appendChild(UI.row('Day label', 'The parts each day is named with', labels));

    box.appendChild(UI.row('Weeks of the year', 'January 1 in sevens, or Monday to Sunday',
      UI.segmented([{ id: 'jan1', name: 'From January 1' }, { id: 'iso', name: 'Monday start' }], weekMode(),
        v => { S.set('wkmode', v); showPreview(); })));

    const ci = UI.field('decimal', { value: cafTop() });
    ci.onchange = () => S.set('caftop', Math.max(50, Math.round(+ci.value) || 400));
    box.appendChild(UI.row('Caffeine scale', 'Milligrams at the top of a day’s graph', ci));

    const rb = UI.el('button', 'mb-btn mb-press mb-tap', 'RESET');
    rb.type = 'button';
    rb.onclick = () => { S.set('colw', {}); applyColW(); applySizes(); UI.toast('Column widths reset'); };
    box.appendChild(UI.row('Column widths', 'Back to the starting widths', rb));
  }, 'log-more'));

  pane.appendChild(grp);
}

/* ══════════════════════ COLUMN WIDTHS ══════════════════════ */
const colW = () => { const v = S.get('colw', null); return v && typeof v === 'object' ? v : {}; };
let widthsSet = [];
function applyColW() {
  const w = colW(), cal = $('cal');
  widthsSet.forEach(k => { if (!w[k]) cal.style.removeProperty('--w-' + k); });
  widthsSet = Object.keys(w).filter(k => w[k]);
  widthsSet.forEach(k => cal.style.setProperty('--w-' + k, w[k] + 'px'));
}
let rz = null, rzT = null;
$('cal').addEventListener('pointerdown', e => {
  const h = e.target.closest('.rz');
  if (!h) return;
  e.preventDefault(); e.stopPropagation();
  rz = { k: h.dataset.col, x: e.clientX, w: h.parentNode.getBoundingClientRect().width, cur: 0, h };
  h.classList.add('on');
  document.body.classList.add('resizing');
}, true);
window.addEventListener('pointermove', e => {
  if (rz) {
    rz.cur = Math.round(clamp(rz.w + e.clientX - rz.x, 64, 800));
    $('cal').style.setProperty('--w-' + rz.k, rz.cur + 'px');
    if (!rzT) rzT = setTimeout(() => { rzT = null; applySizes(); }, 40);
    return;
  }
  if (mv) {
    if (!mv.moved && Math.abs(e.clientX - mv.x) < 6) return;
    /* As in Sheets: the heading being moved fades where it was, a copy of
       it follows the pointer, and a bar shows where it will land. */
    if (!mv.moved) {
      mv.moved = true;
      document.body.classList.add('moving');
      mv.head.classList.add('lift');
      mv.ghost = UI.el('div', 'ghost', esc(mv.head.textContent));
      document.body.appendChild(mv.ghost);
    }
    mv.ghost.style.left = (e.clientX + 12) + 'px';
    mv.ghost.style.top = (e.clientY + 12) + 'px';
    const over = [...document.querySelectorAll('.heads .c[data-x]')].find(c => { const r = c.getBoundingClientRect(); return e.clientX >= r.left && e.clientX < r.right; });
    const after = over ? e.clientX > over.getBoundingClientRect().left + over.getBoundingClientRect().width / 2 : false;
    document.querySelectorAll('.heads .c.drop-l, .heads .c.drop-r').forEach(c => c.classList.remove('drop-l', 'drop-r'));
    if (over && over.dataset.x !== mv.k) over.classList.add(after ? 'drop-r' : 'drop-l');
    mv.over = over ? { k: over.dataset.x, after: after } : null;
  }
});
window.addEventListener('pointerup', () => {
  if (rz) {
    if (rz.cur) S.set('colw', Object.assign({}, colW(), { [rz.k]: rz.cur }));
    rz.h.classList.remove('on');
    rz = null;
    document.body.classList.remove('resizing');
    applySizes();
    return;
  }
  if (mv) {
    const m = mv;
    mv = null;
    document.body.classList.remove('moving');
    if (m.ghost) m.ghost.remove();
    m.head.classList.remove('lift');
    document.querySelectorAll('.heads .c.drop-l, .heads .c.drop-r').forEach(c => c.classList.remove('drop-l', 'drop-r'));
    if (m.moved && m.over && m.over.k !== m.k) {
      const o = xOrder().filter(k => k !== m.k);
      let j = o.indexOf(m.over.k);
      if (m.over.after) j++;
      o.splice(j, 0, m.k);
      S.set('xorder', o);
    }
  }
});
$('cal').addEventListener('dblclick', e => {
  const h = e.target.closest('.rz');
  if (!h) return;
  const w = colW();
  delete w[h.dataset.col];
  S.set('colw', w);
  applyColW(); applySizes();
});

/* ══════════════════════ WRITING ══════════════════════
   Every write re-reads the row first and merges into it, never rebuilds it
   from what is on screen. The root brief's many-writers rule. */
let reveal = null;
let heldAt = 0;

function saveSummary(d, raw) {
  const v = String(raw || '').trim();
  const cur = Rec.get('day', d, '') || {};
  if ((cur.note || '') === v) return;
  const next = Object.assign({}, cur, { note: v });
  if (!v) delete next.note;
  if (Object.keys(next).length) Rec.set('day', d, '', next);
  else Rec.del('day', d, '');
}
/* One day's entry in a text column. Trailing space is dropped, the lines
   inside are kept. */
function saveCell(d, col, raw) {
  const v = String(raw || '').replace(/\s+$/, '');
  const cur = Rec.get('cell', d, col);
  if (((cur && cur.text) || '') === v) return;
  if (v) Rec.set('cell', d, col, Object.assign({}, cur || {}, { text: v }));
  else if (cur) Rec.del('cell', d, col);
}

function summaryDialog(box) {
  const from = box.dataset.from, to = box.dataset.to || from;
  const kind = box.classList.contains('day') ? 'day' : box.dataset.kind;
  const month = MONTHS[+from.slice(5, 7) - 1] + ' ' + from.slice(0, 4);
  const title = (kind === 'day' ? Day.label(from, { weekday: 'short' }) + ' ' + +from.slice(8) + ' ' + month
    : kind === 'year' ? from.slice(0, 4)
    : kind === 'quarter' ? 'Q' + (Math.floor((+from.slice(5, 7) - 1) / 3) + 1) + ' ' + from.slice(0, 4)
    : kind === 'month' ? month
    : (box.querySelector('.lab') ? box.querySelector('.lab').textContent : +from.slice(8) + '–' + +to.slice(8)) + ' ' + month).toUpperCase();
  const current = kind === 'day' ? ((Rec.get('day', from, '') || {}).note || '') : recapOf(kind, from);
  let ta = null;
  const save = h => {
    const v = ta.value.trim();
    if (kind === 'day') saveSummary(from, v);
    else {
      const cur = Rec.get('recap', from, kind);
      if (v) Rec.set('recap', from, kind, Object.assign({}, cur || {}, { text: v }));
      else if (cur) Rec.del('recap', from, kind);
    }
    Mobile.feedback('success');
    h.close();
  };
  UI.dialog({
    title: title, width: 520,
    body: (b, h) => {
      ta = UI.field('note', { rows: kind === 'day' ? 2 : 5, value: current });
      ta.onkeydown = e => {
        if (e.key !== 'Enter' || e.shiftKey || e.altKey || e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        save(h);
      };
      b.appendChild(ta);
      UI.focusSoon(ta);
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: h => { save(h); return false; } },
    ],
  });
}

function noteDialog(x, d) {
  const isNew = !x.key;
  if (isNew && !Day.editable(d)) { UI.toast('Tomorrow isn’t here yet'); return; }
  /* A new bullet starts as an Entry, every time. Tom, 2026-09-13: "Default
     type when making a bullet should be Entry." */
  let kind = x.kind || 'entry';
  let ta = null;
  const title = (isNew ? 'ADD · ' : 'EDIT · ') +
    Day.label(isNew ? d : x.date, { weekday: 'short', day: 'numeric', month: 'long' }).toUpperCase();

  const commit = (h, again) => {
    const raw = ta.value.trim();
    /* Tom, 2026-09-14: "Im unable to delete a bullet?" Emptying a line and
       saving it deletes it, with an undo, as well as the DELETE button. */
    if (!raw && !isNew) { h.close(); removeLine(x); return; }
    if (!raw) { UI.toast('Nothing to save', { bad: true }); return; }
    const pz = parseLine(raw, isNew ? d : (x.day || x.date));
    let own = d;
    if (isNew) {
      /* the suite's one creator, shared/journal.js, so a line written here is
         the same row STATUS would write (Tom, 2026-09-18) */
      Journal.add(d, kind, raw, null, APP.id);
      reveal = d;
    } else {
      own = x.date;
      const cur = Rec.get('note', own, x.key);
      if (!cur) { UI.toast('That line is gone', { bad: true }); h.close(); return; }
      Rec.set('note', own, x.key, Object.assign({}, cur, {
        kind: kind, text: pz.text, at: pz.at, dur: pz.dur,
        by: kind === 'todo' ? (cur.by || null) : null,
      }));
      reveal = x.day;
    }
    publishNotes(own);
    Mobile.feedback(again ? 'tick' : 'success');
    if (again) { ta.value = ''; UI.focusSoon(ta, true); }
    else h.close();
  };

  UI.dialog({
    title: title, width: 520,
    body: (b, h) => {
      b.appendChild(UI.segmented(NOTE_KINDS.map(k => ({ id: k.id, name: k.label })), kind, v => { kind = v; }));
      const p = x.p || {};
      ta = UI.field('note', { rows: 2, value: isNew ? '' :
        String(p.text || '') + (p.at ? ' ' + clockLabel(p.at) : '') + (p.dur ? ' ' + durLabel(p.dur) : '') });
      ta.style.marginTop = 'var(--s-3)';
      ta.onkeydown = e => {
        if (e.key !== 'Enter' || e.shiftKey || e.altKey) return;
        if (e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        if (!ta.value.trim() && isNew) { h.close(); return; }
        commit(h, isNew);
      };
      b.appendChild(ta);
      UI.focusSoon(ta);
    },
    actions: [
      isNew ? null : { label: 'DELETE', kind: 'bad', fn: h => { h.close(); removeLine(x); return false; } },
      { label: 'CANCEL' },
      { label: isNew ? 'ADD' : 'SAVE', kind: 'go', fn: h => { commit(h, false); return false; } },
    ].filter(Boolean),
  });
}

/* Journal.tick, the tick STATUS and QUESTS use: done today, the Done time
   kept, and a repeating todo doing a round instead of finishing. */
function tick(x) {
  const res = Journal.tick(x.date, x.key, { day: TODAY, src: APP.id });
  if (!res) return;
  reveal = res.done ? TODAY : x.date;
  Mobile.feedback(res.done ? 'tick' : 'untick');
  if (res.round) UI.undo('next round ' + (res.next || ''), res.undo);
}

function removeLine(x) {
  const keep = Rec.get('note', x.date, x.key);
  if (!keep) return;
  Rec.del('note', x.date, x.key);
  publishNotes(x.date);
  Mobile.haptic('warn');
  UI.undo('Removed <b>' + esc(keep.text || '') + '</b>', () => { Rec.set('note', x.date, x.key, keep); publishNotes(x.date); });
}

const bulletOf = el => byKey.get(el.dataset.d + '|' + el.dataset.k);

/* Click. The name of a day, week, month, quarter or year opens it. A todo's
   box ticks and a bullet edits. Blank space on a day adds a bullet (Tom,
   2026-09-13: "Tapping blank space on a day should enter bullet entry");
   blank space on a bigger block opens the box to write about it. The day's
   line and the text columns take the cursor themselves. */
$('cal').addEventListener('click', e => {
  if (Date.now() - heldAt < 800) return;
  const lrow = e.target.closest('.lrow');
  if (lrow) { listPick(lrow.dataset.d); return; }
  if (e.target.closest('.sum, .cell, .rz, .heads')) return;
  const tickBox = e.target.closest('button.k');
  if (tickBox) { const x = bulletOf(tickBox.closest('.bl')); if (x) tick(x); return; }
  const box = e.target.closest('.day, .agg .blk');
  if (!box) return;
  if (e.target.closest('.lab, .mo')) { openBox(box); return; }
  const bl = e.target.closest('.bl');
  if (bl) { const x = bulletOf(bl); if (x) noteDialog(x, x.day); return; }
  if (box.classList.contains('day')) { noteDialog({}, box.dataset.from); return; }
  summaryDialog(box);
});

/* The day's line saves on Enter and when left; a text column saves when
   left, or on Ctrl+Enter. Escape puts either back. */
const typingIn = el => !!(el && el.classList && (el.classList.contains('sum') || el.classList.contains('cell')));
const leaveField = inp => {
  if (inp.classList.contains('sum')) saveSummary(inp.dataset.d, inp.value);
  else saveCell(inp.dataset.d, inp.dataset.col, inp.value);
  if (pendingRebuild) { pendingRebuild = false; soon(); }
};
$('cal').addEventListener('keydown', e => {
  const t = e.target;
  if (!typingIn(t)) return;
  if (e.key === 'Escape') { t.value = t.defaultValue; t.blur(); return; }
  if (e.key === 'Enter' && (t.classList.contains('sum') || e.ctrlKey || e.metaKey)) { e.preventDefault(); leaveField(t); t.blur(); }
});
$('cal').addEventListener('focusout', e => { if (typingIn(e.target)) leaveField(e.target); });

/* A right click without a drag, or a hold with a finger: a menu. On a column
   heading, the columns; on a bullet, the bullet; on a box, the box. */
Mobile.hold($('cal'), e => {
  if (e.type !== 'contextmenu' && e.pointerType === 'mouse') return;
  heldAt = Date.now();
  const head = e.target.closest('.heads .c');
  if (head || e.target.closest('.heads')) { columnsMenu(e, head || null); return; }
  const bl = e.target.closest('.bl');
  if (bl) {
    const x = bulletOf(bl);
    if (!x) return;
    UI.menu(e.clientX, e.clientY, [
      { label: 'Edit', fn: () => noteDialog(x, x.day) },
      x.kind === 'todo' ? { label: x.p.done ? 'Untick' : 'Tick', fn: () => tick(x) } : null,
      /* Move to tomorrow and Cancel it, the same as STATUS and QUESTS */
      ...Journal.menuItems(Object.assign({}, x.p, { kind: x.kind, date: x.date, key: x.key }), null, APP.id),
      '-',
      { label: 'Delete', kind: 'bad', fn: () => removeLine(x) },
    ].filter(Boolean), { title: x.p.text || '' });
    return;
  }
  const box = e.target.closest('.day, .agg .blk');
  if (!box) return;
  const d = box.dataset.from;
  const items = [{ label: 'Open', fn: () => openBox(box) }, { label: 'Write about it', fn: () => summaryDialog(box) }];
  if (box.classList.contains('day') && Day.editable(d)) items.push({ label: 'Add a bullet', fn: () => noteDialog({}, d) });
  const lab = box.querySelector('.lab');
  UI.menu(e.clientX, e.clientY, items, { title: lab ? lab.textContent : Day.label(d) });
}, { skip: '.sum,.cell,button.k,.rz' });

/* ══════════════════════ MOVING AROUND ══════════════════════
   The wheel scrolls. Mouse 4 zooms out and Mouse 5 in, toward the pointer,
   through the offered views (Tom, 2026-09-14: "Flip mouse 4 and 5"). A held
   left or right button drags the page. */
const sideButton = e => e.button === 3 || e.button === 4;
window.addEventListener('mousedown', e => { if (sideButton(e)) e.preventDefault(); });
window.addEventListener('auxclick', e => { if (sideButton(e)) e.preventDefault(); });
window.addEventListener('mouseup', e => {
  if (!sideButton(e)) return;
  e.preventDefault();
  touched = true;
  setLevel(stepLevel(e.button === 3 ? 1 : -1));
});

/* In List, Up and Down move through the days: Up is the newer day, as the
   list reads, Down the older. Not while typing, or with a menu or box open. */
window.addEventListener('keydown', e => {
  if (!T || !listMode() || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  if (e.altKey || e.ctrlKey || e.metaKey || (e.target.closest && e.target.closest('input,textarea,select,[contenteditable]'))) return;
  if (document.querySelector('[aria-modal="true"], .mb-menu')) return;
  e.preventDefault();
  const d = Day.shift(focus, e.key === 'ArrowUp' ? 1 : -1);
  if (d < T.first || d > T.last) return;
  listPick(d);
});

let drag = null, swallowClick = false, swallowMenuAt = 0;
sc.addEventListener('wheel', () => { userAt = Date.now(); }, { passive: true });
sc.addEventListener('touchmove', () => { userAt = Date.now(); }, { passive: true });
window.addEventListener('keydown', e => { if (!typingIn(e.target)) userAt = Date.now(); });
sc.addEventListener('pointerdown', e => {
  userAt = Date.now();
  if (e.pointerType !== 'mouse' || (e.button !== 0 && e.button !== 2)) return;
  if (e.target.closest('button,input,select,textarea,a,.rz')) return;
  drag = { x: e.clientX, y: e.clientY, top: sc.scrollTop, left: sc.scrollLeft, moved: false, button: e.button };
});
window.addEventListener('pointermove', e => {
  if (!drag || rz || mv) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 4) return;
    drag.moved = true; touched = true;
    sc.classList.add('dragging');
  }
  userAt = Date.now();
  sc.scrollTop = drag.top - dy;
  sc.scrollLeft = drag.left - dx;
});
const endDrag = () => {
  if (drag && drag.moved) {
    if (drag.button === 2) swallowMenuAt = Date.now();
    else { swallowClick = true; setTimeout(() => { swallowClick = false; }, 0); }
    drag = null;
    sc.classList.remove('dragging');
    snapSoon();
    return;
  }
  drag = null;
  sc.classList.remove('dragging');
};
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
sc.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);
sc.addEventListener('contextmenu', e => {
  if (Date.now() - swallowMenuAt < 800) { e.preventDefault(); e.stopPropagation(); }
}, true);
sc.addEventListener('scroll', () => {
  flowBook();
  if (sc.scrollTop === setAt) setAt = -1;
  else if (Date.now() - userAt < 1000) readFocus();
  showFocus();
  if (drag && drag.moved) return;
  snapSoon();
}, { passive: true });

/* ── start, and keep up ── */
function rebuild() {
  const an = T ? anchorAt(sc.scrollTop + headH()) : null;
  indexJournal();
  indexGraph();
  T = buildTimeline(startDate(), TODAY);
  if (labelKey() !== measuredLabel) measure();
  dayCache = new Map();
  applyColW();
  const was = level;
  drawLevels();
  render(true);
  applySizes();
  syncLevels();
  if (level !== was) drawBar(); else markFilters();
  if (!touched) toToday();
  else if (an) restore(an, headH());
  if (reveal) {
    const d = reveal;
    reveal = null;
    const i = domIdx(d), top = dayY(i), bot = top + dayHt(i);
    if (bot > sc.scrollTop + screenH()) setTop(bot - screenH());
    if (top < sc.scrollTop + headH()) setTop(top - headH());
  }
  showFocus();
}
let rebuildT = null, pendingRebuild = false;
const typing = () => typingIn(document.activeElement);
const soon = () => {
  clearTimeout(rebuildT);
  rebuildT = setTimeout(() => { if (typing()) { pendingRebuild = true; return; } rebuild(); }, 60);
};

applyText();
indexJournal();
indexGraph();
T = buildTimeline(startDate(), TODAY);
level = openLevel();
applyColW();
drawLevels();
drawBar();
measure();
render(true);
applySizes();
syncLevels();
toToday();
Rec.ready(soon);
Rec.on(soon);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); applySizes(); if (!touched) toToday(); });
if (window.ResizeObserver) new ResizeObserver(() => {
  const an = anchorAt(sc.scrollTop + headH());
  applySizes();
  if (!touched) toToday(); else restore(an, headH());
}).observe(sc);
</script>
</body>
</html>
