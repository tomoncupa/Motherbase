<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLOOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mb-version" content="1.0.0, 2026-09-15">
<style>
  :root{
    --ink:#e9e6dc; --mut:#9a978d; --bg:#0b0d12; --panel:#151923; --line:#2a2f3d;
    --acc:#f0b323; --bad:#ff5c5c; --good:#7ed957;
    --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0;cursor:crosshair}
  #ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,12,.72);backdrop-filter:blur(3px);z-index:5}
  #ov.on{display:flex}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 32px;max-width:860px;width:calc(100% - 48px);box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
  h1{margin:0 0 6px;font-size:64px;letter-spacing:.12em;color:var(--acc);text-shadow:0 4px 0 #6b4d0a,0 10px 30px rgba(240,179,35,.35)}
  h2{margin:0 0 10px;font-size:30px;letter-spacing:.08em}
  p{margin:6px 0;color:var(--mut);line-height:1.45}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0 6px;text-align:left}
  .keys div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
  .keys b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
  kbd{font-family:inherit;background:#0b0d12;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:var(--ink);font-size:13px}
  button{font:inherit;font-size:18px;letter-spacing:.06em;background:var(--acc);color:#1a1300;border:0;border-radius:12px;padding:14px 26px;cursor:pointer;min-height:44px;margin:8px 6px 0;box-shadow:0 5px 0 #8a6412}
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6412}
  button.alt{background:#2a2f3d;color:var(--ink);box-shadow:0 5px 0 #11141c}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  .card{background:rgba(255,255,255,.04);border:2px solid var(--line);border-radius:14px;padding:18px 14px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-4px);border-color:var(--acc)}
  .card .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.06)}
  .card b{font-size:18px;letter-spacing:.04em}
  .card small{color:var(--mut);font-size:14px;line-height:1.35}
  .card .key{color:var(--acc);font-size:12px;letter-spacing:.2em;margin-top:auto}
  .card.rare{border-color:#6c8cff}.card.rare b{color:#9db3ff}
  .stats{display:flex;justify-content:center;gap:26px;margin:14px 0 4px;flex-wrap:wrap}
  .stats div{font-size:14px;color:var(--mut)}
  .stats b{display:block;font-size:30px;color:var(--ink)}
  .seed{font-family:ui-monospace,Consolas,monospace;color:var(--mut);font-size:13px;margin-top:10px}
  .seed input{font:inherit;background:#0b0d12;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;width:170px;text-align:center}
  .bestiary{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .bestiary span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--mut)}
  .bestiary span i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  @media (max-width:720px){h1{font-size:44px}.cards{grid-template-columns:1fr}.panel{padding:20px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div class="panel" id="pan"></div></div>
<script>
'use strict';
/* =====================================================================
   GLOOP. A top-down gel-slaying roguelike in the spirit of Amorphous+.
   One file, no dependencies, everything drawn on a canvas at runtime.
   Runs from a folder. Saves only a tiny best-run record in localStorage,
   under 'gloop.save'. It is not part of the Motherbase suite and loads
   nothing from shared/.
   ===================================================================== */

const TAU = Math.PI * 2;
const W = 1600, H = 1000;               // arena size in world units
const ROOMS = 15;                       // a run is fifteen rooms, bosses at 5, 10, 15
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov'), pan = document.getElementById('pan');
let dpr = 1, vw = 1, vh = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  vw = innerWidth || vw; vh = innerHeight || vh;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
}
addEventListener('resize', resize); resize();

/* ---------- random. Seeded for the run (rooms, spawns, upgrades),
   plain Math.random for anything that is only cosmetic. ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
let rng = Math.random;
const R = (a, b) => a + rng() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
const M = Math.random;                      // cosmetic random
const MR = (a, b) => a + M() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function newSeed() { const w = ['GEL', 'OOZE', 'SPLAT', 'BLOB', 'DRIP', 'GOO', 'SLIME', 'MOSS', 'JELLY', 'MUCK']; return w[Math.floor(M() * w.length)] + '-' + Math.floor(M() * 9000 + 1000); }

/* ---------- colour helpers ---------- */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(h, k) { const [r, g, b] = hex2rgb(h); return `rgb(${clamp(r * k | 0, 0, 255)},${clamp(g * k | 0, 0, 255)},${clamp(b * k | 0, 0, 255)})`; }
function rgba(h, a) { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; }

/* ---------- audio, synthesised ---------- */
let AC = null, muted = false, noiseBuf = null;
function audio() {
  if (muted) return null;
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function sfx(kind) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime, out = ac.destination;
  const noise = (dur, f0, f1, vol, q) => {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + dur);
  };
  const tone = (type, f0, f1, dur, vol, delay) => {
    const o = ac.createOscillator(); o.type = type; const d0 = t + (delay || 0);
    o.frequency.setValueAtTime(f0, d0); o.frequency.exponentialRampToValueAtTime(f1, d0 + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, d0); g.gain.exponentialRampToValueAtTime(vol, d0 + 0.01); g.gain.exponentialRampToValueAtTime(0.001, d0 + dur);
    o.connect(g); g.connect(out); o.start(d0); o.stop(d0 + dur);
  };
  switch (kind) {
    case 'swing': noise(0.18, 600, 2400, 0.25, 0.8); break;
    case 'splat': noise(0.16, 300, 90, 0.5, 1.2); tone('sine', 140, 50, 0.14, 0.35); break;
    case 'clank': tone('square', 900, 400, 0.08, 0.12); noise(0.06, 3000, 1500, 0.15, 3); break;
    case 'hurt': tone('sawtooth', 320, 90, 0.28, 0.3); noise(0.2, 200, 60, 0.3, 1); break;
    case 'dash': noise(0.14, 1200, 300, 0.18, 1.5); break;
    case 'pick': tone('sine', 520, 520, 0.08, 0.2); tone('sine', 780, 780, 0.14, 0.2, 0.08); break;
    case 'clear': tone('triangle', 392, 392, 0.12, 0.25); tone('triangle', 523, 523, 0.12, 0.25, 0.12); tone('triangle', 659, 659, 0.3, 0.25, 0.24); break;
    case 'boss': tone('sawtooth', 60, 40, 0.9, 0.35); noise(0.7, 120, 40, 0.4, 0.7); break;
    case 'spit': noise(0.12, 900, 300, 0.2, 2); break;
    case 'shield': tone('sine', 900, 1400, 0.12, 0.2); break;
    case 'dead': tone('sawtooth', 220, 30, 1.2, 0.3); noise(0.9, 300, 40, 0.4, 0.8); break;
  }
}

/* ---------- input ---------- */
const keys = {};
const mouse = { x: 0, y: 0, down: false };
let wantSwing = false, wantDash = false;
addEventListener('keydown', e => {
  if (e.repeat) return;
  keys[e.code] = true;
  if (['Space', 'ShiftLeft', 'ShiftRight', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') wantDash = true;
  if (e.code === 'KeyM') { muted = !muted; toast(muted ? 'Sound off' : 'Sound on'); }
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  if (G.state === 'choose' && /^Digit[123]$/.test(e.code)) chooseUpgrade(+e.code[5] - 1);
  if (G.state === 'title' && (e.code === 'Enter' || e.code === 'Space')) startRun();
  if ((G.state === 'dead' || G.state === 'won') && e.code === 'Enter') startRun();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => { audio(); if (e.button === 0) { mouse.down = true; wantSwing = true; } if (e.button === 2) wantDash = true; });
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (G.state === 'play') togglePause(); });

/* =====================================================================
   THE BESTIARY. Every gloople, what it looks like and what it does.
   ===================================================================== */
const TYPES = {
  gloople: { name: 'Gloople', r: 21, hp: 1, spd: 78, col: '#7ed957', min: 1, w: 10, blurb: 'The common green one. Drifts at you. Dies to one hit.' },
  stickie: { name: 'Stickie', r: 19, hp: 2, spd: 62, col: '#f2d94e', min: 1, w: 4, blurb: 'Yellow and tacky. Touching it gums up your feet for a moment. Takes two hits.' },
  biter:   { name: 'Biter', r: 17, hp: 1, spd: 66, col: '#4da3ff', min: 2, w: 4, blurb: 'Blue and quick. Shivers, then lunges. Dash when it goes pale.' },
  clutter: { name: 'Clutter', r: 25, hp: 1, spd: 58, col: '#ff8ad1', min: 3, w: 3, blurb: 'Pink and lumpy. Bursts into three small ones when it dies.' },
  mini:    { name: 'Clutterling', r: 11, hp: 1, spd: 105, col: '#ff8ad1', min: 99, w: 0, blurb: 'A piece of a Clutter. Fast and small.' },
  meltie:  { name: 'Meltie', r: 20, hp: 1, spd: 52, col: '#ff7043', min: 3, w: 3, blurb: 'Orange and unstable. Leaves a pool of acid where it dies. Step back after the swing.' },
  sharpie: { name: 'Sharpie', r: 19, hp: 1, spd: 46, col: '#d6d6e6', min: 4, w: 3, blurb: 'Pale and spiny. Explodes into shards when killed. Kill it, then move.' },
  inkie:   { name: 'Inkie', r: 18, hp: 1, spd: 56, col: '#2f2f44', min: 6, w: 3, blurb: 'Keeps its distance and spits ink. Ink on you blots out the screen.' },
  oozle:   { name: 'Oozle', r: 22, hp: 2, spd: 50, col: '#b6ff3b', min: 6, w: 3, blurb: 'Lobs acid from range. The pools burn while they last.' },
  grinder: { name: 'Grinder', r: 27, hp: 4, spd: 44, col: '#8b8fa8', min: 7, w: 2, blurb: 'Armoured and slow. Four hits. Each hit stuns it for a beat.' },
  torchie: { name: 'Torchie', r: 16, hp: 1, spd: 98, col: '#ff5722', min: 8, w: 3, blurb: 'Burning and fast. Leaves a trail of fire. Kill it early.' },
  frostie: { name: 'Frostie', r: 22, hp: 2, spd: 48, col: '#9be7ff', min: 11, w: 3, blurb: 'A cold aura slows everything near it. Including you.' },
  queen:   { name: 'Gloople Queen', r: 62, hp: 32, hpScale: 0, spd: 42, col: '#6fcf3d', min: 99, w: 0, boss: true, blurb: 'Huge. Charges across the room and births glooples. Hit her and get out of the way.' },
  horror:  { name: 'The Horror', r: 56, hp: 46, spd: 74, col: '#6a2d9c', min: 99, w: 0, boss: true, blurb: 'Fast, erratic, and it spits rings of ink and acid. It calls Biters.' },
  void:    { name: 'Void Eater', r: 72, hp: 64, spd: 38, col: '#1c1236', min: 99, w: 0, boss: true, blurb: 'The last one. Pulls you in, splits into shards, and everything it kills comes back.' },
};

/* =====================================================================
   UPGRADES. Picked one of three after every cleared room.
   ===================================================================== */
const UPG = [
  { id: 'wide', name: 'Wide Edge', ico: '◠', desc: 'Your swing covers a third more of the circle.', apply: p => p.arc *= 1.3 },
  { id: 'reach', name: 'Long Reach', ico: '⟶', desc: 'The blade reaches 20% further.', apply: p => p.reach *= 1.2 },
  { id: 'quick', name: 'Quick Hands', ico: '⚡', desc: 'Swing again 25% sooner.', apply: p => p.cd *= 0.75 },
  { id: 'heart', name: 'Thick Skin', ico: '♥', desc: 'One more heart, and it is full.', apply: p => { p.maxhp++; p.hp++; } },
  { id: 'salve', name: 'Salve', ico: '✚', desc: 'Heal to full. Nothing else.', apply: p => { p.hp = p.maxhp; }, repeat: true },
  { id: 'fleet', name: 'Fleet Foot', ico: '➶', desc: 'Move 12% faster.', apply: p => p.spd *= 1.12 },
  { id: 'ghost', name: 'Ghost Step', ico: '◌', desc: 'Dash comes back 35% sooner.', apply: p => p.dashCd *= 0.65 },
  { id: 'twin', name: 'Double Dash', ico: '»', desc: 'Two dashes before the cooldown starts.', apply: p => p.dashMax = 2, unique: true, rare: true },
  { id: 'splat', name: 'Splatter', ico: '✶', desc: 'Every kill shoves nearby glooples away.', apply: p => p.splatter = true, unique: true },
  { id: 'shield', name: 'Gel Shell', ico: '◍', desc: 'A shell absorbs one hit. It grows back every 18 seconds.', apply: p => { p.shieldMax = 18; p.shield = true; }, unique: true, rare: true },
  { id: 'wind', name: 'Second Wind', ico: '↻', desc: 'Die once and get back up with two hearts.', apply: p => p.wind = true, unique: true, rare: true },
  { id: 'boots', name: 'Acid Boots', ico: '⌂', desc: 'Acid pools cannot hurt you. Fire still can.', apply: p => p.boots = true, unique: true },
  { id: 'goggles', name: 'Ink Goggles', ico: '◉', desc: 'Ink clears from your eyes in half the time.', apply: p => p.goggles = true, unique: true },
  { id: 'cleaver', name: 'Cleaver', ico: '⚔', desc: 'Every hit counts double. Grinders and bosses feel it.', apply: p => p.dmg = 2, unique: true, rare: true },
  { id: 'whirl', name: 'Whirl', ico: '↺', desc: 'Dashing spins the blade all the way round you.', apply: p => p.whirl = true, unique: true, rare: true },
  { id: 'vamp', name: 'Gel Diet', ico: '❤', desc: 'Every ten kills gives back one heart.', apply: p => p.vamp = true, unique: true },
  { id: 'thorns', name: 'Spines', ico: '✱', desc: 'Anything that touches you takes a hit back.', apply: p => p.thorns = true, unique: true },
  { id: 'brace', name: 'Brace', ico: '▣', desc: 'Getting hit no longer knocks you about, and you recover sooner.', apply: p => { p.brace = true; }, unique: true },
];

/* =====================================================================
   STATE
   ===================================================================== */
const G = { state: 'title', room: 0, seed: '', kills: 0, time: 0, shake: 0, hitstop: 0, flash: 0, banner: null, toasts: [], seen: {}, paused: false, roomTime: 0, clearT: -1, spawnQ: [], spawnT: 0, biome: 1, bossName: '' };
let P = null;
let ents = [], projs = [], puddles = [], parts = [], rocks = [], portals = [], swings = [], rings = [], inks = [];
const cam = { x: W / 2, y: H / 2, z: 1, sx: 0, sy: 0 };
let floorCv = null, decalCv = null, dctx = null;
const SAVE_KEY = 'gloop.save';
let save = { best: 0, kills: 0, runs: 0, wins: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) { }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }

function newPlayer() {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 15, hp: 3, maxhp: 3, spd: 230, aim: 0,
    reach: 108, arc: TAU * 0.42, cd: 0.5, swingT: 0, swingCd: 0, swingDir: 1, swingA0: 0, hitDone: false, dmg: 1,
    dashT: 0, dashCd: 1.15, dashCharges: 1, dashMax: 1, dashRe: 0, dashDx: 0, dashDy: 0,
    inv: 0, sticky: 0, slow: 1, ink: 0, shield: false, shieldMax: 0, shieldT: 0, wind: false, splatter: false, boots: false, goggles: false, whirl: false, vamp: false, vampN: 0, thorns: false, brace: false,
    kbx: 0, kby: 0, face: 0, bob: 0, taken: [] };
}

function startRun(seed) {
  G.seed = (seed || (document.getElementById('seedIn') && document.getElementById('seedIn').value.trim()) || newSeed()).toUpperCase();
  rng = mulberry32(hashStr(G.seed));
  P = newPlayer();
  G.kills = 0; G.time = 0; G.seen = {}; G.room = 0; G.paused = false; G.toasts = [];
  save.runs++; persist();
  ov.classList.remove('on');
  nextRoom();
}

/* =====================================================================
   ROOMS
   ===================================================================== */
const BIOMES = [
  null,
  { name: 'THE MEADOW', floor: '#5d7a3b', floor2: '#4b6530', wall: '#1d2614', line: '#3f5528', portal: '#2b3d1a', rock: '#8a8570' },
  { name: 'THE CAVERN', floor: '#4a4f66', floor2: '#3b4054', wall: '#14161f', line: '#2e3242', portal: '#1d1f2c', rock: '#6b7089' },
  { name: 'THE ABYSS', floor: '#3a2551', floor2: '#2c1c40', wall: '#100a18', line: '#241634', portal: '#150b22', rock: '#5c4478' },
];
function nextRoom() {
  G.room++;
  G.state = 'play';
  G.biome = Math.min(3, Math.ceil(G.room / 5));
  G.roomTime = 0; G.clearT = -1; G.spawnT = 1.2; G.spawnQ = [];
  ents = []; projs = []; puddles = []; parts = []; swings = []; rings = []; inks = [];
  P.x = W / 2; P.y = H / 2 + 120; P.vx = P.vy = 0; cam.x = P.x; cam.y = P.y; cam.sx = cam.sy = 0; P.sticky = 0; P.ink = 0; P.inv = 0.8; P.dashCharges = P.dashMax;
  if (P.shieldMax) { P.shield = true; P.shieldT = 0; }
  makeFloor(); makeDecals();
  // rocks: a few, never near the middle where the player starts
  rocks = [];
  const nRocks = RI(3, 6);
  let guard = 0;
  while (rocks.length < nRocks && guard++ < 200) {
    const r = R(34, 74), x = R(r + 80, W - r - 80), y = R(r + 80, H - r - 80);
    if (Math.hypot(x - W / 2, y - H / 2) < 230) continue;
    if (rocks.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 70)) continue;
    rocks.push({ x, y, r, seed: R(0, 100), shade: R(0.85, 1.1) });
  }
  // portals along the edges
  portals = [];
  const edges = [{ x: 90, y: R(200, H - 200) }, { x: W - 90, y: R(200, H - 200) }, { x: R(250, W - 250), y: 90 }, { x: R(250, W - 250), y: H - 90 }];
  const np = G.room < 4 ? 2 : G.room < 9 ? 3 : 4;
  while (portals.length < np) { const e = edges.splice(RI(0, edges.length - 1), 1)[0]; portals.push({ x: e.x, y: e.y, t: 0, pulse: 0 }); }
  const bossRoom = G.room % 5 === 0;
  if (bossRoom) {
    const b = G.room === 5 ? 'queen' : G.room === 10 ? 'horror' : 'void';
    G.bossName = TYPES[b].name;
    G.spawnQ = []; G.bossQ = b;
    banner(TYPES[b].name.toUpperCase(), BIOMES[G.biome].name, true);
  } else {
    G.bossName = ''; G.bossQ = null;
    const total = 7 + G.room * 2 + (G.room > 5 ? 3 : 0);
    const pool = Object.keys(TYPES).filter(k => TYPES[k].min <= G.room);
    for (let i = 0; i < total; i++) {
      // weight the common ones a bit less as rooms go on
      const ws = pool.map(k => TYPES[k].w * (k === 'gloople' ? Math.max(0.35, 1 - G.room * 0.06) : 1));

      while (s > ws[j]) { s -= ws[j]; j++; }
      G.spawnQ.push(pool[j]);
    }
    // the first few out of the hole are always easy
    G.spawnQ.sort((a, b) => (a === 'gloople' ? 0 : 1) - (b === 'gloople' ? 0 : 1) + (rng() - 0.5) * 0.8);
    banner('ROOM ' + G.room, BIOMES[G.biome].name, false);
  }
}
function banner(big, small, boss) { G.banner = { big, small, t: 0, boss }; if (boss) sfx('boss'); }
function toast(msg) { G.toasts.push({ msg, t: 0 }); }

/* floor and decals are drawn once per room onto offscreen canvases */
function makeFloor() {
  const B = BIOMES[G.biome];
  floorCv = document.createElement('canvas'); floorCv.width = W; floorCv.height = H;
  const f = floorCv.getContext('2d');
  f.fillStyle = B.floor; f.fillRect(0, 0, W, H);
  // soft blotches
  for (let i = 0; i < 260; i++) {
    const x = M() * W, y = M() * H, r = MR(30, 160);
    f.fillStyle = M() < 0.5 ? rgba(B.floor2, 0.3) : 'rgba(255,255,255,0.035)';
    f.beginPath(); f.arc(x, y, r, 0, TAU); f.fill();
  }
  // grit
  f.fillStyle = 'rgba(0,0,0,0.12)';
  for (let i = 0; i < 2600; i++) { f.fillRect(M() * W, M() * H, MR(1, 3), MR(1, 3)); }
  f.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 1400; i++) { f.fillRect(M() * W, M() * H, MR(1, 2.5), MR(1, 2.5)); }
  // tile lines
  f.strokeStyle = rgba(B.line, 0.55); f.lineWidth = 2;
  for (let x = 0; x <= W; x += 100) { f.beginPath(); f.moveTo(x + MR(-2, 2), 0); f.lineTo(x + MR(-2, 2), H); f.stroke(); }
  for (let y = 0; y <= H; y += 100) { f.beginPath(); f.moveTo(0, y + MR(-2, 2)); f.lineTo(W, y + MR(-2, 2)); f.stroke(); }
  // cracks
  f.strokeStyle = 'rgba(0,0,0,0.25)'; f.lineWidth = 1.5;
  for (let i = 0; i < 18; i++) {
    let x = M() * W, y = M() * H; f.beginPath(); f.moveTo(x, y);
    for (let j = 0; j < 8; j++) { x += MR(-40, 40); y += MR(-40, 40); f.lineTo(x, y); }
    f.stroke();
  }
  // inner shadow at the walls
  const edge = 90;
  const strips = [[0, 0, W, edge, 0, 0, 0, edge], [0, H - edge, W, edge, 0, H, 0, H - edge], [0, 0, edge, H, 0, 0, edge, 0], [W - edge, 0, edge, H, W, 0, W - edge, 0]];
  for (const s of strips) {
    const g = f.createLinearGradient(s[4], s[5], s[6], s[7]); g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');

}
function makeDecals() { decalCv = document.createElement('canvas'); decalCv.width = W; decalCv.height = H; dctx = decalCv.getContext('2d'); }

/* a splat that stays on the floor for the rest of the room */
function splat(x, y, r, col, dirx, diry, big) {
  const d = dctx; d.save();
  d.fillStyle = rgba(col, 0.82);
  blobPath(d, x, y, r * 1.25, 0, M() * 100, 0.22, 14);
  d.fill();
  d.fillStyle = 'rgba(0,0,0,0.18)'; blobPath(d, x + 2, y + 3, r * 0.75, 0, M() * 100, 0.3, 10); d.fill();
  const n = big ? 14 : 7;
  for (let i = 0; i < n; i++) {
    const a = Math.atan2(diry, dirx) + MR(-1.1, 1.1), L = MR(r * 0.6, r * (big ? 3.4 : 2.4));
    const px = x + Math.cos(a) * L, py = y + Math.sin(a) * L, pr = MR(2, r * 0.32);
    d.fillStyle = rgba(col, MR(0.5, 0.9)); d.beginPath(); d.arc(px, py, pr, 0, TAU); d.fill();
    if (pr > 4) { d.fillStyle = 'rgba(255,255,255,0.18)'; d.beginPath(); d.arc(px - pr * 0.3, py - pr * 0.3, pr * 0.35, 0, TAU); d.fill(); }
  }

}
function dot(x, y, r, col) { dctx.fillStyle = rgba(col, 0.7); dctx.beginPath(); dctx.arc(x, y, r, 0, TAU); dctx.fill(); }

/* =====================================================================
   SPAWNING
   ===================================================================== */
function spawn(type, x, y, quiet) {
  const T = TYPES[type];
  const e = { type, T, x, y, vx: 0, vy: 0, r: T.r, hp: T.hp, spd: T.spd, col: T.col, t: M() * 10, seed: M() * 100, face: R(0, TAU),
    wa: R(0, TAU), wt: 0, state: 'roam', st: 0, kbx: 0, kby: 0, stun: 0, thornT: 0, flash: 0, born: 0.35, shoot: R(1, 2.5), dead: false, id: M(), hitBy: -1 };

  if (type === 'grinder' && G.room > 10) e.hp = 5;
  ents.push(e);
  if (!G.seen[type] && !quiet) { G.seen[type] = true; toast('NEW: ' + T.name + '. ' + T.blurb); }
  if (T.boss) G.seen[type] = true;

}
function burstParts(x, y, n, col, speed, z) {
  for (let i = 0; i < n; i++) {
    const a = M() * TAU, s = MR(speed * 0.3, speed);
    parts.push({ x, y, z: z || 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: MR(60, 240), r: MR(2.5, 6), col, life: 1.2 });

}
function sprayParts(x, y, n, col, dirx, diry, speed) {

    const a = a0 + MR(-0.9, 0.9), s = MR(speed * 0.4, speed);
    parts.push({ x, y, z: 6, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: MR(80, 300), r: MR(2.5, 7), col, life: 1.4 });

}

/* =====================================================================
   UPDATE
   ===================================================================== */
function togglePause() {
  if (G.state !== 'play' && G.state !== 'pause') return;
  if (G.state === 'play') { G.state = 'pause'; showPanel(`<h2>PAUSED</h2><p>Room ${G.room} of ${ROOMS}. Seed ${G.seed}.</p><button onclick="togglePause()">Carry on</button> <button class="alt" onclick="abandon()">Give up this run</button>`); }
  else { G.state = 'play'; ov.classList.remove('on'); }
}
function abandon() { G.state = 'dead'; die(true); }

function update(dt) {
  G.time += dt; G.roomTime += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 3.2);
  if (G.flash > 0) G.flash -= dt * 4;
  for (const t of G.toasts) t.t += dt; G.toasts = G.toasts.filter(t => t.t < 5.5);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > 2.6) G.banner = null; }
  updatePlayer(dt);
  updateSpawns(dt);
  for (const e of ents) updateEnemy(e, dt);
  separate();
  updateProjs(dt);
  updatePuddles(dt);
  updateParts(dt);
  for (const s of swings) s.t += dt; swings = swings.filter(s => s.t < 0.45);
  for (const r of rings) r.t += dt; rings = rings.filter(r => r.t < 0.5);
  ents = ents.filter(e => !e.dead);
  for (const p of portals) { p.t += dt; p.pulse = Math.max(0, p.pulse - dt); }
  // clear check
  if (G.state === 'play' && G.clearT < 0 && G.roomTime > 1.5) {
    const boss = G.room % 5 === 0;
    const done = boss ? (!G.bossQ && G.roomTime > 2 && !ents.some(e => e.T.boss)) : (G.spawnQ.length === 0 && ents.length === 0);
    if (done) { G.clearT = 0; sfx('clear'); if (boss) { for (const e of ents) kill(e, 0, 0, true); } }
  }
  if (G.clearT >= 0) { G.clearT += dt; if (G.clearT > 1.3) { if (G.room >= ROOMS) win(); else offerUpgrades(); } }
  camUpdate(dt);
}

function updatePlayer(dt) {
  const p = P;
  p.bob += dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.sticky > 0) p.sticky -= dt;
  if (p.ink > 0) p.ink -= dt * (p.goggles ? 2 : 1);
  if (p.shieldMax && !p.shield) { p.shieldT += dt; if (p.shieldT >= p.shieldMax) { p.shield = true; p.shieldT = 0; sfx('shield'); toast('Gel Shell is back'); } }
  if (p.dashCharges < p.dashMax) { p.dashRe += dt; if (p.dashRe >= p.dashCd) { p.dashCharges++; p.dashRe = 0; } }
  // aim
  const mw = screenToWorld(mouse.x, mouse.y);
  const aimA = Math.atan2(mw.y - p.y, mw.x - p.x);
  if (p.swingT <= 0) p.aim = aimA;
  // movement
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const il = Math.hypot(ix, iy); if (il > 0) { ix /= il; iy /= il; p.face = Math.atan2(iy, ix); }
  let slow = 1;
  if (p.sticky > 0) slow *= 0.45;

  p.slow = slow;
  // dash
  if (wantDash && p.dashCharges > 0 && p.dashT <= 0) {
    p.dashCharges--; if (p.dashCharges < p.dashMax && p.dashRe === 0) p.dashRe = 0.0001;
    p.dashT = 0.19;
    let dx = ix, dy = iy; if (il === 0) { dx = Math.cos(aimA); dy = Math.sin(aimA); }
    p.dashDx = dx; p.dashDy = dy; p.sticky = 0;
    sfx('dash');
    if (p.whirl) { doHit(p.x, p.y, p.reach * 0.9, TAU, p.aim, 0.5); rings.push({ x: p.x, y: p.y, r: p.reach * 0.9, t: 0, col: '#ffffff' }); }
  }
  wantDash = false;
  if (p.dashT > 0) {
    p.dashT -= dt;
    p.vx = p.dashDx * 760; p.vy = p.dashDy * 760;
    if (M() < 0.6) parts.push({ x: p.x - p.dashDx * 10, y: p.y - p.dashDy * 10, z: 4, vx: MR(-20, 20), vy: MR(-20, 20), vz: 40, r: MR(3, 6), col: '#ffffff', life: 0.3, ghost: true });
  } else {
    const sp = p.spd * slow;
    p.vx = lerp(p.vx, ix * sp, 1 - Math.pow(0.0005, dt));
    p.vy = lerp(p.vy, iy * sp, 1 - Math.pow(0.0005, dt));
  }
  p.x += (p.vx + p.kbx) * dt; p.y += (p.vy + p.kby) * dt;
  p.kbx *= Math.pow(0.001, dt); p.kby *= Math.pow(0.001, dt);

  for (const e of ents) if (e.type === 'void' && e.state === 'pull') { const d = dist(e, p); if (d > 60) { p.x += (e.x - p.x) / d * 120 * dt; p.y += (e.y - p.y) / d * 120 * dt; } }

    p.swingT = 0.24; p.swingCd = p.cd; p.hitDone = false; p.swingDir *= -1; p.swingA0 = aimA; p.aim = aimA;
    swings.push({ x: p.x, y: p.y, a0: aimA, dir: p.swingDir, arc: p.arc, reach: p.reach, t: 0 });

      if (p.thorns && e.thornT <= 0) { e.thornT = 0.6; damage(e, 1, e.x - p.x, e.y - p.y, true); }
    }

}
function screenToWorld(sx, sy) { return { x: (sx - vw / 2) / cam.z + cam.x, y: (sy - vh / 2) / cam.z + cam.y }; }
function collideWorld(o) {

/* the swing hits everything inside the wedge at once */
function doHit(x, y, reach, arc, aim, power) {

    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
    if (d > reach + e.r * 0.8) continue;

function kill(e, dx, dy, silent) {
  if (e.dead) return;
  e.dead = true;
  if (!silent) { G.kills++; save.kills++; P.vampN++; }
  const big = e.r > 24;
  splat(e.x, e.y, e.r, e.col, dx, dy, big);
  sprayParts(e.x, e.y, big ? 26 : 12, e.col, dx, dy, big ? 260 : 200);
  burstParts(e.x, e.y, big ? 10 : 4, e.col, 120, 10);
  sfx('splat');
  G.shake = Math.min(1.2, G.shake + (big ? 0.5 : 0.12));

  if (e.type === 'sharpie') for (let i = 0; i < 9; i++) { const a = i / 9 * TAU + M() * 0.3; projs.push({ x: e.x, y: e.y, vx: Math.cos(a) * 340, vy: Math.sin(a) * 340, r: 6, kind: 'shard', life: 0.9, col: '#e8e8f4' }); }

function hurt(fx, fy, n) {

  const dx = p.x - fx, dy = p.y - fy, d = Math.hypot(dx, dy) || 1;
  if (!p.brace) { p.kbx += dx / d * 420; p.kby += dy / d * 420; }

  p.hp -= n; p.inv = p.brace ? 0.8 : 1.1; G.flash = 1; G.shake = Math.min(1.3, G.shake + 0.7); G.hitstop = 0.06;

function die(gaveUp) {

    showPanel(`<h2 style="color:var(--bad)">${gaveUp ? 'RUN ABANDONED' : 'SPLATTED'}</h2>
    <p>${gaveUp ? 'Fair enough.' : 'You made it to ' + (G.room % 5 === 0 ? G.bossName : 'room ' + G.room) + ' in ' + BIOMES[G.biome].name.toLowerCase() + '.'}</p>
    <div class="stats"><div>Room<b>${G.room}</b></div><div>Kills<b>${G.kills}</b></div><div>Time<b>${fmtT(G.time)}</b></div><div>Best room ever<b>${save.best}</b></div></div>
    ${takenList()}
    <button onclick="startRun()">New run</button> <button class="alt" onclick="startRun('${G.seed}')">Same seed again</button>

}
function win() {

  showPanel(`<h1 style="font-size:48px">ROOM CLEAR</h1><h2>The Void Eater is a puddle.</h2>
  <p>All fifteen rooms. That is the whole run.</p>
  <div class="stats"><div>Kills<b>${G.kills}</b></div><div>Time<b>${fmtT(G.time)}</b></div><div>Wins<b>${save.wins}</b></div></div>
  ${takenList()}
  <button onclick="startRun()">Another run</button> <p class="seed">seed ${G.seed}</p>`);
}
function fmtT(s) { s |= 0; return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function takenList() { if (!P.taken.length) return ''; return '<div class="bestiary">' + P.taken.map(id => { const u = UPG.find(u => u.id === id); return '<span>' + u.ico + ' ' + u.name + '</span>'; }).join('') + '</div>'; }

/* spawns come out of the portals a couple at a time */
function updateSpawns(dt) {
  if (G.bossQ && G.roomTime > 1.2) { spawn(G.bossQ, W / 2, 180, true); G.bossQ = null; }
  if (!G.spawnQ.length) return;
  G.spawnT -= dt;
  const cap = 6 + Math.floor(G.room * 0.9);
  if (G.spawnT <= 0 && ents.length < cap) {
    const n = G.room > 6 && rng() < 0.4 ? 2 : 1;
    for (let i = 0; i < n && G.spawnQ.length; i++) {
      const pr = pick(portals); pr.pulse = 0.6;
      spawn(G.spawnQ.shift(), pr.x + R(-20, 20), pr.y + R(-20, 20));
    }
    G.spawnT = Math.max(0.55, 1.7 - G.room * 0.07) * R(0.75, 1.25);
  }
}

function updateEnemy(e, dt) {
  e.t += dt; if (e.born > 0) e.born -= dt; if (e.flash > 0) e.flash -= dt; if (e.thornT > 0) e.thornT -= dt;
  const p = P;
  const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  let mx = 0, my = 0, spd = e.spd;

/* glooples push each other apart so they do not stack into one dot */
function separate() {
  for (let i = 0; i < ents.length; i++) for (let j = i + 1; j < ents.length; j++) {
    const a = ents[i], b = ents[j]; const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = (a.r + b.r) * 0.85;

function updateProjs(dt) {
  for (const q of projs) {

    if (q.kind === 'acid') { q.z = Math.sin(clamp(1 - q.life / 1.6, 0, 1) * Math.PI) * 60; }

    for (const r of rocks) if (Math.hypot(q.x - r.x, q.y - r.y) < r.r + q.r) { q.life = 0; }

    const hit = Math.hypot(q.x - P.x, q.y - P.y) < q.r + P.r && (q.kind !== 'acid');
    if (hit) {

/* =====================================================================
   LOOP
   ===================================================================== */
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.033, (now - last) / 1000); last = now;
