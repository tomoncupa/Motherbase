<style>
/* Colours and sizes are tokens, never numbers. shared/THEMING.md is the
   contract this app is obeying. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

header{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim)}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}

/* The save bar is fixed, so the page has to end above it: its height plus the
   home indicator, or the last card sits underneath the button. */
main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-10) + var(--safe-b))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-3)}

/* ── a desktop app, settled by Tom on 2026-09-06 ──
   It was built to the phone standards and read as one narrow ribbon down the
   middle of a monitor. On a wide window it is two columns: the typing on the
   left, the reading on the right, so the library is beside the label instead
   of a scroll below it. That matters because the library IS the comparison -
   it ranks every food against the amount you are looking at, and an answer
   you have to scroll to find is an answer you stop looking at.

   One column under 900px, unchanged, because a desktop app on a phone still
   has to stack and stay usable. */
@media (min-width:900px){
  .wrap{max-width:1180px;display:grid;align-items:start;
    grid-template-columns:minmax(0,7fr) minmax(0,8fr)}
  #cardLabel{grid-column:1;grid-row:1 / span 2}
  #cardAmounts{grid-column:2;grid-row:1}
  #cardFoods{grid-column:2;grid-row:2}
  /* Room to paste a whole label without scrolling inside the box. */
  textarea{min-height:calc(var(--tap) * 4)}
}

/* On a real monitor, three. Two columns still put the library under a tall
   amounts card and off the bottom of a 900px screen, which is the same
   problem the two columns were meant to fix, moved sideways. Type on the
   left, read the answer in the middle, compare on the right, all at once. */
@media (min-width:1300px){
  .wrap{max-width:1680px;grid-template-columns:minmax(0,5fr) minmax(0,5fr) minmax(0,6fr)}
  #cardLabel{grid-column:1;grid-row:1}
  #cardAmounts{grid-column:2;grid-row:1}
  #cardFoods{grid-column:3;grid-row:1}
}

/* Hover is allowed here now, and it is the affordance a mouse expects: on a
   phone app every one of these would be a control you cannot tell is live
   until you touch it. Guarded so a touch screen never inherits a stuck state. */
@media (hover:hover){
  .item:hover{background:var(--surface-3)}
  .chip:hover{border-color:var(--border-strong);color:var(--text-1)}
  .chip.on:hover{color:var(--accent-fg)}
  .btn:hover{border-color:var(--accent)}
  .x:hover{color:var(--text-1);background:var(--surface-3)}
}

.card{border-radius:var(--radius-lg);background:var(--surface-1);
  padding:var(--s-4);box-shadow:var(--e-1),var(--rim)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-2)}
.note{font-size:var(--f-1);color:var(--text-muted);line-height:var(--lh-body);margin-bottom:var(--s-3)}

label.fl{display:block;font-size:var(--f-1);font-weight:var(--w-med);
  color:var(--text-2);letter-spacing:var(--track-cap);
  margin:var(--s-3) 0 var(--s-1)}
input,textarea{width:100%;min-width:0;min-height:var(--tap);padding:var(--s-2) var(--s-3);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-1);font:inherit;font-size:var(--f-3)}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:calc(var(--tap) * 2.5);resize:vertical;line-height:var(--lh-body)}
.field label.fl{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s-2)}
/* Without min-width:0 a flex or grid child refuses to shrink under its
   content and the last column goes off the side of a phone. */
.grid2 > *,.grid3 > *{min-width:0}

/* The lookup line: the box you type into, and the button beside it. The button
   keeps its own width, so a long word in the box cannot squeeze it away. */
.look{display:flex;gap:var(--s-2)}
.look input{flex:1}
.look .btn{flex:0 0 auto}

.chips{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.chip{min-height:var(--tap);padding:0 var(--s-3);cursor:pointer;
  border:1px solid var(--border);border-radius:var(--radius-full);
  background:var(--surface-2);color:var(--text-2);font:inherit;font-size:var(--f-2)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.btn{min-height:var(--tap);padding:0 var(--s-3);cursor:pointer;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text-1);font:inherit}
.btn.wide{width:100%;display:block}
.btn.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);
  font-weight:var(--w-bold)}
.btn.quiet{color:var(--text-2)}

/* One amount. The big line is the answer to the only question being asked:
   how much of this goes on the plate. */
.pt{border-radius:var(--radius-md);background:var(--surface-2);
  padding:var(--s-3);margin-bottom:var(--s-2)}
.pt-h{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap)}
.pt-want{flex:1;min-width:0;font-size:var(--f-2);color:var(--text-2);
  letter-spacing:var(--track-cap);text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-a{font-family:var(--font-display);font-size:var(--f-6);font-weight:var(--w-bold);
  line-height:1.1;color:var(--text-1)}
.pt-m{font-family:var(--font-mono);font-size:var(--f-1);color:var(--text-2);
  margin-top:var(--s-1);line-height:var(--lh-body)}
.pt.dead .pt-a{color:var(--text-muted)}
.x{width:var(--tap);height:var(--tap);flex:0 0 auto;cursor:pointer;
  border:0;background:none;color:var(--text-muted);border-radius:var(--radius-sm)}

/* The line the picture is named by. Empty until there is a name, so an
   untitled card does not carry a blank bar. */
.shot-title{font-family:var(--font-display);font-size:var(--f-4);font-weight:var(--w-bold);
  line-height:1.2;margin-bottom:var(--s-3)}
.shot-title small{display:block;font-family:var(--font-body);font-size:var(--f-1);
  font-weight:var(--w-body);color:var(--text-muted);letter-spacing:0;margin-top:var(--s-1)}
.shot-title:empty{display:none}

.warnbox{border-radius:var(--radius-sm);padding:var(--s-3);background:var(--surface-2);
  color:var(--text-2);font-size:var(--f-2);line-height:var(--lh-body)}

.item{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3);
  min-height:var(--tap);border-radius:var(--radius-md);background:var(--surface-2);
  margin-bottom:var(--s-2);cursor:pointer;width:100%;border:0;
  color:inherit;font:inherit;text-align:left}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{display:block;color:var(--text-muted);font-size:var(--f-1)}
.item .fig{flex:0 0 auto;font-family:var(--font-mono);font-size:var(--f-1);
  color:var(--text-2);text-align:right}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:var(--s-3) var(--s-4) calc(var(--s-3) + var(--safe-b));
  background:var(--surface-1);box-shadow:var(--e-3)}
#bar .inner{max-width:1180px;margin:0 auto;display:flex;gap:var(--s-2)}
@media (min-width:1300px){ #bar .inner{max-width:1680px} }
#bar .inner .btn.go{flex:1}
</style>
</head>
<body>
<header>
  <div class="logo">FOOD<b>DÉX</b></div>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" onclick="openSettings()">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>
<main class="mb-scroll"><div class="wrap" id="main"></div></main>
<div id="bar"><div class="inner">
  <button class="btn quiet mb-press mb-tap" id="btnNew">NEW</button>
  <button class="btn go mb-press mb-tap" id="btnSave">SAVE TO MY FOODS</button>
</div></div>

<script>
/* ══════════════════ PORTION ══════════════════
   Type or paste a nutrition label, and it says how much of the thing you have
   to eat to hit a number - 50g of protein, 500 calories - and what any weight
   of it comes to. Then it saves those answers into the food library as
   ordinary servings, so logging it later is one tap.

   ── it writes food rows, and STATUS does too ──
   This used to be described here as a rule being bent. It is not one. Tom
   settled it on 2026-09-06: many writers is fine, and the thing that actually
   loses data is a writer that REPLACES a payload it did not fully read.

   Rec.set overwrites the whole payload, so an app that rebuilds a row out of
   its own idea of the fields silently deletes everything it does not know
   about. That has already happened here in one direction: this app wrote
   base.ca off a label, and STATUS's editor rebuilt base from its own nutrient
   list, which had no calcium in it, and dropped the figure without a word.
   One writer would have done the same damage to a field written by a newer
   build of itself.

   So the two things this app has to keep doing, and they are the rule rather
   than an excuse:

     · carry across every field it did not come to change. writeFood merges
       into the row as it stands rather than rebuilding it, so a field STATUS
       adds later and this app has never heard of survives a save from here.
     · never write a row it has not put on screen, and never write `meal`.
       A meal is a measurement, and measurements are STATUS's alone. */

/* Shown as FoodDéx since 2026-09-14. The id stays 'portion': the theme, the
   sound, the draft and every setting are saved under it, and the folder keeps
   its name so no link or other session's copy breaks. */
const APP = {
  id: 'portion',
  name: 'FoodDéx',
  icon: '◪',
  blurb: 'turn a label into the amounts you actually eat',
  types: ['food'],
};

/* Declaring `food` here is a fact about THIS page only: it stops records.js
   warning on every write. It does not reach STATUS, whose own page still
   declares itself the owner. */
Skins.load('../shared/skins.json').then(() => {
  Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true });
});
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
IO.register({
  app: APP.id, name: APP.name, types: APP.types,
  /* foods made in STATUS, from STATUS's own sheet tab */
  reads: { status: ['food'] },
  tables: [
    { name: 'Food', type: 'food', cols: [
      ['name', 'Name'], ['brand', 'Brand'], ['cat', 'Group'],
      ['base.amt', 'Serving'], ['base.unit', 'Unit'],
      ['base.kcal', 'Calories'], ['base.p', 'Protein'], ['base.c', 'Carbs'], ['base.f', 'Fat'],
      ['base.na', 'Sodium'], ['base.k', 'Potassium'], ['base.ca', 'Calcium'], ['base.caff', 'Caffeine'],
      ['base.price', 'Price'], ['base.src', 'Source'],
    ] },
  ],
});

const esc = s => UI.esc(String(s == null ? '' : s));
const numv = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : (d == null ? null : d); };
const r1 = n => Math.round(n * 10) / 10;
/* Pesos, and no decimals. Nothing here is priced to the centavo and a column
   of two-decimal numbers is harder to compare at a glance. */
const money = n => '₱' + Math.round(n);
function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }

/* The clock alone is not a unique key: two rows made in the same millisecond
   would be one row. The counter kills that inside a session, the random tail
   kills it across two devices that both call themselves `local`. */
let seq = 0;
const newId = () => Rec.USER + '-' + Date.now().toString(36) + '-' +
  (seq++).toString(36) + Math.random().toString(36).slice(2, 5);

/* Every number a food row can carry, in STATUS's own spelling, so what this
   app writes and what that app writes are the same shape. */
const NUTS = ['kcal', 'p', 'c', 'f', 'na', 'k', 'ca', 'caff'];
const WORD = { p: 'protein', c: 'carbs', f: 'fat', kcal: 'calories', amt: 'of it', pc: 'pieces' };

/* ══ what is on screen ══
   L is the label as typed. PORTIONS is what you want out of it. EDIT is the
   id of the food being changed, or null when this is a new one. */
/* ══ where the numbers came from ══
   Two foods can carry the same figures and not deserve the same trust: one was
   read off the pack in your hand, the other is a database's idea of the
   average of that food. Six months later nothing on the row says which, and
   that is when a figure gets believed more than it has earned.

   So the food remembers. It is set by whatever filled the boxes, and a figure
   changed by hand afterwards says so rather than quietly passing as the
   source's own. `fix` is that second state, kept in the same one field so
   there is nowhere for the two halves to disagree. */
const SRCS = {
  usda:         { tag: 'from the USDA', say: 'These came from the USDA food database, which publishes an average for the food, not for your pack.' },
  'usda-fixed': { tag: 'USDA, corrected', say: 'From the USDA food database, with at least one figure changed by hand since.' },
  label:        { tag: 'from a label', say: 'These were read off a nutrition label, so they are the pack you had in your hand.' },
  'label-fixed':{ tag: 'label, corrected', say: 'Read off a nutrition label, with at least one figure changed by hand since.' },
  typed:        { tag: 'typed in', say: 'These were typed in by hand.' },
};
const srcOf = fd => SRCS[(fd && fd.base && fd.base.src) || ''] || null;

const L = { name: '', brand: '', cat: '', amt: '100', unit: 'g',
  kcal: '', p: '', c: '', f: '', na: '', k: '', ca: '', caff: '', price: '', pc: '',
  /* Not a box on screen. It rides in here so the draft, the save and the
     load all carry it without a second place to keep it. */
  src: '' };
/* ── the first amount follows the food ──
   Tom, 2026-09-22: "The default entry for something should deliver either
   50 grams of protein or 50 grams of carbs whichever relevant." Asking how
   much rice hits 50 g of protein is a question with a silly answer (1.9 kg),
   and it used to be the question every food opened on. The first amount is
   now `auto`: 50 g of whichever of protein and carbs the food carries more
   of, re-read every time the numbers change, until he picks one himself. It
   is also the serving a new food offers first in STATUS. */
const leadMacro = () => ((numv(L.c) || 0) > (numv(L.p) || 0) ? 'c' : 'p');
/* Tom, the same day: "Some foods are just snacks or drinks, obviously those
   won't fall into the 50g rule." Nobody eats 50 g of carbs of crisps on
   purpose. A snack or a drink opens on one serving as the label prints it.
   A drink is known by its unit as well as its group, because a carton in
   millilitres is a drink whatever group it was filed under. */
const isSnackOrDrink = () => /^(ml|l|cl|fl ?oz)$/i.test(String(L.unit || '').trim())
  || /snack|drink|beverage/i.test(String(L.cat || ''));
const firstAmounts = () => [{ what: 'p', v: 50, auto: 1 }, { what: 'amt', v: 100 }];
let PORTIONS = firstAmounts();
let EDIT = null;
const INPUTS = {};

/* ══════════════ READING A LABEL ══════════════
   Labels are written by people, not machines, so this reads one the way you
   would: line by line, looking for the word, then for the first number AFTER
   the word. A number before the word is nearly always a percent daily value,
   and taking those was the first thing that went wrong.

   The exclusions matter as much as the words. A label says "Total Fat 5g" and
   then "Saturated Fat 2g" two lines later, and a plain search for "fat" picks
   the wrong one about half the time depending on the layout. */
const AVOID = {
  p: /$^/, na: /$^/, k: /$^/, ca: /$^/, caff: /$^/,
  f: /saturat|trans|mono|poly|unsaturat|of which/i,
  c: /sugar|fibre|fiber|starch|polyol|of which/i,
};
/* Built rather than typed: a non-breaking space is invisible in the source,
   and a label copied off a website is full of them. The comma goes too, or
   "1,470 kJ" reads as 1. */
const NBSP = new RegExp(String.fromCharCode(160), 'g');
const commas = t => String(t || '').replace(NBSP, ' ').replace(/(\d),(\d{3})\b/g, '$1$2');

function afterWord(line, word) {
  const m = new RegExp(word + '[^0-9\\n]{0,24}(\\d+(?:\\.\\d+)?)', 'i').exec(line);
  return m ? parseFloat(m[1]) : null;
}
function pick(lines, words, avoid) {
  for (let w = 0; w < words.length; w++) {
    for (let i = 0; i < lines.length; i++) {
      if (avoid && avoid.test(lines[i])) continue;
      if (!new RegExp(words[w], 'i').test(lines[i])) continue;
      const n = afterWord(lines[i], words[w]);
      if (n != null) return n;
    }
  }
  return null;
}
/* Energy is the one written four different ways. kcal wins wherever it turns
   up; kilojoules are converted rather than ignored, because plenty of labels
   here print only those. */
function energy(text, lines) {
  let m = /(\d+(?:\.\d+)?)\s*k\s*cal/i.exec(text);
  if (m) return parseFloat(m[1]);
  const c = pick(lines, ['calories', 'calorie', 'energy'], /kj/i);
  if (c != null) return c;
  m = /(\d+(?:\.\d+)?)\s*kj/i.exec(text);
  if (m) return Math.round(parseFloat(m[1]) / 4.184);
  return null;
}
/* Sodium, or the salt figure most labels outside the US print instead. They
   are not the same number: salt is sodium chloride and sodium is 39.3% of it
   by weight, so reading "Salt 0.06 g" straight into a milligram sodium field
   is out by a factor of about four hundred. Silently wrong is the worst kind,
   so the conversion is done here or the figure is left blank. */
function sodium(lines) {
  const direct = pick(lines, ['sodium'], null);
  if (direct != null) return direct;
  for (let i = 0; i < lines.length; i++) {
    if (!/salt/i.test(lines[i])) continue;
    const m = /salt[^0-9\n]{0,24}(\d+(?:\.\d+)?)\s*(mg|g)?/i.exec(lines[i]);
    if (!m) continue;
    const grams = (m[2] || 'g').toLowerCase() !== 'mg';
    return Math.round(parseFloat(m[1]) * (grams ? 393 : 0.393) * 10) / 10;
  }
  return null;
}
/* The serving the numbers are FOR. "1 cup (158g)" means 158g: the figure in
   brackets is the one to trust, because a cup is not a weight. */
function serving(text, lines) {
  const near = lines.filter(l => /serving|portion|per\b/i.test(l));
  for (let i = 0; i < near.length; i++) {
    const m = /\(\s*(\d+(?:\.\d+)?)\s*(g|ml)\s*\)/i.exec(near[i]);
    if (m) return { amt: parseFloat(m[1]), unit: m[2].toLowerCase() };
  }
  let m = /serving\s*size[^0-9\n]{0,25}(\d+(?:\.\d+)?)\s*(g|ml)/i.exec(text);
  if (m) return { amt: parseFloat(m[1]), unit: m[2].toLowerCase() };
  m = /per\s*(\d+(?:\.\d+)?)\s*(g|ml)\b/i.exec(text);
  if (m) return { amt: parseFloat(m[1]), unit: m[2].toLowerCase() };
  for (let i = 0; i < near.length; i++) {
    m = /(\d+(?:\.\d+)?)\s*(g|ml)\b/i.exec(near[i]);
    if (m) return { amt: parseFloat(m[1]), unit: m[2].toLowerCase() };
  }
  return null;
}
function readLabel(raw) {
  const text = commas(raw);
  const lines = text.split(/[\n;]+/).map(l => l.trim()).filter(Boolean);
  const o = {};
  o.kcal = energy(text, lines);
  o.p = pick(lines, ['protein'], AVOID.p);
  o.c = pick(lines, ['total carbohydrate', 'carbohydrates', 'carbohydrate', 'carbs', 'carb'], AVOID.c);
  o.f = pick(lines, ['total fat', 'fat'], AVOID.f);
  o.na = sodium(lines);
  o.k = pick(lines, ['potassium'], AVOID.k);
  o.ca = pick(lines, ['calcium'], AVOID.ca);
  o.caff = pick(lines, ['caffeine'], AVOID.caff);
  const s = serving(text, lines);
  if (s) { o.amt = s.amt; o.unit = s.unit; }
  /* A name is worth a guess but never worth overwriting one you typed. The
     first line with no digits in it is the product far more often than it is
     anything else. */
  for (let i = 0; i < lines.length && !o.name; i++) {
    if (/\d/.test(lines[i])) continue;
    if (lines[i].length < 2 || lines[i].length > 44) continue;
    if (/nutrition|amount per|per serving|serving size|ingredients|daily value/i.test(lines[i])) continue;
    o.name = lines[i];
  }
  return o;
}


/* ══════════════ LOOKING IT UP ══════════════
   The United States Department of Agriculture publishes the food composition
   figures most reference tables are copied from, and its search is open to
   anybody. For a plain food - rice, chicken breast, a banana - that is faster
   than hunting for a pack, and most plain food has no pack to read.

   It is a convenience, never a requirement. It needs a signal, and every box
   under it still works typed or pasted with none. What comes back is American:
   a branded pack in there is not the pack on your table, and the Philippine
   label wins whenever there is one in your hand. */
const USDA_URL = 'https://api.nal.usda.gov/fdc/v1/foods/search';
/* Their demo key, shared by everyone who has not asked for one: about ten
   lookups an hour from one connection. A free key of your own is a thousand,
   and goes in Settings. */
const USDA_DEMO = 'DEMO_KEY';
const usdaKey = () => String(Rec.setting(APP.id, 'usdaKey') || '').trim() || USDA_DEMO;

/* Where a result came from, in words. Their own names for these are initials
   and a table number, which tell you nothing about how much to trust it.
   The list is also the order: most trustworthy first, and the search below
   sorts by it. */
const USDA_WHERE = [
  ['Foundation', 'Measured in a lab'],
  ['SR Legacy', 'Standard reference'],
  ['Survey', 'A typical American dish'],
  ['Branded', 'Off a US pack'],
];
const usdaWhere = t => (USDA_WHERE.filter(w => String(t || '').indexOf(w[0]) === 0)[0] || [0, t || ''])[1];
function usdaRank(t) {
  for (let i = 0; i < USDA_WHERE.length; i++) if (String(t || '').indexOf(USDA_WHERE[i][0]) === 0) return i;
  return USDA_WHERE.length;
}

/* The ids each figure can arrive under, best first. Carbohydrate is worked out
   by difference on most foods and by summation on a few; energy is Atwater on
   some of the newer ones. Taking the first that is there beats picking one and
   leaving the food blank. */
const USDA_NUT = { kcal: [1008, 2048, 2047], p: [1003], c: [1005, 1050], f: [1004],
  na: [1093], k: [1092], ca: [1087], caff: [1057] };
/* Every figure they return is per 100 g, whatever serving a pack prints, so
   that is what goes in the serving boxes. */
function usdaNums(food) {
  const by = {};
  (food.foodNutrients || []).forEach(n => { if (by[n.nutrientId] == null) by[n.nutrientId] = n; });
  const out = {};
  Object.keys(USDA_NUT).forEach(key => {
    USDA_NUT[key].some(id => {
      const n = by[id];
      if (!n || typeof n.value !== 'number') return false;
      let v = n.value;
      /* A few of their energy rows are in kilojoules. Read as calories that is
         a food four times more expensive than it is. */
      if (key === 'kcal' && /kj/i.test(n.unitName || '')) v = v / 4.184;
      out[key] = (key === 'p' || key === 'c' || key === 'f') ? r1(v) : Math.round(v);
      return true;
    });
  });
  return out;
}
/* "Chicken, breast, boneless, skinless, raw" is how a catalogue writes a name
   and not how anybody says one. The commas go; the words and their order stay,
   because they are what tells two entries apart. You can type over it. */
const usdaName = d => String(d || '').replace(/,/g, ' ').replace(/\s+/g, ' ').trim();

/* The search box, the button and the results under them. The list is kept out
   of build() so it can redraw itself without redrawing the card. */
const lookBox = el('div');
let lookRun = 0;
function paintLook(kids) {
  lookBox.innerHTML = '';
  (kids || []).forEach(k => lookBox.appendChild(k));
  lookBox.style.marginTop = kids && kids.length ? 'var(--s-2)' : '';
}
function lookUp(q, btn) {
  q = String(q || '').trim();
  if (!q) return;
  /* Two searches in a row and the slow one can land last. The run number is
     what stops an answer to a question you have moved on from. */
  const run = ++lookRun;
  const said = btn.innerHTML;
  btn.innerHTML = '...'; btn.disabled = true;
  const done = () => { if (run === lookRun) { btn.innerHTML = said; btn.disabled = false; } };
  fetch(USDA_URL + '?api_key=' + encodeURIComponent(usdaKey()) +
        '&pageSize=10&query=' + encodeURIComponent(q))
    .then(r => {
      /* Out of lookups is not a broken app, and saying which it is decides
         whether you put a key in or give up on the button. */
      if (r.status === 429) throw new Error('rate');
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    })
    .then(d => {
      if (run !== lookRun) return;
      const foods = (d && d.foods) || [];
      if (!foods.length) {
        paintLook([el('div', 'note', 'Nothing came back for that. Try fewer words, and in English.')]);
        return Mobile.feedback('warn');
      }
      /* Their own ranking scores words rather than what you meant: "oats
         rolled" comes back led by a dinner roll. The lab figures for a plain
         food go to the top, in the order they arrived, because inside one kind
         their order IS relevance and this is not. */
      /* Ten come back and six are shown: a list long enough to scroll past
         pushes the paste box off the card, and the seventh guess at what you
         meant is not an answer anybody reads. */
      paintLook(foods.slice().sort((a, b) => usdaRank(a.dataType) - usdaRank(b.dataType)).slice(0, 6).map(fd => {
        const nums = usdaNums(fd);
        const b = el('button', 'item mb-press mb-tap');
        b.type = 'button';
        b.appendChild(el('div', 'nm', '<b>' + esc(usdaName(fd.description)) + '</b><small>' +
          esc([fd.brandOwner || fd.brandName || '', usdaWhere(fd.dataType)].filter(Boolean).join(' · ')) + '</small>'));
        b.appendChild(el('div', 'fig', nums.kcal == null ? '' : esc(nums.kcal + ' kcal') + '<br>per 100 g'));
        b.onclick = () => fillFromUsda(fd, nums);
        return b;
      }));
      Mobile.feedback('select');
    })
    .catch(e => {
      if (run !== lookRun) return;
      paintLook([]);
      Mobile.feedback('warn');
      UI.toast(String(e && e.message) === 'rate'
        ? 'That key is out of lookups for this hour. Settings has room for one of your own.'
        : 'Could not reach the food database. Paste the label instead.', { bad: true });
    })
    .then(done, done);
}
/* Tapping a result fills the label the way READ IT does, except that here the
   tap IS the choice, so a name you typed is replaced: you just picked a
   different food. A figure they do not carry is cleared rather than left
   behind, because a leftover number belongs to the food before this one. */
function fillFromUsda(fd, nums) {
  setField('name', usdaName(fd.description));
  const brand = fd.brandOwner || fd.brandName || '';
  if (brand) setField('brand', brand);
  setField('amt', 100);
  setField('unit', 'g');
  NUTS.forEach(k => setField(k, nums[k] == null ? '' : nums[k]));
  L.src = 'usda';
  /* Everything else the USDA sent, which until 2026-09-22 was downloaded and
     dropped. It has no boxes on this form and needs none: it rides in the
     draft beside the eight and lands on the row when the food is saved. */
  L.more = window.Nutrients ? Nutrients.fromUsda(fd.foodNutrients) : {};
  paintLook([]);
  paintPortions(); saveDraft();
  Mobile.feedback('success');
  UI.toast('Filled from the USDA, per 100 g. Check the numbers, and use the pack if you have one.');
}

/* ══ settings ══
   One tab of this app's own, for the key the lookup uses. */
function openSettings() {
  UI.settings(APP.id, [{ id: 'look', name: 'LOOKUP', draw: drawLookSettings }], { order: ['look', 'app', 'data'] });
}
function drawLookSettings(pane) {
  pane.innerHTML = '';
  const key = document.createElement('input');
  key.type = 'text';
  key.className = 'mb-input';
  key.placeholder = USDA_DEMO;
  key.value = String(Rec.setting(APP.id, 'usdaKey') || '');
  key.onchange = () => { Rec.setting(APP.id, 'usdaKey', key.value.trim()); UI.toast('Key saved'); };
  pane.appendChild(UI.row('Your USDA key', 'Leave it blank and the lookup uses the shared demo key.', key));
  pane.appendChild(el('div', 'note',
    'LOOK IT UP asks the United States Department of Agriculture for its figures. ' +
    'The shared key everybody starts on runs out after about ten lookups an hour. ' +
    'A free key of your own is a thousand an hour: ask for one at fdc.nal.usda.gov and it arrives by email.'));
}

/* ══════════════ THE SUM ══════════════
   One multiplier of the label serving, read from either end. "How much for
   50g of protein" divides the target by what one serving carries. "What is in
   50g" divides the weight by what one serving weighs. Same number. */
const pieces = n => r1(n) + ' piece' + (r1(n) === 1 ? '' : 's');
function work(pt) {
  if (pt.frozen) return { want: pt.label, mult: pt.mult };
  const amt = numv(L.amt);
  const want = pt.what === 'kcal' ? r1(pt.v) + ' kcal'
    : pt.what === 'amt' ? r1(pt.v) + ' ' + (L.unit.trim() || 'units')
    : pt.what === 'pc' ? pieces(pt.v)
    : r1(pt.v) + ' g ' + WORD[pt.what];
  if (!(amt > 0)) return { want: want, why: 'the label serving amount is missing' };
  if (pt.what === 'amt') return { want: want, mult: pt.v / amt };
  /* A piece is a weight you did not have to look up. An egg, a thigh, a
     banana: you count them, you do not weigh them, and the label is in grams.
     Saying what one weighs once turns counting back into weighing. */
  if (pt.what === 'pc') {
    const one = numv(L.pc);
    if (!(one > 0)) return { want: want, why: 'nothing says what one piece weighs' };
    return { want: want, mult: pt.v * one / amt };
  }
  const per = numv(L[pt.what]);
  if (!(per > 0)) return { want: want, why: 'the label has no ' + WORD[pt.what] + ' figure' };
  return { want: want, mult: pt.v / per };
}
/* The other way: a serving already saved on a food, turned back into the
   question that made it, so loading a food and correcting its label
   recalculates rather than freezing. Anything this app did not write - a
   Bottle, a Scoop, whatever STATUS holds - is kept exactly as it is. */
function unlabel(s, base) {
  let m = /^([\d.]+) g (protein|carbs|fat)$/.exec(s.label);
  if (m) return { what: { protein: 'p', carbs: 'c', fat: 'f' }[m[2]], v: parseFloat(m[1]) };
  m = /^([\d.]+) kcal$/.exec(s.label);
  if (m) return { what: 'kcal', v: parseFloat(m[1]) };
  m = /^([\d.]+) pieces?$/.exec(s.label);
  if (m) return { what: 'pc', v: parseFloat(m[1]) };
  m = /^([\d.]+) (.+)$/.exec(s.label);
  if (m && m[2] === String(base.unit || '')) return { what: 'amt', v: parseFloat(m[1]) };
  return { frozen: 1, label: s.label, mult: s.mult };
}
/* What one piece of a saved food weighs, read back out of the "1 piece"
   serving rather than out of a field of its own. A piece IS a serving, so
   storing it as one means STATUS keeps it, logs from it and exports it, and
   there is no second place for the number to disagree from. */
function pieceOf(fd) {
  const s = (fd.serves || []).find(x => /^1 piece$/.test(x.label));
  return s ? r1(s.mult * (numv(fd.base.amt, 0) || 0)) : null;
}

/* ══════════════ THE SCREEN ══════════════
   Built once. Only the two things that change get redrawn, and never the box
   being typed into - rebuilding an input takes the cursor with it. */
const M = document.getElementById('main');
const ptBox = el('div'), foodBox = el('div'), groupBox = el('div', 'chips');
const shotArea = el('div'), shotTitle = el('div', 'shot-title');
const srcNote = el('div', 'note');
const dupNote = el('div', 'warnbox');

/* The five groups Tom sorts food into. A fixed list rather than a text box,
   because typing "Protein" and "protein" on two different days is how a list
   of five groups quietly becomes a list of nine. Tapping the one that is on
   turns it off, so no group is a real answer too. */
const GROUPS = ['Protein', 'Carbs', 'Snacks', 'Drinks', 'Fruits/Veggies', 'Seasonings/Marinades'];
function paintGroups() {
  groupBox.innerHTML = '';
  /* A food grouped somewhere else - by STATUS, or by an older version of this
     list - keeps its own chip on the end. Without that, loading it and saving
     it would silently move it into no group at all. */
  const list = GROUPS.concat(L.cat && GROUPS.indexOf(L.cat) < 0 ? [L.cat] : []);
  list.forEach(g => {
    const b = el('button', 'chip mb-press mb-tap' + (L.cat === g ? ' on' : ''), esc(g));
    b.onclick = () => { L.cat = L.cat === g ? '' : g; paintGroups(); saveDraft(); Mobile.haptic('select'); };
    groupBox.appendChild(b);
  });
}

function textField(key, label, opts) {
  const w = el('div', 'field');
  w.appendChild(el('label', 'fl', label));
  const i = document.createElement('input');
  i.type = 'text';
  if (!(opts && opts.text)) { i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*'); }
  if (opts && opts.ph) i.placeholder = opts.ph;
  i.value = L[key] == null ? '' : String(L[key]);
  i.addEventListener('input', () => {
    L[key] = i.value;
    /* Only the figures. Renaming a food or grouping it does not touch where
       its numbers came from. */
    if (NUTS.indexOf(key) > -1 || key === 'amt') handTyped();
    paintPortions(); saveDraft();
  });
  INPUTS[key] = i;
  w.appendChild(i);
  return w;
}
/* Setting .value in code fires no input event, so everything that fills a
   field from outside goes through here and then repaints by hand. */
function setField(key, v) {
  L[key] = v == null ? '' : String(v);
  if (INPUTS[key]) INPUTS[key].value = L[key];
  /* The group is chips, not a box, so it has to be repainted rather than
     assigned. Everything that fills the form from outside comes through here,
     so this is the one place that needs to know. */
  if (key === 'cat') paintGroups();
}

/* A figure changed by hand: the first one on an empty form makes this a typed
   food, and one on top of a lookup or a label marks that source corrected. */
function handTyped() {
  if (!L.src) { L.src = 'typed'; return; }
  if (L.src === 'usda' || L.src === 'label') L.src = L.src + '-fixed';
}

function build() {
  M.innerHTML = '';

  /* ── the label ── */
  const c1 = el('div', 'card');
  c1.id = 'cardLabel';
  c1.appendChild(el('h2', null, 'THE LABEL'));

  /* -- looking it up --
     First in the card because it is the shorter road: for a plain food it
     fills every box below without a pack in your hand. Pasting sits under it,
     unchanged, and is the one that still works with no signal. */
  c1.appendChild(el('div', 'note', 'Look up a plain food, or paste a label. The lookup asks the United States Department of Agriculture and answers per 100 g, so it needs a signal, and what it knows is American.'));
  const lookRow = el('div', 'look');
  const lookIn = document.createElement('input');
  lookIn.type = 'text';
  lookIn.placeholder = 'Chicken breast raw';
  const lookBtn = el('button', 'btn mb-press mb-tap', 'LOOK IT UP');
  lookBtn.type = 'button';
  lookBtn.onclick = () => lookUp(lookIn.value, lookBtn);
  /* Enter searches. Typing a food and then reaching for the mouse is a step
     this box does not need, and on a phone it is the key the keyboard offers. */
  lookIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lookUp(lookIn.value, lookBtn); } });
  lookRow.appendChild(lookIn);
  lookRow.appendChild(lookBtn);
  c1.appendChild(lookRow);
  c1.appendChild(lookBox);

  c1.appendChild(el('label', 'fl', 'Or paste the label'));
  c1.appendChild(el('div', 'note', 'Paste it off the pack or a website and press READ IT, or just type the numbers. Check every one before you save: reading a label is a guess, not a scan.'));
  const ta = document.createElement('textarea');
  ta.placeholder = 'Serving size 100 g\nEnergy 165 kcal\nProtein 31 g\nTotal Carbohydrate 0 g\nTotal Fat 3.6 g';
  c1.appendChild(ta);
  const readBtn = el('button', 'btn wide quiet mb-press mb-tap', 'READ IT');
  readBtn.style.marginTop = 'var(--s-2)';
  readBtn.onclick = () => {
    const got = readLabel(ta.value);
    let n = 0;
    /* Read before the fields are filled: setField does not count as typing,
       but this label IS now where the numbers come from. */
    /* A label's numbers replace the USDA's, so the USDA's extra figures no
       longer describe this food and go with them. */
    if (Object.keys(got).some(k => got[k] != null && k !== 'name')) { L.src = 'label'; L.more = {}; }
    Object.keys(got).forEach(k => {
      if (got[k] == null) return;
      if (k === 'name' && L.name.trim()) return;
      setField(k, got[k]); n++;
    });
    paintPortions(); saveDraft();
    Mobile.feedback(n ? 'select' : 'warn');
    if (n) UI.toast('Read ' + n + ' number' + (n === 1 ? '' : 's') + '. Check them.');
    else UI.toast('Could not find anything in that. Type it in.', { bad: true });
  };
  c1.appendChild(readBtn);

  c1.appendChild(textField('name', 'Name', { text: 1, ph: 'Chicken breast' }));
  /* Caught while you type rather than at the save, which is late: by then you
     have filled in a whole label you did not need to. */
  dupNote.style.marginTop = 'var(--s-2)';
  dupNote.style.display = 'none';
  c1.appendChild(dupNote);
  c1.appendChild(textField('brand', 'Brand or place', { text: 1 }));
  c1.appendChild(el('label', 'fl', 'Group'));
  c1.appendChild(groupBox);
  paintGroups();

  c1.appendChild(el('label', 'fl', 'One serving, as printed'));
  const g2 = el('div', 'grid2');
  g2.appendChild(textField('amt', 'Amount'));
  g2.appendChild(textField('unit', 'Unit', { text: 1 }));
  c1.appendChild(g2);

  /* ── raw, cooked, grilled, air-fried ──
     Each of those is its own entry, typed from its own numbers. There was a
     generator here that made them for you from one shrink figure, and Tom cut
     it on 2026-09-05: if you are reading a label by hand anyway, picking
     "grilled" off a list is a tap that buys you nothing, and one shrink
     figure cannot be true for every pot and every pan. Separate manual
     entries are the honest version and they are less app.

     What survives is the naming, which is yours: "Chicken thigh grilled" is a
     food, and the duplicate check below stops you making it twice. */
  c1.appendChild(textField('pc', 'One piece weighs, if it comes in pieces', {}));
  c1.appendChild(el('div', 'note', 'An egg, a thigh, a banana. Fill this in and you can ask for amounts in pieces instead of grams, and "1 piece" is saved as a serving so STATUS can log it that way too.'));

  const g3 = el('div', 'grid3');
  g3.appendChild(textField('kcal', 'Calories'));
  g3.appendChild(textField('p', 'Protein g'));
  g3.appendChild(textField('c', 'Carbs g'));
  g3.appendChild(textField('f', 'Fat g'));
  g3.appendChild(textField('na', 'Sodium mg'));
  g3.appendChild(textField('k', 'Potassium mg'));
  g3.appendChild(textField('ca', 'Calcium mg'));
  g3.appendChild(textField('caff', 'Caffeine mg'));
  g3.appendChild(textField('price', 'Price'));
  c1.appendChild(g3);

  /* Under the figures, because it is about the figures above it and nothing
     else on the card. Empty until something has filled them, so a blank form
     does not claim a source it has not got. */
  srcNote.style.marginTop = 'var(--s-2)';
  c1.appendChild(srcNote);

  const kcalBtn = el('button', 'btn wide quiet mb-press mb-tap', 'Work calories out from the macros');
  kcalBtn.style.marginTop = 'var(--s-2)';
  kcalBtn.onclick = () => {
    setField('kcal', Math.round((numv(L.p, 0) || 0) * 4 + (numv(L.c, 0) || 0) * 4 + (numv(L.f, 0) || 0) * 9));
    paintPortions(); saveDraft();
    UI.toast('Calories worked out from the macros');
  };
  c1.appendChild(kcalBtn);
  M.appendChild(c1);

  /* ── the amounts ── */
  const c2 = el('div', 'card');
  c2.id = 'cardAmounts';
  c2.appendChild(el('h2', null, 'THE AMOUNTS'));
  c2.appendChild(el('div', 'note', 'How much of it you need, and what that comes to. Each one is saved with the food as a serving, so logging it later is one tap.'));
  /* What the picture is of: the heading and the amounts, and none of the
     controls. It is the real element rather than a second drawing of one, so
     it cannot drift from what is on screen - it just stops short of the
     buttons, which are not worth photographing. */
  shotArea.appendChild(shotTitle);
  shotArea.appendChild(ptBox);
  c2.appendChild(shotArea);
  c2.appendChild(addRow());
  c2.appendChild(extraRow(shotArea));
  M.appendChild(c2);


  /* ── what is already in there ── */
  const c3 = el('div', 'card');
  c3.id = 'cardFoods';
  c3.appendChild(el('h2', null, 'YOUR FOODS'));
  c3.appendChild(el('div', 'note', 'The same library STATUS logs from. Ranked against the first amount above, so this is also the comparison: what it takes, and what it costs, to get the same thing out of each one.'));
  c3.appendChild(searchInput);
  c3.appendChild(listHead);
  c3.appendChild(foodBox);
  M.appendChild(c3);

  paintPortions();
}

/* ══════════════ HANDING THE ENTRY TO SOMEBODY ══════════════
   The other half of what this app is for. You read a label once; after that
   the entry should be usable everywhere, not only here. Two shapes, because
   the two readers are different people:

     as words   for a person. A client pastes it into MyFitnessPal, Cronometer
                or whatever they use, one field at a time, and the fields are
                in the order those apps ask for them.
     as a row   for a spreadsheet. Tab separated, so it drops straight into
                Sheets or Excel across the columns rather than into one cell.

   Nothing is invented on the way out: a figure the label never carried is
   left blank rather than written as a zero, because a zero is a claim. */
function entryText() {
  const u = L.unit.trim() || 'serving';
  const line = (k, v, unit) => v == null || v === '' ? null : k + ': ' + v + (unit ? ' ' + unit : '');
  const out = [
    [L.name.trim(), L.brand.trim()].filter(Boolean).join(' — '),
    line('Serving size', r1(numv(L.amt, 0)), u),
    line('Calories', numv(L.kcal) == null ? '' : Math.round(numv(L.kcal))),
    line('Protein', numv(L.p), 'g'),
    line('Carbs', numv(L.c), 'g'),
    line('Fat', numv(L.f), 'g'),
    line('Sodium', numv(L.na), 'mg'),
    line('Potassium', numv(L.k), 'mg'),
    line('Calcium', numv(L.ca), 'mg'),
    line('Caffeine', numv(L.caff), 'mg'),
  ].filter(Boolean);
  const one = numv(L.pc);
  if (one > 0) out.push('One piece: ' + r1(one) + ' ' + u);
  const serves = PORTIONS.map(pt => { const w = work(pt); return w.mult > 0 ? w : null; }).filter(Boolean);
  if (serves.length) {
    out.push('');
    out.push('Portions:');
    serves.forEach(w => out.push('  ' + w.want + ' = ' + r1(w.mult * numv(L.amt, 0)) + ' ' + u));
  }
  return out.join('\n');
}
const COLS = [['Name', () => L.name.trim()], ['Brand', () => L.brand.trim()], ['Group', () => L.cat.trim()],
  ['Serving', () => r1(numv(L.amt, 0))], ['Unit', () => L.unit.trim() || 'serving'],
  ['Calories', () => numv(L.kcal) == null ? '' : Math.round(numv(L.kcal))],
  ['Protein', () => numv(L.p)], ['Carbs', () => numv(L.c)], ['Fat', () => numv(L.f)],
  ['Sodium', () => numv(L.na)], ['Potassium', () => numv(L.k)], ['Calcium', () => numv(L.ca)],
  ['Caffeine', () => numv(L.caff)], ['Price', () => numv(L.price)],
  ['One piece', () => numv(L.pc)],
  ['Portions', () => PORTIONS.map(pt => { const w = work(pt); return w.mult > 0 ? w.want + ' = ' + r1(w.mult * numv(L.amt, 0)) : null; }).filter(Boolean).join('; ')]];
function entryRow(withHead) {
  const cell = v => v == null ? '' : String(v).replace(/[\t\n]/g, ' ');
  const body = COLS.map(c => cell(c[1]())).join('\t');
  return withHead ? COLS.map(c => c[0]).join('\t') + '\n' + body : body;
}

/* Copy, and if the browser will not allow it - a page opened straight from a
   folder often will not - show the text with everything selected so it is one
   keystroke away instead of a dead button.

   Named copyOut and not handOver on purpose: shared/io.js has its own
   IO.handOver, which hands a PICTURE to the operating system. Two functions
   with one name doing two jobs is a reading trap for whoever comes next. */
function copyOut(what, text) {
  const fallback = () => UI.dialog({
    title: what.toUpperCase(), width: 520,
    body: b => {
      b.appendChild(el('div', 'note', 'Select all and copy. The browser would not do it for you here.'));
      const t = document.createElement('textarea');
      t.value = text; t.style.minHeight = 'calc(var(--tap) * 5)';
      b.appendChild(t);
      setTimeout(() => { t.focus(); t.select(); }, 60);
    },
    actions: [{ label: 'DONE' }],
  });
  if (!navigator.clipboard || !navigator.clipboard.writeText) return fallback();
  navigator.clipboard.writeText(text).then(
    () => { Mobile.feedback('success'); UI.toast(what + ' copied. Paste it anywhere.'); },
    fallback);
}

function extraRow(card) {
  const w = el('div');

  const guard = fn => () => {

  /* ── one food, as a file a client can open ──
     Tom, 2026-09-22: "Possible to export an entry as a file that I can send
     to a client?" Clients have STATUS and not this app, so the file is the
     shape STATUS already knows how to take in: a backup holding one row. On
     their side it is Settings, DATA, Restore, which fills in what is missing
     and never overwrites anything newer. No new importer, so nothing new to
     break on a phone nobody here can test.

     It is the food as saved, so it is saved first. What is his rather than
     the food's stays behind: how often he eats it, his receipt photo, when
     he last logged it, and what he paid. Sending the same food again after
     correcting it updates their copy, because it is the same row. */
  const asFile = el('button', 'btn wide quiet mb-press mb-tap', 'Save as a file to send a client');
  asFile.style.marginBottom = 'var(--s-2)';

      about: 'One food for STATUS. Open STATUS, Settings, DATA, Restore, and pick this file. It adds the food and changes nothing else.',
      rows: [Object.assign({}, row, { payload: pay })],
    };
    const name = (pay.name || 'food').replace(/[\/:*?"<>|]+/g, ' ').trim() + ' - food for STATUS.json';
    const a = el('a');

  const share = el('button', 'btn wide quiet mb-press mb-tap', 'Save this as a picture');

       card and the picture changes with it. */

/* Adding an amount. The chip says what you are counting, the box says how
   much of it. Both defaults are his: 50g of protein, 50g of the thing. */
let addWhat = 'p', addVal = '50';
function addRow() {
  const w = el('div');
  w.style.marginTop = 'var(--s-3)';
  w.appendChild(el('label', 'fl', 'Add an amount'));
  const chips = el('div', 'chips');
  const paint = () => {
    chips.innerHTML = '';
    [['p', 'Protein'], ['c', 'Carbs'], ['f', 'Fat'], ['kcal', 'Calories'], ['amt', 'Weight'], ['pc', 'Pieces']].forEach(k => {
      const b = el('button', 'chip mb-press mb-tap' + (addWhat === k[0] ? ' on' : ''), k[1]);
      b.onclick = () => { addWhat = k[0]; paint(); };
      chips.appendChild(b);
    });
  };
  paint();
  w.appendChild(chips);
  const g = el('div', 'grid2');
  g.style.marginTop = 'var(--s-2)';
  const i = document.createElement('input');
  i.type = 'text'; i.inputMode = 'decimal'; i.setAttribute('pattern', '[0-9.]*'); i.value = addVal;
  i.addEventListener('input', () => { addVal = i.value; });
  const b = el('button', 'btn mb-press mb-tap', 'ADD');
  b.onclick = () => {
    const v = numv(i.value);
    if (!(v > 0)) return UI.toast('How much?', { bad: true });
    /* The same question twice is the same answer. Asking again replaces it
       rather than stacking a second copy underneath. */
    PORTIONS = PORTIONS.filter(p => !(p.what === addWhat && p.v === v)).concat([{ what: addWhat, v: v }]);
    paintPortions(); saveDraft();
    Mobile.feedback('select');
  };
  g.appendChild(i); g.appendChild(b);
  w.appendChild(g);

  /* The amounts worth one tap. A teaspoon and a tablespoon are here because
     nobody weighs 100 g of soy sauce, and a whole group of his foods is
     seasonings and marinades. The gram figures are the standard ones: 5 ml
     and 15 ml, which for anything watery is 5 g and 15 g. */
  const quick = el('div', 'chips');
  quick.style.marginTop = 'var(--s-2)';
  [['1 tsp', 5], ['1 tbsp', 15], ['30', 30], ['100', 100], ['200', 200]].forEach(q => {
    const c = el('button', 'chip mb-press mb-tap', esc(q[0]));
    c.onclick = () => {
      PORTIONS = PORTIONS.filter(p => !(p.what === 'amt' && p.v === q[1])).concat([{ what: 'amt', v: q[1] }]);
      paintPortions(); saveDraft(); Mobile.feedback('select');
    };
    quick.appendChild(c);
  });
  w.appendChild(el('label', 'fl', 'Or one of these, by weight'));
  w.appendChild(quick);
  return w;
}

function paintPortions() {
  PORTIONS.forEach(pt => {
    if (!pt.auto) return;
    if (isSnackOrDrink()) { pt.what = 'amt'; pt.v = numv(L.amt) > 0 ? numv(L.amt) : 100; }
    else { pt.what = leadMacro(); pt.v = 50; }
  });
  /* The picture needs to say what it is of. On screen this is the same
     information as the Name box two inches up, so it hides until there is
     something to say. */
  const nm = L.name.trim();
  shotTitle.innerHTML = nm
    ? esc(nm) + '<small>' + esc([L.brand.trim(),
        (numv(L.amt) > 0 ? 'label serving ' + r1(numv(L.amt)) + ' ' + (L.unit.trim() || '') : ''),
        (numv(L.kcal) != null ? Math.round(numv(L.kcal)) + ' kcal' : ''),
        (numv(L.p) != null ? r1(numv(L.p)) + ' g protein' : '')]
        .filter(x => String(x).trim()).join(' · ')) + '</small>'
    : '';

  const src = SRCS[L.src] || null;
  srcNote.innerHTML = src ? esc(src.say) : '';
  srcNote.style.display = src ? '' : 'none';

  /* The same name as something you already have, said before you have typed
     a label into a row that is about to become a second copy of one. */
  const dup = Rec.hydrated && nm ? twinOf(nm) : null;
  if (dup) {
    dupNote.style.display = '';
    dupNote.innerHTML = 'You already have <b>' + esc(dup.name) + '</b>. Saving will offer to update that one.';
    dupNote.onclick = () => loadFood(dup);
    dupNote.style.cursor = 'pointer';
  } else { dupNote.style.display = 'none'; }

  ptBox.innerHTML = '';
  if (!PORTIONS.length) {
    ptBox.appendChild(el('div', 'warnbox', 'Nothing yet. Add one below. 50 g of protein is the usual first question.'));
    return;
  }
  PORTIONS.forEach((pt, idx) => {
    const w = work(pt);
    const row = el('div', 'pt' + (w.mult > 0 ? '' : ' dead'));
    const head = el('div', 'pt-h');
    head.appendChild(el('span', 'pt-want', esc(w.want) + (pt.frozen ? ' · as saved' : '')));
    const x = el('button', 'x mb-press mb-tap', '');
    x.setAttribute('aria-label', 'Remove ' + w.want);
    x.dataset.icon = 'del';
    x.onclick = () => {
      const gone = PORTIONS[idx];
      PORTIONS = PORTIONS.filter((_, i) => i !== idx);
      paintPortions(); saveDraft();
      Mobile.haptic('warn');
      UI.undo('removed <b>' + esc(w.want) + '</b>',
        () => { PORTIONS = PORTIONS.concat([gone]); paintPortions(); saveDraft(); });
    };
    head.appendChild(x);
    row.appendChild(head);

    if (!(w.mult > 0)) {
      row.appendChild(el('div', 'pt-a', '—'));
      row.appendChild(el('div', 'pt-m', esc(w.why || 'nothing to work with yet')));
    } else {
      row.appendChild(el('div', 'pt-a', r1(w.mult * numv(L.amt, 0)) + ' ' + esc(L.unit.trim() || 'units')));
      const bits = [];
      if (numv(L.kcal) != null) bits.push(Math.round(numv(L.kcal) * w.mult) + ' kcal');
      ['p', 'c', 'f'].forEach(n => { if (numv(L[n]) != null) bits.push(r1(numv(L[n]) * w.mult) + n); });
      /* The price is the coaching answer, not a footnote: "50 g of protein
         costs ₱42 from this and ₱78 from that" is the whole argument about
         whether eating properly is expensive. */
      if (numv(L.price)) bits.push(money(numv(L.price) * w.mult));
      /* How many of them, where a piece is a thing you can count. Not shown
         on the amount that asked in pieces, which would only repeat itself. */
      const one = numv(L.pc);
      if (one > 0 && numv(L.amt) > 0 && pt.what !== 'pc') bits.push(pieces(w.mult * numv(L.amt) / one));
      bits.push(r1(w.mult) + ' × the label serving');
      row.appendChild(el('div', 'pt-m', esc(bits.join(' · '))));
    }
    ptBox.appendChild(row);
    if (window.Icons) Icons.paint(row);
  });

  /* The library below is ranked against the first amount, so it follows when
     that changes — and stays still while you are only typing a label, which
     is most of the time and would otherwise re-sort forty rows per keystroke. */
  const w = JSON.stringify(against());
  if (w !== lastWant) { lastWant = w; if (Rec.hydrated) paintFoods(); }
}
let lastWant = '';

/* ══════════════ THE LIBRARY, AS A COMPARISON ══════════════
   This list used to just say what was in there. It is more useful ranked
   against the amount at the top of the screen: for 50g of protein, what does
   each food take, cost and come to. That IS the comparison — every food at
   once, rather than two picked by hand — and it is the answer to the only
   nutrition argument that ever matters, which is that eating properly is
   supposed to be expensive.

   A food with no protein figure simply cannot answer the question and drops
   to the bottom rather than pretending to. */
let listCat = '', listSort = 'need';
const listHead = el('div');

function against() {
  /* The first live amount is the question the list is asked. Whatever is at
     the top of the amounts card is what you are thinking about. */
  for (let i = 0; i < PORTIONS.length; i++) if (!PORTIONS[i].frozen) return PORTIONS[i];
  return { what: 'p', v: 50 };
}
function needOf(fd, pt) {
  const b = fd.base || {};
  const amt = numv(b.amt, 0) || 0;
  if (!(amt > 0)) return null;
  const per = pt.what === 'amt' ? amt : (numv(b[pt.what], 0) || 0);
  if (!(per > 0)) return null;
  const mult = pt.v / per;
  return { mult: mult, amt: mult * amt, unit: b.unit || '',
    kcal: (numv(b.kcal, 0) || 0) * mult, price: (numv(b.price, 0) || 0) * mult };
}

/* The search box is built once and kept, because rebuilding it on every
   keystroke would take the cursor out of it. */
let listQ = '';
const searchInput = document.createElement('input');
searchInput.type = 'text';
searchInput.placeholder = 'Search your foods';
searchInput.addEventListener('input', () => { listQ = searchInput.value; paintFoods(); });

function paintList() {
  listHead.innerHTML = '';
  const pt = against();
  const want = pt.what === 'kcal' ? r1(pt.v) + ' kcal'
    : pt.what === 'amt' ? r1(pt.v) + ' by weight'
    : r1(pt.v) + ' g of ' + WORD[pt.what];
  listHead.appendChild(el('label', 'fl', 'What each one takes for ' + esc(want)));

  const cats = el('div', 'chips');
  [''].concat(GROUPS).forEach(g => {
    const b = el('button', 'chip mb-press mb-tap' + (listCat === g ? ' on' : ''), esc(g || 'All'));
    b.onclick = () => { listCat = g; paintList(); paintFoods(); };
    cats.appendChild(b);
  });
  listHead.appendChild(cats);

  const sorts = el('div', 'chips');
  sorts.style.marginTop = 'var(--s-2)';
  [['need', 'Least of it'], ['kcal', 'Fewest calories'], ['price', 'Cheapest'], ['uses', 'Most used']].forEach(s => {
    const b = el('button', 'chip mb-press mb-tap' + (listSort === s[0] ? ' on' : ''), s[1]);
    b.onclick = () => { listSort = s[0]; paintList(); paintFoods(); };
    sorts.appendChild(b);
  });
  listHead.appendChild(sorts);

  /* Two rows with the same name is the failure this app can cause, so it is
     the failure it has to report. Named, counted, and pointed at, rather than
     a number in a corner. */
  const seen = {}, dups = [];
  Object.values(Rec.map('food')).forEach(f => {
    const k = String(f.name).trim().toLowerCase().replace(/\s+/g, ' ');
    if (seen[k]) { if (dups.indexOf(seen[k]) < 0) dups.push(seen[k]); } else seen[k] = f.name;
  });
  if (dups.length) {
    const w = el('div', 'warnbox');
    w.style.marginTop = 'var(--s-3)';
    w.innerHTML = 'Two or more foods share a name: <b>' + dups.map(esc).join('</b>, <b>') +
      '</b>. Open each and give them different names, or delete the one you do not log from.';
    listHead.appendChild(w);
  }
}

function paintFoods() {
  paintList();
  const pt = against();
  let all = Object.values(Rec.map('food'));
  const total = all.length;
  if (listCat) all = all.filter(f => (f.cat || '') === listCat);
  const q = listQ.trim().toLowerCase();
  if (q) all = all.filter(f => (f.name + ' ' + (f.brand || '') + ' ' + (f.cat || '')).toLowerCase().indexOf(q) > -1);

  const rows = all.map(fd => ({ fd: fd, need: needOf(fd, pt) }));
  const key = { need: r => r.need.amt, kcal: r => r.need.kcal, price: r => r.need.price };
  rows.sort((a, b) => {
    /* Anything that cannot answer the question goes last, whatever the sort.
       A food with no price is not the cheapest one. */
    const ga = a.need && (listSort !== 'price' || a.need.price > 0);
    const gb = b.need && (listSort !== 'price' || b.need.price > 0);
    if (ga !== gb) return ga ? -1 : 1;
    if (listSort === 'uses' || !ga) return (b.fd.uses || 0) - (a.fd.uses || 0) ||
      String(a.fd.name).localeCompare(String(b.fd.name));
    return key[listSort](a) - key[listSort](b);
  });

  foodBox.innerHTML = '';
  if (!rows.length) {
    foodBox.appendChild(el('div', 'warnbox', listCat
      ? 'Nothing in ' + esc(listCat) + ' yet.'
      : 'Nothing saved yet. Anything you save here shows up in STATUS as well, because it is the same library.'));
    return;
  }
  /* Everything, not a first forty. This is the whole library and the only
     place it can be looked at, so a cap would hide exactly the old row you
     came here to fix. Search is what makes a long list usable. */
  rows.forEach(r => {
    const fd = r.fd, b = el('div', 'item mb-press mb-tap');
    const one = pieceOf(fd);
    const src = srcOf(fd);
    const sub = [fd.cat, fd.brand,
      (fd.base.amt == null ? '' : r1(fd.base.amt) + ' ' + (fd.base.unit || '') + ' label'),
      (one ? 'a piece is ' + one + ' ' + (fd.base.unit || '') : ''),
      (src ? src.tag : '')]
      .filter(x => String(x).trim()).join(' · ');
    const fig = r.need
      ? r1(r.need.amt) + ' ' + esc(r.need.unit) + '<br>' +
        [Math.round(r.need.kcal) + ' kcal', r.need.price > 0 ? money(r.need.price) : '']
          .filter(Boolean).join(' · ')
      : '<span style="color:var(--text-muted)">no figure</span>';
    b.innerHTML = '<span class="nm">' + esc(fd.name) + '<small>' + esc(sub) + '</small></span>' +
      '<span class="fig">' + fig + '</span>';
    b.onclick = () => loadFood(fd);
    const x = el('button', 'x mb-press mb-tap', '');
    x.dataset.icon = 'del';
    x.setAttribute('aria-label', 'Delete ' + fd.name);
    x.onclick = e => { e.stopPropagation(); removeFood(fd); };
    b.appendChild(x);
    foodBox.appendChild(b);
    if (window.Icons) Icons.paint(b);
  });
  const count = el('div', 'note');
  count.style.marginBottom = '0';
  count.textContent = rows.length === total ? total + ' foods' : rows.length + ' of ' + total + ' foods';
  foodBox.appendChild(count);
}

/* Deleting is the one thing here with no undo in the store, so it gets one
   in the app: the row is held for six seconds and put straight back. Meals
   already logged keep the numbers they were saved with either way, which is
   the whole point of freezing them into the meal row. */
function removeFood(fd) {
  const was = JSON.parse(JSON.stringify(fd));
  Rec.del('food', null, fd.id);
  if (EDIT === fd.id) { EDIT = null; syncBar(); }
  Mobile.haptic('warn');
  UI.undo('deleted <b>' + esc(fd.name) + '</b>', () => Rec.set('food', null, was.id, was));
}

function loadFood(fd) {
  EDIT = fd.id;
  setField('name', fd.name || ''); setField('brand', fd.brand || ''); setField('cat', fd.cat || '');
  setField('amt', fd.base.amt); setField('unit', fd.base.unit || 'g');
  NUTS.concat(['price']).forEach(n => setField(n, fd.base[n] == null ? '' : fd.base[n]));
  /* Carried, not re-derived. Loading a food to correct one figure is exactly
     when the row would otherwise forget that the rest came off a pack. */
  L.src = fd.base.src || '';
  /* A loaded food already carries its extra figures on the row, and the save
     merges into the row, so there is nothing to carry here. */
  L.more = {};
  /* The piece weight, on the other hand, IS stored - as the "1 piece"
     serving - so it comes back with the food. */
  setField('pc', pieceOf(fd) == null ? '' : pieceOf(fd));
  /* Open on the next version you have not made yet, so loading the raw
  /* "1 piece" is not an amount you asked for, it is how the piece weight is
     kept. It goes back in the box above rather than into the list. */
  PORTIONS = (fd.serves || []).filter(s => !/^1 piece$/.test(s.label)).map(s => unlabel(s, fd.base));
  if (!PORTIONS.length) PORTIONS = firstAmounts();
  paintPortions(); saveDraft(); syncBar();
  Mobile.feedback('open');
  document.querySelector('main').scrollTop = 0;
  UI.toast('Editing <b>' + esc(fd.name) + '</b>');
}

function blank() {
  EDIT = null;
  /* Results from the last food go with it. Leaving them there is a list that
     looks like it belongs to the empty form in front of you. */
  paintLook([]);
  Object.keys(L).forEach(k => setField(k, k === 'amt' ? '100' : k === 'unit' ? 'g' : ''));
  PORTIONS = firstAmounts();
  paintPortions(); saveDraft(); syncBar();
}

/* The button says which of the two things it is about to do, because saving
   over a food you loaded and making a new one look identical otherwise. */
function syncBar() {
  document.getElementById('btnSave').textContent = EDIT ? 'UPDATE THIS FOOD' : 'SAVE TO MY FOODS';
}

/* ══ the same food twice ══
   Two rows called Chicken Breast is the quiet way a library rots: you log
   from whichever one you happen to tap, and the numbers stop agreeing with
   themselves. So a new food whose name is already taken stops and asks,
   rather than sliding a second one in beside the first.

   Case and spacing do not count as a difference, because they never are. */
const sameName = (a, b) => String(a).trim().toLowerCase().replace(/\s+/g, ' ') ===
                           String(b).trim().toLowerCase().replace(/\s+/g, ' ');
const twinOf = name => Object.values(Rec.map('food')).find(f => f.id !== EDIT && sameName(f.name, name));

function saveFood() {
  const name = L.name.trim();
  if (!name) { INPUTS.name.focus(); return UI.toast('Give it a name first', { bad: true }); }
  if (!(numv(L.amt) > 0)) { INPUTS.amt.focus(); return UI.toast('The label serving amount is missing', { bad: true }); }

  const dup = twinOf(name);
  if (dup) {
    return UI.confirm('You already have a food called ' + name,
      'Update that one with what is on screen? Cancel instead and change the name, if this is really a different thing.')
      .then(ok => {
        if (!ok) { INPUTS.name.focus(); return; }
        /* Take over the existing row rather than making a second one. Its
           id is what every meal you have already logged points at. */
        EDIT = dup.id; syncBar(); writeFood();
      });
  }
  writeFood();
}

function writeFood() {
  const name = L.name.trim();
  const id = EDIT || newId();
  const was = EDIT ? Rec.get('food', null, id) : null;

  /* ══ merge into the row, never rebuild it ══
     Rec.set overwrites the whole payload, so a row built from scratch loses
     every field this build has not heard of. That is exactly how STATUS
     dropped the calcium this app had written: it rebuilt `base` from its own
     list of nutrients and calcium was not on it.

     So the row as it stands is the starting point, and anything a newer
     STATUS - or a newer version of this app - has put on a food rides along
     untouched. */
  const base = Object.assign({}, (was && was.base) || {},
    { amt: numv(L.amt), unit: L.unit.trim() || 'serving' });
  /* The fields this app does own come from the form, and a box left blank
     CLEARS the figure rather than quietly keeping the old one. That is the
     difference between merging and just never deleting anything. */
  NUTS.concat(['price']).forEach(n => {
    const v = numv(L[n]);
    if (v != null) base[n] = v; else delete base[n];
  });
  if (L.src) base.src = L.src; else delete base.src;
  /* the USDA's other figures, the ones with no box on this form */
  if (L.more && typeof L.more === 'object') Object.assign(base, L.more);

  /* Only the amounts that actually worked out become servings. One with no
     protein figure behind it is a question with no answer, not a serving. */
  const serves = [];
  PORTIONS.forEach(pt => {
    const w = work(pt);
    if (!(w.mult > 0)) return;
    if (serves.some(s => s.label === w.want)) return;
    serves.push({ label: w.want, mult: w.mult });
  });
  /* One piece, always, when the food has pieces. It is the serving you will
     reach for most, and saving it is also how the piece weight survives:
     there is no field for it on a food row, and a serving is the honest
     place for "this is a thing you can pick up". */
  const one = numv(L.pc);
  if (one > 0 && !serves.some(s => s.label === '1 piece')) {
    serves.unshift({ label: '1 piece', mult: one / numv(L.amt) });
  }

  /* Same rule one level up: the row itself is merged into, so a top-level
     field some other app added survives a save from here. */
  Rec.set('food', null, id, Object.assign({}, was || {}, {
    id: id, name: name, brand: L.brand.trim(), cat: L.cat.trim(),
    base: base, serves: serves,
    /* Carried, never reset. `uses` is how STATUS sorts the list and `dflt` is
       which serving it offers first: correcting a label is not a reason to
       forget that you eat this every day. */
    dflt: was ? (was.dflt || 0) : leadServe(serves),
    uses: was ? (was.uses || 0) : 0,
    shot: was ? (was.shot || null) : null,
  }));
  EDIT = id; syncBar();
  Mobile.feedback('success');
  UI.toast('<b>' + esc(name) + '</b> saved with ' + serves.length +
    ' serving' + (serves.length === 1 ? '' : 's') + '. It is in STATUS too.');
}

/* which saved serving is the 50 g one, so a new food opens on it in STATUS */
function leadServe(serves) {
  const lead = PORTIONS.filter(pt => pt.auto)[0];
  if (!lead) return 0;
  const w = work(lead);
  const i = w ? serves.findIndex(s2 => s2.label === w.want) : -1;
  return i < 0 ? 0 : i;
}

/* ══ the draft ══
   A half-typed label is easy to lose and annoying to retype, so what is on
   screen is kept as one setting under this app's own name. It is not data,
   it is the workbench, and it is replaced whole every time. */
let draftT = 0;
function saveDraft() {
  clearTimeout(draftT);
  draftT = setTimeout(() => {
    try { Rec.setting(APP.id, 'draft', { L: L, P: PORTIONS, edit: EDIT }); } catch (e) {}
  }, 700);
}
function loadDraft() {
  const d = Rec.setting(APP.id, 'draft');
  if (!d || !d.L) return;
  Object.keys(L).forEach(k => setField(k, d.L[k]));
  if (d.P && d.P.length) PORTIONS = d.P;
  EDIT = d.edit || null;
  paintPortions(); syncBar();
}

document.getElementById('btnSave').onclick = saveFood;
document.getElementById('btnNew').onclick = () => {
  if (!L.name.trim() && !EDIT) return blank();
  UI.confirm('Start a new food?', 'What is on screen is cleared. Anything you already saved stays saved.')
    .then(ok => { if (ok) { blank(); Mobile.feedback('nav'); } });
};

/* ── the keyboard, because this is desk work ──
   Entering a food is paste, check, save, next, forty times over. Ctrl+Enter
   saves and Ctrl+Shift+Enter starts the next one, so a batch never needs the
   mouse. Plain Enter is deliberately left alone: it would fire while you were
   halfway through correcting a number, which is exactly when you do not want
   a save.

   Held back while a dialog is open, or the confirm asking whether to update a
   food you already have would be answered by the shortcut that raised it. */
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.key !== 'Enter') return;
  if (document.querySelector('.mb-dialog, .mb-sheet')) return;
  e.preventDefault();
  if (e.shiftKey) document.getElementById('btnNew').click();
  else saveFood();
});

build();
syncBar();
/* A row too big for localStorage arrives from IndexedDB a few milliseconds
   after boot, so the list of foods waits for the store rather than drawing an
   empty one and never correcting itself. */
Rec.ready(() => { loadDraft(); paintFoods(); });
Rec.on(paintFoods);
</script>
</body>
</html>
