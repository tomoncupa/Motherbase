function clientSheet(c) {
  UI.dialog({
    title: c.name.toUpperCase(), width: 520,
    body: (b, h) => {
      const mine = paidRows({}).filter(p => p.client === c.id).sort((a, b2) => b2.date.localeCompare(a.date));
      const got = mine.reduce((a, p) => a + num(p.amt, 0), 0);
      const g = el('div', 'grid3');
      g.appendChild(tile('EVER PAID', exactMoney(got), mine.length + ' payments'));
      g.appendChild(tile('SINCE', c.start ? Day.short(c.start) : '—', ''));
      /* No average lateness. Tom, 2026-09-14: "I don't need to know if a
         client pays on time on average." Most of a client's history happened
         before WEALTH did, so the figure described the app, not the client. */
      b.appendChild(g);
      /* Tom, 2026-09-17, said yes to "if this client left". Concentration was
         a number on the CLIENTS bars and nowhere near the client himself, so
         the one screen where he is thinking about one person never said what
         losing them would do. Numbers only: what the recurring income is with
         them and without, and their share of it. No advice, per law 7. */
      const worth = clientMonthly(c), rec = recurringIn();
      if (worth != null && worth > 0 && rec.known > 0) {
        const without = Math.max(0, rec.known - worth);
        b.appendChild(el('div', 'note', 'Worth about <b>' + esc(money(worth)) +
          '</b> a month, <b>' + Math.round(worth / rec.known * 100) + '%</b> of your client income. ' +
          'Without them it would be ' + esc(money(without)) + ' a month against ' +
          esc(money(costsMonthly())) + ' of costs.'));
      } else if (worth == null) {
        b.appendChild(el('div', 'note', 'Worth a month is unknown until you set their sessions a week, below.'));
      }

      const name = UI.field('name', { value: c.name });
      b.appendChild(fld('Name', name));
      const rate = amountField(num(c.rate, 0));
      const rateWrap = fld('They pay', rate);
      b.appendChild(rateWrap);
      /* == how often, as a kind and a number ==
         A fixed list of four could not say "every two months", so it is a
         kind plus a count. The count's label follows the kind, because
         "Every 2" on its own means nothing. */
      const y0 = cycleOf(c);
      const cycle = chipRow([{ id: 'month', name: 'Months' }, { id: 'week', name: 'Weeks' },
        { id: 'sesh', name: 'Sessions' }, { id: 'pack', name: 'Packages up front' },
        { id: 'oneoff', name: 'One off' }], y0.kind,
        () => { paintEvery(); paintSesh(); });
      b.appendChild(fld('How they pay', cycle));

      const everyWrap = el('div', 'fld');
      const everyLbl = el('label', null, '');
      const every = UI.field('number', { value: String(y0.every) });
      everyWrap.appendChild(everyLbl); everyWrap.appendChild(every);
      b.appendChild(everyWrap);

      /* Roughly how many sessions a week, for any client paid by the session.
         It gives what the client is worth in a week, and guesses when a
         package part falls due. Everything worked out from it says "about". */
      const paceWrap = el('div', 'fld');
      paceWrap.appendChild(el('label', null, 'Sessions a week, roughly'));
      const pace = UI.field('decimal', { placeholder: 'e.g. 4', value: num(c.perWeek, 0) ? String(c.perWeek) : '' });
      paceWrap.appendChild(pace);
      b.appendChild(paceWrap);
      pace.addEventListener('input', () => paintSesh());

      /* Which days of the month, monthly cycles only. Usually one, and not
         always the day they signed up; sometimes two, for a client paid on
         the 1st and the 15th. Each day is its own payment, so a missed 15th
         shows as late on its own. */
      const dayWrap = el('div', 'fld');
      const dayLbl = el('label', null, 'Days of the month');
      const dayF = UI.field('text', { placeholder: 'e.g. 1, 15. Blank uses the start date',
        value: y0.days.join(', ') });
      dayWrap.appendChild(dayLbl); dayWrap.appendChild(dayF);
      b.appendChild(dayWrap);

      const hint = el('div', 'note', '');
      b.appendChild(hint);

      function paintEvery() {
        const k = cycle.get(), n = Math.max(1, num(every.value, 1)), one = n === 1;
        everyWrap.style.display = (k === 'oneoff' || k === 'pack') ? 'none' : '';
        paceWrap.style.display = (k === 'pack' || k === 'sesh') ? '' : 'none';
        dayWrap.style.display = k === 'month' ? '' : 'none';
        rateWrap.style.display = k === 'pack' ? 'none' : '';
        everyLbl.textContent = k === 'week' ? (one ? 'Week' : 'Weeks')
          : k === 'sesh' ? (one ? 'Session' : 'Sessions')
          : (one ? 'Month' : 'Months');
        hint.innerHTML = k === 'pack'
          ? 'They buy sessions before they happen. Each package has its own size and price, ' +
            'so there is nothing fixed to set here. Sell one below.'
          : k === 'sesh'
          ? 'Counted, not scheduled. Log a session below and a payment falls due every ' +
            esc(String(n)) + '.'
          : k === 'oneoff' ? 'Once, on the start date. Nothing repeats.'
          : (() => {
              const ds = k === 'month' ? parseDays(dayF.value) : [];
              const per = num(rate.value, 0);
              return 'Repeats from the start date: ' + esc(money(per)) + ' ' +
                esc(cycleWord({ cycle: k, every: n, days: ds })) + '.' +
                (ds.length > 1 ? ' That is ' + esc(money(per * ds.length / n)) + ' a month.' : '');
            })();
      }
      every.oninput = () => { paintEvery(); paintSesh(); };
      rate.addEventListener('input', paintEvery);
      dayF.addEventListener('input', paintEvery);

      const start = dateField(c.start);
      b.appendChild(fld('Started', start));
      const status = chipRow([{ id: 'on', name: 'Active' }, { id: 'done', name: 'Finished' }], c.status || 'on');
      b.appendChild(fld('Status', status));

      /* == sessions, for a client paid by the session ==
         Only drawn when it applies. A counter on a monthly client is a
         control that can never do anything. */
      const seshBox = el('div');
      b.appendChild(seshBox);
      function paintSesh() {
        seshBox.innerHTML = '';
        if (cycle.get() === 'pack') return paintPack();
        if (cycle.get() !== 'sesh') return;
        /* Built by hand, not through `merge`, because merge strips `id` on
           purpose and seshDues needs it to find the sessions. */
        const st = seshDues({ id: c.id, cycle: 'sesh', every: Math.max(1, num(every.value, 1)) });
        seshBox.appendChild(el('h2', null, 'SESSIONS'));
        const g2 = el('div', 'grid3');
        g2.appendChild(tile('DELIVERED', String(st.total), 'all time'));
        g2.appendChild(tile('TOWARDS NEXT', st.into + ' of ' + st.every,
          st.into ? String(st.every - st.into) + ' to go' : 'none since the last'));
        g2.appendChild(tile('BLOCKS OWED', String(st.dues.length), 'completed blocks'));
        seshBox.appendChild(g2);
        /* Worked out from what is typed right now, so changing the rate or
           the block size shows its effect before saving. */
        const perS = num(rate.value, 0) / Math.max(1, num(every.value, 1));
        if (perS) seshBox.appendChild(el('div', 'note', '<b>' + esc(earnWords(perS, num(pace.value, 0))) + '</b>' +
          (num(pace.value, 0) ? '' : '. Put in sessions a week to see a week\u2019s worth.')));
        const blocks = seshBlocks(c.id, Math.max(1, num(every.value, 1)));
        drawBlocks(blocks, blocks[0], bk => 'SESSIONS ' + bk.first + ' TO ' + (bk.first + bk.size - 1));
      }
      /* The block being worked through, and the rest behind one button. */
      let allBlocks = false;
      function drawBlocks(blocks, current, label) {
        if (!blocks.length) return;
        (allBlocks ? blocks : [current]).forEach(bk => {
          seshBox.appendChild(el('h2', null, esc(label(bk))));
          seshBoxes(seshBox, c.id, bk, paintSesh);
        });
        if (blocks.length > 1) {
          const more = el('button', 'btn mb-press mb-tap', allBlocks ? 'Show only this block' : 'Show earlier sessions');
          more.type = 'button';
          more.onclick = () => { allBlocks = !allBlocks; paintSesh(); };
          const r = el('div', 'rowbtns');
          r.appendChild(more);
          seshBox.appendChild(r);
        }
      }
      /* == a package client ==
         Two figures that pull opposite ways, never netted: money they owe,
         and sessions he owes. */
      function paintPack() {
        const st = packState(c);
        seshBox.appendChild(el('h2', null, 'PACKAGES'));
        const g2 = el('div', 'grid3');
        g2.appendChild(tile('SESSIONS LEFT', String(st.left),
          st.delivered + ' of ' + st.bought + ' delivered' +
          (st.paidFor < st.bought ? ', ' + st.paidFor + ' paid for' : ''),
          st.left < 0 ? 'bad' : ''));
        g2.appendChild(tile('THEY OWE', st.owed ? money(st.owed) : 'nothing',
          money(st.paid) + ' of ' + money(st.value) + ' paid', st.owed ? 'warn' : 'good'));
        g2.appendChild(tile('PACKAGES', String(st.packs.length), 'sold all time'));
        seshBox.appendChild(g2);
        if (st.coming.length) {
          const nx = st.coming[0];
          seshBox.appendChild(el('div', 'note', 'Next part: <b>' + esc(money(nx.amt)) + '</b>' +
            (nx.at ? ' when session ' + nx.at + ' is done' : '') +
            (nx.date ? ', about ' + esc(Day.short(nx.date)) : st.pace ? '' : '. Put in sessions a week to see roughly when') + '.'));
        }
        const perP = perSession(c);
        if (perP) seshBox.appendChild(el('div', 'note', '<b>' + esc(earnWords(perP, num(pace.value, 0))) + '</b>' +
          (num(pace.value, 0) ? '' : '. Put in sessions a week to see a week\u2019s worth.')));
        if (st.left < 0) seshBox.appendChild(el('div', 'note',
          '<span class="stale">More sessions delivered than bought.</span> Either a package has not been entered, or these were free.'));
        else if (st.owedWork > 0) seshBox.appendChild(el('div', 'note',
          'You have been paid for <b>' + esc(String(st.owedWork)) + '</b> session' + (st.owedWork === 1 ? '' : 's') +
          ' you still have to deliver. That is work owed, not money earned.'));
        else if (st.left > 0) seshBox.appendChild(el('div', 'note',
          '<b>' + esc(String(st.left)) + '</b> session' + (st.left === 1 ? '' : 's') + ' left on paper, but only <b>' +
          esc(String(st.paidFor)) + '</b> paid for. The rest is theirs once the money arrives.'));

        const btns = el('div', 'rowbtns');
        const sell = el('button', 'btn go mb-press mb-tap', 'Sell a package');
        sell.type = 'button';
        sell.onclick = () => { h.close(); packSheet(c); };
        btns.appendChild(sell);
        seshBox.appendChild(btns);

        if (st.packs.length) {
          const list = el('div', 'list');
          list.style.marginTop = 'var(--s-3)';
          st.packs.slice().reverse().forEach(x => {
            const owedHere = st.dues.filter(d => d.pack.id === x.id).reduce((t, d) => t + d.amt, 0);
            const comeHere = st.coming.filter(d => d.pack.id === x.id).reduce((t, d) => t + d.amt, 0);
            const r = itemRow(x.n + ' sessions' + (x.note ? ' · ' + x.note : ''),
              Day.short(x.date) + ' · ' + money(num(x.price, 0)) +
              (num(x.parts, 1) > 1 ? ' in ' + x.parts + ' parts' : '') +
              (owedHere ? ' · <b>' + esc(money(owedHere)) + ' owed</b>'
                : comeHere ? ' · ' + esc(money(comeHere)) + ' to come' : ' · paid'),
              money(num(x.price, 0)), owedHere ? 'late' : comeHere ? '' : 'in');
            r.onclick = () => { h.close(); packSheet(c, x); };
            list.appendChild(r);
          });
          seshBox.appendChild(list);
        }
        /* Sessions belong to packages oldest first, so the package being
           worked through is the oldest one not yet full. */
        const blocks = packBlocks(c.id);
        const current = blocks.slice().reverse().find(bk => !bk.extra && bk.sessions.length < bk.size) || blocks[0];
        drawBlocks(blocks, current, bk => bk.extra ? 'SESSIONS NOT IN A PACKAGE'
          : 'PACKAGE OF ' + bk.size + ', SOLD ' + Day.short(bk.pack.date).toUpperCase());
      }

      paintEvery(); paintSesh();

      if (mine.length) {
        b.appendChild(el('h2', null, 'EVERY PAYMENT'));
        const list = el('div', 'list');
        mine.forEach(p => {
          const r = itemRow(Day.label(p.date), esc(acctName(p.acct)) + (p.note ? ' · ' + esc(p.note) : ''),
            money(num(p.amt, 0)), 'in');
          r.onclick = () => { h.close(); paidSheet(p); };
          list.appendChild(r);
        });
        b.appendChild(list);
      }
      h.save = () => {
        const n = name.value.trim();
        if (!n) { name.focus(); return false; }
        if (norm(n) !== norm(c.name) && clients().some(x => norm(x.name) === norm(n))) {
          UI.toast('another client already has that name', { bad: true }); return false;
        }
        /* Merge into what is there, never rebuild it. Root brief, rule 1. */
        Rec.set('client', null, c.id, merge(c, {
          name: n, rate: num(rate.value, 0), cycle: cycle.get(),
          every: Math.max(1, num(every.value, 1)),
          perWeek: Math.max(0, num(pace.value, 0)),
          /* 31 is a real answer. dueDates already clamps per month, so the
             31st is the 31st in March and the 28th in February, and it does
             NOT drift down to the 28th forever after one short month.
             Capping the stored day at 28 threw that away silently. */
          days: parseDays(dayF.value),
          day: parseDays(dayF.value)[0] || 0,
          start: start.value, status: status.get(),
        }));
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'DELETE', kind: 'bad', fn: () => deleteClient(c) },
      { label: 'LOG A PAYMENT', fn: h => { h.close(); paidSheet(null, { client: c.id, amt: num(c.rate, 0) }); return true; } },
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ],
  });
}

/* == selling a package ==
   Sold and paid are two facts and they do not have to happen together, which
   is the whole point of "whole or partial". So the payment is optional here
   and creates an ordinary `paid` row when it is filled in. */
function packSheet(c, existing) {
  UI.dialog({
    title: existing ? 'EDIT PACKAGE' : 'SELL A PACKAGE', width: 460,
    body: (b, h) => {
      const n = UI.field('number', { placeholder: '10', value: existing ? existing.n : '' });
      b.appendChild(fld('How many sessions', n));
      const price = amountField(existing ? existing.price : '');
      b.appendChild(fld('Price for the whole package', price));

      /* Paid in parts: 30 sessions at ₱45,000 in two parts is ₱22,500 when it
         is sold and ₱22,500 when session 15 is done. */
      const partsF = UI.field('number', { value: String(existing ? Math.max(1, num(existing.parts, 1)) : 1) });
      b.appendChild(fld('Paid in how many parts', partsF));
      let when = existing && existing.when === 'after' ? 'after' : 'before';
      const whenWrap = fld('Each part is paid', chipRow([{ id: 'before', name: 'At the start of its sessions' },
        { id: 'after', name: 'At the end of its sessions' }], when, v => { when = v; paintParts(); }));
      b.appendChild(whenWrap);
      const partsHint = el('div', 'note', '');
      b.appendChild(partsHint);
      const partsOf = () => {
        const cnt = Math.max(1, num(n.value, 0));
        return Math.max(1, Math.min(cnt, Math.round(num(partsF.value, 1)) || 1));
      };
      function paintParts() {
        const cnt = Math.max(1, num(n.value, 0)), val = num(price.value, 0), p = partsOf();
        whenWrap.style.display = p > 1 ? '' : 'none';
        if (!val || !num(n.value, 0)) { partsHint.innerHTML = ''; return; }
        if (p === 1) { partsHint.innerHTML = 'All ' + esc(money(val)) + ' is due when it is sold.'; return; }
        const list = [];
        for (let k = 0; k < p; k++) {
          const at = when === 'after' ? Math.round(cnt * (k + 1) / p) : Math.round(cnt * k / p);
          list.push(esc(money(val / p)) + (at ? ' when session ' + at + ' is done' : ' when it is sold'));
        }
        partsHint.innerHTML = list[0].charAt(0).toUpperCase() === list[0].charAt(0) ? andList(list) + '.' : andList(list) + '.';
      }
      [n, price, partsF].forEach(f => f.addEventListener('input', paintParts));
      paintParts();
      const date = dateField(existing ? existing.date : Day.today());
      b.appendChild(fld('Sold on', date));
      const note = UI.field('text', { placeholder: 'optional', value: existing ? existing.note || '' : '' });
      b.appendChild(fld('Note', note));

      let payNow = null, payAcct = null;
      if (!existing) {
        b.appendChild(el('h2', null, 'PAID NOW'));
        payNow = amountField('');
        b.appendChild(fld('How much they handed over', payNow));
        payAcct = chipRow(accts().map(a => ({ id: a.id, name: a.name })),
          S.get('lastAcct', (accts()[0] || {}).id || ''), null, {});
        b.appendChild(fld('Into', payAcct));
        b.appendChild(el('div', 'note',
          'Leave it blank if they have not paid yet, or put in part of it. Each part shows as owed only once it is due.'));
      }

      h.save = () => {
        const count = Math.max(1, num(n.value, 0));
        const val = num(price.value, 0);
        if (!count || val <= 0) { n.focus(); return false; }
        const id = existing ? existing.id : newId();
        if (existing && existing.date !== date.value) Rec.del('pack', existing.date, existing.id);
        const p = partsOf();
        Rec.set('pack', date.value, id, merge(existing, {
          client: c.id, n: count, price: val, note: note.value.trim(),
          parts: p, when: p > 1 ? when : 'before',
        }));
        if (payNow && num(payNow.value, 0) > 0) {
          const amt = num(payNow.value, 0);
          Rec.set('paid', date.value, newId(), {
            amt: amt, acct: payAcct.get(), client: c.id,
            note: count + ' session package', t: stampFor(date.value, timeOf({ t: Date.now() })), src: 'hand',
          });
          S.set('lastAcct', payAcct.get());
          UI.toast('sold <b>' + count + ' sessions</b>, took <b>' + esc(money(amt)) + '</b>' +
            (amt < val ? ', <b>' + esc(money(val - amt)) + '</b> ' + (p > 1 ? 'to come in parts' : 'still owed') : ''));
        } else {
          UI.toast('sold <b>' + count + ' sessions</b> for ' + esc(money(val)) + ', unpaid');
        }
        Mobile.feedback('success');
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      existing ? { label: 'DELETE', kind: 'bad', fn: () => {
        const keep = Object.assign({}, existing);
        Rec.del('pack', existing.date, existing.id);
        UI.undo('removed that package',
          () => Rec.set('pack', keep.date, keep.id, merge(keep, {})));
        draw(); return true;
      } } : null,
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ].filter(Boolean),
  });
}

/* a bill */
function billSheet(existing, seed) {
  /* `seed` fills a NEW bill in from something that already happened: a
     purchase just filed as rent, a subscription or a utility. Tom,
     2026-09-16: "If I categorize something into a bill/subscription then
     prompt me into that entry mode." Only the boxes are filled; the row is
     still new and nothing is written until SAVE. */
  const init = existing || seed || {};
  UI.dialog({
    title: existing ? 'EDIT BILL' : 'A BILL', width: 460,
    body: (b, h) => {
      const name = UI.field('name', { placeholder: 'Rent', value: init.name || '' });
      b.appendChild(fld('What', name));
      const amt = amountField(init.amt || '');
      b.appendChild(fld('How much each time', amt));
      /* Prepaid electricity has no day of the month. So a bill is monthly on
         a day, or every N days from when it was last paid. */
      const often = chipRow([{ id: 'month', name: 'Once a month' }, { id: 'days', name: 'Every few days' }],
        init.cycle === 'days' ? 'days' : 'month', () => paintOften());
      b.appendChild(fld('How often', often));
      const day = UI.field('number', { placeholder: '1', value: init.day || '' });
      const dayF = fld('Which day of the month', day);
      b.appendChild(dayF);
      const every = UI.field('decimal', { placeholder: '7', value: init.every ? String(init.every) : '' });
      const everyF = fld('Every how many days', every);
      b.appendChild(everyF);
      const start = dateField(init.start);
      const startF = fld('Last paid on', start);
      b.appendChild(startF);
      const oftenHint = el('div', 'note', '');
      b.appendChild(oftenHint);
      function paintOften() {
        const d = often.get() === 'days';
        dayF.style.display = d ? 'none' : '';
        everyF.style.display = startF.style.display = oftenHint.style.display = d ? '' : 'none';
        const a = num(amt.value, 0);
        oftenHint.innerHTML = 'For every 6 or 7 days, put <b>6.5</b> and the dates take turns.' +
          (a ? ' That comes to about <b>' + esc(money(billMonthly({ cycle: 'days', amt: a, every: every.value || 7 }))) +
            '</b> a month.' : '');
      }
      every.addEventListener('input', paintOften);
      amt.addEventListener('input', paintOften);
      paintOften();
      const cat = picker({
        items: catsAZ().filter(c => c.grp !== 'move').map(c => ({ id: c.id, name: c.name })),
        value: init.cat || '', placeholder: 'Rent, Utility Bills, Subscriptions',
        onCreate: n => makeCat(n, 'fix'),
      });
      b.appendChild(fld('Category', cat));
      const acct = chipRow(accts().map(a => ({ id: a.id, name: a.name })), init.acct || '', null, { blank: 'Not set' });
      b.appendChild(fld('Paid from', acct));
      h.save = () => {
        const n = name.value.trim();
        if (!n || num(amt.value, 0) <= 0) { name.focus(); return false; }
        if (!existing && bills().some(x => norm(x.name) === norm(n))) {
          UI.toast('there is already a bill called <b>' + esc(n) + '</b>', { bad: true }); return false;
        }
        const id = existing ? existing.id : newId();
        Rec.set('bill', null, id, merge(existing, {
          name: n, amt: num(amt.value, 0),
          /* Same as a client's day: billsDue clamps per month, so rent on the
             30th stays on the 30th and only moves in February. */
          day: Math.min(31, Math.max(1, num(day.value, 1))),
          cycle: often.get(),
          every: often.get() === 'days' ? Math.max(1, num(every.value, 7)) : (existing ? existing.every : undefined),
          start: often.get() === 'days' ? (start.value || Day.today()) : (existing ? existing.start : undefined),
          cat: cat.get(), acct: acct.get(),
        }));
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      existing ? { label: 'DELETE', kind: 'bad', fn: () => {
        const keep = Object.assign({}, existing);
        Rec.del('bill', null, existing.id);
        UI.undo('removed <b>' + esc(existing.name) + '</b>', () => Rec.set('bill', null, keep.id, keep));
        draw(); return true;
      } } : null,
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ].filter(Boolean),
  });
}

/* counting an account: law 1, the only honest way to know a balance */
/* == a statement, line by line, with comments ==
   Tom, 2026-09-14: "I also want to be able to view this and add comments."

   Every line read off a statement is a `recon` row. This lists one account's
   lines as the bank wrote them, newest first and grouped by month, says what
   the app did with each, and takes a comment. The comment is merged into the
   line's own `recon` row, so it stays with that line however often the file
   is read again, and it shows on the purchase or payment the line became.
   The line's date is the one in its fingerprint: a skipped line stores no
   other. */
function stmtLines(acctId) {
  return Rec.all('recon', {}).filter(r => r.payload && r.payload.acct === acctId)
    .map(r => Object.assign({ id: r.key, date: String(r.key).split('|')[1] || r.payload.sdate || '' }, r.payload))
    .sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
}
function stmtSheet(acctId) {
  const lines = stmtLines(acctId);
  const rows = { spend: {}, paid: {}, xfer: {} };
  spendRows({}).forEach(x => { rows.spend[x.key] = x; });
  paidRows({}).forEach(x => { rows.paid[x.key] = x; });
  xfers({}).forEach(x => { rows.xfer[x.key] = x; });
  UI.dialog({
    title: acctName(acctId).toUpperCase() + ' STATEMENT LINES', width: 680,
    body: b => {
      b.appendChild(el('div', 'note', '<b>' + lines.length + '</b> line' + (lines.length === 1 ? '' : 's') +
        ' read from ' + esc(acctName(acctId)) + ' statements, in the bank’s own words. ' +
        'A comment saves when you leave its box. Tap a line to open what it became.'));
      const q = UI.field('search', { placeholder: 'Find a line by its wording, amount or comment' });
      b.appendChild(q);
      const box = el('div');
      b.appendChild(box);
      const paint = () => {
        box.innerHTML = '';
        const n = norm(q.value);
        const shown = lines.filter(l => !n || norm(l.d).indexOf(n) > -1 ||
          String(Math.abs(num(l.amt, 0))).indexOf(n) > -1 || norm(l.comment).indexOf(n) > -1);
        if (!shown.length) {
          box.appendChild(el('div', 'empty', lines.length ? 'No line matches that.'
            : 'Nothing has been read from a statement for this account yet. <b>Read a statement</b> on ACCOUNTS brings its lines in.'));
          return;
        }
        let mo = '', list = null;
        shown.forEach(l => {
          if (monthOf(l.date) !== mo) {
            mo = monthOf(l.date);
            box.appendChild(el('h2', null, esc(monthName(mo).toUpperCase())));
            list = el('div', 'list');
            box.appendChild(list);
          }
          const type = l.kind === 'xfer' ? 'xfer' : l.kind === 'in' ? 'paid' : 'spend';
          const row = l.skip ? null : rows[type][l.spend];
          const what = l.skip ? 'left out' : !row ? 'no longer in the app'
            : type === 'xfer' ? 'a transfer between your accounts'
            : row.src === 'stmt' ? 'added from the statement' : 'matched to what you logged';
          const amt = num(l.amt, 0);
          const r = itemRow(l.d || 'No wording', esc(Day.short(l.date)) + ' · ' + what,
            (amt > 0 ? '+' : '') + money(amt), amt > 0 ? 'in' : '');
          if (row && type === 'spend') r.onclick = () => spendSheet(row);
          else if (row && type === 'paid') r.onclick = () => paidSheet(row);
          const c = UI.field('text', { placeholder: 'Add a comment', value: l.comment || '' });
          c.setAttribute('aria-label', 'Comment on ' + (l.d || 'this line'));
          c.onchange = () => {
            const cur = Rec.get('recon', null, l.id);
            if (!cur) return;
            const v = c.value.trim();
            if ((cur.comment || '') === v) return;
            Rec.set('recon', null, l.id, merge(cur, { comment: v || undefined }));
            l.comment = v;
            Mobile.feedback('tick');
          };
          list.appendChild(stack(r, c));
        });
      };
      q.addEventListener('input', paint);
      paint();
    },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
}

function countSheet(a) {
  const b0 = balanceOf(a.id);
  UI.dialog({
    title: a.name.toUpperCase(), width: 460,
    body: (b, h) => {
      const mv0 = movementSince(a.id, null);
      if (b0) {
        b.appendChild(el('div', 'note', 'Last counted ' + esc(Day.label(b0.counted)) +
          '. Since then this app has added every payment and taken off every spend, which gives <b>' +
          esc(money(b0.bal)) + '</b>. If your bank says something else, the bank is right.'));
      } else if (mv0.any) {
        b.appendChild(el('div', 'note', 'Never counted, but <b>' + esc(money(mv0.in)) + '</b> in and <b>' +
          esc(money(mv0.out)) + '</b> out have been logged against it. That is movement, not a balance: ' +
          'it cannot know what was in there before you started. Open your banking app and put in what it says now.'));
      } else {
        b.appendChild(el('div', 'note', 'Never counted. Open your banking app and put in what it actually says.'));
      }
      const bal = amountField(b0 ? Math.round(b0.bal) : '');
      b.appendChild(fld('What is in it right now', bal));
      const date = dateField(Day.today());
      b.appendChild(fld('As of', date));
      const name = UI.field('name', { value: a.name });
      b.appendChild(fld('Name', name));
      /* How this account is recognised on a statement. Filled in by reading
         one, and here so a wrong guess can be put right. */
      const idsF = UI.field('text', { placeholder: 'e.g. 09171234567 or 1234', value: idsOf(a.id).join(', ') });
      b.appendChild(fld('Numbers that identify it on statements', idsF));
      const delRow = el('div', 'rowbtns');
      const del = el('button', 'btn mb-press mb-tap', 'Delete this account');
      del.type = 'button';
      del.onclick = () => { h.close(); setTimeout(() => deleteAcct(a), 350); };
      delRow.appendChild(del);
      b.appendChild(delRow);
      h.save = () => {
        const idl = idsF.value.split(/[,\s]+/).map(x => x.trim()).filter(x => digitsOf(x).length >= 4);
        const idsChanged = idl.join(',') !== idsOf(a.id).join(',');
        if (idsChanged) S.set('ids.' + a.id, idl);
        if (!bal.value.trim()) {
          if (idsChanged) { UI.toast('saved the numbers for <b>' + esc(a.name) + '</b>'); return true; }
          bal.focus(); return false;
        }
        Rec.set('count', date.value, a.id, { bal: num(bal.value, 0) });
        const n = name.value.trim();
        /* Merge, never rebuild: STATUS owns this row's shape and may have put
           fields here WEALTH knows nothing about. */
        if (n && n !== a.name) Rec.set('acct', null, a.id, merge(a, { name: n }));
        Mobile.feedback('success');
        UI.toast('counted <b>' + esc(money(num(bal.value, 0))) + '</b> in ' + esc(n || a.name));
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ],
  });
}

/* filing one of STATUS's spend rows. Writes a `mark`, never the spend. */
function spendSheet(s) {
  UI.dialog({
    title: (s.note || 'THAT PURCHASE').toUpperCase(), width: 460,
    body: (b, h) => {
      b.appendChild(el('div', 'note', esc(money(num(s.amt, 0))) + ' · ' + esc(Day.label(s.date)) +
        ' · ' + esc(acctName(s.acct)) + '. This row belongs to STATUS. WEALTH files it without touching it.'));
      /* A comment left on the statement line this came from. */
      const rc = s.stmt ? recon(s.stmt) : null;
      if (rc && rc.comment) b.appendChild(el('div', 'note', 'Your comment on the statement line: <b>' + esc(rc.comment) + '</b>'));
      const cat = picker({
        items: catsAZ().map(c => ({ id: c.id, name: c.name, note: c.grp === 'move' ? 'not spending' : '' })),
        value: catOf(s), placeholder: 'Which category',
        onCreate: n => makeCat(n, 'var'),
      });
      b.appendChild(fld('Category', cat));
      const tg = picker({
        items: [{ id: '', name: 'No occasion' }].concat(tags().map(t => ({ id: t.id, name: t.name }))),
        value: tagOf(s), placeholder: 'Date, gift, travel', onCreate: makeTag,
      });
      /* Giving an Unsure transfer a real category is remembering it, so the
         Unsure tag goes with it rather than waiting to be cleared by hand. */
      const tagNow = () => (tg.get() === UNSURE && cat.get() && cat.get() !== ONETIME ? '' : tg.get());
      b.appendChild(fld('Occasion, if it had one', tg));
      const big = UI.toggle(isBig(s));
      b.appendChild(UI.row('A big one-off', 'Kept out of every "normal spending" figure, so one large thing does not become the story of the month', big));
      /* The one field WEALTH writes INTO a spend rather than alongside it.
         A time is the fact itself, not a label, so a `mark` would be the
         wrong place for it and two sources of truth for when something
         happened is worse than the separation is worth. Safe because it goes
         through `merge`, which keeps every field STATUS put there. */
      let hhmm = timeOf(s);
      b.appendChild(fld('Time', UI.timeField(hhmm, v => { hhmm = v; })));
      const was = catOf(s);
      h.save = () => {
        setMark(s, { cat: cat.get(), tag: tagNow(), big: big.on ? 1 : 0 });
        if (hhmm !== timeOf(s)) {
          const row = Rec.get('spend', s.date, s.key);
          if (row) Rec.set('spend', s.date, s.key, merge(row, { t: stampFor(s.date, hhmm) }));
        }
        Mobile.feedback('success');
        /* Filing something as rent, a utility or a subscription is the moment
           to ask whether it is a bill. After the sheet has closed, so the
           question is not stacked on top of the answer. */
        if (cat.get() && cat.get() !== was) setTimeout(() => offerBill(s, cat.get()), 250);
        return true;
      };
      /* "Always" writes a rule off this description, so it files the whole
         history and not just this one purchase.

         The rule is keyed on WHO WAS PAID, not on the first word. It used to
         take the first word of three letters or more, and every GCash payment
         begins "Payment to": one press on a Lawson purchase would have filed
         every GCash payment as groceries. A transfer to a number keys on the
         number. */
      h.always = () => {
        if (!cat.get()) { UI.toast('pick a category first', { bad: true }); return false; }
        const word = payeeOf(s.bank || s.note).key;
        if (!word) { UI.toast('nothing in the description to make a rule from', { bad: true }); return false; }
        if (isRail(word)) {
          UI.toast('<b>' + esc(word) + '</b> is how the money travelled, not who was paid. A rule on it would file everything that went the same way', { bad: true, ms: 6000 });
          return false;
        }
        Rec.set('rule', null, 'imp-' + norm(word), { match: word, cat: cat.get() });
        ruleCache = null;
        setMark(s, { cat: cat.get(), tag: tagNow(), big: big.on ? 1 : 0 });
        Mobile.feedback('success');
        UI.toast('anything paid to <b>' + esc(word) + '</b> now files as <b>' + esc(catName(cat.get())) + '</b>, including everything already logged');
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      /* Filing one purchase is a chore. Filing every purchase like it from now
         on is the point, and it is one press away rather than a trip to the
         rules screen. */
      { label: 'DELETE', kind: 'bad', fn: () => { deleteSpend(s); return true; } },
      { label: 'ALWAYS', fn: h => { if (h.always() === false) return false; draw(); return true; } },
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ],
  });
}

/* == logging a purchase here ==
   Tom, 2026-09-11: "I should be able to log spending here."

   STATUS stays the phone in the supermarket queue. This is the desk: putting
   in the four things off a bank statement, or the purchase you forgot on the
   day it happened. It writes the same `spend` row STATUS writes, which is
   allowed and always was — `spend` is shared, and this builds a fresh row
   rather than rebuilding somebody else's.

   The category goes in a `mark` as usual, never into the spend, so the two
   apps still cannot tread on each other. */
function newSpendSheet(preset) {
  UI.dialog({
    title: 'LOG SPENDING', width: 460,
    body: (b, h) => {
      const amt = amountField('');
      b.appendChild(fld('How much', amt));
      const note = UI.field('text', { placeholder: 'Landers, Grab, rent' });
      b.appendChild(fld('What was it', note));
      const acct = chipRow(accts().map(a => ({ id: a.id, name: a.name })),
        S.get('lastAcct', (accts()[0] || {}).id || ''), null, {});
      b.appendChild(fld('Paid from', acct));

      /* Picked, never typed, and it guesses from the description as he types,
         because a rule already knows what "Grab" means. */
      const cat = picker({
        items: catsAZ().map(c => ({ id: c.id, name: c.name, note: c.grp === 'move' ? 'not spending' : '' })),
        value: '', placeholder: 'Which category',
        onCreate: n => makeCat(n, 'var'),
      });
      b.appendChild(fld('Category', cat));
      const guess = el('div', 'note', '');
      b.appendChild(guess);
      note.addEventListener('input', () => {
        const r = ruleFor(note.value);
        guess.innerHTML = r ? 'A rule already files anything saying <b>' + esc(r.match) +
          '</b> as <b>' + esc(catName(r.cat)) + '</b>. Leave the category blank to use it.' : '';
      });

      const tg = picker({
        items: tags().map(x => ({ id: x.id, name: x.name })),
        value: '', placeholder: 'Date, gift, travel', onCreate: makeTag,
      });
      b.appendChild(fld('Occasion, if it had one', tg));
      const date = dateField(preset && preset.date);
      b.appendChild(fld('When', date));
      let hhmm = timeOf({ t: Date.now() });
      b.appendChild(fld('Time', UI.timeField(hhmm, v => { hhmm = v; })));
      const big = UI.toggle(false);
      b.appendChild(UI.row('A big one-off', 'Kept out of every "normal spending" figure', big));

      h.save = () => {
        const v = num(amt.value, 0);
        if (v <= 0) { amt.focus(); return false; }
        /* Law 4's second half, same as money in: the same amount to the same
           account on the same day is a question, not a silent second row. */
        if (!h._forced) {
          const dupe = spendRows({ date: date.value })
            .find(x => num(x.amt, 0) === v && x.acct === acct.get());
          if (dupe) {
            h._forced = 1;
            UI.toast('you already logged <b>' + esc(money(v)) + '</b> from that account on that day. Press save again if it really happened twice', { bad: true });
            return false;
          }
        }
        const key = newId();
        Rec.set('spend', date.value, key, {
          amt: v, acct: acctLabel(acct.get()), note: note.value.trim(),
          t: stampFor(date.value, hhmm), src: 'wealth',
        });
        if (cat.get() || tg.get() || big.on) {
          setMark({ date: date.value, key: key },
            { cat: cat.get(), tag: tg.get(), big: big.on ? 1 : 0 });
        }
        S.set('lastAcct', acct.get());
        Mobile.feedback('success');
        UI.toast('logged <b>' + esc(money(v)) + '</b> out');
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ],
  });
}

/* a category */
function catSheet(existing) {
  UI.dialog({
    title: existing ? 'EDIT CATEGORY' : 'A CATEGORY', width: 460,
    body: (b, h) => {
      const name = UI.field('name', { value: existing ? existing.name : '' });
      b.appendChild(fld('Called', name));
      const grp = chipRow([{ id: 'fix', name: 'Fixed' }, { id: 'var', name: 'Variable' },
        { id: 'biz', name: 'Business' }, { id: 'move', name: 'Not spending' }], existing ? existing.grp : 'var');
      b.appendChild(fld('Kind', grp));
      b.appendChild(el('div', 'note',
        '<b>Fixed</b> is known a month ahead and is what runway is worked out against. ' +
        '<b>Variable</b> is the only half you can actually steer. ' +
        '<b>Not spending</b> is money changing places, and never counts as an outgoing.'));

      b.appendChild(el('h2', null, 'A MONTHLY ALLOWANCE'));
      const cap = amountField(existing && num(existing.cap, 0) ? existing.cap : existing && existing.zero ? '0' : '');
      b.appendChild(fld('How much you allot to this a month', cap));
      const capNote = el('div', 'note', '');
      const paintCap = () => {
        const v = num(cap.value, 0);
        if (!v && cap.value.trim() !== '') { capNote.innerHTML = 'Nothing allowed. Every peso here shows as over.'; return; }
        if (!v) { capNote.innerHTML = 'Leave it blank and this category is just counted, never judged.'; return; }
        const st = existing ? capState(existing.id, monthOf(Day.today())) : null;
        capNote.innerHTML = 'That is ' + esc(money(v / 4.345)) + ' a week, or ' +
          esc(money(v / (Day.diff(monthEnd(monthOf(Day.today())), monthStart(monthOf(Day.today()))) + 1))) +
          ' a day.' + (st ? ' So far this month: <b>' + esc(money(st.spent)) + '</b>.' : '');
      };
      cap.addEventListener('input', paintCap);
      paintCap();
      b.appendChild(capNote);
      const zeroed = () => cap.value.trim() !== '' && !num(cap.value, 0) ? 1 : 0;
      h.save = () => {
        const n = name.value.trim();
        if (!n) { name.focus(); return false; }
        if (existing) Rec.set('cat', null, existing.id,
          merge(existing, { name: n, grp: grp.get(), cap: num(cap.value, 0), zero: zeroed() }));
        else {
          const id = makeCat(n, grp.get());
          if (!id) return false;
          if (num(cap.value, 0) || zeroed()) Rec.set('cat', null, id,
            merge(Rec.get('cat', null, id), { cap: num(cap.value, 0), zero: zeroed() }));
        }
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      /* Returns false so the sheet stays open while the confirm is answered.
         An async handler would resolve to a promise, which is not false, and
         the sheet would vanish out from under the question. */
      existing ? { label: 'DELETE', kind: 'bad', fn: h => {
        UI.confirm('Delete ' + existing.name + '?',
          'Anything filed under it becomes uncategorised. Nothing is lost.', { danger: true })
          .then(ok => {
            if (!ok) return;
            const keep = Object.assign({}, existing);
            Rec.del('cat', null, existing.id);
            UI.undo('removed <b>' + esc(existing.name) + '</b>', () => Rec.set('cat', null, keep.id, keep));
            h.close(); draw();
          });
        return false;
      } } : null,
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; ruleCache = null; draw(); return true; } },
    ].filter(Boolean),
  });
}

/* a sorting rule */
function ruleSheet(existing) {
  UI.dialog({
    title: existing ? 'EDIT RULE' : 'A RULE', width: 460,
    body: (b, h) => {
      const match = UI.field('text', { placeholder: 'grab', value: existing ? existing.match : '' });
      b.appendChild(fld('When the description contains', match));
      const cat = picker({
        items: catsAZ().map(c => ({ id: c.id, name: c.name })),
        value: existing ? existing.cat : '', placeholder: 'File it as',
        onCreate: n => makeCat(n, 'var'),
      });
      b.appendChild(fld('File it as', cat));
      b.appendChild(el('div', 'note', 'Case and punctuation are ignored, and the longest matching rule wins, so "smmarket" beats a bare "sm". Saving this sorts every purchase you have ever logged, not just the new ones.'));
      h.save = () => {
        const mv = match.value.trim();
        if (!mv || !cat.get()) { match.focus(); return false; }
        if (existing && norm(existing.match) !== norm(mv)) Rec.del('rule', null, existing.id);
