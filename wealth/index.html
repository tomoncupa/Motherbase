/* filing one of STATUS's spend rows. Writes a `mark`, never the spend. */
function spendSheet(s) {
  UI.dialog({
    title: (s.note || 'THAT PURCHASE').toUpperCase(), width: 460,
    body: (b, h) => {
      b.appendChild(el('div', 'note', esc(money(num(s.amt, 0))) + ' · ' + esc(Day.label(s.date)) +
        ' · ' + esc(acctName(s.acct)) + '. This row belongs to STATUS. WEALTH files it without touching it.'));
      /* A comment left on the statement line this came from. */
      const rc = s.stmt ? recon(s.stmt) : null;
      if (rc && rc.comment) b.appendChild(el('div', 'note', 'Your comment on the statement line: <b>' + esc(rc.comment) + '</b>'));
      const cat = picker({
        items: cats().map(c => ({ id: c.id, name: c.name, note: c.grp === 'move' ? 'not spending' : '' })),
        value: catOf(s), placeholder: 'Which category',
        onCreate: n => makeCat(n, 'var'),
      });
      b.appendChild(fld('Category', cat));
      const tg = picker({
        items: [{ id: '', name: 'No occasion' }].concat(tags().map(t => ({ id: t.id, name: t.name }))),
        value: tagOf(s), placeholder: 'Date, gift, travel', onCreate: makeTag,
      });
      /* Giving an Unsure transfer a real category is remembering it, so the
         Unsure tag goes with it rather than waiting to be cleared by hand. */
      const tagNow = () => (tg.get() === UNSURE && cat.get() && cat.get() !== ONETIME ? '' : tg.get());
      b.appendChild(fld('Occasion, if it had one', tg));
      const big = UI.toggle(isBig(s));
      b.appendChild(UI.row('A big one-off', 'Kept out of every "normal spending" figure, so one large thing does not become the story of the month', big));
      /* The one field WEALTH writes INTO a spend rather than alongside it.
         A time is the fact itself, not a label, so a `mark` would be the
         wrong place for it and two sources of truth for when something
         happened is worse than the separation is worth. Safe because it goes
         through `merge`, which keeps every field STATUS put there. */
      let hhmm = timeOf(s);
      b.appendChild(fld('Time', UI.timeField(hhmm, v => { hhmm = v; })));
      h.save = () => {
        setMark(s, { cat: cat.get(), tag: tagNow(), big: big.on ? 1 : 0 });
        if (hhmm !== timeOf(s)) {
          const row = Rec.get('spend', s.date, s.key);
          if (row) Rec.set('spend', s.date, s.key, merge(row, { t: stampFor(s.date, hhmm) }));
        }
        Mobile.feedback('success');
        return true;
      };
      /* "Always" writes a rule off this description, so it files the whole
         history and not just this one purchase.

         The rule is keyed on WHO WAS PAID, not on the first word. It used to
         take the first word of three letters or more, and every GCash payment
         begins "Payment to": one press on a Lawson purchase would have filed
         every GCash payment as groceries. A transfer to a number keys on the
         number. */
      h.always = () => {
        if (!cat.get()) { UI.toast('pick a category first', { bad: true }); return false; }
        const word = payeeOf(s.bank || s.note).key;
        if (!word) { UI.toast('nothing in the description to make a rule from', { bad: true }); return false; }
        Rec.set('rule', null, 'imp-' + norm(word), { match: word, cat: cat.get() });
        ruleCache = null;
        setMark(s, { cat: cat.get(), tag: tagNow(), big: big.on ? 1 : 0 });
        Mobile.feedback('success');
        UI.toast('anything paid to <b>' + esc(word) + '</b> now files as <b>' + esc(catName(cat.get())) + '</b>, including everything already logged');
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      /* Filing one purchase is a chore. Filing every purchase like it from now
         on is the point, and it is one press away rather than a trip to the
         rules screen. */
      { label: 'DELETE', kind: 'bad', fn: () => { deleteSpend(s); return true; } },
      { label: 'ALWAYS', fn: h => { if (h.always() === false) return false; draw(); return true; } },
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ],
  });
}

/* == logging a purchase here ==
   Tom, 2026-09-11: "I should be able to log spending here."

   STATUS stays the phone in the supermarket queue. This is the desk: putting
   in the four things off a bank statement, or the purchase you forgot on the
   day it happened. It writes the same `spend` row STATUS writes, which is
   allowed and always was — `spend` is shared, and this builds a fresh row
   rather than rebuilding somebody else's.

   The category goes in a `mark` as usual, never into the spend, so the two
   apps still cannot tread on each other. */
function newSpendSheet(preset) {
  UI.dialog({
    title: 'LOG SPENDING', width: 460,
    body: (b, h) => {
      const amt = amountField('');
      b.appendChild(fld('How much', amt));
      const note = UI.field('text', { placeholder: 'Landers, Grab, rent' });
      b.appendChild(fld('What was it', note));
      const acct = chipRow(accts().map(a => ({ id: a.id, name: a.name })),
        S.get('lastAcct', (accts()[0] || {}).id || ''), null, {});
      b.appendChild(fld('Paid from', acct));

      /* Picked, never typed, and it guesses from the description as he types,
         because a rule already knows what "Grab" means. */
      const cat = picker({
        items: cats().map(c => ({ id: c.id, name: c.name, note: c.grp === 'move' ? 'not spending' : '' })),
        value: '', placeholder: 'Which category',
        onCreate: n => makeCat(n, 'var'),
      });
      b.appendChild(fld('Category', cat));
      const guess = el('div', 'note', '');
      b.appendChild(guess);
      note.addEventListener('input', () => {
        const r = ruleFor(note.value);
        guess.innerHTML = r ? 'A rule already files anything saying <b>' + esc(r.match) +
          '</b> as <b>' + esc(catName(r.cat)) + '</b>. Leave the category blank to use it.' : '';
      });

      const tg = picker({
        items: tags().map(x => ({ id: x.id, name: x.name })),
        value: '', placeholder: 'Date, gift, travel', onCreate: makeTag,
      });
      b.appendChild(fld('Occasion, if it had one', tg));
      const date = dateField(preset && preset.date);
      b.appendChild(fld('When', date));
      let hhmm = timeOf({ t: Date.now() });
      b.appendChild(fld('Time', UI.timeField(hhmm, v => { hhmm = v; })));
      const big = UI.toggle(false);
      b.appendChild(UI.row('A big one-off', 'Kept out of every "normal spending" figure', big));

      h.save = () => {
        const v = num(amt.value, 0);
        if (v <= 0) { amt.focus(); return false; }
        /* Law 4's second half, same as money in: the same amount to the same
           account on the same day is a question, not a silent second row. */
        if (!h._forced) {
          const dupe = spendRows({ date: date.value })
            .find(x => num(x.amt, 0) === v && x.acct === acct.get());
          if (dupe) {
            h._forced = 1;
            UI.toast('you already logged <b>' + esc(money(v)) + '</b> from that account on that day. Press save again if it really happened twice', { bad: true });
            return false;
          }
        }
        const key = newId();
        Rec.set('spend', date.value, key, {
          amt: v, acct: acctLabel(acct.get()), note: note.value.trim(),
          t: stampFor(date.value, hhmm), src: 'wealth',
        });
        if (cat.get() || tg.get() || big.on) {
          setMark({ date: date.value, key: key },
            { cat: cat.get(), tag: tg.get(), big: big.on ? 1 : 0 });
        }
        S.set('lastAcct', acct.get());
        Mobile.feedback('success');
        UI.toast('logged <b>' + esc(money(v)) + '</b> out');
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ],
  });
}

        if (!v) { capNote.innerHTML = 'Leave it blank and this category is just counted, never judged.'; return; }
        const st = existing ? capState(existing.id, monthOf(Day.today())) : null;
        capNote.innerHTML = 'That is ' + esc(money(v / 4.345)) + ' a week, or ' +
          esc(money(v / (Day.diff(monthEnd(monthOf(Day.today())), monthStart(monthOf(Day.today()))) + 1))) +
          ' a day.' + (st ? ' So far this month: <b>' + esc(money(st.spent)) + '</b>.' : '');
      };
      cap.addEventListener('input', paintCap);
      paintCap();
      b.appendChild(capNote);
      h.save = () => {
        const n = name.value.trim();
        if (!n) { name.focus(); return false; }
        if (existing) Rec.set('cat', null, existing.id,
          merge(existing, { name: n, grp: grp.get(), cap: num(cap.value, 0) }));
        else {
          const id = makeCat(n, grp.get());
          if (!id) return false;
          if (num(cap.value, 0)) Rec.set('cat', null, id,
            merge(Rec.get('cat', null, id), { cap: num(cap.value, 0) }));
        }
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      /* Returns false so the sheet stays open while the confirm is answered.
         An async handler would resolve to a promise, which is not false, and
         the sheet would vanish out from under the question. */
      existing ? { label: 'DELETE', kind: 'bad', fn: h => {
        UI.confirm('Delete ' + existing.name + '?',
          'Anything filed under it becomes uncategorised. Nothing is lost.', { danger: true })
          .then(ok => {
            if (!ok) return;
            const keep = Object.assign({}, existing);
            Rec.del('cat', null, existing.id);
            UI.undo('removed <b>' + esc(existing.name) + '</b>', () => Rec.set('cat', null, keep.id, keep));
            h.close(); draw();
          });
        return false;
      } } : null,
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; ruleCache = null; draw(); return true; } },
    ].filter(Boolean),
  });
}

/* a sorting rule */
function ruleSheet(existing) {
  UI.dialog({
    title: existing ? 'EDIT RULE' : 'A RULE', width: 460,
    body: (b, h) => {
      const match = UI.field('text', { placeholder: 'grab', value: existing ? existing.match : '' });
      b.appendChild(fld('When the description contains', match));
      const cat = picker({
        items: cats().map(c => ({ id: c.id, name: c.name })),
        value: existing ? existing.cat : '', placeholder: 'File it as',
        onCreate: n => makeCat(n, 'var'),
      });
      b.appendChild(fld('File it as', cat));
      b.appendChild(el('div', 'note', 'Case and punctuation are ignored, and the longest matching rule wins, so "smmarket" beats a bare "sm". Saving this sorts every purchase you have ever logged, not just the new ones.'));
      h.save = () => {
        const mv = match.value.trim();
        if (!mv || !cat.get()) { match.focus(); return false; }
        if (existing && norm(existing.match) !== norm(mv)) Rec.del('rule', null, existing.id);
        Rec.set('rule', null, norm(mv), { match: mv, cat: cat.get() });
        ruleCache = null;
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      existing ? { label: 'DELETE', kind: 'bad', fn: () => {
        const keep = Object.assign({}, existing);
        Rec.del('rule', null, existing.id); ruleCache = null;
        UI.undo('removed that rule', () => { Rec.set('rule', null, keep.id, keep); ruleCache = null; });
        draw(); return true;
      } } : null,
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ].filter(Boolean),
  });
}

/* ══════════════════ the import screen ══════════════════
   Four steps, and nothing is written until the last.
     1  the file, or pasted rows. A locked PDF asks for its password
     2  what the statement says: does it add up, what was not real money,
        and which of the numbers in it are his own accounts
     3  the questions, one at a time
     4  apply                                                         */
function importSheet() {
  let acct = '', stmt = null, settled = null, plan = null, answers = {};
  let dayFirst = null, lastText = '', lastGrid = null, source = 'text';
  let mine = {}, force = false, setup = {}, setupList = [];

  UI.dialog({
    title: 'READ A STATEMENT', width: 680,
    body: (b, h) => {
      const pane = el('div');
      b.appendChild(pane);
      const busy = msg => { pane.innerHTML = ''; pane.appendChild(el('div', 'empty', esc(msg))); };
      const fail = msg => { stepBring(); UI.toast(esc(msg), { bad: true, ms: 8000 }); };
      b.addEventListener('dragover', e => e.preventDefault());
      b.addEventListener('drop', e => {
        e.preventDefault();
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) takeFile(f);
      });

      /* numbers confirmed on this screen, not yet saved */
      const pendingIds = () => {
        const m = {};
        if (acct && stmt) m[acct] = stmt.ids.slice();
        Object.keys(mine).forEach(id => { if (mine[id]) (m[mine[id]] = m[mine[id]] || []).push(id); });
        return m;
      };

      /* ── 1: the file ── */
      function stepBring() {
        pane.innerHTML = '';
        pane.appendChild(el('div', 'note',
          'Choose the file GCash or your bank gave you: the PDF, the spreadsheet, or a CSV. ' +
          'You can also drag it onto this panel, or paste the rows below. Nothing is saved until the last step.'));
        const file = el('input');
        file.type = 'file';
        file.accept = '.pdf,.xlsx,.xls,.csv,.tsv,.txt,application/pdf,text/csv,text/plain';
        file.style.display = 'none';
        file.onchange = () => { if (file.files[0]) takeFile(file.files[0]); };
        pane.appendChild(file);
        const r1 = el('div', 'rowbtns');
        const pick = el('button', 'btn go wide mb-press mb-tap', 'Choose a statement file');
        pick.type = 'button';
        pick.onclick = () => file.click();
        r1.appendChild(pick);
        pane.appendChild(r1);

        pane.appendChild(el('h2', null, 'OR PASTE IT'));
        const ta = UI.field('note', { rows: 6, placeholder: 'Rows copied out of a spreadsheet or a PDF' });
        ta.value = lastText;
        pane.appendChild(ta);
        const r2 = el('div', 'rowbtns');
        const go = el('button', 'btn wide mb-press mb-tap', 'Read what I pasted');
        go.type = 'button';
        go.onclick = () => {
          lastText = ta.value;
          if (!lastText.trim()) { UI.toast('nothing pasted yet', { bad: true }); return; }
          source = 'text'; dayFirst = null;
          reread();
        };
        r2.appendChild(go);
        pane.appendChild(r2);
      }

      async function takeFile(f) {
        dayFirst = null;
        try {
          const kind = fileKind(f);
          if (kind === 'xlsx') {
            busy('Reading the spreadsheet…');
            lastGrid = await openXlsx(await readAs(f, 'buf'));
            source = 'grid';
            return reread();
          }
          if (kind === 'pdf') return openPdfStep(await readAs(f, 'buf'), '');
          lastText = await readAs(f, 'text');
          source = 'text';
          return reread();
        } catch (e) { fail(e.message || String(e)); }
      }
      async function openPdfStep(buf, pw) {
        busy('Reading the PDF…');
        try {
          lastText = (await openPdf(buf, pw)).join('\n');
          source = 'text';
          reread();
        } catch (e) {
          if (e.password) return stepPassword(buf, e.password === 'wrong');
          fail(e.message || String(e));
        }
      }
      function stepPassword(buf, wrong) {
        pane.innerHTML = '';
        pane.appendChild(el('h2', null, 'THIS PDF IS LOCKED'));
        pane.appendChild(el('div', 'note', (wrong ? '<span class="stale">That password did not open it.</span> ' : '') +
          'GCash and most banks lock a statement with a password they tell you when they send it. ' +
          'It is used once, to open this file on this computer, and it is never saved.'));
        const pw = el('input', 'mb-input');
        pw.type = 'password';
        pw.autocomplete = 'off';
        pane.appendChild(fld('Password', pw));
        const r = el('div', 'rowbtns');
        const go = el('button', 'btn go wide mb-press mb-tap', 'Open it');
        go.type = 'button';
        const submit = () => { const v = pw.value; pw.value = ''; openPdfStep(buf, v); };
        go.onclick = submit;
        pw.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
        r.appendChild(go);
        pane.appendChild(r);
        if (UI.focusSoon) UI.focusSoon(pw); else pw.focus();
      }

      function reread() {
        stmt = source === 'grid' ? readTable(lastGrid, dayFirst) : readText(lastText, dayFirst);
        if (!stmt || !stmt.lines.length) {
          return fail(source === 'grid'
            ? 'Could not find a header row with a date and an amount in that spreadsheet.'
            : 'Could not find any dated amounts in that.');
        }
        if (stmt.ambiguous && dayFirst == null) return stepDateAsk();
        settled = settle(stmt);
        acct = guessAcct(stmt) || acct;
        mine = {}; force = false;
        stepStatement();
      }

      /* ── the one thing a file cannot tell you ── */
      function stepDateAsk() {
        pane.innerHTML = '';
        pane.appendChild(el('h2', null, 'ONE QUESTION FIRST'));
        pane.appendChild(el('div', 'note',
          'Every date in this file has a day and a month under thirteen, so nothing in it proves which way round they are. ' +
          'Getting it wrong would put months of spending on the wrong days, so it is worth asking rather than guessing.'));
        const btns = el('div', 'rowbtns');
        [['Day first: 03/04 is the 3rd of April', true],
         ['Month first: 03/04 is the 4th of March', false]].forEach(([lbl, v]) => {
          const btn = el('button', 'btn wide mb-press mb-tap', lbl);
          btn.type = 'button';
          btn.onclick = () => { dayFirst = v; reread(); };
          btns.appendChild(btn);
        });
        pane.appendChild(btns);
      }

      /* ── 2: what the statement says ── */
      function stepStatement() {
        pane.innerHTML = '';
        const C = settled.check;
        const days = settled.real.map(x => x.date).sort();
        pane.appendChild(el('div', 'note', '<b>' + esc(stmt.title || 'Statement') + '</b>' +
          (days.length ? ' · ' + esc(Day.short(days[0])) + ' to ' + esc(Day.short(days[days.length - 1])) : '') +
          ' · ' + stmt.lines.length + ' lines read'));

        pane.appendChild(fld('This statement is for', picker({
          items: accts().map(a => ({ id: a.id, name: a.name })), value: acct,
          placeholder: 'Which account', none: 'No accounts yet. Type a name to add one.',
          onPick: v => { acct = v; mine = {}; stepStatement(); }, onCreate: makeAcct,
        })));

        const g = el('div', 'grid3');
        if (C.balanced) {
          g.appendChild(tile('OPENING', money(C.opening == null ? 0 : C.opening), 'the balance it started on'));
          g.appendChild(tile('CLOSING', money(C.closing), 'the balance it ended on'));
          g.appendChild(tile('ADDS UP', C.ok ? 'Yes' : 'No',
            C.ok ? 'every line, to the centavo' : C.broken + ' place' + (C.broken === 1 ? '' : 's') + ' it does not',
            C.ok ? 'good' : 'bad'));
        } else {
          g.appendChild(tile('ADDS UP', 'Cannot tell', 'this file has no balance column to check against', 'warn'));
        }
        pane.appendChild(g);
        const g2 = el('div', 'grid2');
        g2.style.marginTop = 'var(--s-2)';
        g2.appendChild(tile('REALLY WENT OUT', money(settled.outTotal),
          settled.real.filter(x => x.amt < 0).length + ' payments'));
        g2.appendChild(tile('REALLY CAME IN', money(settled.inTotal),
          settled.real.filter(x => x.amt > 0).length + ' receipts'));
        pane.appendChild(g2);

        if (settled.holds.length) pane.appendChild(el('div', 'note', '<b>' + settled.holds.length +
          ' line' + (settled.holds.length === 1 ? '' : 's') + ' printed as payments that never took money</b>, ' +
          esc(money(settled.heldTotal)) + ' in total. The balance did not move on them, so they are holds, and they are left out.'));
        if (settled.combined) pane.appendChild(el('div', 'note', '<b>' + settled.combined +
          ' part-charge' + (settled.combined === 1 ? '' : 's') + '</b> folded into the payment they finish, so a ride taken in two pieces is one ride at its real price.'));
        if (settled.reversals.length) pane.appendChild(el('div', 'note', '<b>' + settled.reversals.length +
          ' payment' + (settled.reversals.length === 1 ? '' : 's') + ' reversed</b> by the bank. Each one and its reversal cancel, so neither is imported.'));
        if (!C.ok) {
          pane.appendChild(el('div', 'note', '<span class="stale">The balances do not add up line by line.</span> ' +
            'That usually means a page is missing, or the text came out of a PDF in the wrong order. Importing it could put wrong amounts in.'));
          pane.appendChild(UI.row('Import it anyway', 'Only if you have checked it against the statement yourself',
            UI.toggle(force, v => { force = v; })));
        }

        const cands = acct ? counterparts(settled, acct).slice(0, 8) : [];
        if (cands.length) {
          pane.appendChild(el('h2', null, 'ARE ANY OF THESE YOURS?'));
          pane.appendChild(el('div', 'note',
            'Money moving between your own accounts is not spending and not income. Say which of these are yours and ' +
            'it is recorded once, as a transfer, even when both statements show it. Your answer is remembered.'));
          cands.forEach(c => {
            if (!(c.id in mine)) mine[c.id] = preselect(c, cands, acct);
            const row = el('div', 'fld');
            row.appendChild(el('label', null, esc(c.label) + ' · ' + c.n + ' time' + (c.n === 1 ? '' : 's')));
            row.appendChild(chipRow([{ id: '', name: 'Not mine' }].concat(
              accts().filter(a => a.id !== acct).map(a => ({ id: a.id, name: a.name }))),
              mine[c.id], v => { mine[c.id] = v; }));
            pane.appendChild(row);
          });
        }

        const btns = el('div', 'rowbtns');
        const back = el('button', 'btn mb-press mb-tap', 'Start again');
        back.type = 'button';
        back.onclick = () => stepBring();
        btns.appendChild(back);
        const next = el('button', 'btn go wide mb-press mb-tap', 'Check it against what I logged');
        next.type = 'button';
        next.onclick = () => {
          if (!acct) { UI.toast('say which account this statement is for first', { bad: true }); return; }
          if (!C.ok && !force) { UI.toast('the balances do not add up. Turn on "import it anyway" only if you have checked it', { bad: true }); return; }
          plan = planImport(settled.real, acct, pendingIds());
          answers = {};
          setupList = setupItems(plan.fresh.concat(plan.ask, plan.certain).map(x => x.line));
          setupList.forEach(i => { if (!(i.k in setup)) setup[i.k] = i.person ? UNSURE : 'later'; });
          if (setupList.length) stepSetup(); else stepReview();
        };
        btns.appendChild(next);
        pane.appendChild(btns);
      }

      /* ── import setup, asked once ──
         Every payee this import has not seen: pick a category and it becomes
         a rule. The matched text is editable, because a bank's wording does
         not always cut cleanly where the shop name ends. */
      function stepSetup() {
        pane.innerHTML = '';
        const names = setupList.filter(i => !i.person), people = setupList.filter(i => i.person);
        const row = (it, first) => {
          const f = el('div', 'fld');
          f.appendChild(el('label', null, '<b>' + esc(it.label) + '</b> · ' + it.n + ' payment' +
            (it.n === 1 ? '' : 's') + ' · ' + esc(money(it.total))));
          const g = el('div', 'grid2');
          if (!it.person) {
            const match = UI.field('text', { value: it.key });
            match.title = 'The words a description has to contain';
            match.oninput = () => { if (match.value.trim()) it.key = match.value.trim(); };
            g.appendChild(match);
          }
          const sel = el('select', 'mb-input');
          first.concat(cats().map(c => [c.id, c.name])).forEach(([v, t]) => {
            const o = el('option'); o.value = v; o.textContent = t; sel.appendChild(o);
          });
          sel.value = setup[it.k];
          sel.onchange = () => { setup[it.k] = sel.value; };
          g.appendChild(sel);
          f.appendChild(g);
          return f;
        };
        if (names.length) {
          pane.appendChild(el('h2', null, 'SORT WHAT IS NEW'));
          pane.appendChild(el('div', 'note',
            'These names are new to this app. Pick a category once and it becomes a rule: every payment to that name, past and future, files itself. ' +
            'If the matched text on the left caught too much or too little, change it.'));
          names.slice(0, 40).forEach(it => pane.appendChild(row(it,
            [['later', 'Not now, ask next time'], ['leave', 'Leave uncategorised, never ask']])));
          if (names.length > 40) pane.appendChild(el('div', 'note', (names.length - 40) +
            ' smaller names stay as they are and come up again next time.'));
        }
        if (people.length) {
          pane.appendChild(el('h2', null, 'TRANSFERS TO OTHER PEOPLE'));
          pane.appendChild(el('div', 'note',
            'You will not always remember who these were. Unless you pick a category, each is filed as a One-time transfer tagged Unsure. ' +
            'It still counts as money out, and it waits under STILL UNSURE on the Spending screen until you remember.'));
          people.forEach(it => pane.appendChild(row(it, [[UNSURE, 'One-time transfer, unsure']])));
        }
        const btns = el('div', 'rowbtns');
        const back = el('button', 'btn mb-press mb-tap', 'Back');
        back.type = 'button';
        back.onclick = () => stepStatement();
        btns.appendChild(back);
        const next = el('button', 'btn go wide mb-press mb-tap', 'Check it against what I logged');
        next.type = 'button';
        next.onclick = () => stepReview();
        btns.appendChild(next);
        pane.appendChild(btns);
      }

      /* ── 3 and 4: the questions, then what will happen ── */
      function stepReview() {
        pane.innerHTML = '';
        /* A logged entry already given to an earlier answer is not offered
           again: two statement lines must never merge into one entry. A
           question left with nothing to offer is simply a new line. */
        const used = {};
        Object.keys(answers).forEach(k => { const a = answers[k]; if (a && a.row) used[a.row.date + '|' + a.row.key] = 1; });
        plan.ask.forEach(x => { if (!answers[x.id] && !x.cands.some(c => !used[c.date + '|' + c.key])) answers[x.id] = 'new'; });
        const moves = plan.xnew.length + plan.xlink.length;
        const g = el('div', 'grid2');
        g.appendChild(tile('ALREADY IN THE APP', String(plan.known.length + plan.certain.length),
          plan.certain.length ? plan.certain.length + ' matched just now' : 'nothing new to match'));
        g.appendChild(tile('BETWEEN YOUR ACCOUNTS', String(moves),
          plan.xlink.length ? plan.xlink.length + ' already recorded from the other statement' : 'recorded once, as transfers'));
        g.appendChild(tile('NEED YOU', String(plan.ask.filter(x => !answers[x.id]).length),
          plan.ask.length ? 'close, but not certain' : 'nothing ambiguous'));
        g.appendChild(tile('NOT IN THE APP', String(plan.fresh.length), 'would be added'));
        pane.appendChild(g);

        const pending = plan.ask.filter(x => !answers[x.id]);
        if (pending.length) {
          pane.appendChild(el('h2', null, 'ARE THESE THE SAME THING?'));
          pane.appendChild(askOne(pending[0], used));
          pane.appendChild(el('div', 'note', esc(String(pending.length)) + ' left to decide. ' +
            'Nothing is written until you press apply at the end.'));
          return;
        }

        const willAdd = plan.fresh.concat(plan.ask.filter(x => answers[x.id] === 'new'));
        const willMerge = plan.certain.concat(plan.ask.filter(x => answers[x.id] && answers[x.id].row)
          .map(x => ({ line: x.line, id: x.id, match: answers[x.id].row, kind: x.kind })));
        const willSkip = plan.ask.filter(x => answers[x.id] === 'skip');

        if (willMerge.length) {
          pane.appendChild(el('h2', null, 'MATCHED, AND KEPT AS ONE'));
          const l = el('div', 'list');
          willMerge.slice(0, 40).forEach(x => {
            const changed = Math.abs(num(x.match.amt, 0) - Math.abs(x.line.amt)) > 0.005 || x.match.date !== x.line.date;
            l.appendChild(itemRow(x.match.note || x.line.desc,
              Day.short(x.line.date) + ' · ' + esc(x.line.desc) + (changed ? ' · <b>corrected</b>' : ''),
              money(Math.abs(x.line.amt))));
          });
          pane.appendChild(l);
          pane.appendChild(el('div', 'note',
            'Your category, note and receipt stay. The amount, the date and the bank’s own wording are written over the top, so there is one entry and it is the right one.'));
        }
        if (moves) {
          pane.appendChild(el('h2', null, 'MOVED BETWEEN YOUR ACCOUNTS'));
          const l = el('div', 'list');
          plan.xlink.map(x => [x, 1]).concat(plan.xnew.map(x => [x, 0])).slice(0, 40).forEach(([x, linked]) => {
            const r = itemRow(acctName(x.from) + ' to ' + acctName(x.to),
              Day.short(x.line.date) + ' · ' + (linked ? 'already recorded from the other statement' : 'not spending, not income'),
              money(Math.abs(x.line.amt)));
            r.classList.add('dim');
            l.appendChild(r);
          });
          pane.appendChild(l);
        }
        if (willAdd.length) {
          pane.appendChild(el('h2', null, 'WOULD BE ADDED'));
          const l = el('div', 'list');
          willAdd.slice(0, 80).forEach(x => {
            l.appendChild(itemRow(x.line.desc || 'No details',
              Day.short(x.line.date) + (x.line.time ? ' ' + esc(UI.clockLabel(x.line.time)) : '') + ' · ' +
              (x.kind === 'in' ? 'money in' : fileAs(x.line.desc, setup)) +
              (x.line.pieces ? ' · ' + x.line.pieces + ' pieces made one' : ''),
              (x.kind === 'in' ? '+' : '') + money(Math.abs(x.line.amt)), x.kind === 'in' ? 'in' : ''));
          });
          if (willAdd.length > 80) l.appendChild(el('div', 'note', 'and ' + (willAdd.length - 80) + ' more.'));
          pane.appendChild(l);
        }
        if (willSkip.length) pane.appendChild(el('div', 'note', esc(String(willSkip.length)) + ' line' +
          (willSkip.length === 1 ? '' : 's') + ' you told me to leave out. They are remembered, so a second import will not ask again.'));
        const nothing = !willAdd.length && !willMerge.length && !moves;
        if (nothing) pane.appendChild(el('div', 'empty',
          'Everything in this statement is already in the app and matches. Nothing to do, which is the answer you want.'));

        const btns = el('div', 'rowbtns');
        const back = el('button', 'btn mb-press mb-tap', 'Back');
        back.type = 'button';
        back.onclick = () => (setupList.length ? stepSetup() : stepStatement());
        btns.appendChild(back);
        const go = el('button', 'btn go wide mb-press mb-tap',
          'Apply: ' + willMerge.length + ' matched, ' + willAdd.length + ' added, ' + moves + ' transfers');
        go.type = 'button';
        go.disabled = nothing;
        go.style.opacity = nothing ? '.5' : '';
        /* Once. Tom's first GCash import ran twice on 2026-09-13: the page
           froze while saving, a second press queued, and every line was
           saved again 24 seconds later with the same fingerprint. */
        let applied = false;
        go.onclick = () => {
          if (applied) return;
          applied = true; go.disabled = true;
          writeSetup(setupList, setup);
          willMerge.forEach(x => mergeStatement(x, acct));
          willAdd.forEach(x => addStatement(x, acct));
          willSkip.forEach(x => skipStatement(x, acct));
          plan.xnew.forEach(x => writeTransfer(x, acct));
          plan.xlink.forEach(x => linkTransfer(x, acct));
          const ids = pendingIds();
          Object.keys(ids).forEach(a => {
            const cur = idsOf(a).slice();
            ids[a].forEach(i => { if (!cur.some(j => digitsOf(j) === digitsOf(i))) cur.push(String(i)); });
            if (cur.length !== idsOf(a).length) S.set('ids.' + a, cur);
          });
          const no = S.get('notmine', []);
          const nm = Array.isArray(no) ? no.slice() : [];
          Object.keys(mine).forEach(id => { if (!mine[id] && nm.indexOf(id) < 0) nm.push(id); });
          S.set('notmine', nm);

          Mobile.feedback('complete');
          UI.toast('<b>' + willMerge.length + '</b> matched, <b>' + willAdd.length + '</b> added, <b>' + moves + '</b> transfers');
          h.close(); draw();
        };
        btns.appendChild(go);
        pane.appendChild(btns);
      }

      /* ── one question, and only one ── */
      function askOne(q, used) {
        const box = el('div');
        const list = q.cands.filter(x => !(used && used[x.date + '|' + x.key]));
        const c = list[0];

        box.appendChild(side);

        const why = [];

          why.push('the amounts differ by ' + money(Math.abs(num(c.amt, 0) - Math.abs(q.line.amt))));
        if (c.date !== q.line.date) why.push('they are ' + Math.abs(Day.diff(c.date, q.line.date)) + ' days apart');
        if (c.acct !== acct) why.push('you logged it against ' + acctName(c.acct));
        if (why.length) box.appendChild(el('div', 'note', 'Not certain because ' + why.join(', ') + '.'));

        const btns = el('div', 'rowbtns');
        [['Same thing', 'go', () => ({ row: c })], ['Different, add it', '', () => 'new'],
         ['Ignore this line', '', () => 'skip']].forEach(([lbl, kind, val]) => {
          const bt = el('button', 'btn ' + kind + ' mb-press mb-tap', lbl);
          bt.type = 'button';
          bt.onclick = () => { answers[q.id] = val(); Mobile.feedback('select'); stepReview(); };
          btns.appendChild(bt);

        if (list.length > 1) {
          box.appendChild(el('div', 'note', 'Other things it could be:'));

            const r = itemRow(x.note || 'No details', Day.short(x.date) + ' · ' + esc(acctName(x.acct)), money(num(x.amt, 0)));
            r.onclick = () => { answers[q.id] = { row: x }; Mobile.feedback('select'); stepReview(); };
            l.appendChild(r);
          });
          box.appendChild(l);
        }
        return box;
      }

      stepBring();
    },

}

/* ══════════════ right click, hold, rearranging, deleting ══════════════
   Tom, 2026-09-14: "add right click functionality, let me rearrange with
   holding, How do I delete an account?"

   DOCTRINE law 14: anything movable or removable offers a menu on right
   click AND on a hold, both the same list. Law 6: the menu is a shortcut,
   never the only route, so every item in it also exists in that thing's own
   sheet, and every list that can be rearranged shows a grip you can see.

   A row opts in by carrying `r.menu`, a function returning its items, set
   beside its `onclick`. One pass after each draw wires every row, so a list
   only has to say what its menu is.

   Rearranging is for lists whose order is yours to choose: accounts, pots,
   categories and debts. Not clients, which are ranked biggest earner first on
   purpose, and not bills, which run in due-date order. */
function attachMenus(scope) {
  if (typeof Mobile === 'undefined' || !Mobile.hold) return;
  scope.querySelectorAll('.list[data-sort]').forEach(sortable);
  scope.querySelectorAll('.item').forEach(r => {
    if (!r.menu || r.menuWired) return;
    r.menuWired = true;
    Mobile.hold(r, e => {
      const items = r.menu();
      if (items && items.length) menu(e, items, { title: r.menuTitle });
    }, { skip: '.grip' });
  });
  if (window.Icons) Icons.paint(scope);
}

/* == a menu a mouse can choose from ==
   Tom, 2026-09-14: "Input does not work on desktop unless I make the window
   narrow." What did not work was every menu. On a wide window UI.menu draws a
   floating list and closes it on the next press anywhere, and a press on one
   of its own items counts: the list is gone before the click lands, so
   choosing does nothing. A narrow window gets a sheet instead, which is why
   narrowing fixed it. Watched in Chrome at 1424px wide: pointerdown on
   "Money in", mousedown on the page body, no click, no sheet.

   The fault is in shared/ui.js, which an app session does not touch; it is
   item 11 on the root brief's foundation list. Until it is fixed there, this
   swaps that listener for one that ignores presses inside a menu. It also puts
   the menu beside what opened it, instead of the top-left corner. `at` is the
   button that opened it, or the pointer event of a right click or a hold.
   Delete the swap when ui.js is fixed; keep the placing. */
function menu(at, items, opts) {
  let x = 0, y = 0, near = null;
  if (at && at.getBoundingClientRect) { near = at.getBoundingClientRect(); x = near.left; y = near.bottom + 4; }
  else if (at) { x = at.clientX || 0; y = at.clientY || 0; }
  const box = UI.menu(x, y, items, opts);
  if (!box || !box.classList || !box.classList.contains('mb-menu')) return box;
  if (near) {
    const h = box.offsetHeight, w = box.offsetWidth;
    const below = near.bottom + 4 + h <= innerHeight - 8;
    box.style.top = (below ? near.bottom + 4 : Math.max(8, near.top - h - 4)) + 'px';
    box.style.left = Math.max(8, Math.min(near.left, innerWidth - w - 8)) + 'px';
  }
  setTimeout(() => {
    document.removeEventListener('pointerdown', UI.closeMenus);
    const away = e => {
      if (!box.isConnected) return document.removeEventListener('pointerdown', away, true);
      if (e.target.closest && e.target.closest('.mb-menu')) return;
      document.removeEventListener('pointerdown', away, true);
      UI.closeMenus();
    };
    document.addEventListener('pointerdown', away, true);
  }, 0);
  return box;
}

function orderOf(kind) {
  return kind === 'acct' ? accts() : kind === 'pot' ? pots() : kind === 'cat' ? cats() : kind === 'debt' ? debts() : [];
}
/* STATUS sorts accounts by `order`, so that is the field an account keeps its
   place in; everything WEALTH owns uses `ord`. Merged, never rebuilt. */
function saveOrder(kind, ids) {
  const field = kind === 'acct' ? 'order' : 'ord';
  ids.forEach((id, n) => {
    const row = Rec.get(kind, null, id);
    if (!row || row[field] === n) return;
    const patch = {};
    patch[field] = n;
    Rec.set(kind, null, id, merge(row, patch));
  });
}
function nudge(kind, id, dir) {
  const ids = orderOf(kind).map(x => x.id);
  const i = ids.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= ids.length) return;
  ids.splice(j, 0, ids.splice(i, 1)[0]);
  saveOrder(kind, ids);
  Mobile.feedback('select');
  draw();
}
const moveItems = (kind, id) => {
  const ids = orderOf(kind).map(x => x.id), i = ids.indexOf(id);
  return [
    i > 0 ? { label: 'Move up', fn: () => nudge(kind, id, -1) } : null,
    i > -1 && i < ids.length - 1 ? { label: 'Move down', fn: () => nudge(kind, id, 1) } : null,
  ].filter(Boolean);
};

/* == dragging a row somewhere else ==
   A mouse presses a row and drags it. A thumb drags by the grip, because on
   a narrow window pressing a row and moving is how you scroll. The new order
   is read back off the page when the row is dropped, so what you see is what
   is saved. */
function sortable(list) {
  if (list.sortWired) return;
  list.sortWired = true;
  const kind = list.dataset.sort;
  list.querySelectorAll('.item[data-id]').forEach(r => {
    const grip = el('span', 'grip');
    grip.setAttribute('data-icon', 'drag');
    grip.setAttribute('aria-hidden', 'true');
    r.insertBefore(grip, r.firstChild);
  });
  const unitOf = row => { let n = row; while (n.parentElement && n.parentElement !== list) n = n.parentElement; return n; };
  const order = () => [].slice.call(list.children)
    .map(k => (k.matches('.item[data-id]') ? k : k.querySelector('.item[data-id]')))
    .filter(Boolean).map(k => k.dataset.id);
  let drag = null;
  list.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const row = e.target.closest('.item[data-id]');
    if (!row || !list.contains(row)) return;
    const onGrip = !!e.target.closest('.grip');
    if (e.pointerType !== 'mouse' && !onGrip) return;
    drag = { row: row, unit: unitOf(row), sy: e.clientY, id: e.pointerId, live: false, grip: onGrip, was: order() };
  });
  list.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.live) {
      if (Math.abs(e.clientY - drag.sy) < (drag.grip ? 3 : 6)) return;
      drag.live = true;
      try { list.setPointerCapture(e.pointerId); } catch (x) {}
      drag.unit.classList.add('dragging');
    }
    e.preventDefault();
    const others = [].slice.call(list.children).filter(k => k !== drag.unit);
    const over = others.find(k => { const b = k.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; });
    if (over) { if (drag.unit.nextSibling !== over) list.insertBefore(drag.unit, over); }
    else if (list.lastChild !== drag.unit) list.appendChild(drag.unit);
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    if (!d.live) return;
    d.unit.classList.remove('dragging');
    /* The click that ends a drag is not a tap on the row. */
    const eat = ev => { ev.stopPropagation(); ev.preventDefault(); };
    list.addEventListener('click', eat, true);
    const now = order();
    if (now.join('|') !== d.was.join('|')) { saveOrder(kind, now); Mobile.feedback('select'); }
    setTimeout(() => { list.removeEventListener('click', eat, true); draw(); }, 40);
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
}

/* A client with history is not deleted: their payments would point at
   nobody. Finished keeps the history and takes them off every list that
   expects money. */
function deleteClient(c) {
  const pays = paidRows({}).filter(p => p.client === c.id).length;
  const ses = seshOf(c.id).length, pk = packsOf(c.id).length;
  if (pays || ses || pk) {
    const has = [[pays, 'payment'], [ses, 'session'], [pk, 'package']].filter(x => x[0])
      .map(x => x[0] + ' ' + x[1] + (x[0] === 1 ? '' : 's'));

        Rec.set('client', null, c.id, merge(Rec.get('client', null, c.id), { status: 'done' })); draw(); } } : undefined,
    });

/* == deleting an account ==
   Every purchase, payment, transfer, bill and pot that names the account is
   moved to another one first, so nothing is left pointing at an account that
   is gone. A transfer between the two becomes money moving to itself, which is
   no movement, so it goes. Balance counts go with the account: a count of one
   account is not a count of another. The whole move is one undo. */
function acctRefs(id) {
  return {
    spend: Rec.all('spend').filter(r => r.payload && acctKey(r.payload.acct) === id),
    paid: Rec.all('paid').filter(r => r.payload && acctKey(r.payload.acct) === id),
    xfer: Rec.all('xfer').filter(r => r.payload && (r.payload.from === id || r.payload.to === id)),
    bill: Rec.all('bill').filter(r => r.payload && r.payload.acct === id),
    pot: Rec.all('pot').filter(r => r.payload && r.payload.acct === id),
    count: Rec.all('count').filter(r => r.key === id),
  };
}
function deleteAcct(a) {
  const refs = acctRefs(a.id);
  const parts = [[refs.spend.length, 'purchase', 'purchases'], [refs.paid.length, 'payment in', 'payments in'],
    [refs.xfer.length, 'transfer', 'transfers'], [refs.bill.length, 'bill', 'bills'], [refs.pot.length, 'pot', 'pots']]
    .filter(x => x[0]).map(x => x[0] + ' ' + (x[0] === 1 ? x[1] : x[2]));
  const others = accts().filter(x => x.id !== a.id);
  let target = others[0] ? others[0].id : '';
  UI.dialog({
    title: 'DELETE ' + a.name.toUpperCase(), width: 480,
    body: b => {
      if (!parts.length) {
        b.appendChild(el('div', 'note', 'Nothing is recorded against <b>' + esc(a.name) + '</b>' +
          (refs.count.length ? ' except its balance counts, which go with it' : '') + '.'));
        return;
      }
      b.appendChild(el('div', 'note', '<b>' + esc(a.name) + '</b> has ' + esc(andList(parts)) +
        '. They move to another account first, so none of them is left without one.'));
      if (!others.length) {
        b.appendChild(el('div', 'note', '<span class="stale">There is no other account to move them to. Add one first.</span>'));
        return;
      }
      b.appendChild(fld('Move them to', chipRow(others.map(x => ({ id: x.id, name: x.name })), target, v => { target = v; })));
      if (refs.xfer.length) b.appendChild(el('div', 'note',
        'A transfer between ' + esc(a.name) + ' and the account they move to would be money moving to itself, so it is removed.'));
      if (refs.count.length) b.appendChild(el('div', 'note', 'Its balance counts go with it.'));
    },
    actions: [
      { label: 'CANCEL' },
      { label: parts.length ? 'MOVE AND DELETE' : 'DELETE', kind: 'bad', fn: () => {
        if (parts.length && !target) return false;
        doDeleteAcct(a, refs, target);
        draw();
        return true;
      } },
    ],
  });
}
function doDeleteAcct(a, refs, target) {
  const undo = [];
  const put = (type, date, key, payload) => {
    undo.push([type, date, key, Rec.get(type, date, key)]);
    if (payload) Rec.set(type, date, key, payload); else Rec.del(type, date, key);
  };
  const tName = target ? acctLabel(target) : '';
  let moved = 0, dropped = 0;
  refs.spend.forEach(r => { put('spend', r.date, r.key, merge(r.payload, { acct: tName })); moved++; });
  refs.paid.forEach(r => { put('paid', r.date, r.key, merge(r.payload, { acct: target })); moved++; });
  refs.xfer.forEach(r => {
    const p = Object.assign({}, r.payload);
    if (p.from === a.id) p.from = target;
    if (p.to === a.id) p.to = target;
    put('xfer', r.date, r.key, p.from === p.to ? null : p);
    if (p.from === p.to) dropped++; else moved++;
  });
  refs.bill.forEach(r => { put('bill', r.date, r.key, merge(r.payload, { acct: target })); moved++; });
  refs.pot.forEach(r => { put('pot', r.date, r.key, merge(r.payload, { acct: target })); moved++; });
  refs.count.forEach(r => put('count', r.date, r.key, null));
  const hadIds = Rec.get('setting', null, 'wealth.ids.' + a.id);
  if (hadIds) Rec.del('setting', null, 'wealth.ids.' + a.id);
  put('acct', null, a.id, null);
  Mobile.haptic('warn');
  UI.undo('deleted <b>' + esc(a.name) + '</b>' + (moved ? ', ' + moved + ' moved to ' + esc(tName) : '') +
    (dropped ? ', ' + dropped + ' transfer' + (dropped === 1 ? '' : 's') + ' to itself removed' : ''), () => {
    undo.slice().reverse().forEach(([type, date, key, payload]) => {
      if (payload) Rec.set(type, date, key, payload); else Rec.del(type, date, key);
    });
    if (hadIds) Rec.set('setting', null, 'wealth.ids.' + a.id, hadIds);
    draw();
  }, { ms: 10000 });
}

    { label: 'A sorting rule', fn: () => ruleSheet() },
  ], { title: 'ADD' });
  if (TAB === 'spend') return newSpendSheet(ANCHOR && PERIOD === 'day' ? { date: ANCHOR } : null);
  return paidSheet();
};

/* ── drawing ── */
function drawNav() {
  const n = document.getElementById('nav');
  n.innerHTML = '';
  TABS.forEach(([id, label]) => {
    const b = el('button', (id === TAB ? 'on ' : '') + 'mb-tap', esc(label));
    b.onclick = () => { if (TAB === id) return; TAB = id; CATFILTER = null; Mobile.feedback('nav'); S.set('tab', id); draw(); };
    n.appendChild(b);
  });
}
function draw() {
  drawNav();
  const m = document.getElementById('main');
  m.innerHTML = '';
  try {
    if (TAB === 'score') drawScore(m);
    else if (TAB === 'in') drawIn(m);
    else if (TAB === 'clients') drawClients(m);
    else if (TAB === 'out') drawOut(m);
    else if (TAB === 'spend') drawSpend(m);
    else if (TAB === 'pots') drawPots(m);
    else drawAccounts(m);
  } catch (e) {
    console.error('[wealth]', e);
    m.appendChild(el('div', 'card', '<b>Something went wrong drawing this screen.</b><div class="note">' +
      esc(String(e && e.message || e)) + '</div>'));
  }
  attachMenus(m);
}

/* ══ first paint does not wait for the store ══
   Root brief, foundation item 2. Paint what localStorage already handed us,
   then redraw when the big half lands. STATUS is the app that got this wrong
   and shows a blank screen when IndexedDB is slow.                         */
seed();
drawCurBtn();
TAB = S.get('tab', 'score');
PERIOD = S.get('period', 'month');
draw();
Rec.ready(() => { seed(); ruleCache = null; drawCurBtn(); draw(); });
/* Every saved row announces itself, one at a time. Redrawing the whole app on
   each one made reading a statement a 22 second freeze, long enough that a
   second press on Apply queued up and saved the whole statement again. One
   redraw per burst of saves. */
let drawT = null;
Rec.on(() => { ruleCache = null; if (!drawT) drawT = setTimeout(() => { drawT = null; draw(); }, 0); });
Day.on(draw);
</script>
</body>
