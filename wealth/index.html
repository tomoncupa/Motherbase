/* == what is recurring, and what is not ==
   Tom, 2026-09-17, said yes to splitting them. Client money and one-off money
   behave differently and the app was treating them the same, so a month
   carried by one commercial read exactly like a month carried by his clients.

   `clientMonthly` returns null for a client the app cannot value, a session
   client with no pace, so those are counted separately rather than as zero. A
   client whose worth is unknown is not a client worth nothing. */
function recurringIn() {
  let known = 0, unknown = 0;
  clients().forEach(c => {
    if (c.status === 'done') return;
    const v = clientMonthly(c);
    if (v == null) unknown++; else known += v;
  });
  return { known: known, unknown: unknown };
}
function shapeCard() {
  const mo = monthOf(Day.today());
  const rows = paidRows({ from: monthStart(mo), to: monthEnd(mo) }).filter(x => !isLoanIn(x));
  const fromClients = rows.filter(x => x.client).reduce((a, x) => a + num(x.amt, 0), 0);
  const oneOff = rows.filter(x => !x.client).reduce((a, x) => a + num(x.amt, 0), 0);
  const rec = recurringIn(), costs = costsMonthly();
  const gap = costs - rec.known;
  const c = card('RECURRING AND ONE-OFF');
  const g = el('div', 'grid2');
  g.appendChild(tile('FROM CLIENTS', short(fromClients), monthName(mo)));
  g.appendChild(tile('ONE-OFF', short(oneOff), 'commercials, workshops, anything'));
  c.appendChild(g);
  c.appendChild(el('div', 'note', 'Your clients are worth about <b>' + esc(money(rec.known)) +
    '</b> a month on their terms' + (rec.unknown
      ? ', and ' + rec.unknown + ' more cannot be valued until you set their sessions a week'
      : '') + '. The month costs <b>' + esc(money(costs)) + '</b>.' +
    (gap > 0
      ? ' The difference, <b>' + esc(money(gap)) + '</b>, is what one-off work has to cover every month.'
      : ' Your clients cover it.')));
  return c;
}

function netCard() {
  const now = monthOf(Day.today()), prev = monthBack(now, 1);
  const inNow = monthIn(now), outNow = monthSpend(now).total, net = inNow - outNow;
  const inPrev = monthIn(prev), outPrev = monthSpend(prev).total, netPrev = inPrev - outPrev;
  const c = card(monthName(now).toUpperCase());
  const g = el('div', 'grid3');
  g.appendChild(tile('IN', short(inNow), 'received this month'));
  g.appendChild(tile('OUT', short(outNow), 'spent this month'));
  g.appendChild(tile('NET', (net > 0 ? '+' : '') + short(net),
    net >= 0 ? 'the month paid for itself' : 'more went out than came in',
    net < 0 ? 'bad' : 'good'));
  c.appendChild(g);
  if (inPrev || outPrev) c.appendChild(el('div', 'note', monthName(prev) + ': <b>' +
    esc((netPrev > 0 ? '+' : '') + money(netPrev)) + '</b> net, ' + esc(money(inPrev)) + ' in and ' +
    esc(money(outPrev)) + ' out.'));
  return c;
}

/* ── MONEY IN ── */
function drawIn(m) {
  m.appendChild(netCard());
  m.appendChild(shapeCard());
  const now = monthOf(Day.today());
  const exp = expected(monthStart(monthBack(now, 1)), monthEnd(monthBack(now, -2)));
  const late = exp.filter(e => e.late);

  const c0 = card('OWED TO YOU');
  if (!late.length) {
    c0.appendChild(el('div', 'empty', clients().length ? 'Nobody is late. Everything expected so far has arrived.'
      : 'No clients yet. Add them under <b>CLIENTS</b>, with what they pay and how often.'));
  } else {
    const list = el('div', 'list');
    late.forEach(e => {
      const r = itemRow(e.client.name, 'due ' + Day.short(e.date) + ' · ' +
        away(e.date) + (e.why ? ' · ' + esc(e.why) : ''), money(e.amt), 'late');
      r.onclick = () => payFor(e); r.menu = () => dueMenu(e);
      list.appendChild(r);
    });
    c0.appendChild(list);
    c0.appendChild(el('div', 'note', 'Total outstanding: <b>' +
      esc(money(late.reduce((a, e) => a + e.amt, 0))) + '</b>'));
  }
  m.appendChild(c0);

  /* Coming up. */
  const soon = exp.filter(e => !e.paid && !e.late).slice(0, 12);
  const c1 = card('EXPECTED NEXT');
  if (!soon.length) c1.appendChild(el('div', 'empty', 'Nothing dated is coming up. Clients paid by the session have no date until the block is finished, so they show under <b>CLIENTS</b> instead.'));
  else {
    const list = el('div', 'list');
    soon.forEach(e => {
      const r = itemRow(e.client.name, (e.est ? 'about ' : '') + Day.short(e.date) + ' · ' + away(e.date) +
        (e.why ? ' · ' + esc(e.why) : ''), money(e.amt));
      r.onclick = () => payFor(e); r.menu = () => dueMenu(e);
      list.appendChild(r);
    });
    c1.appendChild(list);
  }
  m.appendChild(c1);

  /* Where it came from: who paid, as a pie or ranked bars, over this month,
     three months or a year. Tom, 2026-09-14: "I would like some pie charts in
     WEALTH, perhaps give me more viewing options there." */
  const IN_SPANS = [{ id: '1', name: 'THIS MONTH' }, { id: '3', name: '3 MONTHS' }, { id: '12', name: 'A YEAR' }];
  const inSpan = ['1', '3', '12'].indexOf(String(S.get('inSpan', '1'))) > -1 ? String(S.get('inSpan', '1')) : '1';
  const inView = S.get('inView', 'pie') === 'bars' ? 'bars' : 'pie';
  const c2 = card('WHERE IT CAME FROM', 'full');
  const inCtl = el('div', 'rowbtns');
  inCtl.style.flexWrap = 'wrap';
  inCtl.appendChild(UI.segmented(IN_SPANS, inSpan, v => { S.set('inSpan', v); draw(); }));
  inCtl.appendChild(UI.segmented(VIEWS, inView, v => { S.set('inView', v); draw(); }));
  c2.appendChild(inCtl);
  const byWho = {};
  paidRows({ from: monthStart(monthBack(now, +inSpan - 1)), to: Day.today() }).forEach(p => {
    const c = p.client ? Rec.get('client', null, p.client) : null;
    const k = c && c.name ? c.name : 'One-offs';
    byWho[k] = (byWho[k] || 0) + num(p.amt, 0);
  });
  const inRows = Object.keys(byWho).map(k => ({ id: k, name: k, amt: byWho[k] })).filter(r => r.amt > 0);
  if (!inRows.length) c2.appendChild(el('div', 'empty', 'Nothing came in over this stretch.'));
  else shareView(c2, inRows, inView, { label: 'came in' });
  m.appendChild(c2);

  /* Everything that has arrived. */
  const c3 = card('RECEIVED', 'full');
  const got = paidRows({ from: Day.shift(Day.today(), -120) }).sort((a, b) => b.date.localeCompare(a.date));
  if (!got.length) c3.appendChild(el('div', 'empty', 'Nothing recorded yet. Press <b>+</b> to log a payment or a one-off.'));
  else {
    const list = el('div', 'list');
    got.slice(0, 40).forEach(p => {
      const c = p.client ? Rec.get('client', null, p.client) : null;
      const named = !c && payerName(p.note);
      const r = itemRow(paidTitle(p),
        Day.short(p.date) + ' · ' + esc(acctName(p.acct)) +
        (isLoanIn(p) ? ' · <b>borrowed</b>' : '') +
        ((c || named) && p.note ? ' · ' + esc(p.note) : ''),
        money(num(p.amt, 0)), isLoanIn(p) ? '' : 'in');
      r.onclick = () => paidSheet(p); r.menu = () => paidMenu(p);
      list.appendChild(r);
    });
    c3.appendChild(list);
    const borrowed = got.filter(isLoanIn).reduce((a, x) => a + num(x.amt, 0), 0);
    if (borrowed) c3.appendChild(el('div', 'note', '<b>' + esc(money(borrowed)) +
      '</b> of this was borrowed, not earned. It is in your accounts and out of every income figure. ' +
      'What you owe is yours to write down under DEBTS.'));
  }
  m.appendChild(c3);
}
/* How far off a day is, in words. One function, because "in 0 days" and
   "in 1 days" are the kind of thing that comes back one screen at a time. */
function away(date) {
  const n = Day.diff(date, Day.today());
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  return n > 0 ? 'in ' + n + ' days' : n * -1 + ' days ago';
}
const acctName = id => (Rec.get('acct', null, acctKey(id)) || {}).name || 'unknown account';

/* ── CLIENTS ──
   Tom, 2026-09-14: "Can I get a dedicated clients tab?" Everything about a
   client in one place: who they are, how they pay, where each one stands
   today, and the session tracker for the ones paid by the session. MONEY IN
   stays about money arriving: what is owed, what is next, what came in. */
function drawClients(m) {
  const today = Day.today();
  const exp = expected(Day.shift(today, -90), Day.shift(today, 70));
  const late = {}, next = {};
  exp.forEach(e => {
    const id = e.client.id;
    if (e.late && (!late[id] || e.date < late[id].date)) late[id] = e;
    if (!e.paid && !e.late && (!next[id] || e.date < next[id].date)) next[id] = e;
  });
  /* Where a client stands, in a few words on their own row: the oldest date
     still unpaid, or else the next one coming. */
  const standing = c => {
    if (c.status === 'done') return '';
    if (late[c.id]) return ' · <b>late since ' + esc(Day.short(late[c.id].date)) + '</b>';
    if (next[c.id]) return ' · next ' + (next[c.id].est ? 'about ' : '') + esc(Day.short(next[c.id].date));
    return '';
  };

  const all = clients(), active = all.filter(c => c.status !== 'done');
  const due = exp.filter(e => monthOf(e.date) === monthOf(today));
  const owed = exp.filter(e => e.late).reduce((t, e) => t + num(e.amt, 0), 0);
  const lateCount = Object.keys(late).length;
  const c0 = card(null, 'full');
  const g = el('div', 'grid3');
  g.appendChild(tile('ACTIVE', String(active.length),
    all.length > active.length ? (all.length - active.length) + ' finished' : (active.length === 1 ? 'client' : 'clients')));
  g.appendChild(tile('DUE THIS MONTH', short(due.reduce((t, e) => t + num(e.amt, 0), 0)),
    due.filter(e => e.paid).length + ' of ' + due.length + ' paid'));
  g.appendChild(tile('OWED', owed ? short(owed) : 'Nothing',
    owed ? 'across ' + lateCount + ' client' + (lateCount === 1 ? '' : 's') : 'everyone is up to date',
    owed ? 'warn' : 'good'));
  c0.appendChild(g);
  m.appendChild(c0);

  /* Clients, with everything about them. Set by Tom. */
  const c2 = card('EVERY CLIENT', 'full');
  const cl = clients();
  if (!cl.length) c2.appendChild(el('div', 'empty', 'No clients yet. Press <b>+</b> to add one, then say what they pay and how often.'));
  else {
    const yearIn = paidRows({ from: Day.shift(Day.today(), -365) });
    const list = el('div', 'list');
    /* Biggest first, because concentration is the thing this list is for and
       a list sorted by name buries it. Measured by what each client is worth a
       month on their current terms, not by payments logged, which only go back
       as far as WEALTH does. */
    const ranked = cl.map(c => ({ c: c, n: yearIn.filter(p => p.client === c.id).length, worth: clientMonthly(c) }));
    const total = ranked.reduce((a, x) => a + (x.worth || 0), 0);
    ranked.forEach(x => { x.share = total && x.worth ? x.worth / total : 0; });
    ranked.sort((a, b) => (b.worth || 0) - (a.worth || 0));
    ranked.forEach((x, i) => {
      const c = x.c;
      /* A pace is his rough figure, so a worth built on it says "about". */
      const guess = isPack(c) || cycleOf(c).kind === 'sesh';
      /* A package client has no fixed rate, so a rate would print as zero.
         Their packages are priced one at a time. */
      const r = itemRow(c.name + (c.status === 'done' ? ' (finished)' : ''),
        (isPack(c) ? 'Paid ' + cycleWord(c) : money(num(c.rate, 0)) + ' ' + cycleWord(c)) +
        (perSession(c) ? ' · ' + earnWords(perSession(c), num(c.perWeek, 0)) : '') +
        ' · ' + x.n + (x.n === 1 ? ' payment logged · ' : ' payments logged · ') +
        (x.worth == null ? 'put in sessions a week to see a month’s worth'
          : Math.round(x.share * 100) + '% of what clients are worth a month') + standing(c),
        x.worth == null ? '—' : (guess ? 'about ' : '') + money(x.worth) + '/mo',
        late[c.id] && c.status !== 'done' ? 'late' : '');
      if (c.status === 'done') r.classList.add('dim');
      r.onclick = () => clientSheet(c); r.menu = () => clientMenu(c);
      const bar = el('div', 'bar c' + (1 + (i % 6)));
      bar.appendChild(el('i')).style.width = (x.share * 100).toFixed(1) + '%';
      list.appendChild(stack(r, bar));
    });
    c2.appendChild(list);
    /* Law 5: show the number, never the verdict. */
    c2.appendChild(el('div', 'note', 'Share of what your clients are worth a month on their current terms, biggest first. ' +
      'Payments from before WEALTH cannot change it. A session or package client is worth their price times their sessions a week. No opinion offered.'));
  }
  m.appendChild(c2);


  /* == clients paid by the session ==
     Their next payment is not a date, so nothing above can show it. What
     matters day to day is how close the block is, and the button he presses
     the moment a session finishes. */
  const bySesh = clients().filter(c => c.status !== 'done' &&
    ['sesh', 'pack'].indexOf(cycleOf(c).kind) > -1);
  if (bySesh.length) {
    const cs = card('SESSIONS');
    const list = el('div', 'list');
    bySesh.forEach((c, i) => {
      let sub, fig, pct, bad;
      if (isPack(c)) {
        /* Bought before delivered, so the bar fills as the package empties
           and the figure is sessions he still has to give them. */
        const st = packState(c);
        sub = st.delivered + ' of ' + st.bought + ' delivered' +
          (st.owed ? ' · <b>' + esc(money(st.owed)) + ' owed</b>'
            : st.toCome ? ' · ' + esc(money(st.toCome)) + ' to come' : ' · paid up');
        fig = st.left + ' left';
        pct = st.bought ? (st.delivered / st.bought * 100) : 0;
        bad = !!st.owed;
      } else {
        const st = seshDues(c);
        const got = paidRows({}).filter(x => x.client === c.id).length;
        const owed = Math.max(0, st.dues.length - got);
        sub = st.into + ' of ' + st.every + ' towards the next ' + money(num(c.rate, 0)) +
          (owed ? ' · <b>' + owed + ' block' + (owed > 1 ? 's' : '') + ' owed</b>' : '');
        fig = st.into + '/' + st.every;
        pct = st.into / st.every * 100;
        bad = !!owed;
      }
      const r = itemRow(c.name, sub, fig, bad ? 'late' : '');
      r.onclick = () => clientSheet(c); r.menu = () => clientMenu(c);
      const bar = el('div', 'bar c' + (1 + (i % 6)));
      bar.appendChild(el('i')).style.width = Math.max(0, Math.min(100, pct)).toFixed(1) + '%';
      list.appendChild(stack(r, bar));
    });
    cs.appendChild(list);
    const btns = el('div', 'rowbtns');
    const add = el('button', 'btn go wide mb-press mb-tap', 'Log a session');
    add.type = 'button';
    const note = c => isPack(c) ? packState(c).left + ' left'
      : seshDues(c).into + ' of ' + seshDues(c).every;
    add.onclick = () => {
      if (bySesh.length === 1) { addSesh(bySesh[0].id, Day.today()); Mobile.feedback('success');
        UI.toast('logged a session for <b>' + esc(bySesh[0].name) + '</b>'); draw(); return; }
      menu(add, bySesh.map(c => ({ label: c.name, note: note(c),
        fn: () => { addSesh(c.id, Day.today()); Mobile.feedback('success');
          UI.toast('logged a session for <b>' + esc(c.name) + '</b>'); draw(); } })),
        { title: 'WHOSE SESSION' });
    };
    btns.appendChild(add);
    cs.appendChild(btns);
    /* The liability nobody tracks: sessions paid for and not yet given. */
    const owedWork = bySesh.filter(isPack).reduce((a, c) => a + packState(c).owedWork, 0);
    if (owedWork) cs.appendChild(el('div', 'note',
      'You owe <b>' + esc(String(owedWork)) + '</b> session' + (owedWork === 1 ? '' : 's') +
      ' that are already paid for. That is work booked, not money coming.'));
    m.appendChild(cs);
  }

}

/* ── MONEY OUT ── */
function drawOut(m) {
  m.appendChild(netCard());
  const bl = bills();
  /* Tom, 2026-09-14: three cards, every bill in exactly one. Bills and
     utilities; subscriptions, memberships and operating costs, "emphasise the
     monthly cost not the annual"; and groceries, water and regular spending.
     The card follows the bill's category, so re-filing a bill moves it. A
     card title says what is on it, not how to feel about it. */
  /* Groceries is named, like Drinking Water. Tom, 2026-09-16: "Groceries
     doesnt show up in groceries". His Groceries was not Variable, so it
     followed its kind into BILLS. A card named after it holds it whatever
     its kind says. */
  const shelfOf = id => ['subs', 'gym'].indexOf(id) > -1 || catGrp(id) === 'biz' ? 'subs'
    : id === 'water' || id === 'groceries' || catGrp(id) === 'var' ? 'regular' : 'bills';
  const shelf = b => shelfOf(b.cat);
  const hasAllowance = id => { const c = Rec.get('cat', null, id) || {}; return num(c.cap, 0) > 0 || !!c.zero; };
  /* An allowance sits in the card its category belongs to, with what has
     gone against it this month from every account. Over is said as a number,
     because he asked to see it: "I also want it to show if I went over". */
  const allowRow = cat => {
    const st = capState(cat.id, monthOf(Day.today()));
    const r = itemRow(cat.name, esc(money(st.spent)) + ' of ' + esc(money(st.cap)) + ' spent this month · ' +
      (st.left >= 0 ? esc(money(st.left)) + ' left' : '<b>' + esc(money(-st.left)) + ' over</b>'),
      money(st.cap) + '/mo', st.over ? 'late' : '');
    r.onclick = () => catSheet(cat); r.menu = () => catMenu(cat);
    const bar = el('div', 'bar c1');
    bar.appendChild(el('i')).style.width = Math.min(100, st.pct * 100).toFixed(1) + '%';
    return stack(r, bar);
  };
  const billRow = b => {
    /* Tom, 2026-09-14: "Change 'Day X of the month' to just the number." */
    const r = itemRow(b.name, (b.cycle === 'days'
        ? 'every ' + num(b.every, 7) + ' days, ' + money(num(b.amt, 0)) + ' each'
        : num(b.months, 1) > 1 ? 'every ' + Math.round(num(b.months, 1)) + ' months on the ' + num(b.day, 1) + ', ' + money(num(b.amt, 0)) + ' each'
        : num(b.day, 1)) + ' · ' + catName(b.cat) +
      (b.acct ? ' · ' + esc(acctName(b.acct)) : ''), money(billMonthly(b)) + '/mo');
    r.onclick = () => billSheet(b); r.menu = () => billMenu(b);
    r.dataset.id = b.id;
    return r;
  };
  const shelfCard = (id, title, empty, more, extra) => {
    const list = bl.filter(b => shelf(b) === id);
    const allow = capped().filter(x => shelfOf(x.id) === id);
    const c = card(title);
    if (!list.length && !allow.length) c.appendChild(el('div', 'empty', empty));
    else {
      const l = el('div', 'list');
      /* One card is one list, so a drag settles the order inside the card it
         happened in and leaves the other two alone. The allowances sit in a
         list of their own: they are categories, they are rearranged where
         categories are, and a row that cannot be dropped has no business
         inside a list that can. */
      if (list.length > 1) l.dataset.sort = 'bill';
      list.forEach(b => l.appendChild(billRow(b)));
      c.appendChild(l);
      if (allow.length) {
        const al = el('div', 'list');
        allow.forEach(x => al.appendChild(allowRow(x)));
        c.appendChild(al);
      }
      /* A bill under a category with an allowance is inside that allowance,
         so it is not added to the month a second time. */
      const mo = list.filter(b => !hasAllowance(b.cat)).reduce((a, b) => a + billMonthly(b), 0) +
        allow.reduce((a, x) => a + num(x.cap, 0), 0);
      c.appendChild(el('div', 'note', '<b>' + esc(money(mo)) + '</b> a month' + (more ? more(mo) : '') + '.'));
    }
    if (extra) extra(c);
    m.appendChild(c);
  };
  shelfCard('bills', 'BILLS & UTILITIES', bl.length
    ? 'Nothing here yet. Rent, electricity and other bills show here.'
    : 'Nothing listed. Press <b>+</b> and add your rent first. Runway cannot be worked out without these.');
  shelfCard('subs', 'SUBSCRIPTIONS, MEMBERSHIPS & OPERATING COSTS',
    'Nothing here yet. Bills filed as Subscriptions, Gym, Operating costs or Marketing show here.',
    mo => ', ' + esc(money(mo * 12)) + ' over a year');
  shelfCard('regular', 'GROCERIES, WATER & REGULAR SPENDING',
    'Nothing here yet. Allot a monthly amount to Groceries, or add a bill filed as Drinking Water or another everyday category.',
    null, c => {
      const open = cats().filter(x => shelfOf(x.id) === 'regular' && !hasAllowance(x.id));
      if (!open.length) return;
      const b = el('button', 'btn mb-press mb-tap', 'Allot a monthly amount');
      b.type = 'button';
      b.onclick = () => menu(b, open.map(x => ({ label: x.name, fn: () => catSheet(x) })), { title: 'ALLOT TO' });
      const r = el('div', 'rowbtns');
      r.appendChild(b);
      c.appendChild(r);
    });

  const dl = debts();
  const c3 = card('DEBTS');
  if (!dl.length) c3.appendChild(el('div', 'empty', 'Nothing owed, or nothing listed yet. Press <b>+</b> to add one, and it sits beside your cash rather than being taken off it.'));
  else {
    const list = el('div', 'list');
    list.dataset.sort = 'debt';
    dl.forEach(d => {
      const r = itemRow(d.name, (num(d.rate, 0) ? num(d.rate, 0) + '% · ' : '') +
        (num(d.min, 0) ? money(num(d.min, 0)) + ' minimum, day ' + num(d.day, 1) : 'no minimum set'),
        money(num(d.owed, 0)), 'late');
      r.onclick = () => debtSheet(d); r.menu = () => debtMenu(d); r.dataset.id = d.id;
      list.appendChild(r);
    });
    c3.appendChild(list);
    /* Shown beside cash, never subtracted from it. He asked to see cash. */
    c3.appendChild(el('div', 'note', '<b>' + esc(money(debtTotal())) + '</b> owed in total. This is never taken off your liquid figure, because you asked to see cash and cash is what you see.'));
  }
  m.appendChild(c3);

  /* The month ahead as dates, because timing is what bounces a payment. */
  const c4 = card('THE NEXT 60 DAYS', 'full');
  const to = Day.shift(Day.today(), 60);
  const events = billsOwed(Day.today(), to).map(b => ({ date: b.date, name: b.bill.name, amt: -num(b.bill.amt, 0) }))
    .concat(expected(Day.today(), to).filter(e => !e.paid).map(e => ({ date: e.date, name: e.client.name, amt: num(e.amt, 0) })))
    .sort((a, b) => a.date.localeCompare(b.date));
  if (!events.length) c4.appendChild(el('div', 'empty', 'Nothing scheduled either way. Add a bill above, or a client under MONEY IN, and the next two months fill in.'));
  else {
    const L = liquid();
    let run = L.counted ? L.total : 0, lowest = run, lowDate = Day.today();
    const list = el('div', 'list');
    events.forEach(e => {
      run += e.amt;
      if (run < lowest) { lowest = run; lowDate = e.date; }
      const r = itemRow(e.name, Day.short(e.date) + (L.counted ? ' · leaves ' + money(run) : ''),
        (e.amt > 0 ? '+' : '') + money(e.amt), e.amt > 0 ? 'in' : '');
      r.style.cursor = 'default';
      list.appendChild(r);
    });
    c4.appendChild(list);
    if (L.counted) c4.appendChild(el('div', 'note',
      'Lowest point is <b class="' + (lowest < 0 ? 'stale' : '') + '">' + esc(money(lowest)) +
      '</b> around ' + esc(Day.short(lowDate)) + '. That is the day to watch, not the month total.'));
  }
  m.appendChild(c4);
}

/* ── SPENDING ──
   Tom, 2026-09-11: "I want to review individual days and weeks."

   Three zoom levels on one screen rather than three screens, because it is
   the same question asked at three distances and splitting it would mean
   three places to keep in step. The arrows step by whatever is selected, so
   the control is the same whichever level you are at. */
let SPMONTH = null;
let PERIOD = 'month';
let ANCHOR = null;                      /* a date inside the period being read */

/* Monday first. A week that starts on Sunday puts a Saturday night out in the
   same week as the Monday you are planning, which is not how anyone thinks
   about a week. */
function weekStart(d) { const w = Day.dow(d); return Day.shift(d, -((w + 6) % 7)); }
function periodRange() {
  const a = ANCHOR || Day.today();
  if (PERIOD === 'day') return { from: a, to: a, step: 1,
    label: Day.isToday(a) ? 'Today' : Day.label(a) };
  if (PERIOD === 'week') {
    const f = weekStart(a), t = Day.shift(f, 6);
    return { from: f, to: t, step: 7,
      label: Day.short(f) + ' to ' + Day.short(t) +
        (a >= weekStart(Day.today()) && a <= Day.shift(weekStart(Day.today()), 6) ? ' · this week' : '') };
  }
  const f = monthStart(monthOf(a));
  return { from: f, to: monthEnd(monthOf(a)), step: 0, label: monthName(monthOf(a)) };
}
function periodShift(n) {
  const a = ANCHOR || Day.today();
  if (PERIOD === 'month') { ANCHOR = monthStart(monthBack(monthOf(a), -n)); return; }
  ANCHOR = Day.shift(a, n * (PERIOD === 'week' ? 7 : 1));
}
/* The same span, one step back, for the comparison. */
function prevRange() {
  const r = periodRange();
  if (PERIOD === 'month') { const pm = monthBack(monthOf(r.from), 1);
    return { from: monthStart(pm), to: monthEnd(pm), label: monthName(pm) }; }
  const n = PERIOD === 'week' ? 7 : 1;
  return { from: Day.shift(r.from, -n), to: Day.shift(r.to, -n),
    label: PERIOD === 'week' ? 'the week before' : 'the day before' };
}

function drawSpend(m) {
  /* SPMONTH is how this screen used to remember where it was. Honour it once
     so a bookmarked month still opens, then let ANCHOR take over. */
  if (SPMONTH && !ANCHOR) { ANCHOR = monthStart(SPMONTH); SPMONTH = null; }
  const R = periodRange(), P = prevRange();
  const t = rangeSpend(R.from, R.to), prev = rangeSpend(P.from, P.to);
  const word = PERIOD === 'day' ? 'day' : PERIOD === 'week' ? 'week' : 'month';
  drawTwice(m);

  const c0 = card(null, 'full');
  c0.appendChild(UI.segmented([{ id: 'day', name: 'DAY' }, { id: 'week', name: 'WEEK' },
    { id: 'month', name: 'MONTH' }], PERIOD, v => { PERIOD = v; S.set('period', v); draw(); }));

  const bar = el('div', 'rowbtns');

  nowBtn.type = 'button';
  nowBtn.onclick = () => { ANCHOR = Day.today(); Mobile.feedback('nav'); draw(); };
  const lbl = el('div', null, '<b>' + esc(R.label) + '</b>');

  bar.appendChild(back); bar.appendChild(lbl); bar.appendChild(fwd); bar.appendChild(nowBtn);

  /* Where it went: a pie or ranked bars, split by category, group, account

  m.insertBefore(c2, c0.nextSibling);

  const tg = Object.keys(t.byTag).map(k => ({ id: k, amt: t.byTag[k] })).sort((a, b) => b.amt - a.amt);

  else {

  /* Every transaction, filtered. */
  const c5 = card(CATFILTER == null ? 'EVERYTHING' : 'EVERYTHING · ' + catName(CATFILTER).toUpperCase(), 'full');
  if (CATFILTER != null) {

    c5.querySelector('h2').appendChild(el('div', 'spacer'));

  }
  const all = spendRows({ from: R.from, to: R.to })
    .filter(s => !isMove(s) && (CATFILTER == null || catOf(s) === CATFILTER))
    .sort((a, b) => b.date.localeCompare(a.date) || num(b.t) - num(a.t));
  /* == one category, by where the money went ==
     Tom, 2026-09-23: "I wanna see my outside food in detail, how much went to

     read off the bank's wording the way import reads it (`payeeOf`), or his
     own note for a purchase typed in STATUS. Put right under the pie he
     tapped, because that is where his eyes are. */
  if (CATFILTER != null && all.length) {
    const by = {};
    all.forEach(x => {
      /* LPI is Lawson Philippines Inc, the name Lawson's card terminals print
         (Tom, 2026-09-23: "LPI ACQUA PEBBLES is Lawson yes"). */
      const src = (payeeOf(x.bank || x.note || '').label || 'No details').replace(/^LPI\b/i, 'Lawson');
      const k = src.toLowerCase();
      const g = by[k] || (by[k] = { name: src, amt: 0, n: 0 });
      g.amt += num(x.amt, 0); g.n++;
    });
    /* A note typed in STATUS names the thing, "Lawson Tonkatsu", so one shop
       arrives under many names. Names that share a first word (two, when the
       first is a number like the 7 of 7 Eleven) are one place. */
    const head = n => { const w = n.split(/\s+/); return (/^\d+$|^.{1,2}$/.test(w[0]) && w[1] ? w[0] + ' ' + w[1] : w[0]).toLowerCase(); };
    const heads = {};
    Object.values(by).forEach(g => { const h = head(g.name); heads[h] = (heads[h] || 0) + 1; });
    const merged = {};
    Object.values(by).forEach(g => {
      const h = head(g.name), k = heads[h] > 1 ? h : g.name.toLowerCase();
      const m2 = merged[k] || (merged[k] = { name: heads[h] > 1 ? g.name.split(/\s+/).slice(0, h.split(' ').length).join(' ') : g.name, amt: 0, n: 0 });
      m2.amt += g.amt; m2.n += g.n;

    cs.appendChild(el('div', 'note', money(sum) + ' across ' + groups.length + ' place' + (groups.length === 1 ? '' : 's') + ' in this ' + word + '.'));
    const list = el('div', 'list');
    groups.forEach(g => {
      const r = itemRow(g.name, g.n + (g.n === 1 ? ' purchase' : ' purchases') + ' · ' +
        Math.round(g.amt / sum * 100) + '%' + (g.n > 1 ? ' · about ' + esc(money(Math.round(g.amt / g.n))) + ' each' : ''),
        money(g.amt));
      r.tabIndex = -1;
      list.appendChild(r);
    });
    cs.appendChild(list);
    m.insertBefore(cs, c2.nextSibling);
  }
  if (!all.length) c5.appendChild(el('div', 'empty', 'Nothing here.'));
  else {
    const list = el('div', 'list');
    all.slice(0, 200).forEach(s => {
      const c = catOf(s), tgg = tagOf(s);
      const r = itemRow(s.note || 'No details',
        Day.short(s.date) + ' · ' + esc(acctName(s.acct)) + ' · ' +
        (c ? esc(catName(c)) : '<span class="stale">uncategorised</span>') +
        (tgg ? ' · ' + esc((Rec.get('wtag', null, tgg) || {}).name || tgg) : '') +
        (isBig(s) ? ' · big' : ''),
        money(num(s.amt, 0)));
      r.onclick = () => spendSheet(s); r.menu = () => spendMenu(s);
      list.appendChild(r);
    });
    c5.appendChild(list);
    c5.appendChild(el('div', 'note', 'These are STATUS’s rows, read not copied. Tap one to file it, tag it, or mark it a big one-off. WEALTH never edits the row itself.'));
  }
  m.appendChild(c5);
}
let CATFILTER = null;

/* ══ a bill coming up is a todo bullet ══
   Tom, 2026-09-16: "Put the upcoming bills, aside from loans, as TODO
   Bullets, which should automatically show up in Status and Quests and Log."
   They do: a bullet is a `note` row, the shape STATUS owns, so STATUS shows
   it on its due day, QUESTS lists it under Today and Upcoming, and LOG puts
   it on the day it was written. ARC writes its skill todos the same way.

   Aside from loans: a bill filed under a `move` category, which is where
   Debt payment lives, never becomes a bullet. A GLoan repayment leaves on
   its own and a bullet telling him to pay it is noise.

   Three rules keep this from becoming a machine that fights him:
   1. One bullet per bill per due date, written once. The day it was written
      on is remembered in a setting, the way ARC remembers its own, so a row
      is never written twice on two different days.
   1b. And only the EARLIEST outstanding date per bill. Tom, 2026-09-17: "Why
      does pay skool show up twice in my todo widget? meralco too." They were
      not duplicates: they were the next occurrences of one recurring bill,
      each a real row with its own due date. Meralco is every 6 to 7 days
      (Tom, 2026-09-14) and bills are read 30 days ahead, so four or five of
      them are in the window at once, and every one that has gone unmatched is
      overdue and therefore on today's list. Two lines reading `Pay Meralco,
      1,040` with nothing to tell them apart is a bug however true they both
      are. You cannot pay next week's before this week's, so the list carries
      the one you can act on and the next appears when it is cleared.
   2. A bullet he deleted stays deleted, by its tombstone.
   3. A bill that is paid or gone loses its bullet, unless he has ticked it.
      Paying the bill is the thing that clears it, which is `billsOwed`, the
      same reading FREE uses. */
const BILL_TODO_DAYS = 30;
const billTodosOn = () => !!S.get('billTodos', 1);
function billTodoSync() {
  if (!billTodosOn() || !window.Journal) return;
  const t = Day.today(), made = S.get('billMade', {}) || {}, want = {}, touched = {};
  let dirty = false;
  /* The rows are the truth, not `billMade`. Tom, 2026-09-23: "I am now seeing
     duplicate todos in my STATUS." `billMade` is one setting, so two devices
     each writing it keep only the later one's list, and a bullet lives on the
     day it was written. A device that did not know about a bullet wrote it
     again on its own today: same key, another date, a second row, and live
     sync put both in one list. So every bill bullet is found by its key on
     any date, one is kept (a ticked one, else the first written) and an
     unticked extra goes. A key deleted on any date stays deleted. */
  const byKey = {}, gone = {};
  Rec.all('note').forEach(r => { if (r.key.startsWith('wealth-bill-')) (byKey[r.key] = byKey[r.key] || []).push(r); });
  Rec.tombstones('note').forEach(r => { if (r.key.startsWith('wealth-bill-')) gone[r.key] = 1; });
  Object.keys(byKey).forEach(k => {
    const rs = byKey[k], keep = rs.find(r => r.payload.done) || rs[0];
    rs.forEach(r => { if (r !== keep && !r.payload.done) { Rec.del('note', r.date, k); touched[r.date] = 1; } });
    if (made[k] !== keep.date) { made[k] = keep.date; dirty = true; }
  });
  /* What he ticked or unticked since last time, FIRST. A tick writes the
     purchase and an untick takes it back, and both have to happen before the
     bills are read: otherwise an unticked bullet is taken away as already
     paid, by the very purchase its own tick had written. */
  Object.keys(made).forEach(k => {
    const cur = Rec.get('note', made[k], k);
    if (!cur) { delete made[k]; dirty = true; return; }
    billTick(k, made[k], cur);
  });
  const firstPerBill = {};
  billsOwed(t, Day.shift(t, BILL_TODO_DAYS)).forEach(x => {
    if (catGrp(x.bill.cat) === 'move') return;
    /* `billsOwed` comes back in date order per bill, so the first one seen is
       the earliest. A later one is skipped rather than written, and any that
       was written before this rule existed falls out of `want` below and is
       taken back on the next pass. A ticked one is kept, as ever. */
    if (firstPerBill[x.bill.id]) return;
    firstPerBill[x.bill.id] = x.date;
    const k = 'wealth-bill-' + x.bill.id + '-' + x.date;
    want[k] = 1;
    if (made[k] || gone[k]) return;
    const row = { kind: 'todo', src: 'wealth', text: 'Pay ' + x.bill.name + ', ' + money(num(x.bill.amt, 0)),
      t: Date.now(), made: t, at: null, dur: null, ord: Rec.all('note', { date: t }).length,
      done: 0, cancelled: 0, due: x.date, pri: 0, proj: null, rep: null };
    Rec.set('note', t, k, row);
    made[k] = t; dirty = true; touched[t] = 1;
  });
  /* Paid, or the bill is gone: take the bullet back, unless he ticked it. A
     ticked one is kept and kept tracked, because a tick is an answer and
     because unticking it has to be able to undo what the tick did. */
  Object.keys(made).forEach(k => {
    if (want[k]) return;
    const d = made[k], cur = Rec.get('note', d, k);
    if (!cur) { delete made[k]; dirty = true; return; }
    if (cur.done) return;
    Rec.del('note', d, k); touched[d] = 1; delete made[k]; dirty = true;
  });
  if (dirty) S.set('billMade', made);
  Object.keys(touched).forEach(d => { try { Journal.publishNotes(d, 'wealth'); } catch (e) { console.warn('[wealth] journal', e); } });
}

/* Ticking the bullet pays the bill. Tom, 2026-09-16: "can clicking the bullet
   mark it as paid?" It can, and a tick anywhere does it: the bullet is one
   `note` row, so ticking it in STATUS, in QUESTS or on the home screen is the
   same tick, and WEALTH acts on it the next time it is open.

   Paid means a purchase, because that is the only thing that moves money in
   this app: one `spend` row on the bill's own due date, for its amount, from
   its account, filed under its category with a `mark` like any other. Its key
   is worked out from the bill and the date, so ticking twice cannot write it
   twice, and FREE stops holding the bill back the moment it exists.

   Unticking takes it back, but only while it is still exactly what was
   written. Once the amount has been edited it is his row, not ours, and a
   tick box has no business deleting it. A purchase he deleted stays deleted,
   by its tombstone, even with the bullet still ticked. */
function billTick(k, d, note) {
  const bid = k.slice(12, k.length - 11), due = k.slice(-10);
  const b = Rec.get('bill', null, bid);
  if (!b) return false;
  const sk = 'bill-' + bid + '-' + due;
  /* The key carries the due date, the row carries the day he paid. They are
     different whenever he ticks early or late, and both matter: the key is
     what tells FREE this bill is dealt with, the date is when the money
     actually left the account. */
  const has = Rec.all('spend').find(r => r.key === sk);
  if (note.done && !has) {
    const payDay = note.doneOn || Day.today();
    if (Rec.tombstone('spend', payDay, sk)) return false;
    Rec.set('spend', payDay, sk, { amt: num(b.amt, 0), acct: b.acct ? acctLabel(b.acct) : '',
      note: b.name, t: stampFor(payDay), src: 'wealth-bill' });
    if (b.cat) Rec.set('mark', null, payDay + '|' + sk, { cat: b.cat });
    return false;
  }
  if (!note.done && has && has.payload.src === 'wealth-bill' && num(has.payload.amt, 0) === num(b.amt, 0)) {
    Rec.del('spend', has.date, sk);
    Rec.del('mark', null, has.date + '|' + sk);
  }
  return false;
}

/* ══ filing, quickly ══
   Tom, 2026-09-16: "Let me categorize things quick." The purchase sheet asks
   five questions and is right for one purchase; a quarter of his spending was
   uncategorised, which is a different job. This is that job: one purchase at
   a time, every category one tap away, and nothing else on screen.

   The payee switch is one decision for the whole run rather than a question
   per purchase, because a rule files the whole history back to the beginning
   and that is what makes this quick rather than merely fast. */
function quickFile() {
  const queue = spendRows({}).filter(s => !catOf(s) && !isMove(s))
    .sort((a, b) => b.date.localeCompare(a.date) || num(b.t, 0) - num(a.t, 0));
  if (!queue.length) { UI.toast('nothing left to file'); return; }
  let i = 0, filed = 0, ruled = 0, sorted = 0;
  /* Marked as dealt with by a rule written during this run. Kept beside the
     queue rather than rebuilt from it, so the numbers on screen stay put. */
  const skip = {};
  const step = () => {
    while (i < queue.length && (skip[i] || catOf(queue[i]))) { i++; sorted++; }
  };
  UI.dialog({
    title: 'FILE QUICKLY', width: 560,
    body: (b, h) => {
      const alwaysOn = { on: !!S.get('quickAlways', 1) };
      b.appendChild(UI.row('Also file everything else from the same payee',
        'Writes a rule, which sorts every purchase you have ever logged from that name. Only lines read from a bank statement: a note you typed yourself files just itself',
        UI.toggle(alwaysOn.on, v => { alwaysOn.on = v; S.set('quickAlways', v ? 1 : 0); })));
      const head = el('div', 'note', '');
      const who = el('div', 'score');
      const chips = el('div', 'chips');
      b.appendChild(head); b.appendChild(who); b.appendChild(chips);
      const done = el('div', 'empty', '');
      done.style.display = 'none';
      b.appendChild(done);
      const file = cid => {
        const s = queue[i];
        setMark(s, { cat: cid });
        filed++;
        /* Only a bank's own wording makes a rule. A note he typed himself is
           a sentence, not a payee: on 2026-09-16 a run wrote rules for
           "Lawson Cobra and Vitamilk" and "Cheesy Beef Gyudon", which can
           never match anything again and clutter the list that sorts his
           history. */
        const p = payeeOf(s.bank || s.note), fromBank = !!(s.bank || s.stmt);
        let swept = 0;
        if (alwaysOn.on && fromBank && p && p.key && !isRail(p.key)) {
          Rec.set('rule', null, 'imp-' + norm(p.key), { match: p.key, cat: cid });
          ruleCache = null; ruled++;
          /* Tom, 2026-09-16: "let those rules also apply to the pile already."
             A rule already sorts the whole history the moment it is written,
             but this run's queue was read before it existed, so the same payee
             kept coming round to be answered again. Everything still waiting
             that the new rule covers is taken out of the queue here and
             counted, so one answer really is one answer. */
          for (let j = i + 1; j < queue.length; j++) {
            if (skip[j] || catOf(queue[j])) continue;
            const r = ruleFor(queue[j].note || '');
            if (r && r.cat) { skip[j] = 1; swept++; }
          }
          if (swept) UI.toast('<b>' + swept + '</b> more from <b>' + esc(p.label || p.key) +
            '</b> filed by the same rule');
        }
        Mobile.feedback('select');
        const seedFrom = s, seedCat = cid;
        i++;
        paint();
        /* The prompt into bill entry waits until the run is over, so it never
           interrupts the rhythm this screen exists for. */
        if (isBillish(cid)) pendingBill.push({ s: seedFrom, cat: seedCat });
      };
      const paint = () => {
        step();
        if (i >= queue.length) {
          head.innerHTML = '';
          who.innerHTML = '';
          chips.innerHTML = '';
          done.style.display = '';
          done.innerHTML = '<b>' + esc(String(filed)) + '</b> filed' +
            (ruled ? ', and <b>' + esc(String(ruled)) + '</b> of them wrote a rule that sorted the rest of that payee’s history' : '') +
            (sorted ? ', which took care of <b>' + esc(String(sorted)) + '</b> more without asking' : '') +
            '. Nothing left uncategorised.';
          return;
        }
        const s = queue[i];
        head.innerHTML = '<b>' + esc(String(i + 1)) + '</b> of ' + esc(String(queue.length)) +
          ' · ' + esc(String(filed)) + ' filed so far' +
          (sorted ? ' · <b>' + esc(String(sorted)) + '</b> sorted by your rules' : '');
        who.innerHTML = '<div class="cap">' + esc(Day.short(s.date)) + ' · ' + esc(acctName(s.acct)) + '</div>' +
          '<div class="big">' + esc(money(num(s.amt, 0))) + '</div>' +
          '<div class="sub">' + esc(s.note || 'No details') + '</div>';
        chips.innerHTML = '';
        catsAZ().forEach(c => {
          const btn = el('button', 'btn mb-press mb-tap', esc(c.name));
          btn.type = 'button';
          if (c.grp === 'move') btn.style.opacity = '.75';
          btn.onclick = () => file(c.id);
          chips.appendChild(btn);
        });
        const skip = el('button', 'btn mb-press mb-tap', 'Skip');
        skip.type = 'button';
        skip.onclick = () => { i++; paint(); };
        chips.appendChild(skip);
      };
      paint();
    },
    actions: [{ label: 'DONE', kind: 'go', fn: () => { draw(); askBills(); return true; } }],
    onClose: () => { draw(); askBills(); },
  });
}
/* Purchases filed into a bill-shaped category during a run, asked about once
   the run is over. Emptied as they are asked. */
let pendingBill = [];
/* Rent, the utilities, a subscription, the gym, the water, and anything run
   as a business cost. These are the categories a recurring bill lives in. */
const isBillish = id => ['rent', 'utilities', 'subs', 'gym', 'water'].indexOf(id) > -1 || catGrp(id) === 'biz';
/* == who sent it ==
   Tom, 2026-09-16: "someone sends me 2k every so often and 1k recently,
   that's Arturo he borrows my parking slot sometimes." Money in from a person
   arrives as a number: "Transfer from 09267390244 to 09565330105", the same
   number every time, and MONEY IN showed that wording as the name of the
   payment. So a payment he could recognise in one second read as a mystery
   every month.

   A name book fixes it once: the key is whatever the bank prints about the
   sender, the value is the name he gives it, and every past and future
   payment from that sender wears the name. The book is a setting, so it
   travels in a backup. Nothing is guessed: a sender with no name in the book
   still shows the bank's own wording, which is the truth rather than a blank.

   This is deliberately NOT a client. A client is somebody he coaches, with a
   cycle and expected payments; Arturo pays for a parking slot when he uses
   it, and inventing a client for that would put a made-up schedule in the one
   place that has to stay honest about what is owed. */
function payerOf(note) {
  const d = String(note || '').replace(/\s+/g, ' ').trim();
  let m;
  if ((m = d.match(/transfer from (\d{10,13}) to \d{10,13}/i))) return { key: m[1], label: m[1] };
  if ((m = d.match(/received (?:gcash )?from (.+?) with account ending in (\d{4})/i)))
    return { key: norm(m[1]) + ':' + m[2], label: m[1].trim() + ' ' + m[2] };
  if ((m = d.match(/received from ([A-Za-z][A-Za-z .'-]{2,60}?) ([A-Za-z]{2,6}) \d{4,}/i)))
    return { key: norm(m[1]) + ':' + norm(m[2]), label: m[1].trim() + ' ' + m[2] };
  return null;
}
const payerBook = () => S.get('payers', {}) || {};
function payerName(note) {
  const p = payerOf(note);
  if (!p) return '';
  return payerBook()[p.key] || '';
}
function namePayer(note, name) {
  const p = payerOf(note);
  if (!p) return false;
  const book = Object.assign({}, payerBook());
  if (name) book[p.key] = name; else delete book[p.key];
  S.set('payers', book);
  return true;
}
/* What a payment should be called: the client, else the name he gave the
   sender, else what he typed, else the bank's own wording. */
function paidTitle(p) {
  const c = p.client ? Rec.get('client', null, p.client) : null;
  if (c) return c.name;
  const nm = payerName(p.note);
  if (nm) return nm;
  return p.note || 'One-off';
}

/* BANCNET, InstaPay, PesoNet, P2M, QRPH: the pipe the money went down, not
   who was paid. Tom, 2026-09-16: "bancnet is a type of payment service or
   whatever that banks use, its not just for gym." A rule on one of these
   files every future purchase that happens to travel the same way, and his
   run had already written BANCNET as Gym and "Bancnet P2M Send" as Outside
   food, which between them claimed 34 purchases nobody had looked at. A rail
   can never be a payee, so it can never become a rule. */
const RAILS = ['bancnet', 'instapay', 'pesonet', 'p2m', 'qrph', 'ppi'];
const isRail = name => {
  const n = norm(name);
  if (!n) return true;
  return RAILS.some(w => n === w || n.indexOf(w) === 0 && n.length <= w.length + 10);
};
const billNameFor = s => {
  const p = payeeOf(s.bank || s.note);
  return String((p && (p.label || p.key)) || s.note || 'A bill').slice(0, 40);
};
/* Tom, 2026-09-16: "If I categorize something into a bill/subscription then
   prompt me into that entry mode." Asked, never assumed: a one-off from a
   shop that happens to be a subscription category is a real thing, and a bill
   written behind his back would hold money back from FREE for ever. */
/* Does a bill he already wrote cover this purchase? Names first, either way
   round, then the money: the same category at within 5% of the same amount is
   the same thing under another name. Tom, 2026-09-16: "I manually set up an
   itunes payment as a subscription, but the tool just now made me double set
   up an itunes payment that was already set up." His bill is called iCloud+
   and the bank calls the line APPLE.COM/BILL ITUNES.COM IE, so comparing
   names alone could never have matched them, and ₱699 filed as Subscriptions
   against a ₱699 Subscriptions bill always could. */
function billCovers(s, cid) {
  const a = num(s.amt, 0), nm = norm(billNameFor(s));
  return bills().some(b => {
    const bn = norm(b.name);
    if (bn && nm && (bn.indexOf(nm) > -1 || nm.indexOf(bn) > -1)) return true;
    return !!b.cat && b.cat === cid && !!a && Math.abs(num(b.amt, 0) - a) <= a * 0.05;
  });
}
function offerBill(s, cid) {
  if (!isBillish(cid)) return Promise.resolve(false);
  const nm = billNameFor(s);
  /* Asked once per payee. "Just this one" is an answer, and asking it again
     next month is how somebody learns to click through questions. */
  const asked = S.get('billAsked', []) || [];
  const who = norm(nm);
  if (asked.indexOf(who) > -1) return Promise.resolve(false);
  if (billCovers(s, cid)) return Promise.resolve(false);
  return UI.confirm('Is ' + nm + ' a regular bill?',
    money(num(s.amt, 0)) + ' filed as ' + catName(cid) + '. A bill is held back from your unallocated money before it is due, and comes up as a todo bullet. Every detail is yours to change on the next screen.',
    { yes: 'SET IT UP', no: 'JUST THIS ONE' })
    .then(ok => {
      if (ok) billSheet(null, {
        name: nm, amt: num(s.amt, 0), cat: cid, acct: acctKey(s.acct),
        day: +s.date.slice(8), cycle: 'month',
      });
      else S.set('billAsked', asked.concat([who]));
      return ok;
    });
}
function askBills() {
  const next = pendingBill.shift();
  if (!next) return;
  offerBill(next.s, next.cat).then(() => setTimeout(askBills, 200));
}

/* ══ BUDGETS ══
   Tom, 2026-09-16: "Give me a budgets panel." An allowance could only be
   reached from a month on SPENDING or from the category's own sheet, so what
   he had allotted, what was left of it, and what he spends on with no budget
   at all could never be seen together.

   His word is budgets on the tab. The row still says allowance, because the
   category sheet says allot and two names for one thing in one screen is
   worse than one name he did not pick. Numbers and a pace mark, never a
   verdict (laws 6 and 7), and it says what FREE does with the money. */
function drawBudget(m) {
  const mo = monthOf(Day.today());
  const list = capped();
  const c0 = card('THIS MONTH');
  const allot = list.reduce((a, c) => a + num(c.cap, 0), 0);
  const st = id => capState(id, mo);
  const spent = list.reduce((a, c) => a + ((st(c.id) || {}).spent || 0), 0);
  const left = list.reduce((a, c) => a + Math.max(0, (st(c.id) || {}).left || 0), 0);
  if (!list.length) {
    c0.appendChild(el('div', 'empty',
      'Nothing budgeted yet. Pick a category below and say what you allot it a month. ' +
      'Every purchase filed under it counts against that, whichever account it came from.'));
  } else {
    const g = el('div', 'grid3');
    g.appendChild(tile('ALLOTTED', short(allot), list.length + (list.length === 1 ? ' category' : ' categories')));
    g.appendChild(tile('SPENT', short(spent), 'against those budgets'));
    g.appendChild(tile('LEFT', short(left), 'and UNALLOCATED holds it back'));
    c0.appendChild(g);
    c0.appendChild(el('div', 'note',
      'UNALLOCATED holds back what is left of each budget, plus a whole month of each one for every later month inside its window. ' +
      'Going over holds back nothing extra, because that money has already gone.'));
  }
  m.appendChild(c0);

  if (list.length) drawCaps(m, mo);

  /* What he spends on with no budget on it. The typical month is the middle
     of the last three, so one bad month cannot define it, and it is labelled
     as what it is rather than offered as a number to adopt. */
  const open = cats().filter(c => c.grp !== 'move' && !(num(c.cap, 0) > 0))
    .map(c => ({ cat: c, typ: typicalCat(c.id) }))
    .sort((a, b) => b.typ - a.typ);
  const c2 = card('NOT BUDGETED');
  if (!open.length) c2.appendChild(el('div', 'empty', 'Every category has a budget.'));
  else {
    const rows = el('div', 'list');
    open.forEach(o => {
      const r = itemRow(o.cat.name,
        o.typ ? 'about ' + money(o.typ) + ' a month over the last three' : 'nothing logged in the last three months',
        o.typ ? money(o.typ) : '—');
      r.onclick = () => catSheet(o.cat); r.menu = () => catMenu(o.cat);
      rows.appendChild(r);
    });
    c2.appendChild(rows);
    c2.appendChild(el('div', 'note',
      'Tap one to allot it a monthly amount. A budget is yours to write: nothing here suggests one, and the middle month is what you actually spent, not a target.'));
  }
  m.appendChild(c2);
}
/* The middle of the last three whole months for one category. A median, so a
   Christmas cannot become the definition of normal — the same reason
   typicalVariable uses one. */
function typicalCat(id) {
  const now = monthOf(Day.today());
  const v = [1, 2, 3].map(i => monthSpend(monthBack(now, i)).byCat[id] || 0).sort((a, b) => a - b);
  return v[1];
}

/* == caps, shown as numbers and never as a verdict ==
   The bar is the cap. The notch on it is where an even spread would have you
   today, which is the difference between half of it on the 5th and half of it
   on the 25th. Nothing here says good or bad; it says where you are and how
   much month is left, and lets him do the joining up. */
function drawCaps(m, mo) {
  const list = capped();
  const c = card('ALLOWANCES');
  if (!list.length) {
    c.appendChild(el('div', 'empty',
      'No allowances set. Allot a monthly amount on <b>MONEY OUT</b>, or open a category under <b>ACCOUNTS</b>, ' +
      'and it appears here with how much of it is left.'));
    m.appendChild(c);
    return;
  }
  const rows = el('div', 'list');
  list.forEach((cat, i) => {
    const st = capState(cat.id, mo);
    if (!st) return;
    const daysLeft = st.days - st.gone;
    const sub = st.done
      ? (st.over ? money(st.spent - st.cap) + ' over' : money(st.left) + ' unspent')
      : money(st.spent) + ' of ' + money(st.cap) + ' · ' +
        (st.left >= 0
          ? money(st.left) + ' left' + (daysLeft > 0 ? ' with ' + daysLeft + ' day' +
            (daysLeft === 1 ? '' : 's') + ' to go' : ' on the last day')
          : '<b>' + esc(money(-st.left)) + ' over</b>');
    const r = itemRow(cat.name, sub, Math.round(st.pct * 100) + '%',
      st.over ? 'late' : '');
    r.onclick = () => { CATFILTER = cat.id; draw(); };

    const bar = el('div', 'bar c' + (1 + (i % 6)));
    bar.style.position = 'relative';
    bar.appendChild(el('i')).style.width = Math.min(100, st.pct * 100).toFixed(1) + '%';
    /* Where an even spread would put him today. A line, not a rule. */
    if (!st.done && st.gone < st.days) {
      const tick = el('i');
      tick.style.position = 'absolute';
      tick.style.left = (st.gone / st.days * 100).toFixed(1) + '%';
      tick.style.top = '0'; tick.style.bottom = '0';
      tick.style.width = 'var(--border-width)';
      tick.style.background = 'var(--text-1)';
      tick.style.opacity = '.55';
      bar.appendChild(tick);
    }
    rows.appendChild(stack(r, bar));
  });
  c.appendChild(rows);
  c.appendChild(el('div', 'note',
    'The mark on each bar is where an even spread would put you today. Nobody spends evenly, so it is a line to read against, not a rule.'));

  /* Doctrine: a target missed for three weeks is not a target, it is
     furniture. Offering to change it is the only way the bar does anything.
     Offered once, quietly, and only on a cap that has failed three months
     running — not on a single bad month. */
  list.forEach(cat => {
    if (capMisses(cat.id, 3) < 3) return;
    const st = capState(cat.id, mo);
    if (!st) return;
    const real = [1, 2, 3].map(i => {
      const p2 = capState(cat.id, monthBack(monthOf(Day.today()), i));
      return p2 ? p2.spent : 0;
    }).sort((a, b) => a - b)[1];                       /* the middle month */
    const note = el('div', 'note',
      '<b>' + esc(cat.name) + '</b> has gone over its allowance three months running. ' +
      'An allowance you always go over is furniture. The middle of those three months was ' +
      esc(money(real)) + '.');
    const b = el('button', 'btn mb-tap', 'Make it ' + money(Math.ceil(real / 100) * 100));
    b.type = 'button';
    b.style.marginTop = 'var(--s-2)';
    b.onclick = () => {
      const row = Rec.get('cat', null, cat.id);
      Rec.set('cat', null, cat.id, merge(row, { cap: Math.ceil(real / 100) * 100 }));
      Mobile.feedback('success');
      UI.toast('<b>' + esc(cat.name) + '</b> allowance set to ' + esc(money(Math.ceil(real / 100) * 100)));
      draw();
    };
    note.appendChild(el('br'));
    note.appendChild(b);
    c.appendChild(note);
  });
  m.appendChild(c);
}

/* == one day, in the order it happened ==
   Not a list of amounts. Everything that happened, down the clock: what you
   bought, what arrived, a session delivered, money moved into a pot. The
   quiet ones carry no amount because they are not spending, and mixing them
   into a total is how law 2 gets broken. */
function drawOneDay(m, date) {
  const ev = dayEvents(date);
  const c = card(Day.label(date).toUpperCase(), 'full');
  if (!ev.length) {
    c.appendChild(el('div', 'empty', Day.isToday(date)
      ? 'Nothing logged today yet. Spending arrives from STATUS on your phone.'
      : 'Nothing happened on this day, or nothing was logged.'));
    m.appendChild(c);
    return;
  }
  const list = el('div', 'list');
  ev.forEach(e => {
    const time = clock(e.row || e) || '';
    const r = itemRow(e.name,
      (time ? '<b>' + esc(time) + '</b> · ' : '') + e.note + (e.big ? ' · big one-off' : ''),
      e.fig != null ? e.fig : (e.amt > 0 ? '+' : '') + money(e.amt),
      e.kind === 'in' ? 'in' : '');
    if (e.quiet) r.classList.add('dim');
    if (e.kind === 'out' || e.kind === 'move') { r.onclick = () => spendSheet(e.row); r.menu = () => spendMenu(e.row); }
    else if (e.kind === 'in') { r.onclick = () => paidSheet(e.row); r.menu = () => paidMenu(e.row); }
    else r.style.cursor = 'default';
    list.appendChild(r);
  });
  c.appendChild(list);
  const inn = ev.filter(e => e.kind === 'in').reduce((a, e) => a + e.amt, 0);
  const outt = ev.filter(e => e.kind === 'out').reduce((a, e) => a - e.amt, 0);
  c.appendChild(el('div', 'note', '<b>' + esc(money(inn)) + '</b> in, <b>' + esc(money(outt)) +
    '</b> out. Anything greyed out moved money rather than spending it, so it counts in neither.'));
  m.appendChild(c);
}

/* == one week, a day at a time ==
   Seven rows whether or not anything happened, because an empty day is a
   fact about the week and a gap in a list is not. */
function drawOneWeek(m, from, to) {
  const c = card('DAY BY DAY', 'full');
  const days = Day.range(from, to);
  const outs = days.map(d => rangeSpend(d, d).total);
  const top = Math.max.apply(null, outs.concat([1]));
  const list = el('div', 'list');
  days.forEach((d, i) => {
    if (d > Day.today()) return;
    const inn = rangeIn(d, d), sp = outs[i];
    const sesh = Rec.all('sesh', { date: d }).length;
    const r = itemRow(Day.label(d),
      (inn ? '<b class="in">' + esc(money(inn)) + ' in</b> · ' : '') +
      (sp ? esc(rangeSpend(d, d).rows + (rangeSpend(d, d).rows === 1 ? ' purchase' : ' purchases')) : 'nothing spent') +
      (sesh ? ' · ' + sesh + ' session' + (sesh > 1 ? 's' : '') : ''),
      sp ? money(sp) : '—');
    if (Day.isToday(d)) r.style.outline = 'var(--border-width) solid var(--accent)';
    r.onclick = () => { PERIOD = 'day'; ANCHOR = d; S.set('period', 'day'); draw(); };
    const bar = el('div', 'bar c' + (1 + (i % 6)));
    bar.appendChild(el('i')).style.width = (sp / top * 100).toFixed(1) + '%';
    list.appendChild(stack(r, bar));
  });
  c.appendChild(list);
  c.appendChild(el('div', 'note', 'Tap a day to open it.'));
  m.appendChild(c);
}

/* ── POTS ── */
function drawPots(m) {
  const ps = pots();
  const c1 = card('SAVINGS POTS', 'full');
  if (!ps.length) {
    c1.appendChild(el('div', 'empty',
      'No pots yet. A pot is money with a name on it. Naming it is the point: ' +
      'taking money out of a pot you named breaks a rule you set, and being under a target does not feel like anything. Press <b>+</b>.'));
  } else {
    const list = el('div', 'list');
    list.dataset.sort = 'pot';
    ps.forEach((p, i) => {
      const bal = potBal(p.id), tgt = num(p.target, 0);
      const row = itemRow(p.name,
        (tgt ? money(bal) + ' of ' + money(tgt) + ' · ' + Math.round(bal / tgt * 100) + '%' : 'no target set') +
        (p.acct ? ' · ' + esc(acctName(p.acct)) : ''),
        money(bal), 'in');
      row.onclick = () => potSheet(p); row.menu = () => potMenu(p); row.dataset.id = p.id;
      const bar = el('div', 'bar c' + (1 + (i % 6)));
      bar.appendChild(el('i')).style.width = (tgt ? Math.min(100, bal / tgt * 100) : 0).toFixed(1) + '%';
      list.appendChild(stack(row, bar));
    });
    c1.appendChild(list);
    c1.appendChild(el('div', 'note', '<b>' + esc(money(potsTotal())) +
      '</b> put aside. This comes off your unallocated figure, which is the whole reason it works.'));

/* ══════════════════════════ the sheets ══════════════════════════ */
/* == an amount groups itself ==
   Tom, 2026-09-11: "Numbers should automatically have commas."

   Formatting on every keystroke moves the caret, which is what makes most
   attempts at this horrible to type into. So the caret is put back by
   counting DIGITS before it rather than characters: insert a comma to the
   left of the cursor and the cursor still sits after the same digit. */
function groupNum(raw) {
  const cleaned = String(raw).replace(/[^0-9.]/g, '');
  const bits = cleaned.split('.');
  const whole = bits[0].replace(/^0+(?=\d)/, '');
  const frac = bits.length > 1 ? '.' + bits.slice(1).join('').slice(0, 2) : '';
  return (whole ? Number(whole).toLocaleString('en-US') : (frac ? '0' : '')) + frac;
}
/* `plain` is for a number that is grouped but is NOT an amount of money: the
   exchange rate is a ratio, and labelling it with a currency and offering to
   convert it is nonsense. */
function amountField(v, plain) {
  const i = UI.field('money', { placeholder: '0',
    value: v == null || v === '' ? '' : groupNum(String(v)) });
  if (!plain) i.dataset.money = '1';
  i.addEventListener('input', () => {
    const caret = i.selectionStart == null ? i.value.length : i.selectionStart;
    const digitsBefore = i.value.slice(0, caret).replace(/[^0-9]/g, '').length;
    const out = groupNum(i.value);
    if (out === i.value) return;
    i.value = out;
    let seen = 0, pos = out.length;
    if (!digitsBefore) pos = 0;
    else for (let k = 0; k < out.length; k++) {
      if (/[0-9]/.test(out[k])) seen++;
      if (seen >= digitsBefore) { pos = k + 1; break; }
    }
    try { i.setSelectionRange(pos, pos); } catch (e) {}
  });
  return i;
}
function dateField(v) {
  const i = UI.field('text', { value: v || Day.today() });
  i.type = 'date';
  return i;
}

/* money in */
function paidSheet(existing, preset) {
  UI.dialog({
    title: existing ? 'EDIT PAYMENT' : 'MONEY IN', width: 460,
    body: (b, h) => {
      const rc = existing && existing.stmt ? recon(existing.stmt) : null;
      if (rc && rc.comment) b.appendChild(el('div', 'note', 'Your comment on the statement line: <b>' + esc(rc.comment) + '</b>'));
      const amt = amountField(existing ? existing.amt : (preset && preset.amt) || '');
      b.appendChild(fld('Amount', amt));
      const who = picker({
        items: clients().filter(c => c.status !== 'done').map(c => ({ id: c.id, name: c.name, note: money(num(c.rate, 0)) })),
        value: existing ? existing.client : (preset && preset.client) || '',
        placeholder: 'Which client, or leave blank for a one-off',
        none: 'No clients yet.',
        onCreate: makeClient,
      });
      b.appendChild(fld('Client', who));
      const acct = chipRow(accts().map(a => ({ id: a.id, name: a.name })),
        existing ? existing.acct : S.get('lastAcct', (accts()[0] || {}).id || ''), null, {});
      b.appendChild(fld('Into', acct));
      const note = UI.field('text', { placeholder: 'Commercial, workshop, anything', value: existing ? existing.note || '' : '' });
      b.appendChild(fld('What was it', note));
      /* A payment that arrived as an account number can be given a name, once,
         and every other payment from that sender wears it too. */
      const pr = existing ? payerOf(existing.note) : null;
      let payer = null;
      if (pr) {
        payer = UI.field('name', { placeholder: 'Arturo', value: payerBook()[pr.key] || '' });
        b.appendChild(fld('Who sent it', payer));
        b.appendChild(el('div', 'note', 'The bank calls this sender <b>' + esc(pr.label) +
          '</b>. Give it a name and every payment from them, past and future, is called that.'));
      }
      const loan = UI.toggle(existing ? isLoanIn(existing) : false);
      b.appendChild(UI.row('Borrowed, not income',
        'For money somebody lent you. It still lands in the account, and it stays out of what you earned, your net, and who pays you.',
        loan));
      const date = dateField(existing ? existing.date : (preset && preset.date));
      b.appendChild(fld('When', date));
      let hhmm = existing ? timeOf(existing) : timeOf({ t: Date.now() });
      b.appendChild(fld('Time', UI.timeField(hhmm, v => { hhmm = v; })));
      h.save = () => {
        const v = num(amt.value, 0);
        if (v <= 0) { amt.focus(); return false; }
        /* Law 4's second half: the same amount, same account, within the hour
           is a question rather than a silent second row. */
        if (!existing) {
          const dupe = paidRows({ date: date.value }).find(p =>
            num(p.amt, 0) === v && p.acct === acct.get());
          if (dupe && !h._forced) {
            h._forced = 1;
            UI.toast('you already logged <b>' + esc(money(v)) + '</b> into that account on that day. Press save again if it really happened twice', { bad: true });
            return false;
          }
        }
        const key = existing ? existing.key : newId();
        const d = existing ? existing.date : date.value;
        if (existing && existing.date !== date.value) Rec.del('paid', existing.date, existing.key);
        /* Merge, never rebuild. An imported payment carries `stmt`, the link
           to the statement line it came from, and rebuilding the payload
           dropped it: the "already imported" record then pointed at a row
           with no link, and reading the same file again would have added the
           payment a second time. The calcium bug, in the money app. */
        Rec.set('paid', date.value, key, merge(existing, {
          amt: v, acct: acct.get(), client: who.get(), note: note.value.trim(),
          t: stampFor(date.value, hhmm), src: existing ? existing.src || 'hand' : 'hand',
          loan: loan.on ? 1 : 0,
        }));
        if (payer) namePayer(existing.note, payer.value.trim());
        S.set('lastAcct', acct.get());
        Mobile.feedback('success');
        /* The moment he has the information is the moment to ask. Telling the
           app money landed and being shown "never counted" afterwards is the
           dead end this closes. */
        const target = acct.get();
        if (target && !lastCount(target)) {
          const acc = Rec.get('acct', null, target) || { name: target };
          UI.toast('logged <b>' + esc(money(v)) + '</b> in. ' + esc(acc.name) +
            ' has no balance yet, so it is not in your total',
            { ms: 7000, action: { label: 'SET IT',
              fn: () => countSheet(Object.assign({ id: target }, acc)) } });
        } else {
          UI.toast('logged <b>' + esc(money(v)) + '</b> in');
        }
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      existing ? { label: 'DELETE', kind: 'bad', fn: h => {
        const keep = Object.assign({}, existing);
        Rec.del('paid', existing.date, existing.key);
        UI.undo('removed that payment', () => Rec.set('paid', keep.date, keep.key, keep));
        draw(); return true;
      } } : null,
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ].filter(Boolean),
  });
}
function payFor(e) { paidSheet(null, { client: e.client.id, amt: e.amt, date: Day.today() }); }

/* a client, and everything about them */
/* A new client: the name first, refused if it is already taken, then
