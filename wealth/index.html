<style>
/* Colours and sizes are tokens, never numbers. shared/THEMING.md is the
   contract this app obeys. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

header{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim)}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}

/* The tab strip. A desktop app, so it sits at the top under the title rather
   than at the bottom under a thumb. */
nav{flex:0 0 auto;display:flex;gap:var(--s-1);overflow-x:auto;
  padding:0 var(--s-4) var(--s-2);background:var(--surface-1);
  scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:var(--tap);padding:0 var(--s-4);border:0;
  background:none;cursor:pointer;color:var(--text-2);font:inherit;
  font-family:var(--font-display);font-size:var(--f-2);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);border-radius:var(--radius-md);
  border-bottom:var(--border-width) solid transparent;
  transition:color var(--dur-fast) var(--ease-out)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}

main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-9) + var(--safe-b))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-3)}

/* ── a desktop app, under hard constraint 10 ──
   Desk work: reconciling, setting up clients, reading one month against
   another. Two columns past 1000px so a list sits beside the thing it
   explains. One column below that, unchanged, because a desktop app on a
   phone still has to stack and stay usable. */
@media (min-width:1000px){
  .wrap{max-width:1180px;display:grid;align-items:start;gap:var(--s-4);
    grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .wrap .full{grid-column:1 / -1}
}
@media (min-width:1400px){ .wrap{max-width:1400px} }

.card{border-radius:var(--radius-lg);background:var(--surface-1);
  padding:var(--s-4);box-shadow:var(--e-1),var(--rim)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-3);
  display:flex;align-items:center;gap:var(--s-2)}
h2 .spacer{flex:1}

/* ── the scoreboard ──
   One primary thing per screen. FREE is the answer to "can I", so it is the
   only figure at display size; liquid and allocated are its working. */
.score{display:flex;flex-direction:column;gap:var(--s-2);align-items:center;
  padding:var(--s-5) var(--s-4)}
.score .cap{font-family:var(--font-display);font-size:var(--f-1);
  letter-spacing:var(--track-cap);color:var(--text-muted)}
.score .big{font-family:var(--font-display);font-size:var(--f-8);
  font-weight:var(--w-bold);line-height:var(--lh-tight);letter-spacing:var(--track-tight)}
.score .big.low{color:var(--warn)}
.score .big.bad{color:var(--danger)}
.score .sub{color:var(--text-2);text-align:center;line-height:var(--lh-body)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.tile{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--s-3);
  display:flex;flex-direction:column;gap:var(--s-1);min-height:var(--tap)}
.tile .k{font-family:var(--font-display);font-size:var(--f-1);
  letter-spacing:var(--track-cap);color:var(--text-muted)}
.tile .v{font-family:var(--font-display);font-size:var(--f-5);font-weight:var(--w-bold);
  line-height:var(--lh-tight)}
.tile .n{font-size:var(--f-1);color:var(--text-2)}
.tile.warn .v{color:var(--warn)}
.tile.bad .v{color:var(--danger)}
.tile.good .v{color:var(--success)}
.tile.tap{cursor:pointer}
.tile.tap:hover{background:var(--surface-3)}
.chartbox.tall{height:calc(var(--tap) * 7)}

.list{display:flex;flex-direction:column;gap:var(--s-2)}
.item{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3);
  min-height:var(--tap);border-radius:var(--radius-md);background:var(--surface-2);
  cursor:pointer;text-align:left;border:0;color:inherit;font:inherit;width:100%}
.item .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--w-body)}
.item .nm small{color:var(--text-muted);font-size:var(--f-1)}
.item .fig{font-family:var(--font-display);font-weight:var(--w-bold);white-space:nowrap}
.item .fig.in{color:var(--success)}
.item .fig.late{color:var(--danger)}
.item.dim{opacity:.55}

/* A share bar. The number is the point; the bar is only there so the eye can
   rank ten of them without reading ten numbers. */
.stack{display:flex;flex-direction:column;gap:var(--s-1)}
.bar{height:var(--s-2);border-radius:var(--radius-full);background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-full)}
.bar.c1 i{background:var(--data-1)} .bar.c2 i{background:var(--data-2)}
.bar.c3 i{background:var(--data-3)} .bar.c4 i{background:var(--data-4)}
.bar.c5 i{background:var(--data-5)} .bar.c6 i{background:var(--data-6)}

.empty{color:var(--text-muted);line-height:var(--lh-body);padding:var(--s-2) 0}
.note{color:var(--text-muted);font-size:var(--f-1);line-height:var(--lh-body);margin-top:var(--s-2)}
.stale{color:var(--warn)}

.rowbtns{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-3)}
.btn{min-height:var(--tap);padding:0 var(--s-4);border-radius:var(--radius-md);
  border:var(--border-width) solid var(--border-strong);background:var(--surface-2);
  color:var(--text-1);font:inherit;cursor:pointer}
.btn.go{background:var(--accent);color:var(--accent-fg);border-color:transparent;
  font-weight:var(--w-bold)}
.btn.wide{flex:1}

/* ── the picker: autofill, because a typo makes a second thing ──
   The input filters what exists. It never creates by being typed into.  */
.pick{position:relative}
.pick .opts{display:flex;flex-direction:column;gap:2px;margin-top:var(--s-2);
  max-height:220px;overflow-y:auto}
.pick .opts button{min-height:var(--tap);padding:0 var(--s-3);text-align:left;
  border:0;border-radius:var(--radius-sm);background:var(--surface-2);
  color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:var(--s-2)}
.pick .opts button.on{background:var(--accent);color:var(--accent-fg)}
.pick .opts button.mk{background:none;color:var(--text-2);
  border:var(--border-width) dashed var(--border-strong)}
.pick .opts small{margin-left:auto;color:var(--text-muted);font-size:var(--f-1)}
.pick .opts button.on small{color:var(--accent-fg);opacity:.8}

.chips{display:flex;gap:var(--s-2);flex-wrap:wrap}
.chip{min-height:var(--tap);padding:0 var(--s-3);border-radius:var(--radius-full);
  border:var(--border-width) solid var(--border);background:var(--surface-2);
  color:var(--text-2);font:inherit;font-size:var(--f-2);cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}

.fld{display:flex;flex-direction:column;gap:var(--s-2);margin-bottom:var(--s-3)}
.fld label{font-family:var(--font-display);font-size:var(--f-1);
  letter-spacing:var(--track-cap);color:var(--text-muted)}

.chartbox{height:170px}
/* the six-month chart: money out as quiet bars with this month lit, net as a dashed line */
.wout{fill:var(--text-muted);opacity:.28}
.mb-emph .wout.on{opacity:.62}
.wnet{fill:none;stroke:var(--text-2);stroke-width:1.5;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}

/* A row you can rearrange carries a grip you can see (law 6), and a row being
   carried lifts off the list. */
.grip{flex:0 0 auto;align-self:stretch;display:flex;align-items:center;justify-content:center;
  width:var(--s-5);margin-left:calc(-1 * var(--s-2));color:var(--text-muted);cursor:grab;touch-action:none}
.list[data-sort] .item{user-select:none;-webkit-user-select:none}
.list[data-sort] > .dragging, .list[data-sort] > .dragging .item{position:relative;z-index:2;
  background:var(--surface-3);box-shadow:var(--e-3);cursor:grabbing}
#fab{position:fixed;right:var(--s-4);bottom:calc(var(--s-4) + var(--safe-b));z-index:40;
  width:58px;height:58px;border:0;border-radius:50%;cursor:pointer;
  background:var(--accent);color:var(--accent-fg);font-size:28px;line-height:1;
  box-shadow:var(--e-3);display:flex;align-items:center;justify-content:center}
</style>

<header>
  <div class="logo">WE<b>ALTH</b></div>
  <div class="spacer"></div>
  <button id="curBtn" class="mb-btn mb-press mb-tap" onclick="toggleCur()"></button>
  <button class="mb-btn mb-press mb-tap" onclick="openSettings()">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>

<main class="mb-scroll"><div class="wrap" id="main"></div></main>
<button id="fab" class="mb-press mb-tap" aria-label="Add">+</button>

<script>
/* ══════════════════════════════ WEALTH ══════════════════════════════
   What is coming in, what is going out, what is already spoken for, and
   how long it lasts. See wealth/CLAUDE.md for why each rule is here.   */

const APP = {
  id: 'wealth',
  name: 'Wealth',
  icon: '▩',
  blurb: 'clients, bills, pots and what is actually left',
  /* Types WEALTH owns. `spend` and `acct` are NOT here: STATUS owns their
     shape and WEALTH only merges into them. Declaring them would silence the
     store's warning, which is the one thing keeping the two apps honest. */
  types: ['cat', 'rule', 'wtag', 'mark', 'count', 'client', 'paid', 'sesh', 'pack', 'bill', 'pot', 'move', 'debt', 'recon', 'xfer'],
};

Skins.load('../shared/skins.json').then(() => { Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* The backup carries the shared money rows too. A restore of WEALTH without
   its spending is a restore of the labels and none of the facts. */
/* `reads`: STATUS's spending and accounts, from STATUS's own sheet tab */
/* and COACH's clients and the 1:1s logged there, since 2026-09-22: a COACH
   client and a WEALTH client are one person, written from either app */
IO.register({ app: APP.id, name: APP.name, types: APP.types.concat(['spend', 'acct']),
  reads: { status: ['spend', 'acct'], coach: ['client', 'sesh'] } });

/* ── small tools ── */
const el = UI.el, esc = UI.esc;
/* `parseFloat('12,000')` is 12. Not 12000, not NaN — twelve, silently, with
   three zeroes thrown away. Every amount in this app goes through here, so a
   typed comma was a way to lose money without a single error. Strip the
   grouping first; this is not optional and never was. */
const num = (v, d) => {
  const n = parseFloat(typeof v === 'string' ? v.replace(/,/g, '') : v);
  return isFinite(n) ? n : (d == null ? 0 : d);
};
/* ══════════════════════ CURRENCY ══════════════════════
   Tom, 2026-09-11: "In settings, I want the option to pick currency. Then a
   toggle to turn all the amounts into usd view, and back."

   THE RULE THAT MAKES THIS SAFE: every amount is STORED in the base currency,
   always, and the toggle is a VIEW. Nothing in the store ever changes
   currency, so flipping the switch can never alter a number, and flipping it
   twice is guaranteed to land back where it started.

   That is also why TYPING stays in the base currency even while the view is
   in dollars. Convert on the way in and a typed 100 becomes 5,850 becomes
   99.99 on the way out, and a round trip quietly loses money. The field keeps
   the currency the money actually is and shows the other one underneath as a
   live hint, so both are on screen and only one is a fact.

   THE RATE IS HIS NUMBER, not a live one. Fetching it would put a network in
   the middle of a money app that has to work on a plane, and a rate that
   silently goes stale is worse than one he set on a day he remembers. So he
   types it, the app stamps the date, and says how old it is wherever it
   matters. */
const CURRENCIES = [
  ['PHP', '₱', 'Philippine peso'], ['USD', '$', 'US dollar'],
  ['EUR', '€', 'Euro'], ['GBP', '£', 'Pound sterling'],
  ['JPY', '¥', 'Japanese yen'], ['AUD', 'A$', 'Australian dollar'],
  ['CAD', 'C$', 'Canadian dollar'], ['SGD', 'S$', 'Singapore dollar'],
  ['HKD', 'HK$', 'Hong Kong dollar'], ['NZD', 'NZ$', 'New Zealand dollar'],
  ['CHF', 'CHF ', 'Swiss franc'], ['AED', 'AED ', 'UAE dirham'],
  ['INR', '₹', 'Indian rupee'], ['CNY', 'CN¥', 'Chinese yuan'],
  ['KRW', '₩', 'South Korean won'], ['THB', '฿', 'Thai baht'],
  ['IDR', 'Rp', 'Indonesian rupiah'], ['MYR', 'RM', 'Malaysian ringgit'],
  ['VND', '₫', 'Vietnamese dong'], ['TWD', 'NT$', 'Taiwan dollar'],
];
const Cur = {
  base: () => S.get('cur.base', 'PHP'),
  alt: () => S.get('cur.alt', 'USD'),
  /* how many BASE units buy one ALT unit. Fifty eight pesos to the dollar. */
  rate: () => num(S.get('cur.rate', 0), 0),
  rateOn: () => S.get('cur.rateOn', ''),
  /* The switch only means anything once there is a rate to switch with. */
  ready: () => Cur.rate() > 0 && Cur.alt() !== Cur.base(),
  inAlt: () => S.get('cur.view', 0) === 1 && Cur.ready(),
  code: () => Cur.inAlt() ? Cur.alt() : Cur.base(),
  sym: code => { const c = CURRENCIES.find(x => x[0] === (code || Cur.code())); return c ? c[1] : ''; },
  name: code => { const c = CURRENCIES.find(x => x[0] === code); return c ? c[2] : code; },
  toAlt: n => Cur.rate() ? n / Cur.rate() : null,
  age: () => Cur.rateOn() ? Day.diff(Day.today(), Cur.rateOn()) : null,
  flip(on) {
    S.set('cur.view', on ? 1 : 0);
    Mobile.feedback('toggle');
    drawCurBtn(); draw();
  },
};
const RATE_STALE = 30;

/* Base view rounds to whole units, exactly as it always did. The alt view
   shows two decimals under a hundred, because ₱180 is $3.10 and "$3" is a
   different claim. Above that the decimals are noise. */
function money(n) {
  const alt = Cur.inAlt();
  const v = alt ? n / Cur.rate() : n;
  const a = Math.abs(v);
  const body = (alt && a < 100 && a > 0) ? a.toFixed(2) : Math.round(a).toLocaleString();
  return (v < 0 ? '-' : '') + Cur.sym() + body;
}
const short = n => {
  const v = Cur.inAlt() ? n / Cur.rate() : n;
  const a = Math.abs(v), sign = v < 0 ? '-' : '';
  if (a >= 1000000) return sign + Cur.sym() + (a / 1000000).toFixed(1) + 'm';
  /* From a thousand up, not from ten thousand. The two thresholds put 5,000
     and 10k on the same axis, which reads as two different units. */
  if (a >= 1000) return sign + Cur.sym() + Math.round(a / 1000) + 'k';
  return money(n);
};

let seq = 0;
const newId = () => Rec.USER + '-' + Date.now().toString(36) + '-' +
  (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
/* Two names are the same name if only punctuation and case separate them.
   This is what stops "Grab" and "grab " becoming two things. */
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
const S = { get: (k, d) => { const v = Rec.setting(APP.id, k); return v == null ? d : v; },
            set: (k, v) => Rec.setting(APP.id, k, v) };

/* == the time of day ==
   Tom, 2026-09-11: "I also want time tracking for the entries." Every money
   row already carried a `t` millisecond stamp and nothing ever showed it, so
   a day was a bag of amounts in no order.

   `t` stays the stored fact, because it is what STATUS writes and what sorts
   correctly. These turn it into something a person reads and types. */
const timeOf = row => {
  const t = num(row && row.t, 0);
  if (!t || t < 86400000) return '';           /* 0, or a seeded placeholder */
  const d = new Date(t);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
};
const clock = row => { const v = timeOf(row); return v ? UI.clockLabel(v) : ''; };
/* A time typed on a given day, back to a stamp. The date comes from the row,
   never from the clock, or editing yesterday's entry moves it to today. */
function stampFor(date, hhmm) {
  const p = String(date).split('-');
  if (!hhmm) return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0).getTime();
  const t = hhmm.split(':');
  return new Date(+p[0], +p[1] - 1, +p[2], +t[0] || 0, +t[1] || 0, 0).getTime();
}
/* Untimed rows sort to the END, not the start. A pot move carries no clock,
   and a zero stamp put it above a 7:15am coffee, which reads as midnight. */
const byTime = (a, b) => {
  const x = num(a.t, 0) || Infinity, y = num(b.t, 0) || Infinity;
  return x - y;
};

const monthOf = d => String(d).slice(0, 7);
const monthStart = m => m + '-01';
const monthEnd = m => { const p = m.split('-'); return m + '-' + new Date(+p[0], +p[1], 0).getDate(); };
const monthBack = (m, n) => { const p = m.split('-'); const d = new Date(+p[0], +p[1] - 1 - n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const monthName = m => { const p = m.split('-');
  return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); };

/* ══ the starting vocabulary ══
   Shipped once, then his. Vocabulary, never prescription: these are names for
   things that already exist in his life, not a claim about how to live.
   `move` is the group that is NOT spending — see law 2 in the brief.        */
const SEED = [
  ['rent', 'Rent', 'fix'], ['utilities', 'Utility Bills', 'fix'],
  ['water', 'Drinking Water', 'fix'], ['subs', 'Subscriptions', 'fix'],
  ['gym', 'Gym', 'fix'],
  ['groceries', 'Groceries', 'var'], ['outside', 'Outside food', 'var'],
  ['transport', 'Transport', 'var'], ['health', 'Health', 'var'],
  ['household', 'Household', 'var'], ['personal', 'Personal', 'var'],
  ['ops', 'Operating costs', 'biz'], ['marketing', 'Marketing', 'biz'],
  ['debtpay', 'Debt payment', 'move'], ['saving', 'Savings transfer', 'move'],
  ['between', 'Between accounts', 'move'],
];
const SEEDTAGS = [['date', 'Date'], ['gift', 'Gift'], ['travel', 'Travel'], ['work', 'Work']];
/* Merchants he named. A rule is text seen in a description and what it means,
   so writing one sorts the whole history back to the beginning. */
const SEEDRULES = [
  ['grab', 'transport'], ['angkas', 'transport'], ['shell', 'transport'],
  ['petron', 'transport'], ['caltex', 'transport'], ['gas', 'transport'],
  ['meralco', 'utilities'], ['maynilad', 'utilities'], ['converge', 'utilities'],
  ['pldt', 'utilities'], ['globe', 'utilities'], ['smart', 'utilities'],
  ['rent', 'rent'], ['grocer', 'groceries'], ['supermarket', 'groceries'],
  ['puregold', 'groceries'], ['landers', 'groceries'], ['smmarket', 'groceries'],
  ['jollibee', 'outside'], ['mcdo', 'outside'], ['starbucks', 'outside'],
  ['restaurant', 'outside'], ['cafe', 'outside'], ['foodpanda', 'outside'],
  ['netflix', 'subs'], ['spotify', 'subs'], ['youtube', 'subs'],
  ['adobe', 'ops'], ['canva', 'ops'], ['skool', 'ops'],
];
/* Vocabulary added after first launch: a device that was seeded before these
   existed still needs them, once. A flag rather than a check for the row, so
   deleting either one keeps it deleted. */
function seedMore() {
  if (S.get('seeded2', 0)) return;
  if (!Rec.has('cat', null, ONETIME)) Rec.set('cat', null, ONETIME, { name: 'One-time transfers', grp: 'var', ord: 99 });
  if (!Rec.has('wtag', null, UNSURE)) Rec.set('wtag', null, UNSURE, { name: 'Unsure' });
  S.set('seeded2', 1);
}
function seed() {
  seedMore();
  if (S.get('seeded', 0)) return;
  SEED.forEach(([id, name, grp], i) => { if (!Rec.has('cat', null, id)) Rec.set('cat', null, id, { name: name, grp: grp, ord: i }); });
  SEEDTAGS.forEach(([id, name]) => { if (!Rec.has('wtag', null, id)) Rec.set('wtag', null, id, { name: name }); });
  SEEDRULES.forEach(([m, c]) => { if (!Rec.has('rule', null, m)) Rec.set('rule', null, m, { match: m, cat: c }); });
  S.set('seeded', 1);
}

/* ── reading ── */
/* == a monthly cap on a category ==
   Tom, 2026-09-11: "I dont mind budgets per category, for ex I only want to
   spend X amount of outside food."

   Three rules, all from DOCTRINE, and they are what stop this becoming the
   kind of budget nobody opens after week two.

   1. NOTHING SHIPS WITH A CAP. A cap is a claim about how somebody should
      live, so it is prescription, and prescription is only ever his to write.
   2. SHOW THE NUMBER, NEVER THE VERDICT. "3,400 of 5,000, 11 days in" is a
      fact he can act on. "Over budget!" is a scolding, and a screen that
      scolds is a screen he stops opening — which costs the data, not just the
      mood.
   3. PACE, NOT JUST TOTAL. Half the cap on the 5th and half on the 25th are
      opposite situations and one number cannot tell them apart.

   weeks is not a target, it is furniture. So a cap blown three months running
   offers to become a real one. That is not lowering the bar, it is the only
   way the bar does anything. */
function capState(catId, mo) {

     "We'll limit outside food to 0". A blank cap is still no allowance. */
  if (!cap && !c.zero) return null;
  const from = monthStart(mo), to = monthEnd(mo);
  const spent = rangeSpend(from, to).byCat[catId] || 0;
  const days = Day.diff(to, from) + 1;

  /* Where the cap says he should be by today, if it were spread evenly. It is

  const pace = done ? cap : cap * (gone / days);

   The accessors above hand back `{id, ...payload}` so callers can pass one

}

/* ══ what WEALTH thinks of one of STATUS's spend rows ══

/* ══ liquid: only as true as the last count ══

   that shows one says how old the count is.                                */
function lastCount(acctId) {

  return { date: r.date, bal: num(r.payload.bal, 0) };
}
/* Everything logged against an account since a date. Also the answer for an
   account with no count at all, which is the point of splitting it out.

   as never counted." It did, and by the letter of law 1 that was right: a
   payment is not a count. But the screen threw away a fact he had just given

  spendRows(from ? { from: from } : {}).forEach(x => { if (x.acct === acctId) out += num(x.amt, 0); });
  /* A transfer between his own accounts leaves one and lands in the other.
     It changes both balances and neither spending nor income. */
  xfers(from ? { from: from } : {}).forEach(x => {
    if (x.to === acctId) inn += num(x.amt, 0);

/* == how a client pays ==
   Four shapes, and a count. Tom, 2026-09-11: "I have a client who pays me
   every 2 months and 1 who pays every X sessions." So the cycle is no longer
   a fixed list of four options, it is a KIND plus a number.

     month  every N months, on a day of the month
     week   every N weeks, counted from the start date
     sesh   every N sessions delivered, which is not a date at all
     oneoff once, on the start date

   The old four values are still read, because rows written before this exist
   and a migration that rewrites them is a migration that can go wrong:

/* Days of the month, as typed: "1, 15" or "1 15" or "15,1". Sorted, unique,

  const every = Math.max(1, num(c.every, 0) || (raw === '4wk' ? 4 : 1));

  if (y.kind === 'oneoff') return 'one off';

/* == sessions as boxes ==

/* == packages bought up front ==
   Tom, 2026-09-11: "I want tracking for clients who pay for sessions upfront

   A package is sessions sold before they are delivered, which asks two
   questions at once and they pull opposite ways:

     do they owe me money?     the package value, less what has been paid
     do I owe them sessions?   what was bought, less what has been delivered

   The second is the one nobody tracks and it is a real liability: he has been
   paid for work he still has to do. Both are shown, never netted, because
   they are not the same kind of thing.

   Payments are applied to packages in order rather than tagged to one. Partial

   package and half of it is outstanding, pay two packages at once and the
   money runs on into the second. */
const packsOf = id => Rec.all('pack').filter(r => r.payload && r.payload.client === id)
  .map(r => Object.assign({ id: r.key, date: r.date }, r.payload))
  .sort((a, b) => a.date.localeCompare(b.date));

function packState(c) {
  const list = packsOf(c.id);
  const bought = list.reduce((a, x) => a + num(x.n, 0), 0);
  const value = list.reduce((a, x) => a + num(x.price, 0), 0);
  const sess = seshOf(c.id);
  const delivered = sess.length;

     day it was sold, so that ₱22,500 would have read as late from day one.

     A package's `parts` split its price evenly. With `when` 'before' (the
     default) a part is due at the start of its block: the first when it is
     sold, the next when the session ending the previous block is done. With
     'after' a part is due when its own block ends. Sessions belong to
     packages oldest first.

     A part not reached yet has no real date. If the client has a pace, the
     date is guessed from it and marked as a guess; without one it has none.
     A guessed part is expected, never late. A package with one part behaves
     exactly as it always did. */
  let start = 0;

  list.forEach(x => {
    const n = Math.max(1, num(x.n, 0)), price = num(x.price, 0);
    const p = Math.max(1, Math.min(n, Math.round(num(x.parts, 1)) || 1));
    const after = x.when === 'after';
    const mine = sess.slice(start, start + n);
    const each = Math.floor(price / p * 100) / 100;
    for (let k = 0; k < p; k++) {
      const at = after ? Math.round(n * (k + 1) / p) : Math.round(n * k / p);
      const amt = k === p - 1 ? round2(price - each * (p - 1)) : each;

      if (at === 0) { date = x.date; reached = true; }
      else if (mine.length >= at) { date = mine[at - 1].date; reached = true; }
      else if (pace > 0) {
        const base = [x.date].concat(delivered ? [sess[delivered - 1].date] : []).sort().pop();

        date = Day.shift(base, Math.ceil(remaining * 7 / pace));
        if (date < today) date = today;
        est = true;

      parts.push({ pack: x, k: k, of: p, at: at, after: after, amt: amt, date: date, reached: reached, est: est });

     or failing that from the sessions of the last four weeks; with neither
     there is no date and nothing is counted. */
  const renew = [];
  if (list.length && c.status !== 'done') {
    const last = list[list.length - 1];
    const recent = sess.filter(x => x.date > Day.shift(today, -28)).length;

/* == what a session earns ==

   see how much I earn per week for that client."

   earns their latest package's price over its sessions, because a renewal at
   a new price is the price that is true now. A week's worth is that times the
   pace he gave, and it says "about" because the pace is his rough figure. */

const earnWords = (per, pace) => per

      if (seen[d] || d > to || d < from || d < c.start) return;
      seen[d] = 1;

/* == a session client's payments ==

/* An expected payment is settled by a `paid` row for that client. A dated

    /* no price set, nothing expected: a client COACH made starts at 0, and a
       row of 0 peso payments marked late is noise, not a record */
    if (y.kind !== 'pack' && !(num(c.rate, 0) > 0)) return;
    if (y.kind === 'pack') {
      if (c.status === 'done') return;

      st.dues.forEach(d => {

        .sort((a, b) => a.date.localeCompare(b.date));

       already paid as shown by bank statements, why is she still showing as
       not paid". She was due on the 1st and paid on the 19th, past the
       fortnight, so the payment matched nothing and the 1st read as late. A
       payment left over after the nearest-date pass settles the oldest unpaid
       date on or before it, in order. */
    got.filter(p => p.client === c.id && !used[p.date + p.key])

/* ── bills falling due in a window ── */
function billsDue(from, to) {

/* One bill's due dates in a window.

/* ══ the three numbers ══ */
function board() {
  const L = liquid();
  const win = freeWindow();

     own. The allowance already covers that spending, and both would hold the
     same money twice. */
  const due = billsOwed(Day.today(), win.to)
    .filter(x => !(num((Rec.get('cat', null, x.bill.cat) || {}).cap, 0) > 0))
    .reduce((a, x) => a + num(x.bill.amt, 0), 0);

function rangeSpend(from, to) {

   Tom, 2026-09-11: "I want to review individual days and weeks." A day is not
   only spending. Money arrived, sessions were delivered, money moved into a
   pot. All of it in one column, sorted by the clock, which is the only thing
   that makes a day readable rather than four separate lists. */
function dayEvents(date) {
  const out = [];
  spendRows({ date: date }).forEach(x => {
    if (isMove(x)) { out.push({ kind: 'move', t: num(x.t, 0), name: x.note || 'Moved money',
      note: acctName(x.acct), amt: -num(x.amt, 0), row: x, quiet: 1 }); return; }
    out.push({ kind: 'out', t: num(x.t, 0), name: x.note || 'No details',
      note: acctName(x.acct) + (catOf(x) ? ' · ' + catName(catOf(x)) : ' · uncategorised'),
      amt: -num(x.amt, 0), row: x, big: isBig(x) });
  });
  paidRows({ date: date }).forEach(x => {
    const c = x.client ? Rec.get('client', null, x.client) : null;
    out.push({ kind: 'in', t: num(x.t, 0), name: c ? c.name : (x.note || 'One-off'),
      note: acctName(x.acct) + (c && x.note ? ' · ' + x.note : ''), amt: num(x.amt, 0), row: x });
  });
  moves({ date: date }).forEach(x => {
    const pt = Rec.get('pot', null, x.pot);
    out.push({ kind: 'pot', t: 0, name: pt ? pt.name : 'a pot',
      note: x.dir === 'out' ? 'taken out of the pot' : 'put into the pot',
      amt: 0, quiet: 1, fig: (x.dir === 'out' ? '-' : '+') + money(num(x.amt, 0)) });
  });
  xfers({ date: date }).forEach(x => {
    out.push({ kind: 'xfer', t: num(x.t, 0), name: acctName(x.from) + ' to ' + acctName(x.to),
      note: 'your own money moving, not spending', amt: 0, quiet: 1, fig: money(num(x.amt, 0)) });
  });
  Rec.all('sesh', { date: date }).forEach(r => {
    const c = Rec.get('client', null, r.payload.client);
    out.push({ kind: 'sesh', t: 0, name: c ? c.name : 'a client',
      note: 'session delivered', amt: 0, quiet: 1, fig: 'session' });
  });
  return out.sort(byTime);
}

/* ══════════════════════ STATEMENT IMPORT ══════════════════════
   Tom, 2026-09-11: "the purpose of the statement import to make sure I have
   everything correct but we definitely dont want duplicates, maybe uncertain
   cases you can ask me everything whether 2 things are the same or not, then
   we can create a master entry."

   That is the whole design, and the important half of it is the second half.
   An import that only ADDS is worse than no import: the same lunch appears
   twice, every total is wrong, and the app has quietly become less true than
   the notebook it replaced.

   So every line off a statement lands in one of four places:

     KNOWN      already reconciled on an earlier import. Silent, and this is
                what makes running the same file twice harmless.
     CERTAIN    same account, same amount to the peso, on the same day, with
                no clock or shop name against it. Merged without asking.
     ASK        close but not certain. He decides, one at a time, and the
                question is always "are these the same thing".
     NEW        nothing like it. Offered as something to add.

   MERGING MAKES A MASTER ENTRY, IT DOES NOT MAKE A SECOND ROW. What he knows
   (the category, the note, the receipt, the occasion) stays. What the bank
   knows better (the exact amount, the date it really cleared, its own
   description) is written over the top. The row keeps its identity, so the
   category he set six weeks ago survives being reconciled.

   NOTHING IS WRITTEN UNTIL HE PRESSES APPLY. The whole run is worked out in
   memory and shown as a tally first, because an import that has already
   happened by the time you see it is not something you can say no to.        */

/* Every statement line gets a fingerprint, so a file read twice is read once.
   Account, day, amount and the first run of letters in the description —
   enough to be stable, loose enough to survive a bank re-spacing its own
   columns. */
function stmtId(acct, date, amt, desc, ref) {
  /* The bank's own reference when there is one. Without it, two ₱93 Angkas
     rides on the same day are one fingerprint, and the second would be
     skipped as already imported. */
  return acct + '|' + date + '|' + Math.round(num(amt, 0) * 100) + '|' +
    (ref ? 'ref:' + String(ref).trim() : norm(String(desc || '').slice(0, 24)));
}
const recon = id => Rec.get('recon', null, id);

/* ── reading whatever the bank printed ──
   CSV, tab separated, or text pasted out of a PDF. Files themselves, PDF and
   spreadsheet, are opened further down by libraries fetched only when needed;
   pasting stays as the way in when they will not load. */
/* == which character is actually the column break ==
   Deciding this per line is wrong and it bit immediately: "5,400.00" made a
   pasted PDF line look comma separated, so one statement was read with three
   different column counts and came out as a single nonsense row.

   So it is decided ONCE for the whole file, by trying each candidate and
   asking which one gives the same column count on the most lines. A thousands
   separator cannot win that, because it only appears on the lines with big
   numbers on them.

   Comma is tried last on a tie for the same reason: a run of spaces is never
   accidental, a comma very often is. */
function splitWith(line, d) {
  if (d === 'ws') return line.split(/\s{2,}/).map(x => x.trim());
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { q = !q; continue; }
    if (!q && ch === d) { out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out.map(x => x.trim());
}
function delimFor(lines) {
  let best = null;
  ['\t', ';', 'ws', ','].forEach(d => {
    const counts = {};
    lines.forEach(l => { const n = splitWith(l, d).length; if (n > 1) counts[n] = (counts[n] || 0) + 1; });
    const top = Object.keys(counts).map(Number).sort((a, b) => counts[b] - counts[a])[0];
    const score = top ? counts[top] : 0;
    if (score && (!best || score > best.score)) best = { d: d, score: score, cols: top };
  });
  return best ? best.d : 'ws';
}

const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
/* Returns {y, m, d} with m and d NOT yet decided when the format is
   ambiguous, so the caller can settle 03/04 once for the whole file instead
   of guessing differently on every line. */
function readDate(raw) {
  const t = String(raw || '').trim();
  let m;
  if ((m = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)))
    return { y: +m[1], a: +m[2], b: +m[3], sure: 'ymd' };
  if ((m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))) {
    let y = +m[3]; if (y < 100) y += 2000;
    return { y: y, a: +m[1], b: +m[2], sure: null };
  }
  /* 11 Sep 2026, Sep 11 2026, Sep 11, 2026 */
  if ((m = t.match(/^(\d{1,2})\s*[- ]\s*([A-Za-z]{3,})\.?\,?\s*(\d{2,4})?/))) {
    const mo = MONTHS.indexOf(m[2].slice(0, 3).toLowerCase());
    if (mo > -1) return { y: m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : +Day.today().slice(0, 4),
      a: mo + 1, b: +m[1], sure: 'ymd' };
  }
  if ((m = t.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2})\,?\s*(\d{2,4})?/))) {
    const mo = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase());
    if (mo > -1) return { y: m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : +Day.today().slice(0, 4),
      a: mo + 1, b: +m[2], sure: 'ymd' };
  }
  return null;
}
const isoOf = (p, dayFirst) => {
  const mo = p.sure === 'ymd' ? p.a : (dayFirst ? p.b : p.a);
  const dy = p.sure === 'ymd' ? p.b : (dayFirst ? p.a : p.b);
  if (mo < 1 || mo > 12 || dy < 1 || dy > 31) return null;
  return p.y + '-' + String(mo).padStart(2, '0') + '-' + String(dy).padStart(2, '0');
};

/* An amount, however the bank chose to print a minus sign. */
function readAmt(raw) {
  let t = String(raw == null ? '' : raw).trim();
  if (!t) return null;
  let neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  if (/(^|\s)(dr|db|debit)\b/i.test(t)) neg = true;
  if (/(^|\s)(cr|credit)\b/i.test(t)) neg = false;
  t = t.replace(/[^0-9.\-]/g, '');
  if (t.indexOf('-') === 0) { neg = true; t = t.slice(1); }
  if (!t || !/[0-9]/.test(t)) return null;
  const v = parseFloat(t);
  if (!isFinite(v)) return null;
  return neg ? -v : v;
}

/* Which column is which. A header row if there is one, otherwise by shape:
   the column that parses as a date every time is the date, the one that
   parses as a number every time is the amount, the longest text is the
   description. */
const HEAD = {
  date: /^(date|txn date|transaction date|posting date|post date|value date|datetime)/i,
  desc: /^(desc|description|details|particulars|narrative|remarks|merchant|payee|reference|transaction)/i,
  amt: /^(amount|amt|value|transaction amount)/i,
  dr: /^(debit|withdrawal|paid out|money out|outflow|dr)/i,
  cr: /^(credit|deposit|paid in|money in|inflow|cr)/i,
};
function parseStatement(text, dayFirst) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return { rows: [], ambiguous: false, skipped: 0 };
  const delim = delimFor(lines);
  const grid = lines.map(l => splitWith(l, delim)).filter(c => c.length > 1);
  if (!grid.length) return { rows: [], ambiguous: false, skipped: lines.length };

  /* a header row names its columns and parses as no dates at all */
  let cols = null, start = 0;
  const first = grid[0];
  if (first.some(c => HEAD.date.test(c)) && !readDate(first[0])) {
    cols = { date: -1, desc: -1, amt: -1, dr: -1, cr: -1 };
    first.forEach((c, i) => {
      Object.keys(HEAD).forEach(k => { if (cols[k] < 0 && HEAD[k].test(c)) cols[k] = i; });
    });
    start = 1;
  }
  if (!cols) {
    const n = Math.max.apply(null, grid.map(r => r.length));
    const hits = [];
    for (let i = 0; i < n; i++) {
      let d = 0, a = 0, len = 0;
      grid.forEach(r => {
        if (r[i] == null) return;
        if (readDate(r[i])) d++;
        if (readAmt(r[i]) != null && /[0-9]/.test(r[i])) a++;
        len += String(r[i]).length;
      });
      hits.push({ i: i, d: d, a: a, len: len });
    }
    const dateCol = hits.slice().sort((x, y) => y.d - x.d)[0];
    const amtCol = hits.filter(h => h.i !== dateCol.i).sort((x, y) => y.a - x.a || y.i - x.i)[0];
    const descCol = hits.filter(h => h.i !== dateCol.i && h.i !== (amtCol || {}).i)
      .sort((x, y) => y.len - x.len)[0];
    cols = { date: dateCol.i, amt: amtCol ? amtCol.i : -1,
             desc: descCol ? descCol.i : -1, dr: -1, cr: -1 };
  }

  /* Settle day-first versus month-first ONCE, for the whole file. A number
     over twelve in one position proves which it is; if nothing proves it, the
     caller asks him rather than picking. */
  let proof = null, anyLoose = false;
  grid.slice(start).forEach(r => {
    const p = readDate(r[cols.date]);
    if (!p || p.sure) return;
    anyLoose = true;                       /* a date whose order is not stated */
    if (p.a > 12) proof = true;
    else if (p.b > 12 && proof === null) proof = false;
  });
  const df = dayFirst == null ? (proof === null ? false : proof) : dayFirst;

  const rows = []; let skipped = 0;
  grid.slice(start).forEach(r => {
    const p = readDate(r[cols.date]);
    const date = p ? isoOf(p, df) : null;
    let amt = null;
    if (cols.dr > -1 || cols.cr > -1) {
      const dr = readAmt(r[cols.dr]), cr = readAmt(r[cols.cr]);
      if (dr != null && dr !== 0) amt = -Math.abs(dr);
      else if (cr != null && cr !== 0) amt = Math.abs(cr);
    } else if (cols.amt > -1) amt = readAmt(r[cols.amt]);
    const desc = cols.desc > -1 ? r[cols.desc] : r.filter((_, i) => i !== cols.date && i !== cols.amt).join(' ');
    if (!date || amt == null || !amt) { skipped++; return; }
    rows.push({ date: date, amt: amt, desc: String(desc || '').trim() });
  });
  /* Only ask when there is something to ask about. A file of ISO dates states
     its own order on every line, and a question with no doubt behind it is
     the fastest way to teach somebody to click through questions. */
  return { rows: rows, ambiguous: anyLoose && proof === null && dayFirst == null,
           skipped: skipped, dayFirst: df, cols: cols };
}

/* ══════════════════ the smart half of import ══════════════════
   Tom, 2026-09-13, with his real GCash PDF and UnionBank spreadsheet: "please
   create the smart import tool." Reading those two files taught four things,
   and each one is a way an honest-looking import puts wrong money in the app.

   1. A PRINTED AMOUNT IS NOT ALWAYS MONEY THAT MOVED. GCash prints ride holds
      as payments. Two ₱62 Angkas lines three minutes apart, the balance does
      not move on the second, then a ₱93 line that only takes ₱31. Over two
      months that was ₱4,261 of "spending" that never left the wallet. The
      running balance is the only column that tells the truth, so wherever a
      statement has one, the amount of every line is what the balance did.

   2. A STATEMENT CAN BE CHECKED AGAINST ITSELF. Opening balance plus every
      movement lands on the closing balance to the centavo, or something is
      wrong — a missed page, text pulled out of a PDF in the wrong order. When
      it does not add up, nothing is imported unless he says he has checked.

   3. A REVERSAL CANCELS ITS ORIGINAL. UnionBank sent ₱1,600 to a mistyped
      GCash number and put it straight back. Both lines are real and together
      they are nothing, so they are netted out, not imported as a payment and
      an income.

   4. HIS OWN MONEY SHOWS UP TWICE. ₱5,500 sent from UnionBank to his own
      GCash is a debit on one statement and a credit on the other. Imported as
      spending and income it inflates both. So it is recorded once, as a
      transfer, and the second statement finds the transfer the first one
      already wrote instead of adding another.

   Only after those four does the old question get asked: is this already
   something he logged? */

const round2 = n => Math.round(n * 100) / 100;
const xfers = o => Rec.all('xfer', o).map(r => Object.assign({ key: r.key, date: r.date }, r.payload));

/* == the libraries, fetched only when a file needs one ==
   Hard constraint 4 allows a CDN dependency that degrades, and SheetJS is
   already one. The PDF reader is the same deal: nothing in the app waits on
   it, and if it will not load the import says so and offers pasting. An
   earlier note in this file ruled PDFs out entirely; that was wrong, it
   confused "may not depend on" with "may not use". */
const LIBS = {
  xlsx: { src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', ready: () => window.XLSX },
  pdf: { src: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', ready: () => window.pdfjsLib },
  /* Reads a PDF that is only a picture of the page. Loaded only then. */
  ocr: { src: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js', ready: () => window.Tesseract },
};
function loadLib(name) {
  const L = LIBS[name];
  if (L.ready()) return Promise.resolve(L.ready());
  if (!L.p) {
    L.p = new Promise(res => {
      const s = el('script');
      s.src = L.src;
      s.onload = () => res(L.ready() || null);
      s.onerror = () => res(null);
      document.head.appendChild(s);
      setTimeout(() => res(L.ready() || null), 15000);
    }).then(v => { if (!v) L.p = null; return v; });
  }
  return L.p;
}

function fileKind(f) {
  const n = String(f.name || '').toLowerCase();
  if (/\.pdf$/.test(n) || f.type === 'application/pdf') return 'pdf';
  if (/\.xlsx?$/.test(n)) return 'xlsx';
  if (/^image\//.test(f.type || '') || /\.(png|jpe?g|webp)$/.test(n)) return 'image';
  return 'text';
}
const readAs = (f, how) => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(fr.result);
  fr.onerror = () => rej(new Error('that file could not be read'));
  if (how === 'text') fr.readAsText(f); else fr.readAsArrayBuffer(f);
});

/* == a spreadsheet locked with a password ==
   Tom, 2026-09-23: UnionBank's download is an Excel file with a password on
   it, and SheetJS cannot open one. Excel's lock (MS-OFFCRYPTO, "agile") is
   AES over the real file, with a key made from the password by hashing it a
   hundred thousand times. The browser's own crypto does all of it, so no
   new library. The password goes to this and nowhere else, like a PDF's. */
const b64bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const catBytes = (...a) => { const o = new Uint8Array(a.reduce((n, x) => n + x.length, 0)); let i = 0; a.forEach(x => { o.set(x, i); i += x.length; }); return o; };
const u32 = n => new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]);
const fitLen = (b, n, fill) => { const o = new Uint8Array(n).fill(fill); o.set(b.slice(0, n)); return o; };
/* AES-CBC with no padding. WebCrypto insists on padding, so one block that
   decrypts to a full padding block is made and put on the end. */
async function cbcRaw(keyBytes, iv, data) {
  const k = await crypto.subtle.importKey('raw', keyBytes, 'AES-CBC', false, ['encrypt', 'decrypt']);
  const last = data.slice(data.length - 16);
  const pad = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-CBC', iv: last }, k, new Uint8Array(16).fill(16))).slice(0, 16);
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, k, catBytes(data, pad)));
}
async function unlockXlsx(X, buf, password) {
  const cfb = X.CFB.read(new Uint8Array(buf), { type: 'array' });
  const info = X.CFB.find(cfb, 'EncryptionInfo'), pkg = X.CFB.find(cfb, 'EncryptedPackage');
  if (!info || !pkg) return null;
  const xml = new TextDecoder().decode(new Uint8Array(info.content).slice(8));
  const doc = new DOMParser().parseFromString(xml.slice(xml.indexOf('<')), 'application/xml');
  const kd = doc.getElementsByTagName('keyData')[0];
  const ke = Array.from(doc.getElementsByTagName('*')).find(e => e.localName === 'encryptedKey');
  if (!kd || !ke) throw new Error('This spreadsheet is locked in an older way WEALTH cannot open. Open it, save a copy without the password, and choose that.');
  const alg = a => ({ SHA512: 'SHA-512', SHA384: 'SHA-384', SHA256: 'SHA-256', SHA1: 'SHA-1' })[String(a).toUpperCase().replace('-', '')];
  const H = async b => new Uint8Array(await crypto.subtle.digest(alg(ke.getAttribute('hashAlgorithm')), b));
  const keyLen = +ke.getAttribute('keyBits') / 8;
  const salt = b64bytes(ke.getAttribute('saltValue'));
  const pw = new Uint8Array(password.length * 2);
  for (let i = 0; i < password.length; i++) { const c = password.charCodeAt(i); pw[2 * i] = c & 255; pw[2 * i + 1] = c >> 8; }
  let h = await H(catBytes(salt, pw));
  for (let i = 0, n = +ke.getAttribute('spinCount'); i < n; i++) h = await H(catBytes(u32(i), h));
  const derive = async blk => fitLen(await H(catBytes(h, new Uint8Array(blk))), keyLen, 0x36);
  const iv0 = fitLen(salt, 16, 0x36);
  const vIn = await cbcRaw(await derive([0xfe, 0xa7, 0xd2, 0x76, 0x3b, 0x4b, 0x9e, 0x79]), iv0, b64bytes(ke.getAttribute('encryptedVerifierHashInput')));
  const vVal = await cbcRaw(await derive([0xd7, 0xaa, 0x0f, 0x6d, 0x30, 0x61, 0x34, 0x4e]), iv0, b64bytes(ke.getAttribute('encryptedVerifierHashValue')));
  const want = await H(vIn.slice(0, +ke.getAttribute('saltSize')));
  if (want.some((b, i) => b !== vVal[i])) { const err = new Error('password'); err.password = password ? 'wrong' : 'needed'; throw err; }
  const secret = (await cbcRaw(await derive([0x14, 0x6e, 0x0b, 0xe7, 0xab, 0xac, 0xd0, 0xd6]), iv0, b64bytes(ke.getAttribute('encryptedKeyValue')))).slice(0, +kd.getAttribute('keyBits') / 8);
  const kdSalt = b64bytes(kd.getAttribute('saltValue'));
  const kdH = async b => new Uint8Array(await crypto.subtle.digest(alg(kd.getAttribute('hashAlgorithm')), b));
  const raw = new Uint8Array(pkg.content);
  const size = raw[0] + raw[1] * 256 + raw[2] * 65536 + raw[3] * 16777216 + (raw[4] + raw[5] * 256) * 4294967296;
  const body = raw.slice(8), parts = [];
  for (let i = 0, seg = 0; i < body.length; i += 4096, seg++) {
    const chunk = body.slice(i, i + 4096);
    parts.push(await cbcRaw(secret, (await kdH(catBytes(kdSalt, u32(seg)))).slice(0, 16), chunk.slice(0, chunk.length - chunk.length % 16)));
  }
  return catBytes(...parts).slice(0, size);
}
async function openXlsx(buf, password) {
  const X = await loadLib('xlsx');
  if (!X) throw new Error('The spreadsheet reader would not load, which usually means no internet. Save the file as CSV and choose that instead.');
  let wb;
  try { wb = X.read(new Uint8Array(buf), { type: 'array' }); }
  catch (e) {
    if (!/password|encrypt/i.test(String(e && e.message))) throw new Error('That spreadsheet would not open: ' + (e && e.message || e));
    if (!password) { const err = new Error('password'); err.password = 'needed'; throw err; }
    const plain = await unlockXlsx(X, buf, password);
    if (!plain) throw new Error('This spreadsheet has a password on it. Open it, save a copy without the password, and choose that.');
    wb = X.read(plain, { type: 'array' });
  }
  const ws = wb.Sheets[wb.SheetNames[0]];
  return X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' })
    .map(r => r.map(c => String(c == null ? '' : c)))
    .filter(r => r.some(c => c.trim()));
}

/* Text comes out in the order the PDF drew it, which for GCash is one
   transaction at a time. Rebuilding lines from their positions on the page is
   what scrambled the first attempt, so positions are deliberately ignored.

   The password is handed to the reader and nowhere else: not a setting, not a
   row, not the console. */
async function openPdf(buf, password) {
  const P = await loadLib('pdf');
  if (!P) throw new Error('The PDF reader would not load, which usually means no internet. Select the text in the PDF and paste it instead.');
  P.GlobalWorkerOptions.workerSrc = LIBS.pdf.src.replace('pdf.min.js', 'pdf.worker.min.js');
  let doc;
  try {
    doc = await P.getDocument({ data: new Uint8Array(buf.slice(0)), password: password || undefined }).promise;
  } catch (e) {
    if (e && e.name === 'PasswordException') {
      const err = new Error('password');
      err.password = e.code === 2 ? 'wrong' : 'needed';
      throw err;
    }
    throw new Error('That PDF would not open: ' + (e && e.message || e));
  }
  const lines = [];
  let cur = '';
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    tc.items.forEach(it => {
      cur += it.str;
      if (it.hasEOL) { if (cur.trim()) lines.push(cur.trim()); cur = ''; }
    });
    if (cur.trim()) { lines.push(cur.trim()); cur = ''; }
  }
  return lines;
}

/* == a PDF that is only a picture of the pages ==
   Tom, 2026-09-14, with his UnionBank history saved through Microsoft's Print
   to PDF: "Wealth cant handle this." Printing turned every letter into a
   drawn shape, so there is no text to take and openPdf finds none.

   So each page is drawn and read the way a person reads it, by Tesseract,
   fetched only when a PDF needs it. A word's column is decided by where it
   starts, against the header row on that page. A line with a date starts a
   transaction; a line whose words all sit in the description column carries
   on the one above; anything else, footers included, is skipped. What comes
   out is an ordinary table for readTable, exactly like a spreadsheet.

   A misread figure cannot slip through quietly: every line carries a running
   balance, and settle() refuses a chain that does not add up. Watched on his
   real four pages: every date and amount read exactly, and two reference
   numbers came back with S read as $ or with a stray §, which cleanRef fixes. */
function cleanRef(s) {
  let r = String(s || '').replace(/[$§]/g, 'S').replace(/[^A-Za-z0-9]/g, '').replace(/^S{2,}/, 'S');
  /* A card reference is S and eight digits; the reading also returned the S
     as an 8, which makes nine digits no reference of this bank has. */
  if (/^8\d{8}$/.test(r)) r = 'S' + r.slice(1);
  const m = r.match(/^(UB|U8|S)([0-9OIl]+)$/i);
  if (m) r = (m[1].toUpperCase() === 'U8' ? 'UB' : m[1].toUpperCase()) + m[2].replace(/O/g, '0').replace(/[Il]/g, '1');
  return r;
}
async function ocrPdf(buf, password, say) {
  const P = await loadLib('pdf');
  const T = P ? await loadLib('ocr') : null;
  if (!P || !T) throw new Error('This PDF is a picture of the pages, and the reader for pictures would not load, which usually means no internet. Download the statement as a spreadsheet instead.');
  const doc = await P.getDocument({ data: new Uint8Array(buf.slice(0)), password: password || undefined }).promise;
  const worker = await T.createWorker('eng');
  const grid = [];
