/* ── a desktop app, under hard constraint 10 ──

/* ── the picker: autofill, because a typo makes a second thing ──

<header>

<script>
/* ══════════════════════════════ WEALTH ══════════════════════════════
   What is coming in, what is going out, what is already spoken for, and
   how long it lasts. See wealth/CLAUDE.md for why each rule is here.   */

const APP = {
  id: 'wealth',
  name: 'Wealth',
  icon: '▩',
  blurb: 'clients, bills, pots and what is actually left',
  /* Types WEALTH owns. `spend` and `acct` are NOT here: STATUS owns their
     shape and WEALTH only merges into them. Declaring them would silence the
     store's warning, which is the one thing keeping the two apps honest. */
  types: ['cat', 'rule', 'wtag', 'mark', 'count', 'client', 'paid', 'sesh', 'pack', 'bill', 'pot', 'move', 'debt'],
};

Skins.load('../shared/skins.json?v=13').then(() => { Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* The backup carries the shared money rows too. A restore of WEALTH without
   its spending is a restore of the labels and none of the facts. */
IO.register({ app: APP.id, name: APP.name, types: APP.types.concat(['spend', 'acct']) });

/* ── small tools ── */
const el = UI.el, esc = UI.esc;
/* `parseFloat('12,000')` is 12. Not 12000, not NaN — twelve, silently, with
   three zeroes thrown away. Every amount in this app goes through here, so a
   typed comma was a way to lose money without a single error. Strip the
   grouping first; this is not optional and never was. */
const num = (v, d) => {
  const n = parseFloat(typeof v === 'string' ? v.replace(/,/g, '') : v);
  return isFinite(n) ? n : (d == null ? 0 : d);
};
const money = n => (n < 0 ? '-' : '') + '₱' + Math.round(Math.abs(n)).toLocaleString();
const short = n => {
  const a = Math.abs(n), sign = n < 0 ? '-' : '';
  if (a >= 1000000) return sign + '₱' + (a / 1000000).toFixed(1) + 'm';
  /* From a thousand up, not from ten thousand. The two thresholds put ₱5,000
     and ₱10k on the same axis, which reads as two different units. */
  if (a >= 1000) return sign + '₱' + Math.round(a / 1000) + 'k';
  return money(n);
};

/* ══ the y-axis step this app needs and the foundation does not have ══
   `shared/chart.js` picks its own step from a table that stops at 5000, so a
   chart of eighty thousand pesos asks for a 20,000 step, finds nothing that
   big, and falls back to 5000 — seventeen gridlines with their labels sitting
   on top of each other.

   Money is the first thing in this suite counted in tens of thousands, so
   nothing had hit it before. The table is in `shared/`, which an app session
   must not touch, so the step is worked out here and handed to `ySet`.
   Reported to Tom for a foundation session; delete this when the table
   grows.                                                                  */
function moneyScale(ch, values) {
  const vs = values.filter(v => v != null && isFinite(v));
  const hi = Math.max(1, vs.length ? Math.max.apply(null, vs) : 1);
  const lo = Math.min(0, vs.length ? Math.min.apply(null, vs) : 0);
  const span = hi - lo;
  let step = Math.pow(10, Math.floor(Math.log10(span / 4)));
  [1, 2, 2.5, 5, 10].some(m => { if (step * m >= span / 4) { step *= m; return true; } return false; });
  return ch.ySet(Math.floor(lo / step) * step, Math.ceil(hi / step) * step, step);
}

/* A chart drawn at the width its box actually turned out to be.
   The svg keeps its aspect ratio, so one drawn 640 wide inside a 1360px card
   letterboxes into the middle and looks like a mistake.

   Measured synchronously, and NOT from a frame callback. `requestAnimationFrame`
   never fires in a tab the browser is not painting, so the first version of
   this drew nothing at all whenever the window was behind something else —
   which is also how it was found. `shared/ui.js` says the same thing about its
   segmented control: a frame callback is not guaranteed to run.

   The box must already be in the document, or it measures zero. The timeout is
   the second chance for the case where it is not.                          */
function chartInto(box, h, fn) {
  const go = () => {
    const w = Math.round(box.getBoundingClientRect().width);
    if (!w) return false;
    box.innerHTML = '';
    const ch = Chart.make({ w: w, h: h });
    fn(ch, w);
    box.appendChild(ch.el);
    return true;
  };
  if (!go()) setTimeout(go, 0);
  return box;
}
let seq = 0;
const newId = () => Rec.USER + '-' + Date.now().toString(36) + '-' +
  (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
/* Two names are the same name if only punctuation and case separate them.
   This is what stops "Grab" and "grab " becoming two things. */
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
const S = { get: (k, d) => { const v = Rec.setting(APP.id, k); return v == null ? d : v; },
            set: (k, v) => Rec.setting(APP.id, k, v) };

/* == the time of day ==
   Tom, 2026-09-11: "I also want time tracking for the entries." Every money
   row already carried a `t` millisecond stamp and nothing ever showed it, so
   a day was a bag of amounts in no order.

   `t` stays the stored fact, because it is what STATUS writes and what sorts
   correctly. These turn it into something a person reads and types. */
const timeOf = row => {
  const t = num(row && row.t, 0);
  if (!t || t < 86400000) return '';           /* 0, or a seeded placeholder */
  const d = new Date(t);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
};
const clock = row => { const v = timeOf(row); return v ? UI.clockLabel(v) : ''; };
/* A time typed on a given day, back to a stamp. The date comes from the row,
   never from the clock, or editing yesterday's entry moves it to today. */
function stampFor(date, hhmm) {
  const p = String(date).split('-');
  if (!hhmm) return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0).getTime();
  const t = hhmm.split(':');
  return new Date(+p[0], +p[1] - 1, +p[2], +t[0] || 0, +t[1] || 0, 0).getTime();
}
/* Untimed rows sort to the END, not the start. A pot move carries no clock,
   and a zero stamp put it above a 7:15am coffee, which reads as midnight. */
const byTime = (a, b) => {
  const x = num(a.t, 0) || Infinity, y = num(b.t, 0) || Infinity;
  return x - y;
};

const monthOf = d => String(d).slice(0, 7);
const monthStart = m => m + '-01';
const monthEnd = m => { const p = m.split('-'); return m + '-' + new Date(+p[0], +p[1], 0).getDate(); };
const monthBack = (m, n) => { const p = m.split('-'); const d = new Date(+p[0], +p[1] - 1 - n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const monthName = m => { const p = m.split('-');
  return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); };

/* ══ the starting vocabulary ══
   Shipped once, then his. Vocabulary, never prescription: these are names for
   things that already exist in his life, not a claim about how to live.
   `move` is the group that is NOT spending — see law 2 in the brief.        */
const SEED = [
  ['rent', 'Rent', 'fix'], ['utilities', 'Utility Bills', 'fix'],
  ['water', 'Drinking Water', 'fix'], ['subs', 'Subscriptions', 'fix'],
  ['gym', 'Gym', 'fix'],
  ['groceries', 'Groceries', 'var'], ['outside', 'Outside food', 'var'],
  ['transport', 'Transport', 'var'], ['health', 'Health', 'var'],
  ['household', 'Household', 'var'], ['personal', 'Personal', 'var'],
  ['ops', 'Operating costs', 'biz'], ['marketing', 'Marketing', 'biz'],
  ['debtpay', 'Debt payment', 'move'], ['saving', 'Savings transfer', 'move'],
  ['between', 'Between accounts', 'move'],
];
const SEEDTAGS = [['date', 'Date'], ['gift', 'Gift'], ['travel', 'Travel'], ['work', 'Work']];
/* Merchants he named. A rule is text seen in a description and what it means,
   so writing one sorts the whole history back to the beginning. */
const SEEDRULES = [
  ['grab', 'transport'], ['angkas', 'transport'], ['shell', 'transport'],
  ['petron', 'transport'], ['caltex', 'transport'], ['gas', 'transport'],
  ['meralco', 'utilities'], ['maynilad', 'utilities'], ['converge', 'utilities'],
  ['pldt', 'utilities'], ['globe', 'utilities'], ['smart', 'utilities'],
  ['rent', 'rent'], ['grocer', 'groceries'], ['supermarket', 'groceries'],
  ['puregold', 'groceries'], ['landers', 'groceries'], ['smmarket', 'groceries'],
  ['jollibee', 'outside'], ['mcdo', 'outside'], ['starbucks', 'outside'],
  ['restaurant', 'outside'], ['cafe', 'outside'], ['foodpanda', 'outside'],
  ['netflix', 'subs'], ['spotify', 'subs'], ['youtube', 'subs'],
  ['adobe', 'ops'], ['canva', 'ops'], ['skool', 'ops'],
];
function seed() {
  if (S.get('seeded', 0)) return;
  SEED.forEach(([id, name, grp], i) => { if (!Rec.has('cat', null, id)) Rec.set('cat', null, id, { name: name, grp: grp, ord: i }); });
  SEEDTAGS.forEach(([id, name]) => { if (!Rec.has('wtag', null, id)) Rec.set('wtag', null, id, { name: name }); });
  SEEDRULES.forEach(([m, c]) => { if (!Rec.has('rule', null, m)) Rec.set('rule', null, m, { match: m, cat: c }); });
  S.set('seeded', 1);
}

/* ── reading ── */
const cats = () => Rec.all('cat').map(r => Object.assign({ id: r.key }, r.payload))
  .sort((a, b) => (a.ord || 0) - (b.ord || 0) || a.name.localeCompare(b.name));
const catMap = () => Rec.map('cat');
const catName = id => (Rec.get('cat', null, id) || {}).name || 'Uncategorised';
const catGrp = id => (Rec.get('cat', null, id) || {}).grp || '';
const tags = () => Rec.all('wtag').map(r => Object.assign({ id: r.key }, r.payload));
const rules = () => Rec.all('rule').map(r => Object.assign({ id: r.key }, r.payload));
const accts = () => Rec.all('acct').map(r => Object.assign({ id: r.key }, r.payload))
  .sort((a, b) => (a.order || 0) - (b.order || 0));
const clients = () => Rec.all('client').map(r => Object.assign({ id: r.key }, r.payload))
  .sort((a, b) => (a.status === 'done' ? 1 : 0) - (b.status === 'done' ? 1 : 0) || a.name.localeCompare(b.name));
const pots = () => Rec.all('pot').map(r => Object.assign({ id: r.key }, r.payload))
  .sort((a, b) => (a.ord || 0) - (b.ord || 0));
const debts = () => Rec.all('debt').map(r => Object.assign({ id: r.key }, r.payload));
const bills = () => Rec.all('bill').map(r => Object.assign({ id: r.key }, r.payload))
  .sort((a, b) => (a.day || 0) - (b.day || 0));
const paidRows = o => Rec.all('paid', o).map(r => Object.assign({ key: r.key, date: r.date }, r.payload));
const spendRows = o => Rec.all('spend', o).map(r => Object.assign({ key: r.key, date: r.date }, r.payload));
const moves = o => Rec.all('move', o).map(r => Object.assign({ key: r.key, date: r.date }, r.payload));

/* == merge, never rebuild ==
   The accessors above hand back `{id, ...payload}` so callers can pass one
   object around. This writes one back: every field that was there is kept,
   mine are changed, and the synthetic `id`/`key`/`date` the accessor added is
   dropped so it never lands in the stored payload.

   Root brief: "Change a row by merging into what is there, never by
   rebuilding it." A function is harder to forget than a rule.            */
function merge(row, changes) {
  const out = Object.assign({}, row || {}, changes || {});
  delete out.id; delete out.key; delete out.date;
  return out;
}

/* ══ what WEALTH thinks of one of STATUS's spend rows ══
   Never written into the spend itself. A `mark` is keyed off it instead, so
   the price, the account, the receipt and the meal link STATUS put there
   cannot be dropped by an app that does not know they exist. This is the
   calcium bug designed out rather than remembered. See brief, ownership.  */
const markKey = s => s.date + '|' + s.key;
const markOf = s => Rec.get('mark', null, markKey(s)) || {};
function setMark(s, changes) {
  const cur = markOf(s);
  Rec.set('mark', null, markKey(s), Object.assign({}, cur, changes));
}
/* A rule matches on text found anywhere in the description. First match wins,
   longest first, so "smmarket" beats a bare "sm". */
let ruleCache = null;
function sortedRules() {
  if (!ruleCache) ruleCache = rules().filter(r => r.match)
    .sort((a, b) => b.match.length - a.match.length);
  return ruleCache;
}
function ruleFor(text) {
  const t = norm(text);
  if (!t) return null;
  const hit = sortedRules().find(r => t.indexOf(norm(r.match)) > -1);
  return hit || null;
}
/* The category of a spend: what he said, else what a rule says, else nothing.
   Nothing is a real answer and shows as Uncategorised rather than a guess. */
function catOf(s) {
  const m = markOf(s);
  if (m.cat) return m.cat;
  const r = ruleFor(s.note || '');
  return r ? r.cat : '';
}
function tagOf(s) {
  const m = markOf(s);
  if (m.tag) return m.tag;
  const r = ruleFor(s.note || '');
  return (r && r.tag) || '';
}
const isBig = s => !!markOf(s).big;
/* Law 2: moving money is not spending it. Nothing in the `move` group is ever
   counted as an outgoing, or every figure in the app is wrong. */
const isMove = s => catGrp(catOf(s)) === 'move';

/* ══ liquid: only as true as the last count ══
   Law 1. A balance is a counted figure plus everything logged after it. An
   account nobody has counted has NO balance, not a zero, and every screen
   that shows one says how old the count is.                                */
function lastCount(acctId) {
  const rows = Rec.all('count').filter(r => r.key === acctId);
  if (!rows.length) return null;
  const r = rows[rows.length - 1];        /* Rec.all sorts by date */
  return { date: r.date, bal: num(r.payload.bal, 0) };
}
/* Everything logged against an account since a date. Also the answer for an
   account with no count at all, which is the point of splitting it out.

   Tom, 2026-09-11: "I told it I received money in the bank, it still shows up
   as never counted." It did, and by the letter of law 1 that was right: a
   payment is not a count. But the screen threw away a fact he had just given
   it and offered nothing to do about it, which is a dead end, not a
   principle. The law stands — the app still never INVENTS a balance — and now
   what it does know is on the screen, labelled as what it is. */
function movementSince(acctId, from) {
  let inn = 0, out = 0;
  paidRows(from ? { from: from } : {}).forEach(p => { if (p.acct === acctId) inn += num(p.amt, 0); });
  spendRows(from ? { from: from } : {}).forEach(x => { if (x.acct === acctId) out += num(x.amt, 0); });
  return { in: inn, out: out, net: inn - out, any: !!(inn || out) };
}
function balanceOf(acctId) {
  const c = lastCount(acctId);
  if (!c) return null;
  const mv = movementSince(acctId, Day.shift(c.date, 1));
  return { bal: c.bal + mv.net, counted: c.date, age: Day.diff(Day.today(), c.date), moved: mv };
}
const STALE = 14;
function liquid() {
  let total = 0, counted = 0, missing = [], oldest = null;
  accts().forEach(a => {
    const b = balanceOf(a.id);
    if (!b) { missing.push(a.name); return; }
    total += b.bal; counted++;
    if (oldest == null || b.age > oldest) oldest = b.age;
  });
  return { total: total, counted: counted, missing: missing, age: oldest };
}

/* ── pots: a balance is what has been moved in, less what came out ── */
function potBal(potId) {
  return moves().reduce((a, m) => m.pot === potId ? a + (m.dir === 'out' ? -num(m.amt, 0) : num(m.amt, 0)) : a, 0);
}
const potsTotal = () => pots().reduce((a, p) => a + potBal(p.id), 0);
const debtTotal = () => debts().reduce((a, d) => a + num(d.owed, 0), 0);

/* == how a client pays ==
   Four shapes, and a count. Tom, 2026-09-11: "I have a client who pays me
   every 2 months and 1 who pays every X sessions." So the cycle is no longer
   a fixed list of four options, it is a KIND plus a number.

     month  every N months, on a day of the month
     week   every N weeks, counted from the start date
     sesh   every N sessions delivered, which is not a date at all
     oneoff once, on the start date

   The old four values are still read, because rows written before this exist
   and a migration that rewrites them is a migration that can go wrong:
   `monthly` is month/1, `4wk` is week/4, `session` is sesh/1.              */
function cycleOf(c) {
  const raw = c.cycle || 'month';
  const kind = raw === 'monthly' ? 'month' : raw === '4wk' ? 'week' : raw === 'session' ? 'sesh' : raw;
  const every = Math.max(1, num(c.every, 0) || (raw === '4wk' ? 4 : 1));
  return { kind: kind, every: every, day: num(c.day, 0) };
}
/* A `pack` client buys sessions before they happen; a `sesh` client is billed
   after. Both count sessions, and they are opposite ways round, which is why
   they are two kinds rather than a flag. */
const isPack = c => cycleOf(c).kind === 'pack';
const cycleWord = c => {
  const y = cycleOf(c);
  if (y.kind === 'pack') return 'by the package, up front';
  if (y.kind === 'oneoff') return 'one off';
  if (y.kind === 'sesh') return y.every === 1 ? 'per session' : 'every ' + y.every + ' sessions';
  if (y.kind === 'week') return y.every === 1 ? 'a week' : 'every ' + y.every + ' weeks';
  return y.every === 1 ? 'a month' : 'every ' + y.every + ' months';
};

/* == sessions delivered ==
   A session is a row of its own so it can be dated, listed and taken back.
   A running counter would be one number nobody could audit, and this client
   is paid off that number. */
const seshOf = id => Rec.all('sesh').filter(r => r.payload && r.payload.client === id)
  .map(r => ({ key: r.key, date: r.date }))
  .sort((a, b) => a.date.localeCompare(b.date) || a.key.localeCompare(b.key));
function addSesh(clientId, date) {
  const key = newId();
  Rec.set('sesh', date || Day.today(), key, { client: clientId });
  return key;
}

/* == packages bought up front ==
   Tom, 2026-09-11: "I want tracking for clients who pay for sessions upfront
   either whole or partial as well as session tracking."

   A package is sessions sold before they are delivered, which asks two
   questions at once and they pull opposite ways:

     do they owe me money?     the package value, less what has been paid
     do I owe them sessions?   what was bought, less what has been delivered

   The second is the one nobody tracks and it is a real liability: he has been
   paid for work he still has to do. Both are shown, never netted, because
   they are not the same kind of thing.

   Payments are applied to packages in order rather than tagged to one. Partial
   payment then needs no extra field and no choice to get wrong: pay half of a
   package and half of it is outstanding, pay two packages at once and the
   money runs on into the second. */
const packsOf = id => Rec.all('pack').filter(r => r.payload && r.payload.client === id)
  .map(r => Object.assign({ id: r.key, date: r.date }, r.payload))
  .sort((a, b) => a.date.localeCompare(b.date));

function packState(c) {
  const list = packsOf(c.id);
  const bought = list.reduce((a, x) => a + num(x.n, 0), 0);
  const value = list.reduce((a, x) => a + num(x.price, 0), 0);
  const delivered = seshOf(c.id).length;
  const paid = paidRows({}).filter(x => x.client === c.id).reduce((a, x) => a + num(x.amt, 0), 0);
  /* what is still owed, package by package, oldest first */
  let pool = paid;
  const dues = [];
  list.forEach(x => {
    const price = num(x.price, 0);
    const put = Math.min(pool, price);
    pool -= put;
    if (price - put > 0.5) dues.push({ pack: x, date: x.date, amt: price - put, part: put > 0 });
  });
  /* How many sessions the money actually covers. `left` alone is the wrong
     answer to "what work do I owe": a package bought and not paid for is a
     debt they have, not a session he owes. Each package converts the money
     allocated to it into whole sessions at its own price, because two
     packages can be priced differently. */
  let pool2 = paid, paidFor = 0;
  list.forEach(x => {
    const price = num(x.price, 0), n = num(x.n, 0);
    const put = Math.min(pool2, price);
    pool2 -= put;
    paidFor += price > 0 ? Math.floor(n * (put / price)) : 0;
  });
  return {
    packs: list, bought: bought, delivered: delivered, left: bought - delivered,
    value: value, paid: paid, owed: Math.max(0, value - paid), dues: dues,
    paidFor: paidFor, owedWork: Math.max(0, paidFor - delivered),
  };
}

/* == expected client payments, DERIVED and never stored ==
   Correcting a rate or a cycle fixes every future date at once and cannot
   leave a stale row behind. See brief, client payments.                    */
function dueDates(c, from, to) {
  const out = [], y = cycleOf(c);
  if (!c.start || c.status === 'done' || y.kind === 'sesh') return out;
  if (y.kind === 'oneoff') { if (c.start >= from && c.start <= to) out.push(c.start); return out; }
  if (y.kind === 'week') {
    const step = 7 * y.every;
    for (let d = c.start; d <= to; d = Day.shift(d, step)) if (d >= from) out.push(d);
    return out;
  }
  /* every N months, on the day of the month it started, clamped so the 31st
     does not fall out of February */
  const p = c.start.split('-');
  const wantDay = y.day || +p[2];
  let yr = +p[0], mo = +p[1];
  for (let i = 0; i < 400; i++) {
    const last = new Date(yr, mo, 0).getDate();
    const d = yr + '-' + String(mo).padStart(2, '0') + '-' + String(Math.min(wantDay, last)).padStart(2, '0');
    if (d > to) break;
    if (d >= from && d >= c.start) out.push(d);
    mo += y.every;
    while (mo > 12) { mo -= 12; yr++; }
  }
  return out;
}

/* == a session client's payments ==
   Not a date, a count. Sessions are walked in order and chunked; every whole
   chunk is a payment, dated at the session that completed it. Twenty five
   sessions at ten each is two payments owed and five into the third, which
   is a thing he can be shown rather than a thing he has to work out. */
function seshDues(c) {
  const y = cycleOf(c);
  const all = seshOf(c.id);
  const out = [];
  for (let i = y.every - 1; i < all.length; i += y.every) out.push({ date: all[i].date, n: out.length + 1 });
  return { dues: out, done: all.length, into: all.length % y.every, every: y.every, total: all.length };
}

/* An expected payment is settled by a `paid` row for that client. A dated
   cycle matches on proximity, because people pay late and a late payment is
   still that payment rather than a mystery plus a miss. A session cycle
   matches in ORDER instead: the second block of ten is settled by the second
   payment, whenever it turned up, because there is no date to be near. */
function expected(from, to) {
  const out = [];
  const got = paidRows({ from: Day.shift(from, -20), to: Day.shift(to, 20) }).filter(p => p.client);
  const used = {};
  clients().forEach(c => {
    const y = cycleOf(c);
    if (y.kind === 'pack') {
      if (c.status === 'done') return;
      packState(c).dues.forEach(d => {
        if (d.date < from || d.date > to) return;
        out.push({ client: c, date: d.date, amt: d.amt, paid: null,
                   late: d.date < Day.today(),
                   why: d.pack.n + ' sessions' + (d.part ? ', part paid' : '') });
      });
      return;
    }
    if (y.kind === 'sesh') {
      if (c.status === 'done') return;
      const mine = paidRows({}).filter(p => p.client === c.id)
        .sort((a, b) => a.date.localeCompare(b.date));
      seshDues(c).dues.forEach((d, i) => {
        if (d.date < from || d.date > to) return;
        const hit = mine[i] || null;
        out.push({ client: c, date: d.date, amt: num(c.rate, 0), paid: hit,
                   late: !hit && d.date < Day.today(),
                   why: 'session ' + (d.n * y.every) });
      });
      return;
    }
    dueDates(c, from, to).forEach(d => {
      const hit = got.find(p => p.client === c.id && !used[p.date + p.key] &&
        Math.abs(Day.diff(p.date, d)) <= 14);
      if (hit) used[hit.date + hit.key] = 1;
      out.push({ client: c, date: d, amt: num(c.rate, 0), paid: hit || null,
                 late: !hit && d < Day.today() });
    });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
/* When does the next money realistically land? Everything allocated is
   measured against this, because a bill after your next payment is not a
   claim on today's cash. */
function nextIn() {
  const soon = expected(Day.today(), Day.shift(Day.today(), 60)).filter(e => !e.paid);
  return soon.length ? soon[0].date : Day.shift(Day.today(), 30);
}

/* ── bills falling due in a window ── */
function billsDue(from, to) {
  const out = [];
  bills().forEach(b => {
    const day = num(b.day, 1);
    let d = new Date(from.slice(0, 4), +from.slice(5, 7) - 1, 1);
    for (let i = 0; i < 24; i++) {
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
        '-' + String(Math.min(day, last)).padStart(2, '0');
      if (iso > to) break;
      if (iso >= from && (!b.from || iso >= b.from) && (!b.until || iso <= b.until)) out.push({ bill: b, date: iso });
      d.setMonth(d.getMonth() + 1);
    }
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
const monthlyFixed = () => bills().reduce((a, b) => a + num(b.amt, 0), 0);

/* ══ the three numbers ══ */
function board() {
  const L = liquid();
  const alloc = potsTotal() + billsDue(Day.today(), nextIn()).reduce((a, b) => a + num(b.bill.amt, 0), 0);
  return { liquid: L, allocated: alloc, free: L.total - alloc };
}
/* Runway: how many months at the current standing cost, if every client left
   tomorrow. The app's real subject — liquid moves for boring reasons, this
   only moves when something structural did. */
function runway() {
  const burn = monthlyFixed() + typicalVariable();
  const L = liquid();
  if (!burn || !L.counted) return null;
  return { months: L.total / burn, burn: burn };
}
/* What a normal month of variable spending looks like. Median of the last six
   whole months, with big purchases excluded — law 3. A median because one
   Christmas should not become the definition of normal. */
function typicalVariable() {
  const now = monthOf(Day.today());
  const vals = [];
  for (let i = 1; i <= 6; i++) {
    const m = monthBack(now, i);
    const t = monthSpend(m);
    if (t.rows) vals.push(t.variable);
  }
  if (!vals.length) return 0;
  vals.sort((a, b) => a - b);
  return vals[Math.floor(vals.length / 2)];
}

/* ══ a month of spending ══
   `big` is separated rather than dropped: law 3 says one laptop must not
   become the story of the month, and every figure that excludes it says so. */
function rangeSpend(from, to) {
  const t = { total: 0, variable: 0, fixed: 0, biz: 0, big: 0, rows: 0, byCat: {}, byTag: {} };
  spendRows({ from: from, to: to }).forEach(s => {
    if (isMove(s)) return;
    const amt = num(s.amt, 0), c = catOf(s), g = catGrp(c);
    t.rows++;
    if (isBig(s)) { t.big += amt; t.total += amt; return; }
    t.total += amt;
    if (g === 'fix') t.fixed += amt; else if (g === 'biz') t.biz += amt; else t.variable += amt;
    t.byCat[c || ''] = (t.byCat[c || ''] || 0) + amt;
    const tg = tagOf(s); if (tg) t.byTag[tg] = (t.byTag[tg] || 0) + amt;
  });
  return t;
}
const monthSpend = m => rangeSpend(monthStart(m), monthEnd(m));
const rangeIn = (from, to) => paidRows({ from: from, to: to })
  .reduce((a, p) => a + num(p.amt, 0), 0);
const monthIn = m => rangeIn(monthStart(m), monthEnd(m));

/* == everything that happened on one day, in the order it happened ==
   Tom, 2026-09-11: "I want to review individual days and weeks." A day is not
   only spending. Money arrived, sessions were delivered, money moved into a
   pot. All of it in one column, sorted by the clock, which is the only thing
   that makes a day readable rather than four separate lists. */
function dayEvents(date) {
  const out = [];
  spendRows({ date: date }).forEach(x => {
    if (isMove(x)) { out.push({ kind: 'move', t: num(x.t, 0), name: x.note || 'Moved money',
      note: acctName(x.acct), amt: -num(x.amt, 0), row: x, quiet: 1 }); return; }
    out.push({ kind: 'out', t: num(x.t, 0), name: x.note || 'No details',
      note: acctName(x.acct) + (catOf(x) ? ' · ' + catName(catOf(x)) : ' · uncategorised'),
      amt: -num(x.amt, 0), row: x, big: isBig(x) });
  });
  paidRows({ date: date }).forEach(x => {
    const c = x.client ? Rec.get('client', null, x.client) : null;
    out.push({ kind: 'in', t: num(x.t, 0), name: c ? c.name : (x.note || 'One-off'),
      note: acctName(x.acct) + (c && x.note ? ' · ' + x.note : ''), amt: num(x.amt, 0), row: x });
  });
  moves({ date: date }).forEach(x => {
    const pt = Rec.get('pot', null, x.pot);
    out.push({ kind: 'pot', t: 0, name: pt ? pt.name : 'a pot',
      note: x.dir === 'out' ? 'taken out of the pot' : 'put into the pot',
      amt: 0, quiet: 1, fig: (x.dir === 'out' ? '-' : '+') + money(num(x.amt, 0)) });
  });
  Rec.all('sesh', { date: date }).forEach(r => {
    const c = Rec.get('client', null, r.payload.client);
    out.push({ kind: 'sesh', t: 0, name: c ? c.name : 'a client',
      note: 'session delivered', amt: 0, quiet: 1, fig: 'session' });
  });
  return out.sort(byTime);
}

/* == a donut of where the money went ==
   Tom, 2026-09-11: "I want a piechart for money out."

   Drawn here rather than in `shared/chart.js`, which has no pie and which an
   app session must not touch. Six theme colour slots, no hex anywhere, and a
   hole in the middle so the total can live in it — a plain pie wastes its
   best piece of space on nothing.

   Slices are one path each with an arc, and they are `<title>`d so hovering
   says what they are. Anything under 3% is folded into one "everything else"
   wedge, because eleven slivers is a decoration, not a chart. */
function donut(rows, total, size) {
  const NS = 'http://www.w3.org/2000/svg';
  const S = size || 220, R = S / 2, INNER = R * 0.62;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + S + ' ' + S);
  svg.setAttribute('class', 'mb-chart');
  svg.style.width = '100%'; svg.style.maxWidth = S + 'px'; svg.style.height = 'auto';
  if (!total) return svg;

  let angle = -Math.PI / 2;                     /* twelve o'clock */
  const pt = (a, r) => [(R + r * Math.cos(a)).toFixed(2), (R + r * Math.sin(a)).toFixed(2)];
  rows.forEach((row, i) => {
    const frac = row.amt / total;
    if (frac <= 0) return;
    /* A full circle drawn as an arc collapses to nothing, because its start
       and end points are the same. One category is a ring, not a slice. */
    const end = angle + frac * Math.PI * 2;
    const node = document.createElementNS(NS, frac >= 0.9999 ? 'circle' : 'path');
    if (frac >= 0.9999) {
      node.setAttribute('cx', R); node.setAttribute('cy', R);
      node.setAttribute('r', (R + INNER) / 2);
      node.setAttribute('fill', 'none');
      node.setAttribute('stroke-width', R - INNER);
      node.setAttribute('stroke', 'var(--data-' + (1 + i % 6) + ')');
    } else {
      const big = frac > 0.5 ? 1 : 0;
      const o1 = pt(angle, R - 1), o2 = pt(end, R - 1);
      const i2 = pt(end, INNER), i1 = pt(angle, INNER);
      node.setAttribute('d',
        'M' + o1[0] + ' ' + o1[1] +
        'A' + (R - 1) + ' ' + (R - 1) + ' 0 ' + big + ' 1 ' + o2[0] + ' ' + o2[1] +
        'L' + i2[0] + ' ' + i2[1] +
        'A' + INNER + ' ' + INNER + ' 0 ' + big + ' 0 ' + i1[0] + ' ' + i1[1] + 'Z');
      node.setAttribute('fill', 'var(--data-' + (1 + i % 6) + ')');
    }
    const ttl = document.createElementNS(NS, 'title');
    ttl.textContent = row.name + ' — ' + money(row.amt) + ' (' + Math.round(frac * 100) + '%)';
    node.appendChild(ttl);
    svg.appendChild(node);
    angle = end;
  });
  return svg;
}

/* ══════════════════ the picker: autofill, law 4 ══════════════════
   Typing filters what exists. It never creates by being typed into, because
   that is exactly how "Grab" and "grab" become two things. Creating is a
   separate deliberate press, and it refuses a near-match.                  */
function picker(opts) {
  const box = el('div', 'pick');
  const input = UI.field('search', { placeholder: opts.placeholder || 'Type to find' });
  const list = el('div', 'opts');
  box.appendChild(input); box.appendChild(list);
  let value = opts.value || '';
  box.get = () => value;

  function paint() {
    const q = norm(input.value);
    list.innerHTML = '';
    const items = (opts.items || []).filter(it => !q || norm(it.name).indexOf(q) > -1);
    items.slice(0, 40).forEach(it => {
      const b = el('button', it.id === value ? 'on mb-tap' : 'mb-tap',
        esc(it.name) + (it.note ? '<small>' + esc(it.note) + '</small>' : ''));
      b.type = 'button';
      b.onclick = () => { value = it.id; Mobile.feedback('select'); paint(); opts.onPick && opts.onPick(it.id, it); };
      list.appendChild(b);
    });
    if (!items.length && !input.value.trim()) list.appendChild(el('div', 'empty', esc(opts.none || 'Nothing here yet.')));
    if (opts.onCreate && input.value.trim()) {
      const raw = input.value.trim();
      const dupe = (opts.items || []).find(it => norm(it.name) === norm(raw));
      if (dupe) {
        /* The whole point of law 4. He typed something that already exists in
           all but punctuation, so offer the existing one rather than a second. */
        if (!items.some(it => it.id === dupe.id)) {
          const b = el('button', 'mb-tap', esc(dupe.name) + '<small>already exists</small>');
          b.type = 'button';
          b.onclick = () => { value = dupe.id; paint(); opts.onPick && opts.onPick(dupe.id, dupe); };
          list.appendChild(b);
        }
      } else if (items.some(it => norm(it.name).indexOf(norm(raw)) === 0)) {
        /* What he typed is the start of something that already exists, so he
           is mid-word, not naming a new thing. Offering to create here is how
           "Grocer" ends up sitting next to "Groceries" forever. */
      } else {
        const b = el('button', 'mk mb-tap', 'Add “' + esc(raw) + '” as new');
        b.type = 'button';
        b.onclick = () => {
          const id = opts.onCreate(raw);
          if (!id) return;
          value = id; input.value = ''; Mobile.feedback('success');
          paint(); opts.onPick && opts.onPick(id, { id: id, name: raw });
        };
        list.appendChild(b);
      }
    }
  }
  input.oninput = paint;
  paint();
  return box;
}
/* A row of chips for a short fixed list. Same job as the picker, without the
   typing, for anything with under about eight options. */
function chipRow(items, value, onPick, opts) {
  const box = el('div', 'chips');
  let cur = value;
  const paint = () => {
    box.innerHTML = '';
    ((opts && opts.blank) ? [{ id: '', name: opts.blank }] : []).concat(items).forEach(it => {
      const b = el('button', 'chip mb-tap' + (it.id === cur ? ' on' : ''), esc(it.name));
      b.type = 'button';
      b.onclick = () => { cur = it.id; Mobile.feedback('select'); paint(); onPick && onPick(cur); };
      box.appendChild(b);
    });
  };
  paint();
  box.get = () => cur;
  return box;
}
function fld(label, node) {
  const w = el('div', 'fld');
  w.appendChild(el('label', null, esc(label)));
  w.appendChild(node);
  return w;
}

/* ══ creating the small named things ══
   Every one of these refuses a near-duplicate, which is what makes the picker
   above safe to type into. */
function makeCat(name, grp) {
  if (cats().some(c => norm(c.name) === norm(name))) { UI.toast('there is already a category called <b>' + esc(name) + '</b>', { bad: true }); return null; }
  const id = norm(name) || newId();
  Rec.set('cat', null, id, { name: name, grp: grp || 'var', ord: cats().length });
  return id;
}
function makeTag(name) {
  if (tags().some(t => norm(t.name) === norm(name))) { UI.toast('that tag already exists', { bad: true }); return null; }
  const id = norm(name) || newId();
  Rec.set('wtag', null, id, { name: name });
  return id;
}
function makeAcct(name) {
  if (accts().some(a => norm(a.name) === norm(name))) { UI.toast('there is already an account called <b>' + esc(name) + '</b>', { bad: true }); return null; }
  const id = norm(name) || newId();
  /* STATUS keys accounts by the lowercased name and stores {name, order}.
     Match that shape exactly: a second app inventing its own would give him
     two accounts with one name. */
  Rec.set('acct', null, id, { name: name, order: accts().length });
  return id;
}
function makeClient(name) {
  if (clients().some(c => norm(c.name) === norm(name))) { UI.toast('you already have a client called <b>' + esc(name) + '</b>', { bad: true }); return null; }
  const id = newId();
  Rec.set('client', null, id, { name: name, rate: 0, cycle: 'month', every: 1, start: Day.today(), status: 'on' });
  return id;
}

/* ══════════════════════════ the screens ══════════════════════════ */
let TAB = 'score';
const TABS = [['score', 'SCORE'], ['in', 'MONEY IN'], ['out', 'MONEY OUT'],
              ['spend', 'SPENDING'], ['pots', 'POTS'], ['accounts', 'ACCOUNTS']];

function card(title, cls) {
  const c = el('div', 'card' + (cls ? ' ' + cls : ''));
  if (title) c.appendChild(el('h2', null, esc(title)));
  return c;
}
function tile(k, v, n, cls) {
  const t = el('div', 'tile' + (cls ? ' ' + cls : ''));
  t.appendChild(el('div', 'k', esc(k)));
  t.appendChild(el('div', 'v', esc(v)));
  if (n) t.appendChild(el('div', 'n', n));
  return t;
}
/* A row with its share bar under it. The gap lives on this wrapper, never as
   a margin on the row, because a row may get wrapped again for a gesture and
   a margin inside that wrapper measures wrong. */
function stack(row, bar) {
  const w = el('div', 'stack');
  w.appendChild(row); w.appendChild(bar);
  return w;
}
function itemRow(title, sub, fig, figCls) {
  const r = el('button', 'item mb-press mb-tap');
  r.type = 'button';
  const nm = el('div', 'nm');
  nm.appendChild(el('b', null, esc(title)));
  if (sub) nm.appendChild(el('small', null, sub));
  r.appendChild(nm);
  if (fig != null) r.appendChild(el('span', 'fig' + (figCls ? ' ' + figCls : ''), esc(fig)));
  return r;
}

/* ── SCORE ── */
function drawScore(m) {
  const b = board(), L = b.liquid, rw = runway();

  const c1 = card(null, 'full');
  const sc = el('div', 'score');
  sc.appendChild(el('div', 'cap', 'FREE TO SPEND'));
  /* One primary thing per screen. FREE is the answer to "can I", so it is the
     only figure at display size and liquid and allocated are its working. */
  sc.appendChild(el('div', 'big' + (b.free < 0 ? ' bad' : b.free < b.allocated * .2 ? ' low' : ''),
    L.counted ? money(b.free) : '—'));
  if (!L.counted) {
    /* An empty state that only states a rule is a wall. This one says what it
       already knows, why that is not the answer, and gives the button. */
    const moved = accts().reduce((a, x) => {
      const mv = movementSince(x.id, null); return { in: a.in + mv.in, out: a.out + mv.out }; },
      { in: 0, out: 0 });
    sc.appendChild(el('div', 'sub', (moved.in || moved.out)
      ? 'You have logged <b>' + esc(money(moved.in)) + '</b> in and <b>' + esc(money(moved.out)) +
        '</b> out, but no account has said what it actually holds. Movement is not a balance: ' +
        'this app cannot know what was in there before you started, and it will not guess.'
      : 'Nothing counted yet. Put in what each account actually holds and every number on this screen starts working.'));
    const go = el('button', 'btn go mb-press mb-tap', 'Count an account');
    go.type = 'button';
    go.onclick = () => {
      const list = accts();
      if (!list.length) return acctSheet();
      if (list.length === 1) return countSheet(list[0]);
      UI.menu(0, 0, list.map(x => ({ label: x.name,
        note: lastCount(x.id) ? 'counted ' + Day.short(lastCount(x.id).date) : 'never counted',
        fn: () => countSheet(x) })), { title: 'WHICH ACCOUNT' });
    };
    const wrap = el('div', 'rowbtns');
    wrap.style.justifyContent = 'center';
    wrap.appendChild(go);
    sc.appendChild(wrap);
  } else {
    sc.appendChild(el('div', 'sub', money(L.total) + ' in the accounts, ' + money(b.allocated) +
      ' already spoken for between now and ' + Day.short(nextIn()) + '.'));
  }
  c1.appendChild(sc);

  const g = el('div', 'grid3');
  g.appendChild(tile('LIQUID', L.counted ? short(L.total) : '—',
    L.counted ? (L.age > STALE ? '<span class="stale">counted ' + L.age + ' days ago</span>' : 'counted ' + (L.age ? L.age + ' days ago' : 'today')) : 'no counts yet',
    L.age > STALE ? 'warn' : ''));
  g.appendChild(tile('ALLOCATED', short(b.allocated), 'pots and bills due'));
  g.appendChild(tile('FREE', L.counted ? short(b.free) : '—', 'what is really yours',
    b.free < 0 ? 'bad' : ''));
  c1.appendChild(g);
  if (L.missing.length && L.counted) {
    const note = el('div', 'note',
      'Not counted, so not in the total: <b>' + L.missing.map(esc).join(', ') + '</b>. ');
    const a = el('button', 'btn mb-tap', 'Count them');
    a.type = 'button';
    a.style.marginTop = 'var(--s-2)';
    a.onclick = () => UI.menu(0, 0, accts().filter(x => !lastCount(x.id))
      .map(x => ({ label: x.name, fn: () => countSheet(x) })), { title: 'WHICH ACCOUNT' });
    note.appendChild(el('br'));
    note.appendChild(a);
    c1.appendChild(note);
  }
  m.appendChild(c1);

  /* Runway. The app's real subject. */
  const c2 = card('RUNWAY');
  if (!rw) {
    c2.appendChild(el('div', 'empty', 'Needs a counted balance and something going out. Add your rent and bills under <b>MONEY OUT</b>.'));
  } else {
    const sc2 = el('div', 'score');
    sc2.appendChild(el('div', 'big' + (rw.months < 1 ? ' bad' : rw.months < 3 ? ' low' : ''),
      rw.months.toFixed(1)));
    sc2.appendChild(el('div', 'cap', rw.months === 1 ? 'MONTH' : 'MONTHS'));
    /* States the behaviour and the number, and joins nothing. The root brief
       forbids telling him what a behaviour did to a figure. */
    sc2.appendChild(el('div', 'sub', 'At ' + money(rw.burn) + ' a month standing cost, if every client left tomorrow.'));
    c2.appendChild(sc2);
    c2.appendChild(el('div', 'note', money(monthlyFixed()) + ' of that is bills you have listed. ' +
      money(typicalVariable()) + ' is a normal month of everything else, big purchases left out.'));
  }
  m.appendChild(c2);

  /* == monthly net ==
     Tom, 2026-09-11: "I wanna see monthly net."

     In minus out, which is the one figure that says whether a month paid for
     itself. Liquid answers "can I?" and net answers "did that work?", and
     they are different questions — a month can end richer only because a
     client paid two months at once. */
  const now = monthOf(Day.today()), prev = monthBack(now, 1);
  const tn = monthSpend(now), tp = monthSpend(prev);
  const netNow = monthIn(now) - tn.total, netPrev = monthIn(prev) - tp.total;
  const c3 = card('THIS MONTH');
  const sc3 = el('div', 'score');
  sc3.appendChild(el('div', 'cap', 'NET, ' + monthName(now).toUpperCase()));
  sc3.appendChild(el('div', 'big' + (netNow < 0 ? ' bad' : ''),
    (netNow > 0 ? '+' : '') + money(netNow)));
  sc3.appendChild(el('div', 'sub', money(monthIn(now)) + ' in, ' + money(tn.total) + ' out.' +
    (tn.big ? ' ' + money(tn.big) + ' of that was one big thing.' : '')));
  c3.appendChild(sc3);
  const g2 = el('div', 'grid3');
  g2.appendChild(tile('IN', short(monthIn(now)), monthName(now)));
  g2.appendChild(tile('OUT', short(tn.total), tn.big ? short(tn.big) + ' of it one big thing' : 'nothing unusual'));
  g2.appendChild(tile(monthName(prev).toUpperCase() + ' NET', (netPrev > 0 ? '+' : '') + short(netPrev),
    short(monthIn(prev)) + ' in, ' + short(tp.total) + ' out', netPrev < 0 ? 'bad' : 'good'));
  c3.appendChild(g2);
  m.appendChild(c3);

  /* Six months, in and out. A chart earns its place here because the shape of
     jagged income against flat costs is the whole problem. */
  const c4 = card('SIX MONTHS', 'full');
  const ms = []; for (let i = 5; i >= 0; i--) ms.push(monthBack(now, i));
  const ins = ms.map((mm, i) => [i, monthIn(mm)]);
  const outs = ms.map((mm, i) => [i, monthSpend(mm).total]);
  const nets = ms.map((mm, i) => [i, monthIn(mm) - monthSpend(mm).total]);
  if (window.Chart && (ins.some(p => p[1]) || outs.some(p => p[1]))) {
    const box = el('div', 'chartbox');
    c4.appendChild(box);
    /* In the document before it is measured, or it measures zero. */
    m.appendChild(c4);
    chartInto(box, 170, ch => {
      ch.xLinear(0, 5);
      /* Zero has to be on the scale or a negative net falls off the bottom. */
      moneyScale(ch, ins.map(p => p[1]).concat(outs.map(p => p[1]))
        .concat(nets.map(p => p[1])).concat([0]));
      ch.grid(v => short(v));
      ch.bars(outs, 'mb-bar');
      ch.rule(0, '', 'mb-rule');
      ch.line(ins, 'mb-line'); ch.dots(ins, 'mb-dot', 3);
      ch.line(nets, 'mb-rule'); ch.dots(nets, 'mb-dot', 2);
      ch.note('bars out · line in · flat line net');
    });
    c4.appendChild(el('div', 'note', ms.map(monthName).join(' · ')));
  } else {
    c4.appendChild(el('div', 'empty', 'Nothing logged yet. This fills in as payments and spending arrive.'));
    m.appendChild(c4);
  }
}

/* ── MONEY IN ── */
function drawIn(m) {
  const now = monthOf(Day.today());
  const exp = expected(monthStart(monthBack(now, 1)), monthEnd(monthBack(now, -2)));
  const late = exp.filter(e => e.late);

  const c0 = card('OWED TO YOU');
  if (!late.length) {
    c0.appendChild(el('div', 'empty', clients().length ? 'Nobody is late. Everything expected so far has arrived.'
      : 'No clients yet. Press <b>+</b> to add one, with what they pay and how often.'));
  } else {
    const list = el('div', 'list');
    late.forEach(e => {
      const r = itemRow(e.client.name, 'due ' + Day.short(e.date) + ' · ' +
        away(e.date), money(e.amt), 'late');
      r.onclick = () => payFor(e);
      list.appendChild(r);
    });
    c0.appendChild(list);
    c0.appendChild(el('div', 'note', 'Total outstanding: <b>' +
      esc(money(late.reduce((a, e) => a + e.amt, 0))) + '</b>'));
  }
  m.appendChild(c0);

  /* Coming up. */
  const soon = exp.filter(e => !e.paid && !e.late).slice(0, 12);
  const c1 = card('EXPECTED NEXT');
  if (!soon.length) c1.appendChild(el('div', 'empty', 'Nothing dated is coming up. Clients paid by the session have no date until the block is finished, so they show under SESSIONS instead.'));
  else {
    const list = el('div', 'list');
    soon.forEach(e => {
      const r = itemRow(e.client.name, Day.short(e.date) + ' · ' + away(e.date), money(e.amt));
      r.onclick = () => payFor(e);
      list.appendChild(r);
    });
    c1.appendChild(list);
  }
  m.appendChild(c1);

  /* == clients paid by the session ==
     Their next payment is not a date, so nothing above can show it. What
     matters day to day is how close the block is, and the button he presses
     the moment a session finishes. */
  const bySesh = clients().filter(c => c.status !== 'done' &&
    ['sesh', 'pack'].indexOf(cycleOf(c).kind) > -1);
  if (bySesh.length) {
    const cs = card('SESSIONS');
    const list = el('div', 'list');
    bySesh.forEach((c, i) => {
      let sub, fig, pct, bad;
      if (isPack(c)) {
        /* Bought before delivered, so the bar fills as the package empties
           and the figure is sessions he still has to give them. */
        const st = packState(c);
        sub = st.delivered + ' of ' + st.bought + ' delivered' +
          (st.owed ? ' · <b>' + esc(money(st.owed)) + ' owed</b>' : ' · paid up');
        fig = st.left + ' left';
        pct = st.bought ? (st.delivered / st.bought * 100) : 0;
        bad = !!st.owed;
      } else {
        const st = seshDues(c);
        const got = paidRows({}).filter(x => x.client === c.id).length;
        const owed = Math.max(0, st.dues.length - got);
        sub = st.into + ' of ' + st.every + ' towards the next ' + money(num(c.rate, 0)) +
          (owed ? ' · <b>' + owed + ' block' + (owed > 1 ? 's' : '') + ' owed</b>' : '');
        fig = st.into + '/' + st.every;
        pct = st.into / st.every * 100;
        bad = !!owed;
      }
      const r = itemRow(c.name, sub, fig, bad ? 'late' : '');
      r.onclick = () => clientSheet(c);
      const bar = el('div', 'bar c' + (1 + (i % 6)));
      bar.appendChild(el('i')).style.width = Math.max(0, Math.min(100, pct)).toFixed(1) + '%';
      list.appendChild(stack(r, bar));
    });
    cs.appendChild(list);
    const btns = el('div', 'rowbtns');
    const add = el('button', 'btn go wide mb-press mb-tap', 'Log a session');
    add.type = 'button';
    const note = c => isPack(c) ? packState(c).left + ' left'
      : seshDues(c).into + ' of ' + seshDues(c).every;
    add.onclick = () => {
      if (bySesh.length === 1) { addSesh(bySesh[0].id, Day.today()); Mobile.feedback('success');
        UI.toast('logged a session for <b>' + esc(bySesh[0].name) + '</b>'); draw(); return; }
      UI.menu(0, 0, bySesh.map(c => ({ label: c.name, note: note(c),
        fn: () => { addSesh(c.id, Day.today()); Mobile.feedback('success');
          UI.toast('logged a session for <b>' + esc(c.name) + '</b>'); draw(); } })),
        { title: 'WHOSE SESSION' });
    };
    btns.appendChild(add);
    cs.appendChild(btns);
    /* The liability nobody tracks: sessions paid for and not yet given. */
    const owedWork = bySesh.filter(isPack).reduce((a, c) => a + packState(c).owedWork, 0);
    if (owedWork) cs.appendChild(el('div', 'note',
      'You owe <b>' + esc(String(owedWork)) + '</b> session' + (owedWork === 1 ? '' : 's') +
      ' that are already paid for. That is work booked, not money coming.'));
    m.appendChild(cs);
  }

  /* Clients, with everything about them. Set by Tom. */
  const c2 = card('CLIENTS', 'full');
  const cl = clients();
  if (!cl.length) c2.appendChild(el('div', 'empty', 'No clients yet.'));
  else {
    const yearIn = paidRows({ from: Day.shift(Day.today(), -365) });
    const total = yearIn.reduce((a, p) => a + num(p.amt, 0), 0);
    const list = el('div', 'list');
    /* Biggest share first, because concentration is the thing this list is
       for and a list sorted by name buries it. */
    const ranked = cl.map(c => {
      const mine = yearIn.filter(p => p.client === c.id);
      const got = mine.reduce((a, p) => a + num(p.amt, 0), 0);
      return { c: c, n: mine.length, got: got, share: total ? got / total : 0 };
    }).sort((a, b) => b.got - a.got);
    ranked.forEach((x, i) => {
      const c = x.c;
      /* A package client has no fixed rate, so a rate would print as zero.
         Their packages are priced one at a time. */
      const r = itemRow(c.name + (c.status === 'done' ? ' (finished)' : ''),
        (isPack(c) ? 'Paid ' + cycleWord(c) : money(num(c.rate, 0)) + ' ' + cycleWord(c)) +
        ' · ' + x.n + (x.n === 1 ? ' payment · ' : ' payments · ') +
        (x.share * 100).toFixed(0) + '% of the year',
        money(x.got));
      if (c.status === 'done') r.classList.add('dim');
      r.onclick = () => clientSheet(c);
      const bar = el('div', 'bar c' + (1 + (i % 6)));
      bar.appendChild(el('i')).style.width = (x.share * 100).toFixed(1) + '%';
      list.appendChild(stack(r, bar));
    });
    c2.appendChild(list);
    /* Law 5: show the number, never the verdict. */
    c2.appendChild(el('div', 'note', 'Share of the last twelve months, biggest client first. No opinion offered.'));
  }
  m.appendChild(c2);

  /* Everything that has arrived. */
  const c3 = card('RECEIVED', 'full');
  const got = paidRows({ from: Day.shift(Day.today(), -120) }).sort((a, b) => b.date.localeCompare(a.date));
  if (!got.length) c3.appendChild(el('div', 'empty', 'Nothing recorded yet. Press <b>+</b> to log a payment or a one-off.'));
  else {
    const list = el('div', 'list');
    got.slice(0, 40).forEach(p => {
      const c = p.client ? Rec.get('client', null, p.client) : null;
      const r = itemRow(c ? c.name : (p.note || 'One-off'),
        Day.short(p.date) + ' · ' + esc(acctName(p.acct)) + (c && p.note ? ' · ' + esc(p.note) : ''),
        money(num(p.amt, 0)), 'in');
      r.onclick = () => paidSheet(p);
      list.appendChild(r);
    });
    c3.appendChild(list);
  }
  m.appendChild(c3);
}
/* How far off a day is, in words. One function, because "in 0 days" and
   "in 1 days" are the kind of thing that comes back one screen at a time. */
function away(date) {
  const n = Day.diff(date, Day.today());
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  return n > 0 ? 'in ' + n + ' days' : n * -1 + ' days ago';
}
const acctName = id => (Rec.get('acct', null, id) || {}).name || 'unknown account';

/* ── MONEY OUT ── */
function drawOut(m) {
  const bl = bills();
  const c1 = card('BILLS AND RENT');
  if (!bl.length) c1.appendChild(el('div', 'empty', 'Nothing listed. Press <b>+</b> and add your rent first. Runway cannot be worked out without these.'));
  else {
    const list = el('div', 'list');
    bl.forEach(b => {
      const r = itemRow(b.name, 'day ' + num(b.day, 1) + ' of the month · ' + catName(b.cat) +
        (b.acct ? ' · ' + esc(acctName(b.acct)) : ''), money(num(b.amt, 0)));
      r.onclick = () => billSheet(b);
      list.appendChild(r);
    });
    c1.appendChild(list);
    c1.appendChild(el('div', 'note', '<b>' + esc(money(monthlyFixed())) + '</b> a month, ' +
      esc(money(monthlyFixed() * 12)) + ' a year.'));
  }
  m.appendChild(c1);

  /* Recurring: the view he asked for. Not a category, a question — what
     leaves without me deciding again. Subscriptions, gym, software. */
  const rec = bl.filter(b => ['subs', 'gym', 'ops'].indexOf(b.cat) > -1);
  const c2 = card('STILL PAYING FOR');
  if (!rec.length) c2.appendChild(el('div', 'empty', 'Nothing here. Anything filed as Subscriptions, Gym or Operating costs shows up in this list with what it costs you a year.'));
  else {
    const list = el('div', 'list');
    rec.forEach(b => {
      const r = itemRow(b.name, catName(b.cat) + ' · ' + money(num(b.amt, 0)) + ' a month',
        money(num(b.amt, 0) * 12) + '/yr');
      r.onclick = () => billSheet(b);
      list.appendChild(r);
    });
    c2.appendChild(list);
    c2.appendChild(el('div', 'note', 'Everything that leaves your account without you deciding again. <b>' +
      esc(money(rec.reduce((a, b) => a + num(b.amt, 0) * 12, 0))) + '</b> a year between them.'));
  }
  m.appendChild(c2);

  const dl = debts();
  const c3 = card('DEBTS');
  if (!dl.length) c3.appendChild(el('div', 'empty', 'Nothing owed, or nothing listed yet. Press <b>+</b> to add one, and it sits beside your cash rather than being taken off it.'));
  else {
    const list = el('div', 'list');
    dl.forEach(d => {
      const r = itemRow(d.name, (num(d.rate, 0) ? num(d.rate, 0) + '% · ' : '') +
        (num(d.min, 0) ? money(num(d.min, 0)) + ' minimum, day ' + num(d.day, 1) : 'no minimum set'),
        money(num(d.owed, 0)), 'late');
      r.onclick = () => debtSheet(d);
      list.appendChild(r);
    });
    c3.appendChild(list);
    /* Shown beside cash, never subtracted from it. He asked to see cash. */
    c3.appendChild(el('div', 'note', '<b>' + esc(money(debtTotal())) + '</b> owed in total. This is never taken off your liquid figure, because you asked to see cash and cash is what you see.'));
  }
  m.appendChild(c3);

  /* The month ahead as dates, because timing is what bounces a payment. */
  const c4 = card('THE NEXT 60 DAYS', 'full');
  const to = Day.shift(Day.today(), 60);
  const events = billsDue(Day.today(), to).map(b => ({ date: b.date, name: b.bill.name, amt: -num(b.bill.amt, 0) }))
    .concat(expected(Day.today(), to).filter(e => !e.paid).map(e => ({ date: e.date, name: e.client.name, amt: num(e.amt, 0) })))
    .sort((a, b) => a.date.localeCompare(b.date));
  if (!events.length) c4.appendChild(el('div', 'empty', 'Nothing scheduled either way. Add a bill above, or a client under MONEY IN, and the next two months fill in.'));
  else {
    const L = liquid();
    let run = L.counted ? L.total : 0, lowest = run, lowDate = Day.today();
    const list = el('div', 'list');
    events.forEach(e => {
      run += e.amt;
      if (run < lowest) { lowest = run; lowDate = e.date; }
      const r = itemRow(e.name, Day.short(e.date) + (L.counted ? ' · leaves ' + money(run) : ''),
        (e.amt > 0 ? '+' : '') + money(e.amt), e.amt > 0 ? 'in' : '');
      r.style.cursor = 'default';
      list.appendChild(r);
    });
    c4.appendChild(list);
    if (L.counted) c4.appendChild(el('div', 'note',
      'Lowest point is <b class="' + (lowest < 0 ? 'stale' : '') + '">' + esc(money(lowest)) +
      '</b> around ' + esc(Day.short(lowDate)) + '. That is the day to watch, not the month total.'));
  }
  m.appendChild(c4);
}

/* ── SPENDING ──
   Tom, 2026-09-11: "I want to review individual days and weeks."

   Three zoom levels on one screen rather than three screens, because it is
   the same question asked at three distances and splitting it would mean
   three places to keep in step. The arrows step by whatever is selected, so
   the control is the same whichever level you are at. */
let SPMONTH = null;
let PERIOD = 'month';
let ANCHOR = null;                      /* a date inside the period being read */

/* Monday first. A week that starts on Sunday puts a Saturday night out in the
   same week as the Monday you are planning, which is not how anyone thinks
   about a week. */
function weekStart(d) { const w = Day.dow(d); return Day.shift(d, -((w + 6) % 7)); }
function periodRange() {
  const a = ANCHOR || Day.today();
  if (PERIOD === 'day') return { from: a, to: a, step: 1,
    label: Day.isToday(a) ? 'Today' : Day.label(a) };
  if (PERIOD === 'week') {
    const f = weekStart(a), t = Day.shift(f, 6);
    return { from: f, to: t, step: 7,
      label: Day.short(f) + ' to ' + Day.short(t) +
        (a >= weekStart(Day.today()) && a <= Day.shift(weekStart(Day.today()), 6) ? ' · this week' : '') };
  }
  const f = monthStart(monthOf(a));
  return { from: f, to: monthEnd(monthOf(a)), step: 0, label: monthName(monthOf(a)) };
}
function periodShift(n) {
  const a = ANCHOR || Day.today();
  if (PERIOD === 'month') { ANCHOR = monthStart(monthBack(monthOf(a), -n)); return; }
  ANCHOR = Day.shift(a, n * (PERIOD === 'week' ? 7 : 1));
}
/* The same span, one step back, for the comparison. */
function prevRange() {
  const r = periodRange();
  if (PERIOD === 'month') { const pm = monthBack(monthOf(r.from), 1);
    return { from: monthStart(pm), to: monthEnd(pm), label: monthName(pm) }; }
  const n = PERIOD === 'week' ? 7 : 1;
  return { from: Day.shift(r.from, -n), to: Day.shift(r.to, -n),
    label: PERIOD === 'week' ? 'the week before' : 'the day before' };
}

function drawSpend(m) {
  /* SPMONTH is how this screen used to remember where it was. Honour it once
     so a bookmarked month still opens, then let ANCHOR take over. */
  if (SPMONTH && !ANCHOR) { ANCHOR = monthStart(SPMONTH); SPMONTH = null; }
  const R = periodRange(), P = prevRange();
  const t = rangeSpend(R.from, R.to), prev = rangeSpend(P.from, P.to);
  const word = PERIOD === 'day' ? 'day' : PERIOD === 'week' ? 'week' : 'month';

  const c0 = card(null, 'full');
  c0.appendChild(UI.segmented([{ id: 'day', name: 'DAY' }, { id: 'week', name: 'WEEK' },
    { id: 'month', name: 'MONTH' }], PERIOD, v => { PERIOD = v; S.set('period', v); draw(); }));

  const bar = el('div', 'rowbtns');
  bar.style.alignItems = 'center';
  const back = el('button', 'btn mb-press mb-tap', '‹');
  back.type = 'button'; back.setAttribute('aria-label', 'Previous ' + word);
  back.onclick = () => { periodShift(-1); Mobile.feedback('nav'); draw(); };
  const fwd = el('button', 'btn mb-press mb-tap', '›');
  fwd.type = 'button'; fwd.setAttribute('aria-label', 'Next ' + word);
  fwd.onclick = () => { periodShift(1); Mobile.feedback('nav'); draw(); };
  const nowBtn = el('button', 'btn mb-press mb-tap', 'Now');
  nowBtn.type = 'button';
  nowBtn.onclick = () => { ANCHOR = Day.today(); Mobile.feedback('nav'); draw(); };
  const lbl = el('div', null, '<b>' + esc(R.label) + '</b>');
  lbl.style.flex = '1'; lbl.style.textAlign = 'center';
  bar.appendChild(back); bar.appendChild(lbl); bar.appendChild(fwd); bar.appendChild(nowBtn);
  /* Nothing to step forward into. A future month is not a record. */
  fwd.disabled = R.to >= Day.today();
  fwd.style.opacity = fwd.disabled ? '.4' : '';
  c0.appendChild(bar);

  const g = el('div', 'grid3');
  g.style.marginTop = 'var(--s-3)';
  g.appendChild(tile('SPENT', short(t.total), t.rows + (t.rows === 1 ? ' thing' : ' things')));
  g.appendChild(tile('CAME IN', short(rangeIn(R.from, R.to)), R.label.replace(' · this week', '')));
  const netHere = rangeIn(R.from, R.to) - t.total;
  g.appendChild(tile('NET', (netHere > 0 ? '+' : '') + short(netHere),
    'in, less out', netHere < 0 ? 'bad' : 'good'));
  c0.appendChild(g);
  const g1b = el('div', 'grid2');
  g1b.style.marginTop = 'var(--s-2)';
  g1b.appendChild(tile('VS THE ONE BEFORE', (t.total - prev.total >= 0 ? '+' : '') + short(t.total - prev.total),
    P.label + ' spent ' + short(prev.total),
    t.total > prev.total ? 'warn' : 'good'));
  g1b.appendChild(tile('THEIR NET', (rangeIn(P.from, P.to) - prev.total > 0 ? '+' : '') +
    short(rangeIn(P.from, P.to) - prev.total), P.label,
    rangeIn(P.from, P.to) - prev.total < 0 ? 'bad' : 'good'));
  c0.appendChild(g1b);
  if (t.big) c0.appendChild(el('div', 'note', 'Normal spending was <b>' + esc(short(t.total - t.big)) +
    '</b>. ' + esc(short(t.big)) + ' of the total was a big one-off, kept out of every average.'));
  m.appendChild(c0);

  if (PERIOD === 'day') drawOneDay(m, R.from);
  if (PERIOD === 'week') drawOneWeek(m, R.from, R.to);

  /* Groceries against outside food, asked for by name. */
  const gro = t.byCat['groceries'] || 0, out = t.byCat['outside'] || 0;
  const c1 = card('COOKING VS EATING OUT');
  if (!gro && !out) c1.appendChild(el('div', 'empty', 'Nothing filed as Groceries or Outside food in this ' + word + '.'));
  else {
    const g2 = el('div', 'grid2');
    g2.appendChild(tile('GROCERIES', money(gro), (gro + out) ? Math.round(gro / (gro + out) * 100) + '% of food money' : ''));
    g2.appendChild(tile('OUTSIDE FOOD', money(out), (gro + out) ? Math.round(out / (gro + out) * 100) + '% of food money' : ''));
    c1.appendChild(g2);
    const bar = el('div', 'bar c1');
    bar.style.marginTop = 'var(--s-3)';
    bar.appendChild(el('i')).style.width = ((gro + out) ? gro / (gro + out) * 100 : 0).toFixed(1) + '%';
    c1.appendChild(bar);
    const pg = prev.byCat['groceries'] || 0, po = prev.byCat['outside'] || 0;
    if (pg || po) c1.appendChild(el('div', 'note', P.label + ': ' + esc(money(pg)) + ' groceries, ' +
      esc(money(po)) + ' outside.'));
  }
  m.appendChild(c1);

  /* Where it went, as a donut and a list. The picture ranks them at a glance
     and the list is what you can actually press. */
  const c2 = card('WHERE IT WENT');
  const rows = Object.keys(t.byCat).map(k => ({ id: k, amt: t.byCat[k],
      name: k ? catName(k) : 'Uncategorised' }))
    .sort((a, b) => b.amt - a.amt).filter(r => r.amt > 0);
  if (!rows.length) {
    c2.appendChild(el('div', 'empty', 'Nothing logged in this ' + word +
      '. Press <b>+</b> to put one in, or log it on your phone in STATUS.'));
  } else {
    const sum = rows.reduce((a, r) => a + r.amt, 0);
    /* Slivers become one wedge. Eleven of them is decoration. */
    const shown = [], rest = [];
    rows.forEach(r => (r.amt / sum >= 0.03 ? shown : rest).push(r));
    const slices = shown.concat(rest.length
      ? [{ id: null, name: 'Everything else', amt: rest.reduce((a, r) => a + r.amt, 0) }] : []);

    const ring = el('div');
    ring.style.position = 'relative';
    ring.style.display = 'flex';
    ring.style.justifyContent = 'center';
    ring.style.marginBottom = 'var(--s-4)';
    ring.appendChild(donut(slices, sum, 220));
    const mid = el('div', null, '<div class="k" style="font-family:var(--font-display);' +
      'font-size:var(--f-1);letter-spacing:var(--track-cap);color:var(--text-muted)">OUT</div>' +
      '<div style="font-family:var(--font-display);font-size:var(--f-5);' +
      'font-weight:var(--w-bold);line-height:var(--lh-tight)">' + esc(short(sum)) + '</div>');
    mid.style.position = 'absolute';
    mid.style.top = '50%'; mid.style.left = '50%';
    mid.style.transform = 'translate(-50%,-50%)';
    mid.style.textAlign = 'center';
    mid.style.pointerEvents = 'none';
    ring.appendChild(mid);
    c2.appendChild(ring);

    const top = rows[0].amt;
    const list = el('div', 'list');
    rows.forEach((r, i) => {
      /* The list keeps every category, and its colour matches the wedge it is
         in, so a sliver folded into "everything else" is still findable. */
      const slot = i < shown.length ? (1 + i % 6) : (1 + shown.length % 6);
      const row = itemRow(r.name,
        Math.round(r.amt / (t.total - t.big || 1) * 100) + '% of normal spending', money(r.amt));
      row.onclick = () => { CATFILTER = r.id; draw(); };
      const bar = el('div', 'bar c' + slot);
      bar.appendChild(el('i')).style.width = (r.amt / top * 100).toFixed(1) + '%';
      list.appendChild(stack(row, bar));
    });
    c2.appendChild(list);
    c2.appendChild(el('div', 'note', 'Tap a category to see only its purchases. Anything under 3% is one wedge in the ring, and still its own line here.'));
  }
  m.appendChild(c2);

  /* Tags: why, not what. */
  const tg = Object.keys(t.byTag).map(k => ({ id: k, amt: t.byTag[k] })).sort((a, b) => b.amt - a.amt);
  const c3 = card('OCCASIONS');
  if (!tg.length) c3.appendChild(el('div', 'empty', 'No tags used in this ' + word + '. A tag is why you spent, not what on. Tap anything below to tag it.'));
  else {
    const list = el('div', 'list');
    tg.forEach(r => {
      const n = (Rec.get('wtag', null, r.id) || {}).name || r.id;
      const row = itemRow(n, 'across every category', money(r.amt));
      row.style.cursor = 'default';
      list.appendChild(row);
    });
    c3.appendChild(list);
  }
  m.appendChild(c3);

  /* Big purchases, pulled out. Law 3. */
  const bigs = spendRows({ from: R.from, to: R.to }).filter(s => isBig(s) && !isMove(s));
  if (bigs.length) {
    const c4 = card('BIG ONE-OFFS');
    const list = el('div', 'list');
    bigs.forEach(s => {
      const r = itemRow(s.note || 'No details', Day.short(s.date) + ' · ' + esc(acctName(s.acct)), money(num(s.amt, 0)));
      r.onclick = () => spendSheet(s);
      list.appendChild(r);
    });
    c4.appendChild(list);
    c4.appendChild(el('div', 'note', 'Kept out of every "normal spending" figure above, on purpose. One laptop should not become the story of the month.'));
    m.appendChild(c4);
  }

  /* Every transaction, filtered. */
  const c5 = card(CATFILTER == null ? 'EVERYTHING' : 'EVERYTHING · ' + catName(CATFILTER).toUpperCase(), 'full');
  if (CATFILTER != null) {
    const b = el('button', 'btn mb-tap', 'Show all categories');
    b.onclick = () => { CATFILTER = null; draw(); };
    c5.querySelector('h2').appendChild(el('div', 'spacer'));
    c5.querySelector('h2').appendChild(b);
  }
  const all = spendRows({ from: R.from, to: R.to })
    .filter(s => !isMove(s) && (CATFILTER == null || catOf(s) === CATFILTER))
    .sort((a, b) => b.date.localeCompare(a.date) || num(b.t) - num(a.t));
  if (!all.length) c5.appendChild(el('div', 'empty', 'Nothing here.'));
  else {
    const list = el('div', 'list');
    all.slice(0, 200).forEach(s => {
      const c = catOf(s), tgg = tagOf(s);
      const r = itemRow(s.note || 'No details',
        Day.short(s.date) + ' · ' + esc(acctName(s.acct)) + ' · ' +
        (c ? esc(catName(c)) : '<span class="stale">uncategorised</span>') +
        (tgg ? ' · ' + esc((Rec.get('wtag', null, tgg) || {}).name || tgg) : '') +
        (isBig(s) ? ' · big' : ''),
        money(num(s.amt, 0)));
      r.onclick = () => spendSheet(s);
      list.appendChild(r);
    });
    c5.appendChild(list);
    c5.appendChild(el('div', 'note', 'These are STATUS’s rows, read not copied. Tap one to file it, tag it, or mark it a big one-off. WEALTH never edits the row itself.'));
  }
  m.appendChild(c5);
}
let CATFILTER = null;

/* == one day, in the order it happened ==
   Not a list of amounts. Everything that happened, down the clock: what you
   bought, what arrived, a session delivered, money moved into a pot. The
   quiet ones carry no amount because they are not spending, and mixing them
   into a total is how law 2 gets broken. */
function drawOneDay(m, date) {
  const ev = dayEvents(date);
  const c = card(Day.label(date).toUpperCase(), 'full');
  if (!ev.length) {
    c.appendChild(el('div', 'empty', Day.isToday(date)
      ? 'Nothing logged today yet. Spending arrives from STATUS on your phone.'
      : 'Nothing happened on this day, or nothing was logged.'));
    m.appendChild(c);
    return;
  }
  const list = el('div', 'list');
  ev.forEach(e => {
    const time = clock(e.row || e) || '';
    const r = itemRow(e.name,
      (time ? '<b>' + esc(time) + '</b> · ' : '') + e.note + (e.big ? ' · big one-off' : ''),
      e.fig != null ? e.fig : (e.amt > 0 ? '+' : '') + money(e.amt),
      e.kind === 'in' ? 'in' : '');
    if (e.quiet) r.classList.add('dim');
    if (e.kind === 'out' || e.kind === 'move') r.onclick = () => spendSheet(e.row);
    else if (e.kind === 'in') r.onclick = () => paidSheet(e.row);
    else r.style.cursor = 'default';
    list.appendChild(r);
  });
  c.appendChild(list);
  const inn = ev.filter(e => e.kind === 'in').reduce((a, e) => a + e.amt, 0);
  const outt = ev.filter(e => e.kind === 'out').reduce((a, e) => a - e.amt, 0);
  c.appendChild(el('div', 'note', '<b>' + esc(money(inn)) + '</b> in, <b>' + esc(money(outt)) +
    '</b> out. Anything greyed out moved money rather than spending it, so it counts in neither.'));
  m.appendChild(c);
}

/* == one week, a day at a time ==
   Seven rows whether or not anything happened, because an empty day is a
   fact about the week and a gap in a list is not. */
function drawOneWeek(m, from, to) {
  const c = card('DAY BY DAY', 'full');
  const days = Day.range(from, to);
  const outs = days.map(d => rangeSpend(d, d).total);
  const top = Math.max.apply(null, outs.concat([1]));
  const list = el('div', 'list');
  days.forEach((d, i) => {
    if (d > Day.today()) return;
    const inn = rangeIn(d, d), sp = outs[i];
    const sesh = Rec.all('sesh', { date: d }).length;
    const r = itemRow(Day.label(d),
      (inn ? '<b class="in">' + esc(money(inn)) + ' in</b> · ' : '') +
      (sp ? esc(rangeSpend(d, d).rows + (rangeSpend(d, d).rows === 1 ? ' purchase' : ' purchases')) : 'nothing spent') +
      (sesh ? ' · ' + sesh + ' session' + (sesh > 1 ? 's' : '') : ''),
      sp ? money(sp) : '—');
    if (Day.isToday(d)) r.style.outline = 'var(--border-width) solid var(--accent)';
    r.onclick = () => { PERIOD = 'day'; ANCHOR = d; S.set('period', 'day'); draw(); };
    const bar = el('div', 'bar c' + (1 + (i % 6)));
    bar.appendChild(el('i')).style.width = (sp / top * 100).toFixed(1) + '%';
    list.appendChild(stack(r, bar));
  });
  c.appendChild(list);
  c.appendChild(el('div', 'note', 'Tap a day to open it.'));
  m.appendChild(c);
}

/* ── POTS ── */
function drawPots(m) {
  const ps = pots();
  const c1 = card('SAVINGS POTS', 'full');
  if (!ps.length) {
    c1.appendChild(el('div', 'empty',
      'No pots yet. A pot is money with a name on it. Naming it is the point: ' +
      'taking money out of a pot you named breaks a rule you set, and being under a target does not feel like anything. Press <b>+</b>.'));
  } else {
    const list = el('div', 'list');
    ps.forEach((p, i) => {
      const bal = potBal(p.id), tgt = num(p.target, 0);
      const row = itemRow(p.name,
        (tgt ? money(bal) + ' of ' + money(tgt) + ' · ' + Math.round(bal / tgt * 100) + '%' : 'no target set') +
        (p.acct ? ' · ' + esc(acctName(p.acct)) : ''),
        money(bal), 'in');
      row.onclick = () => potSheet(p);
      const bar = el('div', 'bar c' + (1 + (i % 6)));
      bar.appendChild(el('i')).style.width = (tgt ? Math.min(100, bal / tgt * 100) : 0).toFixed(1) + '%';
      list.appendChild(stack(row, bar));
    });
    c1.appendChild(list);
    c1.appendChild(el('div', 'note', '<b>' + esc(money(potsTotal())) +
      '</b> put aside. This comes off your free figure, which is the whole reason it works.'));
  }
  m.appendChild(c1);

  const mv = moves({ from: Day.shift(Day.today(), -120) }).sort((a, b) => b.date.localeCompare(a.date));
  const c2 = card('RECENT MOVES');
  if (!mv.length) c2.appendChild(el('div', 'empty', 'Nothing moved yet. Open a pot above and put something in it.'));
  else {
    const list = el('div', 'list');
    mv.slice(0, 30).forEach(v => {
      const p = Rec.get('pot', null, v.pot);
      const r = itemRow((p ? p.name : 'gone'), Day.short(v.date) + ' · ' + (v.dir === 'out' ? 'taken out' : 'put in'),
        (v.dir === 'out' ? '-' : '+') + money(num(v.amt, 0)), v.dir === 'out' ? 'late' : 'in');
      r.style.cursor = 'default';
      list.appendChild(r);
    });
    c2.appendChild(list);
  }
  m.appendChild(c2);
}

/* ── ACCOUNTS ── */
function drawAccounts(m) {
  const as = accts();
  const c1 = card('ACCOUNTS', 'full');
  if (!as.length) c1.appendChild(el('div', 'empty', 'No accounts yet. Press <b>+</b> and add Cash, GCash, your bank, anything money sits in.'));
  else {
    const list = el('div', 'list');
    as.forEach(a => {
      const b = balanceOf(a.id);
      let sub, fig, cls = '';
      if (b) {
        sub = (b.age > STALE ? '<span class="stale">counted ' + b.age + ' days ago</span>'
                             : 'counted ' + (b.age ? b.age + ' days ago' : 'today')) +
              ', plus everything logged since';
        fig = money(b.bal);
      } else {
        const mv = movementSince(a.id, null);
        /* What he told it, shown rather than binned, and named as movement
           rather than as a balance. */
        sub = mv.any
          ? '<b>' + esc(money(mv.in)) + ' in, ' + esc(money(mv.out)) + ' out</b> logged here. ' +
            '<span class="stale">Tap to say what is actually in it.</span>'
          : '<span class="stale">Never counted. Tap to put in what it holds.</span>';
        fig = mv.any ? (mv.net >= 0 ? '+' : '') + money(mv.net) : '—';
        cls = 'dim';
      }
      const r = itemRow(a.name, sub, fig);
      if (cls) r.classList.add(cls);
      r.onclick = () => countSheet(a);
      list.appendChild(r);
    });
    c1.appendChild(list);
    /* Law 1, said out loud where it matters most. */
    c1.appendChild(el('div', 'note',
      'A balance is what you last counted plus everything logged after it. It drifts, because not every peso gets logged. ' +
      'Count again whenever you like and the drift resets. This app will never invent a balance you did not give it.'));
  }
  m.appendChild(c1);

  const c2 = card('CATEGORIES');
  const list = el('div', 'list');
  const GRP = { fix: 'Fixed', var: 'Variable', biz: 'Business', move: 'Not spending' };
  cats().forEach(c => {
    const r = itemRow(c.name, GRP[c.grp] || c.grp, '');
    r.onclick = () => catSheet(c);
    list.appendChild(r);
  });
  c2.appendChild(list);
  c2.appendChild(el('div', 'note', 'Categories say <b>what</b>. Tags say <b>why</b>. Anything marked "Not spending" never counts as an outgoing, because moving money is not spending it.'));
  m.appendChild(c2);

  const c3 = card('SORTING RULES', 'full');
  const rs = rules();
  const rl = el('div', 'list');
  rs.forEach(r => {
    const row = itemRow('“' + r.match + '”', 'files as ' + catName(r.cat), '');
    row.onclick = () => ruleSheet(r);
    rl.appendChild(row);
  });
  c3.appendChild(rl);
  c3.appendChild(el('div', 'note',
    'Text found in a description, and what it means. Write one now and it sorts everything back to the beginning, ' +
    'which is what makes categorising bearable at all. A single purchase can always override its rule.'));
  m.appendChild(c3);
}

/* ══════════════════════════ the sheets ══════════════════════════ */
/* == an amount groups itself ==
   Tom, 2026-09-11: "Numbers should automatically have commas."

   Formatting on every keystroke moves the caret, which is what makes most
   attempts at this horrible to type into. So the caret is put back by
   counting DIGITS before it rather than characters: insert a comma to the
   left of the cursor and the cursor still sits after the same digit. */
function groupNum(raw) {
  const cleaned = String(raw).replace(/[^0-9.]/g, '');
  const bits = cleaned.split('.');
  const whole = bits[0].replace(/^0+(?=\d)/, '');
  const frac = bits.length > 1 ? '.' + bits.slice(1).join('').slice(0, 2) : '';
  return (whole ? Number(whole).toLocaleString('en-US') : (frac ? '0' : '')) + frac;
}
function amountField(v) {
  const i = UI.field('money', { placeholder: '0',
    value: v == null || v === '' ? '' : groupNum(String(v)) });
  i.addEventListener('input', () => {
    const caret = i.selectionStart == null ? i.value.length : i.selectionStart;
    const digitsBefore = i.value.slice(0, caret).replace(/[^0-9]/g, '').length;
    const out = groupNum(i.value);
    if (out === i.value) return;
    i.value = out;
    let seen = 0, pos = out.length;
    if (!digitsBefore) pos = 0;
    else for (let k = 0; k < out.length; k++) {
      if (/[0-9]/.test(out[k])) seen++;
      if (seen >= digitsBefore) { pos = k + 1; break; }
    }
    try { i.setSelectionRange(pos, pos); } catch (e) {}
  });
  return i;
}
function dateField(v) {
  const i = UI.field('text', { value: v || Day.today() });
  i.type = 'date';
  return i;
}

/* money in */
function paidSheet(existing, preset) {
  UI.dialog({
    title: existing ? 'EDIT PAYMENT' : 'MONEY IN', width: 460,
    body: (b, h) => {
      const amt = amountField(existing ? existing.amt : (preset && preset.amt) || '');
      b.appendChild(fld('Amount', amt));
      const who = picker({
        items: clients().filter(c => c.status !== 'done').map(c => ({ id: c.id, name: c.name, note: money(num(c.rate, 0)) })),
        value: existing ? existing.client : (preset && preset.client) || '',
        placeholder: 'Which client, or leave blank for a one-off',
        none: 'No clients yet.',
        onCreate: makeClient,
      });
      b.appendChild(fld('Client', who));
      const acct = chipRow(accts().map(a => ({ id: a.id, name: a.name })),
        existing ? existing.acct : S.get('lastAcct', (accts()[0] || {}).id || ''), null, {});
      b.appendChild(fld('Into', acct));
      const note = UI.field('text', { placeholder: 'Commercial, workshop, anything', value: existing ? existing.note || '' : '' });
      b.appendChild(fld('What was it', note));
      const date = dateField(existing ? existing.date : (preset && preset.date));
      b.appendChild(fld('When', date));
      let hhmm = existing ? timeOf(existing) : timeOf({ t: Date.now() });
      b.appendChild(fld('Time', UI.timeField(hhmm, v => { hhmm = v; })));
      h.save = () => {
        const v = num(amt.value, 0);
        if (v <= 0) { amt.focus(); return false; }
        /* Law 4's second half: the same amount, same account, within the hour
           is a question rather than a silent second row. */
        if (!existing) {
          const dupe = paidRows({ date: date.value }).find(p =>
            num(p.amt, 0) === v && p.acct === acct.get());
          if (dupe && !h._forced) {
            h._forced = 1;
            UI.toast('you already logged <b>' + esc(money(v)) + '</b> into that account on that day. Press save again if it really happened twice', { bad: true });
            return false;
          }
        }
        const key = existing ? existing.key : newId();
        const d = existing ? existing.date : date.value;
        if (existing && existing.date !== date.value) Rec.del('paid', existing.date, existing.key);
