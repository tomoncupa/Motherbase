    packs: list, bought: bought, delivered: delivered, left: bought - delivered,
    value: value, paid: paid, dues: dues, coming: coming, pace: pace,
    owed: round2(dues.reduce((t, d) => t + d.amt, 0)),
    toCome: round2(coming.reduce((t, d) => t + d.amt, 0)),
    paidFor: paidFor, owedWork: Math.max(0, paidFor - delivered),
  };
}

/* == what a session earns ==
   Tom, 2026-09-14: "For session clients, I'd like to show me how much I make
   per session, and also a setting for sessions per week, which also lets me
   see how much I earn per week for that client."

   A client paid every N sessions earns their rate over N. A package client
   earns their latest package's price over its sessions, because a renewal at
   a new price is the price that is true now. A week's worth is that times the
   pace he gave, and it says "about" because the pace is his rough figure. */
function perSession(c) {
  const y = cycleOf(c);
  if (y.kind === 'sesh') return num(c.rate, 0) / y.every;
  if (y.kind === 'pack') {
    const ps = packsOf(c.id);
    if (!ps.length) return 0;
    const last = ps[ps.length - 1];
    return num(last.price, 0) / Math.max(1, num(last.n, 0));
  }
  return 0;
}
const earnWords = (per, pace) => per
  ? money(per) + ' a session' + (pace > 0 ? ' · about ' + money(per * pace) + ' a week' : '')
  : '';

/* A package part, in words, for the rows that list it. */
const partWhy = d => d.of > 1
  ? 'part ' + (d.k + 1) + ' of ' + d.of + (d.at ? ', when session ' + d.at + ' is done' : ', when sold')
  : d.pack.n + ' sessions' + (d.part ? ', part paid' : '');

/* == expected client payments, DERIVED and never stored ==
   Correcting a rate or a cycle fixes every future date at once and cannot
   leave a stale row behind. See brief, client payments.                    */
function dueDates(c, from, to) {
  const out = [], y = cycleOf(c);
  if (!c.start || c.status === 'done' || y.kind === 'sesh') return out;
  if (y.kind === 'oneoff') { if (c.start >= from && c.start <= to) out.push(c.start); return out; }
  if (y.kind === 'week') {
    const step = 7 * y.every;
    for (let d = c.start; d <= to; d = Day.shift(d, step)) if (d >= from) out.push(d);
    return out;
  }
  /* every N months, on each of its days, or on the day of the month it
     started. Clamped so the 31st does not fall out of February, and two days
     that clamp to the same date in a short month are one payment, not two. */
  const p = c.start.split('-');
  const want = y.days.length ? y.days : [+p[2]];
  let yr = +p[0], mo = +p[1];
  for (let i = 0; i < 400; i++) {
    const last = new Date(yr, mo, 0).getDate();
    const ym = yr + '-' + String(mo).padStart(2, '0') + '-';
    if (ym + '01' > to) break;
    const seen = {};
    want.forEach(dd => {
      const d = ym + String(Math.min(dd, last)).padStart(2, '0');
      if (seen[d] || d > to || d < from || d < c.start) return;
      seen[d] = 1;
      out.push(d);
    });
    mo += y.every;
    while (mo > 12) { mo -= 12; yr++; }
  }
  return out;
}

/* == a session client's payments ==
   Not a date, a count. Sessions are walked in order and chunked; every whole
   chunk is a payment, dated at the session that completed it. Twenty five
   sessions at ten each is two payments owed and five into the third, which
   is a thing he can be shown rather than a thing he has to work out. */
function seshDues(c) {
  const y = cycleOf(c);
  const all = seshOf(c.id);
  const out = [];
  for (let i = y.every - 1; i < all.length; i += y.every) out.push({ date: all[i].date, n: out.length + 1 });
  return { dues: out, done: all.length, into: all.length % y.every, every: y.every, total: all.length };
}

/* An expected payment is settled by a `paid` row for that client. A dated
   cycle matches on proximity, because people pay late and a late payment is
   still that payment rather than a mystery plus a miss. A session cycle
   matches in ORDER instead: the second block of ten is settled by the second
   payment, whenever it turned up, because there is no date to be near. */
function expected(from, to) {
  const out = [];
  const got = paidRows({ from: Day.shift(from, -20), to: Day.shift(to, 20) }).filter(p => p.client);
  const used = {};
  clients().forEach(c => {
    const y = cycleOf(c);
    if (y.kind === 'pack') {
      if (c.status === 'done') return;
      const st = packState(c);
      st.dues.forEach(d => {
        if (d.date < from || d.date > to) return;
        out.push({ client: c, date: d.date, amt: d.amt, paid: null,
                   late: d.date < Day.today(), why: partWhy(d) });
      });
      /* Not reached yet: expected on its guessed date, never late. */
      st.coming.forEach(d => {
        if (!d.date || d.date < from || d.date > to) return;
        out.push({ client: c, date: d.date, amt: d.amt, paid: null, late: false, est: true, why: partWhy(d) });
      });
      return;
    }
    if (y.kind === 'sesh') {
      if (c.status === 'done') return;
      const mine = paidRows({}).filter(p => p.client === c.id)
        .sort((a, b) => a.date.localeCompare(b.date));
      seshDues(c).dues.forEach((d, i) => {
        if (d.date < from || d.date > to) return;
        const hit = mine[i] || null;
        out.push({ client: c, date: d.date, amt: num(c.rate, 0), paid: hit,
                   late: !hit && d.date < Day.today(),
                   why: 'session ' + (d.n * y.every) });
      });
      return;
    }
    /* How far a payment may land from its date and still be that payment:
       a fortnight for a monthly client, but never more than half the gap to
       the next due. Otherwise a client paid on the 1st and the 15th could
       have the 15th's payment settle the 1st, and the wrong date shows as
       late. The nearest unclaimed payment wins, not the first one found. */
    const wide = dueDates(c, Day.shift(from, -40), Day.shift(to, 40));
    let gap = 28;
    for (let i = 1; i < wide.length; i++) gap = Math.min(gap, Day.diff(wide[i], wide[i - 1]));
    const reach = Math.max(1, Math.min(14, Math.floor(gap / 2)));
    dueDates(c, from, to).forEach(d => {
      let hit = null, best = 99;
      got.forEach(p => {
        if (p.client !== c.id || used[p.date + p.key]) return;
        const g = Math.abs(Day.diff(p.date, d));
        if (g <= reach && g < best) { best = g; hit = p; }
      });
      if (hit) used[hit.date + hit.key] = 1;
      out.push({ client: c, date: d, amt: num(c.rate, 0), paid: hit || null,
                 late: !hit && d < Day.today() });
    });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
/* When does the next money realistically land? A bill after your next payment
   is not a claim on today's cash, so this is where FREE stops looking unless
   he picks otherwise. The expected payment itself, or null when none is due
   in the next 60 days. */
function nextIn() {
  const soon = expected(Day.today(), Day.shift(Day.today(), 60)).filter(e => !e.paid);
  return soon.length ? soon[0] : null;
}
/* How far ahead FREE holds money back for bills.
   Tom, 2026-09-14: "Let me adjust the window for what's free to spend."

   The next client payment stays the default. But a client paying tomorrow
   shrinks that to one day and rent on the 30th stops counting, so free looks
   biggest in exactly the good week the brief warns about. The window is his
   to pick, a setting so it travels in a backup, and the screen always says
   in words which one it is using. Pots count whatever the window. */
const FREE_WINDOWS = [
  ['next', 'Until the next client payment'],
  ['month', 'Until the end of this month'],
  ['7', 'The next 7 days'],
  ['14', 'The next 14 days'],
  ['30', 'The next 30 days'],
  ['90', 'The next 90 days'],
];
function freeWindow() {
  const t = Day.today();
  let w = String(S.get('freeTo', 'next'));
  if (!FREE_WINDOWS.some(x => x[0] === w)) w = 'next';
  if (w === 'month') {
    const last = new Date(+t.slice(0, 4), +t.slice(5, 7), 0).getDate();
    const to = t.slice(0, 8) + String(last).padStart(2, '0');
    return { id: w, to: to, words: 'by the end of the month, ' + Day.short(to) };
  }
  if (w === 'next') {
    const n = nextIn();
    if (n) return { id: w, to: n.date,
      words: 'up to your next client payment, ' + (n.est ? 'about ' : '') + Day.short(n.date) };
    const to = Day.shift(t, 30);
    return { id: w, to: to,
      words: 'in the next 30 days, to ' + Day.short(to) + ', because no client payment is expected' };
  }
  const to = Day.shift(t, +w);
  return { id: w, to: to, words: 'in the next ' + w + ' days, to ' + Day.short(to) };
}

/* ── bills falling due in a window ── */
function billsDue(from, to) {
  const out = [];
  bills().forEach(b => billDates(b, from, to).forEach(d => out.push({ bill: b, date: d })));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
/* One bill's due dates in a window.
   Tom, 2026-09-14: "I pay Meralco roughly 1040 every 6-7 days." A bill is
   monthly on a day, or every N days counted from the day it was last paid.
   N may be a fraction: 6.5 gives dates 6 and 7 days apart in turn. Each date
   is rounded from the start, never from the date before, so the rounding
   cannot build up into drift. The day it was last paid is not itself due. */
function billDates(b, from, to) {
  const out = [];
  const inRange = iso => iso >= from && (!b.from || iso >= b.from) && (!b.until || iso <= b.until);
  if (b.cycle === 'days') {
    const n = Math.max(1, num(b.every, 7)), s = b.start || from;
    let i = Math.max(1, Math.floor(Day.diff(from, s) / n) - 1);
    for (let guard = 0; guard < 500; guard++, i++) {
      const iso = Day.shift(s, Math.round(i * n));
      if (iso > to) break;
      if (inRange(iso)) out.push(iso);
    }
    return out;
  }
  const day = num(b.day, 1);
  let d = new Date(from.slice(0, 4), +from.slice(5, 7) - 1, 1);
  for (let i = 0; i < 24; i++) {
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
      '-' + String(Math.min(day, last)).padStart(2, '0');
    if (iso > to) break;
    if (inRange(iso)) out.push(iso);
    d.setMonth(d.getMonth() + 1);
  }
  return out;
}
/* What a bill comes to in an average month: its amount, or for a bill every
   N days, its amount times the 30.44 days of an average month over N. */
const billMonthly = b => b.cycle === 'days'
  ? num(b.amt, 0) * (365.25 / 12) / Math.max(1, num(b.every, 7)) : num(b.amt, 0);
const monthlyFixed = () => bills().reduce((a, b) => a + billMonthly(b), 0);
/* The bills runway counts. A bill filed under an everyday category, Groceries
   say, is left out: a normal month of everyday spending is already measured
   from what was actually spent, and adding the bill too counts it twice. */
const standingBills = () => bills().filter(b => catGrp(b.cat) !== 'var')
  .reduce((a, b) => a + billMonthly(b), 0);

/* ══ the three numbers ══ */
function board() {
  const L = liquid();
  const win = freeWindow();
  const allot = allottedLeft(win.to);
  /* A bill filed under a category with an allowance is not held back on its
     own. The allowance already covers that spending, and both would hold the
     same money twice. */
  const due = billsDue(Day.today(), win.to)
    .filter(x => !(num((Rec.get('cat', null, x.bill.cat) || {}).cap, 0) > 0))
    .reduce((a, x) => a + num(x.bill.amt, 0), 0);
  const alloc = potsTotal() + allot + due;
  return { liquid: L, allocated: alloc, free: L.total - alloc, win: win, allot: allot };
}
/* == what is left of each monthly allowance ==
   Tom, 2026-09-14: "If I allot 9k for groceries, how does that work when it
   shows up in my union bank import?" An allowance is a monthly figure on a
   category, the `cap` field. Every purchase filed under that category counts
   against it, from any account and however it arrived: logged in STATUS,
   typed here, or read off a statement, whose rules file it the same way.

   What is not spent yet is money already spoken for, so FREE holds it back:
   this month's remainder, never below zero, and the whole allowance for each
   later month that starts inside the window. Going over holds back nothing
   extra, because what was spent has already left the account. */
function allottedLeft(to) {
  const mo = monthOf(Day.today());
  let total = 0;
  capped().forEach(c => {
    const st = capState(c.id, mo);
    if (st) total += Math.max(0, st.left);
    for (let s = Day.shift(monthEnd(mo), 1); s <= to; s = Day.shift(monthEnd(monthOf(s)), 1)) total += num(c.cap, 0);
  });
  return total;
}
/* Runway: how many months at the current standing cost, if every client left
   tomorrow. The app's real subject — liquid moves for boring reasons, this
   only moves when something structural did. */
function runway() {
  const burn = standingBills() + typicalVariable();
  const L = liquid();
  if (!burn || !L.counted) return null;
  return { months: L.total / burn, burn: burn };
}
/* What a normal month of variable spending looks like. Median of the last six
   whole months, with big purchases excluded — law 3. A median because one
   Christmas should not become the definition of normal. */
function typicalVariable() {
  const now = monthOf(Day.today());
  const vals = [];
  for (let i = 1; i <= 6; i++) {
    const m = monthBack(now, i);
    const t = monthSpend(m);
    if (t.rows) vals.push(t.variable);
  }
  if (!vals.length) return 0;
  vals.sort((a, b) => a - b);
  return vals[Math.floor(vals.length / 2)];
}

/* ══ a month of spending ══
   `big` is separated rather than dropped: law 3 says one laptop must not
   become the story of the month, and every figure that excludes it says so. */
function rangeSpend(from, to) {
  const t = { total: 0, variable: 0, fixed: 0, biz: 0, big: 0, rows: 0, byCat: {}, byTag: {} };
  spendRows({ from: from, to: to }).forEach(s => {
    if (isMove(s)) return;
    const amt = num(s.amt, 0), c = catOf(s), g = catGrp(c);
    t.rows++;
    if (isBig(s)) { t.big += amt; t.total += amt; return; }
    t.total += amt;
    if (g === 'fix') t.fixed += amt; else if (g === 'biz') t.biz += amt; else t.variable += amt;
    t.byCat[c || ''] = (t.byCat[c || ''] || 0) + amt;
    const tg = tagOf(s); if (tg) t.byTag[tg] = (t.byTag[tg] || 0) + amt;
  });
  return t;
}
const monthSpend = m => rangeSpend(monthStart(m), monthEnd(m));
const rangeIn = (from, to) => paidRows({ from: from, to: to })
  .reduce((a, p) => a + num(p.amt, 0), 0);
const monthIn = m => rangeIn(monthStart(m), monthEnd(m));

/* == everything that happened on one day, in the order it happened ==
   Tom, 2026-09-11: "I want to review individual days and weeks." A day is not
   only spending. Money arrived, sessions were delivered, money moved into a
   pot. All of it in one column, sorted by the clock, which is the only thing
   that makes a day readable rather than four separate lists. */
function dayEvents(date) {
  const out = [];
  spendRows({ date: date }).forEach(x => {
    if (isMove(x)) { out.push({ kind: 'move', t: num(x.t, 0), name: x.note || 'Moved money',
      note: acctName(x.acct), amt: -num(x.amt, 0), row: x, quiet: 1 }); return; }
    out.push({ kind: 'out', t: num(x.t, 0), name: x.note || 'No details',
      note: acctName(x.acct) + (catOf(x) ? ' · ' + catName(catOf(x)) : ' · uncategorised'),
      amt: -num(x.amt, 0), row: x, big: isBig(x) });
  });
  paidRows({ date: date }).forEach(x => {
    const c = x.client ? Rec.get('client', null, x.client) : null;
    out.push({ kind: 'in', t: num(x.t, 0), name: c ? c.name : (x.note || 'One-off'),
      note: acctName(x.acct) + (c && x.note ? ' · ' + x.note : ''), amt: num(x.amt, 0), row: x });
  });
  moves({ date: date }).forEach(x => {
    const pt = Rec.get('pot', null, x.pot);
    out.push({ kind: 'pot', t: 0, name: pt ? pt.name : 'a pot',
      note: x.dir === 'out' ? 'taken out of the pot' : 'put into the pot',
      amt: 0, quiet: 1, fig: (x.dir === 'out' ? '-' : '+') + money(num(x.amt, 0)) });
  });
  xfers({ date: date }).forEach(x => {
    out.push({ kind: 'xfer', t: num(x.t, 0), name: acctName(x.from) + ' to ' + acctName(x.to),
      note: 'your own money moving, not spending', amt: 0, quiet: 1, fig: money(num(x.amt, 0)) });
  });
  Rec.all('sesh', { date: date }).forEach(r => {
    const c = Rec.get('client', null, r.payload.client);
    out.push({ kind: 'sesh', t: 0, name: c ? c.name : 'a client',
      note: 'session delivered', amt: 0, quiet: 1, fig: 'session' });
  });
  return out.sort(byTime);
}

/* == a donut of where the money went ==
   Tom, 2026-09-11: "I want a piechart for money out."

   Drawn here rather than in `shared/chart.js`, which has no pie and which an
   app session must not touch. Six theme colour slots, no hex anywhere, and a
   hole in the middle so the total can live in it — a plain pie wastes its
   best piece of space on nothing.

   Slices are one path each with an arc, and they are `<title>`d so hovering
   says what they are. Anything under 3% is folded into one "everything else"
   wedge, because eleven slivers is a decoration, not a chart. */
function donut(rows, total, size) {
  const NS = 'http://www.w3.org/2000/svg';
  const S = size || 220, R = S / 2, INNER = R * 0.62;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + S + ' ' + S);
  svg.setAttribute('class', 'mb-chart');
  svg.style.width = '100%'; svg.style.maxWidth = S + 'px'; svg.style.height = 'auto';
  if (!total) return svg;

  let angle = -Math.PI / 2;                     /* twelve o'clock */
  const pt = (a, r) => [(R + r * Math.cos(a)).toFixed(2), (R + r * Math.sin(a)).toFixed(2)];
  rows.forEach((row, i) => {
    const frac = row.amt / total;
    if (frac <= 0) return;
    /* A full circle drawn as an arc collapses to nothing, because its start
       and end points are the same. One category is a ring, not a slice. */
    const end = angle + frac * Math.PI * 2;
    const node = document.createElementNS(NS, frac >= 0.9999 ? 'circle' : 'path');
    if (frac >= 0.9999) {
      node.setAttribute('cx', R); node.setAttribute('cy', R);
      node.setAttribute('r', (R + INNER) / 2);
      node.setAttribute('fill', 'none');
      node.setAttribute('stroke-width', R - INNER);
      node.setAttribute('stroke', 'var(--data-' + (1 + i % 6) + ')');
    } else {
      const big = frac > 0.5 ? 1 : 0;
      const o1 = pt(angle, R - 1), o2 = pt(end, R - 1);
      const i2 = pt(end, INNER), i1 = pt(angle, INNER);
      node.setAttribute('d',
        'M' + o1[0] + ' ' + o1[1] +
        'A' + (R - 1) + ' ' + (R - 1) + ' 0 ' + big + ' 1 ' + o2[0] + ' ' + o2[1] +
        'L' + i2[0] + ' ' + i2[1] +
        'A' + INNER + ' ' + INNER + ' 0 ' + big + ' 0 ' + i1[0] + ' ' + i1[1] + 'Z');
      node.setAttribute('fill', 'var(--data-' + (1 + i % 6) + ')');
    }
    const ttl = document.createElementNS(NS, 'title');
    ttl.textContent = row.name + ' — ' + money(row.amt) + ' (' + Math.round(frac * 100) + '%)';
    node.appendChild(ttl);
    svg.appendChild(node);
    angle = end;
  });
  return svg;
}

/* ══════════════════════ STATEMENT IMPORT ══════════════════════
   Tom, 2026-09-11: "the purpose of the statement import to make sure I have
   everything correct but we definitely dont want duplicates, maybe uncertain
   cases you can ask me everything whether 2 things are the same or not, then
   we can create a master entry."

   That is the whole design, and the important half of it is the second half.
   An import that only ADDS is worse than no import: the same lunch appears
   twice, every total is wrong, and the app has quietly become less true than
   the notebook it replaced.

   So every line off a statement lands in one of four places:

     KNOWN      already reconciled on an earlier import. Silent, and this is
                what makes running the same file twice harmless.
     CERTAIN    same account, same amount to the peso, on the same day, with
                no clock or shop name against it. Merged without asking.
     ASK        close but not certain. He decides, one at a time, and the
                question is always "are these the same thing".
     NEW        nothing like it. Offered as something to add.

   MERGING MAKES A MASTER ENTRY, IT DOES NOT MAKE A SECOND ROW. What he knows
   (the category, the note, the receipt, the occasion) stays. What the bank
   knows better (the exact amount, the date it really cleared, its own
   description) is written over the top. The row keeps its identity, so the
   category he set six weeks ago survives being reconciled.

   NOTHING IS WRITTEN UNTIL HE PRESSES APPLY. The whole run is worked out in
   memory and shown as a tally first, because an import that has already
   happened by the time you see it is not something you can say no to.        */

/* Every statement line gets a fingerprint, so a file read twice is read once.
   Account, day, amount and the first run of letters in the description —
   enough to be stable, loose enough to survive a bank re-spacing its own
   columns. */
function stmtId(acct, date, amt, desc, ref) {
  /* The bank's own reference when there is one. Without it, two ₱93 Angkas
     rides on the same day are one fingerprint, and the second would be
     skipped as already imported. */
  return acct + '|' + date + '|' + Math.round(num(amt, 0) * 100) + '|' +
    (ref ? 'ref:' + String(ref).trim() : norm(String(desc || '').slice(0, 24)));
}
const recon = id => Rec.get('recon', null, id);

/* ── reading whatever the bank printed ──
   CSV, tab separated, or text pasted out of a PDF. Files themselves, PDF and
   spreadsheet, are opened further down by libraries fetched only when needed;
   pasting stays as the way in when they will not load. */
/* == which character is actually the column break ==
   Deciding this per line is wrong and it bit immediately: "5,400.00" made a
   pasted PDF line look comma separated, so one statement was read with three
   different column counts and came out as a single nonsense row.

   So it is decided ONCE for the whole file, by trying each candidate and
   asking which one gives the same column count on the most lines. A thousands
   separator cannot win that, because it only appears on the lines with big
   numbers on them.

   Comma is tried last on a tie for the same reason: a run of spaces is never
   accidental, a comma very often is. */
function splitWith(line, d) {
  if (d === 'ws') return line.split(/\s{2,}/).map(x => x.trim());
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { q = !q; continue; }
    if (!q && ch === d) { out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out.map(x => x.trim());
}
function delimFor(lines) {
  let best = null;
  ['\t', ';', 'ws', ','].forEach(d => {
    const counts = {};
    lines.forEach(l => { const n = splitWith(l, d).length; if (n > 1) counts[n] = (counts[n] || 0) + 1; });
    const top = Object.keys(counts).map(Number).sort((a, b) => counts[b] - counts[a])[0];
    const score = top ? counts[top] : 0;
    if (score && (!best || score > best.score)) best = { d: d, score: score, cols: top };
  });
  return best ? best.d : 'ws';
}

const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
/* Returns {y, m, d} with m and d NOT yet decided when the format is
   ambiguous, so the caller can settle 03/04 once for the whole file instead
   of guessing differently on every line. */
function readDate(raw) {
  const t = String(raw || '').trim();
  let m;
  if ((m = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)))
    return { y: +m[1], a: +m[2], b: +m[3], sure: 'ymd' };
  if ((m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))) {
    let y = +m[3]; if (y < 100) y += 2000;
    return { y: y, a: +m[1], b: +m[2], sure: null };
  }
  /* 11 Sep 2026, Sep 11 2026, Sep 11, 2026 */
  if ((m = t.match(/^(\d{1,2})\s*[- ]\s*([A-Za-z]{3,})\.?\,?\s*(\d{2,4})?/))) {
    const mo = MONTHS.indexOf(m[2].slice(0, 3).toLowerCase());
    if (mo > -1) return { y: m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : +Day.today().slice(0, 4),
      a: mo + 1, b: +m[1], sure: 'ymd' };
  }
  if ((m = t.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2})\,?\s*(\d{2,4})?/))) {
    const mo = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase());
    if (mo > -1) return { y: m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : +Day.today().slice(0, 4),
      a: mo + 1, b: +m[2], sure: 'ymd' };
  }
  return null;
}
const isoOf = (p, dayFirst) => {
  const mo = p.sure === 'ymd' ? p.a : (dayFirst ? p.b : p.a);
  const dy = p.sure === 'ymd' ? p.b : (dayFirst ? p.a : p.b);
  if (mo < 1 || mo > 12 || dy < 1 || dy > 31) return null;
  return p.y + '-' + String(mo).padStart(2, '0') + '-' + String(dy).padStart(2, '0');
};

/* An amount, however the bank chose to print a minus sign. */
function readAmt(raw) {
  let t = String(raw == null ? '' : raw).trim();
  if (!t) return null;
  let neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  if (/(^|\s)(dr|db|debit)\b/i.test(t)) neg = true;
  if (/(^|\s)(cr|credit)\b/i.test(t)) neg = false;
  t = t.replace(/[^0-9.\-]/g, '');
  if (t.indexOf('-') === 0) { neg = true; t = t.slice(1); }
  if (!t || !/[0-9]/.test(t)) return null;
  const v = parseFloat(t);
  if (!isFinite(v)) return null;
  return neg ? -v : v;
}

/* Which column is which. A header row if there is one, otherwise by shape:
   the column that parses as a date every time is the date, the one that
   parses as a number every time is the amount, the longest text is the
   description. */
const HEAD = {
  date: /^(date|txn date|transaction date|posting date|post date|value date|datetime)/i,
  desc: /^(desc|description|details|particulars|narrative|remarks|merchant|payee|reference|transaction)/i,
  amt: /^(amount|amt|value|transaction amount)/i,
  dr: /^(debit|withdrawal|paid out|money out|outflow|dr)/i,
  cr: /^(credit|deposit|paid in|money in|inflow|cr)/i,
};
function parseStatement(text, dayFirst) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return { rows: [], ambiguous: false, skipped: 0 };
  const delim = delimFor(lines);
  const grid = lines.map(l => splitWith(l, delim)).filter(c => c.length > 1);
  if (!grid.length) return { rows: [], ambiguous: false, skipped: lines.length };

  /* a header row names its columns and parses as no dates at all */
  let cols = null, start = 0;
  const first = grid[0];
  if (first.some(c => HEAD.date.test(c)) && !readDate(first[0])) {
    cols = { date: -1, desc: -1, amt: -1, dr: -1, cr: -1 };
    first.forEach((c, i) => {
      Object.keys(HEAD).forEach(k => { if (cols[k] < 0 && HEAD[k].test(c)) cols[k] = i; });
    });
    start = 1;
  }
  if (!cols) {
    const n = Math.max.apply(null, grid.map(r => r.length));
    const hits = [];
    for (let i = 0; i < n; i++) {
      let d = 0, a = 0, len = 0;
      grid.forEach(r => {
        if (r[i] == null) return;
        if (readDate(r[i])) d++;
        if (readAmt(r[i]) != null && /[0-9]/.test(r[i])) a++;
        len += String(r[i]).length;
      });
      hits.push({ i: i, d: d, a: a, len: len });
    }
    const dateCol = hits.slice().sort((x, y) => y.d - x.d)[0];
    const amtCol = hits.filter(h => h.i !== dateCol.i).sort((x, y) => y.a - x.a || y.i - x.i)[0];
    const descCol = hits.filter(h => h.i !== dateCol.i && h.i !== (amtCol || {}).i)
      .sort((x, y) => y.len - x.len)[0];
    cols = { date: dateCol.i, amt: amtCol ? amtCol.i : -1,
             desc: descCol ? descCol.i : -1, dr: -1, cr: -1 };
  }

  /* Settle day-first versus month-first ONCE, for the whole file. A number
     over twelve in one position proves which it is; if nothing proves it, the
     caller asks him rather than picking. */
  let proof = null, anyLoose = false;
  grid.slice(start).forEach(r => {
    const p = readDate(r[cols.date]);
    if (!p || p.sure) return;
    anyLoose = true;                       /* a date whose order is not stated */
    if (p.a > 12) proof = true;
    else if (p.b > 12 && proof === null) proof = false;
  });
  const df = dayFirst == null ? (proof === null ? false : proof) : dayFirst;

  const rows = []; let skipped = 0;
  grid.slice(start).forEach(r => {
    const p = readDate(r[cols.date]);
    const date = p ? isoOf(p, df) : null;
    let amt = null;
    if (cols.dr > -1 || cols.cr > -1) {
      const dr = readAmt(r[cols.dr]), cr = readAmt(r[cols.cr]);
      if (dr != null && dr !== 0) amt = -Math.abs(dr);
      else if (cr != null && cr !== 0) amt = Math.abs(cr);
    } else if (cols.amt > -1) amt = readAmt(r[cols.amt]);
    const desc = cols.desc > -1 ? r[cols.desc] : r.filter((_, i) => i !== cols.date && i !== cols.amt).join(' ');
    if (!date || amt == null || !amt) { skipped++; return; }
    rows.push({ date: date, amt: amt, desc: String(desc || '').trim() });
  });
  /* Only ask when there is something to ask about. A file of ISO dates states
     its own order on every line, and a question with no doubt behind it is
     the fastest way to teach somebody to click through questions. */
  return { rows: rows, ambiguous: anyLoose && proof === null && dayFirst == null,
           skipped: skipped, dayFirst: df, cols: cols };
}

/* ══════════════════ the smart half of import ══════════════════
   Tom, 2026-09-13, with his real GCash PDF and UnionBank spreadsheet: "please
   create the smart import tool." Reading those two files taught four things,
   and each one is a way an honest-looking import puts wrong money in the app.

   1. A PRINTED AMOUNT IS NOT ALWAYS MONEY THAT MOVED. GCash prints ride holds
      as payments. Two ₱62 Angkas lines three minutes apart, the balance does
      not move on the second, then a ₱93 line that only takes ₱31. Over two
      months that was ₱4,261 of "spending" that never left the wallet. The
      running balance is the only column that tells the truth, so wherever a
      statement has one, the amount of every line is what the balance did.

   2. A STATEMENT CAN BE CHECKED AGAINST ITSELF. Opening balance plus every
      movement lands on the closing balance to the centavo, or something is
      wrong — a missed page, text pulled out of a PDF in the wrong order. When
      it does not add up, nothing is imported unless he says he has checked.

   3. A REVERSAL CANCELS ITS ORIGINAL. UnionBank sent ₱1,600 to a mistyped
      GCash number and put it straight back. Both lines are real and together
      they are nothing, so they are netted out, not imported as a payment and
      an income.

   4. HIS OWN MONEY SHOWS UP TWICE. ₱5,500 sent from UnionBank to his own
      GCash is a debit on one statement and a credit on the other. Imported as
      spending and income it inflates both. So it is recorded once, as a
      transfer, and the second statement finds the transfer the first one
      already wrote instead of adding another.

   Only after those four does the old question get asked: is this already
   something he logged? */

const round2 = n => Math.round(n * 100) / 100;
const xfers = o => Rec.all('xfer', o).map(r => Object.assign({ key: r.key, date: r.date }, r.payload));

/* == the libraries, fetched only when a file needs one ==
   Hard constraint 4 allows a CDN dependency that degrades, and SheetJS is
   already one. The PDF reader is the same deal: nothing in the app waits on
   it, and if it will not load the import says so and offers pasting. An
   earlier note in this file ruled PDFs out entirely; that was wrong, it
   confused "may not depend on" with "may not use". */
const LIBS = {
  xlsx: { src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', ready: () => window.XLSX },
  pdf: { src: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', ready: () => window.pdfjsLib },
};
function loadLib(name) {
  const L = LIBS[name];
  if (L.ready()) return Promise.resolve(L.ready());
  if (!L.p) {
    L.p = new Promise(res => {
      const s = el('script');
      s.src = L.src;
      s.onload = () => res(L.ready() || null);
      s.onerror = () => res(null);
      document.head.appendChild(s);
      setTimeout(() => res(L.ready() || null), 15000);
    }).then(v => { if (!v) L.p = null; return v; });
  }
  return L.p;
}

function fileKind(f) {
  const n = String(f.name || '').toLowerCase();
  if (/\.pdf$/.test(n) || f.type === 'application/pdf') return 'pdf';
  if (/\.xlsx?$/.test(n)) return 'xlsx';
  return 'text';
}
const readAs = (f, how) => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(fr.result);
  fr.onerror = () => rej(new Error('that file could not be read'));
  if (how === 'text') fr.readAsText(f); else fr.readAsArrayBuffer(f);
});

async function openXlsx(buf) {
  const X = await loadLib('xlsx');
  if (!X) throw new Error('The spreadsheet reader would not load, which usually means no internet. Save the file as CSV and choose that instead.');
  let wb;
  try { wb = X.read(new Uint8Array(buf), { type: 'array' }); }
  catch (e) {
    throw new Error(/password|encrypt/i.test(String(e && e.message))
      ? 'This spreadsheet has a password on it. Open it, save a copy without the password, and choose that.'
      : 'That spreadsheet would not open: ' + (e && e.message || e));
  }
  const ws = wb.Sheets[wb.SheetNames[0]];
  return X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' })
    .map(r => r.map(c => String(c == null ? '' : c)))
    .filter(r => r.some(c => c.trim()));
}

/* Text comes out in the order the PDF drew it, which for GCash is one
   transaction at a time. Rebuilding lines from their positions on the page is
   what scrambled the first attempt, so positions are deliberately ignored.

   The password is handed to the reader and nowhere else: not a setting, not a
   row, not the console. */
async function openPdf(buf, password) {
  const P = await loadLib('pdf');
  if (!P) throw new Error('The PDF reader would not load, which usually means no internet. Select the text in the PDF and paste it instead.');
  P.GlobalWorkerOptions.workerSrc = LIBS.pdf.src.replace('pdf.min.js', 'pdf.worker.min.js');
  let doc;
  try {
    doc = await P.getDocument({ data: new Uint8Array(buf.slice(0)), password: password || undefined }).promise;
  } catch (e) {
    if (e && e.name === 'PasswordException') {
      const err = new Error('password');
      err.password = e.code === 2 ? 'wrong' : 'needed';
      throw err;
    }
    throw new Error('That PDF would not open: ' + (e && e.message || e));
  }
  const lines = [];
  let cur = '';
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    tc.items.forEach(it => {
      cur += it.str;
      if (it.hasEOL) { if (cur.trim()) lines.push(cur.trim()); cur = ''; }
    });
    if (cur.trim()) { lines.push(cur.trim()); cur = ''; }
  }
  return lines;
}

/* == GCash's own shape ==
   A timestamp, a description that can run over two lines, then a reference
   number, ONE amount with no sign, and the balance after it. Which way the
   money went is not printed anywhere; only the balance says. */
const GC_START = /^(\d{4}-\d{2}-\d{2}) (\d{1,2}):(\d{2}) ([AP]M)\s*(.*)$/;
const GC_TAIL = /^(.*?)\s*(\d{10,16})\s+(-?[\d,]+\.\d{2})\s+(-?[\d,]+\.\d{2})$/;
const looksGCash = lines => lines.filter(l => GC_START.test(l)).length >= 3 &&
  lines.some(l => /balance/i.test(l));

function readGCash(lines) {
  const st = { source: 'gcash', title: lines.find(l => /transaction history/i.test(l)) || 'GCash statement',
    opening: null, closing: null, lines: [], ids: [], skipped: 0 };
  let cur = null;
  lines.forEach(l => {
    let m;
    if ((m = l.match(/^STARTING BALANCE\s+(-?[\d,]+\.\d{2})$/i))) { st.opening = num(m[1]); return; }
    if ((m = l.match(/^ENDING BALANCE\s+(-?[\d,]+\.\d{2})$/i))) { st.closing = num(m[1]); cur = null; return; }
    if (/^(total debit|total credit|date and time)/i.test(l)) return;
    if ((m = l.match(GC_START))) {
      if (cur) st.skipped++;                      /* a record that never found its amount */
      let hr = +m[2] % 12;
      if (m[4] === 'PM') hr += 12;
      cur = { date: m[1], time: String(hr).padStart(2, '0') + ':' + m[3], desc: '', ref: '', printed: null, bal: null, signed: null };
      l = m[5];
      if (!l) return;
    }
    if (!cur) return;
    const t = l.match(GC_TAIL);
    if (t) {
      if (t[1]) cur.desc += (cur.desc ? ' ' : '') + t[1];
      cur.ref = t[2];
      cur.printed = Math.abs(num(t[3], 0));
      cur.bal = num(t[4], 0);
      st.lines.push(cur);
      cur = null;
    } else {
      cur.desc += (cur.desc ? ' ' : '') + l;
    }
  });
  /* Whose wallet this is: the number money is most often sent FROM. */
  const from = {};
  st.lines.forEach(x => {
    const m = x.desc.match(/transfer from (\d{10,13}) to/i);
    if (m) from[m[1]] = (from[m[1]] || 0) + 1;
  });
  const own = Object.keys(from).sort((a, b) => from[b] - from[a])[0];
  if (own) st.ids.push(own);
  return st;
}

/* == any statement with a header row ==
   Columns found by name. Banks also wrap long descriptions at a fixed width
   inside a cell — UnionBank cuts at twenty characters, mid-word — so the most
   common wrapped-line length is taken to be the cut, and a line of exactly
   that length is joined to the next with no space. */
const HEADS = {
  date: /^(date|txn date|transaction date|posting date|post date|value date|date and time)$/i,
  desc: /(desc|particular|detail|narrat|remark|merchant|payee)/i,
  ref: /(^ref|reference)/i,
  dr: /^(debit|debits|withdrawals?|paid out|money out|outflow|dr)$/i,
  cr: /^(credit|credits|deposits?|paid in|money in|inflow|cr)$/i,
  amt: /^(amount|amt|transaction amount)$/i,
  bal: /balance/i,
};
function readTable(grid, dayFirst) {
  let head = -1, cols = null;
  for (let i = 0; i < Math.min(grid.length, 40); i++) {
    const c = {};
    grid[i].forEach((v, j) => {
      const s = String(v).trim();
      Object.keys(HEADS).forEach(k => { if (c[k] == null && s && HEADS[k].test(s)) c[k] = j; });
    });
    if (c.date != null && (c.amt != null || c.dr != null || c.cr != null)) { head = i; cols = c; break; }
  }
  if (!cols) return null;

  const st = { source: 'table', title: '', opening: null, closing: null, lines: [], ids: [], skipped: 0 };
  grid.slice(0, head).forEach(r => {
    const i = r.findIndex(v => /account\s*(no|number|#)/i.test(v));
    if (i > -1) {
      const v = r.slice(i + 1).find(x => /\d{4,}/.test(x));
      if (v) st.ids.push(v.replace(/\D/g, '').slice(-4));
    }
    const n = r.findIndex(v => /account\s*name/i.test(v));
    if (n > -1) st.title = (r.slice(n + 1).find(x => x.trim()) || '').trim();
  });

  const body = grid.slice(head + 1);
  const seg = {};
  body.forEach(r => {
    const parts = String(cols.desc != null ? r[cols.desc] : '').split('\n');
    parts.slice(0, -1).forEach(p => { if (p.length > 8) seg[p.length] = (seg[p.length] || 0) + 1; });
  });
  const wrap = +Object.keys(seg).sort((a, b) => seg[b] - seg[a])[0] || 0;
  const unwrap = d => {
    const parts = String(d || '').split('\n');
    let o = '';
    parts.forEach((p, i) => { o += (wrap && p.length === wrap && i + 1 < parts.length) ? p : p + ' '; });
    return o.replace(/\s+/g, ' ').trim();
  };

  let proof = null, loose = false;
  body.forEach(r => {
    const p = readDate(r[cols.date]);
    if (!p || p.sure) return;
    loose = true;
    if (p.a > 12) proof = true;
    else if (p.b > 12 && proof === null) proof = false;
  });
  st.ambiguous = loose && proof === null && dayFirst == null;
  const df = dayFirst != null ? dayFirst : (proof === null ? false : proof);

  body.forEach(r => {
    const p = readDate(r[cols.date]);
    const date = p ? isoOf(p, df) : null;
    let signed = null;
    if (cols.dr != null || cols.cr != null) {
      const dr = cols.dr != null ? readAmt(r[cols.dr]) : null;
      const cr = cols.cr != null ? readAmt(r[cols.cr]) : null;
      if (dr) signed = -Math.abs(dr);
      else if (cr) signed = Math.abs(cr);
    } else if (cols.amt != null) signed = readAmt(r[cols.amt]);
    const bal = cols.bal != null ? readAmt(r[cols.bal]) : null;
    if (!date || !signed) {
      if (bal != null && /opening|beginning|starting|brought forward/i.test(r.join(' '))) st.opening = bal;
      st.skipped++;
      return;
    }
    const tm = String(r[cols.date]).match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AP]M)?/i);
    let time = '';
    if (tm) {
      let hr = +tm[1];
      if (tm[3]) { hr %= 12; if (/p/i.test(tm[3])) hr += 12; }
      time = String(hr).padStart(2, '0') + ':' + tm[2];
    }
    st.lines.push({ date: date, time: time, desc: unwrap(cols.desc != null ? r[cols.desc] : ''),
      ref: cols.ref != null ? String(r[cols.ref]).trim() : '', signed: signed, bal: bal });
  });
  return st;
}

/* Pasted text or a CSV: GCash's shape if it looks like it, a table if it has
   a header row, and the older shape-guessing reader if it has neither. */
function readText(text, dayFirst) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (looksGCash(lines)) return readGCash(lines);
  const d = delimFor(lines);
  const t = readTable(lines.map(l => splitWith(l, d)), dayFirst);
  if (t && t.lines.length) return t;
  const old = parseStatement(text, dayFirst);
  return { source: 'text', title: '', opening: null, closing: null, ids: [], skipped: old.skipped,
    ambiguous: old.ambiguous,
    lines: old.rows.map(r => ({ date: r.date, time: '', desc: r.desc, ref: '', signed: r.amt, bal: null })) };
}

/* == the truth pass ==
   Everything above only READS. This decides what actually happened. */
function settle(st) {
  const L = st.lines.map(x => Object.assign({}, x));
  /* Oldest first. A bank that prints newest first also chains its balances
     newest first, so turning the whole list round keeps the chain intact. */
  if (L.length > 1 && L[0].date > L[L.length - 1].date) L.reverse();
  const out = { real: [], holds: [], reversals: [], adjusted: 0, combined: 0, check: null };

  const hasBal = L.length > 0 && L.every(x => x.bal != null);
  if (hasBal) {
    let open = st.opening;
    if (open == null && L[0].signed != null) open = round2(L[0].bal - L[0].signed);
    let prev = open, broken = 0;
    L.forEach(x => {
      if (prev == null) { x.gone = true; broken++; prev = x.bal; return; }
      const moved = round2(x.bal - prev);
      if (x.signed != null) {
        if (Math.abs(moved - x.signed) > 0.009) { broken++; x.bad = true; }
        x.amt = x.signed;
      } else {
        x.amt = moved;
        if (Math.abs(moved) < 0.005) x.hold = true;
        else if (x.printed != null && Math.abs(Math.abs(moved) - x.printed) > 0.009) x.adjusted = true;
      }
      prev = x.bal;
    });
    const last = L[L.length - 1].bal;
    const closingOk = st.closing == null || Math.abs(st.closing - last) < 0.009;
    out.check = { balanced: true, ok: !broken && closingOk, opening: open,
      closing: st.closing != null ? st.closing : last, broken: broken + (closingOk ? 0 : 1) };
  } else {
    L.forEach(x => { x.amt = x.signed; });
    out.check = { balanced: false, ok: true };
  }

  const byRef = {};
  L.forEach(x => { if (x.ref) byRef[x.ref] = x; });
  L.forEach(x => {
    const m = String(x.desc || '').match(/^reversal of\s+(\S+)/i);
    const o = m && byRef[m[1]];
    if (o && !o.gone && !x.gone && Math.abs(o.amt + x.amt) < 0.009) {
      o.gone = x.gone = true;
      out.reversals.push({ was: o, undo: x });
    }
  });
  L.forEach(x => { if (x.hold && !x.gone) { x.gone = true; out.holds.push(x); } });

  /* A charge the wallet took in pieces is one purchase. An adjusted line folds
     into the nearest earlier line for the same merchant on the same day, so a
     ride held at ₱62 and finished at ₱93 is one ₱93 ride, not two entries. */
  const mins = x => { const t = String(x.time || '').split(':'); return t.length === 2 ? +t[0] * 60 + +t[1] : null; };
  const kept = [];
  L.filter(x => !x.gone).forEach(x => {
    if (x.adjusted) {
      out.adjusted++;
      for (let k = kept.length - 1; k >= 0 && k >= kept.length - 8; k--) {
        const p = kept[k];
        if (p.date !== x.date || p.desc !== x.desc) continue;
        const a = mins(p), c = mins(x);
        if (a != null && c != null && c - a > 90) continue;
        p.amt = round2(p.amt + x.amt);
        p.pieces = (p.pieces || 1) + 1;
        out.combined++;
        return;
      }
    }
    kept.push(x);
  });
  out.real = kept.filter(x => Math.abs(x.amt) >= 0.005);
  out.heldTotal = round2(out.holds.reduce((a, x) => a + (x.printed || 0), 0));
  out.outTotal = round2(-out.real.filter(x => x.amt < 0).reduce((a, x) => a + x.amt, 0));
  out.inTotal = round2(out.real.filter(x => x.amt > 0).reduce((a, x) => a + x.amt, 0));
  return out;
}

/* == which accounts are his ==
   An account is recognised on a statement by a number: a GCash mobile number,
   the last four digits of a bank account. They live in settings, not on the
   `acct` row, for the same reason a balance does: STATUS writes that row as
   {name, order} and would drop anything else on it. */
const idsOf = acctId => { const v = S.get('ids.' + acctId, []); return Array.isArray(v) ? v : []; };
const digitsOf = v => String(v == null ? '' : v).replace(/\D/g, '');
const sameId = (a, b) => {
  const x = digitsOf(a), y = digitsOf(b);
  if (!x || !y) return false;
  if (x === y) return true;
  return (x.length === 4 || y.length === 4) && x.slice(-4) === y.slice(-4);
};
function ownAcctIn(desc, self, extra) {
  const d = ' ' + String(desc || '') + ' ';
  for (const a of accts()) {
    if (a.id === self) continue;
    const ids = idsOf(a.id).concat((extra && extra[a.id]) || []);
    for (const id of ids) {
      const dg = digitsOf(id);
      if (dg.length < 4) continue;
      /* Four digits on their own turn up everywhere, so a short one has to be
         introduced as an account ending, not merely present. */
      const hit = dg.length === 4
        ? new RegExp('ending(?: in)?\\s*' + dg + '(\\D|$)', 'i').test(d)
        : new RegExp('(^|\\D)' + dg + '(\\D|$)').test(d);
      if (hit) return a.id;
    }
  }
  return null;
}
/* Numbers this statement sends money to or receives it from, that might be
   his. Offered as a question, once; never assumed. */
function counterparts(settled, self) {
  const found = {};
  const add = (id, label) => {
    if (!found[id]) found[id] = { id: id, label: label, n: 0 };
    found[id].n++;
  };
  settled.real.forEach(x => {
    let m;
    if ((m = x.desc.match(/from (.+?) with account ending in (\d{4})/i))) add(m[2], m[1] + ' ending in ' + m[2]);
    if ((m = x.desc.match(/to (.+?) with account ending in (\d{4})/i))) add(m[2], m[1] + ' ending in ' + m[2]);
    if ((m = x.desc.match(/to account:\s*([A-Za-z][A-Za-z .,&\/-]*?)\s+(\d{6,})/i))) add(m[2], m[1].trim() + ' ' + m[2]);
  });
  const no = S.get('notmine', []);
  return Object.values(found)
    .filter(c => !(Array.isArray(no) && no.indexOf(c.id) > -1) && !idsOf(self).some(i => sameId(i, c.id)))
    .sort((a, b) => b.n - a.n);
}
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function preselect(c, cands, self) {
  const owner = accts().find(a => a.id !== self && idsOf(a.id).some(i => sameId(i, c.id)));
  if (owner) return owner.id;
  const named = accts().find(a => a.id !== self && new RegExp('(^|\\W)' + escRe(a.name) + '(\\W|$)', 'i').test(c.label));
  if (!named) return '';
  /* The name alone is not enough — a statement also shows the one time money
     went to a mistyped number. Only the number used most often under that
     name is suggested, and he can still say no. */
  const re = new RegExp('(^|\\W)' + escRe(named.name) + '(\\W|$)', 'i');
  const top = cands.filter(x => re.test(x.label)).sort((a, b) => b.n - a.n)[0];
  return top && top.id === c.id ? named.id : '';
}
function guessAcct(st) {
  const byId = accts().find(a => idsOf(a.id).some(i => st.ids.some(j => sameId(i, j))));
  if (byId) return byId.id;
  if (st.source === 'gcash') { const g = accts().find(a => /gcash/i.test(a.name)); if (g) return g.id; }
  return '';
}

/* ══════════════════ import setup, asked once ══════════════════
   Tom, 2026-09-13: "Maybe we should have an import setup, where we can
   categorize where things like Lawson Acqua Pebbles always get categorized,
   asked once upon import first time." And: "Gcash will sometimes have
   transfers to numbers, I wont always remember this. I would like to set an
   unsure tag incase I remember in the future but treat them as one time
   transfers."

   So an import finds every payee it has never seen, asks once, and turns the
   answer into a rule. A rule already files the whole history, so one answer
   sorts every past and future payment to that name.

   Money sent to a number nobody has named is filed as a One-time transfer,
   tagged Unsure. It still counts as money out, because it left — leaving it
   out would make spending look smaller than it was. It waits under STILL
   UNSURE on the Spending screen until he remembers. */
const ONETIME = 'onetime', UNSURE = 'unsure';
const listSetting = k => { const v = S.get(k, []); return Array.isArray(v) ? v.slice() : []; };

/* Who was paid, pulled out of a description, as text a rule can match. The
   bank's wording is full of branch names, reference numbers and country
   codes; a rule keyed on "Payment" would file every GCash payment at once,
   which is exactly what the ALWAYS button used to do. */
const CITY = /\s+(?:makati|mandaluyong|mandaluyo|pasig|taguig|quezon|manila|pasay|paranaque|parañaque|muntinlupa|marikina|san juan|bgc)\b.*$/i;
function shopName(raw) {
  const whole = String(raw || '').trim();
  /* "GLoan Auto Repayment with Reference No. GL178..." is one payee, not a
     new one every month. A trailing reference number is not part of a name. */
  let n = whole.split(/,|\s+merchant transaction number/i)[0]
    .replace(/\s+with reference no\.?.*$/i, '')
    .replace(/\s+ref(?:erence)?\.?\s*(?:no\.?|number|#)?:?\s*[A-Z0-9-]{6,}$/i, '');
  n = n.replace(/\s+(?:city\s+)?(?:ph|us|sg)$/i, '').replace(/\s+pos$/i, '');
  n = n.replace(CITY, '').replace(/(?:\s+\+?\d[\d-]*)+$/, '').replace(/[-*\s]+$/, '').trim();
  return { person: false, key: n || whole, label: n || whole };
}
function payeeOf(desc) {
  const d = String(desc || '').replace(/\s+/g, ' ').trim();
  let m;
  if ((m = d.match(/^transfer from \d{10,13} to (\d{10,13})/i))) return { person: true, key: m[1], label: m[1] };
  if ((m = d.match(/^sent to (.+?)\s+([A-Z]{3})\s+\d{3,}.*?to account:\s*(.*?)\s*(\d{6,}|[A-Z0-9]{10,})?(?:\s+purpose:.*)?$/i))) {
    const name = m[1].trim(), code = m[2].toUpperCase(), no = m[4];
    /* PPI is a Maya QR payment to a shop. Any other code sends to a person's
       wallet or bank account, and that account number is who they are: the
       same number GCash prints when he sends to them from there, so one
       answer covers both statements. */
    if (code === 'PPI' && !/\*/.test(name)) return shopName(name);
    return { person: true, key: no || name, label: name + (no ? ' ' + no : '') };
  }
  /* Four digits alone turn up inside every reference number, so a rule keyed
     on them would file strangers. The words around them are part of the key. */
  if ((m = d.match(/^sent gcash to (.+?) with account ending in (\d{4})/i))) return { person: true, key: 'ending in ' + m[2], label: m[1] + ' ending in ' + m[2] };
  if ((m = d.match(/^bills payment to biller:\s*(.+)$/i))) return shopName(m[1]);
  if ((m = d.match(/^(?:bills )?payment to (.+)$/i))) return shopName(m[1]);
  if ((m = d.match(/^visae?[- ](.+)$/i))) return shopName(m[1]);
  if ((m = d.match(/^pos\s+(.+)$/i))) return shopName(m[1]);
  return shopName(d);
}

/* The payees in this import that nothing has decided yet: no rule matches
   them, and he has not already said "leave it" or seen that number. Money in
   is not asked about; a category is a question about spending. */
function setupItems(lines) {
  const skip = listSetting('skipNames'), seen = listSetting('seenNums');
  const groups = {};
  lines.forEach(x => {
    if (!(x.amt < 0) || ruleFor(x.desc)) return;
    const p = payeeOf(x.desc);
    const k = norm(p.key);
    if (!k) return;
    if ((p.person ? seen : skip).indexOf(k) > -1) return;
    if (!groups[k]) groups[k] = { k: k, key: p.key, label: p.label, person: p.person, n: 0, total: 0 };
    groups[k].n++;
    groups[k].total = round2(groups[k].total - x.amt);
  });
  return Object.values(groups).sort((a, b) => b.total - a.total);
}
/* What a line will be filed as, counting answers not yet saved. */
function fileAs(desc, setup) {
  const p = payeeOf(desc);
  const ch = setup && setup[norm(p.key)];
  if (ch && ['later', 'leave', UNSURE].indexOf(ch) < 0) return 'files as ' + esc(catName(ch));
  const r = ruleFor(desc);
  if (r) return 'files as ' + esc(catName(r.cat));
  if (p.person) return 'one-time transfer · <b>unsure</b>';
  return '<span class="stale">uncategorised</span>';
}
/* Written at apply, before anything is added, so the new rules file the new
   rows. A rule id carries a prefix so it can never replace a rule he wrote. */
function writeSetup(items, setup) {
  const skip = listSetting('skipNames'), seen = listSetting('seenNums');
  items.forEach(it => {
    const ch = setup[it.k];
    if (it.person) {
      if (ch && ch !== UNSURE) Rec.set('rule', null, 'imp-' + it.k, { match: it.key, cat: ch });
      if (seen.indexOf(it.k) < 0) seen.push(it.k);
      return;
    }
    if (!ch || ch === 'later') return;
    if (ch === 'leave') { if (skip.indexOf(it.k) < 0) skip.push(it.k); return; }
    Rec.set('rule', null, 'imp-' + norm(it.key), { match: it.key, cat: ch });
  });
  S.set('skipNames', skip);
  S.set('seenNums', seen);
  ruleCache = null;
}

/* == lines a statement saved twice ==
   Tom, 2026-09-14: "Why am I seeing duplicate transactions?" Because Apply
   ran twice on his first GCash import (see the guard on that button). Every
   copy carries the statement line's fingerprint, and a fingerprint holding
   the bank's reference number names one real line, so two rows with it are
   one payment. Lines with no reference are left alone: two ₱93 rides on one
   day can share a fingerprint and both be real.

   The copy kept is the one changed most recently, counting its category, so
   anything he fixed by hand survives. The "already imported" record is
   pointed at it, so the next import still recognises the line. */
function savedTwice() {
  const groups = {};
  ['spend', 'paid', 'xfer'].forEach(type => Rec.all(type, {}).forEach(r => {
    const p = r.payload || {};
    (type === 'xfer' ? Object.values(p.stmt || {}) : [p.stmt]).forEach(fp => {
      if (!fp || String(fp).indexOf('|ref:') < 0) return;
      const k = type + '#' + fp;
      (groups[k] = groups[k] || []).push({ type: type, date: r.date, key: r.key, fp: fp, amt: num(p.amt, 0) });
    });
  }));
  return Object.values(groups).filter(g => g.length > 1);
}
function removeSavedTwice(groups) {
  const gone = [], recons = [], kept = {}, dropped = {};
  const id = x => x.type + '|' + x.date + '|' + x.key;
  const touched = x => {
    const a = (Rec.row(x.type, x.date, x.key) || {}).updated_at || 0;
    const m = (Rec.row('mark', null, x.date + '|' + x.key) || {}).updated_at || 0;
    return a > m ? a : m;
  };
  groups.forEach(g => {
    const rc = recon(g[0].fp);
    const live = g.filter(x => !dropped[id(x)]);
    if (live.length < 2) return;
    const keep = live.slice().sort((a, b) => {
      const ta = touched(a), tb = touched(b);
      if (ta !== tb) return tb > ta ? 1 : -1;
      return (rc && rc.spend === b.key ? 1 : 0) - (rc && rc.spend === a.key ? 1 : 0);
    })[0];
    kept[id(keep)] = 1;
    if (rc && rc.spend !== keep.key) {
      recons.push({ fp: g[0].fp, was: rc });
      Rec.set('recon', null, g[0].fp, merge(rc, { spend: keep.key }));
    }
    live.forEach(x => {
      if (x === keep || kept[id(x)]) return;
      const row = Rec.get(x.type, x.date, x.key);
      if (!row) return;
      const mk = Rec.get('mark', null, x.date + '|' + x.key);
      gone.push({ x: x, row: row, mk: mk });
      dropped[id(x)] = 1;
      Rec.del(x.type, x.date, x.key);
      if (mk) Rec.del('mark', null, x.date + '|' + x.key);
    });
  });
  return {
    n: gone.length,
    undo: () => {
      gone.forEach(g => {
        Rec.set(g.x.type, g.x.date, g.x.key, g.row);
        if (g.mk) Rec.set('mark', null, g.x.date + '|' + g.x.key, g.mk);
      });
      recons.forEach(r => Rec.set('recon', null, r.fp, r.was));
      draw();
    },
  };
}
function drawTwice(m) {
  const groups = savedTwice();
  if (!groups.length) return;
  const extra = groups.reduce((a, g) => a + g.length - 1, 0);
  const out = groups.filter(g => g[0].type === 'spend').reduce((a, g) => a + g[0].amt * (g.length - 1), 0);
  const c = card('SAVED TWICE', 'full');
  c.appendChild(el('div', 'note', '<b>' + extra + '</b> line' + (extra === 1 ? '' : 's') +
    ' from a statement ' + (extra === 1 ? 'was' : 'were') + ' saved more than once' +
    (out ? ', adding <b>' + esc(money(out)) + '</b> of spending that did not happen' : '') +
    '. Each copy has the same bank reference number, so they are one payment, not two. ' +
    'The copy you changed most recently is kept, with its category.'));
  const go = el('button', 'btn go mb-press mb-tap', 'Remove the extra copies');
  go.type = 'button';
  go.onclick = () => UI.confirm('Remove ' + extra + ' extra cop' + (extra === 1 ? 'y' : 'ies') + '?',
    'One copy of each stays. You can undo this straight after.', { yes: 'REMOVE' }).then(ok => {
    if (!ok) return;
    const res = removeSavedTwice(savedTwice());
    Mobile.feedback('success');
    UI.undo('removed <b>' + res.n + '</b> extra cop' + (res.n === 1 ? 'y' : 'ies'), res.undo, { ms: 15000 });
    draw();
  });
  const btns = el('div', 'rowbtns');
  btns.appendChild(go);
  c.appendChild(btns);
  m.appendChild(c);
}

/* == the transfers still waiting for a name == */
function drawUnsure(m) {
  const rows = spendRows({}).filter(x => tagOf(x) === UNSURE)
    .sort((a, b) => b.date.localeCompare(a.date) || num(b.t, 0) - num(a.t, 0));
  if (!rows.length) return;
  const c = card('STILL UNSURE');
  const total = rows.reduce((a, x) => a + num(x.amt, 0), 0);
  c.appendChild(el('div', 'note', '<b>' + rows.length + '</b> transfer' + (rows.length === 1 ? '' : 's') + ', ' +
    esc(money(total)) + ', not recognised when they came in. They count as money out. Tap one if you remember what it was.'));
  const l = el('div', 'list');
  rows.slice(0, 12).forEach(x => {
    const r = itemRow(payeeOf(x.bank || x.note).label, Day.short(x.date) + ' · ' + esc(acctName(x.acct)), money(num(x.amt, 0)));
    r.onclick = () => spendSheet(x); r.menu = () => spendMenu(x);
    l.appendChild(r);
  });
  if (rows.length > 12) l.appendChild(el('div', 'note', 'and ' + (rows.length - 12) + ' more, in the list below.'));
  c.appendChild(l);
  m.appendChild(c);
}

/* ── deciding what each line is ──
   Certainty is deliberately narrow. Anything looser gets asked about, because
   a wrong automatic merge is invisible and a question costs three seconds.
   `extra` is the account numbers he has just confirmed but not yet saved:
   nothing is written until apply, and the plan still has to use them. */
function planImport(rows, acctId, extra) {
  const out = { known: [], certain: [], ask: [], fresh: [], xnew: [], xlink: [] };
  const taken = {};
  const pend = [];
  rows.forEach(line => {
    const id = stmtId(acctId, line.date, line.amt, line.desc, line.ref);
    const seen = recon(id);
    if (seen) { out.known.push({ line: line, id: id, was: seen }); return; }
    const money_ = Math.abs(line.amt), isOut = line.amt < 0;

    const other = ownAcctIn(line.desc, acctId, extra);
    if (other) {
      const from = isOut ? acctId : other, to = isOut ? other : acctId;
      const ex = xfers({ from: Day.shift(line.date, -2), to: Day.shift(line.date, 2) }).find(x =>
        x.from === from && x.to === to && Math.abs(num(x.amt, 0) - money_) < 0.009 &&
        !(x.stmt && x.stmt[acctId]) && !taken['x|' + x.date + '|' + x.key]);
      if (ex) {
        taken['x|' + ex.date + '|' + ex.key] = 1;
        out.xlink.push({ line: line, id: id, match: ex, from: from, to: to });
      } else {
        out.xnew.push({ line: line, id: id, from: from, to: to });
      }
      return;
    }

    /* Rows not already reconciled on a past import. Nothing is claimed yet:
       that happens below, once every line in the statement has been seen. */
    const pool = (isOut ? spendRows({ from: Day.shift(line.date, -12), to: Day.shift(line.date, 12) })
                        : paidRows({ from: Day.shift(line.date, -12), to: Day.shift(line.date, 12) }))
      .filter(x => !x.stmt);

    const score = x => {
      const gap = Math.abs(Day.diff(x.date, line.date));
      const d = Math.abs(num(x.amt, 0) - money_);
      const sameAcct = x.acct === acctId;
      if (d < 0.005 && gap <= 3 && sameAcct) return { rank: 3, gap: gap, d: d };
      if (d < 0.005 && gap <= 10) return { rank: 2, gap: gap, d: d };
      if (d <= Math.max(2, money_ * 0.01) && gap <= 5) return { rank: 1, gap: gap, d: d };
      return null;
    };
    const cands = pool.map(x => ({ row: x, s: score(x) })).filter(x => x.s)
      .sort((a, b) => b.s.rank - a.s.rank || a.s.gap - b.s.gap || a.s.d - b.s.d);

    pend.push({ line: line, id: id, kind: isOut ? 'out' : 'in', cands: cands });
  });

  /* == matches are decided for the whole statement at once ==
     The first version decided line by line, in date order, and anything with
     the same account and amount within three days was "certain". On Tom's
     real GCash file that merged his hand-logged "Angkas home ₱93" on the 6th
     into a "Bancnet P2M Send ₱93" on the 5th, moved his entry there, and then
     added the real Angkas ride as a second row. Every total still balanced,
     which is exactly why no arithmetic check could have caught it.

     So an automatic merge now needs the SAME DAY, and no evidence against it:
     when both sides know the time, the times agree within 45 minutes or a word
     of the shop name matches. When several lines want one logged entry, only
     a line the clock or the name clearly picks may take it. Anything short of
     that is a question, and a question costs three seconds. */
  const K = r => r.date + '|' + r.key;
  const lineMins = l => { const t = String(l.time || '').split(':'); return t.length === 2 ? +t[0] * 60 + +t[1] : null; };
  const rowMins = r => { const t = num(r.t, 0); if (!t) return null; const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };
  const STOP = ['payment', 'transfer', 'received', 'from', 'with', 'account', 'ending', 'send', 'sent', 'bills', 'gcash', 'visa', 'philippines'];
  const words = s => String(s || '').toLowerCase().split(/[^a-z]+/).filter(w => w.length >= 4 && STOP.indexOf(w) < 0);
  const agrees = (l, r) => { const a = words(l.desc), b = words(r.note).concat(words(r.bank)); return a.some(w => b.indexOf(w) > -1); };
  const clock = (l, r) => { const lm = lineMins(l), rm = rowMins(r); return lm != null && rm != null ? Math.abs(rm - lm) : null; };
  const strong = (l, r) => { const c = clock(l, r); return (c != null && c <= 45) || agrees(l, r); };
  const noAgainst = (l, r) => clock(l, r) == null || strong(l, r);

  pend.forEach(p => { p.same = p.cands.filter(c => c.s.rank === 3 && c.s.gap === 0).map(c => c.row); });
  const wanted = {};
  pend.forEach((p, i) => p.same.forEach(r => { (wanted[K(r)] = wanted[K(r)] || []).push(i); }));
  const pickFor = (p, i) => {
    if (!p.same.length) return null;
    const fit = p.same.length === 1 ? p.same.filter(r => noAgainst(p.line, r)) : p.same.filter(r => strong(p.line, r));
    if (fit.length !== 1) return null;
    const r = fit[0];
    const rivals = wanted[K(r)].filter(j => j !== i);
    if (!rivals.length) return r;
    if (!strong(p.line, r)) return null;
    return rivals.some(j => strong(pend[j].line, r)) ? null : r;
  };
  const claimed = {};
  pend.forEach((p, i) => {
    const r = pickFor(p, i);
    if (r && !claimed[K(r)]) { claimed[K(r)] = 1; p.done = true; out.certain.push({ line: p.line, id: p.id, match: r, kind: p.kind }); }
  });
  pend.forEach(p => {
    if (p.done) return;
    const open = p.cands.filter(c => !claimed[K(c.row)]).map(c => c.row);
    if (open.length) out.ask.push({ line: p.line, id: p.id, cands: open.slice(0, 3), kind: p.kind });
    else out.fresh.push({ line: p.line, id: p.id, kind: p.kind });
  });
  return out;
}

/* ── writing the master entry ──
   His fields survive. The bank's version of the facts wins on the facts. */
function mergeStatement(hit, acctId) {
  const type = hit.kind === 'out' ? 'spend' : 'paid';
  const row = Rec.get(type, hit.match.date, hit.match.key);
  if (!row) return;
  const want = Math.abs(hit.line.amt);
  Rec.set(type, hit.match.date, hit.match.key, merge(row, {
    amt: want, acct: type === 'spend' ? acctLabel(acctId) : acctId, stmt: hit.id, bank: hit.line.desc,
  }));
  /* The bank's date is the date it cleared, and a row's date is its key, so
     moving it means rewriting it. Only done when they actually differ. */
  if (hit.match.date !== hit.line.date) {
    const moved = Rec.get(type, hit.match.date, hit.match.key);
    const mk = markOf({ date: hit.match.date, key: hit.match.key });
    Rec.del(type, hit.match.date, hit.match.key);
    Rec.set(type, hit.line.date, hit.match.key, moved);
    if (Object.keys(mk).length) {
      Rec.del('mark', null, hit.match.date + '|' + hit.match.key);
      Rec.set('mark', null, hit.line.date + '|' + hit.match.key, mk);
    }
  }
  Rec.set('recon', null, hit.id, { d: hit.line.desc, amt: hit.line.amt, acct: acctId,
    kind: hit.kind, spend: hit.match.key, sdate: hit.line.date });
}
function addStatement(hit, acctId) {
  const key = newId();
  const amt = Math.abs(hit.line.amt);
  const t = stampFor(hit.line.date, hit.line.time || '');
  if (hit.kind === 'out') {
    Rec.set('spend', hit.line.date, key, { amt: amt, acct: acctLabel(acctId), note: hit.line.desc,
      t: t, src: 'stmt', stmt: hit.id, bank: hit.line.desc, ref: hit.line.ref || undefined });
    const r = ruleFor(hit.line.desc);
    if (r) setMark({ date: hit.line.date, key: key }, { cat: r.cat });
    /* Money sent to a number nobody has named: a one-time transfer, tagged
       Unsure, until he remembers. It still counts as money out. */
    else if (payeeOf(hit.line.desc).person) setMark({ date: hit.line.date, key: key }, { cat: ONETIME, tag: UNSURE });
  } else {
    Rec.set('paid', hit.line.date, key, { amt: amt, acct: acctId, client: '',
      note: hit.line.desc, t: t, src: 'stmt', stmt: hit.id, bank: hit.line.desc, ref: hit.line.ref || undefined });
  }
  Rec.set('recon', null, hit.id, { d: hit.line.desc, amt: hit.line.amt, acct: acctId,
    kind: hit.kind, spend: key, sdate: hit.line.date });
}
const skipStatement = (hit, acctId) => Rec.set('recon', null, hit.id,
  { d: hit.line.desc, amt: hit.line.amt, acct: acctId, kind: hit.kind, skip: 1 });

/* One transfer row per real movement, however many statements show it. */
function writeTransfer(hit, acctId) {
  const key = newId();
  const stmt = {};
  stmt[acctId] = hit.id;
  Rec.set('xfer', hit.line.date, key, { from: hit.from, to: hit.to, amt: Math.abs(hit.line.amt),
    note: hit.line.desc, t: stampFor(hit.line.date, hit.line.time || ''), stmt: stmt });
  Rec.set('recon', null, hit.id, { d: hit.line.desc, amt: hit.line.amt, acct: acctId,
    kind: 'xfer', spend: key, sdate: hit.line.date });
}
function linkTransfer(hit, acctId) {
  const row = Rec.get('xfer', hit.match.date, hit.match.key);
  if (!row) return writeTransfer(hit, acctId);
  const stmt = Object.assign({}, row.stmt || {});
  stmt[acctId] = hit.id;
  Rec.set('xfer', hit.match.date, hit.match.key, merge(row, { stmt: stmt }));
  Rec.set('recon', null, hit.id, { d: hit.line.desc, amt: hit.line.amt, acct: acctId,
    kind: 'xfer', spend: hit.match.key, sdate: hit.match.date });
}

/* ══════════════════ the picker: autofill, law 4 ══════════════════
   Typing filters what exists. It never creates by being typed into, because
   that is exactly how "Grab" and "grab" become two things. Creating is a
   separate deliberate press, and it refuses a near-match.                  */
function picker(opts) {
  const box = el('div', 'pick');
  const input = UI.field('search', { placeholder: opts.placeholder || 'Type to find' });
  const list = el('div', 'opts');
  box.appendChild(input); box.appendChild(list);
  let value = opts.value || '';
  box.get = () => value;

  function paint() {
    const q = norm(input.value);
    list.innerHTML = '';
    const items = (opts.items || []).filter(it => !q || norm(it.name).indexOf(q) > -1);
    items.slice(0, 40).forEach(it => {
      const b = el('button', it.id === value ? 'on mb-tap' : 'mb-tap',
        esc(it.name) + (it.note ? '<small>' + esc(it.note) + '</small>' : ''));
      b.type = 'button';
      b.onclick = () => { value = it.id; Mobile.feedback('select'); paint(); opts.onPick && opts.onPick(it.id, it); };
      list.appendChild(b);
    });
    if (!items.length && !input.value.trim()) list.appendChild(el('div', 'empty', esc(opts.none || 'Nothing here yet.')));
    if (opts.onCreate && input.value.trim()) {
      const raw = input.value.trim();
      const dupe = (opts.items || []).find(it => norm(it.name) === norm(raw));
      if (dupe) {
        /* The whole point of law 4. He typed something that already exists in
           all but punctuation, so offer the existing one rather than a second. */
        if (!items.some(it => it.id === dupe.id)) {
          const b = el('button', 'mb-tap', esc(dupe.name) + '<small>already exists</small>');
          b.type = 'button';
          b.onclick = () => { value = dupe.id; paint(); opts.onPick && opts.onPick(dupe.id, dupe); };
          list.appendChild(b);
        }
      } else if (items.some(it => norm(it.name).indexOf(norm(raw)) === 0)) {
        /* What he typed is the start of something that already exists, so he
           is mid-word, not naming a new thing. Offering to create here is how
           "Grocer" ends up sitting next to "Groceries" forever. */
      } else {
        const b = el('button', 'mk mb-tap', 'Add “' + esc(raw) + '” as new');
        b.type = 'button';
        b.onclick = () => {
          const id = opts.onCreate(raw);
          if (!id) return;
          value = id; input.value = ''; Mobile.feedback('success');
          paint(); opts.onPick && opts.onPick(id, { id: id, name: raw });
        };
        list.appendChild(b);
      }
    }
  }
  input.oninput = paint;
  paint();
  return box;
}
/* A row of chips for a short fixed list. Same job as the picker, without the
   typing, for anything with under about eight options. */
function chipRow(items, value, onPick, opts) {
  const box = el('div', 'chips');
  let cur = value;
  const paint = () => {
    box.innerHTML = '';
    ((opts && opts.blank) ? [{ id: '', name: opts.blank }] : []).concat(items).forEach(it => {
      const b = el('button', 'chip mb-tap' + (it.id === cur ? ' on' : ''), esc(it.name));
      b.type = 'button';
      b.onclick = () => { cur = it.id; Mobile.feedback('select'); paint(); onPick && onPick(cur); };
      box.appendChild(b);
    });
  };
  paint();
  box.get = () => cur;
  return box;
}
function fld(label, node) {
  const w = el('div', 'fld');
  /* A money field says which currency it is in, because in the alt view every
     other number on the screen is in the other one and an unlabelled box is a
     trap. */
  const isMoney = node && node.dataset && node.dataset.money === '1';
  w.appendChild(el('label', null, esc(label) +
    (isMoney && Cur.ready() ? ' <span style="color:var(--accent)">' +
      esc(Cur.sym(Cur.base()).trim() + ' ' + Cur.base()) + '</span>' : '')));
  w.appendChild(node);
  if (isMoney && Cur.ready()) {
    /* Typing stays in the base currency so a round trip cannot lose anything.
       The other figure sits underneath, live, so both are on screen and only
       one of them is a fact. */
    const hint = el('div', 'note', '');
    const paint = () => {
      const v = num(node.value, 0);
      hint.innerHTML = v ? '≈ <b>' + esc(Cur.sym(Cur.alt()) +
        (v / Cur.rate()).toFixed(2)) + '</b> at your rate' : '';
    };
    node.addEventListener('input', paint);
    paint();
    w.appendChild(hint);
  }
  return w;
}

/* ══ creating the small named things ══
   Every one of these refuses a near-duplicate, which is what makes the picker
   above safe to type into. */
function makeCat(name, grp) {
  if (cats().some(c => norm(c.name) === norm(name))) { UI.toast('there is already a category called <b>' + esc(name) + '</b>', { bad: true }); return null; }
  const id = norm(name) || newId();
  Rec.set('cat', null, id, { name: name, grp: grp || 'var', ord: cats().length });
  return id;
}
function makeTag(name) {
  if (tags().some(t => norm(t.name) === norm(name))) { UI.toast('that tag already exists', { bad: true }); return null; }
  const id = norm(name) || newId();
  Rec.set('wtag', null, id, { name: name });
  return id;
}
function makeAcct(name) {
  if (accts().some(a => norm(a.name) === norm(name))) { UI.toast('there is already an account called <b>' + esc(name) + '</b>', { bad: true }); return null; }
  const id = norm(name) || newId();
  /* STATUS keys accounts by the lowercased name and stores {name, order}.
     Match that shape exactly: a second app inventing its own would give him
     two accounts with one name. */
  Rec.set('acct', null, id, { name: name, order: accts().length });
  return id;
}
function makeClient(name) {
  if (clients().some(c => norm(c.name) === norm(name))) { UI.toast('you already have a client called <b>' + esc(name) + '</b>', { bad: true }); return null; }
  const id = newId();
  Rec.set('client', null, id, { name: name, rate: 0, cycle: 'month', every: 1, start: Day.today(), status: 'on' });
  return id;
}

/* == the switch in the header ==
   In the header rather than buried in settings, because a view you flip to
   check something and flip straight back is not a setting, it is a control.
   It shows the code it will switch TO, so the button says what pressing it
   does rather than where you already are. */
function drawCurBtn() {
  const b = document.getElementById('curBtn');
  if (!b) return;
  if (!Cur.ready()) { b.style.display = 'none'; return; }
  b.style.display = '';
  const to = Cur.inAlt() ? Cur.base() : Cur.alt();
  b.textContent = Cur.sym(Cur.code()).trim() + ' → ' + to;
  b.setAttribute('aria-label', 'Show every amount in ' + Cur.name(to));
  b.title = 'Showing ' + Cur.name(Cur.code()) + '. Press to read everything in ' +
    Cur.name(to) + '.';
}
function toggleCur() {
  if (!Cur.ready()) return openSettings('money');
  Cur.flip(!Cur.inAlt());
  UI.toast('showing every amount in <b>' + esc(Cur.name(Cur.code())) + '</b>' +
    (Cur.inAlt()
      ? ' at ' + esc(Cur.sym(Cur.base()) + Cur.rate().toLocaleString()) +
        ' to one ' + esc(Cur.sym(Cur.alt()).trim())
      : ''));
}

/* == the MONEY tab in settings == */
function openSettings(start) {

}
function drawMoneyTab(pane) {
  const redraw = () => { pane.innerHTML = ''; drawMoneyTab(pane); drawCurBtn(); draw(); };
  const curList = CURRENCIES.map(c => ({ id: c[0], name: c[0] + '  ' + c[1].trim(), note: c[2] }));

    'Everything is stored in this one, always. Changing it re-labels what is on screen ' +
    'and does <b>not</b> convert anything you have already entered, because the app cannot know ' +
    'which of those amounts were really in another currency.'));

    items: curList, value: Cur.base(), placeholder: 'Type a code or a name',

    placeholder: 'Type a code or a name',
    onPick: v => { S.set('cur.alt', v); redraw(); },

  pane.appendChild(fld('Second currency', alt));

  const rate = amountField(Cur.rate() || '', true);

    Cur.name(Cur.alt()), rate));

  const save = el('button', 'btn go wide mb-press mb-tap', 'Save the rate');
  save.type = 'button';

  const btns = el('div', 'rowbtns');

  pane.appendChild(btns);

  /* This is his figure and the app says so, every time, including how old it
     is. A converted number that looks live and is four months out is exactly
     the kind of quiet lie law 1 exists to stop. */
  const age = Cur.age();
  pane.appendChild(el('div', 'note', Cur.rate()
    ? 'This is <b>your</b> rate, not a live one. Nothing here goes near a network. ' +
      (age == null ? '' : age > RATE_STALE
        ? '<span class="stale">You set it ' + age + ' days ago.</span> Worth checking.'
        : 'Set ' + (age ? age + ' days ago' : 'today') + '.')
    : 'Put in a rate and a button appears in the header to read every amount in ' +
      esc(Cur.name(Cur.alt())) + ' and back again.'));

  if (Cur.ready()) {
    pane.appendChild(el('h2', null, 'WHICH ONE YOU ARE READING'));
    pane.appendChild(UI.row('Show everything in ' + Cur.name(Cur.alt()) + 's',
      'A view only. Nothing is converted in storage, so flipping it twice always lands exactly where it started. ' +
      'Typing stays in ' + esc(Cur.name(Cur.base())) + 's either way, with the other figure shown underneath as you type.',
      UI.toggle(Cur.inAlt(), v => { S.set('cur.view', v ? 1 : 0); drawCurBtn(); draw(); })));
    const ex = 1000;
    pane.appendChild(el('div', 'note', 'So ' + esc(Cur.sym(Cur.base())) + '1,000 reads as <b>' +
      esc(Cur.sym(Cur.alt()) + (ex / Cur.rate()).toFixed(2)) + '</b>.'));
  }
}
