    for (let n = 1; n <= doc.numPages; n++) {
      say('Reading page ' + n + ' of ' + doc.numPages + ' as a picture…');
      const page = await doc.getPage(n);
      const vp = page.getViewport({ scale: 3 });
      const cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      const words = (await worker.recognize(cv)).data.words
        .map(w => ({ t: String(w.text || '').trim(), x: w.bbox.x0, y: (w.bbox.y0 + w.bbox.y1) / 2, h: w.bbox.y1 - w.bbox.y0, c: w.confidence }))
        .filter(w => w.t).sort((a, b) => a.y - b.y);
      const lines = [];
      words.forEach(w => {
        const L = lines[lines.length - 1];
        if (L && Math.abs(w.y - L.y) < Math.max(L.h, w.h) * 0.6) { L.w.push(w); L.h = Math.max(L.h, w.h); }
        else lines.push({ y: w.y, h: w.h, w: [w] });
      });
      lines.forEach(L => L.w.sort((a, b) => a.x - b.x));
      const pad = vp.width * 0.008;
      let head = false, row = null, lastY = 0;
      lines.forEach(L => {
        const text = L.w.map(w => w.t).join(' ');
        const at = re => (L.w.find(w => re.test(w.t)) || {}).x;
        if (/\bdate\b/i.test(text) && /\bbalance\b/i.test(text) && /\b(debit|credit|amount)\b/i.test(text)) {
          const x = { date: at(/^date$/i), ref: at(/^ref/i), desc: at(/^(description|particulars|details)$/i),
            dr: at(/^debit$/i), cr: at(/^credit$/i), bal: at(/^balance$/i) };
          if (x.date != null && x.desc != null && x.bal != null && x.dr != null && x.cr != null) {
            cols = x;
            if (!grid.some(r => r[0] === 'Date')) grid.push(['Date', 'Ref. No.', 'Description', 'Debit', 'Credit', 'Balance']);
          }
          head = true; row = null;
          return;
        }
        if (!cols || !head) {
          const m = text.match(/^(.*?account\s*(?:no\.?|number|#))\s*[:.]?\s*(.*\d.*)$/i);
          if (m) grid.push([m[1].trim(), m[2].trim()]);
          return;
        }
        const b1 = (cols.ref != null ? cols.ref : cols.desc) - pad, b2 = cols.desc - pad,
              b3 = cols.dr - pad, b4 = cols.cr - pad, b5 = (cols.cr + cols.bal) / 2;
        const cell = w => w.x < b1 ? 0 : w.x < b2 ? 1 : w.x < b3 ? 2 : w.x < b4 ? 3 : w.x < b5 ? 4 : 5;
        const first = L.w[0];
        if (cell(first) === 0 && /^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}$/.test(first.t)) {
          row = ['', '', '', '', '', ''];
          L.w.forEach(w => { const i = cell(w); row[i] = row[i] ? row[i] + ' ' + w.t : w.t; });
          row[1] = cleanRef(row[1]);
          grid.push(row);
          lastY = L.y;
          return;
        }
        /* Noise Tesseract is unsure of, like the edge of a shaded bar, is
           neither a line of its own nor the end of the one above. */
        const good = L.w.filter(w => w.c >= 40);
        if (!good.length) return;
        if (row && good.every(w => cell(w) === 2) && L.y - lastY < L.h * 3) {
          row[2] = (row[2] + ' ' + good.map(w => w.t).join(' ')).trim();
          lastY = L.y;
          return;
        }
        row = null;
      });
    }
  } finally {
    await worker.terminate();
  }
  return grid;
}

/* == GCash's own shape ==
   A timestamp, a description that can run over two lines, then a reference
   number, ONE amount with no sign, and the balance after it. Which way the
   money went is not printed anywhere; only the balance says. */
const GC_START = /^(\d{4}-\d{2}-\d{2}) (\d{1,2}):(\d{2}) ([AP]M)\s*(.*)$/;
const GC_TAIL = /^(.*?)\s*(\d{10,16})\s+(-?[\d,]+\.\d{2})\s+(-?[\d,]+\.\d{2})$/;
const looksGCash = lines => lines.filter(l => GC_START.test(l)).length >= 3 &&
  lines.some(l => /balance/i.test(l));

function readGCash(lines) {
  const st = { source: 'gcash', title: lines.find(l => /transaction history/i.test(l)) || 'GCash statement',
    opening: null, closing: null, lines: [], ids: [], skipped: 0 };
  let cur = null;
  lines.forEach(l => {
    let m;
    if ((m = l.match(/^STARTING BALANCE\s+(-?[\d,]+\.\d{2})$/i))) { st.opening = num(m[1]); return; }
    if ((m = l.match(/^ENDING BALANCE\s+(-?[\d,]+\.\d{2})$/i))) { st.closing = num(m[1]); cur = null; return; }
    if (/^(total debit|total credit|date and time)/i.test(l)) return;
    if ((m = l.match(GC_START))) {
      if (cur) st.skipped++;                      /* a record that never found its amount */
      let hr = +m[2] % 12;
      if (m[4] === 'PM') hr += 12;
      cur = { date: m[1], time: String(hr).padStart(2, '0') + ':' + m[3], desc: '', ref: '', printed: null, bal: null, signed: null };
      l = m[5];
      if (!l) return;
    }
    if (!cur) return;
    const t = l.match(GC_TAIL);
    if (t) {
      if (t[1]) cur.desc += (cur.desc ? ' ' : '') + t[1];
      cur.ref = t[2];
      cur.printed = Math.abs(num(t[3], 0));
      cur.bal = num(t[4], 0);
      st.lines.push(cur);
      cur = null;
    } else {
      cur.desc += (cur.desc ? ' ' : '') + l;
    }
  });
  /* Whose wallet this is: the number money is most often sent FROM. */
  const from = {};
  st.lines.forEach(x => {
    const m = x.desc.match(/transfer from (\d{10,13}) to/i);
    if (m) from[m[1]] = (from[m[1]] || 0) + 1;
  });
  const own = Object.keys(from).sort((a, b) => from[b] - from[a])[0];
  if (own) st.ids.push(own);
  return st;
}

/* == a screenshot of the app's own history ==
   Tom, 2026-09-23: "the problem with the statements is they dont take
   today's entries, the screens are to fix that." A statement stops at the
   day it was made; the GCash and UnionBank apps show today as it happens.

   Read by Tesseract like a picture PDF. Two shapes, told apart by order:
   GCash puts the day ABOVE its lines ("Today", "Yesterday") with the time
   above each line; UnionBank puts the date UNDER each line and no time.
   A screenshot has no balance, so nothing checks its figures but him. That
   is why every line it writes stays open for the statement: the row is not
   linked to anything, the statement's own line merges into it when it
   arrives, and a screenshot line the statement never shows is offered for
   removal then. The bank's numbers still win, a day late. */
function shotDate(s) {
  const m = String(s || '').match(/^(?:as of\s+)?([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/i);
  if (!m) return null;
  const mo = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase());
  if (mo < 0 || +m[2] < 1 || +m[2] > 31) return null;
  return m[3] + '-' + String(mo + 1).padStart(2, '0') + '-' + String(+m[2]).padStart(2, '0');
}
/* An amount at the end of a line, with whatever sign the app printed.
   "- PHP 94.00", "+2,000.00", "PHP 148.00". A comma read as a dot is still
   grouping: only the last two digits after the last dot are centavos. */
const SHOT_AMT = /(?:^|\s)([+\-–—~])?\s*(?:PH[PF]|P|₱)?\s*(\d[\d,.]*[.,]\d{2})$/i;
function shotLines(img) {
  return img.data.words
    .map(w => ({ t: String(w.text || '').trim(), x: w.bbox.x0, y: (w.bbox.y0 + w.bbox.y1) / 2, h: w.bbox.y1 - w.bbox.y0 }))
    .filter(w => w.t).sort((a, b) => a.y - b.y)
    .reduce((lines, w) => {
      const L = lines[lines.length - 1];
      if (L && Math.abs(w.y - L.y) < Math.max(L.h, w.h) * 0.6) { L.w.push(w); L.h = Math.max(L.h, w.h); }
      else lines.push({ y: w.y, h: w.h, w: [w] });
      return lines;
    }, [])
    .map(L => L.w.sort((a, b) => a.x - b.x).map(w => w.t).join(' ').replace(/\s+/g, ' ').trim());
}
function readShot(lines, carry) {
  const out = { recs: [], app: '', asOf: null, cut: 0, nosign: 0, date: carry.date || null };
  if (lines.some(l => /\bPH[PF]\s*\d/i.test(l) || /^visa/i.test(l))) out.app = 'ub';
  else if (lines.some(l => /^(send money|pay via|bills payment|received money|cash in|gcredit|gsave)/i.test(l.replace(SHOT_AMT, '').trim()))) out.app = 'gcash';
  const today = carry.today;
  const dayOf = l => {
    if (/^today$/i.test(l)) return today;
    if (/^yesterday$/i.test(l)) return Day.shift(today, -1);
    return shotDate(l);
  };
  let asOf = null;
  lines.forEach(l => { const m = l.match(/^as of\s+(.+)$/i); if (m && shotDate(m[1])) asOf = shotDate(m[1]); });
  if (asOf) { out.asOf = asOf; carry.today = asOf; }
  /* Dates under their lines when there is roughly one date per amount. */
  const nAmt = lines.filter(l => SHOT_AMT.test(l)).length;
  const nDay = lines.filter(l => !/^as of/i.test(l) && dayOf(l)).length;
  const after = out.app === 'ub' || (nDay >= 2 && nDay >= nAmt - 1 && !lines.some(l => /^(today|yesterday)$/i.test(l)));
  let open = null, time = '';
  lines.forEach(l => {
    if (/^as of/i.test(l)) return;
    const d = dayOf(l);
    if (d) {
      if (after) { if (open) { open.date = d; out.recs.push(open); open = null; } }
      else { out.date = d; time = ''; }
      return;
    }
    const tm = l.match(/^(\d{1,2}):(\d{2})\s*([AP])\.?M\.?$/i);
    if (tm) {
      let hr = +tm[1] % 12;
      if (/p/i.test(tm[3])) hr += 12;
      time = String(hr).padStart(2, '0') + ':' + tm[2];
      return;
    }
    const a = l.match(SHOT_AMT);
    if (a) {
      if (after && open) out.cut++;            /* a line whose date never came */
      const digits = a[2].replace(/[.,](\d{2})$/, '|$1').replace(/[.,]/g, '').replace('|', '.');
      const n = num(digits, 0);
      const desc = l.slice(0, l.length - a[0].length).trim();
      let sign = a[1] ? (a[1] === '+' ? 1 : -1) : 0;
      /* UnionBank prints money in with no sign at all. GCash signs every
         line, so a missing one there is a misread, and a misread sign would
         turn a payment into income. That line is left out and counted. */
      if (!sign) { if (out.app === 'ub') sign = 1; else { out.nosign++; time = ''; return; } }
      if (!n) return;
      const rec = { date: after ? null : out.date, time: time, desc: desc, signed: round2(sign * n) };
      time = '';
      if (after) open = rec;
      else if (rec.date) out.recs.push(rec);
      else out.cut++;
      return;
    }
    if (after && open) open.desc = (open.desc + ' ' + l).trim();
  });
  if (open) out.cut++;
  carry.date = out.date;
  return out;
}
/* Screenshots taken while scrolling overlap. The lines the next picture
   starts with that the last one ended on are the same lines, not new ones. */
function joinShots(lists) {
  const k = r => r.date + '|' + r.time + '|' + r.signed + '|' + norm(r.desc);
  return lists.reduce((all, b) => {
    let best = 0;
    for (let n = Math.min(all.length, b.length); n > 0; n--) {
      let ok = true;
      for (let i = 0; i < n && ok; i++) ok = k(all[all.length - n + i]) === k(b[i]);
      if (ok) { best = n; break; }
    }
    return all.concat(b.slice(best));
  }, []);
}
async function ocrShots(files, say) {
  const T = await loadLib('ocr');
  if (!T) throw new Error('The reader for pictures would not load, which usually means no internet. Try again with a connection.');
  const worker = await T.createWorker('eng');
  const lists = [], carry = { today: Day.today(), date: null };
  const st = { source: 'shot', title: '', opening: null, closing: null, lines: [], ids: [], skipped: 0, app: '', cut: 0, nosign: 0 };
  try {
    for (let i = 0; i < files.length; i++) {
      say('Reading screenshot ' + (i + 1) + ' of ' + files.length + '…');
      const bmp = await createImageBitmap(files[i]);
      /* Small pictures, like ones sent through a chat app, read far better
         blown up to phone size first. */
      const k = Math.max(1, 1200 / bmp.width);
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      const cx = cv.getContext('2d');
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(bmp, 0, 0, cv.width, cv.height);
      const r = readShot(shotLines(await worker.recognize(cv)), carry);
      if (r.app && st.app && r.app !== st.app) throw new Error('Those screenshots are from two different apps. Drop each app’s on its own, so each goes to its own account.');
      if (r.app) st.app = st.app || r.app;
      st.cut += r.cut; st.nosign += r.nosign;
      lists.push(r.recs);
    }
  } finally {
    await worker.terminate();
  }
  const recs = joinShots(lists);
  /* The fingerprint: day, clock and amount, plus which copy it is, counted
     oldest first, so two ₱148 rides on one day stay two and the same
     screenshot read again adds nothing. */
  const seen = {};
  recs.slice().reverse().forEach(r => {
    const k = r.date + '|' + r.time + '|' + r.signed;
    seen[k] = (seen[k] || 0) + 1;
    r.ref = 'shot:' + (r.time || '-') + ':' + seen[k];
    r.bal = null;
  });
  st.lines = recs.slice().reverse();
  st.skipped = st.cut + st.nosign;
  st.title = (st.app === 'gcash' ? 'GCash' : st.app === 'ub' ? 'UnionBank' : 'App') +
    ' screenshot' + (files.length === 1 ? '' : 's');
  return st;
}

/* == any statement with a header row ==
   Columns found by name. Banks also wrap long descriptions at a fixed width
   inside a cell — UnionBank cuts at twenty characters, mid-word — so the most
   common wrapped-line length is taken to be the cut, and a line of exactly
   that length is joined to the next with no space. */
const HEADS = {
  date: /^(date|txn date|transaction date|posting date|post date|value date|date and time)$/i,
  desc: /(desc|particular|detail|narrat|remark|merchant|payee)/i,
  ref: /(^ref|reference)/i,
  dr: /^(debit|debits|withdrawals?|paid out|money out|outflow|dr)$/i,
  cr: /^(credit|credits|deposits?|paid in|money in|inflow|cr)$/i,
  amt: /^(amount|amt|transaction amount)$/i,
  bal: /balance/i,
};
function readTable(grid, dayFirst) {
  let head = -1, cols = null;
  for (let i = 0; i < Math.min(grid.length, 40); i++) {
    const c = {};
    grid[i].forEach((v, j) => {
      const s = String(v).trim();
      Object.keys(HEADS).forEach(k => { if (c[k] == null && s && HEADS[k].test(s)) c[k] = j; });
    });
    if (c.date != null && (c.amt != null || c.dr != null || c.cr != null)) { head = i; cols = c; break; }
  }
  if (!cols) return null;

  const st = { source: 'table', title: '', opening: null, closing: null, lines: [], ids: [], skipped: 0 };
  grid.slice(0, head).forEach(r => {
    const i = r.findIndex(v => /account\s*(no|number|#)/i.test(v));
    if (i > -1) {
      const v = r.slice(i + 1).find(x => /\d{4,}/.test(x));
      if (v) st.ids.push(v.replace(/\D/g, '').slice(-4));
    }
    const n = r.findIndex(v => /account\s*name/i.test(v));
    if (n > -1) st.title = (r.slice(n + 1).find(x => x.trim()) || '').trim();
  });

  const body = grid.slice(head + 1);
  const seg = {};
  body.forEach(r => {
    const parts = String(cols.desc != null ? r[cols.desc] : '').split('\n');
    parts.slice(0, -1).forEach(p => { if (p.length > 8) seg[p.length] = (seg[p.length] || 0) + 1; });
  });
  const wrap = +Object.keys(seg).sort((a, b) => seg[b] - seg[a])[0] || 0;
  const unwrap = d => {
    const parts = String(d || '').split('\n');
    let o = '';
    parts.forEach((p, i) => { o += (wrap && p.length === wrap && i + 1 < parts.length) ? p : p + ' '; });
    return o.replace(/\s+/g, ' ').trim();
  };

  let proof = null, loose = false;
  body.forEach(r => {
    const p = readDate(r[cols.date]);
    if (!p || p.sure) return;
    loose = true;
    if (p.a > 12) proof = true;
    else if (p.b > 12 && proof === null) proof = false;
  });
  st.ambiguous = loose && proof === null && dayFirst == null;
  const df = dayFirst != null ? dayFirst : (proof === null ? false : proof);

  body.forEach(r => {
    const p = readDate(r[cols.date]);
    const date = p ? isoOf(p, df) : null;
    let signed = null;
    if (cols.dr != null || cols.cr != null) {
      const dr = cols.dr != null ? readAmt(r[cols.dr]) : null;
      const cr = cols.cr != null ? readAmt(r[cols.cr]) : null;
      if (dr) signed = -Math.abs(dr);
      else if (cr) signed = Math.abs(cr);
    } else if (cols.amt != null) signed = readAmt(r[cols.amt]);
    const bal = cols.bal != null ? readAmt(r[cols.bal]) : null;
    if (!date || !signed) {
      if (bal != null && /opening|beginning|starting|brought forward/i.test(r.join(' '))) st.opening = bal;
      st.skipped++;
      return;
    }
    const tm = String(r[cols.date]).match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AP]M)?/i);
    let time = '';
    if (tm) {
      let hr = +tm[1];
      if (tm[3]) { hr %= 12; if (/p/i.test(tm[3])) hr += 12; }
      time = String(hr).padStart(2, '0') + ':' + tm[2];
    }
    st.lines.push({ date: date, time: time, desc: unwrap(cols.desc != null ? r[cols.desc] : ''),
      ref: cols.ref != null ? String(r[cols.ref]).trim() : '', signed: signed, bal: bal });
  });
  return st;
}

/* Pasted text or a CSV: GCash's shape if it looks like it, a table if it has
   a header row, and the older shape-guessing reader if it has neither. */
function readText(text, dayFirst) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (looksGCash(lines)) return readGCash(lines);
  const d = delimFor(lines);
  const t = readTable(lines.map(l => splitWith(l, d)), dayFirst);
  if (t && t.lines.length) return t;
  const old = parseStatement(text, dayFirst);
  return { source: 'text', title: '', opening: null, closing: null, ids: [], skipped: old.skipped,
    ambiguous: old.ambiguous,
    lines: old.rows.map(r => ({ date: r.date, time: '', desc: r.desc, ref: '', signed: r.amt, bal: null })) };
}

/* == the truth pass ==
   Everything above only READS. This decides what actually happened. */
function settle(st) {
  const L = st.lines.map(x => Object.assign({}, x));
  /* Oldest first. A bank that prints newest first also chains its balances
     newest first, so turning the whole list round keeps the chain intact. */
  if (L.length > 1 && L[0].date > L[L.length - 1].date) L.reverse();
  const out = { real: [], holds: [], reversals: [], adjusted: 0, combined: 0, check: null };

  const hasBal = L.length > 0 && L.every(x => x.bal != null);
  if (hasBal) {
    let open = st.opening;
    if (open == null && L[0].signed != null) open = round2(L[0].bal - L[0].signed);
    let prev = open, broken = 0;
    L.forEach(x => {
      if (prev == null) { x.gone = true; broken++; prev = x.bal; return; }
      const moved = round2(x.bal - prev);
      if (x.signed != null) {
        if (Math.abs(moved - x.signed) > 0.009) { broken++; x.bad = true; }
        x.amt = x.signed;
      } else {
        x.amt = moved;
        if (Math.abs(moved) < 0.005) x.hold = true;
        else if (x.printed != null && Math.abs(Math.abs(moved) - x.printed) > 0.009) x.adjusted = true;
      }
      prev = x.bal;
    });
    const last = L[L.length - 1].bal;
    const closingOk = st.closing == null || Math.abs(st.closing - last) < 0.009;
    out.check = { balanced: true, ok: !broken && closingOk, opening: open,
      closing: st.closing != null ? st.closing : last, broken: broken + (closingOk ? 0 : 1) };
  } else {
    L.forEach(x => { x.amt = x.signed; });
    out.check = { balanced: false, ok: true };
  }

  const byRef = {};
  L.forEach(x => { if (x.ref) byRef[x.ref] = x; });
  L.forEach(x => {
    const m = String(x.desc || '').match(/^reversal of\s+(\S+)/i);
    const o = m && byRef[m[1]];
    if (o && !o.gone && !x.gone && Math.abs(o.amt + x.amt) < 0.009) {
      o.gone = x.gone = true;
      out.reversals.push({ was: o, undo: x });
    }
  });
  /* A charge and its refund on the same day, from the same place, for the same
     amount, never happened as far as money is concerned. UnionBank prints an
     Angkas ride cancelled at ₱60 as a ₱60 debit and a ₱60 credit; kept, it is
     ₱60 of spending and ₱60 of income that were neither. */
  L.forEach((x, i) => {
    if (x.gone || !(x.amt > 0)) return;
    const o = L.find((y, j) => j !== i && !y.gone && y.date === x.date && y.desc === x.desc && Math.abs(y.amt + x.amt) < 0.009);
    if (o) { o.gone = x.gone = true; out.reversals.push({ was: o, undo: x }); }
  });
  L.forEach(x => { if (x.hold && !x.gone) { x.gone = true; out.holds.push(x); } });

  /* A charge the wallet took in pieces is one purchase. An adjusted line folds
     into the nearest earlier line for the same merchant on the same day, so a
     ride held at ₱62 and finished at ₱93 is one ₱93 ride, not two entries. */
  const mins = x => { const t = String(x.time || '').split(':'); return t.length === 2 ? +t[0] * 60 + +t[1] : null; };
  const kept = [];
  L.filter(x => !x.gone).forEach(x => {
    if (x.adjusted) {
      out.adjusted++;
      for (let k = kept.length - 1; k >= 0 && k >= kept.length - 8; k--) {
        const p = kept[k];
        if (p.date !== x.date || p.desc !== x.desc) continue;
        const a = mins(p), c = mins(x);
        if (a != null && c != null && c - a > 90) continue;
        p.amt = round2(p.amt + x.amt);
        p.pieces = (p.pieces || 1) + 1;
        out.combined++;
        return;
      }
    }
    kept.push(x);
  });
  out.real = kept.filter(x => Math.abs(x.amt) >= 0.005);
  out.heldTotal = round2(out.holds.reduce((a, x) => a + (x.printed || 0), 0));
  out.outTotal = round2(-out.real.filter(x => x.amt < 0).reduce((a, x) => a + x.amt, 0));
  out.inTotal = round2(out.real.filter(x => x.amt > 0).reduce((a, x) => a + x.amt, 0));
  return out;
}

/* == which accounts are his ==
   An account is recognised on a statement by a number: a GCash mobile number,
   the last four digits of a bank account. They live in settings, not on the
   `acct` row, for the same reason a balance does: STATUS writes that row as
   {name, order} and would drop anything else on it. */
const idsOf = acctId => { const v = S.get('ids.' + acctId, []); return Array.isArray(v) ? v : []; };
const digitsOf = v => String(v == null ? '' : v).replace(/\D/g, '');
const sameId = (a, b) => {
  if (a != null && b != null && String(a) === String(b)) return true;
  const x = digitsOf(a), y = digitsOf(b);
  if (!x || !y) return false;
  if (x === y) return true;
  return (x.length === 4 || y.length === 4) && x.slice(-4) === y.slice(-4);
};
/* == his own account, known by the name he saved it under ==
   UnionBank's printed history says "Sent to Tomm GXI 860671": no number to
   recognise, only the name he gave that recipient and the bank's code, GXI
   for GCash. Once he says that name is his GCash, it is kept like a number,
   as "to:tomm:gxi", and every later line with it is a transfer, not spending.
   A code read off a picture can come back as GX1, so letters are restored. */
const UB_SHORT = /^(sent to|received from)\s+(.+?)\s+([A-Z0-9]{3})\s+\d{3,}\s*$/i;
const bankCode = c => String(c || '').toUpperCase().replace(/1/g, 'I').replace(/0/g, 'O');
function recipKey(desc) {
  const d = String(desc || '').replace(/\s+/g, ' ').trim();
  const m = d.match(UB_SHORT);
  if (!m || !/^sent/i.test(m[1]) || /to account:/i.test(d)) return null;
  const code = bankCode(m[3]);
  return code === 'PPI' ? null : 'to:' + norm(m[2]) + ':' + code.toLowerCase();
}
function ownAcctIn(desc, self, extra) {
  const d = ' ' + String(desc || '') + ' ';
  const rk = recipKey(desc);
  for (const a of accts()) {
    if (a.id === self) continue;
    const ids = idsOf(a.id).concat((extra && extra[a.id]) || []);
    for (const id of ids) {
      if (String(id).indexOf('to:') === 0) { if (rk && rk === String(id)) return a.id; continue; }
      const dg = digitsOf(id);
      if (dg.length < 4) continue;
      /* Four digits on their own turn up everywhere, so a short one has to be
         introduced as an account ending, not merely present. */
      const hit = dg.length === 4
        ? new RegExp('ending(?: in)?\\s*' + dg + '(\\D|$)', 'i').test(d)
        : new RegExp('(^|\\D)' + dg + '(\\D|$)').test(d);
      if (hit) return a.id;
    }
  }
  return null;
}
/* Numbers this statement sends money to or receives it from, that might be
   his. Offered as a question, once; never assumed. */
function counterparts(settled, self) {
  const found = {};
  const add = (id, label) => {
    if (!found[id]) found[id] = { id: id, label: label, n: 0 };
    found[id].n++;
  };
  settled.real.forEach(x => {
    let m;
    if ((m = x.desc.match(/from (.+?) with account ending in (\d{4})/i))) add(m[2], m[1] + ' ending in ' + m[2]);
    if ((m = x.desc.match(/to (.+?) with account ending in (\d{4})/i))) add(m[2], m[1] + ' ending in ' + m[2]);
    if ((m = x.desc.match(/to account:\s*([A-Za-z][A-Za-z .,&\/-]*?)\s+(\d{6,})/i))) add(m[2], m[1].trim() + ' ' + m[2]);
    const rk = recipKey(x.desc);
    if (rk && (m = x.desc.replace(/\s+/g, ' ').trim().match(UB_SHORT))) {
      const code = bankCode(m[3]);
      add(rk, m[2].trim() + (code === 'GXI' ? ' via GCash' : ' via ' + code));
    }
  });
  const no = S.get('notmine', []);
  return Object.values(found)
    .filter(c => !(Array.isArray(no) && no.indexOf(c.id) > -1) && !idsOf(self).some(i => sameId(i, c.id)))
    .sort((a, b) => b.n - a.n);
}
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function preselect(c, cands, self) {
  const owner = accts().find(a => a.id !== self && idsOf(a.id).some(i => sameId(i, c.id)));
  if (owner) return owner.id;
  const named = accts().find(a => a.id !== self && new RegExp('(^|\\W)' + escRe(a.name) + '(\\W|$)', 'i').test(c.label));
  if (!named) return '';
  /* The name alone is not enough — a statement also shows the one time money
     went to a mistyped number. Only the number used most often under that
     name is suggested, and he can still say no. */
  const re = new RegExp('(^|\\W)' + escRe(named.name) + '(\\W|$)', 'i');
  const top = cands.filter(x => re.test(x.label)).sort((a, b) => b.n - a.n)[0];
  return top && top.id === c.id ? named.id : '';
}
function guessAcct(st) {
  const byId = accts().find(a => idsOf(a.id).some(i => st.ids.some(j => sameId(i, j))));
  if (byId) return byId.id;
  if (st.source === 'gcash' || st.app === 'gcash') { const g = accts().find(a => /gcash/i.test(a.name)); if (g) return g.id; }
  if (st.app === 'ub') { const u = accts().find(a => /union|^ub(\W|$)/i.test(a.name)); if (u) return u.id; }
  return '';
}

/* ══════════════════ import setup, asked once ══════════════════
   Tom, 2026-09-13: "Maybe we should have an import setup, where we can
   categorize where things like Lawson Acqua Pebbles always get categorized,
   asked once upon import first time." And: "Gcash will sometimes have
   transfers to numbers, I wont always remember this. I would like to set an
   unsure tag incase I remember in the future but treat them as one time
   transfers."

   So an import finds every payee it has never seen, asks once, and turns the
   answer into a rule. A rule already files the whole history, so one answer
   sorts every past and future payment to that name.

   Money sent to a number nobody has named is filed as a One-time transfer,
   tagged Unsure. It still counts as money out, because it left — leaving it
   out would make spending look smaller than it was. It waits under STILL
   UNSURE on the Spending screen until he remembers. */
const ONETIME = 'onetime', UNSURE = 'unsure';
const listSetting = k => { const v = S.get(k, []); return Array.isArray(v) ? v.slice() : []; };

/* Who was paid, pulled out of a description, as text a rule can match. The
   bank's wording is full of branch names, reference numbers and country
   codes; a rule keyed on "Payment" would file every GCash payment at once,
   which is exactly what the ALWAYS button used to do. */
const CITY = /\s+(?:makati|mandaluyong|mandaluyo|pasig|taguig|quezon|manila|pasay|paranaque|parañaque|muntinlupa|marikina|san juan|bgc)\b.*$/i;
function shopName(raw) {
  const whole = String(raw || '').trim();
  /* "GLoan Auto Repayment with Reference No. GL178..." is one payee, not a
     new one every month. A trailing reference number is not part of a name. */
  let n = whole.split(/,|\s+merchant transaction number/i)[0]
    .replace(/\s+with reference no\.?.*$/i, '')
    .replace(/\s+ref(?:erence)?\.?\s*(?:no\.?|number|#)?:?\s*[A-Z0-9-]{6,}$/i, '');
  n = n.replace(/\s+(?:city\s+)?(?:ph|us|sg)$/i, '').replace(/\s+pos$/i, '');
  n = n.replace(CITY, '').replace(/(?:\s+\+?\d[\d-]*)+$/, '').replace(/[-*\s]+$/, '').trim();
  return { person: false, key: n || whole, label: n || whole };
}
function payeeOf(desc) {
  const d = String(desc || '').replace(/\s+/g, ' ').trim();
  let m;
  if ((m = d.match(/^transfer from \d{10,13} to (\d{10,13})/i))) return { person: true, key: m[1], label: m[1] };
  if ((m = d.match(/^sent to (.+?)\s+([A-Z]{3})\s+\d{3,}.*?to account:\s*(.*?)\s*(\d{6,}|[A-Z0-9]{10,})?(?:\s+purpose:.*)?$/i))) {
    const name = m[1].trim(), code = m[2].toUpperCase(), no = m[4];
    /* PPI is a Maya QR payment to a shop. Any other code sends to a person's
       wallet or bank account, and that account number is who they are: the
       same number GCash prints when he sends to them from there, so one
       answer covers both statements. */
    if (code === 'PPI' && !/\*/.test(name)) return shopName(name);
    return { person: true, key: no || name, label: name + (no ? ' ' + no : '') };
  }
  /* UnionBank's printed history cuts the line short: "Sent to Tomm GXI 860671",
     no account number, and the digits are a trace number that changes every
     time. So the name and the bank code are who it is. */
  if ((m = d.match(UB_SHORT))) {
    const name = m[2].trim(), code = bankCode(m[3]);
    if (/^received/i.test(m[1]) || (code === 'PPI' && !/\*/.test(name))) return shopName(name);
    return { person: true, key: name + ' ' + code, label: name + ' ' + code };
  }
  /* Four digits alone turn up inside every reference number, so a rule keyed
     on them would file strangers. The words around them are part of the key. */
  if ((m = d.match(/^sent gcash to (.+?) with account ending in (\d{4})/i))) return { person: true, key: 'ending in ' + m[2], label: m[1] + ' ending in ' + m[2] };
  if ((m = d.match(/^bills payment to biller:\s*(.+)$/i))) return shopName(m[1]);
  if ((m = d.match(/^(?:bills )?payment to (.+)$/i))) return shopName(m[1]);
  if ((m = d.match(/^visae?[- ](.+)$/i))) return shopName(m[1]);
  if ((m = d.match(/^pos\s+(.+)$/i))) return shopName(m[1]);
  return shopName(d);
}

/* The payees in this import that nothing has decided yet: no rule matches
   them, and he has not already said "leave it" or seen that number. Money in
   is not asked about; a category is a question about spending. */
function setupItems(hits) {
  const skip = listSetting('skipNames'), seen = listSetting('seenNums');
  const groups = {};
  hits.forEach(h => {
    const x = h.line;
    if (!(x.amt < 0) || ruleFor(x.desc)) return;
    const p = payeeOf(x.desc);
    /* Tom, 2026-09-23: "Bancnet shouldn't be grouped." A rail carries the
       money and never names who got it, so every line is its own question,
       answered on that line alone, and no rule is written. */
    if (isRail(p.key)) {
      groups['one:' + h.id] = { k: 'one:' + h.id, id: h.id, one: true, key: p.key,
        label: p.label + ' · ' + Day.short(x.date) + (x.time ? ' ' + UI.clockLabel(x.time) : ''), person: false, n: 1, total: round2(-x.amt) };
      return;
    }
    const k = norm(p.key);
    if (!k) return;
    if ((p.person ? seen : skip).indexOf(k) > -1) return;
    if (!groups[k]) groups[k] = { k: k, key: p.key, label: p.label, person: p.person, n: 0, total: 0 };
    groups[k].n++;
    groups[k].total = round2(groups[k].total - x.amt);
  });
  return Object.values(groups).sort((a, b) => b.total - a.total);
}
/* What a line will be filed as, counting answers not yet saved. */
function fileAs(desc, setup, id) {
  const p = payeeOf(desc);
  const ch = setup && (setup['one:' + id] || setup[norm(p.key)]);
  if (ch && ['later', 'leave', UNSURE].indexOf(ch) < 0) return 'files as ' + esc(catName(ch));
  const r = ruleFor(desc);
  if (r) return 'files as ' + esc(catName(r.cat));
  if (p.person) return 'one-time transfer · <b>unsure</b>';
  return '<span class="stale">uncategorised</span>';
}
/* Written at apply, before anything is added, so the new rules file the new
   rows. A rule id carries a prefix so it can never replace a rule he wrote. */
function writeSetup(items, setup) {
  const skip = listSetting('skipNames'), seen = listSetting('seenNums');
  items.forEach(it => {
    const ch = setup[it.k];
    if (it.one) return;                     /* filed on its own row at apply */
    if (it.person) {
      if (ch && ch !== UNSURE) Rec.set('rule', null, 'imp-' + it.k, { match: it.key, cat: ch });
      if (seen.indexOf(it.k) < 0) seen.push(it.k);
      return;
    }
    if (!ch || ch === 'later') return;
    if (ch === 'leave') { if (skip.indexOf(it.k) < 0) skip.push(it.k); return; }
    Rec.set('rule', null, 'imp-' + norm(it.key), { match: it.key, cat: ch });
  });
  S.set('skipNames', skip);
  S.set('seenNums', seen);
  ruleCache = null;
}

/* == lines a statement saved twice ==
   Tom, 2026-09-14: "Why am I seeing duplicate transactions?" Because Apply
   ran twice on his first GCash import (see the guard on that button). Every
   copy carries the statement line's fingerprint, and a fingerprint holding
   the bank's reference number names one real line, so two rows with it are
   one payment. Lines with no reference are left alone: two ₱93 rides on one
   day can share a fingerprint and both be real.

   The copy kept is the one changed most recently, counting its category, so
   anything he fixed by hand survives. The "already imported" record is
   pointed at it, so the next import still recognises the line. */
function savedTwice() {
  const groups = {};
  ['spend', 'paid', 'xfer'].forEach(type => Rec.all(type, {}).forEach(r => {
    const p = r.payload || {};
    (type === 'xfer' ? Object.values(p.stmt || {}) : [p.stmt]).forEach(fp => {
      if (!fp || String(fp).indexOf('|ref:') < 0) return;
      const k = type + '#' + fp;
      (groups[k] = groups[k] || []).push({ type: type, date: r.date, key: r.key, fp: fp, amt: num(p.amt, 0) });
    });
  }));
  return Object.values(groups).filter(g => g.length > 1).concat(savedTwiceBare());
}
/* == the same accident, with only one copy carrying its reference ==
   Found on Tom's device 2026-09-16: 174 purchases between 15 July and 11
   September existed twice, 64,599 pesos of spending that never happened. The
   detector above could not see one of them, because it pairs rows by a shared
   bank reference and only ONE copy of each pair had one. The other carried no
   statement link and no time at all, which is what the earliest import wrote.

   So this pass groups by what a person would use: same day, same amount, same
   wording. It only claims a group when exactly one copy carries a statement
   link and every other copy carries neither a link nor a clock. That last
   condition is what keeps it narrow: two real rides of the same price on one
   day are either both off the statement or both typed, and a purchase logged
   in STATUS carries the time it was logged.

   The linked copy is kept, whatever the clock says about which row was
   touched last. "Obey the numbers from the actual files rather than whats
   from STATUS", Tom, 2026-09-14, and his categories ride on that copy anyway:
   156 of them against one on the bare copies. */
function savedTwiceBare() {
  const g = {}, out = [];
  Rec.all('spend', {}).forEach(r => {
    const p = r.payload || {};
    const k = r.date + '|' + num(p.amt, 0) + '|' + String(p.note || '').trim().toLowerCase();
    (g[k] = g[k] || []).push({ type: 'spend', date: r.date, key: r.key, fp: p.stmt || '',
      amt: num(p.amt, 0), bare: !p.stmt && !p.t });
  });
  Object.keys(g).forEach(k => {
    const a = g[k];
    if (a.length < 2) return;
    const linked = a.filter(x => x.fp), bare = a.filter(x => x.bare);
    if (linked.length !== 1 || bare.length !== a.length - 1) return;
    const grp = [linked[0]].concat(bare);
    grp.prefer = linked[0].key;
    grp.bareKind = 1;
    out.push(grp);
  });
  return out;
}
function removeSavedTwice(groups) {
  const gone = [], recons = [], kept = {}, dropped = {};
  const id = x => x.type + '|' + x.date + '|' + x.key;
  const touched = x => {
    const a = (Rec.row(x.type, x.date, x.key) || {}).updated_at || 0;
    const m = (Rec.row('mark', null, x.date + '|' + x.key) || {}).updated_at || 0;
    return a > m ? a : m;
  };
  groups.forEach(g => {
    const rc = recon(g[0].fp);
    const live = g.filter(x => !dropped[id(x)]);
    if (live.length < 2) return;
    /* A group that names its keeper keeps that one, full stop: for the bare
       kind the copy carrying the bank's own link is the true one. */
    const keep = g.prefer ? (live.find(x => x.key === g.prefer) || live[0]) : live.slice().sort((a, b) => {
      const ta = touched(a), tb = touched(b);
      if (ta !== tb) return tb > ta ? 1 : -1;
      return (rc && rc.spend === b.key ? 1 : 0) - (rc && rc.spend === a.key ? 1 : 0);
    })[0];
    kept[id(keep)] = 1;
    if (rc && rc.spend !== keep.key) {
      recons.push({ fp: g[0].fp, was: rc });
      Rec.set('recon', null, g[0].fp, merge(rc, { spend: keep.key }));
    }
    live.forEach(x => {
      if (x === keep || kept[id(x)]) return;
      const row = Rec.get(x.type, x.date, x.key);
      if (!row) return;
      const mk = Rec.get('mark', null, x.date + '|' + x.key);
      gone.push({ x: x, row: row, mk: mk });
      dropped[id(x)] = 1;
      Rec.del(x.type, x.date, x.key);
      if (mk) Rec.del('mark', null, x.date + '|' + x.key);
    });
  });
  return {
    n: gone.length,
    undo: () => {
      gone.forEach(g => {
        Rec.set(g.x.type, g.x.date, g.x.key, g.row);
        if (g.mk) Rec.set('mark', null, g.x.date + '|' + g.x.key, g.mk);
      });
      recons.forEach(r => Rec.set('recon', null, r.fp, r.was));
      draw();
    },
  };
}
function drawTwice(m) {
  const groups = savedTwice();
  if (!groups.length) return;
  const extra = groups.reduce((a, g) => a + g.length - 1, 0);
  const out = groups.filter(g => g[0].type === 'spend').reduce((a, g) => a + g[0].amt * (g.length - 1), 0);
  const c = card('SAVED TWICE', 'full');
  const bareKind = groups.filter(x => x.bareKind).length;
  c.appendChild(el('div', 'note', '<b>' + extra + '</b> line' + (extra === 1 ? '' : 's') +
    ' from a statement ' + (extra === 1 ? 'was' : 'were') + ' saved more than once' +
    (out ? ', adding <b>' + esc(money(out)) + '</b> of spending that did not happen' : '') +
    '. ' + (bareKind
      ? 'Each one is the same purchase twice: one copy carries the bank\u2019s own reference, the other carries nothing, not even a time. The copy with the reference is kept, with its category, because the bank\u2019s numbers win.'
      : 'Each copy has the same bank reference number, so they are one payment, not two. ' +
        'The copy you changed most recently is kept, with its category.')));
  const go = el('button', 'btn go mb-press mb-tap', 'Remove the extra copies');
  go.type = 'button';
  go.onclick = () => UI.confirm('Remove ' + extra + ' extra cop' + (extra === 1 ? 'y' : 'ies') + '?',
    'One copy of each stays. You can undo this straight after.', { yes: 'REMOVE' }).then(ok => {
    if (!ok) return;
    const res = removeSavedTwice(savedTwice());
    Mobile.feedback('success');
    UI.undo('removed <b>' + res.n + '</b> extra cop' + (res.n === 1 ? 'y' : 'ies'), res.undo, { ms: 15000 });
    draw();
  });
  const btns = el('div', 'rowbtns');
  btns.appendChild(go);
  c.appendChild(btns);
  m.appendChild(c);
}

/* == the transfers still waiting for a name == */
function drawUnsure(m) {
  const rows = spendRows({}).filter(x => tagOf(x) === UNSURE)
    .sort((a, b) => b.date.localeCompare(a.date) || num(b.t, 0) - num(a.t, 0));
  if (!rows.length) return;
  const c = card('STILL UNSURE');
  const total = rows.reduce((a, x) => a + num(x.amt, 0), 0);
  c.appendChild(el('div', 'note', '<b>' + rows.length + '</b> transfer' + (rows.length === 1 ? '' : 's') + ', ' +
    esc(money(total)) + ', not recognised when they came in. They count as money out. Tap one if you remember what it was.'));
  const l = el('div', 'list');
  rows.slice(0, 12).forEach(x => {
    const r = itemRow(payeeOf(x.bank || x.note).label, Day.short(x.date) + ' · ' + esc(acctName(x.acct)), money(num(x.amt, 0)));
    r.onclick = () => spendSheet(x); r.menu = () => spendMenu(x);
    l.appendChild(r);
  });
  if (rows.length > 12) l.appendChild(el('div', 'note', 'and ' + (rows.length - 12) + ' more, in the list below.'));
  c.appendChild(l);
  m.appendChild(c);
}

/* ── deciding what each line is ──
   Certainty is deliberately narrow. Anything looser gets asked about, because
   a wrong automatic merge is invisible and a question costs three seconds.
   `extra` is the account numbers he has just confirmed but not yet saved:
   nothing is written until apply, and the plan still has to use them. */
function planImport(rows, acctId, extra, shot) {
  const out = { known: [], certain: [], ask: [], fresh: [], xnew: [], xlink: [] };
  const taken = {};
  const pend = [];
  rows.forEach(line => {
    const id = stmtId(acctId, line.date, line.amt, line.desc, line.ref);
    const seen = recon(id);
    if (seen) { out.known.push({ line: line, id: id, was: seen }); return; }
    const money_ = Math.abs(line.amt), isOut = line.amt < 0;

    const other = ownAcctIn(line.desc, acctId, extra);
    if (other) {
      const from = isOut ? acctId : other, to = isOut ? other : acctId;
      const ex = xfers({ from: Day.shift(line.date, -2), to: Day.shift(line.date, 2) }).find(x =>
        x.from === from && x.to === to && Math.abs(num(x.amt, 0) - money_) < 0.009 &&
        !(x.stmt && x.stmt[acctId]) && !taken['x|' + x.date + '|' + x.key]);
      if (ex) {
        taken['x|' + ex.date + '|' + ex.key] = 1;
        out.xlink.push({ line: line, id: id, match: ex, from: from, to: to });
      } else {
        out.xnew.push({ line: line, id: id, from: from, to: to });
      }
      return;
    }

    /* Rows not already reconciled on a past import. Nothing is claimed yet:
       that happens below, once every line in the statement has been seen. */
    const pool = (isOut ? spendRows({ from: Day.shift(line.date, -12), to: Day.shift(line.date, 12) })
                        : paidRows({ from: Day.shift(line.date, -12), to: Day.shift(line.date, 12) }))
      /* A screenshot may show lines a statement already brought in; those
         are the same money, so they are candidates too. */
      .filter(x => shot || !x.stmt);

    const score = x => {
      const gap = Math.abs(Day.diff(x.date, line.date));
      const d = Math.abs(num(x.amt, 0) - money_);
      const sameAcct = x.acct === acctId;
      if (d < 0.005 && gap <= 3 && sameAcct) return { rank: 3, gap: gap, d: d };
      if (d < 0.005 && gap <= 10) return { rank: 2, gap: gap, d: d };
      if (d <= Math.max(2, money_ * 0.01) && gap <= 5) return { rank: 1, gap: gap, d: d };
      return null;
    };
    const cands = pool.map(x => ({ row: x, s: score(x) })).filter(x => x.s)
      .sort((a, b) => b.s.rank - a.s.rank || a.s.gap - b.s.gap || a.s.d - b.s.d);

    pend.push({ line: line, id: id, kind: isOut ? 'out' : 'in', cands: cands });
  });

  /* == matches are decided for the whole statement at once ==
     The first version decided line by line, in date order, and anything with
     the same account and amount within three days was "certain". On Tom's
     real GCash file that merged his hand-logged "Angkas home ₱93" on the 6th
     into a "Bancnet P2M Send ₱93" on the 5th, moved his entry there, and then
     added the real Angkas ride as a second row. Every total still balanced,
     which is exactly why no arithmetic check could have caught it.

     So an automatic merge now needs the SAME DAY, and no evidence against it:
     when both sides know the time, the times agree within 45 minutes or a word
     of the shop name matches. When several lines want one logged entry, only
     a line the clock or the name clearly picks may take it. Anything short of
     that is a question, and a question costs three seconds. */
  const K = r => r.date + '|' + r.key;
  const lineMins = l => { const t = String(l.time || '').split(':'); return t.length === 2 ? +t[0] * 60 + +t[1] : null; };
  const rowMins = r => { const t = num(r.t, 0); if (!t) return null; const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };
  const STOP = ['payment', 'transfer', 'received', 'from', 'with', 'account', 'ending', 'send', 'sent', 'bills', 'gcash', 'visa', 'philippines'];
  const words = s => String(s || '').toLowerCase().split(/[^a-z]+/).filter(w => w.length >= 4 && STOP.indexOf(w) < 0);
  const agrees = (l, r) => { const a = words(l.desc), b = words(r.note).concat(words(r.bank)); return a.some(w => b.indexOf(w) > -1); };
  const clock = (l, r) => { const lm = lineMins(l), rm = rowMins(r); return lm != null && rm != null ? Math.abs(rm - lm) : null; };
  const strong = (l, r) => { const c = clock(l, r); return (c != null && c <= 45) || agrees(l, r); };
  const noAgainst = (l, r) => clock(l, r) == null || strong(l, r);

  pend.forEach(p => { p.same = p.cands.filter(c => c.s.rank === 3 && c.s.gap === 0).map(c => c.row); });
  const wanted = {};
  pend.forEach((p, i) => p.same.forEach(r => { (wanted[K(r)] = wanted[K(r)] || []).push(i); }));
  const pickFor = (p, i) => {
    if (!p.same.length) return null;
    const fit = p.same.length === 1 ? p.same.filter(r => noAgainst(p.line, r)) : p.same.filter(r => strong(p.line, r));
    if (fit.length !== 1) return null;
    const r = fit[0];
    const rivals = wanted[K(r)].filter(j => j !== i);
    if (!rivals.length) return r;
    if (!strong(p.line, r)) return null;
    return rivals.some(j => strong(pend[j].line, r)) ? null : r;
  };
  const claimed = {};
  pend.forEach((p, i) => {
    const r = pickFor(p, i);
    if (r && !claimed[K(r)]) { claimed[K(r)] = 1; p.done = true; out.certain.push({ line: p.line, id: p.id, match: r, kind: p.kind }); }
  });
  pend.forEach(p => {
    if (p.done) return;
    const open = p.cands.filter(c => !claimed[K(c.row)]).map(c => c.row);
    if (open.length) out.ask.push({ line: p.line, id: p.id, cands: open.slice(0, 3), kind: p.kind });
    else out.fresh.push({ line: p.line, id: p.id, kind: p.kind });
  });
  return out;
}

/* ── writing the master entry ──
   His fields survive. The bank's version of the facts wins on the facts. */
function mergeStatement(hit, acctId, shot) {
  const type = hit.kind === 'out' ? 'spend' : 'paid';
  const row = Rec.get(type, hit.match.date, hit.match.key);
  if (!row) return;
  /* Already on a statement: the bank's figures stand, the screenshot line
     is only remembered as seen. */
  if (shot && row.stmt) {
    Rec.set('recon', null, hit.id, { d: hit.line.desc, amt: hit.line.amt, acct: acctId,
      kind: hit.kind, spend: hit.match.key, sdate: hit.match.date });
    return;
  }
  const want = Math.abs(hit.line.amt);
  const ch = { amt: want, acct: type === 'spend' ? acctLabel(acctId) : acctId };
  /* A screenshot confirms an entry without closing it: `shot`, not `stmt`,
     so the statement can still find it and take it over. */
  if (shot) ch.shot = hit.id;
  else {
    ch.stmt = hit.id; ch.bank = hit.line.desc;
    /* A screenshot's note is the app's wording, not his. The bank's replaces
       it, so rules written on bank wording file the row. */
    if (row.src === 'shot') { ch.note = hit.line.desc; ch.src = 'stmt'; }
  }
  if (shot && !row.t && hit.line.time) ch.t = stampFor(hit.match.date, hit.line.time);
  Rec.set(type, hit.match.date, hit.match.key, merge(row, ch));
  /* The bank's date is the date it cleared, and a row's date is its key, so
     moving it means rewriting it. Only done when they actually differ. */
  if (hit.match.date !== hit.line.date) {
    const moved = Rec.get(type, hit.match.date, hit.match.key);
    const mk = markOf({ date: hit.match.date, key: hit.match.key });
    Rec.del(type, hit.match.date, hit.match.key);
    Rec.set(type, hit.line.date, hit.match.key, moved);
    if (Object.keys(mk).length) {
      Rec.del('mark', null, hit.match.date + '|' + hit.match.key);
      Rec.set('mark', null, hit.line.date + '|' + hit.match.key, mk);
    }
  }
  Rec.set('recon', null, hit.id, { d: hit.line.desc, amt: hit.line.amt, acct: acctId,
    kind: hit.kind, spend: hit.match.key, sdate: hit.line.date });
}
function addStatement(hit, acctId, shot) {
  const key = newId();
  const amt = Math.abs(hit.line.amt);
  const t = stampFor(hit.line.date, hit.line.time || '');
  if (shot) {
    /* No `stmt` and no `bank`: an open entry the statement will merge into.
       No rule reads the app's wording, so it waits uncategorised until then
       unless he files it. */
    if (hit.kind === 'out') Rec.set('spend', hit.line.date, key, { amt: amt, acct: acctLabel(acctId),
      note: hit.line.desc, t: hit.line.time ? t : 0, src: 'shot', shot: hit.id });
    else Rec.set('paid', hit.line.date, key, { amt: amt, acct: acctId, client: '',
      note: hit.line.desc, t: hit.line.time ? t : 0, src: 'shot', shot: hit.id });
  } else if (hit.kind === 'out') {
    Rec.set('spend', hit.line.date, key, { amt: amt, acct: acctLabel(acctId), note: hit.line.desc,
      t: t, src: 'stmt', stmt: hit.id, bank: hit.line.desc, ref: hit.line.ref || undefined });
    const r = ruleFor(hit.line.desc);
    if (r) setMark({ date: hit.line.date, key: key }, { cat: r.cat });
    /* Money sent to a number nobody has named: a one-time transfer, tagged
       Unsure, until he remembers. It still counts as money out. */
    else if (payeeOf(hit.line.desc).person) setMark({ date: hit.line.date, key: key }, { cat: ONETIME, tag: UNSURE });
  } else {
    Rec.set('paid', hit.line.date, key, { amt: amt, acct: acctId, client: '',
      note: hit.line.desc, t: t, src: 'stmt', stmt: hit.id, bank: hit.line.desc, ref: hit.line.ref || undefined });
  }
  Rec.set('recon', null, hit.id, { d: hit.line.desc, amt: hit.line.amt, acct: acctId,
    kind: hit.kind, spend: key, sdate: hit.line.date });
}
const skipStatement = (hit, acctId) => Rec.set('recon', null, hit.id,
  { d: hit.line.desc, amt: hit.line.amt, acct: acctId, kind: hit.kind, skip: 1 });

/* One transfer row per real movement, however many statements show it. */
function writeTransfer(hit, acctId) {
  const key = newId();
  const stmt = {};
  stmt[acctId] = hit.id;
  Rec.set('xfer', hit.line.date, key, { from: hit.from, to: hit.to, amt: Math.abs(hit.line.amt),
    note: hit.line.desc, t: stampFor(hit.line.date, hit.line.time || ''), stmt: stmt });
  Rec.set('recon', null, hit.id, { d: hit.line.desc, amt: hit.line.amt, acct: acctId,
    kind: 'xfer', spend: key, sdate: hit.line.date });
}
function linkTransfer(hit, acctId) {
  const row = Rec.get('xfer', hit.match.date, hit.match.key);
  if (!row) return writeTransfer(hit, acctId);
  const stmt = Object.assign({}, row.stmt || {});
  stmt[acctId] = hit.id;
  Rec.set('xfer', hit.match.date, hit.match.key, merge(row, { stmt: stmt }));
  Rec.set('recon', null, hit.id, { d: hit.line.desc, amt: hit.line.amt, acct: acctId,
    kind: 'xfer', spend: hit.match.key, sdate: hit.match.date });
}

/* ══════════════════ the picker: autofill, law 4 ══════════════════
   Typing filters what exists. It never creates by being typed into, because
   that is exactly how "Grab" and "grab" become two things. Creating is a
   separate deliberate press, and it refuses a near-match.                  */
function picker(opts) {
  const box = el('div', 'pick');
  const input = UI.field('search', { placeholder: opts.placeholder || 'Type to find' });
  const list = el('div', 'opts');
  box.appendChild(input); box.appendChild(list);
  let value = opts.value || '';
  box.get = () => value;

  function paint() {
    const q = norm(input.value);
    list.innerHTML = '';
    const items = (opts.items || []).filter(it => !q || norm(it.name).indexOf(q) > -1);
    items.slice(0, 40).forEach(it => {
      const b = el('button', it.id === value ? 'on mb-tap' : 'mb-tap',
        esc(it.name) + (it.note ? '<small>' + esc(it.note) + '</small>' : ''));
      b.type = 'button';
      b.onclick = () => { value = it.id; Mobile.feedback('select'); paint(); opts.onPick && opts.onPick(it.id, it); };
      list.appendChild(b);
    });
    if (!items.length && !input.value.trim()) list.appendChild(el('div', 'empty', esc(opts.none || 'Nothing here yet.')));
    if (opts.onCreate && input.value.trim()) {
      const raw = input.value.trim();
      const dupe = (opts.items || []).find(it => norm(it.name) === norm(raw));
      if (dupe) {
        /* The whole point of law 4. He typed something that already exists in
           all but punctuation, so offer the existing one rather than a second. */
        if (!items.some(it => it.id === dupe.id)) {
          const b = el('button', 'mb-tap', esc(dupe.name) + '<small>already exists</small>');
          b.type = 'button';
          b.onclick = () => { value = dupe.id; paint(); opts.onPick && opts.onPick(dupe.id, dupe); };
          list.appendChild(b);
        }
      } else if (items.some(it => norm(it.name).indexOf(norm(raw)) === 0)) {
        /* What he typed is the start of something that already exists, so he
           is mid-word, not naming a new thing. Offering to create here is how
           "Grocer" ends up sitting next to "Groceries" forever. */
      } else {
        const b = el('button', 'mk mb-tap', 'Add “' + esc(raw) + '” as new');
        b.type = 'button';
        b.onclick = () => {
          const id = opts.onCreate(raw);
          if (!id) return;
          value = id; input.value = ''; Mobile.feedback('success');
          paint(); opts.onPick && opts.onPick(id, { id: id, name: raw });
        };
        list.appendChild(b);
      }
    }
  }
  input.oninput = paint;
  paint();
  return box;
}
/* A row of chips for a short fixed list. Same job as the picker, without the
   typing, for anything with under about eight options. */
function chipRow(items, value, onPick, opts) {
  const box = el('div', 'chips');
  let cur = value;
  const paint = () => {
    box.innerHTML = '';
    ((opts && opts.blank) ? [{ id: '', name: opts.blank }] : []).concat(items).forEach(it => {
      const b = el('button', 'chip mb-tap' + (it.id === cur ? ' on' : ''), esc(it.name));
      b.type = 'button';
      b.onclick = () => { cur = it.id; Mobile.feedback('select'); paint(); onPick && onPick(cur); };
      box.appendChild(b);
    });
  };
  paint();
  box.get = () => cur;
  return box;
}
function fld(label, node) {
  const w = el('div', 'fld');
  /* A money field says which currency it is in, because in the alt view every
     other number on the screen is in the other one and an unlabelled box is a
     trap. */
  const isMoney = node && node.dataset && node.dataset.money === '1';
  w.appendChild(el('label', null, esc(label) +
    (isMoney && Cur.ready() ? ' <span style="color:var(--accent)">' +
      esc(Cur.sym(Cur.base()).trim() + ' ' + Cur.base()) + '</span>' : '')));
  w.appendChild(node);
  if (isMoney && Cur.ready()) {
    /* Typing stays in the base currency so a round trip cannot lose anything.
       The other figure sits underneath, live, so both are on screen and only
       one of them is a fact. */
    const hint = el('div', 'note', '');
    const paint = () => {
      const v = num(node.value, 0);
      hint.innerHTML = v ? '≈ <b>' + esc(Cur.sym(Cur.alt()) +
        (v / Cur.rate()).toFixed(2)) + '</b> at your rate' : '';
    };
    node.addEventListener('input', paint);
    paint();
    w.appendChild(hint);
  }
  return w;
}

/* ══ creating the small named things ══
   Every one of these refuses a near-duplicate, which is what makes the picker
   above safe to type into. */
function makeCat(name, grp) {
  if (cats().some(c => norm(c.name) === norm(name))) { UI.toast('there is already a category called <b>' + esc(name) + '</b>', { bad: true }); return null; }
  const id = norm(name) || newId();
  Rec.set('cat', null, id, { name: name, grp: grp || 'var', ord: cats().length });
  return id;
}
function makeTag(name) {
  if (tags().some(t => norm(t.name) === norm(name))) { UI.toast('that tag already exists', { bad: true }); return null; }
  const id = norm(name) || newId();
  Rec.set('wtag', null, id, { name: name });
  return id;
}
function makeAcct(name) {
  if (accts().some(a => norm(a.name) === norm(name))) { UI.toast('there is already an account called <b>' + esc(name) + '</b>', { bad: true }); return null; }
  const id = norm(name) || newId();
  /* STATUS keys accounts by the lowercased name and stores {name, order}.
     Match that shape exactly: a second app inventing its own would give him
     two accounts with one name. */
  Rec.set('acct', null, id, { name: name, order: accts().length });
  return id;
}
function makeClient(name) {
  if (clients().some(c => norm(c.name) === norm(name))) { UI.toast('you already have a client called <b>' + esc(name) + '</b>', { bad: true }); return null; }
  const id = newId();
  Rec.set('client', null, id, { name: name, rate: 0, cycle: 'month', every: 1, start: Day.today(), status: 'on' });
  return id;
}

/* == the switch in the header ==
   In the header rather than buried in settings, because a view you flip to
   check something and flip straight back is not a setting, it is a control.
   It shows the code it will switch TO, so the button says what pressing it
   does rather than where you already are. */
function drawCurBtn() {
  const b = document.getElementById('curBtn');
  if (!b) return;
  if (!Cur.ready()) { b.style.display = 'none'; return; }
  b.style.display = '';
  const to = Cur.inAlt() ? Cur.base() : Cur.alt();
  b.textContent = Cur.sym(Cur.code()).trim() + ' → ' + to;
  b.setAttribute('aria-label', 'Show every amount in ' + Cur.name(to));
  b.title = 'Showing ' + Cur.name(Cur.code()) + '. Press to read everything in ' +
    Cur.name(to) + '.';
}
function toggleCur() {
  if (!Cur.ready()) return openSettings('money');
  Cur.flip(!Cur.inAlt());
  UI.toast('showing every amount in <b>' + esc(Cur.name(Cur.code())) + '</b>' +
    (Cur.inAlt()
      ? ' at ' + esc(Cur.sym(Cur.base()) + Cur.rate().toLocaleString()) +
        ' to one ' + esc(Cur.sym(Cur.alt()).trim())
      : ''));
}

/* == the MONEY tab in settings == */
function openSettings(start) {
  const h = UI.settings(APP.id, [{ id: 'money', name: 'MONEY', draw: drawMoneyTab }],
    /* the app's own tab first, as in every app (Tom, 2026-09-14) */
    { order: ['money', 'app', 'data'] });
  return h;
}
function drawMoneyTab(pane) {
  const redraw = () => { pane.innerHTML = ''; drawMoneyTab(pane); drawCurBtn(); draw(); };
  const curList = CURRENCIES.map(c => ({ id: c[0], name: c[0] + '  ' + c[1].trim(), note: c[2] }));

  /* Shorter words, the same facts. Tom, 2026-09-15: update the settings for
     his own apps too. */
  pane.appendChild(el('h2', null, 'CURRENCY'));
  pane.appendChild(el('div', 'note', 'Changing it relabels your amounts. It does <b>not</b> convert them.'));
  const base = picker({
    items: curList, value: Cur.base(), placeholder: 'Type a code or a name',
    onPick: v => { S.set('cur.base', v); redraw(); },
  });
  pane.appendChild(fld('Currency', base));

  pane.appendChild(el('h2', null, 'SECOND CURRENCY'));
  const alt = picker({
    items: curList.filter(c => c.id !== Cur.base()), value: Cur.alt(),
    placeholder: 'Type a code or a name',
    onPick: v => { S.set('cur.alt', v); redraw(); },
  });
  pane.appendChild(fld('Second currency', alt));

  const rate = amountField(Cur.rate() || '', true);
  /* Names as written, not lowercased: "us dollar" is not a currency. */
  pane.appendChild(fld('How many ' + Cur.name(Cur.base()) + 's to one ' +
    Cur.name(Cur.alt()), rate));
  const on = dateField(Cur.rateOn() || Day.today());
  pane.appendChild(fld('Rate taken on', on));

  const save = el('button', 'btn go wide mb-press mb-tap', 'Save the rate');
  save.type = 'button';
  save.onclick = () => {
    const v = num(rate.value, 0);
    if (v <= 0) { rate.focus(); UI.toast('put in a rate first', { bad: true }); return; }
    S.set('cur.rate', v); S.set('cur.rateOn', on.value);
    Mobile.feedback('success');
    UI.toast('<b>' + esc(Cur.sym(Cur.base())) + esc(v.toLocaleString()) + '</b> to one ' +
      esc(Cur.sym(Cur.alt()).trim()));
    redraw();
  };
  const btns = el('div', 'rowbtns');
  btns.appendChild(save);
  pane.appendChild(btns);

  /* This is his figure and the app says so, every time, including how old it
     is. A converted number that looks live and is four months out is exactly
     the kind of quiet lie law 1 exists to stop. */
  const age = Cur.age();
  pane.appendChild(el('div', 'note', Cur.rate()
    ? 'This is <b>your</b> rate, not a live one. Nothing here goes near a network. ' +
      (age == null ? '' : age > RATE_STALE
        ? '<span class="stale">You set it ' + age + ' days ago.</span> Worth checking.'
        : 'Set ' + (age ? age + ' days ago' : 'today') + '.')
    : 'Put in a rate and a button appears in the header to read every amount in ' +
      esc(Cur.name(Cur.alt())) + ' and back again.'));

  if (Cur.ready()) {
    pane.appendChild(el('h2', null, 'READING IN'));
    pane.appendChild(UI.row('Show everything in ' + Cur.name(Cur.alt()) + 's',
      'A view only. Nothing stored changes, and typing stays in ' + esc(Cur.name(Cur.base())) + 's.',
      UI.toggle(Cur.inAlt(), v => { S.set('cur.view', v ? 1 : 0); drawCurBtn(); draw(); })));
    const ex = 1000;
    pane.appendChild(el('div', 'note', 'So ' + esc(Cur.sym(Cur.base())) + '1,000 reads as <b>' +
      esc(Cur.sym(Cur.alt()) + (ex / Cur.rate()).toFixed(2)) + '</b>.'));
  }

  pane.appendChild(el('h2', null, 'WHAT YOU PUT AWAY'));
  pane.appendChild(UI.row('Every month, put away',
    'Added to what the month costs to make the goal line on SCORE. Counted from money you move into a pot.',
    (() => { const btn = el('button', 'btn mb-tap', saveGoal() ? money(saveGoal()) : 'Not set');
      btn.type = 'button'; btn.onclick = () => goalSheet(); return btn; })()));

  pane.appendChild(el('h2', null, 'BILLS AS BULLETS'));
  pane.appendChild(UI.row('A todo bullet for every bill coming up',
    'Written as an ordinary journal line, so it shows in STATUS on the day it is due, in QUESTS under Today and Upcoming, and in LOG. Ticking one logs the payment here; unticking takes it back. Loan repayments never get one, and paying a bill takes its bullet back.',
    UI.toggle(billTodosOn(), v => {
      S.set('billTodos', v ? 1 : 0);
      if (!v) {
        /* Off means off: every bullet it wrote and he has not ticked goes. */
        const made = S.get('billMade', {}) || {}, hit = {};
        Object.keys(made).forEach(k => {
          const cur = Rec.get('note', made[k], k);
          if (cur && !cur.done) { Rec.del('note', made[k], k); hit[made[k]] = 1; }
        });
        S.set('billMade', {});
        Object.keys(hit).forEach(d => { try { Journal.publishNotes(d, 'wealth'); } catch (e) {} });
      }
      draw();
    })));
  pane.appendChild(el('div', 'note', 'Bills are read ' + BILL_TODO_DAYS + ' days ahead.'));

  pane.appendChild(el('h2', null, 'CLICKS'));
  pane.appendChild(UI.row('Ignore an accidental second click',
    'For a mouse that fires twice. A second press of the same button within 400 milliseconds is dropped, so one press cannot write two bills or file two purchases. The arrows that step through days and months are left alone.',
    UI.toggle(doubleGuardOn(), v => { S.set('noDoubleTap', v ? 1 : 0); })));
}

     Tom, 2026-09-11: "I wanna see monthly net."

     they are different questions — a month can end richer only because a
     client paid two months at once. */
  const now = monthOf(Day.today()), prev = monthBack(now, 1);
  const tn = monthSpend(now), tp = monthSpend(prev);

  const c3 = card('THIS MONTH');
  const sc3 = el('div', 'score');

  const g2 = el('div', 'grid3');

  g2.appendChild(tile('OUT', short(tn.total), tn.big ? short(tn.big) + ' of it one big thing' : 'nothing unusual'));
  g2.appendChild(tile(monthName(prev).toUpperCase() + ' NET', (netPrev > 0 ? '+' : '') + short(netPrev),
    short(monthIn(prev)) + ' in, ' + short(tp.total) + ' out', netPrev < 0 ? 'bad' : 'good'));
  c3.appendChild(g2);
  m.appendChild(c3);

  /* Six months, in and out. A chart earns its place here because the shape of
     jagged income against flat costs is the whole problem. */
  const c4 = card('SIX MONTHS', 'full');
  const ms = []; for (let i = 5; i >= 0; i--) ms.push(monthBack(now, i));
  const ins = ms.map((mm, i) => [i, monthIn(mm)]);
  const outs = ms.map((mm, i) => [i, monthSpend(mm).total]);
  const nets = ms.map((mm, i) => [i, monthIn(mm) - monthSpend(mm).total]);
  if (window.Chart && (ins.some(p => p[1]) || outs.some(p => p[1]))) {
    /* On shared/chart.js, answer first: the average month's net over the six,
       then the chart. Drag across it and the number becomes that month's net,
       with what came in and went out beneath it. This month's bar is lit. */
    const avgNet = nets.reduce((a, p) => a + p[1], 0) / nets.length;
    const signed = v => (v > 0 ? '+' : '') + money(v);
    const head = Chart.header({ label: 'Average month', value: signed(Math.round(avgNet)),
      sub: 'net, over the last six months' });
    c4.appendChild(head.el);
    const box = el('div', 'chartbox');
    c4.appendChild(box);

    m.appendChild(c4);
    Chart.mount(box, { label: 'Six months of money in and out' }, ch => {
      ch.xLinear(-0.5, 5.5);
      ch.yFit(ins.map(p => p[1]).concat(outs.map(p => p[1]), nets.map(p => p[1]), [0]));
      ch.grid(v => short(v));
      ch.labels(ms.map((mm, i) => [i, String(monthName(mm)).slice(0, 3), i === 5]));
      ch.bars(outs.map((p, i) => [p[0], p[1], monthName(ms[i]) + ' out: ' + money(p[1])]), 'wout', null, { highlight: 'last' });
      ch.add('line', { x1: ch.P.l, y1: ch.Y(0), x2: ch.W - ch.P.r, y2: ch.Y(0) }, 'mb-gl');
      ch.line(nets, 'wnet');
      ch.area(ins, null, 0);
      ch.line(ins);
      ch.end(ins[ins.length - 1], short(ins[ins.length - 1][1]));
      ch.scrub(ins, {
        onMove: (p, i) => head.set(signed(nets[i][1]), money(ins[i][1]) + ' in, ' + money(outs[i][1]) + ' out', monthName(ms[i])),
        onLeave: head.reset,
      });
    });
    c4.appendChild(Chart.legend([
      { name: 'In', kind: 'line' },
      { name: 'Out', kind: 'bar', color: 'var(--text-muted)' },
      { name: 'Net', kind: 'dash', color: 'var(--text-2)' },
    ]));
  } else {
    c4.appendChild(el('div', 'empty', 'Nothing logged yet. This fills in as payments and spending arrive.'));
    m.appendChild(c4);
  }
}

/* == in, out and net, at the top of both money screens ==
   Tom, 2026-09-17: "Money in and Money out should both immediately show me
   net amounts." Net lived on SCORE only, so standing on MONEY OUT he could
   see every bill he pays and not whether the month paid for itself, and
   standing on MONEY IN he could see every payment and not what it was up
   against. The same card is drawn first on both, so the figure means the same
   thing whichever screen he is standing on.

   Net is what arrived less what went out, this calendar month. Borrowed money
   is not in it, for the reason it is not in any income figure. It answers a
   different question from UNALLOCATED: that one says "can I", this one says
   "did this month pay for itself". */
/* == the month has a finish line ==
   Tom, 2026-09-17: "I don't want to play month to month, I want to make money
   and save per month, Give me a goal line not just break even."

   So the line is what the month COSTS plus what he says he wants to put aside,
   and the app never picks the second number. A savings figure is a claim about
   how somebody should live, which is law 6: nothing ships with a cap, and this
   is a cap in the other direction.

   Costs are the same two numbers runway is built from, so the goal line and
   runway can never disagree: the bills he has listed, plus the middle of his
   last six months of everyday spending, big one-offs left out.

   Put aside means money he actually moved into a pot this month. Money left
   over at the end of a month is not saved, it is unspent, and the difference
   is the whole reason the pots exist. */
const costsMonthly = () => standingBills() + typicalVariable();
const saveGoal = () => Math.max(0, num(S.get('saveGoal', 0), 0));
const putAside = mo => moves({ from: monthStart(mo), to: monthEnd(mo) })
  .reduce((a, x) => a + (x.dir === 'out' ? -num(x.amt, 0) : num(x.amt, 0)), 0);
function goalCard() {
  const mo = monthOf(Day.today()), t = Day.today();
  const costs = costsMonthly(), save = saveGoal(), need = costs + save;
  const got = monthIn(mo), aside = putAside(mo);
  const days = Day.diff(monthEnd(mo), monthStart(mo)) + 1;
  const gone = Day.diff(t, monthStart(mo)) + 1;
  const c = card('THIS MONTH');
  const sc = el('div', 'score');
  sc.appendChild(el('div', 'cap', save ? 'EARNED OF YOUR GOAL' : 'EARNED OF WHAT THE MONTH COSTS'));
  sc.appendChild(el('div', 'big' + (need && got >= need ? ' good' : ''), money(got)));
  sc.appendChild(el('div', 'sub', 'of ' + money(need) + '. ' + money(costs) + ' to cover the month' +
    (save ? ', and ' + money(save) + ' to put away' : '') + '.'));
  c.appendChild(sc);

  /* The same bar an allowance wears, and the same mark: where an even month
     would have you today. A line to read against, never a rule. */
  const bar = el('div', 'bar c2');
  bar.style.position = 'relative';
  bar.appendChild(el('i')).style.width = Math.min(100, need ? got / need * 100 : 0).toFixed(1) + '%';
  if (gone < days) {
    const tick = el('i');
    tick.style.position = 'absolute';
    tick.style.left = (gone / days * 100).toFixed(1) + '%';
    tick.style.top = '0'; tick.style.bottom = '0';
    tick.style.width = 'var(--border-width)';
    tick.style.background = 'var(--text-1)';
    tick.style.opacity = '.55';
    bar.appendChild(tick);
  }
  c.appendChild(bar);
  c.appendChild(el('div', 'note', (got >= need
    ? '<b>' + esc(money(got - need)) + '</b> past it'
    : '<b>' + esc(money(need - got)) + '</b> to go') +
    ', with ' + (days - gone) + ' day' + (days - gone === 1 ? '' : 's') + ' left. ' +
    'The mark is where an even month would put you today.'));

  if (save) c.appendChild(el('div', 'note', 'Put away so far: <b>' + esc(money(aside)) +
    '</b> of ' + esc(money(save)) + (aside < save
      ? '. Money that is still in your account at the end of the month is unspent, not saved.'
      : '. That is this month done.')));
  const btn = el('button', 'btn mb-press mb-tap', save ? 'Change what you put away' : 'Say what you want to put away');
  btn.type = 'button';
  btn.onclick = () => goalSheet();
  const w = el('div', 'rowbtns');
  w.style.justifyContent = 'center';
  w.appendChild(btn);
  c.appendChild(w);
  return c;
}
/* His number, never the app's. The sheet shows what a month costs and what
   three months of it would be, because those are facts he already owns, and
   then leaves the box empty. */
/* == what ALLOCATED is made of, in date order ==
   Tom, 2026-09-23: "Let me click on allocated to see a timeline of future
   payments", and "I should see timeline bigger". The same pieces `board`
   adds up, laid out by the day they leave: pots and what is left of this
   month's allowances today, each bill on its due date, each later month's
   allowance on its first. With paying on time on, client money lands on its
   date too, so the line shows what is left after each one, and where it is
   lowest. The last figure is UNALLOCATED; if it is not, this is the bug. */
function allocItems() {
  const t = Day.today(), b = board(), win = b.win, out = [];
  const pt = potsTotal();
  if (pt) out.push({ date: t, amt: -pt, name: 'Your pots', sub: 'already set aside' });
  const mo = monthOf(t);
  capped().forEach(c => {
    const st = capState(c.id, mo);
    if (st && st.left > 0) out.push({ date: t, amt: -st.left, name: c.name, sub: 'left of this month’s allowance' });
    for (let d = Day.shift(monthEnd(mo), 1); d <= win.to; d = Day.shift(monthEnd(monthOf(d)), 1))
      out.push({ date: d, amt: -num(c.cap, 0), name: c.name, sub: monthName(monthOf(d)) + '’s allowance' });
  });
  billsOwed(t, win.to).filter(x => !(num((Rec.get('cat', null, x.bill.cat) || {}).cap, 0) > 0))
    .forEach(x => out.push({ date: x.date, amt: -num(x.bill.amt, 0), name: x.bill.name, sub: 'bill' }));
  if (onTime()) expected(t, win.to).filter(e => !e.paid && !e.late)
    .forEach(e => out.push({ date: e.date, amt: num(e.amt, 0), name: e.client.name,
      sub: (e.est ? 'about, ' : '') + (e.why || 'client payment') }));
  /* Out before in on the same day: the lowest point is the honest one. */
  out.sort((a, b2) => a.date.localeCompare(b2.date) || a.amt - b2.amt);
  return { items: out, b: b };
}
function allocSheet() {
  const { items, b } = allocItems(), t = Day.today(), L = b.liquid;
  let bal = L.total, low = { v: bal, d: t };
  items.forEach(x => { bal += x.amt; x.left = bal; if (bal < low.v) low = { v: bal, d: x.date }; });
  const days = Math.max(1, Day.diff(b.win.to, t));
  UI.dialog({
    title: 'ALLOCATED, BY DATE', width: 1100,
    body: bx => {
      bx.appendChild(el('div', 'note', 'Starts from <b>' + esc(money(L.total)) + '</b> in the accounts and takes each thing off on the day it is due, ' +
        esc(b.win.words) + '.' + (onTime() ? ' Client money lands on its date, as if everyone pays on time.' : '')));
      if (window.Chart && items.length) {
        const head = Chart.header({ label: 'Lowest point', value: money(low.v), sub: Day.short(low.d) });
        bx.appendChild(head.el);
        const box = el('div', 'chartbox tall');
        bx.appendChild(box);
        const pts = [[0, L.total]];
        items.forEach(x => { const o = Day.diff(x.date, t); pts.push([o, x.left - x.amt]); pts.push([o, x.left]); });
        pts.push([days, bal]);
        const labs = [];
        const step = Math.max(1, Math.round(days / 6));
        for (let o = 0; o <= days; o += step) labs.push([o, Day.short(Day.shift(t, o)), o === 0]);
        requestAnimationFrame(() => Chart.mount(box, { label: 'What is left, day by day' }, ch => {
          ch.xLinear(0, days);
          ch.yFit(pts.map(p => p[1]).concat([0]));
          ch.grid(v => short(v));
          ch.labels(labs);
          ch.add('line', { x1: ch.P.l, y1: ch.Y(0), x2: ch.W - ch.P.r, y2: ch.Y(0) }, 'mb-gl');
          ch.area(pts, null, 0);
          ch.line(pts);
          ch.end(pts[pts.length - 1], short(bal));
          ch.scrub(pts, {
            onMove: p => head.set(money(p[1]), Day.short(Day.shift(t, Math.round(p[0]))), 'Left'),
            onLeave: head.reset,
          });
        }));
      }
      const list = el('div', 'list');
      list.style.marginTop = 'var(--s-3)';
      if (!items.length) list.appendChild(el('div', 'empty', 'Nothing is spoken for ' + esc(b.win.words) + '.'));
      items.forEach(x => {
        const r = itemRow(x.name, esc(Day.short(x.date)) + ' · ' + esc(x.sub) + ' · leaves <b>' + esc(money(x.left)) + '</b>',
          (x.amt > 0 ? '+' : '−') + money(Math.abs(x.amt)), x.amt > 0 ? 'in' : (x.left < 0 ? 'late' : ''));
        r.tabIndex = -1;
        list.appendChild(r);
      });
      bx.appendChild(list);
    },
    actions: [{ label: 'CLOSE' }],
  });
}

function goalSheet() {
  UI.dialog({
    title: 'WHAT YOU PUT AWAY', width: 460,
    body: (b, h) => {
      const amt = amountField(saveGoal() || '');
      b.appendChild(fld('Every month, put away', amt));
      b.appendChild(el('div', 'note', 'A month of your standing costs is <b>' + esc(money(costsMonthly())) +
        '</b>, so three months of cover is <b>' + esc(money(costsMonthly() * 3)) +
        '</b>. Those are facts about your money, not a target: the target is whatever you type here.'));
      b.appendChild(el('div', 'note', 'It is counted from money you actually move into a pot, under <b>POTS</b>.'));
      h.save = () => { S.set('saveGoal', num(amt.value, 0)); return true; };
    },
    actions: [{ label: 'CANCEL' }, { label: 'SAVE', kind: 'go', fn: h => { h.save(); draw(); return true; } }],
