/* ── SCORE ── */
function drawScore(m) {
  const b = board(), L = b.liquid, rw = runway();

  const c1 = card(null, 'full');
  const sc = el('div', 'score');
  sc.appendChild(el('div', 'cap', 'FREE TO SPEND'));
  /* One primary thing per screen. FREE is the answer to "can I", so it is the
     only figure at display size and liquid and allocated are its working. */
  sc.appendChild(el('div', 'big' + (b.free < 0 ? ' bad' : b.free < b.allocated * .2 ? ' low' : ''),
    L.counted ? money(b.free) : '—'));
  if (!L.counted) {
    /* An empty state that only states a rule is a wall. This one says what it
       already knows, why that is not the answer, and gives the button. */
    const moved = accts().reduce((a, x) => {
      const mv = movementSince(x.id, null); return { in: a.in + mv.in, out: a.out + mv.out }; },
      { in: 0, out: 0 });
    sc.appendChild(el('div', 'sub', (moved.in || moved.out)
      ? 'You have logged <b>' + esc(money(moved.in)) + '</b> in and <b>' + esc(money(moved.out)) +
        '</b> out, but no account has said what it actually holds. Movement is not a balance: ' +
        'this app cannot know what was in there before you started, and it will not guess.'
      : 'Nothing counted yet. Put in what each account actually holds and every number on this screen starts working.'));
    const go = el('button', 'btn go mb-press mb-tap', 'Count an account');
    go.type = 'button';
    go.onclick = () => {
      const list = accts();
      if (!list.length) return acctSheet();
      if (list.length === 1) return countSheet(list[0]);
      menu(go, list.map(x => ({ label: x.name,
        note: lastCount(x.id) ? 'counted ' + Day.short(lastCount(x.id).date) : 'never counted',
        fn: () => countSheet(x) })), { title: 'WHICH ACCOUNT' });
    };
    const wrap = el('div', 'rowbtns');
    wrap.style.justifyContent = 'center';
    wrap.appendChild(go);
    sc.appendChild(wrap);
  } else {
    sc.appendChild(el('div', 'sub', money(L.total) + ' in the accounts. ' + money(b.allocated) +
      ' already spoken for: your pots, ' + (b.allot ? 'what is left of your monthly allowances, ' : '') +
      'and bills due ' + b.win.words + '.'));
    const pick = el('button', 'btn mb-press mb-tap', 'Change how far ahead');
    pick.type = 'button';
    pick.onclick = () => menu(pick, FREE_WINDOWS.map(x => ({
      label: x[1] + (x[0] === b.win.id ? ' (now)' : ''),
      fn: () => {
        S.set('freeTo', x[0]);
        UI.toast('free now holds back bills due <b>' + esc(freeWindow().words) + '</b>');
        draw();
      } })), { title: 'HOLD BACK BILLS DUE' });
    const wrap = el('div', 'rowbtns');
    wrap.style.justifyContent = 'center';
    wrap.appendChild(pick);
    sc.appendChild(wrap);
  }
  c1.appendChild(sc);

  const g = el('div', 'grid3');
  g.appendChild(tile('LIQUID', L.counted ? short(L.total) : '—',
    L.counted ? (L.age > STALE ? '<span class="stale">counted ' + L.age + ' days ago</span>' : 'counted ' + (L.age ? L.age + ' days ago' : 'today')) : 'no counts yet',
    L.age > STALE ? 'warn' : ''));
  g.appendChild(tile('ALLOCATED', short(b.allocated), (b.allot ? 'pots, allowances, and bills due to ' : 'pots, and bills due to ') + Day.short(b.win.to)));
  g.appendChild(tile('FREE', L.counted ? short(b.free) : '—', 'what is really yours',
    b.free < 0 ? 'bad' : ''));
  c1.appendChild(g);
  if (L.missing.length && L.counted) {
    const note = el('div', 'note',
      'Not counted, so not in the total: <b>' + L.missing.map(esc).join(', ') + '</b>. ');
    const a = el('button', 'btn mb-tap', 'Count them');
    a.type = 'button';
    a.style.marginTop = 'var(--s-2)';
    a.onclick = () => menu(a, accts().filter(x => !lastCount(x.id))
      .map(x => ({ label: x.name, fn: () => countSheet(x) })), { title: 'WHICH ACCOUNT' });
    note.appendChild(el('br'));
    note.appendChild(a);
    c1.appendChild(note);
  }
  m.appendChild(c1);

  /* Runway. The app's real subject. */
  const c2 = card('RUNWAY');
  if (!rw) {
    c2.appendChild(el('div', 'empty', 'Needs a counted balance and something going out. Add your rent and bills under <b>MONEY OUT</b>.'));
  } else {
    const sc2 = el('div', 'score');
    sc2.appendChild(el('div', 'big' + (rw.months < 1 ? ' bad' : rw.months < 3 ? ' low' : ''),
      rw.months.toFixed(1)));
    sc2.appendChild(el('div', 'cap', rw.months === 1 ? 'MONTH' : 'MONTHS'));
    /* States the behaviour and the number, and joins nothing. The root brief
       forbids telling him what a behaviour did to a figure. */
    sc2.appendChild(el('div', 'sub', 'At ' + money(rw.burn) + ' a month standing cost, if every client left tomorrow.'));
    c2.appendChild(sc2);
    c2.appendChild(el('div', 'note', money(standingBills()) + ' of that is bills you have listed' +
      (standingBills() < monthlyFixed() ? ', not counting bills filed as everyday spending' : '') + '. ' +
      money(typicalVariable()) + ' is a normal month of everything else, big purchases left out.'));
  }
  m.appendChild(c2);

  /* == monthly net ==
     Tom, 2026-09-11: "I wanna see monthly net."

     In minus out, which is the one figure that says whether a month paid for
     itself. Liquid answers "can I?" and net answers "did that work?", and
     they are different questions — a month can end richer only because a
     client paid two months at once. */
  const now = monthOf(Day.today()), prev = monthBack(now, 1);
  const tn = monthSpend(now), tp = monthSpend(prev);
  const netNow = monthIn(now) - tn.total, netPrev = monthIn(prev) - tp.total;
  const c3 = card('THIS MONTH');
  const sc3 = el('div', 'score');
  sc3.appendChild(el('div', 'cap', 'NET, ' + monthName(now).toUpperCase()));
  sc3.appendChild(el('div', 'big' + (netNow < 0 ? ' bad' : ''),
    (netNow > 0 ? '+' : '') + money(netNow)));
  sc3.appendChild(el('div', 'sub', money(monthIn(now)) + ' in, ' + money(tn.total) + ' out.' +
    (tn.big ? ' ' + money(tn.big) + ' of that was one big thing.' : '')));
  c3.appendChild(sc3);
  const g2 = el('div', 'grid3');
  g2.appendChild(tile('IN', short(monthIn(now)), monthName(now)));
  g2.appendChild(tile('OUT', short(tn.total), tn.big ? short(tn.big) + ' of it one big thing' : 'nothing unusual'));
  g2.appendChild(tile(monthName(prev).toUpperCase() + ' NET', (netPrev > 0 ? '+' : '') + short(netPrev),
    short(monthIn(prev)) + ' in, ' + short(tp.total) + ' out', netPrev < 0 ? 'bad' : 'good'));
  c3.appendChild(g2);
  m.appendChild(c3);

  /* Six months, in and out. A chart earns its place here because the shape of
     jagged income against flat costs is the whole problem. */
  const c4 = card('SIX MONTHS', 'full');
  const ms = []; for (let i = 5; i >= 0; i--) ms.push(monthBack(now, i));
  const ins = ms.map((mm, i) => [i, monthIn(mm)]);
  const outs = ms.map((mm, i) => [i, monthSpend(mm).total]);
  const nets = ms.map((mm, i) => [i, monthIn(mm) - monthSpend(mm).total]);
  if (window.Chart && (ins.some(p => p[1]) || outs.some(p => p[1]))) {
    const box = el('div', 'chartbox');
    c4.appendChild(box);
    /* In the document before it is measured, or it measures zero. */
    m.appendChild(c4);
    chartInto(box, 170, ch => {
      ch.xLinear(0, 5);
      /* Zero has to be on the scale or a negative net falls off the bottom. */
      moneyScale(ch, ins.map(p => p[1]).concat(outs.map(p => p[1]))
        .concat(nets.map(p => p[1])).concat([0]));
      ch.grid(v => short(v));
      ch.bars(outs, 'mb-bar');
      ch.rule(0, '', 'mb-rule');
      ch.line(ins, 'mb-line'); ch.dots(ins, 'mb-dot', 3);
      ch.line(nets, 'mb-rule'); ch.dots(nets, 'mb-dot', 2);
      ch.note('bars out · line in · flat line net');
    });
    c4.appendChild(el('div', 'note', ms.map(monthName).join(' · ')));
  } else {
    c4.appendChild(el('div', 'empty', 'Nothing logged yet. This fills in as payments and spending arrive.'));
    m.appendChild(c4);
  }
}

/* ── MONEY IN ── */
function drawIn(m) {
  const now = monthOf(Day.today());
  const exp = expected(monthStart(monthBack(now, 1)), monthEnd(monthBack(now, -2)));
  const late = exp.filter(e => e.late);

  const c0 = card('OWED TO YOU');
  if (!late.length) {
    c0.appendChild(el('div', 'empty', clients().length ? 'Nobody is late. Everything expected so far has arrived.'
      : 'No clients yet. Add them under <b>CLIENTS</b>, with what they pay and how often.'));
  } else {
    const list = el('div', 'list');
    late.forEach(e => {
      const r = itemRow(e.client.name, 'due ' + Day.short(e.date) + ' · ' +
        away(e.date) + (e.why ? ' · ' + esc(e.why) : ''), money(e.amt), 'late');
      r.onclick = () => payFor(e); r.menu = () => dueMenu(e);
      list.appendChild(r);
    });
    c0.appendChild(list);
    c0.appendChild(el('div', 'note', 'Total outstanding: <b>' +
      esc(money(late.reduce((a, e) => a + e.amt, 0))) + '</b>'));
  }
  m.appendChild(c0);

  /* Coming up. */
  const soon = exp.filter(e => !e.paid && !e.late).slice(0, 12);
  const c1 = card('EXPECTED NEXT');
  if (!soon.length) c1.appendChild(el('div', 'empty', 'Nothing dated is coming up. Clients paid by the session have no date until the block is finished, so they show under <b>CLIENTS</b> instead.'));
  else {
    const list = el('div', 'list');
    soon.forEach(e => {
      const r = itemRow(e.client.name, (e.est ? 'about ' : '') + Day.short(e.date) + ' · ' + away(e.date) +
        (e.why ? ' · ' + esc(e.why) : ''), money(e.amt));
      r.onclick = () => payFor(e); r.menu = () => dueMenu(e);
      list.appendChild(r);
    });
    c1.appendChild(list);
  }
  m.appendChild(c1);

  /* Everything that has arrived. */
  const c3 = card('RECEIVED', 'full');
  const got = paidRows({ from: Day.shift(Day.today(), -120) }).sort((a, b) => b.date.localeCompare(a.date));
  if (!got.length) c3.appendChild(el('div', 'empty', 'Nothing recorded yet. Press <b>+</b> to log a payment or a one-off.'));
  else {
    const list = el('div', 'list');
    got.slice(0, 40).forEach(p => {
      const c = p.client ? Rec.get('client', null, p.client) : null;
      const r = itemRow(c ? c.name : (p.note || 'One-off'),
        Day.short(p.date) + ' · ' + esc(acctName(p.acct)) + (c && p.note ? ' · ' + esc(p.note) : ''),
        money(num(p.amt, 0)), 'in');
      r.onclick = () => paidSheet(p); r.menu = () => paidMenu(p);
      list.appendChild(r);
    });
    c3.appendChild(list);
  }
  m.appendChild(c3);
}
/* How far off a day is, in words. One function, because "in 0 days" and
   "in 1 days" are the kind of thing that comes back one screen at a time. */
function away(date) {
  const n = Day.diff(date, Day.today());
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  return n > 0 ? 'in ' + n + ' days' : n * -1 + ' days ago';
}
const acctName = id => (Rec.get('acct', null, acctKey(id)) || {}).name || 'unknown account';

/* ── CLIENTS ──
   Tom, 2026-09-14: "Can I get a dedicated clients tab?" Everything about a
   client in one place: who they are, how they pay, where each one stands
   today, and the session tracker for the ones paid by the session. MONEY IN
   stays about money arriving: what is owed, what is next, what came in. */
function drawClients(m) {
  const today = Day.today();
  const exp = expected(Day.shift(today, -90), Day.shift(today, 70));
  const late = {}, next = {};
  exp.forEach(e => {
    const id = e.client.id;
    if (e.late && (!late[id] || e.date < late[id].date)) late[id] = e;
    if (!e.paid && !e.late && (!next[id] || e.date < next[id].date)) next[id] = e;
  });
  /* Where a client stands, in a few words on their own row: the oldest date
     still unpaid, or else the next one coming. */
  const standing = c => {
    if (c.status === 'done') return '';
    if (late[c.id]) return ' · <b>late since ' + esc(Day.short(late[c.id].date)) + '</b>';
    if (next[c.id]) return ' · next ' + (next[c.id].est ? 'about ' : '') + esc(Day.short(next[c.id].date));
    return '';
  };

  const all = clients(), active = all.filter(c => c.status !== 'done');
  const due = exp.filter(e => monthOf(e.date) === monthOf(today));
  const owed = exp.filter(e => e.late).reduce((t, e) => t + num(e.amt, 0), 0);
  const lateCount = Object.keys(late).length;
  const c0 = card(null, 'full');
  const g = el('div', 'grid3');
  g.appendChild(tile('ACTIVE', String(active.length),
    all.length > active.length ? (all.length - active.length) + ' finished' : (active.length === 1 ? 'client' : 'clients')));
  g.appendChild(tile('DUE THIS MONTH', short(due.reduce((t, e) => t + num(e.amt, 0), 0)),
    due.filter(e => e.paid).length + ' of ' + due.length + ' paid'));
  g.appendChild(tile('OWED', owed ? short(owed) : 'Nothing',
    owed ? 'across ' + lateCount + ' client' + (lateCount === 1 ? '' : 's') : 'everyone is up to date',
    owed ? 'warn' : 'good'));
  c0.appendChild(g);
  m.appendChild(c0);

  /* Clients, with everything about them. Set by Tom. */
  const c2 = card('EVERY CLIENT', 'full');
  const cl = clients();
  if (!cl.length) c2.appendChild(el('div', 'empty', 'No clients yet. Press <b>+</b> to add one, then say what they pay and how often.'));
  else {
    const yearIn = paidRows({ from: Day.shift(Day.today(), -365) });
    const total = yearIn.reduce((a, p) => a + num(p.amt, 0), 0);
    const list = el('div', 'list');
    /* Biggest share first, because concentration is the thing this list is
       for and a list sorted by name buries it. */
    const ranked = cl.map(c => {
      const mine = yearIn.filter(p => p.client === c.id);
      const got = mine.reduce((a, p) => a + num(p.amt, 0), 0);
      return { c: c, n: mine.length, got: got, share: total ? got / total : 0 };
    }).sort((a, b) => b.got - a.got);
    ranked.forEach((x, i) => {
      const c = x.c;
      /* A package client has no fixed rate, so a rate would print as zero.
         Their packages are priced one at a time. */
      const r = itemRow(c.name + (c.status === 'done' ? ' (finished)' : ''),
        (isPack(c) ? 'Paid ' + cycleWord(c) : money(num(c.rate, 0)) + ' ' + cycleWord(c)) +
        (perSession(c) ? ' · ' + earnWords(perSession(c), num(c.perWeek, 0)) : '') +
        ' · ' + x.n + (x.n === 1 ? ' payment · ' : ' payments · ') +
        (x.share * 100).toFixed(0) + '% of the year' + standing(c),
        exactMoney(x.got), late[c.id] && c.status !== 'done' ? 'late' : '');
      if (c.status === 'done') r.classList.add('dim');
      r.onclick = () => clientSheet(c); r.menu = () => clientMenu(c);
      const bar = el('div', 'bar c' + (1 + (i % 6)));
      bar.appendChild(el('i')).style.width = (x.share * 100).toFixed(1) + '%';
      list.appendChild(stack(r, bar));
    });
    c2.appendChild(list);
    /* Law 5: show the number, never the verdict. */
    c2.appendChild(el('div', 'note', 'Share of the last twelve months, biggest client first. No opinion offered.'));
  }
  m.appendChild(c2);


  /* == clients paid by the session ==
     Their next payment is not a date, so nothing above can show it. What
     matters day to day is how close the block is, and the button he presses
     the moment a session finishes. */
  const bySesh = clients().filter(c => c.status !== 'done' &&
    ['sesh', 'pack'].indexOf(cycleOf(c).kind) > -1);
  if (bySesh.length) {
    const cs = card('SESSIONS');
    const list = el('div', 'list');
    bySesh.forEach((c, i) => {
      let sub, fig, pct, bad;
      if (isPack(c)) {
        /* Bought before delivered, so the bar fills as the package empties
           and the figure is sessions he still has to give them. */
        const st = packState(c);
        sub = st.delivered + ' of ' + st.bought + ' delivered' +
          (st.owed ? ' · <b>' + esc(money(st.owed)) + ' owed</b>'
            : st.toCome ? ' · ' + esc(money(st.toCome)) + ' to come' : ' · paid up');
        fig = st.left + ' left';
        pct = st.bought ? (st.delivered / st.bought * 100) : 0;
        bad = !!st.owed;
      } else {
        const st = seshDues(c);
        const got = paidRows({}).filter(x => x.client === c.id).length;
        const owed = Math.max(0, st.dues.length - got);
        sub = st.into + ' of ' + st.every + ' towards the next ' + money(num(c.rate, 0)) +
          (owed ? ' · <b>' + owed + ' block' + (owed > 1 ? 's' : '') + ' owed</b>' : '');
        fig = st.into + '/' + st.every;
        pct = st.into / st.every * 100;
        bad = !!owed;
      }
      const r = itemRow(c.name, sub, fig, bad ? 'late' : '');
      r.onclick = () => clientSheet(c); r.menu = () => clientMenu(c);
      const bar = el('div', 'bar c' + (1 + (i % 6)));
      bar.appendChild(el('i')).style.width = Math.max(0, Math.min(100, pct)).toFixed(1) + '%';
      list.appendChild(stack(r, bar));
    });
    cs.appendChild(list);
    const btns = el('div', 'rowbtns');
    const add = el('button', 'btn go wide mb-press mb-tap', 'Log a session');
    add.type = 'button';
    const note = c => isPack(c) ? packState(c).left + ' left'
      : seshDues(c).into + ' of ' + seshDues(c).every;
    add.onclick = () => {
      if (bySesh.length === 1) { addSesh(bySesh[0].id, Day.today()); Mobile.feedback('success');
        UI.toast('logged a session for <b>' + esc(bySesh[0].name) + '</b>'); draw(); return; }
      menu(add, bySesh.map(c => ({ label: c.name, note: note(c),
        fn: () => { addSesh(c.id, Day.today()); Mobile.feedback('success');
          UI.toast('logged a session for <b>' + esc(c.name) + '</b>'); draw(); } })),
        { title: 'WHOSE SESSION' });
    };
    btns.appendChild(add);
    cs.appendChild(btns);
    /* The liability nobody tracks: sessions paid for and not yet given. */
    const owedWork = bySesh.filter(isPack).reduce((a, c) => a + packState(c).owedWork, 0);
    if (owedWork) cs.appendChild(el('div', 'note',
      'You owe <b>' + esc(String(owedWork)) + '</b> session' + (owedWork === 1 ? '' : 's') +
      ' that are already paid for. That is work booked, not money coming.'));
    m.appendChild(cs);
  }

}

/* ── MONEY OUT ── */
function drawOut(m) {
  const bl = bills();
  /* Tom, 2026-09-14: three cards, every bill in exactly one. Bills and
     utilities; subscriptions, memberships and operating costs, "emphasise the
     monthly cost not the annual"; and groceries, water and regular spending.
     The card follows the bill's category, so re-filing a bill moves it. A
     card title says what is on it, not how to feel about it. */
  const shelfOf = id => ['subs', 'gym'].indexOf(id) > -1 || catGrp(id) === 'biz' ? 'subs'
    : id === 'water' || catGrp(id) === 'var' ? 'regular' : 'bills';
  const shelf = b => shelfOf(b.cat);
  const hasAllowance = id => num((Rec.get('cat', null, id) || {}).cap, 0) > 0;
  /* An allowance sits in the card its category belongs to, with what has
     gone against it this month from every account. Over is said as a number,
     because he asked to see it: "I also want it to show if I went over". */
  const allowRow = cat => {
    const st = capState(cat.id, monthOf(Day.today()));
    const r = itemRow(cat.name, esc(money(st.spent)) + ' of ' + esc(money(st.cap)) + ' spent this month · ' +
      (st.left >= 0 ? esc(money(st.left)) + ' left' : '<b>' + esc(money(-st.left)) + ' over</b>'),
      money(st.cap) + '/mo', st.over ? 'late' : '');
    r.onclick = () => catSheet(cat); r.menu = () => catMenu(cat);
    const bar = el('div', 'bar c1');
    bar.appendChild(el('i')).style.width = Math.min(100, st.pct * 100).toFixed(1) + '%';
    return stack(r, bar);
  };
  const billRow = b => {
    /* Tom, 2026-09-14: "Change 'Day X of the month' to just the number." */
    const r = itemRow(b.name, (b.cycle === 'days'
        ? 'every ' + num(b.every, 7) + ' days, ' + money(num(b.amt, 0)) + ' each'
        : num(b.day, 1)) + ' · ' + catName(b.cat) +
      (b.acct ? ' · ' + esc(acctName(b.acct)) : ''), money(billMonthly(b)) + '/mo');
    r.onclick = () => billSheet(b); r.menu = () => billMenu(b);
    return r;
  };
  const shelfCard = (id, title, empty, more, extra) => {
    const list = bl.filter(b => shelf(b) === id);
    const allow = capped().filter(x => shelfOf(x.id) === id);
    const c = card(title);
    if (!list.length && !allow.length) c.appendChild(el('div', 'empty', empty));
    else {
      const l = el('div', 'list');
      list.forEach(b => l.appendChild(billRow(b)));
      allow.forEach(x => l.appendChild(allowRow(x)));
      c.appendChild(l);
      /* A bill under a category with an allowance is inside that allowance,
         so it is not added to the month a second time. */
      const mo = list.filter(b => !hasAllowance(b.cat)).reduce((a, b) => a + billMonthly(b), 0) +
        allow.reduce((a, x) => a + num(x.cap, 0), 0);
      c.appendChild(el('div', 'note', '<b>' + esc(money(mo)) + '</b> a month' + (more ? more(mo) : '') + '.'));
    }
    if (extra) extra(c);
    m.appendChild(c);
  };
  shelfCard('bills', 'BILLS & UTILITIES', bl.length
    ? 'Nothing here yet. Rent, electricity and other bills show here.'
    : 'Nothing listed. Press <b>+</b> and add your rent first. Runway cannot be worked out without these.');
  shelfCard('subs', 'SUBSCRIPTIONS, MEMBERSHIPS & OPERATING COSTS',
    'Nothing here yet. Bills filed as Subscriptions, Gym, Operating costs or Marketing show here.',
    mo => ', ' + esc(money(mo * 12)) + ' over a year');
  shelfCard('regular', 'GROCERIES, WATER & REGULAR SPENDING',
    'Nothing here yet. Allot a monthly amount to Groceries, or add a bill filed as Drinking Water or another everyday category.',
    null, c => {
      const open = cats().filter(x => shelfOf(x.id) === 'regular' && !hasAllowance(x.id));
      if (!open.length) return;
      const b = el('button', 'btn mb-press mb-tap', 'Allot a monthly amount');
      b.type = 'button';
      b.onclick = () => menu(b, open.map(x => ({ label: x.name, fn: () => catSheet(x) })), { title: 'ALLOT TO' });
      const r = el('div', 'rowbtns');
      r.appendChild(b);
      c.appendChild(r);
    });

  const dl = debts();
  const c3 = card('DEBTS');
  if (!dl.length) c3.appendChild(el('div', 'empty', 'Nothing owed, or nothing listed yet. Press <b>+</b> to add one, and it sits beside your cash rather than being taken off it.'));
  else {
    const list = el('div', 'list');
    list.dataset.sort = 'debt';
    dl.forEach(d => {
      const r = itemRow(d.name, (num(d.rate, 0) ? num(d.rate, 0) + '% · ' : '') +
        (num(d.min, 0) ? money(num(d.min, 0)) + ' minimum, day ' + num(d.day, 1) : 'no minimum set'),
        money(num(d.owed, 0)), 'late');
      r.onclick = () => debtSheet(d); r.menu = () => debtMenu(d); r.dataset.id = d.id;
      list.appendChild(r);
    });
    c3.appendChild(list);
    /* Shown beside cash, never subtracted from it. He asked to see cash. */
    c3.appendChild(el('div', 'note', '<b>' + esc(money(debtTotal())) + '</b> owed in total. This is never taken off your liquid figure, because you asked to see cash and cash is what you see.'));
  }
  m.appendChild(c3);

  /* The month ahead as dates, because timing is what bounces a payment. */
  const c4 = card('THE NEXT 60 DAYS', 'full');
  const to = Day.shift(Day.today(), 60);
  const events = billsDue(Day.today(), to).map(b => ({ date: b.date, name: b.bill.name, amt: -num(b.bill.amt, 0) }))
    .concat(expected(Day.today(), to).filter(e => !e.paid).map(e => ({ date: e.date, name: e.client.name, amt: num(e.amt, 0) })))
    .sort((a, b) => a.date.localeCompare(b.date));
  if (!events.length) c4.appendChild(el('div', 'empty', 'Nothing scheduled either way. Add a bill above, or a client under MONEY IN, and the next two months fill in.'));
  else {
    const L = liquid();
    let run = L.counted ? L.total : 0, lowest = run, lowDate = Day.today();
    const list = el('div', 'list');
    events.forEach(e => {
      run += e.amt;
      if (run < lowest) { lowest = run; lowDate = e.date; }
      const r = itemRow(e.name, Day.short(e.date) + (L.counted ? ' · leaves ' + money(run) : ''),
        (e.amt > 0 ? '+' : '') + money(e.amt), e.amt > 0 ? 'in' : '');
      r.style.cursor = 'default';
      list.appendChild(r);
    });
    c4.appendChild(list);
    if (L.counted) c4.appendChild(el('div', 'note',
      'Lowest point is <b class="' + (lowest < 0 ? 'stale' : '') + '">' + esc(money(lowest)) +
      '</b> around ' + esc(Day.short(lowDate)) + '. That is the day to watch, not the month total.'));
  }
  m.appendChild(c4);
}

/* ── SPENDING ──
   Tom, 2026-09-11: "I want to review individual days and weeks."

   Three zoom levels on one screen rather than three screens, because it is
   the same question asked at three distances and splitting it would mean
   three places to keep in step. The arrows step by whatever is selected, so
   the control is the same whichever level you are at. */
let SPMONTH = null;
let PERIOD = 'month';
let ANCHOR = null;                      /* a date inside the period being read */

/* Monday first. A week that starts on Sunday puts a Saturday night out in the
   same week as the Monday you are planning, which is not how anyone thinks
   about a week. */
function weekStart(d) { const w = Day.dow(d); return Day.shift(d, -((w + 6) % 7)); }
function periodRange() {
  const a = ANCHOR || Day.today();
  if (PERIOD === 'day') return { from: a, to: a, step: 1,
    label: Day.isToday(a) ? 'Today' : Day.label(a) };
  if (PERIOD === 'week') {
    const f = weekStart(a), t = Day.shift(f, 6);
    return { from: f, to: t, step: 7,
      label: Day.short(f) + ' to ' + Day.short(t) +
        (a >= weekStart(Day.today()) && a <= Day.shift(weekStart(Day.today()), 6) ? ' · this week' : '') };
  }
  const f = monthStart(monthOf(a));
  return { from: f, to: monthEnd(monthOf(a)), step: 0, label: monthName(monthOf(a)) };
}
function periodShift(n) {
  const a = ANCHOR || Day.today();
  if (PERIOD === 'month') { ANCHOR = monthStart(monthBack(monthOf(a), -n)); return; }
  ANCHOR = Day.shift(a, n * (PERIOD === 'week' ? 7 : 1));
}
/* The same span, one step back, for the comparison. */
function prevRange() {
  const r = periodRange();
  if (PERIOD === 'month') { const pm = monthBack(monthOf(r.from), 1);
    return { from: monthStart(pm), to: monthEnd(pm), label: monthName(pm) }; }
  const n = PERIOD === 'week' ? 7 : 1;
  return { from: Day.shift(r.from, -n), to: Day.shift(r.to, -n),
    label: PERIOD === 'week' ? 'the week before' : 'the day before' };
}

function drawSpend(m) {
  /* SPMONTH is how this screen used to remember where it was. Honour it once
     so a bookmarked month still opens, then let ANCHOR take over. */
  if (SPMONTH && !ANCHOR) { ANCHOR = monthStart(SPMONTH); SPMONTH = null; }
  const R = periodRange(), P = prevRange();
  const t = rangeSpend(R.from, R.to), prev = rangeSpend(P.from, P.to);
  const word = PERIOD === 'day' ? 'day' : PERIOD === 'week' ? 'week' : 'month';
  drawTwice(m);

  const c0 = card(null, 'full');
  c0.appendChild(UI.segmented([{ id: 'day', name: 'DAY' }, { id: 'week', name: 'WEEK' },
    { id: 'month', name: 'MONTH' }], PERIOD, v => { PERIOD = v; S.set('period', v); draw(); }));

  const bar = el('div', 'rowbtns');
  bar.style.alignItems = 'center';
  const back = el('button', 'btn mb-press mb-tap', '‹');
  back.type = 'button'; back.setAttribute('aria-label', 'Previous ' + word);
  back.onclick = () => { periodShift(-1); Mobile.feedback('nav'); draw(); };
  const fwd = el('button', 'btn mb-press mb-tap', '›');
  fwd.type = 'button'; fwd.setAttribute('aria-label', 'Next ' + word);
  fwd.onclick = () => { periodShift(1); Mobile.feedback('nav'); draw(); };
  const nowBtn = el('button', 'btn mb-press mb-tap', 'Now');
  nowBtn.type = 'button';
  nowBtn.onclick = () => { ANCHOR = Day.today(); Mobile.feedback('nav'); draw(); };
  const lbl = el('div', null, '<b>' + esc(R.label) + '</b>');
  lbl.style.flex = '1'; lbl.style.textAlign = 'center';
  bar.appendChild(back); bar.appendChild(lbl); bar.appendChild(fwd); bar.appendChild(nowBtn);
  /* Nothing to step forward into. A future month is not a record. */
  fwd.disabled = R.to >= Day.today();
  fwd.style.opacity = fwd.disabled ? '.4' : '';
  c0.appendChild(bar);

  const g = el('div', 'grid3');
  g.style.marginTop = 'var(--s-3)';
  g.appendChild(tile('SPENT', short(t.total), t.rows + (t.rows === 1 ? ' thing' : ' things')));
  g.appendChild(tile('CAME IN', short(rangeIn(R.from, R.to)), R.label.replace(' · this week', '')));
  const netHere = rangeIn(R.from, R.to) - t.total;
  g.appendChild(tile('NET', (netHere > 0 ? '+' : '') + short(netHere),
    'in, less out', netHere < 0 ? 'bad' : 'good'));
  c0.appendChild(g);
  const g1b = el('div', 'grid2');
  g1b.style.marginTop = 'var(--s-2)';
  g1b.appendChild(tile('VS THE ONE BEFORE', (t.total - prev.total >= 0 ? '+' : '') + short(t.total - prev.total),
    P.label + ' spent ' + short(prev.total),
    t.total > prev.total ? 'warn' : 'good'));
  g1b.appendChild(tile('THEIR NET', (rangeIn(P.from, P.to) - prev.total > 0 ? '+' : '') +
    short(rangeIn(P.from, P.to) - prev.total), P.label,
    rangeIn(P.from, P.to) - prev.total < 0 ? 'bad' : 'good'));
  c0.appendChild(g1b);
  if (t.big) c0.appendChild(el('div', 'note', 'Normal spending was <b>' + esc(short(t.total - t.big)) +
    '</b>. ' + esc(short(t.big)) + ' of the total was a big one-off, kept out of every average.'));
  m.appendChild(c0);

  if (PERIOD === 'day') drawOneDay(m, R.from);
  if (PERIOD === 'week') drawOneWeek(m, R.from, R.to);

  /* == the caps he set ==
     Only on the month view. A cap is a monthly figure and showing a week
     against it would need a made-up weekly number, which is the sort of
     helpful arithmetic that turns into a wrong answer. */
  if (PERIOD === 'month') { drawUnsure(m); drawCaps(m, monthOf(R.from)); }

  /* Groceries against outside food, asked for by name. */
  const gro = t.byCat['groceries'] || 0, out = t.byCat['outside'] || 0;
  const c1 = card('COOKING VS EATING OUT');
  if (!gro && !out) c1.appendChild(el('div', 'empty', 'Nothing filed as Groceries or Outside food in this ' + word + '.'));
  else {
    const g2 = el('div', 'grid2');
    g2.appendChild(tile('GROCERIES', money(gro), (gro + out) ? Math.round(gro / (gro + out) * 100) + '% of food money' : ''));
    g2.appendChild(tile('OUTSIDE FOOD', money(out), (gro + out) ? Math.round(out / (gro + out) * 100) + '% of food money' : ''));
    c1.appendChild(g2);
    const bar = el('div', 'bar c1');
    bar.style.marginTop = 'var(--s-3)';
    bar.appendChild(el('i')).style.width = ((gro + out) ? gro / (gro + out) * 100 : 0).toFixed(1) + '%';
    c1.appendChild(bar);
    const pg = prev.byCat['groceries'] || 0, po = prev.byCat['outside'] || 0;
    if (pg || po) c1.appendChild(el('div', 'note', P.label + ': ' + esc(money(pg)) + ' groceries, ' +
      esc(money(po)) + ' outside.'));
  }
  m.appendChild(c1);

  /* Where it went, as a donut and a list. The picture ranks them at a glance
     and the list is what you can actually press. */
  const c2 = card('WHERE IT WENT');
  const rows = Object.keys(t.byCat).map(k => ({ id: k, amt: t.byCat[k],
      name: k ? catName(k) : 'Uncategorised' }))
    .sort((a, b) => b.amt - a.amt).filter(r => r.amt > 0);
  if (!rows.length) {
    c2.appendChild(el('div', 'empty', 'Nothing logged in this ' + word +
      '. Press <b>+</b> to put one in, or log it on your phone in STATUS.'));
  } else {
    const sum = rows.reduce((a, r) => a + r.amt, 0);
    /* Slivers become one wedge. Eleven of them is decoration. */
    const shown = [], rest = [];
    rows.forEach(r => (r.amt / sum >= 0.03 ? shown : rest).push(r));
    const slices = shown.concat(rest.length
      ? [{ id: null, name: 'Everything else', amt: rest.reduce((a, r) => a + r.amt, 0) }] : []);

    const ring = el('div');
    ring.style.position = 'relative';
    ring.style.display = 'flex';
    ring.style.justifyContent = 'center';
    ring.style.marginBottom = 'var(--s-4)';
    ring.appendChild(donut(slices, sum, 220));
    const mid = el('div', null, '<div class="k" style="font-family:var(--font-display);' +
      'font-size:var(--f-1);letter-spacing:var(--track-cap);color:var(--text-muted)">OUT</div>' +
      '<div style="font-family:var(--font-display);font-size:var(--f-5);' +
      'font-weight:var(--w-bold);line-height:var(--lh-tight)">' + esc(short(sum)) + '</div>');
    mid.style.position = 'absolute';
    mid.style.top = '50%'; mid.style.left = '50%';
    mid.style.transform = 'translate(-50%,-50%)';
    mid.style.textAlign = 'center';
    mid.style.pointerEvents = 'none';
    ring.appendChild(mid);
    c2.appendChild(ring);

    const top = rows[0].amt;
    const list = el('div', 'list');
    rows.forEach((r, i) => {
      /* The list keeps every category, and its colour matches the wedge it is
         in, so a sliver folded into "everything else" is still findable. */
      const slot = i < shown.length ? (1 + i % 6) : (1 + shown.length % 6);
      const row = itemRow(r.name,
        Math.round(r.amt / (t.total - t.big || 1) * 100) + '% of normal spending', money(r.amt));
      row.onclick = () => { CATFILTER = r.id; draw(); };
      const bar = el('div', 'bar c' + slot);
      bar.appendChild(el('i')).style.width = (r.amt / top * 100).toFixed(1) + '%';
      list.appendChild(stack(row, bar));
    });
    c2.appendChild(list);
    c2.appendChild(el('div', 'note', 'Tap a category to see only its purchases. Anything under 3% is one wedge in the ring, and still its own line here.'));
  }
  m.appendChild(c2);

  /* Tags: why, not what. */
  const tg = Object.keys(t.byTag).map(k => ({ id: k, amt: t.byTag[k] })).sort((a, b) => b.amt - a.amt);
  const c3 = card('OCCASIONS');
  if (!tg.length) c3.appendChild(el('div', 'empty', 'No tags used in this ' + word + '. A tag is why you spent, not what on. Tap anything below to tag it.'));
  else {
    const list = el('div', 'list');
    tg.forEach(r => {
      const n = (Rec.get('wtag', null, r.id) || {}).name || r.id;
      const row = itemRow(n, 'across every category', money(r.amt));
      row.style.cursor = 'default';
      list.appendChild(row);
    });
    c3.appendChild(list);
  }
  m.appendChild(c3);

  /* Big purchases, pulled out. Law 3. */
  const bigs = spendRows({ from: R.from, to: R.to }).filter(s => isBig(s) && !isMove(s));
  if (bigs.length) {
    const c4 = card('BIG ONE-OFFS');
    const list = el('div', 'list');
    bigs.forEach(s => {
      const r = itemRow(s.note || 'No details', Day.short(s.date) + ' · ' + esc(acctName(s.acct)), money(num(s.amt, 0)));
      r.onclick = () => spendSheet(s); r.menu = () => spendMenu(s);
      list.appendChild(r);
    });
    c4.appendChild(list);
    c4.appendChild(el('div', 'note', 'Kept out of every "normal spending" figure above, on purpose. One laptop should not become the story of the month.'));
    m.appendChild(c4);
  }

  /* Every transaction, filtered. */
  const c5 = card(CATFILTER == null ? 'EVERYTHING' : 'EVERYTHING · ' + catName(CATFILTER).toUpperCase(), 'full');
  if (CATFILTER != null) {
    const b = el('button', 'btn mb-tap', 'Show all categories');
    b.onclick = () => { CATFILTER = null; draw(); };
    c5.querySelector('h2').appendChild(el('div', 'spacer'));
    c5.querySelector('h2').appendChild(b);
  }
  const all = spendRows({ from: R.from, to: R.to })
    .filter(s => !isMove(s) && (CATFILTER == null || catOf(s) === CATFILTER))
    .sort((a, b) => b.date.localeCompare(a.date) || num(b.t) - num(a.t));
  if (!all.length) c5.appendChild(el('div', 'empty', 'Nothing here.'));
  else {
    const list = el('div', 'list');
    all.slice(0, 200).forEach(s => {
      const c = catOf(s), tgg = tagOf(s);
      const r = itemRow(s.note || 'No details',
        Day.short(s.date) + ' · ' + esc(acctName(s.acct)) + ' · ' +
        (c ? esc(catName(c)) : '<span class="stale">uncategorised</span>') +
        (tgg ? ' · ' + esc((Rec.get('wtag', null, tgg) || {}).name || tgg) : '') +
        (isBig(s) ? ' · big' : ''),
        money(num(s.amt, 0)));
      r.onclick = () => spendSheet(s); r.menu = () => spendMenu(s);
      list.appendChild(r);
    });
    c5.appendChild(list);
    c5.appendChild(el('div', 'note', 'These are STATUS’s rows, read not copied. Tap one to file it, tag it, or mark it a big one-off. WEALTH never edits the row itself.'));
  }
  m.appendChild(c5);
}
let CATFILTER = null;

/* == caps, shown as numbers and never as a verdict ==
   The bar is the cap. The notch on it is where an even spread would have you
   today, which is the difference between half of it on the 5th and half of it
   on the 25th. Nothing here says good or bad; it says where you are and how
   much month is left, and lets him do the joining up. */
function drawCaps(m, mo) {
  const list = capped();
  const c = card('ALLOWANCES');
  if (!list.length) {
    c.appendChild(el('div', 'empty',
      'No allowances set. Allot a monthly amount on <b>MONEY OUT</b>, or open a category under <b>ACCOUNTS</b>, ' +
      'and it appears here with how much of it is left.'));
    m.appendChild(c);
    return;
  }
  const rows = el('div', 'list');
  list.forEach((cat, i) => {
    const st = capState(cat.id, mo);
    if (!st) return;
    const daysLeft = st.days - st.gone;
    const sub = st.done
      ? (st.over ? money(st.spent - st.cap) + ' over' : money(st.left) + ' unspent')
      : money(st.spent) + ' of ' + money(st.cap) + ' · ' +
        (st.left >= 0
          ? money(st.left) + ' left' + (daysLeft > 0 ? ' with ' + daysLeft + ' day' +
            (daysLeft === 1 ? '' : 's') + ' to go' : ' on the last day')
          : '<b>' + esc(money(-st.left)) + ' over</b>');
    const r = itemRow(cat.name, sub, Math.round(st.pct * 100) + '%',
      st.over ? 'late' : '');
    r.onclick = () => { CATFILTER = cat.id; draw(); };

    const bar = el('div', 'bar c' + (1 + (i % 6)));
    bar.style.position = 'relative';
    bar.appendChild(el('i')).style.width = Math.min(100, st.pct * 100).toFixed(1) + '%';
    /* Where an even spread would put him today. A line, not a rule. */
    if (!st.done && st.gone < st.days) {
      const tick = el('i');
      tick.style.position = 'absolute';
      tick.style.left = (st.gone / st.days * 100).toFixed(1) + '%';
      tick.style.top = '0'; tick.style.bottom = '0';
      tick.style.width = 'var(--border-width)';
      tick.style.background = 'var(--text-1)';
      tick.style.opacity = '.55';
      bar.appendChild(tick);
    }
    rows.appendChild(stack(r, bar));
  });
  c.appendChild(rows);
  c.appendChild(el('div', 'note',
    'The mark on each bar is where an even spread would put you today. Nobody spends evenly, so it is a line to read against, not a rule.'));

  /* Doctrine: a target missed for three weeks is not a target, it is
     furniture. Offering to change it is the only way the bar does anything.
     Offered once, quietly, and only on a cap that has failed three months
     running — not on a single bad month. */
  list.forEach(cat => {
    if (capMisses(cat.id, 3) < 3) return;
    const st = capState(cat.id, mo);
    if (!st) return;
    const real = [1, 2, 3].map(i => {
      const p2 = capState(cat.id, monthBack(monthOf(Day.today()), i));
      return p2 ? p2.spent : 0;
    }).sort((a, b) => a - b)[1];                       /* the middle month */
    const note = el('div', 'note',
      '<b>' + esc(cat.name) + '</b> has gone over its allowance three months running. ' +
      'An allowance you always go over is furniture. The middle of those three months was ' +
      esc(money(real)) + '.');
    const b = el('button', 'btn mb-tap', 'Make it ' + money(Math.ceil(real / 100) * 100));
    b.type = 'button';
    b.style.marginTop = 'var(--s-2)';
    b.onclick = () => {
      const row = Rec.get('cat', null, cat.id);
      Rec.set('cat', null, cat.id, merge(row, { cap: Math.ceil(real / 100) * 100 }));
      Mobile.feedback('success');
      UI.toast('<b>' + esc(cat.name) + '</b> allowance set to ' + esc(money(Math.ceil(real / 100) * 100)));
      draw();
    };
    note.appendChild(el('br'));
    note.appendChild(b);
    c.appendChild(note);
  });
  m.appendChild(c);
}

/* == one day, in the order it happened ==
   Not a list of amounts. Everything that happened, down the clock: what you
   bought, what arrived, a session delivered, money moved into a pot. The
   quiet ones carry no amount because they are not spending, and mixing them
   into a total is how law 2 gets broken. */
function drawOneDay(m, date) {
  const ev = dayEvents(date);
  const c = card(Day.label(date).toUpperCase(), 'full');
  if (!ev.length) {
    c.appendChild(el('div', 'empty', Day.isToday(date)
      ? 'Nothing logged today yet. Spending arrives from STATUS on your phone.'
      : 'Nothing happened on this day, or nothing was logged.'));
    m.appendChild(c);
    return;
  }
  const list = el('div', 'list');
  ev.forEach(e => {
    const time = clock(e.row || e) || '';
    const r = itemRow(e.name,
      (time ? '<b>' + esc(time) + '</b> · ' : '') + e.note + (e.big ? ' · big one-off' : ''),
      e.fig != null ? e.fig : (e.amt > 0 ? '+' : '') + money(e.amt),
      e.kind === 'in' ? 'in' : '');
    if (e.quiet) r.classList.add('dim');
    if (e.kind === 'out' || e.kind === 'move') { r.onclick = () => spendSheet(e.row); r.menu = () => spendMenu(e.row); }
    else if (e.kind === 'in') { r.onclick = () => paidSheet(e.row); r.menu = () => paidMenu(e.row); }
    else r.style.cursor = 'default';
    list.appendChild(r);
  });
  c.appendChild(list);
  const inn = ev.filter(e => e.kind === 'in').reduce((a, e) => a + e.amt, 0);
  const outt = ev.filter(e => e.kind === 'out').reduce((a, e) => a - e.amt, 0);
  c.appendChild(el('div', 'note', '<b>' + esc(money(inn)) + '</b> in, <b>' + esc(money(outt)) +
    '</b> out. Anything greyed out moved money rather than spending it, so it counts in neither.'));
  m.appendChild(c);
}

/* == one week, a day at a time ==
   Seven rows whether or not anything happened, because an empty day is a
   fact about the week and a gap in a list is not. */
function drawOneWeek(m, from, to) {
  const c = card('DAY BY DAY', 'full');
  const days = Day.range(from, to);
  const outs = days.map(d => rangeSpend(d, d).total);
  const top = Math.max.apply(null, outs.concat([1]));
  const list = el('div', 'list');
  days.forEach((d, i) => {
    if (d > Day.today()) return;
    const inn = rangeIn(d, d), sp = outs[i];
    const sesh = Rec.all('sesh', { date: d }).length;
    const r = itemRow(Day.label(d),
      (inn ? '<b class="in">' + esc(money(inn)) + ' in</b> · ' : '') +
      (sp ? esc(rangeSpend(d, d).rows + (rangeSpend(d, d).rows === 1 ? ' purchase' : ' purchases')) : 'nothing spent') +
      (sesh ? ' · ' + sesh + ' session' + (sesh > 1 ? 's' : '') : ''),
      sp ? money(sp) : '—');
    if (Day.isToday(d)) r.style.outline = 'var(--border-width) solid var(--accent)';
    r.onclick = () => { PERIOD = 'day'; ANCHOR = d; S.set('period', 'day'); draw(); };
    const bar = el('div', 'bar c' + (1 + (i % 6)));
    bar.appendChild(el('i')).style.width = (sp / top * 100).toFixed(1) + '%';
    list.appendChild(stack(r, bar));
  });
  c.appendChild(list);
  c.appendChild(el('div', 'note', 'Tap a day to open it.'));
  m.appendChild(c);
}

/* ── POTS ── */
function drawPots(m) {
  const ps = pots();
  const c1 = card('SAVINGS POTS', 'full');
  if (!ps.length) {
    c1.appendChild(el('div', 'empty',
      'No pots yet. A pot is money with a name on it. Naming it is the point: ' +
      'taking money out of a pot you named breaks a rule you set, and being under a target does not feel like anything. Press <b>+</b>.'));
  } else {
    const list = el('div', 'list');
    list.dataset.sort = 'pot';
    ps.forEach((p, i) => {
      const bal = potBal(p.id), tgt = num(p.target, 0);
      const row = itemRow(p.name,
        (tgt ? money(bal) + ' of ' + money(tgt) + ' · ' + Math.round(bal / tgt * 100) + '%' : 'no target set') +
        (p.acct ? ' · ' + esc(acctName(p.acct)) : ''),
        money(bal), 'in');
      row.onclick = () => potSheet(p); row.menu = () => potMenu(p); row.dataset.id = p.id;
      const bar = el('div', 'bar c' + (1 + (i % 6)));
      bar.appendChild(el('i')).style.width = (tgt ? Math.min(100, bal / tgt * 100) : 0).toFixed(1) + '%';
      list.appendChild(stack(row, bar));
    });
    c1.appendChild(list);
    c1.appendChild(el('div', 'note', '<b>' + esc(money(potsTotal())) +
      '</b> put aside. This comes off your free figure, which is the whole reason it works.'));
  }
  m.appendChild(c1);

  const mv = moves({ from: Day.shift(Day.today(), -120) }).sort((a, b) => b.date.localeCompare(a.date));
  const c2 = card('RECENT MOVES');
  if (!mv.length) c2.appendChild(el('div', 'empty', 'Nothing moved yet. Open a pot above and put something in it.'));
  else {
    const list = el('div', 'list');
    mv.slice(0, 30).forEach(v => {
      const p = Rec.get('pot', null, v.pot);
      const r = itemRow((p ? p.name : 'gone'), Day.short(v.date) + ' · ' + (v.dir === 'out' ? 'taken out' : 'put in'),
        (v.dir === 'out' ? '-' : '+') + money(num(v.amt, 0)), v.dir === 'out' ? 'late' : 'in');
      r.style.cursor = 'default';
      list.appendChild(r);
    });
    c2.appendChild(list);
  }
  m.appendChild(c2);
}

/* ── ACCOUNTS ── */
function drawAccounts(m) {
  const as = accts();
  const c1 = card('ACCOUNTS', 'full');
  if (!as.length) c1.appendChild(el('div', 'empty', 'No accounts yet. Press <b>+</b> and add Cash, GCash, your bank, anything money sits in.'));
  else {
    const list = el('div', 'list');
    list.dataset.sort = 'acct';
    as.forEach(a => {
      const b = balanceOf(a.id);
      let sub, fig, cls = '';
      if (b) {
        sub = (b.age > STALE ? '<span class="stale">counted ' + b.age + ' days ago</span>'
                             : 'counted ' + (b.age ? b.age + ' days ago' : 'today')) +
              ', plus everything logged since';
        fig = money(b.bal);
      } else {
        const mv = movementSince(a.id, null);
        /* What he told it, shown rather than binned, and named as movement
           rather than as a balance. */
        sub = mv.any
          ? '<b>' + esc(money(mv.in)) + ' in, ' + esc(money(mv.out)) + ' out</b> logged here. ' +
            '<span class="stale">Tap to say what is actually in it.</span>'
          : '<span class="stale">Never counted. Tap to put in what it holds.</span>';
        fig = mv.any ? (mv.net >= 0 ? '+' : '') + money(mv.net) : '—';
        cls = 'dim';
      }
      const r = itemRow(a.name, sub, fig);
      if (cls) r.classList.add(cls);
      r.onclick = () => countSheet(a); r.menu = () => acctMenu(a); r.dataset.id = a.id;
      list.appendChild(r);
    });
    c1.appendChild(list);
    const ib = el('div', 'rowbtns');
    const imp = el('button', 'btn go wide mb-press mb-tap', 'Read a statement');
    imp.type = 'button';
    imp.onclick = () => importSheet();
    ib.appendChild(imp);
    const withLines = as.filter(a => stmtLines(a.id).length);
    if (withLines.length) {
      const see = el('button', 'btn mb-press mb-tap', 'See statement lines');
      see.type = 'button';
      see.onclick = () => withLines.length === 1 ? stmtSheet(withLines[0].id)
        : menu(see, withLines.map(a => ({ label: a.name, fn: () => stmtSheet(a.id) })), { title: 'WHICH ACCOUNT' });
      ib.appendChild(see);
    }
    c1.appendChild(ib);
    const done = Rec.count('recon');
    /* Per account, so an account nothing was ever read from says 0 out loud
       instead of hiding inside a total. */
    if (done) c1.appendChild(el('div', 'note', '<b>' + esc(String(done)) +
      '</b> statement lines have been reconciled: ' +
      as.map(a => esc(a.name) + ' ' + stmtLines(a.id).length).join(', ') +
      '. Reading the same file again is harmless: it recognises what it has already dealt with.'));
    /* Law 1, said out loud where it matters most. */
    c1.appendChild(el('div', 'note',
      'A balance is what you last counted plus everything logged after it. It drifts, because not every peso gets logged. ' +
      'Count again whenever you like and the drift resets. This app will never invent a balance you did not give it.'));
  }
  m.appendChild(c1);

  const c2 = card('CATEGORIES');
  const list = el('div', 'list');
  list.dataset.sort = 'cat';
  const GRP = { fix: 'Fixed', var: 'Variable', biz: 'Business', move: 'Not spending' };
  cats().forEach(c => {
    const st = capState(c.id, monthOf(Day.today()));
    const r = itemRow(c.name,
      (GRP[c.grp] || c.grp) + (st ? ' · capped at ' + money(st.cap) + ' a month' : ''),
      st ? money(st.spent) : '');
    r.onclick = () => catSheet(c); r.menu = () => catMenu(c); r.dataset.id = c.id;
    list.appendChild(r);
  });
  c2.appendChild(list);
  c2.appendChild(el('div', 'note', 'Categories say <b>what</b>. Tags say <b>why</b>. Anything marked "Not spending" never counts as an outgoing, because moving money is not spending it.'));
  m.appendChild(c2);

  const c3 = card('SORTING RULES', 'full');
  const rs = rules();
  const rl = el('div', 'list');
  rs.forEach(r => {
    const row = itemRow('“' + r.match + '”', 'files as ' + catName(r.cat), '');
    row.onclick = () => ruleSheet(r); row.menu = () => ruleMenu(r);
    rl.appendChild(row);
  });
  c3.appendChild(rl);
  c3.appendChild(el('div', 'note',
    'Text found in a description, and what it means. Write one now and it sorts everything back to the beginning, ' +
    'which is what makes categorising bearable at all. A single purchase can always override its rule.'));
  m.appendChild(c3);
}

/* ══════════════════════════ the sheets ══════════════════════════ */
/* == an amount groups itself ==
   Tom, 2026-09-11: "Numbers should automatically have commas."

   Formatting on every keystroke moves the caret, which is what makes most
   attempts at this horrible to type into. So the caret is put back by
   counting DIGITS before it rather than characters: insert a comma to the
   left of the cursor and the cursor still sits after the same digit. */
function groupNum(raw) {
  const cleaned = String(raw).replace(/[^0-9.]/g, '');
  const bits = cleaned.split('.');
  const whole = bits[0].replace(/^0+(?=\d)/, '');
  const frac = bits.length > 1 ? '.' + bits.slice(1).join('').slice(0, 2) : '';
  return (whole ? Number(whole).toLocaleString('en-US') : (frac ? '0' : '')) + frac;
}
/* `plain` is for a number that is grouped but is NOT an amount of money: the
   exchange rate is a ratio, and labelling it with a currency and offering to
   convert it is nonsense. */
function amountField(v, plain) {
  const i = UI.field('money', { placeholder: '0',
    value: v == null || v === '' ? '' : groupNum(String(v)) });
  if (!plain) i.dataset.money = '1';
  i.addEventListener('input', () => {
    const caret = i.selectionStart == null ? i.value.length : i.selectionStart;
    const digitsBefore = i.value.slice(0, caret).replace(/[^0-9]/g, '').length;
    const out = groupNum(i.value);
    if (out === i.value) return;
    i.value = out;
    let seen = 0, pos = out.length;
    if (!digitsBefore) pos = 0;
    else for (let k = 0; k < out.length; k++) {
      if (/[0-9]/.test(out[k])) seen++;
      if (seen >= digitsBefore) { pos = k + 1; break; }
    }
    try { i.setSelectionRange(pos, pos); } catch (e) {}
  });
  return i;
}
function dateField(v) {
  const i = UI.field('text', { value: v || Day.today() });
  i.type = 'date';
  return i;
}

/* money in */
function paidSheet(existing, preset) {
  UI.dialog({
    title: existing ? 'EDIT PAYMENT' : 'MONEY IN', width: 460,
    body: (b, h) => {
      const rc = existing && existing.stmt ? recon(existing.stmt) : null;
      if (rc && rc.comment) b.appendChild(el('div', 'note', 'Your comment on the statement line: <b>' + esc(rc.comment) + '</b>'));
      const amt = amountField(existing ? existing.amt : (preset && preset.amt) || '');
      b.appendChild(fld('Amount', amt));
      const who = picker({
        items: clients().filter(c => c.status !== 'done').map(c => ({ id: c.id, name: c.name, note: money(num(c.rate, 0)) })),
        value: existing ? existing.client : (preset && preset.client) || '',
        placeholder: 'Which client, or leave blank for a one-off',
        none: 'No clients yet.',
        onCreate: makeClient,
      });
      b.appendChild(fld('Client', who));
      const acct = chipRow(accts().map(a => ({ id: a.id, name: a.name })),
        existing ? existing.acct : S.get('lastAcct', (accts()[0] || {}).id || ''), null, {});
      b.appendChild(fld('Into', acct));
      const note = UI.field('text', { placeholder: 'Commercial, workshop, anything', value: existing ? existing.note || '' : '' });
      b.appendChild(fld('What was it', note));
      const date = dateField(existing ? existing.date : (preset && preset.date));
      b.appendChild(fld('When', date));
      let hhmm = existing ? timeOf(existing) : timeOf({ t: Date.now() });
      b.appendChild(fld('Time', UI.timeField(hhmm, v => { hhmm = v; })));
      h.save = () => {
        const v = num(amt.value, 0);
        if (v <= 0) { amt.focus(); return false; }
        /* Law 4's second half: the same amount, same account, within the hour
           is a question rather than a silent second row. */
        if (!existing) {
          const dupe = paidRows({ date: date.value }).find(p =>
            num(p.amt, 0) === v && p.acct === acct.get());
          if (dupe && !h._forced) {
            h._forced = 1;
            UI.toast('you already logged <b>' + esc(money(v)) + '</b> into that account on that day. Press save again if it really happened twice', { bad: true });
            return false;
          }
        }
        const key = existing ? existing.key : newId();
        const d = existing ? existing.date : date.value;
        if (existing && existing.date !== date.value) Rec.del('paid', existing.date, existing.key);
        Rec.set('paid', date.value, key, {
          amt: v, acct: acct.get(), client: who.get(), note: note.value.trim(),
          t: stampFor(date.value, hhmm), src: 'hand',
        });
        S.set('lastAcct', acct.get());
        Mobile.feedback('success');
        /* The moment he has the information is the moment to ask. Telling the
           app money landed and being shown "never counted" afterwards is the
           dead end this closes. */
        const target = acct.get();
        if (target && !lastCount(target)) {
          const acc = Rec.get('acct', null, target) || { name: target };
          UI.toast('logged <b>' + esc(money(v)) + '</b> in. ' + esc(acc.name) +
            ' has no balance yet, so it is not in your total',
            { ms: 7000, action: { label: 'SET IT',
              fn: () => countSheet(Object.assign({ id: target }, acc)) } });
        } else {
          UI.toast('logged <b>' + esc(money(v)) + '</b> in');
        }
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      existing ? { label: 'DELETE', kind: 'bad', fn: h => {
        const keep = Object.assign({}, existing);
        Rec.del('paid', existing.date, existing.key);
        UI.undo('removed that payment', () => Rec.set('paid', keep.date, keep.key, keep));
        draw(); return true;
      } } : null,
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ].filter(Boolean),
  });
}
function payFor(e) { paidSheet(null, { client: e.client.id, amt: e.amt, date: Day.today() }); }

/* a client, and everything about them */
/* A new client: the name first, refused if it is already taken, then
   straight into the full sheet to say how they pay. Until now a client could
   only be created by typing a new name while logging a payment. */
function newClientSheet() {
  UI.dialog({
    title: 'NEW CLIENT', width: 420, focus: true,
    body: (b, h) => {
      const name = UI.field('name', { placeholder: 'Their name' });
      b.appendChild(fld('Name', name));
      h.add = () => {
        const n = name.value.trim();
        if (!n) { name.focus(); return null; }
        return makeClient(n);
      };
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'ADD', kind: 'go', fn: h => {
        const id = h.add();
        if (!id) return false;
        draw();
        setTimeout(() => clientSheet(Object.assign({ id: id }, Rec.get('client', null, id))), 350);
        return true;
      } },
    ],
  });
}
function clientSheet(c) {
  UI.dialog({
    title: c.name.toUpperCase(), width: 520,
    body: (b, h) => {
      const mine = paidRows({}).filter(p => p.client === c.id).sort((a, b2) => b2.date.localeCompare(a.date));
      const got = mine.reduce((a, p) => a + num(p.amt, 0), 0);
      const g = el('div', 'grid3');
      g.appendChild(tile('EVER PAID', exactMoney(got), mine.length + ' payments'));
      g.appendChild(tile('SINCE', c.start ? Day.short(c.start) : '—', ''));
      /* No average lateness. Tom, 2026-09-14: "I don't need to know if a
         client pays on time on average." Most of a client's history happened
         before WEALTH did, so the figure described the app, not the client. */
      b.appendChild(g);

      const name = UI.field('name', { value: c.name });
      b.appendChild(fld('Name', name));
      const rate = amountField(num(c.rate, 0));
      const rateWrap = fld('They pay', rate);
      b.appendChild(rateWrap);
      /* == how often, as a kind and a number ==
         A fixed list of four could not say "every two months", so it is a
         kind plus a count. The count's label follows the kind, because
         "Every 2" on its own means nothing. */
      const y0 = cycleOf(c);
      const cycle = chipRow([{ id: 'month', name: 'Months' }, { id: 'week', name: 'Weeks' },
        { id: 'sesh', name: 'Sessions' }, { id: 'pack', name: 'Packages up front' },
        { id: 'oneoff', name: 'One off' }], y0.kind,
        () => { paintEvery(); paintSesh(); });
      b.appendChild(fld('How they pay', cycle));

      const everyWrap = el('div', 'fld');
      const everyLbl = el('label', null, '');
      const every = UI.field('number', { value: String(y0.every) });
      everyWrap.appendChild(everyLbl); everyWrap.appendChild(every);
      b.appendChild(everyWrap);

      /* Roughly how many sessions a week, for any client paid by the session.
         It gives what the client is worth in a week, and guesses when a
         package part falls due. Everything worked out from it says "about". */
      const paceWrap = el('div', 'fld');
      paceWrap.appendChild(el('label', null, 'Sessions a week, roughly'));
      const pace = UI.field('decimal', { placeholder: 'e.g. 4', value: num(c.perWeek, 0) ? String(c.perWeek) : '' });
      paceWrap.appendChild(pace);
      b.appendChild(paceWrap);
      pace.addEventListener('input', () => paintSesh());

      /* Which days of the month, monthly cycles only. Usually one, and not
         always the day they signed up; sometimes two, for a client paid on
         the 1st and the 15th. Each day is its own payment, so a missed 15th
         shows as late on its own. */
      const dayWrap = el('div', 'fld');
      const dayLbl = el('label', null, 'Days of the month');
      const dayF = UI.field('text', { placeholder: 'e.g. 1, 15. Blank uses the start date',
        value: y0.days.join(', ') });
      dayWrap.appendChild(dayLbl); dayWrap.appendChild(dayF);
      b.appendChild(dayWrap);

      const hint = el('div', 'note', '');
      b.appendChild(hint);

      function paintEvery() {
        const k = cycle.get(), n = Math.max(1, num(every.value, 1)), one = n === 1;
        everyWrap.style.display = (k === 'oneoff' || k === 'pack') ? 'none' : '';
        paceWrap.style.display = (k === 'pack' || k === 'sesh') ? '' : 'none';
        dayWrap.style.display = k === 'month' ? '' : 'none';
        rateWrap.style.display = k === 'pack' ? 'none' : '';
        everyLbl.textContent = k === 'week' ? (one ? 'Week' : 'Weeks')
          : k === 'sesh' ? (one ? 'Session' : 'Sessions')
          : (one ? 'Month' : 'Months');
        hint.innerHTML = k === 'pack'
          ? 'They buy sessions before they happen. Each package has its own size and price, ' +
            'so there is nothing fixed to set here. Sell one below.'
          : k === 'sesh'
          ? 'Counted, not scheduled. Log a session below and a payment falls due every ' +
            esc(String(n)) + '.'
          : k === 'oneoff' ? 'Once, on the start date. Nothing repeats.'
          : (() => {
              const ds = k === 'month' ? parseDays(dayF.value) : [];
              const per = num(rate.value, 0);
              return 'Repeats from the start date: ' + esc(money(per)) + ' ' +
                esc(cycleWord({ cycle: k, every: n, days: ds })) + '.' +
                (ds.length > 1 ? ' That is ' + esc(money(per * ds.length / n)) + ' a month.' : '');
            })();
      }
      every.oninput = () => { paintEvery(); paintSesh(); };
      rate.addEventListener('input', paintEvery);
      dayF.addEventListener('input', paintEvery);

      const start = dateField(c.start);
      b.appendChild(fld('Started', start));
      const status = chipRow([{ id: 'on', name: 'Active' }, { id: 'done', name: 'Finished' }], c.status || 'on');
      b.appendChild(fld('Status', status));

      /* == sessions, for a client paid by the session ==
         Only drawn when it applies. A counter on a monthly client is a
         control that can never do anything. */
      const seshBox = el('div');
      b.appendChild(seshBox);
      function paintSesh() {
        seshBox.innerHTML = '';
        if (cycle.get() === 'pack') return paintPack();
        if (cycle.get() !== 'sesh') return;
        /* Built by hand, not through `merge`, because merge strips `id` on
           purpose and seshDues needs it to find the sessions. */
        const st = seshDues({ id: c.id, cycle: 'sesh', every: Math.max(1, num(every.value, 1)) });
        seshBox.appendChild(el('h2', null, 'SESSIONS'));
        const g2 = el('div', 'grid3');
        g2.appendChild(tile('DELIVERED', String(st.total), 'all time'));
        g2.appendChild(tile('TOWARDS NEXT', st.into + ' of ' + st.every,
          st.into ? String(st.every - st.into) + ' to go' : 'none since the last'));
        g2.appendChild(tile('BLOCKS OWED', String(st.dues.length), 'completed blocks'));
        seshBox.appendChild(g2);
        /* Worked out from what is typed right now, so changing the rate or
           the block size shows its effect before saving. */
        const perS = num(rate.value, 0) / Math.max(1, num(every.value, 1));
        if (perS) seshBox.appendChild(el('div', 'note', '<b>' + esc(earnWords(perS, num(pace.value, 0))) + '</b>' +
          (num(pace.value, 0) ? '' : '. Put in sessions a week to see a week\u2019s worth.')));
        const blocks = seshBlocks(c.id, Math.max(1, num(every.value, 1)));
        drawBlocks(blocks, blocks[0], bk => 'SESSIONS ' + bk.first + ' TO ' + (bk.first + bk.size - 1));
      }
      /* The block being worked through, and the rest behind one button. */
      let allBlocks = false;
      function drawBlocks(blocks, current, label) {
        if (!blocks.length) return;
        (allBlocks ? blocks : [current]).forEach(bk => {
          seshBox.appendChild(el('h2', null, esc(label(bk))));
          seshBoxes(seshBox, c.id, bk, paintSesh);
        });
        if (blocks.length > 1) {
          const more = el('button', 'btn mb-press mb-tap', allBlocks ? 'Show only this block' : 'Show earlier sessions');
          more.type = 'button';
          more.onclick = () => { allBlocks = !allBlocks; paintSesh(); };
          const r = el('div', 'rowbtns');
          r.appendChild(more);
          seshBox.appendChild(r);
        }
      }
      /* == a package client ==
         Two figures that pull opposite ways, never netted: money they owe,
         and sessions he owes. */
      function paintPack() {
        const st = packState(c);
        seshBox.appendChild(el('h2', null, 'PACKAGES'));
        const g2 = el('div', 'grid3');
        g2.appendChild(tile('SESSIONS LEFT', String(st.left),
          st.delivered + ' of ' + st.bought + ' delivered' +
          (st.paidFor < st.bought ? ', ' + st.paidFor + ' paid for' : ''),
          st.left < 0 ? 'bad' : ''));
        g2.appendChild(tile('THEY OWE', st.owed ? money(st.owed) : 'nothing',
          money(st.paid) + ' of ' + money(st.value) + ' paid', st.owed ? 'warn' : 'good'));
        g2.appendChild(tile('PACKAGES', String(st.packs.length), 'sold all time'));
        seshBox.appendChild(g2);
        if (st.coming.length) {
          const nx = st.coming[0];
          seshBox.appendChild(el('div', 'note', 'Next part: <b>' + esc(money(nx.amt)) + '</b>' +
            (nx.at ? ' when session ' + nx.at + ' is done' : '') +
            (nx.date ? ', about ' + esc(Day.short(nx.date)) : st.pace ? '' : '. Put in sessions a week to see roughly when') + '.'));
        }
        const perP = perSession(c);
        if (perP) seshBox.appendChild(el('div', 'note', '<b>' + esc(earnWords(perP, num(pace.value, 0))) + '</b>' +
          (num(pace.value, 0) ? '' : '. Put in sessions a week to see a week\u2019s worth.')));
        if (st.left < 0) seshBox.appendChild(el('div', 'note',
          '<span class="stale">More sessions delivered than bought.</span> Either a package has not been entered, or these were free.'));
        else if (st.owedWork > 0) seshBox.appendChild(el('div', 'note',
          'You have been paid for <b>' + esc(String(st.owedWork)) + '</b> session' + (st.owedWork === 1 ? '' : 's') +
          ' you still have to deliver. That is work owed, not money earned.'));
        else if (st.left > 0) seshBox.appendChild(el('div', 'note',
          '<b>' + esc(String(st.left)) + '</b> session' + (st.left === 1 ? '' : 's') + ' left on paper, but only <b>' +
          esc(String(st.paidFor)) + '</b> paid for. The rest is theirs once the money arrives.'));

        const btns = el('div', 'rowbtns');
        const sell = el('button', 'btn go mb-press mb-tap', 'Sell a package');
        sell.type = 'button';
        sell.onclick = () => { h.close(); packSheet(c); };
        btns.appendChild(sell);
        seshBox.appendChild(btns);

        if (st.packs.length) {
          const list = el('div', 'list');
          list.style.marginTop = 'var(--s-3)';
          st.packs.slice().reverse().forEach(x => {
            const owedHere = st.dues.filter(d => d.pack.id === x.id).reduce((t, d) => t + d.amt, 0);
            const comeHere = st.coming.filter(d => d.pack.id === x.id).reduce((t, d) => t + d.amt, 0);
            const r = itemRow(x.n + ' sessions' + (x.note ? ' · ' + x.note : ''),
              Day.short(x.date) + ' · ' + money(num(x.price, 0)) +
              (num(x.parts, 1) > 1 ? ' in ' + x.parts + ' parts' : '') +
              (owedHere ? ' · <b>' + esc(money(owedHere)) + ' owed</b>'
                : comeHere ? ' · ' + esc(money(comeHere)) + ' to come' : ' · paid'),
              money(num(x.price, 0)), owedHere ? 'late' : comeHere ? '' : 'in');
            r.onclick = () => { h.close(); packSheet(c, x); };
            list.appendChild(r);
          });
          seshBox.appendChild(list);
        }
        /* Sessions belong to packages oldest first, so the package being
           worked through is the oldest one not yet full. */
        const blocks = packBlocks(c.id);
        const current = blocks.slice().reverse().find(bk => !bk.extra && bk.sessions.length < bk.size) || blocks[0];
        drawBlocks(blocks, current, bk => bk.extra ? 'SESSIONS NOT IN A PACKAGE'
          : 'PACKAGE OF ' + bk.size + ', SOLD ' + Day.short(bk.pack.date).toUpperCase());
      }

      paintEvery(); paintSesh();

      if (mine.length) {
        b.appendChild(el('h2', null, 'EVERY PAYMENT'));
        const list = el('div', 'list');
        mine.forEach(p => {
          const r = itemRow(Day.label(p.date), esc(acctName(p.acct)) + (p.note ? ' · ' + esc(p.note) : ''),
            money(num(p.amt, 0)), 'in');
          r.onclick = () => { h.close(); paidSheet(p); };
          list.appendChild(r);
        });
        b.appendChild(list);
      }
      h.save = () => {
        const n = name.value.trim();
        if (!n) { name.focus(); return false; }
        if (norm(n) !== norm(c.name) && clients().some(x => norm(x.name) === norm(n))) {
          UI.toast('another client already has that name', { bad: true }); return false;
        }
        /* Merge into what is there, never rebuild it. Root brief, rule 1. */
        Rec.set('client', null, c.id, merge(c, {
          name: n, rate: num(rate.value, 0), cycle: cycle.get(),
          every: Math.max(1, num(every.value, 1)),
          perWeek: Math.max(0, num(pace.value, 0)),
          /* 31 is a real answer. dueDates already clamps per month, so the
             31st is the 31st in March and the 28th in February, and it does
             NOT drift down to the 28th forever after one short month.
             Capping the stored day at 28 threw that away silently. */
          days: parseDays(dayF.value),
          day: parseDays(dayF.value)[0] || 0,
          start: start.value, status: status.get(),
        }));
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'DELETE', kind: 'bad', fn: () => deleteClient(c) },
      { label: 'LOG A PAYMENT', fn: h => { h.close(); paidSheet(null, { client: c.id, amt: num(c.rate, 0) }); return true; } },
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ],
  });
}

/* == selling a package ==
   Sold and paid are two facts and they do not have to happen together, which
   is the whole point of "whole or partial". So the payment is optional here
   and creates an ordinary `paid` row when it is filled in. */
function packSheet(c, existing) {
  UI.dialog({
    title: existing ? 'EDIT PACKAGE' : 'SELL A PACKAGE', width: 460,
    body: (b, h) => {
      const n = UI.field('number', { placeholder: '10', value: existing ? existing.n : '' });
      b.appendChild(fld('How many sessions', n));
      const price = amountField(existing ? existing.price : '');
      b.appendChild(fld('Price for the whole package', price));

      /* Paid in parts: 30 sessions at ₱45,000 in two parts is ₱22,500 when it
         is sold and ₱22,500 when session 15 is done. */
      const partsF = UI.field('number', { value: String(existing ? Math.max(1, num(existing.parts, 1)) : 1) });
      b.appendChild(fld('Paid in how many parts', partsF));
      let when = existing && existing.when === 'after' ? 'after' : 'before';
      const whenWrap = fld('Each part is paid', chipRow([{ id: 'before', name: 'At the start of its sessions' },
        { id: 'after', name: 'At the end of its sessions' }], when, v => { when = v; paintParts(); }));
      b.appendChild(whenWrap);
      const partsHint = el('div', 'note', '');
      b.appendChild(partsHint);
      const partsOf = () => {
        const cnt = Math.max(1, num(n.value, 0));
        return Math.max(1, Math.min(cnt, Math.round(num(partsF.value, 1)) || 1));
      };
      function paintParts() {
        const cnt = Math.max(1, num(n.value, 0)), val = num(price.value, 0), p = partsOf();
        whenWrap.style.display = p > 1 ? '' : 'none';
        if (!val || !num(n.value, 0)) { partsHint.innerHTML = ''; return; }
        if (p === 1) { partsHint.innerHTML = 'All ' + esc(money(val)) + ' is due when it is sold.'; return; }
        const list = [];
        for (let k = 0; k < p; k++) {
          const at = when === 'after' ? Math.round(cnt * (k + 1) / p) : Math.round(cnt * k / p);
          list.push(esc(money(val / p)) + (at ? ' when session ' + at + ' is done' : ' when it is sold'));
        }
        partsHint.innerHTML = list[0].charAt(0).toUpperCase() === list[0].charAt(0) ? andList(list) + '.' : andList(list) + '.';
      }
      [n, price, partsF].forEach(f => f.addEventListener('input', paintParts));
      paintParts();
      const date = dateField(existing ? existing.date : Day.today());
      b.appendChild(fld('Sold on', date));
      const note = UI.field('text', { placeholder: 'optional', value: existing ? existing.note || '' : '' });
      b.appendChild(fld('Note', note));

      let payNow = null, payAcct = null;
      if (!existing) {
        b.appendChild(el('h2', null, 'PAID NOW'));
        payNow = amountField('');
        b.appendChild(fld('How much they handed over', payNow));
        payAcct = chipRow(accts().map(a => ({ id: a.id, name: a.name })),
          S.get('lastAcct', (accts()[0] || {}).id || ''), null, {});
        b.appendChild(fld('Into', payAcct));
        b.appendChild(el('div', 'note',
          'Leave it blank if they have not paid yet, or put in part of it. Each part shows as owed only once it is due.'));
      }

      h.save = () => {
        const count = Math.max(1, num(n.value, 0));
        const val = num(price.value, 0);
        if (!count || val <= 0) { n.focus(); return false; }
        const id = existing ? existing.id : newId();
        if (existing && existing.date !== date.value) Rec.del('pack', existing.date, existing.id);
        const p = partsOf();
        Rec.set('pack', date.value, id, merge(existing, {
          client: c.id, n: count, price: val, note: note.value.trim(),
          parts: p, when: p > 1 ? when : 'before',
        }));
        if (payNow && num(payNow.value, 0) > 0) {
          const amt = num(payNow.value, 0);
          Rec.set('paid', date.value, newId(), {
            amt: amt, acct: payAcct.get(), client: c.id,
            note: count + ' session package', t: stampFor(date.value, timeOf({ t: Date.now() })), src: 'hand',
          });
          S.set('lastAcct', payAcct.get());
          UI.toast('sold <b>' + count + ' sessions</b>, took <b>' + esc(money(amt)) + '</b>' +
            (amt < val ? ', <b>' + esc(money(val - amt)) + '</b> ' + (p > 1 ? 'to come in parts' : 'still owed') : ''));
        } else {
          UI.toast('sold <b>' + count + ' sessions</b> for ' + esc(money(val)) + ', unpaid');
        }
        Mobile.feedback('success');
        return true;
      };
    },
    actions: [
      { label: 'CANCEL' },
      existing ? { label: 'DELETE', kind: 'bad', fn: () => {
        const keep = Object.assign({}, existing);
        Rec.del('pack', existing.date, existing.id);
        UI.undo('removed that package',
          () => Rec.set('pack', keep.date, keep.id, merge(keep, {})));
        draw(); return true;
      } } : null,
      { label: 'SAVE', kind: 'go', fn: h => { if (h.save() === false) return false; draw(); return true; } },
    ].filter(Boolean),
  });
}

/* a bill */
function billSheet(existing) {
  UI.dialog({
    title: existing ? 'EDIT BILL' : 'A BILL', width: 460,
    body: (b, h) => {
      const name = UI.field('name', { placeholder: 'Rent', value: existing ? existing.name : '' });
      b.appendChild(fld('What', name));
      const amt = amountField(existing ? existing.amt : '');
      b.appendChild(fld('How much each time', amt));
      /* Prepaid electricity has no day of the month. So a bill is monthly on
         a day, or every N days from when it was last paid. */
      const often = chipRow([{ id: 'month', name: 'Once a month' }, { id: 'days', name: 'Every few days' }],
        existing && existing.cycle === 'days' ? 'days' : 'month', () => paintOften());
      b.appendChild(fld('How often', often));
      const day = UI.field('number', { placeholder: '1', value: existing ? existing.day : '' });

/* counting an account: law 1, the only honest way to know a balance */
/* == a statement, line by line, with comments ==
   Tom, 2026-09-14: "I also want to be able to view this and add comments."

   Every line read off a statement is a `recon` row. This lists one account's
   lines as the bank wrote them, newest first and grouped by month, says what
   the app did with each, and takes a comment. The comment is merged into the
   line's own `recon` row, so it stays with that line however often the file
   is read again, and it shows on the purchase or payment the line became.
   The line's date is the one in its fingerprint: a skipped line stores no
   other. */
function stmtLines(acctId) {
  return Rec.all('recon', {}).filter(r => r.payload && r.payload.acct === acctId)
    .map(r => Object.assign({ id: r.key, date: String(r.key).split('|')[1] || r.payload.sdate || '' }, r.payload))
    .sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
}
function stmtSheet(acctId) {
  const lines = stmtLines(acctId);
  const rows = { spend: {}, paid: {}, xfer: {} };
  spendRows({}).forEach(x => { rows.spend[x.key] = x; });
  paidRows({}).forEach(x => { rows.paid[x.key] = x; });
  xfers({}).forEach(x => { rows.xfer[x.key] = x; });
  UI.dialog({
    title: acctName(acctId).toUpperCase() + ' STATEMENT LINES', width: 680,
    body: b => {
      b.appendChild(el('div', 'note', '<b>' + lines.length + '</b> line' + (lines.length === 1 ? '' : 's') +
        ' read from ' + esc(acctName(acctId)) + ' statements, in the bank’s own words. ' +
        'A comment saves when you leave its box. Tap a line to open what it became.'));
      const q = UI.field('search', { placeholder: 'Find a line by its wording, amount or comment' });
      b.appendChild(q);
      const box = el('div');
      b.appendChild(box);
      const paint = () => {
        box.innerHTML = '';
        const n = norm(q.value);
        const shown = lines.filter(l => !n || norm(l.d).indexOf(n) > -1 ||
          String(Math.abs(num(l.amt, 0))).indexOf(n) > -1 || norm(l.comment).indexOf(n) > -1);
        if (!shown.length) {
          box.appendChild(el('div', 'empty', lines.length ? 'No line matches that.'
            : 'Nothing has been read from a statement for this account yet. <b>Read a statement</b> on ACCOUNTS brings its lines in.'));
          return;
        }
        let mo = '', list = null;
        shown.forEach(l => {
          if (monthOf(l.date) !== mo) {
            mo = monthOf(l.date);
            box.appendChild(el('h2', null, esc(monthName(mo).toUpperCase())));
            list = el('div', 'list');
            box.appendChild(list);
          }
          const type = l.kind === 'xfer' ? 'xfer' : l.kind === 'in' ? 'paid' : 'spend';
          const row = l.skip ? null : rows[type][l.spend];
          const what = l.skip ? 'left out' : !row ? 'no longer in the app'
            : type === 'xfer' ? 'a transfer between your accounts'
            : row.src === 'stmt' ? 'added from the statement' : 'matched to what you logged';
          const amt = num(l.amt, 0);
          const r = itemRow(l.d || 'No wording', esc(Day.short(l.date)) + ' · ' + what,
            (amt > 0 ? '+' : '') + money(amt), amt > 0 ? 'in' : '');
          if (row && type === 'spend') r.onclick = () => spendSheet(row);
          else if (row && type === 'paid') r.onclick = () => paidSheet(row);
          const c = UI.field('text', { placeholder: 'Add a comment', value: l.comment || '' });
          c.setAttribute('aria-label', 'Comment on ' + (l.d || 'this line'));
          c.onchange = () => {
            const cur = Rec.get('recon', null, l.id);
            if (!cur) return;
            const v = c.value.trim();
            if ((cur.comment || '') === v) return;
            Rec.set('recon', null, l.id, merge(cur, { comment: v || undefined }));
            l.comment = v;
            Mobile.feedback('tick');
          };
          list.appendChild(stack(r, c));
        });
      };
      q.addEventListener('input', paint);
      paint();
    },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
}
