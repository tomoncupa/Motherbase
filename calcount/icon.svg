<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app's own ring, three quarters full. Everything sits inside the
       central 80% circle, so a phone that crops icons to a circle or a
       squircle never cuts it. -->
  <rect width="512" height="512" fill="#1C7A4A"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="56"/>
  <path d="M256 106 A150 150 0 1 1 106 256" fill="none" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
</svg>
