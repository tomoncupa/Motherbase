<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>make icons</title>
<!--
  Draws the iPhone home-screen icons: one 180px PNG per app per factory theme,
  into shared/icons/<theme>/<app>.png, and the Block set again into
  shared/icons/<app>.png, the default a theme of your own falls back to.

  NOT A BUILD STEP. The suite runs without it. Run it when a drawing in
  shared/icons.js changes, an app's colour slot changes, or a factory theme is
  added:

    1. py -3 tools/save-icons.py            (listens on 127.0.0.1:8920)
    2. serve the repo, e.g. py -3 -m http.server 8919
    3. open http://localhost:8919/tools/make-icons.html

  The page says how many it wrote. Stop the receiver afterwards.

  Since 2026-09-23 every app's picture is its picked tile from icons.js
  (Icons.APP_ART): the cut-corner window with an edge in the app's own
  colour on the dark plate. That is art, the same in every theme, so each
  theme's folder gets the same picture. The window sits inset from the
  square because iOS rounds the corners and would cut the window's own.
-->
<script src="../shared/skins.js"></script>
<script src="../shared/icons.js"></script>
</head>
<body style="background:#111;color:#ddd;font:14px system-ui;padding:16px">
<p id="say">Drawing…</p>
<div id="grid" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script>
(async () => {
  const say = t => { document.getElementById('say').textContent = t; };
  /* every app the icon set knows, so an app added later is never left out */
  const APPS = Object.keys(Icons.ROLES).filter(r => r.indexOf('app.') === 0).map(r => r.slice(4));
  const probe = document.createElement('div');
  document.body.appendChild(probe);
  const rgb = v => { probe.style.color = ''; probe.style.color = v; return getComputedStyle(probe).color; };
  const mix = (a, pct, b) => rgb('color-mix(in srgb, ' + a + ' ' + pct + '%, ' + b + ')');

  await Skins.load('../shared/skins.json');
  const APP_ART = Icons.APP_ART;
  const W = 180, IN = 16, F = W - IN * 2, CUT = F * 10 / 64, EDGE = 3;
  const cutPath = (ctx, x, y, w, k) => {
    ctx.beginPath();
    ctx.moveTo(x + k, y); ctx.lineTo(x + w - k, y); ctx.lineTo(x + w, y + k); ctx.lineTo(x + w, y + w - k);
    ctx.lineTo(x + w - k, y + w); ctx.lineTo(x + k, y + w); ctx.lineTo(x, y + w - k); ctx.lineTo(x, y + k); ctx.closePath();
  };
  const pics = {};
  for (const app of APPS) {
    const art = APP_ART[app];
    if (!art) continue;
    const cv = document.createElement('canvas');
    cv.width = cv.height = W;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#080B10'; ctx.fillRect(0, 0, W, W);
    if (art.edge === 'rainbow') {
      const g = ctx.createConicGradient(0, W / 2, W / 2);
      ['#E0533D', '#F0B323', '#5DBB63', '#4C8DF0', '#9B7BEA', '#E0533D'].forEach((c, i, l) => g.addColorStop(i / (l.length - 1), c));
      ctx.fillStyle = g;
    } else ctx.fillStyle = art.c;
    cutPath(ctx, IN, IN, F, CUT); ctx.fill();
    const glow = ctx.createRadialGradient(W / 2, IN + F * .3, 0, W / 2, IN + F * .3, F * .7 * .75);
    glow.addColorStop(0, mix(art.c, 16, '#0E141D')); glow.addColorStop(1, '#0E141D');
    ctx.fillStyle = glow;
    cutPath(ctx, IN + EDGE, IN + EDGE, F - EDGE * 2, CUT - EDGE * .4); ctx.fill();
    const g = Math.round(F * (art.big ? .82 : 38 / 64));
    const svg = Icons.appSvg(app, { size: g, art: true })
      .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error(app)); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
    ctx.drawImage(img, (W - g) / 2, (W - g) / 2, g, g);
    pics[app] = cv.toDataURL('image/png');
    const i = new Image(); i.src = pics[app]; i.width = 60; i.title = app; i.style.borderRadius = '13px';
    document.getElementById('grid').appendChild(i);
  }
  const out = {};
  for (const app in pics) {
    out[app] = pics[app];
    for (const skin of Skins.data.skins) out[skin.id + '/' + app] = pics[app];
  }
  say('Sending ' + Object.keys(out).length + ' pictures…');
  try {
    const r = await fetch('http://127.0.0.1:8920/', { method: 'POST', body: JSON.stringify(out) });
    say(await r.text());
  } catch (e) {
    say('The receiver is not running: py -3 tools/save-icons.py');
  }
  window.__done = Object.keys(out).length;
})().catch(e => { document.getElementById('say').textContent = 'Failed: ' + e.message; });
</script>
</body>
</html>
