<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>make icons</title>
<!--
  Draws the iPhone home-screen icons: one 180px PNG per app per factory theme,
  into shared/icons/<theme>/<app>.png, and the Block set again into
  shared/icons/<app>.png, the default a theme of your own falls back to.

  NOT A BUILD STEP. The suite runs without it. Run it when a drawing in
  shared/icons.js changes, an app's colour slot changes, or a factory theme is
  added:

    1. py -3 tools/save-icons.py            (listens on 127.0.0.1:8920)
    2. serve the repo, e.g. py -3 -m http.server 8919
    3. open http://localhost:8919/tools/make-icons.html

  The page says how many it wrote. Stop the receiver afterwards.

  A tile is the theme's card colour with the app's chart colour mixed in, the
  same plate recipe as mb-plate (26% at the top, 13% at the bottom, a lit top
  edge at 62%), and the app's drawing in the theme's reading colour, in the
  theme's own stroke recipe. The wobble filter is left off: a picture file
  has no page to hold the filter, and a missing filter hides the drawing.
-->
<script src="../shared/skins.js"></script>
<script src="../shared/icons.js"></script>
</head>
<body style="background:#111;color:#ddd;font:14px system-ui;padding:16px">
<p id="say">Drawing…</p>
<div id="grid" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script>
(async () => {
  const say = t => { document.getElementById('say').textContent = t; };
  const APPS = ['home', 'block', 'status', 'log', 'quest', 'train', 'checkin', 'style', 'arc', 'wealth', 'form', 'portion'];
  const probe = document.createElement('div');
  document.body.appendChild(probe);
  const rgb = v => { probe.style.color = ''; probe.style.color = v; return getComputedStyle(probe).color; };
  const mix = (a, pct, b) => rgb('color-mix(in srgb, ' + a + ' ' + pct + '%, ' + b + ')');
  /* The drawing in the theme's reading colour, unless that colour cannot be
     read on this tile, which is Lego's red: then white or near-black,
     whichever reads. A computed colour is rgb() in 0 to 255 or color(srgb)
     in 0 to 1. */
  const chans = c => { const n = (c.match(/[\d.]+/g) || []).slice(0, 3).map(Number); return /^color\(/.test(c) ? n.map(v => v * 255) : n; };
  const lumOf = c => { const [r, g, b] = chans(c).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
  const ratio = (a, b) => { const x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const inkFor = (tile, ink) => ratio(ink, tile) >= 3 ? ink : (ratio('rgb(255, 255, 255)', tile) >= ratio('rgb(17, 17, 17)', tile) ? 'rgb(255, 255, 255)' : 'rgb(17, 17, 17)');

  await Skins.load('../shared/skins.json');
  const out = {};
  for (const skin of Skins.data.skins) {
    const t = Skins.tokensFor(skin);
    const surf = t['--surface-1'], ink = t['--text-1'];
    for (const app of APPS) {
      const slot = Icons.appSlot(app);
      const tint = slot ? t['--data-' + slot] : t['--accent'];
      const cv = document.createElement('canvas');
      cv.width = cv.height = 180;
      const ctx = cv.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 180);
      grad.addColorStop(0, mix(tint, 26, surf));
      grad.addColorStop(1, mix(tint, 13, surf));
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 180, 180);
      ctx.fillStyle = mix(tint, 62, surf); ctx.fillRect(0, 0, 180, 3);
      const svg = Icons.svg('app.' + app, { size: 108, skin: skin })
        .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')
        .replace(/ filter="[^"]*"/, '')
        .replace(/currentColor/g, inkFor(mix(tint, 26, surf), rgb(ink)));
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error(skin.id + '/' + app)); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
      ctx.drawImage(img, 36, 36, 108, 108);
      const png = cv.toDataURL('image/png');
      out[skin.id + '/' + app] = png;
      if (skin.id === 'block') out[app] = png;
      if (app === 'home') { const i = new Image(); i.src = png; i.width = 48; i.title = skin.id; i.style.borderRadius = '11px'; document.getElementById('grid').appendChild(i); }
    }
  }
  say('Sending ' + Object.keys(out).length + ' pictures…');
  try {
    const r = await fetch('http://127.0.0.1:8920/', { method: 'POST', body: JSON.stringify(out) });
    say(await r.text());
  } catch (e) {
    say('The receiver is not running: py -3 tools/save-icons.py');
  }
  window.__done = Object.keys(out).length;
})().catch(e => { document.getElementById('say').textContent = 'Failed: ' + e.message; });
</script>
</body>
</html>
