<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motherbase backup</title>
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
  /* Block, the house look. A tools page, not an app: the tokens with the
     Block values behind them, the way ui.js writes its own. */
  body { margin: 0; min-height: 100vh; background: var(--bg, #080B10); color: var(--text-1, #DBE7F0);
         font: 16px/1.5 'Inter Tight', 'IBM Plex Sans', system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  h1 { font: 700 22px/1.2 'Chakra Petch', system-ui, sans-serif; letter-spacing: .08em; margin: 0 0 16px;
       color: var(--accent, #F0B323); }
  .panel { background: var(--panel, #0E141D); border-radius: 6px; padding: 16px; }
  #state { font: 600 18px/1.3 'Chakra Petch', system-ui, sans-serif; }
  #detail { color: var(--text-2, #8FA3B5); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>BACKUP</h1>
  <div class="panel">
    <div id="state">Waiting for the store</div>
    <div id="detail">The nightly backup program reads this page. Nothing here needs a press.</div>
  </div>
</main>
<script src="../shared/day.js"></script>
<script src="../shared/records.js"></script>
<script src="../shared/cloud.js"></script>
<script>
/* ── the nightly backup's page ──
   Tom, 2026-09-30: once a day, a full copy of the whole store saved to a
   folder on the PC outside any repo, the last 30 kept.

   desktop/Backup.exe opens this page, unseen, in the desktop programs' own
   store (desktop/data, the one STATUS.exe and the Main Menu share), waits
   until MB_BACKUP.state is 'ready', then reads MB_BACKUP.json in pieces and
   writes it to Documents/Backups/Motherbase nightly. A page cannot write to
   a folder on the PC, so the program does the writing and this page only
   gathers.

   The file is exactly the home screen's "Back up everything" file, so any
   app's DATA, Restore brings it back, merging: a row already newer on the
   device is kept.

   Waits, in order: every row in memory, IndexedDB included (Rec.ready); then,
   if this store is signed in to LIVE SYNC, the first read from the cloud
   merged and ten quiet seconds after the last row arrived, so a row written
   on the phone today is in tonight's copy. Two minutes at most; a store that
   is not signed in, or a cloud that never answers, is backed up as it is and
   the file says so in `synced`. */
(function () {
  var B = window.MB_BACKUP = { state: 'waiting', rows: 0, json: '', why: '', synced: false, took: [], inbox: '' };
  var $ = function (id) { return document.getElementById(id); };
  function show(state, detail) { $('state').textContent = state; if (detail != null) $('detail').textContent = detail; }
  var start = Date.now(), MAX = 120000, QUIET = 10000, WHOLE_MAX = 150000, waited = 0;

  function build() {
    try {
      var rows = Rec.export();
      var bag = { kind: 'motherbase-backup', v: 1, app: '*', at: new Date().toISOString(),
                  from: 'nightly', synced: B.synced, rows: rows };
      B.json = JSON.stringify(bag);
      B.rows = rows.length;
      B.state = 'ready';
      show('Ready: ' + rows.length + ' rows', B.synced ? 'Live sync caught up first.' : B.why);
    } catch (e) {
      B.state = 'error'; B.why = 'the store could not be read: ' + (e && e.message);
      show('Could not read the store', B.why);
    }
  }

  function waitCloud() {
    var C = window.Cloud, s = C && C.state ? C.state() : null;
    if (!s || !s.on) { B.why = 'This store is not signed in to live sync, so it holds what this PC last had.'; return build(); }
    start = Date.now();
    var quietSince = Date.now(), lastGot = s.gotAt;
    show('Waiting for live sync', 'Signed in as ' + (s.email || 'this account') + '.');
    var t = setInterval(function () {
      var st = C.state();
      if (st.gotAt !== lastGot) { lastGot = st.gotAt; quietSince = Date.now(); }
      var caught = st.conn && st.loaded && Date.now() - quietSince >= QUIET;
      if (caught || Date.now() - start > MAX) {
        clearInterval(t);
        B.synced = !!caught;
        if (!caught) B.why = st.conn ? 'Live sync was still sending rows after two minutes.' :
          'Live sync did not connect' + (st.why ? ' (' + st.why + ')' : '') + ', so this holds what this PC last had.';
        build();
      }
    }, 1000);
  }

  /* ── the inbox (2026-11-16) ──
     A program on the PC cannot write to the store; this page can, signed in,
     once a day. Backup.exe reads Documents/Motherbase inbox/*.json and hands
     each file over as window.MB_INBOX = [{name, text}] before this page
     loads. A file is {kind: 'motherbase-inbox', rows: [{type, date, key,
     payload}], gone: [{type, date, key}]}. Only the types in INBOX_TYPES go
     in, so nothing on the PC can write a set or a spend. Rec.set skips a row
     whose payload has not changed, so sending the same file daily is
     harmless; `gone` tombstones a piece its maker no longer has. The names
     taken go back in MB_BACKUP.took and Backup.exe moves those files to
     done/. First user: OUTER HEAVEN's knowledge job, `kpiece` rows for
     ARC's knowledge banks. */
  var INBOX_TYPES = { kpiece: 1, postspeech: 1, draftmade: 1 };
  function inbox() {
    var files = window.MB_INBOX || [], put = 0, del = 0, bad = [];
    files.forEach(function (f) {
      var bag;
      try { bag = JSON.parse(f.text); } catch (e) { bad.push(f.name); return; }
      if (!bag || bag.kind !== 'motherbase-inbox') { bad.push(f.name); return; }
      (bag.rows || []).forEach(function (r) {
        if (!r || !INBOX_TYPES[r.type] || !r.key || !r.payload) return;
        var before = Rec.get(r.type, r.date || null, r.key);
        if (JSON.stringify(before) !== JSON.stringify(r.payload)) { Rec.set(r.type, r.date || null, r.key, r.payload); put++; }
      });
      (bag.gone || []).forEach(function (r) {
        if (!r || !INBOX_TYPES[r.type] || !r.key) return;
        if (Rec.get(r.type, r.date || null, r.key)) { Rec.del(r.type, r.date || null, r.key); del++; }
      });
      B.took.push(f.name);
    });
    B.inbox = files.length ? files.length + ' inbox file' + (files.length === 1 ? '' : 's') + ': ' + put + ' rows in, ' + del + ' removed' +
      (bad.length ? ', not read: ' + bad.join(', ') : '') : '';
  }

  /* Rec.need: TRAIN's sets are kept out of an open until asked for (records.js,
     KEPT OUT), and a backup without them is not a backup.

     Rec.whole (2026-11-16): Rec.ready fires on localStorage alone when
     IndexedDB is slow, and with STATUS.exe, SPEAK.exe and Main Menu.exe on the
     same store it was slower than live sync's ten quiet seconds. Every caught-up
     run from 06:56 that day saved the fast half, 4,700 rows of 26,000, over the
     day's good file. So nothing is gathered until IndexedDB has really
     answered, and a store it never answers for saves nothing: Backup.exe logs
     FAILED and the last good file stays. */
  function failWhole(why) {
    B.state = 'error';
    B.why = why + '; nothing saved, the last good file is kept';
    show('Could not read the whole store', B.why);
  }
  Rec.ready(function () {
    var t0 = Date.now();
    (Rec.need ? Rec.need() : Promise.resolve()).then(function () {
      if (!Rec.whole) return { ok: true };
      show('Waiting for the whole store', 'IndexedDB has not answered yet.');
      return Promise.race([Rec.whole(), new Promise(function (res) {
        setTimeout(function () { res({ ok: false, why: 'IndexedDB did not answer in ' + Math.round(WHOLE_MAX / 1000) + ' s' }); }, WHOLE_MAX);
      })]);
    }).then(function (w) {
      waited = Math.round((Date.now() - t0) / 1000);
      if (!w || !w.ok) return failWhole((w && w.why) || 'IndexedDB failed');
      try { inbox(); } catch (e) { B.inbox = 'the inbox could not be read: ' + (e && e.message); }
      /* a slow store is worth a line in backup.log, and the inbox line is the
         one Backup.exe already writes */
      if (waited >= 5) B.inbox = (B.inbox ? B.inbox + '; ' : '') + 'the store took ' + waited + ' s to load';
      show('Store loaded', B.inbox); setTimeout(waitCloud, 1500);
    });
  });
})();
</script>
</body>
</html>
