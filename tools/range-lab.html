<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Range Lab</title>
<script src="../shared/skins.js"></script>
<script src="../shared/day.js"></script>
<script src="../shared/range.js"></script>
<style>
body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--font-body);padding:var(--s-4)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-4)}
.card{background:var(--surface-1);border-radius:var(--radius-md);overflow:hidden}
.ctl{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.ctl button{min-height:var(--tap);padding:0 var(--s-4);background:var(--surface-2);color:var(--text-1);border:0;border-radius:var(--radius-sm);font:inherit;cursor:pointer}
h1{font-family:var(--font-display);font-size:var(--f-2);letter-spacing:var(--track-cap);color:var(--text-2);margin:0}
</style>
</head>
<body>
<div class="wrap">
<h1>RANGE LAB · shared/range.js on made-up history, touches no store</h1>
<div class="ctl">
  <button data-h="short">3 WEEKS</button><button data-h="year">1 YEAR, BLOCKS</button>
  <button data-h="long">4 YEARS, 2 BLOCKS</button><button data-h="none">EMPTY</button>
  <button data-w="390">PHONE WIDTH</button><button data-w="980">FULL WIDTH</button>
</div>
<div id="cards"></div>
</div>
<script>
/* Made-up history, seeded, so a look can be compared run to run. */
if (window.Skins && Skins.restore) try { Skins.restore('range-lab'); } catch (e) {}
function rng(s) { return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function add(d, n) { return new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10); }
function history(kind) {
  var to = '2026-09-25', r = rng(11), out = { sessions: [], phases: [], to: to };
  if (kind === 'none') return out;
  var n = kind === 'short' ? 21 : kind === 'year' ? 365 : 1700, vol = 5000;
  for (var i = n; i >= 0; i--) {
    var d = add(to, -i);
    if (r() < (kind === 'long' ? 0.36 : 0.45)) {
      vol = Math.max(1500, vol + (r() - 0.45) * 900);
      var sets = 10 + Math.round(r() * 16);
      out.sessions.push({ date: d, vol: vol * sets / 18, sets: sets, reps: sets * 9, pr: r() < 0.08 });
    }
  }
  if (kind === 'year') {
    out.phases = [{ name: 'Base', start: add(to, -300) }, { name: 'Strength', start: add(to, -220) },
      { name: 'Hypertrophy', start: add(to, -150), end: add(to, -100) }, { name: 'Peak', start: add(to, -60) }];
  } else if (kind === 'long') {
    out.phases = [{ name: 'Push Pull Legs', start: add(to, -70) }, { name: 'Deload', start: add(to, -20), end: add(to, -14) }];
  } else if (kind === 'short') out.phases = [{ name: 'Block 1', start: add(to, -14) }];
  return out;
}
var H = 'long', Wd = 980;
function draw() {
  var box = document.getElementById('cards');
  box.innerHTML = '';
  document.querySelector('.wrap').style.maxWidth = Wd + 'px';
  var data = history(H);
  [['sessions', 'fuji'], ['sets', 'ink'], ['volume', 'dusk'], ['blocks', 'fuji']].forEach(function (p) {
    var c = document.createElement('div'); c.className = 'card'; box.appendChild(c);
    Range.mount(c, data, 230, { base: p[0], print: p[1] });
  });
}
document.querySelectorAll('[data-h]').forEach(function (b) { b.onclick = function () { H = b.dataset.h; draw(); }; });
document.querySelectorAll('[data-w]').forEach(function (b) { b.onclick = function () { Wd = +b.dataset.w; draw(); }; });
draw();
</script>
</body>
</html>
