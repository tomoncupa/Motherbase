<style>
/* COACH, built 2026-09-22. Tom: "Can coach look like a pokemon box on Pc?"
   and "Optimize COACH to make use of iPad and desktop space".

   So the layout is chosen by width, not by device:
     · one column below 760px, so it still works on a phone in a pinch
     · two from 760px, which is an iPad held upright: the box on the left,
       the client and their first sets stacked on the right
     · three from 1180px, an iPad on its side or any desk: the box, the
       client, and the programming, all on screen at once
   The box stays put while the right side scrolls, the way the PC box does. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-body);font-size:var(--f-3);
  font-weight:var(--w-body);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);background:var(--surface-1);box-shadow:var(--e-1),var(--rim)}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}
main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-7) + var(--safe-b))}
.cols{display:grid;gap:var(--s-4);max-width:1680px;margin:0 auto;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:760px){
  /* an iPad held upright: the box with the programming under it on the
     left, where the hands work, and the client's history down the right */
  .cols{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
  .boxcol{grid-column:1;grid-row:1}
  .progcol{grid-column:1;grid-row:2}
  .clientcol{grid-column:2;grid-row:1 / span 2}
}
@media (min-width:1180px){
  .cols{grid-template-columns:300px minmax(0,1fr) 400px}
  .boxcol{grid-column:1;grid-row:1;position:sticky;top:0}
  .clientcol{grid-column:2;grid-row:1}
  .progcol{grid-column:3;grid-row:1}
  .progcol{position:sticky;top:0}
}
@media (min-width:1440px){ .cols{grid-template-columns:380px minmax(0,1fr) 420px} }
.card{border-radius:var(--radius-lg);background:var(--surface-1);padding:var(--s-4);box-shadow:var(--e-1),var(--rim)}
.col{display:flex;flex-direction:column;gap:var(--s-4);min-width:0}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-3)}
.empty{color:var(--text-muted);line-height:var(--lh-body)}

/* the box */
.boxhead{display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-3)}
.boxhead .t{flex:1;text-align:center}
.boxhead .t b{display:block;font-family:var(--font-display);font-size:var(--f-4);letter-spacing:var(--track-cap)}
.boxhead .t span{font-size:var(--f-1);color:var(--text-muted)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s-1)}
.slot{aspect-ratio:1/1;min-height:var(--tap);border:0;border-radius:var(--radius-md);cursor:pointer;
  background:var(--surface-2);color:var(--text-2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;padding:var(--s-1);overflow:hidden;font:inherit}
.slot.none{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
.slot.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft, var(--surface-3))}
.slot canvas{flex:0 0 auto}
.slot .nm{font-size:var(--f-1);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:var(--lh-tight)}
.boxtabs{margin-top:var(--s-3)}

/* the client */
.who{display:flex;align-items:center;gap:var(--s-4)}
.who .nm{font-family:var(--font-display);font-size:var(--f-5);font-weight:var(--w-bold)}
.who .sub{color:var(--text-muted);font-size:var(--f-2);margin-top:var(--s-1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:var(--s-2);margin-top:var(--s-4)}
.stat{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--s-3)}
.stat span{display:block;font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap)}
.stat b{font-size:var(--f-5);font-variant-numeric:tabular-nums}
.range{overflow:hidden;padding:0}
table.lifts{width:100%;border-collapse:collapse;font-size:var(--f-2)}
table.lifts td,table.lifts th{padding:var(--s-2) var(--s-1);text-align:left;border-bottom:1px solid var(--border)}
table.lifts th{font-size:var(--f-1);color:var(--text-muted);font-weight:var(--w-bold);letter-spacing:var(--track-cap)}
table.lifts td.n{text-align:right;font-variant-numeric:tabular-nums}
.recent{display:flex;flex-direction:column;gap:var(--s-2)}
.recent .r{display:flex;gap:var(--s-3);align-items:baseline;padding:var(--s-2) 0;border-bottom:1px solid var(--border)}
.recent .d{flex:0 0 auto;font-weight:var(--w-bold);font-variant-numeric:tabular-nums}
.recent .x{flex:1;min-width:0;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .v{color:var(--text-muted);font-variant-numeric:tabular-nums}

/* check-ins */
.cidays{display:flex;gap:var(--s-1);overflow-x:auto;margin-bottom:var(--s-3);padding-bottom:var(--s-1)}
.cidays button{flex:0 0 auto;min-height:var(--tap);padding:0 var(--s-3);border:0;border-radius:var(--radius-md);
  background:var(--surface-2);color:var(--text-2);font:inherit;font-size:var(--f-1);
  font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
.cidays button.sel{box-shadow:inset 0 0 0 2px var(--accent);color:var(--text-1)}
.cishots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s-2);margin-bottom:var(--s-3)}
.cishots figure{margin:0}
.cishots button{display:block;width:100%;padding:0;border:0;border-radius:var(--radius-md);
  overflow:hidden;background:var(--surface-2);cursor:pointer}
.cishots img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.cishots figcaption{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);
  margin-top:var(--s-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cians{display:flex;flex-direction:column;gap:var(--s-2)}
.cians .a{display:flex;gap:var(--s-3);align-items:baseline;padding:var(--s-2) 0;border-bottom:1px solid var(--border)}
.cians .k{flex:1;min-width:0;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cians .v{font-weight:var(--w-bold);font-variant-numeric:tabular-nums}
.cians .ch{flex:0 0 auto;min-width:calc(var(--tap) * 1.1);text-align:right;color:var(--text-muted);font-variant-numeric:tabular-nums}
.ciwords{color:var(--text-2);line-height:var(--lh-body);margin-top:var(--s-3)}
.ciwords b{display:block;font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap)}
.cibig{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:var(--radius-md)}

/* programming */
.day{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--s-3);margin-bottom:var(--s-3)}
.dayhead{display:flex;gap:var(--s-2);align-items:center;margin-bottom:var(--s-2)}
.dayhead input{flex:1;min-width:0}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--tap) * 1.6) calc(var(--tap) * 1.25) var(--tap);gap:var(--s-1);align-items:center;margin-bottom:var(--s-1)}
.exrow input{min-width:0}
.exlabels{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--tap) * 1.6) calc(var(--tap) * 1.25) var(--tap);gap:var(--s-1);
  font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);margin-bottom:var(--s-1)}
.row2{display:flex;gap:var(--s-2);flex-wrap:wrap}
.row2 .mb-btn{flex:1}
.plist .p{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap);padding:var(--s-2) 0;border-bottom:1px solid var(--border);cursor:pointer}
.plist .p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .p .c{color:var(--text-muted);font-size:var(--f-2)}
.ico{width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;justify-content:center;
  border:0;background:none;color:var(--text-muted);cursor:pointer;border-radius:var(--radius-md)}
.ico svg{width:var(--s-5);height:var(--s-5)}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-2)}
.picker button{border:0;border-radius:var(--radius-md);background:var(--surface-2);min-height:var(--tap);padding:var(--s-2);cursor:pointer}
.picker button.on{box-shadow:inset 0 0 0 2px var(--accent)}

/* a client's TRAIN, over COACH, with one way back */
#over{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:var(--bg)}
#over.on{display:flex}
#over .obar{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:var(--safe-t) var(--s-2) 0 var(--s-4);background:var(--surface-1);box-shadow:var(--e-1),var(--rim)}
#over .obar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--font-display);font-size:var(--f-2);letter-spacing:var(--track-cap);color:var(--text-muted)}
#over iframe{flex:1;min-height:0;width:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<header>
  <div class="logo">CO<b>ACH</b></div>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" id="sends" title="What clients have sent">SENDS</button>
  <button class="mb-btn go mb-press mb-tap" id="open">OPEN A CLIENT FILE</button>
  <button class="mb-btn mb-press mb-tap" onclick="settings()">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>
<main class="mb-scroll"><div class="cols" id="main"></div></main>
<div id="over" role="dialog" aria-label="Client training">
  <div class="obar"><b id="overName"></b>
    <button class="mb-btn go mb-press mb-tap" id="overDone">DONE</button></div>
</div>

<script>
/* ══════════════════ COACH ══════════════════
   DOCTRINE: "Clients send their TRAIN logs here. For now, TRAIN with
   profiles: track each client's strength." Tom only, never in the client
   build.

   Clients are CHECK IN's `cperson` rows, the same list and the same
   Pokémon, so a client added in either app is in both. COACH adds one field
   to them, `box`, by patching, so CHECK IN's own fields are never touched.

   A client's training arrives as the file TRAIN's Send To Coach makes. Its
   rows are kept under COACH's own types with the client's id in front of the
   key, the way CHECK IN keeps a client's photos, so a client's squats never
   land in Tom's own TRAIN:
     cset      one set          key pid|set key, dated
     cex       one exercise     key pid|exercise key
     cphase    one block        key pid|phase key
     csession  one day          key pid|, dated
   Each is merged with the updated_at it came with, so sending the same file
   twice changes nothing and a newer file only adds what is new.

   Their check-ins are read, not invented: CHECK IN already keys a client's
   `cval`, `cphoto`, `cmark` and `cref` the same `pid|key` way, under the same
   `cperson`. So COACH shows them on the profile and takes a check-in file
   through the same button, and the two apps are looking at one set of rows
   rather than two copies of one.

   What goes back is a program, `cprog`: one row per program, because a
   program is written, sent and sold as one piece. A client's own first sets
   are the program keyed `c-<pid>`; anything else is a program in the
   library, to reuse or sell. Weights are kept in kilograms, as TRAIN keeps
   them, and shown in the unit chosen in Settings. */
const APP = { id: 'coach', name: 'Coach', icon: '✦', blurb: 'your clients, their training, their first sets',
  types: ['cset', 'cex', 'cphase', 'csession', 'cprog',
    'cexcat', 'csgroup', 'cgoal', 'cprogram', 'cprogday', 'cprogex'] };
Skins.load('../shared/skins.json').then(() => { Skins.restore(APP.id); if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* `client` and `sesh` are WEALTH's shape and `cperson` and the check-in rows
   are CHECK IN's. COACH writes into all of them, so they ride COACH's sheet
   tab too, and it reads theirs so a device where WEALTH or CHECK IN was never
   opened still knows. */
const CI_TYPES = ['cval', 'cphoto', 'cmark', 'cref', 'checkin'];
IO.register({ app: APP.id, name: APP.name, types: APP.types.concat(['cperson', 'client', 'sesh'], CI_TYPES),
  reads: { checkin: ['cperson'].concat(CI_TYPES), wealth: ['client', 'sesh'] } });

const BOXES = [{ id: 'one', name: '1:1' }, { id: 'online', name: 'ONLINE' }, { id: 'past', name: 'PAST' }];
const SLOTS = 30;
const esc = UI.esc;
const ico = r => (window.Icons && Icons.svg(r)) || '';
let seq = 0;
const newId = () => Rec.USER + '-' + Date.now().toString(36) + '-' + (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
const opt = (k, d) => { const v = Rec.setting(APP.id, k); return v == null ? d : v; };
const unit = () => opt('unit', 'kg');
const KG_LB = 2.20462;
const show = kg => kg == null || kg === '' ? '' : String(Math.round((unit() === 'lb' ? kg * KG_LB : kg) * 10) / 10);
const toKg = v => { const n = parseFloat(v); if (!(n >= 0)) return null; return Math.round((unit() === 'lb' ? n / KG_LB : n) * 1000) / 1000; };
const e1 = (kg, r) => kg > 0 && r > 0 && r <= 12 ? kg * (1 + r / 30) : 0;

/* ── clients ── */
const people = () => Rec.map('cperson');
const clientsIn = box => Object.entries(people())
  .filter(([, p]) => (p.box || 'one') === box)
  .sort((a, b) => (a[1].slot == null ? 999 : a[1].slot) - (b[1].slot == null ? 999 : b[1].slot) || String(a[1].name).localeCompare(String(b[1].name)));
const own = (type, pid) => Rec.all(type).filter(r => String(r.key).indexOf(pid + '|') === 0);
const setsOf = pid => own('cset', pid);
const exOf = pid => { const m = {}; own('cex', pid).forEach(r => { m[r.key.slice(pid.length + 1)] = r.payload; }); return m; };

/* ── a client's check-ins ──
   CHECK IN keys a client's answers and photos `pid|field`, under the same
   `cperson` COACH draws in the box. So nothing is copied and nothing is a
   second list: this reads the rows CHECK IN wrote, for the client already
   selected. The questions come off `cperson.fields`, which is the list that
   client's own file asked, so the labels are theirs and not Tom's. A client
   whose file predates that list has their questions read back off the rows
   themselves, which gives a plainer label and never an empty card.
   A photo is a big row, so it arrives from IndexedDB after the first paint;
   `Rec.ready(draw)` at the bottom of this file is what puts it on screen. */
const ciBare = (key, pid) => String(key).slice(pid.length + 1);
const ciTitle = s => String(s).replace(/[-_]+/g, ' ').replace(/^./, c => c.toUpperCase());
function ciFields(pid) {
  const p = people()[pid] || {};
  if (Array.isArray(p.fields) && p.fields.length) {
    return p.fields.slice().sort((a, b) => (a.ord || 0) - (b.ord || 0));
  }
  const m = {};
  own('cphoto', pid).forEach(r => { const id = ciBare(r.key, pid); m[id] = { id: id, label: ciTitle(id), kind: 'photo' }; });
  own('cval', pid).forEach(r => {
    const id = ciBare(r.key, pid);
    if (m[id] || id === 'weight') return;
    m[id] = { id: id, label: ciTitle(id), kind: typeof (r.payload || {}).v === 'number' ? 'number' : 'text' };
  });
  return Object.keys(m).sort().map(k => m[k])
    .sort((a, b) => (a.kind === 'photo' ? 0 : 1) - (b.kind === 'photo' ? 0 : 1));
}
function ciDates(pid) {
  const s = {};
  ['cval', 'cphoto', 'checkin'].forEach(t => own(t, pid).forEach(r => { if (r.date) s[r.date] = 1; }));
  return Object.keys(s).sort();
}
const ciVal = (date, id, pid) => { const r = Rec.get('cval', date, pid + '|' + id); return r ? r.v : null; };
const ciPhoto = (date, pose, pid) => Rec.get('cphoto', date, pid + '|' + pose);
const ciNum = v => v == null || v === '' ? '' : String(Math.round(+v * 10) / 10);
/* The change since the check-in before it, stated and never judged: a number
   going down is not a win or a loss until Tom decides it is. */
function ciChange(now, was) {
  if (typeof now !== 'number' || typeof was !== 'number') return '';
  const d = Math.round((now - was) * 10) / 10;
  if (!d) return '—';
  return (d > 0 ? '+' : '−') + Math.abs(d);
}

/* ── one client, two apps ──
   Tom, 2026-09-22: "I don't see the clients in WEALTH show up in COACH...
   treat them as having equal custody." A COACH client and a WEALTH client
   are one person. Each side carries the other's id, `cperson.wc` and
   `client.cp`, and neither app is the master:
     · a WEALTH client with no COACH card gets one, in 1:1, or PAST if done
     · a COACH client with no WEALTH client gets one at no price, so nothing
       shows as owed until a price is set there: monthly for ONLINE, per
       session for 1:1
     · the name, and whether they are past, follow whichever side changed
       it last, read off the store's field times
   An existing pair is joined by an exact name the first time, when only one
   card has that name. A side that was deleted is never brought back. */
const freeSlot = to => { const taken = {}; clientsIn(to).forEach(([, p]) => { taken[p.slot] = 1; }); let i = 0; while (taken[i]) i++; return i; };
const normName = v => String(v || '').trim().toLowerCase();
const fieldAt = (type, key, f) => {
  const r = Rec.row(type, null, key); if (!r) return 0;
  return r.ft ? (r.ft[f] != null ? r.ft[f] : (r.fb || 0)) : (Date.parse(r.updated_at) || 0);
};
const creatureFor = id => { const ks = Creatures.keys(); let h = 0; String(id).split('').forEach(c => { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return ks[h % ks.length]; };
let linking = false;
function link() {
  if (linking || !Rec.hydrated) return;
  linking = true;
  try {
    const ws = Rec.map('client'), ps = people();
    const joined = {};
    Object.entries(ps).forEach(([pid, p]) => { if (p.wc && ws[p.wc]) joined[p.wc] = pid; });
    Object.entries(ws).forEach(([wid, c]) => {
      if (joined[wid]) return;
      if (c.cp && Rec.tombstone('cperson', null, c.cp)) return;
      let pid = c.cp && ps[c.cp] ? c.cp : null;
      if (!pid) {
        const same = Object.entries(ps).filter(([, p]) => !(p.wc && ws[p.wc]) && normName(c.name) && normName(p.name) === normName(c.name));
        if (same.length === 1) pid = same[0][0];
      }
      if (pid) { Rec.patch('cperson', null, pid, { wc: wid }); ps[pid].wc = wid; }
      else {
        pid = 'w-' + wid;
        if (Rec.tombstone('cperson', null, pid)) return;
        const to = c.status === 'done' ? 'past' : 'one';
        Rec.set('cperson', null, pid, { name: c.name || 'Client', animal: creatureFor(wid), unit: unit(), fields: null, seen: null, box: to, slot: freeSlot(to), wc: wid });
        ps[pid] = people()[pid];
      }
      if (c.cp !== pid) Rec.patch('client', null, wid, { cp: pid });
      joined[wid] = pid;
    });
    Object.entries(people()).forEach(([pid, p]) => {
      if (p.wc && Rec.get('client', null, p.wc)) return;
      if (p.wc && Rec.tombstone('client', null, p.wc)) return;
      const wid = 'c-' + pid;
      if (Rec.tombstone('client', null, wid)) return;
      Rec.set('client', null, wid, { name: p.name || 'Client', rate: 0, cycle: p.box === 'online' ? 'month' : 'sesh', every: 1, start: Day.today(),
        status: p.box === 'past' ? 'done' : 'on', cp: pid });
      Rec.patch('cperson', null, pid, { wc: wid });
    });
    Object.entries(people()).forEach(([pid, p]) => {
      const c = p.wc && Rec.get('client', null, p.wc); if (!c) return;
      /* 1.0.1 made every one per session; an ONLINE one it made, still unpriced, is monthly */
      if (p.wc === 'c-' + pid && p.box === 'online' && c.cycle === 'sesh' && !(+c.rate > 0)) Rec.patch('client', null, p.wc, { cycle: 'month' });
      if (c.name && p.name && String(c.name) !== String(p.name)) {
        if (fieldAt('client', p.wc, 'name') > fieldAt('cperson', pid, 'name')) Rec.patch('cperson', null, pid, { name: c.name });
        else Rec.patch('client', null, p.wc, { name: p.name });
      }
      const past = (p.box || 'one') === 'past', done = c.status === 'done';
      if (past !== done) {
        if (fieldAt('client', p.wc, 'status') > fieldAt('cperson', pid, 'box')) {
          const to = done ? 'past' : 'one';
          Rec.patch('cperson', null, pid, { box: to, slot: freeSlot(to) });
        } else Rec.patch('client', null, p.wc, { status: past ? 'done' : 'on' });
      }
    });
  } finally { linking = false; }
}

/* ── logging a session ──
   Tom, 2026-09-22: "Most of my clients are online clients who just report
   their workouts... The log function just fills in their train." So a
   logged session is training first. It only reaches WEALTH for a client
   WEALTH bills per session or by package, where a session IS the bill. The sets are the client's own
   rows, `cset` under their id, keyed `pid|k-...` so a file from their TRAIN
   can never collide with them, and they count in STRENGTH, the sessions and
   the range exactly like a set they logged themselves.
   A day with at least one set with reps is one session in WEALTH: one `sesh`
   row per client per day, keyed so logging more sets adds nothing, and taken
   back when the day's last set goes. */
const slugOf = v => normName(v).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x';
const coachSets = (pid, date) => Rec.all('cset', { date: date }).filter(r => String(r.key).indexOf(pid + '|k-') === 0)
  .sort((a, b) => (a.payload.ord || 0) - (b.payload.ord || 0) || String(a.key).localeCompare(String(b.key)));
function exFor(pid, name) {
  const want = normName(name), ex = exOf(pid);
  const hit = Object.keys(ex).find(k => normName(ex[k] && ex[k].name) === want);
  if (hit) return hit;
  const k = 'x-' + slugOf(name);
  Rec.set('cex', null, pid + '|' + k, { name: name.trim() });
  return k;
}
const billsBySession = p => { const c = p && p.wc && Rec.get('client', null, p.wc); return !!c && (c.cycle === 'sesh' || c.cycle === 'session' || c.cycle === 'pack'); };
function countSession(pid, date) {
  const p = people()[pid]; if (!p || !p.wc) return;
  const key = 'k-' + pid, any = billsBySession(p) && coachSets(pid, date).some(r => r.payload.r > 0);
  if (any) { if (!Rec.get('sesh', date, key)) Rec.set('sesh', date, key, { client: p.wc, src: 'coach', pid: pid }); }

}

  Rec.set('cset', date, pid + '|k-' + newId(), { ex: exKey, kg: from ? from.kg : null, r: from ? from.r : null, u: unit(), done: 1, ord: ord, src: 'coach' });

}

/* ── opening a client's file ── */
/* categories, supersets and goals too since 1.0.3, so the client's own TRAIN
   opens in COACH with the muscle groups it was logged under */
const MAP = { set: 'cset', exercise: 'cex', phase: 'cphase', session: 'csession', excat: 'cexcat', sgroup: 'csgroup', goal: 'cgoal' };
/* A check-in file, the one CHECK IN's Send makes. Everything in COACH is a
   client, so unlike CHECK IN there is nothing to ask about whose it is. The
   rows are kept under the same `pid|key` CHECK IN uses, so opening the file
   in either app puts it in the same place, and a row is only written when
   what arrived is newer than what is here — dots Tom has already checked are
   never undone by an old file. */
function takeCheckin(bag) {
  const pid = String(bag.pid || ('n-' + slugOf(bag.name || 'client')));
  const cur = people()[pid];
  const who = { name: bag.name || (cur && cur.name) || 'Client', animal: bag.animal || (cur && cur.animal) || 'pikachu',
    unit: bag.unit || (cur && cur.unit) || 'kg', seen: new Date().toISOString() };
  if (Array.isArray(bag.fields) && bag.fields.length) who.fields = bag.fields;
  if (!cur) Rec.set('cperson', null, pid, Object.assign({ fields: null, box: 'one', slot: freeSlot('one') }, who));
  else Rec.patch('cperson', null, pid, who);
  let fresh = 0;
  bag.rows.forEach(r => {
    if (!r || !r.type) return;
    let type = r.type, payload = r.payload, key = String(r.key == null ? '' : r.key);
    if (type === 'ev') {
      if (key !== 'weight' || !payload || !payload.e || !payload.e.length) return;
      type = 'cval'; payload = { v: payload.e[payload.e.length - 1].v };
    }
    if (CI_TYPES.indexOf(type) < 0) return;
    const k = pid + '|' + key, have = Rec.row(type, r.date || null, k);
    if (have && (!r.updated_at || have.updated_at >= r.updated_at)) return;
    /* The store does not bump a row whose payload is unchanged, so counting
       every write would call the same file "new rows" every time it is
       opened. Count what actually changed. */
    const moved = !have || JSON.stringify(have.payload) !== JSON.stringify(payload);
    Rec.set(type, r.date || null, k, payload);
    if (moved) fresh++;
  });
  if (bag.date) ciDay = bag.date;
  return { pid: pid, name: who.name, rows: bag.rows.length, fresh: fresh };
}
function takeFile(bag) {
  if (bag && bag.kind === 'motherbase-checkin' && Array.isArray(bag.rows)) return takeCheckin(bag);
  if (!bag || bag.kind !== 'motherbase-train' || !bag.pid || !Array.isArray(bag.rows)) {
    throw new Error('That is not a file from TRAIN or CHECK IN. Ask for Send To Coach, in TRAIN’s Profile menu, or Send in CHECK IN.');
  }
  const pid = String(bag.pid);
  const cur = people()[pid];
  if (!cur) {
    Rec.set('cperson', null, pid, { name: bag.name || 'Client', animal: bag.animal || 'pikachu', unit: bag.unit || 'kg', fields: null, seen: null, box: 'one', slot: freeSlot('one') });
  } else {
    const ch = {};
    if (bag.name && !cur.name) ch.name = bag.name;
    if (bag.animal && !cur.animal) ch.animal = bag.animal;
    if (bag.unit) ch.unit = bag.unit;
    if (Object.keys(ch).length) Rec.patch('cperson', null, pid, ch);
  }
  const rows = [];
  bag.rows.forEach(r => {
    const type = MAP[r.type];
    if (!type || !r.updated_at) return;
    const key = pid + '|' + (r.key == null ? '' : r.key);
    rows.push({ id: Rec.idOf(type, r.date || null, key), user_id: Rec.USER, type: type, date: r.date || null, key: key,
      payload: r.payload, updated_at: r.updated_at, deleted: r.deleted ? 1 : 0 });
  });
  const n = Rec.merge(rows);
  return { pid: pid, name: bag.name || 'Client', rows: rows.length, fresh: n };
}

/* ── one client ── */
function sessionsOf(pid) {
  const ex = exOf(pid), by = {};
  setsOf(pid).forEach(r => {
    const s = r.payload; if (s.warm) return;
    const d = by[r.date] || (by[r.date] = { date: r.date, vol: 0, ex: [] });
    d.vol += (+s.kg || 0) * (+s.r || 0);
    const nm = (ex[s.ex] || {}).name || 'Exercise';
    if (d.ex.indexOf(nm) < 0) d.ex.push(nm);
  });
  return Object.keys(by).sort().map(k => by[k]);
}
function liftsOf(pid) {
  const ex = exOf(pid), by = {};
  setsOf(pid).forEach(r => {
    const s = r.payload; if (s.warm || !(s.kg > 0) || !(s.r > 0)) return;
    const x = by[s.ex] || (by[s.ex] = { name: (ex[s.ex] || {}).name || 'Exercise', best: 0, bs: null, days: {}, last: '' });
    x.days[r.date] = 1;
    if (r.date > x.last) x.last = r.date;
    const v = e1(s.kg, s.r);
    if (v > x.best) { x.best = v; x.bs = s; }
  });
  return Object.values(by).filter(x => x.best > 0)
    .sort((a, b) => Object.keys(b.days).length - Object.keys(a.days).length).slice(0, 10);
}

/* One check-in on the client's profile: the photos of that day, then every

let ciDay = '';

  const c = document.createElement('div'); c.className = 'card';
  const h = document.createElement('h2');
  h.textContent = 'CHECK IN · ' + String(Day.label(ciDay)).toUpperCase();
  c.appendChild(h);

  if (days.length > 1) {
    const strip = document.createElement('div'); strip.className = 'cidays';
    days.slice(-12).forEach(d => {
      const b = document.createElement('button');
      b.className = 'mb-press mb-tap' + (d === ciDay ? ' sel' : '');
      b.textContent = Day.label(d, { day: 'numeric', month: 'short' });
      b.onclick = () => { ciDay = d; draw(); };
      strip.appendChild(b);
    });
    c.appendChild(strip);
  }

  const fields = ciFields(pid);
  const shots = [];
  fields.forEach(f => {
    if (f.kind !== 'photo') return;
    const ph = ciPhoto(ciDay, f.id, pid);
    if (ph && ph.img) shots.push([f, ph]);
  });
  if (shots.length) {
    const g = document.createElement('div'); g.className = 'cishots';
    shots.forEach(pair => {
      const f = pair[0], ph = pair[1];
      const fig = document.createElement('figure');
      const b = document.createElement('button'); b.className = 'mb-press';
      b.setAttribute('aria-label', 'See ' + f.label + ' bigger');
      const im = document.createElement('img');
      im.src = ph.img; im.alt = f.label + ', ' + Day.label(ciDay); im.loading = 'lazy';
      b.appendChild(im);
      b.onclick = () => bigShot(f.label, ph, ciDay);
      fig.appendChild(b);
      const cap = document.createElement('figcaption'); cap.textContent = f.label;
      fig.appendChild(cap);
      g.appendChild(fig);
    });
    c.appendChild(g);
  }

  const ans = document.createElement('div'); ans.className = 'cians';
  const line = (label, value, change) => {
    const r = document.createElement('div'); r.className = 'a';
    r.innerHTML = '<span class="k">' + esc(label) + '</span><span class="v">' + esc(value) +
      '</span><span class="ch">' + esc(change || '') + '</span>';
    ans.appendChild(r);
  };
  const wNow = ciVal(ciDay, 'weight', pid);
  if (wNow != null && wNow !== '') {
    line('Weight', ciNum(wNow) + ' ' + (p.unit || 'kg'), prev ? ciChange(wNow, ciVal(prev, 'weight', pid)) : '');
  }
  const words = [];
  fields.forEach(f => {
    if (f.kind === 'photo' || f.id === 'weight') return;
    const v = ciVal(ciDay, f.id, pid);
    if (v == null || v === '') return;
    if (f.kind === 'text' || typeof v !== 'number') { words.push([f.label, String(v)]); return; }
    const tail = f.kind === 'scale' ? ' / 5' : (f.unit ? ' ' + f.unit : '');
    line(f.label, ciNum(v) + tail, prev ? ciChange(v, ciVal(prev, f.id, pid)) : '');
  });
  if (ans.children.length) c.appendChild(ans);
  words.forEach(w => {
    const d = document.createElement('div'); d.className = 'ciwords';
    d.innerHTML = '<b>' + esc(w[0]) + '</b>' + esc(w[1]);
    c.appendChild(d);
  });
  if (!shots.length && !ans.children.length && !words.length) {
    const e = document.createElement('p'); e.className = 'empty';
    e.textContent = 'Nothing answered on this check-in.';
    c.appendChild(e);
  }
  col.appendChild(c);
}
function bigShot(label, ph, date) {
  UI.dialog({
    title: String(label).toUpperCase() + ' · ' + String(Day.label(date)).toUpperCase(),
    width: 560,
    body: b => {
      const im = document.createElement('img');
      im.className = 'cibig'; im.src = ph.img; im.alt = label + ', ' + Day.label(date);
      b.appendChild(im);
    },
    actions: [{ label: 'CLOSE' }],
  });
}

/* ── programs ── */
const progs = () => Rec.map('cprog');
const clientProgKey = pid => 'c-' + pid;
const blankDay = n => ({ name: 'Day ' + n, ex: [{ name: '', sets: [{ kg: null, r: null }] }] });
function saveProg(key, days, name) {
  const cur = Rec.get('cprog', null, key);
  if (cur) Rec.patch('cprog', null, key, name == null ? { days: days } : { days: days, name: name });
  else Rec.set('cprog', null, key, { name: name || 'Program', pid: key.indexOf('c-') === 0 ? key.slice(2) : null, days: days });
}
function fileOf(key) {
  const p = Rec.get('cprog', null, key);
  return { kind: 'motherbase-program', v: 1, id: key, name: p.name || 'Program', from: opt('me', 'Coach'), at: new Date().toISOString(),
    days: (p.days || []).map(d => ({ name: d.name, ex: (d.ex || []).filter(x => x.name).map(x => ({
      name: x.name, sets: (x.sets || []).slice(0, 1).filter(s => s.kg != null || s.r != null).map(s => ({ kg: s.kg, r: s.r })) })) })) };
}
function sendProg(key, label) {
  const bag = fileOf(key), text = JSON.stringify(bag);
  const file = 'PROGRAM ' + (label || bag.name) + '.json';
  let f = null;
  try { f = new File([text], file, { type: 'application/json' }); } catch (e) {}
  if (f && navigator.canShare && navigator.canShare({ files: [f] }) && Mobile.touch) {
    navigator.share({ files: [f] }).then(() => UI.toast('Sent'), () => {});
    return;
  }
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = file;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  UI.toast('Saved as <b>' + esc(file) + '</b>. The client opens it with <b>Open A Program</b> in TRAIN.');
}
/* The editor. Every field saves when it is left, so there is no Save
   button to forget, and a refresh straight after typing keeps it
   (UI.commitFocused blurs the box on the way out). */
function editor(el, key, opts) {
  const p = Rec.get('cprog', null, key) || { name: opts.name || 'Program', days: [blankDay(1)] };
  const days = JSON.parse(JSON.stringify(p.days && p.days.length ? p.days : [blankDay(1)]));
  const names = {};
  if (sel) Object.values(exOf(sel)).forEach(x => { if (x && x.name) names[x.name] = 1; });
  Object.values(progs()).forEach(pp => (pp.days || []).forEach(d => (d.ex || []).forEach(x => { if (x.name) names[x.name] = 1; })));
  const dl = document.createElement('datalist'); dl.id = 'exnames';
  Object.keys(names).sort().forEach(n => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });
  el.appendChild(dl);
  const commit = () => saveProg(key, days, null);
  if (opts.named) {
    const nm = UI.field('text', { value: p.name || '', placeholder: 'Program name' });
    nm.onchange = () => saveProg(key, days, nm.value.trim() || 'Program');
    nm.style.marginBottom = 'var(--s-3)';
    el.appendChild(nm);
  }
  days.forEach((d, di) => {
    const box = document.createElement('div'); box.className = 'day';
    const hd = document.createElement('div'); hd.className = 'dayhead';
    const dn = UI.field('text', { value: d.name || '', placeholder: 'Day name' });
    dn.onchange = () => { d.name = dn.value.trim() || ('Day ' + (di + 1)); commit(); };
    hd.appendChild(dn);
    const rm = document.createElement('button'); rm.className = 'ico mb-press mb-tap'; rm.innerHTML = ico('delete');
    rm.setAttribute('aria-label', 'Remove day');
    rm.onclick = () => { const was = days.splice(di, 1)[0]; commit(); draw(); UI.undo('Day removed', () => { days.splice(di, 0, was); commit(); draw(); }); };
    hd.appendChild(rm);
    box.appendChild(hd);
    const lab = document.createElement('div'); lab.className = 'exlabels';
    lab.innerHTML = '<span>EXERCISE</span><span>FIRST SET ' + unit().toUpperCase() + '</span><span>REPS</span><span></span>';
    box.appendChild(lab);
    (d.ex || []).forEach((x, xi) => {
      const row = document.createElement('div'); row.className = 'exrow';
      const n = UI.field('text', { value: x.name || '', placeholder: 'Squat' }); n.setAttribute('list', 'exnames');
      n.setAttribute('aria-label', 'Exercise');
      n.onchange = () => { x.name = n.value.trim(); commit(); };
      const s0 = (x.sets && x.sets[0]) || (x.sets = [{ kg: null, r: null }])[0];
      const wv = UI.field('text', { value: show(s0.kg) }); wv.inputMode = 'decimal'; wv.setAttribute('aria-label', 'First set weight');
      wv.onchange = () => { s0.kg = UI.amount ? toKg(wv.value) : toKg(wv.value); commit(); };
      const rv = UI.field('text', { value: s0.r == null ? '' : String(s0.r) }); rv.inputMode = 'numeric'; rv.setAttribute('aria-label', 'First set reps');
      rv.onchange = () => { const k = parseInt(rv.value, 10); s0.r = k > 0 ? k : null; commit(); };
      const del = document.createElement('button'); del.className = 'ico mb-press mb-tap'; del.innerHTML = ico('close');
      del.setAttribute('aria-label', 'Remove exercise');
      del.onclick = () => { d.ex.splice(xi, 1); commit(); draw(); };
      row.appendChild(n); row.appendChild(wv); row.appendChild(rv); row.appendChild(del);
      box.appendChild(row);
    });
    const add = document.createElement('button'); add.className = 'mb-btn mb-press mb-tap'; add.textContent = '+ EXERCISE';
    add.style.width = '100%';
    add.onclick = () => { (d.ex || (d.ex = [])).push({ name: '', sets: [{ kg: null, r: null }] }); commit(); draw(); };
    box.appendChild(add);
    el.appendChild(box);
  });
  const r2 = document.createElement('div'); r2.className = 'row2';
  const ad = document.createElement('button'); ad.className = 'mb-btn mb-press mb-tap'; ad.textContent = '+ DAY';
  ad.onclick = () => { days.push(blankDay(days.length + 1)); commit(); draw(); };
  r2.appendChild(ad);
  (opts.extra || []).forEach(b => r2.appendChild(b));
  el.appendChild(r2);
}
function btn(label, cls, fn) { const b = document.createElement('button'); b.className = 'mb-btn ' + (cls || '') + ' mb-press mb-tap'; b.textContent = label; b.onclick = fn; return b; }

function drawProg(col) {
  const card = document.createElement('div'); card.className = 'card';
  const tabs = UI.segmented([{ id: 'first', name: 'FIRST SETS' }, { id: 'lib', name: 'PROGRAMS' }], tab, v => { tab = v; editing = ''; draw(); });
  tabs.style.marginBottom = 'var(--s-4)';
  card.appendChild(tabs);
  const p = people()[sel];
  if (tab === 'first') {
    if (!p) { const e = document.createElement('p'); e.className = 'empty'; e.textContent = 'Pick a client to program their first sets.'; card.appendChild(e); col.appendChild(card); return; }
    const key = clientProgKey(sel);
    const h = document.createElement('h2'); h.textContent = 'FIRST SETS FOR ' + String(p.name || 'CLIENT').toUpperCase(); card.appendChild(h);
    const why = document.createElement('p'); why.className = 'empty'; why.style.marginBottom = 'var(--s-3)';
    why.textContent = 'The weight and reps of each exercise’s first set. In TRAIN the rest of their sets fill from their last session.';
    card.appendChild(why);
    if (!Rec.get('cprog', null, key)) Rec.set('cprog', null, key, { name: (p.name || 'Client') + '’s program', pid: sel, days: [blankDay(1)] });
    editor(card, key, { extra: [btn('SEND TO ' + String(p.name || 'CLIENT').toUpperCase(), 'go', () => sendProg(key, p.name))] });
  } else if (editing) {
    const back = btn('‹ ALL PROGRAMS', '', () => { editing = ''; draw(); });
    back.style.marginBottom = 'var(--s-3)';
    card.appendChild(back);
    const extra = [btn('SAVE AS FILE', 'go', () => sendProg(editing))];
    if (p) extra.push(btn('USE FOR ' + String(p.name || 'CLIENT').toUpperCase(), '', () => {
      const src = Rec.get('cprog', null, editing);
      saveProg(clientProgKey(sel), JSON.parse(JSON.stringify(src.days || [])), null);
      tab = 'first'; editing = ''; draw();
      UI.toast('<b>' + esc(src.name) + '</b> is now ' + esc(p.name) + '’s first sets');
    }));
    editor(card, editing, { named: true, extra: extra });
  } else {
    const list = Object.entries(progs()).filter(([, v]) => !v.pid).sort((a, b) => String(a[1].name).localeCompare(String(b[1].name)));
    const pl = document.createElement('div'); pl.className = 'plist';
    if (!list.length) pl.innerHTML = '<p class="empty">A program here is one you can send to anyone, or sell. It opens in their TRAIN as a routine.</p>';
    list.forEach(([k, v]) => {
      const r = document.createElement('div'); r.className = 'p'; r.tabIndex = 0;
      const n = (v.days || []).reduce((a, d) => a + (d.ex || []).filter(x => x.name).length, 0);
      r.innerHTML = '<span class="nm">' + esc(v.name || 'Program') + '</span><span class="c">' + (v.days || []).length + ' days · ' + n + ' exercises</span>';
      r.onclick = () => { editing = k; draw(); };
      Mobile.hold(r, e => { UI.menu(e.clientX, e.clientY, [
        { label: 'Save As File', fn: () => sendProg(k) },
        { label: 'Delete Program', kind: 'bad', fn: () => { const was = Rec.get('cprog', null, k); Rec.del('cprog', null, k); UI.undo('Program deleted', () => Rec.set('cprog', null, k, was)); } },
      ]); });
      pl.appendChild(r);
    });
    card.appendChild(pl);
    const nb = btn('+ NEW PROGRAM', 'go', () => {
      const k = newId(); Rec.set('cprog', null, k, { name: 'New program', pid: null, days: [blankDay(1)] }); editing = k; draw();
    });
    nb.style.cssText = 'width:100%;margin-top:var(--s-3)';
    card.appendChild(nb);
  }
  col.appendChild(card);
}

/* ── the screen ── */
function draw() {
  link();
  const m = document.getElementById('main');
  const keep = m.parentElement ? m.parentElement.scrollTop : 0;
  const act = document.activeElement;
  if (act && act.tagName === 'INPUT' && m.contains(act)) return;   /* never redraw under a finger that is typing */
  m.innerHTML = '';
  if (sel && !people()[sel]) sel = '';
  const c1 = document.createElement('div'); c1.className = 'col boxcol'; drawBox(c1);
  const c2 = document.createElement('div'); c2.className = 'col clientcol'; drawClient(c2);
  const c3 = document.createElement('div'); c3.className = 'col progcol'; drawProg(c3);
  m.appendChild(c1); m.appendChild(c2); m.appendChild(c3);
  if (m.parentElement) m.parentElement.scrollTop = keep;
}

/* ── the shelf: what clients have sent, without a file ──

   Tom, 2026-09-23. A client's SEND TO COACH now puts a parcel on
   `drop/coach/<their account>` in the database, and this takes it off. The
   database's rules are what make that safe: a client may write only to their
   own slot and read none of it, and only this account may read the shelf or
   clear it. CLOUD.md has the block.

   Nothing new happens to the data. A parcel holds the same bag the file
   always held, so it goes through the same `takeFile` and merges on
   `updated_at` like any sync. The transport changed; the rules about what a
   client's rows are and where they land did not.

   A parcel is cleared only AFTER its rows are in. Until COACH has taken it,
   that parcel is the only copy anywhere but the client's own phone, and a
   send that vanished because the read half worked and the write half did not
   is exactly the silent loss this suite is built against. */
let shelfN = 0;
function shelfSay(n, why) {
  const b = document.getElementById('sends');
  if (!b) return;
  shelfN = n;
  b.textContent = n ? 'SENDS · ' + n : 'SENDS';
  b.classList.toggle('go', !!n);
  b.title = why || (n ? n + ' waiting' : 'Nothing waiting');
}

/* `loud` is a press. Quiet is the look on load, which may only change the
   button: a shelf that cannot be read on a device with no signal is not an
   error worth a message nobody asked for. */
function lookShelf(loud) {
  if (!window.Cloud || !Cloud.waiting) {
    shelfSay(0, 'Live sync is not set up here');
    if (loud) UI.toast('Live sync is not set up on this device', { bad: true });
    return Promise.resolve();
  }
  return Cloud.waiting().then(list => {
    shelfSay(list.length);
    if (!list.length) { if (loud) UI.toast('Nothing waiting'); return; }
    if (loud) return takeShelf(list);
  }, e => {
    const m = (e && e.message) || 'the shelf could not be read';
    shelfSay(0, m);
    if (loud) UI.toast(esc(m), { bad: true });
  });
}

function takeShelf(list) {
  let took = 0, fresh = 0, bad = 0, last = null;
  return list.reduce((p, parcel) => p.then(() => {
    let res = null;
    try { res = parcel.body ? takeFile(parcel.body) : null; } catch (e) { res = null; }
    if (!res) { bad++; return; }
    took++; fresh += res.fresh; last = res;
    return Cloud.took(parcel.from).catch(() => {});
  }), Promise.resolve()).then(() => {
    if (last) {
      sel = last.pid; Rec.setting(APP.id, 'sel', sel);
      const who = people()[sel]; if (who) { box = who.box || 'one'; Rec.setting(APP.id, 'box', box); }
    }
    shelfSay(0);
    const parts = [];
    if (took) parts.push('<b>' + took + '</b> in, ' + (fresh ? fresh + ' new rows' : 'nothing new'));
    if (bad) parts.push(bad + ' could not be read and was left on the shelf');
    UI.toast(parts.join('. ') || 'Nothing taken', { bad: !took });
    draw();
  });
}
document.getElementById('sends').onclick = () => lookShelf(true);

function settings() {
  UI.settings(APP.id, [{ id: 'coach', name: 'COACH', draw: pane => {
    pane.appendChild(UI.row('Weights in', 'How COACH shows and takes weights', UI.segmented(
      [{ id: 'kg', name: 'KG' }, { id: 'lb', name: 'LB' }], unit(), v => { Rec.setting(APP.id, 'unit', v); draw(); })));
    const me = UI.field('text', { value: opt('me', ''), placeholder: 'Coach' });
    me.onchange = () => Rec.setting(APP.id, 'me', me.value.trim());
    pane.appendChild(UI.row('Your name', 'On every program you send', me));

    /* The account id, because the drop rules in Firebase need it written in
       and there is nowhere else in the suite that shows it. It is not a
       secret and it is not a password: it only names which account the rules
       hand the shelf to. It is not in this repo, which is why it is read off
       the live sign-in here rather than written down anywhere. */
    const idb = document.createElement('button');
    idb.type = 'button'; idb.className = 'mb-btn mb-press mb-tap';
    idb.textContent = 'reading…'; idb.disabled = true;
    if (window.Cloud && Cloud.who) Cloud.who().then(who => {
      idb.textContent = 'COPY'; idb.disabled = false; idb.title = who.uid;
      idb.onclick = () => {
        const ok = () => { idb.textContent = 'COPIED'; setTimeout(() => { idb.textContent = 'COPY'; }, 1500); };
        if (navigator.clipboard) navigator.clipboard.writeText(who.uid).then(ok, () => UI.toast(esc(who.uid)));
        else UI.toast(esc(who.uid));
      };
    }, e => { idb.textContent = 'not signed in'; idb.title = (e && e.message) || ''; });
    pane.appendChild(UI.row('Your account id', 'Goes in the drop rules in Firebase, in both places. See CLOUD.md', idb));

    const look = document.createElement('button');
    look.type = 'button'; look.className = 'mb-btn mb-press mb-tap'; look.textContent = 'CHECK NOW';
    look.onclick = () => lookShelf(true);
    pane.appendChild(UI.row('What clients have sent', 'COACH also looks once every time it opens', look));
  } }]);
}

/* ── the client's own TRAIN ──
   Tom, 2026-09-22: "It should act exactly like train just on their
   profile". LOG A SESSION opens the real TRAIN over COACH, pointed at this
   client (train/index.html?client=<pid>; the top of that file says how), so
   everything TRAIN does, Tom does on their log. The quick logger above,
   drawLog, is no longer reached from any button and is kept as it was. */
function openTrain(pid) {
  const p = people()[pid]; if (!p) return;
  const o = document.getElementById('over');
  let f = o.querySelector('iframe');
  if (!f || f.dataset.pid !== pid) {
    if (f) f.remove();
    f = document.createElement('iframe');
    f.dataset.pid = pid;
    f.title = (p.name || 'Client') + ' in TRAIN';
    f.src = '../train/index.html?client=' + encodeURIComponent(pid);
    o.appendChild(f);
  }
  document.getElementById('overName').textContent = String(p.name || 'Client').toUpperCase() + ' · TRAIN';
  o.classList.add('on');
}
document.getElementById('overDone').onclick = () => { document.getElementById('over').classList.remove('on'); draw(); };

/* A set Tom logs in the client's TRAIN is keyed `pid|k-...`, the mark the
   quick logger always used, so it bills in WEALTH exactly the way a set
   logged here did: one session per day, for a client paid per session. */
const billQ = {};
let billT = null;
Rec.on(rows => {
  (rows || []).forEach(r => {
    if (!r || r.type !== 'cset' || !r.date) return;
    const k = String(r.key), i = k.indexOf('|k-');
    if (i > 0) billQ[k.slice(0, i) + '|' + r.date] = 1;
  });
  if (!Object.keys(billQ).length) return;
  clearTimeout(billT);
  billT = setTimeout(() => {
    Object.keys(billQ).forEach(q => { delete billQ[q]; const j = q.lastIndexOf('|'); countSession(q.slice(0, j), q.slice(j + 1)); });
  }, 400);
});

let rt = null;
Rec.on(() => { clearTimeout(rt); rt = setTimeout(draw, 60); });
Rec.ready(draw);
draw();
/* After the first paint, never before it: the shelf needs the network and a
   paint must not. */
setTimeout(() => lookShelf(false), 1500);
</script>
