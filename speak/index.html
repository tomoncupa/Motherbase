<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  background-image:var(--tex-image);background-size:var(--tex-size);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);position:relative;z-index:2;
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em}
.logo b{color:var(--accent)}
.spacer{flex:1}
/* the streak, as a number beside a flame. It says the state and nothing else */
.streak{display:inline-flex;align-items:center;gap:var(--s-1);font-family:var(--font-mono);
  font-size:var(--f-2);color:var(--text-2);min-height:var(--tap);padding:0 var(--s-2)}
.streak.zero{color:var(--text-muted)}
.streak [data-icon]{display:inline-flex}
#nav{flex:0 0 auto;display:flex;gap:var(--s-1);padding:var(--s-2) var(--s-4);background:var(--surface-1);overflow-x:auto}
#nav button{flex:1;min-height:var(--tap);border:0;border-radius:var(--radius-md);background:none;color:var(--text-muted);
  font-family:var(--font-display);letter-spacing:var(--track-cap);cursor:pointer;white-space:nowrap;padding:0 var(--s-3)}
#nav button.on{background:var(--surface-2);color:var(--text-1)}
main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-9) + var(--safe-b))}
.wrap{max-width:calc(var(--s-10) * 6);margin:0 auto;display:flex;flex-direction:column;gap:var(--s-4)}
/* a card, and the rows inside it. mb-card and mb-plate draw them; the app
   writes no background, border or shadow of its own */
.card{border-radius:var(--radius-lg);padding:var(--s-4)}
.card h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-3);text-transform:uppercase;
  display:flex;align-items:center;gap:var(--s-3)}
.card h2 .r{margin-left:auto;font-family:var(--font-mono);letter-spacing:0;text-transform:none}
.muted{color:var(--text-muted);line-height:var(--lh-body);font-size:var(--f-2)}
.list{display:flex;flex-direction:column;gap:var(--s-2)}
.row{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3);min-height:var(--tap);
  border-radius:var(--radius-md);cursor:pointer;text-align:left;width:100%;border:0}
.row .ic{flex:0 0 auto;width:var(--s-6);height:var(--s-6);display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-full);color:var(--text-muted)}
.row.done .ic{color:var(--success)}
.row.now .ic{color:var(--accent)}
.row.locked{opacity:.55}
.row .tx{flex:1;min-width:0}
.row .nm{display:block;font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-body)}
.row .sub{display:block;font-size:var(--f-2);color:var(--text-2);line-height:var(--lh-body);margin-top:var(--s-1)}
.row .num{font-family:var(--font-mono);font-size:var(--f-2);color:var(--text-2);white-space:nowrap;flex:0 0 auto;text-align:right}
.row .num b{display:block;font-size:var(--f-4);color:var(--text-1);font-weight:var(--w-bold)}
.row.done .num b{color:var(--success)}
.row.miss .num b{color:var(--warn)}
/* the skill columns on PATH */
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--s-10) * 2),1fr));gap:var(--s-4)}
.skill h3{font-family:var(--font-display);font-size:var(--f-3);font-weight:var(--w-bold);letter-spacing:var(--track-cap);
  display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-1)}
.skill h3 i{display:inline-block;width:var(--s-3);height:var(--s-3);border-radius:var(--radius-full);background:var(--c)}
.skill .why{font-size:var(--f-2);color:var(--text-muted);line-height:var(--lh-body);margin-bottom:var(--s-3)}
.step{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-3);min-height:var(--tap);
  border-radius:var(--radius-md);cursor:pointer;width:100%;border:0;text-align:left;--c:var(--c)}
.step .n{font-family:var(--font-mono);font-size:var(--f-1);color:var(--text-muted);width:var(--s-5);flex:0 0 auto}
.step .nm{flex:1;min-width:0;font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-body)}
.step .st{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:var(--s-6);height:var(--s-6);
  border-radius:var(--radius-full);color:var(--text-muted)}
.step.passed .st{color:var(--success)}
.step.now .st{color:var(--accent)}
.step.locked{opacity:.5}
/* the numbers: label, value, unit */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--s-10),1fr));gap:var(--s-3)}
.stat{padding:var(--s-3);border-radius:var(--radius-md)}
.stat .k{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);color:var(--text-muted);text-transform:uppercase}
.stat .v{font-family:var(--font-mono);font-size:var(--f-6);font-weight:var(--w-bold);line-height:var(--lh-tight);margin-top:var(--s-1)}
.stat .v small{font-size:var(--f-2);color:var(--text-muted);margin-left:var(--s-1);font-weight:var(--w-body)}
.stat .d{font-size:var(--f-2);color:var(--text-2);margin-top:var(--s-1);line-height:var(--lh-body)}
.stat.met .v{color:var(--success)}
.stat.miss .v{color:var(--warn)}
.acts{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-3)}
.acts .mb-btn{display:inline-flex;align-items:center;gap:var(--s-2)}
.chartbox{margin-top:var(--s-2)}
/* the goal and the why, on a drill sheet and on a today card */
.goal{display:grid;grid-template-columns:var(--s-9) 1fr;gap:var(--s-2) var(--s-3);align-items:baseline;
  font-size:var(--f-2);line-height:var(--lh-body);margin:var(--s-3) 0}
.goal b{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);color:var(--text-muted);text-transform:uppercase}
.goal .g{color:var(--text-1);font-weight:var(--w-bold)}
.prompt{font-size:var(--f-4);line-height:var(--lh-loose);padding:var(--s-3);border-radius:var(--radius-md);background:var(--surface-2)}
.prompt ul{padding-left:var(--s-5)}
.prompt.read{font-size:var(--f-3);max-height:calc(var(--s-10) * 3);overflow:auto}
.tx mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:var(--radius-sm);padding:0 var(--s-1)}
.tx mark.c{background:color-mix(in srgb,var(--danger) 35%,transparent)}
.tx{font-size:var(--f-2);line-height:var(--lh-loose);color:var(--text-2)}
/* ── the take screen: the whole window while a take runs ── */
#take{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:var(--bg);
  background-image:var(--tex-image);background-size:var(--tex-size);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) calc(var(--s-4) + var(--safe-b))}
#take.on{display:flex}
#take .top{display:flex;align-items:center;gap:var(--s-3);flex:0 0 auto}
#take .top .nm{font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-cap);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#take .clock{font-family:var(--font-mono);font-size:var(--f-5);font-weight:var(--w-bold);font-variant-numeric:tabular-nums}
#take .mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:var(--s-4);max-width:calc(var(--s-10) * 5);
  width:100%;margin:0 auto;overflow:auto}
#take .count{font-family:var(--font-display);font-size:var(--f-9);font-weight:var(--w-bold);text-align:center;color:var(--accent)}
#take .say{font-family:var(--font-display);font-size:var(--f-4);text-align:center;color:var(--text-2);letter-spacing:var(--track-cap)}
#take .meters{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-3);max-width:calc(var(--s-10) * 5);width:100%;margin:0 auto}
#take .meter{padding:var(--s-3);border-radius:var(--radius-md);text-align:center}
#take .meter .k{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);color:var(--text-muted);text-transform:uppercase}
#take .meter .v{font-family:var(--font-mono);font-size:var(--f-5);font-weight:var(--w-bold);margin-top:var(--s-1);font-variant-numeric:tabular-nums}
#take .meter.in .v{color:var(--success)}
#take .meter.out .v{color:var(--warn)}
#take .meter.off .v{color:var(--text-muted)}
#take .level{height:var(--s-2);border-radius:var(--radius-full);background:var(--surface-2);overflow:hidden;margin-top:var(--s-2)}
#take .level i{display:block;height:100%;width:0;background:var(--accent);transition:width var(--dur-tap) linear}
#take .foot{flex:0 0 auto;display:flex;justify-content:center;gap:var(--s-3);margin-top:var(--s-4)}
#take .foot .mb-btn{min-width:calc(var(--s-10) + var(--s-6));display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2)}
#cam{position:absolute;right:var(--s-4);top:calc(var(--s-3) + var(--safe-t) + var(--tap) + var(--s-3));width:calc(var(--s-10) + var(--s-4));
  aspect-ratio:3/4;object-fit:cover;border-radius:var(--radius-md);transform:scaleX(-1);display:none;box-shadow:var(--e-2)}
#cam.on{display:block}
/* the breath ring on the warm-up */
.ring{display:flex;flex-direction:column;align-items:center;gap:var(--s-3)}
.ring .big{font-family:var(--font-display);font-size:var(--f-8);font-weight:var(--w-bold);color:var(--accent)}
@media (max-width:640px){
  .path{grid-template-columns:1fr}
  #take .meters{grid-template-columns:repeat(3,1fr)}
  #take .count{font-size:var(--f-8)}
}

<main class="mb-scroll"><div class="wrap" id="main"></div></main>

<div id="take" role="dialog" aria-modal="true">
  <div class="top">
    <span class="nm" id="tkName"></span>
    <span class="clock" id="tkClock">0:00</span>
    <button class="mb-btn mb-press mb-tap" id="tkStop" aria-label="Stop" data-icon="stop"></button>
  </div>

  <div class="mid" id="tkMid"></div>
  <div class="meters" id="tkMeters"></div>
  <div class="foot" id="tkFoot"></div>
</div>

<script>
/* ══════════════ SPEAK ══════════════
   Practice for talking to a camera, measured. Tom, 2026-09-15: pace, filler
   words, stream of consciousness and bullet points, mumbling and stuttering,
   eye contact, "you know what I mean" and "right". Built like Duolingo: a
   path of short drills, a daily warm-up, a streak, and every drill says its
   goal and why. speak/CLAUDE.md is the brief; speak/RESEARCH.md is where
   every number below came from.

   Nothing on screen judges. It counts, shows the target, and says met or not
   met against a target he can change. */

const APP = {
  id: 'speak',
  name: 'Speak',
  icon: '◍',
  blurb: 'talk to the camera, measured: pace, fillers, flow, clarity, eyes',
  types: ['take', 'topic'],
};

Skins.load('../shared/skins.json').then(() => { Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
IO.register({ app: APP.id, name: APP.name, types: APP.types });

const $ = s => document.querySelector(s);
const esc = UI.esc;
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const ICN = role => '<span data-icon="' + role + '"></span>';
const paintIcons = n => { if (window.Icons) Icons.paint(n || document.body); };
const r1 = v => Math.round(v * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const opt = (k, def) => { const v = Rec.setting(APP.id, k); return v == null ? def : v; };
const optOn = (k, def) => { const v = opt(k, def); return v === true || +v === 1; };
let seq = 0;
const newId = () => Rec.USER + '-' + Date.now().toString(36) + '-' + (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

/* ══════════════ the ear ══════════════
   Everything measured from sound, in one object, so it can be tested on a
   buffer with known counts as well as fed live from the microphone.

   It works in 10ms frames: loudness in dB, how much of the energy is
   high-frequency (consonants live at 2 to 4kHz, so this is the crispness
   proxy), and every second frame a pitch reading if the frame is voiced. The
   summary follows de Jong & Wempe (2009): a syllable is a voiced peak in
   loudness with a dip on either side; a silence of 250ms or more is a pause.
   Tuned 2026-09-15 on four clips with counted syllables (97 in all): 29 of
   29, 13 of 14, 3 of 3 and 51 of 51. Held sounds and stammered starts are
   proxies and are named as such on screen. */
function Ear(sr) {
  const HOP = Math.round(sr * 0.01);
  const PW = Math.round(sr * 0.03);
  const DS = Math.max(1, Math.round(sr / 12000));
  const lagLo = Math.round(sr / DS / 400), lagHi = Math.round(sr / DS / 70);
  const keep = new Float32Array(PW);
  let kept = 0;
  const frames = [];
  let carry = new Float32Array(0);
  let prev = 0;

  function pitchOf() {
    const n = Math.floor(PW / DS);
    const x = new Float32Array(n);
    let mean = 0;
    for (let i = 0; i < n; i++) { x[i] = keep[i * DS]; mean += x[i]; }
    mean /= n;
    let e0 = 0;
    for (let i = 0; i < n; i++) { x[i] -= mean; e0 += x[i] * x[i]; }
    if (e0 < 1e-9) return 0;
    let best = 0, bestLag = 0;
    for (let lag = lagLo; lag <= Math.min(lagHi, n - 8); lag++) {
      let s = 0, e1 = 0, e2 = 0;
      for (let i = 0; i + lag < n; i++) { s += x[i] * x[i + lag]; e1 += x[i] * x[i]; e2 += x[i + lag] * x[i + lag]; }
      const r = s / Math.sqrt(e1 * e2 + 1e-12);
      if (r > best) { best = r; bestLag = lag; }
    }
    if (best < 0.62 || !bestLag) return 0;
    for (let lag = lagLo; lag < bestLag; lag++) {
      let s = 0, e1 = 0, e2 = 0;
      for (let i = 0; i + lag < n; i++) { s += x[i] * x[i + lag]; e1 += x[i] * x[i]; e2 += x[i + lag] * x[i + lag]; }
      const r = s / Math.sqrt(e1 * e2 + 1e-12);
      if (r > best * 0.95 && Math.abs(lag * 2 - bestLag) <= 2) { bestLag = lag; break; }
    }
    return sr / DS / bestLag;
  }
  function frame(buf, at) {
    let e = 0, d = 0, p = prev;
    for (let i = 0; i < HOP; i++) { const v = buf[at + i]; e += v * v; const df = v - p; d += df * df; p = v; }
    prev = p;
    const rms = Math.sqrt(e / HOP);
    const db = 20 * Math.log10(rms + 1e-7);
    const hf = e > 1e-9 ? d / (e * 2) : 0;
    const room = PW - HOP;
    keep.copyWithin(0, HOP); keep.set(buf.subarray(at, at + HOP), room);
    kept = Math.min(PW, kept + HOP);
    let f0 = -1;
    if (frames.length % 2 === 0 && kept >= PW) f0 = db > -50 ? pitchOf() : 0;
    frames.push({ db: db, hf: hf, f0: f0 });
  }
  const ear = {
    sr: sr, frames: frames,
    feed(chunk) {
      let buf = chunk;
      if (carry.length) { buf = new Float32Array(carry.length + chunk.length); buf.set(carry); buf.set(chunk, carry.length); }
      let at = 0;
      while (at + HOP <= buf.length) { frame(buf, at); at += HOP; }
      carry = buf.slice(at);
    },
    seconds() { return frames.length * 0.01; },
    /** the loudness of the last 100ms, 0 to 1, for a level bar */
    level() {
      const n = frames.length; if (!n) return 0;
      let m = -100; for (let i = Math.max(0, n - 10); i < n; i++) m = Math.max(m, frames[i].db);
      return clamp((m + 60) / 55, 0, 1);
    },
    /** everything counted so far. o.from limits it to frames after a time in seconds */
    summary(o) {
      o = o || {};
      const from = Math.max(0, Math.round((o.from || 0) * 100));
      const N = frames.length - from;
      if (N < 20) return null;
      const F = i => frames[from + i];
      const dbs = []; for (let i = 0; i < N; i++) dbs.push(F(i).db);
      const sorted = dbs.slice().sort((a, b) => a - b);
      const q = p => sorted[Math.min(N - 1, Math.floor(p * N))];
      const floor = q(0.1), peak = q(0.98);
      const speakAt = Math.max(floor + 10, peak - 25);
      const f0 = new Array(N);
      for (let i = 0; i < N; i++) f0[i] = F(i).f0 >= 0 ? F(i).f0 : (i ? f0[i - 1] : 0);
      const voiced = f0.map((v, i) => v > 0 && dbs[i] > speakAt);
      const SM = 1, DIP = 1, GAP = 8;
      const sm = dbs.map((v, i) => { let s = 0, n = 0; for (let k = -SM; k <= SM; k++) { const j = i + k; if (j >= 0 && j < N) { s += dbs[j]; n++; } } return s / n; });
      const on = dbs.map(v => v > speakAt);
      const runs = []; let a = 0;
      for (let i = 1; i <= N; i++) if (i === N || on[i] !== on[a]) { runs.push({ on: on[a], a: a, b: i }); a = i; }
      const PAUSE = 25, LONG = 150;                       /* 250ms is a pause; 1.5s is a long one */
      const pauses = [], longs = [];
      let speechFrames = 0, first = -1, last = -1;
      runs.forEach(r => {
        const len = r.b - r.a;
        if (r.on) { speechFrames += len; if (first < 0) first = r.a; last = r.b; }
        else if (len >= PAUSE) { pauses.push(len); if (len >= LONG) longs.push(len); }
        else speechFrames += len;
      });
      if (first >= 0) {
        const lead = runs[0].on ? 0 : runs[0].b, tail = runs[runs.length - 1].on ? 0 : N - runs[runs.length - 1].a;
        if (!runs[0].on && lead >= PAUSE) { pauses.shift(); if (lead >= LONG) longs.shift(); }
        if (!runs[runs.length - 1].on && tail >= PAUSE && pauses.length) { pauses.pop(); if (tail >= LONG) longs.pop(); }
        speechFrames -= (lead < PAUSE ? lead : 0) + (tail < PAUSE ? tail : 0);
      }
      const spoken = first < 0 ? 0 : (last - first) * 0.01;
      const phon = Math.max(0, speechFrames) * 0.01;
      const pauseSec = pauses.reduce((s, v) => s + v, 0) * 0.01;
      /* syllables */
      let syll = 0, lastPeak = -100, i = 0, valley = 1e9;
      const peaksAt = [];
      for (i = 0; i < N; i++) {
        if (!on[i]) { valley = 1e9; continue; }
        valley = Math.min(valley, sm[i]);
        const isMax = sm[i] >= sm[i - 1 | 0] && sm[i] >= (i + 1 < N ? sm[i + 1] : -1e9) &&
          (i < 2 || sm[i] >= sm[i - 2]) && (i + 2 >= N || sm[i] >= sm[i + 2]);

/* Fillers and crutch phrases in a transcript. Um, uh and their cousins count

/* ══════════════ the eyes, where the face finder loads ══════════════

   If it cannot load, the drill runs and says eyes were not measured.

   On the lens is decided against a reading taken during the three-second
   count, when the screen says to look at the lens: the eyes' own look
   direction (the landmarker's blendshapes) and the head's turn and tilt (the

/* ══════════════ takes ══════════════
   One row per take: the drill, its numbers, the goals as they were, the
   transcript if there was one, and met or not. Dated on the day. */
const takes = () => Rec.all('take').map(r => Object.assign({ key: r.key, date: r.date }, r.payload)).sort((a, b) => (a.at || 0) - (b.at || 0));
const takesOn = d => takes().filter(t => t.date === d);
const passedEver = id => takes().some(t => t.drill === id && t.pass);
const doneToday = id => takesOn(Day.today()).some(t => t.drill === id);
const lastTake = id => { const l = takes().filter(t => t.drill === id); return l[l.length - 1] || null; };
function warmToday() { const w = takesOn(Day.today()).filter(t => t.drill === 'warm'); return w[w.length - 1] || null; }
function crispRef() { const w = warmToday(); return w && w.m && w.m.crispRaw ? w.m.crispRaw : null; }
function saveTake(t) {
  const key = newId();
  Rec.set('take', Day.today(), key, Object.assign({ at: Date.now() }, t));
  Rec.set('activity', null, 'speak', { name: 'Speak', cat: 'mind' });
  if (!Rec.has('tick', Day.today(), 'speak')) Rec.set('tick', Day.today(), 'speak', { src: APP.id });
  return key;
}
/* A drill the switches cannot measure at all: its goals read a number that is
   not being taken. The EYES drills need the camera, and No crutch phrases
   needs the words. It is never MET and never NOT MET, it simply cannot run,
   and DOCTRINE law 5 says do not offer what does not apply. */
function blocked(d) {
  if (d.needsAsr && !asrOn()) return 'the transcript';
  if (d.cam && !camOn()) return 'the camera';
  return '';
}
/* step state: passed, now (the first not passed), or locked (a step after now).
   A step that cannot be measured never blocks the one after it, or switching
   the camera off would wall off the rest of EYES with no way to see why. */
function stepState(d) {
  if (passedEver(d.id)) return 'passed';
  const before = DRILLS.filter(x => x.skill === d.skill && x.step < d.step);
  const skipped = opt('open', []) || [];
  if (before.every(b => passedEver(b.id) || blocked(b)) || skipped.indexOf(d.id) >= 0) return 'now';
  return 'locked';
}
const nowStep = skill => DRILLS.filter(d => d.skill === skill && stepState(d) === 'now')[0] || null;

/* ── the streak ──
   Days in a row with a take, counted back from today or yesterday. A single
   missed day is bridged by a freeze: one is earned per five practised days,
   two can be held, and one is spent without being asked (root brief,
   behaviour rules). Worked out from the takes every time, so there is nothing
   to keep in step. */
function streakInfo() {
  const days = {}; takes().forEach(t => { days[t.date] = 1; });
  const list = Object.keys(days).sort();
  if (!list.length) return { n: 0, freezes: 0, practised: 0 };
  let earned = 0, held = 0, run = 0, prev = null, practised = 0;
  list.forEach(d => {
    practised++;
    if (prev) {
      const gap = Day.diff(d, prev);
      if (gap === 1) run++;
      else if (gap === 2 && held > 0) { held--; run++; }
      else run = 1;
    } else run = 1;
    earned = Math.floor(practised / 5);
    held = Math.min(2, held + (earned > Math.floor((practised - 1) / 5) ? 1 : 0));
    prev = d;
  });
  const today = Day.today(), since = Day.diff(today, prev);
  if (since > 2 || (since === 2 && held < 1)) return { n: 0, freezes: held, practised: practised };
  return { n: run, freezes: held, practised: practised };
}

/* ══════════════ which drills today ══════════════
   Three, one per skill, from the skills furthest from their target: no take
   yet counts as furthest. Eyes needs a camera and is skipped while it is off. */
function todaysDrills() {
  const rank = SKILLS.map(s => {
    const d = nowStep(s.id); if (!d) return null;
    if (blocked(d)) return null;
    const last = lastTake(d.id);
    let dist = 2;
    if (last) { const gs = last.goals || []; dist = gs.length ? gs.filter(g => !g.ok).length / gs.length : 0.5; if (last.pass) dist = 0; }
    return { d: d, dist: dist + (doneToday(d.id) ? -3 : 0) };
  }).filter(Boolean).sort((a, b) => b.dist - a.dist);
  const done = rank.filter(r => doneToday(r.d.id)).map(r => r.d);
  const todo = rank.filter(r => !doneToday(r.d.id)).map(r => r.d);
  return done.concat(todo).slice(0, Math.max(3, done.length));
}

/* PROGRESS: a chart per measure over the last 30 days, the target as a rule,
   the latest value marked, and what he has already done. No verdicts. */
function drawProgress(m) {
  const all = takes().filter(t => t.drill !== 'warm');
  const done = card('ALREADY DONE');
  const st = el('div', 'stats');
  const mins = takes().reduce((s, t) => s + (t.dur || 0), 0) / 60;
  const days = {}; takes().forEach(t => { days[t.date] = 1; });
  const words = all.reduce((s, t) => s + ((t.m && t.m.words) || 0), 0);
  const passed = DRILLS.filter(d => passedEver(d.id)).length;
  stat(st, 'Takes', takes().length, '');
  stat(st, 'Minutes', Math.round(mins), '');
  stat(st, 'Days', Object.keys(days).length, '');
  stat(st, 'Steps met', passed, 'of ' + DRILLS.length);
  if (words) stat(st, 'Words', words.toLocaleString(), 'in transcripts');
  done.appendChild(st);
  m.appendChild(done);
  if (!all.length) { const c = card('MEASURES'); c.appendChild(el('p', 'muted', 'No takes yet. The first drill on TODAY starts the record.')); m.appendChild(c); return; }

  const bests = card('BESTS');
  const bs = el('div', 'stats');
  const best = (id, dir) => { const vs = all.filter(t => t.m && t.m[id] != null).map(t => t.m[id]); if (!vs.length) return null; return dir === 'low' ? Math.min.apply(null, vs) : Math.max.apply(null, vs); };
  const bFpm = best('fpm', 'low'), bEye = best('eye', 'high'), bCrisp = best('crisp', 'high'), bPitch = best('pitch', 'high');
  const longest = all.filter(t => t.m && t.m.fpm === 0).reduce((s, t) => Math.max(s, t.dur || 0), 0);
  if (bFpm != null) stat(bs, 'Fewest fillers', r1(bFpm), '/min');
  if (longest) stat(bs, 'Longest clean take', mmss(longest), 'no fillers');
  if (bEye != null) stat(bs, 'Most on the lens', Math.round(bEye), '%');
  if (bPitch != null) stat(bs, 'Widest pitch', r1(bPitch), 'st');
  if (bCrisp != null) stat(bs, 'Crispest', Math.round(bCrisp), '% of ref');
  const inBand = all.filter(t => (t.goals || []).some(g => g.m === 'wpm' && g.ok)).length;
  if (inBand) stat(bs, 'Takes in the band', inBand, 'pace');
  bests.appendChild(bs);
  m.appendChild(bests);

  const from = Day.shift(Day.today(), -29), to = Day.today();
  const recent = all.filter(t => t.date >= from);
  [['wpm', 'Pace', 'wpm'], ['fpm', 'Fillers a minute', '/min'], ['eye', 'On the lens', '%'], ['crisp', 'Crispness', '%'], ['longP', 'Long pauses', ''], ['pitch', 'Pitch spread', 'st']].forEach(([id, name, unit]) => {
    const pts = recent.filter(t => t.m && t.m[id] != null).map(t => [t.date, t.m[id], t.at]);
    if (pts.length < 2) return;
    const c = card();
    const last = pts[pts.length - 1], first = pts[0];
    const delta = last[1] - first[1];
    const head = Chart.header({ label: name, value: METRICS[id].fmt(last[1]), unit: unit, sub: (delta >= 0 ? 'up ' : 'down ') + METRICS[id].fmt(Math.abs(delta)) + ' since ' + Day.short(first[0]), when: Day.label(last[0]) });
    c.appendChild(head.el);
    const box = el('div', 'chartbox');
    c.appendChild(box);
    const tg = targetFor(id);
    Chart.mount(box, { h: 150, cls: 'chart', label: name }, ch => {
      const byDay = {}; pts.forEach(p => { (byDay[p[0]] = byDay[p[0]] || []).push(p[1]); });
      const series = Object.keys(byDay).sort().map(d => [d, byDay[d].reduce((s, v) => s + v, 0) / byDay[d].length]);
      ch.xTime(from, to);
      ch.yFit(series.map(p => p[1]).concat(tg == null ? [] : [].concat(tg)), { min: 0 });
      ch.grid(); ch.timeAxis();
      if (Array.isArray(tg)) ch.band([[from, tg[1]], [to, tg[1]]], [[from, tg[0]], [to, tg[0]]]);
      else if (tg != null) ch.rule(tg, 'target ' + tg);
      ch.area(series); ch.line(series); ch.dots(series);
      ch.end(series[series.length - 1], METRICS[id].fmt(series[series.length - 1][1]));
      ch.scrub(series, { onMove: p => head.set(METRICS[id].fmt(p[1]), '', Day.label(p[0])), onLeave: head.reset });
    });
    m.appendChild(c);
  });
  const hist = card('ALL TAKES', all.length + '');
  const hl = el('div', 'list');
  all.slice().reverse().slice(0, 30).forEach(t => hl.appendChild(takeRow(t)));
  hist.appendChild(hl);
  m.appendChild(hist);
}

function lastLine(d, t) {

/* ══════════════ the take ══════════════
   Mic on, camera on if the drill wants it and it is switched on, a three

  const screen = $('#take');

  const cam = $('#cam');
  if (T.cam) { cam.srcObject = stream; cam.classList.add('on'); try { await cam.play(); } catch (e) {} } else cam.classList.remove('on');
  screen.classList.add('on');
  T.release = Mobile.trap(() => stopTake(true));
  $('#tkStop').onclick = () => stopTake(false);
  Mobile.feedback('open');

function countIn() {
  return new Promise(res => {
    const mid = $('#tkMid'); mid.innerHTML = '';
    const n = el('div', 'count', '3'); mid.appendChild(n);
    mid.appendChild(el('div', 'say', T.cam ? 'LOOK AT THE LENS' : (T.warm ? T.warm.how.toUpperCase() : 'READY')));
    $('#tkMeters').innerHTML = ''; $('#tkFoot').innerHTML = '';
    let k = 3;
    /* the eyes are read every quarter second through the count: that is the
       lens zone the whole take is measured against */
    if (T.cam) T.eyeTick = setInterval(() => readEye(true), 250);
    const tick = () => {
      if (!T.live) { clearInterval(T.eyeTick); return res(); }
      Sfx.play('blip');
      k--;
      if (k <= 0) { clearInterval(T.eyeTick); T.calibrated = true; return res(); }
      n.textContent = String(k);
      setTimeout(tick, 1000);
    };
    setTimeout(tick, 1000);

}
async function readEye(calib) {
  if (!T.live || !T.cam) return;
  let fl = null;
  try { fl = await faceEngine(); } catch (e) { fl = null; }
  if (!fl || !T.live) return;
  const look = lookAt(fl, $('#cam'), performance.now());
  if (calib) { if (look && !look.blink) T.eye.calib.push(look); return; }
  const on = onLens(look, T.eye.base);

}

    if (T.warm.kind === 'twister') mid.appendChild(promptEl({ kind: 'twister', items: pick(TWISTERS, 3) }));
    else mid.appendChild(el('p', 'muted', T.warm.how));
  } else mid.appendChild(promptEl(T.prompt));
  /* the eye reading taken during the count becomes the lens zone */
  if (T.cam && T.eye.calib.length) {
    const c = T.eye.calib, avg = k => c.reduce((s, x) => s + x[k], 0) / c.length;
    T.eye.base = { gh: avg('gh'), gv: avg('gv'), yaw: avg('yaw'), pitch: avg('pitch') };
  }

  const mPace = mk('mPace', T.warm ? (T.warm.kind === 'hiss' ? 'sound' : T.warm.kind === 'siren' ? 'spread' : 'crisp') : 'pace');
  const mLvl = mk('mLvl', 'time'); mLvl.innerHTML += '<div class="level"><i></i></div>';
  const mEye = mk('mEye', T.cam ? 'lens' : T.listener ? 'transcript' : 'time');
  $('#tkFoot').innerHTML = '';
  const stop = el('button', 'mb-btn go mb-press mb-tap', ICN('stop') + '<span>STOP</span>');
  stop.onclick = () => stopTake(false);
  $('#tkFoot').appendChild(stop);
  paintIcons($('#take'));

  if (T.listener) T.listener.start();

  const band_ = !T.warm && d.goals(targets()).filter(g => g.m === 'wpm')[0];
  T.timer = setInterval(() => {
    if (!T.live) return;

    $('#mLvl .v').textContent = mmss(s);

      if (T.warm) {
        const all = T.ear.summary({ from: T.from });

        else if (T.warm.kind === 'siren') setMeter(mPace, all && all.pitchSpread != null ? r1(all.pitchSpread) + ' st' : '·', all && all.pitchSpread >= T.warm.v ? 'in' : 'out');
        else setMeter(mPace, all ? Math.round(all.crisp * 100) : '·', '');
      } else if (m) {
        const wpm = Math.round(m.wpmEst);
        setMeter(mPace, m.spoken > 3 ? wpm : '·', band_ ? (OPS.in(wpm, band_.v) ? 'in' : 'out') : '');
      }

      } else if (T.listener) setMeter(mEye, T.listener.out.state === 'failed' ? 'off' : T.listener.out.words + ' w', T.listener.out.state === 'failed' ? 'off' : '');

}

    restarts: m.restarts, pitch: m.pitchSpread == null ? null : r1(m.pitchSpread), f0: m.f0 == null ? null : Math.round(m.f0),
    crispRaw: r1(m.crisp * 1000) / 1000, crisp: ref ? m.crisp / ref * 100 : null,
    eye: eye == null ? null : r1(eye), eyeAway: eyeAway == null ? null : r1(eyeAway),
    spoken: r1(m.spoken), loud: m.loud == null ? null : r1(m.loud),
  };
  const goals = d.goals(targets()).map(g => {
    const got = out[g.m];
    const ok = got == null ? false : OPS[g.op](got, g.v);
    return { m: g.m, op: g.op, v: g.v, got: got == null ? null : r1(got), ok: ok };
  });
  const pass = goals.length ? goals.every(g => g.ok) : true;
  const take = { drill: d.id, skill: d.skill, style: d.style, dur: Math.round(secs), m: out, goals: goals, pass: pass ? 1 : 0,
    asr: asrOn ? 1 : 0, cam: eye != null ? 1 : 0, tx: asrOn ? T.listener.text().slice(0, 4000) : '', hits: asrOn ? tx.hits : null,
    prompt: T.prompt && (T.prompt.text || (T.prompt.items || []).join(' | ')) };
  saveTake(take);
  Mobile.feedback(pass ? 'complete' : 'done');
  showTake(take, tx && tx.html);
}
function finishWarm(m, secs) {
  const step = T.warm;
  const w = warmToday();
  const was = w ? Object.assign({}, w) : { drill: 'warm', dur: 0, m: {}, steps: [] };
  delete was.key; delete was.date;
  was.dur = (was.dur || 0) + Math.round(secs);
  was.steps = (was.steps || []).filter(s => s !== step.id).concat([step.id]);
  if (step.kind === 'hiss') was.m.hiss = r1(m.longestSound);
  else if (step.kind === 'siren') was.m.pitch = m.pitchSpread == null ? null : r1(m.pitchSpread);
  else was.m.crispRaw = r1(m.crisp * 1000) / 1000;
  was.pass = was.steps.length >= WARM.length ? 1 : 0;
  if (w) Rec.set('take', w.date, w.key, Object.assign({ at: w.at }, was));
  else saveTake(was);
  Mobile.feedback('done');
  const v = step.kind === 'hiss' ? r1(m.longestSound) + 's' : step.kind === 'siren' ? (m.pitchSpread == null ? 'no pitch heard' : r1(m.pitchSpread) + ' semitones') : 'reference ' + Math.round(m.crisp * 1000);
  UI.toast(esc(step.name) + ': <b>' + esc(v) + '</b>');
  openWarm();
}

/* the warm-up sheet: three steps, each with its goal and why, each measured */
function openWarm() {
  const w = warmToday();
  UI.dialog({
    title: 'WARM-UP', width: 520,
    body: b => {
      b.appendChild(el('p', 'muted', 'About three minutes. Each step is measured, and the last one sets today\'s crispness reference for the CLEAR drills.'));
      const list = el('div', 'list');
      WARM.forEach(s => {
        const done = w && (w.steps || []).indexOf(s.id) >= 0;
        const got = w && w.m ? (s.kind === 'hiss' ? w.m.hiss : s.kind === 'siren' ? w.m.pitch : w.m.crispRaw) : null;
        const r = el('button', 'row mb-plate mb-press' + (done ? ' done' : ' now'));
        r.style.setProperty('--c', 'var(--accent)');
        r.innerHTML = '<span class="ic">' + ICN(done ? 'done' : 'play') + '</span><span class="tx"><span class="nm">' + esc(s.name) + '</span>' +
          '<span class="sub">Goal: ' + esc(s.goal) + '</span><span class="sub">Why: ' + esc(s.why) + '</span></span>' +
          '<span class="num"><b>' + (got == null ? mmss(s.dur) : esc(s.kind === 'crisp' || s.kind === 'twister' ? Math.round(got * 1000) : r1(got) + (s.kind === 'hiss' ? 's' : ' st'))) + '</b>' + (done ? 'done' : '') + '</span>';
        r.onclick = () => { UI.closeMenus(); startTake(null, s); };
        list.appendChild(r);
      });
      b.appendChild(list);
      paintIcons(b);
    },
    actions: [{ label: 'CLOSE' }],
    onClose: () => draw(),
  });
}

/* the numbers of one take, every goal met or not, the transcript marked */
function showTake(t, html) {
  const d = t.drill === 'warm' ? null : drillById(t.drill);
  const m = t.m || {};
  UI.dialog({
    title: (d ? d.name : 'Warm-up').toUpperCase() + ' · ' +
      (t.pass ? 'MET' : !(t.goals && t.goals.length) ? 'DONE'
        : t.goals.some(g => g.got == null) ? 'NOT MEASURED' : 'NOT MET'), width: 560,
    body: b => {
      if (d) {
        const gs = el('div', 'stats');
        (t.goals || []).forEach(g => {
          const mt = METRICS[g.m];
          stat(gs, mt.name, g.got == null ? '·' : mt.fmt(g.got) + (mt.unit ? ' ' + mt.unit : ''),
            g.got == null ? 'not measured' : 'goal ' + goalText(g).replace(mt.name.toLowerCase() + ' ', ''),
            g.got == null ? '' : g.ok ? 'met' : 'miss');
        });
        if (!(t.goals || []).length) b.appendChild(el('p', 'muted', 'A count to start from. Nothing to meet.'));
        b.appendChild(gs);
      }
      const rows = el('div', 'stats');
      rows.style.marginTop = 'var(--s-3)';
      const put = (id, v, note) => { if (v == null) return; const mt = METRICS[id]; stat(rows, mt.name, mt.fmt(v) + (mt.unit ? ' ' + mt.unit : ''), note || mt.note); };
      if (d) {
        put('wpm', m.wpm, t.asr ? m.words + ' words in ' + r1(m.spoken) + 's' : 'estimated from ' + m.syll + ' syllables');
        put('fpm', m.fpm, (m.held || 0) + ' held' + (m.crutch != null ? ', ' + m.crutch + ' crutch' : ''));
        put('crutch', m.crutch); put('held', m.held); put('repeats', m.repeats);
        put('pauses', m.pauses, 'longest ' + (m.longestPause || 0) + 's'); put('longP', m.longP); put('heldP', m.heldP);
        put('ratio', m.ratio); put('restarts', m.restarts);
        put('crisp', m.crisp, 'against today\'s warm-up'); put('pitch', m.pitch, m.f0 ? 'around ' + m.f0 + ' Hz' : '');
        put('eye', m.eye); put('eyeAway', m.eyeAway);
        if (m.crisp == null && m.crispRaw != null) stat(rows, 'Crispness, raw', Math.round(m.crispRaw * 1000), 'no warm-up to measure against');
        if (m.eye == null && d.cam) stat(rows, 'On the lens', '·', 'not measured');
      } else {
        put('hiss', m.hiss); put('pitch', m.pitch, 'the siren');
        if (m.crispRaw != null) stat(rows, 'Crispness reference', Math.round(m.crispRaw * 1000), 'what today\'s CLEAR drills are measured against');
      }
      b.appendChild(rows);
      if (t.prompt) b.appendChild(el('p', 'muted', 'Prompt: ' + esc(t.prompt)));
      if (t.tx || html) {
        const h = el('h2', null, 'TRANSCRIPT'); h.style.cssText = 'font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap);color:var(--text-muted);margin:var(--s-4) 0 var(--s-2)';
        b.appendChild(h);
        b.appendChild(el('div', 'tx', html || esc(t.tx)));
        b.appendChild(el('p', 'muted', 'Marked: fillers and crutch phrases. The browser\'s transcript, so um and uh are mostly missing from it; held sounds stand in.'));
      } else if (d && d.asr) b.appendChild(el('p', 'muted', 'No transcript. Fillers are the held sounds only.'));
    },
    actions: d ? [{ label: 'CLOSE' }, { label: 'AGAIN', kind: 'go', fn: () => { startTake(d); } }] : [{ label: 'CLOSE' }],
  });
}

/* ══════════════ settings ══════════════ */
function openSettings() {
  UI.settings(APP.id, [
    { id: 'targets', name: 'TARGETS', draw: drawTargets },
    { id: 'crutch', name: 'CRUTCHES', draw: drawCrutch },
    { id: 'gear', name: 'MIC & CAMERA', draw: drawGear },
  ], { order: ['targets', 'crutch', 'gear', 'data'] });
}
$('#bSet').onclick = openSettings;
function numField(v, on) {
  const i = UI.field('number', { value: v }); i.style.maxWidth = 'calc(var(--s-9) + var(--s-4))';
  i.onchange = () => { const n = parseFloat(i.value); if (isFinite(n)) on(n); };
  return i;
}
function drawTargets(p) {
  const t = targets();
  p.appendChild(el('p', 'muted', 'Words a minute, by the kind of video. The defaults are from the research in speak/RESEARCH.md.'));
  STYLES.forEach(s => {
    const b = band(s.id);
    const box = el('div'); box.style.cssText = 'display:flex;gap:var(--s-2);align-items:center';
    box.appendChild(numField(b[0], n => setBand(s.id, [n, b[1]])));
    box.appendChild(el('span', 'muted', 'to'));
    box.appendChild(numField(b[1], n => setBand(s.id, [b[0], n])));
    p.appendChild(UI.row(s.name, s.note, box));
  });
  p.appendChild(UI.row('Fillers a minute', 'the first CLEAN goal', numField(t.fpm, n => setTgt('fpm', n))));
  p.appendChild(UI.row('Fillers, the lower goal', 'the later CLEAN goals', numField(t.fpmLow, n => setTgt('fpmLow', n))));
  p.appendChild(UI.row('On the lens, %', 'the EYES goal', numField(t.eye, n => setTgt('eye', n))));
  p.appendChild(UI.row('First EYES goal, %', 'for finding the lens', numField(t.eyeStart, n => setTgt('eyeStart', n))));
  p.appendChild(UI.row('Crispness, % of warm-up', 'the CLEAR goal', numField(t.crispPct, n => setTgt('crispPct', n))));
  p.appendChild(UI.row('Pitch spread, semitones', 'the Voice moves goal', numField(t.pitch, n => setTgt('pitch', n))));
  const acts = el('div', 'acts');
  const reset = el('button', 'mb-btn mb-press mb-tap', 'Reset targets');
  reset.onclick = () => { Rec.setting(APP.id, 'tgt', {}); p.innerHTML = ''; drawTargets(p); };
  acts.appendChild(reset); p.appendChild(acts);
}
function setTgt(k, v) { const t = opt('tgt', {}) || {}; t[k] = v; Rec.setting(APP.id, 'tgt', t); }
function setBand(id, b) { const t = opt('tgt', {}) || {}; t.bands = t.bands || {}; t.bands[id] = [Math.min(b[0], b[1]), Math.max(b[0], b[1])]; Rec.setting(APP.id, 'tgt', t); }
function drawCrutch(p) {
  const redraw = () => { p.innerHTML = ''; drawCrutch(p); };
  p.appendChild(el('p', 'muted', 'Phrases counted as crutches in the transcript. Um, uh and their cousins always count. Hold or right-click one to remove it.'));
  const list = el('div', 'list');
  crutchList().forEach(c => {
    const r = el('div', 'row mb-plate');
    r.innerHTML = '<span class="tx"><span class="nm">' + esc(c) + '</span>' + (AMBIGUOUS[c] ? '<span class="sub">counted when it starts or ends a phrase, or sits beside a joining word</span>' : '') + '</span>';
    const del = () => { Rec.setting(APP.id, 'crutch', crutchList().filter(x => x !== c)); redraw(); };
    r.oncontextmenu = e => { e.preventDefault(); UI.menu(e.clientX, e.clientY, [{ label: 'Remove', kind: 'bad', fn: del }], { title: c.toUpperCase() }); };
    Mobile.hold(r, e => UI.menu(e.clientX, e.clientY, [{ label: 'Remove', kind: 'bad', fn: del }], { title: c.toUpperCase() }));
    list.appendChild(r);
  });
  p.appendChild(list);
  const box = el('div'); box.style.cssText = 'display:flex;gap:var(--s-2);margin-top:var(--s-3)';
  const i = UI.field('text', { placeholder: 'a phrase' }); i.style.flex = '1';
  const add = el('button', 'mb-btn mb-press mb-tap', 'Add');
  add.onclick = () => { const v = i.value.trim().toLowerCase(); if (!v) return; const l = crutchList(); if (l.indexOf(v) < 0) l.push(v); Rec.setting(APP.id, 'crutch', l); redraw(); };
  box.appendChild(i); box.appendChild(add); p.appendChild(box);
  const acts = el('div', 'acts');
  const reset = el('button', 'mb-btn mb-press mb-tap', 'Reset the list');
  reset.onclick = () => { Rec.setting(APP.id, 'crutch', null); redraw(); };
  acts.appendChild(reset); p.appendChild(acts);
}
function drawGear(p) {
  p.appendChild(el('p', 'muted', 'Everything is measured on this machine. The transcript is the one exception, and it is off.'));
  p.appendChild(UI.row('Transcript', ASR ? 'Off, your voice stays on this machine. On, it goes to Apple or Google for the words, which is what counts your crutch phrases' : 'This browser cannot make one', ASR ? UI.toggle(asrOn(), on => Rec.setting(APP.id, 'asr', on ? 1 : 0)) : null));
  const lang = el('select', 'mb-sel');
  ['en-US', 'en-GB', 'en-AU', 'en-PH', 'fil-PH'].forEach(l => { const o = el('option', null, l); o.value = l; if (l === opt('lang', 'en-US')) o.selected = true; lang.appendChild(o); });
  lang.onchange = () => Rec.setting(APP.id, 'lang', lang.value);
  p.appendChild(UI.row('Transcript language', 'what the recogniser listens for', lang));
  p.appendChild(UI.row('Camera', 'On for the EYES drills. About 15MB of face finder, fetched once and then kept. The picture never leaves this machine', UI.toggle(camOn(), on => Rec.setting(APP.id, 'cam', on ? 1 : 0))));
  p.appendChild(UI.row('Which camera', 'front is the one you talk to', UI.segmented([{ id: 'user', name: 'Front' }, { id: 'environment', name: 'Back' }], opt('facing', 'user'), v => Rec.setting(APP.id, 'facing', v))));
  p.appendChild(UI.row('Pace beat', 'a click per syllable on the To the beat drill', UI.toggle(optOn('beat', 1), on => Rec.setting(APP.id, 'beat', on ? 1 : 0))));
  p.appendChild(el('p', 'muted', 'Nothing is recorded. The sound is counted as it arrives and dropped.'));
}

/* ══════════════ nav and boot ══════════════ */
document.querySelectorAll('#nav button').forEach(b => {
  b.onclick = () => { view = b.dataset.v; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b)); Mobile.feedback('nav'); draw(); };
});
let soonT = null;
const soon = () => { clearTimeout(soonT); soonT = setTimeout(draw, 30); };
Rec.on(soon);
Day.on(soon);
/* paint what localStorage has, then again when the big half lands */
draw();
Rec.ready(draw);
</script>
