<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOCK — routine scheduler</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10; --panel:#0e141d; --panel2:#131b26; --line:#1e2a38; --line2:#2b3a4d;
  --txt:#dbe7f0; --dim:#7f93a8; --dim2:#5b6d80;
  --acc:#7ee8fa; --acc-d:#1a3a44; --warn:#ffb347; --bad:#ff6b81; --good:#6ee7a8;
  --f1:'Chakra Petch',system-ui,sans-serif; --f2:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, #10202b 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 100%, #131024 0%, transparent 55%),
    var(--bg);
  color:var(--txt); font-family:var(--f2); font-size:13px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#22303f;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:12px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:rgba(10,15,22,.85);backdrop-filter:blur(8px);flex:0 0 auto;
}
.logo{font-family:var(--f1);font-weight:700;font-size:17px;letter-spacing:.14em;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.logo b{color:var(--acc)}
.views{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#0a1018;flex:0 0 auto}
.views button{
  padding:4px 13px;border-radius:6px;font-family:var(--f1);font-size:12px;letter-spacing:.08em;color:var(--dim);
}
.views button.on{background:linear-gradient(180deg,#16303a,#102028);color:var(--acc);box-shadow:0 0 0 1px var(--acc-d)}
#tabs{display:flex;gap:6px;align-items:center;overflow-x:auto;flex:1;padding:2px;min-width:0}
.tab{
  padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  font-family:var(--f1);font-size:12px;letter-spacing:.04em;color:var(--dim);white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.tab:hover{border-color:var(--line2);color:var(--txt)}
.tab.on{border-color:var(--acc);color:var(--acc);background:linear-gradient(180deg,#12242b,#0d1a20)}
.tab .x,.tab .cp{opacity:0;font-size:11px}
.tab:hover .x,.tab:hover .cp{opacity:.45}
.tab .x:hover{opacity:1;color:var(--bad)}
.tab .cp:hover{opacity:1;color:var(--acc)}
.tab .daypip{font-size:9px;color:var(--dim2);letter-spacing:.06em}
.hbtns{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.btn{
  padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  font-family:var(--f1);font-size:12px;letter-spacing:.04em;color:var(--txt);white-space:nowrap;
  transition:border-color .12s,background .12s,color .12s;
}
.btn:hover{border-color:var(--line2);background:var(--panel2)}
.btn.acc{border-color:var(--acc-d);color:var(--acc)}
.btn.acc:hover{border-color:var(--acc);background:#0f2028}
.btn.sm{padding:3px 7px;font-size:11px;border-radius:5px}
.btn .bad{color:var(--bad)}
main{display:flex;flex:1;min-height:0}

/* ---------- bin ---------- */
#bin{
  width:238px;flex:0 0 auto;border-right:1px solid var(--line);background:rgba(12,17,24,.6);
  display:flex;flex-direction:column;min-height:0;
}
.bin-head{padding:10px 11px 8px;border-bottom:1px solid var(--line)}
.bin-head h2{font-family:var(--f1);font-size:11px;letter-spacing:.16em;color:var(--dim);font-weight:600;text-transform:uppercase;margin-bottom:3px}
.bin-head p{font-size:10.5px;color:var(--dim2);line-height:1.4;margin-bottom:8px}
#search{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#0a1018;font-size:12px;outline:none}
#search:focus{border-color:var(--acc-d)}
#binlist{flex:1;overflow-y:auto;padding:9px}
.cat{font-family:var(--f1);font-size:10px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase;margin:11px 0 6px;padding-left:2px}
.cat:first-child{margin-top:0}
.chip{
  position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:4px;
  border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;background:var(--panel);
  cursor:grab;touch-action:none;user-select:none;
}
.chip:hover{background:var(--panel2);border-color:var(--line2);border-left-color:var(--c)}
.chip .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .mn{font-family:var(--f1);font-size:10.5px;color:var(--dim2)}
.chip .eg{font-size:9px;color:var(--dim2)}
.chip .del{opacity:0;font-size:11px;color:var(--dim2);padding:0 2px}
.chip:hover .del{opacity:.6}
.chip .del:hover{color:var(--bad);opacity:1}
.chip.tpl{border-left-color:var(--acc);background:#0c1a20}
.bin-foot{padding:9px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#newform{display:none;flex-direction:column;gap:6px}
#newform.on{display:flex}
#newform input,#newform select{padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#0a1018;outline:none;font-size:12px}
#newform input:focus{border-color:var(--acc-d)}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.sw{width:18px;height:18px;border-radius:5px;border:2px solid transparent}
.sw.on{border-color:#fff}

/* ---------- board ---------- */
#board{flex:1;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:12px;min-width:0;align-items:flex-start}
#board.hide,#week.hide{display:none}
.lane{
  flex:0 0 264px;display:flex;flex-direction:column;max-height:100%;min-height:0;
  border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,rgba(19,27,38,.75),rgba(11,16,23,.55));
}
.lane.focus{border-color:#2f4a5c}
.lane.over{border-color:var(--acc-d);box-shadow:0 0 0 1px var(--acc-d)}
.lane-head{padding:9px 10px 8px;border-bottom:1px solid var(--line)}
.lane-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.lane-name{
  flex:1;background:none;border:1px solid transparent;border-radius:5px;padding:2px 5px;
  font-family:var(--f1);font-size:13.5px;font-weight:600;letter-spacing:.05em;outline:none;min-width:0;
}
.lane-name:hover{border-color:var(--line)}
.lane-name:focus{border-color:var(--acc-d);background:#0a1018}
.lane-x{color:var(--dim2);font-size:12px;padding:2px 4px;opacity:0}
.lane:hover .lane-x{opacity:.55}
.lane-x:hover{color:var(--bad);opacity:1}
.lane-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.lane-row input[type=time]{
  background:#0a1018;border:1px solid var(--line);border-radius:5px;padding:2px 5px;
  font-family:var(--f1);font-size:11.5px;color:var(--acc);outline:none;
}
.lane-row input[type=time]:focus{border-color:var(--acc-d)}
.lane-row .end{font-family:var(--f1);color:var(--txt)}
.lane-meta{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap;font-size:10.5px;color:var(--dim2);font-family:var(--f1);letter-spacing:.04em}
.lane-meta .tag{padding:1px 5px;border:1px solid var(--line);border-radius:4px}
.lane-meta .tag.over{border-color:#4d1f28;color:var(--bad)}
.lane-meta .tag.ok{border-color:#20402f;color:var(--good)}
.lane-meta .tag.warn{border-color:#4d3616;color:var(--warn)}
.bars{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.prog{height:3px;border-radius:2px;background:#0a1018;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2a7f7f,var(--good));transition:width .25s}
.loadbar{display:flex;height:5px;gap:1px;border-radius:3px;overflow:hidden;background:#0a1018}
.loadbar i{display:block;height:100%}
.lane-tools{display:flex;gap:4px;margin-top:8px}
.lane-tools .btn{flex:1;text-align:center;padding:3px 0;font-size:10.5px;letter-spacing:.05em}
.lane-tools .hov{opacity:.25;transition:opacity .12s}
.lane:hover .lane-tools .hov{opacity:1}
.lane-body{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px;min-height:74px}
.lane-empty{border:1px dashed var(--line2);border-radius:8px;padding:14px 8px;text-align:center;color:var(--dim2);font-size:11.5px;line-height:1.5}
.lane-add{margin:0 9px 9px;padding:5px;border:1px dashed var(--line);border-radius:7px;color:var(--dim2);font-family:var(--f1);font-size:11px;letter-spacing:.06em}
.lane-add:hover{border-color:var(--acc-d);color:var(--acc)}
#addlane{flex:0 0 44px;align-self:stretch;border:1px dashed var(--line);border-radius:11px;color:var(--dim2);font-family:var(--f1);font-size:16px}
#addlane:hover{border-color:var(--acc-d);color:var(--acc)}

/* ---------- block ---------- */
.brick{
  position:relative;border-radius:8px;padding:8px 9px 10px;flex:0 0 auto;
  display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,#0d141c),color-mix(in srgb,var(--c) 13%,#0a1018));
  border:1px solid color-mix(in srgb,var(--c) 40%,#0d141c);
  border-top:1px solid color-mix(in srgb,var(--c) 62%,#0d141c);
  box-shadow:0 2px 0 color-mix(in srgb,var(--c) 22%,#05080c), 0 4px 12px rgba(0,0,0,.35);
  cursor:grab;touch-action:none;user-select:none;
}
.brick.pinned{box-shadow:0 0 0 1px var(--acc) inset,0 2px 0 color-mix(in srgb,var(--c) 22%,#05080c)}
.brick.done{opacity:.42;filter:saturate(.4)}
.brick.done .b-name{text-decoration:line-through;text-decoration-color:var(--dim2)}
.brick.broke{border-color:#7a3040}
.brick.celebrate{animation:cel .5s ease}
@keyframes cel{0%{box-shadow:0 0 0 0 var(--good)}50%{box-shadow:0 0 0 3px rgba(110,231,168,.5)}100%{box-shadow:0 0 0 0 transparent}}
.b-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap;row-gap:2px;min-height:15px}
.b-time{
  font-family:var(--f1);font-size:10.5px;letter-spacing:.04em;color:color-mix(in srgb,var(--c) 80%,#fff);
  border-radius:4px;padding:1px 4px;margin-left:-4px;cursor:text;white-space:nowrap;
}
.b-time:hover{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--line2)}
.b-time.anc{color:var(--acc);box-shadow:0 0 0 1px var(--acc-d)}
.b-time.clash{color:var(--bad);box-shadow:0 0 0 1px #4d1f28}
.b-dash{font-family:var(--f1);font-size:10.5px;color:var(--dim2);margin:0 -2px}
.b-timein{background:#060a0e;border:1px solid var(--acc-d);border-radius:4px;color:var(--acc);font-family:var(--f1);font-size:10.5px;padding:1px 3px;outline:none;width:92px}
.b-flag{font-family:var(--f1);font-size:9px;color:var(--dim2);border:1px solid var(--line);border-radius:3px;padding:0 3px;white-space:nowrap}
.b-flag.bad{color:var(--bad);border-color:#4d1f28}
.b-sp{flex:1}
.b-dur{font-family:var(--f1);font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:3px}
.b-dur button{color:var(--dim2);padding:0 3px;font-size:12px;line-height:1;opacity:.3;transition:opacity .12s}
.brick:hover .b-dur button{opacity:1}
.b-dur button:hover{color:var(--acc)}
.b-dur b{min-width:30px;text-align:center;color:var(--txt);font-weight:500;border-radius:3px;cursor:text}
.b-dur b:hover{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--line2)}
.b-durin{background:#060a0e;border:1px solid var(--acc-d);border-radius:4px;color:var(--acc);font-family:var(--f1);font-size:10.5px;padding:0 2px;outline:none;width:40px;text-align:center}
.b-main{display:flex;align-items:flex-start;gap:7px}
.b-check{
  flex:0 0 auto;width:16px;height:16px;margin-top:1px;border-radius:5px;border:1.5px solid color-mix(in srgb,var(--c) 55%,#33414f);
  background:rgba(0,0,0,.28);font-size:10px;line-height:1;color:transparent;display:flex;align-items:center;justify-content:center;
}
.b-check:hover{border-color:var(--good);color:rgba(110,231,168,.35)}
.b-check.on{background:var(--good);border-color:var(--good);color:#05130c;font-weight:700}
.b-txt{flex:1;min-width:0}
.b-name{font-size:12.5px;line-height:1.28;outline:none;border-radius:4px;padding:1px 2px;margin-left:-2px;word-break:break-word;cursor:text}
.b-name:focus{background:#060a0e;box-shadow:0 0 0 1px var(--acc-d)}
.b-note{font-size:10.5px;color:var(--dim);line-height:1.34;outline:none;padding:1px 2px;margin-left:-2px;border-radius:4px;cursor:text}
.b-note:focus{background:#060a0e;box-shadow:0 0 0 1px var(--acc-d)}
.b-note:empty:before{content:'note…';color:var(--dim2);opacity:.4}
.b-foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:5px}
.b-days{display:flex;gap:2px}
.b-days b{
  width:13px;height:13px;border-radius:3px;font-family:var(--f1);font-size:8.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;background:#0a1018;color:var(--dim2);
  border:1px solid var(--line);cursor:pointer;
}
.b-days b.on{background:color-mix(in srgb,var(--c) 42%,#0a1018);color:#fff;border-color:transparent}
.b-ctl{margin-left:auto;display:flex;gap:2px;align-items:center}
.b-ctl button{color:var(--dim2);font-size:10.5px;padding:1px 3px;border-radius:4px}
.b-ctl button:hover{color:var(--txt);background:#0007}
.b-ctl button.on{color:var(--acc)}
.b-ctl .hov{opacity:0;transition:opacity .12s}
.brick:hover .b-ctl .hov{opacity:1}
.b-badge{font-family:var(--f1);font-size:8.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:3px;padding:1px 3px;color:var(--dim2);line-height:1.1}
.b-badge.dim{opacity:0;transition:opacity .12s}
.brick:hover .b-badge.dim{opacity:.55}
.b-badge.p1{color:#ff8a9c;border-color:#5a2430;background:#2a0f16}
.b-badge.p2{color:var(--warn);border-color:#4d3616;background:#241a09}
.b-badge.p3{color:#7fb8ff;border-color:#1d3450;background:#0d1a2b}
.b-badge.e1{color:#8fd9b6;border-color:#20402f}
.b-badge.e2{color:var(--warn);border-color:#4d3616}
.b-badge.e3{color:#ff8a9c;border-color:#5a2430;background:#2a0f16}
.b-grip{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.b-grip:hover{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c) 45%,transparent))}
/* --- compact row for the one-minute stuff --- */
.brick.mini{flex-direction:row;align-items:center;gap:8px;padding:5px 9px 5px 9px;min-height:0!important}
.brick.mini .b-main{flex:1;min-width:0;align-items:center;gap:7px}
.brick.mini .b-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brick.mini .b-mtime{font-family:var(--f1);font-size:10px;color:color-mix(in srgb,var(--c) 80%,#fff);white-space:nowrap;border-radius:4px;padding:1px 4px;cursor:text}
.brick.mini .b-mtime:hover{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--line2)}
.brick.mini .b-mtime.anc{color:var(--acc)}
.brick.mini .b-mdays{font-family:var(--f1);font-size:9px;color:var(--dim2);white-space:nowrap}
.brick.mini .b-foot{
  position:absolute;top:0;right:0;bottom:0;margin:0;padding:0 8px 0 26px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 17%,#0a1017) 32%);
  opacity:0;transition:opacity .12s;
}
.brick.mini:hover .b-foot{opacity:1}
.brick.mini .b-days,.brick.mini .b-grip{display:none}
.brick.mini .b-ctl .hov{opacity:1}
.placeholder{flex:0 0 auto;border:1px dashed var(--acc);border-radius:8px;background:#0d2028;opacity:.7}
#dragghost{position:fixed;z-index:9999;pointer-events:none;opacity:.92;transform:rotate(-1.4deg) scale(1.02);width:240px}
#dragghost.tplghost{
  background:var(--panel2);border:1px solid var(--acc);border-radius:9px;padding:10px 12px;
  font-family:var(--f1);font-size:12px;color:var(--acc);
}

/* ---------- week ---------- */
#week{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;align-content:start}
.day{border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,rgba(19,27,38,.75),rgba(11,16,23,.55));display:flex;flex-direction:column;min-height:220px}
.day.today{border-color:var(--acc-d);box-shadow:0 0 0 1px var(--acc-d)}
.day-head{padding:9px 10px;border-bottom:1px solid var(--line)}
.day-head h3{font-family:var(--f1);font-size:13px;letter-spacing:.09em;display:flex;align-items:center;gap:6px}
.day-head h3 em{font-style:normal;font-size:9px;color:var(--acc);border:1px solid var(--acc-d);border-radius:3px;padding:0 4px}
.day-head select{
  width:100%;margin-top:7px;background:#0a1018;border:1px solid var(--line);border-radius:6px;padding:4px 6px;
  font-family:var(--f1);font-size:11.5px;color:var(--txt);outline:none;
}
.day-head select:focus{border-color:var(--acc-d)}
.day-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;font-family:var(--f1);font-size:10px;color:var(--dim2)}
.day-meta span{border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.day-meta span.bad{border-color:#4d1f28;color:var(--bad)}
.day-body{flex:1;overflow-y:auto;padding:8px 9px;display:flex;flex-direction:column;gap:8px}
.day-lane{font-family:var(--f1);font-size:9.5px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase;margin-top:3px}
.day-b{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0;line-height:1.25}
.day-b i{width:3px;align-self:stretch;min-height:12px;border-radius:2px;background:var(--c);flex:0 0 auto}
.day-b span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-b em{font-style:normal;color:var(--dim2);font-family:var(--f1);font-size:9.5px}
.day-rest{padding:18px 8px;text-align:center;color:var(--dim2);font-size:11px}
.day-edit{margin:0 9px 9px;padding:4px;border:1px dashed var(--line);border-radius:7px;color:var(--dim2);font-family:var(--f1);font-size:10.5px;letter-spacing:.05em}
.day-edit:hover{border-color:var(--acc-d);color:var(--acc)}

/* ---------- footer ---------- */
footer{
  flex:0 0 auto;border-top:1px solid var(--line);padding:6px 14px;display:flex;align-items:center;gap:14px;
  font-family:var(--f1);font-size:11px;letter-spacing:.05em;color:var(--dim2);background:rgba(10,15,22,.7);
}
footer b{color:var(--txt);font-weight:500}
footer .sp{flex:1}
.step{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:1px 3px}
.step button{color:var(--dim2);padding:0 4px;font-size:12px;line-height:1}
.step button:hover{color:var(--acc)}
.step b{min-width:26px;text-align:center}
.dayprog{width:80px;height:4px;border-radius:2px;background:#0a1018;overflow:hidden;display:inline-block;vertical-align:middle}
.dayprog i{display:block;height:100%;background:linear-gradient(90deg,#2a7f7f,var(--good))}

/* ---------- modal + tooltip ---------- */
#veil{position:fixed;inset:0;background:rgba(4,7,11,.72);backdrop-filter:blur(3px);z-index:500;display:none;align-items:center;justify-content:center;padding:24px}
#veil.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:13px;width:100%;max-width:840px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--f1);font-size:14px;letter-spacing:.1em;font-weight:600;flex:1}
.modal-body{padding:14px;overflow-y:auto;flex:1}
.mtabs{display:flex;gap:5px;padding:10px 14px 0;flex-wrap:wrap}
.mtab{padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-family:var(--f1);font-size:11.5px;color:var(--dim)}
.mtab.on{border-color:var(--acc-d);color:var(--acc);background:#0f1e25}
.modal textarea{width:100%;height:250px;background:#070b10;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.5;color:#b9cbdc;resize:vertical;outline:none}
.hint{font-size:11.5px;color:var(--dim);line-height:1.6;margin-bottom:10px}
.hint code,.hint b.k{background:#0a1018;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px;color:var(--acc);font-weight:500}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.glinks{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:200px;overflow-y:auto}
.glink{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:11.5px}
.glink span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glink a{color:var(--acc);text-decoration:none;font-family:var(--f1);font-size:11px}
.set{display:grid;grid-template-columns:1fr auto;gap:9px 14px;align-items:center;font-size:12.5px}
.set input[type=text],.set input[type=number],.set select{background:#0a1018;border:1px solid var(--line);border-radius:6px;padding:5px 8px;outline:none;min-width:190px}
.set input:focus,.set select:focus{border-color:var(--acc-d)}
.cmp{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.cmp-col{flex:0 0 215px;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--panel2)}
.cmp-col.on{border-color:var(--acc-d)}
.cmp-col h4{font-family:var(--f1);font-size:12.5px;letter-spacing:.06em}
.cmp-col .sub{font-size:10.5px;color:var(--dim2);margin-bottom:8px;font-family:var(--f1)}
.rule{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-size:12px}
.rule.broke{border-color:#4d1f28;background:#170a0e}
.rule .txt{flex:1;line-height:1.4}
.rule .st{font-family:var(--f1);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--good)}
.rule .st.bad{color:var(--bad);border-color:#4d1f28}
.rule input[type=checkbox]{accent-color:var(--acc)}
.rulebuild{border:1px dashed var(--line2);border-radius:8px;padding:10px;margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12px}
.rulebuild select,.rulebuild input{background:#0a1018;border:1px solid var(--line);border-radius:6px;padding:5px 7px;outline:none;font-size:12px}
.rulebuild input[type=text]{width:150px}
.rulebuild input[type=number]{width:66px}
.rulebuild .f{display:none;align-items:center;gap:6px}
.rulebuild .f.on{display:flex}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:900;background:var(--panel2);border:1px solid var(--acc-d);color:var(--acc);border-radius:8px;padding:8px 15px;font-family:var(--f1);font-size:12px;letter-spacing:.05em;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:70vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
#tip{
  position:fixed;z-index:1000;background:#0b1119;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;
  font-size:11.5px;line-height:1.45;color:var(--txt);max-width:250px;pointer-events:none;opacity:0;
  box-shadow:0 8px 22px rgba(0,0,0,.5);transition:opacity .08s;
}
#tip.on{opacity:1}
#tip b{color:var(--acc);font-weight:600}
.ctxmenu{
  position:fixed;z-index:1200;background:#0d141d;border:1px solid var(--line2);border-radius:9px;padding:5px;
  min-width:192px;box-shadow:0 18px 42px rgba(0,0,0,.62);font-size:12.5px;
}
.ctxmenu .mi{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.ctxmenu .mi:hover{background:var(--panel2)}
.ctxmenu .mi.danger:hover{background:#2a0f16;color:#ff8a9c}
.ctxmenu .mi .k{margin-left:auto;color:var(--dim2);font-size:10.5px;font-family:var(--f1);padding-left:14px}
.ctxmenu .sep{height:1px;background:var(--line);margin:4px 6px}
.ctxmenu .hd{padding:4px 9px 6px;font-family:var(--f1);font-size:10px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;max-width:230px}
@media (max-width:820px){ #bin{width:180px} .lane{flex-basis:230px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🧱 <b>BLOCK</b></div>
    <div class="views">
      <button id="vDay" class="on" data-tip="<b>Day</b> — build one routine out of blocks">Day</button>
      <button id="vWeek" data-tip="<b>Week</b> — decide which routine runs on which day">Week</button>
    </div>
    <div id="tabs"></div>
    <div class="hbtns">
      <button class="btn" id="bNew" data-tip="Start another routine — <b>Weekday</b>, <b>Rest day</b>, <b>Travel</b>…">+ Routine</button>
      <button class="btn" id="bCmp" data-tip="See your routines side by side">Compare</button>
      <button class="btn" id="bRules" data-tip="Rules that check your routine — <b>“Lift ≥90m after breakfast”</b>">Rules</button>
      <button class="btn" id="bHelp" data-tip="How BLOCK works">?</button>
      <button class="btn" id="bSet" data-tip="Settings">⚙</button>
      <button class="btn acc" id="bExp" data-tip="Send this to Google Calendar or Todoist">Export ▸</button>
    </div>
  </header>

  <main>
    <aside id="bin">
      <div class="bin-head">
        <h2>Block bin</h2>
        <p>Drag one into a column →<br>or double-click to drop it in.</p>
        <input id="search" placeholder="filter blocks…" autocomplete="off">
      </div>
      <div id="binlist"></div>
      <div class="bin-foot">
        <button class="btn" id="bAddBlock" data-tip="Make a block that isn't in the list">+ New block</button>
        <div id="newform">
          <input id="nfName" placeholder="name" autocomplete="off">
          <input id="nfMin" type="number" min="5" step="5" value="30" placeholder="minutes">
          <select id="nfEnergy">
            <option value="1">◔ light</option>
            <option value="2" selected>◑ medium</option>
            <option value="3">● heavy</option>
          </select>
          <div class="swatches" id="nfSw"></div>
          <div style="display:flex;gap:6px">
            <button class="btn acc sm" id="nfOk" style="flex:1">Add</button>
            <button class="btn sm" id="nfNo">Cancel</button>
          </div>
        </div>
      </div>
    </aside>

    <div id="board"></div>
    <div id="week" class="hide"></div>
  </main>

  <footer>
    <span id="statTotal">—</span>
    <span class="sp"></span>
    <span id="statDone"></span>
    <span class="sp"></span>
    <span data-tip="Dead time inserted between every block in a column">buffer</span>
    <span class="step"><button id="gapM">−</button><b id="gapv">0m</b><button id="gapP">+</button></span>
  </footer>
</div>

<div id="veil"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="tip"></div>

<script>
'use strict';
/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DSHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DLET = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const ICSD = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
const TDD = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const WEEKORD = [1, 2, 3, 4, 5, 6, 0];                 /* week view runs Mon → Sun */
const PAL = ['#7ee8fa', '#9d8cff', '#ffb347', '#6ee7a8', '#ff6b81', '#5aa9ff', '#ffd166', '#4fd6c0', '#e879f9', '#94a3b8'];
const SCALE = 0.75;                                     /* minutes → px, fixed. Blocks grow to fit content. */
const EGLYPH = ['', '◔', '◑', '●'];
const ENAME = ['', 'light', 'medium', 'heavy'];
const EWEIGHT = [1, 0.5, 1, 1.75];
const ECOL = ['#33414f', '#6ee7a8', '#ffb347', '#ff6b81'];
const PRI = ['', 'P1', 'P2', 'P3'];

function toast(msg) {
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}
/* instant hover tooltips — every control explains itself */
const tipBox = $('#tip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tipBox.classList.remove('on'); return; }
  tipBox.innerHTML = t.dataset.tip;
  const r = t.getBoundingClientRect();
  tipBox.classList.add('on');
  const w = tipBox.offsetWidth, h = tipBox.offsetHeight;
  let x = clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8);
  let y = r.top - h - 7; if (y < 8) y = r.bottom + 7;
  tipBox.style.left = x + 'px'; tipBox.style.top = y + 'px';
});
document.addEventListener('mouseleave', () => tipBox.classList.remove('on'));

/* ---------- context menus ---------- */
function closeMenu() { document.querySelectorAll('.ctxmenu').forEach(m => m.remove()); }
function closeSub() { document.querySelectorAll('.ctxmenu.sub').forEach(m => m.remove()); }
function placeMenu(m, x, y) {
  m.style.left = clamp(x, 6, innerWidth - m.offsetWidth - 6) + 'px';
  m.style.top = clamp(y, 6, innerHeight - m.offsetHeight - 6) + 'px';
}
function buildMenu(m, list) {
  list.forEach(it => {
    if (it.sep) return m.appendChild(el('div', 'sep'));
    if (it.head) return m.appendChild(el('div', 'hd', esc(it.head)));
    const d = el('div', 'mi' + (it.danger ? ' danger' : ''),
      (it.check ? '✓ ' : '') + esc(it.label) + (it.sub ? '<span class="k">▸</span>' : (it.k ? '<span class="k">' + esc(it.k) + '</span>' : '')));
    if (it.sub) {
      d.onmouseenter = () => {
        closeSub();
        const s = el('div', 'ctxmenu sub');
        buildMenu(s, typeof it.sub === 'function' ? it.sub() : it.sub);
        document.body.appendChild(s);
        const r = d.getBoundingClientRect();
        placeMenu(s, r.right + 3, r.top - 5);
      };
    } else {
      d.onmouseenter = closeSub;
      d.onclick = () => { closeMenu(); if (it.fn) it.fn(); };
    }
    m.appendChild(d);
  });
}
function openMenu(x, y, list) {
  closeMenu(); tipBox.classList.remove('on');
  const m = el('div', 'ctxmenu');
  buildMenu(m, list);
  document.body.appendChild(m);
  placeMenu(m, x, y);
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.ctxmenu')) closeMenu(); }, true);
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
window.addEventListener('blur', closeMenu);

/* ============================ state ============================ */
const KEY = 'block_v1';
/* name, minutes, colour index, energy */
const DEFLIB = [
  ['Morning', [['Wake + hydrate', 5, 0, 1], ['Sunlight walk', 15, 3, 1], ['Cold shower', 10, 5, 2], ['Coffee', 10, 2, 1], ['Journal', 10, 1, 1], ['Meditate', 10, 1, 1], ['Mobility', 15, 3, 2], ['Breakfast', 20, 2, 1], ['Read', 20, 1, 2]]],
  ['Work', [['Deep work', 90, 5, 3], ['Admin + email', 30, 9, 1], ['Client calls', 60, 5, 3], ['Content creation', 45, 8, 3], ['Program writing', 60, 8, 3], ['Check-ins', 20, 9, 2], ['Plan tomorrow', 10, 9, 1]]],
  ['Training', [['Lift', 60, 4, 3], ['Conditioning', 25, 4, 3], ['Zone 2', 45, 3, 2], ['Stretch', 15, 3, 1], ['Steps walk', 30, 3, 1]]],
  ['Life', [['Lunch', 30, 2, 1], ['Dinner', 45, 2, 1], ['Family time', 60, 6, 2], ['Errands', 30, 9, 2], ['Chores', 20, 9, 2]]],
  ['Wind down', [['Screens off', 30, 1, 1], ['Shower', 10, 1, 1], ['Read fiction', 20, 1, 1], ['Evening stretch', 10, 3, 1], ['Sleep', 480, 1, 1]]],
];
function seedLib() {
  const out = [];
  DEFLIB.forEach(([cat, arr]) => arr.forEach(([name, dur, ci, en]) => out.push({ id: uid(), name, dur, color: PAL[ci], cat, energy: en })));
  return out;
}
const seedVariant = name => ({ id: uid(), name, items: {} });
function seedState() {
  const lanes = [
    { id: uid(), name: 'Morning', start: '06:00', target: '09:00' },
    { id: uid(), name: 'Midday', start: '12:00', target: '' },
    { id: uid(), name: 'Evening', start: '18:00', target: '22:30' },
  ];
  const v = seedVariant('Weekday');
  lanes.forEach(l => v.items[l.id] = []);
  return {
    v: 2, lanes, lib: seedLib(), templates: [], variants: [v], current: v.id,
    week: [null, null, null, null, null, null, null], rules: [],
    view: 'day', gap: 0, h24: false, doneDate: '',
    tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'),
    calName: 'Routine', tdProject: 'Routine', tdPriority: 1, exportScope: 'variant',
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem('brick_v1')) || seedState(); } catch (e) { S = seedState(); }
if (!S.lanes || !S.variants) S = seedState();
/* forward-compat for maps saved by older versions */
S.templates = S.templates || []; S.rules = S.rules || []; S.week = S.week || [null, null, null, null, null, null, null];
S.view = S.view || 'day'; S.exportScope = S.exportScope || 'variant'; S.doneDate = S.doneDate || '';
delete S.zoom;
S.variants.forEach(v => S.lanes.forEach(l => { if (!v.items[l.id]) v.items[l.id] = []; }));

const M = () => S.variants.find(v => v.id === S.current) || S.variants[0];
const variant = id => S.variants.find(v => v.id === id);
const lane = id => S.lanes.find(l => l.id === id);
const items = laneId => (M().items[laneId] || (M().items[laneId] = []));
/** run fn with a different routine active — schedule()/items() always read the current one */
function withVariant(id, fn) { const p = S.current; S.current = id; try { return fn(); } finally { S.current = p; } }

let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 250); }

const HIST = [];
function snap() {
  HIST.push(JSON.stringify({ lanes: S.lanes, variants: S.variants, current: S.current, lib: S.lib, templates: S.templates, rules: S.rules, week: S.week }));
  if (HIST.length > 80) HIST.shift();
}
function undo() {
  if (!HIST.length) return toast('nothing to undo');
  Object.assign(S, JSON.parse(HIST.pop()));
  render(); toast('undo');
}

/* ============================ time ============================ */
const hm2min = s => { const [h, m] = String(s || '0:00').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
function fmt(min) {
  min = ((Math.round(min) % 1440) + 1440) % 1440;
  const h = Math.floor(min / 60), m = min % 60;
  if (S.h24) return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  const ap = h < 12 ? 'am' : 'pm', hh = h % 12 === 0 ? 12 : h % 12;
  return hh + ':' + String(m).padStart(2, '0') + ap;
}
const dur2s = d => d >= 60 ? (d % 60 ? Math.floor(d / 60) + 'h' + String(d % 60).padStart(2, '0') : Math.floor(d / 60) + 'h') : d + 'm';
function pad(n) { return String(n).padStart(2, '0'); }
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const todayIdx = () => new Date().getDay();
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

/**
 * Blocks flow from the lane start (buffer between them) EXCEPT anchored ones
 * (it.at = 'HH:MM'), which own their start; the flow resumes from there.
 */
function schedule(laneId) {
  const L = lane(laneId); let cur = hm2min(L.start); const out = [];
  items(laneId).forEach((it, i) => {
    if (i) cur += S.gap;
    let s = cur, gap = 0, clash = 0;
    if (it.at) {
      const a = hm2min(it.at) + (cur > hm2min(it.at) + 720 ? 1440 : 0);
      s = a;
      if (i && a < cur) { clash = cur - a; }
      else if (i) gap = a - cur;
    }
    out.push({ it, s, e: s + it.dur, gap, clash });
    cur = s + it.dur;
  });
  return out;
}
const laneEnd = laneId => { const sc = schedule(laneId); return sc.length ? sc[sc.length - 1].e : hm2min(lane(laneId).start); };
const laneMins = laneId => items(laneId).reduce((a, b) => a + b.dur, 0);
/** duration sets a FLOOR — content decides the real height, so nothing can ever overlap */
const brickMin = d => Math.max(52, 22 + d * SCALE);
/** anything ≤10 min collapses to a single row, unless you expand it by hand */
const isMini = it => !it.big && it.dur <= 10;
/** ± steps in single minutes while a block is tiny, in 5s once it isn't */
const durStep = d => d <= 15 ? 1 : 5;
/** "Vitamins 1m" / "Deep work 1h30" → name + duration */
function parseTrailingDur(s) {
  let m = s.match(/^(.+?)[\s,–-]+(\d+)\s*h(?:ours?|rs?)?(?:[\s,]*(\d+)\s*(?:m(?:in(?:ute)?s?)?)?)?$/i);
  if (m) return { name: m[1].trim(), dur: (+m[2]) * 60 + (+(m[3] || 0)) };
  m = s.match(/^(.+?)[\s,–-]+(\d+)\s*m(?:in(?:ute)?s?)?$/i);
  if (m) return { name: m[1].trim(), dur: +m[2] };
  return null;
}
const daysShort = days => {
  const on = days.map((d, i) => d ? i : -1).filter(i => i >= 0);
  if (!on.length) return 'never';
  if (on.length === 7) return 'daily';
  if (on.join() === '1,2,3,4,5') return 'M–F';
  if (on.join() === '0,6') return 'S/S';
  return on.map(i => DLET[i]).join('');
};
const locked = it => !!(it.pin || it.at);
const energyOf = it => it.energy || 2;
/** load units: one hour of medium work = 1.0 */
const loadOf = it => it.dur / 60 * EWEIGHT[energyOf(it)];
const laneLoad = laneId => items(laneId).reduce((a, b) => a + loadOf(b), 0);

/* ============================ mutations ============================ */
function mkItem(src) {
  return {
    id: uid(), name: src.name, dur: src.dur, color: src.color, note: src.note || '',
    days: src.days ? src.days.slice() : [0, 1, 1, 1, 1, 1, 0],
    pin: false, at: null, pri: src.pri || 0, energy: src.energy || 2, done: false,
  };
}
function addItem(laneId, src, idx) {
  snap(); const it = mkItem(src); const arr = items(laneId);
  arr.splice(idx == null ? arr.length : idx, 0, it); render(); return it;
}
function removeItem(laneId, id) { snap(); const a = items(laneId); const i = a.findIndex(x => x.id === id); if (i > -1) a.splice(i, 1); render(); }
function findItem(id) {
  for (const l of S.lanes) { const a = items(l.id); const i = a.findIndex(x => x.id === id); if (i > -1) return { laneId: l.id, arr: a, i, it: a[i] }; }
  return null;
}
/** priority first: P1 → P2 → P3 → unset. Stable inside a tier; pinned + anchored blocks keep their slot. */
function sortPri(laneId) {
  const arr = items(laneId);
  const idx = arr.map((x, i) => locked(x) ? -1 : i).filter(i => i >= 0);
  if (idx.length < 2) return toast('need 2+ unlocked blocks in this column');
  const vals = idx.map(i => arr[i]);
  if (vals.every(v => !v.pri)) return toast('no priorities set yet — click a block’s <b>P</b> badge first');
  snap();
  const rank = it => (it.pri > 0 ? it.pri : 9);
  vals.map((v, i) => [v, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).forEach(([v], k) => arr[idx[k]] = v);
  render();
}

/* ============================ today’s checklist ============================ */
/** which routine is meant to run today: the week assignment wins, else whatever is open */
const routineForToday = () => S.week[todayIdx()] || S.current;
/** blocks in a routine that actually apply today */
function todaysBlocks(vid) {
  const d = todayIdx();
  return withVariant(vid, () => S.lanes.flatMap(l => items(l.id)).filter(it => it.days[d]));
}
function clearDone(vid) { withVariant(vid, () => S.lanes.forEach(l => items(l.id).forEach(it => it.done = false))); }
/** new day → yesterday's ticks are gone. This is what makes it a recurring list. */
function rolloverIfNewDay() {
  if (S.doneDate === todayKey()) return;
  S.doneDate = todayKey();
  S.variants.forEach(v => clearDone(v.id));
  save();
}
function toggleDone(it) {
  it.done = !it.done;
  save();
  if (!it.done) return render();
  const vid = routineForToday();
  const todays = todaysBlocks(vid);
  const open = todays.filter(b => !b.done);
  render();
  if (todays.length && !open.length) {
    document.querySelectorAll('.brick').forEach(n => n.classList.add('celebrate'));
    toast('✓ <b>' + todays.length + '/' + todays.length + '</b> — routine complete. Resetting for tomorrow…');
    setTimeout(() => { clearDone(vid); render(); }, 1400);
  }
}

/* ============================ rules ============================ */
const RULEKINDS = {
  after: { label: '‹A› starts at least ‹N›m after ‹B› ends', f: ['a', 'mins', 'b'] },
  order: { label: '‹A› comes before ‹B›', f: ['a', 'b'] },
  notbefore: { label: '‹A› never starts before ‹time›', f: ['a', 'time'] },
  notafter: { label: '‹A› never starts after ‹time›', f: ['a', 'time'] },
  endby: { label: '‹A› is finished by ‹time›', f: ['a', 'time'] },
  maxheavy: { label: 'no more than ‹N› ● heavy blocks back to back', f: ['mins'] },
};
function ruleText(r) {
  const a = '<b>' + esc(r.a || '?') + '</b>', b = '<b>' + esc(r.b || '?') + '</b>';
  if (r.kind === 'after') return a + ' starts at least <b>' + (r.mins || 0) + 'm</b> after ' + b + ' ends';
  if (r.kind === 'order') return a + ' comes before ' + b;
  if (r.kind === 'notbefore') return a + ' never starts before <b>' + esc(r.time || '') + '</b>';
  if (r.kind === 'notafter') return a + ' never starts after <b>' + esc(r.time || '') + '</b>';
  if (r.kind === 'endby') return a + ' is finished by <b>' + esc(r.time || '') + '</b>';
  if (r.kind === 'maxheavy') return 'no more than <b>' + (r.mins || 2) + '</b> ● heavy blocks back to back';
  return '?';
}
/** check the arrangement against every enabled rule; returns per-block messages + per-rule status */
function checkRules(vid) {
  const res = { byItem: new Map(), byRule: new Map(), count: 0 };
  const rows = withVariant(vid || S.current, () => S.lanes.flatMap(L => schedule(L.id).map(r => Object.assign({ lane: L }, r))));
  const hit = (r, ids, msg) => {
    res.count++;
    res.byRule.set(r.id, (res.byRule.get(r.id) || 0) + 1);
    ids.forEach(id => { if (!res.byItem.has(id)) res.byItem.set(id, []); res.byItem.get(id).push(msg); });
  };
  const named = n => rows.filter(r => r.it.name.toLowerCase().trim() === String(n || '').toLowerCase().trim());
  (S.rules || []).filter(r => r.on !== false).forEach(r => {
    const A = named(r.a), B = named(r.b);
    if (r.kind === 'after') A.forEach(a => B.forEach(b => { if (a.s < b.e + (+r.mins || 0)) hit(r, [a.it.id, b.it.id], a.it.name + ' needs ' + r.mins + 'm after ' + b.it.name); }));
    if (r.kind === 'order') A.forEach(a => B.forEach(b => { if (a.s >= b.s) hit(r, [a.it.id, b.it.id], a.it.name + ' should come before ' + b.it.name); }));
    if (r.kind === 'notbefore') A.forEach(a => { if (a.s < hm2min(r.time)) hit(r, [a.it.id], a.it.name + ' starts before ' + r.time); });
    if (r.kind === 'notafter') A.forEach(a => { if (a.s > hm2min(r.time)) hit(r, [a.it.id], a.it.name + ' starts after ' + r.time); });
    if (r.kind === 'endby') A.forEach(a => { if (a.e > hm2min(r.time)) hit(r, [a.it.id], a.it.name + ' runs past ' + r.time); });
    if (r.kind === 'maxheavy') {
      const lim = +r.mins || 2;
      withVariant(vid || S.current, () => S.lanes.forEach(L => {
        let run = [];
        items(L.id).forEach(it => {
          if (energyOf(it) === 3) run.push(it); else run = [];
          if (run.length > lim) hit(r, run.map(x => x.id), run.length + ' heavy blocks in a row in ' + L.name);
        });
      }));
    }
  });
  return res;
}
let RULECHK = { byItem: new Map(), byRule: new Map(), count: 0 };

/* ============================ render ============================ */
function render() {
  rolloverIfNewDay();

}

      c.addEventListener('contextmenu', ev => {

function brickNode(laneId, it, s, e, meta) {
  meta = meta || {};
  const broke = RULECHK.byItem.get(it.id);
  const mini = isMini(it);
  const n = el('div', 'brick' + (mini ? ' mini' : '') + (it.pin ? ' pinned' : '') + (it.done ? ' done' : '') + (broke ? ' broke' : ''));
  n.dataset.id = it.id; n.dataset.lane = laneId;
  n.style.setProperty('--c', it.color);
  if (!mini) n.style.minHeight = brickMin(it.dur) + 'px';

  const startTip = it.at
    ? 'Starts at <b>' + it.at + '</b> — anchored, so it holds this time and the rest flows around it.<br>Click to change or release.'
    : 'Click to set an exact <b>start</b> time (anchors the block)';
  const endTip = 'Click to set when this <b>finishes</b> — the duration adjusts to match';

  if (!mini) {
    /* --- top row: start – end, warnings, duration --- */
    const top = el('div', 'b-top');
    const t0 = el('button', 'b-time' + (it.at ? ' anc' : '') + (meta.clash ? ' clash' : ''), (it.at ? '⚓ ' : '') + fmt(s));
    t0.dataset.tip = startTip;
    t0.onclick = ev => { ev.stopPropagation(); editTime(t0, it, s); };
    const t1 = el('button', 'b-time b-end', fmt(e));
    t1.dataset.tip = endTip;
    t1.onclick = ev => { ev.stopPropagation(); editEnd(t1, it, s); };
    top.appendChild(t0); top.appendChild(el('span', 'b-dash', '–')); top.appendChild(t1);
    if (meta.gap > 0) { const g = el('span', 'b-flag', '↧' + dur2s(meta.gap)); g.dataset.tip = '<b>' + dur2s(meta.gap) + '</b> of empty time before this block'; top.appendChild(g); }
    if (meta.clash > 0) { const g = el('span', 'b-flag bad', '⚠' + dur2s(meta.clash)); g.dataset.tip = 'The block above runs <b>' + dur2s(meta.clash) + '</b> past this anchored start'; top.appendChild(g); }
    if (broke) { const g = el('span', 'b-flag bad', '⚠ rule'); g.dataset.tip = broke.map(esc).join('<br>'); top.appendChild(g); }
    top.appendChild(el('span', 'b-sp'));
    const du = el('div', 'b-dur');
    const step = durStep(it.dur);
    const mi = el('button', null, '−'), pl = el('button', null, '+');
    mi.dataset.tip = step + ' minute' + (step > 1 ? 's' : '') + ' shorter'; pl.dataset.tip = step + ' minute' + (step > 1 ? 's' : '') + ' longer';
    mi.onclick = ev => { ev.stopPropagation(); snap(); it.dur = Math.max(1, it.dur - durStep(it.dur)); render(); };
    pl.onclick = ev => { ev.stopPropagation(); snap(); it.dur += durStep(it.dur + 1); render(); };
    const db = el('b', null, dur2s(it.dur));
    db.dataset.tip = 'Click to type exact minutes — <b>1</b> is fine';
    db.onclick = ev => { ev.stopPropagation(); editDur(db, it); };
    du.appendChild(mi); du.appendChild(db); du.appendChild(pl);
    top.appendChild(du);
    n.appendChild(top);
  }

  /* --- checkbox + name --- */
  const main = el('div', 'b-main');
  const ck = el('button', 'b-check' + (it.done ? ' on' : ''), '✓');
  ck.dataset.tip = it.done ? 'Done — click to un-check' : 'Check it off. When today’s whole routine is ticked, it resets itself.';
  ck.onclick = ev => { ev.stopPropagation(); toggleDone(it); };
  main.appendChild(ck);
  const txt = el('div', 'b-txt');
  const nm = el('div', 'b-name', esc(it.name));
  nm.contentEditable = 'true'; nm.spellcheck = false;
  nm.onblur = () => {
    const v = nm.textContent.replace(/\s+/g, ' ').trim();
    if (!v || v === it.name) { nm.textContent = it.name; return; }
    snap();
    const p = parseTrailingDur(v);            /* "Vitamins 1m" sets the name AND the duration */
    if (p && p.dur >= 1 && p.dur <= 1440) { it.name = p.name; it.dur = p.dur; }
    else it.name = v;
    render();
  };
  nm.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); nm.blur(); } ev.stopPropagation(); };
  txt.appendChild(nm);
  if (it.note || it.noteOpen) {
    const no = el('div', 'b-note', esc(it.note || ''));
    no.contentEditable = 'true'; no.spellcheck = false;
    no.onblur = () => {
      const v = no.textContent.replace(/\s+/g, ' ').trim();
      if (v !== it.note) { snap(); it.note = v; }
      if (!v) { it.noteOpen = false; render(); } else save();
    };
    no.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === 'Escape') { ev.preventDefault(); no.blur(); } ev.stopPropagation(); };
    txt.appendChild(no);
    if (it.noteOpen) setTimeout(() => no.focus(), 10);
  }
  main.appendChild(txt);
  if (mini) {
    const mt = el('button', 'b-mtime' + (it.at ? ' anc' : ''), (it.at ? '⚓' : '') + fmt(s));
    mt.dataset.tip = startTip;
    mt.onclick = ev => { ev.stopPropagation(); editTime(mt, it, s); };
    const md = el('span', 'b-mdays', daysShort(it.days) + ' · ' + dur2s(it.dur));
    md.dataset.tip = 'Runs <b>' + esc(daysLabel(it.days)) + '</b> · ' + dur2s(it.dur) + '<br>Right-click for days, duration, effort…';
    if (broke) { const g = el('span', 'b-flag bad', '⚠'); g.dataset.tip = broke.map(esc).join('<br>'); main.appendChild(g); }
    main.appendChild(mt); main.appendChild(md);
  }
  n.appendChild(main);

  /* --- foot: days, badges, hover controls --- */
  const foot = el('div', 'b-foot');
  const dz = el('div', 'b-days');
  dz.dataset.tip = 'Which days this block runs — drives the repeat rule in Calendar / Todoist';
  it.days.forEach((on, i) => {
    const b = el('b', on ? 'on' : '', DLET[i]);
    b.onclick = ev => { ev.stopPropagation(); snap(); it.days[i] = it.days[i] ? 0 : 1; render(); };
    dz.appendChild(b);
  });
  foot.appendChild(dz);

  const ctl = el('div', 'b-ctl');
  const eg = el('button', 'b-badge ' + (it.energy ? 'e' + it.energy : 'dim'), it.energy ? EGLYPH[it.energy] : '◌');
  eg.dataset.tip = 'Effort: <b>' + ENAME[energyOf(it)] + '</b> — click to cycle ◔ light / ◑ medium / ● heavy.<br>Feeds the column’s load meter.';
  eg.onclick = ev => { ev.stopPropagation(); snap(); it.energy = ((it.energy || 0) % 3) + 1; render(); };
  const pr = el('button', 'b-badge ' + (it.pri ? 'p' + it.pri : 'dim'), it.pri ? PRI[it.pri] : 'P');
  pr.dataset.tip = 'Priority: <b>' + (it.pri ? 'P' + it.pri : 'none') + '</b> — click to cycle.<br>Exports as Todoist p1–p3 and drives ↓P sort.';
  pr.onclick = ev => { ev.stopPropagation(); snap(); it.pri = ((it.pri || 0) + 1) % 4; render(); };
  const nt = el('button', 'hov' + (it.note ? ' on' : ''), '✎'); nt.dataset.tip = 'Add a note (exports as the task description)';
  nt.onclick = ev => { ev.stopPropagation(); it.noteOpen = !it.noteOpen; render(); };
  const pin = el('button', 'hov' + (it.pin ? ' on' : ''), '📌'); pin.dataset.tip = 'Pin this block’s position so ↓P sort leaves it alone';
  pin.onclick = ev => { ev.stopPropagation(); snap(); it.pin = !it.pin; render(); };
  const cp = el('button', 'hov', '⧉'); cp.dataset.tip = 'Duplicate';
  cp.onclick = ev => { ev.stopPropagation(); const f = findItem(it.id); snap(); f.arr.splice(f.i + 1, 0, Object.assign({}, it, { id: uid(), days: it.days.slice(), at: null, done: false })); render(); };
  const rm = el('button', 'hov', '✕'); rm.dataset.tip = 'Remove this block';
  rm.onclick = ev => { ev.stopPropagation(); removeItem(laneId, it.id); };
  const mo = el('button', 'hov', '⋯'); mo.dataset.tip = 'Everything else — days, move, times… (same as right-click)';
  mo.onclick = ev => { ev.stopPropagation(); const r = mo.getBoundingClientRect(); blockMenu(laneId, it, r.left, r.bottom + 4); };
  (mini ? [eg, pr, mo] : [eg, pr, nt, pin, cp, rm, mo]).forEach(x => ctl.appendChild(x));
  foot.appendChild(ctl);
  n.appendChild(foot);

  const grip = el('div', 'b-grip'); grip.dataset.tip = 'Drag to change how long this takes';
  grip.addEventListener('pointerdown', ev => startResize(ev, it, n));
  n.appendChild(grip);

  n.addEventListener('pointerdown', ev => {
    if (ev.button === 2) return;
    if (ev.target.closest('.b-ctl,.b-days,.b-dur,.b-grip,.b-name,.b-note,.b-time,.b-mtime,.b-timein,.b-durin,.b-check')) return;
    startDrag(ev, { kind: 'move', id: it.id, node: n });
  });
  n.addEventListener('contextmenu', ev => { ev.preventDefault(); ev.stopPropagation(); blockMenu(laneId, it, ev.clientX, ev.clientY); });
  return n;
}

/* ---------- right-click: block ---------- */
function blockMenu(laneId, it, x, y) {
  const setDays = arr => { snap(); it.days = arr.slice(); render(); };
  openMenu(x, y, [
    { head: it.name },
    { label: 'Set start time…', k: '⚓', fn: () => promptTime('Start time (HH:MM) — anchors the block', it.at || '', v => { snap(); it.at = v || null; render(); }) },
    { label: 'Set end time…', fn: () => {
        const st = schedule(laneId).find(r => r.it.id === it.id);
        promptTime('Finish time (HH:MM)', hhmm(st.e), v => { if (!v) return; snap(); let d = hm2min(v) - (st.s % 1440); if (d <= 0) d += 1440; it.dur = clamp(d, 1, 1440); render(); });
      } },
    { label: 'Set duration…', fn: () => { const v = prompt('Minutes', it.dur); if (v) { snap(); it.dur = clamp(parseInt(v) || it.dur, 1, 1440); render(); } } },
    { sep: 1 },
    { label: 'Effort', sub: [1, 2, 3].map(k => ({ label: EGLYPH[k] + ' ' + ENAME[k], check: energyOf(it) === k, fn: () => { snap(); it.energy = k; render(); } })) },
    { label: 'Priority', sub: [0, 1, 2, 3].map(k => ({ label: k ? 'P' + k : 'none', check: (it.pri || 0) === k, fn: () => { snap(); it.pri = k; render(); } })) },
    { label: 'Days', sub: () => [
        { label: 'Every day', fn: () => setDays([1, 1, 1, 1, 1, 1, 1]) },
        { label: 'Weekdays', fn: () => setDays([0, 1, 1, 1, 1, 1, 0]) },
        { label: 'Weekend', fn: () => setDays([1, 0, 0, 0, 0, 0, 1]) },
        { sep: 1 },
        ...WEEKORD.map(d => ({ label: DSHORT[d], check: !!it.days[d], fn: () => { snap(); it.days[d] = it.days[d] ? 0 : 1; render(); } })),
      ] },
    { sep: 1 },
    { label: it.note ? 'Edit note' : 'Add note', fn: () => { it.noteOpen = true; it.big = true; render(); } },
    { label: 'Pin position', check: !!it.pin, fn: () => { snap(); it.pin = !it.pin; render(); } },
    { label: isMini(it) ? 'Expand to full card' : (it.dur <= 10 ? 'Collapse to one line' : 'Compact view'), check: !!it.big && it.dur <= 10,
      fn: () => { it.big = !it.big; render(); } },
    { label: 'Move to column', sub: S.lanes.filter(L => L.id !== laneId).map(L => ({
        label: L.name, fn: () => { const f = findItem(it.id); snap(); f.arr.splice(f.i, 1); items(L.id).push(it); render(); } })) },
    { label: 'Duplicate', fn: () => { const f = findItem(it.id); snap(); f.arr.splice(f.i + 1, 0, Object.assign({}, it, { id: uid(), days: it.days.slice(), at: null, done: false })); render(); } },
    { label: 'Save to bin', fn: () => { snap(); S.lib.push({ id: uid(), name: it.name, dur: it.dur, color: it.color, cat: 'Custom', energy: energyOf(it) }); render(); toast('<b>' + esc(it.name) + '</b> saved to the bin'); } },
    { sep: 1 },
    { label: 'Delete block', danger: 1, fn: () => removeItem(laneId, it.id) },
  ]);
}
function promptTime(msg, cur, fn) { const v = prompt(msg + '\n(blank to clear)', cur); if (v !== null) fn(v.trim()); }

function editTime(chip, it, s) {
  const inp = el('input', 'b-timein'); inp.type = 'time'; inp.value = it.at || hhmm(s);
  const wrap = el('span'); wrap.style.cssText = 'display:inline-flex;gap:3px;align-items:center';
  const clr = el('button', null, it.at ? '⚓✕' : '');
  clr.style.cssText = 'font-size:9px;color:var(--dim2)';
  clr.dataset.tip = 'Release the anchor — let this block flow again';
  wrap.appendChild(inp); if (it.at) wrap.appendChild(clr);
  chip.replaceWith(wrap);
  inp.focus();
  let done = false;
  const commit = v => { if (done) return; done = true; snap(); it.at = v || null; render(); };
  clr.onclick = ev => { ev.stopPropagation(); commit(null); };
  inp.onkeydown = ev => { ev.stopPropagation(); if (ev.key === 'Enter') commit(inp.value); if (ev.key === 'Escape') { done = true; render(); } };
  inp.onblur = () => setTimeout(() => commit(inp.value), 120);
}
/** setting the finish time is just duration arithmetic — end before start means it runs past midnight */
function editEnd(node, it, s) {
  const inp = el('input', 'b-timein'); inp.type = 'time'; inp.value = hhmm(s + it.dur);
  node.replaceWith(inp); inp.focus();
  let done = false;
  const commit = () => {
    if (done) return; done = true;
    if (inp.value) {
      let d = hm2min(inp.value) - (((s % 1440) + 1440) % 1440);
      if (d <= 0) d += 1440;
      if (d !== it.dur) { snap(); it.dur = clamp(d, 1, 1440); }
    }
    render();
  };
  inp.onkeydown = ev => { ev.stopPropagation(); if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') { done = true; render(); } };
  inp.onblur = () => setTimeout(commit, 120);
}
function editDur(node, it) {
  const inp = el('input', 'b-durin'); inp.type = 'number'; inp.min = '5'; inp.step = '5'; inp.value = it.dur;
  node.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const commit = () => {
    if (done) return; done = true;
    const v = clamp(Math.round(parseInt(inp.value) || it.dur), 1, 1440);
    if (v !== it.dur) { snap(); it.dur = v; }
    render();
  };
  inp.onkeydown = ev => { ev.stopPropagation(); if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') { done = true; render(); } };
  inp.onblur = commit;
}

/* ---------- week view ---------- */
function renderWeek() {
  const w = $('#week'); w.innerHTML = '';
  WEEKORD.forEach(d => {
    const vid = S.week[d];
    const v = variant(vid);
    const col = el('div', 'day' + (d === todayIdx() ? ' today' : ''));

    const head = el('div', 'day-head');
    head.appendChild(el('h3', null, DSHORT[d] + (d === todayIdx() ? ' <em>today</em>' : '')));
    const sel = el('select');
    sel.dataset.tip = 'Which routine runs on ' + DAYS[d] + '?';
    sel.appendChild(el('option', null, '— rest day —')).value = '';
    S.variants.forEach(x => { const o = el('option', null, esc(x.name)); o.value = x.id; if (x.id === vid) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => {
      snap(); S.week[d] = sel.value || null;
      /* a routine put on Saturday whose blocks are all set to weekdays would silently vanish — offer the fix up front */
      const nv = variant(S.week[d]);
      if (nv) {
        const off = withVariant(nv.id, () => S.lanes.flatMap(l => items(l.id)).filter(it => !it.days[d]));
        if (off.length && confirm(nv.name + ' now runs on ' + DAYS[d] + ', but ' + off.length + ' of its blocks aren\'t set to run that day.\n\nTurn ' + DSHORT[d] + ' on for them?')) {
          off.forEach(it => it.days[d] = 1);
        }
      }
      render();
    };
    head.appendChild(sel);

    const meta = el('div', 'day-meta');
    if (v) {
      const rows = withVariant(v.id, () => S.lanes.map(L => ({ L, sc: schedule(L.id).filter(r => r.it.days[d]) })).filter(x => x.sc.length));
      const mins = rows.reduce((a, x) => a + x.sc.reduce((b, r) => b + r.it.dur, 0), 0);
      const load = rows.reduce((a, x) => a + x.sc.reduce((b, r) => b + loadOf(r.it), 0), 0);
      const nblocks = rows.reduce((a, x) => a + x.sc.length, 0);
      const chk = checkRules(v.id);
      meta.appendChild(el('span', null, nblocks + (nblocks === 1 ? ' block' : ' blocks')));
      meta.appendChild(el('span', null, dur2s(mins)));
      const ld = el('span', null, 'load ' + load.toFixed(1));
      ld.dataset.tip = 'Effort load for ' + DAYS[d] + ' — one hour of medium effort = 1.0';
      meta.appendChild(ld);
      if (chk.count) { const b = el('span', 'bad', '⚠ ' + chk.count); b.dataset.tip = 'Rule breaks in this routine'; meta.appendChild(b); }
      const off = withVariant(v.id, () => S.lanes.flatMap(l => items(l.id)).filter(it => !it.days[d]));
      if (off.length) {
        const b = el('span', 'bad', off.length + ' off');
        b.dataset.tip = '<b>' + off.length + ' blocks</b> in this routine aren’t set to run on ' + DSHORT[d] + ', so they won’t fire or export.<br>Click to switch ' + DSHORT[d] + ' on for them.';
        b.style.cursor = 'pointer';
        b.onclick = () => { snap(); off.forEach(it => it.days[d] = 1); render(); };
        meta.appendChild(b);
      }
      head.appendChild(meta);
      col.appendChild(head);

      const body = el('div', 'day-body');
      rows.forEach(({ L, sc }) => {
        body.appendChild(el('div', 'day-lane', esc(L.name)));
        sc.forEach(({ it, s }) => {
          const r = el('div', 'day-b'); r.style.setProperty('--c', it.color);
          r.innerHTML = '<i></i><span>' + (it.pri ? '<b style="color:#ff8a9c">' + PRI[it.pri] + '</b> ' : '') + esc(it.name) + '</span><em>' + fmt(s) + '</em>';
          r.dataset.tip = '<b>' + esc(it.name) + '</b> — ' + dur2s(it.dur) + ', ' + ENAME[energyOf(it)] + ' effort';
          body.appendChild(r);
        });
      });
      if (!rows.length) body.appendChild(el('div', 'day-rest', 'nothing scheduled on ' + DSHORT[d]));
      col.appendChild(body);
      const ed = el('button', 'day-edit', '✎ edit ' + esc(v.name));
      ed.onclick = () => { S.current = v.id; S.view = 'day'; render(); };
      col.appendChild(ed);
    } else {
      head.appendChild(meta);
      col.appendChild(head);
      col.appendChild(el('div', 'day-body', '<div class="day-rest">— rest day —<br><span style="opacity:.6">pick a routine above</span></div>'));
    }
    w.appendChild(col);
  });
}

function renderFoot() {

/* ============================ drag & drop ============================ */
let drag = null;
function startDrag(ev, cfg) {
  if (ev.button != null && ev.button !== 0) return;
  const rect = cfg.node.getBoundingClientRect();
  drag = { cfg, startX: ev.clientX, startY: ev.clientY, offX: ev.clientX - rect.left, offY: ev.clientY - rect.top, moved: false, ghost: null, ph: null, target: null, idx: 0 };
  ev.preventDefault();
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp, { once: true });
}
function onDragMove(ev) {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.abs(ev.clientX - drag.startX) < 5 && Math.abs(ev.clientY - drag.startY) < 5) return;
    drag.moved = true;
    tipBox.classList.remove('on');
    const c = drag.cfg;
    snap();
    let g, h;
    if (c.kind === 'tpl') {
      drag.payload = c.tpl.blocks.map(b => mkItem(b));
      g = el('div', 'tplghost', '⇩ ' + esc(c.tpl.name) + ' · ' + c.tpl.blocks.length + ' blocks');
      h = 46;
    } else {
      if (c.kind === 'lib') drag.payload = mkItem(c.src);
      else { const f = findItem(c.id); if (!f) return cancelDrag(); drag.payload = f.it; drag.from = f; f.arr.splice(f.i, 1); }
      g = brickNode('ghost', drag.payload, 0, drag.payload.dur, {});
      h = Math.max(brickMin(drag.payload.dur), 68);
    }
    g.id = 'dragghost'; g.style.minHeight = h + 'px';
    document.body.appendChild(g); drag.ghost = g;
    drag.ph = el('div', 'placeholder'); drag.ph.style.height = h + 'px';
    if (c.kind === 'move') renderBoardKeepDrag();
    document.body.style.cursor = 'grabbing';
  }
  drag.ghost.style.left = (ev.clientX - Math.min(drag.offX, 220)) + 'px';
  drag.ghost.style.top = (ev.clientY - drag.offY) + 'px';

  drag.ghost.style.display = 'none';
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  drag.ghost.style.display = '';
  const body = (under && under.closest('.lane-body')) || bodyAt(ev.clientX, ev.clientY);
  document.querySelectorAll('.lane').forEach(l => l.classList.remove('over'));
  if (!body) { if (drag.ph.parentNode) drag.ph.remove(); drag.target = null; return; }
  body.closest('.lane').classList.add('over');
  drag.target = body.dataset.lane;
  const kids = [...body.children].filter(k => k.classList.contains('brick'));
  let idx = kids.length;
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (ev.clientY < r.top + r.height / 2) { idx = i; break; }
  }
  drag.idx = idx;
  const empty = body.querySelector('.lane-empty'); if (empty) empty.remove();
  if (kids[idx]) body.insertBefore(drag.ph, kids[idx]); else body.appendChild(drag.ph);
}
function renderBoardKeepDrag() { const keep = drag; renderBoard(); drag = keep; }
/** geometric fallback so drops near a column's padding still land */
function bodyAt(x, y) {
  let hit = null;
  document.querySelectorAll('.lane').forEach(l => {
    const r = l.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = l.querySelector('.lane-body');
  });
  return hit;
}
function onDragUp() {
  window.removeEventListener('pointermove', onDragMove);
  document.body.style.cursor = '';
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  if (d.ph && d.ph.parentNode) d.ph.remove();
  if (!d.moved) { render(); return; }
  if (d.target) {
    const arr = items(d.target);
    if (Array.isArray(d.payload)) arr.splice(d.idx, 0, ...d.payload);
    else arr.splice(d.idx, 0, d.payload);
  } else if (d.from) toast('block removed — <b>Ctrl+Z</b> to undo');
  else HIST.pop();
  render();
}
function cancelDrag() {
  window.removeEventListener('pointermove', onDragMove);
  if (drag && drag.ghost) drag.ghost.remove();
  if (drag && drag.moved) HIST.pop();
  drag = null; render();
}
window.addEventListener('keydown', e => { if (e.key === 'Escape' && drag) { const d = drag; if (d.from) d.from.arr.splice(d.from.i, 0, d.payload); cancelDrag(); } });

function startResize(ev, it, node) {
  ev.preventDefault(); ev.stopPropagation();
  const y0 = ev.clientY, h0 = node.getBoundingClientRect().height, d0 = it.dur;
  let last = d0;
  const mv = e => {
    const h = Math.max(30, h0 + (e.clientY - y0));
    const raw = (h - 22) / SCALE;
    const d = raw < 15 ? Math.max(1, Math.round(raw)) : Math.round(raw / 5) * 5;
    if (d !== last) { last = d; node.style.minHeight = brickMin(d) + 'px'; const b = node.querySelector('.b-dur b'); if (b) b.textContent = dur2s(d); }
  };
  const up = () => {
    window.removeEventListener('pointermove', mv);
    if (last !== d0) { snap(); it.dur = last; }
    render();
  };
  window.addEventListener('pointermove', mv);
  window.addEventListener('pointerup', up, { once: true });
}

/* ============================ exports ============================ */
/** rows for export. Week scope = every routine that owns a weekday, intersected with each block's own days. */
function allRows() {
  const weekly = S.exportScope === 'week' && S.week.some(Boolean);
  const vs = weekly ? S.variants.filter(v => S.week.includes(v.id)) : [M()];
  const out = [];
  vs.forEach(v => withVariant(v.id, () => {
    S.lanes.forEach(L => schedule(L.id).forEach(({ it, s, e }) => {
      const days = weekly ? it.days.map((d, i) => d && S.week[i] === v.id ? 1 : 0) : it.days.slice();
      if (days.some(Boolean)) out.push({ v, lane: L, it, s, e, days, weekly });
    }));
  }));
  return out;
}
const bydays = days => days.map((d, i) => d ? ICSD[i] : null).filter(Boolean);
function daysLabel(days) {
  const on = days.map((d, i) => d ? i : -1).filter(i => i >= 0);
  if (!on.length) return '(no days)';
  if (on.length === 7) return 'every day';
  if (on.length === 5 && on.join() === '1,2,3,4,5') return 'every weekday';
  return 'every ' + on.map(i => TDD[i]).join(', ');
}
function nextDateFor(days, minutes) {
  const now = new Date(); const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const shift = Math.floor(minutes / 1440);
  for (let k = 0; k < 14; k++) {
    const d = new Date(base); d.setDate(base.getDate() + k);
    if (days[d.getDay()]) { d.setDate(d.getDate() + shift); return d; }
  }
  return base;
}
function icsFold(line) { const out = []; let s = line; while (s.length > 73) { out.push(s.slice(0, 73)); s = ' ' + s.slice(73); } out.push(s); return out.join('\r\n'); }
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
const hms = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + pad(m % 60) + '00'; };

function buildICS() {
  const now = new Date();
  const stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + 'Z';
  const rows = allRows();
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BLOCK routine builder//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'X-WR-CALNAME:' + icsEsc(S.calName + (rows[0] && rows[0].weekly ? ' — week' : ' — ' + M().name)), 'X-WR-TIMEZONE:' + S.tz];
  rows.forEach(({ v, lane, it, s, e, days }) => {
    const bd = bydays(days); if (!bd.length) return;
    const d = nextDateFor(days, s);
    const d2 = new Date(d); d2.setDate(d.getDate() + (Math.floor(e / 1440) - Math.floor(s / 1440)));
    L.push('BEGIN:VEVENT');
    L.push('UID:' + it.id + '-' + v.id + '@block');
    L.push('DTSTAMP:' + stamp);
    L.push('DTSTART:' + ymd(d) + 'T' + hms(s));
    L.push('DTEND:' + ymd(d2) + 'T' + hms(e));
    L.push('RRULE:FREQ=WEEKLY;BYDAY=' + bd.join(','));
    L.push(icsFold('SUMMARY:' + icsEsc((it.pri ? '[P' + it.pri + '] ' : '') + it.name)));
    if (it.pri) L.push('PRIORITY:' + [0, 1, 5, 9][it.pri]);
    L.push(icsFold('DESCRIPTION:' + icsEsc((it.note ? it.note + '\n' : '') + lane.name + ' · ' + v.name + ' · ' + dur2s(it.dur) + ' · ' + ENAME[energyOf(it)] + ' effort')));
    L.push(icsFold('CATEGORIES:' + icsEsc(lane.name)));
    L.push('TRANSP:OPAQUE');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function gcalLink(r) {
  const d = nextDateFor(r.days, r.s);
  const d2 = new Date(d); d2.setDate(d.getDate() + (Math.floor(r.e / 1440) - Math.floor(r.s / 1440)));
  const p = new URLSearchParams({
    action: 'TEMPLATE', text: (r.it.pri ? '[P' + r.it.pri + '] ' : '') + r.it.name,
    dates: ymd(d) + 'T' + hms(r.s) + '/' + ymd(d2) + 'T' + hms(r.e),
    details: (r.it.note ? r.it.note + ' — ' : '') + r.lane.name + ' · ' + r.v.name, ctz: S.tz,
  });
  const bd = bydays(r.days);
  return 'https://calendar.google.com/calendar/render?' + p.toString() + (bd.length ? '&recur=' + encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY=' + bd.join(',')) : '');
}
const csvQ = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
const tdPri = it => it.pri ? [0, 4, 3, 2][it.pri] : S.tdPriority;
function buildTodoistCSV() {
  const out = ['TYPE,CONTENT,DESCRIPTION,PRIORITY,INDENT,AUTHOR,RESPONSIBLE,DATE,DATE_LANG,TIMEZONE,DURATION,DURATION_UNIT'];
  const blank = ',,,,,,,,,,,';
  const rows = allRows();
  const sections = [...new Set(rows.map(r => (r.weekly && S.variants.length > 1 ? r.v.name + ' — ' : '') + r.lane.name))];
  sections.forEach(sec => {
    out.push(['section', csvQ(sec), '', '', '', '', '', '', '', '', '', ''].join(','));
    out.push(blank);
    rows.filter(r => ((r.weekly && S.variants.length > 1 ? r.v.name + ' — ' : '') + r.lane.name) === sec).forEach(r => {
      const when = daysLabel(r.days); if (when === '(no days)') return;
      out.push(['task', csvQ(r.it.name), csvQ(r.it.note || ''), tdPri(r.it), 1, '', '', csvQ(when + ' at ' + hhmm(r.s)), 'en', csvQ(S.tz), r.it.dur, 'minute'].join(','));
      out.push(blank);
    });
  });
  return out.join('\n');
}
function buildQuickAdd() {
  const out = []; let sec = null;
  allRows().forEach(r => {
    const s = (r.weekly ? r.v.name + ' / ' : '') + r.lane.name;
    if (s !== sec) { sec = s; out.push('', '# ' + s); }
    const when = daysLabel(r.days); if (when === '(no days)') return;
    out.push(r.it.name + ' ' + when + ' at ' + hhmm(r.s) + ' for ' + r.it.dur + 'min #' + S.tdProject.replace(/\s+/g, '')
      + (r.it.pri ? ' p' + r.it.pri : (S.tdPriority > 1 ? ' p' + (5 - S.tdPriority) : '')));
  });
  return out.join('\n').trim();
}
function buildText() {
  const rows = allRows();
  const out = ['# ' + S.calName + (rows[0] && rows[0].weekly ? ' — full week' : ' — ' + M().name), ''];
  let sec = null;
  rows.forEach(r => {
    const s = (r.weekly ? r.v.name + ' / ' : '') + r.lane.name;
    if (s !== sec) { sec = s; out.push('', '## ' + s); }
    out.push('- ' + fmt(r.s) + '–' + fmt(r.e) + '  ' + (r.it.pri ? '[P' + r.it.pri + '] ' : '') + r.it.name + (r.it.at ? ' ⚓' : '')
      + '  (' + dur2s(r.it.dur) + ', ' + EGLYPH[energyOf(r.it)] + ', ' + daysLabel(r.days) + ')' + (r.it.note ? ' — ' + r.it.note : ''));
  });
  return out.join('\n').trim();
}
function download(name, text, mime) {
  const b = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
  toast('downloaded <b>' + esc(name) + '</b>');
}
function copy(text) {
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('copied'), () => fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text) {
  const t = el('textarea'); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); toast('copied'); } catch (e) { toast('copy failed — select it manually'); }
  t.remove();
}

  } else if (expTab === 'csv') {

    $('#dl').onclick = () => download('todoist-' + (S.exportScope === 'week' ? 'week' : M().name.replace(/\W+/g, '-').toLowerCase()) + '.csv', t, 'text/csv;charset=utf-8');

  } else if (expTab === 'md') {

    $('#cp').onclick = () => copy(t);
    $('#dl').onclick = () => download('routine.md', t);
  } else {
    const t = JSON.stringify(S, null, 1);
    body.innerHTML = '<div class="hint">Everything: blocks, columns, routines, templates, rules, week plan. Paste one back in and hit Restore to move it to another machine.</div>' +
      '<textarea id="js">' + esc(t) + '</textarea>' +

  }

  };
}

  $('#sOk').onclick = () => {
    S.calName = $('#sCal').value.trim() || 'Routine';
    S.tdProject = $('#sProj').value.trim() || 'Routine';
    S.tdPriority = clamp(parseInt($('#sPri').value) || 1, 1, 4);
    S.tz = $('#sTz').value.trim() || S.tz;
    S.h24 = $('#sH24').checked;
    closeModal(); render();
  };
  $('#sClear').onclick = () => { snap(); S.variants.forEach(v => clearDone(v.id)); render(); toast('ticks cleared'); };
  $('#sReset').onclick = () => { if (confirm('Wipe all blocks, columns, routines, templates and rules?')) { snap(); S = seedState(); render(); closeModal(); } };
}

/* ============================ wiring ============================ */
$('#vDay').onclick = () => { S.view = 'day'; render(); };
$('#vWeek').onclick = () => { S.view = 'week'; render(); };
$('#bExp').onclick = openExport;
$('#bCmp').onclick = openCompare;
$('#bRules').onclick = openRules;
$('#bHelp').onclick = openHelp;
$('#bSet').onclick = openSettings;
$('#bNew').onclick = () => {
  const n = prompt('Name this routine', 'Rest day'); if (!n) return;
  snap(); const v = seedVariant(n.trim()); S.lanes.forEach(l => v.items[l.id] = []); S.variants.push(v); S.current = v.id; render();
};
$('#search').oninput = renderBin;
$('#gapM').onclick = () => { S.gap = Math.max(0, S.gap - 5); render(); };
$('#gapP').onclick = () => { S.gap = Math.min(60, S.gap + 5); render(); };
$('#bAddBlock').onclick = () => { $('#newform').classList.toggle('on'); $('#nfName').focus(); };
$('#nfNo').onclick = () => $('#newform').classList.remove('on');
let nfColor = PAL[0];
PAL.forEach(c => {
  const s = el('button', 'sw' + (c === nfColor ? ' on' : '')); s.style.background = c;
  s.onclick = () => { nfColor = c; $('#nfSw').querySelectorAll('.sw').forEach(x => x.classList.remove('on')); s.classList.add('on'); };
  $('#nfSw').appendChild(s);
});
$('#nfOk').onclick = () => {
  const n = $('#nfName').value.trim(); if (!n) return toast('give it a name first');
  snap();
  S.lib.push({ id: uid(), name: n, dur: Math.max(5, parseInt($('#nfMin').value) || 30), color: nfColor, cat: 'Custom', energy: parseInt($('#nfEnergy').value) || 2 });
  $('#nfName').value = ''; $('#newform').classList.remove('on'); render();
};
$('#nfName').onkeydown = e => { if (e.key === 'Enter') $('#nfOk').click(); };

window.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  if (e.key === 'Escape') closeModal();
});
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} });

render();
if (!S.lanes.some(l => items(l.id).length) && !S.templates.length) setTimeout(openHelp, 400);
</script>
</body>
</html>
