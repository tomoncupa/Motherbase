<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOCK — routine scheduler</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10; --panel:#0e141d; --panel2:#131b26; --line:#1e2a38; --line2:#2b3a4d;
  --txt:#dbe7f0; --dim:#7f93a8; --dim2:#5b6d80;
  --acc:#7ee8fa; --acc-d:#1a3a44; --warn:#ffb347; --bad:#ff6b81; --good:#6ee7a8;
  --f1:'Chakra Petch',system-ui,sans-serif; --f2:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, #10202b 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 100%, #131024 0%, transparent 55%),
    var(--bg);
  color:var(--txt); font-family:var(--f2); font-size:13px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#22303f;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:12px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:rgba(10,15,22,.85);backdrop-filter:blur(8px);flex:0 0 auto;
}
.logo{font-family:var(--f1);font-weight:700;font-size:17px;letter-spacing:.14em;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.logo b{color:var(--acc)}
.views{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#0a1018;flex:0 0 auto}
.views button{
  padding:4px 13px;border-radius:6px;font-family:var(--f1);font-size:12px;letter-spacing:.08em;color:var(--dim);
}
.views button.on{background:linear-gradient(180deg,#16303a,#102028);color:var(--acc);box-shadow:0 0 0 1px var(--acc-d)}
#tabs{display:flex;gap:6px;align-items:center;overflow-x:auto;flex:1;padding:2px;min-width:0}
.tab{
  padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  font-family:var(--f1);font-size:12px;letter-spacing:.04em;color:var(--dim);white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.tab:hover{border-color:var(--line2);color:var(--txt)}
.tab.on{border-color:var(--acc);color:var(--acc);background:linear-gradient(180deg,#12242b,#0d1a20)}
.tab .x,.tab .cp{opacity:0;font-size:11px}
.tab:hover .x,.tab:hover .cp{opacity:.45}
.tab .x:hover{opacity:1;color:var(--bad)}
.tab .cp:hover{opacity:1;color:var(--acc)}
.tab .daypip{font-size:9px;color:var(--dim2);letter-spacing:.06em}
.hbtns{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.btn{
  padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  font-family:var(--f1);font-size:12px;letter-spacing:.04em;color:var(--txt);white-space:nowrap;
  transition:border-color .12s,background .12s,color .12s;
}
.btn:hover{border-color:var(--line2);background:var(--panel2)}
.btn.acc{border-color:var(--acc-d);color:var(--acc)}
.btn.acc:hover{border-color:var(--acc);background:#0f2028}
.btn.sm{padding:3px 7px;font-size:11px;border-radius:5px}
.btn .bad{color:var(--bad)}
main{display:flex;flex:1;min-height:0}

/* ---------- bin ---------- */
#bin{
  width:238px;flex:0 0 auto;border-right:1px solid var(--line);background:rgba(12,17,24,.6);
  display:flex;flex-direction:column;min-height:0;
}
.bin-head{padding:10px 11px 8px;border-bottom:1px solid var(--line)}
.bin-head h2{font-family:var(--f1);font-size:11px;letter-spacing:.16em;color:var(--dim);font-weight:600;text-transform:uppercase;margin-bottom:3px}
.bin-head p{font-size:10.5px;color:var(--dim2);line-height:1.4;margin-bottom:8px}
#search{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#0a1018;font-size:12px;outline:none}
#search:focus{border-color:var(--acc-d)}
#binlist{flex:1;overflow-y:auto;padding:9px}
.cat{font-family:var(--f1);font-size:10px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase;margin:11px 0 6px;padding-left:2px}
.cat:first-child{margin-top:0}
.chip{
  position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:4px;
  border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;background:var(--panel);
  cursor:grab;touch-action:none;user-select:none;
}
.chip:hover{background:var(--panel2);border-color:var(--line2);border-left-color:var(--c)}
.chip .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .mn{font-family:var(--f1);font-size:10.5px;color:var(--dim2)}
.chip .eg{font-size:9px;color:var(--dim2)}
.chip .del{opacity:0;font-size:11px;color:var(--dim2);padding:0 2px}
.chip:hover .del{opacity:.6}
.chip .del:hover{color:var(--bad);opacity:1}
.chip.tpl{border-left-color:var(--acc);background:#0c1a20}
.bin-foot{padding:9px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#newform{display:none;flex-direction:column;gap:6px}
#newform.on{display:flex}
#newform input,#newform select{padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#0a1018;outline:none;font-size:12px}
#newform input:focus{border-color:var(--acc-d)}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.sw{width:18px;height:18px;border-radius:5px;border:2px solid transparent}
.sw.on{border-color:#fff}

/* ---------- board ---------- */
#board{flex:1;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:12px;min-width:0;align-items:flex-start}
#board.hide,#week.hide{display:none}
.lane{
  flex:0 0 264px;display:flex;flex-direction:column;max-height:100%;min-height:0;
  border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,rgba(19,27,38,.75),rgba(11,16,23,.55));
}
.lane.focus{border-color:#2f4a5c}
.lane.dragging{opacity:.65;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.lane-grip{color:var(--dim2);font-size:12px;cursor:grab;padding:0 2px;touch-action:none;opacity:.35}
.lane:hover .lane-grip{opacity:1}
.lane-arr{color:var(--dim2);font-size:9px;padding:2px 3px;opacity:0}
.lane:hover .lane-arr{opacity:.6}
.lane-arr:hover{color:var(--acc);opacity:1}
.bin-target{
  display:flex;align-items:center;gap:6px;width:100%;margin-top:7px;padding:5px 8px;border:1px solid var(--line);
  border-radius:6px;background:#0a1018;font-size:11.5px;color:var(--dim);
}
.bin-target:hover{border-color:var(--acc-d);color:var(--txt)}
.bin-target b{color:var(--acc);font-family:var(--f1);font-weight:600;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane.over{border-color:var(--acc-d);box-shadow:0 0 0 1px var(--acc-d)}
.lane-head{padding:9px 10px 8px;border-bottom:1px solid var(--line)}
.lane-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.lane-name{
  flex:1;background:none;border:1px solid transparent;border-radius:5px;padding:2px 5px;
  font-family:var(--f1);font-size:13.5px;font-weight:600;letter-spacing:.05em;outline:none;min-width:0;
}
.lane-name:hover{border-color:var(--line)}
.lane-name:focus{border-color:var(--acc-d);background:#0a1018}
.lane-x{color:var(--dim2);font-size:12px;padding:2px 4px;opacity:0}
.lane:hover .lane-x{opacity:.55}
.lane-x:hover{color:var(--bad);opacity:1}
.lane-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.lane-row input[type=time]{
  background:#0a1018;border:1px solid var(--line);border-radius:5px;padding:2px 5px;
  font-family:var(--f1);font-size:11.5px;color:var(--acc);outline:none;
}
.lane-row input[type=time]:focus{border-color:var(--acc-d)}
.lane-row .end{font-family:var(--f1);color:var(--txt)}
.lane-meta{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap;font-size:10.5px;color:var(--dim2);font-family:var(--f1);letter-spacing:.04em}
.lane-meta .tag{padding:1px 5px;border:1px solid var(--line);border-radius:4px}
.lane-meta .tag.over{border-color:#4d1f28;color:var(--bad)}
.lane-meta .tag.ok{border-color:#20402f;color:var(--good)}
.lane-meta .tag.warn{border-color:#4d3616;color:var(--warn)}
.bars{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.prog{height:3px;border-radius:2px;background:#0a1018;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2a7f7f,var(--good));transition:width .25s}
.loadbar{display:flex;height:5px;gap:1px;border-radius:3px;overflow:hidden;background:#0a1018}
.loadbar i{display:block;height:100%}
.lane-tools{display:flex;gap:4px;margin-top:8px}
.lane-tools .btn{flex:1;text-align:center;padding:3px 0;font-size:10.5px;letter-spacing:.05em}
.lane-tools .hov{opacity:.25;transition:opacity .12s}
.lane:hover .lane-tools .hov{opacity:1}
.lane-body{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px;min-height:74px}
.lane-empty{border:1px dashed var(--line2);border-radius:8px;padding:14px 8px;text-align:center;color:var(--dim2);font-size:11.5px;line-height:1.5}
.lane-add{margin:0 9px 9px;padding:5px;border:1px dashed var(--line);border-radius:7px;color:var(--dim2);font-family:var(--f1);font-size:11px;letter-spacing:.06em}
.lane-add:hover{border-color:var(--acc-d);color:var(--acc)}
#addlane{flex:0 0 44px;align-self:stretch;border:1px dashed var(--line);border-radius:11px;color:var(--dim2);font-family:var(--f1);font-size:16px}
#addlane:hover{border-color:var(--acc-d);color:var(--acc)}

/* ---------- block ---------- */
.brick{
  position:relative;border-radius:8px;padding:8px 9px 10px;flex:0 0 auto;
  display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,#0d141c),color-mix(in srgb,var(--c) 13%,#0a1018));
  border:1px solid color-mix(in srgb,var(--c) 40%,#0d141c);
  border-top:1px solid color-mix(in srgb,var(--c) 62%,#0d141c);
  box-shadow:0 2px 0 color-mix(in srgb,var(--c) 22%,#05080c), 0 4px 12px rgba(0,0,0,.35);
  cursor:grab;touch-action:none;user-select:none;
}
.brick.pinned{box-shadow:0 0 0 1px var(--acc) inset,0 2px 0 color-mix(in srgb,var(--c) 22%,#05080c)}
.brick.done{opacity:.42;filter:saturate(.4)}
.brick.hid{opacity:.3;filter:grayscale(.7);border-style:dashed}
.brick.sel{box-shadow:0 0 0 2px var(--acc),0 4px 14px rgba(0,0,0,.4)}
.brick.ongoing{border-left:3px dashed color-mix(in srgb,var(--c) 75%,#0d141c)}
.b-cover{
  position:absolute;left:-1px;right:-1px;top:100%;pointer-events:none;border-radius:0 0 8px 8px;
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 13%,transparent) 0 7px,transparent 7px 14px);
  border:1px dashed color-mix(in srgb,var(--c) 32%,transparent);border-top:0;
}
.b-cover b{position:absolute;bottom:3px;right:6px;font-family:var(--f1);font-size:8.5px;color:color-mix(in srgb,var(--c) 70%,#fff);opacity:.75}
.brick.hid .b-name{text-decoration:line-through;text-decoration-style:dotted}
.b-link{font-family:var(--f1);font-size:9px;color:var(--dim2);opacity:.75}
.brick.done .b-name{text-decoration:line-through;text-decoration-color:var(--dim2)}
.brick.broke{border-color:#7a3040}
.brick.celebrate{animation:cel .5s ease}
@keyframes cel{0%{box-shadow:0 0 0 0 var(--good)}50%{box-shadow:0 0 0 3px rgba(110,231,168,.5)}100%{box-shadow:0 0 0 0 transparent}}
.b-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap;row-gap:2px;min-height:15px}
.b-time{
  font-family:var(--f1);font-size:10.5px;letter-spacing:.04em;color:color-mix(in srgb,var(--c) 80%,#fff);
  border-radius:4px;padding:1px 4px;margin-left:-4px;cursor:text;white-space:nowrap;
}
.b-time:hover{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--line2)}
.b-time.anc{color:var(--acc);box-shadow:0 0 0 1px var(--acc-d)}
.b-time.clash{color:var(--bad);box-shadow:0 0 0 1px #4d1f28}
.b-dash{font-family:var(--f1);font-size:10.5px;color:var(--dim2);margin:0 -2px}
.b-timein{background:#060a0e;border:1px solid var(--acc-d);border-radius:4px;color:var(--acc);font-family:var(--f1);font-size:10.5px;padding:1px 3px;outline:none;width:92px}
.b-flag{font-family:var(--f1);font-size:9px;color:var(--dim2);border:1px solid var(--line);border-radius:3px;padding:0 3px;white-space:nowrap}
.b-flag.bad{color:var(--bad);border-color:#4d1f28}
.b-sp{flex:1}
.b-dur{font-family:var(--f1);font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:3px}
.b-dur button{color:var(--dim2);padding:0 3px;font-size:12px;line-height:1;opacity:.3;transition:opacity .12s}
.brick:hover .b-dur button{opacity:1}
.b-dur button:hover{color:var(--acc)}
.b-dur b{min-width:30px;text-align:center;color:var(--txt);font-weight:500;border-radius:3px;cursor:text}
.b-dur b:hover{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--line2)}
.b-durin{background:#060a0e;border:1px solid var(--acc-d);border-radius:4px;color:var(--acc);font-family:var(--f1);font-size:10.5px;padding:0 2px;outline:none;width:40px;text-align:center}
.b-main{display:flex;align-items:flex-start;gap:7px}
.b-check{
  flex:0 0 auto;width:16px;height:16px;margin-top:1px;border-radius:5px;border:1.5px solid color-mix(in srgb,var(--c) 55%,#33414f);
  background:rgba(0,0,0,.28);font-size:10px;line-height:1;color:transparent;display:flex;align-items:center;justify-content:center;
}
.b-check:hover{border-color:var(--good);color:rgba(110,231,168,.35)}
.b-check.on{background:var(--good);border-color:var(--good);color:#05130c;font-weight:700}
.b-txt{flex:1;min-width:0}
.b-name{font-size:12.5px;line-height:1.28;outline:none;border-radius:4px;padding:1px 2px;margin-left:-2px;word-break:break-word;cursor:text}
.b-name:focus{background:#060a0e;box-shadow:0 0 0 1px var(--acc-d)}
.b-note{font-size:10.5px;color:var(--dim);line-height:1.34;outline:none;padding:1px 2px;margin-left:-2px;border-radius:4px;cursor:text}
.b-note:focus{background:#060a0e;box-shadow:0 0 0 1px var(--acc-d)}
.b-note:empty:before{content:'note…';color:var(--dim2);opacity:.4}
.b-foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:5px}
.b-days{display:flex;gap:2px}
.b-days b{
  width:13px;height:13px;border-radius:3px;font-family:var(--f1);font-size:8.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;background:#0a1018;color:var(--dim2);
  border:1px solid var(--line);cursor:pointer;
}
.b-days b.on{background:color-mix(in srgb,var(--c) 42%,#0a1018);color:#fff;border-color:transparent}
.b-dayex{
  font-family:var(--f1);font-size:9px;letter-spacing:.06em;color:var(--warn);
  border:1px solid #4d3616;background:#241a09;border-radius:3px;padding:1px 4px;
}
.b-dayex:hover{border-color:var(--warn)}
.lane-untimed{font-family:var(--f1);font-size:11.5px;color:var(--dim2);border:1px dashed var(--line);border-radius:5px;padding:2px 7px}
.lane-untimed:hover{border-color:var(--acc-d);color:var(--acc)}
.lane-days{font-family:var(--f1);font-size:10.5px;color:var(--dim2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.lane-days:hover{border-color:var(--acc-d);color:var(--acc)}
.b-ctl{margin-left:auto;display:flex;gap:2px;align-items:center}
.b-ctl button{color:var(--dim2);font-size:10.5px;padding:1px 3px;border-radius:4px}
.b-ctl button:hover{color:var(--txt);background:#0007}
.b-ctl button.on{color:var(--acc)}
.b-ctl .hov{opacity:0;transition:opacity .12s}
.brick:hover .b-ctl .hov{opacity:1}
.b-badge{font-family:var(--f1);font-size:8.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:3px;padding:1px 3px;color:var(--dim2);line-height:1.1}
.b-badge.dim{opacity:0;transition:opacity .12s}
.brick:hover .b-badge.dim{opacity:.55}
.b-badge.p1{color:#ff8a9c;border-color:#5a2430;background:#2a0f16}
.b-badge.p2{color:var(--warn);border-color:#4d3616;background:#241a09}
.b-badge.p3{color:#7fb8ff;border-color:#1d3450;background:#0d1a2b}
.b-badge.e1{color:#8fd9b6;border-color:#20402f}
.b-badge.e2{color:var(--warn);border-color:#4d3616}
.b-badge.e3{color:#ff8a9c;border-color:#5a2430;background:#2a0f16}
.b-grip{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.b-grip:hover{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c) 45%,transparent))}
/* --- compact row for the one-minute stuff --- */
.brick.mini{flex-direction:row;align-items:center;gap:8px;padding:5px 9px 5px 9px;min-height:0!important}
.brick.mini .b-main{flex:1;min-width:0;align-items:center;gap:7px}
.brick.mini .b-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brick.mini .b-mtime{font-family:var(--f1);font-size:10px;color:color-mix(in srgb,var(--c) 80%,#fff);white-space:nowrap;border-radius:4px;padding:1px 4px;cursor:text}
.brick.mini .b-mtime:hover{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--line2)}
.brick.mini .b-mtime.anc{color:var(--acc)}
.brick.mini .b-mdays{font-family:var(--f1);font-size:9px;color:var(--dim2);white-space:nowrap}
.brick.mini .b-foot{
  position:absolute;top:0;right:0;bottom:0;margin:0;padding:0 8px 0 26px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 17%,#0a1017) 32%);
  opacity:0;transition:opacity .12s;
}
.brick.mini:hover .b-foot{opacity:1}
.brick.mini .b-days,.brick.mini .b-grip{display:none}
.brick.mini .b-ctl .hov{opacity:1}
/* the now line floats OVER the blocks, at the real position inside the current one */
.lane-body{position:relative}
.nowline{
  position:absolute;left:4px;right:4px;z-index:5;pointer-events:none;
  display:flex;align-items:center;gap:5px;transform:translateY(-50%);
}
.nowline i{flex:1;height:2px;background:linear-gradient(90deg,#ff3b5c,rgba(255,59,92,.3));border-radius:2px;box-shadow:0 0 8px rgba(255,59,92,.55)}
.nowline b{
  font-family:var(--f1);font-size:8.5px;letter-spacing:.08em;color:#fff;font-weight:600;
  background:#ff3b5c;border-radius:3px;padding:1px 4px;box-shadow:0 2px 6px rgba(0,0,0,.45);
}
.nowline em{width:7px;height:7px;border-radius:50%;background:#ff3b5c;flex:0 0 auto;box-shadow:0 0 8px #ff3b5c}
.brick.past{opacity:.5}
.brick.past.done{opacity:.3}
/* proportional mode — an hour looks like an hour; tiny blocks stay legible slivers */
.lane-body.prop{gap:4px;overflow:hidden}
.lane-body.prop .brick{padding:4px 8px;gap:0;overflow:hidden}
.lane-body.prop .brick.squeezed{flex-direction:row;align-items:center;gap:6px;padding:2px 8px}
.lane-body.prop .brick.squeezed .b-top,.lane-body.prop .brick.squeezed .b-foot,
.lane-body.prop .brick.squeezed .b-note,.lane-body.prop .brick.squeezed .b-grip{display:none}

.placeholder{flex:0 0 auto;border:1px dashed var(--acc);border-radius:8px;background:#0d2028;opacity:.7}

/* ---------- week ---------- */

.hrow.half .hbar i{background:var(--warn)}

.hrow .hn{font-family:var(--f1);font-size:10.5px;color:var(--dim2);width:44px;text-align:right;flex:0 0 auto}
.adv .dim{color:var(--dim)}
.advbtns{display:flex;gap:6px;margin-top:8px}
.prisec h4{font-family:var(--f1);font-size:12px;letter-spacing:.12em;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.prisec h4 span{font-size:10px;color:var(--dim2);letter-spacing:.05em}
.prisec h4.pri1{color:#ff8a9c}.prisec h4.pri2{color:var(--warn)}.prisec h4.pri3{color:#7fb8ff}.prisec h4.pri0{color:var(--dim2)}
.prirow{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-left:3px solid var(--c);
  border-radius:7px;background:var(--panel);margin-bottom:5px;cursor:pointer;
}

.prirow.isdone .pn{text-decoration:line-through;color:var(--dim2)}
.wbnote{font-family:var(--f1);font-size:10.5px;color:var(--dim2);letter-spacing:.05em}
.day-ck{
  flex:0 0 auto;width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line2);background:rgba(0,0,0,.3);
  font-size:8px;line-height:1;color:transparent;display:flex;align-items:center;justify-content:center;
}
.day-ck:hover{border-color:var(--good)}
.day-ck.on{background:var(--good);border-color:var(--good);color:#05130c;font-weight:700}
.day-b.isdone span{text-decoration:line-through;color:var(--dim2)}
.day{border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,rgba(19,27,38,.75),rgba(11,16,23,.55));display:flex;flex-direction:column;min-height:220px}
.day.today{border-color:var(--acc-d);box-shadow:0 0 0 1px var(--acc-d)}
.day.wpast{opacity:.72}

.day-head{padding:9px 10px;border-bottom:1px solid var(--line)}
.day-head h3{font-family:var(--f1);font-size:13px;letter-spacing:.09em;display:flex;align-items:center;gap:6px}

.rule{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-size:12px}

#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:900;background:var(--panel2);border:1px solid var(--acc-d);color:var(--acc);border-radius:8px;padding:8px 15px;font-family:var(--f1);font-size:12px;letter-spacing:.05em;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:70vw;text-align:center}

<script>
/* ══════════════════════════ LIFEOS KERNEL v1 ══════════════════════════
   The shared brain. This block is IDENTICAL in every LifeOS app — edit the
   copy in lifeos.html and re-paste it between the sentinels in the others.

   Two modes, decided at load:
     • hosted   — the app is in an iframe inside lifeos.html. Every mutation is
                  proxied to the shell over postMessage, so the shell is the
                  single writer and nothing races. Works on file:// too, where
                  frames cannot touch each other's DOM but postMessage still flows.
     • solo     — the app was opened on its own. It owns localStorage 'lifeos_v1'
                  directly and gossips over BroadcastChannel to other tabs.
   Either way the app calls the same API and never knows which one it got.

   The shared doc is small and is broadcast whole — no diffing, no versions to
   reconcile. Apps keep their own private state (block_v1, arc's IDB, …) exactly
   as before; only what MUST be shared lives here.                          */
window.LifeOS = (function () {
  const KEY = 'lifeos_v1';
  const HOSTED = (function () { try { return !!(window.parent && window.parent !== window); } catch (e) { return false; } })();
  const blank = () => ({ v: 1, ts: 0, activities: {}, habits: {}, log: {}, today: null });

  let doc = blank(), subs = [], waits = {}, seq = 0, bc = null, booted = false, bootQ = [], persistHook = null;

  const pad = n => String(n).padStart(2, '0');
  /** the only date format anything here speaks: YYYY-MM-DD, local time */

    { label: 'Priority', sub: [0, 1, 2, 3].map(k => ({ label: k ? 'P' + k : 'none', fn: () => each(it => it.pri = k) })) },
    { label: 'Colour', sub: PAL.map((c, i) => ({ label: PALNAME[i], fn: () => each(it => { it.color = c; syncKin(it, { color: c }); }) })) },
    { sep: 1 },
    { label: 'Tick them all off', fn: () => { picks.forEach(({ it }) => { if (!it.done) toggleDone(it); }); } },
    { label: 'Compact them', fn: () => each(it => it.compact = true) },
    { label: 'Expand them', fn: () => each(it => it.compact = false) },
    { label: 'Move to routine', sub: LANES().map(L => ({ label: L.name, fn: () => {
        snap();
        picks.forEach(({ it }) => { const f = findItem(it.id); if (f && f.laneId !== L.id) { f.arr.splice(f.i, 1); items(L.id).push(it); } });
        render();
      } })) },
    { sep: 1 },
    { label: 'Delete ' + picks.length + ' blocks', danger: 1, fn: () => {
        snap();
        picks.forEach(({ it }) => { const f = findItem(it.id); if (f) f.arr.splice(f.i, 1); });
        SEL.clear(); render();
      } },
  ]);
}

function renderBin() {
  const q = ($('#search').value || '').toLowerCase().trim();
  const list = $('#binlist'); list.innerHTML = '';
  /* be explicit about where a click lands — it used to be an invisible rule */
  const tgt = focusLaneObj();
  const tb = $('#binTarget');
  if (tb) {
    tb.innerHTML = 'clicks go to <b>' + esc(tgt ? tgt.name : '—') + '</b> ▾';
    tb.onclick = ev => openMenu(ev.clientX, ev.clientY, [{ head: 'Send clicked blocks to' },
      ...LANES().map((L, i) => ({ label: L.name, check: L.id === focusId, fn: () => { focusId = L.id; render(); } }))]);
  }

  if (S.templates.length) {
    const shown = S.templates.filter(t => !q || t.name.toLowerCase().includes(q));
    if (shown.length) {
      list.appendChild(el('div', 'cat', 'Templates'));
      shown.forEach(t => {
        const mins = t.blocks.reduce((a, b) => a + b.dur, 0);
        const c = el('div', 'chip tpl');
        c.innerHTML = '<span class="nm">' + esc(t.name) + '</span><span class="mn">' + t.blocks.length + '×' + '</span>';
        c.dataset.tip = '<b>' + esc(t.name) + '</b> — ' + t.blocks.length + ' blocks, ' + dur2s(mins) + '<br>' +
          t.blocks.slice(0, 6).map(b => '· ' + esc(b.name)).join('<br>') + (t.blocks.length > 6 ? '<br>…' : '') +
          '<br><br><b>click</b> to drop it in, or drag';
        const d = el('button', 'del', '✕');
        d.onclick = e => { e.stopPropagation(); snap(); S.templates = S.templates.filter(x => x.id !== t.id); render(); };
        c.appendChild(d);
        c.addEventListener('pointerdown', e => {
          if (e.target === d || e.button === 2) return;
          startDrag(e, { kind: 'tpl', tpl: t, node: c, onTap: () => applyTemplate(t, focusLaneObj().id) });
        });
        list.appendChild(c);
      });
    }
  }

  const cats = [...new Set(S.lib.map(b => b.cat || 'Custom'))];
  cats.forEach(cat => {
    const blocks = S.lib.filter(b => (b.cat || 'Custom') === cat && (!q || b.name.toLowerCase().includes(q)));
    if (!blocks.length) return;
    list.appendChild(el('div', 'cat', esc(cat)));
    blocks.forEach(b => {
      const c = el('div', 'chip');
      c.style.setProperty('--c', b.color);
      c.innerHTML = '<span class="nm">' + esc(b.name) + '</span><span class="eg">' + EGLYPH[b.energy || 2] + '</span><span class="mn">' + dur2s(b.dur) + '</span>';
      c.dataset.tip = '<b>' + esc(b.name) + '</b> — ' + dur2s(b.dur) + ', ' + ENAME[b.energy || 2] + ' effort<br>click to drop it into <b>' + esc((focusLaneObj() || {}).name || '') + '</b>';
      const d = el('button', 'del', '✕');
      d.onclick = e => { e.stopPropagation(); snap(); S.lib = S.lib.filter(x => x.id !== b.id); render(); };
      c.appendChild(d);
      const drop = () => { const l = focusLaneObj(); if (l) { addItem(l.id, b); toast('<b>' + esc(b.name) + '</b> → ' + esc(l.name) + ' · Ctrl+Z to undo'); } };
      c.addEventListener('pointerdown', e => { if (e.target === d || e.button === 2) return; startDrag(e, { kind: 'lib', src: b, node: c, onTap: drop }); });
      c.addEventListener('contextmenu', ev => {
        ev.preventDefault();
        openMenu(ev.clientX, ev.clientY, [
          { head: b.name },
          { label: 'Add to routine', sub: LANES().map(L => ({ label: L.name, fn: () => { addItem(L.id, b); toast('added to <b>' + esc(L.name) + '</b>'); } })) },
          { sep: 1 },
          { label: 'Rename…', fn: () => { const v = prompt('Name', b.name); if (v) { snap(); b.name = v.trim(); render(); } } },
          { label: 'Set duration…', fn: () => { const v = prompt('Minutes', b.dur); if (v) { snap(); b.dur = clamp(parseInt(v) || b.dur, 1, 1440); render(); } } },
          { label: 'Effort', sub: [1, 2, 3].map(k => ({ label: EGLYPH[k] + ' ' + ENAME[k], check: (b.energy || 2) === k, fn: () => { snap(); b.energy = k; render(); } })) },
          { sep: 1 },
          { label: 'Delete from bin', danger: 1, fn: () => { snap(); S.lib = S.lib.filter(x => x.id !== b.id); render(); } },
        ]);
      });
      list.appendChild(c);
    });
  });
  if (!list.children.length) list.appendChild(el('div', 'cat', 'no matches'));
}
function applyTemplate(t, laneId, idx) {
  snap();
  const arr = items(laneId);
  const made = t.blocks.map(b => mkItem(b));
  arr.splice(idx == null ? arr.length : idx, 0, ...made);
  render(); toast('<b>' + esc(t.name) + '</b> — ' + made.length + ' blocks added');
}

/* ---------- day view ---------- */
function renderBoard() {
  const b = $('#board'); b.innerHTML = '';
  /* finished routines can stay put, slide to the end, or get out of the way entirely */
  const isDoneLane = L => { const a = items(L.id).filter(x => !x.hidden); return a.length > 0 && a.every(x => x.done); };
  let lanes = LANES();
  if (S.doneRoutines === 'right') lanes = lanes.slice().sort((a, b) => (isDoneLane(a) ? 1 : 0) - (isDoneLane(b) ? 1 : 0));
  if (S.doneRoutines === 'hide') {
    const hidden = lanes.filter(isDoneLane);
    lanes = lanes.filter(L => !isDoneLane(L));
    if (hidden.length) {
      const note = el('button', 'donenote', '✓ ' + hidden.length + ' finished routine' + (hidden.length > 1 ? 's' : '') + ' hidden');
      note.dataset.tip = esc(hidden.map(L => L.name).join(', ')) + '<br>Click to show them again';
      note.onclick = () => { S.doneRoutines = 'stay'; render(); };
      b.appendChild(note);
    }
  }
  lanes.forEach((L, li) => {
    const d = el('div', 'lane' + (L.id === focusId ? ' focus' : ''));
    d.dataset.lane = L.id;

    const head = el('div', 'lane-head');
    const top = el('div', 'lane-top');
    /* grab here to slide the whole routine left or right */
    const grip = el('button', 'lane-grip', '⠿');
    grip.dataset.tip = 'Drag to reorder this routine — or use the arrows';
    grip.addEventListener('pointerdown', ev => startLaneDrag(ev, L, d));
    top.appendChild(grip);
    const lt = el('button', 'lane-arr', '◀'); lt.dataset.tip = 'Move left';
    lt.onclick = () => moveLane(L.id, -1);
    const rt = el('button', 'lane-arr', '▶'); rt.dataset.tip = 'Move right';
    rt.onclick = () => moveLane(L.id, 1);
    const nm = el('input', 'lane-name'); nm.value = L.name;
    nm.dataset.tip = 'Rename this routine — it becomes a section in Todoist';
    nm.onchange = () => { snap(); L.name = nm.value.trim() || 'Routine'; render(); };
    nm.onfocus = () => { focusId = L.id; renderBin(); };
    top.appendChild(nm);
    top.appendChild(lt); top.appendChild(rt);
    if (LANES().length > 1) {
      const x = el('button', 'lane-x', '✕');
      x.dataset.tip = 'Take <b>' + esc(L.name) + '</b> off ' + esc(M().name) + '.<br>It keeps running on your other days — right-click the header to delete it everywhere.';
      x.onclick = () => removeLaneFromDay(L.id);
      top.appendChild(x);
    }
    head.appendChild(top);

    const row = el('div', 'lane-row');
    if (L.start == null) {
      const un = el('button', 'lane-untimed', '◷ no set time');
      un.dataset.tip = 'This routine is an ordered list with no clock. Click to give it a start time.';
      un.onclick = () => { snap(); L.start = '09:00'; render(); };
      row.appendChild(un);
    } else {
      const st = el('input'); st.type = 'time'; st.value = L.start;
      st.dataset.tip = 'When this routine starts — everything below flows from here.<br>Right-click for “no set time”.';
      st.onchange = () => { snap(); L.start = st.value || '00:00'; render(); };
      st.oncontextmenu = ev => { ev.preventDefault(); snap(); L.start = null; render(); toast('<b>' + esc(L.name) + '</b> is now untimed'); };
      row.appendChild(st);
      row.appendChild(el('span', null, '→'));
      row.appendChild(el('span', 'end', fmt(laneEnd(L.id))));
    }
    head.appendChild(row);

    const sc = schedule(L.id);
    const meta = el('div', 'lane-meta');
    const nb = sc.length;
    meta.appendChild(el('span', 'tag', nb + (nb === 1 ? ' block' : ' blocks')));
    meta.appendChild(el('span', 'tag', dur2s(laneMins(L.id))));
    if (L.target && L.start != null) {
      const delta = laneEnd(L.id) - hm2min(L.target);
      const t = el('span', 'tag ' + (delta > 0 ? 'over' : 'ok'), (delta > 0 ? '+' : '') + dur2s(Math.abs(delta)) + (delta > 0 ? ' over' : ' spare'));
      t.dataset.tip = 'Target finish is <b>' + fmt(hm2min(L.target)) + '</b>';
      meta.appendChild(t);
    }
    const clashes = sc.filter(r => r.clash > 0).length;
    if (clashes) {
      const c = el('span', 'tag over', '⚠ ' + clashes + ' clash' + (clashes > 1 ? 'es' : ''));
      c.dataset.tip = 'A block runs past an ⚓ anchored start below it';
      meta.appendChild(c);
    }
    /* routines are independent clocks — say so when two of them cover the same wall time */
    const mySpan = L.start == null ? null : [hm2min(L.start), laneEnd(L.id)];
    const bump = !mySpan ? [] : S.lanes.filter(O => O.id !== L.id && O.start != null && items(O.id).length)
      .filter(O => mySpan[0] < laneEnd(O.id) && hm2min(O.start) < mySpan[1]).map(O => O.name);
    if (sc.length && bump.length) {
      const b2 = el('span', 'tag warn', '⚠ overlaps ' + bump[0] + (bump.length > 1 ? ' +' + (bump.length - 1) : ''));
      b2.dataset.tip = 'This routine runs at the same wall-clock time as <b>' + esc(bump.join(', ')) + '</b>';
      meta.appendChild(b2);
    }
    const ld = el('button', 'lane-days', daysShort(L.days || [1, 1, 1, 1, 1, 1, 1]));
    ld.dataset.tip = 'Days this whole routine runs — blocks follow it unless they carry an exception';
    ld.onclick = ev => { ev.stopPropagation(); laneMenu(L, ev.clientX, ev.clientY); };
    meta.appendChild(ld);
    const tg = el('button', 'tag', L.target ? '⏱ ' + L.target : '⏱ target');
    tg.dataset.tip = 'Set a “must be done by” time for this routine';
    tg.onclick = () => { const v = prompt('Target end time (HH:MM), blank to clear', L.target || ''); if (v !== null) { snap(); L.target = v.trim(); render(); } };
    meta.appendChild(tg);
    head.appendChild(meta);

    /* progress + load meters */
    const bars = el('div', 'bars');
    const done = sc.filter(r => r.it.done).length;
    if (nb) {
      const p = el('div', 'prog'); p.dataset.tip = '<b>' + done + ' of ' + nb + '</b> checked off in this routine';
      p.appendChild(el('i')).style.width = (done / nb * 100) + '%';
      bars.appendChild(p);
      const lb = el('div', 'loadbar');
      lb.dataset.tip = 'Effort load <b>' + laneLoad(L.id).toFixed(1) + '</b> — width is time, colour is effort (◔ light / ◑ medium / ● heavy)';
      sc.forEach(({ it }) => { const i = el('i'); i.style.flex = it.dur; i.style.background = ECOL[energyOf(it)]; lb.appendChild(i); });
      bars.appendChild(lb);
      head.appendChild(bars);
      const lm = el('div', 'lane-meta');
      lm.appendChild(el('span', 'tag', 'load ' + laneLoad(L.id).toFixed(1)));
      let run = 0, worst = 0;
      items(L.id).forEach(it => { run = energyOf(it) === 3 ? run + 1 : 0; worst = Math.max(worst, run); });
      if (worst > 1) { const w = el('span', 'tag warn', '⚡ ' + worst + ' heavy in a row'); w.dataset.tip = 'Back-to-back heavy blocks — consider putting something light between them'; lm.appendChild(w); }
      head.appendChild(lm);
    }

    const tools = el('div', 'lane-tools');
    const mk = (label, tip, fn, cls, rc) => {
      const x = el('button', 'btn ' + (cls || ''), label); x.dataset.tip = tip; x.onclick = fn;
      if (rc) x.oncontextmenu = rc;
      tools.appendChild(x);
    };
    mk(L.byPri ? '◧P' : '↓P', L.byPri
      ? 'Showing this routine <b>by priority</b> — times still belong to the real order. Click to go back.'
      : 'Sort by priority — P1 first. Pinned 📌 and anchored ⚓ stay put.<br>Right-click for a view-only version that leaves the order alone.',
      () => sortPri(L.id), '', ev => {
        ev.preventDefault();
        openMenu(ev.clientX, ev.clientY, [{ head: 'Priority in ' + L.name },
          { label: 'Sort them for real', fn: () => sortPri(L.id) },
          { label: 'Just show me by priority', check: !!L.byPri, fn: () => { L.byPri = !L.byPri; render(); } }]);
      });
    mk('⇩ template', 'Save this routine as a reusable template', () => saveTemplate(L.id), 'hov');
    mk('⌫', 'Empty this routine', () => { if (items(L.id).length && confirm('Clear ' + L.name + '?')) { snap(); M().items[L.id] = []; render(); } }, 'hov');
    head.appendChild(tools);
    d.appendChild(head);

    d.addEventListener('contextmenu', ev => { if (ev.target.closest('.brick')) return; ev.preventDefault(); laneMenu(L, ev.clientX, ev.clientY); });

    const body = el('div', 'lane-body'); body.dataset.lane = L.id;
    body.onclick = () => { if (focusId !== L.id) { focusId = L.id; renderBoard(); renderBin(); } };
    if (!sc.length) body.appendChild(el('div', 'lane-empty', 'Drag a block here<br><span style="opacity:.6">or click one in the bin</span>'));
    const nowM = nowMin();
    /* only where the clock actually is: the routine has to cover this minute */
    const covers = L.start != null && sc.length && nowM >= hm2min(L.start) && nowM <= laneEnd(L.id);
    const showNow = S.nowline && L.nowline !== false && covers && !L.byPri;
    /* view-only priority ordering: the clock times stay attached to the real order */
    const view = L.byPri ? sc.slice().sort((a, b) => ((a.it.pri || 9) - (b.it.pri || 9)) || (a.s - b.s)) : sc;
    view.forEach(({ it, s, e, gap, clash, hidden }) => {
      const nd = brickNode(L.id, it, s, e, { gap, clash, ongoing: it.ongoing });
      if (showNow && e != null && e <= nowM && !hidden) nd.classList.add('past');
      body.appendChild(nd);
    });
    /* draw each ongoing block's shadow down over the blocks it overlaps */
    requestAnimationFrame(() => {
      view.forEach(({ it, e }) => {
        if (!it.ongoing || e == null) return;
        const node = body.querySelector('[data-id="' + it.id + '"]');
        if (!node) return;
        const covered = view.filter(r => r.it !== it && r.s != null && r.s >= 0 && r.s < e && view.indexOf(r) > view.findIndex(z => z.it === it));
        let h = 0;
        covered.forEach(r => { const n2 = body.querySelector('[data-id="' + r.it.id + '"]'); if (n2) h += n2.offsetHeight + 8; });
        const old = node.querySelector('.b-cover'); if (old) old.remove();
        if (h > 6) {
          const cov = el('div', 'b-cover', '<b>⟲ while this runs</b>');
          cov.style.height = (h - 8) + 'px';
          node.appendChild(cov);
        }
      });
    });
    /* deferred layout: needs real measured heights, so it runs after paint —
       but stays callable on demand (resize, tests) rather than only inside rAF */
    if (S.proportional) LAYOUT.push({ kind: 'prop', body, view });
    if (showNow) LAYOUT.push({ kind: 'now', body, view, nowM });
    d.appendChild(body);

    const add = el('button', 'lane-add', '+ blank block');
    add.dataset.tip = 'Add an empty block and type your own name';
    add.onclick = () => {
      focusId = L.id;
      const it = addItem(L.id, { name: 'New block', dur: 30, color: PAL[Math.floor(Math.random() * PAL.length)], energy: 2 });
      setTimeout(() => { const n = document.querySelector('[data-id="' + it.id + '"] .b-name'); if (n) { n.focus(); document.getSelection().selectAllChildren(n); } }, 20);
    };
    d.appendChild(add);
    b.appendChild(d);
  });

  const al = el('button', null, '+'); al.id = 'addlane';
  al.dataset.tip = 'Add another routine — <b>Client block</b>, <b>Night shift</b>, anything';
  al.onclick = ev => {
    const off = S.lanes.filter(L => !LANES().some(x => x.id === L.id));
    openMenu(ev.clientX - 150, ev.clientY, [
      { head: 'Add a routine to ' + M().name },
      { label: '+ Build a new routine', fn: () => {
          const n = prompt('Routine name', 'Routine ' + (S.lanes.length + 1)); if (!n) return;
          snap();
          const L = { id: uid(), name: n.trim(), start: '09:00', target: '' };
          S.lanes.push(L);
          S.variants.forEach(v => { v.items[L.id] = []; });
          const v = M(); if (!v.routines) v.routines = S.lanes.map(x => x.id); else v.routines.push(L.id);
          render();
        } },
      ...(off.length ? [{ sep: 1 }, { head: 'Or reuse one from another day' },
        ...off.map(L => ({ label: L.name, k: (items(L.id) || []).length ? '' : 'empty', fn: () => addLaneToDay(L.id) }))] : []),
    ]);
  };
  b.appendChild(al);
  requestAnimationFrame(runLayout);
}
/** drag a routine sideways past its neighbours */
function startLaneDrag(ev, L, node) {
  if (ev.button != null && ev.button !== 0) return;
  ev.preventDefault(); ev.stopPropagation();
  node.classList.add('dragging');
  const move = e => {
    const others = [...document.querySelectorAll('.lane')].filter(n => n !== node);
    for (const o of others) {
      const r = o.getBoundingClientRect();
      if (e.clientX > r.left && e.clientX < r.right) {
        const v = M();
        if (!v.routines) v.routines = S.lanes.map(x => x.id);
        const from = v.routines.indexOf(L.id);
        const to = v.routines.indexOf(o.dataset.lane);
        if (from > -1 && to > -1 && from !== to) {
          snap();
          const [x] = v.routines.splice(from, 1); v.routines.splice(to, 0, x);
          focusId = L.id; renderBoard();
          const again = document.querySelector('[data-lane="' + L.id + '"]');
          if (again) again.classList.add('dragging');
        }
        break;
      }
    }
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    document.querySelectorAll('.lane.dragging').forEach(n => n.classList.remove('dragging'));
    render();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up, { once: true });
}
/** take a routine out of THIS day, leaving it intact everywhere else */
function removeLaneFromDay(id) {
  const v = M();
  if (!v.routines) v.routines = S.lanes.map(l => l.id);
  if (v.routines.length < 2) return toast('a day needs at least one routine');
  snap();
  v.routines = v.routines.filter(x => x !== id);
  focusId = null; render();
  toast('<b>' + esc(lane(id).name) + '</b> is off ' + esc(v.name) + ' — its blocks are kept, and it still runs on your other days');
}
function addLaneToDay(id) {
  const v = M();
  if (!v.routines) v.routines = S.lanes.map(l => l.id);
  if (!v.routines.includes(id)) { snap(); v.routines.push(id); render(); }
}
/** order is a per-day thing, so reordering here never disturbs your other days */
function moveLane(id, dir) {
  const v = M();
  if (!v.routines) v.routines = S.lanes.map(l => l.id);
  const i = v.routines.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= v.routines.length) return toast('already at the end');
  snap();
  const [x] = v.routines.splice(i, 1); v.routines.splice(j, 0, x);
  focusId = id; render();
}
/**
 * Which weekdays a block actually runs: the routine decides, and a block only
 * overrides it if you set an exception (right-click → Days).
 */
function effDays(L, it) {
  if (it.daysEx) return it.days.slice();          /* an exception overrules the routine outright */
  return ((L && L.days) || [1, 1, 1, 1, 1, 1, 1]).slice();
}

/* ---------- right-click: routine ---------- */
function laneMenu(L, x, y) {

  openMenu(x, y, [
    { head: L.name },

    { label: 'Sort by priority', k: '↓P', fn: () => sortPri(L.id) },
    { label: 'Save as template', k: '⇩', fn: () => saveTemplate(L.id) },
    { sep: 1 },
    { label: 'Set start time…', fn: () => promptTime('Routine starts at (HH:MM)', L.start || '', v => { snap(); L.start = v || '00:00'; render(); }) },
    { label: 'No set time', check: L.start == null, fn: () => { snap(); L.start = L.start == null ? '09:00' : null; render(); } },
    { label: 'Show the now line here', check: L.nowline !== false, fn: () => { L.nowline = L.nowline === false; render(); } },
    { label: 'Set target finish…', fn: () => promptTime('Must be done by (HH:MM)', L.target || '', v => { snap(); L.target = v; render(); }) },
    { label: 'Rename routine…', fn: () => { const v = prompt('Routine name', L.name); if (v) { snap(); L.name = v.trim(); render(); } } },
    { label: 'Days this routine runs', sub: () => {
        const cur = L.days || [1, 1, 1, 1, 1, 1, 1];
        const set = arr => { snap(); L.days = arr; render(); };
        return [

/* ---------- deferred, measurement-dependent layout ---------- */
const LAYOUT = [];
function runLayout() {
  const jobs = LAYOUT.splice(0);
  jobs.forEach(j => {
    if (!j.body.isConnected) return;
    if (j.kind === 'prop') {
      const rows = j.view.filter(r => !r.hidden && r.s != null);
      const total = rows.reduce((a, r) => a + Math.max(1, r.it.dur), 0);
      if (!total) return;
      const avail = j.body.clientHeight - 10 - (rows.length - 1) * 4;
      if (avail < 40) return;
      const per = avail / total;
      j.body.classList.add('prop');
      rows.forEach(r => {
        const nd = j.body.querySelector('[data-id="' + r.it.id + '"]');
        if (!nd) return;
        const h = Math.max(r.it.dur <= 5 ? 13 : 18, r.it.dur * per);
        nd.style.minHeight = '0'; nd.style.height = h + 'px';
        nd.classList.toggle('squeezed', h < 46);
      });
    }
    if (j.kind === 'now') {
      let top = null;
      for (const r of j.view) {
        if (r.hidden || r.s == null) continue;
        const nd = j.body.querySelector('[data-id="' + r.it.id + '"]');
        if (!nd) continue;
        if (j.nowM >= r.s && j.nowM < r.e) { top = nd.offsetTop + (j.nowM - r.s) / Math.max(1, r.e - r.s) * nd.offsetHeight; break; }
        if (j.nowM < r.s) { top = Math.max(3, nd.offsetTop - 4); break; }
      }
      if (top == null) return;
      const line = nowLine(j.nowM);
      line.style.top = top + 'px';
      j.body.appendChild(line);
    }
  });
}
function nowLine(m) {
  const n = el('div', 'nowline', '<em></em><b>NOW ' + fmt(m) + '</b><i></i>');
  n.dataset.tip = 'Where you are in the day. Turn it off in ⚙, or per routine with right-click.';
  return n;
}
/* ---------- sounds ----------
 * Synthesised, no files. A tick should feel like a small physical click with a
 * pitch that RISES as you get closer to finishing (that rise is most of the
 * satisfaction); finishing the day gets a proper little fanfare.
 */
const THEMES = {
  soft:    { name: 'Soft', wave: 'sine',     tick: [1, 2.01], decay: .17, bright: .55 },
  marimba: { name: 'Marimba', wave: 'sine',  tick: [1, 4.02, 6.5], decay: .3, bright: .5 },
  arcade:  { name: 'Arcade', wave: 'square', tick: [1, 1.5], decay: .1, bright: .3 },
  bell:    { name: 'Bell', wave: 'triangle', tick: [1, 2.76, 5.4], decay: .45, bright: .42 },
};
let AC;
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();      /* browsers park it until you interact */
  return AC;
}
function tone(f, t, dur, vol, wave) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave || 'sine'; o.frequency.setValueAtTime(f, AC.currentTime + t);
  g.gain.setValueAtTime(0.0001, AC.currentTime + t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), AC.currentTime + t + .008);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(AC.currentTime + t); o.stop(AC.currentTime + t + dur + .02);
}
/** how far through today's list we are — drives the rising pitch */
function progressRatio() {
  try {
    const td = todaysBlocks(routineForToday());
    if (!td.length) return 0;
    return td.filter(b => b.done).length / td.length;
  } catch (e) { return 0; }
}
function beep(kind) {
  if (!S.sound || S.soundTheme === 'off') return;
  const T = THEMES[S.soundTheme] || THEMES.soft;
  const vol = (S.volume == null ? 0.6 : S.volume) * 0.16;
  if (vol <= 0) return;
  try {
    audio();
    if (kind === 'untick') { tone(240, 0, .12, vol * .45, T.wave); return; }
    if (kind === 'done') {
      /* pentatonic step up the list: C D E G A C — never a sour note, always "one more" */
      const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
      const base = scale[Math.min(scale.length - 1, Math.round(progressRatio() * (scale.length - 1)))];
      T.tick.forEach((mult, i) => tone(base * mult, i * .012, T.decay * (i ? T.bright : 1), vol / (i + 1.4), T.wave));
      return;
    }
    if (kind === 'complete') {
      const chord = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      chord.forEach((f, i) => {
        T.tick.forEach((mult, j) => tone(f * mult, i * .085 + j * .012, (T.decay + .35) / (j + 1), vol / (j + 1.3), T.wave));
      });
      tone(1567.98, .5, .7, vol * .5, T.wave);      /* the little sparkle on top */
      return;
    }
    tone(440, 0, .12, vol, T.wave);
  } catch (e) {}
}

    { label: 'Duplicate', fn: () => { const f = findItem(it.id); snap(); f.arr.splice(f.i + 1, 0, Object.assign({}, it, { id: uid(), days: it.days.slice(), at: null, done: false })); render(); } },

function editTime(chip, it, s) {

}
/** setting the finish time is just duration arithmetic — end before start means it runs past midnight */
function editEnd(node, it, s) {
  popEdit(node, {
    title: 'Finish time', value: hhmm(s + it.dur),
    note: 'Starts ' + fmt(s) + ' — the duration adjusts to match.',
    onSet: v => {
      if (!v) return;
      let d = hm2min(v) - (((s % 1440) + 1440) % 1440);
      if (d <= 0) d += 1440;
      if (d !== it.dur) { snap(); it.dur = clamp(d, 1, 1440); syncKin(it, { dur: it.dur }); }
      render();
    },
  });
}
function editDur(node, it) {
  popEdit(node, {
    title: 'Minutes', type: 'number', value: it.dur, min: 1, max: 1440,
    onSet: v => { const n = clamp(Math.round(parseInt(v) || it.dur), 1, 1440); if (n !== it.dur) { snap(); it.dur = n; syncKin(it, { dur: n }); } render(); },
  });
}

          off.forEach(it => { if (!it.daysEx) { it.days = [1,1,1,1,1,1,1]; it.daysEx = true; } it.days[d] = 1; });

/* ---------- summary: what the record says about your routine ---------- */
function renderSum() {
  const p = $('#sum'); p.innerHTML = '';
  const stats = blockStats();
  const days = Object.keys(S.log || {}).sort();
  const st = streak();

  const bar = el('div', 'weekbar');
  bar.appendChild(el('span', 'wbnote', days.length ? days.length + ' days recorded' : 'no history yet — tick some blocks off'));
  const wipe = el('button', 'btn sm', 'Clear history');

  bar.appendChild(wipe);
  p.appendChild(bar);

  const cards = el('div', 'sumcards');
  const last14 = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); last14.push(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())); }
  const rates = last14.map(k => { const e = (S.log || {})[k]; return e && e.t.length ? e.d.length / e.t.length : null; });
  const avg = rates.filter(r => r != null);
  const card = (big, label, tip) => { const c = el('div', 'sumcard'); c.innerHTML = '<b>' + big + '</b><span>' + label + '</span>'; if (tip) c.dataset.tip = tip; return c; };
  cards.appendChild(card(st + (st === 1 ? ' day' : ' days'), 'current streak', 'Days in a row where everything scheduled got ticked'));
  cards.appendChild(card(avg.length ? Math.round(avg.reduce((a, b) => a + b, 0) / avg.length * 100) + '%' : '—', 'finished, last 14 days'));
  cards.appendChild(card(stats.length ? stats.filter(s => s.rate >= .8 && s.seen >= 3).length : 0, 'blocks you reliably do', 'Done 80%+ of the times they came up'));
  p.appendChild(cards);

  const spark = el('div', 'spark');
  last14.forEach((k, i) => {
    const r = rates[i];
    const b = el('i'); b.style.height = (r == null ? 3 : Math.max(4, r * 46)) + 'px';
    b.style.background = r == null ? '#1b2430' : r >= 1 ? 'var(--good)' : r >= .5 ? 'var(--warn)' : 'var(--bad)';
    b.dataset.tip = k + (r == null ? ' — nothing recorded' : ' — ' + Math.round(r * 100) + '% finished');
    spark.appendChild(b);
  });
  p.appendChild(el('h4', 'sumh', 'Last 14 days'));
  p.appendChild(spark);

  /* the point of all this: name the blocks that keep not happening */
  const chronic = stats.filter(s => s.seen >= 4 && s.rate < .5);
  const solid = stats.filter(s => s.seen >= 3 && s.rate >= .8);
  p.appendChild(el('h4', 'sumh', 'What the record says'));
  const advice = el('div', 'advice');
  if (!days.length) {
    advice.appendChild(el('div', 'adv', 'Tick a few days off and this fills in. Two weeks is enough to see a pattern; one bad day is never a pattern.'));
  } else if (!chronic.length) {
    /* competence + autonomy, not praise for its own sake: name the specific thing that worked */
    const best = solid[solid.length - 1];
    advice.appendChild(el('div', 'adv good',
      '<b>Everything here is holding.</b> <span class="dim">Nothing is slipping often enough to be a pattern' +
      (best ? ', and <b>' + esc(best.n) + '</b> is running at ' + Math.round(best.rate * 100) + '%' : '') +
      '. That usually means the plan is sized to your actual day rather than your ideal one — which is the hard part, and it is done. ' +
      'This is the moment a routine can take on one more thing without breaking: if you want to add something, add it now, keep it small, and anchor it to a block that is already reliable.</span>'));
  } else {
    advice.appendChild(el('div', 'adv note',
      '<b>' + chronic.length + (chronic.length > 1 ? ' blocks are' : ' block is') + ' not sticking.</b> ' +
      '<span class="dim">Worth saying plainly: this is information about the <i>plan</i>, not about you. A block that keeps getting skipped is usually mis-sized, ' +
      'mis-placed, or missing a cue — and self-blame reliably makes the next attempt <i>less</i> likely, not more. Shrink it until it is almost too easy, ' +
      'attach it to something you already do without thinking, and let the size grow back on its own.</span>'));
  }
  chronic.forEach(s => {
    const pct = Math.round(s.rate * 100);
    const found = S.variants.flatMap(v => withVariant(v.id, () => LANES(v.id).flatMap(l => items(l.id).filter(i => i.name === s.n && (!s.where || l.name === s.where)).map(i => ({ v, l, i })))))[0];
    const anchor = found ? withVariant(found.v.id, () => {
      const sc = schedule(found.l.id).filter(r => !r.hidden);
      const i = sc.findIndex(r => r.it.id === found.i.id);
      const prev = i > 0 ? sc[i - 1].it : null;
      const st = prev ? stats.find(x => x.n === prev.name && (!x.where || x.where === found.l.name)) : null;
      return (st && st.rate >= .8) ? prev.name : null;
    }) : null;
    const d = el('div', 'adv');
    const why = found && found.i.dur >= 45
      ? 'It is ' + dur2s(found.i.dur) + ' long. Long blocks need a clear runway; short ones survive bad days. Halve it and let it earn the time back.'
      : found && found.i.at
        ? 'It is anchored to ' + found.i.at + '. A fixed time only works if that minute is genuinely free — if it is not, unanchor it and let it flow.'
        : anchor
          ? 'It sits right after <b>' + esc(anchor) + '</b>, which you do ' + Math.round((stats.find(x => x.n === anchor) || { rate: 0 }).rate * 100) + '% of the time. That is a strong cue going unused — make this one small enough that finishing ' + esc(anchor) + ' carries you straight into it.'
          : 'No obvious cue in front of it. Blocks that follow something already automatic stick far better than blocks that rely on remembering.';
    d.innerHTML = '<b>' + esc(s.n) + '</b> — done <b>' + pct + '%</b> of the ' + s.seen + ' times it came up' +
      (found ? ' · ' + esc(found.l.name) + ' · ' + esc(found.v.name) : '') +
      '<br><span class="dim">' + why + '</span>';
    if (found) {
      const row = el('div', 'advbtns');
      const go = el('button', 'btn sm', 'Show me'); go.onclick = () => { S.current = found.v.id; S.view = 'day'; render(); };
      const half = el('button', 'btn sm', 'Halve it'); half.onclick = () => { snap(); found.i.dur = Math.max(1, Math.round(found.i.dur / 2)); syncKin(found.i, { dur: found.i.dur }); render(); toast('<b>' + esc(s.n) + '</b> → ' + dur2s(found.i.dur)); };
      const cut = el('button', 'btn sm', 'Cut it'); cut.onclick = () => { if (confirm('Remove "' + s.n + '" from ' + found.l.name + '?')) { snap(); const f = findItemIn(found.v.id, found.i.id); if (f) f.arr.splice(f.i, 1); render(); } };
      [go, half, cut].forEach(b => row.appendChild(b));
      d.appendChild(row);
    }
    advice.appendChild(d);
  });
  p.appendChild(advice);

  /* ---------- history log ---------- */
  p.appendChild(el('h4', 'sumh', 'History'));
  const log = el('div', 'histlog');
  const keys = Object.keys(S.log || {}).sort().reverse();
  if (!keys.length) log.appendChild(el('div', 'adv', 'Nothing logged yet.'));
  keys.slice(0, 60).forEach(k => {
    const e = S.log[k], rate = e.t.length ? e.d.length / e.t.length : 0;
    const dt = new Date(k + 'T00:00:00');
    const row = el('div', 'hrow' + (rate >= 1 ? ' full' : rate >= .5 ? ' half' : ' low'));
    row.innerHTML =
      '<span class="hd2">' + DSHORT[dt.getDay()] + ' ' + dt.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][dt.getMonth()] + '</span>' +
      '<span class="hbar"><i style="width:' + Math.round(rate * 100) + '%"></i></span>' +
      '<span class="hn">' + e.d.length + '/' + e.t.length + '</span>';
    row.dataset.tip = e.t.length
      ? '<b>Done:</b> ' + (e.d.length ? esc(e.d.join(', ')) : '—') + '<br><b>Missed:</b> ' + (esc(e.t.filter(n => !e.d.includes(n)).join(', ')) || '—')
      : 'nothing scheduled';
    log.appendChild(row);
  });
  p.appendChild(log);
}

/* ============================ drag & drop ============================ */
let drag = null;
function startDrag(ev, cfg) {
  if (ev.button != null && ev.button !== 0) return;
  const rect = cfg.node.getBoundingClientRect();
  drag = { cfg, startX: ev.clientX, startY: ev.clientY, offX: ev.clientX - rect.left, offY: ev.clientY - rect.top, moved: false, ghost: null, ph: null, target: null, idx: 0 };
  ev.preventDefault();
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp, { once: true });
}
function onDragMove(ev) {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.abs(ev.clientX - drag.startX) < 5 && Math.abs(ev.clientY - drag.startY) < 5) return;
    drag.moved = true;
    tipBox.classList.remove('on');
    const c = drag.cfg;
    snap();
    let g, h;
    if (c.kind === 'tpl') {
      drag.payload = c.tpl.blocks.map(b => mkItem(b));
      g = el('div', 'tplghost', '⇩ ' + esc(c.tpl.name) + ' · ' + c.tpl.blocks.length + ' blocks');
      h = 46;
    } else {
      if (c.kind === 'lib') drag.payload = mkItem(c.src);
      else { const f = findItem(c.id); if (!f) return cancelDrag(); drag.payload = f.it; drag.from = f; f.arr.splice(f.i, 1); }
      g = brickNode('ghost', drag.payload, 0, drag.payload.dur, {});
      h = Math.max(brickMin(drag.payload.dur), 68);
    }
    g.id = 'dragghost'; g.style.minHeight = h + 'px';
    document.body.appendChild(g); drag.ghost = g;
    drag.ph = el('div', 'placeholder'); drag.ph.style.height = h + 'px';
    if (c.kind === 'move') renderBoardKeepDrag();
    document.body.style.cursor = 'grabbing';
  }
  drag.ghost.style.left = (ev.clientX - Math.min(drag.offX, 220)) + 'px';
  drag.ghost.style.top = (ev.clientY - drag.offY) + 'px';

  drag.ghost.style.display = 'none';
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  drag.ghost.style.display = '';
  const body = (under && under.closest('.lane-body')) || bodyAt(ev.clientX, ev.clientY);
  document.querySelectorAll('.lane').forEach(l => l.classList.remove('over'));
  if (!body) { if (drag.ph.parentNode) drag.ph.remove(); drag.target = null; return; }
  body.closest('.lane').classList.add('over');
  drag.target = body.dataset.lane;
  const kids = [...body.children].filter(k => k.classList.contains('brick'));
  let idx = kids.length;
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (ev.clientY < r.top + r.height / 2) { idx = i; break; }
  }
  drag.idx = idx;
  const empty = body.querySelector('.lane-empty'); if (empty) empty.remove();
  if (kids[idx]) body.insertBefore(drag.ph, kids[idx]); else body.appendChild(drag.ph);
}
function renderBoardKeepDrag() { const keep = drag; renderBoard(); drag = keep; }
/** geometric fallback so drops near a routine's padding still land */
function bodyAt(x, y) {
  let hit = null;
  document.querySelectorAll('.lane').forEach(l => {
    const r = l.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = l.querySelector('.lane-body');
  });
  return hit;
}
function onDragUp() {
  window.removeEventListener('pointermove', onDragMove);
  document.body.style.cursor = '';
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  if (d.ph && d.ph.parentNode) d.ph.remove();
  /* a click that never became a drag must leave the DOM alone — re-rendering here
     destroyed the node between the two halves of a double-click */
  if (!d.moved) { if (d.cfg.onTap) d.cfg.onTap(); return; }
  if (d.target) {
    const arr = items(d.target);
    if (Array.isArray(d.payload)) arr.splice(d.idx, 0, ...d.payload);
    else arr.splice(d.idx, 0, d.payload);

function cancelDrag() {

window.addEventListener('keydown', e => { if (e.key === 'Escape' && drag) { const d = drag; if (d.from) d.from.arr.splice(d.from.i, 0, d.payload); cancelDrag(); } });

function startResize(ev, it, node) {
  ev.preventDefault(); ev.stopPropagation();

  let last = d0;
  const mv = e => {
    const h = Math.max(30, h0 + (e.clientY - y0));
    const raw = (h - 22) / SCALE;
    const d = raw < 15 ? Math.max(1, Math.round(raw)) : Math.round(raw / 5) * 5;
    if (d !== last) { last = d; node.style.minHeight = brickMin(d) + 'px'; const b = node.querySelector('.b-dur b'); if (b) b.textContent = dur2s(d); }
  };
  const up = () => {
    window.removeEventListener('pointermove', mv);

  window.addEventListener('pointerup', up, { once: true });

/* ============================ exports ============================ */
/** rows for export. Week scope = every routine that owns a weekday, intersected with each block's own days. */
function allRows() {
  const weekly = S.exportScope === 'week' && S.week.some(Boolean);
  const vs = weekly ? S.variants.filter(v => S.week.includes(v.id)) : [M()];
  const out = [];
  vs.forEach(v => withVariant(v.id, () => {
    LANES(v.id).forEach(L => schedule(L.id).filter(r => !r.hidden).forEach(({ it, s, e }) => {
      const ed = effDays(L, it); const days = weekly ? ed.map((d, i) => d && S.week[i] === v.id ? 1 : 0) : ed;
      if (days.some(Boolean)) out.push({ v, lane: L, it, s, e, days, weekly });
    }));
  }));
  return out;
}
const bydays = days => days.map((d, i) => d ? ICSD[i] : null).filter(Boolean);
function daysLabel(days) {
  const on = days.map((d, i) => d ? i : -1).filter(i => i >= 0);
  if (!on.length) return '(no days)';
  if (on.length === 7) return 'every day';
  if (on.length === 5 && on.join() === '1,2,3,4,5') return 'every weekday';
  return 'every ' + on.map(i => TDD[i]).join(', ');
}
function nextDateFor(days, minutes) {
  const now = new Date(); const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const shift = Math.floor(minutes / 1440);
  for (let k = 0; k < 14; k++) {
    const d = new Date(base); d.setDate(base.getDate() + k);
    if (days[d.getDay()]) { d.setDate(d.getDate() + shift); return d; }
  }
  return base;
}
function icsFold(line) { const out = []; let s = line; while (s.length > 73) { out.push(s.slice(0, 73)); s = ' ' + s.slice(73); } out.push(s); return out.join('\r\n'); }
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
const hms = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + pad(m % 60) + '00'; };

function buildICS() {
  const now = new Date();
  const stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + 'Z';
  const rows = allRows();
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BLOCK routine builder//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'X-WR-CALNAME:' + icsEsc(S.calName + (rows[0] && rows[0].weekly ? ' — week' : ' — ' + M().name)), 'X-WR-TIMEZONE:' + S.tz];
  rows.forEach(({ v, lane, it, s, e, days }) => {
    const bd = bydays(days); if (!bd.length) return;
    const d = nextDateFor(days, s);
    const d2 = new Date(d); d2.setDate(d.getDate() + (Math.floor(e / 1440) - Math.floor(s / 1440)));
    L.push('BEGIN:VEVENT');
    L.push('UID:' + it.id + '-' + v.id + '@block');
    L.push('DTSTAMP:' + stamp);
    if (s == null) {                                   /* untimed → an all-day recurring event */
      L.push('DTSTART;VALUE=DATE:' + ymd(d));
      const nd = new Date(d); nd.setDate(d.getDate() + 1);
      L.push('DTEND;VALUE=DATE:' + ymd(nd));
      L.push('RRULE:FREQ=WEEKLY;BYDAY=' + bd.join(','));
      L.push(icsFold('SUMMARY:' + icsEsc((it.pri ? '[P' + it.pri + '] ' : '') + it.name)));
      L.push('TRANSP:TRANSPARENT');
      L.push('END:VEVENT');
      return;
    }
    L.push('DTSTART:' + ymd(d) + 'T' + hms(s));
    L.push('DTEND:' + ymd(d2) + 'T' + hms(e));
    L.push('RRULE:FREQ=WEEKLY;BYDAY=' + bd.join(','));
    L.push(icsFold('SUMMARY:' + icsEsc((it.pri ? '[P' + it.pri + '] ' : '') + it.name)));
    if (it.pri) L.push('PRIORITY:' + [0, 1, 5, 9][it.pri]);
    L.push(icsFold('DESCRIPTION:' + icsEsc((it.note ? it.note + '\n' : '') + lane.name + ' · ' + v.name + ' · ' + dur2s(it.dur) + ' · ' + ENAME[energyOf(it)] + ' effort')));
    L.push(icsFold('CATEGORIES:' + icsEsc(lane.name)));
    L.push('TRANSP:OPAQUE');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function gcalLink(r) {
  const d = nextDateFor(r.days, r.s);
  const d2 = new Date(d); d2.setDate(d.getDate() + (Math.floor(r.e / 1440) - Math.floor(r.s / 1440)));
  const p = new URLSearchParams({
    action: 'TEMPLATE', text: (r.it.pri ? '[P' + r.it.pri + '] ' : '') + r.it.name,
    dates: ymd(d) + 'T' + hms(r.s) + '/' + ymd(d2) + 'T' + hms(r.e),
    details: (r.it.note ? r.it.note + ' — ' : '') + r.lane.name + ' · ' + r.v.name, ctz: S.tz,
  });
  const bd = bydays(r.days);
  return 'https://calendar.google.com/calendar/render?' + p.toString() + (bd.length ? '&recur=' + encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY=' + bd.join(',')) : '');
}
const csvQ = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
const tdPri = it => it.pri ? [0, 4, 3, 2][it.pri] : S.tdPriority;
function buildTodoistCSV() {
  const out = ['TYPE,CONTENT,DESCRIPTION,PRIORITY,INDENT,AUTHOR,RESPONSIBLE,DATE,DATE_LANG,TIMEZONE,DURATION,DURATION_UNIT'];
  const blank = ',,,,,,,,,,,';
  const rows = allRows();
  const sections = [...new Set(rows.map(r => (r.weekly && S.variants.length > 1 ? r.v.name + ' — ' : '') + r.lane.name))];
  sections.forEach(sec => {
    out.push(['section', csvQ(sec), '', '', '', '', '', '', '', '', '', ''].join(','));
    out.push(blank);
    rows.filter(r => ((r.weekly && S.variants.length > 1 ? r.v.name + ' — ' : '') + r.lane.name) === sec).forEach(r => {
      const when = daysLabel(r.days); if (when === '(no days)') return;
      out.push(['task', csvQ(r.it.name), csvQ(r.it.note || ''), tdPri(r.it), 1, '', '', csvQ(when + (r.s == null ? '' : ' at ' + hhmm(r.s))), 'en', csvQ(S.tz), r.it.dur, 'minute'].join(','));
      out.push(blank);
    });
  });
  return out.join('\n');
}
function buildQuickAdd() {
  const out = []; let sec = null;
  allRows().forEach(r => {
    const s = (r.weekly ? r.v.name + ' / ' : '') + r.lane.name;
    if (s !== sec) { sec = s; out.push('', '# ' + s); }
    const when = daysLabel(r.days); if (when === '(no days)') return;
    out.push(r.it.name + ' ' + when + (r.s == null ? '' : ' at ' + hhmm(r.s)) + ' for ' + r.it.dur + 'min #' + S.tdProject.replace(/\s+/g, '')
      + (r.it.pri ? ' p' + r.it.pri : (S.tdPriority > 1 ? ' p' + (5 - S.tdPriority) : '')));
  });
  return out.join('\n').trim();
}
function buildText() {
  const rows = allRows();
  const out = ['# ' + S.calName + (rows[0] && rows[0].weekly ? ' — full week' : ' — ' + M().name), ''];
  let sec = null;
  rows.forEach(r => {
    const s = (r.weekly ? r.v.name + ' / ' : '') + r.lane.name;
    if (s !== sec) { sec = s; out.push('', '## ' + s); }
    out.push('- ' + fmt(r.s) + '–' + fmt(r.e) + '  ' + (r.it.pri ? '[P' + r.it.pri + '] ' : '') + r.it.name + (r.it.at ? ' ⚓' : '')
      + '  (' + dur2s(r.it.dur) + ', ' + EGLYPH[energyOf(r.it)] + ', ' + daysLabel(r.days) + ')' + (r.it.note ? ' — ' + r.it.note : ''));
  });
  return out.join('\n').trim();
}
function download(name, text, mime) {
  const b = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
  toast('downloaded <b>' + esc(name) + '</b>');
}
function copy(text) {

  else fallbackCopy(text);
}
function fallbackCopy(text) {
  const t = el('textarea'); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); toast('copied'); } catch (e) { toast('copy failed — select it manually'); }
  t.remove();
}

/* ============================ self-test ============================
 * Drives the REAL DOM events every control uses — pointer sequences, clicks,
 * contextmenu, submenu hovers — because testing the functions behind them is
 * exactly how the bin double-click and the vanishing submenu got shipped broken.
 * Runs on a scratch state and restores yours afterwards. ⚙ → Run self-test.
 */
function selfTest() {
  const backup = JSON.stringify(S);
  const R = [];
  const ok = (name, fn) => { try { const r = fn(); R.push([r === true, name, r === true ? '' : String(r)]); } catch (e) { R.push([false, name, e.message]); } };
  const pd = (n, x, y) => n.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, pointerId: 1 }));
  const pm = (x, y) => window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: x, clientY: y, pointerId: 1 }));
  const pu = (x, y) => window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, clientX: x, clientY: y, pointerId: 1 }));

/**
 * Print sheet — doubles as the client hand-out. "Client mode" drops your private
 * layer (notes, effort, priority) and keeps the times, names and tick boxes.
 */
function buildPrint(client, noDialog) {
  const a = $('#printarea') || document.body.appendChild(el('div', null, '')); a.id = 'printarea';
  const rows = S.lanes.map(L => ({ L, sc: schedule(L.id).filter(r => !r.hidden) })).filter(x => x.sc.length);
  a.innerHTML =
    '<h1>' + esc(client ? S.calName : M().name) + '</h1>' +
    '<div class="psub">' + esc(client ? '' : S.calName + ' · ') + rows.reduce((n, x) => n + x.sc.length, 0) + ' blocks · ' +
    dur2s(S.lanes.reduce((n, l) => n + laneMins(l.id), 0)) + (client ? '' : ' · load ' + S.lanes.reduce((n, l) => n + laneLoad(l.id), 0).toFixed(1)) + '</div>' +
    rows.map(({ L, sc }) =>
      '<div class="prt"><h2>' + esc(L.name) + (L.start != null ? ' · ' + fmt(hm2min(L.start)) + '–' + fmt(laneEnd(L.id)) : '') + '</h2>' +
      sc.map(r =>
        '<div class="pb"><span class="box"></span><span class="pt">' + (r.s == null ? '' : fmt(r.s) + ' – ' + fmt(r.e)) + '</span>' +
        '<span class="pn">' + esc(r.it.name) + (client ? '' : (r.it.pri ? ' [P' + r.it.pri + ']' : '')) + '</span>' +
        '<span class="pd">' + dur2s(r.it.dur) + (client ? '' : ' ' + EGLYPH[energyOf(r.it)]) + '</span></div>' +
        (!client && r.it.note ? '<div class="pnote">' + esc(r.it.note) + '</div>' : '')
      ).join('') + '</div>').join('') +
    '<div class="pfoot">' + esc(daysLabel(effDays(S.lanes[0], { daysEx: false }))) + ' · made with BLOCK</div>';
  if (!noDialog) window.print();
  return a;
}

  openMenu(x, y, [
    { head: 'Print / share' },
    { label: 'Print this day', fn: () => buildPrint(false) },
    { label: 'Client sheet (no notes, effort or P)', fn: () => buildPrint(true) },
  ]);
}

/** click a gap and BLOCK offers what actually fits in it */
function whatFits(anchor, laneId, idx, mins) {
  const fits = S.lib.filter(b => b.dur <= mins).sort((a, b) => b.dur - a.dur).slice(0, 12);
  openMenu(anchor.left, anchor.bottom, [
    { head: dur2s(mins) + ' free — what fits' },
    ...(fits.length ? fits.map(b => ({ label: b.name, k: dur2s(b.dur) + ' ' + EGLYPH[b.energy || 2], fn: () => addItem(laneId, b, idx) }))
      : [{ label: 'nothing in the bin is that short' }]),
    { sep: 1 },
    { label: 'Stretch the block above to fill it', fn: () => {
        const arr = items(laneId), prev = arr[idx - 1];
        if (!prev) return toast('nothing above to stretch');
        snap(); prev.dur += mins; syncKin(prev, { dur: prev.dur }); render();
      } },
  ]);
}

function openHelp() {
  openModal(
    '<div class="modal-head"><h3>HOW BLOCK WORKS</h3><button class="btn sm" id="mX">✕</button></div><div class="modal-body">' +
    '<div class="hint"><b class="k">1</b> &nbsp;<b>Build a day.</b> Drag blocks from the bin into a routine (or just click one). Columns are just named parts of your day — rename them, add your own, set when each starts. Times are worked out for you.</div>' +
    '<div class="hint"><b class="k">2</b> &nbsp;<b>Adjust.</b> A block shows <b>start – end</b>: click the start to anchor it to an exact hour (⚓ — everything else flows around it), click the end to say when it finishes, click the duration to type minutes. Drag a block to reorder; drop it outside the routines to delete.</div>' +
    '<div class="hint"><b class="k">3</b> &nbsp;<b>Right-click anything</b> — a block, a routine, a block in the bin. That’s where days, effort, priority, “move to routine”, “copy routine to routine” and the rest live. Typing <b>Vitamins 1m</b> as a name sets the duration too, and anything under 10 minutes collapses to a single line.</div>' +
    '<div class="hint"><b class="k">4</b> &nbsp;<b>Tag it.</b> Each block carries an effort dot (◔ light / ◑ medium / ● heavy) and an optional priority (P1–P3). Effort drives the routine’s load meter, so you can see when you’ve stacked three heavy things before noon. Priority drives the <b>↓P</b> sort and exports to Todoist.</div>' +
    '<div class="hint"><b class="k">5</b> &nbsp;<b>Check things off.</b> Tick the box on a block as you do it. When everything scheduled for today is ticked, the list congratulates you and resets itself — and it resets on its own each new day.</div>' +
    '<div class="hint"><b class="k">6</b> &nbsp;<b>Make more days.</b> A group of blocks is a <b>routine</b> (Morning, Midday); a group of routines is a <b>day</b> (Weekday, Rest day). <b>+ Day</b> builds another one, and the <b>Week</b> tab picks which day runs on which weekday.</div>' +
    '<div class="hint"><b class="k">7</b> &nbsp;<b>Reuse.</b> <b>⇩ template</b> on a routine saves it to the bin — drop the whole thing into any routine later.</div>' +

  );
