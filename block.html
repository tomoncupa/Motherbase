/* ---------- settings ----------
 * Grouped the way you actually think about them: what this thing is called,
 * how the board behaves, what it sounds like, where it exports to, and the data itself.
 */
function tzList() {
  let zones = [];
  try { zones = Intl.supportedValuesOf('timeZone'); } catch (e) {}
  if (!zones.length) zones = ['UTC', 'Europe/London', 'Europe/Berlin', 'Europe/Madrid', 'America/New_York', 'America/Chicago',
    'America/Denver', 'America/Los_Angeles', 'America/Sao_Paulo', 'Asia/Manila', 'Asia/Singapore', 'Asia/Tokyo',
    'Asia/Kolkata', 'Asia/Dubai', 'Australia/Sydney', 'Pacific/Auckland'];
  if (!zones.includes(S.tz)) zones = [S.tz].concat(zones);
  return zones;
}
let setTab = 'general';
function openSettings() {
  const tabs = [['general', 'General'], ['board', 'Board'], ['sound', 'Sound'], ['export', 'Calendar + Todoist'], ['data', 'Data']];
  const sel = (id, opts, val) => '<select id="' + id + '">' + opts.map(([v, l]) =>
    '<option value="' + esc(v) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>';
  const chk = (id, on) => '<input type="checkbox" id="' + id + '" ' + (on ? 'checked' : '') + '>';

  let body = '';
  if (setTab === 'general') {
    body = '<div class="set">' +
      '<label>What this is called<span>Used as the calendar name on export</span></label><input type="text" id="sCal" value="' + esc(S.calName) + '">' +
      '<label>Timezone<span>Times are written as local wall-clock in this zone</span></label>' +
      sel('sTz', tzList().map(z => [z, z]), S.tz) +
      '<label>Clock<span></span></label>' + sel('sH24', [['0', '12-hour — 6:30am'], ['1', '24-hour — 06:30']], S.h24 ? '1' : '0') +
      '<label>Week starts on<span>Also sets the order of the Week tab</span></label>' +
      sel('sWS', [['today', 'Today (rolling 7 days)'], ['0', 'Sunday'], ['1', 'Monday'], ['6', 'Saturday']], S.weekStart) +
      '</div>';
  } else if (setTab === 'board') {
    body = '<div class="set">' +
      '<label>Buffer between blocks<span>Dead time inserted after every block</span></label><input type="number" id="sGap" min="0" max="60" step="5" value="' + S.gap + '">' +
      '<label>When a routine is fully ticked<span></span></label>' +
      sel('sDone', [['stay', 'Leave it where it is'], ['right', 'Slide it to the far right'], ['hide', 'Hide it until tomorrow']], S.doneRoutines) +
      '<label>Fit blocks to their length<span>Draw an hour as an hour, scaled to fit without scrolling</span></label>' + chk('sProp', S.proportional) +
      '<label>Moving “now” line<span>A red line at the current minute, only in routines it passes through</span></label>' + chk('sNow', S.nowline) +
      '<label>Keep finished blocks in the Week tab<span>Off hides them as you tick</span></label>' + chk('sKeep', S.keepDone) +
      '</div>';
  } else if (setTab === 'sound') {
    body = '<div class="set">' +
      '<label>Sounds<span>Synthesised in the browser — no files, no network</span></label>' + chk('sSnd', S.sound) +
      '<label>Sound set<span>Ticks rise in pitch as you get closer to finishing</span></label>' +
      sel('sTheme', Object.keys(THEMES).map(k => [k, THEMES[k].name]), S.soundTheme) +
      '<label>Volume<span></span></label><input type="range" id="sVol" min="0" max="1" step="0.05" value="' + (S.volume == null ? .6 : S.volume) + '">' +
      '</div>' +
      '<div class="row"><button class="btn" id="tTick">▸ Hear a tick</button><button class="btn" id="tDone">▸ Hear a finished day</button></div>' +
      '<div class="hint" style="margin-top:12px">The tick climbs a pentatonic scale as your list empties, so the last one of the day sounds like the last one. Finishing everything plays a short fanfare.</div>';
  } else if (setTab === 'export') {
    body = '<div class="set">' +
      '<label>Todoist project tag<span>Appended as #Tag on quick-add lines</span></label><input type="text" id="sProj" value="' + esc(S.tdProject) + '">' +
      '<label>Todoist priority for blocks with no P<span>4 = urgent, 1 = normal</span></label><input type="number" id="sPri" min="1" max="4" value="' + S.tdPriority + '">' +
      '<label>Default export scope<span></span></label>' +
      sel('sScope', [['variant', 'Just the open day'], ['week', 'The whole week']], S.exportScope) +
      '</div>' +
      '<div class="row"><button class="btn acc" id="goExport">Open export ▸</button><button class="btn" id="goPrint">Print / client sheet ▸</button></div>';
  } else {
    const days = Object.keys(S.log || {}).length;
    const blocks = S.variants.reduce((a, v) => a + S.lanes.reduce((b, l) => b + ((v.items[l.id] || []).length), 0), 0);
    body = '<div class="hint">' + S.variants.length + ' days · ' + S.lanes.length + ' routines · ' + blocks + ' blocks · ' +
      S.lib.length + ' in the bin · ' + S.templates.length + ' templates · ' + days + ' days of history</div>' +
      '<div class="row"><button class="btn acc" id="sBackup">⤓ Backup everything</button><button class="btn" id="sTest">Run self-test</button></div>' +
      '<div class="row"><button class="btn" id="sClear">Reset today’s ticks</button>' +
      '<button class="btn" id="sWipeLog">Clear history</button>' +
      '<button class="btn" id="sReset" style="color:var(--bad)">Reset everything</button></div>' +
      '<div class="hint" style="margin-top:12px">Everything lives in this browser. The backup is a single JSON file you can restore on another machine from <b>Export → Backup</b>.</div>';
  }

  openModal(
    '<div class="modal-head"><h3>SETTINGS</h3><button class="btn sm" id="mX">✕</button></div>' +
    '<div class="mtabs">' + tabs.map(([k, l]) => '<button class="mtab' + (k === setTab ? ' on' : '') + '" data-k="' + k + '">' + l + '</button>').join('') + '</div>' +
    '<div class="modal-body">' + body + '</div>'
  );
  $('#mX').onclick = closeModal;
  $('#modal').querySelectorAll('.mtab').forEach(b => b.onclick = () => { saveSettings(); setTab = b.dataset.k; openSettings(); });

  const on = (id, fn) => { const n = $(id); if (n) n.onclick = fn; };
  on('#tTick', () => { saveSettings(); beep('done'); });
  on('#tDone', () => { saveSettings(); beep('complete'); });
  on('#goExport', () => { saveSettings(); closeModal(); openExport(); });
  on('#goPrint', ev => { saveSettings(); closeModal(); openPrintMenu(innerWidth / 2 - 100, 120); });
  on('#sBackup', () => { saveSettings(); closeModal(); expTab = 'json'; openExport(); });
  on('#sTest', () => { saveSettings(); selfTest(); });
  on('#sClear', () => { snap(); S.variants.forEach(v => clearDone(v.id)); render(); toast('ticks cleared'); });
  on('#sWipeLog', () => { if (confirm('Delete the completion history? Your routines stay.')) { snap(); S.log = {}; render(); toast('history cleared'); } });
  on('#sReset', () => { if (confirm('Wipe all blocks, routines, days, templates and rules?')) { snap(); S = seedState(); closeModal(); render(); } });
  const vol = $('#sVol'); if (vol) vol.onchange = () => { S.volume = parseFloat(vol.value); beep('done'); };
  ['#sSnd', '#sTheme', '#sNow', '#sProp', '#sKeep', '#sDone', '#sH24', '#sWS', '#sTz', '#sScope'].forEach(id => {
    const n = $(id); if (n) n.onchange = () => { saveSettings(); render(); };
  });
}
/** settings apply as you touch them — no Save button to forget */
function saveSettings() {
  const val = (id, d) => { const n = $(id); return n ? n.value : d; };
  const on = id => { const n = $(id); return n ? n.checked : null; };
  if ($('#sCal')) S.calName = val('#sCal', S.calName).trim() || 'Routine';
  if ($('#sTz')) S.tz = val('#sTz', S.tz);
  if ($('#sH24')) S.h24 = val('#sH24', '0') === '1';
  if ($('#sWS')) { const w = val('#sWS', '1'); S.weekStart = w === 'today' ? 'today' : parseInt(w); }
  if ($('#sGap')) S.gap = clamp(parseInt(val('#sGap', S.gap)) || 0, 0, 60);
  if ($('#sDone')) S.doneRoutines = val('#sDone', 'stay');
  if (on('#sProp') != null) S.proportional = on('#sProp');
  if (on('#sNow') != null) S.nowline = on('#sNow');
  if (on('#sKeep') != null) S.keepDone = on('#sKeep');
  if (on('#sSnd') != null) S.sound = on('#sSnd');
  if ($('#sTheme')) S.soundTheme = val('#sTheme', S.soundTheme);
  if ($('#sVol')) S.volume = parseFloat(val('#sVol', S.volume));
  if ($('#sProj')) S.tdProject = val('#sProj', S.tdProject).trim() || 'Routine';
  if ($('#sPri')) S.tdPriority = clamp(parseInt(val('#sPri', S.tdPriority)) || 1, 1, 4);
  if ($('#sScope')) S.exportScope = val('#sScope', S.exportScope);
  save();
}

/* ============================ wiring ============================ */
$('#vDay').onclick = () => { S.view = 'day'; render(); };
$('#vWeek').onclick = () => { S.view = 'week'; render(); };
$('#vSum').onclick = () => { S.view = 'sum'; render(); };
$('#bExp').onclick = openExport;
$('#bCmp').onclick = openCompare;
$('#bRules').onclick = openRules;

let nfColor = PAL[0];
PAL.forEach(c => {
  const s = el('button', 'sw' + (c === nfColor ? ' on' : '')); s.style.background = c;
  s.onclick = () => { nfColor = c; $('#nfSw').querySelectorAll('.sw').forEach(x => x.classList.remove('on')); s.classList.add('on'); };
  $('#nfSw').appendChild(s);

$('#nfOk').onclick = () => {
  const n = $('#nfName').value.trim(); if (!n) return toast('give it a name first');
  snap();
  S.lib.push({ id: uid(), name: n, dur: Math.max(5, parseInt($('#nfMin').value) || 30), color: nfColor, cat: 'Custom', energy: parseInt($('#nfEnergy').value) || 2 });

};
$('#nfName').onkeydown = e => { if (e.key === 'Enter') $('#nfOk').click(); };

window.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && !typing && S.view === 'day') {
    e.preventDefault(); S.lanes.forEach(l => items(l.id).forEach(it => SEL.add(it.id))); render();
  }
  if (e.key === 'Escape') { if (clearSel()) render(); closeModal(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !typing && SEL.size) {
    e.preventDefault(); snap();
    selected().forEach(({ it }) => { const f = findItem(it.id); if (f) f.arr.splice(f.i, 1); });
    SEL.clear(); render();
  }
});
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} });

/* ══════════════════════ LifeOS bridge ══════════════════════
   BLOCK owns the schedule. LifeOS owns what actually got done. Three wires:
     library  →  the shared activity vocabulary (so HABITS can promote any of it)
     ticks    →  the shared day log (so a tick here is a tick everywhere)
     plan     →  today's blocks, published for the home screen to show and tick
   Blocks are matched across apps by slugged NAME: two blocks called the same
   thing are the same thing, which is exactly what makes the ticks agree.  */
const actIdOf = it => it.actId || (it.actId = LifeOS.slug(it.name));

function pushLib() {
  const seen = {}, out = [];
  const add = (name, cat, dur, color, energy) => {
    const id = LifeOS.slug(name); if (seen[id]) return; seen[id] = 1;
    out.push({ id: id, name: name, cat: cat || '', dur: dur || 0, color: color || '', energy: energy || 2 });
  };
  S.lib.forEach(l => add(l.name, l.cat, l.dur, l.color, l.energy));
  S.variants.forEach(v => S.lanes.forEach(l => (v.items[l.id] || []).forEach(it => add(it.name, 'routine', it.dur, it.color, it.energy))));
  LifeOS.acts(out);
}
function publishToday() {
  const vid = routineForToday(), d = todayIdx();
  const blocks = withVariant(vid, () => S.lanes.flatMap(l =>
    schedule(l.id).filter(r => effDays(lane(l.id), r.it)[d]).map(r => ({
      id: r.it.id, actId: actIdOf(r.it), name: r.it.name, s: r.s, dur: r.it.dur,
      color: r.it.color, lane: lane(l.id).name,
    })))).sort((a, b) => a.s - b.s);
  LifeOS.publishToday({ date: todayKey(), vid: vid, name: (variant(vid) || {}).name || 'routine', blocks: blocks });
}
/** the shared log is the truth about what got done — mirror it onto the blocks */
let LIFEOS_OK = true;
function pullDone() {
  if (!LIFEOS_OK) return 0;
  if (!window.LifeOS) return 0;
  const date = todayKey(); let changed = 0;
  const cleared = (S.cleared && S.cleared.date === date) ? S.cleared.ids : {};
  S.variants.forEach(v => withVariant(v.id, () => {
    /* the shared log is keyed by NAME, so it cannot tell a morning brush from an
       evening one. Where a name appears more than once in a day, local ticks win. */
    const seen = {};
    LANES(v.id).forEach(l => items(l.id).forEach(it => { seen[it.name] = (seen[it.name] || 0) + 1; }));
    LANES(v.id).forEach(l => items(l.id).forEach(it => {
      if (seen[it.name] > 1) return;
      const aid = actIdOf(it);
      if (cleared[aid]) return;            /* boxes deliberately cleared after a full pass — leave them empty */
      const on = LifeOS.isDone(aid, date);
      if (!!it.done !== on) { it.done = on; changed++; }
    }));
  }));
  return changed;
}

let pubT;
const _render = render;
render = function () { _render.apply(this, arguments); clearTimeout(pubT); pubT = setTimeout(() => { pushLib(); publishToday(); }, 400); };
/* someone ticked something elsewhere — only repaint if it actually moved */
LifeOS.on(() => { if (pullDone()) { save(); render(); } });
LifeOS.ready(() => { pullDone(); render(); });

render();
/* keep the now line honest without redrawing the world */
setInterval(() => { if (S.view === 'day' && S.nowline) renderBoard(); }, 60000);
if (!S.lanes.some(l => items(l.id).length) && !S.templates.length) setTimeout(openHelp, 400);
</script>
