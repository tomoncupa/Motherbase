<style>
/* CHARACTER SHEET. Everywhere, phone first. The app's chrome is tokens only;
   the windows it shows are NOTICE pictures with their own palettes, drawn by
   shared/notice.js, the same way NOTICE draws them. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text-1);font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-3);
  padding:calc(var(--s-3) + var(--safe-t)) var(--s-4) var(--s-3);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-5);letter-spacing:.18em;white-space:nowrap}
.logo b{color:var(--accent)}
/* a phone has room for the word SHEET and both buttons, not the whole name */
@media (max-width:440px){.logo .long{display:none}}
.spacer{flex:1}
main{flex:1;min-height:0;padding:var(--s-4) var(--s-4) calc(var(--s-7) + var(--safe-b))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-4)}
.card{border-radius:var(--radius-lg);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted)}
.muted{color:var(--text-muted);line-height:var(--lh-body)}
.big{font-family:var(--font-num, var(--font-display));font-size:var(--f-6);font-weight:var(--w-bold);font-variant-numeric:tabular-nums}
.tally{display:flex;gap:var(--s-4);flex-wrap:wrap}
.tally div{display:flex;flex-direction:column;gap:var(--s-1)}
.hide{display:none!important}

/* the history */
.month{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-top:var(--s-3)}
.feats{display:flex;flex-direction:column;gap:var(--s-2)}
.feat{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap);width:100%;text-align:left;
  padding:var(--s-2) var(--s-3);border:0;border-radius:var(--radius-md);color:var(--text-1);font:inherit;cursor:pointer}
.feat .tx{flex:1;min-width:0}
.feat b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feat small{color:var(--text-muted);font-size:var(--f-1)}
.feat .dt{flex:0 0 auto;color:var(--text-muted);font-size:var(--f-1);font-variant-numeric:tabular-nums}
.feat.new b::after{content:'NEW';margin-left:var(--s-2);font-family:var(--font-display);font-size:var(--f-1);
  letter-spacing:var(--track-cap);color:var(--accent)}

/* one window, big */
.stage{display:flex;justify-content:center;align-items:flex-start;padding:var(--s-2);
  border-radius:var(--radius-md);background:var(--surface-2)}
.stage canvas{display:block;max-width:100%;max-height:62vh;width:auto;height:auto}
.count{color:var(--text-muted);font-size:var(--f-2);text-align:center;margin-top:var(--s-2)}
.seg{display:flex;flex-direction:column;gap:var(--s-1)}

/* TITLES: the worn one big, the list as plates; the worn plate wears a ring */
.worn{display:flex;align-items:center;gap:var(--s-3)}
.worn .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s-1)}
.worn small{color:var(--text-muted);font-family:var(--font-display);font-size:var(--f-1);letter-spacing:var(--track-cap)}
.worn b{font-family:var(--font-display);font-size:var(--f-5);font-weight:var(--w-bold);overflow-wrap:anywhere}
.tlist{display:flex;flex-direction:column;gap:var(--s-2)}
.feat.on{box-shadow:inset 0 0 0 2px var(--accent)}

/* NEW and FEATS sit in .top, the months in .hlist. On a phone both are the
   plain column they always were, same gaps. On a wide window (Tom,
   2026-10-02: "on a wide window, lay things out side by side; never fold
   text") the top cards stand in a row and the history flows into as many
   columns as fit, newest first down the first column. */
.top{display:flex;flex-direction:column;gap:var(--s-4)}
.hlist{display:flex;flex-direction:column;gap:var(--s-3)}
@media (min-width:1100px){
  .wrap{max-width:none}
  .top{flex-direction:row;align-items:stretch}
  .top>.card{flex:0 1 calc(var(--s-10) * 5);min-width:0}
  .hlist{display:block;column-width:calc(var(--s-10) * 2.5);column-gap:var(--s-5)}
  .hlist .month{margin:var(--s-4) 0 var(--s-3);break-after:avoid}
  .hlist .month:first-child{margin-top:0}
  .hlist .feats{display:block}
  .hlist .feat{break-inside:avoid;margin-bottom:var(--s-2)}
  .tlist{display:block;column-width:calc(var(--s-10) * 2.5);column-gap:var(--s-5)}
  .tlist .feat{break-inside:avoid;margin-bottom:var(--s-2)}
}
</style>

<body>
<header>
  <div class="logo"><span class="long">CHARACTER </span><b>SHEET</b></div>
  <div class="spacer"></div>
  <button class="mb-btn mb-press mb-tap" onclick="UI.settings(APP.id)">SETTINGS</button>
  <button class="mb-btn mb-press mb-tap" onclick="location.href='../index.html'" aria-label="Home" data-icon="app.home"></button>
</header>
<main class="mb-scroll"><div class="wrap" id="main"></div></main>

<script>
const APP = {
  id: 'sheet',
  name: 'Character Sheet',
  icon: '◆',
  blurb: 'your feats and titles from TRAIN and STATUS, as status windows',
  types: ['feat'],   // one window he has been shown: key is the feat id, undated
};

Skins.load('../shared/skins.json').then(() => { Skins.restore(APP.id);
  if (window.Icons) Icons.paint(null, { force: true }); });
if (window.Icons) Icons.paint();
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
IO.register({ app: APP.id, name: APP.name, types: APP.types,
  reads: { train: ['set', 'exercise', 'setting'], status: ['ev', 'field', 'note'] },
  tables: [{ name: 'Feats seen', type: 'feat', cols: [['t', 'Shown'], ['saved', 'Saved']] }] });

const get = (k, d) => { const v = Rec.setting(APP.id, k); return v == null ? d : v; };
const put = (k, v) => Rec.setting(APP.id, k, v);

/* ═══════════════════════════ FEATS ═══════════════════════════
   What the log says he did, found by reading TRAIN's and STATUS's rows.
   Worked out fresh every open and never stored: a feat is a fact about the
   log, so a deleted set takes its feat with it, and a better rule next month
   re-reads the whole history. The only row written is `feat`, "this one was
   shown", so a window pops once.

   Every feat must come from something real (Tom, 2026-09-25: it can boast
   "but it has to make sense"). No made-up rewards: what a window lists under
   REWARDS is the actual gain. */
const LB = 2.20462262185;
const unit = () => Rec.setting('train', 'unit') || 'lb';
const fmt = n => (+n).toLocaleString('en');
/* One decimal, and none when it is whole: 80 kg, 82.5 kg. */
const wt = kg => { const u = unit(); const v = u === 'lb' ? kg * LB : kg;
  return fmt(Math.round(v * 10) / 10) + ' ' + u; };

/* TRAIN's own reading of a comment, copied rather than guessed (train/,
   "what a comment says"). A warmup is never a record. A split set ("10 5"
   short rest, "10,5" under 30 s, "10+5" long rest) counts toward a record by
   its effective reps, TRAIN.effReps since TRAIN 1.0.70: the first part whole,
   each later part by the rest before it times what the part before counted,
   with TRAIN's own weights. Tonnage still counts every rep. */
const warmNote = n => !!n && /\bwarm[ -]?ups?\b|\bwu\b/i.test(n);
function splitNote(note, reps) {
  if (!note || !(reps > 1) || !/\d/.test(note)) return null;
  const rx = /\d+(?:\.\d+)?|\.\d+/g, nums = []; let m;
  while ((m = rx.exec(note))) {
    const a = m.index, b = a + m[0].length;
    nums.push({ v: parseFloat(m[0]), a: a, b: b,
      ok: !/[A-Za-z0-9_]/.test(note.charAt(a - 1)) && !/[A-Za-z0-9_]/.test(note.charAt(b)) });
  }
  const runs = []; let cur = [];
  nums.forEach(n => {
    if (!n.ok) { if (cur.length) runs.push(cur); cur = []; return; }
    if (cur.length) {
      const gap = note.slice(cur[cur.length - 1].b, n.a);
      if (/^[ \t]*[,+][ \t]*$/.test(gap) || /^[ \t]+$/.test(gap)) {
        n.rest = gap.indexOf('+') > -1 ? 3 : gap.indexOf(',') > -1 ? 2 : 1;
        cur.push(n); return;
      }
      runs.push(cur);
    }
    n.rest = 0;
    cur = [n];
  });
  if (cur.length) runs.push(cur);
  for (const run of runs) for (let i = 0; i < run.length - 1; i++) {
    if (!(run[i].v > 0)) continue;
    let sum = run[i].v, rest = 0;
    for (let j = i + 1; j < run.length; j++) {
      if (!(run[j].v > 0)) break;
      sum += run[j].v;
      rest = Math.max(rest, run[j].rest);
      if (Math.floor(sum + 1e-9) === reps || Math.abs(sum - reps) < 1e-6)
        return { text: note.slice(run[i].a, run[j].b), rest: rest,
                 parts: run.slice(i, j + 1).map(x => x.v),
                 rests: run.slice(i, j + 1).map((x, k) => k ? x.rest : 0) };
      if (sum > reps + 1) break;
    }
  }
  return null;
}
/* TRAIN.SPLIT_W and TRAIN.splitWeights: percent, changed in TRAIN's Settings. */
const SPLIT_W = { splitShort: 80, splitMid: 50, splitLong: 0 };
function splitWeights() {
  const w = {};
  Object.keys(SPLIT_W).forEach(k => {
    let v = Rec.setting('train', k);
    v = typeof v === 'number' && isFinite(v) ? v : SPLIT_W[k];
    w[k] = Math.max(0, Math.min(100, v)) / 100;
  });
  return { 1: w.splitShort, 2: w.splitMid, 3: w.splitLong };
}
function effReps(split, reps, w) {
  if (!split || !split.parts) return reps;
  let e = 0, m = 1;
  split.parts.forEach((p, k) => {
    if (k) m *= (w[(split.rests || [])[k] || split.rest] || 0);
    e += m * p;
  });
  return Math.round(Math.min(e, reps || e) * 100) / 100;
}
const showReps = n => String(Math.round((+n || 0) * 100) / 100);
/* TRAIN.repsText: "10 5 (counts as 14)" wherever a split set's strength is stated. */
const repsText = s => !s.split ? showReps(s.r)
  : s.split.text + (Math.abs(s.er - s.r) > 1e-6 ? ' (counts as ' + showReps(s.er) + ')' : '');

/* Working sets that count, oldest first. A planned set counts once ticked,
   or once its day is over, which is TRAIN.counts. */
function workSets() {
  const today = Day.today();
  const out = [], sw = splitWeights();
  Rec.all('set').forEach(r => {
    const p = r.payload || {};
    if (!r.date || r.date > today || !p.ex) return;
    if (p.plan && !p.done && r.date >= today) return;
    const warm = p.warm === 1 || p.warm === true || (p.warm !== 0 && p.warm !== false && warmNote(p.note));
    if (warm) return;
    const reps = +p.r || 0, split = splitNote(p.note, reps);
    /* `er` is what the set counts for in strength, `r` every rep */
    out.push({ date: r.date, ex: p.ex, kg: +p.kg || 0, r: reps, split: split, er: split ? effReps(split, reps, sw) : reps });
  });
  return out;
}

/* Milestones: the fixed ones, then every `step` after the last. */
const LADDER = {
  sessions: [[1, 10, 25, 50, 75, 100, 150, 200, 250, 300, 400, 500], 250],
  weeks: [[4, 8, 12, 26, 52, 78, 104], 52],
  tonnes: [[10, 25, 50, 100, 250, 500, 1000], 500],
  logDays: [[7, 14, 30, 60, 100, 200, 365], 365],
  target: [[7, 14, 30, 60, 100, 200, 365], 365],
};
function isStep(ladder, n) {
  const fixed = ladder[0], last = fixed[fixed.length - 1];
  return fixed.indexOf(n) >= 0 || (n > last && (n - last) % ladder[1] === 0);
}
const nth = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
const monday = d => Day.shift(d, -((Day.dow(d) + 6) % 7));

/* A run of days in a row, walked over a sorted list of dates. `hit` is
   called for each milestone the run reaches, with the day it reached it and
   the day the run began, which is what makes a second streak a new feat. */
function runs(dates, ladder, hit) {
  let start = null, prev = null, n = 0;
  dates.forEach(d => {
    if (prev && Day.diff(d, prev) === 1) n++; else { n = 1; start = d; }
    prev = d;
    if (isStep(ladder, n)) hit(n, d, start);
  });
}

function trainFeats(out) {
  const sets = workSets();
  if (!sets.length) return;
  const exs = Rec.map('exercise');
  const exName = id => (exs[id] && exs[id].name) || 'An exercise';

  /* RECORDS, at the moment they were lifted: heavier than anything done
     before that day at that many reps or more, TRAIN's rule. Only once an
     exercise has two earlier days, or every first week of a new movement is
     all records. One window per day, one line per exercise. */
  const byEx = {};
  sets.forEach(s => { if (s.kg > 0 && s.er > 0) (byEx[s.ex] = byEx[s.ex] || []).push(s); });
  const recDays = {};
  Object.keys(byEx).forEach(ex => {
    const list = byEx[ex].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    const best = {};                       // best[er] = heaviest kg at exactly er reps; er may be 13.6
    const atLeast = r => { let m = 0; for (const k in best) if (+k >= r - 1e-6 && best[k] > m) m = best[k]; return m; };
    let days = 0;
    for (let i = 0; i < list.length;) {
      const d = list[i].date, day = [];
      while (i < list.length && list[i].date === d) day.push(list[i++]);
      if (days >= 2) {
        let top = null;
        day.forEach(s => {
          const was = atLeast(s.er);
          if (was > 0 && s.kg > was + 1e-6 && (!top || s.kg > top.kg || (s.kg === top.kg && s.er > top.s.er)))
            top = { kg: s.kg, s: s, was: was };
        });
        if (top) (recDays[d] = recDays[d] || []).push({ ex: ex, name: exName(ex), kg: top.kg, reps: repsText(top.s), gain: top.kg - top.was });
      }
      day.forEach(s => { if (!(best[s.er] >= s.kg)) best[s.er] = s.kg; });
      days++;
    }
  });
  Object.keys(recDays).forEach(d => {
    const recs = recDays[d].sort((a, b) => b.gain - a.gain);
    const shown = recs.slice(0, 5);
    const lines = ['# RECORD BROKEN', recs.length === 1 ? 'A record has been broken.' : recs.length + ' records have been broken.'];
    shown.forEach(x => lines.push('- [x] ' + x.name + ' ' + wt(x.kg) + ' × ' + x.reps));
    if (recs.length > shown.length) lines.push('- [x] ' + (recs.length - shown.length) + ' more');
    lines.push('Rewards:');
    shown.forEach(x => lines.push('+' + wt(x.gain) + ' on ' + x.name));
    out.push({ id: 'rec|' + d, date: d, kind: 'record', n: recs.length, title: recs.length === 1 ? 'Record: ' + recs[0].name : recs.length + ' records',
      sub: shown.map(x => x.name).join(', '), text: lines.join('\n') });
  });

  /* SESSIONS: the Nth day he trained. */
  const trainDays = Array.from(new Set(sets.map(s => s.date))).sort();

  /* What only the titles read (TITLES below): every record day, the first
     with three or more, the first session after 28 days or more away, and
     the first day with 10 working sets on a leg category. */
  FACTS.recDays = Object.keys(recDays).sort();
  FACTS.rampage = FACTS.recDays.filter(d => recDays[d].length >= 3)[0] || null;
  FACTS.ret = trainDays.filter((d, i) => i && Day.diff(d, trainDays[i - 1]) >= 28)[0] || null;
  const cats = Rec.map('excat'), legN = {};
  const isLeg = id => { const e = exs[id], c = e && cats[e.cat];
    return !!c && /leg|quad|ham|glute|calf|calves/i.test(c.name || ''); };
  sets.forEach(s => { if (isLeg(s.ex)) legN[s.date] = (legN[s.date] || 0) + 1; });
  FACTS.legDay = Object.keys(legN).filter(d => legN[d] >= 10).sort()[0] || null;
  trainDays.forEach((d, i) => {
    const n = i + 1;
    if (!isStep(LADDER.sessions, n)) return;
    out.push({ id: 'ses|' + n, date: d, kind: 'sessions', title: nth(n) + ' session', sub: 'Training days logged',
      text: ['# NOTIFICATION', n === 1 ? 'The first session has been logged.' : 'Session ' + fmt(n) + ' has been logged.',
        n > 1 ? 'The first was ' + Day.label(trainDays[0]) + '.' : 'The log has begun.'].join('\n') });
  });

  /* WEEKS IN A ROW with at least two training days, Monday to Sunday. A week
     still running counts once it has its two. */
  const perWeek = {};
  trainDays.forEach(d => { const w = monday(d); perWeek[w] = (perWeek[w] || 0) + 1; });
  const goodWeeks = Object.keys(perWeek).filter(w => perWeek[w] >= 2).sort();
  let wStart = null, wPrev = null, wn = 0;
  goodWeeks.forEach(w => {
    if (wPrev && Day.diff(w, wPrev) === 7) wn++; else { wn = 1; wStart = w; }
    wPrev = w;
    if (!isStep(LADDER.weeks, wn)) return;
    /* the day the week reached two sessions, so the feat lands on a real day */
    const second = trainDays.filter(d => monday(d) === w)[1];
    out.push({ id: 'wks|' + wStart + '|' + wn, date: second, kind: 'weeks', title: wn + ' weeks in a row', sub: 'Two or more sessions every week',
      text: ['# QUEST', 'Consistency', '- [x] Train twice a week ' + wn + '/' + wn,
        'Started the week of ' + Day.label(wStart) + '.', 'Rewards: ' + wn + ' weeks unbroken'].join('\n') });
  });

  /* TONNAGE: everything lifted, weight times reps, added up. */
  let kg = 0, step = 0;
  const ton = LADDER.tonnes;
  const hits = ton[0].slice();
  sets.forEach(s => {
    kg += s.kg * s.r;
    while (true) {
      const next = step < hits.length ? hits[step] : hits[hits.length - 1] + (step - hits.length + 1) * ton[1];
      if (kg < next * 1000) break;
      const u = unit(), lifted = u === 'lb' ? fmt(Math.round(next * 1000 * LB)) + ' lb' : fmt(next) + ' tonnes';
      out.push({ id: 'ton|' + next, date: s.date, kind: 'tonnage', title: lifted + ' lifted', sub: 'Every set, weight times reps',
        text: ['# NOTIFICATION', 'Total weight moved has passed ' + lifted + '.'].join('\n') });
      step++;
    }
  });
}

function statusFeats(out) {
  const today = Day.today();
  const evs = Rec.all('ev').filter(r => r.date && r.date <= today && r.payload && r.payload.e && r.payload.e.length);
  const noteDays = Rec.all('note').filter(r => r.date && r.date <= today).map(r => r.date);

  /* DAYS LOGGED IN A ROW: any reading, or any line in the journal. */
  const logDays = Array.from(new Set(evs.map(r => r.date).concat(noteDays))).sort();
  FACTS.firstLog = logDays[0] || null;
  runs(logDays, LADDER.logDays, (n, d, start) => out.push({ id: 'log|' + start + '|' + n, date: d, kind: 'streak',
    title: n + ' days logged in a row', sub: 'STATUS, every day',
    text: ['# QUEST', 'Daily Log', '- [x] Log something every day ' + n + '/' + n,
      'Unbroken since ' + Day.label(start) + '.', 'Rewards: ' + n + '-day streak'].join('\n') }));

  /* A TARGET HIT DAYS IN A ROW, for every switched-on field with one, and a
     done-or-not field done days in a row. Trained is TRAIN's, counted there. */
  const fields = Rec.map('field');
  const byField = {};
  evs.forEach(r => (byField[r.key] = byField[r.key] || []).push(r));
  Object.keys(fields).forEach(fid => {
    const f = fields[fid];
    if (!f || f.on === 0 || /^train/i.test(fid)) return;
    const check = f.measure === 'check';
    if (!check && !(f.target && (f.dir === 'gte' || f.dir === 'lte'))) return;
    const dayVal = e => f.agg === 'sum' ? e.reduce((a, x) => a + x.v, 0)
      : f.agg === 'avg' ? e.reduce((a, x) => a + x.v, 0) / e.length : e[e.length - 1].v;
    const days = (byField[fid] || []).filter(r => {
      const v = dayVal(r.payload.e);
      return check ? !!v : f.dir === 'lte' ? v <= f.target : v >= f.target;
    }).map(r => r.date).sort();
    const label = f.label || fid;
    const goal = check ? label : label + ' ' + (f.dir === 'lte' ? 'at most ' : 'at least ') + fmt(f.target) + (f.unit ? ' ' + f.unit : '');
    runs(days, LADDER.target, (n, d, start) => out.push({ id: 'tgt|' + fid + '|' + start + '|' + n, date: d, kind: 'target',
      title: label + ', ' + n + ' days in a row', sub: goal,
      text: ['# QUEST', label, '- [x] ' + goal + ' ' + n + '/' + n,
        'Every day since ' + Day.label(start) + '.', 'Rewards: ' + n + '-day streak'].join('\n') }));
  });
}

/* Everything, newest first. Two feats on one day keep a steady order. */
let FACTS = {};
function allFeats() {
  const out = [];
  FACTS = {};
  try { trainFeats(out); } catch (e) { console.error('SHEET: TRAIN feats', e); }
  try { statusFeats(out); } catch (e) { console.error('SHEET: STATUS feats', e); }
  const rank = { record: 0, sessions: 1, tonnage: 2, weeks: 3, streak: 4, target: 5 };
  return out.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : rank[a.kind] - rank[b.kind]);
}

/* ═══════════════════════════ TITLES ═══════════════════════════
   Tom, 2026-10-22, design A: every step of the feat ladders above, and a few
   firsts, unlocks a game title. One is worn, printed on the story picture.
   Worked out from the feats every open, never stored, like the feats: a
   title's only row is the same `feat` row a feat gets ("this window was
   shown"), keyed `title|<slug>`, so no new type. The worn one is the one
   setting, `sheet.title`, written only when he taps a title. With none
   picked, the newest unlocked is worn and nothing is saved. */
const LIFTED = n => unit() === 'lb' ? fmt(Math.round(n * 1000 * LB)) + ' lb' : fmt(n) + ' tonnes';
const TITLE_DEFS = [
  ['sessions', n => n === 1 ? 'Log a session' : n + ' sessions logged', [[1, 'Newcomer'], [10, 'Initiate'], [25, 'Regular'], [50, 'Iron Apprentice'],
    [75, 'Gym Rat'], [100, 'Centurion'], [150, 'Veteran'], [200, 'Iron Disciple'], [250, 'Barbell Knight'],
    [300, 'Spartan'], [400, 'Warlord'], [500, 'Living Legend'], [750, 'Iron Sovereign'], [1000, 'The Thousand']]],
  ['weeks', n => n + ' weeks in a row', [[4, 'Steady Hand'], [8, 'Clockwork'], [12, 'Quarter Keeper'], [26, 'Half-Year Hero'],
    [52, 'Iron Calendar'], [78, 'Unbreakable'], [104, 'Two-Year Titan'], [156, 'Timeless']]],
  ['tonnes', n => 'Lifted ' + LIFTED(n), [[10, 'Pack Mule'], [25, 'Ox'], [50, 'Forklift'], [100, 'Freight Train'],
    [250, 'Mountain Mover'], [500, 'Atlas'], [1000, 'World Lifter']]],
  ['records', n => n === 1 ? 'Break a record' : n + ' record days', [[1, 'Record Breaker'], [10, 'PR Hunter'],
    [25, 'Limit Breaker'], [50, 'Ceiling Crusher'], [100, 'Unchained'], [250, 'Beyond Limits']]],
  ['logDays', n => n + ' days logged in a row', [[7, 'Scribe'], [14, 'Chronicler'], [30, 'Record Keeper'], [60, 'Archivist'],
    [100, 'Loremaster'], [200, 'Keeper of Days'], [365, 'The Ledger']]],
  ['target', n => n + ' days on target in a row', [[7, 'On Target'], [14, 'Marksman'], [30, 'Sharpshooter'], [60, 'Sniper'],
    [100, 'Deadeye'], [200, 'Never Misses'], [365, 'Perfect Aim']]],
];
/* one-off firsts: [slug, name, goal, the fact's date] */
const FIRSTS = [
  ['awakened', 'Awakened', 'Log a day in STATUS', () => FACTS.firstLog],
  ['rampage', 'Rampage', '3 records in one day', () => FACTS.rampage],
  ['return', 'The Return', 'Train after 28 days away', () => FACTS.ret],
  ['legday', 'Leg Day Survivor', '10 leg sets in one day', () => FACTS.legDay],
];
const TITLE_COUNT = TITLE_DEFS.reduce((a, d) => a + d[2].length, 0) + FIRSTS.length;

/* Unlocked titles, newest first, each with the day it was earned. */
function allTitles(feats) {
  const got = {};
  const take = (k, d) => { if (d && (!got[k] || d < got[k])) got[k] = d; };
  feats.forEach(f => {
    const p = f.id.split('|'), last = p[p.length - 1];
    if (f.kind === 'sessions') take('sessions-' + p[1], f.date);
    else if (f.kind === 'weeks') take('weeks-' + last, f.date);
    else if (f.kind === 'tonnage') take('tonnes-' + p[1], f.date);
    else if (f.kind === 'streak') take('logDays-' + last, f.date);
    else if (f.kind === 'target') take('target-' + last, f.date);
  });
  (FACTS.recDays || []).forEach((d, i) => take('records-' + (i + 1), d));
  const out = [];
  const add = (slug, name, goal, date, ord) => out.push({ slug: slug, id: 'title|' + slug, date: date, kind: 'title', ord: ord,
    title: name, goal: goal, text: ['# TITLE UNLOCKED', name, '- [x] ' + goal].join('\n') });
  let ord = 0;
  TITLE_DEFS.forEach(([key, goal, steps]) => steps.forEach(([n, name]) => {
    const d = got[key + '-' + n]; ord++;
    if (d) add(key + '-' + n, name, goal(n), d, ord);
  }));
  FIRSTS.forEach(([slug, name, goal, when]) => { ord++; const d = when(); if (d) add(slug, name, goal, d, ord); });
  return out.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.ord - a.ord);
}
let TITLES = [];
/* the worn title: his pick if still unlocked, else the newest */
function worn() {
  const pick = get('title', null);
  return TITLES.filter(t => t.slug === pick)[0] || TITLES[0] || null;
}

/* ═══════════════════════════ WHAT POPS ═══════════════════════════
   A feat pops once, on whichever device opens SHEET first, and never again:
   its `feat` row is keyed by the feat's own id, which is the same on every
   device, so a second device writes the same row rather than a copy (root
   CLAUDE.md, Known traps). Anything older than a week before SHEET was first
   opened goes straight into the history without popping, or a year of
   records would all arrive at once. */
const seen = id => Rec.has('feat', null, id) || !!Rec.tombstone('feat', null, id);
function since() {
  let s = get('since', null);
  if (!s) { s = Day.shift(Day.today(), -6); put('since', s); }
  return s;
}
const fresh = feats => { const s = since(); return feats.filter(f => f.date >= s && !seen(f.id)); };
/* Feats and titles in one queue, oldest first; a title after the feat that earned it. */
const queue = () => fresh(FEATS).concat(fresh(TITLES))
  .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.kind === 'title') - (b.kind === 'title'));
const markSeen = f => { if (!Rec.has('feat', null, f.id)) Rec.set('feat', null, f.id, { t: Date.now(), date: f.date }); };

/* ═══════════════════════════ THE PICTURE ═══════════════════════════ */
const style = () => { const s = get('style', 'block'); return Notice.STYLES[s] ? s : 'block'; };
const canDraw = () => !!(window.Notice && Notice.parse && Notice.draw && Notice.compose);
function windowOf(f) {
  const win = Notice.draw(Notice.parse(f.text, 'auto'), style(), { seed: 0 });
  return f.kind === 'title' ? win : withTitle(win);
}
/* The worn title in a band over the window, in the window's own palette, so
   the band and the window scale onto the story as one picture. A TITLE
   UNLOCKED window already names its title, so it goes without. */
function withTitle(win) {
  const t = worn();
  if (!t) return win;
  const st = Notice.get(style()), band = 230;
  const c = document.createElement('canvas');
  c.width = win.width; c.height = win.height + band;
  const x = c.getContext('2d'), cx = c.width / 2;
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = '700 36px "' + st.face + '", "Chakra Petch", sans-serif';
  x.fillStyle = st.mute;
  if ('letterSpacing' in x) x.letterSpacing = '10px';
  x.fillText('TITLE', cx, 92);
  if ('letterSpacing' in x) x.letterSpacing = '0px';
  let px = 84;
  const name = st.brackets ? '[' + t.title + ']' : t.title;
  do { x.font = '700 ' + px + 'px "' + st.face + '", "Chakra Petch", sans-serif'; px -= 4; }
  while (x.measureText(name).width > c.width - 160 && px > 40);
  x.fillStyle = st.acc; x.shadowColor = st.glow; x.shadowBlur = 24;
  x.fillText(name, cx, 190);
  x.shadowBlur = 0; x.shadowColor = 'transparent';
  x.drawImage(win, 0, band);
  return c;
}
function storyOf(f) {
  const c = document.createElement('canvas');
  Notice.compose(c, windowOf(f), style(), { frame: 'story', back: 'dark', fill: 0.86 });
  return c;
}
function savePicture(f) {
  let png;
  try { png = storyOf(f).toDataURL('image/png'); } catch (e) { UI.toast('Could not draw the picture', { bad: true }); return; }
  Rec.patch('feat', null, f.id, { t: (Rec.get('feat', null, f.id) || {}).t || Date.now(), saved: Date.now() });
  Mobile.feedback('success');
  IO.handOver(png, (f.kind === 'title' ? '' : 'feat-') + f.id.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.png');
}

/* One window at a time, the way a game hands them out: NEXT walks the queue,
   and every window is marked shown the moment it is on screen. */
function showWindows(list, start) {
  if (!list.length) return;
  let i = start || 0;
  Mobile.feedback('open');
  UI.dialog({
    title: 'NOTICE', width: 520,
    body: (b, h) => {
      const stage = document.createElement('div'); stage.className = 'stage';
      const n = document.createElement('div'); n.className = 'count';
      b.appendChild(stage); b.appendChild(n);
      const paint = () => {
        const f = list[i];
        stage.innerHTML = '';
        if (canDraw()) stage.appendChild(windowOf(f));
        else stage.textContent = f.text.replace(/^#.*\n/, '');
        n.textContent = Day.label(f.date) + (list.length > 1 ? ' · ' + (i + 1) + ' of ' + list.length : '');
        markSeen(f);
        const nx = h.panel && h.panel.querySelector('.mb-btn.go');
        if (nx) nx.textContent = i < list.length - 1 ? 'NEXT' : 'DONE';
      };
      h.paint = paint;
      paint();
    },
    actions: [
      { label: 'SAVE PICTURE', fn: () => { savePicture(list[i]); return false; } },
      { label: list.length > 1 ? 'NEXT' : 'DONE', kind: 'go', fn: h => {
        if (i < list.length - 1) { i++; h.paint(); Mobile.feedback('select'); return false; }
      } },
    ],
    onClose: () => draw(),
  });
}

/* Tap a title to wear it. The one write: his pick. */
function wear(t) {
  if (!t || (worn() || {}).slug === t.slug) return;
  put('title', t.slug);
  Mobile.feedback('select');
  draw();
}

/* ═══════════════════════════ THE SCREEN ═══════════════════════════ */
let FEATS = [];
function draw() {
  FEATS = allFeats();
  TITLES = allTitles(FEATS);
  const m = document.getElementById('main');
  m.innerHTML = '';
  const neu = queue();
  const top = document.createElement('div'); top.className = 'top';
  m.appendChild(top);

  if (neu.length) {
    const c = document.createElement('section'); c.className = 'card mb-card';
    c.innerHTML = '<h2>NEW</h2><div class="muted">' + (neu.length === 1 ? 'One window waiting.' : neu.length + ' windows waiting.') + '</div>';
    const b = document.createElement('button'); b.className = 'mb-btn go mb-press mb-tap'; b.textContent = 'OPEN';
    b.onclick = () => showWindows(queue());
    c.appendChild(b); top.appendChild(c);
  }

  const t = document.createElement('section'); t.className = 'card mb-card';
  const count = k => FEATS.filter(f => f.kind === k).length;
  t.innerHTML = '<h2>FEATS</h2><div class="tally">' +
    '<div><span class="big">' + fmt(FEATS.length) + '</span><span class="muted">earned</span></div>' +
    '<div><span class="big">' + fmt(count('record')) + '</span><span class="muted">record days</span></div>' +
    '<div><span class="big">' + fmt(count('weeks') + count('streak') + count('target')) + '</span><span class="muted">streaks</span></div></div>';
  const sg = document.createElement('div'); sg.className = 'seg';
  sg.innerHTML = '<h2>WINDOW STYLE</h2>';
  sg.appendChild(UI.segmented(Notice.list(), style(), v => { put('style', v); Mobile.feedback('select'); }));
  t.appendChild(sg);
  top.appendChild(t);

  /* TITLES: the worn one, and every unlocked one, newest first. Tap to wear. */
  const tc = document.createElement('section'); tc.className = 'card mb-card';
  tc.innerHTML = '<h2>TITLES ' + TITLES.length + '/' + TITLE_COUNT + '</h2>';
  const w = worn();
  if (!w) {
    const e = document.createElement('div'); e.className = 'muted'; e.textContent = 'None unlocked.';
    tc.appendChild(e);
  } else {
    const wr = document.createElement('div'); wr.className = 'worn';
    wr.innerHTML = '<span class="tx"><small>WORN</small><b>' + UI.esc(w.title) + '</b></span>';
    const v = document.createElement('button'); v.className = 'mb-btn mb-press mb-tap'; v.textContent = 'VIEW';
    v.onclick = () => showWindows([w]);
    wr.appendChild(v); tc.appendChild(wr);
    const tl = document.createElement('div'); tl.className = 'tlist';
    const newT = {}; neu.forEach(f => newT[f.id] = 1);
    TITLES.forEach(t => {
      const b = document.createElement('button');
      const on = t.slug === w.slug;
      b.className = 'feat mb-plate mb-press' + (on ? ' on' : '') + (newT[t.id] ? ' new' : '');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.innerHTML = '<span class="tx"><b>' + UI.esc(t.title) + '</b><small>' + UI.esc(t.goal) + '</small></span>' +
        '<span class="dt">' + UI.esc(Day.short(t.date)) + '</span>';
      b.onclick = () => wear(t);
      tl.appendChild(b);
    });
    tc.appendChild(tl);
  }
  m.appendChild(tc);

  const hcard = document.createElement('section'); hcard.className = 'card mb-card';
  hcard.innerHTML = '<h2>HISTORY</h2>';
  if (!FEATS.length) {
    const e = document.createElement('div'); e.className = 'muted';
    e.textContent = 'Nothing yet. Log a session in TRAIN or a day in STATUS and the first window appears here.';
    hcard.appendChild(e);
  }
  let month = '', box = null;
  const list = document.createElement('div'); list.className = 'hlist';
  if (FEATS.length) hcard.appendChild(list);
  const newIds = {}; neu.forEach(f => newIds[f.id] = 1);
  FEATS.slice(0, 300).forEach(f => {
    const mo = f.date.slice(0, 7);
    if (mo !== month) {
      month = mo;
      const h = document.createElement('div'); h.className = 'month';
      h.textContent = new Date(f.date + 'T12:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' }).toUpperCase();
      list.appendChild(h);
      box = document.createElement('div'); box.className = 'feats'; list.appendChild(box);
    }
    const b = document.createElement('button');
    b.className = 'feat mb-plate mb-press' + (newIds[f.id] ? ' new' : '');
    b.innerHTML = '<span class="tx"><b>' + UI.esc(f.title) + '</b><small>' + UI.esc(f.sub || '') + '</small></span>' +
      '<span class="dt">' + UI.esc(Day.short(f.date)) + '</span>';
    b.onclick = () => showWindows([f]);
    box.appendChild(b);
  });
  if (FEATS.length > 300) {
    const e = document.createElement('div'); e.className = 'muted';
    e.textContent = fmt(FEATS.length - 300) + ' older feats are not listed.';
    hcard.appendChild(e);
  }
  m.appendChild(hcard);
}

let drawT = null;
const soon = () => { clearTimeout(drawT); drawT = setTimeout(draw, 300); };
draw();
Rec.ready(() => {
  draw();
  /* Pops by itself once per open, after the big half of the store is in. */
  const neu = queue();
  if (neu.length) showWindows(neu);
});
Rec.on(soon);
Day.on(soon);
if (document.fonts) document.fonts.ready.then(soon).catch(() => {});
</script>
</body>
</html>
