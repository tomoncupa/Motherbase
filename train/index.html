<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mb-version" content="1.0.10, 2026-09-19">
<title>TRAIN</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛭</text></svg>">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="../shared/fonts/fonts.css" rel="stylesheet">

<script src="../shared/skins.js"></script>
<script src="../shared/day.js"></script>
<script src="../shared/records.js"></script>
<script src="../shared/mobile.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/io.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/chart.js"></script>
<script src="../shared/health.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}

/* ── the top bar ──
   FitNotes: drawer, title, then calendar, add and overflow. Icons are drawn
   here as SVG; nothing is lifted from the app. */
header{
  flex:0 0 auto;display:flex;align-items:center;
  padding:calc(var(--s-2) + var(--safe-t)) var(--s-2) var(--s-2);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-4);
  letter-spacing:.14em;padding-left:var(--s-2)}
.logo b{color:var(--accent)}
.spacer{flex:1}
/* One icon button shape for the whole app: a --tap target with a glyph a little bigger than the text. */
.ico{width:var(--tap);height:var(--tap);flex:0 0 auto;border:0;background:none;
  cursor:pointer;color:var(--text-2);border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;padding:0}
.ico svg{width:1.4em;height:1.4em;display:block}
.ico.on{color:var(--accent)}

/* ── the date strip ──
   FitNotes puts the day, and the two arrows that move it, directly under the
   title. The whole strip is also the swipe target: left and right move a day,
   which is how he already navigates without looking. */
.datebar{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-2);
  padding:var(--s-2) var(--s-3);background:var(--surface-2);
  box-shadow:var(--rim);touch-action:pan-y;user-select:none;
}
.datebar .arrow{
  width:var(--tap);height:var(--tap);flex:0 0 auto;border:0;background:none;cursor:pointer;
  color:var(--text-2);font-size:var(--f-5);line-height:1;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center}
.datebar .when{
  flex:1;min-width:0;text-align:center;border:0;background:none;cursor:pointer;
  color:inherit;font:inherit;padding:var(--s-2);border-radius:var(--radius-md);
  min-height:var(--tap);display:flex;align-items:center;justify-content:center}
/* One line, uppercase: "TODAY", or "WEDNESDAY, AUGUST 5". FitNotes shows the
   day itself, not how long ago it was — the calendar is where you go for
   that, and a second line here would push the workout down the screen. */
.datebar .when .d{font-family:var(--font-display);font-weight:var(--w-bold);
  font-size:var(--f-2);letter-spacing:.08em;display:block;line-height:1.2;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebar .when.future .d{color:var(--text-muted)}
/* The accent hairline under the date is FitNotes' one piece of chrome, and
   it is what tells you the bar above is a control and not a heading. */
.datebar{border-bottom:calc(var(--border-width) * 2) solid var(--accent)}

main{flex:1;min-height:0;display:flex;flex-direction:column;
  padding:var(--s-3) var(--s-3) calc(var(--s-5) + var(--safe-b))}
.wrap{max-width:calc(var(--s-10) * 5);margin:0 auto;width:100%;flex:1;
  display:flex;flex-direction:column;gap:var(--s-3)}

.card{border-radius:var(--radius-lg);background:var(--surface-1);
  padding:var(--s-4);box-shadow:var(--e-1),var(--rim)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-3)}
.empty{color:var(--text-muted);line-height:var(--lh-body)}

/* ── one exercise inside a day ──
   FitNotes gives each exercise its own card: the name across the top, a
   hairline in the accent colour under it, then the sets. The sets are set
   right, because the numbers are the thing you scan and a ragged left edge
   on a column of weights is unreadable. There are no set numbers here —
   those live on the training screen, where you are editing one of them. */
.exblock{border-radius:var(--radius-md);background:var(--surface-1);
  box-shadow:var(--e-1),var(--rim);overflow:hidden;display:flex;flex-direction:column}
.exblock .head{display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);min-height:var(--tap);cursor:pointer;
  border-bottom:var(--border-width) solid var(--cat,var(--accent))}
.exblock .head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:var(--f-4);color:var(--text-2)}
.sets{display:flex;flex-direction:column;padding:var(--s-2) var(--s-4) var(--s-3)}

/* Weight and reps are two right-aligned columns so they stack into a grid
   down the card. Tabular numerals keep 4.0 and 12.5 the same width. */
.setrow{display:flex;align-items:baseline;padding:var(--s-2) 0;
  font-variant-numeric:tabular-nums}
.setrow .cmt{width:1.25em;flex:0 0 auto;color:var(--accent);opacity:0;font-size:var(--f-2)}
.setrow.has-note .cmt{opacity:1}
.setrow .grow{flex:1}
.setrow .col{text-align:right;white-space:nowrap}
.setrow .col.w{min-width:7.5em}
.setrow .col.r{min-width:5.5em}
.setrow b{font-size:var(--f-4);font-weight:var(--w-bold);color:var(--text-2)}
.setrow .u{color:var(--text-muted);font-size:var(--f-2)}
.setrow.pr b{color:var(--accent)}
/* A warmup happened and does not count. Dimmed rather than hidden: it is part
   of what you did, just not part of what you did that counts. */
.setrow.warm{opacity:.55}
.setrow.warm b{font-weight:var(--w-body)}
.wtag{font-size:var(--f-1);letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);margin-left:var(--s-2)}

/* The complete tick, filled when every set in the exercise is done. */
.tickdot{width:1.4em;height:1.4em;flex:0 0 auto;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--accent-fg);font-size:var(--f-1);line-height:1}
.tickdot.off{background:none;box-shadow:inset 0 0 0 calc(var(--border-width) * 2) var(--border-strong)}

/* The workout's start and end, the card FitNotes puts above the first
   exercise. Shown only when there is a time recorded. */
.timecard{display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);border-radius:var(--radius-md);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);
  font-variant-numeric:tabular-nums;color:var(--text-2)}
.timecard .rng{flex:1;font-size:var(--f-4)}
.timecard .len{color:var(--text-muted)}

.daynote{color:var(--text-2);line-height:var(--lh-body);font-size:var(--f-2)}

/* ── the empty day ──
   "Workout Log Empty" sits in the middle, and the two things you actually do
   next sit near the bottom where the thumb is. */
/* No height in vh. On an iPhone 1vh is a hundredth of the screen with Safari's
   toolbars hidden, so a 52vh minimum asked for more room than the page had and
   pushed Copy Previous Workout off the bottom, 130px too tall at 390x664.
   flex:1 fills whatever is really there. */
.emptyday{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s-4)}

/* ── a wide control inside a UI.row ──
   shared/ui.js stacks a row whose control is a text box or a select (fixed
   2026-09-14). A row of swatches or chips is TRAIN's own and is stacked here. */
.mb-row:has(> .swatches),
.mb-row:has(> .mb-chips){flex-direction:column;align-items:stretch;gap:var(--s-2)}
.mb-row:has(> .swatches) > .lbl,
.mb-row:has(> .mb-chips) > .lbl{flex:none}
/* Same vh trap as the empty day: svh is the screen with toolbars showing. */
.chartbox.big{height:60vh;height:60svh}
.emptyday .say{color:var(--text-muted);font-size:var(--f-5)}
.startbox{display:flex;flex-direction:column;align-items:center;gap:var(--s-5);
  padding-bottom:var(--s-5)}
.bigact{display:flex;flex-direction:column;align-items:center;gap:var(--s-2);
  border:0;background:none;cursor:pointer;color:var(--text-2);font:inherit;
  padding:var(--s-3) var(--s-4);border-radius:var(--radius-md);min-height:var(--tap)}
.bigact svg{width:1.75em;height:1.75em;color:var(--accent)}

/* No floating button: FitNotes puts add in the top bar, and a FAB here would
   sit on top of the last set of the day. */

/* ══════════ THE EXERCISE PICKER ══════════
   A search field pinned above a plain list. FitNotes shows categories first
   and drills into one; the search box cuts straight to exercises, because
   typing three letters beats two taps once you know what you want. */
.search{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-3);
  background:var(--surface-2);border-radius:var(--radius-md)}
.search svg{width:1.15em;height:1.15em;flex:0 0 auto;color:var(--text-muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--text-1);
  font:inherit;font-size:var(--f-3);padding:var(--s-2) 0;outline:none;
  min-height:var(--tap)}

.plist{display:flex;flex-direction:column;background:var(--surface-1);
  border-radius:var(--radius-md);box-shadow:var(--e-1),var(--rim);overflow:hidden}
.prow{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);
  min-height:var(--tap);cursor:pointer;border:0;background:none;color:inherit;
  font:inherit;text-align:left;border-bottom:var(--border-width) solid var(--border)}
.prow:last-child{border-bottom:0}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--f-4);color:var(--text-2)}
.prow .sub{font-size:var(--f-1);color:var(--text-muted);white-space:nowrap}
.prow .dot,.mrow .dot{width:var(--s-2);height:var(--s-2);border-radius:var(--radius-full);flex:0 0 auto;
  background:var(--cat,var(--border-strong))}
.prow.added .nm{color:var(--text-muted)}

/* ══════════ THE TRAINING SCREEN ══════════ */
.tabs{flex:0 0 auto;display:flex;background:var(--surface-1);box-shadow:var(--rim)}
.tabs button{flex:1;border:0;background:none;cursor:pointer;color:var(--text-muted);
  font-family:var(--font-display);font-size:var(--f-2);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);min-height:var(--tap);padding:var(--s-3) var(--s-2);
  border-bottom:calc(var(--border-width) * 2) solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* The field label with its hairline, exactly as FitNotes draws it. */
.fieldlabel{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);
  padding-bottom:var(--s-2);border-bottom:calc(var(--border-width) * 2) solid var(--accent);margin-bottom:var(--s-3)}

/* − [big number] +  — the control he uses more than any other in the app, so
   the buttons are oversized and the number is the biggest thing on screen. */
.stepper{display:flex;align-items:center;justify-content:center;gap:var(--s-3)}
.stepper button{width:var(--s-8);height:calc(var(--tap) + var(--s-2));flex:0 0 auto;border:0;cursor:pointer;
  border-radius:var(--radius-md);background:var(--surface-3);color:var(--text-2);
  font-size:var(--f-6);line-height:1;display:flex;align-items:center;justify-content:center}
.stepper input{width:8ch;min-width:0;text-align:center;border:0;border-bottom:var(--border-width) solid var(--border-strong);
  background:none;color:var(--text-1);font:inherit;font-size:var(--f-8);font-weight:var(--w-bold);
  font-variant-numeric:tabular-nums;padding:var(--s-2) 0;outline:none}
.stepper input:focus{border-bottom-color:var(--accent)}

.gobar{display:flex;gap:var(--s-3);margin-top:var(--s-4)}
.gobar button{flex:1;min-height:var(--tap);border:0;border-radius:var(--radius-md);
  cursor:pointer;font-family:var(--font-display);font-weight:var(--w-bold);
  font-size:var(--f-3);letter-spacing:var(--track-cap);color:var(--text-inverse)}
.gobar .save{background:var(--success)}
.gobar .clear{background:var(--info)}

/* The day's sets for this exercise. Tapping one loads it into the steppers
   above, which is how an existing set gets corrected. */
.tset{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) 0;
  border-bottom:var(--border-width) solid var(--border);cursor:pointer;
  font-variant-numeric:tabular-nums;min-height:var(--tap)}
.tset.sel{background:color-mix(in srgb, var(--accent) 14%, transparent)}
.tset .bub{width:var(--tap);height:var(--tap);flex:0 0 auto;border:0;background:none;cursor:pointer;
  color:var(--border-strong);display:flex;align-items:center;justify-content:center;padding:0}
.tset .bub.on{color:var(--accent)}
.tset .idx{width:2em;flex:0 0 auto;color:var(--text-muted);font-size:var(--f-2)}
.tset .grow{flex:1}
.tset .col{text-align:right;white-space:nowrap}
.tset .col.w{min-width:7em}
.tset .col.r{min-width:5em}
.tset b{font-size:var(--f-4);font-weight:var(--w-bold);color:var(--text-2)}
.tset .u{color:var(--text-muted);font-size:var(--f-2)}
.tset .chk{width:var(--tap);height:var(--tap);flex:0 0 auto;border:0;background:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tset .chk i{width:1.4em;height:1.4em;border-radius:var(--radius-sm);
  box-shadow:inset 0 0 0 calc(var(--border-width) * 2) var(--border-strong);display:flex;
  align-items:center;justify-content:center;font-size:var(--f-2);font-style:normal;line-height:1}
.tset .chk.on i{background:var(--accent);color:var(--accent-fg);box-shadow:none}

/* The previous time he did this movement, above the steppers. It is the one
   number that decides what he loads, so it is not buried in HISTORY. */
.lasttime{font-size:var(--f-2);color:var(--text-muted);line-height:var(--lh-body)}
.lasttime b{color:var(--text-2);font-variant-numeric:tabular-nums}

/* ══════════ THE DAY'S EXERCISES DRAWER ══════════ */
.dwrap{position:fixed;inset:0;z-index:60;display:none}
.dwrap.open{display:block}
.dwrap .scrim{position:absolute;inset:0;background:var(--overlay);
  opacity:0;transition:opacity var(--dur-med) var(--ease-out)}
.dwrap.in .scrim{opacity:1}
.dpanel{position:absolute;top:0;bottom:0;left:0;width:min(84vw, calc(var(--s-10) * 2.65));
  background:var(--surface-1);box-shadow:var(--e-4);display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform var(--dur-sheet) var(--ease-sheet);
  padding-top:var(--safe-t);padding-left:var(--safe-l)}
.dwrap.in .dpanel{transform:translateX(0)}
.dhead{padding:var(--s-4) var(--s-4) var(--s-3)}
.dhead b{font-family:var(--font-display);font-size:var(--f-2);letter-spacing:var(--track-cap)}
.dhead span{display:block;font-size:var(--f-1);color:var(--text-muted);margin-top:var(--s-2)}
.dlist{flex:1;min-height:0;overflow:auto}
.dfoot{border-top:var(--border-width) solid var(--border);padding-bottom:var(--safe-b)}
.dfoot button{display:flex;align-items:center;gap:var(--s-3);width:100%;border:0;
  background:none;cursor:pointer;color:var(--text-2);font:inherit;text-align:left;
  padding:var(--s-3) var(--s-4);min-height:var(--tap)}
.dfoot svg{width:1.25em;height:1.25em;flex:0 0 auto;color:var(--text-muted)}

/* ══════════ CALENDAR ══════════ */
.calhead{display:flex;align-items:center;gap:var(--s-2)}
.caltitle{flex:1;text-align:center;font-family:var(--font-display);font-weight:var(--w-bold);
  font-size:var(--f-3);letter-spacing:var(--track-cap)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s-1)}
.caldow{text-align:center;font-size:var(--f-1);color:var(--text-muted);
  letter-spacing:var(--track-cap);padding:var(--s-2) 0}
.calcell{min-height:var(--tap);border:0;background:none;cursor:pointer;color:var(--text-2);
  font:inherit;border-radius:var(--radius-sm);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--s-1);padding:var(--s-2) 0}
.calcell.empty{visibility:hidden;pointer-events:none}
.calcell .n{font-variant-numeric:tabular-nums;font-size:var(--f-3)}
.calcell .dots{display:flex;gap:var(--s-1);height:.4em}
.calcell .dots i{width:.4em;height:.4em;border-radius:var(--radius-full);display:block}
.calcell.today .n{background:var(--accent);color:var(--accent-fg);
  width:1.9em;height:1.9em;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center}
.calcell.sel{box-shadow:inset 0 0 0 calc(var(--border-width) * 2) var(--accent)}
.calcell.future{color:var(--text-muted);opacity:.45}
.calfoot{text-align:center;padding:var(--s-3);color:var(--text-muted);
  font-size:var(--f-1);letter-spacing:var(--track-cap)}
.calfoot b{color:var(--text-2)}

/* ══════════ ANALYSIS ══════════ */
.statrow{display:flex;justify-content:space-between;gap:var(--s-3);flex-wrap:wrap}
.statrow span{display:flex;flex-direction:column;font-size:var(--f-1);
  color:var(--text-muted);letter-spacing:var(--track-cap);text-transform:uppercase}
.statrow b{font-size:var(--f-4);color:var(--text-2);font-variant-numeric:tabular-nums;
  letter-spacing:0;text-transform:none}
.barrow{padding:var(--s-3) 0;border-bottom:var(--border-width) solid var(--border)}
.barrow:last-child{border-bottom:0}
.barrow .lbl{display:flex;justify-content:space-between;gap:var(--s-3);align-items:baseline}
.barrow .lbl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .lbl .v{color:var(--text-muted);font-size:var(--f-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:var(--s-2);border-radius:var(--radius-full);background:var(--surface-3);
  overflow:hidden;margin:var(--s-2) 0}
.track>i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-full)}
.barrow .sub,.sub{font-size:var(--f-1);color:var(--text-muted)}

/* ══════════ RECORDS ══════════ */
.recline{display:flex;align-items:baseline;gap:var(--s-3);padding:var(--s-2) 0}
.recline .k{flex:1;min-width:0;color:var(--text-muted);font-size:var(--f-2)}
.recline .v{font-variant-numeric:tabular-nums;color:var(--text-2)}
.recline .d{width:5.5em;text-align:right;color:var(--text-muted);font-size:var(--f-1)}

/* ══════════ THE REST TIMER BAR ══════════
   Pinned above the content, never over the SAVE button. It counts past zero
   on purpose: a browser tab that was suspended cannot claim it was counting,
   so it reports the truth from the clock instead. */
.restbar{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-2) var(--s-4);background:var(--surface-2);cursor:pointer;
  box-shadow:var(--rim);min-height:var(--tap);overflow:hidden}
.restbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);
  opacity:.16;transition:width var(--dur-fast) linear}
.restbar .lbl{position:relative;font-family:var(--font-display);font-size:var(--f-1);
  font-weight:var(--w-bold);letter-spacing:var(--track-cap);color:var(--text-muted)}
.restbar .t{position:relative;flex:1;text-align:right;font-variant-numeric:tabular-nums;
  font-size:var(--f-4);font-weight:var(--w-bold)}
.restbar.over .fill{background:var(--warn);opacity:.28}
.restbar.over .t{color:var(--warn)}

/* ══════════ THE APP MENU ══════════ */
.navrow{display:flex;align-items:center;gap:var(--s-3);width:100%;border:0;
  background:none;cursor:pointer;color:var(--text-2);font:inherit;text-align:left;
  padding:var(--s-3) var(--s-4);min-height:var(--tap)}
.navrow.on{color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent)}
.navrow svg{width:1.25em;height:1.25em;flex:0 0 auto}

/* ── the import panel ── */
.imp-stat{display:flex;justify-content:space-between;gap:var(--s-3);
  padding:var(--s-2) 0;font-size:var(--f-2);border-bottom:var(--border-width) solid var(--border)}
.imp-stat:last-child{border-bottom:0}
.imp-stat b{font-variant-numeric:tabular-nums}
.bar{height:var(--s-2);border-radius:var(--radius-full);background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;
  transition:width var(--dur-fast) linear}

/* ══════════ PARITY ══════════ */
.pad{padding:var(--s-3) var(--s-4)}
.ico:disabled{opacity:.3}
.ico .mb-ico,.stepper .mb-ico,.gobar .mb-ico{width:1.4em;height:1.4em;display:block}
/* A row with a main button and its own menu button. Buttons cannot nest, so
   the row is a div and each half is its own target. */
div.prow{padding:0}
.prow .pmain{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);min-height:var(--tap);border:0;background:none;
  color:inherit;font:inherit;text-align:left;cursor:pointer}
.prow .rowmenu{color:var(--text-muted)}
.prow .fav{color:var(--accent);display:flex}
.prow .fav .mb-ico{width:1em;height:1em}
.mrow{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap);
  border-bottom:var(--border-width) solid var(--border)}
.mrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .count{width:5em;flex:0 0 auto;text-align:right}
.swatches{display:flex;flex-wrap:wrap;gap:var(--s-2);max-width:calc(var(--tap) * 6 + var(--s-2) * 5)}
.swatch{width:var(--tap);height:var(--tap);border-radius:var(--radius-full);cursor:pointer;
  border:calc(var(--border-width) * 2) solid var(--surface-1);box-shadow:0 0 0 var(--border-width) var(--border)}
.swatch.on{box-shadow:0 0 0 calc(var(--border-width) * 3) var(--accent)}
.rmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.75em,1fr));gap:var(--s-2)}
.rmcell{display:flex;flex-direction:column;align-items:center;padding:var(--s-2);
  border-radius:var(--radius-sm);background:var(--surface-2);font-variant-numeric:tabular-nums}
.rmcell span{font-size:var(--f-1);color:var(--text-muted)}
.rmcell b{font-size:var(--f-3);color:var(--text-1)}
.rmcell.none b{color:var(--text-muted)}
.bigtime{text-align:center;font-size:var(--f-9);font-weight:var(--w-bold);line-height:var(--lh-tight);
  font-variant-numeric:tabular-nums;padding:var(--s-3) 0;color:var(--text-1)}
.bigtime .u{font-size:var(--f-3);color:var(--text-muted);font-weight:var(--w-body)}
.bigtime.over{color:var(--warn)}
.steplbl{min-width:5em;text-align:center;font-size:var(--f-5);font-weight:var(--w-bold);
  font-variant-numeric:tabular-nums}
.chartbox{height:calc(var(--s-10) + var(--s-8));cursor:pointer}
.chartbox .mb-dot{opacity:.85}
.trend{fill:none;stroke:var(--text-muted);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.calbanner{background:var(--accent);color:var(--accent-fg);text-align:center;font-weight:var(--w-bold);
  padding:var(--s-3);border-radius:var(--radius-md)}
.calmonth .caltitle{padding:var(--s-3) 0}
.calcount{position:sticky;bottom:0;display:flex;align-items:center;gap:var(--s-2);
  background:var(--surface-2);border-radius:var(--radius-md);box-shadow:var(--e-2)}
.calcount .n{flex:1;text-align:center;color:var(--text-muted);font-size:var(--f-1);letter-spacing:var(--track-cap)}
.calcount .n b{color:var(--text-2)}
.catname{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);text-transform:uppercase}
.sstag{font-size:var(--f-1);padding:0 var(--s-2);border-radius:var(--radius-full);
  color:var(--accent-fg);font-weight:var(--w-bold);white-space:nowrap}
.moresets{font-size:var(--f-1);color:var(--text-muted);text-align:right;padding-top:var(--s-1)}
.fieldrow + .fieldlabel{margin-top:var(--s-4)}
.tset .reorder{display:flex}
.tset.warm{opacity:.55}
.tickdot .mb-ico,.tset .chk .mb-ico{width:.9em;height:.9em}
.datebar .arrow .mb-ico{width:1.2em;height:1.2em}
.dhead .mb-ico{width:1em;height:1em}
.kindsel{margin-top:var(--s-2)}

/* ══════════ TRAINING, NOT WORKING OUT ══════════ */
/* The session strip: its name, and the block and week it sits in. */
.sesshead{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-2) var(--s-2) var(--s-4);
  min-height:var(--tap);border-radius:var(--radius-md);background:var(--surface-1);
  box-shadow:var(--e-1),var(--rim);cursor:pointer}
.sesshead .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.sesshead .nm b{font-family:var(--font-display);font-size:var(--f-4);font-weight:var(--w-bold);
  color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sesshead .nm b.none{color:var(--text-muted);font-weight:var(--w-body)}
.sesshead .nm span{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sesshead.flat{box-shadow:none;background:none;padding:0;cursor:default}
.prow > .mb-ico{width:1.25em;height:1.25em;flex:0 0 auto;color:var(--text-muted)}

/* Set by set: the change against the same working set last time. */
.dl{font-size:var(--f-1);font-weight:var(--w-bold);font-variant-numeric:tabular-nums;
  white-space:nowrap;color:var(--text-muted);margin-left:var(--s-2)}
.dl.up{color:var(--success)}
.dl.down{color:var(--warn)}
.vsline{display:flex;gap:var(--s-2);flex-wrap:wrap;justify-content:space-between;
  padding:var(--s-2) var(--s-4) 0;font-size:var(--f-1);color:var(--text-muted)}
.vsline b{color:var(--text-2);font-weight:var(--w-bold)}
.tset .tmeta{display:block;text-align:right;font-size:var(--f-1);color:var(--text-muted);
  line-height:var(--lh-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tset .tmeta .dl{margin-left:0}
.setrow{flex-wrap:wrap}
.setrow .smeta{flex-basis:100%;text-align:right;line-height:var(--lh-tight)}
.setrow .smeta .dl{margin-left:0}
.recap .gain{font-family:var(--font-display);font-size:var(--f-4);font-weight:var(--w-bold);
  color:var(--text-2);font-variant-numeric:tabular-nums}
.recap .gain.up{color:var(--success)}
.recap .gain.down{color:var(--warn)}
.tset .grow{min-width:0}

/* Setup: straps, seat height, pads. Toggles are chips, settings are small boxes. */
.setup{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2)}
.setup .sufield{display:flex;align-items:center;gap:var(--s-2);font-size:var(--f-2);color:var(--text-2)}
.setup .sufield .mb-input{width:4.5em;min-width:0;text-align:center}
.setup .ico{margin-left:auto}
.sulist .ico{color:var(--text-muted)}

/* ── the card: a session, a week or a profile, made to be shared ──
   One shape for all three, drawn from tokens only, so the picture is in the
   theme he is wearing. */
.recap{border-radius:var(--radius-lg);background:var(--surface-1);box-shadow:var(--e-2),var(--rim);
  padding:var(--s-5);display:flex;flex-direction:column;gap:var(--s-4);overflow:hidden}
.recap .eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3);
  font-size:var(--f-1);letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--text-muted)}
.recap .eyebrow span{white-space:nowrap;flex:0 0 auto}
.recap .eyebrow b{color:var(--accent);font-weight:var(--w-bold);text-align:right;min-width:0}
.recap .title{font-family:var(--font-display);font-size:var(--f-7);font-weight:var(--w-bold);
  line-height:var(--lh-tight);color:var(--text-1);overflow-wrap:anywhere}
.recap .rule{height:calc(var(--border-width) * 2);background:var(--accent)}
.recap .big4{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4) var(--s-3)}
.recap .big4 > div{display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.recap .big4 span{font-size:var(--f-1);letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--text-muted)}
.recap .big4 b{font-family:var(--font-display);font-size:var(--f-6);font-weight:var(--w-bold);
  font-variant-numeric:tabular-nums;color:var(--text-1);line-height:var(--lh-tight);white-space:nowrap}
.recap .big4 small{font-size:var(--f-2);color:var(--text-muted);font-weight:var(--w-body)}
.recap .big4 em{font-style:normal;font-size:var(--f-1);color:var(--text-muted);font-variant-numeric:tabular-nums}
.recap h3{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-2)}
.recap .strong{color:var(--text-2)}
.recap .strong b{font-family:var(--font-display);font-size:var(--f-5);color:var(--text-1)}
.recap .ticks{display:flex;flex-wrap:wrap;gap:var(--s-1);margin-top:var(--s-3)}
.recap .ticks i{width:var(--s-3);height:var(--s-3);border-radius:var(--radius-sm);background:var(--surface-3)}
.recap .ticks i.up{background:var(--success)}
.recap .ticks i.down{background:var(--warn)}
.recap .ticks i.new{background:none;box-shadow:inset 0 0 0 var(--border-width) var(--border-strong)}
.recap .musc{display:flex;flex-direction:column;gap:var(--s-2)}
.recap .mrow2,.recap .mhead{display:grid;grid-template-columns:7em 1fr 2.5em;align-items:center;
  gap:var(--s-3);font-size:var(--f-2)}
.recap .mrow2.wk,.recap .mhead{grid-template-columns:7em 1fr 2.5em 2.5em}
.recap .mhead h3{grid-column:1 / 3;margin:0}
.recap .mhead span{font-size:var(--f-1);color:var(--text-muted);text-align:right;letter-spacing:var(--track-cap)}
.recap .mrow2 .nm{display:flex;align-items:center;gap:var(--s-2);min-width:0;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recap .dot,.heat .dot{width:var(--s-2);height:var(--s-2);border-radius:var(--radius-full);flex:0 0 auto;display:inline-block}
.recap .bar2{height:var(--s-2);border-radius:var(--radius-full);background:var(--surface-3);overflow:hidden}
.recap .bar2 i{display:block;height:100%;border-radius:var(--radius-full)}
.recap .mrow2 b,.recap .mrow2 em{font-variant-numeric:tabular-nums;text-align:right}
.recap .mrow2 b{color:var(--text-1)}
.recap .mrow2 em{font-style:normal;color:var(--text-muted)}
.recap .rec{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) 0;
  border-top:var(--border-width) solid var(--border)}
.recap .rec .mb-ico{width:1.2em;height:1.2em;color:var(--accent);flex:0 0 auto}
.recap .rec .nm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;
  gap:var(--s-1);color:var(--text-2);overflow-wrap:anywhere}
.recap .rec .v{font-variant-numeric:tabular-nums;color:var(--text-1);font-weight:var(--w-bold);white-space:nowrap}
.recap .rec .v small{color:var(--text-muted);font-weight:var(--w-body)}
.recap .pill{font-style:normal;font-size:var(--f-1);letter-spacing:.06em;text-transform:uppercase;padding:0 var(--s-2);
  border-radius:var(--radius-full);background:color-mix(in srgb, var(--accent) 18%, transparent);
  color:var(--accent);white-space:nowrap}
.recap .sub{font-size:var(--f-1);color:var(--text-muted);line-height:var(--lh-body)}
.recap .mark{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:.14em;
  color:var(--text-muted);text-align:right}
.recap .mark b{color:var(--accent)}

/* The week: arrows either side of which week it is. */
.weeknav{display:flex;flex-direction:row;align-items:center;gap:var(--s-2)}
.weeknav .t{flex:1;text-align:center;font-family:var(--font-display);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);font-size:var(--f-2)}
/* Eight weeks of sets per muscle. Read-only: a cell is too small to be a
   target, so the arrows above are how a week is opened. */
.heat{display:grid;gap:var(--s-1);align-items:center;font-size:var(--f-1)}
.heat .hn{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:var(--s-2);min-width:0}
.heat .hh{text-align:center;color:var(--text-muted)}
.heat .hh.on{color:var(--accent);font-weight:var(--w-bold)}
.heat .hc{min-height:var(--s-6);border-radius:var(--radius-sm);display:flex;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums;color:var(--text-1);background:var(--surface-2)}
.heat .hc.on{box-shadow:inset 0 0 0 calc(var(--border-width) * 2) var(--accent)}
</style>
</head>
<body>
<header>
  <button class="ico mb-press mb-tap" id="drawer" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div class="logo">TRA<b>IN</b></div>
  <div class="spacer"></div>
  <button class="ico mb-press mb-tap" id="calBtn" aria-label="Calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
  <button class="ico mb-press mb-tap" id="addBtn" aria-label="Add an exercise">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ico mb-press mb-tap" id="timerBtn" aria-label="Rest timer" style="display:none"></button>
  <button class="ico mb-press mb-tap" id="trophyBtn" aria-label="Personal records" style="display:none"></button>
  <button class="ico mb-press mb-tap" id="infoBtn" aria-label="Exercise overview" style="display:none"></button>
  <button class="ico mb-press mb-tap" id="moreBtn" aria-label="More">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button>

<div class="datebar" id="datebar">
  <button class="arrow mb-press mb-tap" id="prev" aria-label="Previous day"></button>
  <button class="when mb-press mb-tap" id="when" aria-label="Jump to today"></button>
  <button class="arrow mb-press mb-tap" id="next" aria-label="Next day"></button>
</div>

<div class="tabs" id="tabs" style="display:none">
  <button class="mb-press" data-tab="track">TRACK</button>
  <button class="mb-press" data-tab="history">HISTORY</button>
  <button class="mb-press" data-tab="graph">GRAPH</button>
</div>

  <span class="fill"></span><span class="lbl">REST</span><span class="t"></span>
</div>

<main class="mb-scroll"><div class="wrap" id="main"></div></main>

<div class="dwrap" id="dwrap">
  <div class="scrim" id="dscrim"></div>
  <div class="dpanel">
    <div class="dhead" id="dhead"></div>
    <div class="dlist mb-scroll" id="dlist"></div>
    <div class="dfoot" id="dfoot"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   TRAIN — the training log.

   A reproduction of FitNotes v25.1 on the Motherbase foundation. The brief
   that governs this file is train/CLAUDE.md, next to it. Read that first:
   it says what is deliberate and what would be a bug.

   Nothing in here is copied from FitNotes. What was taken from the app is its
   schema, its labels and its behaviour — facts about how it works — and every
   line below was written against those.
   ═══════════════════════════════════════════════════════════════════════════ */

var APP = {
  id: 'train',
  name: 'Train',
  icon: '⛭',
  blurb: 'the training log',
  /* every type TRAIN owns. `tick` is not here: it is shared, and declaring it
     would claim a type the master brief says belongs to everyone. */
  types: ['excat', 'exercise', 'set', 'session', 'sgroup',
          'program', 'progday', 'progex', 'goal', 'phase'],
};

Skins.load('../shared/skins.json').then(function () { Skins.restore(APP.id); });
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
IO.register({ app: APP.id, name: APP.name, types: APP.types,
  sheets: function () { return exportSheets(); } });

/* Everything hangs off one global on purpose. `var` at the top level of a
   classic script is a property of window; `let` and `const` are not, and the
   test harness has to be able to reach in. */
var TRAIN = window.TRAIN = {};

/* ═══════════════════ UNITS ═══════════════════
   Every set stores kg, the true weight, and u, the unit it was typed in.
   Display converts. This is what let four years of mixed kg and lb entries
   survive in one log, and it is why nothing here ever writes a converted
   number back over a stored one. */
var LB_PER_KG = 2.20462262185;
var UNIT = { 0: 'kg', 1: 'lb', 2: 'lb' };   /* FitNotes: 0 metric, 1 and 2 imperial */

TRAIN.toUnit = function (kg, unit) {
  return unit === 'lb' ? kg * LB_PER_KG : kg;
};
TRAIN.toKg = function (v, unit) {
  return unit === 'lb' ? v / LB_PER_KG : v;
};
/* Everything on screen is shown in the unit currently chosen, not the unit
   each set was typed in. That is what FitNotes does: the stored kilograms are
   the truth, the display setting decides how they read, and its "Change
   Weight Unit → Convert Existing Values / Just Change Unit" dialog only makes
   sense on those terms. It also means two units never appear on one screen,
   which they did in the first version of this file.

   `u` on a set is still recorded. It is what he typed, and it is how a set
   entered as 500 lb can be shown as exactly 500 again rather than 226.8. */
TRAIN.unit = function () { return Rec.setting(APP.id, 'unit') || 'lb'; };

/* One decimal always, the way FitNotes prints it: 4.0 kgs, 12.5 kgs. A set
   typed in this unit is shown back exactly, without a float's fingerprints. */
TRAIN.showWeight = function (kg, typedIn) {
  var unit = TRAIN.unit();
  var v = TRAIN.toUnit(kg, unit);
  if (typedIn === unit) v = Math.round(v * 1000) / 1000;   /* it was typed here; trust it */
  return (Math.round(v * 10) / 10).toFixed(1);
};
/* FitNotes writes the unit plural in the log: "kgs", "lbs". */
TRAIN.unitLabel = function () { return TRAIN.unit() + 's'; };

/* ═══════════════════ CATEGORY COLOUR SLOTS ═══════════════════
   A category stores a slot, never a hex. Six theme colours, each in a light
   and a dark tint, so nine muscle groups all get something readable and every
   one of them changes when the skin changes. */
TRAIN.SLOTS = 12;
TRAIN.slotColor = function (slot) {
  var s = ((slot | 0) % TRAIN.SLOTS + TRAIN.SLOTS) % TRAIN.SLOTS;
  /* The token itself, not the colour it held when this ran, so changing the
     theme recolours every category without anything being redrawn. */
  var base = 'var(--data-' + (s % 6 + 1) + ')';
  /* The second tint is the same hue held further from the page background, so
     it stays distinct in a light skin and in a dark one. */
  return s < 6 ? base : 'color-mix(in srgb, ' + base + ' 62%, var(--text-1))';
};

/* ═══════════════════ IDS ═══════════════════
   The clock alone is not unique: two rows made in the same millisecond derive
   the same row id and the second silently replaces the first. Counter for
   this session, random tail for two devices in the same millisecond. */
var seq = 0;
TRAIN.newId = function () {
  return Rec.USER + '-' + Date.now().toString(36) + '-' +
    (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
};

/* ═══════════════════ THE INDEX ═══════════════════
   Rec.all walks every row in the store for each call. With twelve thousand
   sets that is fine once and wasteful thirty times, so TRAIN keeps its own
   two maps and rebuilds them when the store changes. Everything on screen
   reads these, never Rec.all. */
TRAIN.idx = { byDate: {}, byEx: {}, built: 0 };

TRAIN.reindex = function () {
  var byDate = {}, byEx = {};
  var all = Rec.all('set');
  for (var i = 0; i < all.length; i++) {
    var r = all[i], p = r.payload;
    /* Named rather than copied wholesale, so a field added to a set has to be
       added here too or it silently never reaches anything that reads the
       index. `warm` was exactly that on the day it was added. */
    var rec = { key: r.key, date: r.date, ex: p.ex, kg: p.kg, r: p.r, u: p.u,
                done: p.done, pr: p.pr, prf: p.prf, dist: p.dist, dur: p.dur,
                note: p.note, ord: p.ord, su: p.su,
                /* Read off the comment, and a mark made by hand wins either
                   way. See "what a comment says". */
                warm: p.warm === 1 || p.warm === true ||
                  (p.warm !== 0 && p.warm !== false && TRAIN.noteWarm(p.note)) ? 1 : 0,
                split: p.note ? TRAIN.noteSplit(p.note, p.r) : null };
    (byDate[r.date] || (byDate[r.date] = [])).push(rec);
    (byEx[p.ex] || (byEx[p.ex] = [])).push(rec);
  }
  var k;
  for (k in byDate) byDate[k].sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
  for (k in byEx) byEx[k].sort(function (a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ord || 0) - (b.ord || 0);
  });
  TRAIN.idx = { byDate: byDate, byEx: byEx, built: Date.now() };
  return TRAIN.idx;
};

    var st = TRAIN.setStamp(s);

  });

   TRAIN re-asserts rather than argues. Any app may tick a training day; only
   TRAIN gets to say whether it is true, and it says so again every time the
   day's sets change and every time it looks at the day. Because the store
   merges on updated_at, TRAIN's write is always the newer one.

  if (!date) return;

    if (!cur || cur.src !== APP.id || cur.qty !== n) {

/* ═════════════════════════════════════════════════════════════════════════
   THE SQLITE READER

   A FitNotes backup is its database with the extension changed: the file
   begins "SQLite format 3". So the importer is a reader for that format,
   written here in plain JavaScript with no library, because an importer that
   needs the network breaks offline-first on the one job that matters most.

   It reads tables. It does not run SQL, it does not use indexes, and it does
   not write anything. Walk the b-tree from a table's root page, decode each
   leaf cell, hand back rows.
   ═════════════════════════════════════════════════════════════════════════ */
var SQLiteFile = TRAIN.SQLiteFile = function (buf) {
  this.b = new Uint8Array(buf);
  this.dv = new DataView(buf);
  if (this.text(0, 15) !== 'SQLite format 3')
    throw new Error('This is not a FitNotes backup. The file does not start with "SQLite format 3".');
  this.pageSize = this.dv.getUint16(16);
  if (this.pageSize === 1) this.pageSize = 65536;
  this.reserved = this.b[20];
  this.usable = this.pageSize - this.reserved;
  this.dec = new TextDecoder('utf-8');
  this.master = null;
};

SQLiteFile.prototype.text = function (off, len) {
  var s = '';
  for (var i = 0; i < len; i++) s += String.fromCharCode(this.b[off + i]);
  return s;
};

/* SQLite's variable length integer: seven bits a byte, high bit continues,
   and a ninth byte contributes all eight. */
SQLiteFile.prototype.varint = function (off) {
  var v = 0, i, b;
  for (i = 0; i < 8; i++) {
    b = this.b[off + i];
    v = v * 128 + (b & 0x7f);
    if (!(b & 0x80)) return [v, i + 1];
  }
  return [v * 256 + this.b[off + 8], 9];
};

/* Page 1 carries the 100 byte file header before its b-tree header. */
SQLiteFile.prototype.pageStart = function (n) { return (n - 1) * this.pageSize; };
SQLiteFile.prototype.btreeStart = function (n) { return n === 1 ? 100 : this.pageStart(n); };

/* A payload longer than the page keeps its first part in the cell and the
   rest in a chain of overflow pages. The split point is fixed by the format,
   not by taste, and getting it wrong silently truncates long text — which
   here would mean losing the end of a set comment. */
SQLiteFile.prototype.payload = function (off, size) {
  var maxLocal = this.usable - 35;
  var out, local;
  if (size <= maxLocal) {
    out = new Uint8Array(size);
    out.set(this.b.subarray(off, off + size));
    return out;
  }
  var minLocal = Math.floor((this.usable - 12) * 32 / 255) - 23;
  local = minLocal + ((size - minLocal) % (this.usable - 4));
  if (local > maxLocal) local = minLocal;

  out = new Uint8Array(size);
  out.set(this.b.subarray(off, off + local), 0);
  var got = local;
  var next = this.dv.getUint32(off + local);
  while (next && got < size) {
    var p = this.pageStart(next);
    var take = Math.min(this.usable - 4, size - got);
    out.set(this.b.subarray(p + 4, p + 4 + take), got);
    got += take;
    next = this.dv.getUint32(p);
  }
  return out;
};

/* A record is a header of serial types followed by the values themselves. */
SQLiteFile.prototype.record = function (bytes) {
  var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  var self = this;
  function vint(off) {
    var v = 0, i, b;
    for (i = 0; i < 8; i++) {
      b = bytes[off + i];
      v = v * 128 + (b & 0x7f);
      if (!(b & 0x80)) return [v, i + 1];
    }
    return [v * 256 + bytes[off + 8], 9];
  }
  var h = vint(0), headerEnd = h[0], p = h[1], types = [];
  while (p < headerEnd) { var t = vint(p); types.push(t[0]); p += t[1]; }

  var vals = [], off = headerEnd;
  for (var i = 0; i < types.length; i++) {
    var t2 = types[i], v;
    if (t2 === 0) { v = null; }
    else if (t2 === 1) { v = dv.getInt8(off); off += 1; }
    else if (t2 === 2) { v = dv.getInt16(off); off += 2; }
    else if (t2 === 3) { v = (dv.getInt8(off) << 16) | dv.getUint16(off + 1); off += 3; }
    else if (t2 === 4) { v = dv.getInt32(off); off += 4; }
    else if (t2 === 5) { v = dv.getInt16(off) * 4294967296 + dv.getUint32(off + 2); off += 6; }
    else if (t2 === 6) { v = dv.getInt32(off) * 4294967296 + dv.getUint32(off + 4); off += 8; }
    else if (t2 === 7) { v = dv.getFloat64(off); off += 8; }
    else if (t2 === 8) { v = 0; }
    else if (t2 === 9) { v = 1; }
    else if (t2 >= 12 && t2 % 2 === 0) { var n = (t2 - 12) / 2; v = bytes.subarray(off, off + n); off += n; }
    else { var n2 = (t2 - 13) / 2; v = self.dec.decode(bytes.subarray(off, off + n2)); off += n2; }
    vals.push(v);
  }
  return vals;
};

/* Walk a table b-tree and call back with [rowid, values] for every leaf cell. */
SQLiteFile.prototype.walk = function (page, fn, seen) {
  seen = seen || {};
  if (!page || seen[page]) return;          /* a corrupt file must not loop forever */
  seen[page] = 1;
  var s = this.btreeStart(page), type = this.b[s];
  var count = this.dv.getUint16(s + 3);
  /* A cell pointer is an offset from the start of its own page, not from the
     start of the file. Page 1 hides that bug, because its page starts at byte
     zero — every other page reads garbage without this. */
  var base = this.pageStart(page);
  var i, ptr, cell;

  if (type === 0x0d) {                       /* leaf table */
    for (i = 0; i < count; i++) {
      ptr = base + this.dv.getUint16(s + 8 + i * 2);
      var a = this.varint(ptr), size = a[0];
      var b = this.varint(ptr + a[1]), rowid = b[0];
      fn(rowid, this.record(this.payload(ptr + a[1] + b[1], size)));
    }
  } else if (type === 0x05) {                /* interior table */
    for (i = 0; i < count; i++) {
      cell = base + this.dv.getUint16(s + 12 + i * 2);
      this.walk(this.dv.getUint32(cell), fn, seen);
    }
    this.walk(this.dv.getUint32(s + 8), fn, seen);   /* the rightmost child */
  }
  /* index pages are never walked: TRAIN reads tables only */
};

/* sqlite_master is a table like any other, rooted at page 1. */
SQLiteFile.prototype.schema = function () {
  if (this.master) return this.master;
  var out = {}, self = this;
  this.walk(1, function (rowid, v) {
    if (v[0] === 'table' && v[1]) out[v[1]] = { root: v[3], sql: v[4] || '' };
  });
  this.master = out;
  return out;
};

/* Column names, and which column is the rowid in disguise.
   `_id INTEGER PRIMARY KEY` is stored as NULL in the record; its real value
   is the cell's rowid. Miss that and every id in the file comes back empty. */
SQLiteFile.prototype.columns = function (sql) {
  var open = sql.indexOf('(');
  if (open < 0) return { names: [], pk: -1 };
  var depth = 0, body = '', i;
  for (i = open; i < sql.length; i++) {
    var ch = sql[i];
    if (ch === '(') { depth++; if (depth === 1) continue; }
    if (ch === ')') { depth--; if (depth === 0) break; }
    body += ch;
  }
  var parts = [], buf = '', d = 0;
  for (i = 0; i < body.length; i++) {
    var c = body[i];
    if (c === '(') d++;
    if (c === ')') d--;
    if (c === ',' && d === 0) { parts.push(buf); buf = ''; continue; }
    buf += c;
  }
  if (buf.trim()) parts.push(buf);

  var names = [], pk = -1;
  parts.forEach(function (p) {
    var t = p.trim();
    if (!t) return;
    if (/^(PRIMARY|FOREIGN|UNIQUE|CHECK|CONSTRAINT)\b/i.test(t)) return;
    var m = t.match(/^[`"\[]?([A-Za-z_][A-Za-z0-9_]*)[`"\]]?/);
    if (!m) return;
    if (/\bINTEGER\s+PRIMARY\s+KEY\b/i.test(t)) pk = names.length;
    names.push(m[1]);
  });
  return { names: names, pk: pk };
};

/** Every row of one table, as plain objects. */
SQLiteFile.prototype.table = function (name) {
  var s = this.schema()[name];
  if (!s) return null;                       /* older backups genuinely lack tables */
  var cols = this.columns(s.sql), out = [];
  this.walk(s.root, function (rowid, vals) {
    var o = {};
    for (var i = 0; i < cols.names.length; i++) {
      o[cols.names[i]] = (i === cols.pk && vals[i] == null) ? rowid : vals[i];
    }
    out.push(o);
  });
  return out;
};

/* ═════════════════════════════════════════════════════════════════════════
   THE FITNOTES IMPORTER

   Merges, never replaces. Every row it builds carries a stable id derived
   from the FitNotes row id, and an updated_at taken from the training date
   rather than from the clock. Two consequences, both wanted:

     • importing the same backup twice changes nothing
     • anything edited in TRAIN afterwards is newer, so a re-import cannot
       walk over work done since

   One way only. There is no export back into FitNotes.
   ═════════════════════════════════════════════════════════════════════════ */

/* FitNotes stores a colour as a signed 32-bit ARGB integer. */
function argbToRgb(n) {
  var v = (n >>> 0) & 0xffffff;
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
/* Map an imported colour onto the nearest of the twelve theme slots, so his
   existing category colours survive as an assignment he can then change. The
   comparison is against the default skin, once, so it does not shift with
   whatever theme happens to be active during the import. */
function slotRgb(s) {
  var c = hexToRgb(getComputedStyle(document.documentElement)
    .getPropertyValue('--data-' + (s % 6 + 1)).trim());
  if (!c) return null;
  return s < 6 ? c : [c[0] * 0.62 + 40, c[1] * 0.62 + 40, c[2] * 0.62 + 40];
}
function slotDistance(s, rgb) {
  var c = slotRgb(s);
  if (!c) return Infinity;
  return Math.pow(c[0] - rgb[0], 2) + Math.pow(c[1] - rgb[1], 2) + Math.pow(c[2] - rgb[2], 2);
}
/* Nearest wins, but only once. Nine of his categories were picked by eye in
   FitNotes and three of them are near-identical greens: matching each one to
   its nearest slot independently put Triceps, Back and Abs on the same colour,
   which is worse than useless on a rail you are meant to follow down a day.
   So a slot is claimed, and the next category takes its nearest free one. */
function assignSlots(list) {
  var taken = {}, out = {};
  list.forEach(function (item) {
    var best = -1, bestD = Infinity;
    for (var s = 0; s < TRAIN.SLOTS; s++) {
      if (taken[s]) continue;
      var d = slotDistance(s, item.rgb);
      if (d < bestD) { bestD = d; best = s; }
    }
    if (best < 0) best = Object.keys(out).length % TRAIN.SLOTS;  /* more than twelve: repeats resume */
    taken[best] = 1;
    out[item.id] = best;
  });
  return out;
}
function hexToRgb(h) {
  if (!h) return null;
  h = h.trim();
  var m = h.match(/^#?([0-9a-f]{6})$/i);
  if (m) { var n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  m = h.match(/rgba?\(([^)]+)\)/);
  if (m) { var p = m[1].split(','); return [parseFloat(p[0]), parseFloat(p[1]), parseFloat(p[2])]; }
  return null;
}

/* FitNotes' exercise_type_id. Two of these are certain from his own data:
   0 is everything with a weight and reps, 1 is the cardio exercises. The
   others appear a handful of times and their exact ordinals could not be
   pinned down from the file alone, so the raw id is kept and the editor falls
   back to showing whichever of weight, reps, distance and time has a value.
   Nothing is lost; see train/CLAUDE.md. */
var KIND = { 0: 'weight_reps', 1: 'distance_time' };

TRAIN.importFitNotes = function (buf, onProgress, opts) {
  var db = new SQLiteFile(buf);
  var log = onProgress || function () {};
  var rows = [], stats = {};
  var USER = Rec.USER;

  function rowId(type, date, key) {
    var clean = function (s) { return String(s == null ? '' : s).replace(/\|/g, '-'); };
    return USER + '|' + clean(type) + '|' + clean(date || '') + '|' + clean(key);
  }
  /* Stable, and older than anything he does in TRAIN from here on. */
  function stampFor(date) {
    return (date && /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : '2000-01-01') + 'T12:00:00.000Z';
  }
  function push(type, date, key, payload, stamp) {
    rows.push({ id: rowId(type, date, key), user_id: USER, type: type,
      date: date || null, key: String(key), payload: payload,
      updated_at: stamp || stampFor(date), deleted: false, by: APP.id });
  }

  /* ── categories ── */
  log('categories');
  var cats = db.table('Category') || [];
  cats.sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0) || a._id - b._id; });
  var catSlots = assignSlots(cats.map(function (c) {
    return { id: c._id, rgb: argbToRgb(c.colour || 0) };
  }));
  cats.forEach(function (c) {
    push('excat', null, 'fn' + c._id, {
      name: c.name, slot: catSlots[c._id],
      ord: c.sort_order || 0, fnColour: c.colour,
    });
  });
  stats.categories = cats.length;
  stats.distinctColours = Object.keys(cats.reduce(function (o, c) {
    o[catSlots[c._id]] = 1; return o;
  }, {})).length;

  /* ── exercises ── */
  log('exercises');
  var exs = db.table('exercise') || [];
  exs.forEach(function (e) {
    push('exercise', null, 'fn' + e._id, {
      name: e.name,
      cat: e.category_id != null ? 'fn' + e.category_id : null,
      kind: KIND[e.exercise_type_id] || null,
      fnKind: e.exercise_type_id,
      note: e.notes || '',
      inc: e.weight_increment != null ? e.weight_increment : null,
      rest: e.default_rest_time != null ? e.default_rest_time : null,
      unit: UNIT[e.weight_unit_id] || null,
      graph: e.default_graph_id != null ? e.default_graph_id : null,
      fav: e.is_favourite ? 1 : 0,
    });
  });
  stats.exercises = exs.length;

  /* ── set comments ──
     owner_type_id 1 is a comment on a set. There are thousands of them and
     they are a third of the record, so they are attached to their set rather
     than kept as rows of their own. */
  log('comments');
  var comments = db.table('Comment') || [];
  var setNote = {}, dayNote = {}, nSetNotes = 0;
  comments.forEach(function (c) {
    if (c.owner_type_id === 1) { setNote[c.owner_id] = c.comment; nSetNotes++; }
    else { dayNote[c.date] = c.comment; }
  });
  stats.commentRows = nSetNotes;

  /* ── supersets ── */
  log('supersets');
  var groups = db.table('WorkoutGroup') || [];
  var groupEx = db.table('WorkoutGroupExercise') || [];
  var members = {};
  groupEx.forEach(function (g) {
    (members[g.workout_group_id] || (members[g.workout_group_id] = [])).push('fn' + g.exercise_id);
  });
  /* A superset's colour may repeat a category's: they never share a rail, so
     a collision here costs nothing and nearest is the honest answer. */
  var nearest = function (rgb) {
    var best = 0, bestD = Infinity;
    for (var s = 0; s < TRAIN.SLOTS; s++) {
      var d = slotDistance(s, rgb);
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  };
  groups.forEach(function (g) {
    push('sgroup', g.date, 'fn' + g._id, {
      name: g.name,
      slot: nearest(argbToRgb(g.colour || 0)),
      ex: members[g._id] || [],
      jump: g.auto_jump_enabled ? 1 : 0,
      resthold: g.rest_timer_auto_start_enabled ? 1 : 0,
    });
  });
  stats.supersets = groups.length;

  /* ── the training log ──
     One row per set, keyed on the FitNotes row id so a second import is a
     no-op. `ord` is the position within that exercise on that day, which
     FitNotes expresses as the order of the ids. */
  log('sets');
  var tl = db.table('training_log') || [];
  tl.sort(function (a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : a._id - b._id;
  });
  var ordCount = {}, days = {}, prs = 0, kgSets = 0, lbSets = 0;
  tl.forEach(function (t) {
    var okey = t.date + '|' + t.exercise_id;
    ordCount[okey] = (ordCount[okey] || 0) + 1;
    var unit = UNIT[t.unit] || 'kg';
    if (unit === 'kg') kgSets++; else lbSets++;
    if (t.is_personal_record) prs++;
    days[t.date] = 1;
    push('set', t.date, 'fn' + t._id, {
      ex: 'fn' + t.exercise_id,
      kg: t.metric_weight || 0,
      r: t.reps || 0,
      u: unit,
      done: t.is_complete ? 1 : 0,
      pr: t.is_personal_record ? 1 : 0,
      prf: t.is_personal_record_first ? 1 : 0,
      dist: t.distance ? t.distance / 1000 : 0,   /* metres, assumed: his file has no distances to check */
      dur: t.duration_seconds || 0,
      note: setNote[t._id] || '',
      ord: ordCount[okey],
    });
  });
  stats.sets = tl.length;
  /* FitNotes keeps a comment after its set is deleted. His file has 4,297
     set comments and 2,057 of them point at sets that no longer exist, so
     2,240 is every comment that has a set to belong to. */
  stats.setComments = tl.filter(function (t) { return setNote[t._id]; }).length;
  stats.orphanComments = stats.commentRows - stats.setComments;
  stats.days = Object.keys(days).length;
  stats.prSets = prs;
  stats.kgSets = kgSets;
  stats.lbSets = lbSets;

  /* ── the day: when the workout started and ended, and its comment ── */
  log('workout times');
  var times = db.table('WorkoutTime') || [];
  var byDate = {};
  times.forEach(function (w) {
    byDate[w.workout_date] = { start: w.start_date_time || null, end: w.end_date_time || null };
  });
  Object.keys(dayNote).forEach(function (d) {
    var k = String(d).slice(0, 10);
    byDate[k] = byDate[k] || {};
    byDate[k].note = dayNote[d];
  });
  Object.keys(byDate).forEach(function (d) {
    push('session', d, '', byDate[d]);
  });
  stats.workoutTimes = times.length;

  /* ── routines ── */
  log('routines');
  var routines = db.table('Routine') || [];
  var sections = db.table('RoutineSection') || [];
  var secEx = db.table('RoutineSectionExercise') || [];
  var secSets = db.table('RoutineSectionExerciseSet') || [];
  var setsFor = {};
  secSets.forEach(function (s) {
    (setsFor[s.routine_section_exercise_id] || (setsFor[s.routine_section_exercise_id] = [])).push({
      kg: s.metric_weight || 0, r: s.reps || 0, u: UNIT[s.unit] || 'kg',
      dist: s.distance || 0, dur: s.duration_seconds || 0, ord: s.sort_order || 0,
    });
  });
  routines.forEach(function (r) {
    push('program', null, 'fn' + r._id, { name: r.name, ord: r.sort_order || 0 });
  });
  sections.forEach(function (s) {
    push('progday', null, 'fn' + s.routine_id + '.' + s._id,
      { program: 'fn' + s.routine_id, name: s.name, ord: s.sort_order || 0 });
  });
  secEx.forEach(function (e) {
    var list = (setsFor[e._id] || []).sort(function (a, b) { return a.ord - b.ord; });
    push('progex', null, 'fn' + e.routine_section_id + '.' + e._id, {
      day: 'fn' + e.routine_section_id, ex: 'fn' + e.exercise_id,
      ord: e.sort_order || 0, fill: e.populate_sets_type || 0, sets: list,
    });
  });
  stats.routines = routines.length;

  /* ── goals ── */
  log('goals');
  var goals = db.table('Goal') || [];
  goals.forEach(function (g) {
    push('goal', null, 'fn' + g._id, {
      kind: g.type_id, ex: g.exercise_id ? 'fn' + g.exercise_id : null,
      kg: g.metric_weight || 0, r: g.reps || 0, u: UNIT[g.unit] || 'kg',
      title: g.title || '', from: g.start_date || null, to: g.target_date || null,
      dist: g.distance || 0, dur: g.duration_seconds || 0, ord: g.sort_order || 0,
    });
  });
  stats.goals = goals.length;

  /* ── the gym: plates and bars are configuration, not records ── */
  log('settings');
  var plates = (db.table('Plate') || []).map(function (p) {
    return { kg: p.unit === 0 ? p.weight : p.weight / LB_PER_KG, w: p.weight,
             u: UNIT[p.unit] || 'kg', n: p.count, on: p.enabled ? 1 : 0,
             colour: p.colour, wr: p.width_ratio, hr: p.height_ratio };
  });
  var bars = (db.table('Barbell') || []).map(function (b) {
    return { w: b.weight, u: UNIT[b.unit] || 'kg', ex: b.exercise_id || 0 };
  });
  stats.plates = plates.length;
  stats.bars = bars.length;

  /* Body weight and measurements are STATUS's, not TRAIN's. They are counted
     so the panel can offer them, and deliberately not imported here. */
  var bodyRows = (db.table('MeasurementRecord') || []).length +
                 (db.table('BodyWeight') || []).length;
  stats.bodyRowsSkipped = bodyRows;

  /* ── one write ──
     Rec.set announces after every row, which for twelve thousand sets would
     redraw the screen twelve thousand times. merge writes them all and tells
     the app once.

     `defer` hands the rows back instead, so the async wrapper can write them
     in chunks and let the phone paint between them. */
  log('saving');
  stats.rowsBuilt = rows.length;

  /* Everything that has to happen once the rows are in, whichever path put
     them there. */
  function finishImport() {
    applySettings();
    TRAIN.reindex();
    clearSeed();
    /* FitNotes' flags arrive as it set them; TRAIN's rule keeps split sets
       apart, so they are worked out again once everything is in. */
    TRAIN.recomputePRs();
    Rec.setting(APP.id, 'prRule', 2);
    Object.keys(days).forEach(TRAIN.assertTick);
    return stats;
  }

  /* The movements a fresh TRAIN starts with are for someone arriving with
     nothing. A FitNotes backup brings a complete list of its own, so seeded
     movements with no sets and in no routine go, and so do starter groups
     left empty. Without this he has two Deadlifts and two Back categories.
     A seeded row is recognised by what seedCats writes: unit 0 and graph 0 in
     one of the starter groups. Anything he made or logged stays. */
  function clearSeed() {
    var starter = {};
    TRAIN.DEFAULT_CATS.forEach(function (n) { starter[n.toLowerCase()] = 1; });
    var exs = TRAIN.exercises(), inRoutine = {}, removed = 0;
    var px = Rec.map('progex');
    Object.keys(px).forEach(function (k) { inRoutine[px[k].ex] = 1; });
    Object.keys(exs).forEach(function (id) {
      var e = exs[id];
      if (/^fn/.test(id) || !starter[e.cat] || e.unit !== 0 || e.graph !== 0) return;
      if (TRAIN.historyOf(id).length || inRoutine[id]) return;
      Rec.del('exercise', null, id);
      removed++;
    });
    var left = TRAIN.exercises();
    Object.keys(starter).forEach(function (cid) {
      if (!TRAIN.cats()[cid]) return;
      if (Object.keys(left).some(function (id) { return left[id].cat === cid; })) return;
      Rec.del('excat', null, cid);
    });
    stats.starterRemoved = removed;
  }

  if (opts && opts.defer) {
    stats.rowsWritten = 0;
    return { rows: rows, stats: stats, days: days, finish: finishImport };
  }
  stats.rowsWritten = Rec.merge(rows);
  return finishImport();

  function applySettings() {
  if (plates.length) Rec.setting(APP.id, 'plates', plates);
  if (bars.length) Rec.setting(APP.id, 'bars', bars);

  /* FitNotes' own settings, for the ones TRAIN has an equivalent for. The
     display unit is left alone: it is asked for on first run and is his
     choice, not the file's. */
  var fs = (db.table('settings') || [])[0];
  if (fs) {
    if (fs.rest_timer_seconds != null) Rec.setting(APP.id, 'restSeconds', fs.rest_timer_seconds);
    if (fs.rest_timer_auto_start != null) Rec.setting(APP.id, 'restAuto', fs.rest_timer_auto_start ? 1 : 0);
    if (fs.rest_timer_vibrate != null) Rec.setting(APP.id, 'restVibrate', fs.rest_timer_vibrate ? 1 : 0);
    if (fs.rest_timer_sound != null) Rec.setting(APP.id, 'restSound', fs.rest_timer_sound ? 1 : 0);
    if (fs.weight_increment != null) Rec.setting(APP.id, 'increment', fs.weight_increment);
    if (fs.mark_sets_complete != null) Rec.setting(APP.id, 'markComplete', fs.mark_sets_complete ? 1 : 0);
    if (fs.track_personal_records != null) Rec.setting(APP.id, 'trackPRs', fs.track_personal_records ? 1 : 0);
    if (fs.auto_select_next_set != null) Rec.setting(APP.id, 'autoNext', fs.auto_select_next_set ? 1 : 0);
    if (fs.keep_screen_on != null) Rec.setting(APP.id, 'keepAwake', fs.keep_screen_on ? 1 : 0);
    if (fs.first_day_of_week != null) Rec.setting(APP.id, 'weekStart', fs.first_day_of_week);
    if (fs.estimated_1rm_max_reps_to_include != null)
      Rec.setting(APP.id, 'e1rmMaxReps', fs.estimated_1rm_max_reps_to_include);
    if (fs.workout_timer_auto_start_enabled != null)
      Rec.setting(APP.id, 'workoutTimerAuto', fs.workout_timer_auto_start_enabled ? 1 : 0);
    stats.settings = 1;
  }
  }
};

/* The same import, in slices, so the phone can paint between them. The rows
   are built in one pass and then written a few hundred at a time: writing is
   where the seconds go, because every row is its own storage entry. */
TRAIN.importFitNotesAsync = function (buf, onStep) {
  var CHUNK = 400;
  var step = onStep || function () { return Promise.resolve(); };
  /* Each chunk announces, and every announce would otherwise reindex and
     redraw the whole app. Thirty-three of those during one import is most of
     the cost of the import. */
  TRAIN.importing = true;
  var done = function (v) { TRAIN.importing = false; return v; };
  var failed = function (e) { TRAIN.importing = false; throw e; };
  return Promise.resolve()
    .then(function () { return step('categories'); })
    .then(function () {
      var held = TRAIN.importFitNotes(buf, function () {}, { defer: true });
      var rows = held.rows, i = 0, written = 0;
      var steps = ['exercises', 'comments', 'supersets', 'sets', 'workout times',
                   'routines', 'goals', 'settings', 'saving'];
      function slice() {
        if (i >= rows.length) {
          held.stats.rowsWritten = written;
          return Promise.resolve(held.finish());
        }
        written += Rec.merge(rows.slice(i, i + CHUNK));
        i += CHUNK;
        var pos = Math.min(steps.length - 1, Math.floor((i / rows.length) * steps.length));
        return step(steps[pos]).then(slice);
      }
      return slice();
    })
    .then(done, failed);
};

/* ═══════════════════ THE IMPORT PANEL ═══════════════════ */
/* ═════════════════ IMPORTING FROM ANYWHERE ELSE ═════════════════
   The FitNotes importer reads that app's SQLite file and nothing else. Every
   other training app exports a spreadsheet, and they all export very nearly
   the same one: a row per set, with the date, the movement, the weight and the
   reps. Only the column names differ.

   So rather than a parser per app, one parser and a table of what each app
   calls things. Strong says "Exercise Name", Hevy says "exercise_title",
   FitNotes says "Exercise". They all mean the same column.

   Anything it cannot match, it says so and imports what it could rather than
   refusing the file. A log that is 90% across beats a log that is 0% across
   with a tidy error message.                                                */

/* A real CSV reader: quoted fields, commas and newlines inside quotes, and ""
   as an escaped quote. Splitting on commas loses every exercise with a comma
   in its name, which is most cable variations. */
TRAIN.parseCsv = function (text) {
  var rows = [], row = [], cur = '', q = false, i = 0;
  text = String(text || '').replace(/\r\n?/g, '\n');
  for (; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
};

/* What each app calls each column. Matched case- and punctuation-insensitively,
   longest alias first so "weight_kg" wins over "weight". */
TRAIN.CSV_ALIASES = {
  date: ['date', 'workoutdate', 'starttime', 'start', 'datetime', 'day'],
  ex:   ['exercisename', 'exercisetitle', 'exercise', 'movement', 'name'],
  cat:  ['category', 'musclegroup', 'bodypart', 'muscle'],
  kg:   ['weightkg', 'weightlbs', 'weightlb', 'weight'],
  reps: ['reps', 'repetitions', 'rep', 'quantity'],
  dist: ['distancekm', 'distancemiles', 'distance'],
  dur:  ['durationseconds', 'seconds', 'duration', 'time'],
  note: ['exercisenotes', 'setnotes', 'comment', 'notes', 'note'],
};
var csvKey = function (h) { return String(h || '').toLowerCase().replace(/[^a-z0-9]/g, ''); };

/** Work out which column is which, and which unit the weights are in. */
TRAIN.mapCsv = function (headers) {
  var keys = headers.map(csvKey), map = {}, used = {};
  Object.keys(TRAIN.CSV_ALIASES).forEach(function (field) {
    var best = -1, bestLen = -1;
    TRAIN.CSV_ALIASES[field].forEach(function (alias) {
      for (var i = 0; i < keys.length; i++) {
        if (used[i] || keys[i] !== alias) continue;
        if (alias.length > bestLen) { best = i; bestLen = alias.length; }
      }
    });
    if (best > -1) { map[field] = best; used[best] = 1; }
  });
  /* lbs unless the header says otherwise, which is what a bare "Weight" means
     in every export that does not say */
  var wh = map.kg != null ? keys[map.kg] : '';
  map.unit = /kg/.test(wh) ? 'kg' : 'lb';
  map.miles = map.dist != null && /mile/.test(keys[map.dist]);
  return map;
};

/* Dates arrive as 2024-01-15, 2024-01-15 09:30:00, 15/01/2024 and worse.
   Anything with a leading ISO date is taken at its word; the rest goes through
   Date.parse and comes back as the local calendar day. */
TRAIN.csvDate = function (v) {
  var t = String(v || '').trim();
  if (!t) return null;
  var iso = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return iso[0];
  var ms = Date.parse(t);
  if (!isFinite(ms)) return null;
  var d = new Date(ms);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

/** Bring a parsed spreadsheet in. Returns what it did, in plain counts. */
TRAIN.importCsv = function (grid) {
  var out = { sets: 0, exercises: 0, cats: 0, days: 0, skipped: 0, unit: 'lb' };
  if (!grid || grid.length < 2) { out.error = 'That file has no rows in it.'; return out; }
  var map = TRAIN.mapCsv(grid[0]);
  out.unit = map.unit;
  if (map.date == null || map.ex == null) {
    out.error = 'Could not find a date column and an exercise column. ' +
      'Found: ' + grid[0].filter(Boolean).join(', ');
    return out;
  }

  /* index what is already here by name, so a second import of the same file
     lands on the same rows instead of doubling everything */
  var cats = TRAIN.cats(), exs = TRAIN.exercises();
  var catByName = {}, exByName = {};
  Object.keys(cats).forEach(function (k) { catByName[String(cats[k].name).toLowerCase()] = k; });
  Object.keys(exs).forEach(function (k) { exByName[String(exs[k].name).toLowerCase()] = k; });

  var seen = {}, days = {};
  grid.slice(1).forEach(function (r) {
    var date = TRAIN.csvDate(r[map.date]);
    var name = String(r[map.ex] == null ? '' : r[map.ex]).trim();
    if (!date || !name) { out.skipped++; return; }

    var catName = map.cat != null ? String(r[map.cat] || '').trim() : '';
    var catId = null;
    if (catName) {
      catId = catByName[catName.toLowerCase()];
      if (!catId) {
        catId = catName.toLowerCase().replace(/[^a-z0-9]+/g, '-') || TRAIN.newId();
        Rec.set('excat', null, catId, { name: catName, slot: Object.keys(catByName).length % TRAIN.SLOTS, ord: Object.keys(catByName).length });
        catByName[catName.toLowerCase()] = catId; out.cats++;
      }
    }

    var exId = exByName[name.toLowerCase()];
    if (!exId) {
      exId = TRAIN.newId();
      Rec.set('exercise', null, exId, {
        name: name, cat: catId, kind: 0, inc: 2.5, rest: 0, unit: 0,
        fav: 0, note: '', graph: 0, ord: 0,
      });
      exByName[name.toLowerCase()] = exId; out.exercises++;
    }

    var w = map.kg != null ? parseFloat(r[map.kg]) : 0;
    var reps = map.reps != null ? parseInt(r[map.reps], 10) : 0;
    var dist = map.dist != null ? parseFloat(r[map.dist]) : 0;
    var dur = map.dur != null ? parseFloat(r[map.dur]) : 0;
    if (!isFinite(w)) w = 0;
    if (!isFinite(reps)) reps = 0;
    if (!isFinite(dist)) dist = 0;
    if (!isFinite(dur)) dur = 0;
    if (!w && !reps && !dist && !dur) { out.skipped++; return; }

    /* Every set is stored in kilograms, whatever the file was written in. */
    var kg = map.unit === 'kg' ? w : TRAIN.toKg(w, 'lb');

    /* A stable id from the row's own contents: the same file imported twice
       writes the same rows, which is what makes this safe to repeat. */
    seen[date] = (seen[date] || 0) + 1;
    var key = 'csv-' + date + '-' + exId + '-' + seen[date];
    Rec.set('set', date, key, {
      ex: exId, kg: kg, r: reps, u: map.unit, done: 1, pr: 0, prf: 0,
      dist: map.miles ? dist * 1.609344 : dist, dur: Math.round(dur),
      note: map.note != null ? String(r[map.note] || '').trim() : '',
      ord: seen[date],
    });
    days[date] = 1; out.sets++;
  });

  TRAIN.reindex();
  Object.keys(days).forEach(function (d) { TRAIN.assertTick(d); });
  TRAIN.recomputePRs();
  out.days = Object.keys(days).length;
  return out;
};

TRAIN.importPanel = function () {
  UI.dialog({
    title: 'IMPORT A TRAINING LOG', width: 460,
    body: function (b) {
      var p = UI.el('div', 'empty');
      p.innerHTML =
        '<b>From FitNotes.</b> Settings \u25b8 Backup \u25b8 Backup Now, then get the ' +
        '<b>.fitnotes</b> file onto this device. Everything comes across: every set, ' +
        'every comment, your exercises, categories, session times, supersets and ' +
        'routines.<br><br>' +
        '<b>From anything else.</b> Export a <b>.csv</b> and pick it here. Strong, Hevy, ' +
        'JEFIT and most other logs export a row per set, and they all name the columns ' +
        'slightly differently \u2014 this reads whichever names yours used. It needs a ' +
        'date column and an exercise column; weight, reps, distance, time, category and ' +
        'notes come across when they are there.<br><br>' +
        'Importing <b>merges</b>. The same file twice changes nothing, and anything ' +
        'you have logged in TRAIN since is never overwritten.<br><br>' +
        '<b>It only goes one way.</b> There is no export back.<br><br>' +
        'Body weight and measurements are not imported. Those belong to STATUS.';
      b.appendChild(p);

      var bar = UI.el('div', 'bar'); bar.style.marginTop = 'var(--s-4)';
      var fill = UI.el('i'); bar.appendChild(fill); bar.style.display = 'none';
      b.appendChild(bar);

      var out = UI.el('div'); out.style.marginTop = 'var(--s-3)';
      b.appendChild(out);

      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.fitnotes,.db,.sqlite,.csv,text/csv,application/octet-stream';
      input.style.display = 'none';
      b.appendChild(input);

      var steps = ['categories', 'exercises', 'comments', 'supersets', 'sets',
                   'workout times', 'routines', 'goals', 'settings', 'saving'];
      /* The import is thousands of rows and on a Galaxy A10 it is tens of
         seconds. Run synchronously it freezes the screen with the progress
         bar stuck at zero, which reads as a crash. So each phase yields to
         the browser before the next one starts: the work is the same, but
         the bar moves and the phone still looks alive. */
      input.onchange = function () {
        var f = input.files && input.files[0];
        if (!f) return;
        bar.style.display = '';
        pick.disabled = true;
        out.innerHTML = '<div class="empty">reading ' + UI.esc(f.name) + '…</div>';
        var fr = new FileReader();
        fr.onerror = function () {
          pick.disabled = false;
          out.innerHTML = '<div class="empty">Could not read that file.</div>';
        };

        /* A spreadsheet is a different job from a database, so it takes a
           different reader and a different parser. Decided by the file, not by
           trying one and catching the explosion. */
        if (/\.csv$/i.test(f.name) || f.type === 'text/csv') {
          var tr = new FileReader();
          tr.onerror = fr.onerror;
          tr.onload = function () {
            var res;
            try { res = TRAIN.importCsv(TRAIN.parseCsv(tr.result)); }
            catch (e) { res = { error: e.message || 'Could not read that spreadsheet.' }; }
            fill.style.width = '100%';
            pick.disabled = false;
            if (res.error) {
              out.innerHTML = '<div class="empty">' + UI.esc(res.error) + '</div>';
              Mobile.feedback('error');
              return;
            }
            out.innerHTML = '<div class="empty"><b>' + res.sets + '</b> sets across <b>' +
              res.days + '</b> days.<br>' + res.exercises + ' new exercises, ' +
              res.cats + ' new categories.<br>Weights read as <b>' + res.unit + '</b>.' +
              (res.skipped ? '<br>' + res.skipped + ' rows had no usable numbers and were left out.' : '') +
              '</div>';
            Mobile.feedback('complete');
            draw();
          };
          tr.readAsText(f);
          return;
        }

        fr.onload = function () {
          var yield_ = function (step) {
            var i = steps.indexOf(step);
            fill.style.width = Math.round(((i + 1) / steps.length) * 100) + '%';
            out.innerHTML = '<div class="empty">' + UI.esc(step) + '…</div>';
            return new Promise(function (res) { setTimeout(res, 0); });
          };
          TRAIN.importFitNotesAsync(fr.result, yield_).then(function (stats) {
            fill.style.width = '100%';
            out.innerHTML = TRAIN.statsHtml(stats);
            pick.disabled = false;
            Mobile.feedback('complete');
            draw();
          }, function (e) {
            bar.style.display = 'none';
            pick.disabled = false;
            out.innerHTML = '<div class="empty"><b>Import failed.</b><br>' +
              UI.esc(e.message || String(e)) + '</div>';
            console.error(e);
          });
        };
        fr.readAsArrayBuffer(f);
      };

      var pick = UI.el('button', 'mb-btn mb-press mb-tap');
      pick.textContent = 'CHOOSE A .FITNOTES FILE';
      pick.style.marginTop = 'var(--s-4)';
      pick.style.width = '100%';
      pick.onclick = function () { input.click(); };
      b.appendChild(pick);
    },
    actions: [{ label: 'CLOSE' }],
  });
};

TRAIN.statsHtml = function (s) {
  var line = function (k, v) {
    return '<div class="imp-stat"><span>' + k + '</span><b>' +
      (typeof v === 'number' ? v.toLocaleString() : v) + '</b></div>';
  };
  return line('Sets', s.sets) + line('Training days', s.days) +
    line('Exercises', s.exercises) + line('Categories', s.categories) +
    line('Set comments', s.setComments) +
    (s.orphanComments ? line('Comments on deleted sets, skipped', s.orphanComments) : '') +
    line('Session timings', s.workoutTimes) +
    line('Supersets', s.supersets) + line('Personal records', s.prSets) +
    line('Entered in kg / lb', s.kgSets + ' / ' + s.lbSets) +
    line('Routines', s.routines) +
    line('Rows written', s.rowsWritten + ' of ' + s.rowsBuilt);
};
