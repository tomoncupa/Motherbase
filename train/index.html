    return w === w.toLowerCase() ? w.charAt(0).toUpperCase() + w.slice(1) : w;
  });
};

/** Read pasted notes. Nothing is written. */
TRAIN.parseNotes = function (text, opt) {
  opt = opt || {};
  var today = opt.today || Day.today();
  var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  var ord = TRAIN.noteOrder(lines), order = opt.order || ord.order;
  var days = [], day = null, item = null, unread = [];
  var newDay = function (date, name) { day = { date: date, name: name || '', items: [], heads: [] }; days.push(day); item = null; };
  var list = Object.keys(TRAIN.exercises()).map(function (id) {
    return { id: id, name: TRAIN.exercises()[id].name, words: TRAIN.noteWords(TRAIN.exercises()[id].name) };
  });
  lines.forEach(function (raw, i) {
    var line = ntClean(raw);
    if (!line) return;
    var lead = i === 0 || !ntClean(lines[i - 1]);
    var dt = ntDate(line, order, lead, today);
    if (dt) { newDay(dt.date, dt.name); return; }
    if (!day) newDay(null, '');
    if (NT_HEAD.test(line)) { day.heads.push(ntName(line)); item = null; return; }
    var sp = ntSplit(line), got = sp.rest ? ntSets(sp.rest) : { sets: [], w: null, note: '', words: [] };
    var name = ntName(sp.name);
    /* 3x10 push ups: numbers first, then a name this log knows */
    if (sp.lead && got.words.length && got.sets.length &&
        (!item || TRAIN.noteMatch(got.words.join(' '), list))) { name = got.words.join(' '); got.note = ''; }
    if (name && /^(rest|note|notes|total|volume|bodyweight|bw|weight)$/i.test(name)) name = '';
    if (name) { item = { name: name, sets: [], w: null, line: i + 1 }; day.items.push(item); }
    if (!got.sets.length && !got.w) {
      if (!name) unread.push({ n: i + 1, text: raw.trim(), why: 'no sets in it' });
      return;
    }
    if (!item) { unread.push({ n: i + 1, text: raw.trim(), why: 'no exercise above it' }); return; }
    if (!name && item.lone && item.sets.length === 1) { item.w = { n: item.sets[0].r, u: null }; item.sets = []; }
    item.lone = !!(name && got.lone);
    got.sets.forEach(function (s) { if (!s.w) s.w = got.w || item.w; });
    if (got.w) item.w = got.w;
    if (got.note && got.sets.length) got.sets[got.sets.length - 1].note = got.note;
    [].push.apply(item.sets, got.sets);
  });
  /* A name with no sets under it is a heading: the day's name if it comes
     before the first exercise, otherwise a line not read. */
  days.forEach(function (d) {
    var seenSets = false;
    d.items = d.items.filter(function (it) {
      if (it.sets.length) { seenSets = true; return true; }
      if (!seenSets) d.heads.push(it.name);
      else unread.push({ n: it.line, text: it.name, why: 'a name with no sets under it' });
      return false;
    });
    if (!d.name && d.heads.length) d.name = d.heads[0];
    d.items.forEach(function (it) {
      it.ex = TRAIN.noteMatch(it.name, list);
      it.cat = it.ex ? null : TRAIN.noteCat(it.name);
      it.sets.forEach(function (s) {
        var w = s.w, u = w && w.u === 'bw' ? (w.wu || opt.unit || 'kg') : (w && w.u) || opt.unit || 'kg';
        s.u = u === 'lb' ? 'lb' : 'kg';
        s.bw = !!(w && w.u === 'bw');
        s.wv = w ? w.n : 0;
        s.kg = TRAIN.toKg(s.wv, s.u);
      });
    });
  });
  days = days.filter(function (d) { return d.items.length; });
  unread.sort(function (a, b) { return a.n - b.n; });
  return { days: days, unread: unread, order: order, decided: ord.decided, ambiguous: ord.ambiguous && !ord.decided,
    undated: days.some(function (d) { return !d.date; }) };
};

/** Write what parseNotes read. `opt.date` takes the days with no date,
    `opt.redo` imports days that already hold sets logged some other way.
    Returns the counts and the list UNDO needs. */
TRAIN.importNotes = function (res, opt) {
  opt = opt || {};
  var today = Day.today(), undo = [], out = { sets: 0, exercises: 0, days: 0, future: 0, logged: [], undo: undo };
  var keep = function (type, date, key) { undo.push({ type: type, date: date, key: key, was: Rec.get(type, date, key) }); };
  var byDate = {};
  res.days.forEach(function (d) {
    var date = d.date || opt.date;
    if (!date) return;
    (byDate[date] || (byDate[date] = { items: [], name: '' })).items.push.apply(byDate[date].items, d.items);
    if (d.name && !byDate[date].name) byDate[date].name = d.name;
  });
  var made = {}, cats = TRAIN.cats();
  var maxOrd = 0;
  Object.keys(cats).forEach(function (k) { if ((cats[k].ord | 0) > maxOrd) maxOrd = cats[k].ord | 0; });
  var catFor = function (group) {
    var id = group && TRAIN.catByWord(group);
    if (id) return id;
    if (group && !Rec.tombstone('excat', null, TRAIN.catId(group))) {
      id = TRAIN.catId(group);
      keep('excat', null, id);
      Rec.set('excat', null, id, { name: group, slot: Math.max(0, TRAIN.DEFAULT_CATS.indexOf(group)), ord: ++maxOrd });
      TRAIN._catC = null;
      return id;
    }
    id = TRAIN.catByWord('Other');
    if (id) return id;
    id = 'other'; keep('excat', null, id);
    Rec.set('excat', null, id, { name: 'Other', slot: (maxOrd + 1) % TRAIN.SLOTS, ord: ++maxOrd });
    TRAIN._catC = null;
    return id;
  };
  var exFor = function (it) {
    if (it.ex && TRAIN.exercises()[it.ex]) return it.ex;
    var k = TRAIN.noteWords(it.name).slice().sort().join(' ');
    if (made[k]) return made[k];
    var d = it.sets.some(function (s) { return s.dist; }), t = it.sets.some(function (s) { return s.dur; });
    var r = it.sets.some(function (s) { return s.r; }), w = it.sets.some(function (s) { return s.kg; }), group = it.cat;
    var kind = d && !r && w ? 'wd' : group === 'Cardio' || (d && !r) ? 'dt' : t && !r ? 'wt' : 'wr';
    var id = TRAIN.newId();
    keep('exercise', null, id);
    Rec.set('exercise', null, id, { name: TRAIN.noteTitle(it.name), cat: catFor(group), kind: kind,
      inc: kind === 'wr' ? 2.5 : 1, rest: 0, unit: 0, fav: 0, note: '', graph: 0, ord: 0 });
    TRAIN._exC = null;
    out.exercises++;
    return (made[k] = id);
  };
  Object.keys(byDate).sort().forEach(function (date) {
    if (date > today) { out.future++; return; }
    var there = TRAIN.setsOn(date), mine = there.filter(function (s) { return /^nt-/.test(s.key); });
    if (there.length > mine.length && !opt.redo) { out.logged.push(date); return; }
    var n = 0;
    byDate[date].items.forEach(function (it) {
      var ex = exFor(it);
      it.sets.forEach(function (s) {
        var key = 'nt-' + date + '-' + (++n);
        var p = { ex: ex, kg: Math.round(s.kg * 1000) / 1000, r: TRAIN.readReps(s.r) || 0, u: s.u, done: 1, pr: 0, prf: 0,
          dist: s.dist ? Math.round(s.dist * 1000) / 1000 : 0, dur: Math.round(s.dur || 0), note: s.note || '', ord: n };
        if (s.warm) p.warm = 1;
        if (s.rir != null) p.rir = s.rir;
        keep('set', date, key);
        Rec.set('set', date, key, p);
        out.sets++;
      });
    });
    /* fewer sets than last time: the ones past the end are gone from the notes */
    mine.forEach(function (s) {
      if (+s.key.split('-').pop() > n) { keep('set', date, s.key); Rec.del('set', date, s.key); }
    });
    var ses = Rec.get('session', date, '') || {};
    if (byDate[date].name && !ses.name) { keep('session', date, ''); Rec.patch('session', date, '', { name: byDate[date].name }); }
    out.days++;
  });
  TRAIN.reindex();
  Object.keys(byDate).forEach(function (d) { TRAIN.assertTick(d); });
  TRAIN.recomputePRs();
  return out;
};
TRAIN.undoNotes = function (undo) {
  var dates = {};
  undo.slice().reverse().forEach(function (u) {
    if (u.was) Rec.set(u.type, u.date, u.key, u.was); else Rec.del(u.type, u.date, u.key);
    if (u.date) dates[u.date] = 1;
  });
  TRAIN._exC = null; TRAIN._catC = null;
  TRAIN.reindex();
  Object.keys(dates).forEach(function (d) { TRAIN.assertTick(d); });
  TRAIN.recomputePRs();
};

TRAIN.importPanel = function () {
  UI.dialog({
    title: 'IMPORT A TRAINING LOG', width: 460,
    body: function (b) {
      /* Which log this lands in, said before anything is picked. Opened from
         COACH this is a client's profile, and a FitNotes backup dropped into
         the wrong one is thousands of rows to undo by hand. */
      if (CLIENT) {
        var w = UI.el('div', 'empty');
        w.style.marginBottom = 'var(--s-3)';
        w.innerHTML = '<b>This goes into this client\u2019s log</b>, not yours. ' +
          'Their sets, exercises and categories are kept under their own name and never touch your TRAIN.';
        b.appendChild(w);
      }
      var p = UI.el('div', 'empty');
      p.innerHTML =
        '<b>From FitNotes.</b> Settings \u25b8 Backup \u25b8 Backup Now, then get the ' +
        '<b>.fitnotes</b> file onto this device. Everything comes across: every set, ' +
        'every comment, your exercises, categories, session times, supersets and ' +
        'routines.<br><br>' +
        '<b>From anything else.</b> Export a <b>.csv</b> and pick it here. Strong, Hevy, ' +
        'JEFIT and most other logs export a row per set, and they all name the columns ' +
        'slightly differently \u2014 this reads whichever names yours used. It needs a ' +
        'date column and an exercise column; weight, reps, distance, time, category and ' +
        'notes come across when they are there.<br><br>' +
        '<b>From notes.</b> Paste a log typed into a phone’s notes app. It reads dates, ' +
        'exercise names and sets written the usual ways, shows you what it read, and ' +
        'writes nothing until you press IMPORT.<br><br>' +
        'Importing <b>merges</b>. The same file twice changes nothing, and anything ' +
        'you have logged in TRAIN since is never overwritten.<br><br>' +
        '<b>It only goes one way.</b> There is no export back.<br><br>' +
        'Body weight and measurements are not imported. Those belong to STATUS.';
      b.appendChild(p);

      var bar = UI.el('div', 'bar'); bar.style.marginTop = 'var(--s-4)';
      var fill = UI.el('i'); bar.appendChild(fill); bar.style.display = 'none';
      b.appendChild(bar);

      var out = UI.el('div'); out.style.marginTop = 'var(--s-3)';
      b.appendChild(out);

      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.fitnotes,.db,.sqlite,.csv,text/csv,application/octet-stream';
      input.style.display = 'none';
      b.appendChild(input);

      var steps = ['categories', 'exercises', 'comments', 'supersets', 'sets',
                   'workout times', 'routines', 'goals', 'settings', 'saving'];
      /* The import is thousands of rows and on a Galaxy A10 it is tens of
         seconds. Run synchronously it freezes the screen with the progress
         bar stuck at zero, which reads as a crash. So each phase yields to
         the browser before the next one starts: the work is the same, but
         the bar moves and the phone still looks alive. */
      input.onchange = function () {
        var f = input.files && input.files[0];
        if (!f) return;
        bar.style.display = '';
        pick.disabled = true;
        out.innerHTML = '<div class="empty">reading ' + UI.esc(f.name) + '…</div>';
        var fr = new FileReader();
        fr.onerror = function () {
          pick.disabled = false;
          out.innerHTML = '<div class="empty">Could not read that file.</div>';
        };

        /* A spreadsheet is a different job from a database, so it takes a
           different reader and a different parser. Decided by the file, not by
           trying one and catching the explosion. */
        if (/\.csv$/i.test(f.name) || f.type === 'text/csv') {
          var tr = new FileReader();
          tr.onerror = fr.onerror;
          tr.onload = function () {
            var res;
            try { res = TRAIN.importCsv(TRAIN.parseCsv(tr.result)); }
            catch (e) { res = { error: e.message || 'Could not read that spreadsheet.' }; }
            fill.style.width = '100%';
            pick.disabled = false;
            if (res.error) {
              out.innerHTML = '<div class="empty">' + UI.esc(res.error) + '</div>';
              Mobile.feedback('error');
              return;
            }
            out.innerHTML = '<div class="empty"><b>' + res.sets + '</b> sets across <b>' +
              res.days + '</b> days.<br>' + res.exercises + ' new exercises, ' +
              res.cats + ' new categories.<br>Weights read as <b>' + res.unit + '</b>.' +
              (res.skipped ? '<br>' + res.skipped + ' rows had no usable numbers and were left out.' : '') +
              '</div>';
            Mobile.feedback('complete');
            draw();
          };
          tr.readAsText(f);
          return;
        }

        fr.onload = function () {
          var yield_ = function (step) {
            var i = steps.indexOf(step);
            fill.style.width = Math.round(((i + 1) / steps.length) * 100) + '%';
            out.innerHTML = '<div class="empty">' + UI.esc(step) + '…</div>';
            return new Promise(function (res) { setTimeout(res, 0); });
          };
          TRAIN.importFitNotesAsync(fr.result, yield_).then(function (stats) {
            fill.style.width = '100%';
            out.innerHTML = TRAIN.statsHtml(stats);
            pick.disabled = false;
            Mobile.feedback('complete');
            draw();
          }, function (e) {
            bar.style.display = 'none';
            pick.disabled = false;
            out.innerHTML = '<div class="empty"><b>Import failed.</b><br>' +
              UI.esc(e.message || String(e)) + '</div>';
            console.error(e);
          });
        };
        fr.readAsArrayBuffer(f);
      };

      var pick = UI.el('button', 'mb-btn mb-press mb-tap');
      pick.textContent = 'CHOOSE A .FITNOTES FILE';
      pick.style.marginTop = 'var(--s-4)';
      pick.style.width = '100%';
      pick.onclick = function () { input.click(); };
      b.appendChild(pick);

      var np = UI.el('button', 'mb-btn mb-press mb-tap');
      np.textContent = 'PASTE FROM NOTES';
      np.style.marginTop = 'var(--s-3)';
      np.style.width = '100%';
      var nbox = UI.el('div', 'nt');
      nbox.style.display = 'none';
      np.onclick = function () { np.style.display = 'none'; nbox.style.display = ''; TRAIN.notesBox(nbox); };
      b.appendChild(np);
      b.appendChild(nbox);
    },
    actions: [{ label: 'CLOSE' }],
  });
};

/* How a line of notes reads back: 60kg × 8, 8, 7 · 65kg × 6 */
var ntDur = function (s) {
  s = Math.round(s);
  return s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : s + 's';
};
TRAIN.noteSetsText = function (sets) {
  var out = [], cur = null;
  sets.forEach(function (s) {
    var w = s.bw ? (s.wv ? 'BW+' + s.wv + s.u : 'BW') : s.wv ? s.wv + s.u : '';
    if (s.dur || s.dist) {
      out.push([w, s.dist ? (s.dist < 1 ? Math.round(s.dist * 1000) + 'm' : (Math.round(s.dist * 100) / 100) + 'km') : '',
        s.dur ? ntDur(s.dur) : ''].filter(Boolean).join(' '));
      cur = null; return;
    }
    if (cur && cur.w === w) { cur.r.push(s.r); return; }
    cur = { w: w, r: [s.r] }; out.push(cur);
  });
  return out.map(function (x) {
    return typeof x === 'string' ? x : x.w ? x.w + ' × ' + x.r.join(', ') : x.r.join(', ') + ' reps';
  }).join(' · ');
};
var NT_DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
var NT_MONS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
var ntDay = function (iso) {
  var d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
  return NT_DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + NT_MONS[d.getMonth()] +
    (iso.slice(0, 4) !== Day.today().slice(0, 4) ? ' ' + iso.slice(0, 4) : '');
};

/* The paste box, its preview and IMPORT, drawn into the import panel. The
   text is kept while the page is open, so closing the panel loses nothing. */
TRAIN.notesBox = function (box) {
  var unit = TRAIN.unit(), orderPick = null, redo = false, last = null, timer = null;
  var ta = UI.field('note', { rows: 8, placeholder: 'Sep 20 Push\nBench 60kg x 8, 8, 7\nIncline DB press 22.5 x 10 x 3\nDips bw x 12, 10' });
  ta.value = TRAIN._ntDraft || '';
  ta.style.width = '100%';
  ta.style.marginTop = 'var(--s-3)';
  box.appendChild(ta);

  box.appendChild(UI.row('Weights with no unit', '',
    UI.segmented([{ id: 'kg', name: 'KG' }, { id: 'lb', name: 'LB' }], unit, function (v) { unit = v; draw_(); })));
  var orderRow = UI.row('Dates like 9/10', 'Month first or day first',
    UI.segmented([{ id: 'md', name: 'SEP 10' }, { id: 'dm', name: '9 OCT' }], 'md', function (v) { orderPick = v; draw_(); }));
  box.appendChild(orderRow);
  var di = document.createElement('input');
  di.type = 'date'; di.className = 'mb-input'; di.value = Day.today(); di.max = Day.today();
  di.onchange = function () { draw_(); };

  box.appendChild(dateRow);

  var logged = function (date) {

  };
  function draw_() {
    TRAIN._ntDraft = ta.value;

    var today = Day.today(), fall = di.value || today, n = 0, days = 0, exs = {}, h = '', hasLogged = false;
    orderRow.style.display = res.ambiguous || orderPick ? '' : 'none';
    dateRow.style.display = res.undated ? '' : 'none';
    res.days.forEach(function (d) {
      var date = d.date || fall, why = '';
      if (date > today) why = 'in the future, left out';
      else if (logged(date)) { hasLogged = true; if (!redo) why = 'already has sets in this log, left alone'; }
      h += '<div class="nt-day"><b>' + (d.date ? ntDay(d.date) : 'NO DATE → ' + ntDay(fall)) + '</b>' +
        UI.esc(d.name || '') + (why ? ' <em>' + why + '</em>' : '') + '</div>';
      d.items.forEach(function (it) {
        var ex = it.ex && TRAIN.exercises()[it.ex];

          (ex ? '→ ' + UI.esc(ex.name) : 'new · ' + UI.esc(it.cat || 'Other')) + '</i></div>' +
          '<div class="nt-sets">' + UI.esc(TRAIN.noteSetsText(it.sets)) +
          it.sets.filter(function (s) { return s.note; }).map(function (s) { return ' — ' + UI.esc(s.note); }).join('') + '</div>';
        if (!why) { n += it.sets.length; exs[TRAIN.noteWords(it.name).sort().join(' ')] = 1; }
      });
      if (!why) days++;
    });
    redoRow.style.display = hasLogged ? '' : 'none';
    res.unread.forEach(function (u) {
      h += '<div class="nt-miss"><b>Not read</b> line ' + u.n + ': “' + UI.esc(u.text) + '”, ' + u.why + '</div>';
    });
    var ne = Object.keys(exs).length;
    view.innerHTML = ta.value.trim() ? '<div class="nt-sum">' + n + ' sets · ' + ne + ' exercise' + (ne === 1 ? '' : 's') +
      ' · ' + days + ' day' + (days === 1 ? '' : 's') + '</div>' + h : '';
    go.textContent = n ? 'IMPORT ' + n + ' SET' + (n === 1 ? '' : 'S') : 'IMPORT';

  }
  ta.oninput = function () { clearTimeout(timer); timer = setTimeout(draw_, 250); };
  go.onclick = function () {

    var out = TRAIN.importNotes(last, { date: di.value || Day.today(), redo: redo });
    Mobile.feedback('complete');
    done.innerHTML = '<div class="empty"><b>' + out.sets + '</b> sets across <b>' + out.days + '</b> day' +
      (out.days === 1 ? '' : 's') + '. ' + out.exercises + ' new exercise' + (out.exercises === 1 ? '' : 's') + '.' +
      (out.logged.length ? '<br>' + out.logged.length + ' day' + (out.logged.length === 1 ? '' : 's') + ' already had sets and ' +
        (out.logged.length === 1 ? 'was' : 'were') + ' left alone.' : '') + '</div>';
    var u = UI.el('button', 'mb-btn mb-press mb-tap');
    u.textContent = 'UNDO THIS IMPORT';
    u.style.marginTop = 'var(--s-3)';
    u.style.width = '100%';
    u.onclick = function () {
      TRAIN.undoNotes(out.undo);
      done.innerHTML = '<div class="empty">Undone. Nothing from these notes is in the log.</div>';
      draw(); draw_();

    done.appendChild(u);
    draw(); draw_();
  };
  draw_();
  if (UI.focusSoon) UI.focusSoon(ta); else ta.focus();
};

TRAIN.statsHtml = function (s) {
  var line = function (k, v) {
    return '<div class="imp-stat"><span>' + k + '</span><b>' +
      (typeof v === 'number' ? v.toLocaleString() : v) + '</b></div>';
  };
  return line('Sets', s.sets) + line('Training days', s.days) +
    line('Exercises', s.exercises) + line('Categories', s.categories) +
    line('Set comments', s.setComments) +
    (s.orphanComments ? line('Comments on deleted sets, skipped', s.orphanComments) : '') +
    line('Session timings', s.workoutTimes) +
    line('Supersets', s.supersets) + line('Personal records', s.prSets) +
    line('Entered in kg / lb', s.kgSets + ' / ' + s.lbSets) +
    line('Routines', s.routines) +
    line('Rows written', s.rowsWritten + ' of ' + s.rowsBuilt);
};

/* The marker that says this set carries a comment. Four thousand of his sets
