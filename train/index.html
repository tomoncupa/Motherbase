/* ═════════════════ PLATE CALCULATOR ═════════════════
   Which plates go on each side to make a number. Greedy from the heaviest
   down, which is what anyone does at the rack. */
TRAIN.plateSolve = function (targetKg, barKg, barUnit) {
  var perSide = (targetKg - barKg) / 2;
  if (perSide <= 0) return { ok: Math.abs(perSide) < 0.01, used: [], left: perSide, perSide: perSide };
  var enabled = TRAIN.gymPlates().filter(function (p) { return p.on !== 0; });
  var greedy = function (plates) {
    var used = [], rem = perSide;
    plates.slice().sort(function (a, b) { return b.kg - a.kg; }).forEach(function (p) {
      var cap = p.n ? Math.floor(p.n / 2) : 20;
      var n = Math.min(cap, Math.floor((rem + 1e-6) / p.kg));
      if (n > 0) { used.push({ kg: p.kg, w: p.w, u: p.u, n: n }); rem -= n * p.kg; }
    });
    return { ok: Math.abs(rem) < 0.01, used: used, left: rem };
  };
  /* A gym with both kilogram and pound plates switched on made 100 kg out of
     a 45 lb, a 35 lb and change, 0.08 kg short, when 20 + 20 kg is exact. So
     the bar's own unit is tried alone first, then the unit on screen, then
     everything together, and the first exact answer wins. */
  var tries = [];
  [barUnit, TRAIN.unit()].forEach(function (u) { if (u && tries.indexOf(u) < 0) tries.push(u); });
  var sets = tries.map(function (u) { return enabled.filter(function (p) { return p.u === u; }); }).concat([enabled]);
  var best = null;
  sets.forEach(function (set) {
    if (!set.length || (best && best.ok)) return;
    var r = greedy(set);
    if (!best || r.ok || Math.abs(r.left) < Math.abs(best.left)) best = r;
  });
  best = best || { ok: false, used: [], left: perSide };
  best.perSide = perSide;
  return best;
};

TRAIN.platePanel = function (prefillKg) {
  var bars = TRAIN.gymBars();
  UI.dialog({
    title: 'PLATE CALCULATOR', width: 420,
    body: function (b) {
      var unit = TRAIN.unit();
      var barKg = bars[0].u === 'lb' ? bars[0].w / LB_PER_KG : bars[0].w;
      var wrap = UI.el('div');
      var w = UI.field('decimal', {
        placeholder: 'target ' + TRAIN.unitLabel(),
        value: prefillKg ? TRAIN.showWeight(prefillKg, null) : '',
      });
      wrap.appendChild(UI.row('Target weight', 'total on the bar, in ' + TRAIN.unitLabel(), w));

      var barSel = document.createElement('select');
      barSel.className = 'mb-input';
      bars.forEach(function (bar, i) {
        var o = document.createElement('option');
        o.value = String(i);
        o.textContent = (Math.round(TRAIN.toUnit(bar.u === 'lb' ? bar.w / LB_PER_KG : bar.w, unit) * 10) / 10) +
          ' ' + TRAIN.unitLabel();
        barSel.appendChild(o);
      });
      wrap.appendChild(UI.row('Bar', 'The empty bar', barSel));
      var pref = bars.map(function (x) { return x.u; }).indexOf(unit);
      if (pref > 0) barSel.value = String(pref);

      var out = UI.el('div');
      out.style.marginTop = 'var(--s-4)';
      wrap.appendChild(out);
      b.appendChild(wrap);

      var run = function () {
        var bar = bars[parseInt(barSel.value, 10) || 0];
        barKg = bar.u === 'lb' ? bar.w / LB_PER_KG : bar.w;
        var target = TRAIN.toKg(parseFloat(w.value) || 0, unit);
        if (!target) { out.innerHTML = '<div class="empty">Enter a weight.</div>'; return; }
        var sol = TRAIN.plateSolve(target, barKg, bar.u);
        if (sol.perSide <= 0) {
          out.innerHTML = '<div class="empty">That is at or below the bar on its own.</div>';
          return;
        }
        var rows = sol.used.map(function (u) {
          return '<div class="recline"><span class="k">' +
            (u.w != null ? u.w + ' ' + u.u + 's' : (Math.round(TRAIN.toUnit(u.kg, unit) * 100) / 100) + ' ' + TRAIN.unitLabel()) +
            '</span><span class="v">× ' + u.n + '</span><span class="d"></span></div>';
        }).join('');
        out.innerHTML = '<div class="mb-group">EACH SIDE</div>' + rows +
          (sol.ok ? '' : '<div class="empty">Closest possible — <b>' +
            (Math.round(TRAIN.toUnit(sol.left, unit) * 100) / 100) + ' ' + TRAIN.unitLabel() +
            '</b> per side short with the plates you have.</div>');
      };
      w.oninput = run; barSel.onchange = run;
      run();
    },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
};

/* ═════════════════════════════════════════════════════════════════════════
   PARITY

   Everything FitNotes does that TRAIN did not, built 2026-09-14 because Tom
   will not move until it is all here. Each piece names the FitNotes screen or
   string it reproduces, so the next session can check it against the app
   rather than against this file.
   ═════════════════════════════════════════════════════════════════════════ */

/* The kit's class names, in one place. */
var CHIPS = 'mb-chips', CHIP = 'mb-chip', SEL = 'mb-sel';

function copyObj(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function fmt1(v) { return (Math.round(v * 10) / 10).toFixed(1); }

/* A drawing for a role, from the shared set. */
function ico(role) { return (window.Icons && Icons.svg(role)) || ''; }
/* A menu where the press was. shared/ui.js ignores presses inside its own
   menu since 2026-09-14, so this only works out where to put it. */
function menuAt(e, items, title) {
  var x = e && e.clientX != null ? e.clientX : innerWidth / 2;
  var y = e && e.clientY != null ? e.clientY : innerHeight / 2;
  return UI.menu(x, y, items, { title: title || '' });
}

/* Right click and long press on one element, landing on the same menu.
   DOCTRINE law 14. The press is Mobile.hold's, which also swallows the click
   that follows a hold so the row underneath does not open as well. */
function withMenu(el, fn) {
  Mobile.hold(el, function (e) { fn(e); }, { skip: '.nohold' });
  return el;
}

/* A small icon button that opens a row's menu, so every menu has a visible
   way in and the hold is only ever a shortcut. DOCTRINE law 6. */
function rowMenuBtn(label, fn) {
  var b = UI.el('button', 'ico rowmenu nohold mb-press mb-tap');
  b.innerHTML = ico('menu');
  b.setAttribute('aria-label', label);
  b.onclick = function (e) { e.stopPropagation(); fn(e); };
  return b;
}

/* ═══════════════ CHANGING A ROW WITHOUT LOSING WHAT YOU DID NOT TOUCH ═══════════════
   Rec.set replaces the whole payload. A writer that rebuilds a row from its
   own list of fields drops every field it does not know about, with nothing
   said — commentWorkout wrote {start, end, note} and so wiped the `from` that
   makes a copied day compare itself. Every edit reads the row, changes its
   own fields, and writes the rest back as it found them. `undefined` clears. */
TRAIN.patchRow = function (type, date, key, changes) {
  var cur = Rec.get(type, date, key) || {};
  var next = {}, k;
  for (k in cur) next[k] = cur[k];
  for (k in changes) {
    if (changes[k] === undefined) delete next[k]; else next[k] = changes[k];
  }
  Rec.set(type, date, key, next);
  return next;
};
TRAIN.patchSession = function (date, changes) { return TRAIN.patchRow('session', date, '', changes); };
TRAIN.patchExercise = function (id, changes) { return TRAIN.patchRow('exercise', null, id, changes); };

/* ═══════════════ EXERCISE TYPES ═══════════════
   FitNotes has six: weight and reps, distance and time, weight and distance,
   weight and time, reps and distance, reps and time. A type is stored as the
   two fields it logs.

   Older rows carry what came before this: 0 and 2 from the seeded list, 1 for
   cardio, 'weight_reps' and 'distance_time' from the importer, and null for
   the four FitNotes types whose numbers could not be pinned down from his
   file. Those last ones are read off what was actually logged against them,
   which is the only evidence there is. */
var KIND_FIELDS = { wr: ['w', 'r'], dt: ['d', 't'], wd: ['w', 'd'], wt: ['w', 't'], rd: ['r', 'd'], rt: ['r', 't'] };
var KIND_NAMES = { wr: 'Weight and reps', dt: 'Distance and time', wd: 'Weight and distance',
                   wt: 'Weight and time', rd: 'Reps and distance', rt: 'Reps and time' };

TRAIN.kindOf = function (exOrId) {
  var id = typeof exOrId === 'string' ? exOrId : null;
  var ex = id ? TRAIN.exercises()[id] : exOrId;
  var k = ex && ex.kind;
  if (KIND_FIELDS[k]) return k;
  if (k === 1 || k === 'distance_time') return 'dt';
  if (k === 0 || k === 2 || k === 'weight_reps') return 'wr';
  if (!id) return 'wr';
  var f = { w: 0, r: 0, d: 0, t: 0 };
  TRAIN.historyOf(id).forEach(function (s) {
    if (s.kg) f.w++; if (s.r) f.r++; if (s.dist) f.d++; if (s.dur) f.t++;
  });
  var used = ['w', 'r', 'd', 't'].filter(function (x) { return f[x]; })
    .sort(function (a, b) { return f[b] - f[a]; }).slice(0, 2);
  if (used.length === 2) {
    var code = ['w', 'r', 'd', 't'].filter(function (x) { return used.indexOf(x) > -1; }).join('');
    if (KIND_FIELDS[code]) return code;
  }
  if (used.length === 1) return { w: 'wr', r: 'wr', d: 'dt', t: 'wt' }[used[0]];
  return 'wr';
};
TRAIN.fieldsOf = function (exOrId) { return KIND_FIELDS[TRAIN.kindOf(exOrId)]; };

/* Distance is stored in kilometres and shown in the unit chosen. */
var KM_PER_MI = 1.609344;
TRAIN.distUnit = function () { return Rec.setting(APP.id, 'distUnit') || 'km'; };
TRAIN.showDist = function (km) {
  var v = TRAIN.distUnit() === 'mi' ? km / KM_PER_MI : km;
  return (Math.round(v * 100) / 100).toFixed(2);
};
TRAIN.toKm = function (v) { return TRAIN.distUnit() === 'mi' ? v * KM_PER_MI : v; };

/* "1:30" is ninety seconds, "1:02:00" is an hour and two minutes, and a bare
   number is seconds. */
TRAIN.parseTime = function (txt) {
  var t = String(txt == null ? '' : txt).trim();
  if (!t) return NaN;
  var parts = t.split(':');
  var total = 0;
  for (var i = 0; i < parts.length; i++) {
    var n = parseFloat(parts[i]);
    if (isNaN(n)) return NaN;
    total = total * 60 + n;
  }
  return Math.round(total);
};

/* ═══════════════ ORDER ═══════════════ */

/* When a set was made, as far as its key can say. FitNotes ids count up in
   the order sets were entered, and TRAIN's own keys lead with the clock, so
   the earliest set of each exercise says where that exercise sat in the day. */
TRAIN.setStamp = function (s) {
  var k = String(s.key || '');
  if (/^fn\d+$/.test(k)) return +k.slice(2);
  if (/^csv-/.test(k)) return 1e14 + (+k.split('-').pop() || 0);
  var m = k.match(/^[^-]+-([0-9a-z]+)-/);
  if (m) { var n = parseInt(m[1], 36); if (isFinite(n)) return n; }
  return 1e15 + (s.ord || 0);
};

/* Swap one exercise with its neighbour in a day. The order lives on the day's
   own session row, so it is one fact on one row. */
TRAIN.moveInDay = function (date, exId, dir) {
  var ids = TRAIN.dayGroups(date).map(function (g) { return g.ex; });
  var i = ids.indexOf(exId), j = i + dir;
  if (i < 0 || j < 0 || j >= ids.length) return false;
  ids[i] = ids[j]; ids[j] = exId;
  TRAIN.patchSession(date, { order: ids });
  return true;
};

/* Swap a keyed row with its neighbour, then write every `ord` in the list so
   the order is whole again even if it was never set. */
TRAIN.moveOrd = function (type, date, keys, key, dir) {
  var i = keys.indexOf(key), j = i + dir;
  if (i < 0 || j < 0 || j >= keys.length) return false;
  var list = keys.slice();
  list[i] = list[j]; list[j] = key;
  list.forEach(function (k, n) {
    var cur = Rec.get(type, date, k);
    if (cur && cur.ord !== n) TRAIN.patchRow(type, date, k, { ord: n });
  });
  return true;
};

/* ═══════════════ EXERCISES ═══════════════ */

/* FitNotes deletes an exercise's sets with it, and says so. So does this, with
   the count in the question and an undo after. */
TRAIN.deleteExercise = function (id) {
  var ex = TRAIN.exercises()[id];
  if (!ex) { console.warn('[train] no exercise', id); return; }
  var hist = TRAIN.historyOf(id).slice();
  var go = function () {
    var gone = hist.map(function (s) { return { date: s.date, key: s.key, p: Rec.get('set', s.date, s.key) }; });
    var days = {};
    gone.forEach(function (g) { Rec.del('set', g.date, g.key); days[g.date] = 1; });
    Rec.del('exercise', null, id);
    TRAIN.reindex();
    Object.keys(days).forEach(TRAIN.assertTick);
    if (TRAIN.exId === id && TRAIN.screen === 'training') TRAIN.show('workout'); else draw();
    Mobile.haptic('warn');
    UI.undo('<b>' + UI.esc(ex.name) + '</b> deleted', function () {
      Rec.set('exercise', null, id, ex);
      gone.forEach(function (g) { if (g.p) Rec.set('set', g.date, g.key, g.p); });
      TRAIN.reindex();
      Object.keys(days).forEach(TRAIN.assertTick);
      draw();
    });
  };
  if (!hist.length) return go();
  UI.confirm('Delete ' + UI.esc(ex.name) + '?',
    hist.length.toLocaleString() + ' sets recorded for this exercise will also be deleted.',
    { yes: 'DELETE', danger: true }).then(function (yes) { if (yes) go(); });
};

TRAIN.catsSorted = function () {

  return Object.keys(cats).sort(function (a, b) {

/* FitNotes deletes a category's exercises, and every set under them, along
   with the category. TRAIN moves them to another category instead: four years
   of sets should not ride on a tidy-up. Listed in Deliberate departures. */
TRAIN.deleteCategory = function (id) {
  var cats = TRAIN.cats(), cat = cats[id];
  if (!cat) return;
  var exs = TRAIN.exercises();
  var inIt = Object.keys(exs).filter(function (k) { return exs[k].cat === id; });
  var others = TRAIN.catsSorted().filter(function (k) { return k !== id; });
  var finish = function (to) {
    var moved = inIt.map(function (k) { return { k: k, was: exs[k].cat }; });
    moved.forEach(function (mv) { TRAIN.patchExercise(mv.k, { cat: to }); });
    Rec.del('excat', null, id);
    draw();
    Mobile.haptic('warn');
    UI.undo('<b>' + UI.esc(cat.name) + '</b> deleted', function () {
      Rec.set('excat', null, id, cat);
      moved.forEach(function (mv) { TRAIN.patchExercise(mv.k, { cat: mv.was }); });
      draw();
    });
  };
  if (!inIt.length) return finish(null);
  if (!others.length) return UI.toast('Add another category first', { bad: true });
  var sel = null;
  UI.dialog({
    title: 'DELETE CATEGORY', width: 420,
    body: function (b) {
      var p = UI.el('div', 'empty');
      p.textContent = inIt.length + ' exercises in ' + cat.name + ' move to';
      b.appendChild(p);
      sel = document.createElement('select');
      sel.className = SEL;
      others.forEach(function (k) {
        var o = document.createElement('option');
        o.value = k; o.textContent = cats[k].name;
        sel.appendChild(o);
      });
      b.appendChild(sel);
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'DELETE', kind: 'bad', fn: function () { finish(sel.value); } },
    ],
  });
};

TRAIN.removeFromDay = function (date, exId) {
  var gone = TRAIN.setsOn(date).filter(function (s) { return s.ex === exId; })
    .map(function (s) { return { key: s.key, p: Rec.get('set', date, s.key) }; });
  if (!gone.length) return;
  gone.forEach(function (g) { Rec.del('set', date, g.key); });
  TRAIN.reindex();
  TRAIN.assertTick(date);
  if (TRAIN.screen === 'training' && TRAIN.exId === exId) TRAIN.show('workout'); else draw();
  Mobile.haptic('warn');

    gone.forEach(function (g) { if (g.p) Rec.set('set', date, g.key, g.p); });
    TRAIN.reindex();
    TRAIN.assertTick(date);
    draw();
  });
};

/* Replace one exercise with another for a day: every set moves across, and
   the day's order and any superset follow it. Records are worked out again
   for both, because a set just changed which movement it belongs to. */
TRAIN.replaceInDay = function (date, fromId, toId) {
  if (!fromId || !toId || fromId === toId) return 0;
  var n = 0;
  TRAIN.setsOn(date).filter(function (s) { return s.ex === fromId; }).forEach(function (s) {
    TRAIN.patchRow('set', date, s.key, { ex: toId }); n++;
  });
  var sess = Rec.get('session', date, '');
  if (sess && sess.order) {
    TRAIN.patchSession(date, { order: sess.order.map(function (x) { return x === fromId ? toId : x; }) });
  }
  TRAIN.groupsOn(date).forEach(function (g) {
    if ((g.g.ex || []).indexOf(fromId) > -1) {
      TRAIN.patchRow('sgroup', date, g.key, { ex: g.g.ex.map(function (x) { return x === fromId ? toId : x; }) });
    }
  });
  TRAIN.reindex();
  TRAIN.recomputePRs([fromId, toId]);
  return n;
};

/* ═══════════════ RECORDS FOR ONE EXERCISE ═══════════════ */

TRAIN.repCounts = function () {
  var v = Rec.setting(APP.id, 'repCounts');
  return Array.isArray(v) && v.length ? v : [1, 2, 3, 4, 5, 6, 8, 10, 12];
};

/* The heaviest set at exactly this many reps, or the weight the best estimated
   one-rep max says you could move for this many. FitNotes shows the two as
   Actual and Estimated Personal Records. */
TRAIN.repMax = function (rec, reps, est) {
  if (!est) return rec.byReps[reps] ? rec.byReps[reps].kg : 0;
  var best = rec.max1rm ? TRAIN.e1rm(rec.max1rm.kg, rec.max1rm.r) : 0;
  if (!best || reps >= 37) return 0;
  return best * (37 - reps) / 36;
};

function distTimeRecords(exId) {
  var out = { dist: null, dur: null, pace: null };
  TRAIN.historyOf(exId).forEach(function (s) {
    if (s.warm) return;
    if (s.dist > 0 && (!out.dist || s.dist > out.dist.dist)) out.dist = s;
    if (s.dur > 0 && (!out.dur || s.dur > out.dur.dur)) out.dur = s;
    if (s.dist > 0 && s.dur > 0) {
      var p = s.dur / s.dist;
      if (!out.pace || p < out.pace.dur / out.pace.dist) out.pace = s;
    }
  });
  return out;
}

/* An exercise's records as a card made to be shared: its best four and when
   the latest record was set. Tom, 2026-09-14, wanted a picture of a new record
   alongside the session, the week and a graph. */
TRAIN.recordsCard = function (exId) {
  var ex = TRAIN.exercises()[exId];
  if (!ex) return null;
  var rec = TRAIN.recordsFor(exId), kind = TRAIN.kindOf(exId), U = TRAIN.unitLabel(), esc = UI.esc;
  if (!rec.sets) return null;
  var today = Day.today(), ph = TRAIN.phaseOn(today), cells = [];
  var cell = function (label, val, unit, d) {
    cells.push('<div><span>' + label + '</span><b>' + val + (unit ? ' <small>' + unit + '</small>' : '') + '</b>' +
      (d ? '<em>' + esc(Day.label(d, { day: 'numeric', month: 'short', year: 'numeric' })) + '</em>' : '') + '</div>');
  };
  if (kind === 'dt' || kind === 'rd' || kind === 'rt') {
    var dt = distTimeRecords(exId), du = TRAIN.distUnit();
    if (dt.dist) cell('Max distance', TRAIN.showDist(dt.dist.dist), du, dt.dist.date);
    if (dt.dur) cell('Max time', fmtSecs(dt.dur.dur), '', dt.dur.date);
  }
  if (rec.maxWeight) cell('Heaviest', TRAIN.showWeight(rec.maxWeight.kg, rec.maxWeight.u), U + ' × ' + rec.maxWeight.r, rec.maxWeight.date);
  if (rec.max1rm) cell('Estimated 1RM', fmt1(TRAIN.toUnit(TRAIN.e1rm(rec.max1rm.kg, rec.max1rm.r), TRAIN.unit())), U, rec.max1rm.date);
  if (rec.maxReps) cell('Most reps', rec.maxReps.r, 'reps', rec.maxReps.date);
  if (rec.maxVolume) cell('Most volume',
    Math.round(TRAIN.toUnit(rec.maxVolume.kg * rec.maxVolume.r, TRAIN.unit())).toLocaleString(), U, rec.maxVolume.date);
  var last = TRAIN.historyOf(exId).filter(function (s) { return s.pr; }).slice(-1)[0];
  var card = UI.el('div', 'recap');
  card.innerHTML =
    '<div class="eyebrow"><span>Personal records</span>' + (ph ? '<b>' + esc(TRAIN.phaseLine(ph, today)) + '</b>' : '') + '</div>' +
    '<div class="title">' + esc(ex.name) + '</div>' +
    '<div class="rule"></div>' +
    (cells.length ? '<div class="big4">' + cells.slice(0, 4).join('') + '</div>' : '') +
    (last && (last.kg || last.r) ? '<div class="sub">Latest record ' + esc(Day.label(last.date)) + ': ' +
      (last.kg ? TRAIN.showWeight(last.kg, last.u) + ' ' + U + ' × ' : '') + (last.r || 0) + ' reps</div>' : '');
  return card;
};

function repMaxGrid(rec, est) {

/* The ⓘ on the training screen: what this exercise is, what you have done with

/* FitNotes' Estimated 1RM Calculator. Brzycki is unit-free, so it works in
   whatever unit is on screen and never converts. */
TRAIN.e1rmCalc = function (kg, reps) {
  var w = null, r = null;
  UI.dialog({
    title: 'ESTIMATED 1RM', width: 440,
    body: function (b) {
      w = UI.field('decimal', { value: kg ? TRAIN.showWeight(kg, null) : '', placeholder: TRAIN.unitLabel() });
      r = UI.field('number', { value: reps ? String(reps) : '', placeholder: 'reps' });
      b.appendChild(UI.row('Weight', TRAIN.unitLabel(), w));
      b.appendChild(UI.row('Reps', 'Accuracy drops above 10', r));
      var out = UI.el('div');
      b.appendChild(out);
      var run = function () {
        var W = parseFloat(w.value), R = parseInt(r.value, 10);
        if (!(W > 0) || !(R > 0)) { out.innerHTML = ''; return; }
        if (R >= 37) { out.innerHTML = '<div class="empty">Too many reps to estimate</div>'; return; }
        var one = W * 36 / (37 - R);
        var html = '<div class="bigtime">' + fmt1(one) + ' <span class="u">' + TRAIN.unitLabel() + '</span></div>' +
          '<div class="mb-group">REP MAXES</div><div class="rmgrid">';
        [1, 2, 3, 4, 5, 6, 8, 10, 12, 15].forEach(function (n) {
          html += '<div class="rmcell"><span>' + n + ' RM</span><b>' + fmt1(one * (37 - n) / 36) + '</b></div>';
        });
        html += '</div><div class="mb-group">PERCENTAGE (%)</div><div class="rmgrid">';
        [100, 95, 90, 85, 80, 75, 70, 65, 60, 50].forEach(function (p) {
          html += '<div class="rmcell"><span>' + p + '%</span><b>' + fmt1(one * p / 100) + '</b></div>';
        });
        out.innerHTML = html + '</div>';
      };
      w.oninput = run; r.oninput = run;
      run();
    },
    actions: [{ label: 'CLOSE' }],
  });
  if (!kg) UI.focusSoon(w);
};

/* FitNotes' Set Calculator: a max, a percentage, rounded to the weight step. */
TRAIN.setCalc = function (exId) {
  var ex = exId ? TRAIN.exercises()[exId] : null;
  var rec = exId ? TRAIN.recordsFor(exId) : null;
  var U = TRAIN.unit();
  var maxE = rec && rec.max1rm ? TRAIN.toUnit(TRAIN.e1rm(rec.max1rm.kg, rec.max1rm.r), U) : 0;
  var maxW = rec && rec.maxWeight ? TRAIN.toUnit(rec.maxWeight.kg, U) : 0;
  var inc = TRAIN.increment(ex);
  var result = 0;
  UI.dialog({
    title: 'SET CALCULATOR', width: 440,
    body: function (b) {
      var base = UI.field('decimal', { value: maxE ? fmt1(maxE) : (maxW ? fmt1(maxW) : ''), placeholder: TRAIN.unitLabel() });
      b.appendChild(UI.row('Max', 'The number the percentage is of', base));
      if (maxE || maxW) {
        var quick = UI.el('div', CHIPS);
        [[maxE, 'Est. 1RM'], [maxW, 'Max weight']].forEach(function (q) {
          if (!q[0]) return;
          var c = UI.el('button', CHIP + ' mb-press mb-tap');
          c.textContent = q[1] + ' ' + fmt1(q[0]);
          c.onclick = function (ev) { ev.preventDefault(); base.value = fmt1(q[0]); run(); };
          quick.appendChild(c);
        });
        b.appendChild(quick);
      }
      var pct = UI.field('number', { value: '80' });
      b.appendChild(UI.row('Percentage', '', pct));
      var chips = UI.el('div', CHIPS);
      [50, 60, 65, 70, 75, 80, 85, 90, 95, 100].forEach(function (p) {
        var c = UI.el('button', CHIP + ' mb-press mb-tap');
        c.textContent = p + '%';
        c.onclick = function (ev) { ev.preventDefault(); pct.value = String(p); run(); };
        chips.appendChild(c);
      });
      b.appendChild(chips);
      var out = UI.el('div', 'bigtime');
      b.appendChild(out);
      var note = UI.el('div', 'empty');
      b.appendChild(note);
      function run() {
        var B = parseFloat(base.value), P = parseFloat(pct.value);
        if (!(B > 0) || !(P > 0)) { out.textContent = '—'; note.textContent = ''; result = 0; return; }
        var raw = B * P / 100;
        result = Math.round(raw / inc) * inc;
        out.innerHTML = fmt1(result) + ' <span class="u">' + TRAIN.unitLabel() + '</span>';
        note.textContent = 'Rounded to the closest ' + inc + ' from ' + fmt1(raw);
      }
      base.oninput = run; pct.oninput = run;
      run();
    },
    actions: exId
      ? [{ label: 'CLOSE' }, { label: 'USE', kind: 'go', fn: function () {
          if (result > 0) { TRAIN.draftW = String(Math.round(result * 1000) / 1000); draw(); }
        } }]
      : [{ label: 'CLOSE' }],
  });
};

      step.appendChild(minus); step.appendChild(lbl); step.appendChild(plus);

      b.appendChild(dflt);

      };

      plus.onclick = function () { len = len + 15; Mobile.feedback('tick'); paint(); };

      paint();

  });
};

/* ═══════════════ COPY AND MOVE ═══════════════ */

/* Put the clock times of one day's ISO timestamp onto another day. */
function shiftIso(iso, toDate) {
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  var t = new Date(toDate + 'T00:00:00');
  t.setHours(d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds());
  return t.toISOString();
}

/* Copy one day onto another. The sets arrive unticked, because a copy is a
   plan and not a claim that it happened. A warmup stays a warmup. */
TRAIN.copyDay = function (from, to, opts) {
  opts = opts || {};
  if (!from || !to || from === to) return 0;
  var n = TRAIN.setsOn(to).length, made = 0;
  TRAIN.dayGroups(from).forEach(function (g) {
    g.sets.forEach(function (s) {
      Rec.set('set', to, TRAIN.newId(), {
        ex: s.ex, kg: s.kg || 0, r: s.r || 0, u: s.u, done: 0, pr: 0, prf: 0,
        dist: s.dist || 0, dur: s.dur || 0, note: opts.comments ? (s.note || '') : '',
        ord: ++n, warm: s.warm ? 1 : 0, su: s.su ? copyObj(s.su) : undefined,
      });
      made++;
    });
  });
  if (opts.supersets) {
    TRAIN.groupsOn(from).forEach(function (g) { Rec.set('sgroup', to, TRAIN.newId(), copyObj(g.g)); });
  }
  var src = Rec.get('session', from, '') || {};
  var changes = { from: from };
  /* A copy is the same session again, so it carries the name, which is what
     it is compared by. A name already on the day stays. */
  if (src.name && !(Rec.get('session', to, '') || {}).name) changes.name = src.name;
  if (opts.note && src.note) changes.note = src.note;
  if (opts.time && src.start) {
    changes.start = shiftIso(src.start, to);
    changes.end = src.end ? shiftIso(src.end, to) : null;
  }
  TRAIN.patchSession(to, changes);
  TRAIN.reindex();
  TRAIN.assertTick(to);
  return made;
};

/* Move a whole day. Each set keeps its own key and only its date changes,
   which in this store is a new row on the new date and a tombstone on the old
   one, so the move travels to another device like any other edit. */
TRAIN.moveDay = function (from, to, opts) {
  opts = opts || {};
  if (!from || !to || from === to) return 0;
  var n = 0, existing = TRAIN.setsOn(to).length;
  TRAIN.setsOn(from).slice().forEach(function (s) {
    var p = Rec.get('set', from, s.key);
    if (!p) return;
    p.ord = (p.ord || 0) + existing;
    Rec.set('set', to, s.key, p);
    Rec.del('set', from, s.key);
    n++;
  });
  TRAIN.groupsOn(from).forEach(function (g) {
    Rec.set('sgroup', to, g.key, copyObj(g.g));
    Rec.del('sgroup', from, g.key);
  });
  var src = Rec.get('session', from, '') || {};
  var dst = {}, left = { order: undefined, from: undefined };
  if (src.order) dst.order = src.order;
  if (src.name) { dst.name = src.name; left.name = undefined; }
  if (opts.note && src.note) { dst.note = src.note; left.note = undefined; }
  if (opts.time && src.start) {
    dst.start = shiftIso(src.start, to);
    dst.end = src.end ? shiftIso(src.end, to) : null;
    left.start = undefined; left.end = undefined;
  }
  if (Object.keys(dst).length) TRAIN.patchSession(to, dst);
  if (Rec.has('session', from, '')) TRAIN.patchSession(from, left);
  TRAIN.reindex();
  TRAIN.assertTick(from);
  TRAIN.assertTick(to);
  return n;
};

/* The calendar is how FitNotes asks which day. The same screen, with a banner
   saying what the tap is for. */
TRAIN.pickDate = function (title, onPick) {

/* ═══════════════ DELETE WORKOUT HISTORY ═══════════════
   FitNotes' "Delete selected workouts while keeping the rest of your data
   intact". A date range, optionally one exercise, a count in the question,
   and an undo. */
TRAIN.deleteHistoryDialog = function () {
  var exs = TRAIN.exercises();
  var ids = Object.keys(exs).sort(function (a, b) { return exs[a].name.localeCompare(exs[b].name); });
  var from = null, to = null, sel = null;
  UI.dialog({
    title: 'DELETE TRAINING HISTORY', width: 440,
    body: function (b) {
      from = UI.field('date', {});
      to = UI.field('date', { value: Day.today() });
      b.appendChild(UI.row('Start Date', '', from));
      b.appendChild(UI.row('End Date', '', to));
      sel = document.createElement('select');
      sel.className = SEL;
      var all = document.createElement('option');
      all.value = ''; all.textContent = 'All exercises';
      sel.appendChild(all);
      ids.forEach(function (id) {
        if (!TRAIN.historyOf(id).length) return;
        var o = document.createElement('option');
        o.value = id; o.textContent = exs[id].name;
        sel.appendChild(o);
      });
      b.appendChild(UI.row('Exercises', '', sel));
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'DELETE', kind: 'bad', fn: function () {
        var f = from.value, t = to.value, only = sel.value;
        if (!f || !t || f > t) { UI.toast('Please select a start and end date', { bad: true }); return false; }
        var victims = [];
        Object.keys(TRAIN.idx.byDate).forEach(function (d) {
          if (d < f || d > t) return;
          TRAIN.idx.byDate[d].forEach(function (s) { if (!only || s.ex === only) victims.push({ date: d, key: s.key }); });
        });
        if (!victims.length) { UI.toast('There are no sessions to delete', { bad: true }); return false; }
        var days = {};
        victims.forEach(function (v) { days[v.date] = 1; });
        setTimeout(function () {
          UI.confirm('Delete ' + victims.length.toLocaleString() + ' sets?',
            Object.keys(days).length + ' sessions between ' + Day.label(f) + ' and ' + Day.label(t) + '.',
            { yes: 'DELETE', danger: true }).then(function (yes) {
            if (!yes) return;
            var held = victims.map(function (v) { return { date: v.date, key: v.key, p: Rec.get('set', v.date, v.key) }; });
            var sessions = [];
            held.forEach(function (h) { Rec.del('set', h.date, h.key); });
            if (!only) Object.keys(days).forEach(function (d) {
              var s = Rec.get('session', d, '');
              if (s) { sessions.push({ date: d, p: s }); Rec.del('session', d, ''); }
            });
            TRAIN.reindex();
            Object.keys(days).forEach(TRAIN.assertTick);
            draw();
            Mobile.haptic('warn');
            UI.undo('Sessions deleted successfully', function () {
              held.forEach(function (h) { if (h.p) Rec.set('set', h.date, h.key, h.p); });
              sessions.forEach(function (s) { Rec.set('session', s.date, '', s.p); });
              TRAIN.reindex();
              Object.keys(days).forEach(TRAIN.assertTick);
              draw();
            });
          });
        }, 60);
      } },
    ],
  });
};

/* ═══════════════ PLATES AND BARS ═══════════════

TRAIN.gymPlates = function () {

/* ═══════════════ ROUTINES: PREDEFINED SETS ═══════════════
   `fill` is what a routine exercise puts into a workout. FitNotes' three:
     0  Don't populate any sets
     1  Copy previous sets       what you did last time, whichever routine
     2  Use predefined sets      these, with a blank field copied from last time
   The number FitNotes stores for each could not be checked against his file,
   which has no routines; an imported routine's mode is its populate_sets_type
   taken as it is. */
var FILL_NAMES = ["Don't populate any sets", 'Copy previous sets', 'Use predefined sets'];

TRAIN.lastSetsOf = function (exId, before) {
  var hist = TRAIN.historyOf(exId).filter(function (s) { return s.date < before && !s.warm; });
  if (!hist.length) return [];
  var d = hist[hist.length - 1].date;
  return hist.filter(function (s) { return s.date === d; });
};

TRAIN.fillFor = function (px, date, forLogAll) {
  var prev = TRAIN.lastSetsOf(px.ex, date);
  if ((px.fill | 0) === 1) {
    if (prev.length) return prev.map(function (s) { return { kg: s.kg, r: s.r, dist: s.dist, dur: s.dur }; });
  } else if ((px.fill | 0) === 2 && px.sets && px.sets.length) {
    return px.sets.map(function (s, i) {
      var p = prev[i] || prev[prev.length - 1] || {};
      return {
        kg: s.kg == null ? (p.kg || 0) : s.kg, r: s.r == null ? (p.r || 0) : s.r,
        dist: s.dist || 0, dur: s.dur || 0,
      };
    });
  }
  /* LOG ALL still makes one placeholder set for an exercise with nothing to
     fill it, which is what FitNotes does, so the exercise is in the day. */
  return forLogAll ? [{ kg: 0, r: 0 }] : [];
};

function writeFilled(exId, date, list) {
  var n = TRAIN.setsOn(date).length;
  list.forEach(function (s) {
    Rec.set('set', date, TRAIN.newId(), {
      ex: exId, kg: s.kg || 0, r: s.r || 0, u: TRAIN.unit(), done: 0, pr: 0, prf: 0,
      dist: s.dist || 0, dur: s.dur || 0, note: '', ord: ++n,
    });
  });
  return list.length;
}

/* Tapping an exercise in a routine goes to its training screen, with its
   sets already filled in if the routine says so. */
TRAIN.logFromRoutine = function (key) {
  var px = Rec.get('progex', null, key);
  if (!px) return;
  var date = TRAIN.date;
  var have = TRAIN.setsOn(date).some(function (s) { return s.ex === px.ex; });
  var made = have ? 0 : writeFilled(px.ex, date, TRAIN.fillFor(px, date, false));
  if (made) { TRAIN.reindex(); TRAIN.assertTick(date); }
  TRAIN.openExercise(px.ex);
  if (made && Rec.setting(APP.id, 'autoNext') !== 0) TRAIN.selectNextOpen();
};

TRAIN.progexDialog = function (key) {
  var cur = Rec.get('progex', null, key);
  if (!cur) return;
  var ex = TRAIN.exercises()[cur.ex] || { name: 'Exercise' };
  var fill = cur.fill | 0, sets = (cur.sets || []).map(copyObj);
  UI.dialog({
    title: 'PREDEFINED SETS', width: 460,
    body: function (b) {
      var paint = function () {
        b.innerHTML = '';
        var g = UI.el('div', 'mb-group'); g.textContent = ex.name.toUpperCase(); b.appendChild(g);
        b.appendChild(UI.segmented([{ id: '0', name: 'NONE' }, { id: '1', name: 'PREVIOUS' }, { id: '2', name: 'PREDEFINED' }],
          String(fill), function (v) { fill = parseInt(v, 10); paint(); }));
        var say = UI.el('div', 'empty');
        say.style.marginTop = 'var(--s-3)';
        say.textContent = FILL_NAMES[fill];
        b.appendChild(say);
        if (fill !== 2) return;
        var hint = UI.el('div', 'empty');
        hint.textContent = 'A blank field is copied from the previous session.';
        b.appendChild(hint);
        sets.forEach(function (s, i) {
          var row = UI.el('div', 'mrow');
          var n = UI.el('span', 'nm');
          n.textContent = 'Set ' + (i + 1);
          row.appendChild(n);
          var w = UI.field('decimal', { value: s.kg == null ? '' : TRAIN.showWeight(s.kg, s.u), placeholder: TRAIN.unitLabel() });
          w.className += ' count';
          w.setAttribute('aria-label', 'Set ' + (i + 1) + ' weight');
          w.oninput = function () { var v = parseFloat(w.value); s.kg = isNaN(v) ? null : TRAIN.toKg(v, TRAIN.unit()); s.u = TRAIN.unit(); };
          var r = UI.field('number', { value: s.r == null ? '' : String(s.r), placeholder: 'reps' });
          r.className += ' count';
          r.setAttribute('aria-label', 'Set ' + (i + 1) + ' reps');
          r.oninput = function () { var v = parseInt(r.value, 10); s.r = isNaN(v) ? null : v; };
          var del = UI.el('button', 'ico mb-press mb-tap');
          del.innerHTML = ico('del'); del.setAttribute('aria-label', 'Delete set ' + (i + 1));
          del.onclick = function () { sets.splice(i, 1); paint(); };
          row.appendChild(w); row.appendChild(r); row.appendChild(del);
          b.appendChild(row);
        });
        var add = UI.el('button', 'mb-btn mb-press mb-tap');
        add.style.width = '100%';
        add.textContent = 'ADD SET';
        add.onclick = function () {
          var last = sets[sets.length - 1];
          sets.push(last ? copyObj(last) : { kg: null, r: 5, u: TRAIN.unit() });
          paint();
        };
        b.appendChild(add);
      };
      paint();
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: function () {
        TRAIN.patchRow('progex', null, key, { fill: fill, sets: sets });
        draw();
        UI.toast('Routine updated successfully');
      } },
    ],
  });
};

TRAIN.copyProgram = function (progId) {

TRAIN.deleteProgram = function (progId) {

/* ═══════════════ SUPERSETS IN USE ═══════════════ */
TRAIN.groupOf = function (date, exId) {
  var gs = TRAIN.groupsOn(date);
  for (var i = 0; i < gs.length; i++) if ((gs[i].g.ex || []).indexOf(exId) > -1) return gs[i];
  return null;
};

/* ═══════════════ AUTO-SELECT NEXT SET ═══════════════
   FitNotes' setting of that name. On a day that was copied or filled from a
   routine, the next set still to be done loads into the steppers, so logging
   it is change-the-number and press UPDATE. */
function loadDraft(s) {
  TRAIN.draftW = s.kg ? TRAIN.showWeight(s.kg, s.u) : '';
  TRAIN.draftR = s.r ? String(s.r) : '';
  TRAIN.draftD = s.dist ? TRAIN.showDist(s.dist) : '';
  TRAIN.draftT = s.dur ? fmtSecs(s.dur) : '';
  if (s.su) TRAIN.draftSU = copyObj(s.su);
}
TRAIN.selectNextOpen = function () {
  var nxt = TRAIN.setsOn(TRAIN.date).filter(function (s) { return s.ex === TRAIN.exId && !s.done; })[0];
  if (!nxt) return false;
  TRAIN.sel = nxt.key;
  loadDraft(nxt);
  draw();
  return true;
};

/* ═══════════════ KEEP SCREEN ON ═══════════════
   FitNotes' "Prevent the device from sleeping while the training screen is
   open". A screen that stays on is also a tab that is never suspended, which
   is what lets the rest timer ring. */
TRAIN.wakeLock = null;
TRAIN.canWake = function () { return typeof navigator !== 'undefined' && 'wakeLock' in navigator; };
TRAIN.wake = function () {
  if (!TRAIN.canWake()) return;
  var want = Rec.setting(APP.id, 'keepAwake') === 1 && !document.hidden;
  if (want && !TRAIN.wakeLock) {
    navigator.wakeLock.request('screen').then(function (lock) {
      TRAIN.wakeLock = lock;
      lock.addEventListener('release', function () { TRAIN.wakeLock = null; });
    }).catch(function (e) { console.warn('[train] wake lock refused', e && e.message); });
  } else if (!want && TRAIN.wakeLock) {
    TRAIN.wakeLock.release().catch(function () {});
    TRAIN.wakeLock = null;
  }
};

/* ═══════════════ WORKOUT GRAPHS ═══════════════
   FitNotes' Weekly, Monthly and Yearly Graphs: workouts, sets, reps, volume
   and duration per period, across every exercise. */

/* chart.js carries its readable steps past 5000 since 2026-09-14, so a
   month of volume in pounds gets a scale of its own. */
function fitY(c, values, zero) {
  return c.yFit(values, zero ? { min: 0, include: 0 } : {});
}
function bucketOf(date, by) {
  if (by === 'year') return date.slice(0, 4) + '-01-01';
  if (by === 'month') return date.slice(0, 7) + '-01';
  var ws = TRAIN.weekStartDow();
  var back = (Day.dow(date) - ws + 7) % 7;
  return Day.shift(date, -back);
}
function nextBucket(b, by) {
  if (by === 'week') return Day.shift(b, 7);
  var d = new Date(b + 'T12:00:00');
  if (by === 'month') d.setMonth(d.getMonth() + 1); else d.setFullYear(d.getFullYear() + 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
}

TRAIN.workoutSeries = function (metric, by) {
  var sums = {}, dates = Object.keys(TRAIN.idx.byDate).sort();
  if (!dates.length) return [];
  dates.forEach(function (d) {
    var b = bucketOf(d, by);
    var work = TRAIN.idx.byDate[d].filter(function (s) { return !s.warm && TRAIN.counts(s); });
    if (!work.length) return;
    var v = 0;
    if (metric === 'workouts') v = 1;
    else if (metric === 'sets') v = work.length;
    else if (metric === 'reps') work.forEach(function (s) { v += s.r || 0; });
    else if (metric === 'volume') v = TRAIN.toUnit(TRAIN.volume(work), TRAIN.unit());
    else if (metric === 'time') {
      var sess = Rec.get('session', d, '') || {};
      v = sess.start && sess.end ? Math.max(0, (Date.parse(sess.end) - Date.parse(sess.start)) / 60000) : 0;
    }
    sums[b] = (sums[b] || 0) + v;
  });
  var span = { week: 26, month: 24, year: 50 }[by];
  var last = bucketOf(Day.today(), by);
  var first = bucketOf(dates[0], by);
  var list = [], b2 = last;
  for (var i = 0; i < span; i++) {
    list.unshift([b2, sums[b2] || 0]);
    if (b2 <= first) break;
    b2 = by === 'week' ? Day.shift(b2, -7) : prevBucket(b2, by);
  }
  return list;
};
function prevBucket(b, by) {
  var d = new Date(b + 'T12:00:00');
  if (by === 'month') d.setMonth(d.getMonth() - 1); else d.setFullYear(d.getFullYear() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
}

function drawWorkoutGraphs(m) {
  var metric = TRAIN.wgMetric || 'workouts', by = TRAIN.wgBy || 'week';
  var controls = UI.el('div', 'exblock pad');
  controls.appendChild(UI.segmented([
    { id: 'workouts', name: 'SESSIONS' }, { id: 'sets', name: 'SETS' }, { id: 'reps', name: 'REPS' },
    { id: 'volume', name: 'VOLUME' }, { id: 'time', name: 'TIME' },
  ], metric, function (v) { TRAIN.wgMetric = v; draw(); }));
  var bySel = UI.segmented([{ id: 'week', name: 'WEEK' }, { id: 'month', name: 'MONTH' }, { id: 'year', name: 'YEAR' }],
    by, function (v) { TRAIN.wgBy = v; draw(); });
  bySel.style.marginTop = 'var(--s-3)';
  controls.appendChild(bySel);
  m.appendChild(controls);

  var series = TRAIN.workoutSeries(metric, by);
  if (!series.length) {
    var e = UI.el('div', 'empty'); e.textContent = 'No sessions to display'; m.appendChild(e);
    return;
  }
  var values = series.map(function (p) { return p[1]; });
  var total = values.reduce(function (a, v) { return a + v; }, 0);
  var card = UI.el('div', 'exblock pad');
  var unitWord = { workouts: 'sessions', sets: 'sets', reps: 'reps', volume: TRAIN.unitLabel(), time: 'minutes' }[metric];
  var perWord = { week: 'week', month: 'month', year: 'year' }[by];
  card.innerHTML = '<div class="fieldlabel">' + UI.esc(metric === 'workouts' ? 'SESSIONS' : metric.toUpperCase()) + ' PER ' + perWord.toUpperCase() + '</div>';
  var box = UI.el('div', 'chartbox');
  card.appendChild(box);
  var avg = total / series.length;
  /* Bars from shared/chart.js: this period lit and the rest quiet, the
     average as a line, and a drag to read any period. */
  var MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var shortOf = function (d) {
    var p = d.split('-');
    return by === 'year' ? p[0] : by === 'month' ? MONS[+p[1] - 1] : +p[2] + ' ' + MONS[+p[1] - 1];
  };
  Chart.mount(box, { label: unitWord + ' per ' + perWord }, function (c) {
    c.xLinear(-0.5, series.length - 0.5);
    fitY(c, values, true);
    c.grid(function (v) { return v >= 10000 ? Math.round(v / 1000) + 'k' : Math.round(v).toLocaleString(); });
    var every = Math.max(1, Math.ceil(series.length / Math.max(2, Math.floor((c.W - c.P.l - c.P.r) / 64))));
    c.labels(series.map(function (p, i) { return [i, shortOf(p[0]), i === series.length - 1]; })
      .filter(function (l, i) { return (series.length - 1 - i) % every === 0; }));
    c.bars(series.map(function (p, i) { return [i, p[1], shortOf(p[0]) + ': ' + Math.round(p[1]).toLocaleString() + ' ' + unitWord]; }),
      null, null, { highlight: 'last' });
    c.rule(avg, 'average');
    c.scrub(series.map(function (p, i) { return [i, p[1]]; }), {
      fmt: function (p) { return Math.round(p[1]).toLocaleString() + ' ' + unitWord + ', ' + shortOf(series[p[0]][0]); },
    });
  });
  var foot = UI.el('div', 'lasttime');
  foot.innerHTML = '<b>' + Math.round(avg).toLocaleString() + '</b> ' + unitWord + ' per ' + perWord +
    ' over the last <b>' + series.length + '</b>';
  card.appendChild(foot);
  m.appendChild(card);
}

/* ═════════════════════════════════════════════════════════════════════════
   TRAINING, NOT WORKING OUT

   Tom, 2026-09-14: "I don't workout, I train." A workout is a selection of
   exercises, maybe random, maybe copied. A training session is designed,
   personal, and meant to move him towards something. So on top of FitNotes:

     a session can have a name, and belongs to a training block
     a repeated session says, set by set, how much stronger each set was
     the end of a session adds itself up, in a card made to be shared
     a week counts the sets each muscle got and how often it was hit
     records start again with each block; the all-time ones stay

   No targets and no verdicts on plateaus, at his request. It states what
   happened and lets him join it up.
   ═════════════════════════════════════════════════════════════════════════ */

/* ── what a comment says ──
   Two things are read out of a set's comment, and ONLY out of the comment
   (Tom: "make it happen automatically due to comments and ONLY due to
   comments"). Nothing is written back: the comment stays the truth, so
   editing it changes what the set is.

   A WARMUP: "warmup", "warm up" or "wu" anywhere in it. 161 of his 2,240 set
   comments. A mark made by hand wins over the comment either way, so "Not a
   warmup" on "start having a dedicated warmup set" sticks.

   A SPLIT SET, in his notation: numbers joined by the rest between them.
     "10 5"   a short rest, about three breaths
     "10,5"   under thirty seconds
     "10+5"   a long rest, still the same set
   Only when the numbers add up to the set's reps. That is what tells a rep
   split from everything else in his comments with two numbers in it: "5 5 4
   4" on a 9-rep curl is per side, "2 10s" is plates, "Seat at 5, 1 yoga pad"
   is a seat. A partial rep rounds down, so "5 1.5" is 6. Read off his file
   2026-09-14: 528 comments are only numbers that add up to the reps, 98 are
   numbers that do not. */
TRAIN.noteWarm = function (note) {
  return !!note && /\bwarm[ -]?ups?\b|\bwu\b/i.test(note);
};
TRAIN.noteSplit = function (note, reps) {
  if (!note || !(reps > 1) || !/\d/.test(note)) return null;
  var rx = /\d+(?:\.\d+)?|\.\d+/g, nums = [], m;
  while ((m = rx.exec(note))) {
    var a = m.index, b = a + m[0].length;
    /* "10s" and "8th" are not rep counts */
    nums.push({ v: parseFloat(m[0]), a: a, b: b,
      ok: !/[A-Za-z0-9_]/.test(note.charAt(a - 1)) && !/[A-Za-z0-9_]/.test(note.charAt(b)) });
  }
  var runs = [], cur = [];
  nums.forEach(function (n) {
    if (!n.ok) { if (cur.length) runs.push(cur); cur = []; return; }
    if (cur.length) {
      var gap = note.slice(cur[cur.length - 1].b, n.a);
      if (/^[ \t]*[,+][ \t]*$/.test(gap) || /^[ \t]+$/.test(gap)) {
        n.rest = gap.indexOf('+') > -1 ? 3 : gap.indexOf(',') > -1 ? 2 : 1;
        cur.push(n);
        return;
      }
      runs.push(cur);
    }
    n.rest = 0;
    cur = [n];
  });
  if (cur.length) runs.push(cur);
  /* Any stretch of a run can be the split: "Height 11, 10 5" is 10 and 5. */
  for (var r = 0; r < runs.length; r++) {
    var run = runs[r];
    for (var i = 0; i < run.length - 1; i++) {
      if (!(run[i].v > 0)) continue;
      var sum = run[i].v, rest = 0;
      for (var j = i + 1; j < run.length; j++) {
        if (!(run[j].v > 0)) break;
        sum += run[j].v;
        rest = Math.max(rest, run[j].rest);
        if (Math.floor(sum + 1e-9) === reps) {
          return { text: note.slice(run[i].a, run[j].b), rest: rest,
                   parts: run.slice(i, j + 1).map(function (x) { return x.v; }) };
        }
        if (sum > reps + 1) break;
      }
    }
  }
  return null;
};

/* A date, with its year when it is not the year of the day it is shown on.
   A comparison can reach back a year, and "Sat, Jun 28" alone reads as last
   month. */
function dayY(d, from) {
  return String(d).slice(0, 4) === String(from || Day.today()).slice(0, 4)
    ? Day.label(d) : Day.label(d, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

/* A set counts once it is done. A past day counts as it was logged: 1,099 of
   his FitNotes sets were never ticked, and Analysis has always counted them.
   Today, a copied or planned set is not work until it is ticked. */
TRAIN.counts = function (s) { return !!s.done || s.date < Day.today(); };

/* One exercise's working sets on a day, in the order they were done. */
function workOn(date, exId) {
  return TRAIN.setsOn(date).filter(function (s) { return s.ex === exId && !s.warm; })
    .sort(function (a, b) { return (a.ord || 0) - (b.ord || 0) || TRAIN.setStamp(a) - TRAIN.setStamp(b); });
}

/* ── training blocks ──
   A block runs from its start until the next block starts, or to its own end
   if it has one. The type is `phase`, not `block`: BLOCK is another app in
   this suite and has nothing to do with training beyond a tick (Tom,
   2026-09-14). On screen it is a training block. */
TRAIN._phC = null;
Rec.on(function () { TRAIN._phC = null; });
TRAIN.phases = function () {
  if (TRAIN._phC) return TRAIN._phC;
  var all = Rec.map('phase');
  return (TRAIN._phC = Object.keys(all).map(function (k) { return { key: k, p: all[k] }; })
    .filter(function (x) { return x.p && x.p.start; })
    .sort(function (a, b) { return a.p.start < b.p.start ? -1 : a.p.start > b.p.start ? 1 : 0; }));
};
TRAIN.phaseSpan = function (list, i) {
  var x = list[i], next = list[i + 1], to = x.p.end || null;
  if (next) {
    var stop = Day.shift(next.p.start, -1);
    if (!to || stop < to) to = stop;
  }
  return { key: x.key, p: x.p, from: x.p.start, to: to };
};
TRAIN.phaseOn = function (date) {
  var list = TRAIN.phases();
  for (var i = list.length - 1; i >= 0; i--) {
    if (list[i].p.start > date) continue;
    var sp = TRAIN.phaseSpan(list, i);
    return !sp.to || date <= sp.to ? sp : null;
  }
  return null;
};
TRAIN.phaseByKey = function (key) {
  var list = TRAIN.phases();
  for (var i = 0; i < list.length; i++) if (list[i].key === key) return TRAIN.phaseSpan(list, i);
  return null;
};
TRAIN.phaseWeek = function (sp, date) { return Math.floor(Day.diff(date, sp.from) / 7) + 1; };
TRAIN.phaseLine = function (sp, date) { return sp.p.name + ' · Week ' + TRAIN.phaseWeek(sp, date); };

TRAIN.phaseDialog = function (key) {
  var cur = key ? Rec.get('phase', null, key) : null, name = null, start = null, end = null;
  UI.dialog({
    title: key ? 'TRAINING BLOCK' : 'NEW TRAINING BLOCK', width: 440,
    body: function (b, h) {
      name = UI.field('text', { value: cur ? cur.name : '', placeholder: 'Summer Cut 2026' });
      start = UI.field('date', { value: cur ? cur.start : Day.today() });
      end = UI.field('date', { value: cur && cur.end ? cur.end : '' });
      b.appendChild(UI.row('Name', '', name));
      b.appendChild(UI.row('Starts', 'Block records count from this day', start));
      b.appendChild(UI.row('Ends', 'Empty runs it until the next block', end));
      Mobile.form(b, function () { if (save()) h.close(); });
    },
    actions: (key ? [{ label: 'DELETE', kind: 'bad', fn: function () {
      setTimeout(function () { TRAIN.deletePhase(key); }, 60);
    } }] : []).concat([
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: function () { if (!save()) return false; } },
    ]),
  });
  UI.focusSoon(name);
  function save() {
    var nm = String(name.value || '').trim(), st = start.value, en = end.value || '';
    if (!nm) { UI.toast('Please enter a name', { bad: true }); UI.focusSoon(name); return false; }
    if (!st) { UI.toast('Please select a start date', { bad: true }); return false; }
    if (en && en < st) { UI.toast('The end is before the start', { bad: true }); return false; }
    TRAIN.patchRow('phase', null, key || TRAIN.newId(), { name: nm, start: st, end: en || undefined });
    Mobile.feedback('success');
    draw();
    return true;
  }
};
TRAIN.deletePhase = function (key) {
  var cur = Rec.get('phase', null, key);
  if (!cur) return;
  UI.confirm('Delete ' + cur.name + '?', 'Its sessions and sets stay.', { yes: 'DELETE', danger: true })
    .then(function (yes) {
      if (!yes) return;
      Rec.del('phase', null, key);
      draw();
      UI.undo('Training block deleted', function () { Rec.set('phase', null, key, cur); draw(); });
    });
};
TRAIN.phaseMenu = function (key, e) {
  var sp = TRAIN.phaseByKey(key);
  if (!sp) return;
  var items = [
    { label: 'Edit', fn: function () { TRAIN.phaseDialog(key); } },
    { label: 'Records In This Block', fn: function () {
      TRAIN.recScope = key; TRAIN.recView = 'records'; TRAIN.show('records');
    } },
  ];
  if (!sp.to && sp.from <= Day.today()) {
    items.push({ label: 'End Today', fn: function () {
      TRAIN.patchRow('phase', null, key, { end: Day.today() }); draw();
    } });
  }
  items.push({ label: 'Delete', kind: 'bad', fn: function () { TRAIN.deletePhase(key); } });
  menuAt(e, items, sp.p.name.toUpperCase());
};

/* ── the session: its name, and what it is compared with ──
   A name is how "the same session" is recognised, and nothing else hangs on
   it. Tom: two back days in one block can be semi unrecognisable, a
   different gym or a broken machine, so a name never locks the exercises. */
TRAIN.sessionNames = function (except) {
  var skip = String(except || '').trim().toLowerCase(), seen = {}, out = [];
  Rec.all('session').filter(function (r) { return r.payload && r.payload.name; })
    .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; })
    .forEach(function (r) {
      var nm = String(r.payload.name).trim(), k = nm.toLowerCase();
      if (!nm || seen[k] || k === skip) return;
      seen[k] = 1;
      out.push(nm);
    });
  return out;
};

function sessionHead(date) {
  var s = Rec.get('session', date, '') || {}, ph = TRAIN.phaseOn(date);
  var el = UI.el('div', 'sesshead mb-press');
  el.innerHTML = '<div class="nm">' +
    (s.name ? '<b>' + UI.esc(s.name) + '</b>' : '<b class="none">Name this session</b>') +
    '<span>' + UI.esc(ph ? TRAIN.phaseLine(ph, date) : 'No training block') + '</span></div>';
  el.onclick = function () { Mobile.feedback('open'); TRAIN.sessionDialog(date); };
  withMenu(el, function (e) { sessionMenu(date, e); });
  el.appendChild(rowMenuBtn('Session options', function (e) { sessionMenu(date, e); }));
  return el;
}
function sessionMenu(date, e) {
  var ph = TRAIN.phaseOn(date);
  menuAt(e, [
    { label: 'Name Session', fn: function () { TRAIN.sessionDialog(date); } },
    { label: 'Compare With A Day', fn: function () { TRAIN.pickVs(date); } },
    { label: ph ? 'Edit Training Block' : 'New Training Block', fn: function () { TRAIN.phaseDialog(ph ? ph.key : null); } },
    { label: 'Share Picture', fn: function () { TRAIN.shareRecap(date); } },
  ], 'SESSION');
}

TRAIN.pickVs = function (date) {
  TRAIN.pickDate('Select the session to compare with', function (d) {
    if (d >= date) return UI.toast('Pick a day before this one', { bad: true });

};

TRAIN.sessionDialog = function (date) {
  date = date || TRAIN.date;
  var s = Rec.get('session', date, '') || {}, input = null;
  UI.dialog({
    title: 'SESSION', width: 440,
    body: function (b, h) {
      input = UI.field('text', { value: s.name || '', placeholder: 'Back day' });
      b.appendChild(UI.row('Name', 'Sessions with the same name are compared', input));
      var names = TRAIN.sessionNames(s.name).slice(0, 12);
      if (names.length) {

      b.appendChild(said);

      var btn = function (label, fn) {

        x.type = 'button'; x.style.flex = '1'; x.textContent = label;
        x.onclick = function (ev) { ev.preventDefault(); save(); h.close(); setTimeout(fn, 60); };
        btns.appendChild(x);
      };
      btn('PICK A DAY', function () { TRAIN.pickVs(date); });
      if (s.vs) btn('AUTOMATIC', function () { TRAIN.patchSession(date, { vs: undefined }); draw(); });
      b.appendChild(btns);

      b.appendChild(pb);

  UI.focusSoon(input);
  function save() {
    var nm = String(input.value || '').trim();

    s.name = nm;
    Mobile.feedback('success');
    draw();
  }
};

/* ═══════════════════ HOW MUCH STRONGER, SET BY SET ═══════════════════
   Tom: "Compare session 1 working set 1 to session 2 working set 1, I don't
   want a change in warmup set quantity to affect comparison."

   What each exercise is measured against, first match wins:
     1. a day he picked for this session
     2. the last session with the same name, inside this block first
     3. the day this one was copied from
     4. the last time this exercise was done
   Per exercise, because a named session can be semi unrecognisable from its
   last time: an exercise the last Back day did not have is measured against
   the last Back day that did, then against its own last time.

   Working set N against working set N, warmups left out of both sides. */
TRAIN.compareCtx = function (date) {
  var sess = Rec.get('session', date, '') || {}, named = [];
  var key = String(sess.name || '').trim().toLowerCase();
  if (key) {
    var ph = TRAIN.phaseOn(date), inside = [], outside = [];
    Rec.all('session').forEach(function (r) {
      if (!r.payload || r.date >= date || String(r.payload.name || '').trim().toLowerCase() !== key) return;
      (ph && r.date >= ph.from ? inside : outside).push(r.date);
    });
    var desc = function (a, b) { return a < b ? 1 : a > b ? -1 : 0; };
    named = inside.sort(desc).concat(outside.sort(desc));
  }
  return { sess: sess, named: named };
};
TRAIN.vsFor = function (date, exId, ctx) {
  var has = function (d) { return TRAIN.setsOn(d).some(function (s) { return s.ex === exId && !s.warm; }); };
  var s = ctx.sess;
  if (s.vs && s.vs < date && has(s.vs)) return { date: s.vs, why: 'picked' };
  for (var i = 0; i < ctx.named.length; i++) if (has(ctx.named[i])) return { date: ctx.named[i], why: 'name' };
  if (s.from && s.from < date && has(s.from)) return { date: s.from, why: 'copy' };
  var h = TRAIN.historyOf(exId);
  for (var j = h.length - 1; j >= 0; j--) if (h[j].date < date && !h[j].warm) return { date: h[j].date, why: 'last' };
  return null;
};

/* One set against the same set last time. Tom, 2026-09-15: "I want to see how
   much more reps AND % increases." So the change names every part that moved:
   the weight if it moved, the reps if they moved, and how much stronger the set
   was as a percentage of its estimated 1RM. The 1RM is what lets the same bar
   for two more reps count, and a percentage reads the same in pounds and
   kilograms. A set with no weight has no 1RM, so its percentage is of its reps.
   A split set against a straight one is not like for like and gets no direction.

   The numbers come back too, so a card can add them up: `dr` the change in
   reps, `pct` the change in strength, `e1` when that is a 1RM percentage. */
TRAIN.setDelta = function (a, b, kind) {
  if (!b) return { dir: 0, text: 'new' };
  if (!!a.split !== !!b.split) return { dir: 0, text: a.split ? 'split' : 'straight' };
  var f = KIND_FIELDS[kind] || KIND_FIELDS.wr;
  var val = function (s, k) { return +({ w: s.kg, r: s.r, d: s.dist, t: s.dur }[k]) || 0; };
  var same = function (x, y, k) { return k === 'w' ? Math.abs(x - y) < 0.005 : k === 'd' ? Math.abs(x - y) < 0.0005 : x === y; };
  var sign = function (v) { return v > 0 ? '+' : '−'; };
  var repWord = function (n) { return sign(n) + Math.abs(n) + (Math.abs(n) === 1 ? ' rep' : ' reps'); };
  var out = { dir: 0, dr: f.indexOf('r') > -1 ? val(a, 'r') - val(b, 'r') : null, pct: null, e1: false };
  var parts = [];
  if (f[0] === 'w' && f[1] === 'r') {
    var dk = val(a, 'w') - val(b, 'w'), moved = !same(val(a, 'w'), val(b, 'w'), 'w');
    if (moved) parts.push(sign(dk) + fmt1(TRAIN.toUnit(Math.abs(dk), TRAIN.unit())) + ' ' + TRAIN.unit());
    if (out.dr) parts.push(repWord(out.dr));
    var ea = TRAIN.e1rm(a.kg, a.r), eb = TRAIN.e1rm(b.kg, b.r);
    if (ea > 0 && eb > 0) { out.pct = (ea / eb - 1) * 100; out.e1 = true; }

    if (out.pct != null && Math.abs(out.pct) < 0.05) out.pct = 0;
    if (out.pct) parts.push(sign(out.pct) + Math.abs(out.pct).toFixed(1) + '%');
    out.dir = out.pct ? (out.pct > 0 ? 1 : -1) : moved ? (dk > 0 ? 1 : -1) : out.dr ? (out.dr > 0 ? 1 : -1) : 0;
  } else {
    for (var i = 0; i < f.length; i++) {
      var k = f[i], x = val(a, k), y = val(b, k);

      var dv = Math.abs(x - y);
      parts.push(k === 'w' ? sign(x - y) + fmt1(TRAIN.toUnit(dv, TRAIN.unit())) + ' ' + TRAIN.unit()
        : k === 'r' ? repWord(x - y)
        : k === 'd' ? sign(x - y) + TRAIN.showDist(dv) + ' ' + TRAIN.distUnit()
        : sign(x - y) + fmtSecs(dv));
      /* over a distance, less time is the better run */
      if (!out.dir) out.dir = (kind === 'dt' && k === 't' ? x < y : x > y) ? 1 : -1;
    }
    var y0 = val(b, f[0]);
    if (y0 > 0 && !same(val(a, f[0]), y0, f[0])) {
      out.pct = (val(a, f[0]) / y0 - 1) * 100;
      if (Math.abs(out.pct) >= 0.05) parts.push(sign(out.pct) + Math.abs(out.pct).toFixed(1) + '%');
    }
  }
  out.text = parts.length ? parts.join(' · ') : 'same';
  return out;
};
/* What a run of sets added up to: reps gained, and the average percentage of

function gainText(reps, pctSum, pctN) {
  var parts = [];
  if (reps) parts.push((reps > 0 ? '+' : '−') + Math.abs(reps) + (Math.abs(reps) === 1 ? ' rep' : ' reps'));
  if (pctN) {
    var p = pctSum / pctN;
    if (Math.abs(p) >= 0.05) parts.push((p > 0 ? '+' : '−') + Math.abs(p).toFixed(1) + '% average');
  }
  return parts.join(' · ');
}
function deltaChip(d) {
  if (!d) return '';
  return '<span class="dl' + (d.dir > 0 ? ' up' : d.dir < 0 ? ' down' : '') + '">' + UI.esc(d.text) + '</span>';
}

TRAIN.dayCompare = function (date) {
  var groups = TRAIN.dayGroups(date);
  if (!groups.length) return null;
  var ctx = TRAIN.compareCtx(date);
  var out = { byEx: {}, up: 0, down: 0, same: 0, fresh: 0, marks: [], vs: null, vsDays: {}, whyOf: {},
              reps: 0, pctSum: 0, pctN: 0 };
  groups.forEach(function (g) {
    var row = { vs: TRAIN.vsFor(date, g.ex, ctx), bySet: {}, up: 0, down: 0, same: 0, reps: 0, pctSum: 0, pctN: 0 };
    out.byEx[g.ex] = row;
    if (!row.vs) return;
    var then = workOn(row.vs.date, g.ex), kind = TRAIN.kindOf(g.ex), n = 0;
    g.sets.forEach(function (s) {
      if (s.warm) return;
      var b = then[n++];
      if (!TRAIN.counts(s)) return;
      var d = row.bySet[s.key] = TRAIN.setDelta(s, b, kind);
      var mk = !b ? 'new' : d.dir > 0 ? 'up' : d.dir < 0 ? 'down' : 'same';
      if (mk === 'new') out.fresh++; else { row[mk]++; out[mk]++; }
      out.marks.push(mk);
      if (b && d.dr != null) { row.reps += d.dr; out.reps += d.dr; }
      if (b && d.e1 && d.pct != null) { row.pctSum += d.pct; row.pctN++; out.pctSum += d.pct; out.pctN++; }
    });
    if (row.up + row.down + row.same) {
      out.vsDays[row.vs.date] = (out.vsDays[row.vs.date] || 0) + 1;
      if (out.whyOf[row.vs.date] !== 'name') out.whyOf[row.vs.date] = row.vs.why;
    }
  });
  Object.keys(out.vsDays).forEach(function (d) {
    if (!out.vs || out.vsDays[d] > out.vsDays[out.vs]) out.vs = d;
  });
  return out;
};

/* ═══════════════════ RECORDS, AS THEY HAPPENED ═══════════════════
   The stored `pr` flag is FitNotes' rule: a record while it still stands. A
   session's records are different: what was a record on the day it was
   lifted, against everything before it, and against everything before it
   in this block. The first time an exercise is done, or done in a block, is
   not a record of anything. A record the same session then beat is dropped. */
TRAIN.recordHits = function (exId, date) {
  var f = TRAIN.fieldsOf(exId);
  if (f[0] !== 'w' || f[1] !== 'r') return [];
  var rd = function (kg) { return Math.round((kg || 0) * TRAIN.PR_SCALE) / TRAIN.PR_SCALE; };
  var ph = TRAIN.phaseOn(date);
  var hist = TRAIN.historyOf(exId).filter(function (x) {
    return !x.warm && x.kg > 0 && x.r > 0 && x.date <= date && TRAIN.counts(x);
  });
  var before = function (x, s) {
    return x.date < s.date || (x.date === s.date && x.key !== s.key &&
      ((x.ord || 0) - (s.ord || 0) || TRAIN.setStamp(x) - TRAIN.setStamp(s)) < 0);
  };
  var hits = [];
  hist.forEach(function (s) {
    if (s.date !== date) return;
    var prior = hist.filter(function (x) { return !!x.split === !!s.split && before(x, s); });
    var stands = function (list) {
      return list.length > 0 && !list.some(function (x) { return rd(x.kg) >= rd(s.kg) && x.r >= s.r; });
    };
    var all = stands(prior), blk = !!ph && stands(prior.filter(function (x) { return x.date >= ph.from; }));
    if (all || blk) hits.push({ s: s, all: all, block: blk });
  });
  return hits.filter(function (h) {
    return !hits.some(function (o) {
      return o !== h && !!o.s.split === !!h.s.split && rd(o.s.kg) >= rd(h.s.kg) && o.s.r >= h.s.r &&
        (rd(o.s.kg) > rd(h.s.kg) || o.s.r > h.s.r);
    });
  });
};
TRAIN.sessionRecords = function (date) {
  var out = [];
  TRAIN.dayGroups(date).forEach(function (g) {
    TRAIN.recordHits(g.ex, date).forEach(function (h) {
      out.push({ ex: g.ex, name: g.def.name, s: h.s, all: h.all, block: h.block });
    });
  });
  return out;
};

/* ═══════════════════ THE CARDS ═══════════════════ */
function fmtMins(n) { var h = Math.floor(n / 60); return (h ? h + 'h ' : '') + (n % 60) + 'm'; }
function compact(n) {
  n = Math.round(n);
  if (n >= 1e6) return (Math.round(n / 1e5) / 10) + 'M';
  if (n >= 1e5) return Math.round(n / 1e3) + 'k';
  return n.toLocaleString();
}
function spanWords(a, b) {
  var months = monthsBetween(a.slice(0, 7), b.slice(0, 7)) - (+b.slice(8) < +a.slice(8) ? 1 : 0);
  if (months < 1) { var d = Day.diff(b, a) + 1; return d + (d === 1 ? ' day' : ' days'); }
  var y = Math.floor(months / 12), mo = months % 12, out = [];
  if (y) out.push(y + (y === 1 ? ' year' : ' years'));

}
/* Working sets that count, over a stretch of days, or every day. */
function spanStats(from, to) {
  var o = { sessions: 0, sets: 0, reps: 0, vol: 0 };
  Object.keys(TRAIN.idx.byDate).forEach(function (d) {
    if ((from && d < from) || (to && d > to)) return;
    var w = TRAIN.idx.byDate[d].filter(function (s) { return !s.warm && TRAIN.counts(s); });
    if (!w.length) return;
    o.sessions++;
    o.sets += w.length;
    w.forEach(function (s) { o.reps += s.r || 0; o.vol += (s.kg || 0) * (s.r || 0); });
  });

}
function musclesHtml(rows, week) {
  if (!rows.length) return '';
  var top = rows[0].sets || 1;
  return '<div>' + (week
      ? '<div class="mhead"><h3>SETS PER MUSCLE</h3><span>SETS</span><span>HIT</span></div>'
      : '<h3>SETS PER MUSCLE</h3>') +
    '<div class="musc">' + rows.map(function (r) {
      var col = r.slot != null ? TRAIN.slotColor(r.slot) : 'var(--accent)';
      return '<div class="mrow2' + (week ? ' wk' : '') + '">' +
        '<span class="nm"><i class="dot" style="background:' + col + '"></i>' + UI.esc(r.name) + '</span>' +
        '<span class="bar2"><i style="width:' + Math.max(4, Math.round(r.sets / top * 100)) + '%;background:' + col + '"></i></span>' +
        '<b>' + r.sets + '</b>' + (week ? '<em>' + r.workouts + '×</em>' : '') + '</div>';
    }).join('') + '</div></div>';
}
function muscleRows(from, to) {
  return TRAIN.breakdown(from, to, 'category').rows
    .filter(function (r) { return r.sets > 0; })
    .sort(function (a, b) { return b.sets - a.sets || b.workouts - a.workouts; });
}
TRAIN.sessionStats = function (date) {
  var sets = TRAIN.setsOn(date).filter(function (s) { return !s.warm && TRAIN.counts(s); });
  var reps = 0, ex = {};
  sets.forEach(function (s) { reps += s.r || 0; ex[s.ex] = 1; });
  var sess = Rec.get('session', date, '') || {};

    ? Math.max(0, Math.floor((Date.parse(sess.end) - Date.parse(sess.start)) / 60000)) : 0;
  return { sets: sets.length, reps: reps, vol: TRAIN.volume(sets), mins: mins,
           exercises: Object.keys(ex).length, name: sess.name || '' };
};

/* ── the end of a session ──
   Tom: "make it aesthetic, this is something we might want to share on
   social media." What it says is fact, never praise: what was lifted, how
   each set did against last time, which muscles it went to, and any record
   set. */
TRAIN.recapCard = function (date, cmp) {
  var st = TRAIN.sessionStats(date);
  if (!st.sets) return null;
  if (cmp === undefined) cmp = TRAIN.dayCompare(date);
  var U = TRAIN.unit(), ph = TRAIN.phaseOn(date), esc = UI.esc;
  /* Totals are only set against another day when that day is this session

     was measured against. Exercises measured against three different days
     have no single session to total against. */
  var one = cmp && cmp.vs && (Object.keys(cmp.vsDays).length === 1 || cmp.whyOf[cmp.vs] !== 'last');
  var vs = one ? TRAIN.sessionStats(cmp.vs) : null;
  var when = Day.label(date, { day: 'numeric', month: 'short', year: 'numeric' });
  var volF = function (kg) { return Math.round(TRAIN.toUnit(kg, U)).toLocaleString(); };
  var num = function (n) { return Math.round(n).toLocaleString(); };
  var cell = function (label, big, small, now, then, fmt) {
    var em = '';
    if (vs && then != null) {
      var dd = now - then;
      em = '<em>' + (Math.abs(dd) < (label === 'Volume' ? 0.5 : 1) ? 'same as ' : (dd > 0 ? '+' : '−') + fmt(Math.abs(dd)) + ' vs ') +
        esc(Day.short(cmp.vs)) + '</em>';
    }
    return '<div><span>' + label + '</span><b>' + big + (small ? ' <small>' + small + '</small>' : '') + '</b>' + em + '</div>';
  };
  var h = '<div class="eyebrow"><span>' + esc(when) + '</span>' +
      (ph ? '<b>' + esc(TRAIN.phaseLine(ph, date)) + '</b>' : '') + '</div>' +
    '<div class="title">' + esc(st.name || 'Training session') + '</div>' +
    '<div class="rule"></div>' +
    '<div class="big4">' +
      cell('Volume', volF(st.vol), TRAIN.unitLabel(), st.vol, vs && vs.vol, volF) +
      cell('Sets', st.sets, '', st.sets, vs && vs.sets, num) +
      cell('Reps', st.reps.toLocaleString(), '', st.reps, vs && vs.reps, num) +
      (st.mins ? cell('Time', fmtMins(st.mins), '', st.mins, vs && vs.mins ? vs.mins : null, fmtMins)
               : cell('Exercises', st.exercises, '', 0, null, num)) +
    '</div>';

  var n = cmp ? cmp.up + cmp.down + cmp.same : 0;
  if (n) {
    var days = Object.keys(cmp.vsDays).length, vn = (Rec.get('session', cmp.vs, '') || {}).name;
    var sub = [cmp.same ? cmp.same + ' same' : '', cmp.down ? cmp.down + ' weaker' : '',
               cmp.fresh ? cmp.fresh + ' new' : ''].filter(Boolean);
    sub.push('vs ' + (vn ? vn + ', ' : '') + dayY(cmp.vs, date) +
      (days > 1 ? ' and ' + (days - 1) + ' other day' + (days > 2 ? 's' : '') : ''));
    h += '<div><h3>SET BY SET</h3>' +
      '<div class="strong"><b>' + cmp.up + ' of ' + n + '</b> sets stronger</div>' +
      (gainText(cmp.reps, cmp.pctSum, cmp.pctN)
        ? '<div class="gain' + (cmp.pctN && cmp.pctSum / cmp.pctN >= 0.05 ? ' up'
            : cmp.pctN && cmp.pctSum / cmp.pctN <= -0.05 ? ' down' : '') + '">' +
          esc(gainText(cmp.reps, cmp.pctSum, cmp.pctN)) + '</div>' : '') +
      '<div class="sub">' + esc(sub.join(' · ')) + '</div>' +
      '<div class="ticks">' + cmp.marks.map(function (k) { return '<i class="' + k + '"></i>'; }).join('') + '</div></div>';
  }

  h += musclesHtml(muscleRows(date, date), false);

  var recs = TRAIN.sessionRecords(date);
  if (recs.length) {
    h += '<div><h3>RECORDS</h3>' + recs.map(function (x) {
      return '<div class="rec">' + ico('record') +
        '<span class="nm"><span>' + esc(x.name) + '</span><i class="pill">' + (x.all ? 'All-time' : 'Block') + '</i></span>' +
        '<span class="v">' + TRAIN.showWeight(x.s.kg, x.s.u) + ' <small>' + TRAIN.unitLabel() + '</small> × ' +
        (x.s.split ? esc(x.s.split.text) : x.s.r) + '</span></div>';
    }).join('') + '</div>';
  }
  h += '<div class="mark">TRA<b>IN</b></div>';
  var card = UI.el('div', 'recap');
  card.innerHTML = h;
  return card;
};

/* A card as a picture for a story, through the shared panel (IO.share in
   shared/io.js): the picture, its style and size already set to the last ones
   used, and one SHARE. `build` makes a fresh card each time a choice changes.

function shareCard(build, name) {

  if (!build()) return UI.toast('There is nothing to share', { bad: true });
  IO.share({ app: APP.id, name: name, width: 390, build: function () {
    var c = build(), mk = c && c.querySelector('.mark');
    if (mk) mk.remove();

  } });
}
TRAIN.shareRecap = function (date) {
  date = date || TRAIN.date;
  shareCard(function () { return TRAIN.recapCard(date); }, 'train-' + date);
};

/* ── the week ──
   Tom: "I don't want to set targets, I'd rather be told how many times I hit
   a muscle, I'll know if I need to hit more." Sets per muscle, counting half
   a set for a muscle an exercise also works, and how many sessions hit it. */

  return Day.shift(date, -((Day.dow(date) - TRAIN.weekStartDow() + 7) % 7));
};
TRAIN.weekCard = function (start) {
  var end = Day.shift(start, 6), today = Day.today(), U = TRAIN.unit(), esc = UI.esc;

      (ph ? '<b>' + esc(TRAIN.phaseLine(ph, upto)) + '</b>' : '') + '</div>' +
    '<div class="title">' + esc(fmt(start) + ' – ' + fmt(end)) + '</div>' +
    '<div class="rule"></div>' +
    '<div class="big4">' +

      '<div><span>Sets</span><b>' + st.sets + '</b></div>' +
      '<div><span>Reps</span><b>' + st.reps.toLocaleString() + '</b></div>' +
      '<div><span>Volume</span><b>' + Math.round(TRAIN.toUnit(st.vol, U)).toLocaleString() +
        ' <small>' + TRAIN.unitLabel() + '</small></b></div>' +
    '</div>' +
    (rows.length ? musclesHtml(rows, true) : '<div class="sub">No sessions this week</div>') +

  card.innerHTML = h;
  return card;
};
function drawWeek(m) {

    : 'WEEK OF ' + Day.label(start, { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();

  sh.style.width = '100%';
  sh.textContent = 'SHARE PICTURE';

/* Eight weeks side by side, ending at the week on screen or this week. */
function weekHeat(start, cur) {

  var per = weeks.map(function (w) {
    var o = {};
    TRAIN.breakdown(w, Day.shift(w, 6), 'category').rows.forEach(function (r) { o[r.key] = r.sets; });

  });

  grid.appendChild(UI.el('span'));
  weeks.forEach(function (w) {
    var hh = UI.el('span', 'hh' + (w === start ? ' on' : ''));
    hh.textContent = String(+w.slice(8));
    hh.title = 'Week of ' + Day.label(w);
    grid.appendChild(hh);
  });
  ids.forEach(function (k) {
    var c = cats[k], col = TRAIN.slotColor(c.slot);
    var nm = UI.el('span', 'hn');
    nm.innerHTML = '<i class="dot" style="background:' + col + '"></i>' + UI.esc(c.name);
    grid.appendChild(nm);
    var mx = Math.max.apply(null, per.map(function (o) { return o[k] || 0; })) || 1;

  });
  card.appendChild(grid);
  return card;
}
