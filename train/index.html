/* ═══════════════════ SETUP ═══════════════════
   Tom: "a strapped toggle or a set height setting. Manually set if it's a
   toggle or a setting... some machines have settings for ankle and back pads
   as well." So an exercise carries the setup it needs, named by him, each
   either a toggle or a setting, and each SET records its own, because straps
   go on after a couple of working sets.

   A new set takes the setup of the set before it today. The first set of a
   session takes the first set of the last session, which is how that
   session started. */
TRAIN.lastSetup = function (exId, date) {
  var today = TRAIN.setsOn(date).filter(function (s) { return s.ex === exId && s.su; });
  if (today.length) return copyObj(today[today.length - 1].su);
  var h = TRAIN.historyOf(exId), last = null;
  for (var i = h.length - 1; i >= 0; i--) if (h[i].date < date && h[i].su) { last = h[i].date; break; }
  if (!last) return {};
  return copyObj(h.filter(function (s) { return s.date === last && s.su; })[0].su);
};
function cleanSetup(exId) {
  var defs = ((TRAIN.exercises()[exId] || {}).setup) || [];
  var su = TRAIN.suFor === exId ? TRAIN.draftSU || {} : {}, out = {}, any = false;
  defs.forEach(function (d) {
    var v = su[d.id];
    if (v == null || v === '' || v === 0) return;
    out[d.id] = d.kind === 'toggle' ? 1 : String(v);
    any = true;
  });
  return any ? out : null;
}
function setupText(su, exId) {
  if (!su) return '';
  var defs = ((TRAIN.exercises()[exId] || {}).setup) || [];
  return defs.filter(function (d) { return su[d.id] != null && su[d.id] !== '' && su[d.id] !== 0; })
    .map(function (d) { return d.kind === 'toggle' ? d.name : d.name + ' ' + su[d.id]; }).join(' · ');
}
function setupCard(exId, ex, date) {
  var defs = (ex && ex.setup) || [];
  if (TRAIN.suFor !== exId) { TRAIN.suFor = exId; TRAIN.draftSU = TRAIN.lastSetup(exId, date); }
  var su = TRAIN.draftSU || (TRAIN.draftSU = {});
  var card = UI.el('div', 'exblock pad');
  var box = UI.el('div', 'setup');
  if (!defs.length) {
    var add = UI.el('button', CHIP + ' mb-press mb-tap');
    add.type = 'button';
    add.textContent = 'Add Setup';
    add.onclick = function () { TRAIN.setupDialog(exId); };
    box.appendChild(add);
  }
  defs.forEach(function (d) {
    if (d.kind === 'toggle') {
      var c = UI.el('button', CHIP + ' mb-press mb-tap' + (su[d.id] ? ' on' : ''));
      c.type = 'button';
      c.textContent = d.name;
      c.setAttribute('aria-pressed', su[d.id] ? 'true' : 'false');
      c.onclick = function () {
        if (su[d.id]) delete su[d.id]; else su[d.id] = 1;
        Mobile.feedback('select');
        draw();
      };
      box.appendChild(c);
    } else {
      var w = UI.el('label', 'sufield');
      w.appendChild(document.createTextNode(d.name));
      var i = UI.field('text', { value: su[d.id] == null ? '' : String(su[d.id]) });
      i.setAttribute('aria-label', d.name);
      i.oninput = function () { var v = i.value.trim(); if (v) su[d.id] = v; else delete su[d.id]; };
      w.appendChild(i);
      box.appendChild(w);
    }
  });
  if (defs.length) {
    var ed = UI.el('button', 'ico mb-press mb-tap');
    ed.type = 'button';
    ed.innerHTML = ico('edit');
    ed.setAttribute('aria-label', 'Edit setup');
    ed.onclick = function () { TRAIN.setupDialog(exId); };
    box.appendChild(ed);
  }
  card.appendChild(box);
  return card;
}
TRAIN.setupDialog = function (exId) {
  var ex = TRAIN.exercises()[exId];
  if (!ex) return;
  var defs = copyObj(ex.setup || []), name = null, kind = 'value', paint = null;
  var addOne = function () {
    var nm = String(name.value || '').trim();
    if (!nm) { UI.toast('Please enter a name', { bad: true }); UI.focusSoon(name); return false; }
    if (defs.some(function (d) { return d.name.toLowerCase() === nm.toLowerCase(); })) {
      UI.toast('That name is already used', { bad: true });
      return false;
    }
    defs.push({ id: (nm.toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'x') + '-' + Date.now().toString(36).slice(-4),
                name: nm, kind: kind });
    name.value = '';
    paint();
    return true;
  };
  UI.dialog({
    title: 'SETUP', width: 440,
    body: function (b) {
      var who = UI.el('div', 'empty'); who.textContent = ex.name; b.appendChild(who);
      var list = UI.el('div', 'sulist');
      b.appendChild(list);
      paint = function () {
        list.innerHTML = '';
        if (!defs.length) { var none = UI.el('div', 'empty'); none.textContent = 'Nothing yet'; list.appendChild(none); }
        defs.forEach(function (d, i) {
          var del = UI.el('button', 'ico mb-press mb-tap');
          del.type = 'button';
          del.innerHTML = ico('del');
          del.setAttribute('aria-label', 'Remove ' + d.name);
          del.onclick = function () { defs.splice(i, 1); paint(); };
          list.appendChild(UI.row(d.name, d.kind === 'toggle' ? 'Toggle' : 'Setting', del));
        });
      };
      paint();
      var g = UI.el('div', 'mb-group'); g.textContent = 'ADD'; b.appendChild(g);
      name = UI.field('text', { placeholder: 'Straps, Seat height, Back pad' });
      b.appendChild(UI.row('Name', '', name));
      b.appendChild(UI.row('Type', 'A toggle is on or off. A setting holds a number or a word.',
        UI.segmented([{ id: 'value', name: 'SETTING' }, { id: 'toggle', name: 'TOGGLE' }], kind,
          function (v) { kind = v; })));
      var add = UI.el('button', 'mb-btn mb-press mb-tap');
      add.type = 'button'; add.style.width = '100%'; add.textContent = 'ADD';
      add.onclick = function (ev) { ev.preventDefault(); addOne(); };
      b.appendChild(add);
      Mobile.form(b, addOne);
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: function () {
        if (String(name.value || '').trim() && !addOne()) return false;
        TRAIN.patchExercise(exId, { setup: defs.length ? defs : undefined });
        draw();
      } },
    ],
  });
};

/* FitNotes' Skip Empty Dates: the arrows go to the previous or next day that
   has a workout rather than to the day before. */
TRAIN.step = function (dir) {
  var d = Day.shift(TRAIN.date, dir);
  if (Rec.setting(APP.id, 'skipEmpty') === 1) {
    var dates = Object.keys(TRAIN.idx.byDate).sort(), today = Day.today(), hit = null, i;
    if (dir < 0) {
      for (i = dates.length - 1; i >= 0; i--) if (dates[i] < TRAIN.date) { hit = dates[i]; break; }
    } else {
      for (i = 0; i < dates.length; i++) if (dates[i] > TRAIN.date && dates[i] <= today) { hit = dates[i]; break; }
      if (!hit) hit = today;
    }
    if (!hit) { UI.toast('No more sessions found'); return; }
    d = hit;
  }
  TRAIN.go(d);
};
document.getElementById('prev').onclick = function () { TRAIN.step(-1); Mobile.feedback('select'); };
document.getElementById('next').onclick = function () { TRAIN.step(1); Mobile.feedback('select'); };
document.getElementById('when').onclick = function () {

/* Swiping the date strip moves a day, which is how the day gets changed in
   the gym without looking at the screen. */
(function () {
  var bar = document.getElementById('datebar'), x0 = null, y0 = null;
  bar.addEventListener('touchstart', function (e) {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  bar.addEventListener('touchend', function (e) {
    if (x0 == null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx)) return;
    TRAIN.step(dx < 0 ? 1 : -1);
    Mobile.feedback('select');
  }, { passive: true });
})();

};

   duplicate definition resolves in favour of the later one, without a word. */

/* ── settings ──
   The shared panel, with TRAIN's own tab in front of it. Import sits here,
   under a heading that says what it is for, because after the first week it
   is the last thing he ever needs to reach. */
TRAIN.settings = function () {
  UI.settings(APP.id, [{
    id: 'train', name: 'TRAIN',
    draw: function (pane) {
      var get = function (key, dflt) { var v = Rec.setting(APP.id, key); return v == null ? dflt : v; };
      /* `t` is where a row goes: the tab, or the More fold */
      var group = function (name, t) { var g = UI.el('div', 'mb-group'); g.textContent = name; (t || pane).appendChild(g); };
      var sw = function (label, note, key, dflt, after, t) {
        (t || pane).appendChild(UI.row(label, note, UI.toggle(!!get(key, dflt), function (v) {
          Rec.setting(APP.id, key, v ? 1 : 0);
          if (after) after(v);
        })));
      };
      var num = function (label, note, key, dflt, t) {
        var f = UI.field('decimal', { value: String(get(key, dflt)) });
        f.style.maxWidth = '6em';
        f.onchange = function () { var v = parseFloat(f.value); if (!isNaN(v)) Rec.setting(APP.id, key, v); };
        (t || pane).appendChild(UI.row(label, note, f));
      };
      var seg = function (label, note, key, items, dflt) {
        pane.appendChild(UI.row(label, note, UI.segmented(items, String(get(key, dflt)), function (v) {
          var n = +v;
          Rec.setting(APP.id, key, isNaN(n) || String(n) !== v ? v : n);
          draw();
        })));
      };

      group('UNITS');
      seg('Weight Unit', 'Stored in kilograms either way', 'unit', [{ id: 'lb', name: 'LBS' }, { id: 'kg', name: 'KGS' }], 'lb');
      seg('Distance Unit', 'Stored in kilometres either way', 'distUnit', [{ id: 'km', name: 'KM' }, { id: 'mi', name: 'MI' }], 'km');
      seg('Calendar Week Start', 'First day of the week', 'weekStart', [{ id: '1', name: 'SUN' }, { id: '2', name: 'MON' }], 1);

      group('TRAINING LOG');
      seg('Category', 'On each exercise in the log', 'catShow',
        [{ id: 'none', name: 'HIDE' }, { id: 'name', name: 'NAME' }, { id: 'both', name: 'COLOUR' }], 'none');
      num('Exercise Set Limit', 'Sets shown per exercise. 0 shows all', 'setLimit', 0);
      sw('Skip Empty Dates', 'Arrows jump between sessions', 'skipEmpty', 0);
      sw('Mark Sets Complete', 'Tick box next to each set', 'markComplete', 1, function () { draw(); });

      group('TRAINING');
      num('Default Weight Increment', 'What + and − move by', 'increment', 2.5);
      sw('Auto-Select Next Set', 'Load the next unfinished set after saving', 'autoNext', 1);
      sw('Track Personal Records', 'Flag a set that beats your best', 'trackPRs', 1);
      sw('Keep Screen On', TRAIN.canWake() ? 'While TRAIN is open' : 'Not supported by this browser', 'keepAwake', 0,
        function () { TRAIN.wake(); });

      group('REST TIMER');
      num('Rest Time', 'Seconds', 'restSeconds', 120);
      sw('Auto Start', 'When a set is saved', 'restAuto', 1);
      /* Only where a web page can buzz. An iPhone will not let one and a
         computer has no motor, so there the switch did nothing. */
      if (navigator.vibrate && window.matchMedia && matchMedia('(pointer: coarse)').matches)
        sw('Vibrate', 'When the timer is done', 'restVibrate', 1);
      sw('Sound', 'Beep when timer is done', 'restSound', 1);
      var only = UI.el('div', 'empty');
      only.textContent = 'Runs while TRAIN is open. Keep Screen On keeps it open.';
      pane.appendChild(only);

      group('GYM');
      var gym = UI.el('button', 'mb-btn mb-press mb-tap');
      gym.style.width = '100%';
      gym.textContent = 'PLATES AND BARS';
      gym.onclick = function () { TRAIN.gymDialog(); };
      pane.appendChild(gym);
      var cats = UI.el('button', 'mb-btn mb-press mb-tap');
      cats.style.width = '100%';
      cats.style.marginTop = 'var(--s-2)';
      cats.textContent = 'CATEGORIES';
      cats.onclick = function () { TRAIN.categoriesDialog(); };
      pane.appendChild(cats);

      /* Set once and rarely touched again, so folded away. Tom, 2026-09-15:
         settings intuitive and never overwhelming, and FitNotes' layout is no
         longer a rule ("Lets stop with matching fitnotes as a hard rule"). */
      pane.appendChild(UI.more('More', function (box) {
        group('SESSION TIMER', box);
        sw('Auto Start', 'On the first set of the day', 'workoutTimerAuto', 1, null, box);
        sw('Auto Stop', 'When the final set is complete', 'workoutTimerStop', 0, null, box);

        group('GRAPHS', box);
        sw('Graph Points', 'A dot for each session', 'graphPoints', 1, null, box);
        sw('Trend Line', 'A straight line through the points', 'graphTrend', 0, null, box);
        sw('Y-Axis From 0', 'Scale starts at zero', 'graphZero', 0, null, box);

        group('PERSONAL RECORDS', box);
        num('Estimated 1RM Max Reps', 'Sets above this are left out. 0 uses all', 'e1rmMaxReps', 0, box);
        var rc = UI.el('button', 'mb-btn mb-press mb-tap');
        rc.style.width = '100%';
        rc.textContent = 'RE-CALCULATE PERSONAL RECORDS';
        rc.onclick = function () {
          var n2 = TRAIN.recomputePRs();
          draw();
          UI.toast(n2 ? n2 + ' sets re-flagged' : 'Records already correct');
        };
        box.appendChild(rc);

        group('COMING FROM ANOTHER APP', box);
        var b = UI.el('button', 'mb-btn mb-press mb-tap');
        b.style.width = '100%';
        b.textContent = 'IMPORT A TRAINING LOG';
        b.onclick = function () { TRAIN.importPanel(); };
        box.appendChild(b);
        var n = UI.el('div', 'empty');
        n.style.marginTop = 'var(--s-3)';
        var have = Object.keys(TRAIN.idx.byDate).length;
        n.textContent = have
          ? Rec.count('set').toLocaleString() + ' sets across ' + have + ' days. Importing a file twice changes nothing.'
          : 'Nothing imported.';
        box.appendChild(n);

        group('TRAINING DATA', box);
        var dh = UI.el('button', 'mb-btn bad mb-press mb-tap');
        dh.style.width = '100%';
        dh.textContent = 'DELETE TRAINING HISTORY';
        dh.onclick = function () { TRAIN.deleteHistoryDialog(); };
        box.appendChild(dh);
      }, 'train-more'));
    },
  }]);
};

/* ═════════════════ THE SPREADSHEET EXPORT ═════════════════
   Readable, not restorable, exactly as the master brief requires. One row per
   set is the shape a pivot table wants. */
function exportSheets() {
  var exs = TRAIN.exercises(), cats = TRAIN.cats(), unit = TRAIN.unit();
  var log = [['Date', 'Day', 'Category', 'Exercise', 'Set', 'Weight (' + unit + ')',
              'Weight (kg)', 'Reps', 'Volume (' + unit + ')', 'Distance', 'Seconds',
              'Complete', 'PR', 'Warmup', 'Split', 'Setup', 'Comment']];
  var dates = Object.keys(TRAIN.idx.byDate).sort();
  dates.forEach(function (d) {
    var groups = TRAIN.dayGroups(d);
    groups.forEach(function (g) {
      var cat = g.def.cat ? cats[g.def.cat] : null;
      g.sets.forEach(function (s, i) {
        log.push([d, new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
          cat ? cat.name : '', g.def.name, i + 1,
          Math.round(TRAIN.toUnit(s.kg || 0, unit) * 100) / 100,
          Math.round((s.kg || 0) * 1000) / 1000,
          s.r || 0,
          Math.round(TRAIN.toUnit((s.kg || 0) * (s.r || 0), unit) * 10) / 10,
          s.dist || '', s.dur || '', s.done ? 'yes' : '', s.pr ? 'PR' : '',
          s.warm ? 'yes' : '', s.split ? s.split.text : '', setupText(s.su, s.ex), s.note || '']);
      });
    });
  });

  var days = [['Date', 'Day', 'Session', 'Training block', 'Exercises', 'Sets', 'Reps', 'Volume (' + unit + ')',
               'Start', 'End', 'Minutes', 'Comment']];
  dates.forEach(function (d) {
    var sets = TRAIN.setsOn(d), sess = Rec.get('session', d, '') || {};
    var reps = 0, vol = 0, ex = {};
    sets.forEach(function (s) { reps += s.r || 0; vol += (s.kg || 0) * (s.r || 0); ex[s.ex] = 1; });
    var mins = sess.start && sess.end
      ? Math.floor((Date.parse(sess.end) - Date.parse(sess.start)) / 60000) : '';
    var inBlock = TRAIN.phaseOn(d);
    days.push([d, new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
      sess.name || '', inBlock ? inBlock.p.name : '',
      Object.keys(ex).length, sets.length, reps,
      Math.round(TRAIN.toUnit(vol, unit)), sess.start ? clockOf(sess.start) : '',
      sess.end ? clockOf(sess.end) : '', mins, sess.note || '']);
  });

  var records = [['Exercise', 'Category', 'Sessions', 'Sets', 'Max weight (' + unit + ')',
                  'On', 'Max reps', 'Est 1RM (' + unit + ')']];
  Object.keys(exs).forEach(function (id) {
    var r = TRAIN.recordsFor(id);
    if (!r.sets) return;
    var cat = exs[id].cat ? cats[exs[id].cat] : null;
    records.push([exs[id].name, cat ? cat.name : '', r.workouts, r.sets,
      r.maxWeight ? Math.round(TRAIN.toUnit(r.maxWeight.kg, unit) * 10) / 10 : '',
      r.maxWeight ? r.maxWeight.date : '',
      r.maxReps ? r.maxReps.r : '',
      r.max1rm ? Math.round(TRAIN.toUnit(TRAIN.e1rm(r.max1rm.kg, r.max1rm.r), unit) * 10) / 10 : '']);
  });

  return [
    { name: 'Log', rows: log, widths: [11, 5, 12, 26, 5, 11, 11, 6, 11, 8, 8, 9, 5, 8, 10, 20, 30] },
    { name: 'Sessions', rows: days, widths: [11, 5, 16, 18, 10, 6, 6, 12, 7, 7, 8, 30] },
    { name: 'Records', rows: records, widths: [26, 12, 9, 6, 14, 11, 9, 14] },
  ];
}

/* ═════════════════ FIRST RUN ═════════════════
   Units, then the importer, then out of the way. Everything else has a
   working default and can wait. */
TRAIN.firstRun = function () {
  UI.dialog({
    title: 'WELCOME TO TRAIN', width: 440,
    body: function (b, h) {
      var p = UI.el('div', 'empty');
      p.innerHTML = 'One question, then you are logging.';
      b.appendChild(p);

      var g = UI.el('div', 'mb-group'); g.textContent = 'WEIGHT UNIT';
      b.appendChild(g);
      b.appendChild(UI.row('Show weights in',
        'Your data is stored in kilograms either way. You can change this whenever.',
        UI.segmented([{ id: 'lb', name: 'POUNDS' }, { id: 'kg', name: 'KILOGRAMS' }],
          TRAIN.unit(), function (v) { Rec.setting(APP.id, 'unit', v); draw(); })));

      /* The importer is in Settings, under COMING FROM FITNOTES, and that is
         the only place it appears now. The paragraph that used to sit here
         described what its button did, so it went with the button. */
    },
    actions: [{ label: 'START LOGGING', kind: 'go', fn: function () {
      Rec.setting(APP.id, 'seen', 1);
    } }],
  });
};

/* ═══════════════════ BOOT ═══════════════════ */
function boot() {
  TRAIN.reindex();
  /* ── DOCTRINE law 1: ship it full ──
     Seed before the first draw, so the very first thing on screen is a working
     app rather than an invitation to go and build one.

     Only on a genuinely untouched store: no categories, no exercises, no sets.
     Anyone who has ever logged anything, or imported a FitNotes backup, has a
     list already and must not find a hundred strangers mixed into it. */
  if (!Rec.count('excat') && !Rec.count('exercise') && !Rec.count('set')) TRAIN.seedCats();
  TRAIN.restRestore();
  TRAIN.wake();
  /* Records are worked out again once under the rule that keeps split sets
     apart, and never again unless something changes. */
  if (Rec.setting(APP.id, 'prRule') !== 2 && Rec.count('set')) {
    TRAIN.recomputePRs();
    Rec.setting(APP.id, 'prRule', 2);
  }
  draw();
  if (!Rec.setting(APP.id, 'seen') && !Rec.count('set')) {
    Rec.setting(APP.id, 'seen', 1);
    setTimeout(TRAIN.firstRun, 400);
  }
}

/* ── the first paint does not wait for the store ──
   Root brief, foundation item 2: TRAIN drew nothing until Rec.ready, which
   waits for IndexedDB and can take 2.5 seconds on a slow phone. Sets and
   exercises are small rows, already here from localStorage, so if the store
   has not answered in a moment and there is a log to show, show it. Seeding
   and the record pass still wait for ready, because they must see every row. */
var trainBooted = false;
setTimeout(function () {
  if (trainBooted || !(Rec.count('set') || Rec.count('exercise'))) return;
  TRAIN.reindex(); draw();
}, 300);
Rec.ready(function () { trainBooted = true; boot(); });
/* Every write announces, and one SAVE is up to four writes: the set, its
   record flag, the workout timer and the rest timer. Reindexing every set four
   times per tap is the slowest thing on a Galaxy A10, so the redraw waits for
   the writes in this tick to finish and happens once. */
var redrawSoon = null;
Rec.on(function () {
  if (TRAIN.importing || redrawSoon) return;      /* the importer redraws once, at the end */
  redrawSoon = setTimeout(function () { redrawSoon = null; TRAIN.reindex(); draw(); }, 0);
});
Day.on(draw);

/* The rest timer is wall-clock, so coming back to a suspended tab has to
   recompute rather than resume. */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { TRAIN.restRestore(); drawRestBar(); }
  TRAIN.wake();
});
document.getElementById('restbar').onclick = function () {
  var left = Math.round((TRAIN.rest.until - Date.now()) / 1000);
  menuAt({ clientX: innerWidth - 12, clientY: 96 }, [
    { label: 'Open Timer', fn: function () { TRAIN.restSheet(); } },
    { label: left > 0 ? 'Add 30 seconds' : 'Restart', fn: function () {
      if (left > 0) { TRAIN.rest.until += 30000; TRAIN.rest.fired = false; drawRestBar(); }
      else TRAIN.restStart(TRAIN.rest.len);
    } },
    { label: 'Stop timer', fn: function () { TRAIN.restStop(); } },
  ], 'REST TIMER');
};

TRAIN.reindex();
draw();
</script>
