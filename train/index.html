/* ═══════════════ ROUTINES: PREDEFINED SETS ═══════════════
   `fill` is what a routine exercise puts into a workout. FitNotes' three:
     0  Don't populate any sets
     1  Copy previous sets       what you did last time, whichever routine
     2  Use predefined sets      these, with a blank field copied from last time
   The number FitNotes stores for each could not be checked against his file,
   which has no routines; an imported routine's mode is its populate_sets_type
   taken as it is. */
var FILL_NAMES = ["Don't populate any sets", 'Copy previous sets', 'Use predefined sets'];

TRAIN.lastSetsOf = function (exId, before) {
  var hist = TRAIN.historyOf(exId).filter(function (s) { return s.date < before && !s.warm; });
  if (!hist.length) return [];
  var d = hist[hist.length - 1].date;
  return hist.filter(function (s) { return s.date === d; });
};

TRAIN.fillFor = function (px, date, forLogAll) {
  var prev = TRAIN.lastSetsOf(px.ex, date);
  if ((px.fill | 0) === 1) {
    if (prev.length) return prev.map(function (s) { return { kg: s.kg, r: s.r, dist: s.dist, dur: s.dur }; });
  } else if ((px.fill | 0) === 3 && px.sets && px.sets.length) {
    /* Programmed by a coach. Tom, 2026-09-22: "First set only but they
       should still see their other sets from last session." So set one is
       the coach's, and every set after it is what was done last time. */
    var c = px.sets[0];
    var first = { kg: c.kg == null ? ((prev[0] || {}).kg || 0) : c.kg, r: c.r == null ? ((prev[0] || {}).r || 0) : c.r,
                  dist: c.dist || 0, dur: c.dur || 0 };
    return [first].concat(prev.slice(1).map(function (s) { return { kg: s.kg, r: s.r, dist: s.dist, dur: s.dur }; }));
  } else if ((px.fill | 0) === 2 && px.sets && px.sets.length) {
    return px.sets.map(function (s, i) {
      var p = prev[i] || prev[prev.length - 1] || {};
      return {
        kg: s.kg == null ? (p.kg || 0) : s.kg, r: s.r == null ? (p.r || 0) : s.r,
        dist: s.dist || 0, dur: s.dur || 0,
      };
    });
  }
  /* LOG ALL still makes one placeholder set for an exercise with nothing to
     fill it, which is what FitNotes does, so the exercise is in the day. */
  return forLogAll ? [{ kg: 0, r: 0 }] : [];
};

function writeFilled(exId, date, list) {
  var n = TRAIN.setsOn(date).length;
  list.forEach(function (s) {
    Rec.set('set', date, TRAIN.newId(), {
      ex: exId, kg: s.kg || 0, r: s.r || 0, u: TRAIN.unit(exId), done: 0, plan: 1, pr: 0, prf: 0,
      dist: s.dist || 0, dur: s.dur || 0, note: '', ord: ++n,
    });
  });
  return list.length;
}

/* Tapping an exercise in a routine goes to its training screen, with its
   sets already filled in if the routine says so. */
TRAIN.logFromRoutine = function (key) {
  var px = Rec.get('progex', null, key);
  if (!px) return;
  var date = TRAIN.date;
  TRAIN.rememberPlan(date, [px]);
  var have = TRAIN.setsOn(date).some(function (s) { return s.ex === px.ex; });
  var made = have ? 0 : writeFilled(px.ex, date, TRAIN.fillFor(px, date, false));
  if (made) { TRAIN.reindex(); TRAIN.assertTick(date); }
  var day = Rec.get('progday', null, px.day) || {};
  if (day.name && !(Rec.get('session', date, '') || {}).name) TRAIN.patchSession(date, { name: day.name });
  TRAIN.openExercise(px.ex);
  if (made && Rec.setting(APP.id, 'autoNext') !== 0) TRAIN.selectNextOpen();
};

/* ═══════════════════ COACH ═══════════════════
   Two files, one each way, because there is no server between a client and
   a coach and there is not meant to be one yet.

   Out: SEND TO COACH. Every training row on this phone, as a file the coach
   opens in COACH. Sent again, it carries everything again, and COACH merges
   on updated_at like any sync, so a second send only adds what is new.

   In: OPEN A PROGRAM. A file the coach made in COACH, or one he sold. It
   becomes an ordinary routine here. Its keys come from the program's own id,
   so opening an updated version replaces the old one rather than adding a
   second, and an exercise is matched by name so a client's own history
   carries on under it.

   Who the client is comes from CHECK IN, which already asks: its id, name
   and creature. So a client is the same person, and the same Pokemon, in
   both of the coach's apps. */
var COACH_TYPES = ['set', 'session', 'exercise', 'excat', 'phase', 'goal', 'sgroup'];
/* What the range draws, from any set of rows shaped like TRAIN's. COACH
   hands it a client's rows; TRAIN hands it the store's. */
TRAIN.rangeFrom = function (sets, phases) { return Range.fromRows(sets, phases, Day.today()); };
TRAIN.rangeData = function () { return TRAIN.rangeFrom(Rec.all('set'), Rec.all('phase')); };

TRAIN.whoAmI = function () {
  var pid = Rec.setting('checkin', 'pid');
  if (!pid) { pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); Rec.setting('checkin', 'pid', pid); }
  return { pid: pid, name: Rec.setting('checkin', 'name') || '', animal: Rec.setting('checkin', 'animal') || '' };
};
TRAIN.coachFile = function (name) {
  var me = TRAIN.whoAmI();
  return { kind: 'motherbase-train', v: 1, pid: me.pid, name: name, animal: me.animal,
    unit: TRAIN.unit(), at: new Date().toISOString(), rows: Rec.export(COACH_TYPES) };
};
TRAIN.sendToCoach = function () {
  var me = TRAIN.whoAmI();
  var ask = me.name ? Promise.resolve(me.name) : new Promise(function (res) {
    UI.dialog({
      title: 'YOUR NAME', width: 380,
      body: function (b) { var i = UI.field('text', { placeholder: 'First name' }); b.appendChild(i); UI.focusSoon(i); },
      actions: [{ label: 'CANCEL', fn: function () { res(null); } },
        { label: 'SEND', kind: 'go', fn: function (h) {
          var v = (h.body.querySelector('input').value || '').trim();
          if (!v) { UI.toast('Type a name first', { bad: true }); return false; }
          Rec.setting('checkin', 'name', v); res(v);
        } }],
    });
  });
  ask.then(function (name) {
    if (!name) return;
    var bag = TRAIN.coachFile(name);

    /* The file, which is what this always did and what it still does whenever
       the upload cannot happen: opened from a folder, not signed in, no
       signal, blocked CDN. Hard constraint 4, and the reason this is still one
       button — the client presses the same thing either way and never has
       to know which of the two carried it. */
    var toFile = function (why) {
      var text = JSON.stringify(bag);
      var file = 'TRAIN ' + name + ' ' + Day.today() + '.json';
      var f = null;
      try { f = new File([text], file, { type: 'application/json' }); } catch (e) {}
      var done = function () {
        UI.toast(why ? 'Saved a file to send instead. ' + UI.esc(why)
                     : 'Sent. <b>' + bag.rows.length + '</b> rows in the file.');
      };
      if (f && navigator.canShare && navigator.canShare({ files: [f] }) && Mobile.touch) {
        navigator.share({ files: [f] }).then(done, function () {});
        return;
      }
      var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      var a = document.createElement('a'); a.href = url; a.download = file;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 8000);
      done();
    };

    /* The upload, 2026-09-23. Same press, no file to hand over: the parcel
       goes on the coach's shelf and his COACH takes it in. Still a deliberate
       send, which is the part Tom kept when he picked this over a live feed
       — nothing leaves this phone until the button is pressed. */
    if (!window.Cloud || !Cloud.send) { toFile(''); return; }
    UI.toast('Sending to your coach…');
    Cloud.send('train', bag).then(function () {
      UI.toast('Sent to your coach. <b>' + bag.rows.length + '</b> rows.');
    }, function (e) {
      toFile((e && e.message) || 'that did not go through');
    });
  });
};
TRAIN.openProgram = function () {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    f.text().then(function (t) {
      var n = TRAIN.takeProgram(JSON.parse(t));
      UI.toast('<b>' + UI.esc(n.name) + '</b> is in Training Routines' + (n.weeks > 1 ? ', one per week for ' + n.weeks + ' weeks' : ', ' + n.ex + ' exercises'));
      TRAIN.show('routines');
    }).catch(function (e) { UI.toast(UI.esc((e && e.message) || 'That file could not be read'), { bad: true }); });
  };
  inp.click();
};
/* A program built in FORGE has weeks: each day in the file says which week
   it is in (`wk`) and its plain name (`day`). Each week becomes a routine of
   its own, "Hypertrophy · Week 2", so a client opens the week they are in
   and sees three or four days rather than sixteen. A file with no weeks, or
   one week, is one routine exactly as before.

   Beside each exercise may ride the coach's target: `n` sets, `rir`, `rest`
   in seconds and a `note`. It is kept on the routine entry as `plan` and
   shown, never logged: still only the FIRST set is filled in (Tom,
   2026-09-22, kept 2026-09-24). A new exercise takes the rest as its rest
   timer; one the client already has keeps their own. */
/* The rep range and its bands are Tom's Algrowrithm: reps travel down the
   range across the sets (8-15 over three is 13-15, 10-13, 8-10) and the
   load goes up from how the set before went, so only a range is ever sent,
   never a count for set two onwards. */
TRAIN.planText = function (plan, first) {
  if (!plan) return '';
  var b = [], r = plan.reps != null ? plan.reps : first && first.r != null ? first.r : null;
  if (plan.n != null || r != null) b.push((plan.n != null ? plan.n + ' × ' : '') + (r != null ? r : '?'));
  if (plan.bands) b.push(plan.bands);
  if (plan.rir != null) b.push('RIR ' + plan.rir);
  if (plan.rest != null) b.push(Math.floor(plan.rest / 60) + ':' + ('0' + (plan.rest % 60)).slice(-2) + ' rest');
  if (plan.note) b.push(plan.note);
  return b.join(' · ');
};
TRAIN.takeProgram = function (bag) {
  if (!bag || bag.kind !== 'motherbase-program' || !bag.id || !Array.isArray(bag.days)) {
    throw new Error('That is not a program file from COACH');
  }
  var src = String(bag.id).replace(/[^a-z0-9-]/gi, '');
  var exs = TRAIN.exercises(), byName = {};
  Object.keys(exs).forEach(function (k) { byName[String(exs[k].name || '').trim().toLowerCase()] = k; });
  var keepDays = {}, keepEx = {}, keepProg = {}, count = 0;
  var weeks = 1;
  bag.days.forEach(function (d) { if ((d.wk | 0) > weeks) weeks = d.wk | 0; });
  var progOf = function (w) { return weeks > 1 ? 'prog-' + src + '-w' + w : 'prog-' + src; };
  for (var w = 1; w <= weeks; w++) {
    keepProg[progOf(w)] = 1;
    Rec.set('program', null, progOf(w), { name: (bag.name || 'Program') + (weeks > 1 ? ' · Week ' + w : ''),
      ord: weeks > 1 ? -1 + w / 1000 : -1, from: bag.from || '' });
  }
  /* what the client already picked for each open slot, by the slot's own
     id from FORGE, which is the same in every week of the program */
  var picked = {};
  Rec.all('progex').forEach(function (r) {
    var v = r.payload || {};
    if (r.key.indexOf('pex-' + src + '-') === 0 && v.slot && v.slot.fk && v.ex) picked[v.slot.fk] = v.ex;
  });
  var nth = {};
  bag.days.forEach(function (d, i) {
    var dk = 'pday-' + src + '-' + i, w = Math.max(1, d.wk | 0);
    keepDays[dk] = 1;
    nth[w] = (nth[w] || 0) + 1;
    Rec.set('progday', null, dk, { program: progOf(w), name: (weeks > 1 ? d.day : d.name) || d.name || ('Day ' + nth[w]), ord: i });
    (d.ex || []).forEach(function (x, j) {
      var nm = String(x.name || '').trim();
      var xk = 'pex-' + src + '-' + i + '-' + j;
      var plan = {};
      if (x.n != null) plan.n = +x.n;
      if (x.reps != null) plan.reps = String(x.reps);
      if (x.bands) plan.bands = String(x.bands);
      if (x.rir != null) plan.rir = String(x.rir);
      if (x.rest != null) plan.rest = +x.rest;
      if (x.note) plan.note = String(x.note);
      /* An open slot: the coach asked for a movement pattern or a muscle
         group, "any Horizontal Push", and left the exercise to the client.
         It is kept with no exercise and picked here, from the routine; a
         pick survives the coach sending the program again, as long as the
         slot still asks for the same thing. */
      if (!nm) {
        if (!x.slot || !x.slot.label) return;
        var prev = Rec.get('progex', null, xk);
        var keep = (x.fk && picked[x.fk]) || (prev && prev.slot && prev.slot.label === x.slot.label && prev.ex ? prev.ex : null);
        keepEx[xk] = 1;
        var sp = { day: dk, ex: keep, ord: j, fill: x.sets && x.sets.length ? 3 : 1,
          slot: { label: String(x.slot.label), pat: x.slot.pat || null, mus: x.slot.mus || null, fk: x.fk || null },
          sets: (x.sets || []).slice(0, 1).map(function (s) {
            return { kg: s.kg == null ? null : +s.kg, r: s.r == null ? null : +s.r, u: TRAIN.unit() };
          }) };
        if (Object.keys(plan).length) sp.plan = plan;
        Rec.set('progex', null, xk, sp);
        count++;
        return;
      }
      var id = byName[nm.toLowerCase()];
      if (!id) {
        id = TRAIN.seedId(nm);
        var cats = TRAIN.cats(), cat = String(x.cat || '').toLowerCase();
        /* a muscle group this phone already has is used as it is: addCat
           would write it again and move its colour and its place */
        if (!cats[cat] && x.catName) {
          Object.keys(cats).forEach(function (k) {
            if (String(cats[k].name || '').toLowerCase() === String(x.catName).toLowerCase()) cat = k;
          });
        }
        if (!cats[cat]) cat = TRAIN.addCat(x.catName || 'Other') || Object.keys(cats)[0];
        Rec.set('exercise', null, id, { name: nm, cat: cat, kind: x.kind | 0, inc: 2.5, rest: x.rest > 0 ? x.rest | 0 : 0, unit: 0,
          fav: 0, note: '', graph: 0, ord: 999 });
        byName[nm.toLowerCase()] = id;
      }
      keepEx[xk] = 1;
      var px = { day: dk, ex: id, ord: j, fill: x.sets && x.sets.length ? 3 : 1,
        sets: (x.sets || []).slice(0, 1).map(function (s) {
          return { kg: s.kg == null ? null : +s.kg, r: s.r == null ? null : +s.r, u: TRAIN.unit() };
        }) };
      if (Object.keys(plan).length) px.plan = plan;
      Rec.set('progex', null, xk, px);
      count++;
    });
  });
  /* the same program sent before with more weeks, or before it had weeks */
  Rec.all('program').forEach(function (r) {
    var k = r.key, base = 'prog-' + src;
    if ((k === base || k.indexOf(base + '-w') === 0) && !keepProg[k]) Rec.del('program', null, k);
  });
  /* an updated program that dropped a day or an exercise drops it here too */
  Rec.all('progday').forEach(function (r) { if (r.key.indexOf('pday-' + src + '-') === 0 && !keepDays[r.key]) Rec.del('progday', null, r.key); });
  Rec.all('progex').forEach(function (r) { if (r.key.indexOf('pex-' + src + '-') === 0 && !keepEx[r.key]) Rec.del('progex', null, r.key); });
  TRAIN._exC = null;
  TRAIN.reindex();
  return { name: bag.name || 'Program', ex: count, weeks: weeks };
};

          row.appendChild(n);

          var r = UI.field('decimal', { value: s.r == null ? '' : String(s.r), placeholder: 'reps' });

TRAIN.copyProgram = function (progId) {
  var prog = TRAIN.programs()[progId];
  if (!prog) return;
  var newId = TRAIN.newId();
  Rec.set('program', null, newId, { name: prog.name + ' (copy)', ord: Object.keys(TRAIN.programs()).length });
  TRAIN.daysOf(progId).forEach(function (d) {
    var dayId = TRAIN.newId();
    Rec.set('progday', null, dayId, { program: newId, name: d.d.name, ord: d.d.ord || 0 });
    TRAIN.exercisesOf(d.key).forEach(function (it) {
      var x = copyObj(it.x);
      x.day = dayId;
      Rec.set('progex', null, TRAIN.newId(), x);
    });
  });
  draw();
  UI.toast('Routine copied successfully');
};

TRAIN.deleteProgram = function (progId) {

TRAIN.groupOf = function (date, exId) {
  var gs = TRAIN.groupsOn(date);
  for (var i = 0; i < gs.length; i++) if ((gs[i].g.ex || []).indexOf(exId) > -1) return gs[i];

/* ═══════════════ AUTO-SELECT NEXT SET ═══════════════
   FitNotes' setting of that name. On a day that was copied or filled from a
   routine, the next set still to be done loads into the steppers, so logging
   it is change-the-number and press UPDATE. */
function loadDraft(s) {
  TRAIN.draftW = s.kg ? TRAIN.showWeight(s.kg, s.u, s.ex) : '';
  TRAIN.draftR = s.r ? String(s.r) : '';
  TRAIN.draftD = s.dist ? TRAIN.showDist(s.dist) : '';
  TRAIN.draftT = s.dur ? fmtSecs(s.dur) : '';
  if (s.su) TRAIN.draftSU = copyObj(s.su);
}
TRAIN.selectNextOpen = function () {
  var nxt = TRAIN.setsOn(TRAIN.date).filter(function (s) { return s.ex === TRAIN.exId && TRAIN.pending(s); })[0];
  if (!nxt) return false;
  TRAIN.sel = nxt.key;
  loadDraft(nxt);
  draw();
  return true;
};

/* ═══════════════ KEEP SCREEN ON ═══════════════
   FitNotes' "Prevent the device from sleeping while the training screen is
   open". A screen that stays on is also a tab that is never suspended, which
   is what lets the rest timer ring. */
TRAIN.wakeLock = null;
TRAIN.canWake = function () { return typeof navigator !== 'undefined' && 'wakeLock' in navigator; };
TRAIN.wake = function () {
  if (!TRAIN.canWake()) return;
  var want = Rec.setting(APP.id, 'keepAwake') === 1 && !document.hidden;
  if (want && !TRAIN.wakeLock) {
    navigator.wakeLock.request('screen').then(function (lock) {
      TRAIN.wakeLock = lock;
      lock.addEventListener('release', function () { TRAIN.wakeLock = null; });
    }).catch(function (e) { console.warn('[train] wake lock refused', e && e.message); });
  } else if (!want && TRAIN.wakeLock) {
    TRAIN.wakeLock.release().catch(function () {});
    TRAIN.wakeLock = null;
  }
};

/* ═══════════════ WORKOUT GRAPHS ═══════════════
   FitNotes' Weekly, Monthly and Yearly Graphs: workouts, sets, reps, volume
   and duration per period, across every exercise. */

/* chart.js carries its readable steps past 5000 since 2026-09-14, so a
   month of volume in pounds gets a scale of its own. */
function fitY(c, values, zero) {
  return c.yFit(values, zero ? { min: 0, include: 0 } : {});
}
function bucketOf(date, by) {
  if (by === 'year') return date.slice(0, 4) + '-01-01';
  if (by === 'month') return date.slice(0, 7) + '-01';
  var ws = TRAIN.weekStartDow();
  var back = (Day.dow(date) - ws + 7) % 7;
  return Day.shift(date, -back);
}
function nextBucket(b, by) {
  if (by === 'week') return Day.shift(b, 7);
  var d = new Date(b + 'T12:00:00');
  if (by === 'month') d.setMonth(d.getMonth() + 1); else d.setFullYear(d.getFullYear() + 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
}

TRAIN.workoutSeries = function (metric, by) {
  var sums = {}, dates = Object.keys(TRAIN.idx.byDate).sort();
  if (!dates.length) return [];
  dates.forEach(function (d) {
    var b = bucketOf(d, by);
    var work = TRAIN.idx.byDate[d].filter(function (s) { return !s.warm && TRAIN.counts(s); });
    if (!work.length) return;
    var v = 0;
    if (metric === 'workouts') v = 1;
    else if (metric === 'sets') v = work.length;
    else if (metric === 'reps') work.forEach(function (s) { v += s.r || 0; });
    else if (metric === 'volume') v = TRAIN.toUnit(TRAIN.volume(work), TRAIN.unit());
    else if (metric === 'time') {
      var sess = Rec.get('session', d, '') || {};
      v = sess.start && sess.end ? Math.max(0, (Date.parse(sess.end) - Date.parse(sess.start)) / 60000) : 0;
    }
    sums[b] = (sums[b] || 0) + v;
  });
  var span = { week: 26, month: 24, year: 50 }[by];
  var last = bucketOf(Day.today(), by);
  var first = bucketOf(dates[0], by);
  var list = [], b2 = last;
  for (var i = 0; i < span; i++) {
    list.unshift([b2, sums[b2] || 0]);
    if (b2 <= first) break;
    b2 = by === 'week' ? Day.shift(b2, -7) : prevBucket(b2, by);
  }
  return list;
};
function prevBucket(b, by) {
  var d = new Date(b + 'T12:00:00');
  if (by === 'month') d.setMonth(d.getMonth() - 1); else d.setFullYear(d.getFullYear() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
}

function drawWorkoutGraphs(m) {
  var metric = TRAIN.wgMetric || 'workouts', by = TRAIN.wgBy || 'week';
  var controls = UI.el('div', 'exblock pad');
  controls.appendChild(UI.segmented([
    { id: 'workouts', name: 'SESSIONS' }, { id: 'sets', name: 'SETS' }, { id: 'reps', name: 'REPS' },
    { id: 'volume', name: 'VOLUME' }, { id: 'time', name: 'TIME' },
  ], metric, function (v) { TRAIN.wgMetric = v; draw(); }));
  var bySel = UI.segmented([{ id: 'week', name: 'WEEK' }, { id: 'month', name: 'MONTH' }, { id: 'year', name: 'YEAR' }],
    by, function (v) { TRAIN.wgBy = v; draw(); });
  bySel.style.marginTop = 'var(--s-3)';
  controls.appendChild(bySel);
  m.appendChild(controls);

  var series = TRAIN.workoutSeries(metric, by);
  if (!series.length) {
    var e = UI.el('div', 'empty'); e.textContent = 'No sessions to display'; m.appendChild(e);
    return;
  }
  var values = series.map(function (p) { return p[1]; });
  var total = values.reduce(function (a, v) { return a + v; }, 0);
  var card = UI.el('div', 'exblock pad');
  var unitWord = { workouts: 'sessions', sets: 'sets', reps: 'reps', volume: TRAIN.unitLabel(), time: 'minutes' }[metric];
  var perWord = { week: 'week', month: 'month', year: 'year' }[by];
  card.innerHTML = '<div class="fieldlabel">' + UI.esc(metric === 'workouts' ? 'SESSIONS' : metric.toUpperCase()) + ' PER ' + perWord.toUpperCase() + '</div>';
  var box = UI.el('div', 'chartbox');
  card.appendChild(box);
  var avg = total / series.length;
  /* Bars from shared/chart.js: this period lit and the rest quiet, the
     average as a line, and a drag to read any period. */
  var MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var shortOf = function (d) {
    var p = d.split('-');
    return by === 'year' ? p[0] : by === 'month' ? MONS[+p[1] - 1] : +p[2] + ' ' + MONS[+p[1] - 1];
  };
  Chart.mount(box, { label: unitWord + ' per ' + perWord }, function (c) {
    c.xLinear(-0.5, series.length - 0.5);
    fitY(c, values, true);
    c.grid(function (v) { return v >= 10000 ? Math.round(v / 1000) + 'k' : Math.round(v).toLocaleString(); });
    var every = Math.max(1, Math.ceil(series.length / Math.max(2, Math.floor((c.W - c.P.l - c.P.r) / 64))));
    c.labels(series.map(function (p, i) { return [i, shortOf(p[0]), i === series.length - 1]; })
      .filter(function (l, i) { return (series.length - 1 - i) % every === 0; }));
    c.bars(series.map(function (p, i) { return [i, p[1], shortOf(p[0]) + ': ' + Math.round(p[1]).toLocaleString() + ' ' + unitWord]; }),
      null, null, { highlight: 'last' });
    c.rule(avg, 'average');
    c.scrub(series.map(function (p, i) { return [i, p[1]]; }), {
      fmt: function (p) { return Math.round(p[1]).toLocaleString() + ' ' + unitWord + ', ' + shortOf(series[p[0]][0]); },
    });
  });
  var foot = UI.el('div', 'lasttime');
  foot.innerHTML = '<b>' + Math.round(avg).toLocaleString() + '</b> ' + unitWord + ' per ' + perWord +
    ' over the last <b>' + series.length + '</b>';
  card.appendChild(foot);
  m.appendChild(card);
}

/* ═════════════════════════════════════════════════════════════════════════
   TRAINING, NOT WORKING OUT

   Tom, 2026-09-14: "I don't workout, I train." A workout is a selection of
   exercises, maybe random, maybe copied. A training session is designed,
   personal, and meant to move him towards something. So on top of FitNotes:

     a session can have a name, and belongs to a training block
     a repeated session says, set by set, how much stronger each set was
     the end of a session adds itself up, in a card made to be shared
     a week counts the sets each muscle got and how often it was hit
     records start again with each block; the all-time ones stay

   No targets and no verdicts on plateaus, at his request. It states what
   happened and lets him join it up.
   ═════════════════════════════════════════════════════════════════════════ */

/* ── what a comment says ──
   Two things are read out of a set's comment, and ONLY out of the comment
   (Tom: "make it happen automatically due to comments and ONLY due to
   comments"). Nothing is written back: the comment stays the truth, so
   editing it changes what the set is.

   A WARMUP: "warmup", "warm up" or "wu" anywhere in it. 161 of his 2,240 set
   comments. A mark made by hand wins over the comment either way, so "Not a
   warmup" on "start having a dedicated warmup set" sticks.

   A SPLIT SET, in his notation: numbers joined by the rest between them.
     "10 5"   a short rest, about three breaths
     "10,5"   under thirty seconds
     "10+5"   a long rest, still the same set
   Only when the numbers add up to the set's reps. That is what tells a rep
   split from everything else in his comments with two numbers in it: "5 5 4
   4" on a 9-rep curl is per side, "2 10s" is plates, "Seat at 5, 1 yoga pad"
   is a seat. A partial rep rounds down, so "5 1.5" is 6. Read off his file
   2026-09-14: 528 comments are only numbers that add up to the reps, 98 are
   numbers that do not. */
TRAIN.noteWarm = function (note) {
  return !!note && /\bwarm[ -]?ups?\b|\bwu\b/i.test(note);
};
TRAIN.noteSplit = function (note, reps) {
  if (!note || !(reps > 1) || !/\d/.test(note)) return null;
  var rx = /\d+(?:\.\d+)?|\.\d+/g, nums = [], m;
  while ((m = rx.exec(note))) {
    var a = m.index, b = a + m[0].length;
    /* "10s" and "8th" are not rep counts */
    nums.push({ v: parseFloat(m[0]), a: a, b: b,
      ok: !/[A-Za-z0-9_]/.test(note.charAt(a - 1)) && !/[A-Za-z0-9_]/.test(note.charAt(b)) });
  }
  var runs = [], cur = [];
  nums.forEach(function (n) {
    if (!n.ok) { if (cur.length) runs.push(cur); cur = []; return; }
    if (cur.length) {
      var gap = note.slice(cur[cur.length - 1].b, n.a);
      if (/^[ \t]*[,+][ \t]*$/.test(gap) || /^[ \t]+$/.test(gap)) {
        n.rest = gap.indexOf('+') > -1 ? 3 : gap.indexOf(',') > -1 ? 2 : 1;
        cur.push(n);
        return;
      }
      runs.push(cur);
    }
    n.rest = 0;
    cur = [n];
  });
  if (cur.length) runs.push(cur);
  /* Any stretch of a run can be the split: "Height 11, 10 5" is 10 and 5. */
  for (var r = 0; r < runs.length; r++) {
    var run = runs[r];
    for (var i = 0; i < run.length - 1; i++) {
      if (!(run[i].v > 0)) continue;
      var sum = run[i].v, rest = 0;
      for (var j = i + 1; j < run.length; j++) {
        if (!(run[j].v > 0)) break;
        sum += run[j].v;
        rest = Math.max(rest, run[j].rest);
        if (Math.floor(sum + 1e-9) === reps || Math.abs(sum - reps) < 1e-6) {
          return { text: note.slice(run[i].a, run[j].b), rest: rest,
                   parts: run.slice(i, j + 1).map(function (x) { return x.v; }) };
        }
        if (sum > reps + 1) break;
      }
    }
  }
  return null;
};

/* A date, with its year when it is not the year of the day it is shown on.
   A comparison can reach back a year, and "Sat, Jun 28" alone reads as last
   month. */
function dayY(d, from) {
  return String(d).slice(0, 4) === String(from || Day.today()).slice(0, 4)
    ? Day.label(d) : Day.label(d, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

/* A set counts unless it is a plan waiting to be done. A past day counts as it
   was logged: 1,099 of his FitNotes sets were never ticked, and Analysis has
   always counted them. Today, a copied or routine-filled set is not work until
   it is ticked, and `plan` is what marks one.

   Until 2026-09-24 saving a set wrote done:1 and this asked about `done`
   alone. Tom asked for saved sets to stop ticking themselves, so the two facts
   had to come apart: `plan` says the app wrote this set on his behalf, `done`
   is the box he ticks. A set he typed and saved is work the moment it is
   saved, box or no box. */
TRAIN.counts = function (s) { return !s.plan || !!s.done || s.date < Day.today(); };

/* A plan still waiting: what auto-select next set goes looking for, and what
   stops the session timer from ending the moment the first set lands. */
TRAIN.pending = function (s) { return !!s.plan && !s.done; };

/* One exercise's working sets on a day, in the order they were done. */
function workOn(date, exId) {
  return TRAIN.setsOn(date).filter(function (s) { return s.ex === exId && !s.warm; })
    .sort(function (a, b) { return (a.ord || 0) - (b.ord || 0) || TRAIN.setStamp(a) - TRAIN.setStamp(b); });
}

/* ── training blocks ──
   A block runs from its start until the next block starts, or to its own end
   if it has one. The type is `phase`, not `block`: BLOCK is another app in
   this suite and has nothing to do with training beyond a tick (Tom,
   2026-09-14). On screen it is a training block. */
TRAIN._phC = null;
Rec.on(function () { TRAIN._phC = null; });
TRAIN.phases = function () {
  if (TRAIN._phC) return TRAIN._phC;
  var all = Rec.map('phase');
  return (TRAIN._phC = Object.keys(all).map(function (k) { return { key: k, p: all[k] }; })
    .filter(function (x) { return x.p && x.p.start; })
    .sort(function (a, b) { return a.p.start < b.p.start ? -1 : a.p.start > b.p.start ? 1 : 0; }));
};
TRAIN.phaseSpan = function (list, i) {
  var x = list[i], next = list[i + 1], to = x.p.end || null;
  if (next) {
    var stop = Day.shift(next.p.start, -1);
    if (!to || stop < to) to = stop;
  }
  return { key: x.key, p: x.p, from: x.p.start, to: to };
};
TRAIN.phaseOn = function (date) {
  var list = TRAIN.phases();
  for (var i = list.length - 1; i >= 0; i--) {
    if (list[i].p.start > date) continue;
    var sp = TRAIN.phaseSpan(list, i);
    return !sp.to || date <= sp.to ? sp : null;
  }
  return null;
};
TRAIN.phaseByKey = function (key) {
  var list = TRAIN.phases();
  for (var i = 0; i < list.length; i++) if (list[i].key === key) return TRAIN.phaseSpan(list, i);
  return null;
};
TRAIN.phaseWeek = function (sp, date) { return Math.floor(Day.diff(date, sp.from) / 7) + 1; };
TRAIN.phaseLine = function (sp, date) { return sp.p.name + ' · Week ' + TRAIN.phaseWeek(sp, date); };

TRAIN.phaseDialog = function (key) {
  var cur = key ? Rec.get('phase', null, key) : null, name = null, start = null, end = null;
  UI.dialog({
    title: key ? 'TRAINING BLOCK' : 'NEW TRAINING BLOCK', width: 440,
    body: function (b, h) {
      name = UI.field('text', { value: cur ? cur.name : '', placeholder: 'Summer Cut 2026' });
      start = UI.field('date', { value: cur ? cur.start : Day.today() });
      end = UI.field('date', { value: cur && cur.end ? cur.end : '' });
      b.appendChild(UI.row('Name', '', name));
      b.appendChild(UI.row('Starts', 'Block records count from this day', start));
      b.appendChild(UI.row('Ends', 'Empty runs it until the next block', end));
      Mobile.form(b, function () { if (save()) h.close(); });
    },
    actions: (key ? [{ label: 'DELETE', kind: 'bad', fn: function () {
      setTimeout(function () { TRAIN.deletePhase(key); }, 60);
    } }] : []).concat([
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: function () { if (!save()) return false; } },
    ]),
  });
  UI.focusSoon(name);
  function save() {
    var nm = String(name.value || '').trim(), st = start.value, en = end.value || '';
    if (!nm) { UI.toast('Please enter a name', { bad: true }); UI.focusSoon(name); return false; }
    if (!st) { UI.toast('Please select a start date', { bad: true }); return false; }
    if (en && en < st) { UI.toast('The end is before the start', { bad: true }); return false; }
    TRAIN.patchRow('phase', null, key || TRAIN.newId(), { name: nm, start: st, end: en || undefined });
    Mobile.feedback('success');
    draw();
    return true;
  }
};
TRAIN.deletePhase = function (key) {
  var cur = Rec.get('phase', null, key);
  if (!cur) return;
  UI.confirm('Delete ' + cur.name + '?', 'Its sessions and sets stay.', { yes: 'DELETE', danger: true })
    .then(function (yes) {
      if (!yes) return;
      Rec.del('phase', null, key);
      draw();
      UI.undo('Training block deleted', function () { Rec.set('phase', null, key, cur); draw(); });
    });
};
TRAIN.phaseMenu = function (key, e) {
  var sp = TRAIN.phaseByKey(key);
  if (!sp) return;
  var items = [
    { label: 'Edit', fn: function () { TRAIN.phaseDialog(key); } },
    { label: 'Records In This Block', fn: function () {
      TRAIN.recScope = key; TRAIN.recView = 'records'; TRAIN.show('records');
    } },
  ];
  if (!sp.to && sp.from <= Day.today()) {
    items.push({ label: 'End Today', fn: function () {
      TRAIN.patchRow('phase', null, key, { end: Day.today() }); draw();
    } });
  }
  items.push({ label: 'Delete', kind: 'bad', fn: function () { TRAIN.deletePhase(key); } });
  menuAt(e, items, sp.p.name.toUpperCase());
};

/* ── the session: its name, and what it is compared with ──
   A name is how "the same session" is recognised, and nothing else hangs on
   it. Tom: two back days in one block can be semi unrecognisable, a
   different gym or a broken machine, so a name never locks the exercises. */
TRAIN.sessionNames = function (except) {
  var skip = String(except || '').trim().toLowerCase(), seen = {}, out = [];
  Rec.all('session').filter(function (r) { return r.payload && r.payload.name; })
    .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; })
    .forEach(function (r) {
      var nm = String(r.payload.name).trim(), k = nm.toLowerCase();
      if (!nm || seen[k] || k === skip) return;
      seen[k] = 1;
      out.push(nm);
    });
  return out;
};

function sessionHead(date) {
  var s = Rec.get('session', date, '') || {}, ph = TRAIN.phaseOn(date);
  var el = UI.el('div', 'sesshead mb-press');
  el.innerHTML = '<div class="nm">' +
    (s.name ? '<b>' + UI.esc(s.name) + '</b>' : '<b class="none">Name this session</b>') +
    '<span>' + UI.esc(ph ? TRAIN.phaseLine(ph, date) : 'No training block') + '</span></div>';
  el.onclick = function () { Mobile.feedback('open'); TRAIN.sessionDialog(date); };
  withMenu(el, function (e) { sessionMenu(date, e); });
  el.appendChild(rowMenuBtn('Session options', function (e) { sessionMenu(date, e); }));
  return el;
}
function sessionMenu(date, e) {

/* ═══════════════════ HOW MUCH STRONGER, SET BY SET ═══════════════════
   Tom: "Compare session 1 working set 1 to session 2 working set 1, I don't
   want a change in warmup set quantity to affect comparison."

   What each exercise is measured against, first match wins:
     1. a day he picked for this session
     2. the last session with the same name, inside this block first
     3. the day this one was copied from
     4. the last time this exercise was done
   Per exercise, because a named session can be semi unrecognisable from its
   last time: an exercise the last Back day did not have is measured against
   the last Back day that did, then against its own last time.

   Working set N against working set N, warmups left out of both sides. */
TRAIN.compareCtx = function (date) {
  var sess = Rec.get('session', date, '') || {}, named = [];
  var key = String(sess.name || '').trim().toLowerCase();
  if (key) {
    var ph = TRAIN.phaseOn(date), inside = [], outside = [];
    Rec.all('session').forEach(function (r) {
      if (!r.payload || r.date >= date || String(r.payload.name || '').trim().toLowerCase() !== key) return;
      (ph && r.date >= ph.from ? inside : outside).push(r.date);
    });
    var desc = function (a, b) { return a < b ? 1 : a > b ? -1 : 0; };
    named = inside.sort(desc).concat(outside.sort(desc));
  }
  return { sess: sess, named: named };
};
TRAIN.vsFor = function (date, exId, ctx) {
  var has = function (d) { return TRAIN.setsOn(d).some(function (s) { return s.ex === exId && !s.warm; }); };
  var s = ctx.sess;
  if (s.vs && s.vs < date && has(s.vs)) return { date: s.vs, why: 'picked' };
  for (var i = 0; i < ctx.named.length; i++) if (has(ctx.named[i])) return { date: ctx.named[i], why: 'name' };
  if (s.from && s.from < date && has(s.from)) return { date: s.from, why: 'copy' };
  var h = TRAIN.historyOf(exId);
  for (var j = h.length - 1; j >= 0; j--) if (h[j].date < date && !h[j].warm) return { date: h[j].date, why: 'last' };
  return null;
};

/* One set against the same set last time. Tom, 2026-09-15: "I want to see how
   much more reps AND % increases." So the change names every part that moved:
   the weight if it moved, the reps if they moved, and how much stronger the set
   was as a percentage of its estimated 1RM. The 1RM is what lets the same bar
   for two more reps count, and a percentage reads the same in pounds and
   kilograms. A set with no weight has no 1RM, so its percentage is of its reps.
   A split set against a straight one is not like for like and gets no direction.

   The numbers come back too, so a card can add them up: `dr` the change in
   reps, `pct` the change in strength, `e1` when that is a 1RM percentage. */
/* Did this set move more than that one? Weight times reps where there is a
   weight, reps where there is not, and for any other kind (distance, time)
   the direction setDelta already worked out. */
TRAIN.volUp = function (a, b, kind, d) {
  if (!a || !b) return false;
  var f = KIND_FIELDS[kind] || KIND_FIELDS.wr;
  if (f.indexOf('r') > -1) {
    var r1 = +a.r || 0, r0 = +b.r || 0, k1 = +a.kg || 0, k0 = +b.kg || 0;
    var v1 = k1 > 0 || k0 > 0 ? k1 * r1 : r1, v0 = k1 > 0 || k0 > 0 ? k0 * r0 : r0;
    return v1 > v0 + 1e-9;
  }
  return !!(d && d.dir > 0);
};
TRAIN.setDelta = function (a, b, kind) {
  if (!b) return { dir: 0, text: 'new' };
  if (!!a.split !== !!b.split) return { dir: 0, text: a.split ? 'split' : 'straight' };
  var f = KIND_FIELDS[kind] || KIND_FIELDS.wr;
  var val = function (s, k) { return +({ w: s.kg, r: s.r, d: s.dist, t: s.dur }[k]) || 0; };
  var same = function (x, y, k) { return k === 'w' ? Math.abs(x - y) < 0.005 : k === 'd' ? Math.abs(x - y) < 0.0005 : x === y; };
  var sign = function (v) { return v > 0 ? '+' : '−'; };
  var repWord = function (n) { return sign(n) + TRAIN.showReps(Math.abs(n)) + (Math.abs(n) === 1 ? ' rep' : ' reps'); };
  var out = { dir: 0, dr: f.indexOf('r') > -1 ? val(a, 'r') - val(b, 'r') : null, pct: null, e1: false };
  var parts = [];
  if (f[0] === 'w' && f[1] === 'r') {
    var dk = val(a, 'w') - val(b, 'w'), moved = !same(val(a, 'w'), val(b, 'w'), 'w');
    if (moved) parts.push(sign(dk) + fmt1(TRAIN.toUnit(Math.abs(dk), TRAIN.unit(a.ex))) + ' ' + TRAIN.unit(a.ex));
    if (out.dr) parts.push(repWord(out.dr));
    var ea = TRAIN.e1rm(a.kg, a.r), eb = TRAIN.e1rm(b.kg, b.r);
    if (ea > 0 && eb > 0) { out.pct = (ea / eb - 1) * 100; out.e1 = true; }
    else if (!moved && !a.kg && b.r > 0) out.pct = (val(a, 'r') / b.r - 1) * 100;
    if (out.pct != null && Math.abs(out.pct) < 0.05) out.pct = 0;
    if (out.pct) parts.push(sign(out.pct) + Math.abs(out.pct).toFixed(1) + '%');
    out.dir = out.pct ? (out.pct > 0 ? 1 : -1) : moved ? (dk > 0 ? 1 : -1) : out.dr ? (out.dr > 0 ? 1 : -1) : 0;
  } else {
    for (var i = 0; i < f.length; i++) {
      var k = f[i], x = val(a, k), y = val(b, k);
      if (same(x, y, k)) continue;
      var dv = Math.abs(x - y);
      parts.push(k === 'w' ? sign(x - y) + fmt1(TRAIN.toUnit(dv, TRAIN.unit(a.ex))) + ' ' + TRAIN.unit(a.ex)
        : k === 'r' ? repWord(x - y)
        : k === 'd' ? sign(x - y) + TRAIN.showDist(dv) + ' ' + TRAIN.distUnit()
        : sign(x - y) + fmtSecs(dv));
      /* over a distance, less time is the better run */
      if (!out.dir) out.dir = (kind === 'dt' && k === 't' ? x < y : x > y) ? 1 : -1;
    }
    var y0 = val(b, f[0]);
    if (y0 > 0 && !same(val(a, f[0]), y0, f[0])) {
      out.pct = (val(a, f[0]) / y0 - 1) * 100;
      if (Math.abs(out.pct) >= 0.05) parts.push(sign(out.pct) + Math.abs(out.pct).toFixed(1) + '%');
    }
  }
  out.text = parts.length ? parts.join(' · ') : 'same';
  return out;
};
/* What a run of sets added up to: reps gained, and the average percentage of
   the sets that have a 1RM on both sides. */
function gainText(reps, pctSum, pctN) {
  var parts = [];
  if (reps) parts.push((reps > 0 ? '+' : '−') + TRAIN.showReps(Math.abs(reps)) + (Math.abs(reps) === 1 ? ' rep' : ' reps'));
  if (pctN) {
    var p = pctSum / pctN;
    if (Math.abs(p) >= 0.05) parts.push((p > 0 ? '+' : '−') + Math.abs(p).toFixed(1) + '% average');
  }
  return parts.join(' · ');
}
function deltaChip(d) {
  if (!d) return '';
  return '<span class="dl' + (d.dir > 0 ? ' up' : d.dir < 0 ? ' down' : '') + '">' + UI.esc(d.text) + '</span>';
}

TRAIN.dayCompare = function (date) {
  var groups = TRAIN.dayGroups(date);
  if (!groups.length) return null;
  var ctx = TRAIN.compareCtx(date);
  var out = { byEx: {}, up: 0, down: 0, same: 0, fresh: 0, marks: [], vs: null, vsDays: {}, whyOf: {},
              reps: 0, pctSum: 0, pctN: 0 };
  groups.forEach(function (g) {
    var row = { vs: TRAIN.vsFor(date, g.ex, ctx), bySet: {}, up: 0, down: 0, same: 0, reps: 0, pctSum: 0, pctN: 0 };
    out.byEx[g.ex] = row;
    if (!row.vs) return;
    var then = workOn(row.vs.date, g.ex), kind = TRAIN.kindOf(g.ex), n = 0;
    g.sets.forEach(function (s) {
      if (s.warm) return;
      var b = then[n++];
      if (!TRAIN.counts(s)) return;
      var d = row.bySet[s.key] = TRAIN.setDelta(s, b, kind);
      d.volUp = TRAIN.volUp(s, b, kind, d);
      var mk = !b ? 'new' : d.dir > 0 ? 'up' : d.dir < 0 ? 'down' : 'same';
      if (mk === 'new') out.fresh++; else { row[mk]++; out[mk]++; }
      out.marks.push(mk);
      if (b && d.dr != null) { row.reps += d.dr; out.reps += d.dr; }
      if (b && d.e1 && d.pct != null) { row.pctSum += d.pct; row.pctN++; out.pctSum += d.pct; out.pctN++; }
    });
    if (row.up + row.down + row.same) {
      out.vsDays[row.vs.date] = (out.vsDays[row.vs.date] || 0) + 1;
      if (out.whyOf[row.vs.date] !== 'name') out.whyOf[row.vs.date] = row.vs.why;
    }
  });
  Object.keys(out.vsDays).forEach(function (d) {
    if (!out.vs || out.vsDays[d] > out.vsDays[out.vs]) out.vs = d;
  });
  return out;
};

/* ═══════════════════ RECORDS, AS THEY HAPPENED ═══════════════════
   The stored `pr` flag is FitNotes' rule: a record while it still stands. A
   session's records are different: what was a record on the day it was
   lifted, against everything before it, and against everything before it
   in this block. The first time an exercise is done, or done in a block, is
   not a record of anything. A record the same session then beat is dropped. */
TRAIN.recordHits = function (exId, date) {
  var f = TRAIN.fieldsOf(exId);
  if (f[0] !== 'w' || f[1] !== 'r') return [];
  var rd = function (kg) { return Math.round((kg || 0) * TRAIN.PR_SCALE) / TRAIN.PR_SCALE; };
  var ph = TRAIN.phaseOn(date);
  var hist = TRAIN.historyOf(exId).filter(function (x) {
    return !x.warm && x.kg > 0 && x.r > 0 && x.date <= date && TRAIN.counts(x);
  });
  var before = function (x, s) {
    return x.date < s.date || (x.date === s.date && x.key !== s.key &&
      ((x.ord || 0) - (s.ord || 0) || TRAIN.setStamp(x) - TRAIN.setStamp(s)) < 0);
  };
  var hits = [];
  hist.forEach(function (s) {
    if (s.date !== date) return;
    var prior = hist.filter(function (x) { return !!x.split === !!s.split && before(x, s); });
    var stands = function (list) {
      return list.length > 0 && !list.some(function (x) { return rd(x.kg) >= rd(s.kg) && x.r >= s.r; });
    };
    var all = stands(prior), blk = !!ph && stands(prior.filter(function (x) { return x.date >= ph.from; }));
    if (all || blk) hits.push({ s: s, all: all, block: blk });
  });
  return hits.filter(function (h) {
    return !hits.some(function (o) {
      return o !== h && !!o.s.split === !!h.s.split && rd(o.s.kg) >= rd(h.s.kg) && o.s.r >= h.s.r &&
        (rd(o.s.kg) > rd(h.s.kg) || o.s.r > h.s.r);
    });
  });
};
TRAIN.sessionRecords = function (date) {
  var out = [];
  TRAIN.dayGroups(date).forEach(function (g) {
    TRAIN.recordHits(g.ex, date).forEach(function (h) {
      out.push({ ex: g.ex, name: g.def.name, s: h.s, all: h.all, block: h.block });
    });
  });
  return out;
};

/* ═══════════════════ THE CARDS ═══════════════════ */
function fmtMins(n) { var h = Math.floor(n / 60); return (h ? h + 'h ' : '') + (n % 60) + 'm'; }
function compact(n) {
  n = Math.round(n);
  if (n >= 1e6) return (Math.round(n / 1e5) / 10) + 'M';
  if (n >= 1e5) return Math.round(n / 1e3) + 'k';
  return n.toLocaleString();
}
function spanWords(a, b) {
  var months = monthsBetween(a.slice(0, 7), b.slice(0, 7)) - (+b.slice(8) < +a.slice(8) ? 1 : 0);
  if (months < 1) { var d = Day.diff(b, a) + 1; return d + (d === 1 ? ' day' : ' days'); }
  var y = Math.floor(months / 12), mo = months % 12, out = [];
  if (y) out.push(y + (y === 1 ? ' year' : ' years'));
  if (mo) out.push(mo + (mo === 1 ? ' month' : ' months'));
  return out.join(', ');
}
/* Working sets that count, over a stretch of days, or every day. */
function spanStats(from, to) {
  var o = { sessions: 0, sets: 0, reps: 0, vol: 0 };
  Object.keys(TRAIN.idx.byDate).forEach(function (d) {
    if ((from && d < from) || (to && d > to)) return;
    var w = TRAIN.idx.byDate[d].filter(function (s) { return !s.warm && TRAIN.counts(s); });
    if (!w.length) return;
    o.sessions++;
    o.sets += w.length;
    w.forEach(function (s) { o.reps += s.r || 0; o.vol += (s.kg || 0) * (s.r || 0); });
  });
  return o;
}
function musclesHtml(rows, week) {
  if (!rows.length) return '';
  var top = rows[0].sets || 1;
  return '<div>' + (week
      ? '<div class="mhead"><h3>SETS PER MUSCLE</h3><span>SETS</span><span>HIT</span></div>'
      : '<h3>SETS PER MUSCLE</h3>') +
    '<div class="musc">' + rows.map(function (r) {
      var col = r.slot != null ? TRAIN.slotColor(r.slot) : 'var(--accent)';
      return '<div class="mrow2' + (week ? ' wk' : '') + '">' +
        '<span class="nm"><i class="dot" style="background:' + col + '"></i>' + UI.esc(r.name) + '</span>' +
        '<span class="bar2"><i style="width:' + Math.max(4, Math.round(r.sets / top * 100)) + '%;background:' + col + '"></i></span>' +
        '<b>' + r.sets + '</b>' + (week ? '<em>' + r.workouts + '×</em>' : '') + '</div>';
    }).join('') + '</div></div>';
}
function muscleRows(from, to) {
  return TRAIN.breakdown(from, to, 'category').rows
    .filter(function (r) { return r.sets > 0; })
    .sort(function (a, b) { return b.sets - a.sets || b.workouts - a.workouts; });
}
TRAIN.sessionStats = function (date) {
  var sets = TRAIN.setsOn(date).filter(function (s) { return !s.warm && TRAIN.counts(s); });
  var reps = 0, ex = {};
  sets.forEach(function (s) { reps += s.r || 0; ex[s.ex] = 1; });
  var sess = Rec.get('session', date, '') || {};
  var mins = sess.start && sess.end
    ? Math.max(0, Math.floor((Date.parse(sess.end) - Date.parse(sess.start)) / 60000)) : 0;
  return { sets: sets.length, reps: reps, vol: TRAIN.volume(sets), mins: mins,
           exercises: Object.keys(ex).length, name: sess.name || '' };
};

/* ── the end of a session ──
   Tom: "make it aesthetic, this is something we might want to share on
   social media." What it says is fact, never praise: what was lifted, how
   each set did against last time, which muscles it went to, and any record
   set. */
TRAIN.recapCard = function (date, cmp) {
  var st = TRAIN.sessionStats(date);
  if (!st.sets) return null;
  if (cmp === undefined) cmp = TRAIN.dayCompare(date);
  var U = TRAIN.unit(), ph = TRAIN.phaseOn(date), esc = UI.esc;
  /* Totals are only set against another day when that day is this session
     again: named the same, picked, copied from, or the one day every exercise
     was measured against. Exercises measured against three different days
     have no single session to total against. */
  var one = cmp && cmp.vs && (Object.keys(cmp.vsDays).length === 1 || cmp.whyOf[cmp.vs] !== 'last');
  var vs = one ? TRAIN.sessionStats(cmp.vs) : null;
  var when = Day.label(date, { day: 'numeric', month: 'short', year: 'numeric' });
  var volF = function (kg) { return Math.round(TRAIN.toUnit(kg, U)).toLocaleString(); };
  var num = function (n) { return Math.round(n).toLocaleString(); };
  var cell = function (label, big, small, now, then, fmt) {
    var em = '';
    if (vs && then != null) {
      var dd = now - then;
      em = '<em>' + (Math.abs(dd) < (label === 'Volume' ? 0.5 : 1) ? 'same as ' : (dd > 0 ? '+' : '−') + fmt(Math.abs(dd)) + ' vs ') +
        esc(Day.short(cmp.vs)) + '</em>';
    }
    return '<div><span>' + label + '</span><b>' + big + (small ? ' <small>' + small + '</small>' : '') + '</b>' + em + '</div>';
  };
  var h = '<div class="eyebrow"><span>' + esc(when) + '</span>' +
      (ph ? '<b>' + esc(TRAIN.phaseLine(ph, date)) + '</b>' : '') + '</div>' +
    '<div class="title">' + esc(st.name || 'Training session') + '</div>' +
    '<div class="rule"></div>' +
    '<div class="big4">' +
      cell('Volume', volF(st.vol), TRAIN.unitLabel(), st.vol, vs && vs.vol, volF) +
      cell('Sets', st.sets, '', st.sets, vs && vs.sets, num) +
      cell('Reps', st.reps.toLocaleString(), '', st.reps, vs && vs.reps, num) +
      (st.mins ? cell('Time', fmtMins(st.mins), '', st.mins, vs && vs.mins ? vs.mins : null, fmtMins)
               : cell('Exercises', st.exercises, '', 0, null, num)) +
    '</div>';

  var n = cmp ? cmp.up + cmp.down + cmp.same : 0;
  if (n) {
    var days = Object.keys(cmp.vsDays).length, vn = (Rec.get('session', cmp.vs, '') || {}).name;
    var sub = [cmp.same ? cmp.same + ' same' : '', cmp.down ? cmp.down + ' weaker' : '',
               cmp.fresh ? cmp.fresh + ' new' : ''].filter(Boolean);
    sub.push('vs ' + (vn ? vn + ', ' : '') + dayY(cmp.vs, date) +
      (days > 1 ? ' and ' + (days - 1) + ' other day' + (days > 2 ? 's' : '') : ''));
    h += '<div><h3>SET BY SET</h3>' +
      '<div class="strong"><b>' + cmp.up + ' of ' + n + '</b> sets stronger</div>' +
      (gainText(cmp.reps, cmp.pctSum, cmp.pctN)
        ? '<div class="gain' + (cmp.pctN && cmp.pctSum / cmp.pctN >= 0.05 ? ' up'
            : cmp.pctN && cmp.pctSum / cmp.pctN <= -0.05 ? ' down' : '') + '">' +
          esc(gainText(cmp.reps, cmp.pctSum, cmp.pctN)) + '</div>' : '') +
      '<div class="sub">' + esc(sub.join(' · ')) + '</div>' +
      '<div class="ticks">' + cmp.marks.map(function (k) { return '<i class="' + k + '"></i>'; }).join('') + '</div></div>';
  }

  h += musclesHtml(muscleRows(date, date), false);

  var recs = TRAIN.sessionRecords(date);
  if (recs.length) {
    h += '<div><h3>RECORDS</h3>' + recs.map(function (x) {
      return '<div class="rec">' + ico('record') +
        '<span class="nm"><span>' + esc(x.name) + '</span><i class="pill">' + (x.all ? 'All-time' : 'Block') + '</i></span>' +
        '<span class="v">' + TRAIN.showWeight(x.s.kg, x.s.u, x.s.ex) + ' <small>' + TRAIN.unitLabel(x.s.ex) + '</small> × ' +

/* A card as a picture for a story, through the shared panel (IO.share in

/* ── the week ──
   Tom: "I don't want to set targets, I'd rather be told how many times I hit
   a muscle, I'll know if I need to hit more." Sets per muscle, counting half

TRAIN.weekOf = function (date) {
  return Day.shift(date, -((Day.dow(date) - TRAIN.weekStartDow() + 7) % 7));
};
TRAIN.weekCard = function (start) {
  var end = Day.shift(start, 6), today = Day.today(), U = TRAIN.unit(), esc = UI.esc;
  var st = spanStats(start, end), upto = end < today ? end : today, ph = TRAIN.phaseOn(upto);

  var rows = muscleRows(start, end);

};
function drawWeek(m) {
  var cur = TRAIN.weekOf(Day.today());

  var t = UI.el('span', 't');
  t.textContent = start === cur ? 'THIS WEEK' : start === Day.shift(cur, -7) ? 'LAST WEEK'
    : 'WEEK OF ' + Day.label(start, { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();
  var fwd = UI.el('button', 'ico mb-press mb-tap');

}
/* Eight weeks side by side, ending at the week on screen or this week. */
function weekHeat(start, cur) {
  var endW = Day.shift(start, 21) < cur ? Day.shift(start, 21) : cur, weeks = [];
  for (var i = 7; i >= 0; i--) weeks.push(Day.shift(endW, -7 * i));
  var cats = TRAIN.cats();
  var per = weeks.map(function (w) {
    var o = {};
    TRAIN.breakdown(w, Day.shift(w, 6), 'category').rows.forEach(function (r) { o[r.key] = r.sets; });
    return o;
  });
  var ids = TRAIN.catsSorted().filter(function (k) { return per.some(function (o) { return o[k] > 0; }); });
  var card = UI.el('div', 'exblock pad');
  var lab = UI.el('div', 'fieldlabel');
  lab.textContent = 'SETS PER MUSCLE · 8 WEEKS';
  card.appendChild(lab);
  if (!ids.length) {
    var e = UI.el('div', 'empty'); e.textContent = 'No sessions in these weeks'; card.appendChild(e);
    return card;
  }
  var grid = UI.el('div', 'heat');
  grid.style.gridTemplateColumns = 'minmax(6.5em, 2.2fr) repeat(' + weeks.length + ', minmax(0, 1fr))';
  grid.appendChild(UI.el('span'));
  weeks.forEach(function (w) {
    var hh = UI.el('span', 'hh' + (w === start ? ' on' : ''));
    hh.textContent = String(+w.slice(8));
    hh.title = 'Week of ' + Day.label(w);
    grid.appendChild(hh);
  });
  ids.forEach(function (k) {
    var c = cats[k], col = TRAIN.slotColor(c.slot);
    var nm = UI.el('span', 'hn');
    nm.innerHTML = '<i class="dot" style="background:' + col + '"></i>' + UI.esc(c.name);
    grid.appendChild(nm);
    var mx = Math.max.apply(null, per.map(function (o) { return o[k] || 0; })) || 1;
    per.forEach(function (o, j) {
      var v = o[k] || 0;
      var cell = UI.el('span', 'hc' + (weeks[j] === start ? ' on' : ''));
      cell.textContent = v ? String(Math.round(v)) : '';
      if (v) cell.style.background = 'color-mix(in srgb, ' + col + ' ' + Math.round(18 + 42 * v / mx) + '%, var(--surface-2))';
      grid.appendChild(cell);
    });
  });
  card.appendChild(grid);
  return card;
}

/* ── which records the Records screen shows ── */
TRAIN.recRange = function () {

function recScopeBar(m) {

/* ═══════════════════ SETUP ═══════════════════
   Tom: "a strapped toggle or a set height setting. Manually set if it's a
   toggle or a setting... some machines have settings for ankle and back pads
   as well." So an exercise carries the setup it needs, named by him, each
   either a toggle or a setting, and each SET records its own, because straps
   go on after a couple of working sets.

   A new set takes the setup of the set before it today. The first set of a
   session takes the first set of the last session, which is how that
   session started. */
TRAIN.lastSetup = function (exId, date) {
  var today = TRAIN.setsOn(date).filter(function (s) { return s.ex === exId && s.su; });
  if (today.length) return copyObj(today[today.length - 1].su);
  var h = TRAIN.historyOf(exId), last = null;
  for (var i = h.length - 1; i >= 0; i--) if (h[i].date < date && h[i].su) { last = h[i].date; break; }
  if (!last) return {};
  return copyObj(h.filter(function (s) { return s.date === last && s.su; })[0].su);
};
function cleanSetup(exId) {
  var defs = ((TRAIN.exercises()[exId] || {}).setup) || [];
  var su = TRAIN.suFor === exId ? TRAIN.draftSU || {} : {}, out = {}, any = false;
  defs.forEach(function (d) {
    var v = su[d.id];
    if (v == null || v === '' || v === 0) return;
    out[d.id] = d.kind === 'toggle' ? 1 : String(v);
    any = true;
  });
  return any ? out : null;
}
function setupText(su, exId) {
  if (!su) return '';
  var defs = ((TRAIN.exercises()[exId] || {}).setup) || [];
  return defs.filter(function (d) { return su[d.id] != null && su[d.id] !== '' && su[d.id] !== 0; })
    .map(function (d) { return d.kind === 'toggle' ? d.name : d.name + ' ' + su[d.id]; }).join(' · ');
}
/* How the set felt, one tap, inside its comment box. Tom, 2026-09-22: "Set
   comments should have either an RIR or set quality options". Which one is a
   setting, RIR by default. Both are stored on the set as their own field
   (`rir`, reps in reserve with 5 meaning five or more, and `q`, 1 to 4), so
   switching the setting hides one and loses neither. Tapping the lit one
   again clears it. */
var QUALITY = ['Poor', 'OK', 'Good', 'Great'];
function rateFor(s, date) {
  var mode = Rec.setting(APP.id, 'rate') || 'rir';
  if (mode === 'off') return null;
  var wrap = UI.el('div', 'setup');
  wrap.style.marginTop = 'var(--s-3)';
  var lab = UI.el('div', 'fieldlabel');
  lab.textContent = mode === 'rir' ? 'REPS IN RESERVE' : 'SET QUALITY';
  lab.style.flexBasis = '100%';
  wrap.appendChild(lab);
  var opts = mode === 'rir'
    ? [0, 1, 2, 3, 4, 5].map(function (n) { return { v: n, t: n === 5 ? '5+' : String(n) }; })
    : QUALITY.map(function (w, i) { return { v: i + 1, t: w }; });
  var field = mode === 'rir' ? 'rir' : 'q';
  var btns = [];
  opts.forEach(function (o) {
    var c = UI.el('button', CHIP + ' mb-press mb-tap' + (s[field] === o.v ? ' on' : ''));
    c.type = 'button';
    c.textContent = o.t;
    c.setAttribute('aria-pressed', s[field] === o.v ? 'true' : 'false');
    c.onclick = function () {
      var v = s[field] === o.v ? undefined : o.v, ch = {};
      ch[field] = v;
      TRAIN.patchSet(s.key, date, ch);
      s[field] = v;
      btns.forEach(function (b, j) {
        var on = s[field] === opts[j].v;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      Mobile.feedback('select');
    };
    btns.push(c);
    wrap.appendChild(c);
  });
  return wrap;
}

/* The setup controls, inside one set's comment box. A change is written to
   that set straight away and becomes what the next set carries. */
function setupFor(s, date) {
  var ex = TRAIN.exercises()[s.ex] || {};
  var defs = ex.setup || [];
  var su = {};
  Object.keys(s.su || {}).forEach(function (k) { su[k] = s.su[k]; });
  var wrap = UI.el('div', 'setup');
  wrap.style.marginTop = 'var(--s-3)';
  var keep = function () {
    TRAIN.patchSet(s.key, date, { su: Object.keys(su).length ? su : undefined });
    s.su = su;
    TRAIN.suFor = s.ex;
    TRAIN.draftSU = JSON.parse(JSON.stringify(su));
  };
  defs.forEach(function (d) {
    if (d.kind === 'toggle') {
      var c = UI.el('button', CHIP + ' mb-press mb-tap' + (su[d.id] ? ' on' : ''));
      c.type = 'button';
      c.textContent = d.name;
      c.setAttribute('aria-pressed', su[d.id] ? 'true' : 'false');
      c.onclick = function () {
        if (su[d.id]) delete su[d.id]; else su[d.id] = 1;
        c.classList.toggle('on', !!su[d.id]);
        c.setAttribute('aria-pressed', su[d.id] ? 'true' : 'false');
        Mobile.feedback('select');
        keep();
      };
      wrap.appendChild(c);
    } else {
      var w = UI.el('label', 'sufield');
      w.appendChild(document.createTextNode(d.name));
      var i = UI.field('text', { value: su[d.id] == null ? '' : String(su[d.id]) });
      i.setAttribute('aria-label', d.name);
      i.onchange = function () { var v = i.value.trim(); if (v) su[d.id] = v; else delete su[d.id]; keep(); };
      w.appendChild(i);
      wrap.appendChild(w);
    }
  });
  var ed = UI.el('button', CHIP + ' mb-press mb-tap');
  ed.type = 'button';
  ed.textContent = defs.length ? 'Edit Setup' : 'Add Setup';
  ed.onclick = function () { TRAIN.setupDialog(s.ex); };
  wrap.appendChild(ed);
  return wrap;
}

function setupCard(exId, ex, date) {

  if (TRAIN.suFor !== exId) { TRAIN.suFor = exId; TRAIN.draftSU = TRAIN.lastSetup(exId, date); }
  var su = TRAIN.draftSU || (TRAIN.draftSU = {});
  var card = UI.el('div', 'exblock pad');
  var box = UI.el('div', 'setup');
  if (!defs.length) {

  }
  defs.forEach(function (d) {
    if (d.kind === 'toggle') {
      var c = UI.el('button', CHIP + ' mb-press mb-tap' + (su[d.id] ? ' on' : ''));
      c.type = 'button';
      c.textContent = d.name;
      c.setAttribute('aria-pressed', su[d.id] ? 'true' : 'false');

        if (su[d.id]) delete su[d.id]; else su[d.id] = 1;

      };
      box.appendChild(c);
    } else {
      var w = UI.el('label', 'sufield');
      w.appendChild(document.createTextNode(d.name));
      var i = UI.field('text', { value: su[d.id] == null ? '' : String(su[d.id]) });
      i.setAttribute('aria-label', d.name);
      i.oninput = function () { var v = i.value.trim(); if (v) su[d.id] = v; else delete su[d.id]; };
      w.appendChild(i);
      box.appendChild(w);
    }
  });
  if (defs.length) {
    var ed = UI.el('button', 'ico mb-press mb-tap');
    ed.type = 'button';
    ed.innerHTML = ico('edit');
    ed.setAttribute('aria-label', 'Edit setup');
    ed.onclick = function () { TRAIN.setupDialog(exId); };
    box.appendChild(ed);
  }
  card.appendChild(box);
  return card;
}
TRAIN.setupDialog = function (exId) {

        defs.forEach(function (d, i) {

        });

      paint();
      var g = UI.el('div', 'mb-group'); g.textContent = 'ADD'; b.appendChild(g);
      name = UI.field('text', { placeholder: 'Straps, Seat height, Back pad' });

/* FitNotes' Skip Empty Dates: the arrows go to the previous or next day that
   has a workout rather than to the day before. */
TRAIN.step = function (dir) {
  var d = Day.shift(TRAIN.date, dir);
  if (Rec.setting(APP.id, 'skipEmpty') === 1) {
    var dates = Object.keys(TRAIN.idx.byDate).sort(), today = Day.today(), hit = null, i;
    if (dir < 0) {
      for (i = dates.length - 1; i >= 0; i--) if (dates[i] < TRAIN.date) { hit = dates[i]; break; }
    } else {
      for (i = 0; i < dates.length; i++) if (dates[i] > TRAIN.date && dates[i] <= today) { hit = dates[i]; break; }
      if (!hit) hit = today;
    }
    if (!hit) { UI.toast('No more sessions found'); return; }
    d = hit;
  }
  TRAIN.go(d);
};
document.getElementById('prev').onclick = function () { TRAIN.step(-1); Mobile.feedback('select'); };
document.getElementById('next').onclick = function () { TRAIN.step(1); Mobile.feedback('select'); };

/* Swiping the date strip moves a day, which is how the day gets changed in
   the gym without looking at the screen. */
(function () {
  var bar = document.getElementById('datebar'), x0 = null, y0 = null;
  bar.addEventListener('touchstart', function (e) {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  bar.addEventListener('touchend', function (e) {
    if (x0 == null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx)) return;
    TRAIN.step(dx < 0 ? 1 : -1);
    Mobile.feedback('select');
  }, { passive: true });
})();

   FitNotes' own list, in its own order, minus Body Tracker, which is STATUS's
   job and is not built here. Import is not in this menu and not in the top
   bar: it is a once-ever action and it lives in Settings, plus on the empty
   screen of a store with nothing in it, which is the only moment it matters. */
TRAIN.copyPreviousSets = function (exId) {
  var prev = TRAIN.lastSetsOf(exId, TRAIN.date);
  if (!prev.length) return UI.toast('No sets recorded', { bad: true });
  var n = writeFilled(exId, TRAIN.date, prev.map(function (x) { return { kg: x.kg, r: x.r, dist: x.dist, dur: x.dur }; }));
  TRAIN.reindex();
  TRAIN.assertTick(TRAIN.date);
  draw();
  if (Rec.setting(APP.id, 'autoNext') !== 0) TRAIN.selectNextOpen();
  UI.toast(n + ' sets copied');
};

/* ── three warmups in one press ──
   Tom, 2026-09-25, yes, and "warm ups are about 6-12". 40, 60 and 80 percent
   of the working weight for 12, 8 and 6 reps: lighter takes more. The working
   weight is what is typed in the steppers, else today's heaviest working set,
   else the heaviest from last time. Each is rounded down to the exercise's
   step, never below the empty bar on a barbell lift, and one that lands on
   the same weight as the step before is dropped. They go in as warmups the
   app wrote (`warm: 1, plan: 1`), in front of the working sets, so they count
   for nothing until ticked and never count toward volume or records. */
TRAIN.WARMUPS = [[0.4, 12], [0.6, 8], [0.8, 6]];
TRAIN.addWarmups = function (exId, date) {
  var ex = TRAIN.exercises()[exId] || {};
  var mine = TRAIN.setsOn(date).filter(function (s) { return s.ex === exId; });
  if (mine.some(function (s) { return s.warm && s.plan; })) return UI.toast('Warmups are already in');
  var heaviest = function (list) {
    return list.reduce(function (m, s) { return !s.warm && s.kg > m ? s.kg : m; }, 0);
  };
  var typed = parseFloat(TRAIN.draftW);
  var work = typed > 0 ? TRAIN.toKg(typed, TRAIN.unit(exId)) : heaviest(mine) || heaviest(TRAIN.lastSetsOf(exId, date));
  if (!(work > 0)) return UI.toast('Type the working weight first', { bad: true });
  var unit = TRAIN.unit(exId), inc = TRAIN.increment(ex), workU = TRAIN.toUnit(work, unit);
  var bar = TRAIN.isBarbell(ex) ? TRAIN.toUnit(TRAIN.barKg(unit).kg, unit) : 0;
  var list = [], last = -1;
  TRAIN.WARMUPS.forEach(function (w) {
    var v = Math.floor(workU * w[0] / inc + 1e-6) * inc;
    if (v < bar) v = bar;
    v = Math.round(v * 100) / 100;
    if (!(v > 0) || v >= workU || v === last) return;
    last = v;
    list.push({ v: v, r: w[1] });
  });
  if (!list.length) return UI.toast('Too light for warmups', { bad: true });
  var first = mine.length ? Math.min.apply(null, mine.map(function (s) { return s.ord || 0; }))
    : TRAIN.setsOn(date).length + 1;
  list.forEach(function (w, i) {
    Rec.set('set', date, TRAIN.newId(), {
      ex: exId, kg: TRAIN.toKg(w.v, unit), r: w.r, u: unit, done: 0, plan: 1, warm: 1, pr: 0, prf: 0,
      dist: 0, dur: 0, note: '', ord: mine.length ? first - (list.length - i) / (list.length + 1) : first + i,
    });
  });
  TRAIN.reindex();
  TRAIN.assertTick(date);
  draw();
  UI.toast(list.length + (list.length === 1 ? ' warmup added' : ' warmups added'));
};

/* ═════════════════ THE SPREADSHEET EXPORT ═════════════════
   Readable, not restorable, exactly as the master brief requires. One row per
   set is the shape a pivot table wants. */
function exportSheets() {
  var exs = TRAIN.exercises(), cats = TRAIN.cats(), unit = TRAIN.unit();
  var log = [['Date', 'Day', 'Category', 'Exercise', 'Set', 'Weight (' + unit + ')',
              'Weight (kg)', 'Reps', 'Volume (' + unit + ')', 'Distance', 'Seconds',
              'Complete', 'PR', 'Warmup', 'Split', 'Setup', 'Comment']];
  var dates = Object.keys(TRAIN.idx.byDate).sort();
  dates.forEach(function (d) {
    var groups = TRAIN.dayGroups(d);
    groups.forEach(function (g) {
      var cat = g.def.cat ? cats[g.def.cat] : null;
      g.sets.forEach(function (s, i) {
        log.push([d, new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
          cat ? cat.name : '', g.def.name, i + 1,
          Math.round(TRAIN.toUnit(s.kg || 0, unit) * 100) / 100,
          Math.round((s.kg || 0) * 1000) / 1000,
          s.r || 0,
          Math.round(TRAIN.toUnit((s.kg || 0) * (s.r || 0), unit) * 10) / 10,
          s.dist || '', s.dur || '', s.done ? 'yes' : '', s.pr ? 'PR' : '',
          s.warm ? 'yes' : '', s.split ? s.split.text : '', setupText(s.su, s.ex), s.note || '']);
      });
    });
  });

  var days = [['Date', 'Day', 'Session', 'Training block', 'Exercises', 'Sets', 'Reps', 'Volume (' + unit + ')',
               'Start', 'End', 'Minutes', 'Comment']];
  dates.forEach(function (d) {
    var sets = TRAIN.setsOn(d), sess = Rec.get('session', d, '') || {};
    var reps = 0, vol = 0, ex = {};
    sets.forEach(function (s) { reps += s.r || 0; vol += (s.kg || 0) * (s.r || 0); ex[s.ex] = 1; });
    var mins = sess.start && sess.end
      ? Math.floor((Date.parse(sess.end) - Date.parse(sess.start)) / 60000) : '';
    var inBlock = TRAIN.phaseOn(d);
    days.push([d, new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
      sess.name || '', inBlock ? inBlock.p.name : '',
      Object.keys(ex).length, sets.length, reps,
      Math.round(TRAIN.toUnit(vol, unit)), sess.start ? clockOf(sess.start) : '',
      sess.end ? clockOf(sess.end) : '', mins, sess.note || '']);
  });

  var records = [['Exercise', 'Category', 'Sessions', 'Sets', 'Max weight (' + unit + ')',
                  'On', 'Max reps', 'Est 1RM (' + unit + ')']];
  Object.keys(exs).forEach(function (id) {
    var r = TRAIN.recordsFor(id);
    if (!r.sets) return;
    var cat = exs[id].cat ? cats[exs[id].cat] : null;
    records.push([exs[id].name, cat ? cat.name : '', r.workouts, r.sets,
      r.maxWeight ? Math.round(TRAIN.toUnit(r.maxWeight.kg, unit) * 10) / 10 : '',
      r.maxWeight ? r.maxWeight.date : '',
      r.maxReps ? r.maxReps.r : '',
      r.max1rm ? Math.round(TRAIN.toUnit(TRAIN.e1rm(r.max1rm.kg, r.max1rm.r), unit) * 10) / 10 : '']);
  });

  return [
    { name: 'Log', rows: log, widths: [11, 5, 12, 26, 5, 11, 11, 6, 11, 8, 8, 9, 5, 8, 10, 20, 30] },
    { name: 'Sessions', rows: days, widths: [11, 5, 16, 18, 10, 6, 6, 12, 7, 7, 8, 30] },
    { name: 'Records', rows: records, widths: [26, 12, 9, 6, 14, 11, 9, 14] },
  ];
}

/* ═════════════════ FIRST RUN ═════════════════
   Units, then the importer, then out of the way. Everything else has a
   working default and can wait. */
TRAIN.firstRun = function () {
  UI.dialog({
    title: 'WELCOME TO TRAIN', width: 440,
    body: function (b, h) {
      var p = UI.el('div', 'empty');
      p.innerHTML = 'One question, then you are logging.';
      b.appendChild(p);

      var g = UI.el('div', 'mb-group'); g.textContent = 'WEIGHT UNIT';
      b.appendChild(g);
      b.appendChild(UI.row('Show weights in',
        'Your data is stored in kilograms either way. You can change this whenever.',
        UI.segmented([{ id: 'lb', name: 'POUNDS' }, { id: 'kg', name: 'KILOGRAMS' }],
          TRAIN.unit(), function (v) { Rec.setting(APP.id, 'unit', v); draw(); })));

      /* The importer is in Settings, under COMING FROM FITNOTES, and that is
         the only place it appears now. The paragraph that used to sit here
         described what its button did, so it went with the button. */
    },
    actions: [{ label: 'START LOGGING', kind: 'go', fn: function () {
      Rec.setting(APP.id, 'seen', 1);
    } }],
  });
};

/* ═══════════════════ BOOT ═══════════════════ */
function boot() {
  TRAIN.reindex();
  /* ── DOCTRINE law 1: ship it full ──
     Seed before the first draw, so the very first thing on screen is a working
     app rather than an invitation to go and build one.

     Only on a genuinely untouched store: no categories, no exercises, no sets.
     Anyone who has ever logged anything, or imported a FitNotes backup, has a
     list already and must not find a hundred strangers mixed into it. */
  if (!Rec.count('excat') && !Rec.count('exercise') && !Rec.count('set')) TRAIN.seedCats();
  /* A client COACH made by hand, or whose file came before COACH kept
     categories, has exercises and no muscle groups, and TRAIN cannot add an
     exercise without one. The starter list fills in round what they have. */
  else if (CLIENT && !Rec.count('excat')) TRAIN.seedCats();
  if (TRAIN.foldSeeds()) TRAIN.recomputePRs();
  /* Only once every device's rows and tombstones are in, or a group deleted
     on another device comes back. */
  Rec.ready(function () { if (TRAIN.fillCats() && TRAIN.redraw) TRAIN.redraw(); });
  /* and again whenever exercises or sets arrive from another copy */
  var foldT = null;
  Rec.on(function (rows) {
    if (!rows || !rows.some(function (r) { return r.type === 'exercise' || r.type === 'set'; })) return;
    clearTimeout(foldT);
    foldT = setTimeout(function () { if (TRAIN.foldSeeds()) { TRAIN.recomputePRs(); if (TRAIN.redraw) TRAIN.redraw(); } }, 800);
  });
  TRAIN.restRestore();
  TRAIN.wake();
  /* Records are worked out again once under the rule that keeps split sets
     apart, and never again unless something changes. */
  if (Rec.setting(APP.id, 'prRule') !== 2 && Rec.count('set')) {
    TRAIN.recomputePRs();
    Rec.setting(APP.id, 'prRule', 2);
  }
  draw();
  /* Tom, 2026-09-25: TRAIN opens on the first exercise of today's session
     that still has a set waiting, so at the gym the first tap is the set. A
     day with nothing waiting opens on the log as before. Once, when the store
     is in, and only if nothing else has been opened in the meantime. */
  Rec.ready(function () {
    if (TRAIN.screen !== 'workout' || TRAIN.date !== Day.today() || /[?&]import=1/.test(location.search)) return;
    var g = TRAIN.dayGroups(TRAIN.date).filter(function (x) { return x.sets.some(TRAIN.pending); })[0];
    if (!g) return;
    TRAIN.openExercise(g.ex);
    if (Rec.setting(APP.id, 'autoNext') !== 0) TRAIN.selectNextOpen();
  });
  if (!CLIENT && !Rec.setting(APP.id, 'seen') && !Rec.count('set')) {
    Rec.setting(APP.id, 'seen', 1);
    setTimeout(TRAIN.firstRun, 400);
  }
  /* COACH's IMPORT THEIR LOG opens this same file over the client's profile
     with &import=1 on the end, so the panel is up rather than three folds
     into Settings. The importer is not copied and not moved: the adapter at
     the top of this file is already what sends every row it writes onto the
     client, which is why COACH needs no importer of its own. It waits for
     the store, because an import that cannot see what is already here would
     write a second copy of it. */
  if (/[?&]import=1/.test(location.search) && !TRAIN.importAsked) {
    TRAIN.importAsked = 1;
    setTimeout(function () { TRAIN.importPanel(); }, 150);
  }
}

/* ── the first paint does not wait for the store ──
   Root brief, foundation item 2: TRAIN drew nothing until Rec.ready, which
   waits for IndexedDB and can take 2.5 seconds on a slow phone. Sets and
   exercises are small rows, already here from localStorage, so if the store
   has not answered in a moment and there is a log to show, show it. Seeding
   and the record pass still wait for ready, because they must see every row. */
var trainBooted = false;
setTimeout(function () {
  if (trainBooted || !(Rec.count('set') || Rec.count('exercise'))) return;
  TRAIN.reindex(); draw();
}, 300);
Rec.ready(function () { trainBooted = true; boot(); });
/* Every write announces, and one SAVE is up to four writes: the set, its
   record flag, the workout timer and the rest timer. Reindexing every set four
   times per tap is the slowest thing on a Galaxy A10, so the redraw waits for
   the writes in this tick to finish and happens once. */
var redrawSoon = null;
Rec.on(function () {
  if (TRAIN.importing || redrawSoon) return;      /* the importer redraws once, at the end */
  redrawSoon = setTimeout(function () { redrawSoon = null; TRAIN.reindex(); draw(); }, 0);
});
Day.on(draw);

/* The rest timer is wall-clock, so coming back to a suspended tab has to
   recompute rather than resume. */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { TRAIN.restRestore(); drawRestBar(); }
  TRAIN.wake();
});
document.getElementById('restchip').onclick = function () {
  menuAt({ clientX: innerWidth - 12, clientY: 96 }, [
    { label: 'Open Timer', fn: function () { TRAIN.restSheet(); } },
    { label: 'Add 30 seconds', fn: function () {
      TRAIN.rest.until += 30000; TRAIN.rest.fired = false; drawRestBar();
    } },
    { label: 'Stop timer', fn: function () { TRAIN.restStop(); } },
  ], 'REST TIMER');
};

TRAIN.reindex();
draw();
</script>
