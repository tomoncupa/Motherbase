  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   TRAIN — the training log.

   A reproduction of FitNotes v25.1 on the Motherbase foundation. The brief
   that governs this file is train/CLAUDE.md, next to it. Read that first:
   it says what is deliberate and what would be a bug.

   Nothing in here is copied from FitNotes. What was taken from the app is its
   schema, its labels and its behaviour — facts about how it works — and every
   line below was written against those.
   ═══════════════════════════════════════════════════════════════════════════ */

var APP = {
  id: 'train',
  name: 'Train',
  icon: '⛭',
  blurb: 'the training log',
  /* every type TRAIN owns. `tick` is not here: it is shared, and declaring it
     would claim a type the master brief says belongs to everyone. */
  types: ['excat', 'exercise', 'set', 'session', 'sgroup',
          'program', 'progday', 'progex', 'goal', 'phase'],
};

Skins.load('../shared/skins.json').then(function () { Skins.restore(APP.id); });
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
/* On a client's profile (see A CLIENT'S TRAIN, at the top) TRAIN never
   registers with the sheet: its rows are COACH's, and COACH sends them. */
var CLIENT = Rec.client || null;
if (!CLIENT) IO.register({ app: APP.id, name: APP.name, types: APP.types,
  sheets: function () { return exportSheets(); } });
/* and the bar says whose training this is, where TRAIN's name would be */
var CLIENT_NAME = CLIENT ? String((Rec.get('cperson', null, CLIENT) || {}).name || 'Client').toUpperCase() : '';
if (CLIENT) document.title = CLIENT_NAME + ' · TRAIN';

/* Everything hangs off one global on purpose. `var` at the top level of a
   classic script is a property of window; `let` and `const` are not, and the
   test harness has to be able to reach in. */
var TRAIN = window.TRAIN = {};

/* ═══════════════════ UNITS ═══════════════════
   Every set stores kg, the true weight, and u, the unit it was typed in.
   Display converts. This is what let four years of mixed kg and lb entries
   survive in one log, and it is why nothing here ever writes a converted
   number back over a stored one. */
var LB_PER_KG = 2.20462262185;
var UNIT = { 0: 'kg', 1: 'lb', 2: 'lb' };   /* FitNotes: 0 metric, 1 and 2 imperial */

TRAIN.toUnit = function (kg, unit) {
  return unit === 'lb' ? kg * LB_PER_KG : kg;
};
TRAIN.toKg = function (v, unit) {
  return unit === 'lb' ? v / LB_PER_KG : v;
};
/* Everything on screen is shown in the unit currently chosen, not the unit
   each set was typed in. That is what FitNotes does: the stored kilograms are
   the truth, the display setting decides how they read, and its "Change
   Weight Unit → Convert Existing Values / Just Change Unit" dialog only makes
   sense on those terms. Every set of one exercise reads in one unit, and a
   total across exercises reads in the app's.

   `u` on a set is still recorded. It is what he typed, and it is how a set
   entered as 500 lb can be shown as exactly 500 again rather than 226.8. */
/* An exercise may carry its own unit, `wu`, 'kg' or 'lb' (Tom, 2026-09-25:
   "Option to denote lbs and kilos PER exercise"), so dumbbells can read in
   pounds beside a machine in kilograms. Hand this the exercise, its id or a
   set, and it answers for that exercise; hand it nothing and it answers for
   the whole app, which is what totals across exercises use. Not `unit`: the
   importer has written 'kg' there on every FitNotes exercise, from a 0 that
   means "the default". */
TRAIN.unit = function (ex) {
  if (ex && typeof ex === 'object' && ex.ex && !ex.name) ex = ex.ex;   /* a set */
  if (typeof ex === 'string') ex = TRAIN.exercises()[ex];
  if (ex && (ex.wu === 'kg' || ex.wu === 'lb')) return ex.wu;
  return Rec.setting(APP.id, 'unit') || 'lb';
};

/* One decimal always, the way FitNotes prints it: 4.0 kgs, 12.5 kgs. A set
   typed in this unit is shown back exactly, without a float's fingerprints. */
TRAIN.showWeight = function (kg, typedIn, ex) {
  var unit = TRAIN.unit(ex);
  var v = TRAIN.toUnit(kg, unit);
  if (typedIn === unit) v = Math.round(v * 1000) / 1000;   /* it was typed here; trust it */
  return (Math.round(v * 10) / 10).toFixed(1);
};
/* FitNotes writes the unit plural in the log: "kgs", "lbs". */
TRAIN.unitLabel = function (ex) { return TRAIN.unit(ex) + 's'; };

/* ═══════════════════ CATEGORY COLOUR SLOTS ═══════════════════
   A category stores a slot, never a hex. Six theme colours, each in a light
   and a dark tint, so nine muscle groups all get something readable and every
   one of them changes when the skin changes. */
TRAIN.SLOTS = 12;
TRAIN.slotColor = function (slot) {
  var s = ((slot | 0) % TRAIN.SLOTS + TRAIN.SLOTS) % TRAIN.SLOTS;
  /* The token itself, not the colour it held when this ran, so changing the
     theme recolours every category without anything being redrawn. */
  var base = 'var(--data-' + (s % 6 + 1) + ')';
  /* The second tint is the same hue held further from the page background, so
     it stays distinct in a light skin and in a dark one. */
  return s < 6 ? base : 'color-mix(in srgb, ' + base + ' 62%, var(--text-1))';
};

/* ═══════════════════ IDS ═══════════════════
   The clock alone is not unique: two rows made in the same millisecond derive
   the same row id and the second silently replaces the first. Counter for
   this session, random tail for two devices in the same millisecond. */
var seq = 0;
/* An import on a client's profile lands in the client's rows */
TRAIN.mergeImport = function (rows) { return CLIENT ? Rec.mergeClient(rows) : Rec.merge(rows); };
TRAIN.newId = function () {
  /* `k-` on a client's profile is COACH's mark for a set Tom logged, which
     is the one kind WEALTH may bill as a session */
  return (CLIENT ? 'k-' : '') + Rec.USER + '-' + Date.now().toString(36) + '-' +
    (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
};

/* ═══════════════════ THE INDEX ═══════════════════
   Rec.all walks every row in the store for each call. With twelve thousand
   sets that is fine once and wasteful thirty times, so TRAIN keeps its own
   two maps and rebuilds them when the store changes. Everything on screen
   reads these, never Rec.all. */
TRAIN.idx = { byDate: {}, byEx: {}, built: 0 };

TRAIN.reindex = function () {
  var byDate = {}, byEx = {};
  var all = Rec.all('set');
  for (var i = 0; i < all.length; i++) {
    var r = all[i], p = r.payload;
    /* Named rather than copied wholesale, so a field added to a set has to be
       added here too or it silently never reaches anything that reads the
       index. `warm` was exactly that on the day it was added. */
    var rec = { key: r.key, date: r.date, ex: p.ex, kg: p.kg, r: p.r, u: p.u,
                done: p.done, pr: p.pr, prf: p.prf, dist: p.dist, dur: p.dur,
                note: p.note, ord: p.ord, su: p.su, plan: p.plan,
                /* Read off the comment, and a mark made by hand wins either
                   way. See "what a comment says". */
                warm: p.warm === 1 || p.warm === true ||
                  (p.warm !== 0 && p.warm !== false && TRAIN.noteWarm(p.note)) ? 1 : 0,
                split: p.note ? TRAIN.noteSplit(p.note, p.r) : null };
    (byDate[r.date] || (byDate[r.date] = [])).push(rec);
    (byEx[p.ex] || (byEx[p.ex] = [])).push(rec);
  }
  var k;
  for (k in byDate) byDate[k].sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
  for (k in byEx) byEx[k].sort(function (a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ord || 0) - (b.ord || 0);
  });
  TRAIN.idx = { byDate: byDate, byEx: byEx, built: Date.now() };
  return TRAIN.idx;
};

TRAIN.setsOn = function (date) { return TRAIN.idx.byDate[date] || []; };
TRAIN.historyOf = function (exId) { return TRAIN.idx.byEx[exId] || []; };
/* Read many times per draw, and each Rec.map walks every row in the store.
   Held until the store announces a change, which it does on every write. */
TRAIN._catC = null; TRAIN._exC = null;
TRAIN.cats = function () { return TRAIN._catC || (TRAIN._catC = Rec.map('excat')); };
Rec.on(function () { TRAIN._catC = null; TRAIN._exC = null; });

/* ── the muscle groups you start with ──
   Categories only ever arrived with a FitNotes import. Without one there were
   none, CREATE NEW EXERCISE refused with "add a category first", and there was
   nowhere in the app to add one — so a fresh TRAIN could not log anything at
   all unless you happened to own a FitNotes backup.

   These are the groups FitNotes itself ships with. Each takes a theme colour
   slot rather than a colour, so they change with the skin like everything
   else. Made once, and only when there are none: an import brings its own and
   must not find these sitting in the way. */
/* Tom, 2026-09-24: "Add Forearms, Calves, Hamstrings, Glutes, Lower Back."
   Seven groups meant a leg day was one bar on the week's sets-per-muscle and
   said nothing about whether he had trained hamstrings at all. Twelve is also
   exactly how many colours there are, six hues in two tints, and the order
   here decides them: a group's slot is its place in this list, so Legs and
   Hamstrings come out as two tints of one hue, and so do Core and Lower Back.
   Do not reorder this list without looking at what the colours become. */
TRAIN.DEFAULT_CATS = ['Chest', 'Back', 'Shoulders', 'Legs', 'Arms', 'Core', 'Cardio',
  'Forearms', 'Calves', 'Hamstrings', 'Glutes', 'Lower Back'];

/* A group's row key. Every name up to 2026-09-24 was one word, so this is the
   same string `nm.toLowerCase()` gave; "Lower Back" is the first that needed
   a hyphen rather than a space in a key. */
TRAIN.catId = function (nm) {
  return String(nm).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
};

/* ── the movements it opens with ──
   DOCTRINE law 1: ship it full. An empty log is not a clean slate, it is a
   chore standing between you and the first set, done standing at a rack.

   A standard set of gym movements written here — not a copy of anyone's data
   file. These are the common names of exercises, organised the way a gym is,
   and they are deliberately generic: DOCTRINE law 2 says a default is what a
   stranger would also want. Tom's own 270 come across from his FitNotes
   backup and simply merge alongside these.

   Every one is editable and deletable from the moment it appears. Nothing here
   is protected, because a list you cannot prune is worse than a short one.

   No EQUIPMENT BRANDS. An air bike is not an Assault Bike, and nothing here is
   named after Life Fitness, Hammer Strength, Cybex or anyone else who makes
   the frame — a gym that does not own that brand still has the movement, and
   a list full of one manufacturer's names is a list that fits one gym.

   Names that came from a person or a place stay. Pendlay Row, Arnold Press,
   Pallof Press, Bulgarian Split Squat, Russian Twist: these are the actual
   names of the movements, everyone in a gym uses them, and renaming them to
   something more literal would only make them harder to find.

   `kind` 0 is weight-and-reps, 1 is cardio (distance and time), 2 is
   bodyweight-and-reps. `inc` is the weight step the plus button uses. */
TRAIN.DEFAULT_EX = {
  Chest: [
    ['Barbell Bench Press', 0], ['Incline Barbell Bench Press', 0],
    ['Decline Barbell Bench Press', 0], ['Dumbbell Bench Press', 0],
    ['Incline Dumbbell Bench Press', 0], ['Dumbbell Fly', 0],
    ['Incline Dumbbell Fly', 0], ['Cable Fly', 0], ['Cable Crossover', 0],
    ['Chest Press Machine', 0], ['Pec Deck', 0], ['Push Up', 2],
    ['Incline Push Up', 2], ['Decline Push Up', 2], ['Dip (Chest)', 2],
  ],
  Back: [
    ['Deadlift', 0], ['Rack Pull', 0], ['Barbell Row', 0], ['Pendlay Row', 0],
    ['T-Bar Row', 0], ['Dumbbell Row', 0], ['Chest Supported Row', 0],
    ['Seated Cable Row', 0], ['Lat Pulldown', 0], ['Close Grip Lat Pulldown', 0],
    ['Straight Arm Pulldown', 0], ['Pull Up', 2], ['Chin Up', 2],
    ['Inverted Row', 2], ['Shrug', 0], ['Dumbbell Shrug', 0],
  ],
  Shoulders: [
    ['Overhead Press', 0], ['Seated Barbell Press', 0], ['Dumbbell Shoulder Press', 0],
    ['Arnold Press', 0], ['Push Press', 0], ['Lateral Raise', 0],
    ['Cable Lateral Raise', 0], ['Front Raise', 0], ['Rear Delt Fly', 0],
    ['Face Pull', 0], ['Upright Row', 0], ['Shoulder Press Machine', 0],
  ],
  Legs: [
    ['Barbell Squat', 0], ['Front Squat', 0], ['Box Squat', 0], ['Goblet Squat', 0],
    ['Hack Squat', 0], ['Leg Press', 0], ['Bulgarian Split Squat', 0],
    ['Walking Lunge', 0], ['Reverse Lunge', 0], ['Step Up', 0],
    ['Sumo Deadlift', 0], ['Leg Extension', 0], ['Hip Adduction', 0],
  ],
  Arms: [
    ['Barbell Curl', 0], ['EZ Bar Curl', 0], ['Dumbbell Curl', 0],
    ['Hammer Curl', 0], ['Incline Dumbbell Curl', 0], ['Preacher Curl', 0],
    ['Concentration Curl', 0], ['Cable Curl', 0], ['Close Grip Bench Press', 0],
    ['Skullcrusher', 0], ['Overhead Tricep Extension', 0], ['Tricep Pushdown', 0],
    ['Rope Pushdown', 0], ['Dumbbell Kickback', 0], ['Dip (Triceps)', 2],
  ],
  Core: [
    ['Plank', 2], ['Side Plank', 2], ['Crunch', 2], ['Sit Up', 2],
    ['Hanging Leg Raise', 2], ['Lying Leg Raise', 2], ['Cable Crunch', 0],
    ['Russian Twist', 0], ['Ab Wheel Rollout', 2], ['Mountain Climber', 2],
    ['Dead Bug', 2], ['Bird Dog', 2], ['Pallof Press', 0], ['Hollow Hold', 2],
  ],
  Cardio: [
    ['Running', 1], ['Treadmill', 1], ['Walking', 1], ['Incline Walk', 1],
    ['Cycling', 1], ['Stationary Bike', 1], ['Rowing Machine', 1],
    ['Elliptical', 1], ['Stair Climber', 1], ['Swimming', 1],
    ['Jump Rope', 1], ['Air Bike', 1],
  ],
  /* The five Tom asked for on 2026-09-24. Each one takes the movements that
     were already in the list under a coarser group, so nothing is duplicated:
     a starter exercise's id comes from its NAME, so moving one between groups
     here is the same exercise in a new place, not a second copy of it. */
  Forearms: [
    ['Wrist Curl', 0], ['Reverse Wrist Curl', 0], ['Reverse Curl', 0],
    ['Farmer’s Walk', 0], ['Dead Hang', 2], ['Plate Pinch', 0],
  ],
  Calves: [
    ['Calf Raise', 0], ['Seated Calf Raise', 0], ['Leg Press Calf Raise', 0],
    ['Donkey Calf Raise', 0],
  ],
  Hamstrings: [
    ['Romanian Deadlift', 0], ['Stiff Leg Deadlift', 0], ['Leg Curl', 0],
    ['Nordic Curl', 2], ['Good Morning', 0],
  ],
  Glutes: [
    ['Hip Thrust', 0], ['Glute Bridge', 0], ['Single Leg Hip Thrust', 0],
    ['Cable Glute Kickback', 0], ['Hip Abduction', 0],
  ],
  'Lower Back': [
    ['Back Extension', 2], ['Reverse Hyperextension', 0], ['Superman', 2],
  ],
};

/* Made once, and only when there are none: an import brings its own and must
   not find these sitting in the way. */
TRAIN.seedCats = function () {
  if (Object.keys(TRAIN.cats()).length) return 0;
  var made = 0;
  TRAIN.DEFAULT_CATS.forEach(function (nm, i) {
    var catId = TRAIN.catId(nm);
    Rec.set('excat', null, catId, { name: nm, slot: i, ord: i });
    (TRAIN.DEFAULT_EX[nm] || []).forEach(function (row, j) {
      var name = row[0], kind = row[1];
      /* A fixed id per starter exercise, never a random one. Every copy of
         TRAIN that starts empty seeds this list: Safari, the home-screen icon
         (which on an iPhone keeps its own storage) and a laptop. With random
         ids each copy made its own hundred, the sheet merged them, and a
         client saw every move three times. With a fixed id, seeding twice is
         the same rows twice, which the store already treats as one. */
      /* A client's file can carry its own copy of a starter; theirs stands */
      if (Rec.has('exercise', null, TRAIN.seedId(name))) return;
      Rec.set('exercise', null, TRAIN.seedId(name), {
        name: name, cat: catId, kind: kind,
        /* 2.5 on a bar, 1 on anything you hold or hang from */
        inc: kind === 0 ? 2.5 : 1,
        rest: 0, unit: 0, fav: 0, note: '', graph: 0, ord: j,
      });
      made++;
    });
  });
  TRAIN.reindex();
  return made;
};

/* ── the groups a store made before today has never seen ──
   `seedCats` runs only on a store with nothing in it, so adding a muscle
   group to the list above would never reach a log that already exists — which
   is every log that matters, Tom's included. This adds any standard group
   that is missing, and nothing else: no exercise is moved, because which
   group a movement belongs to is his call once he has one.

   A group he deleted on purpose stays deleted. `Rec.tombstone` is how that is
   known, rather than a setting remembering what this device has written:
   a setting is one row, so two devices each keep only the later one's list
   and a device opened before the synced rows arrive trusts an empty picture.
   Known traps, the setting that remembers. For the same reason this runs
   after `Rec.ready`, when the tombstones from every device are in.

   A group is looked for by its NAME, never by the key this list would give
   it. An imported log keys its own (`fn9` is his Forearms), and until
   1.0.27 this checked keys, so his log got a second, empty Forearms. Arms is
   already there when he has Biceps or Triceps, and Core when he has Abs.
   A copy this made beside one of his own is deleted while it holds no
   exercise; one he has put a movement in stays, because then it is his. */
TRAIN.CAT_ALSO = { arm: ['bicep', 'tricep'], core: ['ab', 'abdominal'] };
TRAIN.catWord = function (nm) {
  return String(nm || '').toLowerCase().replace(/[^a-z0-9]+/g, '').replace(/s$/, '');
};
TRAIN.fillCats = function () {
  var have = TRAIN.cats(), ord = 0, made = 0, used = {};
  Object.keys(have).forEach(function (k) { if ((have[k].ord | 0) > ord) ord = have[k].ord | 0; });
  var ex = TRAIN.exercises();
  Object.keys(ex).forEach(function (k) { if (ex[k].cat) used[ex[k].cat] = 1; });
  TRAIN.DEFAULT_CATS.forEach(function (nm, i) {
    var id = TRAIN.catId(nm), w = TRAIN.catWord(nm);
    var words = [w].concat(TRAIN.CAT_ALSO[w] || []);
    var his = Object.keys(have).some(function (k) {
      return k !== id && words.indexOf(TRAIN.catWord(have[k].name)) >= 0;
    });
    if (his) {
      if (have[id] && !used[id]) { Rec.del('excat', null, id); made++; }
      return;
    }
    if (have[id] || Rec.tombstone('excat', null, id)) return;
    Rec.set('excat', null, id, { name: nm, slot: i, ord: ++ord });
    made++;
  });
  return made;
};

/* ── moving his movements into the finer groups ──
   Tom, 2026-09-25, yes to sorting his exercises into Calves, Glutes,
   Hamstrings and Lower Back, and never on its own: a sheet lists every move
   it would make, each one switched on, one SORT, and UNDO after. `fillCats`
   still moves nothing.

   Read off the name. Glutes is asked before Hamstrings, so a "Leg Curl
   Machine Hip Thrust" is a hip thrust. A movement already in one of the four
   is never offered again, so moving one back by hand sticks, and one he
   switched off in the sheet stays off next time (`train.sortSkip`). A group
   he deleted is never brought back for this; one that was never made is made
   on SORT, in its standard colour. */
TRAIN.SORT_RULES = [
  ['Calves', /calf|calves/i],
  ['Glutes', /hip thrust|glute bridge|glute isolator|glute swoop|abduct/i],
  ['Hamstrings', /leg curl|sldl|romanian|stiff[- ]?leg|glute[- ]?ham|good ?morning/i],
  ['Lower Back', /hyper ?extension|back extension/i],
];
TRAIN.catByWord = function (nm) {
  var cats = TRAIN.cats(), w = TRAIN.catWord(nm);
  if (cats[TRAIN.catId(nm)]) return TRAIN.catId(nm);
  return Object.keys(cats).filter(function (k) { return TRAIN.catWord(cats[k].name) === w; })[0] || null;
};
TRAIN.sortProposals = function () {
  var ex = TRAIN.exercises(), out = [], to = {}, fine = {};
  TRAIN.SORT_RULES.forEach(function (r) {
    var k = TRAIN.catByWord(r[0]);
    to[r[0]] = k || (Rec.tombstone('excat', null, TRAIN.catId(r[0])) ? false : null);
    if (k) fine[k] = 1;
  });
  Object.keys(ex).forEach(function (id) {
    var e = ex[id];
    if (fine[e.cat]) return;
    for (var i = 0; i < TRAIN.SORT_RULES.length; i++) {
      var g = TRAIN.SORT_RULES[i][0];
      if (!TRAIN.SORT_RULES[i][1].test(e.name || '')) continue;
      if (to[g] !== false) out.push({ id: id, name: e.name, from: e.cat, group: g, to: to[g], gi: i });
      break;
    }
  });
  return out.sort(function (a, b) { return a.gi - b.gi || String(a.name).localeCompare(b.name); });
};
TRAIN.sortSkip = function () {
  var s = Rec.setting(APP.id, 'sortSkip');
  return s && typeof s === 'object' ? s : {};
};
/* Moves the ones switched on, makes any group that is missing, and hands back
   what it did so UNDO can put every one back. UNDO leaves a group it made:
   `fillCats` would have made that same group on the next open, and deleting
   it would leave a tombstone that keeps it away for good. */
TRAIN.applySort = function (moves) {
  var cats = TRAIN.cats(), ord = 0, made = {}, done = [];
  Object.keys(cats).forEach(function (k) { if ((cats[k].ord | 0) > ord) ord = cats[k].ord | 0; });
  moves.forEach(function (m) {
    var to = m.to;
    if (!to) {
      to = TRAIN.catId(m.group);
      if (!made[to] && !TRAIN.cats()[to]) {
        Rec.set('excat', null, to, { name: m.group, slot: TRAIN.DEFAULT_CATS.indexOf(m.group), ord: ++ord });
        made[to] = 1;
      }
    }
    TRAIN.patchExercise(m.id, { cat: to });
    done.push({ id: m.id, from: m.from });
  });
  return { moved: done, made: Object.keys(made) };
};
TRAIN.undoSort = function (did) {
  did.moved.forEach(function (m) { TRAIN.patchExercise(m.id, { cat: m.from }); });
};

TRAIN.seedId = function (name) {
  return 'seed-' + String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
};

/* ── folding the copies back into one ──

   The repair for devices seeded before seedId existed. A starter exercise
   that exists more than once in the same category, under the same name, is
   one exercise, whatever its ids say. Only starter names are touched, never
   one somebody typed, so an imported or hand-made list is left exactly as it
   is.

   The keeper is the copy with the most sets, so whichever copy somebody has
   actually been training with keeps its history under its own id. Every set,
   routine entry, goal and superset pointing at a spare is moved onto the
   keeper by patching only that field, then the spare is deleted. A favourite
   or a note on a spare comes across if the keeper has none.

   Idempotent: once folded there is one copy of each, and a second run finds
   nothing. It runs again whenever rows arrive, because a device that was
   offline can still send a set logged against a spare, and that set has to
   land on the keeper too. */
/* Starters renamed or folded away after a list had already been seeded.
   Tom, 2026-09-25: "There is no barbell squat?" (it was Back Squat) and
   "merge leg curl and seated leg curl". Only a row still wearing its
   starter name is touched: one he renamed is his. A fold moves the spare's
   sets onto the keeper the same way a copy is folded below. */
TRAIN.SEED_RENAME = { 'seed-back-squat': ['Back Squat', 'Barbell Squat'] };
TRAIN.SEED_FOLD = { 'seed-seated-leg-curl': ['Seated Leg Curl', 'seed-leg-curl'] };

TRAIN.foldSeeds = function () {
  var renamed = 0;
  Object.keys(TRAIN.SEED_RENAME).forEach(function (id) {
    var r = TRAIN.SEED_RENAME[id], e = Rec.get('exercise', null, id);
    if (e && e.name === r[0]) { Rec.patch('exercise', null, id, { name: r[1] }); renamed++; }
  });
  if (renamed) TRAIN._exC = null;
  var starter = {};
  TRAIN.DEFAULT_CATS.forEach(function (nm) {
    (TRAIN.DEFAULT_EX[nm] || []).forEach(function (row) { starter[TRAIN.catId(nm) + '|' + row[0].toLowerCase()] = 1; });
  });
  var groups = {};
  Rec.all('exercise').forEach(function (r) {
    var p = r.payload || {};
    var k = String(p.cat || '') + '|' + String(p.name || '').trim().toLowerCase();
    if (!starter[k]) return;
    (groups[k] || (groups[k] = [])).push(r);
  });
  var spare = {}, keepOf = {}, n = 0;
  var sets = Rec.all('set'), count = {};
  sets.forEach(function (s) { var e = s.payload && s.payload.ex; if (e) count[e] = (count[e] || 0) + 1; });
  Object.keys(groups).forEach(function (k) {
    var g = groups[k];
    if (g.length < 2) return;
    g.sort(function (a, b) {
      return (count[b.key] || 0) - (count[a.key] || 0) ||
        (a.key.indexOf('seed-') === 0 ? -1 : b.key.indexOf('seed-') === 0 ? 1 : 0) ||
        (a.key < b.key ? -1 : 1);
    });
    var keep = g[0];
    g.slice(1).forEach(function (r) {
      spare[r.key] = keep.key;
      var kp = keep.payload || {}, rp = r.payload || {}, carry = {};
      if (rp.fav && !kp.fav) carry.fav = rp.fav;
      if (rp.note && !kp.note) carry.note = rp.note;
      if (Object.keys(carry).length) Rec.patch('exercise', null, keep.key, carry);
    });
    keepOf[keep.key] = 1;
  });
  Object.keys(TRAIN.SEED_FOLD).forEach(function (id) {
    var f = TRAIN.SEED_FOLD[id], e = Rec.get('exercise', null, id), to = spare[f[1]] || f[1];
    if (spare[id] || !Rec.get('exercise', null, to)) return;
    /* gone already, but a device that was offline can still send a set
       logged against it, and that set has to land on the keeper */
    if (e ? e.name !== f[0] : !count[id]) return;
    spare[id] = to;
    if (!e) return;
    var kp = Rec.get('exercise', null, to) || {}, carry = {};
    if (e.fav && !kp.fav) carry.fav = e.fav;
    if (e.note && !kp.note) carry.note = e.note;
    if (Object.keys(carry).length) Rec.patch('exercise', null, to, carry);
  });
  if (!Object.keys(spare).length) return renamed;
  sets.forEach(function (s) {
    var e = s.payload && s.payload.ex;
    if (spare[e]) { Rec.patch('set', s.date, s.key, { ex: spare[e] }); n++; }
  });
  ['progex', 'goal'].forEach(function (t) {
    Rec.all(t).forEach(function (r) {
      var e = r.payload && r.payload.ex;
      if (spare[e]) { Rec.patch(t, r.date, r.key, { ex: spare[e] }); n++; }
    });
  });
  Rec.all('sgroup').forEach(function (r) {
    var ex = r.payload && r.payload.ex;
    if (!Array.isArray(ex) || !ex.some(function (e) { return spare[e]; })) return;
    var seen = {}, out = [];
    ex.forEach(function (e) { var id = spare[e] || e; if (!seen[id]) { seen[id] = 1; out.push(id); } });
    Rec.patch('sgroup', r.date, r.key, { ex: out });
    n++;
  });
  Object.keys(spare).forEach(function (id) { if (Rec.get('exercise', null, id)) Rec.del('exercise', null, id); });
  TRAIN._exC = null;
  TRAIN.reindex();
  return Object.keys(spare).length + renamed;
};

/* Add one by name, for the "+ New category" route out of the exercise form. */
TRAIN.addCat = function (name) {
  var nm = String(name || '').trim();
  if (!nm) return null;
  var id = nm.toLowerCase().replace(/[^a-z0-9]+/g, '-') || TRAIN.newId();
  var all = TRAIN.cats(), ord = Object.keys(all).length;
  Rec.set('excat', null, id, { name: nm, slot: ord % TRAIN.SLOTS, ord: ord });
  TRAIN.reindex();
  return id;
};
TRAIN.exercises = function () { return TRAIN._exC || (TRAIN._exC = Rec.map('exercise')); };

/* A day's sets, grouped into the exercises they belong to, in the order the
   exercises were first touched that day. That order is the workout. */
TRAIN.dayGroups = function (date) {
  var sets = TRAIN.setsOn(date), ex = TRAIN.exercises();
  var byEx = {}, first = {};
  sets.forEach(function (s) {
    (byEx[s.ex] || (byEx[s.ex] = [])).push(s);
    var st = TRAIN.setStamp(s);
    if (first[s.ex] == null || st < first[s.ex]) first[s.ex] = st;
  });
  /* An order he set by moving exercises wins; anything he has not placed
     keeps the order it was first logged in, after the placed ones. */
  var order = ((Rec.get('session', date, '') || {}).order) || [];
  var ids = Object.keys(byEx).sort(function (a, b) {
    var ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia > -1 && ib > -1) return ia - ib;
    if (ia > -1) return -1;
    if (ib > -1) return 1;
    return first[a] - first[b];
  });
  return ids.map(function (id) {
    var list = byEx[id].slice().sort(function (a, b) {
      return (a.ord || 0) - (b.ord || 0) || TRAIN.setStamp(a) - TRAIN.setStamp(b);
    });
    return { ex: id, def: ex[id] || { name: 'Exercise ' + id, cat: null }, sets: list };
  });
};

/* ═══════════════════ VOLUME ═══════════════════
   Volume is weight times reps, summed, and it is always computed in kg then
   displayed, so switching units never changes the number underneath. */
TRAIN.volume = function (sets) {
  var v = 0;
  for (var i = 0; i < sets.length; i++) v += (sets[i].kg || 0) * (sets[i].r || 0);
  return v;
};

/* ═══════════════════ THE TICK ═══════════════════
   TRAIN re-asserts rather than argues. Any app may tick a training day; only
   TRAIN gets to say whether it is true, and it says so again every time the
   day's sets change and every time it looks at the day. Because the store
   merges on updated_at, TRAIN's write is always the newer one.
   See train/CLAUDE.md, "The tick". */
TRAIN.ACTIVITY = 'training';
TRAIN.assertTick = function (date) {
  if (!date) return;
  var n = TRAIN.setsOn(date).length;
  var had = Rec.has('tick', date, TRAIN.ACTIVITY);
  if (n > 0) {
    var cur = Rec.get('tick', date, TRAIN.ACTIVITY);
    if (!cur || cur.src !== APP.id || cur.qty !== n) {
      Rec.set('activity', null, TRAIN.ACTIVITY, { name: 'Training', cat: 'body' });
      Rec.set('tick', date, TRAIN.ACTIVITY, { src: APP.id, qty: n });
    }
  } else if (had) {
    Rec.del('tick', date, TRAIN.ACTIVITY);
  }
};

/* ═════════════════════════════════════════════════════════════════════════
   THE SQLITE READER

   A FitNotes backup is its database with the extension changed: the file
   begins "SQLite format 3". So the importer is a reader for that format,
   written here in plain JavaScript with no library, because an importer that
   needs the network breaks offline-first on the one job that matters most.

   It reads tables. It does not run SQL, it does not use indexes, and it does
   not write anything. Walk the b-tree from a table's root page, decode each
   leaf cell, hand back rows.
   ═════════════════════════════════════════════════════════════════════════ */
var SQLiteFile = TRAIN.SQLiteFile = function (buf) {
  this.b = new Uint8Array(buf);
  this.dv = new DataView(buf);
  if (this.text(0, 15) !== 'SQLite format 3')
    throw new Error('This is not a FitNotes backup. The file does not start with "SQLite format 3".');
  this.pageSize = this.dv.getUint16(16);
  if (this.pageSize === 1) this.pageSize = 65536;
  this.reserved = this.b[20];
  this.usable = this.pageSize - this.reserved;
  this.dec = new TextDecoder('utf-8');
  this.master = null;
};

SQLiteFile.prototype.text = function (off, len) {
  var s = '';
  for (var i = 0; i < len; i++) s += String.fromCharCode(this.b[off + i]);
  return s;
};

/* SQLite's variable length integer: seven bits a byte, high bit continues,
   and a ninth byte contributes all eight. */
SQLiteFile.prototype.varint = function (off) {
  var v = 0, i, b;
  for (i = 0; i < 8; i++) {
    b = this.b[off + i];
    v = v * 128 + (b & 0x7f);
    if (!(b & 0x80)) return [v, i + 1];
  }
  return [v * 256 + this.b[off + 8], 9];
};

/* Page 1 carries the 100 byte file header before its b-tree header. */
SQLiteFile.prototype.pageStart = function (n) { return (n - 1) * this.pageSize; };
SQLiteFile.prototype.btreeStart = function (n) { return n === 1 ? 100 : this.pageStart(n); };

/* A payload longer than the page keeps its first part in the cell and the
   rest in a chain of overflow pages. The split point is fixed by the format,
   not by taste, and getting it wrong silently truncates long text — which
   here would mean losing the end of a set comment. */
SQLiteFile.prototype.payload = function (off, size) {
  var maxLocal = this.usable - 35;
  var out, local;
  if (size <= maxLocal) {
    out = new Uint8Array(size);
    out.set(this.b.subarray(off, off + size));
    return out;
  }
  var minLocal = Math.floor((this.usable - 12) * 32 / 255) - 23;
  local = minLocal + ((size - minLocal) % (this.usable - 4));
  if (local > maxLocal) local = minLocal;

  out = new Uint8Array(size);
  out.set(this.b.subarray(off, off + local), 0);
  var got = local;
  var next = this.dv.getUint32(off + local);
  while (next && got < size) {
    var p = this.pageStart(next);
    var take = Math.min(this.usable - 4, size - got);
    out.set(this.b.subarray(p + 4, p + 4 + take), got);
    got += take;
    next = this.dv.getUint32(p);
  }
  return out;
};

/* A record is a header of serial types followed by the values themselves. */
SQLiteFile.prototype.record = function (bytes) {
  var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  var self = this;
  function vint(off) {
    var v = 0, i, b;
    for (i = 0; i < 8; i++) {
      b = bytes[off + i];
      v = v * 128 + (b & 0x7f);
      if (!(b & 0x80)) return [v, i + 1];
    }
    return [v * 256 + bytes[off + 8], 9];
  }
  var h = vint(0), headerEnd = h[0], p = h[1], types = [];
  while (p < headerEnd) { var t = vint(p); types.push(t[0]); p += t[1]; }

  var vals = [], off = headerEnd;
  for (var i = 0; i < types.length; i++) {
    var t2 = types[i], v;
    if (t2 === 0) { v = null; }
    else if (t2 === 1) { v = dv.getInt8(off); off += 1; }
    else if (t2 === 2) { v = dv.getInt16(off); off += 2; }
    else if (t2 === 3) { v = (dv.getInt8(off) << 16) | dv.getUint16(off + 1); off += 3; }
    else if (t2 === 4) { v = dv.getInt32(off); off += 4; }
    else if (t2 === 5) { v = dv.getInt16(off) * 4294967296 + dv.getUint32(off + 2); off += 6; }
    else if (t2 === 6) { v = dv.getInt32(off) * 4294967296 + dv.getUint32(off + 4); off += 8; }
    else if (t2 === 7) { v = dv.getFloat64(off); off += 8; }
    else if (t2 === 8) { v = 0; }
    else if (t2 === 9) { v = 1; }
    else if (t2 >= 12 && t2 % 2 === 0) { var n = (t2 - 12) / 2; v = bytes.subarray(off, off + n); off += n; }
    else { var n2 = (t2 - 13) / 2; v = self.dec.decode(bytes.subarray(off, off + n2)); off += n2; }
    vals.push(v);
  }
  return vals;
};

/* Walk a table b-tree and call back with [rowid, values] for every leaf cell. */
SQLiteFile.prototype.walk = function (page, fn, seen) {
  seen = seen || {};
  if (!page || seen[page]) return;          /* a corrupt file must not loop forever */
  seen[page] = 1;
  var s = this.btreeStart(page), type = this.b[s];
  var count = this.dv.getUint16(s + 3);
  /* A cell pointer is an offset from the start of its own page, not from the
     start of the file. Page 1 hides that bug, because its page starts at byte
     zero — every other page reads garbage without this. */
  var base = this.pageStart(page);
  var i, ptr, cell;

  if (type === 0x0d) {                       /* leaf table */
    for (i = 0; i < count; i++) {
      ptr = base + this.dv.getUint16(s + 8 + i * 2);
      var a = this.varint(ptr), size = a[0];
      var b = this.varint(ptr + a[1]), rowid = b[0];
      fn(rowid, this.record(this.payload(ptr + a[1] + b[1], size)));
    }
  } else if (type === 0x05) {                /* interior table */
    for (i = 0; i < count; i++) {
      cell = base + this.dv.getUint16(s + 12 + i * 2);
      this.walk(this.dv.getUint32(cell), fn, seen);
    }
    this.walk(this.dv.getUint32(s + 8), fn, seen);   /* the rightmost child */
  }
  /* index pages are never walked: TRAIN reads tables only */
};

/* sqlite_master is a table like any other, rooted at page 1. */
SQLiteFile.prototype.schema = function () {
  if (this.master) return this.master;
  var out = {}, self = this;
  this.walk(1, function (rowid, v) {
    if (v[0] === 'table' && v[1]) out[v[1]] = { root: v[3], sql: v[4] || '' };
  });
  this.master = out;
  return out;
};

/* Column names, and which column is the rowid in disguise.
   `_id INTEGER PRIMARY KEY` is stored as NULL in the record; its real value
   is the cell's rowid. Miss that and every id in the file comes back empty. */
SQLiteFile.prototype.columns = function (sql) {
  var open = sql.indexOf('(');
  if (open < 0) return { names: [], pk: -1 };
  var depth = 0, body = '', i;
  for (i = open; i < sql.length; i++) {
    var ch = sql[i];
    if (ch === '(') { depth++; if (depth === 1) continue; }
    if (ch === ')') { depth--; if (depth === 0) break; }
    body += ch;
  }
  var parts = [], buf = '', d = 0;
  for (i = 0; i < body.length; i++) {
    var c = body[i];
    if (c === '(') d++;
    if (c === ')') d--;
    if (c === ',' && d === 0) { parts.push(buf); buf = ''; continue; }
    buf += c;
  }
  if (buf.trim()) parts.push(buf);

  var names = [], pk = -1;
  parts.forEach(function (p) {
    var t = p.trim();
    if (!t) return;
    if (/^(PRIMARY|FOREIGN|UNIQUE|CHECK|CONSTRAINT)\b/i.test(t)) return;
    var m = t.match(/^[`"\[]?([A-Za-z_][A-Za-z0-9_]*)[`"\]]?/);
    if (!m) return;
    if (/\bINTEGER\s+PRIMARY\s+KEY\b/i.test(t)) pk = names.length;
    names.push(m[1]);
  });
  return { names: names, pk: pk };
};

/** Every row of one table, as plain objects. */
SQLiteFile.prototype.table = function (name) {
  var s = this.schema()[name];
  if (!s) return null;                       /* older backups genuinely lack tables */
  var cols = this.columns(s.sql), out = [];
  this.walk(s.root, function (rowid, vals) {
    var o = {};
    for (var i = 0; i < cols.names.length; i++) {
      o[cols.names[i]] = (i === cols.pk && vals[i] == null) ? rowid : vals[i];
    }
    out.push(o);
  });
  return out;
};

/* ═════════════════════════════════════════════════════════════════════════
   THE FITNOTES IMPORTER

   Merges, never replaces. Every row it builds carries a stable id derived
   from the FitNotes row id, and an updated_at taken from the training date
   rather than from the clock. Two consequences, both wanted:

     • importing the same backup twice changes nothing
     • anything edited in TRAIN afterwards is newer, so a re-import cannot
       walk over work done since

   One way only. There is no export back into FitNotes.
   ═════════════════════════════════════════════════════════════════════════ */

/* FitNotes stores a colour as a signed 32-bit ARGB integer. */
function argbToRgb(n) {
  var v = (n >>> 0) & 0xffffff;
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
/* Map an imported colour onto the nearest of the twelve theme slots, so his
   existing category colours survive as an assignment he can then change. The
   comparison is against the default skin, once, so it does not shift with
   whatever theme happens to be active during the import. */
function slotRgb(s) {
  var c = hexToRgb(getComputedStyle(document.documentElement)
    .getPropertyValue('--data-' + (s % 6 + 1)).trim());
  if (!c) return null;
  return s < 6 ? c : [c[0] * 0.62 + 40, c[1] * 0.62 + 40, c[2] * 0.62 + 40];
}
function slotDistance(s, rgb) {
  var c = slotRgb(s);
  if (!c) return Infinity;
  return Math.pow(c[0] - rgb[0], 2) + Math.pow(c[1] - rgb[1], 2) + Math.pow(c[2] - rgb[2], 2);
}
/* Nearest wins, but only once. Nine of his categories were picked by eye in
   FitNotes and three of them are near-identical greens: matching each one to
   its nearest slot independently put Triceps, Back and Abs on the same colour,
   which is worse than useless on a rail you are meant to follow down a day.
   So a slot is claimed, and the next category takes its nearest free one. */
function assignSlots(list) {
  var taken = {}, out = {};
  list.forEach(function (item) {
    var best = -1, bestD = Infinity;
    for (var s = 0; s < TRAIN.SLOTS; s++) {
      if (taken[s]) continue;
      var d = slotDistance(s, item.rgb);
      if (d < bestD) { bestD = d; best = s; }
    }
    if (best < 0) best = Object.keys(out).length % TRAIN.SLOTS;  /* more than twelve: repeats resume */
    taken[best] = 1;
    out[item.id] = best;
  });
  return out;
}
function hexToRgb(h) {
  if (!h) return null;
  h = h.trim();
  var m = h.match(/^#?([0-9a-f]{6})$/i);
  if (m) { var n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  m = h.match(/rgba?\(([^)]+)\)/);
  if (m) { var p = m[1].split(','); return [parseFloat(p[0]), parseFloat(p[1]), parseFloat(p[2])]; }
  return null;
}

/* FitNotes' exercise_type_id. Two of these are certain from his own data:
   0 is everything with a weight and reps, 1 is the cardio exercises. The
   others appear a handful of times and their exact ordinals could not be
   pinned down from the file alone, so the raw id is kept and the editor falls
   back to showing whichever of weight, reps, distance and time has a value.
   Nothing is lost; see train/CLAUDE.md. */
var KIND = { 0: 'weight_reps', 1: 'distance_time' };

TRAIN.importFitNotes = function (buf, onProgress, opts) {
  var db = new SQLiteFile(buf);
  var log = onProgress || function () {};
  var rows = [], stats = {};
  var USER = Rec.USER;

  function rowId(type, date, key) {
    var clean = function (s) { return String(s == null ? '' : s).replace(/\|/g, '-'); };
    return USER + '|' + clean(type) + '|' + clean(date || '') + '|' + clean(key);
  }
  /* Stable, and older than anything he does in TRAIN from here on. */
  function stampFor(date) {
    return (date && /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : '2000-01-01') + 'T12:00:00.000Z';
  }
  function push(type, date, key, payload, stamp) {
    rows.push({ id: rowId(type, date, key), user_id: USER, type: type,
      date: date || null, key: String(key), payload: payload,
      updated_at: stamp || stampFor(date), deleted: false, by: APP.id });
  }

  /* ── categories ── */
  log('categories');
  var cats = db.table('Category') || [];
  cats.sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0) || a._id - b._id; });
  var catSlots = assignSlots(cats.map(function (c) {
    return { id: c._id, rgb: argbToRgb(c.colour || 0) };
  }));
  cats.forEach(function (c) {
    push('excat', null, 'fn' + c._id, {
      name: c.name, slot: catSlots[c._id],
      ord: c.sort_order || 0, fnColour: c.colour,
    });
  });
  stats.categories = cats.length;
  stats.distinctColours = Object.keys(cats.reduce(function (o, c) {
    o[catSlots[c._id]] = 1; return o;
  }, {})).length;

  /* ── exercises ── */
  log('exercises');
  var exs = db.table('exercise') || [];
  exs.forEach(function (e) {
    push('exercise', null, 'fn' + e._id, {
      name: e.name,
      cat: e.category_id != null ? 'fn' + e.category_id : null,
      kind: KIND[e.exercise_type_id] || null,
      fnKind: e.exercise_type_id,
      note: e.notes || '',
      inc: e.weight_increment != null ? e.weight_increment : null,
      rest: e.default_rest_time != null ? e.default_rest_time : null,
      unit: UNIT[e.weight_unit_id] || null,
      graph: e.default_graph_id != null ? e.default_graph_id : null,
      fav: e.is_favourite ? 1 : 0,
    });
  });
  stats.exercises = exs.length;

  /* ── set comments ──
     owner_type_id 1 is a comment on a set. There are thousands of them and
     they are a third of the record, so they are attached to their set rather
     than kept as rows of their own. */
  log('comments');
  var comments = db.table('Comment') || [];
  var setNote = {}, dayNote = {}, nSetNotes = 0;
  comments.forEach(function (c) {
    if (c.owner_type_id === 1) { setNote[c.owner_id] = c.comment; nSetNotes++; }
    else { dayNote[c.date] = c.comment; }
  });
  stats.commentRows = nSetNotes;

  /* ── supersets ── */
  log('supersets');
  var groups = db.table('WorkoutGroup') || [];
  var groupEx = db.table('WorkoutGroupExercise') || [];
  var members = {};
  groupEx.forEach(function (g) {
    (members[g.workout_group_id] || (members[g.workout_group_id] = [])).push('fn' + g.exercise_id);
  });
  /* A superset's colour may repeat a category's: they never share a rail, so
     a collision here costs nothing and nearest is the honest answer. */
  var nearest = function (rgb) {
    var best = 0, bestD = Infinity;
    for (var s = 0; s < TRAIN.SLOTS; s++) {
      var d = slotDistance(s, rgb);
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  };
  groups.forEach(function (g) {
    push('sgroup', g.date, 'fn' + g._id, {
      name: g.name,
      slot: nearest(argbToRgb(g.colour || 0)),
      ex: members[g._id] || [],
      jump: g.auto_jump_enabled ? 1 : 0,
      resthold: g.rest_timer_auto_start_enabled ? 1 : 0,
    });
  });
  stats.supersets = groups.length;

  /* ── the training log ──
     One row per set, keyed on the FitNotes row id so a second import is a
     no-op. `ord` is the position within that exercise on that day, which
     FitNotes expresses as the order of the ids. */
  log('sets');
  var tl = db.table('training_log') || [];
  tl.sort(function (a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : a._id - b._id;
  });
  var ordCount = {}, days = {}, prs = 0, kgSets = 0, lbSets = 0;
  tl.forEach(function (t) {
    var okey = t.date + '|' + t.exercise_id;
    ordCount[okey] = (ordCount[okey] || 0) + 1;
    var unit = UNIT[t.unit] || 'kg';
    if (unit === 'kg') kgSets++; else lbSets++;
    if (t.is_personal_record) prs++;
    days[t.date] = 1;
    push('set', t.date, 'fn' + t._id, {
      ex: 'fn' + t.exercise_id,
      kg: t.metric_weight || 0,
      r: t.reps || 0,
      u: unit,
      done: t.is_complete ? 1 : 0,
      pr: t.is_personal_record ? 1 : 0,
      prf: t.is_personal_record_first ? 1 : 0,
      dist: t.distance ? t.distance / 1000 : 0,   /* metres, assumed: his file has no distances to check */
      dur: t.duration_seconds || 0,
      note: setNote[t._id] || '',
      ord: ordCount[okey],
    });
  });
  stats.sets = tl.length;
  /* FitNotes keeps a comment after its set is deleted. His file has 4,297
     set comments and 2,057 of them point at sets that no longer exist, so
     2,240 is every comment that has a set to belong to. */
  stats.setComments = tl.filter(function (t) { return setNote[t._id]; }).length;
  stats.orphanComments = stats.commentRows - stats.setComments;
  stats.days = Object.keys(days).length;
  stats.prSets = prs;
  stats.kgSets = kgSets;
  stats.lbSets = lbSets;

  /* ── the day: when the workout started and ended, and its comment ── */
  log('workout times');
  var times = db.table('WorkoutTime') || [];
  var byDate = {};
  times.forEach(function (w) {
    byDate[w.workout_date] = { start: w.start_date_time || null, end: w.end_date_time || null };
  });
  Object.keys(dayNote).forEach(function (d) {
    var k = String(d).slice(0, 10);
    byDate[k] = byDate[k] || {};
    byDate[k].note = dayNote[d];
  });
  Object.keys(byDate).forEach(function (d) {
    push('session', d, '', byDate[d]);
  });
  stats.workoutTimes = times.length;

  /* ── routines ── */
  log('routines');
  var routines = db.table('Routine') || [];
  var sections = db.table('RoutineSection') || [];
  var secEx = db.table('RoutineSectionExercise') || [];
  var secSets = db.table('RoutineSectionExerciseSet') || [];
  var setsFor = {};
  secSets.forEach(function (s) {
    (setsFor[s.routine_section_exercise_id] || (setsFor[s.routine_section_exercise_id] = [])).push({
      kg: s.metric_weight || 0, r: s.reps || 0, u: UNIT[s.unit] || 'kg',
      dist: s.distance || 0, dur: s.duration_seconds || 0, ord: s.sort_order || 0,
    });
  });
  routines.forEach(function (r) {
    push('program', null, 'fn' + r._id, { name: r.name, ord: r.sort_order || 0 });
  });
  /* A day's key names its routine as well as itself, so an exercise has to
     name both to land in it. It named only the day until 2026-09-25, and
     every imported routine day read "No exercises". */
  var dayKey = {};
  sections.forEach(function (s) {
    dayKey[s._id] = 'fn' + s.routine_id + '.' + s._id;
    push('progday', null, dayKey[s._id],
      { program: 'fn' + s.routine_id, name: s.name, ord: s.sort_order || 0 });
  });
  secEx.forEach(function (e) {
    var list = (setsFor[e._id] || []).sort(function (a, b) { return a.ord - b.ord; });
    push('progex', null, 'fn' + e.routine_section_id + '.' + e._id, {
      day: dayKey[e.routine_section_id] || ('fn' + e.routine_section_id), ex: 'fn' + e.exercise_id,
      ord: e.sort_order || 0, fill: e.populate_sets_type || 0, sets: list,
    });
  });
  stats.routines = routines.length;

  /* ── goals ── */
  log('goals');
  var goals = db.table('Goal') || [];
  goals.forEach(function (g) {
    push('goal', null, 'fn' + g._id, {
      kind: g.type_id, ex: g.exercise_id ? 'fn' + g.exercise_id : null,
      kg: g.metric_weight || 0, r: g.reps || 0, u: UNIT[g.unit] || 'kg',
      title: g.title || '', from: g.start_date || null, to: g.target_date || null,
      dist: g.distance || 0, dur: g.duration_seconds || 0, ord: g.sort_order || 0,
    });
  });
  stats.goals = goals.length;

  /* ── the gym: plates and bars are configuration, not records ── */
  log('settings');
  var plates = (db.table('Plate') || []).map(function (p) {
    return { kg: p.unit === 0 ? p.weight : p.weight / LB_PER_KG, w: p.weight,
             u: UNIT[p.unit] || 'kg', n: p.count, on: p.enabled ? 1 : 0,
             colour: p.colour, wr: p.width_ratio, hr: p.height_ratio };
  });
  var bars = (db.table('Barbell') || []).map(function (b) {
    return { w: b.weight, u: UNIT[b.unit] || 'kg', ex: b.exercise_id || 0 };
  });
  stats.plates = plates.length;
  stats.bars = bars.length;

  /* Body weight and measurements are STATUS's, not TRAIN's. They are counted
     so the panel can offer them, and deliberately not imported here. */
  var bodyRows = (db.table('MeasurementRecord') || []).length +
                 (db.table('BodyWeight') || []).length;
  stats.bodyRowsSkipped = bodyRows;

  /* ── one write ──
     Rec.set announces after every row, which for twelve thousand sets would
     redraw the screen twelve thousand times. merge writes them all and tells
     the app once.

     `defer` hands the rows back instead, so the async wrapper can write them
     in chunks and let the phone paint between them. */
  log('saving');
  stats.rowsBuilt = rows.length;

  /* Everything that has to happen once the rows are in, whichever path put
     them there. */
  function finishImport() {
    applySettings();
    TRAIN.reindex();
    clearSeed();
    /* FitNotes' flags arrive as it set them; TRAIN's rule keeps split sets
       apart, so they are worked out again once everything is in. */
    TRAIN.recomputePRs();
    Rec.setting(APP.id, 'prRule', 2);
    Object.keys(days).forEach(TRAIN.assertTick);
    return stats;
  }

  /* The movements a fresh TRAIN starts with are for someone arriving with
     nothing. A FitNotes backup brings a complete list of its own, so seeded
     movements with no sets and in no routine go, and so do starter groups
     left empty. Without this he has two Deadlifts and two Back categories.
     A seeded row is recognised by what seedCats writes: unit 0 and graph 0 in
     one of the starter groups. Anything he made or logged stays. */
  function clearSeed() {
    var starter = {};
    TRAIN.DEFAULT_CATS.forEach(function (n) { starter[TRAIN.catId(n)] = 1; });
    var exs = TRAIN.exercises(), inRoutine = {}, removed = 0;
    var px = Rec.map('progex');
    Object.keys(px).forEach(function (k) { inRoutine[px[k].ex] = 1; });
    Object.keys(exs).forEach(function (id) {
      var e = exs[id];
      if (/^fn/.test(id) || !starter[e.cat] || e.unit !== 0 || e.graph !== 0) return;
      if (TRAIN.historyOf(id).length || inRoutine[id]) return;
      Rec.del('exercise', null, id);
      removed++;
    });
    var left = TRAIN.exercises();
    Object.keys(starter).forEach(function (cid) {
      if (!TRAIN.cats()[cid]) return;
      if (Object.keys(left).some(function (id) { return left[id].cat === cid; })) return;
      Rec.del('excat', null, cid);
    });
    stats.starterRemoved = removed;
  }

  if (opts && opts.defer) {
    stats.rowsWritten = 0;
    return { rows: rows, stats: stats, days: days, finish: finishImport };
  }
  stats.rowsWritten = TRAIN.mergeImport(rows);
  return finishImport();

  function applySettings() {
  if (plates.length) Rec.setting(APP.id, 'plates', plates);
  if (bars.length) Rec.setting(APP.id, 'bars', bars);

  /* FitNotes' own settings, for the ones TRAIN has an equivalent for. The
     display unit is left alone: it is asked for on first run and is his
     choice, not the file's. */
  var fs = (db.table('settings') || [])[0];
  if (fs) {
    if (fs.rest_timer_seconds != null) Rec.setting(APP.id, 'restSeconds', fs.rest_timer_seconds);
    if (fs.rest_timer_auto_start != null) Rec.setting(APP.id, 'restAuto', fs.rest_timer_auto_start ? 1 : 0);
    if (fs.rest_timer_vibrate != null) Rec.setting(APP.id, 'restVibrate', fs.rest_timer_vibrate ? 1 : 0);
    if (fs.rest_timer_sound != null) Rec.setting(APP.id, 'restSound', fs.rest_timer_sound ? 1 : 0);
    if (fs.weight_increment != null) Rec.setting(APP.id, 'increment', fs.weight_increment);
    if (fs.mark_sets_complete != null) Rec.setting(APP.id, 'markComplete', fs.mark_sets_complete ? 1 : 0);
    if (fs.track_personal_records != null) Rec.setting(APP.id, 'trackPRs', fs.track_personal_records ? 1 : 0);
    if (fs.auto_select_next_set != null) Rec.setting(APP.id, 'autoNext', fs.auto_select_next_set ? 1 : 0);
    if (fs.keep_screen_on != null) Rec.setting(APP.id, 'keepAwake', fs.keep_screen_on ? 1 : 0);
    if (fs.first_day_of_week != null) Rec.setting(APP.id, 'weekStart', fs.first_day_of_week);
    if (fs.estimated_1rm_max_reps_to_include != null)
      Rec.setting(APP.id, 'e1rmMaxReps', fs.estimated_1rm_max_reps_to_include);
    if (fs.workout_timer_auto_start_enabled != null)
      Rec.setting(APP.id, 'workoutTimerAuto', fs.workout_timer_auto_start_enabled ? 1 : 0);
    stats.settings = 1;
  }
  }
};

/* The same import, in slices, so the phone can paint between them. The rows
   are built in one pass and then written a few hundred at a time: writing is
   where the seconds go, because every row is its own storage entry. */
TRAIN.importFitNotesAsync = function (buf, onStep) {
  var CHUNK = 400;
  var step = onStep || function () { return Promise.resolve(); };
  /* Each chunk announces, and every announce would otherwise reindex and
     redraw the whole app. Thirty-three of those during one import is most of
     the cost of the import. */
  TRAIN.importing = true;
  var done = function (v) { TRAIN.importing = false; return v; };
  var failed = function (e) { TRAIN.importing = false; throw e; };
  return Promise.resolve()
    .then(function () { return step('categories'); })
    .then(function () {
      var held = TRAIN.importFitNotes(buf, function () {}, { defer: true });
      var rows = held.rows, i = 0, written = 0;
      var steps = ['exercises', 'comments', 'supersets', 'sets', 'workout times',
                   'routines', 'goals', 'settings', 'saving'];
      function slice() {
        if (i >= rows.length) {
          held.stats.rowsWritten = written;
          return Promise.resolve(held.finish());
        }
        written += TRAIN.mergeImport(rows.slice(i, i + CHUNK));
        i += CHUNK;
        var pos = Math.min(steps.length - 1, Math.floor((i / rows.length) * steps.length));
        return step(steps[pos]).then(slice);
      }
      return slice();
    })
    .then(done, failed);
};

/* ═══════════════════ THE IMPORT PANEL ═══════════════════ */
/* ═════════════════ IMPORTING FROM ANYWHERE ELSE ═════════════════
   The FitNotes importer reads that app's SQLite file and nothing else. Every
   other training app exports a spreadsheet, and they all export very nearly
   the same one: a row per set, with the date, the movement, the weight and the
   reps. Only the column names differ.

   So rather than a parser per app, one parser and a table of what each app
   calls things. Strong says "Exercise Name", Hevy says "exercise_title",
   FitNotes says "Exercise". They all mean the same column.

   Anything it cannot match, it says so and imports what it could rather than
   refusing the file. A log that is 90% across beats a log that is 0% across
   with a tidy error message.                                                */

/* A real CSV reader: quoted fields, commas and newlines inside quotes, and ""
   as an escaped quote. Splitting on commas loses every exercise with a comma
   in its name, which is most cable variations. */
TRAIN.parseCsv = function (text) {
  var rows = [], row = [], cur = '', q = false, i = 0;
  text = String(text || '').replace(/\r\n?/g, '\n');
  for (; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
};

/* What each app calls each column. Matched case- and punctuation-insensitively,
   longest alias first so "weight_kg" wins over "weight". */
TRAIN.CSV_ALIASES = {
  date: ['date', 'workoutdate', 'starttime', 'start', 'datetime', 'day'],
  ex:   ['exercisename', 'exercisetitle', 'exercise', 'movement', 'name'],
  cat:  ['category', 'musclegroup', 'bodypart', 'muscle'],
  kg:   ['weightkg', 'weightlbs', 'weightlb', 'weight'],
  reps: ['reps', 'repetitions', 'rep', 'quantity'],
  dist: ['distancekm', 'distancemiles', 'distance'],
  dur:  ['durationseconds', 'seconds', 'duration', 'time'],
  note: ['exercisenotes', 'setnotes', 'comment', 'notes', 'note'],
};
var csvKey = function (h) { return String(h || '').toLowerCase().replace(/[^a-z0-9]/g, ''); };

/** Work out which column is which, and which unit the weights are in. */
TRAIN.mapCsv = function (headers) {
  var keys = headers.map(csvKey), map = {}, used = {};
  Object.keys(TRAIN.CSV_ALIASES).forEach(function (field) {
    var best = -1, bestLen = -1;
    TRAIN.CSV_ALIASES[field].forEach(function (alias) {
      for (var i = 0; i < keys.length; i++) {
        if (used[i] || keys[i] !== alias) continue;
        if (alias.length > bestLen) { best = i; bestLen = alias.length; }
      }
    });
    if (best > -1) { map[field] = best; used[best] = 1; }
  });
  /* lbs unless the header says otherwise, which is what a bare "Weight" means
     in every export that does not say */
  var wh = map.kg != null ? keys[map.kg] : '';
  map.unit = /kg/.test(wh) ? 'kg' : 'lb';
  map.miles = map.dist != null && /mile/.test(keys[map.dist]);
  return map;
};

/* Dates arrive as 2024-01-15, 2024-01-15 09:30:00, 15/01/2024 and worse.
   Anything with a leading ISO date is taken at its word; the rest goes through
   Date.parse and comes back as the local calendar day. */
TRAIN.csvDate = function (v) {
  var t = String(v || '').trim();
  if (!t) return null;
  var iso = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return iso[0];
  var ms = Date.parse(t);
  if (!isFinite(ms)) return null;
  var d = new Date(ms);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

/** Bring a parsed spreadsheet in. Returns what it did, in plain counts. */
TRAIN.importCsv = function (grid) {
  var out = { sets: 0, exercises: 0, cats: 0, days: 0, skipped: 0, unit: 'lb' };
  if (!grid || grid.length < 2) { out.error = 'That file has no rows in it.'; return out; }
  var map = TRAIN.mapCsv(grid[0]);
  out.unit = map.unit;
  if (map.date == null || map.ex == null) {
    out.error = 'Could not find a date column and an exercise column. ' +
      'Found: ' + grid[0].filter(Boolean).join(', ');
    return out;
  }

  /* index what is already here by name, so a second import of the same file
     lands on the same rows instead of doubling everything */
  var cats = TRAIN.cats(), exs = TRAIN.exercises();
  var catByName = {}, exByName = {};
  Object.keys(cats).forEach(function (k) { catByName[String(cats[k].name).toLowerCase()] = k; });
  Object.keys(exs).forEach(function (k) { exByName[String(exs[k].name).toLowerCase()] = k; });

  var seen = {}, days = {};
  grid.slice(1).forEach(function (r) {
    var date = TRAIN.csvDate(r[map.date]);
    var name = String(r[map.ex] == null ? '' : r[map.ex]).trim();
    if (!date || !name) { out.skipped++; return; }

    var catName = map.cat != null ? String(r[map.cat] || '').trim() : '';
    var catId = null;
    if (catName) {
      catId = catByName[catName.toLowerCase()];
      if (!catId) {
        catId = catName.toLowerCase().replace(/[^a-z0-9]+/g, '-') || TRAIN.newId();
        Rec.set('excat', null, catId, { name: catName, slot: Object.keys(catByName).length % TRAIN.SLOTS, ord: Object.keys(catByName).length });
        catByName[catName.toLowerCase()] = catId; out.cats++;
      }
    }

    var exId = exByName[name.toLowerCase()];
    if (!exId) {
      exId = TRAIN.newId();
      Rec.set('exercise', null, exId, {
        name: name, cat: catId, kind: 0, inc: 2.5, rest: 0, unit: 0,
        fav: 0, note: '', graph: 0, ord: 0,
      });
      exByName[name.toLowerCase()] = exId; out.exercises++;
    }

    var w = map.kg != null ? parseFloat(r[map.kg]) : 0;
    var reps = map.reps != null ? TRAIN.readReps(r[map.reps]) : 0;
    var dist = map.dist != null ? parseFloat(r[map.dist]) : 0;
    var dur = map.dur != null ? parseFloat(r[map.dur]) : 0;
    if (!isFinite(w)) w = 0;
    if (!isFinite(reps)) reps = 0;
    if (!isFinite(dist)) dist = 0;
    if (!isFinite(dur)) dur = 0;
    if (!w && !reps && !dist && !dur) { out.skipped++; return; }

    /* Every set is stored in kilograms, whatever the file was written in. */
    var kg = map.unit === 'kg' ? w : TRAIN.toKg(w, 'lb');

    /* A stable id from the row's own contents: the same file imported twice
       writes the same rows, which is what makes this safe to repeat. */
    seen[date] = (seen[date] || 0) + 1;
    var key = 'csv-' + date + '-' + exId + '-' + seen[date];
    Rec.set('set', date, key, {
      ex: exId, kg: kg, r: reps, u: map.unit, done: 1, pr: 0, prf: 0,
      dist: map.miles ? dist * 1.609344 : dist, dur: Math.round(dur),
      note: map.note != null ? String(r[map.note] || '').trim() : '',
      ord: seen[date],
    });
    days[date] = 1; out.sets++;
  });

  TRAIN.reindex();
  Object.keys(days).forEach(function (d) { TRAIN.assertTick(d); });
  TRAIN.recomputePRs();
  out.days = Object.keys(days).length;
  return out;
};

/* ═══════════════════ FROM NOTES ═══════════════════
   Tom, 2026-09-25: "Allow the option for smart import - some people track
   on notes." A log typed into a phone's notes app, pasted in and read by
   shape. A date line starts a day, a name starts an exercise, and the
   numbers are sets, in whichever of the usual ways they were written:
   60x8, 60kg 8/8/7, 3x8 @ 60, 100 x 5 x 5, 8, 8, 7 (60kg), bw x 12, bw+10
   x 8, 45s, 20 min 2km, 40m. A line that gives only a weight ("Bench 60kg")
   hands it to the reps under it.

   Nothing is written until the preview has been read and IMPORT pressed,
   every line it could not read is listed rather than dropped (DOCTRINE,
   law 3), and the whole import is one UNDO. A day's sets are keyed by date
   and place (`nt-<date>-<n>`), so the same notes twice write the same
   rows, and a day imported again replaces what notes put there before. */
var NT_MON = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
