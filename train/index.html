  return b;
}

function closeDrawer(fromBack) {
  var wrap = document.getElementById('dwrap');
  wrap.classList.remove('in');
  setTimeout(function () { wrap.classList.remove('open'); }, 320);
  if (!fromBack && TRAIN._drawerRel) { var r = TRAIN._drawerRel; TRAIN._drawerRel = null; r(); }
}

/* ═════════════════════════════════════════════════════════════════════════
   THE NUMBERS
   Estimated one-rep max, personal records, and totals over a period. All of
   it computed from the index, all of it in kilograms, converted only when it
   is printed.
   ═════════════════════════════════════════════════════════════════════════ */

/* Brzycki, which is what FitNotes uses. It falls apart at high rep counts,
   which is why the app lets you cap the reps that count towards it. */
TRAIN.e1rm = function (kg, reps) {
  if (!kg || !reps) return 0;
  var cap = Rec.setting(APP.id, 'e1rmMaxReps') || 0;
  if (cap && reps > cap) return 0;
  if (reps >= 37) return 0;
  return kg * 36 / (37 - reps);
};

/* A set is a personal record if nothing before it was heavier. Walking the
   history in order is the only way to get that right, because a record is a
   statement about a moment, not about the whole log. */
TRAIN.recomputePRs = function () {
  var exs = TRAIN.exercises(), changed = 0;
  Object.keys(exs).forEach(function (id) {
    var hist = TRAIN.historyOf(id), best = 0, first = true;
    hist.forEach(function (s) {
      var isPr = (s.kg || 0) > best && (s.kg || 0) > 0;
      if (isPr) best = s.kg;
      var wantPr = isPr ? 1 : 0, wantFirst = (isPr && first) ? 1 : 0;
      if (isPr) first = false;
      if ((s.pr || 0) !== wantPr || (s.prf || 0) !== wantFirst) {
        TRAIN.patchSet(s.key, s.date, { pr: wantPr, prf: wantFirst });
        changed++;
      }
    });
  });
  TRAIN.reindex();
  return changed;
};

/* Everything the Records screen shows for one exercise. */
TRAIN.recordsFor = function (exId) {
  var hist = TRAIN.historyOf(exId);
  var r = { maxWeight: null, maxReps: null, maxVolume: null, max1rm: null,
            byReps: {}, sets: hist.length, workouts: 0 };
  var days = {};
  hist.forEach(function (s) {
    days[s.date] = 1;
    var vol = (s.kg || 0) * (s.r || 0), e = TRAIN.e1rm(s.kg, s.r);
    if (s.kg > 0 && (!r.maxWeight || s.kg > r.maxWeight.kg)) r.maxWeight = s;
    if (s.r > 0 && (!r.maxReps || s.r > r.maxReps.r)) r.maxReps = s;
    if (vol > 0 && (!r.maxVolume || vol > (r.maxVolume.kg * r.maxVolume.r))) r.maxVolume = s;
    if (e > 0 && (!r.max1rm || e > TRAIN.e1rm(r.max1rm.kg, r.max1rm.r))) r.max1rm = s;
    if (s.r > 0 && s.kg > 0 && (!r.byReps[s.r] || s.kg > r.byReps[s.r].kg)) r.byReps[s.r] = s;
  });
  r.workouts = Object.keys(days).length;
  return r;
};

/* Totals over a window, grouped however the Analysis screen asks. */
TRAIN.breakdown = function (from, to, by) {
  var exs = TRAIN.exercises(), cats = TRAIN.cats(), out = {}, days = {};
  Object.keys(TRAIN.idx.byDate).forEach(function (d) {
    if (d < from || d > to) return;
    TRAIN.idx.byDate[d].forEach(function (s) {
      var ex = exs[s.ex];
      var key = by === 'category' ? (ex && ex.cat ? ex.cat : '?') : s.ex;
      var o = out[key] || (out[key] = { sets: 0, reps: 0, vol: 0, days: {} });
      o.sets++; o.reps += s.r || 0; o.vol += (s.kg || 0) * (s.r || 0);
      o.days[d] = 1; days[d] = 1;
    });
  });
  var rows = Object.keys(out).map(function (k) {
    var o = out[k];
    var name = by === 'category'
      ? (cats[k] ? cats[k].name : 'Uncategorised')
      : (exs[k] ? exs[k].name : k);
    return { key: k, name: name, sets: o.sets, reps: o.reps, vol: o.vol,
             workouts: Object.keys(o.days).length,
             slot: by === 'category' && cats[k] ? cats[k].slot : null };
  });
  rows.sort(function (a, b) { return b.vol - a.vol || b.sets - a.sets; });
  return { rows: rows, workouts: Object.keys(days).length };
};

TRAIN.PERIODS = [
  { id: '1m', name: '1 MONTH', days: 30 },
  { id: '3m', name: '3 MONTHS', days: 91 },
  { id: '6m', name: '6 MONTHS', days: 182 },
  { id: '1y', name: '1 YEAR', days: 365 },
  { id: 'all', name: 'ALL', days: 0 },
];
TRAIN.periodRange = function (id) {
  var p = TRAIN.PERIODS.filter(function (x) { return x.id === id; })[0] || TRAIN.PERIODS[1];
  var to = Day.today();
  if (!p.days) {
    var all = Object.keys(TRAIN.idx.byDate).sort();
    return { from: all[0] || to, to: to };
  }
  return { from: Day.shift(to, -(p.days - 1)), to: to };
};

/* ═════════════════ THE CALENDAR ═════════════════
   A month grid with a dot per muscle group trained that day, and the total
   workout count underneath — the number FitNotes puts at the foot of the
   screen and the one that says "631 workouts" on his phone. */
function drawCalendar(m) {
  var cats = TRAIN.cats(), exs = TRAIN.exercises();
  var month = TRAIN.calMonth || TRAIN.date.slice(0, 7);
  TRAIN.calMonth = month;

  var head = UI.el('div', 'calhead');
  var back = UI.el('button', 'ico mb-press mb-tap');
  back.innerHTML = '‹'; back.style.fontSize = 'var(--f-5)';
  back.setAttribute('aria-label', 'Previous month');
  back.onclick = function () { TRAIN.calMonth = shiftMonth(month, -1); draw(); };
  var fwd = UI.el('button', 'ico mb-press mb-tap');
  fwd.innerHTML = '›'; fwd.style.fontSize = 'var(--f-5)';
  fwd.setAttribute('aria-label', 'Next month');
  fwd.onclick = function () { TRAIN.calMonth = shiftMonth(month, 1); draw(); };
  var title = UI.el('div', 'caltitle');
  var mid = new Date(month + '-01T12:00:00');
  title.textContent = mid.toLocaleDateString(undefined, { month: 'long' }).toUpperCase() +
    ' ' + mid.getFullYear();
  head.appendChild(back); head.appendChild(title); head.appendChild(fwd);
  m.appendChild(head);

  var grid = UI.el('div', 'calgrid');
  var weekStart = Rec.setting(APP.id, 'weekStart') === 1 ? 1 : 0;   /* 1 = Monday */
  var names = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  for (var i = 0; i < 7; i++) {
    var h = UI.el('div', 'caldow');
    h.textContent = names[(i + weekStart) % 7];
    grid.appendChild(h);
  }

  var first = new Date(month + '-01T12:00:00');
  var lead = (first.getDay() - weekStart + 7) % 7;
  for (var b = 0; b < lead; b++) grid.appendChild(UI.el('div', 'calcell empty'));

  var last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  var today = Day.today();
  for (var dnum = 1; dnum <= last; dnum++) {
    var iso = month + '-' + String(dnum).padStart(2, '0');
    var sets = TRAIN.idx.byDate[iso] || [];
    var cell = UI.el('button', 'calcell mb-press mb-tap' +
      (iso === TRAIN.date ? ' sel' : '') + (iso === today ? ' today' : '') +
      (iso > today ? ' future' : ''));
    var slots = [];
    sets.forEach(function (s) {
      var ex = exs[s.ex], c = ex && ex.cat ? cats[ex.cat] : null;
      if (c && slots.indexOf(c.slot) < 0) slots.push(c.slot);
    });
    var dots = slots.slice(0, 4).map(function (sl) {
      return '<i style="background:' + TRAIN.slotColor(sl) + '"></i>';
    }).join('');
    cell.innerHTML = '<span class="n">' + dnum + '</span><span class="dots">' + dots + '</span>';
    (function (d) {
      cell.onclick = function () {
        if (d > today) return;
        TRAIN.date = d; Mobile.feedback('select'); TRAIN.show('workout');
      };
    })(iso);
    grid.appendChild(cell);
  }
  m.appendChild(grid);

  var foot = UI.el('div', 'calfoot');
  foot.innerHTML = '<b>' + Object.keys(TRAIN.idx.byDate).length.toLocaleString() +
    '</b> WORKOUTS';
  m.appendChild(foot);
}
function shiftMonth(ym, n) {
  var d = new Date(ym + '-01T12:00:00');
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

/* ═════════════════ ANALYSIS ═════════════════ */
function drawAnalysis(m) {
  var by = TRAIN.anaBy || 'category';
  var period = TRAIN.anaPeriod || '3m';
  var range = TRAIN.periodRange(period);
  var data = TRAIN.breakdown(range.from, range.to, by);
  var unit = TRAIN.unit();

  var controls = UI.el('div', 'exblock');
  controls.style.padding = 'var(--s-3) var(--s-4)';
  controls.appendChild(UI.segmented(
    [{ id: 'category', name: 'CATEGORY' }, { id: 'exercise', name: 'EXERCISE' }], by,
    function (v) { TRAIN.anaBy = v; draw(); }));
  var psel = UI.segmented(TRAIN.PERIODS.map(function (p) { return { id: p.id, name: p.name.split(' ')[0] }; }),
    period, function (v) { TRAIN.anaPeriod = v; draw(); });
  psel.style.marginTop = 'var(--s-3)';
  controls.appendChild(psel);
  m.appendChild(controls);

  var top = UI.el('div', 'exblock');
  top.style.padding = 'var(--s-3) var(--s-4)';
  var totals = data.rows.reduce(function (a, r) {
    a.sets += r.sets; a.reps += r.reps; a.vol += r.vol; return a;
  }, { sets: 0, reps: 0, vol: 0 });
  top.innerHTML = '<div class="statrow">' +
    '<span><b>' + data.workouts + '</b>workouts</span>' +
    '<span><b>' + totals.sets.toLocaleString() + '</b>sets</span>' +
    '<span><b>' + totals.reps.toLocaleString() + '</b>reps</span>' +
    '<span><b>' + Math.round(TRAIN.toUnit(totals.vol, unit)).toLocaleString() + '</b>' + unit + '</span>' +
    '</div>';
  m.appendChild(top);

  if (!data.rows.length) {
    var e = UI.el('div', 'empty');
    e.textContent = 'No workouts in this period';
    m.appendChild(e);
    return;
  }

  var max = data.rows[0].vol || 1;
  var card = UI.el('div', 'exblock');
  card.style.padding = 'var(--s-3) var(--s-4)';
  data.rows.slice(0, 40).forEach(function (r) {
    var row = UI.el('div', 'barrow');
    var pct = Math.max(2, Math.round((r.vol / max) * 100));
    row.innerHTML =
      '<div class="lbl"><span class="nm">' + UI.esc(r.name) + '</span>' +
      '<span class="v">' + Math.round(TRAIN.toUnit(r.vol, unit)).toLocaleString() + ' ' + unit + '</span></div>' +
      '<div class="track"><i style="width:' + pct + '%;background:' +
      (r.slot != null ? TRAIN.slotColor(r.slot) : 'var(--accent)') + '"></i></div>' +
      '<div class="sub">' + r.sets + ' sets · ' + r.reps + ' reps · ' + r.workouts + ' workouts</div>';
    card.appendChild(row);
  });
  m.appendChild(card);
}

/* ═════════════════ RECORDS ═════════════════ */
function drawRecords(m) {
  var exs = TRAIN.exercises(), cats = TRAIN.cats();
  var q = (TRAIN.recQuery || '').trim().toLowerCase();

  var box = UI.el('div', 'search');
  box.innerHTML = MAGNIFIER;
  var input = UI.el('input');
  Mobile.field(input, 'search', {});
  input.placeholder = 'Search exercises';
  input.value = TRAIN.recQuery || '';
  input.oninput = function () {
    TRAIN.recQuery = input.value;
    var pos = input.selectionStart;
    draw();
    var live = document.querySelector('.search input');
    if (live) { live.focus(); live.setSelectionRange(pos, pos); }
  };
  box.appendChild(input);
  m.appendChild(box);

  var rows = Object.keys(exs)
    .map(function (id) { return { id: id, e: exs[id], r: TRAIN.recordsFor(id) }; })
    .filter(function (x) { return x.r.sets > 0 && (!q || x.e.name.toLowerCase().indexOf(q) > -1); })
    .sort(function (a, b) { return a.e.name.localeCompare(b.e.name); });

  if (!rows.length) {
    var e = UI.el('div', 'empty');
    e.textContent = 'No personal records found';
    m.appendChild(e);
    return;
  }

  rows.slice(0, TRAIN.recLimit || 60).forEach(function (x) {
    var cat = cats[x.e.cat];
    var card = UI.el('div', 'exblock');
    if (cat) card.style.setProperty('--cat', TRAIN.slotColor(cat.slot));
    var head = UI.el('div', 'head mb-press mb-tap');
    head.innerHTML = '<span class="nm">' + UI.esc(x.e.name) + '</span>' +
      '<span class="u" style="color:var(--text-muted);font-size:var(--f-1)">' +
      x.r.workouts + ' workouts</span>';
    head.onclick = function () { TRAIN.openExercise(x.id); };
    card.appendChild(head);

    var body = UI.el('div', 'sets');
    body.appendChild(recLine('Max weight', x.r.maxWeight && x.r.maxWeight.kg
      ? TRAIN.showWeight(x.r.maxWeight.kg, x.r.maxWeight.u) + ' ' + TRAIN.unitLabel() +
        ' × ' + x.r.maxWeight.r : '—',
      x.r.maxWeight && x.r.maxWeight.date));
    body.appendChild(recLine('Max reps', x.r.maxReps ? x.r.maxReps.r + ' reps' : '—',
      x.r.maxReps && x.r.maxReps.date));
    if (x.r.maxVolume && x.r.maxVolume.kg) {
      body.appendChild(recLine('Max set volume',
        Math.round(TRAIN.toUnit(x.r.maxVolume.kg * x.r.maxVolume.r, TRAIN.unit())).toLocaleString() +
        ' ' + TRAIN.unit(), x.r.maxVolume.date));
    }
    if (x.r.max1rm) {
      body.appendChild(recLine('Estimated 1RM',
        TRAIN.showWeight(TRAIN.e1rm(x.r.max1rm.kg, x.r.max1rm.r), null) + ' ' + TRAIN.unitLabel(),
        x.r.max1rm.date));
    }
    card.appendChild(body);

}
function recLine(label, value, date) {

/* ═════════════════════════════════════════════════════════════════════════
   THE REST TIMER

   This is the one place TRAIN is worse than FitNotes and it cannot be fixed
   from a page in a browser: a backgrounded tab is suspended, so the timer
   will not buzz in his pocket.

   It therefore recovers rather than pretends. The moment it started is
   written down, and the elapsed time is always recomputed from the clock. If
   he comes back after two minutes away it says he is forty seconds over,
   instead of resuming from wherever it froze. A timer that silently stopped
   counting is worse than no timer.
   ═════════════════════════════════════════════════════════════════════════ */
TRAIN.rest = { until: 0, len: 0, tick: null, fired: false };

TRAIN.restStart = function (seconds) {
  var len = seconds || Rec.setting(APP.id, 'restSeconds') || 120;
  TRAIN.rest.len = len;
  TRAIN.rest.until = Date.now() + len * 1000;
  TRAIN.rest.fired = false;
  try { localStorage.setItem('train.rest', JSON.stringify({ until: TRAIN.rest.until, len: len })); } catch (e) {}
  restLoop();
  drawRestBar();
};
TRAIN.restStop = function () {
  TRAIN.rest.until = 0;
  if (TRAIN.rest.tick) { clearInterval(TRAIN.rest.tick); TRAIN.rest.tick = null; }
  try { localStorage.removeItem('train.rest'); } catch (e) {}
  drawRestBar();
};
TRAIN.restRestore = function () {
  try {
    var v = JSON.parse(localStorage.getItem('train.rest') || 'null');
    if (v && v.until) {
      TRAIN.rest.until = v.until; TRAIN.rest.len = v.len;
      /* More than ten minutes past the end is a session he walked away from. */
      if (Date.now() - v.until > 600000) return TRAIN.restStop();
      TRAIN.rest.fired = Date.now() > v.until;
      restLoop();
    }
  } catch (e) {}
  drawRestBar();
};
function restLoop() {
  if (TRAIN.rest.tick) clearInterval(TRAIN.rest.tick);
  TRAIN.rest.tick = setInterval(drawRestBar, 250);
}
function drawRestBar() {
  var bar = document.getElementById('restbar');
  if (!bar) return;
  if (!TRAIN.rest.until) { bar.style.display = 'none'; return; }
  var left = Math.round((TRAIN.rest.until - Date.now()) / 1000);
  bar.style.display = '';
  bar.className = 'restbar' + (left <= 0 ? ' over' : '');
  var pct = TRAIN.rest.len ? Math.max(0, Math.min(1, left / TRAIN.rest.len)) : 0;
  bar.querySelector('.fill').style.width = Math.round(pct * 100) + '%';
  bar.querySelector('.t').textContent = left > 0 ? fmtSecs(left) : '+' + fmtSecs(-left);
  bar.querySelector('.lbl').textContent = left > 0 ? 'REST' : 'OVER';
  if (left <= 0 && !TRAIN.rest.fired) {
    TRAIN.rest.fired = true;
    if (Rec.setting(APP.id, 'restVibrate') !== 0) Mobile.haptic('complete');
    if (Rec.setting(APP.id, 'restSound') !== 0 && window.Sfx) Sfx.play('complete', { level: 2 });
  }
}

/* ═════════════════ THE WORKOUT TIMER ═════════════════
   The start and end of the session, stored on the day's `session` row. */
TRAIN.workoutStart = function (date) {

TRAIN.workoutStop = function (date) {

  Rec.set('session', date, '', next);

};

/* ═════════════════ COMMENT, COPY, MOVE, SHARE ═════════════════ */

/* Copy every set of one day onto another, weights and reps intact. The sets
   arrive uncompleted, because copying a workout is a plan, not a claim that
   it happened. */
TRAIN.copyWorkout = function (fromDate, toDate) {
  fromDate = fromDate || TRAIN.previousWorkout(TRAIN.date);
  toDate = toDate || TRAIN.date;
  if (!fromDate) return UI.toast('there is no workout to copy', { bad: true });
  var groups = TRAIN.dayGroups(fromDate), n = 0;
  groups.forEach(function (g) {
    g.sets.forEach(function (s) {
      Rec.set('set', toDate, TRAIN.newId(), {
        ex: s.ex, kg: s.kg, r: s.r, u: s.u, done: 0, pr: 0, prf: 0,
        dist: s.dist, dur: s.dur, note: '', ord: ++n,
      });
    });
  });
  TRAIN.reindex();
  TRAIN.assertTick(toDate);
  Mobile.feedback('success');
  draw();
  UI.toast('copied <b>' + n + '</b> sets from ' + UI.esc(Day.label(fromDate)));
};

TRAIN.shareWorkout = function () {
  var date = TRAIN.date, groups = TRAIN.dayGroups(date);
  if (!groups.length) return UI.toast('no workout to share', { bad: true });
  var unit = TRAIN.unit();
  var lines = [Day.label(date)];
  var sess = Rec.get('session', date, '') || {};
  if (sess.start && sess.end) lines.push(clockOf(sess.start) + ' - ' + clockOf(sess.end) + '  ' + fmtLen(sess.start, sess.end));
  lines.push('');
  groups.forEach(function (g) {
    lines.push(g.def.name);
    g.sets.forEach(function (s, i) {
      lines.push('  ' + (i + 1) + '.  ' +
        (s.kg ? TRAIN.showWeight(s.kg, s.u) + ' ' + TRAIN.unitLabel() + ' x ' : '') +
        (s.r || 0) + ' reps' + (s.note ? '   (' + s.note + ')' : ''));
    });
    lines.push('');
  });
  var text = lines.join('\n');
  var done = function () { UI.toast('workout copied to the clipboard'); };
  if (navigator.share) {
    navigator.share({ title: 'Workout - ' + Day.label(date), text: text })
      .catch(function () { copyText(text, done); });
  } else copyText(text, done);
};
function copyText(text, then) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(then, function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); then(); } catch (e) { UI.toast('could not copy', { bad: true }); }
    document.body.removeChild(ta);
  }
}

/* ═════════════════ ROUTINES ═════════════════
   FitNotes calls them routines; the type is `program` because BLOCK already
   owns `routine`. A routine holds days, a day holds exercises, and an
   exercise can carry predefined sets. */
TRAIN.programs = function () { return Rec.map('program'); };
TRAIN.daysOf = function (progId) {
  var all = Rec.map('progday'), out = [];
  Object.keys(all).forEach(function (k) { if (all[k].program === progId) out.push({ key: k, d: all[k] }); });
  return out.sort(function (a, b) { return (a.d.ord || 0) - (b.d.ord || 0); });
};
TRAIN.exercisesOf = function (dayKey) {
  var all = Rec.map('progex'), out = [];
  Object.keys(all).forEach(function (k) { if (all[k].day === dayKey) out.push({ key: k, x: all[k] }); });
  return out.sort(function (a, b) { return (a.x.ord || 0) - (b.x.ord || 0); });
};

function drawRoutines(m) {
  var progs = TRAIN.programs();
  var keys = Object.keys(progs).sort(function (a, b) { return (progs[a].ord || 0) - (progs[b].ord || 0); });

  if (TRAIN.progOpen) return drawOneProgram(m, TRAIN.progOpen);

  if (!keys.length) {
    var e = UI.el('div', 'empty');
    e.innerHTML = 'No routines yet.<br><br>A routine is a template of a workout you do often: ' +
      'name it, add the days, and put the exercises in each day. Starting one fills the ' +
      'workout in for you.';
    m.appendChild(e);
  } else {
    var list = UI.el('div', 'plist');
    keys.forEach(function (k) {
      var days = TRAIN.daysOf(k);
      var b = UI.el('button', 'prow mb-press mb-tap');
      b.innerHTML = '<span class="nm">' + UI.esc(progs[k].name) + '</span>' +
        '<span class="sub">' + days.length + ' day' + (days.length === 1 ? '' : 's') + '</span>';
      b.onclick = function () { TRAIN.progOpen = k; draw(); };
      list.appendChild(b);
    });
    m.appendChild(list);
  }

  var add = UI.el('button', 'mb-btn mb-press mb-tap');
  add.style.width = '100%';
  add.textContent = 'CREATE NEW ROUTINE';
  add.onclick = function () {
    askName('Create New Routine', '', function (name) {
      Rec.set('program', null, TRAIN.newId(), { name: name, ord: keys.length });
      draw(); UI.toast('routine created');
    });
  };
  m.appendChild(add);
}

function drawOneProgram(m, progId) {

    var body = UI.el('div', 'sets');

    });

      var none = UI.el('div', 'empty');
      none.textContent = 'No exercises in this day yet.';
      body.appendChild(none);
    }
    var addEx = UI.el('button', 'mb-btn mb-press mb-tap');
    addEx.style.width = '100%';
    addEx.style.marginTop = 'var(--s-2)';
    addEx.textContent = '+ ADD EXERCISE';
    addEx.onclick = function () {
      TRAIN.pickInto = { day: d.key };
      TRAIN.query = '';
      TRAIN.show('picker', { cat: null });
    };
    body.appendChild(addEx);
    card.appendChild(body);
    m.appendChild(card);
  });

  var addDay = UI.el('button', 'mb-btn mb-press mb-tap');
  addDay.style.width = '100%';

      Rec.set('progday', null, TRAIN.newId(), { program: progId, name: name, ord: days.length });
      draw();
    });
  };
  m.appendChild(addDay);

  var del = UI.el('button', 'mb-btn mb-press mb-tap');
  del.style.width = '100%';
  del.textContent = 'DELETE ROUTINE';
  del.onclick = function () {
    UI.confirm('Delete <b>' + UI.esc(prog.name) + '</b>?',
      'Its days and exercises go with it. Nothing you have already logged is touched.',
      { go: 'DELETE' }).then(function (yes) {
        if (!yes) return;
        TRAIN.daysOf(progId).forEach(function (d) {
          TRAIN.exercisesOf(d.key).forEach(function (it) { Rec.del('progex', null, it.key); });
          Rec.del('progday', null, d.key);
        });
        Rec.del('program', null, progId);
        TRAIN.progOpen = null;
        draw();
        UI.toast('routine deleted');
      });
  };
  m.appendChild(del);
}

/* Put every exercise of a routine day into today, ready to be filled in. */
TRAIN.startProgramDay = function (dayKey) {
  var items = TRAIN.exercisesOf(dayKey), n = 0;
  items.forEach(function (it) {
    var sets = it.x.sets && it.x.sets.length ? it.x.sets : [{ kg: 0, r: 0 }];
    sets.forEach(function (s) {
      Rec.set('set', TRAIN.date, TRAIN.newId(), {
        ex: it.x.ex, kg: s.kg || 0, r: s.r || 0, u: s.u || TRAIN.unit(),
        done: 0, pr: 0, prf: 0, dist: s.dist || 0, dur: s.dur || 0, note: '', ord: ++n,
      });
    });
  });
  TRAIN.reindex();
  TRAIN.assertTick(TRAIN.date);
  Mobile.feedback('success');
  TRAIN.show('workout');
  UI.toast('added <b>' + items.length + '</b> exercises');
};

/* ═════════════════ GOALS ═════════════════ */
function drawGoals(m) {
  var goals = Rec.map('goal'), exs = TRAIN.exercises();
  var keys = Object.keys(goals).sort(function (a, b) { return (goals[a].ord || 0) - (goals[b].ord || 0); });

  if (!keys.length) {
    var e = UI.el('div', 'empty');
    e.innerHTML = 'No goals set.<br><br>A goal is a weight and a rep count for one exercise. ' +
      'Progress is measured against your best set, and it never goes backwards.';
    m.appendChild(e);
  }

  keys.forEach(function (k) {
    var g = goals[k], ex = exs[g.ex];
    var rec = g.ex ? TRAIN.recordsFor(g.ex) : null;
    var bestKg = rec && rec.maxWeight ? rec.maxWeight.kg : 0;
    /* Endowed progress: a bar that starts at zero is the one people abandon.
       The head start here is real, not invented — it is what he has already
       lifted, and the bar says so. */
    var pct = g.kg ? Math.max(0, Math.min(100, Math.round((bestKg / g.kg) * 100))) : 0;
    var card = UI.el('div', 'exblock');
    card.style.padding = 'var(--s-3) var(--s-4)';
    card.innerHTML =
      '<div class="lbl" style="display:flex;justify-content:space-between;gap:var(--s-3)">' +
      '<b>' + UI.esc(g.title || (ex ? ex.name : 'Goal')) + '</b>' +
      '<span class="u">' + TRAIN.showWeight(g.kg, g.u) + ' ' + TRAIN.unitLabel() +
      ' × ' + (g.r || 1) + '</span></div>' +
      '<div class="track" style="margin-top:var(--s-2)"><i style="width:' + pct + '%"></i></div>' +
      '<div class="sub">best so far <b>' + TRAIN.showWeight(bestKg, null) + ' ' +
      TRAIN.unitLabel() + '</b> · ' + pct + '%</div>';
    var del = UI.el('button', 'mb-btn mb-press mb-tap');
    del.textContent = 'DELETE';
    del.style.marginTop = 'var(--s-3)';
    del.onclick = function () { Rec.del('goal', null, k); draw(); UI.toast('goal deleted'); };
    card.appendChild(del);
    m.appendChild(card);
  });

  var add = UI.el('button', 'mb-btn mb-press mb-tap');
  add.style.width = '100%';
  add.textContent = 'ADD GOAL';
  add.onclick = function () { TRAIN.goalDialog(); };
  m.appendChild(add);
}

TRAIN.goalDialog = function () {
  var exs = TRAIN.exercises();
  var ids = Object.keys(exs).sort(function (a, b) { return exs[a].name.localeCompare(exs[b].name); });
  UI.dialog({
    title: 'ADD GOAL', width: 420,
    body: function (b, h) {
      var sel = document.createElement('select');
      sel.className = 'mb-input';
      ids.forEach(function (id) {
        var o = document.createElement('option');
        o.value = id; o.textContent = exs[id].name;
        sel.appendChild(o);
      });
      if (TRAIN.exId && exs[TRAIN.exId]) sel.value = TRAIN.exId;
      b.appendChild(UI.row('Exercise', '', sel));
      var w = UI.field('decimal', { placeholder: TRAIN.unitLabel() });
      b.appendChild(UI.row('Target weight', 'in ' + TRAIN.unitLabel(), w));
      var r = UI.field('number', { placeholder: 'reps', value: '1' });
      b.appendChild(UI.row('Reps', '', r));
      h.grab = function () { return { ex: sel.value, w: w.value, r: r.value }; };
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'ADD', kind: 'go', fn: function (h) {
        var v = h.grab();
        var kg = TRAIN.toKg(parseFloat(v.w) || 0, TRAIN.unit());
        if (!kg) { UI.toast('enter a target weight', { bad: true }); return false; }
        Rec.set('goal', null, TRAIN.newId(), {
          kind: 0, ex: v.ex, kg: kg, r: parseInt(v.r, 10) || 1, u: TRAIN.unit(),
          title: exs[v.ex] ? exs[v.ex].name : '', from: Day.today(), to: null,
          dist: 0, dur: 0, ord: Object.keys(Rec.map('goal')).length,
        });
        Mobile.feedback('success');
        draw();
        UI.toast('goal created');
      } },
    ],
  });
};

/* ═════════════════ PLATE CALCULATOR ═════════════════
   Which plates go on each side to make a number. Greedy from the heaviest
   down, which is what anyone does at the rack. */
TRAIN.plateSolve = function (targetKg, barKg) {
  var plates = (Rec.setting(APP.id, 'plates') || []).filter(function (p) { return p.on !== 0; });
  if (!plates.length) plates = [{ kg: 25 }, { kg: 20 }, { kg: 15 }, { kg: 10 }, { kg: 5 }, { kg: 2.5 }, { kg: 1.25 }];
  var perSide = (targetKg - barKg) / 2;
  if (perSide <= 0) return { ok: targetKg === barKg, used: [], left: perSide };
  var sorted = plates.slice().sort(function (a, b) { return b.kg - a.kg; });
  var used = [], rem = perSide;
  sorted.forEach(function (p) {
    var n = Math.floor((rem + 1e-6) / p.kg);
    var cap = p.n ? Math.floor(p.n / 2) : 20;
    if (n > cap) n = cap;
    if (n > 0) { used.push({ kg: p.kg, n: n }); rem -= n * p.kg; }
  });
  return { ok: Math.abs(rem) < 0.01, used: used, left: rem, perSide: perSide };
};

TRAIN.platePanel = function (prefillKg) {
  var bars = Rec.setting(APP.id, 'bars') || [{ w: 20, u: 'kg' }];
  UI.dialog({
    title: 'PLATE CALCULATOR', width: 420,
    body: function (b) {
      var unit = TRAIN.unit();
      var barKg = bars[0].u === 'lb' ? bars[0].w / LB_PER_KG : bars[0].w;
      var wrap = UI.el('div');
      var w = UI.field('decimal', {
        placeholder: 'target ' + TRAIN.unitLabel(),
        value: prefillKg ? TRAIN.showWeight(prefillKg, null) : '',
      });
      wrap.appendChild(UI.row('Target weight', 'total on the bar, in ' + TRAIN.unitLabel(), w));

      var barSel = document.createElement('select');
      barSel.className = 'mb-input';
      bars.forEach(function (bar, i) {
        var o = document.createElement('option');
        o.value = String(i);
        o.textContent = (Math.round(TRAIN.toUnit(bar.u === 'lb' ? bar.w / LB_PER_KG : bar.w, unit) * 10) / 10) +
          ' ' + TRAIN.unitLabel();
        barSel.appendChild(o);
      });
      wrap.appendChild(UI.row('Bar', 'the empty bar', barSel));

      var out = UI.el('div');
      out.style.marginTop = 'var(--s-4)';
      wrap.appendChild(out);
      b.appendChild(wrap);

      var run = function () {
        var bar = bars[parseInt(barSel.value, 10) || 0];
        barKg = bar.u === 'lb' ? bar.w / LB_PER_KG : bar.w;
        var target = TRAIN.toKg(parseFloat(w.value) || 0, unit);
        if (!target) { out.innerHTML = '<div class="empty">Enter a weight.</div>'; return; }
        var sol = TRAIN.plateSolve(target, barKg);
        if (sol.perSide <= 0) {
          out.innerHTML = '<div class="empty">That is at or below the bar on its own.</div>';
          return;
        }
        var rows = sol.used.map(function (u) {
          return '<div class="recline"><span class="k">' +
            (Math.round(TRAIN.toUnit(u.kg, unit) * 100) / 100) + ' ' + TRAIN.unitLabel() +
            '</span><span class="v">× ' + u.n + '</span><span class="d"></span></div>';
        }).join('');
        out.innerHTML = '<div class="mb-group">EACH SIDE</div>' + rows +
          (sol.ok ? '' : '<div class="empty">Closest possible — <b>' +
            (Math.round(TRAIN.toUnit(sol.left, unit) * 100) / 100) + ' ' + TRAIN.unitLabel() +
            '</b> per side short with the plates you have.</div>');
      };
      w.oninput = run; barSel.onchange = run;
      run();
    },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
};

/* ═════════════════ SMALL SHARED DIALOGS ═════════════════ */
function askName(title, value, fn) {

/* Swiping the date strip moves a day, which is how the day gets changed in
   the gym without looking at the screen. */
(function () {
  var bar = document.getElementById('datebar'), x0 = null, y0 = null;
  bar.addEventListener('touchstart', function (e) {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  bar.addEventListener('touchend', function (e) {
    if (x0 == null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx)) return;
    TRAIN.go(Day.shift(TRAIN.date, dx < 0 ? 1 : -1));
    Mobile.feedback('select');
  }, { passive: true });
})();

  }]);
};

/* ═════════════════ THE SPREADSHEET EXPORT ═════════════════
   Readable, not restorable, exactly as the master brief requires. One row per
   set is the shape a pivot table wants. */
function exportSheets() {
  var exs = TRAIN.exercises(), cats = TRAIN.cats(), unit = TRAIN.unit();
  var log = [['Date', 'Day', 'Category', 'Exercise', 'Set', 'Weight (' + unit + ')',
              'Weight (kg)', 'Reps', 'Volume (' + unit + ')', 'Distance', 'Seconds',
              'Complete', 'PR', 'Comment']];
  var dates = Object.keys(TRAIN.idx.byDate).sort();
  dates.forEach(function (d) {
    var groups = TRAIN.dayGroups(d);
    groups.forEach(function (g) {
      var cat = g.def.cat ? cats[g.def.cat] : null;
      g.sets.forEach(function (s, i) {
        log.push([d, new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
          cat ? cat.name : '', g.def.name, i + 1,
          Math.round(TRAIN.toUnit(s.kg || 0, unit) * 100) / 100,
          Math.round((s.kg || 0) * 1000) / 1000,
          s.r || 0,
          Math.round(TRAIN.toUnit((s.kg || 0) * (s.r || 0), unit) * 10) / 10,
          s.dist || '', s.dur || '', s.done ? 'yes' : '', s.pr ? 'PR' : '', s.note || '']);
      });
    });
  });

  var days = [['Date', 'Day', 'Exercises', 'Sets', 'Reps', 'Volume (' + unit + ')',
               'Start', 'End', 'Minutes', 'Comment']];
  dates.forEach(function (d) {
    var sets = TRAIN.setsOn(d), sess = Rec.get('session', d, '') || {};
    var reps = 0, vol = 0, ex = {};
    sets.forEach(function (s) { reps += s.r || 0; vol += (s.kg || 0) * (s.r || 0); ex[s.ex] = 1; });
    var mins = sess.start && sess.end
      ? Math.floor((Date.parse(sess.end) - Date.parse(sess.start)) / 60000) : '';
    days.push([d, new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
      Object.keys(ex).length, sets.length, reps,
      Math.round(TRAIN.toUnit(vol, unit)), sess.start ? clockOf(sess.start) : '',
      sess.end ? clockOf(sess.end) : '', mins, sess.note || '']);
  });

  var records = [['Exercise', 'Category', 'Workouts', 'Sets', 'Max weight (' + unit + ')',
                  'On', 'Max reps', 'Est 1RM (' + unit + ')']];
  Object.keys(exs).forEach(function (id) {
    var r = TRAIN.recordsFor(id);
    if (!r.sets) return;
    var cat = exs[id].cat ? cats[exs[id].cat] : null;
    records.push([exs[id].name, cat ? cat.name : '', r.workouts, r.sets,
      r.maxWeight ? Math.round(TRAIN.toUnit(r.maxWeight.kg, unit) * 10) / 10 : '',
      r.maxWeight ? r.maxWeight.date : '',
      r.maxReps ? r.maxReps.r : '',
      r.max1rm ? Math.round(TRAIN.toUnit(TRAIN.e1rm(r.max1rm.kg, r.max1rm.r), unit) * 10) / 10 : '']);
  });

  return [
    { name: 'Log', rows: log, widths: [11, 5, 12, 26, 5, 11, 11, 6, 11, 8, 8, 9, 5, 30] },
    { name: 'Workouts', rows: days, widths: [11, 5, 10, 6, 6, 12, 7, 7, 8, 30] },
    { name: 'Records', rows: records, widths: [26, 12, 9, 6, 14, 11, 9, 14] },
  ];
}

/* ═══════════════════ BOOT ═══════════════════ */
function boot() {
  TRAIN.reindex();
  TRAIN.restRestore();
  draw();
  if (!Rec.setting(APP.id, 'seen') && !Rec.count('set')) {
    Rec.setting(APP.id, 'seen', 1);
    setTimeout(TRAIN.firstRun, 400);
  }
}

Rec.ready(boot);
Rec.on(function () {
  if (TRAIN.importing) return;      /* the importer redraws once, at the end */
  TRAIN.reindex();
  draw();
});
Day.on(draw);

/* The rest timer is wall-clock, so coming back to a suspended tab has to
   recompute rather than resume. */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { TRAIN.restRestore(); drawRestBar(); }
});
document.getElementById('restbar').onclick = function () {
  var left = Math.round((TRAIN.rest.until - Date.now()) / 1000);
  UI.menu(innerWidth - 12, 96, [
    { label: left > 0 ? 'Add 30 seconds' : 'Restart', fn: function () {
      if (left > 0) { TRAIN.rest.until += 30000; TRAIN.rest.fired = false; drawRestBar(); }
      else TRAIN.restStart(TRAIN.rest.len);
    } },
    { label: 'Stop timer', fn: function () { TRAIN.restStop(); } },
  ], { title: 'REST TIMER' });
};

TRAIN.reindex();
draw();
