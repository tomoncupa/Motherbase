/* ═════════════════════════════════════════════════════════════════════════
   THE NUMBERS
   Estimated one-rep max, personal records, and totals over a period. All of
   it computed from the index, all of it in kilograms, converted only when it
   is printed.
   ═════════════════════════════════════════════════════════════════════════ */

/* Brzycki, which is what FitNotes uses. It falls apart at high rep counts,
   which is why the app lets you cap the reps that count towards it. */
/* Reps may carry a fraction: a half rep is 8.5 (Tom, 2026-09-25: "let it
   add fractions for reps"). Kept to two places, so stepping and adding up
   never print 9.499999. A comma is read as the point. */
TRAIN.readReps = function (v) {
  var n = parseFloat(String(v == null ? '' : v).replace(',', '.'));
  return isNaN(n) ? NaN : Math.round(n * 100) / 100;
};
TRAIN.showReps = function (n) { return String(Math.round((+n || 0) * 100) / 100); };
TRAIN.e1rm = function (kg, reps) {
  if (!kg || !reps) return 0;
  var cap = Rec.setting(APP.id, 'e1rmMaxReps') || 0;
  if (cap && reps > cap) return 0;
  if (reps >= 37) return 0;
  return kg * 36 / (37 - reps);
};

/* ── personal records, as FitNotes decides them ──
   Read off his own file rather than guessed. A set is a record while nothing
   has ever been heavier at that many reps or more. Ties go to more reps, then
   to the earlier set. So a record can stop being one, which is why this walks
   the whole exercise rather than asking whether the newest set was heaviest:
   "heavier than anything before it" flagged 819 of his sets and agreed with
   FitNotes on 263.

   Weights are compared at 3 decimal places. Old FitNotes versions
   stored the same 500 lb as two floats a millionth apart, and at two places a
   22.05 lb set drifted into a tie with a 10 kg one that FitNotes had told
   apart. Checked 2026-09-14 against his 12,370 sets and FitNotes' own flags.

   A warmup is never a record. */
TRAIN.PR_SCALE = 1000;
TRAIN.recomputePRs = function (only) {
  var exs = TRAIN.exercises(), changed = 0;
  var ids = only && only.length ? only.filter(function (id) { return exs[id]; }) : Object.keys(exs);
  var rd = function (kg) { return Math.round((kg || 0) * TRAIN.PR_SCALE) / TRAIN.PR_SCALE; };
  ids.forEach(function (id) {
    var list = TRAIN.historyOf(id);
    var work = list.filter(function (x) { return !x.warm && (x.kg || 0) > 0 && (x.r || 0) > 0; })
      .sort(function (a, b) {
        return rd(b.kg) - rd(a.kg) || b.r - a.r ||
          (a.date < b.date ? -1 : a.date > b.date ? 1 : TRAIN.setStamp(a) - TRAIN.setStamp(b));
      });
    /* Heaviest first: a set is beaten exactly when something ahead of it in
       this order has at least as many reps.

       Split sets and straight sets are two separate lists of records (Tom,
       2026-09-14). Ten reps with a rest in the middle is not ten reps, so a
       split set can neither take a straight record nor lose one to it. This
       is where TRAIN stops agreeing with FitNotes' own 537 flags. */
    var isPr = {};
    [false, true].forEach(function (split) {
      var maxR = 0;
      work.forEach(function (x) {
        if (!!x.split !== split) return;
        if (x.r > maxR) { isPr[x.key] = 1; maxR = x.r; }
      });
    });
    list.forEach(function (x) {
      var want = isPr[x.key] ? 1 : 0;
      if ((x.pr || 0) !== want) {
        /* patchRow, not patchSet: patchSet reindexes every set after each
           change, and a recalculation can change thousands. */
        TRAIN.patchRow('set', x.date, x.key, { pr: want });
        changed++;
      }
    });
  });
  if (changed) TRAIN.reindex();
  return changed;
};

/* Everything the Records screen shows for one exercise. */
TRAIN.recordsFor = function (exId, range) {
  range = range || {};
  var hist = TRAIN.historyOf(exId);
  /* Working sets, not every set. hist.length counted the warmups, which made
     "sets" on the records screen disagree with "sets" everywhere else.

     `range` is a training block's dates, whose records start again. Split
     sets count as sets and keep records of their own, under `split`: an
     estimated 1RM off ten reps with a rest in them would overstate the lift. */
  var r = { maxWeight: null, maxReps: null, maxVolume: null, max1rm: null,
            byReps: {}, sets: 0, workouts: 0,
            split: { maxWeight: null, byReps: {}, sets: 0 } };
  var days = {};
  hist.forEach(function (s) {
    if (s.warm) return;              /* warmups are not records and not volume */
    if ((range.from && s.date < range.from) || (range.to && s.date > range.to)) return;
    r.sets++;
    days[s.date] = 1;
    if (s.split) {
      r.split.sets++;
      if (s.kg > 0 && (!r.split.maxWeight || s.kg > r.split.maxWeight.kg)) r.split.maxWeight = s;
      if (s.kg > 0 && s.r >= 1 && (!r.split.byReps[Math.floor(s.r)] || s.kg > r.split.byReps[Math.floor(s.r)].kg)) r.split.byReps[Math.floor(s.r)] = s;
      return;
    }
    var vol = (s.kg || 0) * (s.r || 0), e = TRAIN.e1rm(s.kg, s.r);
    if (s.kg > 0 && (!r.maxWeight || s.kg > r.maxWeight.kg)) r.maxWeight = s;
    if (s.r > 0 && (!r.maxReps || s.r > r.maxReps.r)) r.maxReps = s;
    if (vol > 0 && (!r.maxVolume || vol > (r.maxVolume.kg * r.maxVolume.r))) r.maxVolume = s;
    if (e > 0 && (!r.max1rm || e > TRAIN.e1rm(r.max1rm.kg, r.max1rm.r))) r.max1rm = s;
    if (s.r >= 1 && s.kg > 0 && (!r.byReps[Math.floor(s.r)] || s.kg > r.byReps[Math.floor(s.r)].kg)) r.byReps[Math.floor(s.r)] = s;
  });
  r.workouts = Object.keys(days).length;
  return r;
};

/* Totals over a window, grouped however the Analysis screen asks. */
/* ── the summary, and what counts toward it ──
   Two things changed here on 2026-09-05, both his.

   WARMUPS ARE NOT WORK. Three empty-bar sets before a heavy triple used to
   add three sets and their volume to your chest total, which made the number
   a count of how much you touched a bar rather than how much you worked.

   A MOVEMENT CAN WORK MORE THAN ONE GROUP. "One set of pull ups as 1/2 a set
   of biceps." So a set adds one to its own group and a fraction to each group
   the exercise says it also works. Volume follows the same fraction, because
   half a set of biceps did half the work.

   Sets can be fractional now. That is the honest shape: pretending a pull-up
   gives biceps a whole set or none of one is the thing that made the number
   not mean anything. */
TRAIN.breakdown = function (from, to, by) {
  var exs = TRAIN.exercises(), cats = TRAIN.cats(), out = {}, days = {};
  Object.keys(TRAIN.idx.byDate).forEach(function (d) {
    if (d < from || d > to) return;
    TRAIN.idx.byDate[d].forEach(function (s) {
      if (s.warm || !TRAIN.counts(s)) return;
      var ex = exs[s.ex];
      var vol = (s.kg || 0) * (s.r || 0);
      var put = function (key, share) {
        var o = out[key] || (out[key] = { sets: 0, reps: 0, vol: 0, days: {} });
        o.sets += share; o.reps += (s.r || 0) * share; o.vol += vol * share;
        o.days[d] = 1;
      };
      if (by === 'category') {
        put(ex && ex.cat ? ex.cat : '?', 1);
        var also = (ex && ex.also) || null;
        if (also) Object.keys(also).forEach(function (c) {
          if (cats[c] && c !== (ex && ex.cat)) put(c, +also[c] || 0);
        });
      } else {
        put(s.ex, 1);
      }
      days[d] = 1;
    });
  });
  var rows = Object.keys(out).map(function (k) {
    var o = out[k];
    var name = by === 'category'
      ? (cats[k] ? cats[k].name : 'Uncategorised')
      : (exs[k] ? exs[k].name : k);
    /* A whole number stays whole; a half set shows as a half. */
    return { key: k, name: name, sets: Math.round(o.sets * 10) / 10,
             reps: Math.round(o.reps), vol: o.vol,
             workouts: Object.keys(o.days).length,
             slot: by === 'category' && cats[k] ? cats[k].slot : null };
  });
  rows.sort(function (a, b) { return b.vol - a.vol || b.sets - a.sets; });
  return { rows: rows, workouts: Object.keys(days).length };
};

TRAIN.weekStartDow = function () {
  var v = Rec.setting(APP.id, 'weekStart');
  return v === 2 ? 1 : v === 7 ? 6 : 0;
};

TRAIN.PERIODS = [
  { id: '1m', name: '1 MONTH', days: 30 },
  { id: '3m', name: '3 MONTHS', days: 91 },
  { id: '6m', name: '6 MONTHS', days: 182 },
  { id: '1y', name: '1 YEAR', days: 365 },
  { id: 'all', name: 'ALL', days: 0 },
];
TRAIN.periodRange = function (id) {
  var p = TRAIN.PERIODS.filter(function (x) { return x.id === id; })[0] || TRAIN.PERIODS[1];
  var to = Day.today();
  if (!p.days) {
    var all = Object.keys(TRAIN.idx.byDate).sort();
    return { from: all[0] || to, to: to };
  }
  return { from: Day.shift(to, -(p.days - 1)), to: to };
};

/* ═════════════════ THE CALENDAR ═════════════════
   A month grid with a dot per muscle group trained that day, and the total
   workout count underneath — the number FitNotes puts at the foot of the
   screen and the one that says "631 workouts" on his phone. */
function drawCalendar(m) {
  var cats = TRAIN.cats(), exs = TRAIN.exercises(), today = Day.today();
  var pick = TRAIN.calPick;
  if (pick) {
    var ban = UI.el('div', 'calbanner');
    ban.textContent = pick.title;
    m.appendChild(ban);
  }

  /* FitNotes filters which categories the calendar shows. */
  var filt = TRAIN.calFilter || null;
  var chips = UI.el('div', CHIPS);
  [{ k: null, n: 'All' }].concat(TRAIN.catsSorted().map(function (k) { return { k: k, n: cats[k].name }; }))
    .forEach(function (c) {
      var b = UI.el('button', CHIP + ' mb-press mb-tap' + (filt === c.k ? ' on' : ''));
      b.textContent = c.n;
      b.onclick = function () { TRAIN.calFilter = c.k; draw(); };
      chips.appendChild(b);
    });
  m.appendChild(chips);

  var count = 0, dayHas = {};
  Object.keys(TRAIN.idx.byDate).forEach(function (d) {
    var slots = [], hit = false;
    TRAIN.idx.byDate[d].forEach(function (s) {
      var ex = exs[s.ex];
      if (filt && (!ex || ex.cat !== filt)) return;
      hit = true;
      var c = ex && ex.cat ? cats[ex.cat] : null;
      if (c && slots.indexOf(c.slot) < 0) slots.push(c.slot);
    });
    if (hit) { count++; dayHas[d] = slots; }
  });

  var end = today.slice(0, 7);
  var focus = TRAIN.calMonth || TRAIN.date.slice(0, 7);
  var months = Math.max(TRAIN.calMonths || 12, monthsBetween(focus, end) + 3);
  var startMonth = shiftMonth(end, -(months - 1));
  var firstData = Object.keys(dayHas).sort()[0];
  if (firstData && firstData.slice(0, 7) < startMonth) {
    var earlier = UI.el('button', 'mb-btn mb-press mb-tap');
    earlier.style.width = '100%';
    earlier.textContent = 'EARLIER';
    earlier.onclick = function () { TRAIN.calMonths = months + 12; TRAIN.calMonth = startMonth; draw(); };
    m.appendChild(earlier);
  }

  var ws = TRAIN.weekStartDow();
  var names = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  for (var mo = startMonth; mo <= end; mo = shiftMonth(mo, 1)) {
    var sec = UI.el('div', 'calmonth');
    sec.dataset.month = mo;
    var first = new Date(mo + '-01T12:00:00');
    var title = UI.el('div', 'caltitle');
    title.textContent = first.toLocaleDateString(undefined, { month: 'long' }).toUpperCase() + ' ' + first.getFullYear();
    sec.appendChild(title);
    var grid = UI.el('div', 'calgrid');
    for (var i = 0; i < 7; i++) {
      var hd = UI.el('div', 'caldow');
      hd.textContent = names[(i + ws) % 7];
      grid.appendChild(hd);
    }
    var lead = (first.getDay() - ws + 7) % 7;
    for (var b2 = 0; b2 < lead; b2++) grid.appendChild(UI.el('div', 'calcell empty'));
    var last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    for (var dn = 1; dn <= last; dn++) {
      var iso = mo + '-' + String(dn).padStart(2, '0');
      var cell = UI.el('button', 'calcell mb-press mb-tap' + (iso === TRAIN.date && !pick ? ' sel' : '') +
        (iso === today ? ' today' : '') + (iso > today ? ' future' : ''));
      var dots = (dayHas[iso] || []).slice(0, 4).map(function (sl) {
        return '<i style="background:' + TRAIN.slotColor(sl) + '"></i>';
      }).join('');
      cell.innerHTML = '<span class="n">' + dn + '</span><span class="dots">' + dots + '</span>';
      (function (d) {
        cell.onclick = function () {
          if (d > today) return;
          Mobile.feedback('select');
          if (pick) {
            TRAIN.calPick = null;
            TRAIN.show(pick.back && pick.back !== 'calendar' ? pick.back : 'workout');
            pick.fn(d);
            return;
          }
          TRAIN.date = d;
          TRAIN.show('workout');
        };
      })(iso);
      grid.appendChild(cell);
    }
    sec.appendChild(grid);
    m.appendChild(sec);
  }

  var foot = UI.el('div', 'calcount');
  var back = UI.el('button', 'ico mb-press mb-tap');
  back.innerHTML = ico('back'); back.setAttribute('aria-label', 'Previous month');
  var fwd = UI.el('button', 'ico mb-press mb-tap');
  fwd.innerHTML = ico('next'); fwd.setAttribute('aria-label', 'Next month');
  var n = UI.el('span', 'n');
  n.innerHTML = '<b>' + count.toLocaleString() + '</b> SESSIONS';
  var jump = function (dir) {
    var nextM = shiftMonth(TRAIN.calMonth || focus, dir);
    if (nextM > end) return;
    TRAIN.calMonth = nextM;
    if (nextM < startMonth) { TRAIN.calMonths = months + 12; draw(); return; }
    var el = m.querySelector('[data-month="' + nextM + '"]');
    if (el) el.scrollIntoView({ block: 'start' });
  };
  back.onclick = function () { jump(-1); };
  fwd.onclick = function () { jump(1); };
  foot.appendChild(back); foot.appendChild(n); foot.appendChild(fwd);
  m.appendChild(foot);

  /* Open on the month of the day on screen, not the top of the list. */
  setTimeout(function () {
    var el = m.querySelector('[data-month="' + focus + '"]');
    if (el) el.scrollIntoView({ block: 'start' });
  }, 0);
}
function monthsBetween(a, b) {
  return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
}
function shiftMonth(ym, n) {
  var d = new Date(ym + '-01T12:00:00');
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

/* FitNotes' rep max grid: for each exercise, the heaviest set at each rep

function drawRepMax(m) {
  var exs = TRAIN.exercises(), est = TRAIN.rmEst === 1, favOnly = TRAIN.rmFav === 1, rr = TRAIN.recRange();

  var box = UI.el('div', 'search');

  input.oninput = function () {
    TRAIN.recQuery = input.value;
    var pos = input.selectionStart;
    draw();
    var live = document.querySelector('.search input');
    if (live) { live.focus(); live.setSelectionRange(pos, pos); }

  box.appendChild(input);

  var rows = Object.keys(exs).map(function (id) {
      return { id: id, e: exs[id], sc: q ? TRAIN.nameMatch(exs[id].name, q) : 0 };
    })
    .filter(function (x) {
      if (favOnly && !x.e.fav) return false;

      return TRAIN.historyOf(x.id).some(function (s) {

    more.textContent = 'SHOW MORE (' + (rows.length - lim) + ')';
    more.onclick = function () { TRAIN.rmLimit = lim + 40; draw(); };
    m.appendChild(more);
  }
}

/* ═════════════════════════════════════════════════════════════════════════
   THE REST TIMER

   This is the one place TRAIN is worse than FitNotes and it cannot be fixed
   from a page in a browser: a backgrounded tab is suspended, so the timer
   will not buzz in his pocket.

   It therefore recovers rather than pretends. The moment it started is
   written down, and the elapsed time is always recomputed from the clock. If
   he comes back after two minutes away it says he is forty seconds over,
   instead of resuming from wherever it froze. A timer that silently stopped
   counting is worse than no timer.
   ═════════════════════════════════════════════════════════════════════════ */
TRAIN.rest = { until: 0, len: 0, tick: null, fired: false };

TRAIN.restStart = function (seconds) {
  var len = seconds || Rec.setting(APP.id, 'restSeconds') || 120;
  TRAIN.rest.len = len;
  TRAIN.rest.until = Date.now() + len * 1000;
  TRAIN.rest.fired = false;
  Rec.setting(APP.id, 'rest', { until: TRAIN.rest.until, len: len });
  restLoop();
  drawRestBar();
};
TRAIN.restStop = function () {
  TRAIN.rest.until = 0;
  if (TRAIN.rest.tick) { clearInterval(TRAIN.rest.tick); TRAIN.rest.tick = null; }
  if (Rec.setting(APP.id, 'rest')) Rec.setting(APP.id, 'rest', null);
  drawRestBar();
};
TRAIN.restRestore = function () {
  try {
    var v = Rec.setting(APP.id, 'rest');
    if (v && v.until) {
      TRAIN.rest.until = v.until; TRAIN.rest.len = v.len;
      /* More than ten minutes past the end is a session he walked away from. */
      if (Date.now() - v.until > 600000) return TRAIN.restStop();
      TRAIN.rest.fired = Date.now() > v.until;
      restLoop();
    }
  } catch (e) {}
  drawRestBar();
};
function restLoop() {
  if (TRAIN.rest.tick) clearInterval(TRAIN.rest.tick);
  TRAIN.rest.tick = setInterval(drawRestBar, 250);
}
/* This runs four times a second, so it rebuilds nothing unless the chip has
   just come or gone. The chip takes the rest timer button's place rather than
   standing beside it, which is what keeps the bar the same width and the
   exercise name the same size while he rests. */
function drawRestBar() {
  var chip = document.getElementById('restchip');
  if (!chip) return;
  var on = !!TRAIN.rest.until, was = chip.dataset.on === '1';
  if (on !== was) {
    chip.dataset.on = on ? '1' : '';
    chip.style.display = on ? '' : 'none';
    if (on) chip.innerHTML = '<span class="fill"></span><span class="t"></span>';
    var tb = document.getElementById('timerBtn');
    if (tb && TRAIN.screen === 'training') tb.style.display = on ? 'none' : '';
    var logo = document.querySelector('.logo');
    if (logo && logo.style.flex) fitTitle(logo);
  }
  if (!on) return;
  var left = Math.round((TRAIN.rest.until - Date.now()) / 1000);
  /* Tom, 2026-09-24: "I don't want to see the over timer in TRAIN." Rest is
     over, so the chip has nothing left to say: it rings once and goes, and
     the timer button comes back in its place. The clock is still what decides
     it, which is the part that mattered — a tab that was suspended past the
     end comes back, rings and clears rather than resuming where it froze. */
  if (left <= 0) {
    if (!TRAIN.rest.fired) {
      TRAIN.rest.fired = true;
      if (Rec.setting(APP.id, 'restVibrate') !== 0) Mobile.haptic('complete');
      if (Rec.setting(APP.id, 'restSound') !== 0 && window.Sfx) Sfx.play('complete', { level: 2 });
    }
    TRAIN.restStop();
    return;
  }
  var pct = TRAIN.rest.len ? Math.max(0, Math.min(1, left / TRAIN.rest.len)) : 0;
  chip.querySelector('.fill').style.width = Math.round(pct * 100) + '%';
  chip.querySelector('.t').textContent = fmtSecs(left);
}

/* ═════════════════ THE WORKOUT TIMER ═════════════════
   The start and end of the session, stored on the day's `session` row. */
TRAIN.workoutStart = function (date) {

  if (s.start) return s;
  return TRAIN.patchSession(date, { start: new Date().toISOString() });
};
TRAIN.workoutStop = function (date) {
  var s = Rec.get('session', date, '') || {};
  if (!s.start) return null;
  return TRAIN.patchSession(date, { end: new Date().toISOString() });
};

      };

      }
      b.appendChild(row);
    },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
};

/* ═════════════════ COMMENT, COPY, MOVE, SHARE ═════════════════ */
TRAIN.commentWorkout = function () {
  var date = TRAIN.date, s = Rec.get('session', date, '') || {};
  UI.dialog({
    title: 'COMMENT SESSION', width: 420, focus: true,
    body: function (b, h) {
      var i = UI.field('note', { value: s.note || '', placeholder: 'Comment Text ...', rows: 4 });
      b.appendChild(i);
      Mobile.form(b, function () { save(h, i); });
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: function (h) { save(h, h.body.querySelector('textarea')); return false; } },
    ],
  });
  function save(h, i) {
    TRAIN.patchSession(date, { note: (i.value || '').trim() });
    h.close(); Mobile.feedback('success'); draw();
    UI.toast('comment saved');
  }

/* Copy every set of one day onto another, weights and reps intact. The sets
   arrive uncompleted, because copying a workout is a plan, not a claim that
   it happened. */
TRAIN.copyWorkout = function (fromDate, toDate) {
  fromDate = fromDate || TRAIN.previousWorkout(TRAIN.date);
  toDate = toDate || TRAIN.date;
  if (!fromDate) return UI.toast('There is no session to copy', { bad: true });
  var n = TRAIN.copyDay(fromDate, toDate, { comments: 0, supersets: 1, note: 0, time: 0 });
  Mobile.feedback('success');
  draw();
  UI.toast('Copied ' + n + ' sets from ' + UI.esc(Day.label(fromDate)));
};

/* Whether a repeated session was stronger is answered set by set now, in
   "how much stronger, set by set" further down. The old answer here compared
   only the top set of each exercise, and only on a copied day. */

/* A signed weight in the unit on screen. The delta is a difference between two
   kilogram figures, so it converts as a quantity — never by running each side
   through showWeight and subtracting the printed strings. */
TRAIN.showDelta = function (kg, ex) {
  var v = TRAIN.toUnit(Math.abs(kg), TRAIN.unit(ex));
  var t = (Math.round(v * 10) / 10).toFixed(1);
  return (kg >= 0 ? '+' : '−') + t;
};

TRAIN.shareWorkout = function () {
  var date = TRAIN.date, groups = TRAIN.dayGroups(date);
  if (!groups.length) return UI.toast('There is no session to share', { bad: true });
  var lines = [Day.label(date)];
  var sess = Rec.get('session', date, '') || {};
  if (sess.start && sess.end) lines.push(clockOf(sess.start) + ' - ' + clockOf(sess.end) + '  ' + fmtLen(sess.start, sess.end));
  lines.push('');
  groups.forEach(function (g) {
    lines.push(g.def.name);
    g.sets.forEach(function (s, i) {
      lines.push('  ' + (i + 1) + '.  ' +
        (s.kg ? TRAIN.showWeight(s.kg, s.u, g.ex) + ' ' + TRAIN.unitLabel(g.ex) + ' x ' : '') +
        (s.r || 0) + ' reps' + (s.note ? '   (' + s.note + ')' : ''));
    });
    lines.push('');
  });
  var text = lines.join('\n');
  var done = function () { UI.toast('Session copied to the clipboard'); };
  if (navigator.share) {
    navigator.share({ title: 'Training - ' + Day.label(date), text: text })
      .catch(function () { copyText(text, done); });
  } else copyText(text, done);
};
function copyText(text, then) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(then, function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); then(); } catch (e) { UI.toast('could not copy', { bad: true }); }
    document.body.removeChild(ta);
  }
}

/* ═════════════════ ROUTINES ═════════════════
   FitNotes calls them routines; the type is `program` because BLOCK already
   owns `routine`. A routine holds days, a day holds exercises, and an
   exercise can carry predefined sets. */
TRAIN.programs = function () { return Rec.map('program'); };
TRAIN.daysOf = function (progId) {
  var all = Rec.map('progday'), out = [];
  Object.keys(all).forEach(function (k) { if (all[k].program === progId) out.push({ key: k, d: all[k] }); });
  return out.sort(function (a, b) { return (a.d.ord || 0) - (b.d.ord || 0); });
};
TRAIN.exercisesOf = function (dayKey) {
  var all = Rec.map('progex'), out = [];
  Object.keys(all).forEach(function (k) { if (all[k].day === dayKey) out.push({ key: k, x: all[k] }); });
  return out.sort(function (a, b) { return (a.x.ord || 0) - (b.x.ord || 0); });
};

/* ── named sessions ──
   Tom, 2026-09-25: "I should see named days in Training Routines." His
   FitNotes never held a routine; the days he repeats are the sessions he
   names, and a name is already how TRAIN knows a repeat. So every name he has
   given a day with sets in it is listed here with the last time it was done,
   most recent first. The day on screen is left out of "last time", so the
   day he is filling can offer the one before it. */
TRAIN.namedSessions = function (except) {
  var by = {};
  Rec.all('session').forEach(function (r) {
    var nm = r.payload && String(r.payload.name || '').trim();
    if (!nm || r.date === except || !TRAIN.setsOn(r.date).length) return;
    var k = nm.toLowerCase(), x = by[k] || (by[k] = { name: nm, last: '', times: 0 });
    x.times++;
    if (r.date > x.last) { x.last = r.date; x.name = nm; }
  });
  return Object.keys(by).map(function (k) { return by[k]; })
    .sort(function (a, b) { return a.last < b.last ? 1 : a.last > b.last ? -1 : 0; });
};

/* Copy a named session's last day into the day on screen, name and all, the
   way Copy Past Session does. Twice onto one day would double every set. */
TRAIN.startNamed = function (x) {
  var date = TRAIN.date;
  TRAIN.show('workout');
  if ((Rec.get('session', date, '') || {}).from === x.last) return UI.toast('Already copied from ' + UI.esc(Day.label(x.last)));
  TRAIN.copyWorkout(x.last, date);
};

function drawOneProgram(m, progId) {
  var prog = TRAIN.programs()[progId];
  if (!prog) { TRAIN.progOpen = null; return draw(); }
  var days = TRAIN.daysOf(progId), exs = TRAIN.exercises();

  if (!days.length) {
    var e = UI.el('div', 'empty');
    e.textContent = "You haven't added any days yet";
    m.appendChild(e);
  }

  /* Hold a day to move it, or an exercise inside a day to move that. */
  var daylist = UI.el('div', 'exlist');
  m.appendChild(daylist);
  holdToMove(daylist, {
    item: '.exblock',
    menu: function (row, e) { TRAIN.progdayMenu(progId, row.dataset.key, e); },
    drop: function (order) { TRAIN.writeOrd('progday', null, order); draw(); },
  });

  days.forEach(function (d) {
    var items = TRAIN.exercisesOf(d.key);
    var card = UI.el('div', 'exblock');
    card.dataset.key = d.key;
    var head = UI.el('div', 'head');
    head.innerHTML = '<span class="nm">' + UI.esc(d.d.name) + '</span>';
    var logAll = UI.el('button', 'mb-btn nohold mb-press mb-tap');
    logAll.textContent = 'LOG ALL';
    logAll.onclick = function (ev) { ev.stopPropagation(); TRAIN.startProgramDay(d.key); };
    head.appendChild(logAll);
    head.appendChild(rowMenuBtn('Options for ' + d.d.name, function (ev) { TRAIN.progdayMenu(progId, d.key, ev); }));
    card.appendChild(head);

    var box = UI.el('div');
    holdToMove(box, {
      item: '.prow',
      menu: function (row, e) { TRAIN.progexMenu(d.key, row.dataset.key, e); },
      drop: function (order) { TRAIN.writeOrd('progex', null, order); draw(); },
    });
    items.forEach(function (it) {
      var ex = exs[it.x.ex];
      var fill = it.x.fill | 0;
      /* an open slot nobody has picked for yet: its pattern, and a tap
         opens the list to pick one, narrowed to its muscle group when it
         names one */
      if (!ex && it.x.slot) {
        var srow = UI.el('div', 'prow');
        var smain = UI.el('button', 'pmain mb-press');
        var ssub = TRAIN.planText(it.x.plan, (it.x.sets || [])[0]);
        smain.innerHTML = '<span class="nm"><i>Any ' + UI.esc(it.x.slot.label) + '</i></span>' +
          '<span class="sub">' + UI.esc((ssub ? ssub + ' · ' : '') + 'tap to pick') + '</span>';
        smain.onclick = function () { TRAIN.pickForSlot(d.key, it.key); };
        withMenu(smain, function (ev) { TRAIN.progexMenu(d.key, it.key, ev); });
        srow.appendChild(smain);
        srow.appendChild(rowMenuBtn('Options for any ' + it.x.slot.label, function (ev) { TRAIN.progexMenu(d.key, it.key, ev); }));
        box.appendChild(srow);
        return;
      }
      var sub = it.x.plan ? TRAIN.planText(it.x.plan, (it.x.sets || [])[0])
        : fill === 2 ? ((it.x.sets || []).length + ' sets') : fill === 1 ? 'previous sets' : '';
      var row = UI.el('div', 'prow');
      row.dataset.key = it.key;
      var main = UI.el('button', 'pmain mb-press');
      main.innerHTML = '<span class="nm">' + UI.esc(ex ? ex.name : 'Deleted exercise') + '</span>' +
        (sub ? '<span class="sub">' + sub + '</span>' : '');
      main.onclick = function () {
        if (!ex) return UI.toast('No exercise selected', { bad: true });
        TRAIN.logFromRoutine(it.key);
      };
      row.appendChild(main);
      row.appendChild(rowMenuBtn('Options for ' + (ex ? ex.name : 'exercise'), function (ev) {
        TRAIN.progexMenu(d.key, it.key, ev);
      }));
      box.appendChild(row);
    });
    if (!items.length) {
      var none = UI.el('div', 'empty pad');
      none.textContent = 'No exercises';
      box.appendChild(none);
    }
    var addEx = UI.el('button', 'mb-btn nohold mb-press mb-tap');
    addEx.style.width = '100%';
    addEx.textContent = '+ ADD EXERCISE';
    addEx.onclick = function () {
      TRAIN.pickInto = { day: d.key };
      TRAIN.query = '';
      TRAIN.show('picker', { cat: null });
    };
    box.appendChild(addEx);
    card.appendChild(box);
    daylist.appendChild(card);
  });

  var addDay = UI.el('button', 'mb-btn mb-press mb-tap');

  addDay.onclick = function () {

  var opts = UI.el('button', 'mb-btn mb-press mb-tap');
  opts.style.width = '100%';
  opts.textContent = 'ROUTINE OPTIONS';
  opts.onclick = function (ev) { TRAIN.programMenu(progId, ev); };
  m.appendChild(opts);
}

/* Put every exercise of a routine day into today, ready to be filled in. */
/* The coach's target for what is being logged today, remembered when it is
   started from a routine, so the training screen can show it beside last
   time. One setting, today's only, and a client profile opened from COACH
   keeps its own so it never shows on Tom's. */
TRAIN.planKey = function () { return CLIENT ? 'coachPlan.' + CLIENT : 'coachPlan'; };
TRAIN.rememberPlan = function (date, items) {
  var cur = Rec.setting(APP.id, TRAIN.planKey());
  var ex = cur && cur.date === date ? cur.ex || {} : {}, any = false;
  items.forEach(function (px) {
    if (!px || !px.plan) return;
    ex[px.ex] = TRAIN.planText(px.plan, (px.sets || [])[0]);
    any = true;
  });
  if (any) Rec.setting(APP.id, TRAIN.planKey(), { date: date, ex: ex });
};
TRAIN.planFor = function (date, exId) {
  var cur = Rec.setting(APP.id, TRAIN.planKey());
  return cur && cur.date === date && cur.ex ? cur.ex[exId] || '' : '';
};
TRAIN.pickForSlot = function (dayKey, key) {
  var px = Rec.get('progex', null, key);
  if (!px || !px.slot) return;
  var cat = null, cats = TRAIN.cats();
  if (px.slot.mus) Object.keys(cats).forEach(function (k) {
    if (String(cats[k].name || '').toLowerCase() === String(px.slot.mus).toLowerCase()) cat = k;
  });
  TRAIN.pickInto = { day: dayKey, slot: key, label: px.slot.label };
  TRAIN.query = '';
  TRAIN.show('picker', { cat: cat });
};
TRAIN.startProgramDay = function (dayKey) {
  /* an open slot with nothing picked is left out: there is no exercise to
     fill in yet, and it stays on the routine to be picked */
  var items = TRAIN.exercisesOf(dayKey).filter(function (it) { return !!it.x.ex; }), date = TRAIN.date, order = [], made = 0;
  TRAIN.rememberPlan(date, items.map(function (it) { return it.x; }));
  var have = {};
  TRAIN.setsOn(date).forEach(function (s) { have[s.ex] = 1; });
  items.forEach(function (it) {
    if (order.indexOf(it.x.ex) < 0) order.push(it.x.ex);
    if (have[it.x.ex]) return;
    made += writeFilled(it.x.ex, date, TRAIN.fillFor(it.x, date, true));
    have[it.x.ex] = 1;
  });
  var prior = TRAIN.dayGroups(date).map(function (g) { return g.ex; })
    .filter(function (x) { return order.indexOf(x) < 0; });
  /* A routine day is a named session: it is compared with the last time that
     day was done. A name already on the day stays. */
  var day = Rec.get('progday', null, dayKey) || {}, ch = { order: prior.concat(order) };
  if (day.name && !(Rec.get('session', date, '') || {}).name) ch.name = day.name;
  TRAIN.patchSession(date, ch);
  TRAIN.reindex();
  TRAIN.assertTick(date);
  Mobile.feedback('success');
  TRAIN.show('workout');
  UI.toast(items.length + ' exercises added');
};

/* ═════════════════ SUPERSETS ═════════════════ */
TRAIN.groupsOn = function (date) {
  var all = Rec.all('sgroup', { date: date });
  return all.map(function (r) { return { key: r.key, g: r.payload }; });
};
TRAIN.supersetPanel = function (prefill) {

          ren.onclick = function () {

          };

          del.innerHTML = ico('del'); del.setAttribute('aria-label', 'Delete ' + grp.g.name);
          del.onclick = function () {
            var was = copyObj(grp.g);
            Rec.del('sgroup', date, grp.key); paint(); draw();
            UI.undo('Superset deleted', function () { Rec.set('sgroup', date, grp.key, was); paint(); draw(); });
          };
          head.appendChild(ren); head.appendChild(del);

          var body = UI.el('div', 'pad');
          (grp.g.ex || []).forEach(function (id) {

            ln.textContent = exs[id] ? exs[id].name : 'Deleted exercise';
            body.appendChild(ln);
          });
          body.appendChild(UI.row('Jump between exercises', 'Next exercise after each set',
            UI.toggle(!!grp.g.jump, function (v) { TRAIN.patchRow('sgroup', date, grp.key, { jump: v ? 1 : 0 }); })));
          body.appendChild(UI.row('Rest after a full round', 'Rest timer waits for the last exercise',
            UI.toggle(!!grp.g.resthold, function (v) { TRAIN.patchRow('sgroup', date, grp.key, { resthold: v ? 1 : 0 }); })));
          card.appendChild(body);

        });

        var free = day.filter(function (g) { return !inGroup[g.ex]; });
        var h = UI.el('div', 'mb-group'); h.textContent = 'NEW SUPERSET'; b.appendChild(h);
        if (free.length < 2) {

          return;
        }
        free.forEach(function (g) {
          var row = UI.el('button', 'prow mb-press mb-tap');

          row.onclick = function () { chosen[g.ex] = !chosen[g.ex]; Mobile.feedback('select'); paint(); };

        make.textContent = 'CREATE SUPERSET';
        make.onclick = function () {
          var ids = free.map(function (g) { return g.ex; }).filter(function (id) { return chosen[id]; });
          if (ids.length < 2) return UI.toast('Pick at least two exercises', { bad: true });
          Rec.set('sgroup', date, TRAIN.newId(), {
            name: 'Superset ' + (groups.length + 1), slot: groups.length % TRAIN.SLOTS,
            ex: ids, jump: 1, resthold: 0,
          });
          chosen = {};
          Mobile.feedback('success');

          UI.toast('Superset created');
        };
        b.appendChild(make);
      };
      paint();
    },
    actions: [{ label: 'DONE', kind: 'go' }],
  });
};

/* ═════════════════ GOALS ═════════════════ */
function drawGoals(m) {
  var goals = Rec.map('goal'), exs = TRAIN.exercises();
  var keys = Object.keys(goals).sort(function (a, b) { return (goals[a].ord || 0) - (goals[b].ord || 0); });

  var add = UI.el('button', 'mb-btn mb-press mb-tap');
  add.style.width = '100%';
  add.textContent = 'ADD GOAL';
  add.onclick = function () { TRAIN.goalDialog(null); };
  m.appendChild(add);

  if (!keys.length) {
    var e = UI.el('div', 'empty'); e.textContent = 'No goal set'; m.appendChild(e);
    return;
  }
  keys.forEach(function (k) {
    var g = goals[k], ex = exs[g.ex], reps = g.r || 1;
    /* The best set at this many reps or more: a 100 for 5 goal is not met by
       a 100 single. The bar starts from that, which is what he has already
       lifted, and says so. */
    var bestKg = 0;
    if (ex) TRAIN.historyOf(g.ex).forEach(function (x) {
      if (!x.warm && (x.r || 0) >= reps && (x.kg || 0) > bestKg) bestKg = x.kg;
    });
    var pct = g.kg ? Math.max(0, Math.min(100, Math.round((bestKg / g.kg) * 100))) : 0;
    var card = UI.el('div', 'exblock');
    var head = UI.el('div', 'head mb-press mb-tap');

/* ═════════════════ PLATE CALCULATOR ═════════════════
   Which plates go on each side to make a number. Greedy from the heaviest
   down, which is what anyone does at the rack. */
TRAIN.plateSolve = function (targetKg, barKg, barUnit, unit) {
  var perSide = (targetKg - barKg) / 2;
  if (perSide <= 0) return { ok: Math.abs(perSide) < 0.01, used: [], left: perSide, perSide: perSide };
  var enabled = TRAIN.gymPlates().filter(function (p) { return p.on !== 0; });
  var greedy = function (plates) {
    var used = [], rem = perSide;
    plates.slice().sort(function (a, b) { return b.kg - a.kg; }).forEach(function (p) {
      var cap = p.n ? Math.floor(p.n / 2) : 20;
      var n = Math.min(cap, Math.floor((rem + 1e-6) / p.kg));
      if (n > 0) { used.push({ kg: p.kg, w: p.w, u: p.u, n: n }); rem -= n * p.kg; }
    });
    return { ok: Math.abs(rem) < 0.01, used: used, left: rem };
  };
  /* A gym with both kilogram and pound plates switched on made 100 kg out of
     a 45 lb, a 35 lb and change, 0.08 kg short, when 20 + 20 kg is exact. So
     the bar's own unit is tried alone first, then the unit on screen, then
     everything together, and the first exact answer wins. */
  var tries = [];
  [barUnit, unit || TRAIN.unit()].forEach(function (u) { if (u && tries.indexOf(u) < 0) tries.push(u); });
  var sets = tries.map(function (u) { return enabled.filter(function (p) { return p.u === u; }); }).concat([enabled]);
  var best = null;
  sets.forEach(function (set) {
    if (!set.length || (best && best.ok)) return;
    var r = greedy(set);
    if (!best || r.ok || Math.abs(r.left) < Math.abs(best.left)) best = r;
  });
  best = best || { ok: false, used: [], left: perSide };
  best.perSide = perSide;
  return best;
};

/* ── is this lift loaded on a barbell ──
   Tom, 2026-09-25, yes to plates each side on TRACK. Only a lift that takes
   plates on both ends of a bar gets the line, so it is read off the name:
   "barbell" or "BB" in it, or the bare name of a barbell lift (his "Press"
   is the overhead press). Never a dumbbell, machine, Smith, cable, EZ bar,
   trap bar, lever or a machine's brand. `exercise.bar`, set in Edit
   Exercise, beats the name either way. */
TRAIN.BAR_NOT = /dumbbell|\bdb\b|machine|smith|cable|\bez\b|kettlebell|\bkb\b|lever|trap ?bar|landmine|t[- ]?bar\b|band|rope|pull ?down|push ?down|plate loaded|hammer strength|life fitness|precor|nautilus|technogym|lgndry|ksyn|iron tech|body ?strong|\bmtg\b|century|padel|assisted/i;
TRAIN.BAR_LIFTS = ['deadlift', 'sumo deadlift', 'romanian deadlift', 'stiff legged deadlift',
  'stiff leg deadlift', 'rdl', 'sldl', 'deadlift row', 'rack pull', 'good morning', 'press',
  'overhead press', 'military press', 'push press', 'behind the neck press', 'pendlay row',
  'bent over row', 'wide bent over row', 'jm press', 'squat', 'squats', 'back squat',
  'front squat', 'box squat', 'zercher squat', 'bench press', 'flat bench press',
  'incline bench press', 'decline bench press', 'close grip bench press', 'floor press',
  'power clean', 'clean', 'hang clean', 'snatch', 'clean and jerk'];
TRAIN.isBarbell = function (ex) {
  if (!ex) return false;
  if (ex.bar === 1 || ex.bar === 0) return !!ex.bar;
  var nm = String(ex.name || '');
  if (TRAIN.BAR_NOT.test(nm)) return false;
  if (/barbell|\bbb\b/i.test(nm)) return true;
  return TRAIN.BAR_LIFTS.indexOf(words(nm).join(' ')) >= 0;
};
/* The bar in the unit on screen, or the gym's first. */
TRAIN.barKg = function (unit) {
  var bars = TRAIN.gymBars();
  unit = unit || TRAIN.unit();
  var bar = bars.filter(function (b) { return b.u === unit; })[0] || bars[0];
  return { kg: bar.u === 'lb' ? bar.w / LB_PER_KG : bar.w, u: bar.u };
};
/* What goes on each side, as the WEIGHT label says it: "20×2 · 5 each side".
   Heaviest first, the order they go on. A plate in the other unit says its
   unit; a total the plates cannot make says ~ (the display font has no
   ≈, and the fallback glyph made the line taller). Nothing for no weight
   or less than the bar. */
TRAIN.platesText = function (kg, unit) {
  if (!(kg > 0)) return '';
  unit = unit || TRAIN.unit();
  var bar = TRAIN.barKg(unit), sol = TRAIN.plateSolve(kg, bar.kg, bar.u, unit);
  if (sol.perSide < -0.01) return '';
  if (!sol.used.length) return sol.ok ? 'bar only' : '';
  return (sol.ok ? '' : '~ ') + sol.used.map(function (p) {
    var n = p.w != null ? p.w : Math.round(TRAIN.toUnit(p.kg, unit) * 100) / 100;
    return n + (p.u && p.u !== unit ? p.u : '') + (p.n > 1 ? '×' + p.n : '');
  }).join(' · ') + ' each side';
};

/* ═════════════════════════════════════════════════════════════════════════
   PARITY

   Everything FitNotes does that TRAIN did not, built 2026-09-14 because Tom
   will not move until it is all here. Each piece names the FitNotes screen or
   string it reproduces, so the next session can check it against the app
   rather than against this file.
   ═════════════════════════════════════════════════════════════════════════ */

/* The kit's class names, in one place. */
var CHIPS = 'mb-chips', CHIP = 'mb-chip', SEL = 'mb-sel';

function copyObj(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function fmt1(v) { return (Math.round(v * 10) / 10).toFixed(1); }

/* A drawing for a role, from the shared set. */
function ico(role) { return (window.Icons && Icons.svg(role)) || ''; }
/* A menu where the press was. shared/ui.js ignores presses inside its own
   menu since 2026-09-14, so this only works out where to put it. */
function menuAt(e, items, title) {
  var x = e && e.clientX != null ? e.clientX : innerWidth / 2;
  var y = e && e.clientY != null ? e.clientY : innerHeight / 2;
  return UI.menu(x, y, items, { title: title || '' });
}

/* Right click and long press on one element, landing on the same menu.
   DOCTRINE law 14. The press is Mobile.hold's, which also swallows the click
   that follows a hold so the row underneath does not open as well. */
function withMenu(el, fn) {
  Mobile.hold(el, function (e) { fn(e); }, { skip: '.nohold' });
  return el;
}

/* A small icon button that opens a row's menu, so every menu has a visible
   way in and the hold is only ever a shortcut. DOCTRINE law 6. */
function rowMenuBtn(label, fn) {
  var b = UI.el('button', 'ico rowmenu nohold mb-press mb-tap');
  b.innerHTML = ico('menu');
  b.setAttribute('aria-label', label);
  b.onclick = function (e) { e.stopPropagation(); fn(e); };
  return b;
}

/* ═══════════════ CHANGING A ROW WITHOUT LOSING WHAT YOU DID NOT TOUCH ═══════════════
   Rec.set replaces the whole payload. A writer that rebuilds a row from its
   own list of fields drops every field it does not know about, with nothing
   said — commentWorkout wrote {start, end, note} and so wiped the `from` that
   makes a copied day compare itself. Every edit reads the row, changes its
   own fields, and writes the rest back as it found them. `undefined` clears. */
TRAIN.patchRow = function (type, date, key, changes) {
  var cur = Rec.get(type, date, key) || {};
  var next = {}, k;
  for (k in cur) next[k] = cur[k];
  for (k in changes) {
    if (changes[k] === undefined) delete next[k]; else next[k] = changes[k];
  }
  Rec.set(type, date, key, next);
  return next;
};
TRAIN.patchSession = function (date, changes) { return TRAIN.patchRow('session', date, '', changes); };
TRAIN.patchExercise = function (id, changes) { return TRAIN.patchRow('exercise', null, id, changes); };

/* ═══════════════ EXERCISE TYPES ═══════════════
   FitNotes has six: weight and reps, distance and time, weight and distance,
   weight and time, reps and distance, reps and time. A type is stored as the
   two fields it logs.

   Older rows carry what came before this: 0 and 2 from the seeded list, 1 for
   cardio, 'weight_reps' and 'distance_time' from the importer, and null for
   the four FitNotes types whose numbers could not be pinned down from his
   file. Those last ones are read off what was actually logged against them,
   which is the only evidence there is. */
var KIND_FIELDS = { wr: ['w', 'r'], dt: ['d', 't'], wd: ['w', 'd'], wt: ['w', 't'], rd: ['r', 'd'], rt: ['r', 't'] };
var KIND_NAMES = { wr: 'Weight and reps', dt: 'Distance and time', wd: 'Weight and distance',
                   wt: 'Weight and time', rd: 'Reps and distance', rt: 'Reps and time' };

TRAIN.kindOf = function (exOrId) {
  var id = typeof exOrId === 'string' ? exOrId : null;
  var ex = id ? TRAIN.exercises()[id] : exOrId;
  var k = ex && ex.kind;
  if (KIND_FIELDS[k]) return k;
  if (k === 1 || k === 'distance_time') return 'dt';
  if (k === 0 || k === 2 || k === 'weight_reps') return 'wr';
  if (!id) return 'wr';
  var f = { w: 0, r: 0, d: 0, t: 0 };
  TRAIN.historyOf(id).forEach(function (s) {
    if (s.kg) f.w++; if (s.r) f.r++; if (s.dist) f.d++; if (s.dur) f.t++;
  });
  var used = ['w', 'r', 'd', 't'].filter(function (x) { return f[x]; })
    .sort(function (a, b) { return f[b] - f[a]; }).slice(0, 2);
  if (used.length === 2) {
    var code = ['w', 'r', 'd', 't'].filter(function (x) { return used.indexOf(x) > -1; }).join('');
    if (KIND_FIELDS[code]) return code;
  }
  if (used.length === 1) return { w: 'wr', r: 'wr', d: 'dt', t: 'wt' }[used[0]];
  return 'wr';
};
TRAIN.fieldsOf = function (exOrId) { return KIND_FIELDS[TRAIN.kindOf(exOrId)]; };

/* Distance is stored in kilometres and shown in the unit chosen. */
var KM_PER_MI = 1.609344;
TRAIN.distUnit = function () { return Rec.setting(APP.id, 'distUnit') || 'km'; };
TRAIN.showDist = function (km) {
  var v = TRAIN.distUnit() === 'mi' ? km / KM_PER_MI : km;
  return (Math.round(v * 100) / 100).toFixed(2);
};
TRAIN.toKm = function (v) { return TRAIN.distUnit() === 'mi' ? v * KM_PER_MI : v; };

/* "1:30" is ninety seconds, "1:02:00" is an hour and two minutes, and a bare
   number is seconds. */
TRAIN.parseTime = function (txt) {
  var t = String(txt == null ? '' : txt).trim();
  if (!t) return NaN;
  var parts = t.split(':');
  var total = 0;
  for (var i = 0; i < parts.length; i++) {
    var n = parseFloat(parts[i]);
    if (isNaN(n)) return NaN;
    total = total * 60 + n;
  }
  return Math.round(total);
};

/* ═══════════════ ORDER ═══════════════ */

/* When a set was made, as far as its key can say. FitNotes ids count up in
   the order sets were entered, and TRAIN's own keys lead with the clock, so
   the earliest set of each exercise says where that exercise sat in the day. */
TRAIN.setStamp = function (s) {
  var k = String(s.key || '');
  if (/^fn\d+$/.test(k)) return +k.slice(2);
  if (/^(csv|nt)-/.test(k)) return 1e14 + (+k.split('-').pop() || 0);
  var m = k.match(/^[^-]+-([0-9a-z]+)-/);
  if (m) { var n = parseInt(m[1], 36); if (isFinite(n)) return n; }
  return 1e15 + (s.ord || 0);
};

/* Swap one exercise with its neighbour in a day. The order lives on the day's
   own session row, so it is one fact on one row. */
TRAIN.moveInDay = function (date, exId, dir) {
  var ids = TRAIN.dayGroups(date).map(function (g) { return g.ex; });
  var i = ids.indexOf(exId), j = i + dir;
  if (i < 0 || j < 0 || j >= ids.length) return false;
  ids[i] = ids[j]; ids[j] = exId;
  TRAIN.patchSession(date, { order: ids });
  return true;
};

/* Swap a keyed row with its neighbour, then write every `ord` in the list so
   the order is whole again even if it was never set. */
TRAIN.moveOrd = function (type, date, keys, key, dir) {
  var i = keys.indexOf(key), j = i + dir;
  if (i < 0 || j < 0 || j >= keys.length) return false;
  var list = keys.slice();
  list[i] = list[j]; list[j] = key;
  list.forEach(function (k, n) {
    var cur = Rec.get(type, date, k);
    if (cur && cur.ord !== n) TRAIN.patchRow(type, date, k, { ord: n });
  });
  return true;
};

/* ═══════════════ EXERCISES ═══════════════ */

/* FitNotes deletes an exercise's sets with it, and says so. So does this, with
   the count in the question and an undo after. */
TRAIN.deleteExercise = function (id) {
  var ex = TRAIN.exercises()[id];
  if (!ex) { console.warn('[train] no exercise', id); return; }
  var hist = TRAIN.historyOf(id).slice();
  var go = function () {
    var gone = hist.map(function (s) { return { date: s.date, key: s.key, p: Rec.get('set', s.date, s.key) }; });
    var days = {};
    gone.forEach(function (g) { Rec.del('set', g.date, g.key); days[g.date] = 1; });
    Rec.del('exercise', null, id);
    TRAIN.reindex();
    Object.keys(days).forEach(TRAIN.assertTick);
    if (TRAIN.exId === id && TRAIN.screen === 'training') TRAIN.show('workout'); else draw();
    Mobile.haptic('warn');
    UI.undo('<b>' + UI.esc(ex.name) + '</b> deleted', function () {
      Rec.set('exercise', null, id, ex);
      gone.forEach(function (g) { if (g.p) Rec.set('set', g.date, g.key, g.p); });
      TRAIN.reindex();
      Object.keys(days).forEach(TRAIN.assertTick);
      draw();
    });
  };
  if (!hist.length) return go();
  UI.confirm('Delete ' + UI.esc(ex.name) + '?',
    hist.length.toLocaleString() + ' sets recorded for this exercise will also be deleted.',
    { yes: 'DELETE', danger: true }).then(function (yes) { if (yes) go(); });
};

/* Two names for one movement become one. Tom, 2026-09-25: "merge leg curl
   and seated leg curl". Every set, routine entry, goal, superset and day
   order that pointed at `fromId` points at `toId`, then `fromId` is deleted.
   The kept one keeps its own name, group, type, unit and step; a favourite,
   a note or setup fields it lacks come across. One undo puts every row back
   exactly as it was. */
TRAIN.mergeExercise = function (fromId, toId) {
  var exs = TRAIN.exercises(), from = exs[fromId], to = exs[toId];
  if (!from || !to || fromId === toId) return null;
  var was = [], sets = 0, days = {};
  var move = function (type, date, key, changes) {
    was.push({ type: type, date: date, key: key, p: copyObj(Rec.get(type, date, key)) });
    Rec.patch(type, date, key, changes);
  };
  var swap = function (list) {
    var seen = {}, out = [];
    list.forEach(function (e) { var id = e === fromId ? toId : e; if (!seen[id]) { seen[id] = 1; out.push(id); } });
    return out;
  };
  Rec.all('set').forEach(function (r) {
    if (!r.payload || r.payload.ex !== fromId) return;
    move('set', r.date, r.key, { ex: toId }); sets++; days[r.date] = 1;
  });
  Rec.all('progex').forEach(function (r) {
    if (r.payload && r.payload.ex === fromId) move('progex', r.date, r.key, { ex: toId });
  });
  Rec.all('goal').forEach(function (r) {
    var g = r.payload || {};
    if (g.ex !== fromId) return;
    var ch = { ex: toId };
    if (g.title === from.name) ch.title = to.name;
    move('goal', r.date, r.key, ch);
  });
  Rec.all('sgroup').forEach(function (r) {
    var ex = r.payload && r.payload.ex;
    if (Array.isArray(ex) && ex.indexOf(fromId) > -1) move('sgroup', r.date, r.key, { ex: swap(ex) });
  });
  Rec.all('session').forEach(function (r) {
    var o = r.payload && r.payload.order;
    if (Array.isArray(o) && o.indexOf(fromId) > -1) move('session', r.date, r.key, { order: swap(o) });
  });
  var carry = {};
  if (from.fav && !to.fav) carry.fav = from.fav;
  if (from.note && !to.note) carry.note = from.note;
  var su = (to.setup || []).slice(), have = {};
  su.forEach(function (f) { have[f.id] = 1; });
  (from.setup || []).forEach(function (f) { if (!have[f.id]) { su.push(f); carry.setup = su; } });
  if (Object.keys(carry).length) move('exercise', null, toId, carry);
  var gone = copyObj(Rec.get('exercise', null, fromId));
  Rec.del('exercise', null, fromId);
  TRAIN._exC = null;
  TRAIN.reindex();
  TRAIN.recomputePRs([toId]);
  return {
    sets: sets,
    undo: function () {
      Rec.set('exercise', null, fromId, gone);
      was.forEach(function (w) { if (w.p) Rec.set(w.type, w.date, w.key, w.p); });
      TRAIN._exC = null;
      TRAIN.reindex();
      TRAIN.recomputePRs([fromId, toId]);
    },
  };
};

/* FitNotes deletes a category's exercises, and every set under them, along
   with the category. TRAIN moves them to another category instead: four years
   of sets should not ride on a tidy-up. Listed in Deliberate departures. */
TRAIN.deleteCategory = function (id) {
  var cats = TRAIN.cats(), cat = cats[id];
  if (!cat) return;
  var exs = TRAIN.exercises();
  var inIt = Object.keys(exs).filter(function (k) { return exs[k].cat === id; });
  var others = TRAIN.catsSorted().filter(function (k) { return k !== id; });
  var finish = function (to) {
    var moved = inIt.map(function (k) { return { k: k, was: exs[k].cat }; });
    moved.forEach(function (mv) { TRAIN.patchExercise(mv.k, { cat: to }); });
    Rec.del('excat', null, id);
    draw();
    Mobile.haptic('warn');
    UI.undo('<b>' + UI.esc(cat.name) + '</b> deleted', function () {
      Rec.set('excat', null, id, cat);
      moved.forEach(function (mv) { TRAIN.patchExercise(mv.k, { cat: mv.was }); });
      draw();
    });
  };
  if (!inIt.length) return finish(null);
  if (!others.length) return UI.toast('Add another category first', { bad: true });
  var sel = null;
  UI.dialog({
    title: 'DELETE CATEGORY', width: 420,
    body: function (b) {
      var p = UI.el('div', 'empty');
      p.textContent = inIt.length + ' exercises in ' + cat.name + ' move to';
      b.appendChild(p);
      sel = document.createElement('select');
      sel.className = SEL;
      others.forEach(function (k) {
        var o = document.createElement('option');
        o.value = k; o.textContent = cats[k].name;
        sel.appendChild(o);
      });
      b.appendChild(sel);
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'DELETE', kind: 'bad', fn: function () { finish(sel.value); } },
    ],
  });
};

  TRAIN.pickInto = { replace: exId, date: TRAIN.date };
  TRAIN.query = '';
  TRAIN.show('picker', { cat: null });
};

TRAIN.removeFromDay = function (date, exId) {
  var gone = TRAIN.setsOn(date).filter(function (s) { return s.ex === exId; })
    .map(function (s) { return { key: s.key, p: Rec.get('set', date, s.key) }; });
  if (!gone.length) return;
  gone.forEach(function (g) { Rec.del('set', date, g.key); });
  TRAIN.reindex();
  TRAIN.assertTick(date);
  if (TRAIN.screen === 'training' && TRAIN.exId === exId) TRAIN.show('workout'); else draw();
  Mobile.haptic('warn');
  UI.undo(gone.length + (gone.length === 1 ? ' set' : ' sets') + ' removed', function () {
    gone.forEach(function (g) { if (g.p) Rec.set('set', date, g.key, g.p); });
    TRAIN.reindex();
    TRAIN.assertTick(date);
    draw();
  });
};

/* Replace one exercise with another for a day: every set moves across, and
   the day's order and any superset follow it. Records are worked out again
   for both, because a set just changed which movement it belongs to. */
TRAIN.replaceInDay = function (date, fromId, toId) {
  if (!fromId || !toId || fromId === toId) return 0;
  var n = 0;
  TRAIN.setsOn(date).filter(function (s) { return s.ex === fromId; }).forEach(function (s) {
    TRAIN.patchRow('set', date, s.key, { ex: toId }); n++;
  });
  var sess = Rec.get('session', date, '');
  if (sess && sess.order) {
    TRAIN.patchSession(date, { order: sess.order.map(function (x) { return x === fromId ? toId : x; }) });
  }
  TRAIN.groupsOn(date).forEach(function (g) {
    if ((g.g.ex || []).indexOf(fromId) > -1) {
      TRAIN.patchRow('sgroup', date, g.key, { ex: g.g.ex.map(function (x) { return x === fromId ? toId : x; }) });
    }
  });
  TRAIN.reindex();
  TRAIN.recomputePRs([fromId, toId]);
  return n;
};

/* ═══════════════ RECORDS FOR ONE EXERCISE ═══════════════ */

TRAIN.repCounts = function () {
  var v = Rec.setting(APP.id, 'repCounts');
  return Array.isArray(v) && v.length ? v : [1, 2, 3, 4, 5, 6, 8, 10, 12];
};

/* The heaviest set at exactly this many reps, or the weight the best estimated
   one-rep max says you could move for this many. FitNotes shows the two as
   Actual and Estimated Personal Records. */
TRAIN.repMax = function (rec, reps, est) {
  if (!est) return rec.byReps[reps] ? rec.byReps[reps].kg : 0;
  var best = rec.max1rm ? TRAIN.e1rm(rec.max1rm.kg, rec.max1rm.r) : 0;
  if (!best || reps >= 37) return 0;
  return best * (37 - reps) / 36;
};

function distTimeRecords(exId) {
  var out = { dist: null, dur: null, pace: null };
  TRAIN.historyOf(exId).forEach(function (s) {
    if (s.warm) return;
    if (s.dist > 0 && (!out.dist || s.dist > out.dist.dist)) out.dist = s;
    if (s.dur > 0 && (!out.dur || s.dur > out.dur.dur)) out.dur = s;
    if (s.dist > 0 && s.dur > 0) {
      var p = s.dur / s.dist;
      if (!out.pace || p < out.pace.dur / out.pace.dist) out.pace = s;
    }
  });
  return out;
}

/* An exercise's records as a card made to be shared: its best four and when
   the latest record was set. Tom, 2026-09-14, wanted a picture of a new record
   alongside the session, the week and a graph. */
TRAIN.recordsCard = function (exId) {
  var ex = TRAIN.exercises()[exId];
  if (!ex) return null;
  var rec = TRAIN.recordsFor(exId), kind = TRAIN.kindOf(exId), U = TRAIN.unitLabel(exId), esc = UI.esc;
  if (!rec.sets) return null;
  var today = Day.today(), ph = TRAIN.phaseOn(today), cells = [];
  var cell = function (label, val, unit, d) {
    cells.push('<div><span>' + label + '</span><b>' + val + (unit ? ' <small>' + unit + '</small>' : '') + '</b>' +
      (d ? '<em>' + esc(Day.label(d, { day: 'numeric', month: 'short', year: 'numeric' })) + '</em>' : '') + '</div>');
  };
  if (kind === 'dt' || kind === 'rd' || kind === 'rt') {
    var dt = distTimeRecords(exId), du = TRAIN.distUnit();
    if (dt.dist) cell('Max distance', TRAIN.showDist(dt.dist.dist), du, dt.dist.date);
    if (dt.dur) cell('Max time', fmtSecs(dt.dur.dur), '', dt.dur.date);
  }
  if (rec.maxWeight) cell('Heaviest', TRAIN.showWeight(rec.maxWeight.kg, rec.maxWeight.u, exId), U + ' × ' + rec.maxWeight.r, rec.maxWeight.date);
  if (rec.max1rm) cell('Estimated 1RM', fmt1(TRAIN.toUnit(TRAIN.e1rm(rec.max1rm.kg, rec.max1rm.r), TRAIN.unit(exId))), U, rec.max1rm.date);
  if (rec.maxReps) cell('Most reps', rec.maxReps.r, 'reps', rec.maxReps.date);
  if (rec.maxVolume) cell('Most volume',
    Math.round(TRAIN.toUnit(rec.maxVolume.kg * rec.maxVolume.r, TRAIN.unit(exId))).toLocaleString(), U, rec.maxVolume.date);
  var last = TRAIN.historyOf(exId).filter(function (s) { return s.pr; }).slice(-1)[0];
  var card = UI.el('div', 'recap');
  card.innerHTML =
    '<div class="eyebrow"><span>Personal records</span>' + (ph ? '<b>' + esc(TRAIN.phaseLine(ph, today)) + '</b>' : '') + '</div>' +
    '<div class="title">' + esc(ex.name) + '</div>' +
    '<div class="rule"></div>' +
    (cells.length ? '<div class="big4">' + cells.slice(0, 4).join('') + '</div>' : '') +
    (last && (last.kg || last.r) ? '<div class="sub">Latest record ' + esc(Day.label(last.date)) + ': ' +
      (last.kg ? TRAIN.showWeight(last.kg, last.u, exId) + ' ' + U + ' × ' : '') + (last.r || 0) + ' reps</div>' : '');
  return card;
};

TRAIN.recordsSheet = function (exId) {
  var ex = TRAIN.exercises()[exId];
  if (!ex) return;
  var rec = TRAIN.recordsFor(exId), kind = TRAIN.kindOf(exId), U = TRAIN.unitLabel(exId);
  UI.dialog({
    title: 'PERSONAL RECORDS', width: 460,
    body: function (b) {
      var g = UI.el('div', 'mb-group'); g.textContent = ex.name.toUpperCase(); b.appendChild(g);
      if (!rec.sets) {
        var e = UI.el('div', 'empty'); e.textContent = 'No personal records found'; b.appendChild(e);
        return;
      }
      var body = UI.el('div');
      if (kind === 'dt' || kind === 'rd' || kind === 'rt') {
        var dt = distTimeRecords(exId), du = TRAIN.distUnit();
        if (dt.dist) body.appendChild(recLine('Max distance', TRAIN.showDist(dt.dist.dist) + ' ' + du, dt.dist.date));
        if (dt.dur) body.appendChild(recLine('Max time', fmtSecs(dt.dur.dur), dt.dur.date));
        if (dt.pace) body.appendChild(recLine('Best pace',
          fmtSecs(Math.round(dt.pace.dur / (du === 'mi' ? dt.pace.dist / KM_PER_MI : dt.pace.dist))) + ' /' + du, dt.pace.date));
      }
      if (rec.maxWeight) body.appendChild(recLine('Heaviest',
        TRAIN.showWeight(rec.maxWeight.kg, rec.maxWeight.u, exId) + ' ' + U + ' × ' + rec.maxWeight.r, rec.maxWeight.date));
      if (rec.maxReps) body.appendChild(recLine('Most reps', rec.maxReps.r + ' reps', rec.maxReps.date));
      if (rec.maxVolume) body.appendChild(recLine('Most volume',
        Math.round(TRAIN.toUnit(rec.maxVolume.kg * rec.maxVolume.r, TRAIN.unit(exId))).toLocaleString() + ' ' + U,
        rec.maxVolume.date));
      if (rec.max1rm) body.appendChild(recLine('Estimated 1RM',

      shr.onclick = function () { shareCard(function () { return TRAIN.recordsCard(exId); }, 'train-records-' + exId); };
      b.appendChild(shr);

      /* The block's own records, which started again when it did. */
      var ph = TRAIN.phaseOn(Day.today());
      if (ph && rec.maxWeight) {
        var br = TRAIN.recordsFor(exId, { from: ph.from, to: ph.to || Day.today() });
        var gb = UI.el('div', 'mb-group'); gb.textContent = ph.p.name.toUpperCase(); b.appendChild(gb);
        if (br.maxWeight) b.appendChild(recLine('Heaviest',
          TRAIN.showWeight(br.maxWeight.kg, br.maxWeight.u, exId) + ' ' + U + ' × ' + br.maxWeight.r, br.maxWeight.date));
        if (br.max1rm) b.appendChild(recLine('Estimated 1RM',
          fmt1(TRAIN.toUnit(TRAIN.e1rm(br.max1rm.kg, br.max1rm.r), TRAIN.unit(exId))) + ' ' + U, br.max1rm.date));
        if (!br.maxWeight) {
          var nb = UI.el('div', 'empty'); nb.textContent = 'Nothing logged in this block'; b.appendChild(nb);
        }

      if (rec.split.sets) {
        var gs = UI.el('div', 'mb-group'); gs.textContent = 'SPLIT SETS'; b.appendChild(gs);
        Object.keys(rec.split.byReps).map(Number).sort(function (a, c) { return a - c; }).forEach(function (n) {
          var x = rec.split.byReps[n];
          b.appendChild(recLine(n + ' reps', TRAIN.showWeight(x.kg, x.u, exId) + ' ' + U + ' · ' + UI.esc(x.split.text), x.date));
        });
      }

      if (rec.maxWeight) {
        [['ACTUAL REP MAXES', false], ['ESTIMATED REP MAXES', true]].forEach(function (pair) {
          var h2 = UI.el('div', 'mb-group'); h2.textContent = pair[0]; b.appendChild(h2);
          b.appendChild(repMaxGrid(rec, pair[1], exId));
        });
      }

      var prs = TRAIN.historyOf(exId).filter(function (s) { return s.pr; }).slice(-30).reverse();
      if (prs.length) {
        var h3 = UI.el('div', 'mb-group'); h3.textContent = 'PERSONAL RECORD HISTORY'; b.appendChild(h3);
        prs.forEach(function (s) {
          b.appendChild(recLine(Day.label(s.date),
            (s.kg ? TRAIN.showWeight(s.kg, s.u, exId) + ' ' + U + ' × ' : '') + (s.r || 0), ''));
        });
      }
    },
    actions: [{ label: 'CLOSE' }],
  });
};

function repMaxGrid(rec, est, exId) {
  var grid = UI.el('div', 'rmgrid');
  TRAIN.repCounts().forEach(function (n) {
    var kg = TRAIN.repMax(rec, n, est);
    var cell = UI.el('div', 'rmcell' + (kg ? '' : ' none'));

    grid.appendChild(cell);

}

/* The ⓘ on the training screen: what this exercise is, what you have done with
   it, and its notes. FitNotes' "View Exercise Overview" and "Notes ...". */
TRAIN.overviewSheet = function (exId) {
  var ex = TRAIN.exercises()[exId];

  var hist = TRAIN.historyOf(exId).filter(function (s) { return !s.warm; });
  var days = {}, reps = 0, vol = 0, dist = 0, dur = 0;

    days[s.date] = 1; reps += s.r || 0; vol += (s.kg || 0) * (s.r || 0);
    dist += s.dist || 0; dur += s.dur || 0;
  });
  var dates = Object.keys(days).sort(), kind = TRAIN.kindOf(exId), cat = TRAIN.cats()[ex.cat];
  var notes = null;
  UI.dialog({
    title: 'EXERCISE', width: 460,
    body: function (b) {
      var g = UI.el('div', 'mb-group'); g.textContent = ex.name.toUpperCase(); b.appendChild(g);
      b.appendChild(recLine('Category', cat ? UI.esc(cat.name) : 'None', ''));
      b.appendChild(recLine('Type', KIND_NAMES[kind], ''));
      b.appendChild(recLine('Sessions', dates.length.toLocaleString(), ''));
      b.appendChild(recLine('Sets', hist.length.toLocaleString(), ''));
      if (KIND_FIELDS[kind].indexOf('r') > -1) b.appendChild(recLine('Total reps', reps.toLocaleString(), ''));
      if (KIND_FIELDS[kind].indexOf('w') > -1) b.appendChild(recLine('Total volume',
        Math.round(TRAIN.toUnit(vol, TRAIN.unit(exId))).toLocaleString() + ' ' + TRAIN.unitLabel(exId), ''));
      if (KIND_FIELDS[kind].indexOf('d') > -1) b.appendChild(recLine('Total distance',
        TRAIN.showDist(dist) + ' ' + TRAIN.distUnit(), ''));
      if (KIND_FIELDS[kind].indexOf('t') > -1) b.appendChild(recLine('Total time', fmtSecs(dur), ''));
      if (dates.length) {
        b.appendChild(recLine('First', Day.label(dates[0]), ''));

      { label: 'SAVE', kind: 'go', fn: function () {

/* ═══════════════ CALCULATORS ═══════════════ */

/* FitNotes' Estimated 1RM Calculator. Brzycki is unit-free, so it works in
   whatever unit is on screen and never converts. */
TRAIN.e1rmCalc = function (kg, reps, exId) {
  var w = null, r = null;
  UI.dialog({
    title: 'ESTIMATED 1RM', width: 440,
    body: function (b) {
      w = UI.field('decimal', { value: kg ? TRAIN.showWeight(kg, null, exId) : '', placeholder: TRAIN.unitLabel(exId) });
      r = UI.field('decimal', { value: reps ? String(reps) : '', placeholder: 'reps' });
      b.appendChild(UI.row('Weight', TRAIN.unitLabel(exId), w));
      b.appendChild(UI.row('Reps', 'Accuracy drops above 10', r));
      var out = UI.el('div');
      b.appendChild(out);
      var run = function () {
        var W = parseFloat(w.value), R = TRAIN.readReps(r.value);
        if (!(W > 0) || !(R > 0)) { out.innerHTML = ''; return; }
        if (R >= 37) { out.innerHTML = '<div class="empty">Too many reps to estimate</div>'; return; }
        var one = W * 36 / (37 - R);
        var html = '<div class="bigtime">' + fmt1(one) + ' <span class="u">' + TRAIN.unitLabel(exId) + '</span></div>' +
          '<div class="mb-group">REP MAXES</div><div class="rmgrid">';
        [1, 2, 3, 4, 5, 6, 8, 10, 12, 15].forEach(function (n) {
          html += '<div class="rmcell"><span>' + n + ' RM</span><b>' + fmt1(one * (37 - n) / 36) + '</b></div>';
        });
        html += '</div><div class="mb-group">PERCENTAGE (%)</div><div class="rmgrid">';
        [100, 95, 90, 85, 80, 75, 70, 65, 60, 50].forEach(function (p) {
          html += '<div class="rmcell"><span>' + p + '%</span><b>' + fmt1(one * p / 100) + '</b></div>';
        });
        out.innerHTML = html + '</div>';
      };
      w.oninput = run; r.oninput = run;
      run();
    },
    actions: [{ label: 'CLOSE' }],
  });
  if (!kg) UI.focusSoon(w);
};

/* FitNotes' Set Calculator: a max, a percentage, rounded to the weight step. */
TRAIN.setCalc = function (exId) {
  var ex = exId ? TRAIN.exercises()[exId] : null;
  var rec = exId ? TRAIN.recordsFor(exId) : null;
  var U = TRAIN.unit(exId);
  var maxE = rec && rec.max1rm ? TRAIN.toUnit(TRAIN.e1rm(rec.max1rm.kg, rec.max1rm.r), U) : 0;
  var maxW = rec && rec.maxWeight ? TRAIN.toUnit(rec.maxWeight.kg, U) : 0;
  var inc = TRAIN.increment(ex);
  var result = 0;
  UI.dialog({
    title: 'SET CALCULATOR', width: 440,
    body: function (b) {
      var base = UI.field('decimal', { value: maxE ? fmt1(maxE) : (maxW ? fmt1(maxW) : ''), placeholder: TRAIN.unitLabel(exId) });
      b.appendChild(UI.row('Max', 'The number the percentage is of', base));
      if (maxE || maxW) {
        var quick = UI.el('div', CHIPS);
        [[maxE, 'Est. 1RM'], [maxW, 'Max weight']].forEach(function (q) {
          if (!q[0]) return;
          var c = UI.el('button', CHIP + ' mb-press mb-tap');
          c.textContent = q[1] + ' ' + fmt1(q[0]);
          c.onclick = function (ev) { ev.preventDefault(); base.value = fmt1(q[0]); run(); };
          quick.appendChild(c);
        });
        b.appendChild(quick);
      }
      var pct = UI.field('number', { value: '80' });
      b.appendChild(UI.row('Percentage', '', pct));
      var chips = UI.el('div', CHIPS);
      [50, 60, 65, 70, 75, 80, 85, 90, 95, 100].forEach(function (p) {
        var c = UI.el('button', CHIP + ' mb-press mb-tap');
        c.textContent = p + '%';
        c.onclick = function (ev) { ev.preventDefault(); pct.value = String(p); run(); };
        chips.appendChild(c);
      });
      b.appendChild(chips);
      var out = UI.el('div', 'bigtime');
      b.appendChild(out);
      var note = UI.el('div', 'empty');
      b.appendChild(note);
      function run() {
        var B = parseFloat(base.value), P = parseFloat(pct.value);
        if (!(B > 0) || !(P > 0)) { out.textContent = '—'; note.textContent = ''; result = 0; return; }
        var raw = B * P / 100;
        result = Math.round(raw / inc) * inc;
        out.innerHTML = fmt1(result) + ' <span class="u">' + TRAIN.unitLabel(exId) + '</span>';
        note.textContent = 'Rounded to the closest ' + inc + ' from ' + fmt1(raw);
      }
      base.oninput = run; pct.oninput = run;
      run();
    },
    actions: exId
      ? [{ label: 'CLOSE' }, { label: 'USE', kind: 'go', fn: function () {
          if (result > 0) { TRAIN.draftW = String(Math.round(result * 1000) / 1000); draw(); }
        } }]
      : [{ label: 'CLOSE' }],
  });
};

/* ═══════════════ THE REST TIMER SHEET ═══════════════
   The clock icon on the training screen. The countdown lives in the bar
   across the top whether or not this is open. */
TRAIN.restSheet = function () {
  var ex = TRAIN.exId ? TRAIN.exercises()[TRAIN.exId] : null;
  var len = (ex && ex.rest) || Rec.setting(APP.id, 'restSeconds') || 120;
  var iv = null;
  UI.dialog({
    title: 'REST TIMER', width: 420,
    onClose: function () { if (iv) clearInterval(iv); },
    body: function (b) {
      var big = UI.el('div', 'bigtime');
      b.appendChild(big);

      var step = UI.el('div', 'stepper');
      var minus = UI.el('button', 'mb-press mb-tap');
      minus.innerHTML = ico('minus'); minus.setAttribute('aria-label', 'Fifteen seconds less');
      var lbl = UI.el('div', 'steplbl');
      var plus = UI.el('button', 'mb-press mb-tap');
      plus.innerHTML = ico('add'); plus.setAttribute('aria-label', 'Fifteen seconds more');
      step.appendChild(minus); step.appendChild(lbl); step.appendChild(plus);
      b.appendChild(step);

      var row = UI.el('div', 'gobar');
      var start = UI.el('button', 'save mb-press mb-tap');
      var stop = UI.el('button', 'clear mb-press mb-tap');
      stop.textContent = 'STOP';
      row.appendChild(start); row.appendChild(stop);
      b.appendChild(row);

      var dflt = UI.el('button', 'mb-btn mb-press mb-tap');

      dflt.style.marginTop = 'var(--s-3)';
      b.appendChild(dflt);

      var paint = function () {
        var running = !!TRAIN.rest.until;
        var left = running ? Math.round((TRAIN.rest.until - Date.now()) / 1000) : len;
        big.textContent = left >= 0 ? fmtSecs(left) : '+' + fmtSecs(-left);
        big.className = 'bigtime' + (running && left < 0 ? ' over' : '');
        lbl.textContent = fmtSecs(len);
        start.textContent = running ? 'RESTART' : 'START';
        stop.disabled = !running;
        dflt.textContent = ex ? 'USE ' + fmtSecs(len) + ' FOR ' + ex.name.toUpperCase() : 'USE ' + fmtSecs(len) + ' AS DEFAULT';
      };
      minus.onclick = function () { len = Math.max(15, len - 15); Mobile.feedback('tick'); paint(); };
      plus.onclick = function () { len = len + 15; Mobile.feedback('tick'); paint(); };
      start.onclick = function () { TRAIN.restStart(len); Mobile.feedback('success'); paint(); };
      stop.onclick = function () { TRAIN.restStop(); Mobile.feedback('select'); paint(); };
      dflt.onclick = function () {
        if (ex) TRAIN.patchExercise(TRAIN.exId, { rest: len });
        else Rec.setting(APP.id, 'restSeconds', len);
        UI.toast('Rest time saved');
      };
      paint();
      iv = setInterval(paint, 250);
    },
    actions: [{ label: 'CLOSE' }],
  });
};

/* ═══════════════ COPY AND MOVE ═══════════════ */

/* Put the clock times of one day's ISO timestamp onto another day. */
function shiftIso(iso, toDate) {
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  var t = new Date(toDate + 'T00:00:00');
  t.setHours(d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds());
  return t.toISOString();
}

/* Copy one day onto another. The sets arrive unticked, because a copy is a
   plan and not a claim that it happened. A warmup stays a warmup. */
TRAIN.copyDay = function (from, to, opts) {
  opts = opts || {};
  if (!from || !to || from === to) return 0;
  var n = TRAIN.setsOn(to).length, made = 0;
  TRAIN.dayGroups(from).forEach(function (g) {
    g.sets.forEach(function (s) {
      Rec.set('set', to, TRAIN.newId(), {
        ex: s.ex, kg: s.kg || 0, r: s.r || 0, u: s.u, done: 0, plan: 1, pr: 0, prf: 0,
        dist: s.dist || 0, dur: s.dur || 0, note: opts.comments ? (s.note || '') : '',
        ord: ++n, warm: s.warm ? 1 : 0, su: s.su ? copyObj(s.su) : undefined,
      });
      made++;
    });
  });
  if (opts.supersets) {
    TRAIN.groupsOn(from).forEach(function (g) { Rec.set('sgroup', to, TRAIN.newId(), copyObj(g.g)); });
  }
  var src = Rec.get('session', from, '') || {};
  var changes = { from: from };
  /* A copy is the same session again, so it carries the name, which is what
     it is compared by. A name already on the day stays. */
  if (src.name && !(Rec.get('session', to, '') || {}).name) changes.name = src.name;
  if (opts.note && src.note) changes.note = src.note;
  if (opts.time && src.start) {
    changes.start = shiftIso(src.start, to);
    changes.end = src.end ? shiftIso(src.end, to) : null;
  }
  TRAIN.patchSession(to, changes);
  TRAIN.reindex();
  TRAIN.assertTick(to);
  return made;
};

/* Move a whole day. Each set keeps its own key and only its date changes,
   which in this store is a new row on the new date and a tombstone on the old
   one, so the move travels to another device like any other edit. */
TRAIN.moveDay = function (from, to, opts) {
  opts = opts || {};
  if (!from || !to || from === to) return 0;
  var n = 0, existing = TRAIN.setsOn(to).length;
  TRAIN.setsOn(from).slice().forEach(function (s) {
    var p = Rec.get('set', from, s.key);
    if (!p) return;
    p.ord = (p.ord || 0) + existing;
    Rec.set('set', to, s.key, p);
    Rec.del('set', from, s.key);
    n++;
  });
  TRAIN.groupsOn(from).forEach(function (g) {
    Rec.set('sgroup', to, g.key, copyObj(g.g));
    Rec.del('sgroup', from, g.key);
  });
  var src = Rec.get('session', from, '') || {};
  var dst = {}, left = { order: undefined, from: undefined };
  if (src.order) dst.order = src.order;
  if (src.name) { dst.name = src.name; left.name = undefined; }
  if (opts.note && src.note) { dst.note = src.note; left.note = undefined; }
  if (opts.time && src.start) {
    dst.start = shiftIso(src.start, to);
    dst.end = src.end ? shiftIso(src.end, to) : null;
    left.start = undefined; left.end = undefined;
  }
  if (Object.keys(dst).length) TRAIN.patchSession(to, dst);
  if (Rec.has('session', from, '')) TRAIN.patchSession(from, left);
  TRAIN.reindex();
  TRAIN.assertTick(from);
  TRAIN.assertTick(to);
  return n;
};

/* The calendar is how FitNotes asks which day. The same screen, with a banner

/* ═══════════════ DELETE WORKOUT HISTORY ═══════════════
   FitNotes' "Delete selected workouts while keeping the rest of your data
   intact". A date range, optionally one exercise, a count in the question,
   and an undo. */
TRAIN.deleteHistoryDialog = function () {
  var exs = TRAIN.exercises();
  var ids = Object.keys(exs).sort(function (a, b) { return exs[a].name.localeCompare(exs[b].name); });
  var from = null, to = null, sel = null;
  UI.dialog({
    title: 'DELETE TRAINING HISTORY', width: 440,
    body: function (b) {
      from = UI.field('date', {});
      to = UI.field('date', { value: Day.today() });
      b.appendChild(UI.row('Start Date', '', from));
      b.appendChild(UI.row('End Date', '', to));
      sel = document.createElement('select');
      sel.className = SEL;
      var all = document.createElement('option');
      all.value = ''; all.textContent = 'All exercises';
      sel.appendChild(all);
      ids.forEach(function (id) {
        if (!TRAIN.historyOf(id).length) return;
        var o = document.createElement('option');
        o.value = id; o.textContent = exs[id].name;
        sel.appendChild(o);
      });
      b.appendChild(UI.row('Exercises', '', sel));
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'DELETE', kind: 'bad', fn: function () {
        var f = from.value, t = to.value, only = sel.value;
        if (!f || !t || f > t) { UI.toast('Please select a start and end date', { bad: true }); return false; }
        var victims = [];
        Object.keys(TRAIN.idx.byDate).forEach(function (d) {
          if (d < f || d > t) return;
          TRAIN.idx.byDate[d].forEach(function (s) { if (!only || s.ex === only) victims.push({ date: d, key: s.key }); });
        });
        if (!victims.length) { UI.toast('There are no sessions to delete', { bad: true }); return false; }
        var days = {};
        victims.forEach(function (v) { days[v.date] = 1; });
        setTimeout(function () {
          UI.confirm('Delete ' + victims.length.toLocaleString() + ' sets?',
            Object.keys(days).length + ' sessions between ' + Day.label(f) + ' and ' + Day.label(t) + '.',
            { yes: 'DELETE', danger: true }).then(function (yes) {
            if (!yes) return;
            var held = victims.map(function (v) { return { date: v.date, key: v.key, p: Rec.get('set', v.date, v.key) }; });
            var sessions = [];
            held.forEach(function (h) { Rec.del('set', h.date, h.key); });
            if (!only) Object.keys(days).forEach(function (d) {
              var s = Rec.get('session', d, '');
              if (s) { sessions.push({ date: d, p: s }); Rec.del('session', d, ''); }
            });
            TRAIN.reindex();
            Object.keys(days).forEach(TRAIN.assertTick);
            draw();
            Mobile.haptic('warn');
            UI.undo('Sessions deleted successfully', function () {
              held.forEach(function (h) { if (h.p) Rec.set('set', h.date, h.key, h.p); });
              sessions.forEach(function (s) { Rec.set('session', s.date, '', s.p); });
              TRAIN.reindex();
              Object.keys(days).forEach(TRAIN.assertTick);
              draw();
            });
          });
        }, 60);
      } },
    ],
  });
};

/* ═══════════════ PLATES AND BARS ═══════════════
   FitNotes' Plate Settings and Barbell Settings. Configuration rather than
   records, so they stay in `setting` as the brief says. */
TRAIN.DEFAULT_PLATES = [
  { w: 25, u: 'kg' }, { w: 20, u: 'kg' }, { w: 15, u: 'kg' }, { w: 10, u: 'kg' },
  { w: 5, u: 'kg' }, { w: 2.5, u: 'kg' }, { w: 1.25, u: 'kg' },
  { w: 45, u: 'lb' }, { w: 35, u: 'lb' }, { w: 25, u: 'lb' }, { w: 10, u: 'lb' },
  { w: 5, u: 'lb' }, { w: 2.5, u: 'lb' },
];
function plateRow(w, u, n, on) {
  return { kg: u === 'lb' ? w / LB_PER_KG : w, w: w, u: u, n: n == null ? 20 : n, on: on == null ? 1 : on };
}
TRAIN.gymPlates = function () {
  var p = Rec.setting(APP.id, 'plates');
  if (Array.isArray(p) && p.length) return p;
  return TRAIN.DEFAULT_PLATES.map(function (x) { return plateRow(x.w, x.u, 20, x.u === TRAIN.unit() ? 1 : 0); });
};
TRAIN.gymBars = function () {
  var b = Rec.setting(APP.id, 'bars');
  if (Array.isArray(b) && b.length) return b;
  return [{ w: 20, u: 'kg', ex: 0 }, { w: 45, u: 'lb', ex: 0 }];
};

function askWeight(title, fn) {
  var unit = TRAIN.unit(), f = null;
  UI.dialog({
    title: title, width: 380,
    body: function (b) {
      f = UI.field('decimal', { placeholder: 'Weight' });
      b.appendChild(UI.row('Weight', '', f));
      b.appendChild(UI.row('Unit', '', UI.segmented([{ id: 'kg', name: 'KG' }, { id: 'lb', name: 'LB' }],
        unit, function (v) { unit = v; })));
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'ADD', kind: 'go', fn: function () {
