<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRAIN</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛭</text></svg>">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="../shared/skins.js"></script>
<script src="../shared/day.js"></script>
<script src="../shared/records.js"></script>
<script src="../shared/mobile.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/io.js"></script>
<script src="../shared/health.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}

/* ── the top bar ──
   FitNotes: drawer, title, then calendar, add and overflow. Icons are drawn
   here as SVG; nothing is lifted from the app. */
header{
  flex:0 0 auto;display:flex;align-items:center;
  padding:calc(var(--s-2) + var(--safe-t)) var(--s-2) var(--s-2);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-4);
  letter-spacing:.14em;padding-left:var(--s-2)}
.logo b{color:var(--accent)}
.spacer{flex:1}
/* One icon button shape for the whole app: a 44px target with a 22px glyph. */
.ico{width:var(--tap);height:var(--tap);flex:0 0 auto;border:0;background:none;
  cursor:pointer;color:var(--text-2);border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;padding:0}
.ico svg{width:22px;height:22px;display:block}
.ico.on{color:var(--accent)}

/* ── the date strip ──
   FitNotes puts the day, and the two arrows that move it, directly under the
   title. The whole strip is also the swipe target: left and right move a day,
   which is how he already navigates without looking. */
.datebar{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-2);
  padding:var(--s-2) var(--s-3);background:var(--surface-2);
  box-shadow:var(--rim);touch-action:pan-y;user-select:none;
}
.datebar .arrow{
  width:var(--tap);height:var(--tap);flex:0 0 auto;border:0;background:none;cursor:pointer;
  color:var(--text-2);font-size:var(--f-5);line-height:1;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center}
.datebar .when{
  flex:1;min-width:0;text-align:center;border:0;background:none;cursor:pointer;
  color:inherit;font:inherit;padding:var(--s-2);border-radius:var(--radius-md);
  min-height:var(--tap);display:flex;align-items:center;justify-content:center}
/* One line, uppercase: "TODAY", or "WEDNESDAY, AUGUST 5". FitNotes shows the
   day itself, not how long ago it was — the calendar is where you go for
   that, and a second line here would push the workout down the screen. */
.datebar .when .d{font-family:var(--font-display);font-weight:var(--w-bold);
  font-size:var(--f-2);letter-spacing:.08em;display:block;line-height:1.2;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebar .when.future .d{color:var(--text-muted)}
/* The accent hairline under the date is FitNotes' one piece of chrome, and
   it is what tells you the bar above is a control and not a heading. */
.datebar{border-bottom:2px solid var(--accent)}

main{flex:1;min-height:0;display:flex;flex-direction:column;
  padding:var(--s-3) var(--s-3) calc(var(--s-5) + var(--safe-b))}
.wrap{max-width:640px;margin:0 auto;width:100%;flex:1;
  display:flex;flex-direction:column;gap:var(--s-3)}

.card{border-radius:var(--radius-lg);background:var(--surface-1);
  padding:var(--s-4);box-shadow:var(--e-1),var(--rim)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-3)}
.empty{color:var(--text-muted);line-height:var(--lh-body)}

/* ── one exercise inside a day ──
   FitNotes gives each exercise its own card: the name across the top, a
   hairline in the accent colour under it, then the sets. The sets are set
   right, because the numbers are the thing you scan and a ragged left edge
   on a column of weights is unreadable. There are no set numbers here —
   those live on the training screen, where you are editing one of them. */
.exblock{border-radius:var(--radius-md);background:var(--surface-1);
  box-shadow:var(--e-1),var(--rim);overflow:hidden;display:flex;flex-direction:column}
.exblock .head{display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);min-height:var(--tap);cursor:pointer;
  border-bottom:1px solid var(--cat,var(--accent))}
.exblock .head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:var(--f-4);color:var(--text-2)}
.sets{display:flex;flex-direction:column;padding:var(--s-2) var(--s-4) var(--s-3)}

/* Weight and reps are two right-aligned columns so they stack into a grid
   down the card. Tabular numerals keep 4.0 and 12.5 the same width. */
.setrow{display:flex;align-items:baseline;padding:var(--s-2) 0;
  font-variant-numeric:tabular-nums}
.setrow .cmt{width:20px;flex:0 0 auto;color:var(--accent);opacity:0;font-size:15px}
.setrow.has-note .cmt{opacity:1}
.setrow .grow{flex:1}
.setrow .col{text-align:right;white-space:nowrap}
.setrow .col.w{min-width:7.5em}
.setrow .col.r{min-width:5.5em}
.setrow b{font-size:var(--f-4);font-weight:var(--w-semi);color:var(--text-2)}
.setrow .u{color:var(--text-muted);font-size:var(--f-2)}
.setrow.pr b{color:var(--accent)}

/* The complete tick, filled when every set in the exercise is done. */
.tickdot{width:22px;height:22px;flex:0 0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--accent-fg);font-size:13px;line-height:1}
.tickdot.off{background:none;box-shadow:inset 0 0 0 2px var(--border-strong)}

/* The workout's start and end, the card FitNotes puts above the first
   exercise. Shown only when there is a time recorded. */
.timecard{display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);border-radius:var(--radius-md);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);
  font-variant-numeric:tabular-nums;color:var(--text-2)}
.timecard .rng{flex:1;font-size:var(--f-4)}
.timecard .len{color:var(--text-muted)}

.daynote{color:var(--text-2);line-height:var(--lh-body);font-size:var(--f-2)}

/* ── the empty day ──
   "Workout Log Empty" sits in the middle, and the two things you actually do
   next sit near the bottom where the thumb is. */
.emptyday{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s-4);min-height:52vh}
.emptyday .say{color:var(--text-muted);font-size:var(--f-5)}
.startbox{display:flex;flex-direction:column;align-items:center;gap:var(--s-5);
  padding-bottom:var(--s-5)}
.bigact{display:flex;flex-direction:column;align-items:center;gap:var(--s-2);
  border:0;background:none;cursor:pointer;color:var(--text-2);font:inherit;
  padding:var(--s-3) var(--s-4);border-radius:var(--radius-md);min-height:var(--tap)}
.bigact svg{width:28px;height:28px;color:var(--accent)}

/* No floating button: FitNotes puts add in the top bar, and a FAB here would
   sit on top of the last set of the day. */

/* ── the import panel ── */
.imp-stat{display:flex;justify-content:space-between;gap:var(--s-3);
  padding:var(--s-2) 0;font-size:var(--f-2);border-bottom:1px solid var(--border)}
.imp-stat:last-child{border-bottom:0}
.imp-stat b{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:var(--radius-full);background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;
  transition:width var(--dur-fast) linear}
</style>
</head>
<body>
<header>
  <button class="ico mb-press mb-tap" id="drawer" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div class="logo">TRA<b>IN</b></div>
  <div class="spacer"></div>
  <button class="ico mb-press mb-tap" id="calBtn" aria-label="Calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
  <button class="ico mb-press mb-tap" id="addBtn" aria-label="Add an exercise">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ico mb-press mb-tap" id="moreBtn" aria-label="More">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button>
</header>

<div class="datebar" id="datebar">
  <button class="arrow mb-press mb-tap" id="prev" aria-label="Previous day">‹</button>
  <button class="when mb-press mb-tap" id="when" aria-label="Jump to today"></button>
  <button class="arrow mb-press mb-tap" id="next" aria-label="Next day">›</button>
</div>

<main class="mb-scroll"><div class="wrap" id="main"></div></main>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   TRAIN — the training log.

   A reproduction of FitNotes v25.1 on the Motherbase foundation. The brief
   that governs this file is train/CLAUDE.md, next to it. Read that first:
   it says what is deliberate and what would be a bug.

   Nothing in here is copied from FitNotes. What was taken from the app is its
   schema, its labels and its behaviour — facts about how it works — and every
   line below was written against those.
   ═══════════════════════════════════════════════════════════════════════════ */

var APP = {
  id: 'train',
  name: 'Train',
  icon: '⛭',
  blurb: 'the training log',
  /* every type TRAIN owns. `tick` is not here: it is shared, and declaring it
     would claim a type the master brief says belongs to everyone. */
  types: ['excat', 'exercise', 'set', 'session', 'sgroup',
          'program', 'progday', 'progex', 'goal'],
};

Skins.load('../shared/skins.json').then(function () { Skins.restore(APP.id); });
Sfx.init(APP.id);
Rec.declare(APP.id, APP.types);
IO.register({ app: APP.id, name: APP.name, types: APP.types });

/* Everything hangs off one global on purpose. `var` at the top level of a
   classic script is a property of window; `let` and `const` are not, and the
   test harness has to be able to reach in. */
var TRAIN = window.TRAIN = {};

/* ═══════════════════ UNITS ═══════════════════
   Every set stores kg, the true weight, and u, the unit it was typed in.
   Display converts. This is what let four years of mixed kg and lb entries
   survive in one log, and it is why nothing here ever writes a converted
   number back over a stored one. */
var LB_PER_KG = 2.20462262185;
var UNIT = { 0: 'kg', 1: 'lb', 2: 'lb' };   /* FitNotes: 0 metric, 1 and 2 imperial */

TRAIN.toUnit = function (kg, unit) {
  return unit === 'lb' ? kg * LB_PER_KG : kg;
};
TRAIN.toKg = function (v, unit) {
  return unit === 'lb' ? v / LB_PER_KG : v;
};
/* Everything on screen is shown in the unit currently chosen, not the unit
   each set was typed in. That is what FitNotes does: the stored kilograms are
   the truth, the display setting decides how they read, and its "Change
   Weight Unit → Convert Existing Values / Just Change Unit" dialog only makes
   sense on those terms. It also means two units never appear on one screen,
   which they did in the first version of this file.

   `u` on a set is still recorded. It is what he typed, and it is how a set
   entered as 500 lb can be shown as exactly 500 again rather than 226.8. */
TRAIN.unit = function () { return Rec.setting(APP.id, 'unit') || 'lb'; };

/* One decimal always, the way FitNotes prints it: 4.0 kgs, 12.5 kgs. A set
   typed in this unit is shown back exactly, without a float's fingerprints. */
TRAIN.showWeight = function (kg, typedIn) {
  var unit = TRAIN.unit();
  var v = TRAIN.toUnit(kg, unit);
  if (typedIn === unit) v = Math.round(v * 1000) / 1000;   /* it was typed here; trust it */
  return (Math.round(v * 10) / 10).toFixed(1);
};
/* FitNotes writes the unit plural in the log: "kgs", "lbs". */
TRAIN.unitLabel = function () { return TRAIN.unit() + 's'; };

/* ═══════════════════ CATEGORY COLOUR SLOTS ═══════════════════
   A category stores a slot, never a hex. Six theme colours, each in a light
   and a dark tint, so nine muscle groups all get something readable and every
   one of them changes when the skin changes. */
TRAIN.SLOTS = 12;
TRAIN.slotColor = function (slot) {
  var s = ((slot | 0) % TRAIN.SLOTS + TRAIN.SLOTS) % TRAIN.SLOTS;
  var base = getComputedStyle(document.documentElement)
    .getPropertyValue('--data-' + (s % 6 + 1)).trim();
  if (!base) return 'var(--border-strong)';
  /* The second tint is the same hue held further from the page background, so
     it stays distinct in a light skin and in a dark one. */
  return s < 6 ? base : 'color-mix(in srgb, ' + base + ' 62%, var(--text-1))';
};

/* ═══════════════════ IDS ═══════════════════
   The clock alone is not unique: two rows made in the same millisecond derive
   the same row id and the second silently replaces the first. Counter for
   this session, random tail for two devices in the same millisecond. */
var seq = 0;
TRAIN.newId = function () {
  return Rec.USER + '-' + Date.now().toString(36) + '-' +
    (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
};

/* ═══════════════════ THE INDEX ═══════════════════
   Rec.all walks every row in the store for each call. With twelve thousand
   sets that is fine once and wasteful thirty times, so TRAIN keeps its own
   two maps and rebuilds them when the store changes. Everything on screen
   reads these, never Rec.all. */
TRAIN.idx = { byDate: {}, byEx: {}, built: 0 };

TRAIN.reindex = function () {
  var byDate = {}, byEx = {};
  var all = Rec.all('set');
  for (var i = 0; i < all.length; i++) {
    var r = all[i], p = r.payload;
    var rec = { key: r.key, date: r.date, ex: p.ex, kg: p.kg, r: p.r, u: p.u,
                done: p.done, pr: p.pr, prf: p.prf, dist: p.dist, dur: p.dur,
                note: p.note, ord: p.ord };
    (byDate[r.date] || (byDate[r.date] = [])).push(rec);
    (byEx[p.ex] || (byEx[p.ex] = [])).push(rec);
  }
  var k;
  for (k in byDate) byDate[k].sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
  for (k in byEx) byEx[k].sort(function (a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ord || 0) - (b.ord || 0);
  });
  TRAIN.idx = { byDate: byDate, byEx: byEx, built: Date.now() };
  return TRAIN.idx;
};

TRAIN.setsOn = function (date) { return TRAIN.idx.byDate[date] || []; };
TRAIN.historyOf = function (exId) { return TRAIN.idx.byEx[exId] || []; };
TRAIN.cats = function () { return Rec.map('excat'); };
TRAIN.exercises = function () { return Rec.map('exercise'); };

/* A day's sets, grouped into the exercises they belong to, in the order the
   exercises were first touched that day. That order is the workout. */
TRAIN.dayGroups = function (date) {
  var sets = TRAIN.setsOn(date), ex = TRAIN.exercises();
  var order = [], byEx = {};
  for (var i = 0; i < sets.length; i++) {
    var s = sets[i];
    if (!byEx[s.ex]) { byEx[s.ex] = []; order.push(s.ex); }
    byEx[s.ex].push(s);
  }
  return order.map(function (id) {
    return { ex: id, def: ex[id] || { name: 'Exercise ' + id, cat: null }, sets: byEx[id] };
  });
};

/* ═══════════════════ VOLUME ═══════════════════
   Volume is weight times reps, summed, and it is always computed in kg then
   displayed, so switching units never changes the number underneath. */
TRAIN.volume = function (sets) {
  var v = 0;
  for (var i = 0; i < sets.length; i++) v += (sets[i].kg || 0) * (sets[i].r || 0);
  return v;
};

/* ═══════════════════ THE TICK ═══════════════════
   TRAIN re-asserts rather than argues. Any app may tick a training day; only
   TRAIN gets to say whether it is true, and it says so again every time the
   day's sets change and every time it looks at the day. Because the store
   merges on updated_at, TRAIN's write is always the newer one.
   See train/CLAUDE.md, "The tick". */
TRAIN.ACTIVITY = 'training';
TRAIN.assertTick = function (date) {
  if (!date) return;
  var n = TRAIN.setsOn(date).length;
  var had = Rec.has('tick', date, TRAIN.ACTIVITY);
  if (n > 0) {
    var cur = Rec.get('tick', date, TRAIN.ACTIVITY);
    if (!cur || cur.src !== APP.id || cur.qty !== n) {
      Rec.set('activity', null, TRAIN.ACTIVITY, { name: 'Training', cat: 'body' });
      Rec.set('tick', date, TRAIN.ACTIVITY, { src: APP.id, qty: n });
    }
  } else if (had) {
    Rec.del('tick', date, TRAIN.ACTIVITY);
  }
};

/* ═════════════════════════════════════════════════════════════════════════
   THE SQLITE READER

   A FitNotes backup is its database with the extension changed: the file
   begins "SQLite format 3". So the importer is a reader for that format,
   written here in plain JavaScript with no library, because an importer that
   needs the network breaks offline-first on the one job that matters most.

   It reads tables. It does not run SQL, it does not use indexes, and it does
   not write anything. Walk the b-tree from a table's root page, decode each
   leaf cell, hand back rows.
   ═════════════════════════════════════════════════════════════════════════ */
var SQLiteFile = TRAIN.SQLiteFile = function (buf) {
  this.b = new Uint8Array(buf);
  this.dv = new DataView(buf);
  if (this.text(0, 15) !== 'SQLite format 3')
    throw new Error('This is not a FitNotes backup. The file does not start with "SQLite format 3".');
  this.pageSize = this.dv.getUint16(16);
  if (this.pageSize === 1) this.pageSize = 65536;
  this.reserved = this.b[20];
  this.usable = this.pageSize - this.reserved;
  this.dec = new TextDecoder('utf-8');
  this.master = null;
};

SQLiteFile.prototype.text = function (off, len) {
  var s = '';
  for (var i = 0; i < len; i++) s += String.fromCharCode(this.b[off + i]);
  return s;
};

/* SQLite's variable length integer: seven bits a byte, high bit continues,
   and a ninth byte contributes all eight. */
SQLiteFile.prototype.varint = function (off) {
  var v = 0, i, b;
  for (i = 0; i < 8; i++) {
    b = this.b[off + i];
    v = v * 128 + (b & 0x7f);
    if (!(b & 0x80)) return [v, i + 1];
  }
  return [v * 256 + this.b[off + 8], 9];
};

/* Page 1 carries the 100 byte file header before its b-tree header. */
SQLiteFile.prototype.pageStart = function (n) { return (n - 1) * this.pageSize; };
SQLiteFile.prototype.btreeStart = function (n) { return n === 1 ? 100 : this.pageStart(n); };

/* A payload longer than the page keeps its first part in the cell and the
   rest in a chain of overflow pages. The split point is fixed by the format,
   not by taste, and getting it wrong silently truncates long text — which
   here would mean losing the end of a set comment. */
SQLiteFile.prototype.payload = function (off, size) {
  var maxLocal = this.usable - 35;
  var out, local;
  if (size <= maxLocal) {
    out = new Uint8Array(size);
    out.set(this.b.subarray(off, off + size));
    return out;
  }
  var minLocal = Math.floor((this.usable - 12) * 32 / 255) - 23;
  local = minLocal + ((size - minLocal) % (this.usable - 4));
  if (local > maxLocal) local = minLocal;

  out = new Uint8Array(size);
  out.set(this.b.subarray(off, off + local), 0);
  var got = local;
  var next = this.dv.getUint32(off + local);
  while (next && got < size) {
    var p = this.pageStart(next);
    var take = Math.min(this.usable - 4, size - got);
    out.set(this.b.subarray(p + 4, p + 4 + take), got);
    got += take;
    next = this.dv.getUint32(p);
  }
  return out;
};

/* A record is a header of serial types followed by the values themselves. */
SQLiteFile.prototype.record = function (bytes) {
  var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  var self = this;
  function vint(off) {
    var v = 0, i, b;
    for (i = 0; i < 8; i++) {
      b = bytes[off + i];
      v = v * 128 + (b & 0x7f);
      if (!(b & 0x80)) return [v, i + 1];
    }
    return [v * 256 + bytes[off + 8], 9];
  }
  var h = vint(0), headerEnd = h[0], p = h[1], types = [];
  while (p < headerEnd) { var t = vint(p); types.push(t[0]); p += t[1]; }

  var vals = [], off = headerEnd;
  for (var i = 0; i < types.length; i++) {
    var t2 = types[i], v;
    if (t2 === 0) { v = null; }
    else if (t2 === 1) { v = dv.getInt8(off); off += 1; }
    else if (t2 === 2) { v = dv.getInt16(off); off += 2; }
    else if (t2 === 3) { v = (dv.getInt8(off) << 16) | dv.getUint16(off + 1); off += 3; }
    else if (t2 === 4) { v = dv.getInt32(off); off += 4; }
    else if (t2 === 5) { v = dv.getInt16(off) * 4294967296 + dv.getUint32(off + 2); off += 6; }
    else if (t2 === 6) { v = dv.getInt32(off) * 4294967296 + dv.getUint32(off + 4); off += 8; }
    else if (t2 === 7) { v = dv.getFloat64(off); off += 8; }
    else if (t2 === 8) { v = 0; }
    else if (t2 === 9) { v = 1; }
    else if (t2 >= 12 && t2 % 2 === 0) { var n = (t2 - 12) / 2; v = bytes.subarray(off, off + n); off += n; }
    else { var n2 = (t2 - 13) / 2; v = self.dec.decode(bytes.subarray(off, off + n2)); off += n2; }
    vals.push(v);
  }
  return vals;
};

/* Walk a table b-tree and call back with [rowid, values] for every leaf cell. */
SQLiteFile.prototype.walk = function (page, fn, seen) {
  seen = seen || {};
  if (!page || seen[page]) return;          /* a corrupt file must not loop forever */
  seen[page] = 1;
  var s = this.btreeStart(page), type = this.b[s];
  var count = this.dv.getUint16(s + 3);
  /* A cell pointer is an offset from the start of its own page, not from the
     start of the file. Page 1 hides that bug, because its page starts at byte
     zero — every other page reads garbage without this. */
  var base = this.pageStart(page);
  var i, ptr, cell;

  if (type === 0x0d) {                       /* leaf table */
    for (i = 0; i < count; i++) {
      ptr = base + this.dv.getUint16(s + 8 + i * 2);
      var a = this.varint(ptr), size = a[0];
      var b = this.varint(ptr + a[1]), rowid = b[0];
      fn(rowid, this.record(this.payload(ptr + a[1] + b[1], size)));
    }
  } else if (type === 0x05) {                /* interior table */
    for (i = 0; i < count; i++) {
      cell = base + this.dv.getUint16(s + 12 + i * 2);
      this.walk(this.dv.getUint32(cell), fn, seen);
    }
    this.walk(this.dv.getUint32(s + 8), fn, seen);   /* the rightmost child */
  }
  /* index pages are never walked: TRAIN reads tables only */
};

/* sqlite_master is a table like any other, rooted at page 1. */
SQLiteFile.prototype.schema = function () {
  if (this.master) return this.master;
  var out = {}, self = this;
  this.walk(1, function (rowid, v) {
    if (v[0] === 'table' && v[1]) out[v[1]] = { root: v[3], sql: v[4] || '' };
  });
  this.master = out;
  return out;
};

/* Column names, and which column is the rowid in disguise.
   `_id INTEGER PRIMARY KEY` is stored as NULL in the record; its real value
   is the cell's rowid. Miss that and every id in the file comes back empty. */
SQLiteFile.prototype.columns = function (sql) {
  var open = sql.indexOf('(');
  if (open < 0) return { names: [], pk: -1 };
  var depth = 0, body = '', i;
  for (i = open; i < sql.length; i++) {
    var ch = sql[i];
    if (ch === '(') { depth++; if (depth === 1) continue; }
    if (ch === ')') { depth--; if (depth === 0) break; }
    body += ch;
  }
  var parts = [], buf = '', d = 0;
  for (i = 0; i < body.length; i++) {
    var c = body[i];
    if (c === '(') d++;
    if (c === ')') d--;
    if (c === ',' && d === 0) { parts.push(buf); buf = ''; continue; }
    buf += c;
  }
  if (buf.trim()) parts.push(buf);

  var names = [], pk = -1;
  parts.forEach(function (p) {
    var t = p.trim();
    if (!t) return;
    if (/^(PRIMARY|FOREIGN|UNIQUE|CHECK|CONSTRAINT)\b/i.test(t)) return;
    var m = t.match(/^[`"\[]?([A-Za-z_][A-Za-z0-9_]*)[`"\]]?/);
    if (!m) return;
    if (/\bINTEGER\s+PRIMARY\s+KEY\b/i.test(t)) pk = names.length;
    names.push(m[1]);
  });
  return { names: names, pk: pk };
};

/** Every row of one table, as plain objects. */
SQLiteFile.prototype.table = function (name) {
  var s = this.schema()[name];
  if (!s) return null;                       /* older backups genuinely lack tables */
  var cols = this.columns(s.sql), out = [];
  this.walk(s.root, function (rowid, vals) {
    var o = {};
    for (var i = 0; i < cols.names.length; i++) {
      o[cols.names[i]] = (i === cols.pk && vals[i] == null) ? rowid : vals[i];
    }
    out.push(o);
  });
  return out;
};

/* ═════════════════════════════════════════════════════════════════════════
   THE FITNOTES IMPORTER

   Merges, never replaces. Every row it builds carries a stable id derived
   from the FitNotes row id, and an updated_at taken from the training date
   rather than from the clock. Two consequences, both wanted:

     • importing the same backup twice changes nothing
     • anything edited in TRAIN afterwards is newer, so a re-import cannot
       walk over work done since

   One way only. There is no export back into FitNotes.
   ═════════════════════════════════════════════════════════════════════════ */

/* FitNotes stores a colour as a signed 32-bit ARGB integer. */
function argbToRgb(n) {
  var v = (n >>> 0) & 0xffffff;
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
/* Map an imported colour onto the nearest of the twelve theme slots, so his
   existing category colours survive as an assignment he can then change. The
   comparison is against the default skin, once, so it does not shift with
   whatever theme happens to be active during the import. */
function slotRgb(s) {
  var c = hexToRgb(getComputedStyle(document.documentElement)
    .getPropertyValue('--data-' + (s % 6 + 1)).trim());
  if (!c) return null;
  return s < 6 ? c : [c[0] * 0.62 + 40, c[1] * 0.62 + 40, c[2] * 0.62 + 40];
}
function slotDistance(s, rgb) {
  var c = slotRgb(s);
  if (!c) return Infinity;
  return Math.pow(c[0] - rgb[0], 2) + Math.pow(c[1] - rgb[1], 2) + Math.pow(c[2] - rgb[2], 2);
}
/* Nearest wins, but only once. Nine of his categories were picked by eye in
   FitNotes and three of them are near-identical greens: matching each one to
   its nearest slot independently put Triceps, Back and Abs on the same colour,
   which is worse than useless on a rail you are meant to follow down a day.
   So a slot is claimed, and the next category takes its nearest free one. */
function assignSlots(list) {
  var taken = {}, out = {};
  list.forEach(function (item) {
    var best = -1, bestD = Infinity;
    for (var s = 0; s < TRAIN.SLOTS; s++) {
      if (taken[s]) continue;
      var d = slotDistance(s, item.rgb);
      if (d < bestD) { bestD = d; best = s; }
    }
    if (best < 0) best = Object.keys(out).length % TRAIN.SLOTS;  /* more than twelve: repeats resume */
    taken[best] = 1;
    out[item.id] = best;
  });
  return out;
}
function hexToRgb(h) {
  if (!h) return null;
  h = h.trim();
  var m = h.match(/^#?([0-9a-f]{6})$/i);
  if (m) { var n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  m = h.match(/rgba?\(([^)]+)\)/);
  if (m) { var p = m[1].split(','); return [parseFloat(p[0]), parseFloat(p[1]), parseFloat(p[2])]; }
  return null;
}

/* FitNotes' exercise_type_id. Two of these are certain from his own data:
   0 is everything with a weight and reps, 1 is the cardio exercises. The
   others appear a handful of times and their exact ordinals could not be
   pinned down from the file alone, so the raw id is kept and the editor falls
   back to showing whichever of weight, reps, distance and time has a value.
   Nothing is lost; see train/CLAUDE.md. */
var KIND = { 0: 'weight_reps', 1: 'distance_time' };

TRAIN.importFitNotes = function (buf, onProgress) {
  var db = new SQLiteFile(buf);
  var log = onProgress || function () {};
  var rows = [], stats = {};
  var USER = Rec.USER;

  function rowId(type, date, key) {
    var clean = function (s) { return String(s == null ? '' : s).replace(/\|/g, '-'); };
    return USER + '|' + clean(type) + '|' + clean(date || '') + '|' + clean(key);
  }
  /* Stable, and older than anything he does in TRAIN from here on. */
  function stampFor(date) {
    return (date && /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : '2000-01-01') + 'T12:00:00.000Z';
  }
  function push(type, date, key, payload, stamp) {
    rows.push({ id: rowId(type, date, key), user_id: USER, type: type,
      date: date || null, key: String(key), payload: payload,
      updated_at: stamp || stampFor(date), deleted: false, by: APP.id });
  }

  /* ── categories ── */
  log('categories');
  var cats = db.table('Category') || [];
  cats.sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0) || a._id - b._id; });
  var catSlots = assignSlots(cats.map(function (c) {
    return { id: c._id, rgb: argbToRgb(c.colour || 0) };
  }));
  cats.forEach(function (c) {
    push('excat', null, 'fn' + c._id, {
      name: c.name, slot: catSlots[c._id],
      ord: c.sort_order || 0, fnColour: c.colour,
    });
  });
  stats.categories = cats.length;
  stats.distinctColours = Object.keys(cats.reduce(function (o, c) {
    o[catSlots[c._id]] = 1; return o;
  }, {})).length;

  /* ── exercises ── */
  log('exercises');
  var exs = db.table('exercise') || [];
  exs.forEach(function (e) {
    push('exercise', null, 'fn' + e._id, {
      name: e.name,
      cat: e.category_id != null ? 'fn' + e.category_id : null,
      kind: KIND[e.exercise_type_id] || null,
      fnKind: e.exercise_type_id,
      note: e.notes || '',
      inc: e.weight_increment != null ? e.weight_increment : null,
      rest: e.default_rest_time != null ? e.default_rest_time : null,
      unit: UNIT[e.weight_unit_id] || null,
      graph: e.default_graph_id != null ? e.default_graph_id : null,
      fav: e.is_favourite ? 1 : 0,
    });
  });
  stats.exercises = exs.length;

  /* ── set comments ──
     owner_type_id 1 is a comment on a set. There are thousands of them and
     they are a third of the record, so they are attached to their set rather
     than kept as rows of their own. */
  log('comments');
  var comments = db.table('Comment') || [];
  var setNote = {}, dayNote = {}, nSetNotes = 0;
  comments.forEach(function (c) {
    if (c.owner_type_id === 1) { setNote[c.owner_id] = c.comment; nSetNotes++; }
    else { dayNote[c.date] = c.comment; }
  });
  stats.setComments = nSetNotes;

  /* ── supersets ── */
  log('supersets');
  var groups = db.table('WorkoutGroup') || [];
  var groupEx = db.table('WorkoutGroupExercise') || [];
  var members = {};
  groupEx.forEach(function (g) {
    (members[g.workout_group_id] || (members[g.workout_group_id] = [])).push('fn' + g.exercise_id);
  });
  /* A superset's colour may repeat a category's: they never share a rail, so
     a collision here costs nothing and nearest is the honest answer. */
  var nearest = function (rgb) {
    var best = 0, bestD = Infinity;
    for (var s = 0; s < TRAIN.SLOTS; s++) {
      var d = slotDistance(s, rgb);
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  };
  groups.forEach(function (g) {
    push('sgroup', g.date, 'fn' + g._id, {
      name: g.name,
      slot: nearest(argbToRgb(g.colour || 0)),
      ex: members[g._id] || [],
      jump: g.auto_jump_enabled ? 1 : 0,
      resthold: g.rest_timer_auto_start_enabled ? 1 : 0,
    });
  });
  stats.supersets = groups.length;

  /* ── the training log ──
     One row per set, keyed on the FitNotes row id so a second import is a
     no-op. `ord` is the position within that exercise on that day, which
     FitNotes expresses as the order of the ids. */
  log('sets');
  var tl = db.table('training_log') || [];
  tl.sort(function (a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : a._id - b._id;
  });
  var ordCount = {}, days = {}, prs = 0, kgSets = 0, lbSets = 0;
  tl.forEach(function (t) {
    var okey = t.date + '|' + t.exercise_id;
    ordCount[okey] = (ordCount[okey] || 0) + 1;
    var unit = UNIT[t.unit] || 'kg';
    if (unit === 'kg') kgSets++; else lbSets++;
    if (t.is_personal_record) prs++;
    days[t.date] = 1;
    push('set', t.date, 'fn' + t._id, {
      ex: 'fn' + t.exercise_id,
      kg: t.metric_weight || 0,
      r: t.reps || 0,
      u: unit,
      done: t.is_complete ? 1 : 0,
      pr: t.is_personal_record ? 1 : 0,
      prf: t.is_personal_record_first ? 1 : 0,
      dist: t.distance || 0,
      dur: t.duration_seconds || 0,
      note: setNote[t._id] || '',
      ord: ordCount[okey],
    });
  });
  stats.sets = tl.length;
  stats.days = Object.keys(days).length;
  stats.prSets = prs;
  stats.kgSets = kgSets;
  stats.lbSets = lbSets;

  /* ── the day: when the workout started and ended, and its comment ── */
  log('workout times');
  var times = db.table('WorkoutTime') || [];
  var byDate = {};
  times.forEach(function (w) {
    byDate[w.workout_date] = { start: w.start_date_time || null, end: w.end_date_time || null };
  });
  Object.keys(dayNote).forEach(function (d) {
    var k = String(d).slice(0, 10);
    byDate[k] = byDate[k] || {};
    byDate[k].note = dayNote[d];
  });
  Object.keys(byDate).forEach(function (d) {
    push('session', d, '', byDate[d]);
  });
  stats.workoutTimes = times.length;

  /* ── routines ── */
  log('routines');
  var routines = db.table('Routine') || [];
  var sections = db.table('RoutineSection') || [];
  var secEx = db.table('RoutineSectionExercise') || [];
  var secSets = db.table('RoutineSectionExerciseSet') || [];
  var setsFor = {};
  secSets.forEach(function (s) {
    (setsFor[s.routine_section_exercise_id] || (setsFor[s.routine_section_exercise_id] = [])).push({
      kg: s.metric_weight || 0, r: s.reps || 0, u: UNIT[s.unit] || 'kg',
      dist: s.distance || 0, dur: s.duration_seconds || 0, ord: s.sort_order || 0,
    });
  });
  routines.forEach(function (r) {
    push('program', null, 'fn' + r._id, { name: r.name, ord: r.sort_order || 0 });
  });
  sections.forEach(function (s) {
    push('progday', null, 'fn' + s.routine_id + '.' + s._id,
      { program: 'fn' + s.routine_id, name: s.name, ord: s.sort_order || 0 });
  });
  secEx.forEach(function (e) {
    var list = (setsFor[e._id] || []).sort(function (a, b) { return a.ord - b.ord; });
    push('progex', null, 'fn' + e.routine_section_id + '.' + e._id, {
      day: 'fn' + e.routine_section_id, ex: 'fn' + e.exercise_id,
      ord: e.sort_order || 0, fill: e.populate_sets_type || 0, sets: list,
    });
  });
  stats.routines = routines.length;

  /* ── goals ── */
  log('goals');
  var goals = db.table('Goal') || [];
  goals.forEach(function (g) {
    push('goal', null, 'fn' + g._id, {
      kind: g.type_id, ex: g.exercise_id ? 'fn' + g.exercise_id : null,
      kg: g.metric_weight || 0, r: g.reps || 0, u: UNIT[g.unit] || 'kg',
      title: g.title || '', from: g.start_date || null, to: g.target_date || null,
      dist: g.distance || 0, dur: g.duration_seconds || 0, ord: g.sort_order || 0,
    });
  });
  stats.goals = goals.length;

  /* ── the gym: plates and bars are configuration, not records ── */
  log('settings');
  var plates = (db.table('Plate') || []).map(function (p) {
    return { kg: p.unit === 0 ? p.weight : p.weight / LB_PER_KG, w: p.weight,
             u: UNIT[p.unit] || 'kg', n: p.count, on: p.enabled ? 1 : 0,
             colour: p.colour, wr: p.width_ratio, hr: p.height_ratio };
  });
  var bars = (db.table('Barbell') || []).map(function (b) {
    return { w: b.weight, u: UNIT[b.unit] || 'kg', ex: b.exercise_id || 0 };
  });
  stats.plates = plates.length;
  stats.bars = bars.length;

  /* Body weight and measurements are STATUS's, not TRAIN's. They are counted
     so the panel can offer them, and deliberately not imported here. */
  var bodyRows = (db.table('MeasurementRecord') || []).length +
                 (db.table('BodyWeight') || []).length;
  stats.bodyRowsSkipped = bodyRows;

  /* ── one write ──
     Rec.set announces after every row, which for twelve thousand sets would
     redraw the screen twelve thousand times. merge writes them all and tells
     the app once. */
  log('saving');
  var changed = Rec.merge(rows);
  stats.rowsBuilt = rows.length;
  stats.rowsWritten = changed;

  if (plates.length) Rec.setting(APP.id, 'plates', plates);
  if (bars.length) Rec.setting(APP.id, 'bars', bars);

  /* FitNotes' own settings, for the ones TRAIN has an equivalent for. The
     display unit is left alone: it is asked for on first run and is his
     choice, not the file's. */
  var fs = (db.table('settings') || [])[0];
  if (fs) {
    if (fs.rest_timer_seconds != null) Rec.setting(APP.id, 'restSeconds', fs.rest_timer_seconds);
    if (fs.rest_timer_auto_start != null) Rec.setting(APP.id, 'restAuto', fs.rest_timer_auto_start ? 1 : 0);
    if (fs.rest_timer_vibrate != null) Rec.setting(APP.id, 'restVibrate', fs.rest_timer_vibrate ? 1 : 0);
    if (fs.rest_timer_sound != null) Rec.setting(APP.id, 'restSound', fs.rest_timer_sound ? 1 : 0);
    if (fs.weight_increment != null) Rec.setting(APP.id, 'increment', fs.weight_increment);
    if (fs.mark_sets_complete != null) Rec.setting(APP.id, 'markComplete', fs.mark_sets_complete ? 1 : 0);
    if (fs.track_personal_records != null) Rec.setting(APP.id, 'trackPRs', fs.track_personal_records ? 1 : 0);
    if (fs.auto_select_next_set != null) Rec.setting(APP.id, 'autoNext', fs.auto_select_next_set ? 1 : 0);
    if (fs.keep_screen_on != null) Rec.setting(APP.id, 'keepAwake', fs.keep_screen_on ? 1 : 0);
    if (fs.first_day_of_week != null) Rec.setting(APP.id, 'weekStart', fs.first_day_of_week);
    stats.settings = 1;
  }

  TRAIN.reindex();
  Object.keys(days).forEach(TRAIN.assertTick);
  return stats;
};

/* ═══════════════════ THE IMPORT PANEL ═══════════════════ */
TRAIN.importPanel = function () {
  UI.dialog({
    title: 'IMPORT FROM FITNOTES', width: 460,
    body: function (b) {
      var p = UI.el('div', 'empty');
      p.innerHTML =
        'Open FitNotes, then <b>Settings ▸ Backup ▸ Backup Now</b>, and get the ' +
        '<b>.fitnotes</b> file onto this device.<br><br>' +
        'Everything comes across: every set, every set comment, your exercises, ' +
        'your categories, your workout times, your supersets and your routines.<br><br>' +
        'Importing <b>merges</b>. The same file twice changes nothing, and anything ' +
        'you have logged in TRAIN since is never overwritten.<br><br>' +
        '<b>It only goes one way.</b> There is no export back into FitNotes.<br><br>' +
        'Body weight and measurements are not imported. Those belong to STATUS.';
      b.appendChild(p);

      var bar = UI.el('div', 'bar'); bar.style.marginTop = 'var(--s-4)';
      var fill = UI.el('i'); bar.appendChild(fill); bar.style.display = 'none';
      b.appendChild(bar);

      var out = UI.el('div'); out.style.marginTop = 'var(--s-3)';
      b.appendChild(out);

      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.fitnotes,.db,.sqlite,application/octet-stream';
      input.style.display = 'none';
      b.appendChild(input);

      var steps = ['categories', 'exercises', 'comments', 'supersets', 'sets',
                   'workout times', 'routines', 'goals', 'settings', 'saving'];
      input.onchange = function () {
        var f = input.files && input.files[0];
        if (!f) return;
        bar.style.display = '';
        out.innerHTML = '<div class="empty">reading ' + UI.esc(f.name) + '…</div>';
        var fr = new FileReader();
        fr.onerror = function () {
          out.innerHTML = '<div class="empty">Could not read that file.</div>';
        };
        fr.onload = function () {
          setTimeout(function () {
            try {
              var stats = TRAIN.importFitNotes(fr.result, function (step) {
                var i = steps.indexOf(step);
                fill.style.width = Math.round(((i + 1) / steps.length) * 100) + '%';
              });
              fill.style.width = '100%';
              out.innerHTML = TRAIN.statsHtml(stats);
              Mobile.feedback('complete');
              draw();
            } catch (e) {
              bar.style.display = 'none';
              out.innerHTML = '<div class="empty"><b>Import failed.</b><br>' +
                UI.esc(e.message || String(e)) + '</div>';
              console.error(e);
            }
          }, 30);
        };
        fr.readAsArrayBuffer(f);
      };

      var pick = UI.el('button', 'mb-btn mb-press mb-tap');
      pick.textContent = 'CHOOSE A .FITNOTES FILE';
      pick.style.marginTop = 'var(--s-4)';
      pick.style.width = '100%';
      pick.onclick = function () { input.click(); };
      b.appendChild(pick);
    },
    actions: [{ label: 'CLOSE' }],
  });
};

TRAIN.statsHtml = function (s) {
  var line = function (k, v) {
    return '<div class="imp-stat"><span>' + k + '</span><b>' +
      (typeof v === 'number' ? v.toLocaleString() : v) + '</b></div>';
  };
  return line('Sets', s.sets) + line('Workout days', s.days) +
    line('Exercises', s.exercises) + line('Categories', s.categories) +
    line('Set comments', s.setComments) + line('Workout timings', s.workoutTimes) +
    line('Supersets', s.supersets) + line('Personal records', s.prSets) +
    line('Entered in kg / lb', s.kgSets + ' / ' + s.lbSets) +
    line('Routines', s.routines) +
    line('Rows written', s.rowsWritten + ' of ' + s.rowsBuilt);
};

/* ═══════════════════ THE DAY ═══════════════════ */
TRAIN.date = Day.today();

/* The marker that says this set carries a comment. Four thousand of his sets
   have one, so it needed to be visible without taking a line each. */
var BUBBLE = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">' +
  '<path d="M4 4h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg>';

TRAIN.go = function (date) {
  if (date > Day.today()) return;            /* the future is not a record */
  TRAIN.date = date;
  draw();
};

function drawDateBar() {
  var w = document.getElementById('when');
  var d = TRAIN.date, label;
  if (Day.isToday(d)) label = 'TODAY';
  else if (d === Day.shift(Day.today(), -1)) label = 'YESTERDAY';
  else {
    var dt = new Date(d + 'T12:00:00');
    label = dt.toLocaleDateString(undefined, { weekday: 'long' }) + ', ' +
      dt.toLocaleDateString(undefined, { month: 'long' }) + ' ' + dt.getDate();
  }
  w.innerHTML = '<span class="d">' + UI.esc(label) + '</span>';
  document.getElementById('next').style.visibility =
    Day.isToday(TRAIN.date) ? 'hidden' : 'visible';
}

function draw() {
  drawDateBar();
  var m = document.getElementById('main');
  m.innerHTML = '';

  var date = TRAIN.date;
  var groups = TRAIN.dayGroups(date);
  var cats = TRAIN.cats();
  var unit = TRAIN.unit();

  if (!groups.length) { drawEmptyDay(m); return; }

  /* The workout's start and end, above the first exercise, only when there is
     one recorded. */
  var sess = Rec.get('session', date, '') || {};
  if (sess.start) {
    var t = UI.el('div', 'timecard');
    t.innerHTML = '<span class="rng">' + UI.esc(clockOf(sess.start)) +
      (sess.end ? ' – ' + UI.esc(clockOf(sess.end)) : '') + '</span>' +
      (sess.end ? '<span class="len">' + fmtLen(sess.start, sess.end) + '</span>' : '');
    m.appendChild(t);
  }
  if (sess.note) {
    var dn = UI.el('div', 'exblock');
    dn.style.padding = 'var(--s-3) var(--s-4)';
    dn.innerHTML = '<div class="daynote">' + UI.esc(sess.note) + '</div>';
    m.appendChild(dn);
  }

  groups.forEach(function (g) {
    var cat = g.def.cat ? cats[g.def.cat] : null;
    var block = UI.el('div', 'exblock');
    /* The hairline under the exercise name carries the category colour. In
       FitNotes it is always the accent; here it is the one place a muscle
       group can be told apart at a glance without adding furniture. */
    if (cat) block.style.setProperty('--cat', TRAIN.slotColor(cat.slot));

    var done = g.sets.every(function (s) { return s.done; });
    var head = UI.el('div', 'head mb-press mb-tap');
    head.innerHTML = '<span class="nm">' + UI.esc(g.def.name) + '</span>' +
      '<span class="tickdot' + (done ? '' : ' off') + '">' + (done ? '✓' : '') + '</span>';
    head.onclick = function () { TRAIN.openExercise(g.ex); };
    block.appendChild(head);

    var sets = UI.el('div', 'sets');
    g.sets.forEach(function (s) {
      var row = UI.el('div', 'setrow' + (s.pr ? ' pr' : '') + (s.note ? ' has-note' : ''));
      row.innerHTML = '<span class="cmt" title="' + UI.esc(s.note || '') + '">' + BUBBLE + '</span>' +
        '<span class="grow"></span>' + setCols(s);
      sets.appendChild(row);
    });
    block.appendChild(sets);
    m.appendChild(block);
  });
}

/* Weight then reps, each right-aligned in its own column, each a bold number
   with a small unit after it. Cardio and timed holds put whatever they have
   in the same two columns rather than growing a third. */
function setCols(s) {
  var out = '';
  if (s.dist) {
    out += '<span class="col w"><b>' + s.dist + '</b> <span class="u">dist</span></span>';
  } else if (s.kg) {
    out += '<span class="col w"><b>' + TRAIN.showWeight(s.kg, s.u) +
      '</b> <span class="u">' + TRAIN.unitLabel() + '</span></span>';
  } else {
    out += '<span class="col w"></span>';
  }
  if (s.dur) {
    out += '<span class="col r"><b>' + fmtSecs(s.dur) + '</b></span>';
  } else {
    out += '<span class="col r"><b>' + (s.r || 0) + '</b> <span class="u">reps</span></span>';
  }
  return out;
}

/* ── the empty day ──
   "Workout Log Empty", then the two things FitNotes offers: start one, or
   copy the last one. Copying the previous workout is how a repeated session
   gets logged in one tap, so it is not a nicety. */
function drawEmptyDay(m) {
  var box = UI.el('div', 'emptyday');
  box.innerHTML = '<div class="say">Workout Log Empty</div>';
  m.appendChild(box);

  var acts = UI.el('div', 'startbox');
  var start = UI.el('button', 'bigact mb-press mb-tap');
  start.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
    '<span>Start New Workout</span>';
  start.onclick = function () { Mobile.feedback('open'); TRAIN.addExercise(); };
  acts.appendChild(start);

  var prev = TRAIN.previousWorkout(TRAIN.date);
  if (prev) {
    var copy = UI.el('button', 'bigact mb-press mb-tap');
    copy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/>' +
      '<path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>' +
      '<span>Copy Previous Workout</span>';
    copy.onclick = function () { TRAIN.copyWorkout(prev, TRAIN.date); };
    acts.appendChild(copy);
  }

  /* The one moment the importer is worth a place on screen: a store with
     nothing in it. After that it lives in Settings and never comes back. */
  if (!Object.keys(TRAIN.idx.byDate).length) {
    var imp = UI.el('button', 'bigact mb-press mb-tap');
    imp.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round"><path d="M12 3v12M8 11l4 4 4-4"/>' +
      '<path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>' +
      '<span>Import from FitNotes</span>';
    imp.onclick = function () { TRAIN.importPanel(); };
    acts.appendChild(imp);
  }
  m.appendChild(acts);
}

/* The most recent day before this one that has any sets. */
TRAIN.previousWorkout = function (before) {
  var dates = Object.keys(TRAIN.idx.byDate).sort();
  for (var i = dates.length - 1; i >= 0; i--) if (dates[i] < before) return dates[i];
  return null;
};

function clockOf(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(11, 16);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
/* FitNotes writes a workout's length as "1h 12m", not as a stopwatch, and it
   drops the leftover seconds rather than rounding them. His 5 August workout
   ran 72m 56s and the app calls it 1h 12m; rounding would call it 1h 13m. */
function fmtLen(a, b) {
  var ms = Date.parse(b) - Date.parse(a);
  if (!(ms > 0)) return '';
  var mins = Math.floor(ms / 60000), h = Math.floor(mins / 60);
  return (h ? h + 'h ' : '') + (mins % 60) + 'm';
}
function fmtSecs(n) {
  n = n | 0;
  var h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), s = n % 60;
  if (h) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}

/* ═══════════════════ NAVIGATION ═══════════════════ */
document.getElementById('prev').onclick = function () {
  TRAIN.go(Day.shift(TRAIN.date, -1)); Mobile.feedback('select');
};
document.getElementById('next').onclick = function () {
  TRAIN.go(Day.shift(TRAIN.date, 1)); Mobile.feedback('select');
};
document.getElementById('when').onclick = function () {
  TRAIN.go(Day.today()); Mobile.feedback('select');
};

/* Swiping the date strip moves a day, which is how the day gets changed in
   the gym without looking at the screen. */
(function () {
  var bar = document.getElementById('datebar'), x0 = null, y0 = null;
  bar.addEventListener('touchstart', function (e) {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  bar.addEventListener('touchend', function (e) {
    if (x0 == null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx)) return;
    TRAIN.go(Day.shift(TRAIN.date, dx < 0 ? 1 : -1));
    Mobile.feedback('select');
  }, { passive: true });
})();

/* ── the overflow menu ──
   FitNotes' own list, in its own order, minus Body Tracker, which is STATUS's
   job and is not built here. Import is not in this menu and not in the top
   bar: it is a once-ever action and it lives in Settings, plus on the empty
   screen of a store with nothing in it, which is the only moment it matters. */
document.getElementById('moreBtn').onclick = function (e) {
  var r = e.currentTarget.getBoundingClientRect();
  UI.menu(r.right, r.bottom, [
    { label: 'Settings', fn: function () { TRAIN.settings(); } },
    { label: 'Copy Workout', fn: function () { soon('Copy Workout'); } },
    { label: 'Comment Workout', fn: function () { soon('Comment Workout'); } },
    { label: 'Time Workout', fn: function () { soon('Time Workout'); } },
    { label: 'Share Workout', fn: function () { soon('Share Workout'); } },
    { label: 'Analysis', fn: function () { soon('Analysis'); } },
  ]);
};
document.getElementById('addBtn').onclick = function () {
  Mobile.feedback('open'); TRAIN.addExercise();
};
document.getElementById('calBtn').onclick = function () { soon('Calendar'); };
document.getElementById('drawer').onclick = function () { soon('the menu'); };

function soon(what) { UI.toast(UI.esc(what) + ' is not built yet'); }

/* Stubs the workout screen already calls. Each becomes a real screen next. */
TRAIN.addExercise = function () { soon('The exercise picker'); };
TRAIN.openExercise = function () { soon('The training screen'); };
TRAIN.copyWorkout = function () { soon('Copy Workout'); };

/* ── settings ──
   The shared panel, with TRAIN's own tab in front of it. Import sits here,
   under a heading that says what it is for, because after the first week it
   is the last thing he ever needs to reach. */
TRAIN.settings = function () {
  UI.settings(APP.id, [{
    id: 'train', name: 'TRAIN',
    draw: function (pane) {
      pane.appendChild(UI.row('Weight unit',
        'What every weight on screen is shown in. Your data is stored in kilograms ' +
        'either way, so switching is safe and changes nothing underneath.',
        UI.segmented([{ id: 'lb', name: 'LB' }, { id: 'kg', name: 'KG' }],
          TRAIN.unit(), function (v) { Rec.setting(APP.id, 'unit', v); draw(); })));

      var h = UI.el('div', 'mb-group');
      h.textContent = 'COMING FROM FITNOTES';
      pane.appendChild(h);

      var b = UI.el('button', 'mb-btn mb-press mb-tap');
      b.style.width = '100%';
      b.textContent = 'IMPORT A FITNOTES BACKUP';
      b.onclick = function () { TRAIN.importPanel(); };
      pane.appendChild(b);

      var n = UI.el('div', 'empty');
      n.style.marginTop = 'var(--s-3)';
      var have = Object.keys(TRAIN.idx.byDate).length;
      n.innerHTML = have
        ? '<b>' + Rec.count('set').toLocaleString() + '</b> sets across <b>' + have +
          '</b> days are already in. Importing the same file again changes nothing.'
        : 'Nothing imported yet. This is a one-time move and it only goes one way.';
      pane.appendChild(n);
    },
  }]);
};

/* ═══════════════════ BOOT ═══════════════════ */
Rec.ready(function () {
  TRAIN.reindex();
  draw();
});
Rec.on(function () { TRAIN.reindex(); draw(); });
Day.on(draw);
TRAIN.reindex();
draw();
</script>
