<meta name="mb-version" content="1.0.38, 2026-09-26">

<script>
/* ═══════════════════ A CLIENT'S TRAIN ═══════════════════
   Tom, 2026-09-22: COACH "should act exactly like train just on their
   profile". So COACH opens this same file as train/index.html?client=<pid>,
   and before a line of TRAIN runs, the store is pointed at that client:
   every TRAIN type is read and written as COACH's type for it, with the
   client's id in front of the key, which is exactly how COACH already keeps
   the file a client sends. TRAIN below is not told, and needs no second
   copy of itself.
     set cset · exercise cex · phase cphase · session csession
     excat cexcat · sgroup csgroup · goal cgoal
     program cprogram · progday cprogday · progex cprogex
   Tom's own ticks are not the client's, so a tick is neither read nor
   written. Every TRAIN setting changed here is saved as the client's
   (train.<pid>|name). Tom, 2026-09-25: "I dont want my train to be
   affected" — until then only three were, and a unit changed on a client
   changed his own TRAIN. A setting the client has never had reads Tom's,
   so a new client starts on his setup; three never do (whether TRAIN has
   greeted them, the record rule, a running rest timer). Theme and sound
   are kept by the device per app, outside the store, and stay shared.
   Rec.patch, map, keys, count and setting all go through the calls
   replaced here, so they follow without being touched. */
(function () {
  var m = /[?&]client=([^&#]+)/.exec(location.search);
  if (!m) return;
  var pid = decodeURIComponent(m[1]), pre = pid + '|';
  var T = { set: 'cset', exercise: 'cex', phase: 'cphase', session: 'csession', excat: 'cexcat',
    sgroup: 'csgroup', goal: 'cgoal', program: 'cprogram', progday: 'cprogday', progex: 'cprogex' };
  var B = {}; Object.keys(T).forEach(function (k) { B[T[k]] = k; });
  var MINE = { 'train.seen': 1, 'train.prRule': 1, 'train.rest': 1 };
  var DROP = { tick: 1, activity: 1 };
  var raw = {};
  ['get', 'set', 'del', 'has', 'row', 'all', 'tombstone', 'tombstones', 'idOf', 'merge', 'export', 'on'].forEach(function (f) { raw[f] = Rec[f]; });
  /* `read` is a lookup: a setting the client has no row for yet answers
     with Tom's. A write always lands on the client's. */
  function to(type, key, read) {
    if (T[type]) return [T[type], pre + (key == null ? '' : key)];
    if (type === 'setting' && String(key).indexOf('train.') === 0) {
      var theirs = 'train.' + pre + key.slice(6);
      if (!read || MINE[key] || raw.row('setting', null, theirs)) return [type, theirs];
    }
    return [type, key];
  }
  /* a stored row back as TRAIN wrote it, or null when it is someone else's */
  function back(r) {
    if (!r || !B[r.type]) return r;
    if (String(r.key).indexOf(pre) !== 0) return null;
    return Object.assign({}, r, { type: B[r.type], key: String(r.key).slice(pre.length) });
  }
  function wrap(f, none, read) {
    return function (type, date, key, x) {
      if (DROP[type]) return none;
      var a = to(type, key, read);
      return f.call(Rec, a[0], date, a[1], x);
    };
  }
  Rec.client = pid;
  Rec.get = wrap(raw.get, null, 1);
  Rec.set = wrap(raw.set, null);
  Rec.del = wrap(raw.del, null);
  Rec.has = wrap(raw.has, false, 1);
  Rec.tombstone = wrap(function (t, d, k) { return back(raw.tombstone(t, d, k)); }, null);
  Rec.row = wrap(function (t, d, k) { return back(raw.row(t, d, k)); }, null, 1);
  Rec.idOf = wrap(raw.idOf, null);
  Rec.all = function (type, opt) {
    if (DROP[type]) return [];
    if (!T[type]) return raw.all(type, opt);
    return raw.all(T[type], opt).map(back).filter(Boolean);
  };
  Rec.tombstones = function (type, since) {
    return T[type] ? raw.tombstones(T[type], since).map(back).filter(Boolean) : raw.tombstones(type, since);
  };
  Rec.export = function (types) {
    return raw.export((types || Object.keys(T)).map(function (t) { return T[t] || t; })).map(back).filter(Boolean);
  };
  /* Not Rec.merge itself: that is how rows from the other tabs and frames
     arrive, already in their own types, and they must land as they are. An
     import into a client's profile asks for this one by name. */
  Rec.mergeClient = function (rows) {
    return raw.merge((rows || []).filter(function (r) { return r && !DROP[r.type]; }).map(function (r) {
      if (!T[r.type]) return r;
      var a = to(r.type, r.key);
      return Object.assign({}, r, { type: a[0], key: a[1], id: raw.idOf(a[0], r.date || null, a[1]) });
    }));
  };
  /* what changed, told the way TRAIN would have written it */
  Rec.on = function (f) {
    return raw.on(function (rows) { f(rows && rows.map(function (r) { return back(r) || r; })); });
  };
})();
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-1);
  font-family:var(--font-body);font-size:var(--f-3);font-weight:var(--w-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}

/* ── the top bar ──
   FitNotes: drawer, title, then calendar, add and overflow. Icons are drawn
   here as SVG; nothing is lifted from the app. */
header{
  flex:0 0 auto;display:flex;align-items:center;
  padding:calc(var(--s-2) + var(--safe-t)) var(--s-2) var(--s-2);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);
}
.logo{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--f-4);
  letter-spacing:.14em;padding-left:var(--s-2)}
.logo b{color:var(--accent)}
.spacer{flex:1}
/* One icon button shape for the whole app: a --tap target with a glyph a little bigger than the text. */
.ico{width:var(--tap);height:var(--tap);flex:0 0 auto;border:0;background:none;
  cursor:pointer;color:var(--text-2);border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;padding:0}
.ico svg{width:1.4em;height:1.4em;display:block}
.ico.on{color:var(--accent)}

/* ── the date strip ──
   FitNotes puts the day, and the two arrows that move it, directly under the
   title. The whole strip is also the swipe target: left and right move a day,
   which is how he already navigates without looking. */
.datebar{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s-2);
  padding:var(--s-2) var(--s-3);background:var(--surface-2);
  box-shadow:var(--rim);touch-action:pan-y;user-select:none;
}
.datebar .arrow{
  width:var(--tap);height:var(--tap);flex:0 0 auto;border:0;background:none;cursor:pointer;
  color:var(--text-2);font-size:var(--f-5);line-height:1;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center}
.datebar .when{
  flex:1;min-width:0;text-align:center;border:0;background:none;cursor:pointer;
  color:inherit;font:inherit;padding:var(--s-2);border-radius:var(--radius-md);
  min-height:var(--tap);display:flex;align-items:center;justify-content:center}
/* One line, uppercase: "TODAY", or "WEDNESDAY, AUGUST 5". FitNotes shows the
   day itself, not how long ago it was — the calendar is where you go for
   that, and a second line here would push the workout down the screen. */
.datebar .when .d{font-family:var(--font-display);font-weight:var(--w-bold);
  font-size:var(--f-2);letter-spacing:.08em;display:block;line-height:1.2;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebar .when.future .d{color:var(--text-muted)}
/* The accent hairline under the date is FitNotes' one piece of chrome, and
   it is what tells you the bar above is a control and not a heading. */
.datebar{border-bottom:calc(var(--border-width) * 2) solid var(--accent)}

main{flex:1;min-height:0;display:flex;flex-direction:column;
  padding:var(--s-3) var(--s-3) calc(var(--s-5) + var(--safe-b))}
.wrap{max-width:calc(var(--s-10) * 5);margin:0 auto;width:100%;flex:1;
  display:flex;flex-direction:column;gap:var(--s-3)}

.card{border-radius:var(--radius-lg);background:var(--surface-1);
  padding:var(--s-4);box-shadow:var(--e-1),var(--rim)}
h2{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-3)}
.empty{color:var(--text-muted);line-height:var(--lh-body)}

/* ── one exercise inside a day ──
   FitNotes gives each exercise its own card: the name across the top, a
   hairline in the accent colour under it, then the sets. The sets are set
   right, because the numbers are the thing you scan and a ragged left edge
   on a column of weights is unreadable. There are no set numbers here —
   those live on the training screen, where you are editing one of them. */
.exblock{border-radius:var(--radius-md);background:var(--surface-1);
  box-shadow:var(--e-1),var(--rim);overflow:hidden;display:flex;flex-direction:column}
.exblock .head{display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);min-height:var(--tap);cursor:pointer;
  border-bottom:var(--border-width) solid var(--cat,var(--accent))}
.exblock .head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:var(--f-4);color:var(--text-2)}
.sets{display:flex;flex-direction:column;padding:var(--s-2) var(--s-4) var(--s-3)}

/* Weight and reps are two right-aligned columns so they stack into a grid
   down the card. Tabular numerals keep 4.0 and 12.5 the same width. */
.setrow{display:flex;align-items:baseline;padding:var(--s-2) 0;
  font-variant-numeric:tabular-nums}
.setrow .cmt{width:1.25em;flex:0 0 auto;color:var(--accent);opacity:0;font-size:var(--f-2)}
.setrow.has-note .cmt{opacity:1}
.setrow .grow{flex:1}
.setrow .col{text-align:right;white-space:nowrap}
.setrow .col.w{min-width:7.5em}
.setrow .col.r{min-width:5.5em}
.setrow b{font-size:var(--f-4);font-weight:var(--w-bold);color:var(--text-2)}
.setrow .u{color:var(--text-muted);font-size:var(--f-2)}
.setrow.pr b{color:var(--accent)}
/* A warmup happened and does not count. Dimmed rather than hidden: it is part
   of what you did, just not part of what you did that counts. */
.setrow.warm{opacity:.55}
.setrow.warm b{font-weight:var(--w-body)}
.wtag{font-size:var(--f-1);letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);margin-left:var(--s-2)}

/* The complete tick, filled when every set in the exercise is done. */
.tickdot{width:1.4em;height:1.4em;flex:0 0 auto;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--accent-fg);font-size:var(--f-1);line-height:1}
.tickdot.off{background:none;box-shadow:inset 0 0 0 calc(var(--border-width) * 2) var(--border-strong)}

/* The workout's start and end, the card FitNotes puts above the first
   exercise. Shown only when there is a time recorded. */
.timecard{display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);border-radius:var(--radius-md);
  background:var(--surface-1);box-shadow:var(--e-1),var(--rim);
  font-variant-numeric:tabular-nums;color:var(--text-2)}
.timecard .rng{flex:1;font-size:var(--f-4)}
.timecard .len{color:var(--text-muted)}

.daynote{color:var(--text-2);line-height:var(--lh-body);font-size:var(--f-2)}

/* ── the empty day ──
   "Workout Log Empty" sits in the middle, and the two things you actually do
   next sit near the bottom where the thumb is. */
/* No height in vh. On an iPhone 1vh is a hundredth of the screen with Safari's
   toolbars hidden, so a 52vh minimum asked for more room than the page had and
   pushed Copy Previous Workout off the bottom, 130px too tall at 390x664.
   flex:1 fills whatever is really there. */
.emptyday{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s-4)}

/* ── a wide control inside a UI.row ──
   shared/ui.js stacks a row whose control is a text box or a select (fixed
   2026-09-14). A row of swatches or chips is TRAIN's own and is stacked here. */
.mb-row:has(> .swatches),
.mb-row:has(> .mb-chips){flex-direction:column;align-items:stretch;gap:var(--s-2)}
.mb-row:has(> .swatches) > .lbl,
.mb-row:has(> .mb-chips) > .lbl{flex:none}
/* Same vh trap as the empty day: svh is the screen with toolbars showing. */
.chartbox.big{height:60vh;height:60svh}
.emptyday .say{color:var(--text-muted);font-size:var(--f-5)}
.startbox{display:flex;flex-direction:column;align-items:center;gap:var(--s-5);
  padding-bottom:var(--s-5)}
.bigact{display:flex;flex-direction:column;align-items:center;gap:var(--s-2);
  border:0;background:none;cursor:pointer;color:var(--text-2);font:inherit;
  padding:var(--s-3) var(--s-4);border-radius:var(--radius-md);min-height:var(--tap)}
.bigact svg{width:1.75em;height:1.75em;color:var(--accent)}

/* No floating button: FitNotes puts add in the top bar, and a FAB here would
   sit on top of the last set of the day. */

/* ══════════ THE EXERCISE PICKER ══════════
   A search field pinned above a plain list. FitNotes shows categories first
   and drills into one; the search box cuts straight to exercises, because
   typing three letters beats two taps once you know what you want. */
.search{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-3);
  background:var(--surface-2);border-radius:var(--radius-md)}
.search svg{width:1.15em;height:1.15em;flex:0 0 auto;color:var(--text-muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--text-1);
  font:inherit;font-size:var(--f-3);padding:var(--s-2) 0;outline:none;
  min-height:var(--tap)}

.plist{display:flex;flex-direction:column;background:var(--surface-1);
  border-radius:var(--radius-md);box-shadow:var(--e-1),var(--rim);overflow:hidden}
.prow{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);
  min-height:var(--tap);cursor:pointer;border:0;background:none;color:inherit;
  font:inherit;text-align:left;border-bottom:var(--border-width) solid var(--border)}
.prow:last-child{border-bottom:0}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--f-4);color:var(--text-2)}
.prow .sub{font-size:var(--f-1);color:var(--text-muted);white-space:nowrap}
.prow .dot,.mrow .dot{width:var(--s-2);height:var(--s-2);border-radius:var(--radius-full);flex:0 0 auto;
  background:var(--cat,var(--border-strong))}
.prow.added .nm{color:var(--text-muted)}
.sortoffer{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-2) var(--s-3);
  padding:var(--s-3) var(--s-4);margin-bottom:var(--s-3);background:var(--surface-1);
  border-radius:var(--radius-md);box-shadow:var(--e-1),var(--rim)}
.sortoffer .msg{flex:1 1 12em;min-width:0;color:var(--text-2);line-height:var(--lh-body)}
.sortoffer .mb-btn:first-of-type{margin-left:auto}

/* ══════════ THE TRAINING SCREEN ══════════ */
.tabs{flex:0 0 auto;display:flex;background:var(--surface-1);box-shadow:var(--rim)}
.tabs button{flex:1;border:0;background:none;cursor:pointer;color:var(--text-muted);
  font-family:var(--font-display);font-size:var(--f-2);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);min-height:var(--tap);padding:var(--s-3) var(--s-2);
  border-bottom:calc(var(--border-width) * 2) solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* The field label with its hairline, exactly as FitNotes draws it. */
.fieldlabel{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);
  padding-bottom:var(--s-2);border-bottom:var(--border-width) solid var(--accent);margin-bottom:var(--s-3)}
.fieldlabel.withplates{display:flex;align-items:baseline;gap:var(--s-3)}
.fieldlabel .plates{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:normal;color:var(--text-2);font-variant-numeric:tabular-nums}

/* − [big number] +  — the control he uses more than any other in the app, so
   the buttons are oversized and the number is the biggest thing on screen. */
.stepper{display:flex;align-items:center;justify-content:center;gap:var(--s-4)}
/* One step down from 48 x 52 filled, and outlined rather than filled: two of
   these and their labels were the whole top half of the screen. The number
   takes the room between them instead of a fixed 8ch, so it is centred
   however wide it is. min-width:0 is the flex-input trap in Known traps. */
.stepper button{width:var(--tap);height:var(--tap);flex:0 0 auto;border:0;cursor:pointer;
  border-radius:var(--radius-md);background:none;color:var(--text-2);
  box-shadow:inset 0 0 0 var(--border-width) var(--border-strong);
  font-size:var(--f-5);line-height:1;display:flex;align-items:center;justify-content:center}
.stepper input{flex:1;min-width:0;text-align:center;border:0;
  border-bottom:var(--border-width) solid var(--border-strong);
  background:none;color:var(--text-1);font:inherit;font-size:var(--f-7);font-weight:var(--w-bold);
  font-variant-numeric:tabular-nums;padding:var(--s-2) 0;outline:none}
.stepper input:focus{border-bottom-color:var(--accent)}

.gobar{display:flex;gap:var(--s-3);margin-top:var(--s-4)}
.gobar button{flex:1;min-height:var(--tap);border:0;border-radius:var(--radius-md);
  cursor:pointer;font-family:var(--font-display);font-weight:var(--w-bold);
  font-size:var(--f-3);letter-spacing:var(--track-cap)}
/* Green and blue are FitNotes' colours and belong to no theme here, so the
   two buttons looked imported from another app. One accent, one quiet. */
.gobar .save{flex:2;background:var(--accent);color:var(--accent-fg)}
.gobar .clear{background:none;color:var(--text-2);
  box-shadow:inset 0 0 0 var(--border-width) var(--border-strong)}

/* The day's sets for this exercise. Tapping one loads it into the steppers
   above, which is how an existing set gets corrected. */
/* The bubble and the tick box were each a full 44px tall inside 8px of
   padding, so a row stood 61px and four sets cost 68px more than they need.
   Both carry mb-tap, which keeps the 44px target while the drawing shrinks,
   so the row is now exactly the 44 the rules ask for and nothing else. */
.tset{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-1) 0;
  border-bottom:var(--border-width) solid var(--border);cursor:pointer;
  font-variant-numeric:tabular-nums;min-height:var(--tap)}
.tset.sel{background:color-mix(in srgb, var(--accent) 14%, transparent)}
/* Swipe to delete moves the row's contents onto a face, so the row's layout
   and colours are the face's, over the page's own background, or DELETE
   would show through it. The row keeps only its hairline. */
.tset.mb-swipe{display:block;padding:0;border-radius:0}
.tset > .mb-swipe-face{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-1) 0;
  min-height:calc(var(--tap) - var(--border-width));background:var(--bg)}
.tset.sel > .mb-swipe-face{background:color-mix(in srgb, var(--accent) 14%, var(--bg))}
.tset.lifted > .mb-swipe-face{background:var(--surface-3);transform:none!important}
.tset .bub{width:var(--s-6);height:var(--s-6);flex:0 0 auto;border:0;background:none;cursor:pointer;
  color:var(--border-strong);display:flex;align-items:center;justify-content:center;padding:0}
.tset .bub.on{color:var(--accent)}
.tset .idx{width:2em;flex:0 0 auto;color:var(--text-muted);font-size:var(--f-2)}
.tset .grow{flex:1}
.tset .col{text-align:right;white-space:nowrap}
.tset .col.w{min-width:7em}
.tset .col.r{min-width:5em}
.tset b{font-size:var(--f-4);font-weight:var(--w-bold);color:var(--text-2)}
.tset .u{color:var(--text-muted);font-size:var(--f-2)}
.tset .chk{width:var(--s-6);height:var(--s-6);flex:0 0 auto;border:0;background:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tset .chk i{width:1.4em;height:1.4em;border-radius:var(--radius-sm);
  box-shadow:inset 0 0 0 calc(var(--border-width) * 2) var(--border-strong);display:flex;
  align-items:center;justify-content:center;font-size:var(--f-2);font-style:normal;line-height:1}
.tset .chk.on i{background:var(--accent);color:var(--accent-fg);box-shadow:none}

/* The previous time he did this movement, above the steppers. It is the one
   number that decides what he loads, so it is not buried in HISTORY. */
.lasttime{font-size:var(--f-1);color:var(--text-muted);line-height:var(--lh-tight)}
/* Tom, 2026-09-22 asked for one line cut off with an ellipsis. Tom,
   2026-09-24 saw it cut a number in half and asked for it to wrap. Two lines
   is the answer to both: still small and faded, and it stops mid-word only
   when even two lines cannot hold it. */
.lastline{padding:var(--s-1) var(--s-1) 0}
.lastline .lasttime{display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:2;overflow:hidden}
.lasttime b{color:var(--text-2);font-variant-numeric:tabular-nums}

/* ══════════ THE DAY'S EXERCISES DRAWER ══════════ */
.dwrap{position:fixed;inset:0;z-index:60;display:none}
.dwrap.open{display:block}
.dwrap .scrim{position:absolute;inset:0;background:var(--overlay);
  opacity:0;transition:opacity var(--dur-med) var(--ease-out)}
.dwrap.in .scrim{opacity:1}
.dpanel{position:absolute;top:0;bottom:0;left:0;width:min(84vw, calc(var(--s-10) * 2.65));
  background:var(--surface-1);box-shadow:var(--e-4);display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform var(--dur-sheet) var(--ease-sheet);
  padding-top:var(--safe-t);padding-left:var(--safe-l)}
.dwrap.in .dpanel{transform:translateX(0)}
.dhead{padding:var(--s-4) var(--s-4) var(--s-3)}
.dhead b{font-family:var(--font-display);font-size:var(--f-2);letter-spacing:var(--track-cap)}
.dhead span{display:block;font-size:var(--f-1);color:var(--text-muted);margin-top:var(--s-2)}
.dlist{flex:1;min-height:0;overflow:auto}
.dlist .prow.here{background:color-mix(in srgb, var(--accent) 14%, transparent)}
/* A row held and picked up: lifted off the list, and it keeps its own
   background so the rows it passes over stay readable behind it. */
/* holdToMove. A held row never selects its text or raises the phone's own
   callout, which would take the press away from the page. A card being
   sorted shows only its head, so a list of tall cards fits one screen. */
.mvlist > [data-key]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mvlist > [data-key].lifted{background:var(--surface-3);box-shadow:var(--e-3),inset 0 0 0 var(--border-width) var(--accent);
  border-radius:var(--radius-md);border-bottom-color:transparent;position:relative;z-index:2}
.mvlist.sorting > .exblock > :not(.head){display:none}
.exlist{display:flex;flex-direction:column;gap:var(--s-3)}
.mvlist.sorting > .exblock > .head{border-bottom-color:transparent}
.dfoot{border-top:var(--border-width) solid var(--border);padding-bottom:var(--safe-b)}
.dfoot button{display:flex;align-items:center;gap:var(--s-3);width:100%;border:0;
  background:none;cursor:pointer;color:var(--text-2);font:inherit;text-align:left;
  padding:var(--s-3) var(--s-4);min-height:var(--tap)}
.dfoot svg{width:1.25em;height:1.25em;flex:0 0 auto;color:var(--text-muted)}

/* ══════════ CALENDAR ══════════ */
.calhead{display:flex;align-items:center;gap:var(--s-2)}
.caltitle{flex:1;text-align:center;font-family:var(--font-display);font-weight:var(--w-bold);
  font-size:var(--f-3);letter-spacing:var(--track-cap)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s-1)}
.caldow{text-align:center;font-size:var(--f-1);color:var(--text-muted);
  letter-spacing:var(--track-cap);padding:var(--s-2) 0}
.calcell{min-height:var(--tap);border:0;background:none;cursor:pointer;color:var(--text-2);
  font:inherit;border-radius:var(--radius-sm);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--s-1);padding:var(--s-2) 0}
.calcell.empty{visibility:hidden;pointer-events:none}
.calcell .n{font-variant-numeric:tabular-nums;font-size:var(--f-3)}
.calcell .dots{display:flex;gap:var(--s-1);height:.4em}
.calcell .dots i{width:.4em;height:.4em;border-radius:var(--radius-full);display:block}
.calcell.today .n{background:var(--accent);color:var(--accent-fg);
  width:1.9em;height:1.9em;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center}
.calcell.sel{box-shadow:inset 0 0 0 calc(var(--border-width) * 2) var(--accent)}
.calcell.future{color:var(--text-muted);opacity:.45}
.calfoot{text-align:center;padding:var(--s-3);color:var(--text-muted);
  font-size:var(--f-1);letter-spacing:var(--track-cap)}
.calfoot b{color:var(--text-2)}

/* ══════════ ANALYSIS ══════════ */
.statrow{display:flex;justify-content:space-between;gap:var(--s-3);flex-wrap:wrap}
.statrow span{display:flex;flex-direction:column;font-size:var(--f-1);
  color:var(--text-muted);letter-spacing:var(--track-cap);text-transform:uppercase}
.statrow b{font-size:var(--f-4);color:var(--text-2);font-variant-numeric:tabular-nums;
  letter-spacing:0;text-transform:none}
.barrow{padding:var(--s-3) 0;border-bottom:var(--border-width) solid var(--border)}
.barrow:last-child{border-bottom:0}
.barrow .lbl{display:flex;justify-content:space-between;gap:var(--s-3);align-items:baseline}
.barrow .lbl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .lbl .v{color:var(--text-muted);font-size:var(--f-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:var(--s-2);border-radius:var(--radius-full);background:var(--surface-3);
  overflow:hidden;margin:var(--s-2) 0}
.track>i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-full)}
.barrow .sub,.sub{font-size:var(--f-1);color:var(--text-muted)}

/* ══════════ RECORDS ══════════ */
.recline{display:flex;align-items:baseline;gap:var(--s-3);padding:var(--s-2) 0}
.recline .k{flex:1;min-width:0;color:var(--text-muted);font-size:var(--f-2)}
.recline .v{font-variant-numeric:tabular-nums;color:var(--text-2)}
.recline .d{width:5.5em;text-align:right;color:var(--text-muted);font-size:var(--f-1)}

/* ══════════ THE REST COUNTDOWN ══════════
   It was a full band under the tabs until 2026-09-24: 55px of the screen,
   the whole time he rests, on a screen he had just called cramped. It is a
   chip in the top bar now, standing exactly where the rest timer's own
   button already stood, so resting costs no height at all and the bar does
   not change width.

   It counts past zero on purpose: a browser tab that was suspended cannot
   claim it was counting, so it reports the truth from the clock instead. */
.restchip{width:auto;min-width:calc(var(--s-7) + var(--s-2));padding:0 var(--s-2);
  position:relative;overflow:hidden;font-family:var(--font-display);
  font-size:var(--f-2);font-weight:var(--w-bold);font-variant-numeric:tabular-nums;
  color:var(--accent);box-shadow:inset 0 0 0 var(--border-width) var(--accent);
  display:flex;align-items:center;justify-content:center}
.restchip .fill{position:absolute;left:0;bottom:0;height:calc(var(--border-width) * 2);
  background:var(--accent);transition:width var(--dur-fast) linear}


/* ══════════ THE APP MENU ══════════ */
.navrow{display:flex;align-items:center;gap:var(--s-3);width:100%;border:0;
  background:none;cursor:pointer;color:var(--text-2);font:inherit;text-align:left;
  padding:var(--s-3) var(--s-4);min-height:var(--tap)}
.navrow.on{color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent)}
.navrow svg{width:1.25em;height:1.25em;flex:0 0 auto}

/* ── the import panel ── */
.imp-stat{display:flex;justify-content:space-between;gap:var(--s-3);
  padding:var(--s-2) 0;font-size:var(--f-2);border-bottom:var(--border-width) solid var(--border)}
.imp-stat:last-child{border-bottom:0}
/* the notes preview: a day, then each exercise and what was read for it */
.nt-sum{margin-top:var(--s-4);font-family:var(--font-display);font-weight:var(--w-bold);color:var(--text-1)}
.nt-day{margin-top:var(--s-4);padding-bottom:var(--s-1);border-bottom:var(--border-width) solid var(--border);
  font-size:var(--f-2);color:var(--text-2)}
.nt-day b{font-family:var(--font-display);color:var(--text-1);margin-right:var(--s-2)}
.nt-day em{font-style:normal;color:var(--warn)}
.nt-ex{display:flex;justify-content:space-between;gap:var(--s-3);margin-top:var(--s-2);font-size:var(--f-2);color:var(--text-1)}
.nt-ex i{font-style:normal;color:var(--text-muted);text-align:right}
.nt-sets{font-size:var(--f-1);color:var(--text-2);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.nt-miss{margin-top:var(--s-2);font-size:var(--f-1);color:var(--text-muted);overflow-wrap:anywhere}
.nt-miss b{color:var(--warn)}
.imp-stat b{font-variant-numeric:tabular-nums}
.bar{height:var(--s-2);border-radius:var(--radius-full);background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;
  transition:width var(--dur-fast) linear}

/* ══════════ PARITY ══════════ */
.pad{padding:var(--s-3) var(--s-4)}
.ico:disabled{opacity:.3}
.ico .mb-ico,.stepper .mb-ico,.gobar .mb-ico{width:1.4em;height:1.4em;display:block}
/* A row with a main button and its own menu button. Buttons cannot nest, so
   the row is a div and each half is its own target. */
div.prow{padding:0}
.prow .pmain{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-3) var(--s-4);min-height:var(--tap);border:0;background:none;
  color:inherit;font:inherit;text-align:left;cursor:pointer}
.prow .rowmenu{color:var(--text-muted)}
.prow .fav{color:var(--accent);display:flex}
.prow .fav .mb-ico{width:1em;height:1em}
.mrow{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap);
  border-bottom:var(--border-width) solid var(--border)}
.mrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .count{width:5em;flex:0 0 auto;text-align:right}
.swatches{display:flex;flex-wrap:wrap;gap:var(--s-2);max-width:calc(var(--tap) * 6 + var(--s-2) * 5)}
.swatch{width:var(--tap);height:var(--tap);border-radius:var(--radius-full);cursor:pointer;
  border:calc(var(--border-width) * 2) solid var(--surface-1);box-shadow:0 0 0 var(--border-width) var(--border)}
.swatch.on{box-shadow:0 0 0 calc(var(--border-width) * 3) var(--accent)}
.rmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.75em,1fr));gap:var(--s-2)}
.rmcell{display:flex;flex-direction:column;align-items:center;padding:var(--s-2);
  border-radius:var(--radius-sm);background:var(--surface-2);font-variant-numeric:tabular-nums}
.rmcell span{font-size:var(--f-1);color:var(--text-muted)}
.rmcell b{font-size:var(--f-3);color:var(--text-1)}
.rmcell.none b{color:var(--text-muted)}
.bigtime{text-align:center;font-size:var(--f-9);font-weight:var(--w-bold);line-height:var(--lh-tight);
  font-variant-numeric:tabular-nums;padding:var(--s-3) 0;color:var(--text-1)}
.bigtime .u{font-size:var(--f-3);color:var(--text-muted);font-weight:var(--w-body)}
.bigtime.over{color:var(--warn)}
.steplbl{min-width:5em;text-align:center;font-size:var(--f-5);font-weight:var(--w-bold);
  font-variant-numeric:tabular-nums}
.chartbox{height:calc(var(--s-10) + var(--s-8));cursor:pointer}
.chartbox .mb-dot{opacity:.85}
.trend{fill:none;stroke:var(--text-muted);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.calbanner{background:var(--accent);color:var(--accent-fg);text-align:center;font-weight:var(--w-bold);
  padding:var(--s-3);border-radius:var(--radius-md)}
.calmonth .caltitle{padding:var(--s-3) 0}
.calcount{position:sticky;bottom:0;display:flex;align-items:center;gap:var(--s-2);
  background:var(--surface-2);border-radius:var(--radius-md);box-shadow:var(--e-2)}
.calcount .n{flex:1;text-align:center;color:var(--text-muted);font-size:var(--f-1);letter-spacing:var(--track-cap)}
.calcount .n b{color:var(--text-2)}
.catname{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);text-transform:uppercase}
.sstag{font-size:var(--f-1);padding:0 var(--s-2);border-radius:var(--radius-full);
  color:var(--accent-fg);font-weight:var(--w-bold);white-space:nowrap}
.moresets{font-size:var(--f-1);color:var(--text-muted);text-align:right;padding-top:var(--s-1)}
.fieldrow + .fieldlabel{margin-top:var(--s-4)}
/* ── TRACK, flat ──
   Tom, 2026-09-24: "Train is way too cramped, look at fitnotes and how
   elegant/seamless it feels." The steppers were a card and the day's sets
   were a second card, each with its own padding inside the page's own
   margin, so the numbers sat 28px from the edge and the screen read as boxes
   inside boxes. They sit on the page now with one hairline between them,
   which is what FitNotes does. */
.trackbox{padding:0 var(--s-1)}
.trackbox + .trackbox{margin-top:var(--s-2);padding-top:var(--s-3);
  border-top:var(--border-width) solid var(--border)}
.tset .reorder{display:flex}
.tset.warm{opacity:.55}
/* A set the app wrote on his behalf, copied from a day or filled from a
   routine, and not done yet. Saving no longer ticks a set, so this is the only
   thing left that tells a plan from work. */
.tset.plan b,.setrow.plan b{color:var(--text-muted)}
.tickdot .mb-ico,.tset .chk .mb-ico{width:.9em;height:.9em}
.datebar .arrow .mb-ico{width:1.2em;height:1.2em}
.dhead .mb-ico{width:1em;height:1em}
.kindsel{margin-top:var(--s-2)}

/* ══════════ TRAINING, NOT WORKING OUT ══════════ */
/* The session strip: its name, and the block and week it sits in. */
.sesshead{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-2) var(--s-2) var(--s-4);
  min-height:var(--tap);border-radius:var(--radius-md);background:var(--surface-1);
  box-shadow:var(--e-1),var(--rim);cursor:pointer}
.sesshead .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.sesshead .nm b{font-family:var(--font-display);font-size:var(--f-4);font-weight:var(--w-bold);
  color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sesshead .nm b.none{color:var(--text-muted);font-weight:var(--w-body)}
.sesshead .nm span{font-size:var(--f-1);color:var(--text-muted);letter-spacing:var(--track-cap);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sesshead.flat{box-shadow:none;background:none;padding:0;cursor:default}
.prow > .mb-ico{width:1.25em;height:1.25em;flex:0 0 auto;color:var(--text-muted)}

/* Set by set: the change against the same working set last time. */
.dl{font-size:var(--f-1);font-weight:var(--w-bold);font-variant-numeric:tabular-nums;
  white-space:nowrap;color:var(--text-muted);margin-left:var(--s-2)}
.dl.up{color:var(--success)}
.setrow .upmark,.tset .upmark{display:inline-flex;align-items:center;justify-content:center;width:var(--s-5,20px);flex:none;color:var(--success)}
.setrow .upmark svg,.tset .upmark svg{width:100%;height:auto}
.dl.down{color:var(--warn)}
.vsline{display:flex;gap:var(--s-2);flex-wrap:wrap;justify-content:space-between;
  padding:var(--s-2) var(--s-4) 0;font-size:var(--f-1);color:var(--text-muted)}
.vsline b{color:var(--text-2);font-weight:var(--w-bold)}
.tset .tmeta{display:block;text-align:right;font-size:var(--f-1);color:var(--text-muted);
  line-height:var(--lh-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tset .tmeta .dl{margin-left:0}
.setrow{flex-wrap:wrap}
.setrow .smeta{flex-basis:100%;text-align:right;line-height:var(--lh-tight)}
.setrow .smeta .dl{margin-left:0}
.recap .gain{font-family:var(--font-display);font-size:var(--f-4);font-weight:var(--w-bold);
  color:var(--text-2);font-variant-numeric:tabular-nums}
.recap .gain.up{color:var(--success)}
.recap .gain.down{color:var(--warn)}
.tset .grow{min-width:0}

/* Setup: straps, seat height, pads. Toggles are chips, settings are small boxes. */
.setup{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2)}
.setup .sufield{display:flex;align-items:center;gap:var(--s-2);font-size:var(--f-2);color:var(--text-2)}
.setup .sufield .mb-input{width:4.5em;min-width:0;text-align:center}
.setup .ico{margin-left:auto}
.sulist .ico{color:var(--text-muted)}

/* ── the card: a session, a week or a profile, made to be shared ──
   One shape for all three, drawn from tokens only, so the picture is in the
   theme he is wearing. */
.recap{border-radius:var(--radius-lg);background:var(--surface-1);box-shadow:var(--e-2),var(--rim);
  padding:var(--s-5);display:flex;flex-direction:column;gap:var(--s-4);overflow:hidden}
.recap .eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3);
  font-size:var(--f-1);letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--text-muted)}
.recap .eyebrow span{white-space:nowrap;flex:0 0 auto}
.recap .eyebrow b{color:var(--accent);font-weight:var(--w-bold);text-align:right;min-width:0}
.recap .title{font-family:var(--font-display);font-size:var(--f-7);font-weight:var(--w-bold);
  line-height:var(--lh-tight);color:var(--text-1);overflow-wrap:anywhere}
.recap .rule{height:calc(var(--border-width) * 2);background:var(--accent)}
.recap .big4{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4) var(--s-3)}
.recap .big4 > div{display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.recap .big4 span{font-size:var(--f-1);letter-spacing:var(--track-cap);text-transform:uppercase;color:var(--text-muted)}
.recap .big4 b{font-family:var(--font-display);font-size:var(--f-6);font-weight:var(--w-bold);
  font-variant-numeric:tabular-nums;color:var(--text-1);line-height:var(--lh-tight);white-space:nowrap}
.recap .big4 small{font-size:var(--f-2);color:var(--text-muted);font-weight:var(--w-body)}
.recap .big4 em{font-style:normal;font-size:var(--f-1);color:var(--text-muted);font-variant-numeric:tabular-nums}
.recap h3{font-family:var(--font-display);font-size:var(--f-1);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);color:var(--text-muted);margin-bottom:var(--s-2)}
.recap .strong{color:var(--text-2)}
.recap .strong b{font-family:var(--font-display);font-size:var(--f-5);color:var(--text-1)}
.recap .ticks{display:flex;flex-wrap:wrap;gap:var(--s-1);margin-top:var(--s-3)}
.recap .ticks i{width:var(--s-3);height:var(--s-3);border-radius:var(--radius-sm);background:var(--surface-3)}
.recap .ticks i.up{background:var(--success)}
.recap .ticks i.down{background:var(--warn)}
.recap .ticks i.new{background:none;box-shadow:inset 0 0 0 var(--border-width) var(--border-strong)}
.recap .musc{display:flex;flex-direction:column;gap:var(--s-2)}
.recap .mrow2,.recap .mhead{display:grid;grid-template-columns:7em 1fr 2.5em;align-items:center;
  gap:var(--s-3);font-size:var(--f-2)}
.recap .mrow2.wk,.recap .mhead{grid-template-columns:7em 1fr 2.5em 2.5em}
.recap .mhead h3{grid-column:1 / 3;margin:0}
.recap .mhead span{font-size:var(--f-1);color:var(--text-muted);text-align:right;letter-spacing:var(--track-cap)}
.recap .mrow2 .nm{display:flex;align-items:center;gap:var(--s-2);min-width:0;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recap .dot,.heat .dot{width:var(--s-2);height:var(--s-2);border-radius:var(--radius-full);flex:0 0 auto;display:inline-block}
.recap .bar2{height:var(--s-2);border-radius:var(--radius-full);background:var(--surface-3);overflow:hidden}
.recap .bar2 i{display:block;height:100%;border-radius:var(--radius-full)}
.recap .mrow2 b,.recap .mrow2 em{font-variant-numeric:tabular-nums;text-align:right}
.recap .mrow2 b{color:var(--text-1)}
.recap .mrow2 em{font-style:normal;color:var(--text-muted)}
.recap .rec{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) 0;
  border-top:var(--border-width) solid var(--border)}
.recap .rec .mb-ico{width:1.2em;height:1.2em;color:var(--accent);flex:0 0 auto}
.recap .rec .nm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;
  gap:var(--s-1);color:var(--text-2);overflow-wrap:anywhere}
.recap .rec .v{font-variant-numeric:tabular-nums;color:var(--text-1);font-weight:var(--w-bold);white-space:nowrap}
.recap .rec .v small{color:var(--text-muted);font-weight:var(--w-body)}
.recap .pill{font-style:normal;font-size:var(--f-1);letter-spacing:.06em;text-transform:uppercase;padding:0 var(--s-2);
  border-radius:var(--radius-full);background:color-mix(in srgb, var(--accent) 18%, transparent);
  color:var(--accent);white-space:nowrap}
.recap .sub{font-size:var(--f-1);color:var(--text-muted);line-height:var(--lh-body)}
.recap .mark{font-family:var(--font-display);font-size:var(--f-1);letter-spacing:.14em;
  color:var(--text-muted);text-align:right}
.recap .mark b{color:var(--accent)}

/* The week: arrows either side of which week it is. */
.weeknav{display:flex;flex-direction:row;align-items:center;gap:var(--s-2)}
.weeknav .t{flex:1;text-align:center;font-family:var(--font-display);font-weight:var(--w-bold);
  letter-spacing:var(--track-cap);font-size:var(--f-2)}
/* Eight weeks of sets per muscle. Read-only: a cell is too small to be a
   target, so the arrows above are how a week is opened. */
.heat{display:grid;gap:var(--s-1);align-items:center;font-size:var(--f-1)}
.heat .hn{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:var(--s-2);min-width:0}
.heat .hh{text-align:center;color:var(--text-muted)}
.heat .hh.on{color:var(--accent);font-weight:var(--w-bold)}
.heat .hc{min-height:var(--s-6);border-radius:var(--radius-sm);display:flex;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums;color:var(--text-1);background:var(--surface-2)}
.heat .hc.on{box-shadow:inset 0 0 0 calc(var(--border-width) * 2) var(--accent)}
</style>
</head>
