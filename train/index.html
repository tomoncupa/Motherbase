/* ═══════════════════ THE DAY ═══════════════════ */
TRAIN.date = Day.today();

/* The marker that says this set carries a comment. Four thousand of his sets
   have one, so it needed to be visible without taking a line each. */
var BUBBLE = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">' +
  '<path d="M4 4h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg>';

TRAIN.go = function (date) {
  if (date > Day.today()) return;            /* the future is not a record */
  TRAIN.date = date;
  draw();
};

function drawDateBar() {
  var w = document.getElementById('when');
  var d = TRAIN.date, label;
  if (Day.isToday(d)) label = 'TODAY';
  else if (d === Day.shift(Day.today(), -1)) label = 'YESTERDAY';
  else {
    var dt = new Date(d + 'T12:00:00');
    label = dt.toLocaleDateString(undefined, { weekday: 'long' }) + ', ' +
      dt.toLocaleDateString(undefined, { month: 'long' }) + ' ' + dt.getDate();
  }
  w.innerHTML = '<span class="d">' + UI.esc(label) + '</span>';
  document.getElementById('next').style.visibility =
    Day.isToday(TRAIN.date) ? 'hidden' : 'visible';
}

/* ═══════════════════ THE SCREEN ROUTER ═══════════════════
   Three screens, the same three FitNotes has: the day's workout, the exercise
   picker, and the training screen for one exercise. The top bar and the date
   strip belong to the workout screen and change or disappear on the others. */
TRAIN.screen = 'workout';
TRAIN.exId = null;
TRAIN.tab = 'track';
TRAIN.picking = null;      /* the category being browsed, or null for all */
TRAIN.sel = null;          /* the set currently loaded into the steppers */

/* One trap, held for as long as we are off the workout screen, so the system
   back gesture comes home instead of leaving the app. Mobile.trap hands back
   a release function and it has to be kept: calling it is what unwinds the
   history entry it pushed. */
TRAIN._rel = null;

TRAIN.show = function (screen, opts) {
  opts = opts || {};
  TRAIN.screen = screen;
  if (opts.ex !== undefined) TRAIN.exId = opts.ex;
  if (opts.cat !== undefined) TRAIN.picking = opts.cat;
  if (screen !== 'training') TRAIN.sel = null;

  if (screen === 'workout') {
    if (TRAIN._rel) { var r = TRAIN._rel; TRAIN._rel = null; r(); }
  } else if (!TRAIN._rel && g_Mobile()) {
    TRAIN._rel = Mobile.trap(function () { TRAIN._rel = null; TRAIN.show('workout'); });
  }

  draw();
  var main = document.querySelector('main');
  if (main) main.scrollTop = 0;
};
function g_Mobile() { return typeof Mobile !== 'undefined' && Mobile.trap; }


/* System back closes what is open rather than leaving the app. */
TRAIN.back = function () {
  if (TRAIN.screen === 'training') return TRAIN.show('workout');
  if (TRAIN.screen === 'calendar' && TRAIN.calPick) {
    var bk = TRAIN.calPick.back || 'workout';
    TRAIN.calPick = null;
    return TRAIN.show(bk === 'calendar' ? 'workout' : bk);
  }
  if (TRAIN.screen === 'picker') {
    if (TRAIN.picking) return TRAIN.show('picker', { cat: null });
    var into = TRAIN.pickInto;
    TRAIN.pickInto = null;
    if (into && into.day) return TRAIN.show('routines');
    return TRAIN.show('workout');
  }
  if (TRAIN.screen === 'routines' && TRAIN.progOpen) { TRAIN.progOpen = null; return draw(); }
  if (TRAIN.screen !== 'workout') return TRAIN.show('workout');
  return false;
};

function draw() {
  drawChrome();
  var m = document.getElementById('main');
  m.innerHTML = '';
  if (TRAIN.screen === 'picker') return drawPicker(m);
  if (TRAIN.screen === 'training') return drawTraining(m);
  if (TRAIN.screen === 'calendar') return drawCalendar(m);
  if (TRAIN.screen === 'routines') return drawRoutines(m);
  if (TRAIN.screen === 'analysis') return drawAnalysis(m);
  if (TRAIN.screen === 'records') return drawRecords(m);
  if (TRAIN.screen === 'goals') return drawGoals(m);
  if (TRAIN.screen === 'profile') return drawProfile(m);
  return drawWorkout(m);
}

var SCREEN_TITLE = {
  calendar: 'Calendar', routines: 'Training Routines', analysis: 'Analysis',
  records: 'Personal Records', goals: 'Goals', profile: 'Profile',
};

/* The bar, the date strip and the tabs, arranged for whichever screen is up. */
function drawChrome() {
  var scr = TRAIN.screen, onWorkout = scr === 'workout', onTraining = scr === 'training';
  document.getElementById('datebar').style.display = onWorkout ? '' : 'none';
  document.getElementById('tabs').style.display = onTraining ? '' : 'none';
  document.getElementById('calBtn').style.display = onWorkout ? '' : 'none';
  document.getElementById('addBtn').style.display = onWorkout ? '' : 'none';
  /* The training screen's bar is FitNotes': timer, records, overview, more. */
  ['timerBtn', 'trophyBtn', 'infoBtn'].forEach(function (id) {
    document.getElementById(id).style.display = onTraining ? '' : 'none';
  });
  /* Drawn on every draw, because a theme owns the stroke and a drawing made
     under the last theme keeps the last theme's line. */
  document.getElementById('calBtn').innerHTML = ico('today');
  document.getElementById('addBtn').innerHTML = ico('add');
  document.getElementById('moreBtn').innerHTML = ico('menu');
  document.getElementById('timerBtn').innerHTML = ico('timer');
  document.getElementById('trophyBtn').innerHTML = ico('record');
  document.getElementById('infoBtn').innerHTML = ico('info');
  document.getElementById('prev').innerHTML = ico('back');
  document.getElementById('next').innerHTML = ico('next');

  var left = document.getElementById('drawer');
  var isBack = scr === 'picker' || (scr === 'routines' && TRAIN.progOpen) ||
    (scr === 'calendar' && TRAIN.calPick);
  left.innerHTML = isBack ? ico('back') : ico('nav');
  left.setAttribute('aria-label', isBack ? 'Back' : onTraining ? "Today's exercises" : 'Menu');
  left.dataset.back = isBack ? '1' : '';

  var logo = document.querySelector('.logo'), title = null;
  if (onTraining) {
    var ex = TRAIN.exercises()[TRAIN.exId];
    title = ex ? ex.name : 'Exercise';
  } else if (scr === 'picker') {
    if (TRAIN.pickInto && TRAIN.pickInto.replace) title = 'Replace Exercise';
    else if (TRAIN.pickInto && TRAIN.pickInto.day) title = 'Add Exercise';
    else if (TRAIN.picking === '*fav') title = 'Favourites';
    else { var c = TRAIN.picking ? TRAIN.cats()[TRAIN.picking] : null; title = c ? c.name : 'All Exercises'; }
  } else if (scr === 'routines' && TRAIN.progOpen) {
    title = (TRAIN.programs()[TRAIN.progOpen] || {}).name || 'Routine';
  } else if (scr === 'records') {
    title = TRAIN.recRange().from ? 'Block Records'
      : TRAIN.phases().length ? 'All-Time Records' : 'Personal Records';
  } else if (SCREEN_TITLE[scr]) {
    title = SCREEN_TITLE[scr];
  }
  if (title == null) {
    logo.innerHTML = 'TRA<b>IN</b>';
    logo.style.cssText = '';
  } else {
    logo.textContent = title;
    logo.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  }
  if (onWorkout) drawDateBar();
  if (onTraining) {
    [].forEach.call(document.getElementById('tabs').children, function (b) {
      b.className = 'mb-press' + (b.dataset.tab === TRAIN.tab ? ' on' : '');
    });
  }
}

function drawWorkout(m) {
  var date = TRAIN.date;
  var groups = TRAIN.dayGroups(date);
  var cats = TRAIN.cats();
  var unit = TRAIN.unit();

  if (!groups.length) { drawEmptyDay(m); return; }
  m.appendChild(sessionHead(date));

  /* The workout's start and end, above the first exercise, only when there is
     one recorded. */
  var sess = Rec.get('session', date, '') || {};
  if (sess.start) {
    var t = UI.el('div', 'timecard');
    t.innerHTML = '<span class="rng">' + UI.esc(clockOf(sess.start)) +
      (sess.end ? ' – ' + UI.esc(clockOf(sess.end)) : '') + '</span>' +
      (sess.end ? '<span class="len">' + fmtLen(sess.start, sess.end) + '</span>' : '');
    m.appendChild(t);
  }
  if (sess.note) {
    var dn = UI.el('div', 'exblock');
    dn.style.padding = 'var(--s-3) var(--s-4)';
    dn.innerHTML = '<div class="daynote">' + UI.esc(sess.note) + '</div>';
    m.appendChild(dn);
  }

  /* Set by set against the session it repeats. See "how much stronger". */
  var cmp = TRAIN.dayCompare(date);

  /* FitNotes' Home Screen settings: how much of the category to show, how
     many sets per exercise before "+N more", and whether the tick box shows. */
  var catShow = Rec.setting(APP.id, 'catShow') || 'none';
  var limit = Rec.setting(APP.id, 'setLimit') | 0;
  var showChk = Rec.setting(APP.id, 'markComplete') !== 0;
  var groupsToday = TRAIN.groupsOn(date);

  groups.forEach(function (g) {
    var cat = g.def.cat ? cats[g.def.cat] : null;
    var block = UI.el('div', 'exblock');
    /* The hairline under the name is the accent, as in FitNotes, unless the
       setting asks for the category's own colour. */
    if (cat && catShow === 'both') block.style.setProperty('--cat', TRAIN.slotColor(cat.slot));

    var done = g.sets.every(function (s) { return s.done; });
    var grp = null;
    groupsToday.forEach(function (x) { if ((x.g.ex || []).indexOf(g.ex) > -1) grp = x; });
    var head = UI.el('div', 'head mb-press mb-tap');
    head.innerHTML = '<span class="nm">' + UI.esc(g.def.name) +
      (cat && catShow !== 'none' ? ' <span class="catname">' + UI.esc(cat.name) + '</span>' : '') + '</span>' +
      (grp ? '<span class="sstag" style="background:' + TRAIN.slotColor(grp.g.slot || 0) + '">' +
        UI.esc(grp.g.name) + '</span>' : '') +
      (showChk ? '<span class="tickdot' + (done ? '' : ' off') + '">' + (done ? ico('done') : '') + '</span>' : '');
    head.onclick = function () { TRAIN.openExercise(g.ex); };
    withMenu(head, function (e) { TRAIN.dayExerciseMenu(g.ex, e); });
    block.appendChild(head);

    /* Which session this exercise is measured against, and how its sets did. */
    var cr = cmp && cmp.byEx[g.ex];
    if (cr && cr.vs && cr.up + cr.down + cr.same) {
      var line = UI.el('div', 'vsline');
      line.innerHTML = '<span>vs <b>' + UI.esc(dayY(cr.vs.date, date)) + '</b></span><span>' +
        [cr.up ? cr.up + ' stronger' : '', cr.same ? cr.same + ' same' : '', cr.down ? cr.down + ' weaker' : '',
         gainText(cr.reps, cr.pctSum, cr.pctN)]
          .filter(Boolean).join(' · ') + '</span>';
      block.appendChild(line);
    }

    var sets = UI.el('div', 'sets');
    var shown = limit > 0 ? g.sets.slice(0, limit) : g.sets;
    shown.forEach(function (s) {
      var row = UI.el('div', 'setrow' + (s.pr ? ' pr' : '') + (s.note ? ' has-note' : '') +
        (s.warm ? ' warm' : ''));
      row.innerHTML = '<span class="cmt" title="' + UI.esc(s.note || '') + '">' + BUBBLE + '</span>' +
        (s.warm ? '<span class="wtag">warmup</span>' : '') +
        '<span class="grow"></span>' + setCols(s, g.ex) +
        /* its own line: weight, reps and a percentage do not fit beside the numbers at 390px */
        (cr && cr.bySet[s.key] ? '<span class="smeta">' + deltaChip(cr.bySet[s.key]) + '</span>' : '');
      sets.appendChild(row);
    });
    if (shown.length < g.sets.length) {
      var more = UI.el('div', 'moresets');
      more.textContent = '+' + (g.sets.length - shown.length) + ' more';
      sets.appendChild(more);
    }
    block.appendChild(sets);
    m.appendChild(block);
  });

  /* The end of the session adds itself up, in a card made to be shared. */
  var recap = TRAIN.recapCard(date, cmp);
  if (recap) {
    m.appendChild(recap);
    var sh = UI.el('button', 'mb-btn mb-press mb-tap');
    sh.style.width = '100%';
    sh.textContent = 'SHARE PICTURE';
    sh.onclick = function () { TRAIN.shareRecap(date); };
    m.appendChild(sh);
  }
}

/* Weight then reps, each right-aligned in its own column, each a bold number
   with a small unit after it. Cardio and timed holds put whatever they have
   in the same two columns rather than growing a third. */
function setCols(s, exId) {
  var f = TRAIN.fieldsOf(exId || s.ex), U = TRAIN.unitLabel();
  var cell = function (k) {
    if (k === 'w') return s.kg ? '<b>' + TRAIN.showWeight(s.kg, s.u) + '</b> <span class="u">' + U + '</span>' : '';
    if (k === 'r') return '<b>' + (s.r || 0) + '</b> <span class="u">reps</span>';
    if (k === 'd') return '<b>' + TRAIN.showDist(s.dist || 0) + '</b> <span class="u">' + TRAIN.distUnit() + '</span>';
    if (k === 't') return '<b>' + fmtSecs(s.dur || 0) + '</b>';
    return '';
  };
  return '<span class="col w">' + cell(f[0]) + '</span><span class="col r">' + cell(f[1]) + '</span>';
}

/* ── the empty day ──
   "Training Log Empty", then the two things FitNotes offers: start one, or
   copy the last one. Copying a past session is how a repeated session gets
   logged in one tap, so it is not a nicety. The words are Tom's (2026-09-14):
   he trains, he does not work out. */
function drawEmptyDay(m) {
  m.appendChild(sessionHead(TRAIN.date));
  var box = UI.el('div', 'emptyday');
  box.innerHTML = '<div class="say">Training Log Empty</div>';
  m.appendChild(box);

  var acts = UI.el('div', 'startbox');
  var start = UI.el('button', 'bigact mb-press mb-tap');
  start.innerHTML = ico('add') + '<span>Start New Session</span>';
  start.onclick = function () { Mobile.feedback('open'); TRAIN.addExercise(); };
  acts.appendChild(start);

  var prev = TRAIN.previousWorkout(TRAIN.date);
  if (prev) {
    var copy = UI.el('button', 'bigact mb-press mb-tap');
    copy.innerHTML = ico('copy') + '<span>Copy Past Session</span>';
    copy.onclick = function () { TRAIN.copyWorkout(prev, TRAIN.date); };
    acts.appendChild(copy);
  }

  /* The importer used to sit here too, on any empty day. It lives in Settings
     only now: it is a thing you do once, and an empty Tuesday is not a prompt
     to go and find a backup file. */
  m.appendChild(acts);
}

/* The most recent day before this one that has any sets. */
TRAIN.previousWorkout = function (before) {
  var dates = Object.keys(TRAIN.idx.byDate).sort();
  for (var i = dates.length - 1; i >= 0; i--) if (dates[i] < before) return dates[i];
  return null;
};

function clockOf(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(11, 16);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
/* FitNotes writes a workout's length as "1h 12m", not as a stopwatch, and it
   drops the leftover seconds rather than rounding them. His 5 August workout
   ran 72m 56s and the app calls it 1h 12m; rounding would call it 1h 13m. */
function fmtLen(a, b) {
  var ms = Date.parse(b) - Date.parse(a);
  if (!(ms > 0)) return '';
  var mins = Math.floor(ms / 60000), h = Math.floor(mins / 60);
  return (h ? h + 'h ' : '') + (mins % 60) + 'm';
}
function fmtSecs(n) {
  n = n | 0;
  var h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), s = n % 60;
  if (h) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}

/* ═════════════════════════════════════════════════════════════════════════
   WRITING SETS
   Every one of these re-asserts the day's tick, because the tick is derived
   from whether the day has sets and TRAIN is the one that gets to say so.
   ═════════════════════════════════════════════════════════════════════════ */
TRAIN.nextOrd = function (exId, date) {
  var mine = TRAIN.setsOn(date).filter(function (s) { return s.ex === exId; });
  var max = 0;
  mine.forEach(function (s) { if ((s.ord || 0) > max) max = s.ord; });
  return max + 1;
};

TRAIN.addSet = function (exId, date, fields) {
  var p = {
    ex: exId, kg: fields.kg || 0, r: fields.r || 0, u: TRAIN.unit(),
    done: 1,   /* a saved set happened; Mark Sets Complete only decides whether the box shows */
    pr: 0, prf: 0, dist: fields.dist || 0, dur: fields.dur || 0,
    note: '', ord: TRAIN.nextOrd(exId, date),
  };
  if (fields.su) p.su = fields.su;
  var key = TRAIN.newId();
  Rec.set('set', date, key, p);
  TRAIN.reindex();
  TRAIN.assertTick(date);
  return key;
};

TRAIN.patchSet = function (key, date, patch) {
  var cur = Rec.get('set', date, key);
  if (!cur) return null;
  var next = {}, k;
  for (k in cur) next[k] = cur[k];
  for (k in patch) next[k] = patch[k];
  Rec.set('set', date, key, next);
  TRAIN.reindex();
  return next;
};

TRAIN.removeSet = function (key, date) {
  var was = Rec.get('set', date, key);
  Rec.del('set', date, key);
  TRAIN.reindex();
  TRAIN.assertTick(date);
  Mobile.haptic('warn');
  UI.undo('set deleted', function () {
    Rec.set('set', date, key, was);
    TRAIN.reindex();
    TRAIN.assertTick(date);
    draw();
  });
};

/* ═════════════════ THE EXERCISE PICKER ═════════════════ */
var MAGNIFIER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

function drawPicker(m) {
  var q = (TRAIN.query || '').trim().toLowerCase();
  var cats = TRAIN.cats(), exs = TRAIN.exercises();

  var box = UI.el('div', 'search');
  box.innerHTML = MAGNIFIER;
  var input = UI.el('input');
  Mobile.field(input, 'search', {});
  input.placeholder = 'Search exercises';
  input.value = TRAIN.query || '';
  input.oninput = function () {
    TRAIN.query = input.value;
    var again = document.getElementById('main');
    var pos = input.selectionStart;
    drawPickerList(again);
    var live = again.querySelector('.search input');
    if (live) { live.focus(); live.setSelectionRange(pos, pos); }
  };
  box.appendChild(input);
  m.appendChild(box);

  /* ── the caret goes where the work is ──
     You come to this screen to find an exercise, so the box it searches with
     should already be waiting. Tom, 2026-09-05, asked for this everywhere it
     is relevant, and "relevant" is the whole rule: RECORDS has the same search
     box and does NOT get this, because you go there to read and a keyboard
     would cover the thing you came to read.

     Two guards, so it helps on arrival and never fights you afterwards. It
     only reaches for the box when it is empty, which is true on the way in and
     false once you have typed. And never when something else already has the
     caret, so a redraw mid-typing cannot steal it back. */
  if (!TRAIN.query && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) {
    UI.focusSoon(input);
  }

  var host = UI.el('div');
  host.id = 'pickhost';
  m.appendChild(host);
  drawList(host, q, cats, exs);
}

/* Redrawing on every keystroke would lose the caret, so search redraws only
   the list under the field. */
function drawPickerList(m) {
  var host = m.querySelector('#pickhost');
  if (!host) return drawPicker(m);
  drawList(host, (TRAIN.query || '').trim().toLowerCase(), TRAIN.cats(), TRAIN.exercises());
}

function drawList(host, q, cats, exs) {
  host.innerHTML = '';

  /* First, and unconditionally: this once sat below three early returns, so
     the button that makes your first exercise was the one you could never see. */
  var add = UI.el('button', 'mb-btn mb-press mb-tap');
  add.style.width = '100%';
  add.style.marginBottom = 'var(--s-3)';
  add.textContent = '+ CREATE NEW EXERCISE';
  add.onclick = function () { TRAIN.exerciseDialog(null); };
  host.appendChild(add);

  var list = UI.el('div', 'plist');
  var already = {};
  TRAIN.setsOn(TRAIN.date).forEach(function (s) { already[s.ex] = 1; });

  /* No search and no group chosen: favourites if there are any, then the
     groups, in his order or alphabetically. */
  if (!q && !TRAIN.picking) {
    var favs = Object.keys(exs).filter(function (id) { return exs[id].fav; });
    if (favs.length) list.appendChild(catRow('*fav', 'Favourites', null, favs.length));
    TRAIN.catsSorted().forEach(function (k) {
      var n = Object.keys(exs).filter(function (id) { return exs[id].cat === k; }).length;
      list.appendChild(catRow(k, cats[k].name, cats[k].slot, n));
    });
    host.appendChild(list);
    return;
  }

  /* FitNotes sorts an exercise list alphabetically or by when it was last used. */
  var sort = Rec.setting(APP.id, 'exSort') || 'alpha';
  var last = {};
  if (sort === 'recent') Object.keys(exs).forEach(function (id) {
    var h = TRAIN.historyOf(id);
    last[id] = h.length ? h[h.length - 1].date : '';
  });
  var rows = Object.keys(exs).map(function (id) { return { id: id, e: exs[id] }; })
    .filter(function (r) {
      if (q) return r.e.name.toLowerCase().indexOf(q) > -1;
      if (TRAIN.picking === '*fav') return !!r.e.fav;
      return r.e.cat === TRAIN.picking;
    })
    .sort(function (a, b) {
      if (sort === 'recent' && last[a.id] !== last[b.id]) return last[a.id] < last[b.id] ? 1 : -1;
      return a.e.name.localeCompare(b.e.name);
    });

  if (!rows.length) {
    var none = UI.el('div', 'empty');
    none.textContent = q ? 'No exercises found' : 'No exercises in here yet';
    host.appendChild(none);
    return;
  }

  var into = TRAIN.pickInto;
  rows.forEach(function (r) {
    var cat = cats[r.e.cat];
    var row = UI.el('div', 'prow' + (already[r.id] && !into ? ' added' : ''));
    if (cat) row.style.setProperty('--cat', TRAIN.slotColor(cat.slot));
    var sub = already[r.id] && !into ? 'added'
      : sort === 'recent' ? (last[r.id] ? Day.short(last[r.id]) : 'Never used')
      : (q && cat ? cat.name : '');
    var main = UI.el('button', 'pmain mb-press');
    main.innerHTML = '<span class="dot"></span><span class="nm">' + UI.esc(r.e.name) + '</span>' +
      (r.e.fav ? '<span class="fav">' + ico('favourite') + '</span>' : '') +
      (sub ? '<span class="sub">' + UI.esc(sub) + '</span>' : '');
    main.onclick = function () { pickExercise(r.id, r.e); };
    withMenu(main, function (e) { TRAIN.exerciseMenu(r.id, e); });
    row.appendChild(main);
    row.appendChild(rowMenuBtn('Options for ' + r.e.name, function (e) { TRAIN.exerciseMenu(r.id, e); }));
    list.appendChild(row);
  });
  host.appendChild(list);
}

function catRow(k, name, slot, n) {
  var row = UI.el('div', 'prow');
  if (slot != null) row.style.setProperty('--cat', TRAIN.slotColor(slot));
  var main = UI.el('button', 'pmain mb-press');
  main.innerHTML = (k === '*fav' ? '<span class="fav">' + ico('favourite') + '</span>' : '<span class="dot"></span>') +
    '<span class="nm">' + UI.esc(name) + '</span><span class="sub">' + n + '</span>';
  main.onclick = function () { TRAIN.show('picker', { cat: k }); };
  row.appendChild(main);
  if (k !== '*fav') {
    withMenu(main, function (e) { TRAIN.catMenu(k, e); });
    row.appendChild(rowMenuBtn('Options for ' + name, function (e) { TRAIN.catMenu(k, e); }));
  }
  return row;
}

/* What picking an exercise means depends on why the list is open: to train
   it, to add it to a routine day, or to replace another in a workout. */
function pickExercise(id, e) {
  Mobile.feedback('select');
  var into = TRAIN.pickInto;
  if (into && into.day) {
    Rec.set('progex', null, TRAIN.newId(), {
      day: into.day, ex: id, ord: TRAIN.exercisesOf(into.day).length, fill: 1, sets: [],
    });
    TRAIN.pickInto = null;
    TRAIN.show('routines');
    UI.toast(UI.esc(e.name) + ' added');
    return;
  }
  if (into && into.replace) {
    var from = into.replace, date = into.date || TRAIN.date;
    TRAIN.pickInto = null;
    TRAIN.replaceInDay(date, from, id);
    TRAIN.openExercise(id);
    UI.toast('Replaced with ' + UI.esc(e.name));
    return;
  }
  TRAIN.openExercise(id);
}

/* Create or edit one exercise: name, category, and the two things that
   actually change how it behaves — its weight step and its rest time. */
TRAIN.exerciseDialog = function (exId) {
  var exs = TRAIN.exercises(), cats = TRAIN.cats();
  var cur = exId ? exs[exId] : null;
  /* No categories is not a reason to refuse — it is a reason to make some. */
  if (!Object.keys(cats).length) { TRAIN.seedCats(); cats = TRAIN.cats(); }
  var kind = cur ? TRAIN.kindOf(exId) : 'wr';
  var nameEl = null, sel = null, inc = null, rest = null, also = {};
  if (cur && cur.also) Object.keys(cur.also).forEach(function (k) { also[k] = cur.also[k]; });

  UI.dialog({
    title: cur ? 'EDIT EXERCISE' : 'CREATE NEW EXERCISE', width: 460,
    body: function (b, h) {
      nameEl = UI.field('name', { value: cur ? cur.name : '', placeholder: 'Exercise name' });
      b.appendChild(UI.row('Name', '', nameEl));

      sel = document.createElement('select');
      sel.className = SEL;
      var fillCats = function (pick) {
        sel.innerHTML = '';
        TRAIN.catsSorted().forEach(function (id) {
          var o = document.createElement('option');
          o.value = id; o.textContent = TRAIN.cats()[id].name;
          sel.appendChild(o);
        });
        if (pick) sel.value = pick;
      };
      fillCats(cur && cur.cat && cats[cur.cat] ? cur.cat : (TRAIN.picking && cats[TRAIN.picking] ? TRAIN.picking : null));
      b.appendChild(UI.row('Category', '', sel));
      var newCat = UI.el('button', 'mb-btn mb-press mb-tap');
      newCat.textContent = 'NEW CATEGORY';
      newCat.onclick = function (ev) {
        ev.preventDefault();
        TRAIN.categoryDialog(null, function (key) { fillCats(key); paintAlso(); });
      };
      b.appendChild(newCat);

      /* FitNotes' six exercise types. */
      var ks = document.createElement('select');
      ks.className = SEL;
      Object.keys(KIND_NAMES).forEach(function (k) {
        var o = document.createElement('option');
        o.value = k; o.textContent = KIND_NAMES[k];
        ks.appendChild(o);
      });
      ks.value = kind;
      ks.onchange = function () { kind = ks.value; };
      b.appendChild(UI.row('Type', 'What each set records', ks));

      inc = UI.field('decimal', {
        value: cur && cur.inc ? String(cur.inc) : '',
        placeholder: String(Rec.setting(APP.id, 'increment') || 2.5),
      });
      b.appendChild(UI.row('Weight increment', 'Blank uses the default', inc));
      rest = UI.field('number', {
        value: cur && cur.rest ? String(cur.rest) : '',
        placeholder: String(Rec.setting(APP.id, 'restSeconds') || 120),
      });
      b.appendChild(UI.row('Rest time', 'Seconds. Blank uses the default', rest));

      /* Tom, 2026-09-05: "1 set of pull ups as 1/2 a set of biceps." A set
         adds one to its own group and this fraction to each group here. */
      var SHARES = [0.25, 0.5, 0.75];
      var aw = UI.el('div', CHIPS);
      var paintAlso = function () {
        aw.innerHTML = '';
        TRAIN.catsSorted().forEach(function (id) {
          if (id === sel.value) return;
          var v = also[id] || 0;
          var c = UI.el('button', CHIP + ' mb-press' + (v ? ' on' : ''),
            UI.esc(TRAIN.cats()[id].name) + (v ? ' <b>' + v + '</b>' : ''));
          c.onclick = function (e) {
            e.preventDefault();
            var i = SHARES.indexOf(v);
            var next = v === 0 ? SHARES[1] : (i === SHARES.length - 1 ? 0 : SHARES[i + 1]);
            if (next) also[id] = next; else delete also[id];
            paintAlso(); Mobile.haptic('select');
          };
          aw.appendChild(c);
        });
      };
      paintAlso();
      sel.addEventListener('change', paintAlso);
      b.appendChild(UI.row('Also works', 'Tap for a half, again for three quarters, a quarter, then off', aw));

      if (cur) {
        var del = UI.el('button', 'mb-btn bad mb-press mb-tap');
        del.style.width = '100%';
        del.style.marginTop = 'var(--s-4)';
        del.textContent = 'DELETE EXERCISE';
        del.onclick = function (ev) {
          ev.preventDefault();
          h.close();
          setTimeout(function () { TRAIN.deleteExercise(exId); }, 60);
        };
        b.appendChild(del);
      }
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'SAVE', kind: 'go', fn: function () {
        var nm = String(nameEl.value || '').trim();
        if (!nm) { UI.toast('Please enter a name', { bad: true }); return false; }
        var all = TRAIN.exercises();
        var dupe = Object.keys(all).some(function (k) {
          return k !== exId && String(all[k].name).toLowerCase() === nm.toLowerCase();
        });
        if (dupe) { UI.toast('An exercise called ' + UI.esc(nm) + ' exists', { bad: true }); return false; }
        var changes = {
          name: nm, cat: sel.value, kind: kind,
          inc: inc.value ? Number(inc.value) : null,
          rest: rest.value ? parseInt(rest.value, 10) : null,
          also: Object.keys(also).length ? also : null,
        };
        if (exId) {
          TRAIN.patchExercise(exId, changes);
        } else {
          changes.note = ''; changes.fav = 0; changes.unit = null; changes.graph = null;
          Rec.set('exercise', null, TRAIN.newId(), changes);
        }
        Mobile.feedback('success');
        draw();
        UI.toast(exId ? 'Exercise updated' : 'Exercise created');
      } },
    ],
  });
  if (!cur) UI.focusSoon(nameEl);
};

/* ═════════════════ THE TRAINING SCREEN ═════════════════ */
function drawTraining(m) {
  if (TRAIN.tab === 'history') return drawHistory(m);
  if (TRAIN.tab === 'graph') return drawGraph(m);
  return drawTrack(m);
}

function drawTrack(m) {
  var exId = TRAIN.exId, date = TRAIN.date;
  var ex = TRAIN.exercises()[exId] || { name: 'Exercise' };
  var f = TRAIN.fieldsOf(exId);
  var mine = TRAIN.setsOn(date).filter(function (s) { return s.ex === exId; });

  /* What this is measured against: the last session with the same name, a
     day he picked, the day it was copied from, or the last time, in that
     order. Its working sets in order, which is what set 1, set 2 and set 3
     below are each compared with. It is also the number that decides today's
     load. */
  var vs = TRAIN.vsFor(date, exId, TRAIN.compareCtx(date));
  var then = vs ? workOn(vs.date, exId) : [];
  if (then.length) {
    var vsName = (Rec.get('session', vs.date, '') || {}).name;
    var card = UI.el('div', 'exblock pad');
    card.innerHTML = '<div class="lasttime">' + (vsName ? UI.esc(vsName) + ' · ' : '') +
      UI.esc(dayY(vs.date, date)) + ' · ' +
      then.map(function (s) {
        return lastBit(s, f) + (s.split ? ' (' + UI.esc(s.split.text) + ')' : '');
      }).join(', ') + '</div>';
    m.appendChild(card);
  }
  m.appendChild(setupCard(exId, ex, date));

  var pad = UI.el('div', 'exblock');
  pad.style.padding = 'var(--s-4)';
  var inputs = {};
  var DRAFT = { w: 'draftW', r: 'draftR', d: 'draftD', t: 'draftT' };
  f.forEach(function (k, i) {
    var label = UI.el('div', 'fieldlabel');
    if (i) label.style.marginTop = 'var(--s-4)';
    label.textContent = { w: 'WEIGHT (' + TRAIN.unitLabel() + ')', r: 'REPS',
      d: 'DISTANCE (' + TRAIN.distUnit() + ')', t: 'TIME' }[k];
    pad.appendChild(label);
    var stepBy = k === 'w' ? TRAIN.increment(ex) : k === 'r' ? 1 : k === 'd' ? 0.1
      : (TRAIN.kindOf(exId) === 'dt' ? 60 : 15);
    var st = stepper(k, TRAIN[DRAFT[k]] == null ? '' : TRAIN[DRAFT[k]], stepBy,
      function (v) { TRAIN[DRAFT[k]] = v; });
    pad.appendChild(st);
    inputs[k] = st.input;
  });

  var bar = UI.el('div', 'gobar');
  var save = UI.el('button', 'save mb-press mb-tap');
  save.textContent = TRAIN.sel ? 'UPDATE' : 'SAVE';
  save.onclick = function () { commitSet(inputs); };
  var clear = UI.el('button', 'clear mb-press mb-tap');
  clear.textContent = 'CLEAR';
  clear.onclick = function () {
    TRAIN.draftW = TRAIN.draftR = TRAIN.draftD = TRAIN.draftT = null;
    TRAIN.sel = null;
    Mobile.feedback('select');
    draw();
  };
  bar.appendChild(save); bar.appendChild(clear);
  pad.appendChild(bar);
  m.appendChild(pad);

  if (mine.length) {
    var showChk = Rec.setting(APP.id, 'markComplete') !== 0;
    var listCard = UI.el('div', 'exblock');
    listCard.style.padding = 'var(--s-2) var(--s-4) var(--s-3)';
    var n = 0, kind = TRAIN.kindOf(exId);
    mine.forEach(function (s) {
      var d = null;
      if (!s.warm) {
        n++;
        if (vs && TRAIN.counts(s)) d = TRAIN.setDelta(s, then[n - 1], kind);
      }
      listCard.appendChild(trainingSetRow(s, s.warm ? 0 : n, date, showChk, d));
    });
    m.appendChild(listCard);
  }
}

/* One set, as the line above the steppers writes it. */
function lastBit(s, f) {
  if (f[0] === 'w' && f[1] === 'r' && !s.kg) return '<b>' + (s.r || 0) + '</b> reps';
  return f.map(function (k) {
    if (k === 'w') return s.kg ? '<b>' + TRAIN.showWeight(s.kg, s.u) + '</b> ' + TRAIN.unit() : '';
    if (k === 'r') return '<b>' + (s.r || 0) + '</b>';
    if (k === 'd') return '<b>' + TRAIN.showDist(s.dist || 0) + '</b> ' + TRAIN.distUnit();
    if (k === 't') return '<b>' + fmtSecs(s.dur || 0) + '</b>';
    return '';
  }).filter(Boolean).join(' × ');
}

/* Weight is typed as often as it is stepped, so the number is a real field
   and the buttons nudge it. inputmode decimal keeps the phone keypad. */
function stepper(kind, value, step, onChange) {
  var NAME = { w: 'weight', r: 'reps', d: 'distance', t: 'time' }[kind] || kind;
  var box = UI.el('div', 'stepper');
  var minus = UI.el('button', 'mb-press mb-tap');
  minus.innerHTML = ico('minus');
  minus.setAttribute('aria-label', 'Decrease ' + NAME);
  var input = UI.el('input');
  /* Time needs a colon, which no number keypad has. */
  Mobile.field(input, kind === 'r' ? 'number' : kind === 't' ? 'text' : 'decimal', {});
  if (kind === 't') input.placeholder = '0:00';
  input.value = value === '' ? '' : String(value);
  input.setAttribute('aria-label', NAME);
  var plus = UI.el('button', 'mb-press mb-tap');
  plus.innerHTML = ico('add');
  plus.setAttribute('aria-label', 'Increase ' + NAME);

  var read = function () {
    var n = kind === 't' ? TRAIN.parseTime(input.value) : parseFloat(input.value);
    return isNaN(n) ? 0 : n;
  };
  var write = function (n) {
    if (n < 0) n = 0;
    input.value = kind === 'r' ? String(Math.round(n))
      : kind === 't' ? fmtSecs(Math.round(n))
      : String(Math.round(n * 1000) / 1000);
    onChange(input.value);
  };
  minus.onclick = function () { write(read() - step); Mobile.feedback('tick'); };
  plus.onclick = function () { write(read() + step); Mobile.feedback('tick'); };
  input.oninput = function () { onChange(input.value); };

  box.appendChild(minus); box.appendChild(input); box.appendChild(plus);
  box.input = input;
  return box;
}

/* The step size: the exercise's own increment if it has one, else the app
   setting, else 2.5. Expressed in whatever unit is on screen. */
TRAIN.increment = function (ex) {
  var v = (ex && ex.inc) || Rec.setting(APP.id, 'increment') || 2.5;
  return Number(v) || 2.5;
};

function commitSet(inputs) {
  var exId = TRAIN.exId, date = TRAIN.date, f = TRAIN.fieldsOf(exId);
  var val = function (k) {
    var el = inputs[k];
    if (!el || String(el.value).trim() === '') return null;
    var n = k === 't' ? TRAIN.parseTime(el.value) : k === 'r' ? parseInt(el.value, 10) : parseFloat(el.value);
    return isNaN(n) ? null : n;
  };
  if (f.every(function (k) { return !val(k); })) {
    UI.toast('Please enter values for this set', { bad: true });
    if (inputs[f[0]]) UI.focusSoon(inputs[f[0]]);
    return;
  }
  var w = val('w'), fields = {
    kg: w ? TRAIN.toKg(w, TRAIN.unit()) : 0, r: val('r') || 0,
    dist: val('d') ? TRAIN.toKm(val('d')) : 0, dur: val('t') || 0,
    su: cleanSetup(exId),
  };
  /* The numbers stay in the steppers after SAVE, as in FitNotes, so the same
     set again is one more tap. */
  TRAIN.draftW = inputs.w ? inputs.w.value : null;
  TRAIN.draftR = inputs.r ? inputs.r.value : null;
  TRAIN.draftD = inputs.d ? inputs.d.value : null;
  TRAIN.draftT = inputs.t ? inputs.t.value : null;

  if (TRAIN.sel) {
    var was = Rec.get('set', date, TRAIN.sel);
    var upd = { kg: fields.kg, r: fields.r, dist: fields.dist, dur: fields.dur, u: TRAIN.unit(), done: 1 };
    if (((TRAIN.exercises()[exId] || {}).setup || []).length) upd.su = fields.su || undefined;
    TRAIN.patchSet(TRAIN.sel, date, upd);
    TRAIN.sel = null;
    TRAIN.recomputePRs([exId]);
    UI.toast('Training updated');
    /* Updating a planned set that was not done yet is doing it. */
    if (was && !was.done) afterSave(exId, date);
  } else {
    var key = TRAIN.addSet(exId, date, fields);
    if (Rec.setting(APP.id, 'trackPRs') !== 0 && fields.kg > 0 && fields.r > 0) TRAIN.recomputePRs([exId]);
    /* A record at the moment it was lifted: all-time, or only in this
       training block, which starts its records again. */
    var hit = Rec.setting(APP.id, 'trackPRs') !== 0 &&
      TRAIN.recordHits(exId, date).filter(function (h) { return h.s.key === key; })[0];
    if (hit) {
      if (window.Sfx && Sfx.play) Sfx.play('complete', { level: 2 });
      UI.toast((hit.all ? 'Personal record: ' : 'Block record: ') +
        TRAIN.showWeight(fields.kg, TRAIN.unit()) + ' ' + TRAIN.unitLabel());
    }
    if (Rec.setting(APP.id, 'workoutTimerAuto') !== 0 && TRAIN.setsOn(date).length === 1) {
      TRAIN.workoutStart(date);
    }
    afterSave(exId, date);
  }
  Mobile.feedback('success');
  if (TRAIN.pendingJump) {
    var nx = TRAIN.pendingJump, nm = (TRAIN.exercises()[nx] || {}).name || 'next';
    TRAIN.pendingJump = null;
    TRAIN.openExercise(nx);
    UI.toast("Jumped to '" + UI.esc(nm) + "'");
    if (Rec.setting(APP.id, 'autoNext') !== 0) TRAIN.selectNextOpen();
    return;
  }
  draw();
  if (Rec.setting(APP.id, 'autoNext') !== 0) TRAIN.selectNextOpen();
}

/* After a set is done: the rest timer, the workout timer's end, and the
   superset's next exercise. A superset set to hold the rest timer starts it
   only after its last exercise, which is FitNotes' "until a full round". */
function afterSave(exId, date) {
  var grp = TRAIN.groupOf(date, exId);
  var members = grp ? (grp.g.ex || []) : [];
  var lastOfRound = !grp || members[members.length - 1] === exId;
  if (Rec.setting(APP.id, 'restAuto') !== 0 && (!grp || !grp.g.resthold || lastOfRound)) {
    var ex = TRAIN.exercises()[exId] || {};
    TRAIN.restStart(ex.rest || 0);
  }
  if (Rec.setting(APP.id, 'workoutTimerStop') === 1 &&
      !TRAIN.setsOn(date).some(function (x) { return !x.done; })) {
    TRAIN.workoutStop(date);
  }
  if (grp && grp.g.jump && members.length > 1) {
    var next = members[(members.indexOf(exId) + 1) % members.length];
    if (next && next !== exId) TRAIN.pendingJump = next;
  }
}

function trainingSetRow(s, n, date, showChk, delta) {
  var row = UI.el('div', 'tset' + (TRAIN.sel === s.key ? ' sel' : '') + (s.warm ? ' warm' : ''));

  var bub = UI.el('button', 'bub nohold mb-tap' + (s.note ? ' on' : ''));
  bub.innerHTML = BUBBLE;
  bub.setAttribute('aria-label', s.note ? 'Edit comment' : 'Add comment');
  bub.onclick = function (e) { e.stopPropagation(); commentDialog(s, date); };
  row.appendChild(bub);

  var idx = UI.el('span', 'idx');
  idx.textContent = s.warm ? 'W' : String(n);
  row.appendChild(idx);

  var body = UI.el('span', 'grow');
  body.style.textAlign = 'right';
  /* Under the numbers: how it split, how it was set up, and the change on the
     same set last time. A line of its own, because at 390px the numbers
     already fill the row. */
  var meta = [];
  if (s.split) meta.push(UI.esc(s.split.text));
  var sut = setupText(s.su, s.ex);
  if (sut) meta.push(UI.esc(sut));
  if (delta) meta.push(deltaChip(delta));
  body.innerHTML = setCols(s, TRAIN.exId) +
    (meta.length ? '<span class="tmeta">' + meta.join(' · ') + '</span>' : '');
  row.appendChild(body);

  if (showChk) {
    var chk = UI.el('button', 'chk nohold mb-tap' + (s.done ? ' on' : ''));
    chk.innerHTML = '<i>' + (s.done ? ico('done') : '') + '</i>';
    chk.setAttribute('aria-label', s.done ? 'Mark not done' : 'Mark done');
    chk.onclick = function (e) {
      e.stopPropagation();
      TRAIN.patchSet(s.key, date, { done: s.done ? 0 : 1 });
      Mobile.feedback(s.done ? 'untick' : 'tick');
      if (!s.done) afterSave(s.ex, date);
      if (TRAIN.pendingJump) {
        var nx = TRAIN.pendingJump;
        TRAIN.pendingJump = null;
        TRAIN.openExercise(nx);
        return;
      }
      draw();
      if (!s.done && Rec.setting(APP.id, 'autoNext') !== 0) TRAIN.selectNextOpen();
    };
    row.appendChild(chk);
  }

  /* Tapping a set loads it into the steppers, which is how FitNotes edits one. */
  row.onclick = function () {
    TRAIN.sel = s.key;
    loadDraft(s);
    Mobile.feedback('select');
    draw();
  };
  withMenu(row, function (e) { setMenu(s, date, e); });
  return row;
}

function setMenu(s, date, e) {
  menuAt(e, [
    /* A warmup happened and does not count: not toward volume, not toward
       set totals, and it can never take a personal record. */
    { label: s.warm ? 'Not a warmup' : 'Mark as warmup',
      fn: function () {
        TRAIN.patchSet(s.key, date, { warm: s.warm ? 0 : 1 });
        TRAIN.recomputePRs([s.ex]);
        Mobile.feedback('select'); draw();
      } },
    { label: s.note ? 'Edit Comment' : 'Add Comment', fn: function () { commentDialog(s, date); } },
    { label: 'Copy Set', fn: function () {
      var p = Rec.get('set', date, s.key);
      if (!p) return;
      p.done = 0; p.pr = 0; p.prf = 0; p.note = ''; p.ord = (p.ord || 0) + 0.5;
      Rec.set('set', date, TRAIN.newId(), p);
      TRAIN.reindex();
      draw();
      UI.toast('Set copied');
    } },
    { label: 'Delete Set', kind: 'bad', fn: function () { TRAIN.removeSet(s.key, date); draw(); } },
  ], 'SET');
}

/* FitNotes shows a comment in a small box with Edit and Done. Same shape. */
function commentDialog(s, date) {
  var noteEl = null;
  UI.dialog({
    title: 'COMMENT', width: 420,
    body: function (b, h) {
      var i = noteEl = UI.field('note', { value: s.note || '', placeholder: 'Comment Text ...' });
      b.appendChild(i);
      Mobile.form(b, function () { saveNote(h, i); });
    },
    actions: [
      { label: 'CANCEL' },
      { label: 'DONE', kind: 'go', fn: function (h) { saveNote(h, h.body.querySelector('textarea')); return false; } },
    ],
  });
  UI.focusSoon(noteEl);
  function saveNote(h, i) {
    /* The comment decides whether it is a warmup or a split set, so a changed
       comment hands that back to it and the records are worked out again. */
    var note = (i.value || '').trim(), ch = { note: note };
    if (TRAIN.noteWarm(note) !== TRAIN.noteWarm(s.note)) ch.warm = undefined;
    TRAIN.patchSet(s.key, date, ch);
    TRAIN.recomputePRs([s.ex]);
    h.close();
    Mobile.feedback('success');
    draw();
  }
}

/* ═════════════════ HISTORY ═════════════════
   Every past workout for this exercise, newest first, exactly as logged. */
function drawHistory(m) {
  var all = TRAIN.historyOf(TRAIN.exId);
  if (!all.length) {
    var e = UI.el('div', 'empty');
    e.textContent = 'No sets recorded';
    m.appendChild(e);
    return;
  }
  var byDate = {}, order = [];
  for (var i = all.length - 1; i >= 0; i--) {
    var s = all[i];
    if (!byDate[s.date]) { byDate[s.date] = []; order.push(s.date); }
    byDate[s.date].unshift(s);
  }
  /* Four years of Pull Up is 699 sets. Render the recent hundred workouts and
     let him ask for more, rather than building three thousand nodes on a
     two-gigabyte phone. */
  var shown = order.slice(0, TRAIN.histLimit || 100);
  shown.forEach(function (d) {
    var card = UI.el('div', 'exblock');
    var head = UI.el('div', 'head');
    head.innerHTML = '<span class="nm">' + UI.esc(Day.label(d)) + '</span>' +
      '<span class="u" style="color:var(--text-muted);font-size:var(--f-1)">' +
      byDate[d].length + ' sets</span>';
    card.appendChild(head);
    var sets = UI.el('div', 'sets');
    byDate[d].forEach(function (s) {
      var row = UI.el('div', 'setrow' + (s.note ? ' has-note' : ''));
      row.innerHTML = '<span class="cmt" title="' + UI.esc(s.note || '') + '">' + BUBBLE +
        '</span><span class="grow"></span>' + setCols(s);
      sets.appendChild(row);
    });
    card.appendChild(sets);
    m.appendChild(card);
  });
  if (order.length > shown.length) {
    var more = UI.el('button', 'mb-btn mb-press mb-tap');
    more.style.width = '100%';
    more.textContent = 'SHOW MORE (' + (order.length - shown.length) + ' EARLIER)';
    more.onclick = function () {
      TRAIN.histLimit = (TRAIN.histLimit || 100) + 100;
      draw();
    };
    m.appendChild(more);
  }
}

/* ═════════════════ GRAPH ═════════════════
   Heaviest set per workout, drawn as SVG. No chart library: one more CDN
   dependency for one screen is not worth an app that stops working offline. */
function drawGraph(m) {
  var exId = TRAIN.exId;
  var all = TRAIN.historyOf(exId).filter(function (s) { return !s.warm; });
  if (!all.length) {
    var e = UI.el('div', 'empty'); e.textContent = 'No sets recorded'; m.appendChild(e);
    return;
  }
  if (TRAIN.graphEx !== exId) { TRAIN.graphEx = exId; TRAIN.graphType = null; TRAIN.graphPer = null; }
  var ex = TRAIN.exercises()[exId] || {}, f = TRAIN.fieldsOf(exId), U = TRAIN.unit();
  var W = function (kg) { return TRAIN.toUnit(kg || 0, U); };
  var D = function (km) { return TRAIN.distUnit() === 'mi' ? (km || 0) / KM_PER_MI : (km || 0); };
  var max = function (ss, fn) { return ss.reduce(function (a, x) { return Math.max(a, fn(x)); }, 0); };
  var sum = function (ss, fn) { return ss.reduce(function (a, x) { return a + fn(x); }, 0); };

  /* FitNotes' graphs for the type of exercise on screen. */
  var G = [];
  if (f.indexOf('w') > -1) {
    G.push({ id: 'e1rm', name: 'Estimated 1RM', u: TRAIN.unitLabel(), v: function (ss) { return W(max(ss, function (x) { return TRAIN.e1rm(x.kg, x.r); })); } });
    G.push({ id: 'maxw', name: 'Max Weight', u: TRAIN.unitLabel(), v: function (ss) { return W(max(ss, function (x) { return x.kg || 0; })); } });
    if (f.indexOf('r') > -1) G.push({ id: 'vol', name: 'Session Volume', u: TRAIN.unitLabel(), v: function (ss) { return W(sum(ss, function (x) { return (x.kg || 0) * (x.r || 0); })); } });
  }
  if (f.indexOf('r') > -1) {
    G.push({ id: 'maxr', name: 'Max Reps', u: 'reps', v: function (ss) { return max(ss, function (x) { return x.r || 0; }); } });
    G.push({ id: 'reps', name: 'Session Reps', u: 'reps', v: function (ss) { return sum(ss, function (x) { return x.r || 0; }); } });
  }
  if (f.indexOf('d') > -1) {
    G.push({ id: 'maxd', name: 'Max Distance', u: TRAIN.distUnit(), v: function (ss) { return D(max(ss, function (x) { return x.dist || 0; })); } });
    G.push({ id: 'dist', name: 'Session Distance', u: TRAIN.distUnit(), v: function (ss) { return D(sum(ss, function (x) { return x.dist || 0; })); } });
  }
  if (f.indexOf('t') > -1) {
    G.push({ id: 'maxt', name: 'Max Time', u: 'min', v: function (ss) { return max(ss, function (x) { return x.dur || 0; }) / 60; } });
    G.push({ id: 'time', name: 'Session Time', u: 'min', v: function (ss) { return sum(ss, function (x) { return x.dur || 0; }) / 60; } });
  }
  var gdef = ex.gdef || {};
  var has = function (id) { return G.some(function (x) { return x.id === id; }); };
  var gid = has(TRAIN.graphType) ? TRAIN.graphType : has(gdef.type) ? gdef.type : G[0].id;
  var per = TRAIN.graphPer || gdef.per || 'all';
  var g = G.filter(function (x) { return x.id === gid; })[0];

  var controls = UI.el('div', 'exblock pad');
  var sel = document.createElement('select');
  sel.className = SEL;
  G.forEach(function (x) {
    var o = document.createElement('option'); o.value = x.id; o.textContent = x.name; sel.appendChild(o);
  });
  sel.value = gid;
  sel.onchange = function () { TRAIN.graphType = sel.value; draw(); };
  controls.appendChild(UI.row('Graph', '', sel));
  var pseg = UI.segmented(TRAIN.PERIODS.map(function (p) { return { id: p.id, name: p.name.split(' ')[0] + (p.days ? p.name.split(' ')[1][0] : '') }; }),
    per, function (v) { TRAIN.graphPer = v; draw(); });
  pseg.style.marginTop = 'var(--s-3)';
  controls.appendChild(pseg);
  m.appendChild(controls);

  var range = TRAIN.periodRange(per), byDay = {}, order = [];
  all.forEach(function (x) {
    if (x.date < range.from || x.date > range.to) return;
    if (!byDay[x.date]) { byDay[x.date] = []; order.push(x.date); }
    byDay[x.date].push(x);
  });
  var pts = order.map(function (d) { return [d, g.v(byDay[d])]; }).filter(function (p) { return p[1] > 0; });
  if (!pts.length) {
    var e2 = UI.el('div', 'empty'); e2.textContent = 'No sessions in this period'; m.appendChild(e2);
    return;
  }

  var card = UI.el('div', 'exblock pad');
  card.innerHTML = '<div class="fieldlabel">' + UI.esc(g.name.toUpperCase()) + ' (' + UI.esc(g.u) + ')</div>';
  var box = UI.el('div', 'chartbox');
  graphChart(box, pts, g);
  /* FitNotes: double tap the graph to expand it. One tap here, since a
     double tap on a phone is also a zoom. */
  box.onclick = function () {
    UI.dialog({
      title: g.name.toUpperCase(), width: 900,
      body: function (b) {
        var big = UI.el('div', 'chartbox big');
        b.appendChild(big);
        graphChart(big, pts, g);
      },
      actions: [{ label: 'CLOSE' }],
    });
  };
  card.appendChild(box);

  var values = pts.map(function (p) { return p[1]; });
  var best = Math.max.apply(null, values), latest = values[values.length - 1];
  var dec = g.u === 'reps' ? 0 : 1;
  var num = function (v) { return dec ? fmt1(v) : String(Math.round(v)); };
  card.appendChild(recLine('Best', num(best) + ' ' + UI.esc(g.u), pts[values.indexOf(best)][0]));
  card.appendChild(recLine('Latest', num(latest) + ' ' + UI.esc(g.u), pts[pts.length - 1][0]));
  card.appendChild(recLine('Sessions', String(pts.length), ''));
  var dflt = UI.el('button', 'mb-btn mb-press mb-tap');
  dflt.style.width = '100%';
  dflt.style.marginTop = 'var(--s-3)';
  dflt.textContent = 'SET AS DEFAULT GRAPH';
  dflt.onclick = function () {
    TRAIN.patchExercise(exId, { gdef: { type: gid, per: per } });
    UI.toast('Default graph saved');
  };
  card.appendChild(dflt);
  var shg = UI.el('button', 'mb-btn mb-press mb-tap');
  shg.style.width = '100%';
  shg.style.marginTop = 'var(--s-2)';
  shg.textContent = 'SHARE PICTURE';
  shg.onclick = function () {
    var pname = (TRAIN.PERIODS.filter(function (p) { return p.id === per; })[0] || {}).name || '';
    shareCard(function () {
      var c = UI.el('div', 'recap');
      c.innerHTML = '<div class="eyebrow"><span>' + UI.esc(g.name) + '</span><b>' + UI.esc(pname) + '</b></div>' +
        '<div class="title">' + UI.esc(ex.name) + '</div><div class="rule"></div>';
      var bx = UI.el('div', 'chartbox');
      c.appendChild(bx);
      graphChart(bx, pts, g);
      c.insertAdjacentHTML('beforeend', '<div class="big4">' +
        '<div><span>Best</span><b>' + num(best) + ' <small>' + UI.esc(g.u) + '</small></b></div>' +
        '<div><span>Latest</span><b>' + num(latest) + ' <small>' + UI.esc(g.u) + '</small></b></div></div>');
      return c;
    }, 'train-graph-' + gid);
  };
  card.appendChild(shg);
  m.appendChild(card);

  /* The points themselves, newest first: FitNotes' "tap a point to view more
     details", without needing to hit a two-pixel dot with a thumb. */
  var list = UI.el('div', 'exblock pad');
  var h = UI.el('div', 'fieldlabel'); h.textContent = 'GRAPH POINTS'; list.appendChild(h);
  pts.slice(-12).reverse().forEach(function (p) { list.appendChild(recLine(Day.label(p[0]), num(p[1]) + ' ' + UI.esc(g.u), '')); });
  m.appendChild(list);
}

/* One graph, drawn by chart.js with his three graph settings: points, a trend
   line, and whether the scale starts at zero. Drawn at the size of its box,
   with a wash under the line, the latest value marked, and a drag along it
   to read any session (shared/chart.js, 2026-09-14). */
function graphChart(box, pts, g) {
  var line = pts.map(function (p) { return [p[0], p[1], Day.label(p[0]) + ': ' + fmt1(p[1]) + ' ' + g.u]; });
  return Chart.mount(box, { label: g.name + ' (' + g.u + ')' }, function (c) {
  var values = pts.map(function (p) { return p[1]; });
  c.xTime(pts[0][0], pts[pts.length - 1][0]);
  fitY(c, values, Rec.setting(APP.id, 'graphZero') === 1);
  c.grid(function (v) { return v >= 10000 ? Math.round(v / 1000) + 'k' : (c.step < 1 ? v.toFixed(1) : Math.round(v).toLocaleString()); });
  c.timeAxis();
  c.area(line);
  c.line(line);
  if (Rec.setting(APP.id, 'graphPoints') !== 0) c.dots(line, 'mb-dot', 3);
  if (Rec.setting(APP.id, 'graphTrend') === 1 && pts.length > 2) {
    var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
    pts.forEach(function (p) {
      var x = Day.diff(p[0], pts[0][0]);
      sx += x; sy += p[1]; sxx += x * x; sxy += x * p[1];
    });
    var den = n * sxx - sx * sx;
    if (den) {
      var slope = (n * sxy - sx * sy) / den, icpt = (sy - slope * sx) / n;
      var last = Day.diff(pts[n - 1][0], pts[0][0]);
      c.line([[pts[0][0], icpt], [pts[n - 1][0], icpt + slope * last]], 'trend');
    }
  }
  var end = line[line.length - 1];
  c.end(end, fmt1(end[1]));
  c.scrub(line, { fmt: function (p) { return fmt1(p[1]) + ' ' + g.u + ', ' + Day.label(p[0]); } });
  });
}

/* ═════════════════════════════════════════════════════════════════════════
   THE NUMBERS
   Estimated one-rep max, personal records, and totals over a period. All of
   it computed from the index, all of it in kilograms, converted only when it
   is printed.
   ═════════════════════════════════════════════════════════════════════════ */

/* Brzycki, which is what FitNotes uses. It falls apart at high rep counts,
   which is why the app lets you cap the reps that count towards it. */
TRAIN.e1rm = function (kg, reps) {
  if (!kg || !reps) return 0;
  var cap = Rec.setting(APP.id, 'e1rmMaxReps') || 0;
  if (cap && reps > cap) return 0;
  if (reps >= 37) return 0;
  return kg * 36 / (37 - reps);
};

/* ── personal records, as FitNotes decides them ──
   Read off his own file rather than guessed. A set is a record while nothing
   has ever been heavier at that many reps or more. Ties go to more reps, then
   to the earlier set. So a record can stop being one, which is why this walks
   the whole exercise rather than asking whether the newest set was heaviest:
   "heavier than anything before it" flagged 819 of his sets and agreed with
   FitNotes on 263.

   Weights are compared at 3 decimal places. Old FitNotes versions
   stored the same 500 lb as two floats a millionth apart, and at two places a
   22.05 lb set drifted into a tie with a 10 kg one that FitNotes had told
   apart. Checked 2026-09-14 against his 12,370 sets and FitNotes' own flags.

   A warmup is never a record. */
TRAIN.PR_SCALE = 1000;
TRAIN.recomputePRs = function (only) {
  var exs = TRAIN.exercises(), changed = 0;
  var ids = only && only.length ? only.filter(function (id) { return exs[id]; }) : Object.keys(exs);
  var rd = function (kg) { return Math.round((kg || 0) * TRAIN.PR_SCALE) / TRAIN.PR_SCALE; };
  ids.forEach(function (id) {
    var list = TRAIN.historyOf(id);
    var work = list.filter(function (x) { return !x.warm && (x.kg || 0) > 0 && (x.r || 0) > 0; })
      .sort(function (a, b) {
        return rd(b.kg) - rd(a.kg) || b.r - a.r ||
          (a.date < b.date ? -1 : a.date > b.date ? 1 : TRAIN.setStamp(a) - TRAIN.setStamp(b));
      });
    /* Heaviest first: a set is beaten exactly when something ahead of it in
       this order has at least as many reps.

       Split sets and straight sets are two separate lists of records (Tom,
       2026-09-14). Ten reps with a rest in the middle is not ten reps, so a
       split set can neither take a straight record nor lose one to it. This
       is where TRAIN stops agreeing with FitNotes' own 537 flags. */
    var isPr = {};
    [false, true].forEach(function (split) {
      var maxR = 0;
      work.forEach(function (x) {
        if (!!x.split !== split) return;
        if (x.r > maxR) { isPr[x.key] = 1; maxR = x.r; }
      });
    });
    list.forEach(function (x) {
      var want = isPr[x.key] ? 1 : 0;
      if ((x.pr || 0) !== want) {
        /* patchRow, not patchSet: patchSet reindexes every set after each
           change, and a recalculation can change thousands. */
        TRAIN.patchRow('set', x.date, x.key, { pr: want });
        changed++;
      }
    });
  });
  if (changed) TRAIN.reindex();
  return changed;
};

/* Everything the Records screen shows for one exercise. */
TRAIN.recordsFor = function (exId, range) {
  range = range || {};
  var hist = TRAIN.historyOf(exId);
  /* Working sets, not every set. hist.length counted the warmups, which made
     "sets" on the records screen disagree with "sets" everywhere else.

     `range` is a training block's dates, whose records start again. Split
     sets count as sets and keep records of their own, under `split`: an
     estimated 1RM off ten reps with a rest in them would overstate the lift. */
  var r = { maxWeight: null, maxReps: null, maxVolume: null, max1rm: null,
            byReps: {}, sets: 0, workouts: 0,
            split: { maxWeight: null, byReps: {}, sets: 0 } };
  var days = {};
  hist.forEach(function (s) {
    if (s.warm) return;              /* warmups are not records and not volume */
    if ((range.from && s.date < range.from) || (range.to && s.date > range.to)) return;
    r.sets++;
    days[s.date] = 1;
    if (s.split) {
      r.split.sets++;
      if (s.kg > 0 && (!r.split.maxWeight || s.kg > r.split.maxWeight.kg)) r.split.maxWeight = s;
      if (s.kg > 0 && s.r > 0 && (!r.split.byReps[s.r] || s.kg > r.split.byReps[s.r].kg)) r.split.byReps[s.r] = s;
      return;
    }
    var vol = (s.kg || 0) * (s.r || 0), e = TRAIN.e1rm(s.kg, s.r);
    if (s.kg > 0 && (!r.maxWeight || s.kg > r.maxWeight.kg)) r.maxWeight = s;
    if (s.r > 0 && (!r.maxReps || s.r > r.maxReps.r)) r.maxReps = s;
    if (vol > 0 && (!r.maxVolume || vol > (r.maxVolume.kg * r.maxVolume.r))) r.maxVolume = s;
    if (e > 0 && (!r.max1rm || e > TRAIN.e1rm(r.max1rm.kg, r.max1rm.r))) r.max1rm = s;
    if (s.r > 0 && s.kg > 0 && (!r.byReps[s.r] || s.kg > r.byReps[s.r].kg)) r.byReps[s.r] = s;
  });
  r.workouts = Object.keys(days).length;
  return r;
};

/* Totals over a window, grouped however the Analysis screen asks. */
/* ── the summary, and what counts toward it ──
   Two things changed here on 2026-09-05, both his.

   WARMUPS ARE NOT WORK. Three empty-bar sets before a heavy triple used to
   add three sets and their volume to your chest total, which made the number
   a count of how much you touched a bar rather than how much you worked.

   A MOVEMENT CAN WORK MORE THAN ONE GROUP. "One set of pull ups as 1/2 a set
   of biceps." So a set adds one to its own group and a fraction to each group
   the exercise says it also works. Volume follows the same fraction, because
   half a set of biceps did half the work.

   Sets can be fractional now. That is the honest shape: pretending a pull-up
   gives biceps a whole set or none of one is the thing that made the number
   not mean anything. */
TRAIN.breakdown = function (from, to, by) {
  var exs = TRAIN.exercises(), cats = TRAIN.cats(), out = {}, days = {};
  Object.keys(TRAIN.idx.byDate).forEach(function (d) {
    if (d < from || d > to) return;
    TRAIN.idx.byDate[d].forEach(function (s) {
      if (s.warm || !TRAIN.counts(s)) return;
      var ex = exs[s.ex];
      var vol = (s.kg || 0) * (s.r || 0);
      var put = function (key, share) {
        var o = out[key] || (out[key] = { sets: 0, reps: 0, vol: 0, days: {} });
        o.sets += share; o.reps += (s.r || 0) * share; o.vol += vol * share;
        o.days[d] = 1;
      };
      if (by === 'category') {
        put(ex && ex.cat ? ex.cat : '?', 1);
        var also = (ex && ex.also) || null;
        if (also) Object.keys(also).forEach(function (c) {
          if (cats[c] && c !== (ex && ex.cat)) put(c, +also[c] || 0);
        });
      } else {
        put(s.ex, 1);
      }
      days[d] = 1;
    });
  });
  var rows = Object.keys(out).map(function (k) {
    var o = out[k];
    var name = by === 'category'
      ? (cats[k] ? cats[k].name : 'Uncategorised')
      : (exs[k] ? exs[k].name : k);
    /* A whole number stays whole; a half set shows as a half. */
    return { key: k, name: name, sets: Math.round(o.sets * 10) / 10,
             reps: Math.round(o.reps), vol: o.vol,
             workouts: Object.keys(o.days).length,
             slot: by === 'category' && cats[k] ? cats[k].slot : null };
  });
  rows.sort(function (a, b) { return b.vol - a.vol || b.sets - a.sets; });
  return { rows: rows, workouts: Object.keys(days).length };
};

TRAIN.weekStartDow = function () {
  var v = Rec.setting(APP.id, 'weekStart');
  return v === 2 ? 1 : v === 7 ? 6 : 0;
};

TRAIN.PERIODS = [
  { id: '1m', name: '1 MONTH', days: 30 },
  { id: '3m', name: '3 MONTHS', days: 91 },
  { id: '6m', name: '6 MONTHS', days: 182 },
  { id: '1y', name: '1 YEAR', days: 365 },
  { id: 'all', name: 'ALL', days: 0 },
];
TRAIN.periodRange = function (id) {
  var p = TRAIN.PERIODS.filter(function (x) { return x.id === id; })[0] || TRAIN.PERIODS[1];
  var to = Day.today();
  if (!p.days) {
    var all = Object.keys(TRAIN.idx.byDate).sort();
    return { from: all[0] || to, to: to };
  }
  return { from: Day.shift(to, -(p.days - 1)), to: to };
};

/* ═════════════════ THE CALENDAR ═════════════════
   A month grid with a dot per muscle group trained that day, and the total
   workout count underneath — the number FitNotes puts at the foot of the
   screen and the one that says "631 workouts" on his phone. */
function drawCalendar(m) {
  var cats = TRAIN.cats(), exs = TRAIN.exercises(), today = Day.today();
  var pick = TRAIN.calPick;
  if (pick) {
    var ban = UI.el('div', 'calbanner');
    ban.textContent = pick.title;
    m.appendChild(ban);
  }

  /* FitNotes filters which categories the calendar shows. */
  var filt = TRAIN.calFilter || null;
  var chips = UI.el('div', CHIPS);
  [{ k: null, n: 'All' }].concat(TRAIN.catsSorted().map(function (k) { return { k: k, n: cats[k].name }; }))
    .forEach(function (c) {
      var b = UI.el('button', CHIP + ' mb-press mb-tap' + (filt === c.k ? ' on' : ''));
      b.textContent = c.n;
      b.onclick = function () { TRAIN.calFilter = c.k; draw(); };
      chips.appendChild(b);
    });
  m.appendChild(chips);

  var count = 0, dayHas = {};
  Object.keys(TRAIN.idx.byDate).forEach(function (d) {
    var slots = [], hit = false;
    TRAIN.idx.byDate[d].forEach(function (s) {
      var ex = exs[s.ex];
      if (filt && (!ex || ex.cat !== filt)) return;
      hit = true;
      var c = ex && ex.cat ? cats[ex.cat] : null;
      if (c && slots.indexOf(c.slot) < 0) slots.push(c.slot);
    });
    if (hit) { count++; dayHas[d] = slots; }
  });

  var end = today.slice(0, 7);
  var focus = TRAIN.calMonth || TRAIN.date.slice(0, 7);
  var months = Math.max(TRAIN.calMonths || 12, monthsBetween(focus, end) + 3);
  var startMonth = shiftMonth(end, -(months - 1));
  var firstData = Object.keys(dayHas).sort()[0];
  if (firstData && firstData.slice(0, 7) < startMonth) {
    var earlier = UI.el('button', 'mb-btn mb-press mb-tap');
    earlier.style.width = '100%';
    earlier.textContent = 'EARLIER';
    earlier.onclick = function () { TRAIN.calMonths = months + 12; TRAIN.calMonth = startMonth; draw(); };
    m.appendChild(earlier);
  }

  var ws = TRAIN.weekStartDow();
  var names = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  for (var mo = startMonth; mo <= end; mo = shiftMonth(mo, 1)) {
    var sec = UI.el('div', 'calmonth');
    sec.dataset.month = mo;
    var first = new Date(mo + '-01T12:00:00');
    var title = UI.el('div', 'caltitle');
    title.textContent = first.toLocaleDateString(undefined, { month: 'long' }).toUpperCase() + ' ' + first.getFullYear();
    sec.appendChild(title);
    var grid = UI.el('div', 'calgrid');
    for (var i = 0; i < 7; i++) {
      var hd = UI.el('div', 'caldow');
      hd.textContent = names[(i + ws) % 7];
      grid.appendChild(hd);
    }
    var lead = (first.getDay() - ws + 7) % 7;
    for (var b2 = 0; b2 < lead; b2++) grid.appendChild(UI.el('div', 'calcell empty'));
    var last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    for (var dn = 1; dn <= last; dn++) {
      var iso = mo + '-' + String(dn).padStart(2, '0');
      var cell = UI.el('button', 'calcell mb-press mb-tap' + (iso === TRAIN.date && !pick ? ' sel' : '') +
        (iso === today ? ' today' : '') + (iso > today ? ' future' : ''));
      var dots = (dayHas[iso] || []).slice(0, 4).map(function (sl) {
        return '<i style="background:' + TRAIN.slotColor(sl) + '"></i>';
      }).join('');
      cell.innerHTML = '<span class="n">' + dn + '</span><span class="dots">' + dots + '</span>';
      (function (d) {
        cell.onclick = function () {
          if (d > today) return;
          Mobile.feedback('select');
          if (pick) {
            TRAIN.calPick = null;
            TRAIN.show(pick.back && pick.back !== 'calendar' ? pick.back : 'workout');
            pick.fn(d);
            return;
          }
          TRAIN.date = d;
          TRAIN.show('workout');
        };
      })(iso);
      grid.appendChild(cell);
    }
    sec.appendChild(grid);
    m.appendChild(sec);
  }

  var foot = UI.el('div', 'calcount');
  var back = UI.el('button', 'ico mb-press mb-tap');
  back.innerHTML = ico('back'); back.setAttribute('aria-label', 'Previous month');
  var fwd = UI.el('button', 'ico mb-press mb-tap');
  fwd.innerHTML = ico('next'); fwd.setAttribute('aria-label', 'Next month');
  var n = UI.el('span', 'n');
  n.innerHTML = '<b>' + count.toLocaleString() + '</b> SESSIONS';
  var jump = function (dir) {
    var nextM = shiftMonth(TRAIN.calMonth || focus, dir);
    if (nextM > end) return;
    TRAIN.calMonth = nextM;
    if (nextM < startMonth) { TRAIN.calMonths = months + 12; draw(); return; }
    var el = m.querySelector('[data-month="' + nextM + '"]');
    if (el) el.scrollIntoView({ block: 'start' });
  };
  back.onclick = function () { jump(-1); };
  fwd.onclick = function () { jump(1); };
  foot.appendChild(back); foot.appendChild(n); foot.appendChild(fwd);
  m.appendChild(foot);

  /* Open on the month of the day on screen, not the top of the list. */
  setTimeout(function () {
    var el = m.querySelector('[data-month="' + focus + '"]');
    if (el) el.scrollIntoView({ block: 'start' });
  }, 0);
}
function monthsBetween(a, b) {
  return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
}
function shiftMonth(ym, n) {
  var d = new Date(ym + '-01T12:00:00');
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function drawAnalysis(m) {

      '<div class="track"><i style="width:' + pct + '%;background:' +

      '<div class="sub">' + r.sets + ' sets · ' + r.reps + ' reps · ' + r.workouts + ' sessions</div>';
    card.appendChild(row);

  }

/* ═════════════════════════════════════════════════════════════════════════
   THE REST TIMER

   This is the one place TRAIN is worse than FitNotes and it cannot be fixed
   from a page in a browser: a backgrounded tab is suspended, so the timer
   will not buzz in his pocket.

   It therefore recovers rather than pretends. The moment it started is
   written down, and the elapsed time is always recomputed from the clock. If
   he comes back after two minutes away it says he is forty seconds over,
   instead of resuming from wherever it froze. A timer that silently stopped
   counting is worse than no timer.
   ═════════════════════════════════════════════════════════════════════════ */
TRAIN.rest = { until: 0, len: 0, tick: null, fired: false };

TRAIN.restStart = function (seconds) {
  var len = seconds || Rec.setting(APP.id, 'restSeconds') || 120;
  TRAIN.rest.len = len;
  TRAIN.rest.until = Date.now() + len * 1000;
  TRAIN.rest.fired = false;
  Rec.setting(APP.id, 'rest', { until: TRAIN.rest.until, len: len });
  restLoop();
  drawRestBar();
};
TRAIN.restStop = function () {
  TRAIN.rest.until = 0;
  if (TRAIN.rest.tick) { clearInterval(TRAIN.rest.tick); TRAIN.rest.tick = null; }
  if (Rec.setting(APP.id, 'rest')) Rec.setting(APP.id, 'rest', null);
  drawRestBar();
};
TRAIN.restRestore = function () {
  try {
    var v = Rec.setting(APP.id, 'rest');
    if (v && v.until) {
      TRAIN.rest.until = v.until; TRAIN.rest.len = v.len;
      /* More than ten minutes past the end is a session he walked away from. */
      if (Date.now() - v.until > 600000) return TRAIN.restStop();
      TRAIN.rest.fired = Date.now() > v.until;
      restLoop();
    }
  } catch (e) {}
  drawRestBar();
};
function restLoop() {
  if (TRAIN.rest.tick) clearInterval(TRAIN.rest.tick);
  TRAIN.rest.tick = setInterval(drawRestBar, 250);
}
function drawRestBar() {
  var bar = document.getElementById('restbar');
  if (!bar) return;
  if (!TRAIN.rest.until) { bar.style.display = 'none'; return; }
  var left = Math.round((TRAIN.rest.until - Date.now()) / 1000);
  bar.style.display = '';
  bar.className = 'restbar' + (left <= 0 ? ' over' : '');
  var pct = TRAIN.rest.len ? Math.max(0, Math.min(1, left / TRAIN.rest.len)) : 0;
  bar.querySelector('.fill').style.width = Math.round(pct * 100) + '%';
  bar.querySelector('.t').textContent = left > 0 ? fmtSecs(left) : '+' + fmtSecs(-left);
  bar.querySelector('.lbl').textContent = left > 0 ? 'REST' : 'OVER';
  if (left <= 0 && !TRAIN.rest.fired) {
    TRAIN.rest.fired = true;
    if (Rec.setting(APP.id, 'restVibrate') !== 0) Mobile.haptic('complete');
    if (Rec.setting(APP.id, 'restSound') !== 0 && window.Sfx) Sfx.play('complete', { level: 2 });
  }
}

/* ═════════════════ THE WORKOUT TIMER ═════════════════
   The start and end of the session, stored on the day's `session` row. */
TRAIN.workoutStart = function (date) {
  var s = Rec.get('session', date, '') || {};
  if (s.start) return s;
  return TRAIN.patchSession(date, { start: new Date().toISOString() });
};
TRAIN.workoutStop = function (date) {
  var s = Rec.get('session', date, '') || {};
  if (!s.start) return null;

/* Copy every set of one day onto another, weights and reps intact. The sets
   arrive uncompleted, because copying a workout is a plan, not a claim that
   it happened. */
TRAIN.copyWorkout = function (fromDate, toDate) {
  fromDate = fromDate || TRAIN.previousWorkout(TRAIN.date);
  toDate = toDate || TRAIN.date;
  if (!fromDate) return UI.toast('There is no session to copy', { bad: true });
  var n = TRAIN.copyDay(fromDate, toDate, { comments: 0, supersets: 1, note: 0, time: 0 });
  Mobile.feedback('success');
  draw();
  UI.toast('Copied ' + n + ' sets from ' + UI.esc(Day.label(fromDate)));
};

/* Whether a repeated session was stronger is answered set by set now, in
   "how much stronger, set by set" further down. The old answer here compared
   only the top set of each exercise, and only on a copied day. */

/* A signed weight in the unit on screen. The delta is a difference between two
   kilogram figures, so it converts as a quantity — never by running each side
   through showWeight and subtracting the printed strings. */
TRAIN.showDelta = function (kg) {
  var v = TRAIN.toUnit(Math.abs(kg), TRAIN.unit());
  var t = (Math.round(v * 10) / 10).toFixed(1);
  return (kg >= 0 ? '+' : '−') + t;
};

TRAIN.shareWorkout = function () {
  var date = TRAIN.date, groups = TRAIN.dayGroups(date);
  if (!groups.length) return UI.toast('There is no session to share', { bad: true });
  var unit = TRAIN.unit();
  var lines = [Day.label(date)];
  var sess = Rec.get('session', date, '') || {};
  if (sess.start && sess.end) lines.push(clockOf(sess.start) + ' - ' + clockOf(sess.end) + '  ' + fmtLen(sess.start, sess.end));
  lines.push('');
  groups.forEach(function (g) {
    lines.push(g.def.name);
    g.sets.forEach(function (s, i) {
      lines.push('  ' + (i + 1) + '.  ' +
        (s.kg ? TRAIN.showWeight(s.kg, s.u) + ' ' + TRAIN.unitLabel() + ' x ' : '') +
        (s.r || 0) + ' reps' + (s.note ? '   (' + s.note + ')' : ''));
    });
    lines.push('');
  });
  var text = lines.join('\n');
  var done = function () { UI.toast('Session copied to the clipboard'); };
  if (navigator.share) {
    navigator.share({ title: 'Training - ' + Day.label(date), text: text })
      .catch(function () { copyText(text, done); });
  } else copyText(text, done);
};
function copyText(text, then) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(then, function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); then(); } catch (e) { UI.toast('could not copy', { bad: true }); }
    document.body.removeChild(ta);
  }
}

/* ═════════════════ ROUTINES ═════════════════
   FitNotes calls them routines; the type is `program` because BLOCK already
   owns `routine`. A routine holds days, a day holds exercises, and an
   exercise can carry predefined sets. */
TRAIN.programs = function () { return Rec.map('program'); };
TRAIN.daysOf = function (progId) {
  var all = Rec.map('progday'), out = [];
  Object.keys(all).forEach(function (k) { if (all[k].program === progId) out.push({ key: k, d: all[k] }); });
  return out.sort(function (a, b) { return (a.d.ord || 0) - (b.d.ord || 0); });
};
TRAIN.exercisesOf = function (dayKey) {
  var all = Rec.map('progex'), out = [];
  Object.keys(all).forEach(function (k) { if (all[k].day === dayKey) out.push({ key: k, x: all[k] }); });
  return out.sort(function (a, b) { return (a.x.ord || 0) - (b.x.ord || 0); });
};

function drawRoutines(m) {
  if (TRAIN.progOpen) return drawOneProgram(m, TRAIN.progOpen);
  var progs = TRAIN.programs();
  var keys = Object.keys(progs).sort(function (a, b) { return (progs[a].ord || 0) - (progs[b].ord || 0); });

  var add = UI.el('button', 'mb-btn mb-press mb-tap');
  add.style.width = '100%';
  add.textContent = 'CREATE NEW ROUTINE';
  add.onclick = function () {

      TRAIN.progOpen = id;
      draw();
    });
  };
  m.appendChild(add);

  if (!keys.length) {
    var e = UI.el('div', 'empty');
    e.textContent = 'A routine allows you to create templates of sessions which you perform frequently.';
    m.appendChild(e);

  }
  var list = UI.el('div', 'plist');

    main.innerHTML = '<span class="nm">' + UI.esc(progs[k].name) + '</span>' +
      '<span class="sub">' + days.length + ' day' + (days.length === 1 ? '' : 's') + '</span>';
    main.onclick = function () { TRAIN.progOpen = k; draw(); };
    withMenu(main, function (ev) { TRAIN.programMenu(k, ev); });
    row.appendChild(main);
    row.appendChild(rowMenuBtn('Options for ' + progs[k].name, function (ev) { TRAIN.programMenu(k, ev); }));
    list.appendChild(row);
  });
  m.appendChild(list);
}

/* Put every exercise of a routine day into today, ready to be filled in. */
TRAIN.startProgramDay = function (dayKey) {
  var items = TRAIN.exercisesOf(dayKey), date = TRAIN.date, order = [], made = 0;
  var have = {};
  TRAIN.setsOn(date).forEach(function (s) { have[s.ex] = 1; });
  items.forEach(function (it) {
    if (order.indexOf(it.x.ex) < 0) order.push(it.x.ex);
    if (have[it.x.ex]) return;
    made += writeFilled(it.x.ex, date, TRAIN.fillFor(it.x, date, true));
    have[it.x.ex] = 1;
  });
  var prior = TRAIN.dayGroups(date).map(function (g) { return g.ex; })
    .filter(function (x) { return order.indexOf(x) < 0; });
  TRAIN.patchSession(date, { order: prior.concat(order) });
  TRAIN.reindex();
  TRAIN.assertTick(date);
  Mobile.feedback('success');
  TRAIN.show('workout');
  UI.toast(items.length + ' exercises added');
};

function drawGoals(m) {
  var goals = Rec.map('goal'), exs = TRAIN.exercises();
  var keys = Object.keys(goals).sort(function (a, b) { return (goals[a].ord || 0) - (goals[b].ord || 0); });

  var add = UI.el('button', 'mb-btn mb-press mb-tap');
  add.style.width = '100%';
  add.textContent = 'ADD GOAL';
  add.onclick = function () { TRAIN.goalDialog(null); };
  m.appendChild(add);

  if (!keys.length) {
    var e = UI.el('div', 'empty'); e.textContent = 'No goal set'; m.appendChild(e);
    return;
  }
  keys.forEach(function (k) {
    var g = goals[k], ex = exs[g.ex], reps = g.r || 1;
    /* The best set at this many reps or more: a 100 for 5 goal is not met by
       a 100 single. The bar starts from that, which is what he has already
       lifted, and says so. */
    var bestKg = 0;
    if (ex) TRAIN.historyOf(g.ex).forEach(function (x) {
      if (!x.warm && (x.r || 0) >= reps && (x.kg || 0) > bestKg) bestKg = x.kg;
    });
    var pct = g.kg ? Math.max(0, Math.min(100, Math.round((bestKg / g.kg) * 100))) : 0;
    var card = UI.el('div', 'exblock');
    var head = UI.el('div', 'head mb-press mb-tap');
    head.innerHTML = '<span class="nm">' + UI.esc(g.title || (ex ? ex.name : 'Goal')) + '</span>' +
      '<span class="u">' + TRAIN.showWeight(g.kg, g.u) + ' ' + TRAIN.unitLabel() + ' × ' + reps + '</span>';
    head.onclick = function () { TRAIN.goalDialog(k); };
    withMenu(head, function (ev) { TRAIN.goalMenu(k, ev); });
    head.appendChild(rowMenuBtn('Options for this goal', function (ev) { TRAIN.goalMenu(k, ev); }));
    card.appendChild(head);
    var body = UI.el('div', 'pad');
    body.innerHTML = '<div class="track"><i style="width:' + pct + '%"></i></div>' +
      '<div class="sub">' + (bestKg
        ? 'Best at ' + reps + '+ reps: <b>' + TRAIN.showWeight(bestKg, null) + ' ' + TRAIN.unitLabel() + '</b> · ' + pct + '%'
        : 'No sets at ' + reps + '+ reps yet') +
      (g.to ? ' · by ' + UI.esc(Day.label(g.to)) : '') + '</div>';
    card.appendChild(body);
    m.appendChild(card);
  });
}
